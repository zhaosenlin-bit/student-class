# 乐启享课件库 · codebn.cn 完整配置
#
# 这是 codebn.cn 原来的配置原样保留，只在最后加上了课件库的三段转发。
# 用法：宝塔面板 → 网站 → codebn.cn → 配置文件 → 全选 → 粘贴下面全部内容
#       → 保存 → 重载。
#
# 不想动整份配置的话，只把 deploy/nginx-oss.conf 里的三段粘进去也行，
# 位置在 server { } 里面、location / { } 前后都行。
#
# 课件库本体在对象存储上，服务器上不放任何课件文件：
#   桶   teaching-platform-files
#   区域 oss-cn-hangzhou（杭州）
#   前缀 leqixiang/

server {
    listen 80;
    listen 443 ssl;
    http2 on;

    # 安全头加固
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    server_name codebn.cn;
    root /www/wwwroot/codebn.cn;
    index index.html index.htm default.html;
    charset utf-8;
    client_max_body_size 10m;

    include /www/server/panel/vhost/nginx/well-known/codebn.cn.conf;
    include /www/server/panel/vhost/nginx/extension/codebn.cn/*.conf;

    ssl_certificate     /www/server/panel/vhost/cert/codebn.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/codebn.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+CHACHA20-draft:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling off;

    set $isRedcert 1;
    if ($server_port != 443) { set $isRedcert 2; }
    if ($uri ~ /.well-known/) { set $isRedcert 1; }
    if ($isRedcert != 1) { rewrite ^(/.*)$ https://$host$1 permanent; }
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;

    include enable-php-80.conf;
    include /www/server/panel/vhost/rewrite/codebn.cn.conf;
    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~* (.user.ini|.htaccess|.htpasswd|.env.*|.project|.bashrc|.bash_profile|.bash_logout|.DS_Store|.gitignore|.gitattributes|LICENSE|README.md|CLAUDE.md|AGENTS.md|CHANGELOG.md|CHANGELOG|CONTRIBUTING.md|TODO.md|FAQ.md|composer.json|composer.lock|package(-lock)?.json|yarn.lock|pnpm-lock.yaml|.w+~|.swp|.swo|.bak(up)?|.old|.tmp|.temp|.log|.sql(.gz)?|docker-compose.yml|docker.env|Dockerfile|.csproj|.sln|Cargo.toml|Cargo.lock|go.mod|go.sum|phpunit.xml|pom.xml|build.gradle|pyproject.toml|requirements.txt|application(-w+)?.(ya?ml|properties))$ { return 404; }
    location ~* ^/(server-status|nginx-status|web.config)$ { return 404; }
    location ~* /(.git|.svn|.bzr|.vscode|.claude|.idea|.ssh|.github|.npm|.yarn|.pnpm|.cache|.husky|.turbo|.next|.nuxt|node_modules|runtime)/ { return 404; }
    location ~ .well-known{ allow all; }
    if ( $uri ~ "^/.well-known/.*.(php|jsp|py|js|css|lua|ts|go|zip|tar.gz|rar|7z|sql|bak)$" ) { return 403; }

    location = /courses { try_files /courses.html =404; }
    location = /competitions { try_files /competitions.html =404; }
    location = /courses/ { try_files /courses/index.html =404; }
    location = /competitions/ { try_files /competitions/index.html =404; }

    location ~* .html$ { expires -1; add_header Cache-Control "no-cache, max-age=0, must-revalidate" always; try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always; }
    location ~* .(css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf|mp4|webm)$ { expires 30d; add_header Cache-Control "public, max-age=2592000, immutable" always; try_files $uri =404; access_log off; log_not_found off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always; }

    # ================================================================
    # 乐启享课件库：https://codebn.cn/leqixiang/
    #
    # 课件库本体放在对象存储上，服务器只做转发，一个字节也不用放磁盘。
    # ================================================================

    # 少了最后一个斜杠的先补上，免得落到别的地址上去。
    location = /leqixiang {
        return 301 /leqixiang/;
    }

    # 目录页。对象存储没有目录首页，直接指到首页文件。
    location = /leqixiang/ {
        proxy_pass https://teaching-platform-files.oss-cn-hangzhou.aliyuncs.com/leqixiang/index.html;

        proxy_http_version 1.1;
        proxy_set_header Host teaching-platform-files.oss-cn-hangzhou.aliyuncs.com;
        proxy_ssl_server_name on;
        proxy_redirect off;

        # 这个桶开了「强制下载」，回来的每个对象都带着
        # Content-Disposition: attachment。浏览器会把它当成文件下载，
        # 而不是打开成网页——网页就白费了。这个头去掉，网页才是网页。
        # 课件自己的「下载」按钮不受影响：它是在浏览器里打包的。
        proxy_hide_header Content-Disposition;
        proxy_hide_header x-oss-force-download;
    }

    # 课件库本体。
    #
    # 这个 ^~ 不能去掉。
    # 官网的 server 段里有两条正则：
    #   location ~* .html$ { ... }
    #   location ~* .(css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf|mp4|webm)$ { ... }
    # 正则 location 的优先级比普通前缀 location 高，这两条会先把课件里的
    # 网页、脚本、样式、图片都抢走，转成在服务器磁盘上找——服务器上
    # 根本没有这些东西，于是全部 404。加上 ^~ 之后这一段不再走正则。
    #
    # proxy_pass 后面不带路径，浏览器发来的地址原样转给对象存储。
    # 课件里有中文、空格、表情符号的文件名，浏览器会把它们转义好再发过来；
    # 原样转过去，对象存储解开就正好对上。少了这一步，名字里的加号会被
    # 当成空格，文件就找不到了。
    location ^~ /leqixiang/ {
        proxy_pass https://teaching-platform-files.oss-cn-hangzhou.aliyuncs.com;

        proxy_http_version 1.1;
        proxy_set_header Host teaching-platform-files.oss-cn-hangzhou.aliyuncs.com;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_redirect off;

        # 目录清单有一兆多，样式表和脚本也不少，压一下再走。
        # gzip_proxied 必须打开：默认情况下，转发回来的东西不压。
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_min_length 1024;
        gzip_comp_level 5;
        gzip_types application/json text/javascript;

        # 同上：把「强制下载」的头摘掉，网页才能当网页打开。
        proxy_hide_header Content-Disposition;
        proxy_hide_header x-oss-force-download;

        # 缓存的规矩写在上传的时候（页面和清单改得勤，缓存短一点；素材和
        # 脚本不会变，缓存久一点）。转发的响应里带着这些头，不用再写一遍。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ================================================================
    # 课件库到这里结束，下面是官网原来的内容
    # ================================================================

    location /
    {
        try_files $uri $uri/ =404;
    }

    access_log /www/wwwlogs/codebn.cn.log;
    error_log  /www/wwwlogs/codebn.cn.error.log;
}
