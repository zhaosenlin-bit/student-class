<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 豆腐切割动画 · 彩色豆腐块</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel-bg: rgba(20, 20, 40, 0.92);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            background: var(--bg);
            overflow: hidden; height: 100vh; width: 100vw;
            user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; touch-action: manipulation;
        }
        #canvas-container { position: fixed; inset: 0; z-index: 1; cursor: grab; }
        #canvas-container:active, #canvas-container.grabbing { cursor: grabbing; }
        #canvas-container.knife-animating { cursor: default; }

        #info-panel {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: var(--panel-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 24px; padding: 12px 22px; box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            min-width: 200px; transition: 0.2s;
        }
        #block-count-row { display: flex; align-items: baseline; gap: 8px; }
        #block-count-label { color: #b0a89a; font-size: 14px; font-weight: 500; }
        #block-count-number { color: #fff; font-size: 34px; font-weight: 700; line-height: 1; min-width: 36px; text-align: center; transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #block-count-number.pulse { transform: scale(1.35); color: #ffcc80; text-shadow: 0 0 20px rgba(255, 180, 80, 0.7); }
        #block-count-unit { color: #b0a89a; font-size: 14px; font-weight: 500; }
        #cut-count-row { display: flex; gap: 10px; font-size: 13px; color: #cbc3b5; align-items: center; flex-wrap: wrap; justify-content: center; }
        .cut-badge { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 2px 10px; display: flex; gap: 4px; }
        .cut-badge span:first-child { color: #b0a080; }
        .cut-badge .val { color: #fff; font-weight: 700; }

        #control-panel {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: var(--panel-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 20px; padding: 16px 20px; box-shadow: var(--shadow);
            display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
            justify-content: center; border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 95vw; transition: 0.2s;
        }
        .btn {
            padding: 10px 16px; border-radius: 25px; border: none; cursor: pointer;
            font-size: 14px; font-weight: 600; letter-spacing: 0.4px;
            transition: all 0.2s ease; color: #fff; white-space: nowrap;
            font-family: inherit; display: flex; align-items: center; gap: 6px;
            outline: none; background: #444; position: relative; overflow: hidden;
        }
        .btn:active { transform: scale(0.94); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; pointer-events: none; }
        .btn::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(255,255,255,0.25) 0%, transparent 70%); opacity: 0; transition: opacity 0.3s; }
        .btn:hover:not(:disabled)::after { opacity: 1; }
        #btn-h-cut { background: #e8833a; }
        #btn-vx-cut { background: #d4594a; }
        #btn-vz-cut { background: #c94d6a; }
        #btn-transparent { background: #5a9e8f; }
        #btn-transparent.active { background: #3dd6b8; }
        #btn-reset { background: #6b7b8d; }
        #hint { position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%); z-index: 8; color: rgba(255,255,255,0.5); font-size: 12px; pointer-events: none; text-align: center; }

        @media (max-width: 600px) {
            #info-panel { padding: 10px 16px; top: 10px; min-width: auto; }
            #block-count-number { font-size: 26px; }
            #control-panel { padding: 12px 14px; gap: 7px; bottom: 12px; }
            .btn { padding: 8px 12px; font-size: 12px; }
        }
    </style>
</head>
