<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>右手螺旋定则 · 沉浸教学</title>
    <style>
        /* ----- 全局重置 & 暗色主题 ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #060b14;
            --bg-panel: #0d1b2a;
            --bg-panel-alt: #111d30;
            --border: #1a3050;
            --text: #d0d8e8;
            --text-dim: #7a8a9e;
            --accent: #00b4d8;
            --accent2: #ff6b35;
            --accent3: #4caf50;
            --accent4: #ffd166;
            --danger: #e63946;
            --panel-width: 290px;
            --header-h: 46px;
            --transition: 0.25s ease;
            --radius: 10px;
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
            background: var(--bg-deep);
            color: var(--text);
            font-family: var(--font);
        }

        /* ----- 全屏沉浸式布局 ----- */
        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
            background: var(--bg-deep);
        }

        #three-container {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* ----- 所有UI叠加层 ----- */
        .ui-overlay {
            position: absolute;
            pointer-events: none;
            z-index: 10;
        }

        .ui-overlay>* {
            pointer-events: auto;
        }

        /* ----- 步骤标题 (左上) ----- */
        .step-title {
            top: 20px;
            left: 24px;
            background: rgba(6, 11, 20, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 20px;
            max-width: 340px;
            border-left: 4px solid var(--accent);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        }

        .step-title h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .step-title p {
            font-size: 14px;
            color: var(--text-dim);
            line-height: 1.5;
            margin: 0;
        }

        .step-title .step-badge {
            display: inline-block;
            background: var(--accent);
            color: var(--bg-deep);
            font-size: 11px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }

        /* ----- 底部控制栏 ----- */
        .bottom-controls {
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: rgba(6, 11, 20, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 60px;
            padding: 10px 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
            pointer-events: auto;
        }

        .bottom-controls .btn {
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-panel-alt);
            color: var(--text);
            transition: all 0.2s;
            white-space: nowrap;
            font-family: var(--font);
            letter-spacing: 0.3px;
        }

        .bottom-controls .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(0, 180, 216, 0.08);
        }

        .bottom-controls .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-deep);
            font-weight: 600;
        }

        .bottom-controls .btn.primary:hover {
            background: #00c8ee;
            border-color: #00c8ee;
        }

        .bottom-controls .btn:active {
            transform: scale(0.96);
        }

        .bottom-controls .step-indicator {
            font-size: 13px;
            color: var(--text-dim);
            padding: 0 8px;
            min-width: 70px;
            text-align: center;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .bottom-controls .step-indicator span {
            color: var(--text);
            font-weight: 600;
        }

        .bottom-controls .btn.active-toggle {
            border-color: var(--accent2);
            color: var(--accent2);
            background: rgba(255, 107, 53, 0.15);
        }

        /* ----- 右上信息提示 ----- */
        .info-tip {
            top: 20px;
            right: 24px;
            background: rgba(13, 27, 42, 0.8);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 18px;
            max-width: 220px;
            text-align: right;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
            transition: opacity 0.3s;
        }

        .info-tip .label {
            font-size: 11px;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-tip .value {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent4);
            margin-top: 2px;
        }

        .info-tip .value .dir-arrow {
            display: inline-block;
            margin-left: 6px;
        }

        /* ----- 右下操作提示 (拖拽) ----- */
        .drag-hint {
            bottom: 100px;
            right: 24px;
            background: rgba(6, 11, 20, 0.6);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 12px;
            color: var(--text-dim);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0.7;
            pointer-events: none;
        }

        .drag-hint .icon {
            font-size: 18px;
        }

        /* ----- 响应式 (移动端适配) ----- */
        @media (max-width: 700px) {
            .step-title {
                top: 12px;
                left: 12px;
                right: 12px;
                max-width: none;
                padding: 10px 14px;
            }

            .step-title h2 {
                font-size: 16px;
            }

            .step-title p {
                font-size: 13px;
            }

            .bottom-controls {
                bottom: 16px;
                left: 12px;
                right: 12px;
                transform: none;
                border-radius: 30px;
                padding: 8px 12px;
                gap: 6px;
                flex-wrap: wrap;
                justify-content: center;
            }

            .bottom-controls .btn {
                font-size: 12px;
                padding: 6px 14px;
            }

            .bottom-controls .step-indicator {
                font-size: 12px;
                min-width: 50px;
                order: -1;
                width: 100%;
                text-align: center;
                margin-bottom: 2px;
            }

            .info-tip {
                top: auto;
                bottom: 90px;
                right: 12px;
                max-width: 160px;
                padding: 8px 12px;
            }

            .info-tip .value {
                font-size: 14px;
            }

            .drag-hint {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .step-title h2 {
                font-size: 14px;
            }
            .step-title p {
                font-size: 12px;
            }
            .bottom-controls .btn {
                font-size: 11px;
                padding: 5px 10px;
            }
        }

        /* ----- 过渡动画 ----- */
        .fade-in {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
