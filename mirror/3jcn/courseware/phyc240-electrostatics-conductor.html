	function createFinger() {
	    return new Promise((resolve, reject) => {
	        const loader = new OBJLoader();
	        loader.load(
	            '../models/finger/finger.obj',
	            function (object) {
	                object.position.set(0, 17, -10);
	                object.scale.set(0.5, 0.5, 0.5);
	                object.rotation.x = -Math.PI / 6;
	                const skinMaterial = new THREE.MeshPhongMaterial({ 
	                    color: 0xD2A679,
	                    shininess: 30
	                });
	                object.traverse((child) => {
	                    if (child.isMesh) {
	                        child.material = skinMaterial;
	                    }
	                });
	                scene.add(object);
			fingerArray.push(object);
	                resolve(object); // Resolve the promise with the loaded object
	            },
	            undefined,
	            (error) => reject(error) // Handle load errors
	        );
	    });
	}
	function createWand(x, y, z, colo) {

	    var wand = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({color: colo}));    
	    
	    // Rotate the disk 90 degrees around the x-axis to make it vertical
	    wand.rotation.x = Math.PI / 2;

	    const geot = new THREE.CylinderGeometry(0.3, 0.3, 15, 32); 
	    var handle = new THREE.Mesh(geot, new THREE.MeshPhongMaterial({color: "white"}));    
	    handle.rotation.x = Math.PI/2;
	    wand.add(handle);
	    handle.position.z = -9; 	    
	    wand.position.set(x, y, z);
	    scene.add(wand);
	    return wand;
	}

		    textMesh.position.set(x,y,z);   
		    scene.add(textMesh);
		});
	}
	function addLabel(t){
		fontloader.load("/api/program-assets/3jcn-phyc240-electrostatics-conductor/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json",function(tex){ 
		    var  textGeo = new TextGeometry(t, {
			    size: 1.2,  
			    height: 0.5, 
			    curveSegments: 6,
			    font: tex,
		    });
		    const textMaterial = new THREE.MeshBasicMaterial({ color: 'white' });
		    const textMesh = new THREE.Mesh(textGeo, textMaterial);
		    textMesh.position.set(-20,23,30);   
		    scene.add(textMesh);
		    textArray.push(textMesh);
		});
	}
	function animate() {
	    requestAnimationFrame(animate);
	    controls.update();
	    renderer.render(scene, camera);
	}
	function onWindowResize() {
		camera.aspect = window.innerWidth / window.innerHeight;
		camera.updateProjectionMatrix();
		renderer.setSize( window.innerWidth, window.innerHeight );
	}

</script>
