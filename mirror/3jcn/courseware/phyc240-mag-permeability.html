	<div id="info" style="text-align: left">

		<button class="btn btn-warning" onclick="alert('How to Measure Magnetic Permeability (μo):\n\n1. Set up the experiment as shown in the simulation with a solenoid.\n\n2. Gradually increase the current (I) through the solenoid by adjusting the slider.\n\n3. As you increase the current, the axial magnetic field (B) is measured at different points and plotted on a graph of B vs. I.\n\n4. The relationship between B and I is linear. The slope of this line is proportional to the permeability.\n\n5. Once you obtain the slope of the line, you can compute the permeability μo using the formula: μo = slope / n, where n=100 is the number of turns per unit length of the solenoid.\n\n6. Even though the value of magnetic permeability is very small, this simple setup allows us to measure its value with high accuracy.')">
		    How to Measure μo?
		</button>
