    import * as THREE from "../jsm/three.module.js";
    import { OrbitControls } from "../jsm/OrbitControls.js";

    let controls;
    let isRunning = false;
    let tOffset = 0;
    let lastTime = null;
    let animationId = null;

    let ironcore; const NTWISTS = 10;
    let resistorGroup = null; // NEW: procedural resistor

    // Canvas
    const canvas = document.getElementById("rlcCanvas");
    const ctx = canvas.getContext("2d");
    ctx.globalAlpha = 0.8;

    // DOM
    const freqSlider = document.getElementById("freqSlider");
    const resSlider  = document.getElementById("resSlider");
    const indSlider  = document.getElementById("indSlider");
    const capSlider  = document.getElementById("capSlider");

    const freqValue = document.getElementById("freqValue");
    const resValue  = document.getElementById("resValue");
    const indValue  = document.getElementById("indValue");
    const capValue  = document.getElementById("capValue");

    // Update labels (kept)
    [freqSlider, resSlider, indSlider, capSlider].forEach(slider => {
      slider.addEventListener("input", () => {
        freqValue.textContent = freqSlider.value;
        resValue.value = resSlider.value;
        indValue.value = indSlider.value;
        capValue.value = capSlider.value;
      });
    });

    const textureloader = new THREE.TextureLoader();
    const fontloader = new FontLoader();

    const scene = new THREE.Scene();
    let camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    // ------------------------- INIT -------------------------
    function initScene() {
      scene.background = new THREE.Color(0x87ceeb);

      camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 1000);
      camera.position.set(65, 37, 60);
      camera.lookAt(scene.position);
      scene.add(camera);

      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      document.getElementById("viewport").appendChild(renderer.domElement);

      controls = new OrbitControls(camera, renderer.domElement);

      setupLights();

      // ----- your wiring / parts (kept) -----
      addSphere(13.5, 3, -41);
      addSphere(-12.5, 3, -40);
      addWireZ(0.1, 29, 13.5, 3, -26.5);
      addLine(-12.5, 3, 0, -12.5, 3, -40);
      addLine(13.5, 3, -8, 13.5, 3, 3.4);
      addLine(13.5, 3, 3.4, 0, 3, 3.4);
      addLine(5, 3, 3, 0, 3, 3);
      addLine(5, 3, 3, 5, 3, 0);
      addLine(5, 3, 0, -12.5, 3, 0);

      addTitle(0, 6, -40, "L", 1.6, "black", 0);
      addTitle(-13, 6, -10, "R", 1.6, "black", Math.PI / 2);
      addTitle(18, -4, -10, "C", 1.6, "black", 0);
      addTitle(5, -7, 20, "Function Generator", 1.6, "purple", Math.PI / 2);

      // reference white line
      {
        const material = new THREE.LineBasicMaterial({ color: 0xffffff });
        const points = [new THREE.Vector3(-25, 3, -10), new THREE.Vector3(25, 3, -10)];
        const geometry = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(geometry, material);
        scene.add(line);
      }
      
		  createSpring(40,0,-20);
      // inductor core
      {
        const geom = new THREE.CylinderGeometry(2, 2, 30, 32);
        ironcore = new THREE.Mesh(geom, new THREE.MeshPhongMaterial({ color: "white" }));
        ironcore.position.set(0, 0, -40);
        ironcore.rotateZ(Math.PI / 2);
        scene.add(ironcore);
      }

      // ----------------- NEW: procedural resistor instead of addResistor() -----------------
      const R0 = Number(resSlider.value); // initial slider value
      resistorGroup = createResistor({
        bodyRadius: 1.0,      // similar thickness to your old resistor cylinder
        bodyLength: 5.0,      // similar length to your old resistor cylinder
        leadRadius: 0.12,
        leadLength: 2.0,
        bandThickness: 0.7,
        bandGap: 1.2,
        ohms: R0,             // IMPORTANT: drive bands from slider value
        tolerance: "gold"
      });

      // Place at the same location as your old addResistor(-12.5,3,-10)
      resistorGroup.position.set(-12.5, 3, -10);

      // Your old resistor was rotated X (axis along Z); our createResistor already aligns along Z.
      // If you want it rotated like the old look, keep as-is. Otherwise you can tweak:
      // resistorGroup.rotation.y = Math.PI / 2;

      // scale to visually match your old resistor size (adjust if needed)
      resistorGroup.scale.set(1.1, 1.1, 1.1);

      // shadows
      resistorGroup.traverse(o => {
        if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
      });

      scene.add(resistorGroup);

      // ----------------- capacitor (kept) -----------------
      {
        const capacitor_geometry = new THREE.CylinderGeometry(3, 3, 6, 32);
        const capacitor_material = new THREE.MeshPhongMaterial({
          map: textureloader.load("textures/Capacitor-Texture2.jpg")
        });
        const capacitor = new THREE.Mesh(capacitor_geometry, capacitor_material);
        capacitor.position.set(13.5, -3, -10);
        scene.add(capacitor);

        addWireY(0.1, 6, 13.5, 0, -12);
        addWireY(0.1, 6, 13.5, 0, -8);
      }

      addFunctionGenerator(0, 1, 10, Math.PI / 2);

      // Buttons
      document.getElementById("start").addEventListener("click", () => {
        const startButton = document.getElementById("start");
        if (!isRunning) {
          isRunning = true;
          startButton.textContent = "Pause";
          lastTime = null;
          animationId = requestAnimationFrame(drawGraph);
        } else {
          isRunning = false;
          startButton.textContent = "Show Graph";
          cancelAnimationFrame(animationId);
        }
      });

      document.getElementById("reset").addEventListener("click", () => {
        isRunning = false;
        cancelAnimationFrame(animationId);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        tOffset = 0;
        lastTime = null;
      });

      // ----------------- NEW: update resistor bands when slider changes -----------------
      resSlider.addEventListener("input", () => {
        resValue.value = resSlider.value;

        if (resistorGroup?.userData?.setOhms) {
          resistorGroup.userData.setOhms(Number(resSlider.value)); // <-- bands update here
        }
      });

      // keep your others (as you had)
      document.getElementById("capSlider").addEventListener("input", () => {
        document.getElementById("capValue").value = document.getElementById("capSlider").value;
      });
      document.getElementById("indSlider").addEventListener("input", () => {
        document.getElementById("indValue").value = document.getElementById("indSlider").value;
      });
      document.getElementById("voltageSlider").addEventListener("input", () => {
        document.getElementById("voltageValue").value = document.getElementById("voltageSlider").value;
      });

      window.addEventListener("resize", onWindowResize, false);
      requestAnimationFrame(render);
    }

    // ------------------------- GEOMETRY HELPERS -------------------------
		function createSpring( posX,posY,posZ) {   
			    var TWO_PI = Math.PI * 2.0;	    
			    var ANGLE_INCR = Math.PI / 12;  
	
			    var height = (-65 - posX);  
			    var cylX = (-70 - height * 0.5);  // spring's top
				
			    var y,z;
			    var x = height/2;
			    var radius = 3; 
			    var n = 0;
			    var xIncr = height / (TWO_PI / ANGLE_INCR * NTWISTS );
			    var helix = [];
			    var springMaterial = new THREE.MeshLambertMaterial({color: "brown"});  
	
			    for( var phi=0; phi <= TWO_PI*NTWISTS; phi+=ANGLE_INCR ) {
				y = posY + Math.cos(phi) * radius;
				x -= xIncr/4;
				z = posZ + Math.sin(phi) * radius;
				helix.push( new THREE.Vector3(x, y, z));
				n++;
			    }   
	
			    var curve = new THREE.CatmullRomCurve3( helix );
			    var geometry = new THREE.TubeGeometry( curve, n, 0.5, 36, false ); //0.2, 6
			    var springMesh = new THREE.Mesh(geometry, springMaterial);
			    springMesh.position.set(posX,posY,posZ); 
			   
			    scene.add( springMesh );
		} 
    function addLine(x1, y1, z1, x2, y2, z2) {
      const arr = [new THREE.Vector3(x1, y1, z1), new THREE.Vector3(x2, y2, z2)];
      const mat = new THREE.MeshLambertMaterial({ color: "black" });
      const curve = new THREE.CatmullRomCurve3(arr);
      const geometry = new THREE.TubeGeometry(curve, 100, 0.1, 36, false);
      const str = new THREE.Mesh(geometry, mat);
      scene.add(str);
    }

    function addWireY(r, l, x, y, z) {
      const geometry = new THREE.CylinderGeometry(r, r, l, 32);
      const material = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const wire = new THREE.Mesh(geometry, material);
      wire.position.set(x, y, z);
      scene.add(wire);
    }

    function addWireZ(r, l, x, y, z) {
      const geometry = new THREE.CylinderGeometry(r, r, l, 32);
      const material = new THREE.MeshBasicMaterial({ color: 0x000000 });
      const wire = new THREE.Mesh(geometry, material);
      wire.position.set(x, y, z);
      wire.rotateX(Math.PI / 2);
      scene.add(wire);
    }

    function addFunctionGenerator(x, y, z, alpha) {
      const width = 18, height = 10, depth = 7;
      const radius = 0.5, smoothness = 4;

      const geometry = new RoundedBoxGeometry(width, height, depth, smoothness, radius);
      const material = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.4, metalness: 0.1 });
      const box = new THREE.Mesh(geometry, material);
      box.castShadow = true;
      box.receiveShadow = true;

      const texture = textureloader.load("textures/function_generator.png");
      const volt_geometry = new THREE.BoxGeometry(width - 2, height - 2, 0.2);
      const volt_material = new THREE.MeshPhongMaterial({ map: texture });

      const screen = new THREE.Mesh(volt_geometry, volt_material);
      screen.position.set(0, 0, depth / 2 + 0.1);
      box.add(screen);

      box.position.set(x, y, z);
      box.rotation.y = alpha;

      scene.add(box);
    }

    // ------------------------- NEW PROCEDURAL RESISTOR -------------------------
    function createResistor({
      bodyRadius = 1.0,
      bodyLength = 5.0,
      leadRadius = 0.12,
      leadLength = 2.0,
      bandThickness = 0.7,
      bandGap = 1.2,
      ohms = 150,
      tolerance = "gold"
    } = {}) {
      const g = new THREE.Group();
      g.name = "resistorGroup";

      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xC8D9DC, metalness: 0.05, roughness: 0.7 });
      const leadMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.7, roughness: 0.35 });

      // body (axis along Z)
      const bodyGeo = new THREE.CylinderGeometry(bodyRadius, bodyRadius, bodyLength, 32);
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.rotation.x = Math.PI / 2;
      g.add(body);

      // leads
      const leadGeo = new THREE.CylinderGeometry(leadRadius, leadRadius, leadLength, 16);
      const leadL = new THREE.Mesh(leadGeo, leadMat);
      const leadR = new THREE.Mesh(leadGeo, leadMat);
      leadL.rotation.x = Math.PI / 2;
      leadR.rotation.x = Math.PI / 2;
      leadL.position.z = -(bodyLength / 2 + leadLength / 2);
      leadR.position.z = +(bodyLength / 2 + leadLength / 2);
      g.add(leadL, leadR);

      const DIGIT_COLOR = [
        0x000000, 0x8b4513, 0xff0000, 0xffa500, 0xffff00,
        0x00ff00, 0x0000ff, 0x8a2be2, 0x808080, 0xffffff
      ];
      const MULT_COLOR = {
        "-2": 0xc0c0c0, "-1": 0xffd700,
        "0": 0x000000, "1": 0x8b4513, "2": 0xff0000, "3": 0xffa500, "4": 0xffff00,
        "5": 0x00ff00, "6": 0x0000ff, "7": 0x8a2be2, "8": 0x808080, "9": 0xffffff
      };
      const TOL_COLOR = {
        gold: 0xffd700, silver: 0xc0c0c0, brown: 0x8b4513, red: 0xff0000,
        green: 0x00ff00, blue: 0x0000ff
      };

      function getBandsForOhms(R) {
        R = Math.max(1, Math.round(R));
        const exponent = Math.floor(Math.log10(R));
        const firstTwo = Math.round(R / Math.pow(10, exponent - 1));
        let d1 = Math.floor(firstTwo / 10);
        let d2 = firstTwo % 10;
        d1 = Math.min(Math.max(d1, 0), 9);
        d2 = Math.min(Math.max(d2, 0), 9);
        const multiplier = exponent - 1;
        return [d1, d2, multiplier, tolerance];
      }

      const bandR = bodyRadius * 1.05;
      const bandGeo = new THREE.CylinderGeometry(bandR, bandR, bandThickness, 32);

      function clearBands() {
        for (let i = g.children.length - 1; i >= 0; i--) {
          const obj = g.children[i];
          if (obj && obj.name === "band_") {
            g.remove(obj);
            obj.geometry?.dispose();
            if (Array.isArray(obj.material)) obj.material.forEach(m => m.dispose());
            else obj.material?.dispose();
          }
        }
      }

      function makeBand(color, zPos) {
        const bandMat = new THREE.MeshStandardMaterial({ color, metalness: 0.1, roughness: 0.6 });
        const band = new THREE.Mesh(bandGeo, bandMat);
        band.rotation.x = Math.PI / 2;
        band.position.z = zPos;
        band.name = "band_";
        g.add(band);
      }

      function setOhms(newOhms) {
        clearBands();
        const [d1, d2, mult, tol] = getBandsForOhms(newOhms);
        const colors = [
          DIGIT_COLOR[d1],
          DIGIT_COLOR[d2],
          MULT_COLOR[String(mult)] ?? 0x000000,
          TOL_COLOR[tol] ?? 0xffd700
        ];

        const z0 = -bodyLength / 2 + 0.8;
        const zs = [z0, z0 + bandGap, z0 + 2 * bandGap, bodyLength / 2 - 0.8];
        for (let i = 0; i < 4; i++) makeBand(colors[i], zs[i]);
      }

      setOhms(ohms);
      g.userData.setOhms = setOhms;

      return g;
    }

    // ------------------------- TEXT + CANVAS + LIGHTS -------------------------
    function addTitle(x, y, z, t, s, hex, theta) {
      fontloader.load("/api/program-assets/lab-phyc240-rlc-ac-series/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json", function (tex) {
        const textGeo = new TextGeometry(t, { size: s, height: s / 7, curveSegments: 6, font: tex });

        const titleMesh = new THREE.Mesh(textGeo, textMaterial);
        titleMesh.position.set(x, y, z);
        titleMesh.rotateY(theta);
        scene.add(titleMesh);
      });
    }

    function addSphere(x, y, z) {
      const ballGeom = new THREE.SphereGeometry(0.5, 32, 24);
      const ball = new THREE.Mesh(ballGeom, new THREE.MeshPhongMaterial({ color: "white" }));

    function setupLights() {
      const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
      directionalLight.position.set(10, 40, 20);
      scene.add(directionalLight);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);

    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ------------------------- GRAPH (kept) -------------------------
    function drawGraph(timestamp) {
      if (!isRunning) return;

      if (lastTime === null) lastTime = timestamp;
      const deltaTime = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      tOffset += deltaTime * 0.03;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const Vmax = parseFloat(document.getElementById("voltageSlider").value);
      const f = parseFloat(document.getElementById("freqSlider").value);
      const R = parseFloat(document.getElementById("resSlider").value);
      const L = parseFloat(document.getElementById("indSlider").value);
      const C = parseFloat(document.getElementById("capSlider").value) * 1e-6;

      const omega = 2 * Math.PI * f;
      const Xl = omega * L;
      const Xc = 1 / (omega * C);
      const Z = Math.sqrt(R * R + (Xl - Xc) ** 2);

      const Vr_phase = 0;
      const Vl_phase = Math.PI / 2;
      const Vc_phase = -Math.PI / 2;

      const Vr = t => Vmax * (R / Z) * Math.sin(omega * t + Vr_phase);
      const Vl = t => Vmax * (Xl / Z) * Math.sin(omega * t + Vl_phase);
      const Vc = t => Vmax * (Xc / Z) * Math.sin(omega * t + Vc_phase);

      const baseline = canvas.height / 2;
      const scaleY = 20;
      const period = 1 / f;
      const displayDuration = 1.0 * period;
      const xOffset = 40;
      const numPoints = canvas.width - xOffset - 10;

      // horizontal grid
      ctx.strokeStyle = "#ddd";
      ctx.lineWidth = 0.5;
      for (let v = -Vmax; v <= Vmax; v += Vmax / 2) {
        const y = baseline - v * scaleY;
        ctx.beginPath();
        ctx.moveTo(xOffset, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
        ctx.fillStyle = "black";
        ctx.font = "10px Arial";
        ctx.fillText(v.toFixed(1) + " V", 5, y + 3);
      }

      // vertical grid
      const numGrid = 5;
      const timeInterval = displayDuration / numGrid;
      const pixelSpacing = (canvas.width - xOffset - 20) / numGrid;
      ctx.strokeStyle = "#ccc";
      ctx.lineWidth = 0.5;
      ctx.font = "11px Arial";
      ctx.fillStyle = "black";

      for (let i = 0; i <= numGrid; i++) {
        const x = xOffset + i * pixelSpacing;
        const t = i * timeInterval + tOffset;
        const label = t.toFixed(3) + " s";
        ctx.beginPath();
        ctx.moveTo(x, 20);
        ctx.lineTo(x, canvas.height - 20);
        ctx.stroke();
        ctx.fillText(label, x - 18, baseline + 15);
      }

      // axes
      ctx.strokeStyle = "#444";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(xOffset, 20);
      ctx.lineTo(xOffset, canvas.height - 20);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(xOffset, baseline);
      ctx.lineTo(canvas.width, baseline);
      ctx.stroke();

      function plot(fn, color) {
        ctx.beginPath();
        ctx.strokeStyle = color;
        for (let i = 0; i < numPoints; i++) {
          const t = tOffset - (i / numPoints) * displayDuration;
          const y = baseline - fn(t) * scaleY;
          const x = i + xOffset;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }

      plot(Vr, "red");
      plot(Vl, "green");
      plot(Vc, "blue");

      ctx.font = "11px Arial";
      ctx.fillStyle = "red";   ctx.fillText("Vr (R)", xOffset + 5, 40);
      ctx.fillStyle = "green"; ctx.fillText("Vl (L)", xOffset + 5, 55);
      ctx.fillStyle = "blue";  ctx.fillText("Vc (C)", xOffset + 5, 70);

      animationId = requestAnimationFrame(drawGraph);
    }

    const render = () => {
		console.log('camera x', camera.position.x);
		console.log('camera y', camera.position.y);
		console.log('camera z', camera.position.z);
      controls.update();
      requestAnimationFrame(render);
      renderer.render(scene, camera);
    };

    window.onload = initScene;
  </script>
</head>

<body>
  <div id="info" style="text-align: left">
    <h1 style="text-align: center">RLC Series AC Circuit</h1>

   <div class="graph-panel">
      <div class="graph-title">Voltages vs Time</div>
    
      <!-- IMPORTANT: keep real pixel size for drawing quality -->
      <canvas id="rlcCanvas" width="400" height="250"></canvas>
    </div>

    <div class="control-panel">
      <div class="control-group">
        Frequency (Hz):<br>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 5px;">
          <input type="range" id="freqSlider" min="1" max="60" step="0.5" value="10">
          <span id="freqValue">10</span> Hz
        </div>
      </div>

      <div class="control-group">
        Resistor (Ω):
        <div class="slider-row" style="display: flex; align-items: center;">
          <input type="range" id="resSlider" min="20" max="300" step="1" value="150" style="flex: 1; margin-right: 8px;">
          <input type="text" id="resValue" value="150" readonly style="width: 80px; text-align: center; color: blue; font-weight: bold;">
        </div>
        <div class="minmax" style="display: flex; justify-content: space-between; margin-top: 4px;">
          <span>20</span><span>300</span>
        </div>
      </div>

      <div class="control-group">
        Capacitor (µF):
        <div class="slider-row">
          <input type="range" id="capSlider" min="100" max="500" step="10" value="200">
          <input type="text" id="capValue" value="200" readonly>
        </div>
        <div class="minmax"><span>100</span><span>500</span></div>
      </div>

      <div class="control-group">
        Inductor (H):
        <div class="slider-row">
          <input type="range" id="indSlider" min="0.1" max="4" step="0.1" value="1.5">
          <input type="text" id="indValue" value="1.5" readonly>
        </div>
        <div class="minmax"><span>0.1</span><span>6</span></div>
      </div>

      <div class="control-group">
        Voltage Amplitude (V):
        <div class="slider-row">
          <input type="range" id="voltageSlider" min="0.4" max="5" step="0.2" value="3">
          <input type="text" id="voltageValue" value="3" readonly>
        </div>
        <div class="minmax"><span>0</span><span>5</span></div>
      </div>

      <button class="btn btn-danger" id="start">Show Graph</button><br>
      <button class="btn btn-success" id="reset">Reset</button>
      
    </div>
  </div>

  <div id="viewport"></div>
</body>
</html>
