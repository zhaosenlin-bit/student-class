    <div id="info" style="text-align: center">
      	  <h1 style="text-align: center">THE SPRING BLOCK SYSTEM</h1>     
      	 <button class="btn btn-warning" onclick="alert('Simple Harmonic Motion (SHM) is a type of periodic motion where an object oscillates back and forth around an equilibrium position. In SHM, the restoring force is directly proportional to the displacement and acts in the direction opposite to the displacement. The motion follows a sine or cosine wave pattern.\n\nFor a mass-spring system, the formula for SHM is:\n\nF = -kx\n\nWhere:\nF is the restoring force,\nk is the spring constant (N/m),\nx is the displacement from equilibrium (m).\n\nThe period of oscillation (T) is the time taken for one complete cycle of motion and is given by the formula:\n\nT = 2π√(m/k)\n\nWhere:\nT is the period (seconds),\nm is the mass (kg),\nk is the spring constant (N/m).')">
	    What is Simple Harmonic Motion?
	</button>
      
      	   <button type="button" class="btn btn-primary" id="start">Start</button>
