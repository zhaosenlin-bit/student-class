	<style>
/* This page was created on December 16, 2023 as a basis for most pages on this site  It is located in Physics Folder */

/* Properties of all the things are are general for the page */

body{
	background-color: #FFFFFF;
	margin:0px 0px; padding:0px;
	text-align:center;
}

/* Stuff for Navigation Menu */
#MainNav{
	position: relative;
	margin-top: 15px;
	left: 10px;
	width: 1000px;
	height: 20px;
	text-align: center;
}

.NavLink{
	display: inline-block;
	font-size: 18px;
	color: #990000;
	font-family: Georgia, "Times New Roman", Times, serif;
	text-align: center;
	text-decoration: none;
	width: 75px;
}

/* Properties of the buttons to be used on page */

.Button{
	height: 45px;
	padding-top: 5px;
	background-color: #c0c0c0;
	border: 2px #990000 solid;
	border-radius: 10px;
	text-align: center;
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:28px;
	color:#990000;
}

.ButtonLittleText{
	height: 40px;
	padding-top: 10px;
	background-color: #c0c0c0;
	border: 2px #990000 solid;
	border-radius: 10px;
	text-align: center;
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:22px;
	color:#990000;
}

.TallButton{
	height: 65px;
	padding-top: 10px;
	background-color: #c0c0c0;
	border: 2px #990000 solid;
	border-radius: 10px;
	text-align: center;
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:22px;
	color:#990000;
}

.DarkButton{
	height: 45px;
	padding-top: 5px;
	background-color: #000000;
	border: 2px #C0C0C0 solid;
	border-radius: 10px;
	text-align: center;
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:28px;
	color:#C0C0C0;
}

.MiniButton{
	height: 25px;
	padding-top: 5px;
	background-color: #c0c0c0;
	border: 2px #990000 solid;
	border-radius: 5px;
	text-align: center;
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:14px;
	color:#990000;
}

.InvisibleButton{

}

/* Properties of the main fonts to be used on page */

.Titles{
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:28px;
	color:#990000;
	text-align: center;
}

.Directions{
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:22px;
	color:#000000;
	text-align: center;
}

.LittleDirections{
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:18px;
	color:#990000;
	text-align: center;
}

/* Mainly used for labs for white text */

.LargeWhiteText{
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:28px;
	color:#FFFFFF;
	text-align: center;
}

/* Properties of the FullPage Div that holds everything in your webpage */

#FullPage {
	position: relative;
	width:1024px;
	padding-bottom: 50px;
	margin:0px auto; /* Right and left margin widths set to "auto" */
}

/* Properties of the MainBody Div that holds everything in your webpage */

#MainBody{
	position: relative;
	top: 0px;
}

/* Properties of the Program Title Div that holds title of your webpage */

#ProgramTitle{
	position: relative;
	margin-top: 15px;
	width: 1024px;
	height: 35px;
	text-align: center;
}


/*  ************************************* */

/*  This section is for the splash screen or the directions that occur before the program is actually started */

/* Properties of the Overview Section Div that holds the introductory information for your program */

#OverviewSection{
	position: absolute;
	top: 50px;
	left: 50px;
	width: 925px;
	height: 600px;
	border: black;
	border-style: dashed;
	border-width: 5px;
	display: block;
}

#LabDirections{
	position: absolute;
	top: 25px;
	left: 50px;
	width: 800px;
}


#PersonName{
	position: absolute;
	top: 250px;
	left: 25px;
	width: 850px;
	text-align: center;
}

.NameInput{
	position: relative;
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:18px;
	color:#990000;
	width: 250px;
	left: 0px;
	height: 25px;
	text-align: center;
	margin-bottom: 25px;
	border: black;
	border-style: solid;
	border-width: 2px;
}

#OverviewPicture{
	position: absolute;
	top: 375px;
	left: 300px;
	width: 300px;
	height: 200px;
	border: black;
	border-style: solid;
	border-width: 2px;
}

#BeginButton{
	position: absolute;
	top: 300px;
	left: 375px;
	width: 150px;
}

#AvailableLanguages{
	position: absolute;
	top: 375px;

	height: 100px;
}

#LanguageTitle{
	position: absolute;
	top: 0px;
	left: 0px;
	width: 250px;
	height: 25px;
}

#LanguageDropDown{
	position: absolute;
	top: 40px;
	left: 0px;
	width: 250px;
	height: 25px;
	display: none;
}

/*  ************************************* */

/* This is the section that contains all the stuff that is part of the actual running program */

/* This ID is for entire area of the program that will display as part of the simulation */

#LabSection{
	position: absolute;
	top: 50px;
	left: 0px;
	display: none;
}

/* This ID is for part of the program that will hold the Canvas with all the drawings and animations. */

#DrawingSectionOne{
	position: absolute;
	top: 0px;
	width: 925px;
	left: 50px;
	height: 600px;
	border: black;
	border-style: dashed;
	border-width: 5px;
}

#DrawingSectionTwo{
	position: absolute;
	top: 625px;
	width: 925px;
	left: 50px;
	height: 602px;
	border: black;
	border-style: dashed;
	border-width: 5px;
}

/*  ************************************* */

/*  This section is for the Information about a Single Program */

#BottomPart{
	position: relative;
	margin-top: 15px;
	left: 0px;
	width: 1024px;
}

#BottomPartWTopBox{
	position: relative;
	margin-top: 15px;
	left: 0px;
	width: 1030px;
	border-top: 3px solid #000000;
}


#PageDescriptionText{
	position: relative;
	margin-top: 15px;
	padding-left: 25px;
	padding-right: 25px;
	left: 0px;
	width: 950px;
}

#ProgramHolderBig{
	position: relative;
	top: 0px;
	left: 0px;
	width: 974px;
	display: block;
	margin: 0 auto;
	padding: 25px;
	border: 3px solid #000000;
}

#ProgramPictureBig{
	position: relative;
	margin-top: 15px;
	left: 335px;
	width: 300px;
	height: 200px;
	border: black;
	border-style: solid;
	border-width: 2px;
}

#DescriptionOfProgram{
	position: relative;
	margin-top: 25px;
}

#ResourceTitle{
	position: relative;
	margin-top: 25px;
}

#ResourceList{
	position: relative;
	margin-top: 15px;
	left: 250px;
	width: 500px;
	text-align: left;
}

#ResourceList li {
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:16px;
	height: 35px;
}

/* Stuff for list of many programs like what's new page */

.ProgramHolder{
	position: relative;
	top: 0px;
	padding-bottom: 25px;
	left: 0px;
	width: 1024px;
	height: 125px;
	border-bottom: 3px solid #000000;
	border-right: 3px solid #000000;
	border-left: 3px solid #000000;
}

.ProgramLeft{
	position: absolute;
	top: 0px;
	left: 0px;
	height: 150px;

	border-right: 3px solid #000000;
}

.ProgramRight{
	position: absolute;
	top: 0px;

}

.ProgramTitle{
	position: absolute;

	font-family:Georgia, "Times New Roman", Times, serif;

}


.ProgramPicture{
	position: absolute;
	top: 25px;
	left: 10px;
	width: 150px;
	height: 100px;

}

.minipicture{
	height: 100px;

}



.ProgramModify{
	position: absolute;
	top: 110px;
	left: 160px;

	height: 40px;
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:16px;
	color:#000099;
	text-align: center;
}

</style>

// Easy writing on the canvas (x, y are position; t is text, s is size, c is color, m is how it modifies 0 for left, 0.5 for center, and 1 for right)

function WriteText(x, y, t, s, c, m){
	ctx.fillStyle = c;
	ctx.font= s + "px Arial";
	temptext = t;
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x - m*textWidth;
	ctx.fillText(temptext,xposition, y);
}

function WriteText2(x, y, t, s, c, m){
	ctx2.fillStyle = c;
	ctx2.font= s + "px Arial";
	temptext = t;
	metrics = ctx2.measureText(temptext);
	textWidth = metrics.width;
	xposition = x - m*textWidth;
	ctx2.fillText(temptext,xposition, y);
}

// Easy writing on the canvas (x, y are position; t is text, s is size, c is color, m is how it modifies 0 for left, 0.5 for center, and 1 for right, f is for font)

function WriteTextWFont(x, y, t, s, c, m, f){
	ctx.fillStyle = c;
	ctx.font= s + "px " + f;
	temptext = t;
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x - m*textWidth;
	ctx.fillText(temptext,xposition, y);
}

// Drawing Straight line between two points.

function DrawLine(xi, yi, xf, yf, lt, lc){
	ctx.strokeStyle = lc;
	ctx.lineWidth = lt;
	ctx.beginPath();
	ctx.moveTo(xi, yi);
	ctx.lineTo(xf, yf);
	ctx.stroke();
}

// Shapes

function DrawRectangle(xrect, yrect, wrect, hrect, curverectangle, lcolor, fcolor, lwid){
	ctx.fillStyle = fcolor;
	ctx.strokeStyle = lcolor;
	ctx.lineWidth = lwid;
	ctx.beginPath();
	ctx.moveTo(xrect+curverectangle, yrect);
	ctx.lineTo(xrect+wrect-curverectangle, yrect);
	ctx.arc(xrect+wrect-curverectangle, yrect+curverectangle, curverectangle, 1.5*Math.PI, 0*Math.PI, false);
	ctx.lineTo(xrect+wrect, yrect+hrect-curverectangle);
	ctx.arc(xrect+wrect-curverectangle, yrect+hrect-curverectangle, curverectangle, 0.0*Math.PI, 0.5*Math.PI, false);
	ctx.lineTo(xrect+curverectangle, yrect+hrect);
	ctx.arc(xrect+curverectangle, yrect+hrect-curverectangle, curverectangle, 0.5*Math.PI, 1.0*Math.PI, false);
	ctx.lineTo(xrect, yrect+curverectangle);
	ctx.arc(xrect+curverectangle, yrect+curverectangle, curverectangle, 1.0*Math.PI, 1.5*Math.PI, false);
	ctx.closePath();
	ctx.fill();
	ctx.stroke();
}

//  Draw a compass Rose, x, y is the center of the rose, r is the radius of the rose, alph is the transparency, b is the buffer for the arrows

function CompassRose(x, y, r, alph, b, ts){
	ctx.globalAlpha = alph;
	as = b;
	ctx.lineWidth = 2;
	ctx.strokeStyle = "#000000";
	ctx.beginPath();
	ctx.moveTo(x,y);
	ctx.lineTo(x+r, y);
	ctx.moveTo(x+r, y);
	ctx.lineTo(x+r-as, y+as);
	ctx.moveTo(x+r, y);
	ctx.lineTo(x+r-as, y-as);
	ctx.moveTo(x,y);
	ctx.lineTo(x-r, y);
	ctx.moveTo(x-r, y);
	ctx.lineTo(x-r+as, y+as);
	ctx.moveTo(x-r, y);
	ctx.lineTo(x-r+as, y-as);

	ctx.moveTo(x,y);
	ctx.lineTo(x, y+r);
	ctx.moveTo(x, y+r);
	ctx.lineTo(x+as, y+r-as);
	ctx.moveTo(x, y+r);
	ctx.lineTo(x-as, y+r-as);
	ctx.moveTo(x,y);
	ctx.lineTo(x, y-r);
	ctx.moveTo(x, y-r);
	ctx.lineTo(x+as, y-r+as);
	ctx.moveTo(x, y-r);
	ctx.lineTo(x-as, y-r+as);
	ctx.stroke();

	WriteText(x+r+10, y+5, "0°", ts, "#000000", 0);
	WriteText(x-40, y - r + 10, "90°", ts, "#000000", 0);
	WriteText(x - r - 10, y+5, "180°", ts, "#000000", 1.0);
	WriteText(x + 15, y + r + 10, "270°", ts, "#000000", 0.0);

	ctx.globalAlpha = 1.0;
}


//Electrical Components

// Draw Current (x, y are the center of the arrow, t is text to put above arrow, ts is text size, c is the color of the arrow, l is length of arrow, tn is thickness of arrow, b is the buffer of arrow, a is the angle of the arrow 0 is pointing right)

function DrawCurrent(x, y, t, ts, c, l, lw, b, a){
	angrad = a*Math.PI/180;
	ctx.strokeStyle = c;
	ctx.lineWidth = lw;
	ctx.save();
	ctx.translate(x,y);
	ctx.rotate(angrad);
	ctx.beginPath();
	ctx.moveTo(0 - 0.5*l, 0);
	ctx.lineTo(0 + 0.5*l, 0);
	ctx.moveTo(0 + 0.5*l - b, 0 - 0.5*b);
	ctx.lineTo(0 + 0.5*l, 0);
	ctx.lineTo(0 + 0.5*l - b, 0 + 0.5*b);
	ctx.stroke();
	WriteText(0 - 0.5*l, 0 - 1.0*b, t, ts, c, 0.0);
	ctx.restore();
}

// Draw Current (x, y are the center of the arrow, t is text to put above arrow, ts is text size, c is the color of the arrow, l is length of arrow, tn is thickness of arrow, b is the buffer of arrow, a is the angle of the arrow 0 is pointing right)

function DrawCurrentLeft(x, y, t, ts, c, l, lw, b, a){
	angrad = a*Math.PI/180;
	ctx.strokeStyle = c;
	ctx.lineWidth = lw;
	ctx.save();
	ctx.translate(x,y);
	ctx.rotate(angrad);
	ctx.beginPath();
	ctx.moveTo(0 + 0.5*l, 0);
	ctx.lineTo(0 - 0.5*l, 0);
	ctx.moveTo(0 - 0.5*l + b, 0 - 0.5*b);
	ctx.lineTo(0 - 0.5*l, 0);
	ctx.lineTo(0 - 0.5*l + b, 0 + 0.5*b);
	ctx.stroke();
	ctx.restore();
	WriteText(x + 0.5*l, y - 1.0*b, t, ts, c, 1.0);
}

// Draw Wires (x0, y0 is position at start, x1, y1 is position at end, c is color of wire, and lw is width)

function DrawWire(x0, y0, x1, y1, c, lw){
	ctx.lineCap="round";
	ctx.strokeStyle = c;
	ctx.lineWidth = lw;
	ctx.beginPath();
	ctx.moveTo(x0, y0);
	ctx.lineTo(x1, y1);
	ctx.stroke();
	ctx.closePath();
}

// Draw Battery (x, y is position, t1, t2 is text, w is width, c is color, lw is line width, a is angle, and cf is current flow)

function DrawACPowerSupply(x, y, t1, t2, w, c, lw, a){
	h = 0.25*w;
	ps = w/100;
	ctx.strokeStyle = c;
	ctx.fillStyle = "#FFFFFF";
	ctx.lineWidth = 4*ps;
	ctx.beginPath();
	ctx.arc(x+50*ps, y, 40*ps, 0, 2*Math.PI);
	ctx.stroke();
	ctx.closePath();

	ctx.beginPath();
	ctx.moveTo(x, y);
	ctx.lineTo(x+10*ps, y);
	ctx.stroke();
	ctx.closePath();
	ctx.beginPath();
	ctx.moveTo(x+20*ps, y);
	ctx.bezierCurveTo(x+30*ps, y-h, x+40*ps, y-h, x+50*ps, y);
	ctx.bezierCurveTo(x+60*ps, y+h, x+70*ps, y+h, x+80*ps, y);
	ctx.stroke();
	ctx.closePath();
	ctx.beginPath();
	ctx.moveTo(x+90*ps, y);
	ctx.lineTo(x+100*ps, y);
	ctx.stroke();
	ctx.closePath();

	WriteText(x+50*ps,y-2.0*h,t1.toFixed(3) + " V", 20*ps,"#990000",0.5);
	WriteText(x+0.5*w,y+.65*w,t2.toFixed(0) + " Hz", 20*ps,"#000000",0.5);
}

// Draw Battery (x, y is position, t is text, w is width, c is color, lw is line width, a is angle, and cf is current flow)

function DrawBattery(x, y, t, c, w, lw, a, cf){
	angrad = a*Math.PI/180;
	h = 0.15*w;
	bs = w/100;
	ctx.strokeStyle = c;
	ctx.lineWidth = lw;
	ctx.save();
	ctx.translate(x,y);
	ctx.rotate(angrad);
	ctx.beginPath();
	ctx.moveTo(0, 0);
	ctx.lineTo(0 + 40*bs, 0);
	if (cf == "electron"){
		ctx.moveTo(0 + 40*bs, 0 - h);
		ctx.lineTo(0 + 40*bs, 0 + h);
		ctx.moveTo(0 + 60*bs, 0 - 2*h);
		ctx.lineTo(0 + 60*bs, 0 + 2*h);
	}
	else{
		ctx.moveTo(0 + 60*bs, 0 - h);
		ctx.lineTo(0 + 60*bs, 0 + h);
		ctx.moveTo(0 + 40*bs, 0 - 2*h);
		ctx.lineTo(0 + 40*bs, 0 + 2*h);
	}
	ctx.moveTo(0 + 60*bs, 0);
	ctx.lineTo(0 + 100*bs, 0);
	ctx.stroke();
	ctx.closePath();

	WriteText(0 + 50*bs, 0 + 4*h, t + " V", 20*bs, c, 0.5);
	ctx.restore();
}

// Draw Resistor (x, y is position, t is text, w is width, c is color, lw is line width, a is angle, and n is resistor number)

function DrawResistor(x, y, t, w, c, lw, a, n){
	h = 0.15*w;
	rs = w/100;
	ctx.strokeStyle = c;
	ctx.lineWidth = lw;
	ctx.save();
	ctx.translate(x,y);
	ctx.beginPath();
	ctx.moveTo(0, 0);
	ctx.lineTo(0 + 15*rs, 0);
	ctx.lineTo(0 + 20*rs, 0 - h);
	ctx.lineTo(0 + 30*rs, 0 + h);
	ctx.lineTo(0 + 40*rs, 0 - h);
	ctx.lineTo(0 + 50*rs, 0 + h);
	ctx.lineTo(0 + 60*rs, 0 - h);
	ctx.lineTo(0 + 70*rs, 0 + h);
	ctx.lineTo(0 + 80*rs, 0 - h);
	ctx.lineTo(0 + 85*rs, 0);
	ctx.lineTo(0 + 100*rs, 0);
	ctx.stroke();
	ctx.closePath();

	if (isNaN(t)){
		WriteText(0 + 50*rs, 0 + 3*h, t, 20*rs, c, 0.5);
	}
	else{
		WriteText(0 + 50*rs, 0 + 3*h, t + " Ω", 20*rs, c, 0.5);
	}
	if (n != 0){
		WriteText(0 + 10*rs, 0 - 0.5*h, n, 12*rs, c, 1.0);
	}
	ctx.restore();
}

// Draw Capacitor (x, y is position, t is text, w is width, c is color, lw is line width, a is angle, and n is resistor number)

function DrawCapacitor(x, y, t, w, c, lw, a, n){
	h = 0.15*w;
	cs = w/100;
	ctx.strokeStyle = c;
	ctx.lineWidth = lw;
	ctx.save();
	ctx.translate(x,y);
	ctx.beginPath();
	ctx.moveTo(0, 0);
	ctx.lineTo(0 + 40*cs, 0);
	ctx.moveTo(0 + 40*cs, 0 - 2*h);
	ctx.lineTo(0 + 40*cs, 0 + 2*h);
	ctx.moveTo(0 + 60*cs, 0 - 2*h);
	ctx.lineTo(0 + 60*cs, 0 + 2*h);
	ctx.moveTo(0 + 60*cs, 0);
	ctx.lineTo(0 + 100*cs, 0);
	ctx.stroke();
	ctx.closePath();

	if (t == "C"){
		WriteText(0 + 50*cs, 0 + 4*h, t, 20*cs, c, 0.5);
	}
	else{
		WriteText(0 + 50*cs, 0 + 4*h, t + " µF", 20*cs, c, 0.5);
	}
	if (n != 0){
		WriteText(0 + 20*cs, 0 - 0.5*h, n, 12*cs, c, 1.0);
	}
	ctx.restore();
}

// Draw Inductor (x, y is position, t is text, w is width, c is color, lw is line width, a is angle, and n is inductor number)

function DrawInductor(x, y, t, w, c, lw, a, n){
	h = 0.15*w;
	ss = w/100;
	ctx.strokeStyle = c;
	ctx.lineWidth = 4*ss;
	ctx.beginPath();
	ctx.moveTo(x, y);

	ctx.bezierCurveTo(x+70*ss, y-h, x+90*ss, y-h, x+90*ss, y);
	ctx.lineTo(x+100*ss, y);
	ctx.stroke();
	ctx.closePath();

	if (t == "L"){
		WriteText(x + 50*ss, y + 2*h, t, 20*ss, c, 0.5);
	}
	else{
		WriteText(x + 50*ss, y + 2*h, t + " mH", 20*ss, c, 0.5);
	}
	if (n != 0){
		WriteText(x + 20*ss, y - 0.5*h, n, 12*ss, c, 1.0);

// Draw Meters for analog measurement (x,y) location, w is width or size, h is height, s is value to display, maxs is maximum value, n is name, u is unit, l is number of lines, dp is decimalplaces, fs is fontsize, c is color of bar

function DrawBarMeter(x, y, w, h, s, maxs, n, u, l, dp, fs, c){
	TopOfBar = 200;
	DrawRectangle(x, y, w, h, 0, "#000000", "#FFFFFF", 1);
	PercentMove = s/maxs;
	DrawRectangle(x, y, PercentMove*w, h, 0, c, c, 0);
	ctx.strokeStyle = "#000000";
	WriteText(x + 0.5*w, y-20, n + " (" + u + ")", fs, "#000000", 0.5);
	xgap = w/l;
	for (i = 0; i <= l; i++){
		if (i%5){
			linestart = y-10;
			linelength = 10;
		}
		else{
			linelength = 30;
			linestart = y;
		}
		DrawLine(x + i*xgap, y, x + i*xgap, y + linelength);
		if (i%10 == 0){
			numbertodisplay = i/10;
			WriteText(x + i*xgap, y+45, numbertodisplay.toFixed(0), fs, "#990000", 0.5);
		}
	}
}

// Draw Meters for analog measurement (x,y) location, w is width or size, s is speed, maxs is maximum speed, n is name, u is unit, l is number of lines, dp is decimalplaces, fs is fontsize

function DrawShowMeter(x, y, w, s, maxs, n, u, l, dp, fs, silly = ""){
	h = 0.8*w;
	MaxDisplayTime = maxs;
	TimeIncrements = MaxDisplayTime/l;
	if (s <= MaxDisplayTime){
		NeedlePercent = s/MaxDisplayTime;
	}
	else{
		NeedlePercent = 1;
	}

	LargeFontSize = 1.5*fs;
	SmallFontSize = 1*fs;

	needleanglerotate = 7*Math.PI/10 + NeedlePercent*1.6*Math.PI;

	radiusofmeter = 0.40*w;
	//body
	DrawRectangle(x, y, w, w, 20, "#FFFFFF", "#555555", 3);

	//circle for face
	ctx.fillStyle = "#666666";
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.arc(x+0.5*w, y+0.5*w,1.05*radiusofmeter, 0, 2*Math.PI);
	ctx.stroke();
	ctx.fill();

	WriteText(x+0.5*w,y+0.41*w,n,LargeFontSize,"#DDDDDD",0.5);
	WriteText(x+0.5*w,y+0.65*w,u,LargeFontSize,"#DDDDDD",0.5);
	WriteText(x+0.5*w,y+0.85*w,silly,SmallFontSize,"#82f3ff",0.5);


	//needle center
	ctx.fillStyle = "#000000";
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 1;
	ctx.beginPath();
	ctx.arc(x+0.5*w, y+0.5*w,4, 0, 2*Math.PI);
	ctx.stroke();
	ctx.fill();

	//Markings and Numbers
	for (i = 0; i <= l; i++){
		anglerotate = 7*Math.PI/10+i*(64/l)*Math.PI/40;
		ctx.save();
		ctx.translate(x+0.5*w, y+0.5*w);
		ctx.rotate(anglerotate);
		ctx.beginPath();
		if (i%10 == 0){
			ctx.strokeStyle = "#FFFFFF";
			ctx.lineWidth = 2;
			starttickmark = 0.80*radiusofmeter;
			endtickmark = 1.05*radiusofmeter;
		}
		else if (i%5 == 0){
			ctx.strokeStyle = "#FFFFFF";
			ctx.lineWidth = 1.5;
			starttickmark = 0.85*radiusofmeter;
			endtickmark = 1.02*radiusofmeter;
		}
		else{
			ctx.strokeStyle = "#FFFFFF";
			ctx.lineWidth = 1;
			starttickmark = 0.9*radiusofmeter;
			endtickmark = 1.0*radiusofmeter;
		}
		ctx.moveTo(starttickmark, 0);
		ctx.lineTo(endtickmark, 0);
		ctx.stroke();
		if (i%10 == 0){
			temptext = i*TimeIncrements;
			ctx.save();
			ctx.translate(0.65*radiusofmeter, 0);
			ctx.rotate(-1.0*anglerotate);
			WriteText(0, 0,temptext.toFixed(dp),SmallFontSize,"#FFFFFF",0.5);
			ctx.restore();
		}

		ctx.restore();
	}

	ctx.strokeStyle = "#FF0000";
	ctx.lineWidth = 1;
	ctx.save();
	ctx.translate(x+0.5*w, y+0.5*w);
	ctx.rotate(needleanglerotate);
	ctx.beginPath();
	ctx.moveTo(0, 0);
	ctx.lineTo(1.0*radiusofmeter, 0);

	ctx.stroke();
	ctx.restore();
}

	ctx.fillStyle = fc;
	ctx.save();
	ctx.translate(x, y);
	ctx.rotate(arad);
	ctx.beginPath();
	ctx.moveTo(0, 0 - 0.5*h);
	ctx.lineTo(0 + 0.5*w, 0 - 0.1667*h);

	ctx.lineTo(0, 0 - 0.5*h);
	ctx.closePath();
	ctx.stroke();
	ctx.fill();
	ctx.restore();
}

function DrawGhostShowMeter(x, y, w, s, maxs, n, u, l, dp, fs, silly = ""){
	h = 0.8*w;
	MaxDisplayTime = maxs;
	TimeIncrements = MaxDisplayTime/l;

		NeedlePercent = s/MaxDisplayTime;
	}
	else{
		NeedlePercent = 1;
	}

	LargeFontSize = 1.5*fs;
	SmallFontSize = 1*fs;

	needleanglerotate = 7*Math.PI/10 + NeedlePercent*1.6*Math.PI;

	radiusofmeter = 0.40*w;
	//body
	DrawRectangle(x, y, w, w, 20, "#FFFFFF", "#EEEEEE", 3);

	ctx.fillStyle = "#EEEEEE";
	ctx.strokeStyle = "#000000";

	ctx.beginPath();
	ctx.arc(x+0.5*w, y+0.5*w,4, 0, 2*Math.PI);
	ctx.stroke();
	ctx.fill();

	//Markings and Numbers
	for (i = 0; i <= l; i++){
		anglerotate = 7*Math.PI/10+i*(64/l)*Math.PI/40;
		ctx.save();
		ctx.translate(x+0.5*w, y+0.5*w);
		ctx.rotate(anglerotate);
		ctx.beginPath();
		if (i%10 == 0){
			ctx.strokeStyle = "#000000";
			ctx.lineWidth = 2;
			starttickmark = 0.80*radiusofmeter;
			endtickmark = 1.05*radiusofmeter;
		}
		else if (i%5 == 0){
			ctx.strokeStyle = "#000000";
			ctx.lineWidth = 1.5;
			starttickmark = 0.85*radiusofmeter;
			endtickmark = 1.02*radiusofmeter;
		}
		else{
			ctx.strokeStyle = "#000000";
			ctx.lineWidth = 1;
			starttickmark = 0.9*radiusofmeter;
			endtickmark = 1.0*radiusofmeter;

			temptext = i*TimeIncrements;

	ctx.restore();

function DrawLineArrow(x, y, l, lt, w, c, a){
	ctx.save();
	ctx.translate(x, y);
	ctx.rotate(a);
	ctx.lineWidth = lt;
	ctx.strokeStyle = c;
	ctx.beginPath();
	ctx.moveTo(0, 0);
	ctx.lineTo(l, 0);
	ctx.moveTo(l - w, 0 - w);
	ctx.lineTo(l, 0);
	ctx.lineTo(l - w, 0 + w);
	ctx.stroke();
	ctx.restore();
}

	ctx.translate(x, y);
	ctx.rotate(a);
	ctx.lineWidth = lt;
	ctx.strokeStyle = c;
	ctx.beginPath();
	ctx.moveTo(0, 0);
	ctx.lineTo(l, 0);
	ctx.moveTo(l - w, 0 - w);
	ctx.lineTo(l, 0);
	ctx.lineTo(l - w, 0 + w);
	ctx.moveTo(0 + w, 0 - w);
	ctx.lineTo(0, 0);
	ctx.lineTo(0 + w, 0 + w);
	ctx.stroke();
	ctx.restore();
}

function CalculateParameters(){

	NumberOfParticles = 0;
	NewParticleCreation = 5;
	StopCreation = "no";
	Peek = "no";

	R1 = Pipe1Radius[pipeonenumber];
	R2 = Pipe2Radius[pipetwonumber];
	F1 = Pipe1Speeds[speednumber];
	P1 = Pipe1Pressure[pressurenumber];

	R1m = R1/1000;
	R2m = R2/1000;
	A1 = Math.PI*Math.pow(R1m, 2.0);
	A2 = Math.PI*Math.pow(R2m, 2.0);
	FR = F1*A1*10;
	F2= F1*A1/A2;
	V1 = F1;
	V2 = F2;
	P2 = (P1*1000 + 0.5*DensityOfWater*Math.pow(V1,2.0) - 0.5*DensityOfWater*Math.pow(V2,2.0))/1000;
	CheckIt();
}

function DrawBackPipe(x,y){
	ctx.fillStyle = "#EEEEEE";
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 4;
	ctx.beginPath();
	ctx.moveTo(x,y-Shrinkage*R1);
	ctx.lineTo(x,y+Shrinkage*R1);
	ctx.lineTo(400,y+Shrinkage*R1);
	ctx.bezierCurveTo(400+0.1*Shrinkage*R1,y+Shrinkage*R1, 400+0.1*Shrinkage*R1,y-Shrinkage*R1, 400,y-Shrinkage*R1);
	ctx.lineTo(x, y-Shrinkage*R1);
	ctx.stroke();
	ctx.fill();

	ctx.beginPath();
	ctx.lineTo(500,y+Shrinkage*R2);
	ctx.lineTo(940,y+Shrinkage*R2);
	ctx.lineTo(940,y-Shrinkage*R2);
	ctx.lineTo(500,y-Shrinkage*R2);
	ctx.bezierCurveTo(500+0.1*Shrinkage*R2,y-Shrinkage*R2, 500+0.1*Shrinkage*R2,y+Shrinkage*R2, 500,y+Shrinkage*R2);
	ctx.stroke();
	ctx.fill();
}

	ctx.lineTo(400,y+Shrinkage*R1);
	ctx.lineTo(500,y+Shrinkage*R2);
	ctx.lineTo(940,y+Shrinkage*R2);
	ctx.lineTo(940,y-Shrinkage*R2);
	ctx.lineTo(500,y-Shrinkage*R2);
	ctx.lineTo(400,y-Shrinkage*R1);
	ctx.lineTo(x, y-Shrinkage*R1);
	ctx.globalAlpha = 0.4;
	ctx.fill();
	ctx.globalAlpha = 1.0;

	for (i = 0; i < NumberOfParticles; i++){
		if (XPos[i] <= 400){
			YPos = MiddleOfPipe - Shrinkage*R1 + YPosrel[i]*2*Shrinkage*R1/100;
		}
		else if (XPos[i] > 500){
			YPos = MiddleOfPipe - Shrinkage*R2 + YPosrel[i]*2*Shrinkage*R2/100;
		}
		else{
			YPos1 = MiddleOfPipe - Shrinkage*R1 + YPosrel[i]*2*Shrinkage*R1/100;
			YPos2 = MiddleOfPipe - Shrinkage*R2 + YPosrel[i]*2*Shrinkage*R2/100;

		DrawBall(XPos[i], YPos);

	ctx.lineTo(550,y-Shrinkage*R2);
	ctx.lineTo(500,y-Shrinkage*R2);
	ctx.lineTo(400,y-Shrinkage*R1);
	ctx.lineTo(x, y-Shrinkage*R1);
	ctx.closePath();
	ctx.stroke();
	ctx.globalAlpha = 0.7;
	ctx.fill();
	ctx.globalAlpha = 1.0;

}

function DrawArrow(x, y, h, w, c, r){
	ctx.save();
	ctx.translate(x, y+0.5*h);
	ctx.rotate(r);
	ctx.fillStyle = c;
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 1;
	ctx.beginPath();
	ctx.moveTo(0,-0.5*h);
	ctx.lineTo(0+w, -0.5*h+w);
	ctx.lineTo(0+0.5*w, -0.5*h+w);
	ctx.lineTo(0+0.5*w, -0.5*h+h);
	ctx.lineTo(0-0.5*w, -0.5*h+h);
	ctx.lineTo(0-0.5*w, -0.5*h+w);
	ctx.lineTo(0-w, -0.5*h+w);
	ctx.lineTo(0,-0.5*h);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	ctx.restore();
}
