<body>
  <div id="info">
    <h1>RC Time Constant & Neon Sign</h1>

    <div class="control-panel">
      <button class="btn btn-info" style="width:100%; margin-top:8px;"
        onclick="alert(
          'RC + AC Neon Sign:\n\n' +
          'Neon acts like a voltage-threshold lamp: it lights when the capacitor voltage exceeds a breakdown threshold V_break.\n\n' +
          '1) RC time constant:\n' +
          '   τ = R C\n\n' +
          '2) Capacitor voltage (charging):\n' +
          '   Vc(t) = V0 (1 − e^{−t/RC})\n\n' +
          '3) Capacitor voltage (discharging):\n' +
          '   Vc(t) = V0 e^{−t/RC}\n\n' +
          '4) Neon ON/OFF condition (simple model):\n' +
          '   ON if Vc(t) ≥ V_break\n\n' +
          'Key takeaway: Increasing R or C increases τ, slowing the voltage change and changing the blink/turn-on timing.'
        )">
        Why RC Neon?
      </button>

      <div class="control-group">
        Capacitance (mF):
        <div class="slider-row">
          <input type="range" id="capaSlider" min="5" max="30" step="1" value="15">
          <input type="text" id="capaValue" value="15" readonly>
        </div>
        <div class="minmax"><span>5</span><span>30</span></div>
      </div>

      <div class="control-group">
        Resistance (Ω):
        <div class="slider-row">
          <input type="range" id="rSlider" min="5" max="50" step="1" value="15">
          <input type="text" id="rValue" value="15" readonly>
        </div>
        <div class="minmax"><span>5</span><span>50</span></div>
      </div>

      <div class="tauBox">
        <p>Time constant: τ = RC</p>
        <div id="tauValue">0.225 s</div>
      </div>

      <button class="btn btn-danger" id="startBtn" style="margin-top:10px; width:100%;">Start</button>
    </div>
  </div>

  <div id="viewport"></div>
</body>
