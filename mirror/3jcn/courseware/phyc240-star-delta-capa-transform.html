	function addWire(x1,y1,z1,x2,y2,z2){
		var arr = [new THREE.Vector3(x1,y1,z1),
			   new THREE.Vector3(x2,y2,z2)]; 
		var mat = new THREE.MeshLambertMaterial({color: 'black'}); 
		var curve = new THREE.CatmullRomCurve3( arr );
		var geometry = new THREE.TubeGeometry( curve, 100, 0.08, 36, false ); 
		var  str = new THREE.Mesh(geometry, mat);
		scene.add(str);
	}
	function displayCircuitInfo(Ca, Cb, Cc) {
	    let infoDiv = document.getElementById('circuitInfo');
	
	    if (!infoDiv) {
	        infoDiv = document.createElement('div');
	        infoDiv.id = 'circuitInfo';
	        infoDiv.style.position = 'absolute';
	        infoDiv.style.top = '300px';
	        infoDiv.style.right = '40px';
	        infoDiv.style.padding = '40px';
	        infoDiv.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
	        infoDiv.style.color = 'white';
	        infoDiv.style.fontFamily = 'Arial, sans-serif';
	        infoDiv.style.fontSize = '14px';
	        infoDiv.style.maxWidth = '360px';
	        document.body.appendChild(infoDiv);
	    }
	
	    const Can = parseFloat(Ca);
	    const Cbn = parseFloat(Cb);
	    const Ccn = parseFloat(Cc);
	    const denominator = Can * Cbn + Can * Ccn + Cbn * Ccn;
	
	    const C1 = (Can * Cbn) / denominator; // between B and C
	    const C2 = (Cbn * Ccn) / denominator; // between C and A
	    const C3 = (Can * Ccn) / denominator; // between A and B
	
	    infoDiv.innerHTML = `
	
	        <strong>Input Capacitors (Star Y):</strong><br>
	        Cₐ = ${Can} µF<br>
	        Cb = ${Cbn} µF<br>
	        Cc = ${Ccn} µF<br><br>
	
	        <strong>Calculated Delta Capacitors:</strong><br>
	        C₁ = (${Can}×${Cbn}) / (${Can}×${Cbn} + ${Can}×${Ccn} + ${Cbn}×${Ccn}) = ${C1.toFixed(3)} µF<br>
	        C₂ = (${Cbn}×${Ccn}) / (${Can}×${Cbn} + ${Can}×${Ccn} + ${Cbn}×${Ccn}) = ${C2.toFixed(3)} µF<br>
	        C₃ = (${Can}×${Ccn}) / (${Can}×${Cbn} + ${Can}×${Ccn} + ${Cbn}×${Ccn}) = ${C3.toFixed(3)} µF
	    `;
	}
	function createRedArrow(position = { x: 0, y: 0, z: 0 }, length = 20, shaftRadius = 0.5, headLength = 5, headRadius = 1) {
	    const arrowGroup = new THREE.Group();
	
	    // Shaft (cylinder)
	    const shaftLength = length - headLength;
	    const shaftGeometry = new THREE.CylinderGeometry(shaftRadius, shaftRadius, shaftLength, 32);
	    const shaftMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
	    const shaft = new THREE.Mesh(shaftGeometry, shaftMaterial);
	
	    // Rotate and position shaft horizontally (X-axis)
	    shaft.rotation.z = Math.PI / 2;
	    shaft.position.x = shaftLength / 2;
	    arrowGroup.add(shaft);
	
	    // Head (cone)
	    const coneGeometry = new THREE.ConeGeometry(headRadius, headLength, 32);
	    const coneMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
	    const head = new THREE.Mesh(coneGeometry, coneMaterial);
	
	    // Rotate and position head at the tip
	    head.rotation.z = -Math.PI / 2;
	    head.position.x = shaftLength + headLength / 2;
	    arrowGroup.add(head);
	
	    // Final arrow group position
	    arrowGroup.position.set(position.x, position.y, position.z);
	
	    return arrowGroup;
	}
