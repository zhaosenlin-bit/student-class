<body>
	<div id="info" style="text-align: left"> 
		<button class="btn btn-danger" onclick="alert(
		    'J.J. Thomson\'s Cathode Ray Tube Experiment (1897) demonstrated that atoms contain tiny, negatively charged subatomic particles, later named electrons.\n\n' +
		
		    'Experimental Setup:\n' +
		    '- A glass tube was filled with low-pressure gas and had two metal electrodes (cathode and anode).\n' +
		    '- When high voltage was applied, a mysterious beam (cathode rays) traveled from the cathode (negative electrode) to the anode (positive electrode).\n\n' +
		
		    'Deflection by Magnetic Field:\n' +
		    '- A U-shaped magnet placed on top of the tube created a horizontal magnetic field.\n' +
		    '- As electrons moved perpendicular through this magnetic field, they experienced a vertical magnetic force (Lorentz force) and the beam deflected either upward or downward depending on the magnet\'s orientation.\n\n' +
		
		    'Impact:\n' +
		    '- This experiment disproved the belief that atoms were indivisible and led to the discovery of the electron, revolutionizing atomic theory.'
		);">
		    What is J.J. Thomson's Cathode Ray Tube Experiment?
		</button><br>

		Switch: <button class="btn btn-warning" id="onoff">On / Off</button><br>

		<input type="range" min="0" max="2.5" value="0" step="0.2" id="positionSlider" 
			orient="horizontal" style="width: 30%" > 
		<button class="btn btn-primary" id="flip_magnet">Flip Magnet</button>
		<button class="btn btn-danger" id="reset">Reset</button>
	</div>
	<div id="viewport"></div>
