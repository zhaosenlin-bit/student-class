<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中国近代史·第一部：1840，国门激变</title>
<style>html,body{margin:0;height:100%;background:#101418;color:#f2e9d8;font:15px/1.6 system-ui,sans-serif}
#bar{display:flex;gap:10px;align-items:center;padding:10px 14px;background:#1b2027;border-bottom:1px solid #3a3f47}
#bar select{flex:1;max-width:320px;padding:8px 10px;border-radius:8px;border:1px solid #4b535d;background:#232a32;color:#f2e9d8;font:inherit}
#bar button{padding:9px 18px;border:0;border-radius:8px;background:#e5c98f;color:#282119;font:inherit;cursor:pointer}
#bar button:hover{background:#f0d9a8}
#stage{height:calc(100% - 92px)}
#stage iframe{width:100%;height:100%;border:0;display:block}
#note{padding:6px 14px;font-size:13px;color:#9aa4b0;background:#161a20}</style>
</head>
<body>
<div id="bar">
<select id="chapter" aria-label="选择课件章节"><option value="/api/program-assets/1016/index.html">地图与片头</option><option value="/api/program-assets/1016/chapters/xiaozheng/entry-0.html">序章 · 广州见闻</option><option value="/api/program-assets/1016/chapters/xiaozheng/entry-1.html">第一章 · 虎门：禁烟现场</option><option value="/api/program-assets/1016/chapters/xiaozheng/entry-2.html">第二章 · 从虎门到南京</option></select>
<button type="button" id="open">打开章节</button>
</div>
<div id="stage"><iframe id="frame" title="课件画面" allow="autoplay; fullscreen"></iframe></div>
<div id="note">本课件为乐启享本地课件库中的离线副本，章节内容来自公开试用。</div>
<script>const select=document.getElementById('chapter');
const frame=document.getElementById('frame');
const open=document.getElementById('open');
const show=()=>{frame.src=select.value;};
open.addEventListener('click',show);
select.addEventListener('change',show);
show();</script>
</body>
</html>
