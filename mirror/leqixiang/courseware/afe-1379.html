<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/OrbitControls.js';
import { GLTFLoader } from 'three/addons/GLTFLoader.js';

const C = { red:'#e05555', blue:'#4f7fd6', acc:'#4da3ff', gold:'#ffc46b' };
const MAT2COL = {
  myo_lv:'#e0b4b0', myo_rv:'#c2d6da', myo_ra:'#bcd4dd', myo_la:'#e8bcb4',
  endo_lv:'#c23c3c', endo_rv:'#3d61a0', endo_ra:'#4d75b8', endo_la:'#d14747',
  cut_lv:'#eee0cd', cut_rv:'#dbe3e5', cut_ra:'#d9e5ea', cut_la:'#efe6db',
  aorta:'#c74a4a', pa:'#93a9d4', pv:'#d96464', svc:'#8ea6cc', ivc:'#7f97c2',
  valve:'#f7f0dd', septum:'#e3ada4', papillary:'#cc5c56', chordae:'#f5ecd7',
  coronary:'#992626', fat:'#f5ebc8', trab:'#d97a70'
};

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0d1220');
scene.fog = new THREE.Fog('#0d1220', 0.5, 2.2);
const cam = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.005, 50);
const PDB = new URLSearchParams(location.search).has('pdb');
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:PDB});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdfe9ff, 0x2a3145, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 1.55); key.position.set(0.6,0.9,1.0);
scene.add(key);
const fill = new THREE.DirectionalLight(0x88a8ff, 0.45); fill.position.set(-1,-0.3,-0.6);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffd0c0, 0.32); rim.position.set(0.3,0.6,-1);
scene.add(rim);

const ctrl = new OrbitControls(cam, renderer.domElement);
ctrl.enableDamping = true; ctrl.dampingFactor = 0.06;
ctrl.minDistance = 0.06; ctrl.maxDistance = 2.2;

let heart=null, mixer=null, actions={}, playing=true, rate=1;
let selObjs=[]; let centerOffset=new THREE.Vector3();
let flowOn=false; const flowGroup=new THREE.Group(); scene.add(flowGroup);

/* ---------- 血流路径（教学坐标系 cm→m） ---------- */
const S=0.01; const P=(a)=>new THREE.Vector3(a[0]*S,a[1]*S,a[2]*S);
const FLOW_DEFS=[
  { color:C.blue, pts:[[-2.2,6.1,-0.65],[-2.6,2.9,-0.30],[-2.45,2.0,-0.25],[-1.85,0.9,0.35],
                       [-1.35,-0.6,0.70],[-1.0,-2.1,0.85],[-1.58,1.15,0.62],[-1.70,2.6,0.0],
                       [-1.75,3.25,-0.70],[-3.35,3.40,-1.15]] },
  { color:C.red,  pts:[[0.35,3.0,-1.40],[1.85,2.75,-1.95],[1.05,2.35,-1.25],[1.20,1.05,-0.10],
                       [1.70,-0.9,0.15],[2.10,-3.0,0.40],[1.32,1.20,-0.02],[0.95,2.70,0.10],
                       [0.15,3.95,-0.30],[-1.30,2.90,-2.00],[-1.15,-0.20,-2.20]] },
  { color:C.blue, pts:[[-1.15,-0.20,-2.20],[-2.05,-2.45,-1.25],[-2.35,1.35,-0.75],
                       [-2.45,2.0,-0.25]] }
];
const flowParts=[];
FLOW_DEFS.forEach((d,i)=>{
  const curve=new THREE.CatmullRomCurve3(d.pts.map(P),false,'catmullrom',0.4);
  const N=9;
  for(let k=0;k<N;k++){
    const m=new THREE.Mesh(new THREE.SphereGeometry(0.0032,10,8),
      new THREE.MeshBasicMaterial({color:d.color,transparent:true,opacity:0.92}));
    m.userData.curve=curve; m.userData.off=k/N; flowGroup.add(m); flowParts.push(m);
  }
});
flowGroup.visible=false;

/* ---------- 加载合并模型 ---------- */
const loader=new GLTFLoader();
let groups={};          // 角色 → Object3D
let structMap=new Map();// structure_id → {key,zh,en,fn,blood,objs[],color}

function findNamed(root, name){
  let found=null;
  root.traverse(o=>{ if(!found && o.name===name) found=o; });
  return found;
}

function colorOf(objs){
  for(const o of objs){
    let m=o.material; if(Array.isArray(m)) m=m[0];
    if(m && m.color && m.color.getHexString()!=='ffffff') return '#'+m.color.getHexString();
  }
  return C.acc;
}

loader.load('./heart_vr.glb', gltf=>{
  heart = gltf.scene;
  scene.add(heart);

  groups.exterior = findNamed(heart,'Exterior_Realistic');
  groups.teaching = findNamed(heart,'Teaching');
  groups.hotspots = findNamed(heart,'Hotspots');

  heart.traverse(o=>{
    if(!o.isMesh) return;
    const mats = Array.isArray(o.material)?o.material:[o.material];
    mats.forEach(m=>{
      if(!m) return;
      // 教学剖面需要双面（才能看进腔室）；写实外壳保持单面
      const isExt = o.name==='heart_exterior';
      if(!isExt){ m.side = THREE.DoubleSide; }
      if(m.roughness===undefined) m.roughness=0.55;
      if(m.metalness===undefined) m.metalness=0.0;
    });
  });

  // 归心
  heart.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(heart);
  const ctr=box.getCenter(new THREE.Vector3());
  heart.position.sub(ctr); centerOffset.copy(ctr);
  heart.updateMatrixWorld(true);
  const size=box.getSize(new THREE.Vector3()).length();
  cam.position.set(size*0.52, size*0.26, size*0.88);
  ctrl.target.set(0,0,0); ctrl.update();  flowGroup.position.copy(centerOffset).multiplyScalar(-1);
  /* ---- 动画 ---- */
  mixer=new THREE.AnimationMixer(heart);
  (gltf.animations||[]).forEach(clip=>{
    const a=mixer.clipAction(clip);
    a.clampWhenFinished=true;
    a.loop = clip.name==='heartbeat' ? THREE.LoopRepeat : THREE.LoopOnce;
    actions[clip.name]=a;
  });
  if(actions.heartbeat) actions.heartbeat.play();
  /* ---- 结构清单 ---- */
  const acc=new Map();
  heart.traverse(o=>{
    if(!o.isMesh) return;
    let p=o, ud=null;
    while(p){ if(p.userData && p.userData.name_zh){ ud=p.userData; break; } p=p.parent; }
    if(!ud) return;
    const key = ud.structure_id || ud.hotspot_for || o.name;
    if(!acc.has(key)) acc.set(key,{key,zh:ud.name_zh,en:ud.name_en,fn:ud.function,
      blood:ud.blood,role:ud.role||'',objs:[],host:ud.host||''});
    acc.get(key).objs.push(o);
  });
  structMap=acc;
  window.__STRUCTS=[...acc.values()];
  buildList();

  let tri=0;
  heart.traverse(o=>{ if(o.isMesh&&o.geometry){
    const g=o.geometry;
    tri += g.index? g.index.count/3 : (g.attributes.position? g.attributes.position.count/3:0);
  }});
  document.getElementById('meta').textContent =
    `单一 GLB · 写实外形 + 教学剖面 · ${structMap.size} 个可点击结构 · `+
    `三角面 ${Math.round(tri).toLocaleString()} · 6 条动画（心跳/剖开/外形/对比）`;
  document.getElementById('bAnim').disabled=!actions.heartbeat;
  document.getElementById('loading').classList.add('hide');
  setState('ext', true);
},undefined,undefined,err=>{
  document.getElementById('loading').textContent='模型加载失败：'+((err&&err.message)||err);
  console.error(err);
});

/* ---------- 状态切换（补间；GLB 内置的同名动画片段供 Nibiru Creator 使用） ---------- */
const CONFLICT={cutaway_open:'cutaway_close', cutaway_close:'cutaway_open',
                teach_front_show:'teach_front_hide', teach_front_hide:'teach_front_show'};
function playClip(name){
  const a=actions[name]; if(!a) return;
  const other=actions[CONFLICT[name]];
  if(other && other.isRunning()) other.fadeOut(0.18);
  a.reset(); a.setEffectiveWeight(1); a.play();
}
function stopClip(name){ const a=actions[name]; if(a) a.fadeOut(0.12); }

/* 补间器：让组节点的 scale 平滑过渡，避免状态切换时跳变 */
const tweens=[];
function tweenScale(obj,to,dur=0.85){
  if(!obj) return;
  const from=obj.scale.x;
  if(Math.abs(from-to)<1e-6) return;
  const i=tweens.findIndex(t=>t.obj===obj);
  if(i>=0) tweens.splice(i,1);
  tweens.push({obj,from,to,t:0,dur});
}
function updateTweens(dt){
  for(let i=tweens.length-1;i>=0;i--){
    const w=tweens[i]; w.t=Math.min(w.t+dt/w.dur,1);
    const e=w.t<0.5 ? 4*w.t*w.t*w.t : 1-Math.pow(-2*w.t+2,3)/2;
    const s=w.from+(w.to-w.from)*e;
    w.obj.scale.set(s,s,s);
    if(w.t>=1) tweens.splice(i,1);
  }
}

const STATES={
  //  外壳     教学     热区    前壁
  ext:   {ext:1,     teach:0.001, hot:1,     front:0.001},
  cut:   {ext:0.001, teach:1,     hot:0.001, front:0.001},
  front: {ext:0.001, teach:1,     hot:0.001, front:1},
  cmp:   {ext:1,     teach:1,     hot:0.001, front:0.001}
};
let state='ext';
function frontNodes(){ const a=[]; if(heart) heart.traverse(o=>{ if(o.userData&&o.userData.role==='front_wall') a.push(o); }); return a; }
function vesselNodes(){ const a=[]; if(heart) heart.traverse(o=>{
  if(o.userData && ['ao','pa','pv','svc','ivc'].includes(o.userData.structure_id)) a.push(o); }); return a; }

/* 取景：按目标状态的缩放临时摆一次，量出包围盒，再平滑移动相机 */
/* 每个状态的固定观察方向：剖面/正面态正对 +Z（切面法线方向），保证“点击剖开”正对镜头 */
const VIEW_DIR={
  ext:   [0.52, 0.24, 0.82],
  cut:   [0.26, 0.14, 0.96],
  front: [0.04, 0.10, 0.99],
  cmp:   [0.52, 0.24, 0.82]
};
let camTween=null;
function withTargetScales(fn){
  const t=STATES[state]||STATES.ext; const saved=[];
  const set=(o,s)=>{ if(!o) return; saved.push([o,o.scale.x]); o.scale.set(s,s,s); };
  set(groups.exterior,t.ext); set(groups.teaching,t.teach); set(groups.hotspots,t.hot);
  frontNodes().forEach(o=>set(o,t.front));
  heart.updateMatrixWorld(true);
  try{ fn(); } finally {
    saved.forEach(([o,v])=>o.scale.set(v,v,v));
    heart.updateMatrixWorld(true);
  }
}
/* 按视锥把包围盒“装满”画面：水平/垂直各算一次，取较大者，再留 12% 边距 */
function fitDistance(box, margin=1.12){
  const hs=box.getSize(new THREE.Vector3());
  const tanY=Math.tan(cam.fov*Math.PI/360);
  const tanX=tanY*Math.max(cam.aspect,0.2);
  const dH=(hs.y*0.5)/tanY;
  const dW=(hs.x*0.5)/tanX;
  const dD=(hs.z*0.5)/tanX;          // 近端物体透视放大，额外兜底
  return Math.max(dH,dW,dD)*margin;
}
function frameState(s, instant){
  if(!heart) return;
  withTargetScales(()=>{
    const targets=[];
    if(s==='ext'){ if(groups.exterior) targets.push(groups.exterior); }
    else if(s==='cmp'){ if(groups.exterior) targets.push(groups.exterior);
                         if(groups.teaching)  targets.push(groups.teaching); }
    else { if(groups.teaching) targets.push(groups.teaching); }
    if(!targets.length) return;
    let b=null;
    targets.forEach(g=>{
      const gb=new THREE.Box3().setFromObject(g);
      if(gb.isEmpty()) return;
      b = b? b.union(gb) : gb;
    });
    if(!b||b.isEmpty()) return;
    const c=b.getCenter(new THREE.Vector3());
    const dist=fitDistance(b, s==='cmp'?1.30:1.12);
    const dv=VIEW_DIR[s]||VIEW_DIR.ext;
    const dir=new THREE.Vector3(dv[0],dv[1],dv[2]).normalize();
    const toP=c.clone().add(dir.multiplyScalar(dist));
    if(instant){ ctrl.target.copy(c); cam.position.copy(toP); ctrl.update(); camTween=null; return; }
    camTween={t:0,dur:0.85,fromC:ctrl.target.clone(),toC:c,
              fromP:cam.position.clone(),toP};
  });
}
function updateCamTween(dt){
  if(!camTween) return;
  camTween.t=Math.min(camTween.t+dt/camTween.dur,1);
  const e=camTween.t<0.5?4*camTween.t**3:1-Math.pow(-2*camTween.t+2,3)/2;
  ctrl.target.lerpVectors(camTween.fromC,camTween.toC,e);
  cam.position.lerpVectors(camTween.fromP,camTween.toP,e);
  if(camTween.t>=1) camTween=null;
}

function setState(s, instant){
  state=s;
  document.querySelectorAll('#switch button').forEach(b=>
    b.classList.toggle('on', b.dataset.m===s));
  document.getElementById('state').classList.add('show');
  const t=STATES[s]; if(!t) return;
  tweenScale(groups.exterior, t.ext);
  tweenScale(groups.teaching, t.teach);
  tweenScale(groups.hotspots, t.hot);
  frontNodes().forEach(o=>tweenScale(o, t.front));
  // 叠加对比：隐藏教学侧大血管，避免从写实外壳里穿出
  vesselNodes().forEach(o=>o.visible = (s!=='cmp'));
  // 叠加对比：写实外壳半透明，能同时看到外形与内部彩色结构
  const shellMat = (()=>{
    let m=null; if(groups.exterior) groups.exterior.traverse(o=>{ if(o.isMesh&&!m) m=o.material; });
    return Array.isArray(m)?m[0]:m;
  })();
  if(shellMat){
    const tr = (s==='cmp');
    shellMat.transparent = tr; shellMat.opacity = tr?0.30:1.0;
    shellMat.depthWrite = !tr; shellMat.needsUpdate = true;
  }
  if(s==='ext'){
    flowGroup.visible=false; flowOn=false;
    document.getElementById('bFlow').textContent='开启';
    document.getElementById('bFlow').classList.remove('on');
    document.getElementById('legend').classList.remove('show');
  }
  frameState(s, instant);
}
document.querySelectorAll('#switch button').forEach(b=>{
  b.onclick=()=>setState(b.dataset.m);
});

/* ---------- 结构列表 ---------- */
function buildList(){
  const box=document.getElementById('items'); box.innerHTML='';
  const order=['lv','rv','ra','la','ao','pa','pv','svc','ivc','septum',
               'valve_mitral','valve_tricuspid','valve_aortic','valve_pulmonic',
               'papillary','chordae','trab','coronary','fat'];
  const list=order.map(k=>structMap.get(k)).filter(Boolean);
  list.forEach(s=>{
    const d=document.createElement('div');
    d.className='item'; d.dataset.key=s.key;
    const col=colorOf(s.objs);
    d.innerHTML=`<i class="dot" style="background:${col};color:${col}"></i>
                 <span>${s.zh||s.key}</span><em>${s.en||''}</em>`;
    d.onclick=()=>{
      if(state==='ext') setState('cut');
      select(s,d);
    };
    box.appendChild(d);
  });
}

/* ---------- 选中高亮 ---------- */
function clearSel(){
  selObjs.forEach(o=>{ if(o.userData._em){ o.material.emissive.set(0x000000);
    o.material.emissiveIntensity=1; o.userData._em=false; } });
  selObjs=[];
  document.querySelectorAll('.item').forEach(e=>e.classList.remove('on'));
}
function select(s,el){
  clearSel();
  selObjs=s.objs.filter(o=>o.material && o.material.emissive);
  selObjs.forEach(o=>{ o.material.emissive=new THREE.Color(0x2a5fa0);
    o.material.emissiveIntensity=0.95; o.userData._em=true; });
  if(el) el.classList.add('on');
  const col=colorOf(s.objs);
  document.getElementById('iDot').style.background=col;
  document.getElementById('iDot').style.color=col;
  document.getElementById('iName').textContent=s.zh||s.key;
  document.getElementById('iEn').textContent=s.en||'';
  document.getElementById('iFn').textContent=s.fn||'';
  document.getElementById('iBd').textContent=s.blood||'—';
  document.getElementById('info').classList.add('show');
}

/* ---------- 射线拾取 ---------- */
const ray=new THREE.Raycaster(); const ndc=new THREE.Vector2(); let down=null;
renderer.domElement.addEventListener('pointerdown',e=>down={x:e.clientX,y:e.clientY});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!down) return;
  const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y); down=null;
  if(moved>5) return;
  ndc.x=(e.clientX/innerWidth)*2-1; ndc.y=-(e.clientY/innerHeight)*2+1;
  ray.setFromCamera(ndc,cam);
  const hits=ray.intersectObject(heart,true);
  if(!hits.length){ clearSel(); document.getElementById('info').classList.remove('show'); return; }
  let o=hits[0].object, ud=null, host=null;
  while(o){ if(o.userData && o.userData.name_zh){ ud=o.userData; host=o; break; } o=o.parent; }
  if(!ud) return;
  const key=ud.structure_id||ud.hotspot_for;
  const s=structMap.get(key);
  // 点击写实外壳或热区 → 自动剖开（同时高亮对应结构）
  if(ud.role==='exterior_shell'||ud.role==='hotspot'){
    if(state==='ext'){ setState('cut'); }
  }
  if(s) select(s, document.querySelector(`.item[data-key="${s.key}"]`));
});
document.getElementById('xClose').onclick=()=>{
  clearSel(); document.getElementById('info').classList.remove('show');
};

/* ---------- 控件 ---------- */
document.getElementById('bAnim').onclick=e=>{
  playing=!playing; e.target.textContent=playing?'暂停':'播放';
  e.target.classList.toggle('on',!playing);
};
document.getElementById('bFlow').onclick=e=>{
  flowOn=!flowOn; flowGroup.visible=flowOn;
  e.target.textContent=flowOn?'关闭':'开启';
  e.target.classList.toggle('on',flowOn);
  document.getElementById('legend').classList.toggle('show',flowOn);
};
let hotOn=true;
document.getElementById('bHot').onclick=e=>{
  hotOn=!hotOn;
  if(groups.hotspots) groups.hotspots.visible=hotOn;
  e.target.textContent=hotOn?'显示':'隐藏';
  e.target.classList.toggle('on',hotOn);
};
document.getElementById('bReset').onclick=()=>{ frameState(state, true); };
document.getElementById('rate').oninput=e=>{
  rate=e.target.value/70;
  document.getElementById('bpmv').textContent=e.target.value;
};

/* ---------- 循环 ---------- */
const clock=new THREE.Clock(); let flowT=0;
function tick(){
  requestAnimationFrame(tick);
  const dt=clock.getDelta();
  updateTweens(dt);
  updateCamTween(dt);
  if(mixer && playing) mixer.update(dt*rate);
  if(flowOn){
    flowT+=dt*0.16;
    flowParts.forEach(m=>{
      const t=((flowT+m.userData.off)%1);
      m.position.copy(m.userData.curve.getPointAt(Math.min(t,0.999)));
      const fade=Math.sin(t*Math.PI);
      m.material.opacity=0.25+0.75*fade;
      m.scale.setScalar(0.7+0.5*fade);
    });
  }
  ctrl.update();
  renderer.render(scene,cam);
}
tick();
addEventListener('resize',()=>{
  cam.aspect=innerWidth/innerHeight; cam.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

window.__DBG={ THREE, scene, cam, renderer, ctrl,
  get heart(){return heart;}, get mixer(){return mixer;}, actions, playClip,
  get groups(){return groups;}, setState,
  get state(){return state;},
  get structMap(){return structMap;} };
</script>
