<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>图小灵 - AI 教学助手</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/creation-format.css">
  <link rel="stylesheet" href="css/course-discovery.css">
  <link rel="stylesheet" href="css/home-refinement.css?v=20261025-history">
</head>

<body class="refined-chat">


  <!-- ════ 单栏对话主体 ════ -->
  <main class="main-container single-col">
  <nav class="history-rail" aria-label="对话导航">
    <button id="btn-history-rail" type="button" aria-label="展开或收起历史记录" aria-controls="modal-load-chat" aria-expanded="false" title="历史记录 · 仅显示主动保存的内容">
      <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16M13 9h4M13 13h4"/></svg><span>历史</span>
    </button>
    <button id="btn-history-new" type="button" aria-label="新对话" title="新对话"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 5v14M5 12h14"/></svg><span>新建</span></button>
  </nav>
  <!-- ── 已保存的历史侧栏 ── -->
  <div class="modal-overlay" id="modal-load-chat" style="display:none">
    <div class="modal-content" role="region" aria-label="已保存的课件与对话">
      <div class="modal-header">
        <span>历史记录</span>
        <button class="modal-close" aria-label="收起已保存" onclick="closeLoadModal()">✕</button>
      </div>
      <p class="history-tip">只有主动保存的课件与对话才会出现在这里。</p>
      <input id="saved-chat-search" type="search" aria-label="搜索已保存的对话" placeholder="搜索已保存的对话">
      <div class="modal-body" id="modal-chat-list">
        <div style="text-align:center;padding:20px;color:var(--text-dim)">暂无保存的课件或对话</div>
      </div>
    </div>
  </div>


    <!-- ── 对话面板 ── -->
    <section class="panel panel-chat" id="panel-chat">
      <div class="panel-header">
        <div class="ai-chat-avatar" aria-hidden="true">图</div>
        <div>
          <div class="ai-chat-name">图小灵</div>
          <div class="ai-chat-subtitle">AI教学助手</div>
        </div>
        <div class="header-btn-group">
          <button id="btn-new-session" class="header-btn" title="新建对话">新对话</button>
          <button id="btn-save-chat" class="header-btn" title="保存自己的课件与对话">保存</button>
          <button id="btn-load-chat" class="header-btn" aria-controls="modal-load-chat" aria-expanded="false" title="重新打开自己的课件与对话">历史记录</button>
          <button id="btn-points-usage" class="header-btn">积分与用量</button>
        </div>
      </div>

      <p id="points-wallet-status" role="status" style="margin:0;padding:4px 18px;font-size:12px;color:#64748b"></p>
      <p id="points-cost-notice" role="status" style="margin:0;padding:0 18px;font-size:12px;color:#64748b"></p>
      <div class="chat-messages" id="chat-messages">
        <div class="welcome-bubble">
          <h1>今天，想做一份什么课件？</h1>
          <p>告诉图小灵学科、年级和教学想法。</p>
        </div>
      </div>

      <!-- 全屏预览蒙层 -->
      <div class="fullscreen-overlay" id="fullscreen-overlay">
        <div class="fullscreen-header">
          <span>预览</span>
          <button id="btn-close-fullscreen" class="btn-close-fullscreen">✕ 关闭</button>
        </div>
        <iframe id="fullscreen-iframe" sandbox="allow-scripts allow-forms allow-popups allow-modals allow-pointer-lock"></iframe>
      </div>

      <div class="chat-input-area">
        <div class="input-options">
          <button type="button" id="btn-add-material" class="material-add">＋ 图片或文件</button>
          <div class="creation-style-option">
            <span id="creation-style-label">创作方式</span>
            <fieldset id="creation-style" class="creation-style-switch" aria-labelledby="creation-style-label">
              <label title="灵活设计内容、版式与交互，支持继续修改">
                <input type="radio" name="creation-style" value="free" checked>
                <span>自由创作</span>
              </label>
              <label title="采用清晰统一的版式，内容与交互仍可按需调整">
                <input type="radio" name="creation-style" value="structured">
                <span>规范模板</span>
              </label>
            </fieldset>
          </div>
          <label class="thinking-option"><input type="checkbox" id="thinking-enabled">深度思考</label>
          <span class="input-hint">分析更充分，可能增加等待与用量</span>
        </div>
        <input id="material-file" type="file" accept=".png,.jpg,.jpeg,.webp,.pdf,.docx,.txt" multiple hidden>
        <div id="course-resource-notice" class="material-notice" role="status"></div>
        <div id="material-list" class="material-list"></div>
        <div id="material-notice" class="material-notice" role="status" aria-live="polite">最多4份，每份8MB。PDF/DOCX/TXT提取文字；图片发送后由模型识读。资料暂存7天。</div>
        <!-- 素材/样式抽屉（从输入区向上浮出） -->
        <div class="assets-drawer" id="assets-drawer">
          <div class="asset-tabs" id="asset-tabs">
            <button class="tab-btn active" data-tab="models3d">3D模型</button>
            <button class="tab-btn" data-tab="models2d">2D</button>
          </div>
          <div class="asset-content" id="asset-content"></div>
        </div>
        <div class="chat-input-row">
        <textarea id="chat-input" aria-label="教学需求或修改要求" placeholder="" rows="3"></textarea>
        <button id="btn-send" class="btn-send" aria-label="发送">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
        </div>
      </div>
        <!-- 场景分类横栏 -->
        <div class="scene-bar" id="scene-bar">
          <button class="scene-btn" data-scene="AI学科模型">AI学科模型</button>
          <button class="scene-btn" data-scene="课堂互动">课堂互动</button>
          <button class="scene-btn" data-scene="管理工具">管理工具</button>
          <button class="scene-btn" data-scene="AI备课">AI备课</button>
        </div>
    </section>

  </main>


  <script src="js/html-export.js"></script>
  <script src="js/offline-download.js"></script>
  <script src="js/assets-data.js"></script>
  <script src="js/work-progress.js"></script>
  <script src="js/resource-host.js"></script>
  <script src="js/lesson-fullscreen.js"></script>
  <script src="js/customer-wording.js"></script>
  <script src="/js/points-wallet-v1.js?v=20261026"></script>
  <script src="/js/points-history.js?v=20261026"></script>
  <script src="js/creation-confirmation-points-v1.js"></script>
  <script src="js/lesson-parameters.js"></script>
  <script src="js/request-recovery.js"></script>
  <script src="js/creation-format.js"></script>
  <script src="/course-links.js"></script>
  <script src="js/course-discovery.js"></script>
  <script src="js/app-points-v1.js"></script>
</body>

</html>
