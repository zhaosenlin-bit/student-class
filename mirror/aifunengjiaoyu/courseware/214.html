<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>英雄知识大乱斗 · 浮力挑战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #0b1a2e 0%, #1b3a4b 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            max-width: 900px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            border-radius: 60px 60px 40px 40px;
            padding: 24px 24px 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 215, 0, 0.2);
            transition: all 0.2s;
        }

        /* 标题 */
        .game-title {
            text-align: center;
            color: #f5e9c4;
            text-shadow: 0 4px 0 #7f5a3b, 0 0 20px #f5b642;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 4px;
            margin-bottom: 18px;
            word-break: keep-all;
        }
        .game-title small {
            font-size: 1rem;
            font-weight: 400;
            color: #b8d4e3;
            text-shadow: none;
            display: block;
            margin-top: -6px;
            letter-spacing: 2px;
        }

        /* 战场-英雄 vs 敌人 */
        .battlefield {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .fighter-card {
            flex: 1;
            min-width: 130px;
            background: #1f3345;
            border-radius: 40px 40px 24px 24px;
            padding: 14px 12px 16px;
            box-shadow: inset 0 -6px 0 #0f1a24, 0 8px 12px rgba(0,0,0,0.5);
            border-bottom: 3px solid #ffb347;
            transition: 0.2s;
        }
        .fighter-card.enemy {
            border-bottom-color: #d64545;
        }

        .fighter-name {
            color: #f2e9d0;
            font-weight: 700;
            font-size: 1.3rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
        .fighter-name span {
            background: #2a4157;
            padding: 0 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            color: #bcd3e6;
        }

        .hp-bar-bg {
            background: #2d1b1b;
            height: 20px;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.7);
            margin: 6px 0 4px;
            border: 1px solid #4d5b69;
        }
        .hp-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #f94144, #f8961e);
            border-radius: 40px;
            transition: width 0.25s ease;
        }
        .hp-fill.enemy-hp {
            background: linear-gradient(90deg, #c92a2a, #e67700);
        }
        .hp-text {
            color: #e0e7ee;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .vs-divider {
            font-size: 2.8rem;
            font-weight: 900;
            color: #f3c26b;
            text-shadow: 0 0 20px #f0b34b;
            background: #1e3142;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 0 3px #f3c26b, 0 8px 0 #0f1e2a;
            flex-shrink: 0;
        }

        /* 题目区域 */
        .question-area {
            background: #eef3f7;
            border-radius: 40px;
            padding: 22px 20px 18px;
            margin: 12px 0 18px;
            box-shadow: inset 0 -6px 0 #b0c4d4, 0 10px 18px rgba(0, 0, 0, 0.5);
            border: 1px solid #d9e2ed;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0a1f2c;
            line-height: 1.4;
            margin-bottom: 16px;
            padding-left: 6px;
            text-shadow: 0 1px 0 white;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .option-btn {
            background: white;
            border: none;
            padding: 14px 8px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.1rem;
            color: #1a2f40;
            box-shadow: 0 5px 0 #b3c6d6, 0 4px 8px rgba(0,0,0,0.2);
            transition: all 0.08s linear;
            cursor: pointer;
            text-align: center;
            letter-spacing: 0.5px;
            border: 1px solid #cbdae7;
        }
        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #a0b4c6;
        }
        .option-btn:disabled {
            opacity: 0.5;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #a0b4c6;
            pointer-events: none;
        }
        .option-btn.correct-glow {
            background: #a7e0a0;
            border-color: #2a7a3b;
            box-shadow: 0 0 0 2px #1f8f3a;
        }
        .option-btn.wrong-glow {
            background: #f4a2a2;
            border-color: #b33;
            box-shadow: 0 0 0 2px #c33;
        }

        /* 反馈 & 日志 */
        .feedback-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 16px;
        }

        .message-box {
            background: #1d2d3b;
            padding: 12px 18px;
            border-radius: 60px;
            color: #f2e9cf;
            font-weight: 500;
            font-size: 1rem;
            min-height: 3.2rem;
            box-shadow: inset 0 2px 5px #0b141c;
            border-left: 6px solid #f3b34b;
            display: flex;
            align-items: center;
        }

        .battle-log {
            background: #0f1d27;
            border-radius: 30px;
            padding: 12px 16px;
            max-height: 100px;
            overflow-y: auto;
            color: #b6d0e0;
            font-size: 0.9rem;
            border: 1px solid #2f4a5a;
            box-shadow: inset 0 0 10px #050e14;
            scroll-behavior: smooth;
        }
        .battle-log div {
            padding: 4px 0;
            border-bottom: 1px solid #1f3442;
        }
        .battle-log div:last-child {
            border-bottom: none;
        }

        .reset-btn {
            background: #f5c542;
            border: none;
            color: #1d2c38;
            font-weight: 800;
            font-size: 1.2rem;
            padding: 14px 20px;
            border-radius: 60px;
            margin-top: 12px;
            box-shadow: 0 6px 0 #b57c2a, 0 6px 12px black;
            transition: 0.08s linear;
            cursor: pointer;
            letter-spacing: 2px;
            width: 100%;
            border: 1px solid #ffd966;
        }
        .reset-btn:active {
            transform: translateY(6px);
            box-shadow: 0 1px 0 #b57c2a;
        }

        @media (max-width: 550px) {
            .game-title { font-size: 1.8rem; }
            .options-grid { grid-template-columns: 1fr; }
            .vs-divider { width: 48px; height: 48px; font-size: 2rem; }
            .fighter-card { min-width: 100px; }
        }
    </style>
</head>
