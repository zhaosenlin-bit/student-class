<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>地球自转 · 昼夜交替</title>
  <style>
    /* ----- 暗色主题 CSS 变量 ----- */
    :root {
      --bg-deep: #060b14;
      --bg-panel: #0d1b2a;
      --bg-panel-alt: #111d30;
      --border: #1a3050;
      --text: #d0d8e8;
      --text-dim: #7a8a9e;
      --accent: #00b4d8;
      --accent2: #ff6b35;
      --accent3: #4caf50;
      --accent4: #ffd166;
      --danger: #e63946;
      --panel-width: 290px;
      --header-h: 46px;
      --transition: 0.25s ease;
      --radius: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-deep);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      color: var(--text);
    }

    #app {
      width: 100%;
      height: 100vh;
      position: relative;
      overflow: hidden;
      background: var(--bg-deep);
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    .overlay-ui {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      top: 0;
      pointer-events: none;
      z-index: 10;
    }

    .overlay-ui > * {
      pointer-events: auto;
    }

    .top-status {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6, 11, 20, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 180, 216, 0.25);
      border-radius: 40px;
      padding: 8px 22px;
      display: flex;
      align-items: center;
      gap: 20px;
      white-space: nowrap;
      box-shadow: 0 4px 24px rgba(0,0,0,0.6);
      pointer-events: none;
    }
    .top-status .title {
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 1px;
    }
    .top-status .divider {
      width: 1px;
      height: 18px;
      background: var(--border);
    }
    .top-status .status-text {
      font-size: 14px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .top-status .status-text .emoji-big {
      font-size: 20px;
    }

    .bottom-controls {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      background: rgba(6, 11, 20, 0.7);
      backdrop-filter: blur(8px);
      padding: 16px 28px;
      border-radius: 60px;
      border: 1px solid rgba(26, 48, 80, 0.5);
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }
    .btn {
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: rgba(13, 27, 42, 0.8);
      color: var(--text);
      transition: all 0.2s;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      letter-spacing: 0.5px;
      backdrop-filter: blur(4px);
    }
    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0, 180, 216, 0.08);
      transform: scale(1.02);
    }
    .btn.active {
      border-color: var(--accent2);
      color: var(--accent2);
      background: rgba(255, 107, 53, 0.15);
    }
    .btn.accent {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0, 180, 216, 0.12);
    }
    .btn.accent:hover {
      background: rgba(0, 180, 216, 0.2);
    }

    .btn-small {
      font-size: 13px;
      padding: 6px 14px;
    }

    .auto-indicator {
      font-size: 13px;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .auto-indicator .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent3);
      animation: pulse-dot 1.6s ease-in-out infinite;
    }
    .auto-indicator .dot.paused {
      background: var(--text-dim);
      animation: none;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .hint-label {
      position: absolute;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      color: rgba(255,255,255,0.3);
      background: rgba(0,0,0,0.3);
      padding: 4px 16px;
      border-radius: 20px;
      backdrop-filter: blur(2px);
      border: 1px solid rgba(255,255,255,0.05);
      pointer-events: none;
      white-space: nowrap;
    }

    /* 下载按钮 - 新增 */
    .download-btn {
      position: absolute;
      top: 18px;
      right: 20px;
      z-index: 15;
      pointer-events: auto;
      padding: 8px 18px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--accent);
      background: rgba(0, 180, 216, 0.15);
      color: var(--accent);
      transition: all 0.2s;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .download-btn:hover {
      background: rgba(0, 180, 216, 0.25);
      transform: scale(1.04);
      border-color: var(--accent2);
      color: var(--accent2);
    }

    @media (max-width: 700px) {
      .top-status {
        top: 12px;
        padding: 6px 14px;
        gap: 12px;
        flex-wrap: wrap;
        justify-content: center;
        white-space: normal;
        border-radius: 28px;
      }
      .top-status .title { font-size: 14px; }
      .top-status .status-text { font-size: 13px; }
      .bottom-controls {
        bottom: 20px;
        padding: 12px 16px;
        border-radius: 40px;
        width: 92%;
        max-width: 400px;
      }
      .btn {
        font-size: 13px;
        padding: 6px 14px;
      }
      .btn-small {
        font-size: 12px;
        padding: 5px 12px;
      }
      .hint-label {
        bottom: 90px;
        font-size: 11px;
        padding: 2px 12px;
      }
      .download-btn {
        top: 12px;
        right: 12px;
        padding: 6px 14px;
        font-size: 12px;
      }
    }
    @media (max-width: 480px) {
      .top-status .title { font-size: 12px; }
      .top-status .status-text { font-size: 12px; }
      .bottom-controls { gap: 10px; }
      .btn { font-size: 12px; padding: 5px 12px; }
    }

    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      color: var(--accent);
      font-size: 18px;
      background: rgba(6, 11, 20, 0.8);
      padding: 20px 32px;
      border-radius: 40px;
      border: 1px solid var(--border);
      backdrop-filter: blur(6px);
      pointer-events: none;
    }
    #loading.hidden {
      opacity: 0;
      transition: opacity 0.6s;
    }
  </style>
