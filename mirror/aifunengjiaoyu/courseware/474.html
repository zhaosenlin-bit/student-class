<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>等高线地形图 · 双峰交互教室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #e7f0e6;
            --bg-panel: #f4f9f2;
            --bg-panel-alt: #eaf3e8;
            --border: #b8d0b0;
            --text: #1f3a2b;
            --text-dim: #4d6a55;
            --accent: #2f7a4f;
            --accent2: #c85a2b;
            --accent3: #4caf50;
            --accent4: #f3b33d;
            --danger: #c73e3e;
            --panel-width: 280px;
            --header-h: 48px;
            --transition: 0.25s ease;
            --radius: 12px;
            --shadow-card: 0 4px 12px rgba(0, 20, 10, 0.08);
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #mobile-header {
            display: none;
        }

        #main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左面板 */
        #left-panel {
            width: var(--panel-width);
            min-width: var(--panel-width);
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding-bottom: 12px;
            box-shadow: 2px 0 8px rgba(0, 20, 10, 0.04);
        }

        /* 中视口 */
        #center-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-deep);
        }

        #center-panel canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 右面板 */
        #right-panel {
            width: var(--panel-width);
            min-width: var(--panel-width);
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            padding-bottom: 12px;
            box-shadow: -2px 0 8px rgba(0, 20, 10, 0.04);
        }

        /* ----- 面板 Section 统一结构 ----- */
        .panel-section {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }
        .panel-section:last-child {
            border-bottom: none;
        }
        .panel-section h3 {
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .panel-section h3::before {
            content: "";
            display: inline-block;
            width: 3px;
            height: 14px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* 控件标准化 */
        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }
        .btn {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-panel-alt);
            color: var(--text);
            transition: all 0.2s;
            white-space: nowrap;
            font-weight: 500;
        }
        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(47, 122, 79, 0.06);
        }
        .btn.active {
            border-color: var(--accent2);
            color: var(--accent2);
            background: rgba(200, 90, 43, 0.08);
        }
        .btn.accent {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* 滑块 */
        .range-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0;
        }
        .range-group label {
            font-size: 12px;
            color: var(--text-dim);
            min-width: 36px;
        }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            outline: none;
            margin: 4px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--bg-panel);
            box-shadow: 0 0 0 1px var(--accent);
        }

        /* 复选框 */
        .ctrl-group {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .ctrl-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text);
            cursor: pointer;
            padding: 5px 0;
        }
        .ctrl-group label input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* 数据行 */
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(60, 90, 70, 0.08);
        }
        .data-row .label {
            color: var(--text-dim);
        }
        .data-row .value {
            color: var(--text);
            font-weight: 600;
            text-align: right;
        }

        /* 信息卡 (3D叠加) */
        .info-card {
            position: absolute;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(244, 249, 242, 0.92);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 12px 20px;
            max-width: 420px;
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s;
            z-index: 6;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: var(--shadow-card);
        }
        .info-card.visible {
            opacity: 1;
        }

        /* 右面板 剖面图占位 */
        .profile-placeholder {
            width: 100%;
            aspect-ratio: 2/1;
            background: var(--bg-panel-alt);
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-dim);
            min-height: 100px;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            #mobile-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 14px;
                height: var(--header-h);
                background: var(--bg-panel);
                border-bottom: 1px solid var(--border);
                box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            }
            #mobile-header h1 {
                font-size: 16px;
                color: var(--text);
                font-weight: 600;
            }
            #mobile-header button {
                background: none;
                border: 1px solid var(--border);
                padding: 6px 12px;
                border-radius: 8px;
                color: var(--text);
                font-size: 13px;
                cursor: pointer;
            }
            #left-panel {
                position: fixed;
                left: 0;
                top: var(--header-h);
                bottom: 0;
                z-index: 50;
                margin-left: calc(-1 * var(--panel-width));
                transition: margin-left var(--transition);
                box-shadow: 4px 0 16px rgba(0, 0, 0, 0.06);
            }
            #left-panel.open {
                margin-left: 0;
            }
            #right-panel {
                position: fixed;
                right: 0;
                top: var(--header-h);
                bottom: 0;
                z-index: 50;
                margin-right: calc(-1 * var(--panel-width));
                transition: margin-right var(--transition);
                box-shadow: -4px 0 16px rgba(0, 0, 0, 0.06);
            }
            #right-panel.open {
                margin-right: 0;
            }
            #main-layout {
                padding-top: 0;
            }
            :root {
                --panel-width: 260px;
            }
        }

        /* 自定义滚动条 */
        #left-panel::-webkit-scrollbar,
        #right-panel::-webkit-scrollbar {
            width: 4px;
        }
        #left-panel::-webkit-scrollbar-track,
        #right-panel::-webkit-scrollbar-track {
            background: var(--bg-panel);
        }
        #left-panel::-webkit-scrollbar-thumb,
        #right-panel::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 8px;
        }
    </style>
</head>

    <div id="app">
        <!-- 移动端头部 -->
        <header id="mobile-header">
            <button id="btn-toggle-left">☰ 控制</button>
            <h1>🌿 双峰等高线</h1>
            <button id="btn-toggle-right">📊 数据</button>
        </header>

        <div id="main-layout">
            <!-- 左控制面板 -->
            <aside id="left-panel">
                <div class="panel-section">
                    <h3>🗺️ 显示控制</h3>
                    <div class="ctrl-group">
                        <label><input type="checkbox" id="chk-contour"> 显示等高线</label>
                        <label><input type="checkbox" id="chk-ruler"> 显示标尺</label>
                        <label><input type="checkbox" id="chk-surface"> 显示登高面</label>
                        <label><input type="checkbox" id="chk-profile"> 显示剖面图</label>
                        <label><input type="checkbox" id="chk-hide"> 关闭山脉</label>
                    </div>
                </div>
                <div class="panel-section">
                    <h3>🔄 视角</h3>
                    <div class="btn-row">
                        <button class="btn active" id="btn-auto-rotate">自动旋转</button>
                        <button class="btn" id="btn-reset">↺ 重置</button>
                    </div>
                    <div style="margin-top:8px;">
                        <label style="font-size:12px;color:var(--text-dim);">旋转速度</label>
                        <input type="range" id="rotate-speed" min="0" max="0.02" step="0.001" value="0.008">
                    </div>
                </div>
                <div class="panel-section">
                    <h3>📐 地形参数</h3>
                    <div class="range-group">
                        <label>起伏</label>
                        <input type="range" id="terrain-height" min="0.4" max="1.8" step="0.05" value="1.0">
                    </div>
                    <div class="range-group">
                        <label>陡峭</label>
                        <input type="range" id="terrain-rough" min="0.2" max="1.6" step="0.1" value="0.8">
                    </div>
                </div>
                <div class="panel-section">
                    <h3>ℹ️ 操作提示</h3>
                    <div style="font-size:12px;color:var(--text-dim);line-height:1.6;">
                        🖱 拖拽旋转 · 滚轮缩放<br>
                        ☑ 勾选左侧功能体验
                    </div>
                </div>
            </aside>

            <!-- 中间3D视口 -->
            <main id="center-panel">
                <div class="info-card" id="info-card-profile">📈 剖面图 · 沿双峰连线切开 · 可见两座山峰</div>
                <!-- Three.js canvas 自动注入 -->
            </main>

            <!-- 右信息面板 -->
            <aside id="right-panel">
                <div class="panel-section">
                    <h3>📊 地形数据</h3>
                    <div class="data-row"><span class="label">海拔范围</span><span class="value" id="data-elevation">0 ~ 450 m</span></div>
                    <div class="data-row"><span class="label">等高距</span><span class="value">50 m</span></div>
                    <div class="data-row"><span class="label">登高面数</span><span class="value" id="data-levels">9 层</span></div>
                    <div class="data-row"><span class="label">坡度</span><span class="value" id="data-slope">中等</span></div>
                    <div class="data-row"><span class="label">山峰</span><span class="value">⛰️ 双峰</span></div>
                </div>
                <div class="panel-section">
                    <h3>📈 剖面曲线 (双峰连线)</h3>
                    <div class="profile-placeholder" id="profile-chart">剖面图加载中...</div>
                    <div style="font-size:11px;color:var(--text-dim);margin-top:6px;">沿两座山峰连线 · 双峰清晰可见</div>
                </div>
                <div class="panel-section">
                    <h3>🌱 知识点</h3>
                    <ul style="font-size:12px;color:var(--text-dim);line-height:1.7;padding-left:16px;">
                        <li>等高线密集 → 坡度陡</li>
                        <li>等高线稀疏 → 坡度缓</li>
                        <li>登高面 = 水平切面</li>
                        <li>闭合等高线 → 山峰/洼地</li>
                    </ul>
                </div>
            </aside>
        </div>
    </div>
