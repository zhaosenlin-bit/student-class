<html lang="en">
<head>

  <title>乐启享 · 物理实验</title>

  <style>
    body { margin:0; overflow:hidden; background:#111; }
    body { font-family: "Times New Roman", Times, serif; }
    #container { position:fixed; inset:0; }

    /* Control panel: center top */
    #panel {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: min(920px, 96vw);
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      z-index: 10;
    }
    #panel .row { margin-left:0; margin-right:0; }
    .sliderRow { display:flex; align-items:center; gap:10px; margin:6px 0; }
    .sliderRow label { width:40px; margin:0; }
    .sliderRow input[type="range"] { flex:1; }
    .sliderVal { width:90px; text-align:right; font-family: monospace; }

  </style>
</head>

  <div id="container"></div>

  <div id="panel">
    <div style="text-align:center; font-weight:700; font-size:30px; margin-bottom:10px; color:yellow;">
      CAPACITORS IN SERIES

    <!-- Sliders (Capacitance in µF) -->
    <div class="sliderRow">
      <label>C1</label>
      <input id="c1" type="range" min="1" max="999" step="1" value="10">

    </div>

    <div class="sliderRow">
      <label>C2</label>

    </div>

    <div class="sliderRow">
      <label>C3</label>
      <input id="c3" type="range" min="1" max="999" step="1" value="30">
      <div class="sliderVal"><span id="c3v">30</span> µF</div>
    </div>

    <div class="sliderRow">
      <label>C4</label>
      <input id="c4" type="range" min="1" max="999" step="1" value="40">
      <div class="sliderVal"><span id="c4v">40</span> µF</div>
    </div>

    <div class="sliderRow">
      <label>C5</label>
      <input id="c5" type="range" min="1" max="999" step="1" value="50">
      <div class="sliderVal"><span id="c5v">50</span> µF</div>

    <div style="margin-top:14px; display:flex; gap:12px;">

      <div style="flex:1; background:#111; border:2px solid #2b7cff; border-radius:8px; padding:10px;">
        <div style="color:#2b7cff; font-weight:bold; margin-bottom:6px;">

        <input id="ceqLeftBox" readonly

                 border-radius:6px; padding:8px;">
      </div>

      <!-- Right -->
      <div style="flex:1; background:#111; border:2px solid #35d07f; border-radius:8px; padding:10px;">
        <div style="color:#35d07f; font-weight:bold; margin-bottom:6px;">
          Right (3 series): 1/C<sub>eq</sub> = 1/C<sub>3</sub> + 1/C<sub>4</sub> + 1/C<sub>5</sub>
        </div>
        <input id="ceqRightBox" readonly
          style="width:100%; font-size:18px; font-weight:700; text-align:center;
                 background:#000; color:#fff; border:1px solid #444;
                 border-radius:6px; padding:8px;">
      </div>

    </div>

    <!-- Buttons -->
    <div class="btnRow" style="margin-top:12px;">
      <button id="formulaBtn" class="btn btn-info">Formulas</button>
      <button id="resetBtn" class="btn btn-danger">Reset</button>
      
    </div>
  </div>
