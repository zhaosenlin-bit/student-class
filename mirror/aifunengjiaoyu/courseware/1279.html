 help:commonHelp+`<h3>本课结构依据</h3><p><a href="https://aflow.org/p/X5M8/" target="_blank" rel="noopener">AFLOW立方金刚石A4</a>与<a href="https://aflow.org/p/W4SC/" target="_blank" rel="noopener">AFLOW六方AB石墨A9</a>：2026-10-04实际读取原型与原始向量/基矢，程序按坐标独立生成连接。CIF点击失败，未声称导入CIF。常规立方金刚石和AB石墨，不包含其他同素异形体。</p><p><a href="https://openstax.org/books/chemistry-2e/pages/10-5-the-solid-state-of-matter" target="_blank" rel="noopener">OpenStax §10.5</a>：网络连接与性质事实；本页原创绘图和问题不复制教材插图或表格。晶格球色是编码；整体电荷0，不是碳离子。</p><p>石墨层间/层内距离约比由普通AB石墨的3.35 Å/1.42 Å作显示参考（<a href="https://pubs.rsc.org/en/content/articlehtml/2019/mh/c9mh01588d" target="_blank" rel="noopener">RSC原始研究正文的对照数据</a>）；不同材料各自归一化，不能用屏幕距离直接比较实物键长。棒表示连接，不表示棒状实物，也不逐一画石墨键级与电子。</p><h3>边界、层与物性</h3><p>有限片段在边缘被截断，虚线短段表示图外或被隐藏部分继续延伸。完整周期结构的近邻数、当前片段内连接数、当前画面可见数分别列示。没有模拟真实晶体表面缺陷或断键化学。</p><p>去层/剖面是视图过滤，不是切削、断键或石墨制钻过程。性质卡采用典型理想样品的定性表述，不能用它预测掺杂材料；不生成伪硬度、电流或电导率数值。</p><h3>练习来源范围</h3><p>读取OpenStax第10章练习68(e)、69(e)的结构类型辨析方向及70—71的性质证据题型；课堂任务为原创的适龄问题，不复制原题，也不声称中考考频。C60可选结构未制作，避免使用未独立验证的拓扑。</p>`,
