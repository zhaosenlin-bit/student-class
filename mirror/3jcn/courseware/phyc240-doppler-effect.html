  <div id="container"></div>
  <div id="info">
    <h1>Doppler Effect</h1>
    <button type="button" class="btn btn-primary" id="still"> Stationary Source</button>
    <button type="button" class="btn btn-primary" id="smaller"> Source speed < Wave speed </button>
    <button type="button" class="btn btn-primary" id="same"> S speed = W speed </button>
    <button type="button" class="btn btn-primary" id="bigger"> S speed > W speed </button>
    <button type="button" class="btn btn-secondary" id="pauseResume">Pause/Resume</button>
	<button type="button" class="btn btn-warning"
		onclick="alert(
		'DOPPLER EFFECT\n\n' +
		'The Doppler effect is the apparent change in frequency or wavelength of a wave due to relative motion between the source and observer.\n\n' +
		'WHAT YOU CAN DO WITH THIS SIMULATION:\n\n' +
		'1. Stationary Source: Observe spherical waves expanding uniformly in all directions.\n\n' +
		'2. Source speed < Wave speed: Observe compressed wavefronts in front of the moving source and stretched wavefronts behind it.\n\n' +
		'3. S speed = W speed: Observe wavefronts accumulating in front of the source (Mach 1).\n\n' +
		'4. S speed > W speed: Observe the formation of a Mach cone when the source travels faster than the waves. The wavefronts overlap and form a shock wave. When this shock wave reaches an observer, the sudden change in air pressure produces a loud sound called a sonic boom, commonly heard when a supersonic aircraft flies overhead.\n\n' +
		'5. Pause/Resume: Pause or continue the animation.\n\n' +
		'6. Use your mouse to rotate, zoom, and explore the 3D wave patterns.\n\n' +
		'Compare the different source speeds to understand the Doppler effect and shock waves.'
		)">
		Information
	</button>
    
  </div>

  <script type="module">   
    import * as THREE from '../jsm/three.module.js';  
    import { OrbitControls } from '../jsm/OrbitControls.js';  

    var container, camera, scene, light, renderer, controls;
    let source, waveSpheres = [], waveSpeed = 0.3, sourceSpeed = 0;
    let time = 0, isAnimating = true;
    let isPaused = false; 

    init();
    animate();

    function init() {
      container = document.getElementById('container');
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1f33);
      
      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 20000);
      camera.position.set(0, 0, 100);  // Move the camera directly along the Z-axis
      //camera.lookAt(0, 0, 0);
      
      light = new THREE.DirectionalLight(0xffffff, 0.8);
      scene.add(light);
      var amlight = new THREE.AmbientLight(0x404040); 
      scene.add(amlight);
      var pointlight = new THREE.PointLight(0xfaef28, 1, 100);
      pointlight.position.set(10, 25, 30);
      scene.add(pointlight);  

      addSource();
      
      controls = new OrbitControls(camera, renderer.domElement);
      
      document.getElementById('still').addEventListener('click', () => { setSourceSpeed(0); });
      document.getElementById('smaller').addEventListener('click', () => { setSourceSpeed(0.2); });
      document.getElementById('same').addEventListener('click', () => { setSourceSpeed(0.3); });
      document.getElementById('bigger').addEventListener('click', () => { setSourceSpeed(0.5); });
      document.getElementById('pauseResume').addEventListener('click', function() {
	  if (isPaused) {
	    isPaused = false;
	    this.textContent = 'Pause';
	    animate();  // Resume animation
	  } else {
	    isPaused = true;
	    this.textContent = 'Resume';
	  }
      });
      window.addEventListener('resize', onWindowResize, false);      
    }   

    function addSource() {  
       var cGeometry = new THREE.SphereGeometry(1, 32, 32);
       source = new THREE.Mesh(cGeometry, new THREE.MeshBasicMaterial({ color: 'red' }));
       scene.add(source);
       source.position.set(-100, 0, 0);
    }

    function updateWaves() {
      for (let i = 0; i < waveSpheres.length; i++) {
        waveSpheres[i].radius += waveSpeed;
        waveSpheres[i].wave.scale.set(waveSpheres[i].radius, waveSpheres[i].radius, waveSpheres[i].radius);
      }
    }
    function moveSource() {
	  source.position.x += sourceSpeed; // * waveSpeed;
	
	  // Define the right edge of the screen
	  const screenEdge = window.innerWidth / 10;  // Adjust this value as necessary
	
	  // If the source moves out of the screen on the right, reset its position to the start
	  if (source.position.x > screenEdge) {
	    source.position.x = -100;  // Reset to initial position
	    
	    // Remove all existing sphere surfaces
	    for (let i = 0; i < waveSpheres.length; i++) {
	      scene.remove(waveSpheres[i].wave);  // Remove each wave sphere from the scene
	    }
	    waveSpheres = [];  // Clear the array holding the wave spheres
	  }
    }

    function animate() {
	  if (isPaused) return;  // Stop the animation loop when paused
	
	  requestAnimationFrame(animate);
	  time += 0.01;
	
	  if (time > 0.5) {  // Emit a wave every 0.5 seconds
	    createSoundWave();
	    time = 0;
	  }
	
	  updateWaves();
	  moveSource();
	  
	  controls.update();
	  renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
