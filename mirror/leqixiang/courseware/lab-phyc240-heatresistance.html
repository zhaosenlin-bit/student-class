            controls = new OrbitControls(camera, renderer.domElement);

            light = new THREE.DirectionalLight(0xFFFFFF, 0.15);

console.log('Camera Position:', camera.position);

        function setOnOff() {
            is_fired = !is_fired;
            if (is_fired) {

        function addFire() {
          
            fire = new VolumetricFire(
                fireWidth,
                fireWidth * 2.5,
                fireDepth,
                0.5,
                camera
            );

            // Validate the fire mesh geometry
            if (fire.mesh.geometry.attributes.position.array.some(v => isNaN(v))) {
                console.error('NaN detected in fire mesh geometry:', fire.mesh.geometry.attributes.position.array);
            }

            fire.mesh.position.set(0, 4, 0);
            scene.add(fire.mesh);
        }
        function createSpring(posX, posY, posZ) {
            var TWO_PI = Math.PI * 2.0;
            var ANGLE_INCR = Math.PI / 12;

            var height = (-45 - posX);  // -65
            var cylX = (-50 - height * 0.5);  // spring's top  -70

            var y, z;
            var x = height / 2;
            var radius = 2.6;
            var n = 0;
            var xIncr = height / (TWO_PI / ANGLE_INCR * NTWISTS);
            var helix = [];
            var springMaterial = new THREE.MeshLambertMaterial({ color: "brown" });

            for (var phi = 0; phi <= TWO_PI * NTWISTS; phi += ANGLE_INCR) {
                y = posY + Math.cos(phi) * radius;
                x -= xIncr / 4;
                z = posZ + Math.sin(phi) * radius;
                helix.push(new THREE.Vector3(x, y, z));
                n++;
            }

            var curve = new THREE.CatmullRomCurve3(helix);
            var geometry = new THREE.TubeGeometry(curve, n, 0.5, 36, false);
            springMesh = new THREE.Mesh(geometry, springMaterial);
            springMesh.position.set(posX, posY, posZ);

            scene.add(springMesh);
        }
        function addHotPlate() {
            var ballGeom = new THREE.BoxGeometry(6, 2.5, 6);
            hotplate = new THREE.Mesh(ballGeom, new THREE.MeshPhongMaterial({ color: "black" }));

            scene.add(hotplate);

        function addSphere(x, y, z) {
            var ballGeom = new THREE.SphereGeometry(0.7, 32, 24);
            ball = new THREE.Mesh(ballGeom, new THREE.MeshPhongMaterial({ color: "white" }));
            ball.position.set(x, y, z);
            scene.add(ball);
        }
        function addBlue(x1, y1, z1, x2, y2, z2) {
            var arr = [new THREE.Vector3(x1, y1, z1),
            new THREE.Vector3(x2, y2, z2)];
            var mat = new THREE.MeshLambertMaterial({ color: "gray" });
            var curve = new THREE.CatmullRomCurve3(arr);
            var geometry = new THREE.TubeGeometry(curve, 100, 0.2, 36, false);
            var str = new THREE.Mesh(geometry, mat);
            scene.add(str);
            return str;
        }

        function createLightBulb() {
            // Create the sphere geometry
            const radius = 4; // Radius of the sphere
            const widthSegments = 32; // Number of horizontal segments
            const heightSegments = 32; // Number of vertical segments
            const sphereGeometry = new THREE.SphereGeometry(radius, widthSegments, heightSegments);

            // Scale the geometry to create an American football shape
            sphereGeometry.scale(1, 1, 1.4);

            // Create the material
            const textureLoader = new THREE.TextureLoader();
            var clearMaterial = new THREE.MeshPhongMaterial({
                color: 'red',
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.2
            });

            // Create the mesh
            const bulb = new THREE.Mesh(sphereGeometry, clearMaterial);

            // Create laces
            const laceGeometry = new THREE.BoxGeometry(0.1, 0.02, 1.2);
            const laceMaterial = new THREE.MeshPhongMaterial({ color: 0xffffff });

            const lace1 = new THREE.Mesh(laceGeometry, laceMaterial);
            lace1.position.set(0, 0.5, 0);
            bulb.add(lace1);

            const lace2 = new THREE.Mesh(laceGeometry, laceMaterial);
            lace2.position.set(0, -0.5, 0);
            bulb.add(lace2);

            const laceSegmentGeometry = new THREE.BoxGeometry(0.02, 0.02, 0.2);
            const laceSegmentMaterial = new THREE.MeshPhongMaterial({ color: 0xffffff });

            for (let i = -0.5; i <= 0.5; i += 0.2) {
                const laceSegment = new THREE.Mesh(laceSegmentGeometry, laceSegmentMaterial);
                laceSegment.position.set(0, i, 0.6);
                bulb.add(laceSegment);
            }
            // add the lamp base
            const basegeo = new THREE.CylinderGeometry(3, 3, 2, 32);
            const base = new THREE.Mesh(basegeo, new THREE.MeshPhongMaterial({ color: "purple" }));
            base.position.set(0, -5.5, 25);
            scene.add(base);

            // Add the lamp to the scene
            bulb.rotation.x = Math.PI / 2;
            bulb.position.set(0, 0, 25);
            scene.add(bulb);

        }
        function addSmallText(x, y, z, t) {

        function addRing(innerRadius, outerRadius, heigth, Segments, x, y, z) {
            var extrudeSettings = {
                amount: heigth,
                bevelEnabled: false,
                curveSegments: Segments
            };
            var arcShape = new THREE.Shape();
            arcShape.moveTo(outerRadius, 0);
            arcShape.absarc(0, 0, outerRadius, 0, Math.PI * 2, false);

            var holePath = new THREE.Path();
            holePath.moveTo(innerRadius, 0);
            holePath.absarc(0, 0, innerRadius, 0, Math.PI * 2, true);
            arcShape.holes.push(holePath);

            var geometry = new THREE.ExtrudeGeometry(arcShape, extrudeSettings);

            var material = new THREE.MeshPhongMaterial({
                color: 'black'
            });

            var mesh = new THREE.Mesh(geometry, material);
            mesh.rotation.x = Math.PI / 2;
            mesh.position.set(x, y, z);
            scene.add(mesh);
        }
        function addPowerSupply(x, y, z, alpha) {
            const geometry = new THREE.BoxGeometry(12, 8, 6);
            var texture = textureloader.load('/Phyc240/textures/power-supply.png');
            const material = new THREE.MeshBasicMaterial({ color: 'white' });
            const box = new THREE.Mesh(geometry, material);
            var volt_geometry = new THREE.BoxGeometry(11.8, 7.8, 0.2);
            var volt_material = new THREE.MeshPhongMaterial({
                map: texture
            });
            var screen = new THREE.Mesh(volt_geometry, volt_material);
            box.add(screen);
            screen.position.set(0, 0, 3.3);
            box.position.set(x, y, z);
            box.rotation.y = alpha;
            scene.add(box);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);

        function render() {
           const elapsedTime = clock.getElapsedTime();
            fire.update(elapsedTime);
           if (rtCanvas && rtCanvas.material && rtCanvas.material.uniforms && rtCanvas.material.uniforms.time) {
                rtCanvas.material.uniforms.time.value = elapsedTime;
            }
            controls.update();
            requestAnimationFrame(render);
            renderer.render(scene, camera);
        }
