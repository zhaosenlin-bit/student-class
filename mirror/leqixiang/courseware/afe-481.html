<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>数学盲盒抽题卡 | 西师版五年级下册（横屏桌面版·题库已更新）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #f3e8ff 0%, #e9d5ff 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Fredoka One', 'Comic Neue', 'Segoe UI', 'Poppins', system-ui;
            padding: 1.5rem;
            transition: background 0.08s linear;
        }
        body.correct-flash {
            background: radial-gradient(circle, #fff5e0, #f3e8ff);
        }
        .game-container {
            max-width: 1400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 88px;
            box-shadow: 0 25px 45px rgba(128, 0, 255, 0.2);
            padding: 1.8rem 2rem 2.5rem;
            border: 3px solid white;
        }
        .header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header h1 {
            font-size: 3.2rem;
            background: linear-gradient(135deg, #a855f7, #c084fc, #8b5cf6);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 4px 4px 12px rgba(160, 120, 255, 0.3);
        }
        .header p {
            font-size: 1.2rem;
            background: #f9f4ff;
            display: inline-block;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            color: #6b21a5;
            font-weight: bold;
            margin-top: 8px;
        }
        .upload-bar {
            background: #ffffffcc;
            border-radius: 60px;
            padding: 0.6rem 1.5rem;
            margin-bottom: 1.2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.8rem;
            border: 1px solid #e9d5ff;
        }
        .upload-label {
            background: #e0d4ff;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: bold;
            color: #4c1d95;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }
        .upload-label:hover {
            background: #c084fc;
            color: white;
        }
        .upload-status {
            font-size: 0.85rem;
            color: #6b21a5;
            background: #fef9c3;
            padding: 4px 12px;
            border-radius: 30px;
        }
        .reset-default {
            background: #facc15;
            border: none;
            padding: 6px 16px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }
        .control-bar {
            background: #ffffffcc;
            border-radius: 60px;
            padding: 1rem 1.8rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 8px 16px rgba(128, 0, 255, 0.1);
            border: 1px solid #e9d5ff;
        }
        .unit-selector {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f5efff;
            padding: 0.3rem 1.2rem;
            border-radius: 48px;
        }
        .unit-selector label {
            font-weight: bold;
            color: #5b21b6;
            font-size: 1.2rem;
        }
        select {
            background: white;
            border: 2px solid #c084fc;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #4c1d95;
            cursor: pointer;
            font-family: inherit;
        }
        .mode-group {
            display: flex;
            gap: 16px;
            background: #f5efff;
            padding: 0.3rem 1.2rem;
            border-radius: 48px;
        }
        .mode-btn {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            font-weight: bold;
            padding: 8px 28px;
            border-radius: 40px;
            cursor: pointer;
            color: #6b21a5;
            transition: 0.2s;
        }
        .mode-btn.active {
            background: #a855f7;
            color: white;
            box-shadow: 0 6px 12px #c084fc;
        }
        .draw-card-btn {
            background: #facc15;
            border: none;
            font-size: 1.8rem;
            font-weight: bold;
            padding: 12px 32px;
            border-radius: 80px;
            color: #3b0764;
            cursor: pointer;
            box-shadow: 0 8px 0 #ca8a04;
            transition: 0.1s linear;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .draw-card-btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #ca8a04;
        }
        .card {
            background: #ffffffea;
            border-radius: 68px;
            padding: 2rem 2rem 1.8rem;
            margin: 20px 0 25px;
            box-shadow: 0 20px 35px rgba(107, 33, 168, 0.25);
            border: 3px solid #f3e8ff;
            transition: 0.05s linear;
        }
        .card.card-win {
            animation: shakeWin 0.2s ease-in-out 2;
        }
        @keyframes shakeWin {
            0% { transform: translate(0,0);}
            25% { transform: translate(3px, -1px);}
            75% { transform: translate(-3px, 1px);}
            100% { transform: translate(0,0);}
        }
        .question-area {
            min-height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.8rem;
            line-height: 1.4;
            font-weight: 600;
            color: #2d1b4e;
            background: #fffbfe;
            border-radius: 52px;
            padding: 1.2rem;
            word-break: break-word;
        }
        .answer-area {
            margin-top: 20px;
            background: #f5f0fe;
            border-radius: 48px;
            padding: 1.2rem;
            font-size: 1.5rem;
            color: #4c1d95;
            border-left: 12px solid #a855f7;
            font-weight: 500;
            word-break: break-word;
        }
        .example-area {
            margin-top: 20px;
            background: #fff7e5;
            border-radius: 48px;
            padding: 1.2rem;
            font-size: 1.3rem;
            color: #b45309;
            border-left: 12px solid #f97316;
            font-weight: 500;
            word-break: break-word;
        }
        .example-placeholder {
            opacity: 0.7;
            font-style: italic;
            color: #d97706;
        }
        .answer-placeholder {
            opacity: 0.7;
            font-style: italic;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .btn {
            font-size: 1.3rem;
            padding: 10px 24px;
            border-radius: 60px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            transition: 0.05s linear;
            font-family: inherit;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }
        .btn-answer { background: #2dd4bf; color: #115e59; border-bottom: 3px solid #14b8a6; }
        .btn-correct { background: #f97316; color: #431407; border-bottom: 3px solid #ea580c; }
        .btn-example { background: #facc15; color: #78350f; border-bottom: 3px solid #eab308; }
        .btn-example-answer { background: #a855f7; color: white; border-bottom: 3px solid #7c3aed; }
        .status-line {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .mode-badge, .counter-badge {
            background: #d9c6ff;
            border-radius: 30px;
            padding: 4px 14px;
            font-weight: bold;
            color: #4a0e78;
        }
        .counter-badge { background: #fbbf24; }
        .cheer-float {
            position: fixed;
            font-size: 2.2rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 2000;
            animation: floatUp 1.2s ease-out forwards;
            text-shadow: 2px 2px 8px gold;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0px) scale(0.7);}
            100% { opacity: 0; transform: translateY(-120px) scale(1.3);}
        }
        .challenge-toast {
            position: fixed;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: #ffd966;
            color: #2b0f44;
            font-size: 2rem;
            font-weight: bold;
            padding: 12px 28px;
            border-radius: 60px;
            z-index: 1000;
            animation: bouncePop 0.4s ease forwards;
            pointer-events: none;
        }
        @keyframes bouncePop {
            0% { opacity: 0; transform: translateX(-50%) scale(0.5);}
            70% { opacity: 1; transform: translateX(-50%) scale(1.1);}
            100% { opacity: 0; transform: translateX(-50%) scale(1); display: none;}
        }
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
        @media (max-width: 700px) {
            .question-area { font-size: 1.3rem; }
            .btn { font-size: 1rem; padding: 8px 16px; }
            .draw-card-btn { font-size: 1.4rem; padding: 8px 20px; }
            .header h1 { font-size: 2.3rem; }
            .example-area { font-size: 1.1rem; }
        }
        footer { text-align: center; margin-top: 20px; font-size: 0.8rem; color: #7e5a9f; }
        input[type="file"] { display: none; }
    </style>
