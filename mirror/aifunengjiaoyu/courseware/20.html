            flex-direction: column;

            display: flex;
            align-items: center;
            gap: 1rem;
            z-index: 100;
        }

            align-items: center;
            gap: 0.8rem;
            height: 44px;

            min-width: auto;

            flex-direction: row;
            align-items: center;

            white-space: nowrap;

            -webkit-backdrop-filter: blur(20px);

            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            white-space: nowrap;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(230, 0, 18, 0.3);
        }
        .btn-outline {
            color: var(--text);
            border: 1px solid rgba(0,0,0,0.05);
        }
        .btn-outline.active {
            background: var(--text);
            color: white;
        }
        .btn-reset {
            background: rgba(255, 255, 255, 0.8);
            color: #666;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-outline {
            border: 2px solid var(--primary);
            color: var(--primary);
            background: transparent;
        }
        .btn-outline.active {
            background: var(--primary);
            color: white;
        }
        .workspace {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        .target-area {
            position: absolute;
            top: 50%;
            right: 10%;

            opacity: 0;
