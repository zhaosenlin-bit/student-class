	<style>
		body {
		  color: black !important;
		}
	.control-panel {
	  margin: 10px auto 10px 50px; /* top, right, bottom, left */
	  background-color: #eee;
	  border: 2px solid #333;
	  border-radius: 8px;
	  padding: 15px;
	  width: 220px;
	  font-family: Arial, sans-serif;
	  text-align: center;
	}
	.control-panel-right {
	  position: absolute;
	  top: 90px;
	  right: 50px;
	  background-color: #eee;
	  border: 2px solid #333;
	  border-radius: 8px;
	  padding: 15px;
	  width: 220px;
	  text-align: center;
	}
	
	.control-group {
	  margin-bottom: 15px;
	}
	
	.slider-row {
	  display: flex;
	  justify-content: space-between;
	  align-items: center;
	}
	
	input[type="range"] {
	  width: 65%;
	  accent-color: blue;
	}
	
	input[type="text"] {
	  width: 80px;
	  font-weight: bold;
	  text-align: center;
	  color: blue;
	}
	
	.minmax {
	  display: flex;
	  justify-content: space-between;
	  font-size: 12px;
	  margin-top: 5px;
	}

<body>

<div id="container"></div>

<div id="info">
	<h1>Energy Flow in a Fridge or Air Conditioner</h1>
	<div class="control-panel">
		<div class="control-group">
		  High Temperature (K):
		  <div class="slider-row">
		    <input type="range" id="highTempSlider" min="300" max="340" step="1" value="320">
		    <input type="text" id="highValue" value="320" readonly>
		  </div>
		  <div class="minmax"><span>300</span><span>340</span></div>
		</div>
		<div class="control-group">
		  Low Temperature (K):
		  <div class="slider-row">
		    <input type="range" id="lowTempSlider" min="240" max="290" step="1" value="290">
		    <input type="text" id="lowTempValue" value="290" readonly>
		  </div>
		  <div class="minmax"><span>240</span><span>290</span></div>
		</div>
		<div class="control-group">
		  Percentage of ideal COP (%):
		  <div class="slider-row">
		    <input type="range" id="percentageEff" min="0" max="100" step="1" value="100">
		    <input type="text" id="percentageEffValue" value="100" readonly>
		  </div>
		  <div class="minmax"><span>0</span><span>100</span></div>
		</div>
		<div class="control-group">
		  Work Input (J):
		  <input type="text" id="workValue" value="11.5" readonly>
		</div>
		<button class="btn btn-danger" onclick="
		  alert('A refrigerator or air conditioner uses work (W) to transfer heat (Qᴸ) from a cold region to a hot region, against the natural direction of heat flow.\n\n' +
		  'Key Formulas:\n\n' +
		  '1. First Law: Qᴴ = Qᴸ + W\n' +
		  '2. Carnot COP: COP₍ideal₎ = Tᴸ / (Tᴴ - Tᴸ)\n' +
		  '3. Actual COP = Qᴸ / W\n\n' +
		  'Where:\n' +
		  '- Qᴸ: heat absorbed from the cold reservoir (J)\n' +
		  '- Qᴴ: heat rejected to the hot reservoir (J)\n' +
		  '- W: work input (J)\n' +
		  '- Tᴴ: hot temp (K), Tᴸ: cold temp (K)\n' +
		  '- COP: coefficient of performance (higher is better)');
		  alert('Applications of Refrigerators and Air Conditioners:\n\n' +
		  '- Domestic and commercial refrigeration systems.\n' +
		  '- Air conditioning units for cooling buildings.\n' +
		  '- Heat pumps used for both heating and cooling spaces.\n\n' +
		  'Note: Carnot COP is the maximum theoretical performance. Real devices have lower COP due to losses.');
		">
		  Energy Flow in Fridge
		</button>
		
		<button class="btn btn-success" style="margin-top:10px;" onclick="
		  alert(
		    'What is a Heat Pump?\n\n' +
		    'A heat pump is a device that uses work, usually electrical energy, to transfer heat from a colder region to a warmer region.\n\n' +
		    'It works on the same basic principle as a refrigerator or air conditioner, but the useful output is usually the heat delivered to the warm region.\n\n' +
		    'In this simulation:\n' +
		    '• Qᴸ is heat absorbed from the cold reservoir.\n' +
		    '• W is the work supplied to the heat pump.\n' +
		    '• Qᴴ is the heat delivered to the hot reservoir.\n\n' +
		    'Energy conservation gives:\n' +
		    'Qᴴ = Qᴸ + W\n\n' +
		    'A heat pump does not create heat. It moves heat from one place to another while using external work.'
		  );
		">
		  What is a Heat Pump?
		</button>
		
	</div>
	<div class="control-panel-right">
		<div class="control-group">
		  Heat Extracted Qc (J):
		  <div class="slider-row">
		    <input type="range" id="heatSlider" min="50" max="200" step="1" value="100">
		    <input type="text" id="heatValue" value="100" readonly>
		  </div>
		  <div class="minmax"><span>50</span><span>200</span></div>
		</div>
		<div class="control-group">
		  Heat Dumped Qh (J):
		  <input type="text" id="heatRejectedValue" value="110.3" readonly>
		</div>
		<div class="control-group">
		  Ideal COP:
		  <input type="text" id="carnotEff" value="9.7" readonly>
		</div>
		<div class="control-group">
		  Actual COP:
		  <input type="text" id="actualEff" value="9.7" readonly>
		</div>
		<button class="btn btn-success" id="reset">Reset</button>
		
	</div>
</div>
