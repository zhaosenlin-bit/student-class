<body>
	<div id="info" style="text-align: left"> 
		<h1 style="text-align: center">Apparent Weight </h1>
		
 <!-- Left Panel -->  
	    <div class="control-panel">
		<div class="control-group">
		  Lower the Metal:
		  <div class="slider-row" style="display: flex; align-items: center;">
		    <input type="range" id="posSlider" min="-10" max="15" step="1" value="15" style="flex: 1; margin-right: 8px;">
		    <input type="text" id="posValue" value="15" readonly style="width: 80px; text-align: center; color: blue; font-weight: bold;">
		  </div>
		  <div class="minmax" style="display: flex; justify-content: space-between; margin-top: 4px;">
		    <span>-10</span>
		    <span>15</span>
		  </div>
		</div>
		    
		<div class="control-group">	 
		  <div class="slider-row">
		    Metal: <select id="metalSelector">
		      <option value="0.897">Aluminum</option>
		      <option value="0.385" selected>Copper</option>
		      <option value="0.5">Unknown </option>
		    </select>
		  </div>
		</div>
			    
		<div class="control-group">
		  Mass (g):
		  <div class="slider-row" style="display: flex; align-items: center;">
		    <input type="range" id="massMetalSlider" min="300" max="700" step="10" value="500" style="flex: 1; margin-right: 8px;">
		    <input type="text" id="massMetalValue" value="500" readonly style="width: 80px; text-align: center; color: blue; font-weight: bold;">
		  </div>
		  <div class="minmax" style="display: flex; justify-content: space-between; margin-top: 4px;">
		    <span>300</span>
		    <span>700</span>
		  </div>
		</div>
		    
		  <div class="control-group">
		    Temperature (°C):
		    <div class="slider-row">
		      <input type="range" id="tempMetalSlider" min="10" max="100" step="1" value="20">
		      <input type="text" id="tempMetalValue" value="20" readonly>
		    </div>
		    <div class="minmax">
		      <span>10</span>
		      <span>100</span>
		    </div>
		  </div>
		 <button class="btn btn-success" id="reset">Reset</button>
		    
		  <div class="control-group">
		    Apparent Weight:
		    <input type="text" id="finalTemp" value="0.0°" readonly style="width: 90px;">
		  </div>
	</div>
	<!-- Right Panel -->
	      <div class="control-panel-right">
		      
		<div class="control-group"> 
		  <div class="slider-row">
		    Liquid: <select id="liquidSelector">
		      <option value="2.14">Coconut Oil</option>
		      <option value="1.97">Olive Oil</option>
		      <option value="4.184" selected>Water</option>
		      <option value="3.0">Unknown</option>
		    </select>
		  </div>
		</div>
	  			
		  <div class="control-group">
		    Mass (g):
		    <div class="slider-row">
		      <input type="range" id="massLiquidSlider" min="1200" max="2000" step="10" value="1500">
		      <input type="text" id="massLiquidValue" value="1500" readonly>
		    </div>
		    <div class="minmax">
		      <span>1200</span><span>2000</span>
		    </div>
		  </div>
			
		  <div class="control-group">
		    Temp (°C):
		    <div class="slider-row">
		      <input type="range" id="tempLiquidSlider" min="10" max="100" step="1" value="20">
		      <input type="text" id="tempLiquidValue" value="20" readonly>
		    </div>
		    <div class="minmax">
		      <span>10</span><span>100</span>
		    </div>
		  </div>
		<button class="btn btn-danger" onclick="
		  alert('This simulation demonstrates apparent weight — the weight an object seems to have when submerged in a fluid.\n\n' +
		        'Key Concepts:\n' +
		        '- Apparent weight = True weight - Buoyant force\n' +
		        '- Buoyant force depends on the density of the liquid and the volume of the submerged object.\n\n' +
		        'This simulation takes into account:\n' +
		        '• Different metal materials (affecting mass and thermal expansion)\n' +
		        '• Different liquids, each with unique density and thermal behavior\n' +
		        '• The temperature of both the metal and the liquid, which alters volume and density\n\n' +
		        'Adjust the sliders to explore how these factors combine to influence the final apparent weight.'
		  );
		  alert('Material Densities Used:\n' +
		        '- Aluminum: 2.70 g/cm³\n' +
		        '- Copper: 8.96 g/cm³\n' +
		        '- Unknown Metal: ~7.85 g/cm³\n' +
		        'Liquid Densities at 20°C:\n' +
		        '- Water: 1.000 g/cm³\n' +
		        '- Olive Oil: ~0.920 g/cm³\n' +
		        '- Coconut Oil: ~0.924 g/cm³\n' +
		        '- Unknown Liquid: ~0.850 g/cm³\n\n' +
		        'Formulas Used:\n' +
		        '• Apparent Weight = mg − ρ·g·V_submerged\n' +
		        '• ρ(T) = ρ₀ · (1 − β·(T − 20))\n' +
		        '• V(T) = V₀ · (1 + 3α·(T − 20))\n\n' +
		        'Where:\n' +
		        '- β ≈ 0.0004 /°C (thermal expansion of liquids)\n' +
		        '- α ≈ 25×10⁻⁶ /°C (thermal expansion of metals)'
		  );
		">What is Apparent Weight?</button>

		
		      
	    </div>	

	</div>           
	<div id="viewport"></div>
</body>
</html>
