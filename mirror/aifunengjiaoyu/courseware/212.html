<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>公式争霸 · 物理双人竞赛</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0b1a2e 0%, #1b3b5a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 16px;
        }

        .game-container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            border-radius: 64px 64px 48px 48px;
            padding: 16px 20px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s;
        }

        .game-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 0 12px 0;
            gap: 10px;
            flex-wrap: wrap;
        }

        .game-title {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px #fbbf2480;
            filter: drop-shadow(0 4px 6px #00000050);
            padding: 0 12px;
            background-clip: text;
        }

        .game-sub {
            font-size: 18px;
            color: #b6d0e6;
            background: rgba(0,0,0,0.3);
            padding: 4px 22px;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            border: 1px solid #4b6f8a;
        }

        .arena {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
        }

        .player-zone {
            flex: 1 1 280px;
            min-width: 260px;
            background: rgba(20, 40, 60, 0.6);
            backdrop-filter: blur(2px);
            border-radius: 48px 48px 32px 32px;
            padding: 18px 12px 20px;
            box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.4), 0 8px 20px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .player-zone.left {
            border-top: 6px solid #ff7b5a;
        }
        .player-zone.right {
            border-top: 6px solid #5ad4ff;
        }

        .character-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            margin-bottom: 10px;
        }

        .sprite-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100px;
            margin: 6px 0 2px;
        }

        .sprite {
            font-size: 70px;
            line-height: 1;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.5));
            transition: transform 0.2s;
            display: inline-block;
            transform-origin: bottom;
        }

        .sprite.bounce {
            animation: bouncePop 0.4s ease;
        }

        @keyframes bouncePop {
            0% { transform: scale(1) translateY(0); }
            40% { transform: scale(1.25) translateY(-12px); }
            70% { transform: scale(0.9) translateY(4px); }
            100% { transform: scale(1) translateY(0); }
        }

        .life-bar {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 6px 0 2px;
            flex-wrap: wrap;
        }

        .life-heart {
            font-size: 26px;
            transition: all 0.2s;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .life-heart.lost {
            opacity: 0.2;
            transform: scale(0.7);
            filter: grayscale(1);
        }

        .score-badge {
            font-size: 22px;
            font-weight: 700;
            background: rgba(0, 0, 0, 0.5);
            padding: 4px 18px;
            border-radius: 60px;
            color: #f0eae1;
            letter-spacing: 1px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 215, 150, 0.2);
            margin-top: 2px;
        }

        .player-name {
            font-weight: 600;
            font-size: 20px;
            color: #d4e8ff;
            text-shadow: 0 2px 3px black;
            background: rgba(0,0,0,0.3);
            padding: 0 20px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
            margin-bottom: 4px;
        }

        .quiz-card {
            background: rgba(12, 25, 42, 0.8);
            backdrop-filter: blur(4px);
            border-radius: 36px;
            padding: 16px 12px 12px;
            width: 100%;
            margin: 6px 0 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 0 0 1px rgba(255,255,240,0.05), 0 6px 14px rgba(0, 0, 0, 0.6);
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #f7f1e4;
            text-align: center;
            background: #1f3b4f;
            padding: 10px 6px;
            border-radius: 60px;
            margin-bottom: 16px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
            letter-spacing: 0.3px;
            border: 1px solid #3a5d78;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-btn {
            background: #2a4359;
            border: none;
            border-radius: 60px;
            padding: 12px 0;
            font-size: 18px;
            font-weight: 600;
            color: #f0f6fc;
            box-shadow: 0 6px 0 #0f1e2b, 0 4px 8px rgba(0,0,0,0.4);
            transition: all 0.06s linear;
            cursor: pointer;
            text-align: center;
            border: 1px solid #4d718b;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0f1e2b;
        }

        .option-btn.correct-feedback {
            background: #3bb87a;
            border-color: #b3ffcf;
            box-shadow: 0 0 12px #7ae9a5;
        }

        .option-btn.wrong-feedback {
            background: #c74b4b;
            border-color: #ff9a8a;
        }

        .option-btn:disabled {
            opacity: 0.6;
            filter: grayscale(0.3);
            transform: translateY(2px);
            box-shadow: 0 3px 0 #0f1e2b;
            cursor: not-allowed;
        }

        .victory-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(6px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .victory-overlay.show {
            display: flex;
        }

        .victory-box {
            background: radial-gradient(circle at 30% 20%, #fde68a, #f59e0b);
            padding: 30px 50px;
            border-radius: 120px;
            box-shadow: 0 0 70px #fbbf24, 0 20px 40px black;
            text-align: center;
            max-width: 90vw;
            border: 4px solid #ffd966;
        }

        .victory-emoji {
            font-size: 80px;
            line-height: 1.2;
        }

        .victory-text {
            font-size: 48px;
            font-weight: 800;
            color: #1e293b;
            text-shadow: 0 4px 0 #fcd34d;
            margin: 8px 0;
        }

        .victory-sub {
            font-size: 24px;
            color: #2d1f00;
            background: #fffbeb;
            padding: 6px 24px;
            border-radius: 60px;
            display: inline-block;
        }

        .restart-btn {
            margin-top: 30px;
            background: #0f2b3b;
            border: none;
            color: white;
            font-size: 28px;
            font-weight: bold;
            padding: 16px 48px;
            border-radius: 80px;
            box-shadow: 0 10px 0 #05131f, 0 6px 20px black;
            cursor: pointer;
            transition: 0.06s linear;
            border: 1px solid #608aa8;
        }

        .restart-btn:active {
            transform: translateY(6px);
            box-shadow: 0 4px 0 #05131f;
        }

        .footer-controls {
            display: flex;
            justify-content: center;
            margin: 16px 0 0;
        }

        .reset-small {
            background: #293d4e;
            border: none;
            color: #d4e4f0;
            padding: 8px 24px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 18px;
            box-shadow: 0 4px 0 #121f2b;
            cursor: pointer;
            transition: 0.06s;
            border: 1px solid #4d6d82;
        }

        .reset-small:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #121f2b;
        }

        @media (max-width: 650px) {
            .player-zone { min-width: 100%; }
            .options-grid { grid-template-columns: 1fr 1fr; }
            .victory-text { font-size: 34px; }
            .game-title { font-size: 28px; }
        }
    </style>
</head>
