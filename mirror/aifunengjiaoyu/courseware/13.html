<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR 物理课堂 - 安培定则 (高亮版)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Microsoft YaHei', sans-serif; }
        
        #video-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; overflow: hidden; background: #000;
        }
        #input-video {
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); /* 镜像翻转 */
            opacity: 0.8; /* 修改：提高不透明度 (原0.5) */
            filter: brightness(1.1); /* 修改：增加一点亮度滤镜 */
        }

        #canvas-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1; pointer-events: none;
        }
        
        #ui-layer {
            position: absolute; top: 20px; left: 20px; z-index: 20; color: #fff; pointer-events: none; 
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
        }
        
        h1 { margin: 0; font-size: 28px; color: #00ffff; letter-spacing: 2px; }
        .subtitle { font-size: 16px; color: #aaa; margin-top: 5px; }

        .panel {
            margin-top: 20px; background: rgba(0, 15, 30, 0.85); padding: 15px;
            border-radius: 8px; border-left: 4px solid #00ffff; backdrop-filter: blur(5px);
            pointer-events: auto; max-width: 320px;
        }

        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center;
            pointer-events: auto;
        }
        
        .big-btn {
            background: linear-gradient(90deg, #00ffff, #0088ff); border: none; padding: 15px 40px;
            font-size: 20px; color: #000; font-weight: bold; border-radius: 50px; cursor: pointer;
            margin-top: 20px; box-shadow: 0 0 20px rgba(0, 255, 255, 0.5); transition: transform 0.2s;
        }
        .big-btn:hover { transform: scale(1.05); }

        #status-text { font-size: 18px; font-weight: bold; margin-bottom: 10px; min-height: 24px; color: #ff0;}
        
        .instruction-box {
            background: rgba(255,255,255,0.1); padding: 10px; border-radius: 5px; margin-top: 10px; font-size: 14px; color: #ddd;
        }
        .key-point { color: #00ffff; font-weight: bold; }
        .key-point-arrow { color: #ff3333; font-weight: bold; text-shadow: 0 0 10px #ff0000; }

        /* 3D标签样式 */
        .pole-label {
            position: absolute; font-weight: bold; font-family: Arial, sans-serif;
            font-size: 36px; padding: 5px 10px; border-radius: 50%;
            pointer-events: none; display: none; text-align: center; width: 60px; height: 60px; line-height: 60px;
            box-shadow: 0 0 15px rgba(255,255,255,0.5);
        }
        .label-n { background: #ff0000; color: white; border: 3px solid white; }
        .label-s { background: #0000ff; color: white; border: 3px solid white; }

        #error-msg {
            color: #ff5555; margin-top: 20px; font-size: 14px; max-width: 80%; display: none;
        }
    </style>
