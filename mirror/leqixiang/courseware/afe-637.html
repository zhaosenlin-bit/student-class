    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap');

        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        /* 统一淡蓝色渐变背景 */
        .bg-gradient-sky {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 40%, #7dd3fc 80%, #38bdf8 100%);
        }

        /* 玻璃拟态面板 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px 0 rgba(14, 116, 144, 0.12);
        }

        /* 按钮交互特效 */
        .btn-action {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-action:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.22);
        }
        .btn-action:active:not(:disabled) {
            transform: translateY(0);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* 数显电子表字体 */
        .digital-font {
            font-family: 'Share Tech Mono', monospace;
        }

        /* 自定义小按键 numpad */
        .num-key {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #cbd5e1;
            color: #1e293b;
            font-weight: 800;
            border-radius: 0.75rem;
            box-shadow: 0 3px 0 #94a3b8;
            transition: all 0.1s ease;
        }
        .num-key:hover {
            background: #ffffff;
            color: #0284c7;
            border-color: #38bdf8;
        }
        .num-key:active {
            transform: translateY(3px);
            box-shadow: 0 0 0 #94a3b8;
        }

        /* 抖动动画 (错误反馈) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }

        /* 截图/高对比打印模式 */
        body.screenshot-mode .glass-panel {
            background: #ffffff !important;
            border-color: #000000 !important;
            box-shadow: none !important;
        }
        body.screenshot-mode {
            background: #ffffff !important;
        }
    </style>
</head>

    <!-- UI Overlay Layer -->
    <div class="ui-layer w-full h-full flex flex-col justify-between p-3 md:p-5">
        
        <!-- Header Bar: 学科 - 年级 - 知识点 -->
        <header class="w-full flex flex-col lg:flex-row justify-between items-stretch lg:items-center gap-3">
            <div class="interactive glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3 shadow-md">
                <div class="bg-sky-500 text-white p-2.5 rounded-xl shadow-md shadow-sky-500/30">
                    <i class="fa-solid fa-clock text-2xl"></i>
                </div>
                <div>
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="bg-sky-100 text-sky-800 text-xs px-2.5 py-0.5 rounded-full font-bold border border-sky-300">
                            小学数学
                        </span>
                        <span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded-full font-bold border border-blue-300">
                            二年级上册
                        </span>
                        <span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-bold border border-emerald-300">
                            认识时间与钟表 · 3D 拨针与认读
                        </span>
                    </div>
                    <h1 class="text-lg md:text-xl font-black text-slate-800 tracking-tight mt-0.5">
                        认识时间与钟表 <span class="text-xs font-normal text-slate-500 hidden sm:inline-block">（3D 动态拨针与读数联动）</span>
                    </h1>
                </div>
            </div>

            <!-- View Camera Reset Badge -->
            <div class="interactive glass-panel p-1.5 rounded-2xl flex items-center gap-2 shadow-md self-start lg:self-center">
                <button onclick="set3DCameraView('front')" class="btn-action bg-sky-500 text-white px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-square-poll-vertical"></i> 正视图
                </button>
                <button onclick="set3DCameraView('iso')" class="btn-action bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-cube text-indigo-500"></i> 3D 斜视角
                </button>
                <button onclick="resetCamera()" class="btn-action bg-white hover:bg-slate-50 px-2.5 py-1.5 rounded-xl border border-slate-200 text-slate-700 font-bold text-xs shadow-sm flex items-center gap-1">
                    <i class="fa-solid fa-arrows-rotate text-sky-500"></i> 复位
                </button>
            </div>
        </header>

        <!-- Middle Main Workspace Layout -->
        <div class="w-full flex-1 flex flex-col lg:flex-row items-stretch justify-between my-2 gap-4 overflow-hidden pointer-events-none">
            
            <!-- Left Info Panel: Digital Clock Display & Core Controls -->
            <div class="interactive flex flex-col gap-3 w-full lg:w-80 justify-start self-start">
                
                <!-- Digital Time Banner Box -->
                <div class="glass-panel p-4 rounded-2xl shadow-sm border-t-4 border-t-sky-500 space-y-3">
                    <div class="flex items-center justify-between border-b border-slate-200 pb-2">
                        <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                            <i class="fa-solid fa-tv text-sky-500"></i> 电子表同步显示
                        </span>
                        <span id="stepModeBadge" class="bg-sky-100 text-sky-800 text-[11px] font-bold px-2.5 py-0.5 rounded-full border border-sky-300">
                            1分钟精度
                        </span>
                    </div>

                    <div id="digitalDisplayBox" class="bg-slate-900 text-emerald-400 p-3 rounded-xl border-2 border-slate-800 text-center shadow-inner">
                        <div id="digitalTimeText" class="digital-font text-5xl font-black tracking-widest text-emerald-400">
                            08:00
                        </div>
                    </div>

                    <!-- Pointer Toggle Buttons Grid -->
                    <div class="space-y-2">
                        <div class="text-[11px] font-bold text-slate-600">指针隐显与步长控制：</div>
                        <div class="grid grid-cols-2 gap-2 text-xs font-bold">
                            <button id="btnToggleDigital" onclick="toggleDigitalDisplay()" class="btn-action bg-white hover:bg-slate-50 border border-slate-200 p-2 rounded-xl text-slate-700 flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-eye-slash text-sky-500"></i> 隐藏时间
                            </button>
                            <button id="btnToggleHourHand" onclick="toggleHandVisibility('hour')" class="btn-action bg-white hover:bg-slate-50 border border-slate-200 p-2 rounded-xl text-slate-700 flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-clock-rotate-left text-slate-600"></i> 隐藏时针
                            </button>
                            <button id="btnToggleMinHand" onclick="toggleHandVisibility('minute')" class="btn-action bg-white hover:bg-slate-50 border border-slate-200 p-2 rounded-xl text-slate-700 flex items-center justify-center gap-1.5">
                                <i class="fa-solid fa-stopwatch text-indigo-500"></i> 隐藏分针
                            </button>
                            <button id="btnToggleTicking" onclick="toggleContinuousTicking()" class="btn-action bg-emerald-500 hover:bg-emerald-600 text-white p-2 rounded-xl flex items-center justify-center gap-1.5 shadow-md shadow-emerald-500/20">
                                <i id="tickingIcon" class="fa-solid fa-play"></i> <span id="tickingBtnText">继续计时</span>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Minute Step & Preset Controls -->
                <div class="glass-panel p-3.5 rounded-2xl shadow-sm space-y-2.5">
                    <div class="text-xs font-bold text-slate-700 flex items-center justify-between border-b border-slate-200 pb-2">
                        <span class="flex items-center gap-1.5"><i class="fa-solid fa-sliders text-amber-500"></i> 拨针吸附与随机出题</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-xs font-bold">
                        <button id="btnStep1Min" onclick="setMinuteStep(1)" class="btn-action bg-sky-500 text-white p-2 rounded-xl shadow-md shadow-sky-500/20">
                            每 1 分钟
                        </button>
                        <button id="btnStep5Min" onclick="setMinuteStep(5)" class="btn-action bg-white hover:bg-sky-50 text-slate-700 border border-slate-200 p-2 rounded-xl">
                            每 5 分钟
                        </button>
                    </div>

                    <div class="grid grid-cols-2 gap-2 text-xs font-bold">
                        <button onclick="setRandomTime()" class="btn-action bg-amber-500 hover:bg-amber-600 text-white p-2.5 rounded-xl shadow-md shadow-amber-500/20 flex items-center justify-center gap-1">
                            <i class="fa-solid fa-shuffle"></i> 随机时间
                        </button>
                        <button id="btnChallengeMode" onclick="toggleChallengeMode()" class="btn-action bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 rounded-xl shadow-md shadow-indigo-600/20 flex items-center justify-center gap-1">
                            <i class="fa-solid fa-trophy"></i> 认读挑战
                        </button>
                    </div>

                    <div class="flex items-center justify-between pt-1">
                        <button onclick="toggleScreenshotMode()" class="btn-action w-full bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 font-bold p-2 rounded-xl text-xs flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-camera"></i> 截图/高对比模式
                        </button>
                    </div>
                </div>

                <!-- Interaction Tip Card -->
                <div class="glass-panel p-3 rounded-2xl shadow-sm text-xs text-slate-600 flex items-start gap-2 border-l-4 border-l-sky-500">
                    <i class="fa-solid fa-hand-pointer text-sky-500 mt-0.5 animate-bounce"></i>
                    <div>
                        <b>拨针提示：</b>用鼠标或手指在 3D 钟面上<b>直接拖拽时针或分针</b>，体会“分针走一圈，时针走一大格”的齿轮联动关系！
                    </div>
                </div>
            </div>

            <!-- Right Panel: Challenge Numpad (Shown when in Challenge Mode) -->
            <div id="challengePanel" class="interactive hidden flex flex-col gap-3 w-full lg:w-80 justify-start self-start">
                <div class="glass-panel p-4 rounded-2xl shadow-xl border-2 border-indigo-400 space-y-3">
                    <div class="flex items-center justify-between border-b border-indigo-200 pb-2">
                        <span class="text-xs font-bold text-indigo-900 uppercase tracking-wider flex items-center gap-1.5">
                            <i class="fa-solid fa-gamepad text-indigo-500"></i> 看钟面·写时间挑战
                        </span>
                        <span id="challengeScoreBadge" class="bg-indigo-100 text-indigo-800 text-[11px] font-bold px-2 py-0.5 rounded-full border border-indigo-300">
                            已答对 0 题
                        </span>
                    </div>

                    <!-- Time Input Target Display -->
                    <div id="challengeInputBox" class="flex items-center justify-center gap-2 my-2">
                        <input type="text" id="inputHour" readonly placeholder="时" class="digital-font text-center text-3xl font-bold text-amber-600 bg-white border-2 border-amber-400 rounded-xl w-20 h-14 shadow-inner">
                        <span class="text-2xl font-black text-slate-700">:</span>
                        <input type="text" id="inputMinute" readonly placeholder="分" class="digital-font text-center text-3xl font-bold text-indigo-600 bg-white border-2 border-indigo-400 rounded-xl w-20 h-14 shadow-inner">
                    </div>

                    <!-- Numpad Grid -->
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="pressNumpad('1')" class="num-key p-3 text-xl flex items-center justify-center">1</button>
                        <button onclick="pressNumpad('2')" class="num-key p-3 text-xl flex items-center justify-center">2</button>
                        <button onclick="pressNumpad('3')" class="num-key p-3 text-xl flex items-center justify-center">3</button>
                        <button onclick="pressNumpad('4')" class="num-key p-3 text-xl flex items-center justify-center">4</button>
                        <button onclick="pressNumpad('5')" class="num-key p-3 text-xl flex items-center justify-center">5</button>
                        <button onclick="pressNumpad('6')" class="num-key p-3 text-xl flex items-center justify-center">6</button>
                        <button onclick="pressNumpad('7')" class="num-key p-3 text-xl flex items-center justify-center">7</button>
                        <button onclick="pressNumpad('8')" class="num-key p-3 text-xl flex items-center justify-center">8</button>
                        <button onclick="pressNumpad('9')" class="num-key p-3 text-xl flex items-center justify-center">9</button>
                        <button onclick="pressNumpad('DEL')" class="btn-action bg-amber-50 hover:bg-amber-100 text-amber-700 border border-amber-300 rounded-xl font-bold flex items-center justify-center text-sm">
                            <i class="fa-solid fa-delete-left"></i> 退格
                        </button>
                        <button onclick="pressNumpad('0')" class="num-key p-3 text-xl flex items-center justify-center">0</button>
                        <button onclick="submitChallengeAnswer()" class="btn-action bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl flex items-center justify-center text-xs shadow-md shadow-emerald-500/20">
                            <i class="fa-solid fa-check text-sm mr-1"></i> 提交
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Knowledge Rules Card -->
        <footer class="w-full interactive glass-panel p-2.5 rounded-2xl shadow-sm flex items-center justify-between text-xs text-slate-600">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-lightbulb text-amber-500 text-sm"></i>
                <span>认识时间口诀：钟面 12 个大格、60 个小格；时针走 1 大格是 1 小时，分针走 1 小格是 1 分钟（走 1 大格是 5 分钟）。</span>
            </div>
            <span class="font-mono text-[11px] text-slate-400 hidden md:inline">1 小时 = 60 分钟</span>
        </footer>
