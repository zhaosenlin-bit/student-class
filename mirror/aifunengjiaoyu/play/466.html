<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>加载中...</title>
<script>
// 反调试：阻止 F12 / Ctrl+Shift+I / Ctrl+U / Ctrl+S / 右键
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();return false});
  document.addEventListener('keydown',function(e){
    if(e.key==='F12'||(e.ctrlKey&&e.shiftKey&&(e.key==='I'||e.key==='J'||e.key==='i'||e.key==='j'))||(e.ctrlKey&&(e.key==='U'||e.key==='u'))||(e.ctrlKey&&(e.key==='s'||e.key==='S'))){
      e.preventDefault();return false;
    }
  });
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#fff}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
#loading{text-align:center;color:#888}
#loading .spinner{width:40px;height:40px;border:3px solid #e5e7eb;border-top-color:#3b82f6;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
#loading .hint{font-size:14px;margin-top:8px}
#loading .btn{margin-top:16px;padding:10px 24px;background:#3b82f6;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;text-decoration:none;display:inline-block}
#iframe-wrap{width:100%;height:100%;display:none}
#iframe-wrap iframe{width:100%;height:100%;border:none}
.reviewed-public-player{height:100%;display:flex;flex-direction:column;background:#0c1526;color:#e6edf8}
.reviewed-public-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:#17243a}
.reviewed-public-controls select,.reviewed-public-controls button{max-width:100%;border:1px solid #445777;border-radius:7px;background:#20334f;color:#f2f6ff;padding:6px 10px}
.reviewed-public-controls p{margin-left:auto;font-size:12px;color:#bfcee5}
.reviewed-public-stage{flex:1;min-height:0}
</style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
  <div id="play-status">正在加载程序...</div>
  <div class="hint" id="hint"></div>
</div>
<div id="iframe-wrap"></div>
<script>
(function(){
  var pid = "466";
  var isExternal = false;
  var isCameraRuntime = false;
  var isReviewedPublic = false;
  var isLongMarch = false;
  var programTitle = "《梦回繁华》沉浸式3D长卷课堂";
  var loadEl = document.getElementById('loading');
  var wrapEl = document.getElementById('iframe-wrap');
  var hintEl = document.getElementById('hint');
  function showPlayFailure(message) {
    document.title = '课件无法打开 · 图灵智赋';
    document.getElementById('play-status').textContent = '播放已暂停';
    loadEl.querySelector('.spinner').style.display = 'none';
    hintEl.textContent = message;
  }

  // 从 localStorage 读取登录态（与主站同域名）
  var userData = null;
  var bearer = null;
  try {
    var raw = localStorage.getItem('aiedu_user');
    if (raw) userData = JSON.parse(raw);
    bearer = localStorage.getItem('aiedu_token') || null;
  } catch(e){}

  if (!userData || !userData.wechatId || !bearer) {
    document.title = '请先登录 · 图灵智赋';
    hintEl.innerHTML = '你还没有登录图灵智赋，请先登录后再使用';
    loadEl.innerHTML += '<br><a class="btn" href="/">前往登录</a>';
    return;
  }

  if (isCameraRuntime) {
    var launchXhr = new XMLHttpRequest();
    launchXhr.open('POST', '/api/programs/' + pid + '/camera-launch', true);
    launchXhr.setRequestHeader('Authorization', 'Bearer ' + bearer);
    launchXhr.setRequestHeader('Content-Type', 'application/json');
    launchXhr.onload = function() {
      var data;
      try { data = JSON.parse(launchXhr.responseText); } catch(e) { data = {}; }
      if (launchXhr.status >= 200 && launchXhr.status < 300 && data.success && data.launchUrl) {
        document.title = programTitle + ' · 图灵智赋';
        location.replace(data.launchUrl);
        return;
      }
      showPlayFailure(data.msg || ('加载失败（' + launchXhr.status + '）'));
    };
    launchXhr.onerror = function() { showPlayFailure('网络异常，请检查连接'); };
    launchXhr.send('{}');
    return;
  }

  if (isReviewedPublic) {
    // Copied chapter-course links use the exact same protected host as the
    // website viewer. Whole-program tokens deliberately deny these courses.
    import('/admin-large/runtime/public-host.mjs').then(async function(module) {
      wrapEl.style.display = 'block';
      var request = async function(url, body) {
        var response = await fetch(url, {method:'POST',credentials:'same-origin',
          headers:{'Content-Type':'application/json','Authorization':'Bearer '+bearer},
          body:JSON.stringify(body)});
        var data = await response.json();
        if (!response.ok) throw Error(data.error || '访问权限已变化，请重新打开课件');
        return data;
      };
      await module.mountPublicRuntime(wrapEl, Number(pid), request);
      document.title = programTitle + ' · 图灵智赋';
      loadEl.style.display = 'none';
    }).catch(function(error) {
      wrapEl.style.display = 'none';
      showPlayFailure(error.message || '课件暂时无法打开，请返回网站确认登录和购买权益');
      if(typeof error.resetPlayback==='function'){
        var restart=document.createElement('button');restart.type='button';restart.className='btn';restart.textContent='重新开始播放';
        restart.onclick=function(){try{error.resetPlayback();restart.disabled=true;location.reload();}catch(e){showPlayFailure(e.message);}};
        loadEl.appendChild(restart);
      }
      var back=document.createElement('a');back.className='btn';back.href='/';back.textContent='返回网站';loadEl.appendChild(back);
    });
    return;
  }

  var iframe = document.createElement('iframe');
  iframe.style.width = '100%';
  iframe.style.height = '100%';
  iframe.style.border = 'none';
  iframe.allow = isLongMarch ? 'fullscreen *' : 'fullscreen';
  iframe.setAttribute('allowfullscreen', '');
  wrapEl.appendChild(iframe);

  if (isExternal) {
    // 外链作品：拿真实 URL 直接塞 iframe.src
    var exXhr = new XMLHttpRequest();
    exXhr.open('GET', '/api/programs/' + pid + '/external-url', true);
    exXhr.setRequestHeader('Authorization', 'Bearer ' + bearer);
    exXhr.onload = function() {
      var data;
      try { data = JSON.parse(exXhr.responseText); } catch(e) { data = {}; }
      if (exXhr.status < 200 || exXhr.status >= 300 || !data.success || !data.url) {
        showPlayFailure(data.msg || ('加载失败（' + exXhr.status + '）'));
        return;
      }
      iframe.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups allow-downloads allow-modals allow-pointer-lock');
      iframe.setAttribute('referrerpolicy', 'no-referrer');
      iframe.src = data.url;
      iframe.onload = function() {
        document.title = programTitle + ' · 图灵智赋';
        loadEl.style.display = 'none';
        wrapEl.style.display = 'block';
      };
      // 兜底：3 秒后即使 onload 没触发也展示（X-Frame-Options 阻断时也不卡 loading）
      setTimeout(function(){ loadEl.style.display='none'; wrapEl.style.display='block'; }, 3000);
    };
    exXhr.onerror = function() { showPlayFailure('网络异常，请检查连接'); };
    exXhr.send();
    return;
  }

  // 文件类作品：与主站“立即使用”复用同一个受保护加载入口。
  // 不再把课件 HTML 写入主站同源的 about:blank，避免资源基准路径、
  // Referer/CDN 行为不一致，也避免上传课件读取主站登录态。
  var tokenXhr = new XMLHttpRequest();
  tokenXhr.open('GET', '/api/programs/' + pid + '/access-token', true);
  tokenXhr.setRequestHeader('Authorization', 'Bearer ' + bearer);
  tokenXhr.onload = function() {
    if (tokenXhr.status < 200 || tokenXhr.status >= 300) {
      showPlayFailure('加载失败（' + tokenXhr.status + '），请重新登录');
      return;
    }
    var tokData;
    try { tokData = JSON.parse(tokenXhr.responseText); } catch(e) { tokData = {}; }
    if (!tokData.success || !tokData.token) {
      showPlayFailure(tokData.msg || '无访问权限');
      return;
    }
    // 与主站查看器保持一致：仅作品 208 保留已审核的 localStorage 兼容例外。
    var allowSameOrigin = Number(pid) === 208;
    iframe.setAttribute('sandbox', 'allow-scripts' + (allowSameOrigin ? ' allow-same-origin' : '') + ' allow-forms allow-popups allow-downloads allow-modals allow-pointer-lock');
    iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
    iframe.src = '/api/program-file/' + pid + '?token=' + encodeURIComponent(tokData.token);
    if (Number(pid) === 498 || Number(pid) === 754) {
      import('/course-compat/long-march-save-host.mjs').then(function(module) {
        return module.mountLongMarchSaveHost(iframe,userData.wechatId);
      }).catch(function() { /* Protected bootstrap reports restore failure. */ });
    }
    iframe.onload = function() {
      document.title = programTitle + ' · 图灵智赋';
      loadEl.style.display = 'none';
      wrapEl.style.display = 'block';
    };
  };
  tokenXhr.onerror = function() { showPlayFailure('网络异常，请检查连接'); };
  if(isLongMarch){
    import('/course-compat/long-march-playback-host.mjs').then(async function(module){
      var playback=await module.prepareLongMarchPlayback(Number(pid));
      if(!playback){tokenXhr.send();return;}
      iframe.setAttribute('sandbox','allow-scripts allow-forms allow-popups allow-downloads allow-modals allow-pointer-lock');
      iframe.setAttribute('referrerpolicy','strict-origin-when-cross-origin');
      iframe.src=playback.url;
      await playback.mount(iframe);document.title=programTitle+' · 图灵智赋';loadEl.style.display='none';wrapEl.style.display='block';
    }).catch(function(error){
      showPlayFailure(error.message||'课件暂时无法打开');
      if(typeof error.resetPlayback==='function'){
        var restart=document.createElement('button');restart.className='btn';restart.textContent='重新开始播放';
        restart.onclick=function(){error.resetPlayback();location.reload();};loadEl.appendChild(restart);
      }
    });
  }else tokenXhr.send();
})();
</script>
</body>
</html>
