<body>
<div id="info" style="text-align: left"> 
	<h1 style="text-align: center">Advanced Static & Kinetic Friction </h1>
		
	  <!-- Left Panel -->  
	<div class="control-panel">
		    
		  <div class="control-group">
		    Incline Angle:
		    <div class="slider-row">
		      <input type="range" id="angleSlider" min="0" max="90" step="1" value="0">
		      <input type="text" id="angleValue" value="0.0°" readonly>
		    </div>
		    <div class="minmax">
		      <span>0</span>
		      <span>90</span>
		    </div>
		  </div>
		
		<div class="control-group">
		  Initial Velocity (m/s):
		  <div class="slider-row" style="display: flex; align-items: center;">
		    <input type="range" id="velSlider" min="-10" max="5" step="1" value="-4" style="flex: 1; margin-right: 8px;">
		    <input type="text" id="velValue" value="-4" readonly style="width: 80px; text-align: center; color: blue; font-weight: bold;">
		  </div>
		  <div class="minmax" style="display: flex; justify-content: space-between; margin-top: 4px;">
		    <span>-10</span>
		    <span>5</span>
		  </div>
		</div>
		    		
		  <div class="control-group">
		    Mass (g):
		    <div class="slider-row">
		      <input type="range" id="massSlider" min="100" max="1000" step="1" value="500">
		      <input type="text" id="massValue" value="500" readonly>
		    </div>
		    <div class="minmax">
		      <span>100</span><span>1000</span>
		    </div>
		  </div>
		    
		  <div class="control-group">
		    Static Friction Coeff:
		    <div class="slider-row">
		      <input type="range" id="frictionStaticSlider" min="0" max="1" step="0.01" value="0.4">
		      <input type="text" id="frictionStaticValue" value="0.4" readonly>
		    </div>
		    <div class="minmax">
		      <span>0</span>
		      <span>1</span>
		    </div>
		  </div>
		    
		  <div class="control-group">
		    Kinetic Friction Coeff:
		    <div class="slider-row">
		      <input type="range" id="frictionKineticSlider" min="0" max="1" step="0.01" value="0.2">
		      <input type="text" id="frictionKineticValue" value="0.2" readonly>
		    </div>
		    <div class="minmax">
		      <span>0</span>
		      <span>1</span>
		    </div>
		  </div>
		
		 <button class="btn btn-danger" id="start">Start</button>	
		 <button class="btn btn-primary" id="reset">Reset</button>
	</div>
	
	<!-- Right Panel -->  
	<div class="control-panel-right">
		<div class="control-group" style="text-align: left;">
		  <input type="checkbox" id="showComponents" unchecked>
		  <label for="showComponents">Show Weight Components</label>
		</div>
		  <div class="control-group">
		    Static Friction (N):
		    <input type="text" id="statForce" value="0.0" readonly style="width: 90px;">
		  </div>
		  <div class="control-group">
		    Parallel Comp. (N):
		    <input type="text" id="paraForce" value="0.0" readonly style="width: 90px;">
		  </div>    
		  <div class="control-group">
		    Velocity (m/s):
		    <input type="text" id="vel" value="0.0" readonly style="width: 90px;">
		  </div>
		  <div class="control-group">
		    Acceleration (m/s<sup>2</sup>):
		    <input type="text" id="acc" value="0.0" readonly style="width: 90px;">
		  </div>
		  <div class="control-group">
		    Left/Right Dist (m):
		    <input type="text" id="distLR" value="0.0" readonly style="width: 90px;">
		  </div>
		  <div class="control-group">
		    Total Dist (m):
		    <input type="text" id="dist" value="0.0" readonly style="width: 90px;">
		  </div>
		  <div class="control-group">
		    Time (s):
		    <input type="text" id="time" value="0.0" readonly style="width: 90px;">
		  </div><br>
		
		<button class="btn btn-warning" onclick="alert(
		  '🧲 **Static vs. Kinetic Friction**:\n' +
		  '- **Static friction** prevents an object from starting to move. It adjusts as needed up to a maximum value: fs ≤ μs·N.\n' +
		  '- **Kinetic friction** acts when an object is already sliding. It has a constant value: fk = μk·N.\n\n' +
		  '📊 **About This Simulation**:\n' +
		  'This simulation shows how a box behaves on an inclined plane under the effects of gravity and friction.\n\n' +
		  'You can:\n' +
		  '• Set the angle of the incline\n' +
		  '• Adjust the mass of the box\n' +
		  '• Change the coefficients of static (μs) and kinetic (μk) friction\n' +
		  '• Apply an initial velocity\n\n' +
		  'Watch how the box stays at rest (static friction), begins sliding (overcoming static friction), or slows down due to kinetic friction.\n\n' +
		  'This is a great way to visualize the difference between friction types and apply Newton\'s Laws in real time.'
		)">
		  ℹ️ Information
		</button><br><br>
		
		 <button class="btn btn-success" id="pause">Pause</button>
		
	</div>
</div>
<div id="viewport"></div>
</body>
</html>
