<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>三角形面积 · 动态演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f1f8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        .card {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 32px 30px 40px;
            box-shadow: 0 30px 50px rgba(0, 20, 30, 0.15),
                        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            transition: all 0.2s ease;
        }

        h1 {
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: -0.01em;
            color: #1a2a3a;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        h1 small {
            font-weight: 400;
            font-size: 1rem;
            color: #4a6a7a;
            background: rgba(0, 0, 0, 0.04);
            padding: 6px 16px;
            border-radius: 40px;
            letter-spacing: 0.2px;
            backdrop-filter: blur(2px);
        }

        .sub {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            color: #2c4a5a;
        }

        .formula-badge {
            background: #d0e2f0;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 1.1rem;
            font-weight: 500;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            color: #0f2c3a;
        }

        .formula-badge i {
            font-style: italic;
            font-weight: 600;
        }

        .canvas-wrapper {
            background: #ffffff;
            border-radius: 32px;
            padding: 12px;
            box-shadow: 0 8px 20px rgba(0, 20, 30, 0.08);
            margin-bottom: 28px;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
            background: #ffffff;
            border-radius: 24px;
            cursor: grab;
            touch-action: none;
            box-shadow: 0 0 0 1px rgba(0,0,0,0.02);
        }

        canvas:active {
            cursor: grabbing;
        }

        .control-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 20px 40px;
            background: rgba(240, 248, 255, 0.6);
            backdrop-filter: blur(2px);
            padding: 20px 24px;
            border-radius: 40px;
            margin-bottom: 12px;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .slider-group {
            flex: 2 1 200px;
            min-width: 140px;
        }

        .slider-group label {
            display: flex;
            justify-content: space-between;
            font-weight: 500;
            color: #1a3a4a;
            font-size: 0.95rem;
            margin-bottom: 6px;
        }

        .slider-group label span:last-child {
            background: #dce9f2;
            padding: 0 14px;
            border-radius: 30px;
            font-weight: 600;
            color: #003153;
        }

        input[type="range"] {
            width: 100%;
            height: 6px;
            -webkit-appearance: none;
            background: #cbdae6;
            border-radius: 10px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 20px;
            background: #2a7a9a;
            box-shadow: 0 4px 8px rgba(0,40,60,0.2);
            cursor: pointer;
            transition: 0.08s;
            border: 2px solid white;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.12);
            background: #1f8bb0;
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 20px;
            background: #2a7a9a;
            border: 2px solid white;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-left: auto;
            align-items: center;
            flex-wrap: wrap;
        }

        .action-btn {
            background: white;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 500;
            color: #1a4a5a;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            cursor: pointer;
            transition: all 0.15s;
            font-size: 0.9rem;
            border: 1px solid #dae6ee;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            background: #e6f0f8;
            box-shadow: 0 6px 12px rgba(0,20,30,0.08);
            transform: scale(0.96);
        }

        .action-btn:active {
            transform: scale(0.92);
        }

        .action-btn.playing {
            background: #d4e6f0;
            border-color: #82b3cc;
            box-shadow: 0 4px 10px rgba(30, 100, 140, 0.15);
        }

        .value-stats {
            display: flex;
            flex-wrap: wrap;
            gap: 18px 28px;
            background: #eef5fa;
            padding: 14px 24px;
            border-radius: 60px;
            justify-content: center;
            align-items: baseline;
            margin-top: 6px;
            border: 1px solid rgba(255,255,255,0.5);
        }

        .stat-item {
            display: flex;
            align-items: baseline;
            gap: 6px;
            color: #1f3f4f;
        }

        .stat-item .label {
            font-weight: 400;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .stat-item .value {
            font-weight: 700;
            font-size: 1.3rem;
            color: #003153;
            min-width: 3rem;
            text-align: right;
        }

        .stat-item .unit {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-left: 2px;
        }

        .footnote {
            text-align: center;
            margin-top: 20px;
            color: #4f6f7f;
            font-size: 0.85rem;
            opacity: 0.7;
            letter-spacing: 0.3px;
        }

        @media (max-width: 600px) {
            .card { padding: 20px 16px; border-radius: 32px; }
            h1 { font-size: 1.6rem; }
            .control-panel { padding: 16px; border-radius: 28px; }
            .value-stats { padding: 12px 16px; gap: 12px; }
            .stat-item .value { font-size: 1.1rem; min-width: 2.4rem; }
            .button-group { margin-left: 0; width: 100%; justify-content: flex-end; }
        }
    </style>
</head>

<div class="card">
    <h1>
        🔺 三角形面积
        <small>底 · 高 可视化</small>
    </h1>
    <div class="sub">
        <span class="formula-badge">📐 面积 = <i>½</i> × 底 × 高</span>
        <span style="font-size:0.9rem; background:#e4eef6; padding:4px 16px; border-radius:40px;">↔ 拖拽顶点 · 实时更新</span>
    </div>

    <div class="canvas-wrapper">
        <canvas id="triangleCanvas" width="800" height="450"></canvas>
    </div>

    <div class="control-panel">
        <div class="slider-group">
            <label>
                <span>📏 底边 (b)</span>
                <span id="baseValue">6.0</span>
            </label>
            <input type="range" id="baseSlider" min="2" max="10" step="0.1" value="6.0">
        </div>
        <div class="slider-group">
            <label>
                <span>📐 高度 (h)</span>
                <span id="heightValue">4.5</span>
            </label>
            <input type="range" id="heightSlider" min="1.5" max="8" step="0.1" value="4.5">
        </div>
        <div class="button-group">
            <button class="action-btn" id="playPauseBtn">▶ 播放</button>
            <button class="action-btn" id="resetButton">↺ 重置</button>
        </div>
    </div>

    <div class="value-stats">
        <div class="stat-item">
            <span class="label">底</span>
            <span class="value" id="displayBase">6.0</span>
            <span class="unit">cm</span>
        </div>
        <div class="stat-item">
            <span class="label">高</span>
            <span class="value" id="displayHeight">4.5</span>
            <span class="unit">cm</span>
        </div>
        <div class="stat-item">
            <span class="label">面积</span>
            <span class="value" id="displayArea">13.50</span>
            <span class="unit">cm²</span>
        </div>
    </div>
    <div class="footnote">
        ⚡ 拖拽三角形顶点 (A, B, C) 或使用滑块 — 面积动态更新
    </div>
</div>
