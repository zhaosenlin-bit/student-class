	function createUShapeMagnet(y, texture_path) {
	    // Define the shape of the U-magnet with doubled dimensions
	    var arcShape = new THREE.Shape();
	    arcShape.moveTo(-24, 0); // Start point (doubled from -12)
	    arcShape.absarc(0, 0, 24, Math.PI, 0, true); // Top half-circle (doubled from 12)
	    arcShape.lineTo(24, 0);
	    arcShape.absarc(0, 0, 20, 0, Math.PI, false); // Bottom inner half-circle (doubled from 10)
	    arcShape.lineTo(-24, 0);
	
	    // Extrusion settings
	    var extrudeSettings = {
	        steps: 2,
	        depth: 4, // height of horseshoe (doubled from 2)
	        bevelEnabled: false
	    };
	
	    // Create the geometry and material
	    var geometry = new THREE.ExtrudeGeometry(arcShape, extrudeSettings);
	    var texload = textureloader.load(texture_path);
	    var material = new THREE.MeshBasicMaterial( { map: texload } );
	
	    // Create mesh
	    const magUshape = new THREE.Mesh(geometry, material);
	    magUshape.position.set(0, y, 2); 
	    magUshape.rotation.x = Math.PI;
	    scene.add(magUshape);
	}

function displayVectorInfo(E, A, theta) {
    // Calculate the electric flux using the formula ΦE = E • A cos(θ)
    let flux = E * A * Math.cos(theta); // Convert θ to radians for Math.cos

    // Create or update the HTML element to display the magnitudes and angles
    let infoDiv = document.getElementById('vectorInfo');
    
    // If the div doesn't exist, create it
    if (!infoDiv) {
        infoDiv = document.createElement('div');
        infoDiv.id = 'vectorInfo';
        infoDiv.style.position = 'absolute';
        infoDiv.style.top = '30px';
        infoDiv.style.right = '30px';
        infoDiv.style.padding = '30px';
        infoDiv.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
        infoDiv.style.color = 'white';
        infoDiv.style.fontFamily = 'Arial, sans-serif';
        infoDiv.style.fontSize = '14px';
        document.body.appendChild(infoDiv);
    }

    // Update the content of the div with electric flux information
    infoDiv.innerHTML = `
        <strong>Magnetic Flux Example:</strong><br>
        Magnetic Field (Bo): ${E.toFixed(2)} T<br>
        Surface Area (A): ${A.toFixed(2)} m²<br>
        Angle (θ): ${(theta*180/Math.PI).toFixed(2)}°<br><br>
        <strong>Magnetic Flux (ΦB):</strong><br>
        ΦB = Bo • A • cos(θ) = ${flux.toFixed(2)} Wb<br>
    `;
}
function createCurvedLine(x1, y1, x2, y2, curvature, segments, curveDirection) {
    var arr = [];
    var n = 0;

    var midX = (x1 + x2) / 2;
    var midY = (y1 + y2) / 2;
    var controlX = midX + curvature * curveDirection;
    var controlY = midY;

    for (var t = 0; t <= 1; t += 1 / segments) {
        var x = (1 - t) * (1 - t) * x1 + 2 * (1 - t) * t * controlX + t * t * x2;
        var y = (1 - t) * (1 - t) * y1 + 2 * (1 - t) * t * controlY + t * t * y2;
        arr.push(new THREE.Vector3(x, y, 0));
        n++;
    }

    var curve = new THREE.CatmullRomCurve3(arr);

    var curveMaterial = new THREE.MeshBasicMaterial({ color: "white" });
    var geometry = new THREE.TubeGeometry(curve, n, 0.1, 36, false);
    var line = new THREE.Mesh(geometry, curveMaterial);
    scene.add(line);

    magneticCurves.push(curve); // <<< ADD curve to global array

    // Arrow tip (same as your original)
    var midPoint = curve.getPointAt(0.5);
    var tangent = curve.getTangentAt(0.5);
    var arrowTipGeometry = new THREE.ConeGeometry(0.5, 2, 32);
    var arrowTipMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
    var arrowTip = new THREE.Mesh(arrowTipGeometry, arrowTipMaterial);
    arrowTip.position.copy(midPoint);
    if (curveDirection == -1) {
        arrowTip.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), tangent);
    } else {
        arrowTip.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), tangent);
    }
    scene.add(arrowTip);
}
	
function createCurvedLine2(x1, y1, x2, y2, curvature, segments, curveDirection) {
    var arr = [];
    var n = 0;

    // Calculate the midpoint between the two points
    var midX = (x1 + x2) / 2;
    var midY = (y1 + y2) / 2;

    // Adjust the control point based on curvature and direction
    var controlX = midX + curvature * curveDirection; // Adjust x for left/right curvature
    var controlY = midY; // Keep y the same since we are curving left/right

    // Generate the curve points using a quadratic Bezier formula
    for (var t = 0; t <= 1; t += 1 / segments) {
        var x = (1 - t) * (1 - t) * x1 + 2 * (1 - t) * t * controlX + t * t * x2;
        var y = (1 - t) * (1 - t) * y1 + 2 * (1 - t) * t * controlY + t * t * y2;

        arr.push(new THREE.Vector3(x, y, 0)); // Points in the (x, y) plane
        n++;
    }

    // Create a material for the curve
    var curveMaterial = new THREE.MeshBasicMaterial({ color: "white" });
    var curve = new THREE.CatmullRomCurve3(arr);
    var geometry = new THREE.TubeGeometry(curve, n, 0.1, 36, false);
    var line = new THREE.Mesh(geometry, curveMaterial);

    // Add the curve to the scene
    scene.add(line);
}
function createMagneticFieldLine(a, b, start, end, y, baseOffsetY, direction, numLines) {
    var radiansStart = (start * Math.PI) / 180;
    var radiansEnd = (end * Math.PI) / 180;

    for (var i = 0; i < numLines; i++) {
        var arr = [];
        var n = 0;

        var offsetY = baseOffsetY * Math.pow(i + 1, 2);

        for (var t = 0; t <= 1; t += 0.01) {
            var segment = radiansStart + (radiansEnd - radiansStart) * t;
            var x = a * Math.cos(segment);
            var curveHeight = offsetY * Math.sin(Math.PI * t);
            var yPos = (direction === 'up') ? y + curveHeight : y - curveHeight;
            var zPos = 0;
            arr.push(new THREE.Vector3(x, yPos, zPos));
            n++;
        }

        // create curve
        var curve = new THREE.CatmullRomCurve3(arr);
        magneticEllipticCurves.push(curve); // Save it properly

        var ellipseMaterial = new THREE.MeshBasicMaterial({ color: "white" });
        var geometry = new THREE.TubeGeometry(curve, n, 0.1, 36, false);
        var ellipse = new THREE.Mesh(geometry, ellipseMaterial);

        ellipse.position.set(0, y, 0);
        scene.add(ellipse);
    }
}

function drawCurve(center, radius, theta, color) {
    const points = [];
    const segments = 20; // Number of segments in the curve
    const startAngle = 0; // Starting from the negative z-axis
    const endAngle = startAngle + (Math.PI / 180) * theta;
    for (let i = 0; i <= segments; i++) {
	const angle = startAngle + (i / segments) * (endAngle - startAngle); // antiClockwise direction
	const x = radius * Math.cos(angle);
	const y = 3 + radius * Math.sin(angle) ;
	points.push(new THREE.Vector3(x, y, 0));
    }

    const curve = new THREE.CatmullRomCurve3(points);
    const geometry = new THREE.TubeGeometry(curve, segments, 0.2, 3, false);
    const material = new THREE.MeshBasicMaterial({ color: color });
    const curveObject = new THREE.Mesh(geometry, material);
    scene.add(curveObject);
    return curveObject;
}
	
function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    requestAnimationFrame(animate);

    rainbowLights.forEach((light, index) => {
	    const data = rainbowData[index];
	    if (data && data.curve && data.curve.points && data.curve.points.length > 1) { // <<< SAFETY
	        data.t += data.speed * data.direction;
	        if (data.t > 1) data.t = 0;
	        if (data.t < 0) data.t = 1;
	
	        const position = data.curve.getPointAt(data.t);
	        // Check if yShift exists for this light (only middle lights)
	            if (data.yShift !== undefined) {
	                light.position.set(position.x, position.y + data.yShift, position.z);
	            } else {
	                light.position.copy(position);
	            }
	    }
	});

    controls.update();
    renderer.render(scene, camera);
}
