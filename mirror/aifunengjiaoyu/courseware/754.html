<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>长征 · 754</title>
<style>html,body{margin:0;height:100%;background:#17150f;overflow:hidden}
#frame{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="frame" title="课件画面" allow="autoplay; fullscreen" src="/api/program-assets/754/index.html"></iframe>
<script>/*
 * The host side of the 长征 course.
 *
 * This course is a wrapper: the document that is opened asks a page
 * around it for two things — the saved progress and a channel to write
 * it back on.  On the published site a session server answers; here the
 * page answers for itself and keeps the progress in the browser's own
 * storage.
 *
 * The placeholders are filled in when the entry page is written:
 *   754   the number of the course
 *   leqixiang-long-march-save-v1  the name of the handshake
 *   ["longMarch_ruijin_chapterState","longMarch_progress","longMarch_chapter_yudu_v2","longMarch_progress_v2","longMarch.xiangjiang.chapter.v1","longMarch_zunyi_chapterState","chishui-chapter-state","longMarch_jinsha_chapter6_state","longMarchMapProgress","longMarch_ludingBridge_chapter7_v3","longMarch_demo_settings","long-march-chapter-9-v2","long-march-master-volume-v2"]      the keys the course is allowed to save
 */
(function () {
  const PROTOCOL = 'leqixiang-long-march-save-v1';
  const PROGRAM = '754';
  const KEYS = ["longMarch_ruijin_chapterState","longMarch_progress","longMarch_chapter_yudu_v2","longMarch_progress_v2","longMarch.xiangjiang.chapter.v1","longMarch_zunyi_chapterState","chishui-chapter-state","longMarch_jinsha_chapter6_state","longMarchMapProgress","longMarch_ludingBridge_chapter7_v3","longMarch_demo_settings","long-march-chapter-9-v2","long-march-master-volume-v2"];
  const STORE = 'lq.longmarch.' + PROGRAM + '.';

  const frame = document.getElementById('frame');
  if (!frame) return;

  const readValues = () => {
    const out = {};
    for (const key of KEYS) {
      try {
        const raw = localStorage.getItem(STORE + key);
        if (typeof raw === 'string' && raw.length <= 4096) out[key] = raw;
      } catch (e) {
        /* the browser may refuse; the course carries on without it */
      }
    }
    return out;
  };

  const writeValue = (key, value) => {
    try {
      localStorage.setItem(STORE + key, String(value));
    } catch (e) {}
  };

  const dropValue = (key) => {
    try {
      localStorage.removeItem(STORE + key);
    } catch (e) {}
  };

  window.addEventListener('message', (event) => {
    const data = event.data;
    if (event.source !== frame.contentWindow) return;
    if (!data || data.type !== PROTOCOL + ':ready') return;

    const channel = new MessageChannel();
    channel.port1.onmessage = (message) => {
      const patch = message.data || {};
      if (patch.control === 'checkpoint') {
        /* Every write was stored the moment it arrived. */
        channel.port1.postMessage({ control: 'checkpoint-result', id: patch.id, ok: true });
        return;
      }
      if (typeof patch.id !== 'number') return;
      try {
        if (patch.op === 'set') writeValue(patch.key, patch.value);
        else if (patch.op === 'remove') dropValue(patch.key);
        channel.port1.postMessage({ id: patch.id, ok: true });
      } catch (error) {
        channel.port1.postMessage({
          id: patch.id,
          ok: false,
          error: String((error && error.message) || error),
        });
      }
    };

    frame.contentWindow.postMessage(
      /* The course checks that the answer belongs to the question it
         asked, so the nonce travels back with it. */
      { type: PROTOCOL + ':connect', nonce: data.nonce, values: readValues() },
      location.origin,
      [channel.port2]
    );
  });
})();
</script>
</body>
</html>
