<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>拼音识字 · 一年级重点生字</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-deep: #f5f0eb;
            --bg-panel: #ffffff;
            --bg-panel-alt: #fefcf8;
            --border: #e0d6cc;
            --text: #3d2e24;
            --text-dim: #8a7a6e;
            --accent: #f9a03f;
            --accent2: #f25c48;
            --accent3: #6bc46d;
            --accent4: #ffd166;
            --danger: #e63946;
            --panel-width: 280px;
            --header-h: 50px;
            --transition: 0.25s ease;
            --radius: 16px;
            --shadow: 0 8px 20px rgba(0, 0, 0, 0.07);
            --font-cartoon: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', cursive, sans-serif;
        }

        body {
            font-family: var(--font-cartoon);
            background: var(--bg-deep);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #mobile-header {
            display: none;
        }

        #main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #side-panel {
            width: var(--panel-width);
            min-width: var(--panel-width);
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 8px 0 16px;
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.03);
            z-index: 2;
        }

        #center-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #fcf8f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .panel-section {
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
        }
        .panel-section:last-child {
            border-bottom: none;
        }
        .panel-section h3 {
            font-size: 14px;
            color: var(--accent2);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }
        .panel-section h3::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 16px;
            background: var(--accent2);
            border-radius: 3px;
        }

        .score-block {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-panel-alt);
            border-radius: 14px;
            padding: 12px 16px;
            border: 1px solid var(--border);
            margin-top: 6px;
        }
        .score-item {
            text-align: center;
        }
        .score-item .label {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }
        .score-item .value {
            font-size: 26px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }
        .score-item .value.accent {
            color: var(--accent2);
        }
        .score-item .value.green {
            color: var(--accent3);
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 2px solid var(--border);
            background: var(--bg-panel);
            color: var(--text);
            transition: all 0.2s;
            white-space: nowrap;
            font-family: var(--font-cartoon);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
        }
        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: scale(0.97);
        }
        .btn.active {
            border-color: var(--accent2);
            color: var(--accent2);
            background: rgba(242, 92, 72, 0.08);
        }
        .btn.accent {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(249, 160, 63, 0.08);
        }
        .btn.special {
            background: var(--accent2);
            border-color: var(--accent2);
            color: white;
        }
        .btn.special:hover {
            background: #d94a3a;
            border-color: #d94a3a;
            color: white;
        }

        #game-area {
            width: 100%;
            max-width: 700px;
            padding: 20px 20px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            position: relative;
            z-index: 1;
        }

        .question-box {
            background: white;
            border-radius: 40px;
            padding: 18px 32px;
            box-shadow: var(--shadow);
            border: 2px solid var(--accent4);
            text-align: center;
            width: 100%;
            max-width: 460px;
        }
        .question-box .hint {
            font-size: 14px;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }
        .question-box .pinyin-display {
            font-size: 40px;
            font-weight: 700;
            color: var(--accent2);
            letter-spacing: 2px;
            margin: 6px 0 2px;
        }

        .card-zone {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            min-height: 120px;
            padding: 10px 0;
            width: 100%;
        }

        .drag-card {
            width: 100px;
            height: 100px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 6px 0 #d9cdc0, var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: var(--text);
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 3px solid transparent;
            user-select: none;
            touch-action: none;
            position: relative;
        }
        .drag-card[draggable="true"]:hover {
            transform: scale(1.02);
            border-color: var(--accent);
        }
        .drag-card:active {
            cursor: grabbing;
            transform: scale(0.95);
        }
        .drag-card .card-label {
            position: absolute;
            bottom: -22px;
            font-size: 12px;
            color: var(--text-dim);
            font-weight: 400;
            letter-spacing: 0.3px;
        }
        .drag-card.highlight {
            border-color: var(--accent3);
            background: #f0fce8;
        }
        .drag-card.wrong {
            border-color: var(--danger);
            background: #ffe8e6;
            animation: shake 0.3s ease;
        }
        .drag-card.correct {
            border-color: var(--accent3);
            background: #e6f7e6;
            cursor: default;
            opacity: 0.7;
        }
        .drag-card.correct::after {
            content: "✓";
            position: absolute;
            top: -8px;
            right: -8px;
            background: var(--accent3);
            color: white;
            font-size: 18px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .drop-zone {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 209, 102, 0.18);
            border: 3px dashed var(--accent4);
            border-radius: 40px;
            padding: 20px 24px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 14px;
            min-height: 110px;
            transition: background 0.2s, border-color 0.2s;
            margin-top: 6px;
        }
        .drop-zone.drag-over {
            background: rgba(249, 160, 63, 0.18);
            border-color: var(--accent);
        }
        .drop-zone .placeholder {
            color: var(--text-dim);
            font-size: 18px;
            opacity: 0.5;
            letter-spacing: 0.5px;
        }
        .drop-zone .dropped-item {
            background: white;
            border-radius: 20px;
            padding: 8px 20px;
            font-size: 28px;
            font-weight: 700;
            box-shadow: 0 4px 0 #d9cdc0;
            border: 2px solid var(--accent3);
            color: var(--text);
        }

        .feedback-msg {
            font-size: 22px;
            font-weight: 600;
            min-height: 44px;
            color: var(--accent2);
            transition: opacity 0.2s;
        }
        .feedback-msg.success {
            color: var(--accent3);
        }

        .sound-indicator {
            display: flex;
            gap: 10px;
            align-items: center;
            font-size: 14px;
            color: var(--text-dim);
            margin-top: 8px;
        }

        @media (max-width: 800px) {
            #mobile-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 16px;
                height: var(--header-h);
                background: var(--bg-panel);
                border-bottom: 1px solid var(--border);
            }
            #mobile-header h1 {
                font-size: 18px;
                color: var(--text);
                font-weight: 700;
            }
            #side-panel {
                position: fixed;
                left: 0;
                top: var(--header-h);
                bottom: 0;
                z-index: 50;
                margin-left: calc(-1 * var(--panel-width));
                transition: margin-left var(--transition);
                box-shadow: 4px 0 20px rgba(0,0,0,0.08);
                border-right: none;
            }
            #side-panel.open {
                margin-left: 0;
            }
            #center-panel {
                padding-top: 10px;
            }
            .drag-card {
                width: 80px;
                height: 80px;
                font-size: 26px;
            }
            .question-box .pinyin-display {
                font-size: 32px;
            }
            .drop-zone {
                padding: 14px 16px;
                min-height: 90px;
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        @media (max-width: 480px) {
            .drag-card {
                width: 68px;
                height: 68px;
                font-size: 22px;
                border-radius: 18px;
            }
            .question-box .pinyin-display {
                font-size: 28px;
            }
            .drop-zone .dropped-item {
                font-size: 22px;
                padding: 6px 14px;
            }
        }

        #side-panel::-webkit-scrollbar {
            width: 4px;
        }
        #side-panel::-webkit-scrollbar-track {
            background: var(--bg-panel);
        }
        #side-panel::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 8px;
        }
    </style>
</head>

        <h1>📖 一年级重点生字</h1>

    </header>

    <div id="main-layout">
        <aside id="side-panel">
            <div class="panel-section">
                <h3>⭐ 闯关进度</h3>

                    <div class="score-item">
                        <div class="label">得分</div>
                        <div class="value accent" id="scoreDisplay">0</div>
                    </div>
                    <div class="score-item">
                        <div class="label">已过</div>
                        <div class="value green" id="levelDisplay">1</div>
                    </div>
                    <div class="score-item">
                        <div class="label">剩余</div>
                        <div class="value" id="remainDisplay">20</div>
                    </div>
                </div>
                <div style="margin-top: 12px; font-size: 13px; color: var(--text-dim); text-align:center; background: var(--bg-panel-alt); padding: 6px 10px; border-radius: 30px;">

                </div>
            </div>

            <div class="panel-section">
                <h3>🎮 控制</h3>
                <div class="btn-row">
                    <button class="btn" onclick="resetGame()">⟳ 重新开始</button>
                </div>
                <div style="margin-top: 12px; font-size: 13px; color: var(--text-dim);">
                    <span>🔊 音效 </span>
                    <span id="soundStatus" style="cursor:pointer; color:var(--accent3);">开启</span>
                </div>
            </div>

            <div class="panel-section">
                <h3>📚 生字表 (20个重点字)</h3>
                <div style="font-size: 13px; line-height: 1.9; color: var(--text);">
                    <div><strong>第1单元</strong>：春 风 花 飞 雪 山 石 水 火 木</div>
                    <div><strong>第2单元</strong>：鸟 鱼 马 牛 羊 虫 云 雨 田 土</div>
                </div>
            </div>

            <div class="panel-section" style="border-bottom: none;">
                <h3>💡 规则</h3>
                <p style="font-size: 13px; color: var(--text-dim); line-height: 1.5;">
                    将汉字拖到对应的拼音上。<br>
                    配对正确 +5分，错误 -2分，<br>
                    满分100分，全部答完即可达标！
                </p>
            </div>
        </aside>

        <main id="center-panel">
            <div id="game-area">

                <div class="card-zone" id="cardZone"></div>

                <div class="drop-zone" id="dropZone">

                </div>

            </div>
        </main>
    </div>
