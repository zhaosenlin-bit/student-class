<!DOCTYPE html>
<html>

<head><base href="/">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>组合正方体画板 v3.3 (动态边界追踪版)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        #main-view {
            width: 100%;
            height: 100vh;
            background-color: #1a1c20;
            background-image: radial-gradient(circle at 50% 30%, #3a3f47 0%, #1a1c20 60%, #08090a 100%);
            position: relative;
            overflow: hidden;
        }

        #main-view canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .drawing-mode canvas { cursor: crosshair !important; }

        /* 顶部中央：模块切换 (一级主导航) */
        .module-selector {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: rgba(30, 30, 30, 0.75);
            padding: 6px;
            border-radius: 14px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .module-btn {
            padding: 10px 30px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: #aaa;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .module-btn:hover { color: #fff; }
        .module-btn.active {
            background: #0ABAB5;
            color: #fff;
            box-shadow: 0 4px 16px rgba(10, 186, 181, 0.5);
        }

        /* 统一工具栏容器风格 (二级辅助导航) */
        .toolbar-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(40, 40, 40, 0.6);
            padding: 6px;
            border-radius: 10px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .toolbar-group.hidden { display: none; }

        /* 统一按钮样式：缩小字号至13px，更加内敛精致 */
        .tool-btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: #eee;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tool-btn:hover { background: rgba(255, 255, 255, 0.15); transform: translateY(-2px); }
        .tool-btn.active { background: #0ABAB5; color: #fff; }
        
        .tool-btn.highlight { border: 1px solid rgba(10, 186, 181, 0.4); color: #0ABAB5; background: rgba(10, 186, 181, 0.05); }
        .tool-btn.highlight:hover { background: rgba(10, 186, 181, 0.2); color: #fff; }
        
        .tool-btn.special { background: rgba(155, 89, 182, 0.2); color: #e056fd; border: 1px solid rgba(155, 89, 182, 0.5); }
        .tool-btn.special:hover { background: rgba(155, 89, 182, 0.5); color: #fff; }

        .tool-btn.warning { border: 1px solid rgba(231, 76, 60, 0.4); color: #e74c3c; background: rgba(231, 76, 60, 0.05); }
        .tool-btn.warning:hover { background: rgba(231, 76, 60, 0.2); color: #fff; }

        /* 右侧：教学功能区 (明显低于第一行，拉开视觉层次) */
        .top-right-container {
            position: fixed;
            top: 85px;
            right: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            z-index: 100;
        }

        /* 左侧：画笔交互区 (明显低于第一行) */
        .top-left-container {
            position: fixed;
            top: 85px;
            left: 25px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            z-index: 100;
        }

        /* 底部居中：全局控制区 */
        .bottom-center-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            z-index: 100;
        }

        /* 颜色选择器 */
        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 6px;
            color: #eee;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
        }
        #cube-color-picker {
            -webkit-appearance: none;
            border: none;
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            padding: 0;
            background: transparent;
        }
        #cube-color-picker::-webkit-color-swatch-wrapper { padding: 0; }
        #cube-color-picker::-webkit-color-swatch { border: 1px solid rgba(255,255,255,0.4); border-radius: 4px; }

        /* 右下角：专属水印 */
        .watermark {
            position: fixed;
            bottom: 30px;
            right: 40px;
            font-size: 28px;
            color: rgba(255, 255, 255, 0.12);
            font-weight: 800;
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            pointer-events: none;
            z-index: 10;
            letter-spacing: 2px;
        }

        /* 算式悬浮窗 */
        #math-overlay {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 12px 25px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 500;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
            z-index: 200;
            display: none;
            letter-spacing: 1px;
        }
        #math-overlay span.num { color: #0ABAB5; font-weight: bold; font-size: 24px; margin: 0 5px;}
        #math-overlay span.vol { color: #e056fd; font-weight: bold; font-size: 26px; margin: 0 5px;}

        /* 左下方保存历史区 */
        #saved-layouts {
            position: fixed;
            bottom: 90px;
            left: 25px;
            max-width: 30%;
            display: flex;
            gap: 15px;
            overflow-x: auto;
            z-index: 10;
            padding-bottom: 5px;
        }
        #saved-layouts::-webkit-scrollbar { height: 6px; }
        #saved-layouts::-webkit-scrollbar-thumb { background-color: rgba(255, 255, 255, 0.2); border-radius: 3px; }
        .saved-card {
            flex-shrink: 0; width: 140px; height: 80px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.5); cursor: pointer; transition: all 0.3s; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }
        .saved-card:hover { transform: scale(1.05); border-color: #0ABAB5; }
        .saved-card img { width: 100%; height: 100%; object-fit: cover; transform: scale(1.3); }
    </style>
</head>

    <div id="main-view"></div>
    <div id="math-overlay"></div>
    
    <div class="watermark">杭州市天长观潮小学 王旭程</div>

    <div class="module-selector">
        <button class="module-btn active" data-target="module-surface">表面积</button>
        <button class="module-btn" data-target="module-volume">最小长方体</button>
        <button class="module-btn" data-target="module-views">三视图</button>
    </div>

    <div class="top-right-container">
        <div id="module-surface" class="toolbar-group">
            <button class="tool-btn highlight" id="btn-proj-lr">左右(黄)</button>
            <button class="tool-btn highlight" id="btn-proj-tb">上下(粉)</button>
            <button class="tool-btn highlight" id="btn-proj-fb">前后(红)</button>
            <button class="tool-btn highlight" id="btn-proj-all">🧊 整体</button>
            <button class="tool-btn" id="btn-reset-proj" style="background: rgba(255,255,255,0.15);">🔄 收回</button>
        </div>

        <div id="module-volume" class="toolbar-group hidden">
            <button class="tool-btn special" id="btn-volume">📦 补全体积</button>
            <button class="tool-btn highlight" id="btn-count">🔢 标数法(显/隐)</button>
            <button class="tool-btn" id="btn-reset-volume" style="background: rgba(255,255,255,0.15);">🔄 复原</button>
        </div>

        <div id="module-views" class="toolbar-group hidden">
            <button class="tool-btn highlight" id="btn-view-top">⬆️ 上视图</button>
            <button class="tool-btn highlight" id="btn-view-left">⬅️ 左视图</button>
            <button class="tool-btn highlight" id="btn-view-right">➡️ 右视图</button>
            <button class="tool-btn highlight" id="btn-view-front">⬇️ 前视图</button>
            <button class="tool-btn" id="btn-view-reset" style="background: rgba(255,255,255,0.15);">🔄 原视图</button>
        </div>
    </div>

    <div class="top-left-container">
        <div class="toolbar-group">
            <button class="tool-btn active" id="btn-interact" data-mode="interact">🖱️ 3D交互</button>
            <button class="tool-btn" id="btn-pen" data-mode="pen">🖍️ 粗体水笔</button>
            <button class="tool-btn" id="btn-eraser" data-mode="eraser">🧽 擦除</button>
            <button class="tool-btn" id="btn-clear-draw">🧹 清除墨迹</button>
        </div>
    </div>

    <div class="bottom-center-container">
        <div class="toolbar-group">
            <div class="color-picker-wrapper" title="更改所有立体图形颜色">
                <input type="color" id="cube-color-picker" value="#0ABAB5">
                <span>🎨 主题色</span>
            </div>
            <button class="tool-btn warning" id="btn-clear">🗑️ 清空</button>
            <button class="tool-btn highlight" id="btn-save" style="border-color: rgba(255,255,255,0.4); color:#eee;">💾 保存布局</button>
        </div>
    </div>

    <div id="saved-layouts"></div>
