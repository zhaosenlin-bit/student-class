	// Function to add the neon tube to the scene
	function addNeonTube(){ // Create the glow material with emissive property 
	   glowMaterial = new THREE.MeshStandardMaterial({ 
	        color: 0xff0000, // Initial red color
	        emissive: 0xffffff, // Emissive color for glowing
	        emissiveIntensity: 2, // Control intensity of the glow
	        transparent: true, 
	        opacity: 0.6 
	    });
	    const group = new THREE.Group();
	    //const clearmaterial = new THREE.MeshStandardMaterial({ color: 'white', transparent: true, opacity: 0.2 });
	
	    // Outer parts of the tube
	    const geometry = new THREE.CapsuleGeometry( 1.3, 4, 4, 8 ); 
	    const tube1 = new THREE.Mesh( geometry, glowMaterial ); 
	    const tube2 = new THREE.Mesh( geometry, glowMaterial ); 
	
	    // Inner glowing part of the tube
	    const geo = new THREE.CylinderGeometry(0.5, 0.5, 14);
	    
    	   const middle = new THREE.Mesh(geo, glowMaterial);
	
	    // Position the tube parts
	    middle.position.set(0, 0, 0);
	    tube1.position.set(0, 10, 0);
	    tube2.position.set(0, -10, 0);
	
	    // Add the components to the group
	    group.add(tube1);
	    group.add(tube2);
	    group.add(middle);
	
	    group.position.set(-50, -5, 10);
	    scene.add(group);
	}
	
	function blackScreen(){
		 var geo = new THREE.BoxGeometry(0.2, 12, 60);
            	var material = new THREE.MeshPhongMaterial({ color: 'black' });

        function addShape(shape, extrudeSettings, color, x, y, z, rx, ry, rz, s) {
            let geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
            var clearMaterial = new THREE.MeshPhongMaterial({
                color: "#ffffff",
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.4
            });

            let mesh = new THREE.Mesh(geometry, clearMaterial);
            mesh.position.set(x, y, z);
            mesh.rotation.set(rx, ry, rz);
            mesh.scale.set(s, s, s);
            scene.add(mesh);
            return mesh;
        }

	function lightBand(length, x, y, z, alpha, color) {
	    const geometry = new THREE.PlaneGeometry(length, bandWidth);
	    const material = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.6 });
	    const plane = new THREE.Mesh(geometry, material);
	
	    // Convert alpha to radians if it's in degrees
	    plane.rotation.y = THREE.MathUtils.degToRad(alpha);
	
	    plane.position.set(x, y, z);
	    lightArray.push(plane);
	    scene.add(plane);
	
	    return plane; // Ensure the plane is returned so 'band' can store it
	}
	
	function setGasGlowColor(gas) {
	   if (gas === 'white') {
	        glowMaterial.color.set(0xffffff); 
	        glowMaterial.emissive.set(0xffffff);
	
	        const whiteTexture = textureloader.load('textures/white_spec.png');
	        const whiteMaterial = new THREE.MeshBasicMaterial({ map: whiteTexture });
	        
	        if (screen) {  // Check if screen is defined
	            screen.material = whiteMaterial;
	            addWhiteEmissionSpectra();
	        } else {
	            console.error("Screen is undefined. Make sure blackScreen() has been called.");
	        }
	    } else if (gas === 'neon') {
		   scene.remove(screen);
		   blackScreen();
		cleanLightBand();	    
	        glowMaterial.color.set(0xff0000); 
	        glowMaterial.emissive.set(0xff0000); 
		addNeonEmissionSpectra();
	    } else if (gas === 'hydrogen') {
		   scene.remove(screen);
		   blackScreen();
		cleanLightBand();	    
	        glowMaterial.color.set(0xff69b4); // Pinkish color for hydrogen
	        glowMaterial.emissive.set(0xff69b4); // Pinkish emissive for hydrogen glow
		addHydrogenEmissionSpectra();
	    } else if (gas === 'helium') {
		   scene.remove(screen);
		   blackScreen();
		cleanLightBand();	    
	        glowMaterial.color.set(0x00ffff); // Cyan color for helium
	        glowMaterial.emissive.set(0x00ffff); // Cyan emissive for helium glow
		addHeliumEmissionSpectra();
	    } else if (gas === 'sodium') {
		   scene.remove(screen);
		   blackScreen();
		cleanLightBand();	    
	        glowMaterial.color.set(0xFFD700); // yellow-orange for sodium
	        glowMaterial.emissive.set(0xFFD700); // Cyan emissive for sodium glow
		addSodiumEmissionSpectra();
	    } else if (gas === 'mercury') {
		   scene.remove(screen);
		   blackScreen();
		cleanLightBand();	    
	        glowMaterial.color.set(0x33ffdd); // Dominant Blue-Green for mercury
	        glowMaterial.emissive.set(0x33ffdd); // Cyan emissive for mercury glow
		addMercuryEmissionSpectra();
	    } else if (gas === 'lithium') {
		   scene.remove(screen);
		   blackScreen();
		cleanLightBand();	    
	        glowMaterial.color.set(0xff2000); // Crimson Red color for lithium
	        glowMaterial.emissive.set(0xff2000); // Cyan emissive for lithium glow
		addLithiumEmissionSpectra();
	    }
	}

	function addLine(x1,y1,z1,x2,y2,z2){
		var arr = [new THREE.Vector3(x1,y1,z1),
			   new THREE.Vector3(x2,y2,z2)]; 
		var mat = new THREE.MeshBasicMaterial({color: "white"}); 
		var curve = new THREE.CatmullRomCurve3( arr );
		var geometry = new THREE.TubeGeometry( curve, 100, 0.3, 36, false ); 
		var  str = new THREE.Mesh(geometry, mat);
		scene.add(str);
		lightArray.push(str);
		return str;
	}

	function cleanLightBand() {
		for (let i = 0; i < lightArray.length; i++) {
			scene.remove(lightArray[i]);
		}
		renderer.renderLists.dispose();
	}
	
	function createRectangularWithSlit(x,y,z, alpha) {
	    	const geometry = new THREE.BoxGeometry( 1, 20, 24 ); 
		const material = new THREE.MeshPhongMaterial( {
			color: "#ffff00",    
			side:THREE.DoubleSide,
			transparent:true,
			opacity:0.6
		});
		const box = new THREE.Mesh( geometry, material ); 
		box.position.set(x,y,z);
	    	var filterGeometry = new THREE.PlaneGeometry(1, 12); // Narrow plane for the slit filter
	    	var filterMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide });
	    	var slit = new THREE.Mesh(filterGeometry, filterMaterial);
	    	slit.position.set(0, -3, 0); // Place filter in the middle of the scene
		box.add(slit);
		box.rotation.x = alpha;
		scene.add( box );
	}
	    
	function drawPlaneBetweenPoints(x1, z1, x2, z2, color = 0xffffff) {
	    // Calculate the distance between the two points
	    const length = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(z2 - z1, 2));
	
	    // Create the plane geometry with the calculated length and given width
	    const geometry = new THREE.PlaneGeometry(length, bandWidth);
	    const material = new THREE.MeshBasicMaterial({ color: color, transparent:true, opacity:0.6, side: THREE.DoubleSide });
	    const plane = new THREE.Mesh(geometry, material);
	
	    // Set the position of the plane to be the midpoint between the two points
	    const midpointX = (x1 + x2) / 2;
	    const midpointZ = (z1 + z2) / 2;
	    plane.position.set(midpointX, 0, midpointZ);
	
	    // Calculate the angle to rotate the plane to align it with the two points
	    const angle = Math.atan2(z2 - z1, x2 - x1);
	    plane.rotation.y = -angle; // Rotate to align with the x-z plane
	
	    plane.position.y = -5;
	    lightArray.push(plane);
	    scene.add(plane);
	
	    return plane; // Return the plane in case further manipulation is needed
	}

	function createBloom2(){
	    // the fake bloom is a group with 20 torii
	    // the oreol is simulated with opacity
	    var bloom = new THREE.Group();
	    bloom.position.y = 0;
	    scene.add(bloom);
	
	    for (var i = 0; i < 1; i += 0.05) {
	        var torus = new THREE.Mesh(
	            new THREE.TorusGeometry(20, 1 + i * i * 5, 20, 120), // Scale up outer radius and tube radius by 10
	            new THREE.MeshLambertMaterial({
	                color: i == 0 ? 'white' : 'red',
	                transparent: true,
	                opacity: 1 - Math.pow(i, 0.1)
	            })
	        );  
	        bloom.add(torus);
	    }
	}

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
	    
       function animate() {
	    requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
