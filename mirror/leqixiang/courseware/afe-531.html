<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🌞 3D晾房小课堂 · 热空气风干</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
      background: #fbf7f0;
      overflow: hidden;
      height: 100vh;
    }

    :root {
      --bg-warm: #fbf7f0;
      --panel-bg: #fff8ef;
      --panel-border: #f0dcc8;
      --text-dark: #3e2e22;
      --text-soft: #7a5f4a;
      --accent-sun: #f4a261;
      --accent-orange: #e76f51;
      --accent-warm: #e9c46a;
      --accent-blue: #2a9d8f;
      --shadow-light: rgba(180, 130, 80, 0.15);
      --panel-width: 290px;
      --header-h: 48px;
      --radius: 14px;
      --transition: 0.3s ease;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: var(--header-h);
      background: var(--panel-bg);
      border-bottom: 1px solid var(--panel-border);
    }
    #mobile-header h1 {
      font-size: 18px;
      color: var(--text-dark);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    #mobile-header .btn-toggle {
      background: none;
      border: 1px solid var(--panel-border);
      border-radius: 30px;
      padding: 6px 14px;
      font-size: 14px;
      color: var(--text-soft);
      cursor: pointer;
      background: white;
      transition: 0.2s;
    }
    #mobile-header .btn-toggle:hover {
      border-color: var(--accent-sun);
      color: var(--text-dark);
    }

    #main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ===== 左侧信息面板 ===== */
    #side-panel {
      width: var(--panel-width);
      min-width: var(--panel-width);
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      overflow-y: auto;
      padding: 16px 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      box-shadow: 4px 0 12px var(--shadow-light);
      z-index: 2;
    }

    .panel-section {
      padding: 12px 18px;
      border-bottom: 1px solid rgba(200, 170, 140, 0.3);
    }
    .panel-section:last-child {
      border-bottom: none;
    }
    .panel-section h3 {
      font-size: 14px;
      color: var(--accent-orange);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 700;
    }
    .panel-section h3::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--accent-sun);
      border-radius: 3px;
    }

    .panel-icon-text {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 8px 0;
      font-size: 15px;
      color: var(--text-dark);
      background: rgba(255, 255, 240, 0.6);
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(244, 162, 97, 0.2);
    }
    .panel-icon-text .emoji-big {
      font-size: 28px;
      line-height: 1;
    }

    .tip-bubble {
      background: #fff7e8;
      border-left: 4px solid var(--accent-sun);
      padding: 10px 14px;
      border-radius: 0 12px 12px 0;
      margin: 8px 0;
      font-size: 14px;
      color: var(--text-soft);
      line-height: 1.5;
      box-shadow: 0 2px 6px rgba(200, 150, 100, 0.1);
    }
    .tip-bubble strong {
      color: var(--accent-orange);
    }

    .mini-legend {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--text-soft);
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .legend-dot.orange {
      background: var(--accent-orange);
    }
    .legend-dot.blue {
      background: var(--accent-blue);
    }
    .legend-dot.yellow {
      background: var(--accent-warm);
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .btn {
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--panel-border);
      background: white;
      color: var(--text-soft);
      transition: all 0.2s;
      font-weight: 500;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
    }
    .btn:hover {
      border-color: var(--accent-sun);
      color: var(--accent-orange);
      background: #fffcf5;
    }
    .btn.active {
      border-color: var(--accent-orange);
      background: rgba(231, 111, 81, 0.08);
      color: var(--accent-orange);
    }
    .btn.accent {
      border-color: var(--accent-sun);
      background: var(--accent-sun);
      color: white;
    }
    .btn.accent:hover {
      background: #e08f4a;
      border-color: #e08f4a;
    }

    /* ===== 中央视口 ===== */
    #center-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #fcf5ed;
      touch-action: none;
    }

    #three-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 叠加信息卡片 (趣味知识气泡) */
    .info-card {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 248, 235, 0.94);
      border: 1px solid var(--accent-warm);
      border-radius: 20px;
      padding: 14px 24px;
      max-width: 380px;
      color: var(--text-dark);
      font-size: 16px;
      line-height: 1.6;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease, bottom 0.4s ease;
      z-index: 6;
      text-align: center;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 24px rgba(180, 120, 60, 0.2);
      font-weight: 500;
    }
    .info-card.visible {
      opacity: 1;
      bottom: 40px;
    }
    .info-card .emoji {
      font-size: 28px;
      display: inline-block;
      margin-right: 8px;
    }

    /* 旋转提示 */
    .hint-tip {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 248, 235, 0.8);
      backdrop-filter: blur(4px);
      padding: 8px 20px;
      border-radius: 40px;
      border: 1px solid var(--accent-warm);
      font-size: 14px;
      color: var(--text-soft);
      pointer-events: none;
      z-index: 5;
      white-space: nowrap;
      box-shadow: 0 2px 12px rgba(180, 130, 70, 0.1);
    }
    .hint-tip span {
      display: inline-block;
      animation: finger-wiggle 2.2s infinite ease-in-out;
    }
    @keyframes finger-wiggle {
      0%,100% { transform: rotate(0deg); }
      30% { transform: rotate(12deg) scale(1.1); }
      60% { transform: rotate(-6deg); }
    }

    /* ===== 响应式 ===== */
    @media (max-width: 820px) {
      #mobile-header {
        display: flex;
      }
      #side-panel {
        position: fixed;
        left: 0;
        top: var(--header-h);
        bottom: 0;
        z-index: 50;
        margin-left: calc(-1 * var(--panel-width) - 10px);
        transition: margin-left var(--transition);
        border-right: 1px solid var(--panel-border);
        box-shadow: 6px 0 30px rgba(0,0,0,0.08);
        border-radius: 0 12px 12px 0;
      }
      #side-panel.open {
        margin-left: 0;
      }
      .hint-tip {
        font-size: 12px;
        padding: 4px 14px;
        top: 12px;
      }
      .info-card {
        max-width: 280px;
        font-size: 14px;
        padding: 12px 18px;
        bottom: 20px;
      }
    }

    /* 滚动条美化 */
    #side-panel::-webkit-scrollbar {
      width: 4px;
    }
    #side-panel::-webkit-scrollbar-track {
      background: transparent;
    }
    #side-panel::-webkit-scrollbar-thumb {
      background: var(--panel-border);
      border-radius: 10px;
    }
  </style>
</head>

<div id="app">
  <!-- 移动端 header -->
  <header id="mobile-header">
    <h1>🏠 晾房风干</h1>
    <button class="btn-toggle" id="btnToggleSide">☀️ 知识</button>
  </header>

  <div id="main-layout">
    <!-- 左侧信息面板 -->
    <aside id="side-panel">
      <div class="panel-section">
        <h3>🌬️ 热空气风干</h3>
        <div class="panel-icon-text">
          <span class="emoji-big">🔥</span>
          <span><strong>热空气上升</strong>，穿过小孔带走湿气</span>
        </div>
        <div class="tip-bubble">
          💡 小孔让 <strong>干燥热风</strong> 流进来，<strong>湿气</strong> 从顶部排出去，水果干得又快又好！
        </div>
      </div>

      <div class="panel-section">
        <h3>🏗️ 晾房小秘密</h3>
        <div class="mini-legend">
          <div class="legend-item"><span class="legend-dot orange"></span> 热空气上升</div>
          <div class="legend-item"><span class="legend-dot blue"></span> 新鲜空气流入</div>
          <div class="legend-item"><span class="legend-dot yellow"></span> 小孔通风口</div>
        </div>
        <div class="tip-bubble" style="margin-top: 10px;">
          👆 <strong>点击墙面小孔</strong>，会弹出趣味知识哦！
        </div>
      </div>

      <div class="panel-section">
        <h3>🔄 视角控制</h3>
        <div class="btn-row">
          <button class="btn active" id="resetViewBtn">🔄 正面</button>
          <button class="btn" id="topViewBtn">⬆️ 俯视</button>
          <button class="btn" id="insideViewBtn">🏠 内部</button>
        </div>
        <p style="font-size:12px; color:var(--text-soft); margin-top: 8px;">👆 拖拽旋转 · 双指缩放</p>
      </div>

      <div class="panel-section">
        <h3>🧪 小实验</h3>
        <div class="tip-bubble">
          🌡️ 热空气比冷空气轻，所以会上升。<br>
          💨 风越大，水分跑得越快！
        </div>
      </div>
    </aside>

    <!-- 中央 3D 视口 -->
    <main id="center-panel">
      <div id="three-container"></div>

      <!-- 旋转提示 -->
      <div class="hint-tip" id="hintTip">👆 <span>拖拽</span> 旋转看看小孔</div>

      <!-- 趣味知识气泡 -->
      <div class="info-card" id="infoCard">
        <span class="emoji">🌬️</span> 小孔让热风钻进晾房，把湿气从顶部赶走！
      </div>
    </main>
  </div>
</div>
