    </div>

    <div id="select-screen" class="screen active">
        <div class="title">英雄知识大乱斗</div>
        <div class="top-bar">
            <button class="action-btn" onclick="document.getElementById('file-input-batch').click()">📂 一键上传英雄图片</button>
            <button class="action-btn" onclick="document.getElementById('file-input-quiz').click()">📝 导入题库文件 (.txt)</button>
            <button class="action-btn" onclick="document.getElementById('file-input-q-imgs').click()">📂 上传题目配图 (可选)</button>

            <!-- 1P -->
            <div class="team-slot" id="slot-a" onclick="triggerUpload('a')">
                <div class="slot-img-container"><img id="img-slot-a" class="pixel-img fighter-idle" src="" style="display:none"></div>
                <div class="team-label team-a-label">1P PLAYER</div>

                <div class="selected-name" id="name-slot-a"></div>
                <input type="file" id="file-input-a" accept="image/*" onchange="handleFileUpload(this, 'a')">
            </div>

            <div class="character-grid" id="char-grid"></div>

            <!-- 2P -->
            <div class="team-slot" id="slot-b" onclick="triggerUpload('b')">
                <div class="slot-img-container"><img id="img-slot-b" class="pixel-img fighter-idle" src="" style="display:none"></div>
                <div class="team-label team-b-label">2P PLAYER</div>
                <div class="upload-hint">点击上传图片</div>
                <div class="selected-name" id="name-slot-b"></div>
                <input type="file" id="file-input-b" accept="image/*" onchange="handleFileUpload(this, 'b')">
            </div>
        </div>
        <button id="start-btn" onclick="startVS()">READY TO FIGHT</button>
    </div>

        <div class="vs-logo-anim" id="vs-logo">VS</div>
