	<style>
/* This page was created on December 16, 2023 as a basis for most pages on this site  It is located in Physics Folder */

/* Properties of all the things are are general for the page */

body{
	background-color: #FFFFFF;
	margin:0px 0px; padding:0px;
	text-align:center;
}

/* Stuff for Navigation Menu */
#MainNav{
	position: relative;
	margin-top: 15px;
	left: 10px;
	width: 1000px;
	height: 20px;
	text-align: center;
}

.NavLink{
	display: inline-block;
	font-size: 18px;
	color: #990000;
	font-family: Georgia, "Times New Roman", Times, serif;
	text-align: center;
	text-decoration: none;
	width: 75px;
}

/* Properties of the buttons to be used on page */

.Button{
	height: 45px;
	padding-top: 5px;
	background-color: #c0c0c0;
	border: 2px #990000 solid;
	border-radius: 10px;
	text-align: center;
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:28px;
	color:#990000;
}

.ButtonLittleText{
	height: 40px;
	padding-top: 10px;
	background-color: #c0c0c0;
	border: 2px #990000 solid;
	border-radius: 10px;
	text-align: center;
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:22px;
	color:#990000;
}

.TallButton{
	height: 65px;
	padding-top: 10px;
	background-color: #c0c0c0;
	border: 2px #990000 solid;
	border-radius: 10px;
	text-align: center;
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:22px;
	color:#990000;
}

.DarkButton{
	height: 45px;
	padding-top: 5px;
	background-color: #000000;
	border: 2px #C0C0C0 solid;
	border-radius: 10px;
	text-align: center;
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:28px;
	color:#C0C0C0;
}

.MiniButton{
	height: 25px;
	padding-top: 5px;
	background-color: #c0c0c0;
	border: 2px #990000 solid;
	border-radius: 5px;
	text-align: center;
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:14px;
	color:#990000;
}

.InvisibleButton{

}

/* Properties of the main fonts to be used on page */

.Titles{
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:28px;
	color:#990000;
	text-align: center;
}

.Directions{
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:22px;
	color:#000000;
	text-align: center;
}

.LittleDirections{
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:18px;
	color:#990000;
	text-align: center;
}

/* Mainly used for labs for white text */

.LargeWhiteText{
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:28px;
	color:#FFFFFF;
	text-align: center;
}

/* Properties of the FullPage Div that holds everything in your webpage */

#FullPage {
	position: relative;
	width:1024px;
	padding-bottom: 50px;
	margin:0px auto; /* Right and left margin widths set to "auto" */
}

/* Properties of the MainBody Div that holds everything in your webpage */

#MainBody{
	position: relative;
	top: 0px;
}

/* Properties of the Program Title Div that holds title of your webpage */

#ProgramTitle{
	position: relative;
	margin-top: 15px;
	width: 1024px;
	height: 35px;
	text-align: center;
}


/*  ************************************* */

/*  This section is for the splash screen or the directions that occur before the program is actually started */

/* Properties of the Overview Section Div that holds the introductory information for your program */

#OverviewSection{
	position: absolute;
	top: 50px;
	left: 50px;
	width: 925px;
	height: 600px;
	border: black;
	border-style: dashed;
	border-width: 5px;
	display: block;
}

#LabDirections{
	position: absolute;
	top: 25px;
	left: 50px;
	width: 800px;
}


#PersonName{
	position: absolute;
	top: 250px;
	left: 25px;
	width: 850px;
	text-align: center;
}

.NameInput{
	position: relative;
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:18px;
	color:#990000;
	width: 250px;
	left: 0px;
	height: 25px;
	text-align: center;
	margin-bottom: 25px;
	border: black;
	border-style: solid;
	border-width: 2px;
}

#OverviewPicture{
	position: absolute;
	top: 375px;
	left: 300px;
	width: 300px;
	height: 200px;
	border: black;
	border-style: solid;
	border-width: 2px;
}

#BeginButton{
	position: absolute;
	top: 300px;
	left: 375px;
	width: 150px;
}

#AvailableLanguages{
	position: absolute;
	top: 375px;
	left: 25px;
	width: 250px;
	height: 100px;
}

#LanguageTitle{
	position: absolute;
	top: 0px;
	left: 0px;
	width: 250px;
	height: 25px;
}

#LanguageDropDown{
	position: absolute;
	top: 40px;
	left: 0px;
	width: 250px;
	height: 25px;
	display: none;
}

/*  ************************************* */

/* This is the section that contains all the stuff that is part of the actual running program */

/* This ID is for entire area of the program that will display as part of the simulation */

#LabSection{
	position: absolute;
	top: 50px;
	left: 0px;
	display: none;
}

/* This ID is for part of the program that will hold the Canvas with all the drawings and animations. */

#DrawingSectionOne{
	position: absolute;
	top: 0px;
	width: 925px;
	left: 50px;
	height: 600px;
	border: black;
	border-style: dashed;
	border-width: 5px;
}

#DrawingSectionTwo{
	position: absolute;
	top: 625px;
	width: 925px;
	left: 50px;
	height: 602px;
	border: black;
	border-style: dashed;
	border-width: 5px;
}

/*  ************************************* */

/*  This section is for the Information about a Single Program */

#BottomPart{
	position: relative;
	margin-top: 15px;
	left: 0px;
	width: 1024px;
}

#BottomPartWTopBox{
	position: relative;
	margin-top: 15px;
	left: 0px;
	width: 1030px;
	border-top: 3px solid #000000;
}


#PageDescriptionText{
	position: relative;
	margin-top: 15px;
	padding-left: 25px;
	padding-right: 25px;
	left: 0px;
	width: 950px;
}

#ProgramHolderBig{
	position: relative;
	top: 0px;
	left: 0px;
	width: 974px;
	display: block;
	margin: 0 auto;
	padding: 25px;
	border: 3px solid #000000;
}

#ProgramPictureBig{
	position: relative;
	margin-top: 15px;
	left: 335px;
	width: 300px;
	height: 200px;
	border: black;
	border-style: solid;
	border-width: 2px;
}

#DescriptionOfProgram{
	position: relative;
	margin-top: 25px;
}

#ResourceTitle{
	position: relative;
	margin-top: 25px;
}

#ResourceList{
	position: relative;
	margin-top: 15px;
	left: 250px;
	width: 500px;
	text-align: left;
}

#ResourceList li {
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:16px;
	height: 35px;
}

/* Stuff for list of many programs like what's new page */

.ProgramHolder{
	position: relative;
	top: 0px;
	padding-bottom: 25px;
	left: 0px;
	width: 1024px;
	height: 125px;
	border-bottom: 3px solid #000000;
	border-right: 3px solid #000000;
	border-left: 3px solid #000000;
}

.ProgramLeft{
	position: absolute;
	top: 0px;
	left: 0px;
	height: 150px;
	width: 500px;
	background-color: #c0c0c0;
	border-right: 3px solid #000000;
}

.ProgramRight{
	position: absolute;
	top: 0px;
	left: 510px;

}

.ProgramTitle{
	position: absolute;
	top: 0px;
	padding-top: 16px;

	width: 290px;
	height: 50px;
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:18px;
	color:#990000;
	text-align: center;
}


.ProgramPicture{
	position: absolute;
	top: 25px;
	left: 10px;
	width: 150px;
	height: 100px;
	border: 1px solid #000000;
}

.minipicture{
	height: 100px;
	width: 150px;

}



.ProgramModify{
	position: absolute;
	top: 110px;
	left: 160px;

	height: 40px;
	font-family:Georgia, "Times New Roman", Times, serif;
	font-size:16px;
	color:#000099;
	text-align: center;
}

</style>

// Easy writing on the canvas (x, y are position; t is text, s is size, c is color, m is how it modifies 0 for left, 0.5 for center, and 1 for right)

function WriteText(x, y, t, s, c, m){
	ctx.fillStyle = c;
	ctx.font= s + "px Arial";
	temptext = t;
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x - m*textWidth;
	ctx.fillText(temptext,xposition, y);
}

function WriteText2(x, y, t, s, c, m){
	ctx2.fillStyle = c;
	ctx2.font= s + "px Arial";
	temptext = t;
	metrics = ctx2.measureText(temptext);
	textWidth = metrics.width;
	xposition = x - m*textWidth;
	ctx2.fillText(temptext,xposition, y);
}

// Easy writing on the canvas (x, y are position; t is text, s is size, c is color, m is how it modifies 0 for left, 0.5 for center, and 1 for right, f is for font)

function WriteTextWFont(x, y, t, s, c, m, f){
	ctx.fillStyle = c;
	ctx.font= s + "px " + f;
	temptext = t;
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x - m*textWidth;
	ctx.fillText(temptext,xposition, y);
}

// Drawing Straight line between two points.

function DrawLine(xi, yi, xf, yf, lt, lc){
	ctx.strokeStyle = lc;
	ctx.lineWidth = lt;
	ctx.beginPath();
	ctx.moveTo(xi, yi);
	ctx.lineTo(xf, yf);
	ctx.stroke();
}

	ctx.moveTo(xrect+curverectangle, yrect);
	ctx.lineTo(xrect+wrect-curverectangle, yrect);
	ctx.arc(xrect+wrect-curverectangle, yrect+curverectangle, curverectangle, 1.5*Math.PI, 0*Math.PI, false);
	ctx.lineTo(xrect+wrect, yrect+hrect-curverectangle);
	ctx.arc(xrect+wrect-curverectangle, yrect+hrect-curverectangle, curverectangle, 0.0*Math.PI, 0.5*Math.PI, false);
	ctx.lineTo(xrect+curverectangle, yrect+hrect);
	ctx.arc(xrect+curverectangle, yrect+hrect-curverectangle, curverectangle, 0.5*Math.PI, 1.0*Math.PI, false);
	ctx.lineTo(xrect, yrect+curverectangle);
	ctx.arc(xrect+curverectangle, yrect+curverectangle, curverectangle, 1.0*Math.PI, 1.5*Math.PI, false);
	ctx.closePath();
	ctx.fill();
	ctx.stroke();
}

//  Draw a compass Rose, x, y is the center of the rose, r is the radius of the rose, alph is the transparency, b is the buffer for the arrows

function CompassRose(x, y, r, alph, b, ts){
	ctx.globalAlpha = alph;
	as = b;
	ctx.lineWidth = 2;
	ctx.strokeStyle = "#000000";
	ctx.beginPath();
	ctx.moveTo(x,y);
	ctx.lineTo(x+r, y);
	ctx.moveTo(x+r, y);
	ctx.lineTo(x+r-as, y+as);
	ctx.moveTo(x+r, y);
	ctx.lineTo(x+r-as, y-as);
	ctx.moveTo(x,y);
	ctx.lineTo(x-r, y);
	ctx.moveTo(x-r, y);
	ctx.lineTo(x-r+as, y+as);
	ctx.moveTo(x-r, y);
	ctx.lineTo(x-r+as, y-as);

	ctx.moveTo(x,y);
	ctx.lineTo(x, y+r);
	ctx.moveTo(x, y+r);
	ctx.lineTo(x+as, y+r-as);
	ctx.moveTo(x, y+r);
	ctx.lineTo(x-as, y+r-as);
	ctx.moveTo(x,y);
	ctx.lineTo(x, y-r);
	ctx.moveTo(x, y-r);
	ctx.lineTo(x+as, y-r+as);
	ctx.moveTo(x, y-r);
	ctx.lineTo(x-as, y-r+as);
	ctx.stroke();

	WriteText(x+r+10, y+5, "0°", ts, "#000000", 0);
	WriteText(x-40, y - r + 10, "90°", ts, "#000000", 0);
	WriteText(x - r - 10, y+5, "180°", ts, "#000000", 1.0);
	WriteText(x + 15, y + r + 10, "270°", ts, "#000000", 0.0);

	ctx.globalAlpha = 1.0;
}

// Draw Meters for analog measurement (x,y) location, w is width or size, s is speed, maxs is maximum speed, n is name, u is unit, l is number of lines, dp is decimalplaces, fs is fontsize

function DrawShowMeter(x, y, w, s, maxs, n, u, l, dp, fs, silly = ""){
	h = 0.8*w;
	MaxDisplayTime = maxs;
	TimeIncrements = MaxDisplayTime/l;
	if (s <= MaxDisplayTime){
		NeedlePercent = s/MaxDisplayTime;
	}
	else{
		NeedlePercent = 1;
	}

	LargeFontSize = 1.5*fs;
	SmallFontSize = 1*fs;

	needleanglerotate = 7*Math.PI/10 + NeedlePercent*1.6*Math.PI;

	radiusofmeter = 0.40*w;
	//body
	DrawRectangle(x, y, w, w, 20, "#FFFFFF", "#555555", 3);

	//circle for face
	ctx.fillStyle = "#666666";
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.arc(x+0.5*w, y+0.5*w,1.05*radiusofmeter, 0, 2*Math.PI);
	ctx.stroke();
	ctx.fill();

	WriteText(x+0.5*w,y+0.41*w,n,LargeFontSize,"#DDDDDD",0.5);
	WriteText(x+0.5*w,y+0.65*w,u,LargeFontSize,"#DDDDDD",0.5);
	WriteText(x+0.5*w,y+0.85*w,silly,SmallFontSize,"#82f3ff",0.5);


	//needle center
	ctx.fillStyle = "#000000";
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 1;
	ctx.beginPath();
	ctx.arc(x+0.5*w, y+0.5*w,4, 0, 2*Math.PI);
	ctx.stroke();
	ctx.fill();

	//Markings and Numbers
	for (i = 0; i <= l; i++){
		anglerotate = 7*Math.PI/10+i*(64/l)*Math.PI/40;
		ctx.save();
		ctx.translate(x+0.5*w, y+0.5*w);
		ctx.rotate(anglerotate);
		ctx.beginPath();
		if (i%10 == 0){
			ctx.strokeStyle = "#FFFFFF";
			ctx.lineWidth = 2;
			starttickmark = 0.80*radiusofmeter;
			endtickmark = 1.05*radiusofmeter;
		}
		else if (i%5 == 0){
			ctx.strokeStyle = "#FFFFFF";
			ctx.lineWidth = 1.5;
			starttickmark = 0.85*radiusofmeter;
			endtickmark = 1.02*radiusofmeter;
		}
		else{
			ctx.strokeStyle = "#FFFFFF";
			ctx.lineWidth = 1;
			starttickmark = 0.9*radiusofmeter;
			endtickmark = 1.0*radiusofmeter;
		}
		ctx.moveTo(starttickmark, 0);
		ctx.lineTo(endtickmark, 0);
		ctx.stroke();
		if (i%10 == 0){
			temptext = i*TimeIncrements;
			ctx.save();
			ctx.translate(0.65*radiusofmeter, 0);
			ctx.rotate(-1.0*anglerotate);
			WriteText(0, 0,temptext.toFixed(dp),SmallFontSize,"#FFFFFF",0.5);
			ctx.restore();
		}

		ctx.restore();
	}

	ctx.strokeStyle = "#FF0000";
	ctx.lineWidth = 1;
	ctx.save();
	ctx.translate(x+0.5*w, y+0.5*w);
	ctx.rotate(needleanglerotate);
	ctx.beginPath();
	ctx.moveTo(0, 0);
	ctx.lineTo(1.0*radiusofmeter, 0);

	ctx.stroke();
	ctx.restore();
}

function DrawFullArrow(x, y, h, w, a, lc, fc, lw){
	let arad = a*Math.PI/180;
	ctx.lineWidth = lw;
	ctx.strokeStyle = lc;
	ctx.fillStyle = fc;
	ctx.save();
	ctx.translate(x, y);
	ctx.rotate(arad);
	ctx.beginPath();
	ctx.moveTo(0, 0 - 0.5*h);
	ctx.lineTo(0 + 0.5*w, 0 - 0.1667*h);
	ctx.lineTo(0 + 0.25*w, 0 - 0.1667*h);
	ctx.lineTo(0 + 0.25*w, 0 + 0.5*h);
	ctx.lineTo(0 - 0.25*w, 0 + 0.5*h);
	ctx.lineTo(0 - 0.25*w, 0 - 0.1667*h);
	ctx.lineTo(0 - 0.5*w, 0 - 0.1667*h);
	ctx.lineTo(0, 0 - 0.5*h);
	ctx.closePath();
	ctx.stroke();
	ctx.fill();
	ctx.restore();
}

function DrawCoordinates(x, y){
	// X-Y Axis
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 1.0
	ctx.beginPath();
	ctx.moveTo(x-200, y);
	ctx.lineTo(x+200, y);
	ctx.moveTo(x, y-200);
	ctx.lineTo(x, y+200);
	ctx.stroke();


	ctx.beginPath();
	for (i = -1; i<=21; i++){
		if (i%5 == 0){
			offset = 10;
		}
		else{
			offset = 5;
		}
		ctx.moveTo(x-150+15*i, y-offset);
		ctx.lineTo(x-150+15*i, y+offset);
		ctx.moveTo(x-offset, y-150+15*i);
		ctx.lineTo(x+offset, y-150+15*i)
	}
	ctx.stroke();
}


function DrawGhostShowMeter(x, y, w, s, maxs, n, u, l, dp, fs, silly = ""){
	h = 0.8*w;
	MaxDisplayTime = maxs;
	TimeIncrements = MaxDisplayTime/l;
	if (s <= MaxDisplayTime){
		NeedlePercent = s/MaxDisplayTime;
	}
	else{
		NeedlePercent = 1;
	}

	LargeFontSize = 1.5*fs;
	SmallFontSize = 1*fs;

	needleanglerotate = 7*Math.PI/10 + NeedlePercent*1.6*Math.PI;

	radiusofmeter = 0.40*w;
	//body
	DrawRectangle(x, y, w, w, 20, "#FFFFFF", "#EEEEEE", 3);

	//circle for face
	ctx.fillStyle = "#EEEEEE";
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.arc(x+0.5*w, y+0.5*w,1.05*radiusofmeter, 0, 2*Math.PI);
	ctx.stroke();
	ctx.fill();

	WriteText(x+0.5*w,y+0.41*w,n,LargeFontSize,"#000000",0.5);
	WriteText(x+0.5*w,y+0.65*w,u,LargeFontSize,"#000000",0.5);
	//WriteText(x+0.5*w,y+0.85*w,silly,SmallFontSize,"#82f3ff",0.5);


	//needle center
	ctx.fillStyle = "#000000";
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 1;
	ctx.beginPath();
	ctx.arc(x+0.5*w, y+0.5*w,4, 0, 2*Math.PI);
	ctx.stroke();
	ctx.fill();

	//Markings and Numbers
	for (i = 0; i <= l; i++){
		anglerotate = 7*Math.PI/10+i*(64/l)*Math.PI/40;
		ctx.save();
		ctx.translate(x+0.5*w, y+0.5*w);
		ctx.rotate(anglerotate);
		ctx.beginPath();
		if (i%10 == 0){
			ctx.strokeStyle = "#000000";
			ctx.lineWidth = 2;
			starttickmark = 0.80*radiusofmeter;
			endtickmark = 1.05*radiusofmeter;
		}
		else if (i%5 == 0){
			ctx.strokeStyle = "#000000";
			ctx.lineWidth = 1.5;
			starttickmark = 0.85*radiusofmeter;
			endtickmark = 1.02*radiusofmeter;
		}
		else{
			ctx.strokeStyle = "#000000";
			ctx.lineWidth = 1;
			starttickmark = 0.9*radiusofmeter;
			endtickmark = 1.0*radiusofmeter;
		}
		ctx.moveTo(starttickmark, 0);
		ctx.lineTo(endtickmark, 0);
		ctx.stroke();
		if (i%10 == 0){
			temptext = i*TimeIncrements;
			ctx.save();
			ctx.translate(0.65*radiusofmeter, 0);
			ctx.rotate(-1.0*anglerotate);
			WriteText(0, 0,temptext.toFixed(dp),SmallFontSize,"#000000",0.5);
			ctx.restore();
		}

		ctx.restore();
	}


	ctx.restore();
}

function DrawLineArrow(x, y, l, lt, w, c, a){
	ctx.save();
	ctx.translate(x, y);
	ctx.rotate(a);
	ctx.lineWidth = lt;
	ctx.strokeStyle = c;
	ctx.beginPath();
	ctx.moveTo(0, 0);
	ctx.lineTo(l, 0);
	ctx.moveTo(l - w, 0 - w);
	ctx.lineTo(l, 0);
	ctx.lineTo(l - w, 0 + w);
	ctx.stroke();
	ctx.restore();
}

function DrawDoubleLineArrow(x, y, l, lt, w, c, a){
	ctx.save();
	ctx.translate(x, y);
	ctx.rotate(a);
	ctx.lineWidth = lt;
	ctx.strokeStyle = c;
	ctx.beginPath();
	ctx.moveTo(0, 0);
	ctx.lineTo(l, 0);
	ctx.moveTo(l - w, 0 - w);
	ctx.lineTo(l, 0);
	ctx.lineTo(l - w, 0 + w);
	ctx.moveTo(0 + w, 0 - w);
	ctx.lineTo(0, 0);
	ctx.lineTo(0 + w, 0 + w);
	ctx.stroke();
	ctx.restore();
}

function DrawCharge(){
	ctx.fillStyle = "#00ff00";
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 0.5;
	ctx.beginPath();
	ctx.arc(XPos, YPos, 5, 0, 2*Math.PI);
	ctx.stroke();
	ctx.fill();
}

function DrawRuler(x,y,h){
	w = 900 - x;
	ctx.fillStyle = "#ffe9ad";
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 0.5;
	ctx.fillRect(x-10, y, w+20, h);
	ctx.strokeRect(x-10, y, w+20, h);

	ctx.beginPath();
	for (i = 0; i < 71; i++){
		if (i%5 == 0){
			stoppoint = 25;
		}
		else{
			stoppoint = 15;
		}
		ctx.moveTo(x+i*10,y+h);
		ctx.lineTo(x+i*10,y+h-stoppoint);

		if (i%10 == 0){
			WriteText(x+i*10,y+h-stoppoint-5,i.toFixed(0),16,"#000000",0.5);
		}
	}
	ctx.stroke();

	WriteText(x+0.99*w,y+h-stoppoint-30,"mm",16,"#000000",0.5);
}

function PowerSupply(x,y,w,a,d){

	PowerSupplyScale = w/400;
	h = w/2;

	// body
	ctx.fillStyle = "#99a0a5";
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 5*PowerSupplyScale;
	ctx.beginPath();
	ctx.lineCap="round";
	ctx.moveTo(x-0.5*w,y-0.5*h);
	ctx.lineTo(x+0.5*w,y-0.5*h);
	ctx.lineTo(x+0.5*w,y+0.5*h);
	ctx.lineTo(x-0.5*w,y+0.5*h);
	ctx.lineTo(x-0.5*w,y-0.5*h);
	ctx.lineJoin = 'round';
	ctx.stroke();
	ctx.closePath();
	ctx.fill();

	ctx.lineWidth = PowerSupplyScale;
	// black border around display
	ctx.fillStyle = "#000000";
	ctx.strokeStyle = "#000000";
	ctx.beginPath();
	ctx.moveTo(x-0.45*w,y-0.45*h);
	ctx.lineTo(x+0.05*w,y-0.45*h);
	ctx.lineTo(x+0.05*w,y-0.15*h);
	ctx.lineTo(x-0.45*w,y-0.15*h);
	ctx.lineTo(x-0.45*w,y-0.45*h);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();

	// display
	ctx.fillStyle = "#d1eadf";
	ctx.strokeStyle = "#000000";
	ctx.beginPath();
	ctx.moveTo(x-0.35*w,y-0.40*h);
	ctx.lineTo(x-0.05*w,y-0.40*h);
	ctx.lineTo(x-0.05*w,y-0.20*h);
	ctx.lineTo(x-0.35*w,y-0.20*h);
	ctx.lineTo(x-0.35*w,y-0.40*h);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	if (Power == "on"){
		WriteText(x-0.11*w, y-0.25*h, Voltages[voltagenumber].toFixed(0), 30*PowerSupplyScale, "#000000", 1.0);
		WriteText(x-0.1*w, y-0.25*h, "V", 14*PowerSupplyScale, "#000000", 0);
	}



	// Power Switch
	ctx.fillStyle = "#000000";
	ctx.strokeStyle = "#000000";
	ctx.beginPath();
	ctx.moveTo(x-0.40*w,y+0.2*h);
	ctx.lineTo(x-0.30*w,y+0.2*h);
	ctx.lineTo(x-0.30*w,y+0.45*h);
	ctx.lineTo(x-0.40*w,y+0.45*h);
	ctx.lineTo(x-0.40*w,y+0.2*h);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();

	if (Power == "on"){
		ctx.fillStyle = "#3a3c3a";
		ctx.strokeStyle = "#000000";
		ctx.beginPath();
		ctx.moveTo(x-0.38*w,y+0.22*h);
		ctx.lineTo(x-0.32*w,y+0.22*h);
		ctx.lineTo(x-0.32*w,y+0.33*h);
		ctx.lineTo(x-0.31*w,y+0.43*h);
		ctx.lineTo(x-0.37*w,y+0.43*h);
		ctx.lineTo(x-0.38*w,y+0.33*h);
		ctx.lineTo(x-0.38*w,y+0.22*h);
		ctx.stroke();
		ctx.closePath();
		ctx.fill();
		ctx.fillStyle = "#21ec6d";
		ctx.strokeStyle = "#FFFFFF";
		ctx.beginPath();
		ctx.arc(x-0.35*w, y+0.08*h, 0.02*h, 0, 2*Math.PI);
		ctx.stroke();
		ctx.closePath();
		ctx.fill();
	}
	else {
		ctx.fillStyle = "#3a3c3a";
		ctx.strokeStyle = "#000000";
		ctx.beginPath();
		ctx.moveTo(x-0.37*w,y+0.22*h);
		ctx.lineTo(x-0.31*w,y+0.22*h);
		ctx.lineTo(x-0.32*w,y+0.33*h);
		ctx.lineTo(x-0.32*w,y+0.43*h);
		ctx.lineTo(x-0.38*w,y+0.43*h);
		ctx.lineTo(x-0.38*w,y+0.33*h);
		ctx.lineTo(x-0.37*w,y+0.22*h);
		ctx.stroke();
		ctx.closePath();
		ctx.fill();
		ctx.fillStyle = "#e4ece2";
		ctx.strokeStyle = "#FFFFFF";
		ctx.beginPath();
		ctx.arc(x-0.35*w, y+0.08*h, 0.02*h, 0, 2*Math.PI);
		ctx.stroke();
		ctx.closePath();
		ctx.fill();
	}


	WriteText(x-0.35*w, y+0.17*h, "POWER",12*PowerSupplyScale,"#FFFFFF",0.5);
	WriteText(x-0.45*w, y+0.3*h, "|",16*PowerSupplyScale,"#FFFFFF",0.5);
	WriteText(x-0.45*w, y+0.45*h, "O",16*PowerSupplyScale,"#FFFFFF",0.5);

	//Text for Company
	WriteText(x+0.3*w, y-0.4*h, "L'Enfant Corp.",18*PowerSupplyScale,"#FFFFFF",0.5);
	WriteText(x+0.3*w, y-0.3*h, "DC Power Supply",18*PowerSupplyScale,"#FFFFFF",0.5);

	//VoltageKnob
	ctx.fillStyle = "#3f403e";
	ctx.strokeStyle = "#FFFFFF";
	ctx.beginPath();
	ctx.arc(x+0.3*w, y-0.0*h, 0.2*h, 0, 2*Math.PI);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	ctx.fillStyle = "#FFFFFF";
	ctx.strokeStyle = "#FFFFFF";
	ctx.beginPath();
	ctx.arc(x+0.37*w, y+0.20*h, 0.02*h, 0, 2*Math.PI);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	ctx.beginPath();
	ctx.arc(x+0.22*w, y+0.20*h, 0.02*h, 0, 2*Math.PI);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();

	ctx.strokeStyle = "#FFFFFF";
	ctx.save();
	ctx.translate(x+0.3*w, y-0.0*h);
	ctx.rotate(a);
	ctx.beginPath();
	ctx.moveTo(0,0);
	ctx.lineTo(0,0.2*h);
	ctx.stroke();
	ctx.closePath();
	ctx.restore();

	//ConnectingWire Holes

	ctx.fillStyle = "#000000";
	ctx.strokeStyle = "#c0c0c0";
	ctx.lineWidth = PowerSupplyScale*3;
	ctx.beginPath();
	ctx.arc(x+0.20*w, y+0.38*h, 0.07*h, 0, 2*Math.PI);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	ctx.strokeStyle = "#333333";
	ctx.lineWidth = PowerSupplyScale*10;
	ctx.beginPath();
	ctx.moveTo(x+0.20*w, y+0.38*h);
	ctx.lineTo(x+0.20*w, y+0.50*h);
	ctx.quadraticCurveTo(x+0.20*w, y+0.55*h, x+0.15*w, y+0.55*h);
	ctx.lineTo(x-0.30*w, y+0.60*h);
	ctx.arc(x-0.30*w, y+0.80*h, 0.1*w, 1.5*Math.PI, 1.0*Math.PI, true);
	ctx.lineTo(x-0.40*w, y+1.25*h);
	ctx.arc(x-0.30*w, y+1.25*h, 0.1*w, 1.0*Math.PI, 0.5*Math.PI, true);
	ctx.stroke();
	ctx.closePath();
	WriteText(x+0.11*w, y+0.43*h, "-", 42*PowerSupplyScale, "#c0c0c0", 0);


	ctx.fillStyle = "#FF0000";
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = PowerSupplyScale*3;
	ctx.beginPath();
	ctx.arc(x+0.40*w, y+0.38*h, 0.07*h, 0, 2*Math.PI);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	ctx.strokeStyle = "#FF0000";
	ctx.lineWidth = PowerSupplyScale*10;
	ctx.beginPath();
	ctx.moveTo(x+0.40*w, y+0.38*h);
	ctx.lineTo(x+0.40*w+d, y+0.38*h);
	ctx.arc(x+0.40*w+d, y+0.58*h, 0.1*w, 1.5*Math.PI, 0.0*Math.PI, false);
	ctx.lineTo(x+0.50*w+d, y+1.25*h);
	ctx.arc(x+0.40*w+d, y+1.25*h, 0.1*w, 0.0*Math.PI, 0.5*Math.PI, false);
	ctx.lineTo(x+d-10, y+1.45*h);
	ctx.stroke();
	ctx.closePath();
	WriteText(x+0.28*w, y+0.45*h, "+", 42*PowerSupplyScale, "#c0c0c0", 0);

	//Fire Charge Button

	WriteText(x-0.1*w,y+0.05*h,languages[selectedLanguage].ProgramWords.two + " e-",20*PowerSupplyScale,"#FFFFFF", 0.5);

	ctx.fillStyle = "#990000";
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = PowerSupplyScale*3;
	ctx.beginPath();
	ctx.arc(x-0.1*w,y+0.25*h, 0.15*h, 0, 2*Math.PI);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();

}

function ChangePower(){
	if (Running == "no"){
		Running = "yes";
		StartMotion();

	}
	else{
		Running = "no";
		ResetSystem();
	}
}

function SwitchVoltage(x){
	voltagenumber = voltagenumber + x;
	if (voltagenumber < 0){
		voltagenumber = 0;
	}
	if (voltagenumber > 9){
		voltagenumber = 9;
	}
	CalculateParameters();
}

function SwitchLocation(x){
	locationnumber = locationnumber + x;
	if (locationnumber < 0){
		locationnumber = 0;
	}
	if (locationnumber > 9){
		locationnumber = 9;
	}
	CalculateParameters();
}


function SwitchPower(){
	if (Power == "on"){
		Power = "off";
		$("#FireButton").hide();
		$("#VoltageUp").hide();
		$("#VoltageDown").hide();
	}
	else {
		Power = "on";
		$("#FireButton").show();
		$("#VoltageUp").show();
		$("#VoltageDown").show();
	}
	CalculateParameters();
}

function FireCharge(){
	$("#FireButton").hide();
	$("#VoltageUp").hide();
	$("#VoltageDown").hide();
	$("#MovePlateLeft").hide();
	$("#MovePlateRight").hide();
	$("#PowerButton").hide();
	$("#ResetButton").show();
	XPos = StartXPos;
	YPos = 400;
	ShowCharge = "yes";
	Moving = "yes";
	ShowArrows = "no";
	elapsedtime = 0;
}

function ResetSystem(){
	$("#FireButton").show();
	$("#VoltageUp").show();
	$("#VoltageDown").show();
	$("#MovePlateLeft").show();
	$("#MovePlateRight").show();
	$("#PowerButton").show();
	$("#ResetButton").hide();
	XPos = StartXPos;
	YPos = 400;
	ShowCharge = "yes";
	Moving = "no";
	ShowArrows = "yes";
	elapsedtime = 0;
}

function DrawArrow(x, y, h, w, c, r){
	ctx.save();
	ctx.translate(x, y+0.5*h);
	ctx.rotate(r);
	ctx.fillStyle = c;
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 1;
	ctx.beginPath();
	ctx.moveTo(0,-0.5*h);
	ctx.lineTo(0+w, -0.5*h+w);
	ctx.lineTo(0+0.5*w, -0.5*h+w);
	ctx.lineTo(0+0.5*w, -0.5*h+h);
	ctx.lineTo(0-0.5*w, -0.5*h+h);
	ctx.lineTo(0-0.5*w, -0.5*h+w);
	ctx.lineTo(0-w, -0.5*h+w);
	ctx.lineTo(0,-0.5*h);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	ctx.restore();
}


</script>
