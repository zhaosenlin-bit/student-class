# 乐启享课件库 · 挂在官网目录下的写法
#
# 课件库本体放在对象存储上，官网自己的服务器只做转发，一份字节也不用
# 放在服务器磁盘上。
#
# 课件库在桶里自己的前缀 leqixiang-courseware/ 下面，
# 和同一个账号下别的系统的资源各走各的，互不掺和。
#
# 把下面的 <桶名> 换成 work/oss.txt 里写的那个桶名。
#
# 用法：把下面这几段放进 codebn.cn 的 server 段里，
#       课件库就挂在 https://codebn.cn/leqixiang/ 下面。

# 少了最后一个斜杠的，先补上，免得落到别的地址上去。
location = /leqixiang {
    return 301 /leqixiang/;
}

# 目录页：对象存储没有目录首页，直接给首页文件。
location = /leqixiang/ {
    proxy_pass https://<桶名>.oss-cn-hangzhou.aliyuncs.com/leqixiang-courseware/index.html;

    proxy_http_version 1.1;
    proxy_set_header Host <桶名>.oss-cn-hangzhou.aliyuncs.com;
    proxy_redirect off;

    proxy_hide_header Content-Disposition;
    proxy_hide_header x-oss-force-download;
}

# 课件库本体。课件里的地址都是相对的，转发时不能被改写掉。
#
# 这个 ^~ 不能去掉。官网的 server 段里有一条
#   location ~* \.(env|git|gitignore|md|sql|sh|bat)$ { deny all; }
# 正则 location 的优先级比普通前缀 location 高，这一条会先被它抢走，
# 课件里有 393 门课带着「启动课件.sh」，少了 ^~ 就会被挡成 403。
# 浏览器打包下载时不会报错，会把 403 的错误页当文件内容收进压缩包，
# 课件包就坏了。加上 ^~ 之后这一段不再走正则检查。
location ^~ /leqixiang/ {
    proxy_pass https://<桶名>.oss-cn-hangzhou.aliyuncs.com/leqixiang-courseware/;

    proxy_http_version 1.1;
    proxy_set_header Host <桶名>.oss-cn-hangzhou.aliyuncs.com;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_redirect off;

    # 这个桶开了「强制下载」，回来的每个对象都带着
    # Content-Disposition: attachment。浏览器会把它当成文件下载，
    # 而不是打开成网页——网页就白费了。这个头去掉，网页才是网页。
    # 课件自己的「下载」按钮不受影响：它是在浏览器里打包的。
    proxy_hide_header Content-Disposition;
    proxy_hide_header x-oss-force-download;

    # 缓存的规矩写在上传的时候：页面和清单改得勤，缓存短一点；
    # 素材和脚本不会变，缓存久一点。转发的响应里带着这些头，不用再写一遍。
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
