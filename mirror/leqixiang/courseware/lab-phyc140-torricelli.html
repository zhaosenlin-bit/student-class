<body>
	<div id="info" style="text-align: left"> 
		<h1 style="text-align: center">Torricelli's Theorem</h1>
		<button class="btn btn-warning" onclick="alert('Torricelli\'s Theorem relates the speed of a fluid exiting a hole in a tank to the height of the fluid above the hole. It is derived from energy conservation principles and is given by:\n\nv = √(2gh)\n\nwhere:\n- v is the velocity of the exiting fluid\n- g is the acceleration due to gravity (9.8 m/s²)\n- h is the vertical distance between the fluid surface and the hole\n\nThis means the fluid exits the hole at the same speed an object would reach falling freely from that height.')">
		    What is Torricelli Equation?
		</button>
		 <button class="btn btn-danger" id="start">Start</button>
		<button class="btn btn-success" id="oneHole">1 Hole</button>
		<button class="btn btn-success" id="threeHoles">3 Holes</button>

		<div style="width: 35%; display: flex; align-items: center; margin-bottom: 20px; gap: 10px;">
		        Hole Position Up/Down:
			<input type="range" id="upDown" min="-16" max="10" value="10" step="0.1" style="width: 100%;">
			<input type="text" id="udValue" value="30" style="width: 50px;" readonly> m
		</div>
                <button class="btn btn-danger" id="display">Show/Hide Result</button>
		<button class="btn btn-success" id="reset">Reset</button>
		
		
		<div id="resultBox" style="
		  display: none;
		  position: fixed;
		  top: 100px;          /* Fixed pixel position from the top */
		  right: 100px;         /* Fixed pixel position from the right */
		  background: rgba(0,0,0,0.85);
		  color: white;
		  font-size: 18px;
		  padding: 15px;
		  border-radius: 8px;
		  max-width: 300px;
		  text-align: left;
		  z-index: 1000;
		  box-shadow: 0 0 10px rgba(0,0,0,0.5);
		">
		  <!-- Calculation result will appear here -->
		</div>

	</div>
	<div id="viewport"></div>
