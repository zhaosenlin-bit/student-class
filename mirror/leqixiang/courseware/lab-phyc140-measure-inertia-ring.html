	            if (hangPositionY > maxHeight) {
	                // Update the position of the hanger
	                cleanLines();
	                fallSpeed += acceleration * deltaTime; // Increase speed due to acceleration
	                hangPositionY -= fallSpeed * deltaTime; // Move down
	                hanger.position.y = hangPositionY;
	                addLine(-10, 8, 0, -10, hanger.position.y, 0);
	
	                // Update the rotation of the pulley and disk
	                pulleyRotation += (fallSpeed * deltaTime) / 0.3; // Adjust rotation speed
	                diskRotation += (fallSpeed * deltaTime) / 0.5; // Adjust rotation speed
	
	                // Apply rotation
	                pulley.rotation.z = pulleyRotation;
	                disk.rotation.y = diskRotation;
	            } else {
	                // Stop all movements
	                hangPositionY = maxHeight; // Ensure hanger is exactly at the floor
	                hanger.position.y = hangPositionY;
	            }
	        }
	    }
	
	    requestAnimationFrame(animate);
	    controls.update();
	    renderer.render(scene, camera);
	}
	function onWindowResize() {
		camera.aspect = window.innerWidth / window.innerHeight;
		camera.updateProjectionMatrix();
		renderer.setSize( window.innerWidth, window.innerHeight );
	}

</script>
