<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR 地磁两极交互模型 (防卡死版)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none; }
        
        #webcam-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; transform: scaleX(-1); 
            display: none; 
        }

        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none;
        }
        
        .panel {
            background: rgba(0, 20, 40, 0.85);
            border: 1px solid rgba(68, 170, 255, 0.5);
            padding: 15px; border-radius: 8px; backdrop-filter: blur(10px);
            pointer-events: auto; color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        #control-panel { position: absolute; top: 20px; left: 20px; max-width: 300px; }
        #compass-panel { position: absolute; top: 20px; right: 20px; width: 220px; text-align: center; }

        h1 { margin: 0 0 10px 0; font-size: 1.2rem; color: #44aaff; text-shadow: 0 0 5px #44aaff; }
        h2 { margin: 0 0 8px 0; font-size: 1.0rem; color: #ffcc00; }
        p { margin: 5px 0; font-size: 0.9rem; line-height: 1.4; }
        
        .status-dot {
            display: inline-block; width: 10px; height: 10px; border-radius: 50%;
            background-color: #555; margin-right: 5px;
        }
        .status-dot.active { background-color: #00ff00; box-shadow: 0 0 5px #00ff00; }
        .status-dot.error { background-color: #ff0000; }
        
        button {
            background: rgba(68, 170, 255, 0.2); border: 1px solid #44aaff;
            color: white; padding: 10px 16px; border-radius: 4px;
            cursor: pointer; font-weight: bold; margin-top: 10px;
            transition: all 0.2s; pointer-events: auto; width: 100%;
        }
        button:hover { background: rgba(68, 170, 255, 0.4); box-shadow: 0 0 10px #44aaff; }
        button.active { background: rgba(0, 204, 102, 0.8); border-color: #00cc66; }
        button:disabled { background: #333; border-color: #555; color: #888; cursor: not-allowed; }

        /* Compass Widget */
        .compass-container {
            position: relative; width: 100px; height: 100px; margin: 10px auto;
            background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid #aaa;
        }
        .compass-needle {
            position: absolute; top: 50%; left: 50%; width: 80px; height: 10px;
            margin-top: -5px; margin-left: -40px; transform: rotate(-90deg);
        }
        .needle-n { width: 50%; height: 100%; background: red; float: right; border-radius: 0 50% 50% 0; position: relative; }
        .needle-s { width: 50%; height: 100%; background: white; float: left; border-radius: 50% 0 0 50%; }
        .needle-label { position: absolute; color: white; font-weight: bold; font-size: 12px; top: -2px; }
        .label-n { right: 5px; } .label-s { left: 5px; color: black; }
        
        .compass-text {
            font-size: 0.85rem; color: #ddd; text-align: left; margin-top: 10px;
            background: rgba(0,0,0,0.3); padding: 8px; border-radius: 4px;
        }
        .highlight-red { color: #ff4444; font-weight: bold; }
        .highlight-blue { color: #4444ff; font-weight: bold; }

        /* Labels in 3D scene */
        .label {
            color: #ffffff; font-family: sans-serif; padding: 4px 8px;
            background: rgba(0, 0, 0, 0.6); border-radius: 4px; font-size: 12px;
            pointer-events: none; user-select: none;
            border: 1px solid rgba(255,255,255,0.3);
        }
        .label-large {
            font-size: 16px !important; padding: 6px 12px !important; font-weight: bold;
            background: rgba(0, 0, 0, 0.8) !important; border: 2px solid rgba(255,255,255,0.6) !important;
        }
        .declination-label {
            color: #00ff00; font-weight: bold; font-size: 1.1rem;
            border: 2px solid #00ff00; background: rgba(0, 20, 0, 0.8); box-shadow: 0 0 10px #00ff00;
        }

        /* Loading Screen */
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; justify-content: center; align-items: center;
            color: white; z-index: 100; flex-direction: column;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #44aaff; border-top: 4px solid transparent;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #error-log {
            margin-top: 20px; font-size: 12px; color: #ff5555; text-align: center; max-width: 80%;
            background: rgba(50,0,0,0.5); padding: 10px; border-radius: 5px; display: none;
        }
        #force-start-btn {
            background: #444; border: 1px solid #666; color: white; padding: 5px 10px; margin-top: 10px;
            cursor: pointer; display: none;
        }
    </style>

    <div id="loading-screen">
        <div class="spinner"></div>
        <div id="loading-text">正在启动 3D 引擎...</div>
        <div id="error-log"></div>
        <button id="force-start-btn" onclick="forceStart()">强制进入 (可能不稳定)</button>
    </div>

    <video id="webcam-video" autoplay playsinline muted></video>

    <div id="ui-layer">
        <div id="control-panel" class="panel">
            <h1>AR 地磁场交互模型</h1>
            <p>探索地理两极与地磁两极的不重合现象。</p>
            <div style="margin-top: 10px;">
                <span id="ai-status" class="status-dot"></span> <span id="ai-text">等待初始化...</span>
            </div>
            <p id="gesture-hint" style="color: #aaa; font-style: italic; display:none; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.2); padding-top: 5px;">
                🖐 <b>张手移动</b>: 在空中旋转地球<br>
                ✊ <b>握拳</b>: 拉近观察磁偏角
            </p>
            <button id="toggle-mode" disabled>正在加载 AI...</button>
        </div>

        <div id="compass-panel" class="panel">
            <h2>为什么指南？</h2>
            <div class="compass-container">
                <div class="compass-needle">
                    <div class="needle-s"><span class="needle-label label-s">S</span></div>
                    <div class="needle-n"><span class="needle-label label-n">N</span></div>
                </div>
            </div>
            <div class="compass-text">
                <b>异性相吸原理：</b><br>
                指南针的 <span class="highlight-red">N极 (红)</span> 指向北方，是因为它被地球内部的 <span class="highlight-blue">地磁S极 (蓝)</span> 所吸引。<br><br>
                所以：<b>地理北极 ≈ 地磁S极</b>
            </div>
        </div>
