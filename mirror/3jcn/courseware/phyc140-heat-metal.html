<body>
	<div id="info" style="text-align: left"> 
		<h1 style="text-align: center">Heat Transfer </h1>
		
 <!-- Left Panel -->  
	    <div class="control-panel">
		
		<div class="control-group">
		  Metal:
		  <div class="slider-row">
		    <select id="metalSelector">
		      <option value="0.897">Aluminum</option>
		      <option value="0.385" selected>Copper</option>
		      <option value="0.5">Unknown 1</option>
		      <option value="0.6">Unknown 2</option>
		    </select>
		  </div>
		</div>
			    
		<div class="control-group">
		  Mass (g):
		  <div class="slider-row" style="display: flex; align-items: center;">
		    <input type="range" id="massMetalSlider" min="300" max="700" step="10" value="500" style="flex: 1; margin-right: 8px;">
		    <input type="text" id="massMetalValue" value="500" readonly style="width: 80px; text-align: center; color: blue; font-weight: bold;">
		  </div>
		  <div class="minmax" style="display: flex; justify-content: space-between; margin-top: 4px;">
		    <span>300</span>
		    <span>700</span>
		  </div>
		</div>
		    
		  <div class="control-group">
		    Temperature (°C):
		    <div class="slider-row">
		      <input type="range" id="tempMetalSlider" min="10" max="30" step="1" value="15">
		      <input type="text" id="tempMetalValue" value="15" readonly>
		    </div>
		    <div class="minmax">
		      <span>10</span>
		      <span>30</span>
		    </div>
		  </div>
		 <button class="btn btn-danger" id="start">Start</button>
		 <button class="btn btn-success" id="reset">Reset</button>
		    
		  <div class="control-group">
		    Final Temp:
		    <input type="text" id="finalTemp" value="0.0°" readonly style="width: 90px;">
		  </div>
	</div>
	<!-- Right Panel -->
	      <div class="control-panel-right">
		      
		<div class="control-group">
		  Hot Liquid:
		  <div class="slider-row">
		    <select id="liquidSelector">
		      <option value="2.14">Coconut Oil</option>
		      <option value="1.97">Olive Oil</option>
		      <option value="4.184" selected>Water</option>
		      <option value="3.0">Unknown</option>
		    </select>
		  </div>
		</div>
	  			
		  <div class="control-group">
		    Mass (g):
		    <div class="slider-row">
		      <input type="range" id="massLiquidSlider" min="1200" max="2000" step="10" value="1500">
		      <input type="text" id="massLiquidValue" value="1500" readonly>
		    </div>
		    <div class="minmax">
		      <span>1200</span><span>2000</span>
		    </div>
		  </div>
			
		  <div class="control-group">
		    Temp (°C):
		    <div class="slider-row">
		      <input type="range" id="tempLiquidSlider" min="60" max="160" step="1" value="100">
		      <input type="text" id="tempLiquidValue" value="100" readonly>
		    </div>
		    <div class="minmax">
		      <span>60</span><span>160</span>
		    </div>
		  </div>
		<button class="btn btn-danger" onclick="alert('When a metal object is placed into a hot liquid (no heat loss), the final temperature is calculated using conservation of energy:\n\nm₁·c₁·(T_f - T₁) = - m₂·c₂·(T_f - T₂)\n\nSolving for T_f:\n\nT_f = (m₁·c₁·T₁ + m₂·c₂·T₂) / (m₁·c₁ + m₂·c₂)\n\nwhere:\n- m₁: mass of liquid (g)\n- c₁: specific heat of liquid (J/g·°C)\n- T₁: initial temperature of liquid (°C)\n- m₂: mass of metal (g)\n- c₂: specific heat of metal (J/g·°C)\n- T₂: initial temperature of metal (°C)\n- T_f: final equilibrium temperature (°C)\n\nTypical specific heat values:\n- Water: 4.184 J/g·°C\n- Coconut Oil: 2.14 J/g·°C\n- Olive Oil: 1.97 J/g·°C\n- Aluminum: 0.897 J/g·°C\n- Copper: 0.385 J/g·°C')">
		    What is Heat Transfer?
		</button>
		
		      
	    </div>	

	</div>           
	<div id="viewport"></div>
</body>
</html>
