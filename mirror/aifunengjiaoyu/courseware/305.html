<style>
:root {
  --bg-deep: #080d24;
  --bg-card: rgba(255,255,255,0.065);
  --bg-card-hover: rgba(255,255,255,0.10);
  --border-glass: rgba(255,255,255,0.12);
  --border-glass-strong: rgba(255,255,255,0.20);
  --text-primary: #e4e8f4;
  --text-secondary: #a0a8c8;
  --text-dim: #7878a8;
  --accent-cyan: #00d4d4;
  --accent-gold: #f0c040;
  --accent-rose: #f06090;
  --accent-blue: #5088f8;
  --accent-violet: #9070f0;
  --accent-green: #40d878;
  --accent-red: #f05060;
  --accent-orange: #f08840;
  --shadow-card: 0 8px 32px rgba(0,0,0,0.40);
  --shadow-glow: 0 0 24px rgba(0,200,200,0.12);
  --radius-card: 16px;
  --radius-sm: 10px;
  --radius-xs: 7px;
  --transition-fast: 0.18s ease;
  --transition: 0.28s ease;
  --font-mono: 'Cascadia Code','Fira Code','JetBrains Mono','Consolas',monospace;
}

*{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px}
body{
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  background:linear-gradient(135deg,#060d24 0%,#0a1035 30%,#0c1440 55%,#080e2a 100%);
  color:var(--text-primary);
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.58;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 22% 18%, rgba(0,200,180,0.07) 0%, transparent 55%),
    radial-gradient(ellipse at 78% 72%, rgba(120,60,220,0.05) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 50%, rgba(0,160,220,0.04) 0%, transparent 60%);
}

/* ── App Container ── */
.app{position:relative;z-index:1;max-width:1480px;margin:0 auto;padding:12px 18px 28px}

/* ── Header ── */
.header{
  text-align:center;padding:20px 22px 16px;
  background:var(--bg-card);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border:1px solid var(--border-glass);border-radius:var(--radius-card);
  box-shadow:var(--shadow-card),var(--shadow-glow);
  margin-bottom:14px;
}
.header h1{
  font-size:clamp(1.25rem,2.8vw,1.85rem);font-weight:700;letter-spacing:.03em;
  background:linear-gradient(135deg,#90d0ff,#50e0d0,#b090ff,#50e0d0,#80c0ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.header .subtitle{font-size:.88rem;color:var(--text-secondary);margin-top:5px;letter-spacing:.02em}

/* ── Mode Selector Bar ── */
.mode-bar{
  display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;
  background:var(--bg-card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border-glass);border-radius:var(--radius-card);
  padding:10px 14px;align-items:center;justify-content:center;
}
.mode-btn{
  flex:0 0 auto;padding:10px 18px;border-radius:22px;border:1px solid var(--border-glass);
  background:rgba(20,20,55,0.40);color:var(--text-secondary);cursor:pointer;
  font-size:.84rem;font-weight:500;transition:var(--transition);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  white-space:nowrap;letter-spacing:.015em;
  display:flex;align-items:center;gap:7px;
}
.mode-btn:hover{border-color:rgba(140,180,240,0.45);color:var(--text-primary);transform:translateY(-1px)}
.mode-btn.active{
  background:rgba(0,180,180,0.18);border-color:var(--accent-cyan);
  color:var(--accent-cyan);box-shadow:0 0 18px rgba(0,200,200,0.18);
}
.mode-btn .dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.mode-btn .dot.interference-dot{background:var(--accent-cyan);box-shadow:0 0 8px rgba(0,212,212,0.6)}
.mode-btn .dot.diffraction-dot{background:var(--accent-gold);box-shadow:0 0 8px rgba(240,192,64,0.6)}
.mode-btn .dot.compare-dot{width:18px;height:10px;border-radius:5px;
  background:linear-gradient(90deg,var(--accent-cyan) 50%,var(--accent-gold) 50%)}

/* ── Main Layout ── */
.main-grid{
  display:grid;grid-template-columns:1fr 380px;gap:14px;margin-bottom:14px;
}
@media(max-width:1100px){.main-grid{grid-template-columns:1fr 320px}}
@media(max-width:860px){.main-grid{grid-template-columns:1fr}}

/* ── Canvas Wrap ── */
.canvas-wrap{
  background:var(--bg-card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border-glass);border-radius:var(--radius-card);
  overflow:hidden;position:relative;min-height:440px;
}
canvas{display:block;width:100%;height:100%}

/* ── Cards ── */
.glass-card{
  background:var(--bg-card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--border-glass);border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);padding:16px 18px;
}
.glass-card h3{
  font-size:.98rem;font-weight:700;margin-bottom:12px;color:var(--text-primary);
  border-bottom:1px solid var(--border-glass);padding-bottom:9px;letter-spacing:.015em;
  display:flex;align-items:center;gap:8px;
}
.glass-card h3 .dot-indicator{display:inline-block;width:9px;height:9px;border-radius:50%}

/* ── Control Panel ── */
.control-panel{display:flex;flex-direction:column;gap:12px}
.control-card{padding:14px 16px}

/* Sliders */
.slider-group{margin-bottom:13px}
.slider-group:last-child{margin-bottom:0}
.slider-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.slider-label .name{font-size:.83rem;color:var(--text-secondary)}
.slider-label .val{font-size:.88rem;font-weight:600;color:var(--text-primary);font-family:var(--font-mono)}
input[type=range]{
  -webkit-appearance:none;width:100%;height:7px;border-radius:4px;
  background:linear-gradient(90deg,#1a1a50,var(--accent-cyan));outline:none;cursor:pointer
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:#e8e8f8;cursor:pointer;box-shadow:0 0 16px rgba(0,200,200,0.45);border:2px solid var(--accent-cyan)
}
#slider-lambda{background:linear-gradient(90deg,#3322aa,#2255cc,#2299bb,#22bb66,#99aa22,#cc5522)}
#slider-a{background:linear-gradient(90deg,#2244aa,var(--accent-violet))}
#slider-d{background:linear-gradient(90deg,#2244aa,var(--accent-cyan))}

/* Quick Buttons */
.btn-row{display:flex;gap:7px;flex-wrap:wrap}
.btn{
  flex:1;min-width:70px;padding:9px 11px;border-radius:var(--radius-xs);border:none;
  color:#fff;cursor:pointer;font-size:.80rem;font-weight:500;transition:var(--transition-fast);
  white-space:nowrap;text-align:center;letter-spacing:.01em;
}
.btn:hover{transform:translateY(-1px);filter:brightness(1.15)}
.btn-accent{background:linear-gradient(135deg,#3b6cd0,#2b8cd0)}
.btn-second{background:linear-gradient(135deg,#333366,#444488)}
.btn-warn{background:linear-gradient(135deg,#c04050,#c06040)}
.btn-cyan{background:linear-gradient(135deg,#2b8c8c,#2b6cac)}

/* Toggle switch */
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:4px}
.toggle-label{font-size:.83rem;color:var(--text-secondary)}
.toggle-switch{
  position:relative;width:48px;height:26px;flex-shrink:0;
  background:rgba(60,60,100,0.5);border-radius:13px;cursor:pointer;
  border:1px solid var(--border-glass);transition:var(--transition-fast);
}
.toggle-switch.active{background:rgba(0,200,200,0.3);border-color:var(--accent-cyan)}
.toggle-switch::after{
  content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;
  border-radius:50%;background:#e0e0f0;transition:var(--transition-fast);
}
.toggle-switch.active::after{left:25px;background:var(--accent-cyan)}

/* Hints */
.hint-box{
  margin-top:10px;padding:10px 14px;border-radius:var(--radius-xs);
  background:rgba(0,180,180,0.08);border-left:3px solid var(--accent-cyan);
  font-size:.82rem;color:var(--text-secondary);line-height:1.55;
  transition:var(--transition-fast);
}
.hint-box strong{color:var(--accent-cyan)}
.hint-box.gold{border-left-color:var(--accent-gold);background:rgba(240,192,64,0.06)}
.hint-box.gold strong{color:var(--accent-gold)}
.hint-box.compare{border-left:3px solid;border-image:linear-gradient(180deg,var(--accent-cyan),var(--accent-gold)) 1;
  background:rgba(0,200,200,0.04)}

/* ── Formula Card ── */
.formula-card{margin-bottom:14px}
.formula-body{font-size:.88rem;color:var(--text-secondary);line-height:1.85}
.formula-body .eq-block{margin:6px 0;padding:8px 14px;background:rgba(20,25,55,0.35);border-radius:8px;
  font-family:var(--font-mono);font-size:.85rem}
.conclusion-tag{
  display:inline-block;margin-top:8px;padding:6px 16px;border-radius:20px;
  font-size:.82rem;font-weight:600;letter-spacing:.015em;
  background:rgba(0,200,180,0.12);color:var(--accent-cyan);border:1px solid rgba(0,200,180,0.2);
}

/* ── Find Difference Section ── */
.diff-section{margin-bottom:14px}
.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.diff-grid{grid-template-columns:1fr}}
.diff-col{
  background:rgba(20,25,55,0.35);border-radius:var(--radius-sm);padding:14px;
  border:1px solid var(--border-glass);transition:var(--transition-fast);
}
.diff-col h4{font-size:.88rem;margin-bottom:8px;display:flex;align-items:center;gap:7px}
.diff-col.interference-col h4{color:var(--accent-cyan)}
.diff-col.diffraction-col h4{color:var(--accent-gold)}
.trait-option{
  display:flex;align-items:center;gap:8px;padding:7px 10px;margin:3px 0;
  border-radius:var(--radius-xs);cursor:pointer;font-size:.83rem;color:var(--text-secondary);
  border:1px solid transparent;transition:var(--transition-fast);
}
.trait-option:hover{border-color:var(--border-glass-strong);background:rgba(255,255,255,0.03)}
.trait-option.selected{border-color:var(--accent-cyan);background:rgba(0,200,200,0.08);color:var(--text-primary)}
.trait-option.correct{border-color:var(--accent-green);background:rgba(64,216,120,0.1);color:var(--accent-green)}
.trait-option.wrong{border-color:var(--accent-red);background:rgba(240,80,96,0.1);color:var(--accent-red)}
.trait-option input[type=checkbox]{accent-color:var(--accent-cyan);width:15px;height:15px;cursor:pointer}
.diff-check-btn{
  margin-top:10px;padding:9px 22px;border-radius:20px;border:none;
  background:linear-gradient(135deg,#3b6cd0,#2b8cd0);color:#fff;
  cursor:pointer;font-size:.83rem;font-weight:500;transition:var(--transition-fast);
}
.diff-check-btn:hover{transform:translateY(-1px);filter:brightness(1.12)}
.diff-result{margin-top:8px;font-size:.83rem;min-height:20px}

/* ── Quiz Section ── */
.quiz-section{margin-bottom:14px}
.quiz-item{
  margin-bottom:13px;padding:12px 14px;border-radius:var(--radius-sm);
  background:rgba(20,25,55,0.30);border:1px solid transparent;transition:var(--transition-fast);
}
.quiz-item.q-correct{border-color:var(--accent-green);background:rgba(64,216,120,0.06)}
.quiz-item.q-wrong{border-color:var(--accent-red);background:rgba(240,80,96,0.06)}
.quiz-q{font-size:.88rem;margin-bottom:8px;font-weight:500}
.quiz-options{display:flex;gap:7px;flex-wrap:wrap}
.quiz-opt{
  padding:7px 15px;border-radius:var(--radius-xs);border:1px solid var(--border-glass);
  background:rgba(30,30,60,0.40);color:var(--text-secondary);cursor:pointer;
  font-size:.82rem;transition:var(--transition-fast);
}
.quiz-opt:hover{border-color:rgba(150,180,230,0.45);color:var(--text-primary)}
.quiz-opt.selected{border-color:var(--accent-cyan);background:rgba(0,200,200,0.13);color:var(--accent-cyan)}
.quiz-feedback{display:none;margin-top:8px;font-size:.82rem;line-height:1.5}
.quiz-feedback.show{display:block}
.quiz-submit-btn{
  padding:10px 26px;border-radius:20px;border:none;
  background:linear-gradient(135deg,#3b6cd0,#2b8cd0);color:#fff;
  cursor:pointer;font-size:.87rem;font-weight:600;transition:var(--transition-fast);
}
.quiz-submit-btn:hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(50,100,220,0.40)}
.quiz-score{margin-left:14px;font-size:.85rem;color:var(--text-secondary)}

/* ── Responsive ── */
@media(max-width:860px){
  .app{padding:8px 10px 20px}
  .header{padding:14px 12px}
  .canvas-wrap{min-height:350px}
  .mode-btn{padding:8px 12px;font-size:.76rem}

<div class="app">

<!-- HEADER -->
<header class="header">
  <h1>波的干涉与衍射实验</h1>
  <p class="subtitle">高二选择性必修第一册 -- 基于惠更斯原理对比双缝干涉与单缝衍射的规律</p>
</header>

<!-- MODE BAR -->
<div class="mode-bar" id="modeBar">
  <button class="mode-btn active" data-mode="interference">
    <span class="dot interference-dot"></span> 双缝干涉
  </button>
  <button class="mode-btn" data-mode="diffraction">
    <span class="dot diffraction-dot"></span> 单缝衍射
  </button>
  <button class="mode-btn" data-mode="compare">
    <span class="dot compare-dot"></span> 并排对比
  </button>
</div>

<!-- MAIN GRID -->
<div class="main-grid">
  <!-- CANVAS -->
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="cv"></canvas>
  </div>

  <!-- CONTROL PANEL -->
  <div class="control-panel">
    <!-- Parameters -->
    <div class="glass-card control-card">
      <h3>实验参数</h3>

      <div class="slider-group">
        <div class="slider-label"><span class="name">波长 <span style="font-family:serif">&#x03BB;</span></span><span class="val" id="valLambda">2.0</span></div>
        <input type="range" id="slider-lambda" min="0.8" max="5" step="0.1" value="2.0">
      </div>

      <div class="slider-group">
        <div class="slider-label"><span class="name">缝宽 a</span><span class="val" id="valA">1.5</span></div>
        <input type="range" id="slider-a" min="0.5" max="5" step="0.1" value="1.5">
      </div>

      <div class="slider-group" id="sliderDGroup">
        <div class="slider-label"><span class="name">缝间距 d</span><span class="val" id="valD">3.0</span></div>
        <input type="range" id="slider-d" min="1" max="8" step="0.1" value="3.0">
      </div>

      <div class="toggle-row">
        <span class="toggle-label">显示惠更斯子波</span>
        <div class="toggle-switch active" id="toggleHuygens"></div>
      </div>

      <div class="btn-row" style="margin-top:12px">
        <button class="btn btn-accent" id="btnPlayPause">暂停</button>
        <button class="btn btn-second" id="btnSlower">减速</button>
        <button class="btn btn-second" id="btnFaster">加速</button>
      </div>
      <div class="btn-row" style="margin-top:6px">
        <button class="btn btn-warn" id="btnReset">重置参数</button>
        <button class="btn btn-cyan" id="btnPreset1">窄缝强衍</button>
        <button class="btn btn-cyan" id="btnPreset2">宽缝弱衍</button>
      </div>

      <div class="hint-box" id="hintBox">
        <strong>提示：</strong><span id="hintText">调整参数观察干涉条纹间距与衍射中央亮纹宽度的变化规律。</span>
      </div>
    </div>
  </div>
</div>

<!-- FORMULA SECTION -->
<section class="glass-card formula-card">
  <h3>核心公式与实时结论</h3>
  <div class="formula-body" id="formulaBody"></div>
  <div id="conclusionTag"></div>
</section>

<!-- FIND DIFFERENCE -->
<section class="glass-card diff-section">
  <h3>找差异：识别干涉图样与衍射图样特征</h3>
  <p style="font-size:.84rem;color:var(--text-secondary);margin-bottom:10px">
    以下哪些特征属于<strong style="color:var(--accent-cyan)">双缝干涉</strong>，哪些属于<strong style="color:var(--accent-gold)">单缝衍射</strong>？勾选后点击检查。
  </p>
  <div class="diff-grid">
    <div class="diff-col interference-col">
      <h4>双缝干涉特征</h4>
      <div id="traitsInterference"></div>
    </div>
    <div class="diff-col diffraction-col">
      <h4>单缝衍射特征</h4>
      <div id="traitsDiffraction"></div>
    </div>
  </div>
  <button class="diff-check-btn" id="btnDiffCheck">检查答案</button>
  <div class="diff-result" id="diffResult"></div>
</section>

<!-- QUIZ -->
<section class="glass-card quiz-section">
  <h3>学习检测（5 题）</h3>
  <div id="quizContainer"></div>
  <button class="quiz-submit-btn" id="btnQuizSubmit">提交检测</button>
  <span class="quiz-score" id="quizScore"></span>
</section>
