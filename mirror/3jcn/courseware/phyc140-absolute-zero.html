<body>
<div id="info" style="text-align: left"> 
	<h1 style="text-align: center">Absolute Zero Temperature (Gas Simulation)</h1>
	<p style="text-align: center">
	  Move the temperature slider to see how molecular motion changes. At T = 0 K (idealized absolute zero), the molecules freeze.
	</p>

	<!-- Control Panel -->
	<div class="control-panel">
		<div class="control-group">
		  Gas:
		  <div class="slider-row">
		    <select id="gasSelector">
		      <option value="Neon" selected>Neon</option>
		      <option value="Argon">Argon</option>
		      <option value="Krypton">Krypton</option>
		      <option value="Xenon">Xenon</option>
		      <option value="Radon">Radon</option>
		      <option value="Helium">Helium</option>
		    </select>
		  </div>
		</div>		
		    
		<div class="control-group">
		  Temperature (K):
		  <div class="slider-row" style="display: flex; align-items: center;">
		    <!-- 0 K to 600 K range -->
		    <input type="range" id="tempSlider" min="0" max="600" step="10" value="300" style="flex: 1; margin-right: 8px;">
		    <input type="text" id="tempValue" value="300" readonly style="width: 80px; text-align: center; color: blue; font-weight: bold;">
		  </div>
		  <div class="minmax" style="display: flex; justify-content: space-between; margin-top: 4px;">
		    <span>0</span>
		    <span>600</span>
		  </div>
		</div>

        <button type="button" class="btn btn-warning" id="absInfo" style="background-color:orange;">
          What is Absolute Zero Temp?
        </button>
	</div>
</div>	

<div id="viewport"></div>
