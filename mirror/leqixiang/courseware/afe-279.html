<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/api/program-assets/279/t/local/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>英雄抢答大乱斗 - 动感对决版</title>
    <!-- 引入 SheetJS 库用于解析 Excel 文件 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* --- 1. 基础样式 (Base) --- */
        :root {
            --bg-color: #2c3e50;
            --p1-color: #e74c3c; /* 红 */
            --p2-color: #3498db; /* 蓝 */
            --ui-yellow: #f1c40f;
            --font-main: 'Courier New', Courier, monospace;
            --hp-block-size: 30px;
        }

        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #111;
            font-family: var(--font-main);
            color: white;
            overflow: hidden;
        }

        /* 通用按钮 */
        .btn {
            border: 4px solid white;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 6px 0 rgba(0,0,0,0.5);
            transition: transform 0.1s, box-shadow 0.1s;
            margin: 10px;
        }
        .btn:active { transform: translateY(6px); box-shadow: none; }
        .btn-primary { background: var(--ui-yellow); color: #000; }
        .btn-secondary { background: #7f8c8d; color: white; }
        .btn-danger { background: var(--p1-color); color: white; }

        /* --- 2. 屏幕容器 (Screens) --- */
        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            background-size: cover;
            background-position: center;
        }
        .screen.active { display: flex; }

        /* --- 主菜单 (Main Menu) --- */
        #screen-menu {
            background: linear-gradient(135deg, #1a1a1a 0%, #2c3e50 100%);
        }
        .game-title {
            font-size: 80px; color: var(--ui-yellow);
            text-shadow: 6px 6px 0 #c0392b;
            margin-bottom: 50px; text-align: center;
            animation: bounce 2s infinite;
        }

        /* --- 设置界面 (Settings) --- */
        #screen-settings { background: #222; padding: 40px; }
        .settings-panel {
            width: 80%; max-width: 800px;
            background: #333; padding: 30px;
            border: 4px solid #555; border-radius: 10px;
        }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 20px; margin-bottom: 10px; color: var(--ui-yellow); }
        textarea {
            width: 100%; height: 150px;
            background: #000; color: #0f0;
            font-family: monospace; padding: 10px;
            border: 2px solid #555;
            font-size: 16px;
            white-space: pre;
            overflow-x: auto;
        }
        input[type="number"] { padding: 10px; font-size: 20px; width: 100px; }
        .hint { color: #aaa; font-size: 14px; margin-top: 5px; line-height: 1.5; }
        .file-upload-btn {
            display: inline-block;
            padding: 5px 10px;
            background: #444;
            border: 1px solid #777;
            cursor: pointer;
            font-size: 14px;
            margin-top: 5px;
        }

        /* --- 角色选择 (Char Select) --- */
        #screen-select { background: #1e1e1e; flex-direction: row; }
        .player-col {
            flex: 1; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 20px; transition: background 0.3s;
            position: relative;
        }
        .col-p1 { background: rgba(231, 76, 60, 0.1); border-right: 2px solid #555; }
        .col-p2 { background: rgba(52, 152, 219, 0.1); }
        
        .char-preview {
            width: 200px; height: 200px;
            border: 4px solid white;
            margin-bottom: 20px;
            background-size: cover; background-position: center;
            display: flex; align-items: center; justify-content: center;
            font-size: 100px; background-color: #333;
        }
        .preset-grid { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; }
        .preset-item {
            width: 50px; height: 50px; background: #444; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            border: 2px solid #666;
        }
        .preset-item:hover { border-color: white; background: #666; }
        .vs-badge {
            position: absolute; left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px; font-weight: 900;
            color: var(--ui-yellow); text-shadow: 4px 4px 0 #000;
            z-index: 10;
        }
        .ready-btn {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 200px; z-index: 20;
        }

        /* --- 战斗界面 (Battle) --- */
        #screen-battle {
            background: linear-gradient(to bottom, #2c3e50, #000);
            justify-content: space-between;
        }
        
        /* 顶部信息 */
        .battle-hud {
            width: 100%; height: 15%;
            display: flex; justify-content: space-between; padding: 20px 40px;
            background: rgba(0,0,0,0.3);
        }
        .hud-p1, .hud-p2 { display: flex; flex-direction: column; gap: 5px; }
        .hud-p2 { align-items: flex-end; }
        
        .hp-container { display: flex; gap: 5px; }
        .hp-block {
            width: 25px; height: 35px; background: #555;
            border: 2px solid #fff;
            transform: skewX(-15deg);
        }
        .hp-block.active { background: var(--p1-color); box-shadow: 0 0 10px var(--p1-color); }
        .hud-p2 .hp-block.active { background: var(--p2-color); box-shadow: 0 0 10px var(--p2-color); }

        /* 中间舞台 */
        .battle-stage {
            flex: 1; width: 100%; position: relative;
            display: flex; justify-content: space-between; align-items: flex-end;
            padding: 0 100px 50px 100px;
        }

        .fighter {
            width: 200px; height: 260px;
            background-size: contain; background-repeat: no-repeat; background-position: bottom center;
            filter: drop-shadow(5px 5px 0 rgba(0,0,0,0.5));
            display: flex; align-items: center; justify-content: center; font-size: 130px;
            transform-origin: bottom center; /* 动画基点设为脚底 */
        }
        
        /* P1 待机动画配置 */
        #fighter-p1 {
            animation: idle-p1 2s infinite ease-in-out;
        }

        /* P2 待机动画配置 (包含水平翻转) */
        #fighter-p2 {
            animation: idle-p2 2s infinite ease-in-out;
        }

        /* 题目区域 */
        .question-board {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            width: 60%; background: #fff; color: #000;
            padding: 20px; border-radius: 10px; border: 4px solid #000;
            text-align: center; font-size: 24px; font-weight: bold;
            box-shadow: 0 10px 0 rgba(0,0,0,0.2); z-index: 5;
        }

        /* 底部抢答区 */
        .controls-area {
            height: 25%; width: 100%;
            display: flex;
        }
        .buzzer-area {
            flex: 1; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.2); position: relative;
        }
        .buzzer-btn {
            width: 180px; height: 180px; border-radius: 50%;
            border: 8px solid rgba(255,255,255,0.5);
            font-size: 40px; font-weight: 900; color: white;
            cursor: pointer; position: relative; top: -20px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.5);
            transition: all 0.1s;
        }
        .buzzer-btn:active { top: -10px; box-shadow: 0 0 0 rgba(0,0,0,0.5); }
        .buzzer-p1 { background: var(--p1-color); }
        .buzzer-p2 { background: var(--p2-color); }
        .buzzer-area.disabled { filter: grayscale(1); pointer-events: none; opacity: 0.3; }

        /* 答题选项弹窗 */
        .options-modal {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 100;
            display: none; flex-direction: column; align-items: center; justify-content: center;
        }
        
        /* 倒计时样式 */
        .timer-display {
            font-size: 80px;
            font-weight: 900;
            color: #ff3333;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            animation: pulse-timer 1s infinite;
        }

        .options-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 80%;
        }
        .option-card {
            background: #fff; color: #000; padding: 30px;
            font-size: 24px; text-align: center; border-radius: 10px;
            border: 4px solid #ccc; cursor: pointer;
        }
        .option-card:hover { background: var(--ui-yellow); }

        /* --- 结算界面 (Game Over) --- */
        #screen-gameover { background: rgba(0,0,0,0.9); z-index: 200; }
        .winner-avatar {
            width: 250px; height: 250px; border-radius: 50%; border: 10px solid var(--ui-yellow);
            background-size: cover; background-position: center;
            margin-bottom: 20px; display: flex; align-items: center; justify-content: center; font-size: 100px;
            background-color: #333;
        }
        .win-text { font-size: 80px; color: var(--ui-yellow); margin-bottom: 30px; animation: pulse 0.5s infinite; }

        /* --- 动画 --- */
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        @keyframes pulse-timer { 0% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.1); opacity: 0.8; } 100% { transform: scale(1); opacity: 1; } }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 待机呼吸动画 - P1 (正常方向) */
        @keyframes idle-p1 {
            0% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.05) translateY(-5px); } /* 呼吸感：变大并轻微上浮 */
            100% { transform: scale(1) translateY(0); }
        }

        /* 待机呼吸动画 - P2 (修正：去掉 scaleX(-1) 翻转，保持原图方向) */
        @keyframes idle-p2 {
            0% { transform: scale(1) translateY(0); }
            50% { transform: scale(1.05) translateY(-5px); }
            100% { transform: scale(1) translateY(0); }
        }

        /* 受击动画 - P1 (正常方向) */
        @keyframes shake-p1 {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-15px, 0) skewX(-5deg); }
            40% { transform: translate(15px, 0) skewX(5deg); }
            60% { transform: translate(-15px, 0) skewX(-5deg); }
            80% { transform: translate(15px, 0) skewX(5deg); }
            100% { transform: translate(0, 0); }
        }

        /* 受击动画 - P2 (修正：去掉翻转，震动方向改为向右弹开) */
        @keyframes shake-p2 {
            0% { transform: translate(0, 0); }
            20% { transform: translate(15px, 0) skewX(5deg); } /* 向右震动 */
            40% { transform: translate(-15px, 0) skewX(-5deg); }
            60% { transform: translate(15px, 0) skewX(5deg); }
            80% { transform: translate(-15px, 0) skewX(-5deg); }
            100% { transform: translate(0, 0); }
        }

        /* CSS类触发受击 (会覆盖 idle 动画) */
        #fighter-p1.anim-shake { animation: shake-p1 0.5s; }
        #fighter-p2.anim-shake { animation: shake-p2 0.5s; }

        .anim-red { filter: sepia(1) saturate(10) hue-rotate(-50deg); } /* 变红 */

        /* 投射物 */
        .projectile {
            position: absolute; font-size: 80px; z-index: 50; 
            transition: left 0.5s linear, top 0.5s linear;
            display: flex; align-items: center; justify-content: center;
        }
        .projectile.spin { animation: spin 0.5s linear infinite; }

        .damage-text {
            position: absolute; font-size: 50px; color: #ff0; font-weight: bold;
            text-shadow: 2px 2px 0 #f00; z-index: 60; animation: floatUp 1s forwards;
        }
        @keyframes floatUp { to { transform: translateY(-100px); opacity: 0; } }

    </style>
</head>

<!-- 1. 主菜单 -->
<div id="screen-menu" class="screen active">
    <div class="game-title">⚡ 英雄抢答大乱斗 ⚡<br><span style="font-size:30px; color:white;">双人对决版</span></div>
    <button class="btn btn-primary" onclick="showScreen('screen-select')">开始战斗</button>
    <button class="btn btn-secondary" onclick="showScreen('screen-settings')">系统设置</button>
</div>

<!-- 2. 系统设置 -->
<div id="screen-settings" class="screen">
    <div class="settings-panel">
        <h2 style="text-align:center; color:var(--ui-yellow);">⚙️ 系统设置</h2>
        
        <div class="setup-row" style="display:flex; gap:20px;">
            <div class="form-group" style="flex:1;">
                <label>初始血量 (HP):</label>
                <input type="number" id="setting-hp" value="5" min="1" max="10" style="width:100%;">
            </div>
            
            <div class="form-group" style="flex:1;">
                <label>答题限时 (秒):</label>
                <input type="number" id="setting-time" value="10" min="3" max="60" style="width:100%;">
            </div>
        </div>

        <div class="form-group">
            <label>题目导入 (支持 Excel .xlsx / CSV / 文本):</label>
            <textarea id="setting-questions" placeholder="题目将会显示在这里...
格式示例：
1+1等于几?, 2, 3, 4, 5
或者点击下方按钮导入 Excel 文件..."></textarea>
            
            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-top:5px;">
                <div class="hint">
                    支持格式：<b>.xlsx (Excel)</b>, .csv, .txt<br>
                    <b>智能识别：</b>系统会自动识别 A. B. C. 等前缀来区分题目和选项，哪怕题目里有逗号也没关系！
                </div>
                <div>
                    <!-- 修改：增加对 .xlsx, .xls 的支持 -->
                    <input type="file" id="import-file" accept=".xlsx,.xls,.csv,.txt,.tsv" style="display:none;" onchange="importQuestionFile(this)">
                    <button class="file-upload-btn" onclick="document.getElementById('import-file').click()">📂 导入题目文件 (支持Excel)</button>
                </div>
            </div>
        </div>

        <div style="text-align:center; margin-top:30px;">
            <button class="btn btn-primary" onclick="saveSettings()">保存并返回</button>
            <button class="btn btn-secondary" onclick="showScreen('screen-menu')">取消</button>
        </div>
    </div>
</div>

<!-- 3. 角色选择 -->
<div id="screen-select" class="screen">
    <div class="vs-badge">VS</div>
    
    <!-- P1 选人 -->
    <div class="player-col col-p1">
        <h2 style="color:var(--p1-color)">1P (红方)</h2>
        <div class="char-preview" id="preview-p1">🔴</div>
        <div class="preset-grid" id="presets-p1"></div>
        <input type="file" onchange="handleFileSelect(this, 'p1')" accept="image/*" style="display:none;" id="file-p1">
        <button class="btn btn-secondary" style="font-size:16px;" onclick="document.getElementById('file-p1').click()">上传图片</button>
    </div>

    <!-- P2 选人 -->
    <div class="player-col col-p2">
        <h2 style="color:var(--p2-color)">2P (蓝方)</h2>
        <div class="char-preview" id="preview-p2">🔵</div>
        <div class="preset-grid" id="presets-p2"></div>
        <input type="file" onchange="handleFileSelect(this, 'p2')" accept="image/*" style="display:none;" id="file-p2">
        <button class="btn btn-secondary" style="font-size:16px;" onclick="document.getElementById('file-p2').click()">上传图片</button>
    </div>

    <button class="btn btn-primary ready-btn" onclick="startGame()">开始对战!</button>
    <button class="btn btn-secondary" style="position:absolute; top:20px; left:20px;" onclick="showScreen('screen-menu')">返回</button>
</div>

<!-- 4. 战斗界面 -->
<div id="screen-battle" class="screen">
    <!-- 顶部血条 -->
    <div class="battle-hud">
        <div class="hud-p1">
            <div style="font-weight:bold; color:var(--p1-color);">1P PLAYER</div>
            <div class="hp-container" id="hp-container-p1"></div>
        </div>
        <div class="question-board" id="battle-question">题目加载中...</div>
        <div class="hud-p2">
            <div style="font-weight:bold; color:var(--p2-color);">2P PLAYER</div>
            <div class="hp-container" id="hp-container-p2"></div>
        </div>
    </div>

    <!-- 角色舞台 -->
    <div class="battle-stage">
        <div class="fighter" id="fighter-p1"></div>
        <div class="fighter" id="fighter-p2"></div>
    </div>

    <!-- 抢答控制区 -->
    <div class="controls-area">
        <div class="buzzer-area" id="buzzer-area-p1">
            <button class="buzzer-btn buzzer-p1" onmousedown="handleBuzz('p1')" ontouchstart="handleBuzz('p1')">抢答</button>
        </div>
        <div class="buzzer-area" id="buzzer-area-p2">
            <button class="buzzer-btn buzzer-p2" onmousedown="handleBuzz('p2')" ontouchstart="handleBuzz('p2')">抢答</button>
        </div>
    </div>

    <!-- 答题弹窗 -->
    <div class="options-modal" id="options-modal">
        <h2 style="color:white; margin-bottom:10px;" id="modal-title">请作答!</h2>
        <!-- 倒计时显示 -->
        <div id="timer-display" class="timer-display">10</div>
        
        <div class="options-grid" id="options-grid"></div>
    </div>
</div>

<!-- 5. 结算界面 -->
<div id="screen-gameover" class="screen">
    <div class="winner-avatar" id="winner-avatar"></div>
    <div class="win-text" id="winner-name">WINNER</div>
    <div>
        <button class="btn btn-primary" onclick="restartGame()">再来一局</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-menu')">返回主页</button>
