<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✈️ 飞机结构小教室 · 原木KT板</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg-deep: #f7f0e6;
      --bg-panel: #fcf8f2;
      --bg-panel-alt: #efe3d5;
      --border: #d8c8b0;
      --text: #4a3728;
      --text-dim: #8a7a6a;
      --accent: #b58a5a;
      --accent2: #c79a6a;
      --accent3: #6b8f5e;
      --accent4: #dbb88a;
      --danger: #c45a4a;
      --panel-width: 280px;
      --header-h: 46px;
      --transition: 0.25s ease;
      --radius: 14px;
    }
    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }
    #mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: var(--header-h);
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
      z-index: 20;
    }
    #mobile-header h1 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.5px;
    }
    #mobile-header .header-controls {
      display: flex;
      gap: 8px;
    }
    #main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    #center-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, #f5ede4 0%, #ede0d2 100%);
    }

    /* 全屏沉浸式控件叠加 */
    .overlay-controls {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
      background: rgba(252,248,242,0.80);
      backdrop-filter: blur(10px);
      padding: 10px 18px;
      border-radius: 40px;
      border: 1px solid rgba(181,138,90,0.25);
      box-shadow: 0 6px 20px rgba(60,40,20,0.10);
    }
    .overlay-controls .btn {
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      color: var(--text);
      transition: all 0.2s;
      white-space: nowrap;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }
    .overlay-controls .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: #faf3ea;
    }
    .overlay-controls .btn.accent {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .overlay-controls .btn.accent:hover {
      background: #a07a4a;
      border-color: #a07a4a;
    }

    /* 信息气泡 — 更活泼，适合初中生 */
    .info-bubble {
      position: absolute;
      top: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(252,248,242,0.94);
      backdrop-filter: blur(12px);
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: 16px 28px;
      max-width: 460px;
      min-width: 200px;
      color: var(--text);
      font-size: 16px;
      line-height: 1.5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.3s ease;
      z-index: 12;
      text-align: center;
      box-shadow: 0 12px 40px rgba(60,40,20,0.14);
      transform: translateX(-50%) scale(0.95);
    }
    .info-bubble.visible {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }
    .info-bubble .bubble-title {
      font-weight: 700;
      font-size: 22px;
      color: var(--accent);
      margin-bottom: 4px;
    }
    .info-bubble .bubble-desc {
      color: #5a4a3a;
      font-size: 16px;
      font-weight: 400;
    }
    .info-bubble .bubble-emoji {
      font-size: 34px;
      margin-right: 8px;
      display: inline-block;
      vertical-align: middle;
    }

    .hint-tip {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(252,248,242,0.70);
      backdrop-filter: blur(6px);
      padding: 8px 18px;
      border-radius: 30px;
      border: 1px solid rgba(181,138,90,0.20);
      color: var(--text-dim);
      font-size: 14px;
      z-index: 5;
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.6s;
    }

    /* 课件嵌入辅助 */
    .embed-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-deep);
    }
    .embed-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (max-width: 700px) {
      #mobile-header {
        display: flex;
      }
      .overlay-controls {
        bottom: 20px;
        padding: 8px 14px;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: center;
        width: 90%;
        border-radius: 30px;
      }
      .overlay-controls .btn {
        font-size: 13px;
        padding: 6px 14px;
      }
      .info-bubble {
        top: 16px;
        max-width: 85%;
        padding: 14px 20px;
      }
      .info-bubble .bubble-title {
        font-size: 20px;
      }
      .info-bubble .bubble-desc {
        font-size: 15px;
      }
      .hint-tip {
        bottom: 80px;
        font-size: 13px;
        padding: 5px 14px;
      }
    }
    @media (max-width: 480px) {
      .overlay-controls .btn {
        font-size: 12px;
        padding: 5px 12px;
      }
      .info-bubble {
        padding: 12px 16px;
      }
    }
  </style>
</head>

  <div id="app">
    <header id="mobile-header">
      <h1>✈️ 原木KT板 · 飞机结构</h1>
      <div class="header-controls">
        <button class="btn accent" id="reset-view-mobile" onclick="resetCamera()">🔄 重置</button>

      <main id="center-panel">
        <div id="three-container" style="width:100%;height:100%;"></div>

        <!-- 信息气泡：文字已优化为初中生风格 -->
        <div id="infoBubble" class="info-bubble">
          <span class="bubble-emoji" id="bubbleEmoji">🛩️</span>
          <span class="bubble-title" id="bubbleTitle">机翼</span>
          <div class="bubble-desc" id="bubbleDesc">像鸟的翅膀一样产生升力，帮飞机飞上天空！</div>
        </div>

        <div class="hint-tip" id="hintTip">👆 点一点飞机上的零件，看看它们有什么用</div>

        <div class="overlay-controls">
          <button class="btn accent" id="reset-view" onclick="resetCamera()">🔄 重置视角</button>
        </div>
      </main>
    </div>
  </div>
