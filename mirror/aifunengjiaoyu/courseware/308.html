<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单缝衍射彩色光实验 - 高中物理 选择性必修第一册</title>
<style>
:root {
  --bg-deep: #05051a;
  --bg-card: rgba(16,16,50,0.62);
  --border: rgba(90,90,190,0.24);
  --text: #e4e4f5;
  --text-dim: #9999cc;
  --accent: #8b6cff;
  --accent2: #5da3ff;
  --red: #ff5566;
  --blue: #5599ff;
  --violet: #b366ff;
  --green: #44dd66;
  --success: #44cc88;
  --error: #ff5577;
  --warn: #ffaa33;
  --radius: 14px;
  --transition: 0.25s ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:radial-gradient(ellipse at 50% 0%,#151545 0%,#0a0a24 50%,#040415 100%);
  color:var(--text);min-height:100vh;line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
.app{max-width:1480px;margin:0 auto;padding:16px 20px 36px}

/* HEADER */
.header{
  text-align:center;padding:20px 20px 16px;margin-bottom:16px;
  background:var(--bg-card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
}
.header h1{font-size:clamp(1.3rem,3vw,1.9rem);font-weight:700;
  background:linear-gradient(135deg,#c8b8ff,#82b8ff,#c0c8ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.header .sub{font-size:.88rem;color:var(--text-dim);margin-top:5px}

/* MAIN LAYOUT */
.main-layout{display:flex;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.viz-col{flex:1 1 58%;min-width:380px;display:flex;flex-direction:column;gap:12px}
.ctrl-col{flex:0 0 370px;display:flex;flex-direction:column;gap:12px}

/* CANVAS */
.canvas-wrap{
  background:var(--bg-card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);
  overflow:hidden;position:relative;min-height:520px;cursor:crosshair;
}
canvas{display:block;width:100%;height:100%}

/* MODE BUTTONS */
.mode-row{display:flex;gap:7px;flex-wrap:wrap}
.mode-btn{
  flex:1;min-width:68px;padding:9px 10px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg-card);color:var(--text);cursor:pointer;font-size:.80rem;
  transition:var(--transition);text-align:center;white-space:nowrap;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.mode-btn:hover{transform:translateY(-1px);border-color:rgba(150,140,240,.5);}
.mode-btn.active{background:rgba(100,80,220,.38);border-color:var(--accent);box-shadow:0 0 16px rgba(130,110,255,.28);}
.mode-btn .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.mode-btn .dot.red{background:var(--red)}
.mode-btn .dot.blue{background:var(--blue)}
.mode-btn .dot.violet{background:var(--violet)}
.mode-btn .dot.white{background:linear-gradient(135deg,#f44,#ff4,#4f4,#4ff,#44f,#f4f);}
.mode-btn .dot.dual{display:inline-block;width:12px;height:6px;border-radius:3px;margin-right:5px;vertical-align:middle;
  background:linear-gradient(90deg,var(--red) 50%,var(--violet) 50%);}

/* CARDS */
.card{
  background:var(--bg-card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;
}
.card h3{font-size:.93rem;margin-bottom:10px;color:var(--text);font-weight:600;display:flex;align-items:center;gap:7px}

/* SLIDERS */
.slider-group{margin-bottom:13px}
.slider-label{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.slider-label span:first-child{font-size:.83rem;color:var(--text-dim)}
.slider-label .val{font-size:.88rem;font-weight:600;color:var(--text)}
input[type=range]{
  -webkit-appearance:none;width:100%;height:7px;border-radius:4px;
  background:linear-gradient(90deg,#2a2a68,var(--accent));outline:none;cursor:pointer
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:#fff;cursor:pointer;box-shadow:0 0 14px rgba(130,110,255,.55);border:2px solid var(--accent)
}
#slider-lambda{background:linear-gradient(90deg,#4400aa,#0044ff,#00aacc,#00cc44,#cccc00,#ff6600,#ff2200)}

/* BUTTONS */
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn{
  flex:1;min-width:75px;padding:9px 11px;border-radius:10px;border:none;
  font-size:.81rem;font-weight:500;cursor:pointer;transition:var(--transition);
  color:#fff;text-align:center;white-space:nowrap;
}
.btn.primary{background:linear-gradient(135deg,#5b4cff,#3b6ce0)}
.btn.secondary{background:linear-gradient(135deg,#333366,#444488)}
.btn.accent{background:linear-gradient(135deg,#c04850,#5068d0)}
.btn.success{background:linear-gradient(135deg,#2d8848,#3da060)}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 18px rgba(80,60,220,.45)}

/* INFO STRIP */
.info-strip{
  display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;
  font-size:.80rem;color:var(--text-dim);text-align:center;justify-content:center;
}
.info-strip strong{color:var(--text);font-size:.85rem}

/* FORMULA SECTION */
.formula-content{font-size:.88rem;color:var(--text-dim);line-height:1.85}
.formula-content .eq{
  display:inline-block;margin:3px 6px;padding:4px 10px;border-radius:6px;
  background:rgba(100,80,220,.12);color:var(--text);font-family:Georgia,serif;font-size:.9rem;
}
.conclusion-box{
  margin-top:10px;padding:10px 15px;border-radius:9px;
  background:rgba(100,80,220,.14);border-left:3px solid var(--accent);
  font-size:.85rem;color:var(--text);line-height:1.7;
}

/* PREDICTION */
.pred-q{margin-bottom:10px;font-size:.88rem;line-height:1.6}
.pred-options{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pred-opt{
  padding:8px 16px;border-radius:9px;border:1px solid var(--border);
  background:var(--bg-card);color:var(--text);cursor:pointer;font-size:.83rem;
  transition:var(--transition);
}
.pred-opt:hover{border-color:rgba(150,140,240,.5)}
.pred-opt.chosen-correct{border-color:var(--success);background:rgba(68,204,136,.16)}
.pred-opt.chosen-wrong{border-color:var(--error);background:rgba(255,85,119,.16)}
.pred-reveal{display:none;margin-top:10px;padding:10px 15px;border-radius:9px;
  background:rgba(68,204,136,.1);border:1px solid rgba(68,204,136,.3);font-size:.84rem;color:var(--text);line-height:1.7}
.pred-reveal.show{display:block}

/* QUIZ */
.quiz-item{margin-bottom:13px;padding:12px 15px;border-radius:10px;
  background:rgba(18,18,55,.35);border:1px solid transparent;transition:var(--transition)}
.quiz-item.q-correct{border-color:var(--success);background:rgba(68,204,136,.08)}
.quiz-item.q-wrong{border-color:var(--error);background:rgba(255,85,119,.08)}
.quiz-q{font-size:.88rem;margin-bottom:8px;font-weight:500}
.quiz-options{display:flex;gap:8px;flex-wrap:wrap}
.quiz-opt{
  padding:7px 14px;border-radius:8px;border:1px solid var(--border);
  background:rgba(28,28,58,.5);color:var(--text);cursor:pointer;font-size:.81rem;
  transition:var(--transition)
}
.quiz-opt:hover{border-color:rgba(150,140,240,.5)}
.quiz-opt.selected{border-color:var(--accent);background:rgba(100,80,220,.22)}
.quiz-fb{display:none;margin-top:8px;font-size:.82rem;color:var(--text-dim);line-height:1.6}
.quiz-fb.show{display:block}

/* RESPONSIVE */
@media(max-width:860px){
  .main-layout{flex-direction:column}
  .ctrl-col{flex:1 1 auto}
  .viz-col{min-width:unset}
  .canvas-wrap{min-height:380px}
  .mode-btn{font-size:.73rem;padding:7px 8px}
}
@media(max-width:500px){
  .app{padding:8px 10px 24px}
  .header{padding:12px 10px}
  .header h1{font-size:1.15rem}
  .card{padding:12px}
  .btn-row{flex-direction:column}
}
</style>
</head>

<header class="header">
  <h1>单缝衍射彩色光实验</h1>
  <p class="sub">高二物理 选择性必修第一册 -- 缝宽 a、波长 λ、屏距 L 对衍射图样的影响</p>
</header>

<div class="main-layout">

  <!-- VISUALIZATION COLUMN -->
  <section class="viz-col">
    <div class="canvas-wrap"><canvas id="cv"></canvas></div>
    <div class="mode-row" id="modeRow">
      <button class="mode-btn active" data-mode="mono"><span class="dot" style="background:#ff6644"></span>单色光</button>
      <button class="mode-btn" data-mode="white"><span class="dot white"></span>白光</button>
      <button class="mode-btn" data-mode="rv"><span class="dot dual"></span>红紫对比</button>
      <button class="mode-btn" data-mode="nw"><span class="dot" style="background:linear-gradient(90deg,#888,#fff);width:12px;height:6px;border-radius:3px"></span>窄缝vs宽缝</button>
    </div>
  </section>

  <!-- CONTROL COLUMN -->
  <aside class="ctrl-col">
    <div class="card">
      <h3>&#x2699; 实验参数</h3>

      <div class="slider-group">
        <div class="slider-label"><span>缝宽 a</span><span class="val" id="valA">0.50 mm</span></div>
        <input type="range" id="sliderA" min="0.10" max="2.00" step="0.01" value="0.50">
      </div>

      <div class="slider-group">
        <div class="slider-label"><span>波长 λ</span><span class="val" id="valLambda">550 nm</span></div>
        <input type="range" id="sliderLambda" min="400" max="700" step="1" value="550" style="background:linear-gradient(90deg,#4400aa,#0044ff,#00aacc,#00cc44,#cccc00,#ff6600,#ff2200)">
      </div>

      <div class="slider-group">
        <div class="slider-label"><span>屏距 L</span><span class="val" id="valL">1.00 m</span></div>
        <input type="range" id="sliderL" min="0.50" max="3.00" step="0.01" value="1.00">
      </div>

      <div class="btn-row">
        <button class="btn primary" id="btnNarrow">窄缝强衍射</button>
        <button class="btn secondary" id="btnWide">宽缝弱衍射</button>
        <button class="btn accent" id="btnReset">重置经典参数</button>
        <button class="btn success" id="btnScreenshot">截图保存</button>
      </div>

      <div class="info-strip">
        <span>中央亮纹宽度: <strong id="infoWidth">--</strong></span>
        <span>第一暗纹位置: <strong id="infoY1">--</strong></span>
        <span>次级极大: <strong id="infoSecondary">--</strong></span>
      </div>
    </div>
  </aside>
</div>

<!-- FORMULA & REAL-TIME EXPLANATION -->
<section class="card" style="margin-bottom:14px">
  <h3>&#x1F4D0; 公式推导与实时讲解</h3>
  <div class="formula-content" id="formulaContent"></div>
  <div class="conclusion-box" id="conclusionBox"></div>
</section>

<!-- PREDICTION: 先猜后看 -->
<section class="card" style="margin-bottom:14px" id="predSection">
  <h3>&#x1F3AF; 先猜后看 -- 互动预测</h3>
  <div class="pred-q" id="predQ"></div>
  <div class="pred-options" id="predOptions"></div>
  <div class="pred-reveal" id="predReveal"></div>
  <button class="btn secondary" id="btnNewPred" style="margin-top:8px;display:none">换一题</button>
</section>

<!-- QUIZ: 5 道检测题 -->
<section class="card" style="margin-bottom:14px">
  <h3>&#x270D; 课堂检测（5 题）</h3>
  <div id="quizContainer"></div>
  <button class="btn primary" id="btnSubmit" style="margin-top:8px">提交检测</button>
  <span style="margin-left:12px;font-size:.85rem;color:var(--text-dim)" id="quizScore"></span>
</section>
