    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>牛顿第一定律·真题模型库</title>
    <style>
        :root {
            /* 通用色彩与主题 */
            --bg-color: #0b0f19;
            --grid-color: #1a2235;
            --primary-color: #58a6ff;
            --secondary-color: #1f6feb;
            --alert-color: #ff7b72;
            --vector-v-color: #e3b341; /* 黄色 - 速度 */
            --vector-g-color: #f85149; /* 红色 - 重力 */
            --force-color: #39ff14;    /* 荧光绿 - 拉力/综合受力 */
            --text-glow: 0 0 10px rgba(88, 166, 255, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            color: var(--primary-color);
            user-select: none;
        }

        /* 隐藏元素的通用类 */
        .hidden {
            display: none !important;
        }

        /* ==================== 首页封面样式 ==================== */
        #home-view {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1a2235 0%, #0b0f19 100%);
            z-index: 100;
            position: absolute;
            top: 0;
            left: 0;
        }

        .home-title {
            font-size: 3rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 50px;
            text-shadow: 0 0 20px rgba(88, 166, 255, 0.8), 0 0 40px rgba(88, 166, 255, 0.4);
            letter-spacing: 4px;
        }

        .card-container {
            display: flex;
            gap: 50px;
        }

        .model-card {
            width: 300px;
            background: rgba(13, 17, 23, 0.8);
            border: 2px solid var(--secondary-color);
            border-radius: 15px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .model-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(88, 166, 255, 0.3);
            border-color: var(--primary-color);
            background: rgba(31, 111, 235, 0.1);
        }

        .card-image-placeholder {
            width: 100%;
            height: 180px;
            background: #161b22;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b949e;
            font-size: 1.2rem;
            border: 1px dashed #30363d;
            overflow: hidden;
            position: relative;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #fff;
            text-align: center;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .card-desc {
            margin-top: 10px;
            font-size: 0.95rem;
            color: #c9d1d9;
            text-align: center;
            line-height: 1.5;
        }

        /* ==================== 仿真页面通用样式 ==================== */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        .ui-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(13, 17, 23, 0.85);
            padding: 20px;
            border: 1px solid #30363d;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 10;
            width: 320px;
        }

        .panel-title {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 5px;
            text-align: center;
            text-shadow: var(--text-glow);
            letter-spacing: 1px;
        }

        .divider {
            height: 1px;
            background: #30363d;
            margin: 5px 0;
        }

        button {
            background: transparent;
            border: 1px solid var(--secondary-color);
            color: var(--primary-color);
            padding: 10px 15px;
            font-size: 0.95rem;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease;
            font-weight: bold;
            outline: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button:hover {
            background: rgba(31, 111, 235, 0.2);
            box-shadow: inset 0 0 10px rgba(88, 166, 255, 0.2);
        }

        button.active-toggle {
            background: var(--secondary-color);
            color: #fff;
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.5);
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #8b949e;
            transition: background-color 0.3s;
        }

        .active-toggle .status-indicator {
            background-color: #fff;
            box-shadow: 0 0 8px #fff;
        }

        .btn-launch { background: rgba(88, 166, 255, 0.1); }
        
        .btn-challenge {
            border-color: var(--alert-color);
            color: var(--alert-color);
        }
        
        .btn-challenge.active-toggle {
            background: var(--alert-color);
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 123, 114, 0.5);
        }

        .btn-reset {
            background: #21262d;
            border-color: #8b949e;
            color: #c9d1d9;
            justify-content: center;
            margin-top: 5px;
        }
        .btn-reset:hover { background: #30363d; }

        .btn-back {
            background: #161b22;
            border-color: #f85149;
            color: #f85149;
            justify-content: center;
        }
        .btn-back:hover {
            background: #f85149;
            color: #fff;
        }

        /* 屏幕中央大字提示 */
        .alert-message {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--alert-color);
            text-shadow: 0 0 20px var(--alert-color), 0 0 40px #000;
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
            text-align: center;
            white-space: nowrap;
            z-index: 5;
        }
        .alert-message.show { opacity: 1; }

        /* 速度监控面板 (单摆专用) */
        #pend-monitor-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(13, 17, 23, 0.85);
            padding: 15px 25px;
            border: 1px solid var(--secondary-color);
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(102, 252, 241, 0.2);
            backdrop-filter: blur(5px);
            z-index: 10;
            font-size: 1.2rem;
            font-weight: bold;
        }
        #pend-monitor-panel .speed-value {
            color: var(--vector-v-color);
            font-size: 1.6rem;
            text-shadow: 0 0 8px var(--vector-v-color);
            font-family: monospace;
            min-width: 80px;
            text-align: right;
        }
    </style>
</head>
