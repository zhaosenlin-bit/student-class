		  var ballGeom = new THREE.SphereGeometry(0.5, 32, 24);
		  var ball = new THREE.Mesh(ballGeom, new THREE.MeshPhongMaterial({color:"white"}));

	function addArrow(x,y,z, length, xo,yo,zo){
		var dir = new THREE.Vector3( x, y, z );
		dir.normalize();
		var origin = new THREE.Vector3(xo,yo,zo);   
		var hex = 0xff0000;
		var arrow = new THREE.ArrowHelper( dir, origin, length, hex, 0.4, 0.3 );
		arrow.line.material.linewidth = 5;
		arrow.scale.set(2,2,2);
		scene.add( arrow );
		arrowCollection.push(arrow);
	}
	function addBattery(r){
		var L = 4*r;
		var texture = textureloader.load( '../textures/battery_texture.png' );
		var bat_material = new THREE.MeshBasicMaterial( { map: texture } );
		var bat_geometry = new THREE.CylinderGeometry( r, r, L, 32 );
		var top_geometry = new THREE.CylinderGeometry( r+0.1, r+0.1, L/4, 32 );
		var top = new THREE.Mesh( top_geometry, new THREE.MeshBasicMaterial({color: 0x0000ff}) );
		battery = new THREE.Mesh( bat_geometry, bat_material );
		battery.position.set(0,5,28);
		battery.add(top);
		top.position.set(0,1.8*r,0);
		var geometry = new THREE.CylinderGeometry( r/4, r/4, r/4, 32 );
		var material = new THREE.MeshBasicMaterial( {color: 0xff0000} );
		var cap = new THREE.Mesh( geometry, material );
		cap.position.set(0,2.4*r,0);
		battery.add( cap );
		battery.rotateZ(-Math.PI/2);
		scene.add( battery );
	}
	function addText(x,y,z,t,alpha){
		fontloader.load("/api/program-assets/lab-phyc240-two-wires/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json",function(tex){ 
		    var  textGeo = new TextGeometry(t, {
			    size: 3,  
			    height: 0.2, 
			    curveSegments: 6,
			    font: tex,
		    });
		    var  textMaterial = new THREE.MeshLambertMaterial({color: "green"});  
		    var textMesh = new THREE.Mesh(textGeo , textMaterial);
		    textMesh.position.set(x,y,z);
		    textMesh.rotateY(alpha);
		    scene.add(textMesh);
		});
	}
	function addWire2(r,l,x,y,z,alpha){
		var geometry = new THREE.CylinderGeometry( r, r, l, 32 );
		var material = new THREE.MeshBasicMaterial( {color: 'brown'} );
		wire = new THREE.Mesh(geometry,material);
		wire.position.set(x,y,z);
		wire.rotateX(alpha);
		scene.add(wire);
		return wire;
	}
	function addWire(r,l,x,y,z,alpha){
		var geometry = new THREE.CylinderGeometry( r, r, l, 32 );
		var material = new THREE.MeshBasicMaterial( {color: 'brown'} );
		wire = new THREE.Mesh(geometry,material);
		wire.position.set(x,y,z);
		wire.rotateZ(alpha);
		scene.add(wire);
		return wire;
	}
