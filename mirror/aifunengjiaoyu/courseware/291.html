<style>
:root {
  --bg-deep: #080d24;
  --bg-card: rgba(255,255,255,0.07);
  --bg-card-hover: rgba(255,255,255,0.11);
  --border-glass: rgba(255,255,255,0.14);
  --text-primary: #e8ecf4;
  --text-secondary: #a8b8d8;
  --accent-cyan: #00d4d4;
  --accent-gold: #f0c040;
  --accent-magenta: #e060c0;
  --accent-green: #40e890;
  --accent-red: #f06070;
  --accent-blue: #4090f0;
  --accent-orange: #f09040;
  --shadow-card: 0 8px 32px rgba(0,0,0,0.35);
  --radius-card: 16px;
  --radius-sm: 8px;
  --font-mono: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  background: linear-gradient(135deg, #080d24 0%, #0a1035 30%, #0c1440 60%, #0a1030 100%);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.55;
}
body::before {
  content: '';
  position: fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(ellipse at 20% 20%, rgba(0,180,220,0.08) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 70%, rgba(120,60,220,0.06) 0%, transparent 55%),
    radial-gradient(ellipse at 50% 50%, rgba(0,200,180,0.04) 0%, transparent 60%);
}

/* ── Layout ── */
.app-container { position:relative; z-index:1; max-width:1500px; margin:0 auto; padding:12px 18px 24px; }

/* Header */
.header-bar {
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
  padding:14px 22px;
  background: var(--bg-card); border:1px solid var(--border-glass);
  backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
  border-radius: var(--radius-card); box-shadow: var(--shadow-card);
  margin-bottom:14px;
}
.header-title { font-size:1.45rem; font-weight:700; letter-spacing:0.04em; color:var(--text-primary); }
.header-title span { color:var(--accent-cyan); }
.resonance-badge {
  padding:7px 18px; border-radius:22px; font-weight:700; font-size:0.92rem;
  transition: all 0.35s ease; letter-spacing:0.03em;
}
.badge-off { background:rgba(255,255,255,0.08); color:var(--text-secondary); border:1px solid var(--border-glass); }
.badge-near { background:rgba(0,212,180,0.2); color:var(--accent-cyan); border:1px solid var(--accent-cyan);
  animation: pulse-badge 1.2s ease-in-out infinite; }
@keyframes pulse-badge {
  0%,100% { box-shadow:0 0 8px rgba(0,212,180,0.3); }
  50% { box-shadow:0 0 22px rgba(0,212,180,0.7); }
}

/* Main grid */
.main-grid {
  display:grid;
  grid-template-columns: 310px 1fr 1fr;
  gap:14px;
  margin-bottom:14px;
}
@media (max-width:1300px) { .main-grid { grid-template-columns: 280px 1fr; } }
@media (max-width:900px)  { .main-grid { grid-template-columns: 1fr; } }

/* Cards */
.glass-card {
  background: var(--bg-card); border:1px solid var(--border-glass);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-radius: var(--radius-card); box-shadow: var(--shadow-card);
  padding:16px 18px;
}
.glass-card h2 {
  font-size:1.05rem; font-weight:700; margin-bottom:10px; color:var(--text-primary);
  border-bottom:1px solid var(--border-glass); padding-bottom:8px; letter-spacing:0.02em;
}
.glass-card h2 .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px;
  background:var(--accent-cyan); box-shadow:0 0 6px var(--accent-cyan); }

/* ── Left Panel: Controls ── */
.param-group { margin-bottom:14px; }
.param-group label {
  display:flex; justify-content:space-between; align-items:center;
  font-size:0.88rem; color:var(--text-secondary); margin-bottom:4px; letter-spacing:0.02em;
}
.param-group label .val { color:var(--accent-gold); font-weight:700; font-family:var(--font-mono); font-size:0.85rem; }
.param-group label .unit { color:var(--text-secondary); font-size:0.78rem; margin-left:2px; }
input[type=range] {
  -webkit-appearance:none; width:100%; height:7px; border-radius:4px;
  background:rgba(255,255,255,0.12); outline:none; cursor:pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none; width:22px; height:22px; border-radius:50%;
  background:var(--accent-cyan); cursor:pointer; border:2px solid rgba(255,255,255,0.3);
  box-shadow:0 0 10px rgba(0,200,200,0.4);
}
.btn-row { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
.btn {
  padding:8px 14px; border-radius:var(--radius-sm); border:1px solid var(--border-glass);
  background:rgba(255,255,255,0.06); color:var(--text-primary); cursor:pointer;
  font-size:0.84rem; font-weight:600; letter-spacing:0.02em;
  transition:all 0.2s ease; font-family:inherit; white-space:nowrap;
}
.btn:hover { background:rgba(255,255,255,0.14); border-color:rgba(255,255,255,0.3); }
.btn-accent { background:rgba(0,200,200,0.15); border-color:var(--accent-cyan); color:var(--accent-cyan); }
.btn-accent:hover { background:rgba(0,200,200,0.28); }
.btn-warn { background:rgba(240,100,120,0.12); border-color:var(--accent-red); color:var(--accent-red); }
.btn-warn:hover { background:rgba(240,100,120,0.22); }
.btn-gold { background:rgba(240,192,64,0.12); border-color:var(--accent-gold); color:var(--accent-gold); }
.btn-gold:hover { background:rgba(240,192,64,0.22); }

/* ── Middle Panel: Circuit & Phasor ── */
.mid-col { display:flex; flex-direction:column; gap:14px; }
.canvas-wrap { position:relative; border-radius:var(--radius-sm); overflow:hidden; background:rgba(0,0,0,0.2); }
.canvas-wrap canvas { display:block; width:100%; height:auto; }

/* ── Right Panel: Curve & Calc Cards ── */
.right-col { display:flex; flex-direction:column; gap:14px; }
.calc-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.calc-tile {
  background:rgba(0,0,0,0.18); border:1px solid var(--border-glass); border-radius:var(--radius-sm);
  padding:10px 12px; text-align:center;
}
.calc-tile .tile-val {
  font-size:1.3rem; font-weight:700; color:var(--accent-gold); font-family:var(--font-mono);
}
.calc-tile .tile-label { font-size:0.72rem; color:var(--text-secondary); margin-top:1px; letter-spacing:0.03em; }
.calc-tile.highlight { border-color:var(--accent-cyan); box-shadow:0 0 12px rgba(0,200,200,0.12); }
.calc-tile.highlight .tile-val { color:var(--accent-cyan); }

/* ── Bottom ── */
.bottom-section { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:1100px) { .bottom-section { grid-template-columns:1fr; } }

/* Table */
.record-table-wrap { max-height:320px; overflow-y:auto; }
.record-table { width:100%; border-collapse:collapse; font-size:0.78rem; }
.record-table th {
  background:rgba(0,0,0,0.25); color:var(--accent-cyan); font-weight:700;
  padding:7px 6px; text-align:center; position:sticky; top:0; z-index:1;
  border-bottom:2px solid var(--border-glass); letter-spacing:0.02em;
}
.record-table td {
  padding:6px; text-align:center; border-bottom:1px solid rgba(255,255,255,0.06);
  color:var(--text-secondary); font-family:var(--font-mono); font-size:0.76rem;
}
.record-table tbody tr:hover td { background:rgba(255,255,255,0.04); color:var(--text-primary); }
.table-empty { text-align:center; padding:30px; color:var(--text-secondary); font-size:0.85rem; }

/* Quiz */
.quiz-question { margin-bottom:16px; }
.quiz-question .q-text { font-weight:600; margin-bottom:6px; color:var(--text-primary); font-size:0.9rem; }
.quiz-question .q-options { display:flex; flex-wrap:wrap; gap:8px; }
.quiz-question .q-opt {
  padding:6px 14px; border-radius:18px; border:1px solid var(--border-glass);
  background:rgba(255,255,255,0.04); color:var(--text-secondary); cursor:pointer;
  font-size:0.82rem; transition:all 0.2s; font-family:inherit;
}
.quiz-question .q-opt:hover { background:rgba(255,255,255,0.1); }
.quiz-question .q-opt.selected { background:rgba(0,180,220,0.2); border-color:var(--accent-cyan); color:var(--accent-cyan); }
.quiz-question .q-opt.correct-answer { background:rgba(64,232,144,0.25); border-color:var(--accent-green); color:var(--accent-green); }
.quiz-question .q-opt.wrong-answer { background:rgba(240,96,112,0.25); border-color:var(--accent-red); color:var(--accent-red); }
.quiz-result { padding:10px 16px; border-radius:var(--radius-sm); margin-top:8px; font-weight:700; font-size:0.95rem; }
.quiz-feedback { font-size:0.84rem; color:var(--text-secondary); margin-top:6px; line-height:1.6; }

/* Sweep info */
.sweep-info { font-size:0.78rem; color:var(--accent-gold); margin-top:4px; font-family:var(--font-mono); }

/* Scrollbar */
::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.12); border-radius:3px; }

/* Utility */
.mt-2 { margin-top:8px; }
.mb-2 { margin-bottom:8px; }
.text-center { text-align:center; }
</style>
</head>

<div class="app-container">

<!-- ═══════════ HEADER ═══════════ -->
<div class="header-bar">
  <div class="header-title">大学普通物理实验 · <span>RLC 串联谐振电路</span></div>
  <div id="resonanceBadge" class="resonance-badge badge-off">调至谐振频率观察现象</div>
</div>

<!-- ═══════════ MAIN GRID ═══════════ -->
<div class="main-grid">

  <!-- ── LEFT: 参数控制 ── -->
  <div class="glass-card" id="controlPanel">
    <h2><span class="dot"></span>实验参数调节</h2>

    <div class="param-group">
      <label>电阻 <span class="val" id="valR">50</span><span class="unit">Ω</span></label>
      <input type="range" id="sliderR" min="1" max="200" value="50" step="1">
    </div>
    <div class="param-group">
      <label>电感 <span class="val" id="valL">100</span><span class="unit">mH</span></label>
      <input type="range" id="sliderL" min="10" max="500" value="100" step="1">
    </div>
    <div class="param-group">
      <label>电容 <span class="val" id="valC">10</span><span class="unit">μF</span></label>
      <input type="range" id="sliderC" min="0.1" max="100" value="10" step="0.1">
    </div>
    <div class="param-group">
      <label>频率 <span class="val" id="valF">159</span><span class="unit">Hz</span></label>
      <input type="range" id="sliderF" min="1" max="2000" value="159" step="1">
    </div>
    <div class="param-group">
      <label>电源电压(有效值) <span class="val" id="valU">10</span><span class="unit">V</span></label>
      <input type="range" id="sliderU" min="1" max="30" value="10" step="0.5">
    </div>

    <div class="btn-row">
