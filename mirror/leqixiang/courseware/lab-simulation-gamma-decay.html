		  'Gamma decay is a type of radioactive decay in which an excited nucleus releases excess energy by emitting a gamma photon (γ), without changing its number of protons or neutrons.\n\n' +
		  'This process does not affect the atomic number or mass number—it only changes the energy state of the nucleus.\n\n' +
		  'Example: Cobalt-60 (⁶⁰Co) undergoes beta decay to form excited Nickel-60 (⁶⁰Ni*).\n' +
		  'Then, ⁶⁰Ni* → ⁶⁰Ni + γ (gamma photon)\n\n' +
		  'Gamma decay often follows alpha or beta decay and is important in nuclear physics, medicine, and astrophysics.'
