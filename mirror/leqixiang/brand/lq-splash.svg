<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 275 104" width="275" height="104" role="img" aria-label="乐启享机器人">
  <title>乐启享机器人</title>
  <defs>
    <linearGradient id="lqBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4356ad"/>
      <stop offset="100%" stop-color="#26367f"/>
    </linearGradient>
    <radialGradient id="lqGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#4356ad" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#4356ad" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="137" cy="40" r="52" fill="url(#lqGlow)">
    <animate attributeName="r" values="50;55;50" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- the little robot of the library -->
  <g transform="translate(137 34) scale(0.82) translate(-137 -40)">
    <path d="M110 40c0-15 12-26 27-26s27 11 27 26c0 9-4 16-10 20l3 12c1 4-2 8-6 8h-8l-1-9h-10l-1 9h-8c-4 0-7-4-6-8l3-12c-6-4-10-11-10-20z" fill="url(#lqBody)"/>
    <ellipse cx="128" cy="36" rx="8.5" ry="9" fill="#f4f6fb">
      <animate attributeName="ry" values="9;1.2;9" dur="4.2s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="146" cy="36" rx="8.5" ry="9" fill="#f4f6fb">
      <animate attributeName="ry" values="9;9;1.2;9" dur="4.2s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="130" cy="37" r="3.4" fill="#26367f"/>
    <circle cx="148" cy="37" r="3.4" fill="#26367f"/>
    <circle cx="126" cy="26" r="4" fill="#f0a22e"/>
    <circle cx="150" cy="26" r="4" fill="#f0a22e"/>
  </g>

  <text x="137" y="86" text-anchor="middle" font-family="'Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif" font-size="30" font-weight="700" letter-spacing="2">
    <tspan fill="#4356ad">乐</tspan><tspan fill="#f0a22e">启</tspan><tspan fill="#4356ad">享</tspan>
  </text>
  <text x="137" y="100" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="8.5" letter-spacing="5.2" fill="#7d8698">LEQIXIANG</text>
</svg>
