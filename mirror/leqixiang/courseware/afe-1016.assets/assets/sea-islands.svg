<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 640" width="520" height="640" role="img" aria-label="南海诸岛位置示意图，标出东沙群岛、西沙群岛、中沙群岛、南沙群岛、黄岩岛和曾母暗沙">
  <title>南海诸岛位置示意图</title>
  <desc>按现代地理参照绘制的岛礁位置示意图，标出东沙群岛、西沙群岛、中沙群岛、南沙群岛、黄岩岛和曾母暗沙。</desc>

  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f0f2"/>
      <stop offset="1" stop-color="#d7e5ea"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6ddc8"/>
      <stop offset="1" stop-color="#d5c9ad"/>
    </linearGradient>
    <marker id="dot" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
      <circle cx="3.5" cy="3.5" r="3" fill="#4356ad"/>
    </marker>
  </defs>

  <rect width="520" height="640" fill="url(#sea)"/>

  <!-- 经纬网 -->
  <g stroke="#9fb3bd" stroke-width="0.7" stroke-dasharray="5 5" opacity="0.75">
    <line x1="78" y1="0" x2="78" y2="640"/>
    <line x1="211" y1="0" x2="211" y2="640"/>
    <line x1="344" y1="0" x2="344" y2="640"/>
    <line x1="0" y1="79" x2="520" y2="79"/>
    <line x1="0" y1="212" x2="520" y2="212"/>
    <line x1="0" y1="345" x2="520" y2="345"/>
    <line x1="0" y1="478" x2="520" y2="478"/>
  </g>
  <g fill="#7d939e" font-size="11" font-family="sans-serif">
    <text x="82" y="14">110°E</text>
    <text x="215" y="14">115°E</text>
    <text x="348" y="14">120°E</text>
    <text x="6" y="75">20°N</text>
    <text x="6" y="208">15°N</text>
    <text x="6" y="341">10°N</text>
  </g>

  <!-- 大陆与中南半岛：只画岸线，不画任何界线 -->
  <g fill="url(#land)" stroke="#a8997c" stroke-width="1.1" stroke-linejoin="round">
    <path d="M0 0 H357 L356 24 L347 38 L326 48 L300 55 L268 60 L232 66 L196 72 L166 79 L152 90 L146 103 L133 110 L124 121 L118 136 L110 150 L97 158 L86 166 L74 180 L64 197 L56 216 L48 236 L41 257 L34 279 L28 302 L21 326 L13 351 L6 377 L0 404 Z"/>
    <path d="M233 138 L253 132 L268 138 L274 152 L266 166 L250 172 L236 165 L229 152 Z"/>
    <path d="M470 6 L486 14 L492 30 L486 48 L474 56 L463 44 L462 24 Z"/>
  </g>

  <!-- 岛礁 -->
  <g fill="none" stroke="#4356ad" stroke-width="1.6">
    <circle cx="348" cy="101" r="7"/>
    <circle cx="195" cy="229" r="7"/>
    <circle cx="254" cy="250" r="6"/>
    <circle cx="276" cy="351" r="8"/>
    <circle cx="382" cy="270" r="4.5" fill="#4356ad"/>
    <circle cx="205" cy="613" r="4.5" fill="#4356ad"/>
  </g>

  <!-- 群岛的范围：虚线圈 -->
  <g fill="none" stroke="#4356ad" stroke-width="1" stroke-dasharray="4 4" opacity="0.75">
    <ellipse cx="195" cy="229" rx="26" ry="17"/>
    <ellipse cx="254" cy="250" rx="15" ry="11"/>
    <ellipse cx="276" cy="351" rx="30" ry="52"/>
  </g>

  <!-- 名字 -->
  <g font-family="sans-serif" font-size="13" fill="#22303c">
    <text x="360" y="98">东沙群岛</text>
    <text x="120" y="224">西沙群岛</text>
    <text x="272" y="247">中沙群岛</text>
    <text x="312" y="356">南沙群岛</text>
    <text x="392" y="267">黄岩岛</text>
    <text x="120" y="618">曾母暗沙</text>
  </g>

  <!-- 指北 -->
  <g stroke="#22303c" stroke-width="1.4" fill="none">
    <path d="M486 84 L492 104 L486 100 L480 104 Z" fill="#22303c"/>
    <text x="486" y="122" font-size="12" font-family="sans-serif" fill="#22303c" text-anchor="middle">N</text>
  </g>

  <text x="12" y="628" font-size="11" font-family="sans-serif" fill="#5d6d78">岛礁位置采用现代地理参照</text>
</svg>
