    loadingDiv.id = 'loadingMessage';
    loadingDiv.style.position = 'absolute';
    loadingDiv.style.top = '50%';
    loadingDiv.style.left = '50%';
    loadingDiv.style.transform = 'translate(-50%, -50%)';
    loadingDiv.style.padding = '20px 40px';
    loadingDiv.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
    loadingDiv.style.color = 'white';
    loadingDiv.style.fontSize = '24px';
    loadingDiv.style.fontFamily = 'Arial, sans-serif';
    loadingDiv.style.borderRadius = '10px';
    loadingDiv.innerText = 'Loading Earth...';
    document.body.appendChild(loadingDiv);
	
    document.getElementById('routine').style.display = 'none';

    // Calculate the centroid of the sphere targets
    if (targets.sphere.length > 0) {
        let centroid = new THREE.Vector3(0, 0, 0);
        targets.sphere.forEach(target => {
            centroid.add(target.position);
        });
        centroid.divideScalar(targets.sphere.length);

        // Delay slightly to simulate loading, then call addEarth
        setTimeout(() => {
            addEarth(centroid.x, centroid.y, centroid.z);

            // Remove loading message after Earth is added
            const loadingDiv = document.getElementById('loadingMessage');
            if (loadingDiv) {
                loadingDiv.remove();
            }
        }, 100); 
    } else {
        console.warn("No sphere targets found");

        // Remove loading message if failed
        const loadingDiv = document.getElementById('loadingMessage');
        if (loadingDiv) {
            loadingDiv.remove();
        }
    }
}

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        webGLRenderer.setSize(window.innerWidth, window.innerHeight);
    }
    function animate() {
        requestAnimationFrame(animate);
	   rotatingRainbowGroups.forEach(item => {
	        if (item.axis === 'z') {
	            item.group.rotation.z += item.speed;
	        } else if (item.axis === 'x') {
	            item.group.rotation.x += item.speed;
	        }
	    });
        TWEEN.update();
        if (earth) {
            // Apply the rotation to the tilt axis
            const rotationMatrix = new THREE.Matrix4().makeRotationAxis(new THREE.Vector3(Math.sin(tiltAngle), Math.cos(tiltAngle), 0), 0.001);
            earth.applyMatrix4(rotationMatrix);
        }
        render();
    }
    function render() {
        controls.update();
        renderer.render(scene, camera);    
        webGLRenderer.render(scene, camera);
    }
