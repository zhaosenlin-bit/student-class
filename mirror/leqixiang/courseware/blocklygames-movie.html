<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="google" value="notranslate">
  <meta name="viewport" content="target-densitydpi=device-dpi, width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="description" content="乐启享 · 动画电影：用积木编程学会循环与判断。">
  <title>乐启享 · 动画电影（Blockly 积木编程）</title>
  <base href="/api/program-assets/blocklygames-movie/">
  <link rel="stylesheet" href="common/common.css">
  <link rel="stylesheet" href="movie/style.css">
  <script>
    window.BlocklyGamesLang = 'zh-hans';
    window.BlocklyGamesLanguages = ['zh-hans'];
    document.cookie = 'lang=zh-hans; path=/';
    </script>
  <script src="movie/generated/msg/zh-hans.js"></script>
  <script>
    /* The games speak with their own message book.  Put our name in it
       before the bundle draws the header. */
    try {
      if (window.BlocklyGamesMsg) window.BlocklyGamesMsg['Games.name'] = '乐启享';
    } catch (e) {}
  </script>
  <script src="movie/generated/compressed.js"></script>
<script>
  (function () {
    var tries = 0;
    var timer = setInterval(function () {
      tries++;
      var box = document.getElementById('title');
      if (box) {
        var link = box.querySelector('a');
        if (link) {
          var text = document.createElement('span');
          text.textContent = '乐启享';
          link.parentNode.replaceChild(text, link);
        }
      }
      if (tries > 60) clearInterval(timer);
    }, 120);
  })();
</script>
</head>
<body>
  <noscript>请开启 JavaScript 才能运行这门积木编程课。</noscript>
</body>
</html>
