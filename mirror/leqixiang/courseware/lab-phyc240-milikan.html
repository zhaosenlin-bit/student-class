<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Times New Roman", Times, serif;
    background: radial-gradient(circle at top, #45d7ef 0%, #22c5df 45%, #16b3cf 100%);
    color: #eefcff;
  }

  #viewport {
    position: fixed;
    inset: 0;
  }

  #leftPanel {
    position: absolute;
    top: 18px;
    left: 18px;
    z-index: 30;
    width: 340px;
    padding: 16px;
    border-radius: 22px;
    background: rgba(7, 41, 56, 0.78);
    border: 1px solid rgba(255,255,255,0.14);
    box-shadow: 0 16px 34px rgba(0,0,0,0.28);
    backdrop-filter: blur(8px);
  }

  .panelTitle {
    margin: 0 0 12px 0;
    font-size: 28px;
    font-weight: bold;
    color: #fff3a6;
    letter-spacing: 0.4px;
  }

  .panelSub {
    margin-bottom: 14px;
    font-size: 15px;
    line-height: 1.45;
    color: #eefcff;
  }

  .section {
    margin-bottom: 14px;
    padding: 14px;
    border-radius: 18px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.10);
  }

  .sectionTitle {
    margin-bottom: 10px;
    font-size: 18px;
    font-weight: bold;
    color: #fff3a6;
  }

  .buttonRow {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 8px;
  }

  .simBtn, .infoLink {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 96px;
    padding: 10px 14px;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: bold;
    font-family: inherit;
    text-decoration: none;
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 14px rgba(0,0,0,0.18);
    transition: transform 0.15s ease, filter 0.15s ease;
  }

  .simBtn:hover, .infoLink:hover {
    transform: translateY(-1px);
    filter: brightness(1.05);
    text-decoration: none;
    color: white;
  }

  .btnInfo   { background: #2f9d58; }
  .btnXray   { background: #d89c25; }
  .btnSpray  { background: #2c67b2; }
  .btnReset  { background: #c94949; }

  .controlRow {
    display: grid;
    grid-template-columns: 1fr 130px 68px;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }

  .controlRow label {
    font-size: 15px;
    font-weight: bold;
    color: #ffffff;
  }

  .valueBox {
    width: 100%;
    height: 38px;
    box-sizing: border-box;
    padding: 6px 10px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.14);
    background: rgba(255,255,255,0.12);
    color: #ffffff;
    font-size: 14px;
    text-align: center;
  }

  input[type="range"] {
    width: 100%;
    appearance: none;
    -webkit-appearance: none;
    height: 8px;
    border-radius: 999px;
    background: linear-gradient(90deg, #e6f7ff, #ffffff);
    outline: none;
    margin: 0;
  }

  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #1f5fff;
    border: 2px solid #ffffff;
    cursor: pointer;
  }

  input[type="range"]::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: #1f5fff;
    border: 2px solid #ffffff;
    cursor: pointer;
  }

  .smallNote {
    margin-top: 10px;
    font-size: 13px;
    line-height: 1.4;
    color: #dff8ff;
  }

  @media (max-width: 900px) {
    #leftPanel {
      width: 300px;
      padding: 14px;
    }

    .controlRow {
      grid-template-columns: 1fr;
      gap: 8px;
    }
  }
</style>

      Turn on the X-ray light first, then spray oil into the chamber.
    </div>

    <div class="buttonRow">
      <button class="simBtn btnXray" id="xray">X-ray: On / Off</button>
      <button class="simBtn btnSpray" id="onoff">Spray Oil: On / Off</button>
    </div>
  </div>

  <div class="section">

    <div class="controlRow">
      <label for="voltage">Plate Voltage</label>
      <input type="range" min="0" max="0.08" value="0" step="0.001" id="voltage">
      <input id="voltageValue" class="valueBox" readonly value="0.000">
    </div>

    <div class="smallNote">
      Adjust the voltage between the two plates to observe how the oil drops move under electric and gravitational forces.
    </div>
  </div>
</div>
<div id="viewport"></div>
</body>
</html>
