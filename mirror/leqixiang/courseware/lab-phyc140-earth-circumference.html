	function drawLine(x, y, z, color, length, thickness) {
	    let sun_light_dir = new THREE.Vector3(23.39, 26.81, -18).normalize();
	    const start = new THREE.Vector3(x, y, z);
	
	    // Compute end point extended outward
	    const end = new THREE.Vector3(
	        x + sun_light_dir.x * length,
	        y + sun_light_dir.y * length,
	        z + sun_light_dir.z * length
	    ); 
	    // Calculate the midpoint of the line
	    const midPoint = new THREE.Vector3().lerpVectors(start, end, 0.5);
	    // Calculate direction vector from start to end
	    const direction = new THREE.Vector3().subVectors(end, start).normalize();
	    // Create the tip of the arrow (a small cone)
	    const arrowTipGeometry = new THREE.ConeGeometry(0.2, 1.5, 32); // Small cone for arrow tip
	    const arrowTipMaterial = new THREE.MeshBasicMaterial({ color: color });
	    const arrowTip = new THREE.Mesh(arrowTipGeometry, arrowTipMaterial);
	    // Position the arrow tip at the midpoint
	    arrowTip.position.copy(midPoint);
	    // Rotate the arrow tip to point in the direction of the line
	    arrowTip.quaternion.setFromUnitVectors(new THREE.Vector3(0, -1, 0), direction);
		
	    const arr = [start, end];
	    const mat = new THREE.MeshBasicMaterial({ color: color });
	    const curve = new THREE.CatmullRomCurve3(arr);
	    const geometry = new THREE.TubeGeometry(curve, 100, thickness, 36, false);
	    const str = new THREE.Mesh(geometry, mat);
	    // Add the arrow tip to the scene
	    str.add(arrowTip);
	    scene.add(str);
	}
	function drawAngleArc(x, y, z, radius, angleDeg, color, thickness) {
	    const angleRad = THREE.MathUtils.degToRad(angleDeg); // Convert degrees to radians
	    const normal = new THREE.Vector3(x, y, z).normalize(); // Normal vector
	    const sunLightDir = new THREE.Vector3(23.39, 26.81, -18).normalize(); // Given sunlight direction
	
	    // Compute the axis of rotation (cross product of normal and light direction)
	    const rotationAxis = new THREE.Vector3().crossVectors(normal, sunLightDir).normalize();
	
	    // Create a circular arc from the normal to the light direction
	    const curvePoints = [];
	    const numPoints = 50; // Number of points along the arc
	    for (let i = 0; i <= numPoints; i++) {
	        let t = (i / numPoints) * angleRad; // Interpolation in radians
	        let quaternion = new THREE.Quaternion().setFromAxisAngle(rotationAxis, t);
	        let point = normal.clone().applyQuaternion(quaternion).multiplyScalar(radius);
	        curvePoints.push(new THREE.Vector3(x + point.x, y + point.y, z + point.z));
	    }
	
	    // Create the curved line
	    const curve = new THREE.CatmullRomCurve3(curvePoints);
	    const geometry = new THREE.TubeGeometry(curve, 100, thickness, 36, false);
	    const material = new THREE.MeshBasicMaterial({ color: color });
	    const arcMesh = new THREE.Mesh(geometry, material);
	
	    scene.add(arcMesh);
	}

	function addLatitudeLine(radius, latitude, color) {
	    //const radius = 40;
	    const latRad = THREE.MathUtils.degToRad(latitude);
	    const curve = new THREE.EllipseCurve(
	        0, 0, radius * Math.cos(latRad), radius, 0, 2 * Math.PI, false
	    );
	    const points = curve.getPoints(100).map(p => new THREE.Vector3(p.x, radius * Math.sin(latRad), p.y));
	    const geometry = new THREE.BufferGeometry().setFromPoints(points);
	    const material = new THREE.LineBasicMaterial({ color: color });
	    const line = new THREE.Line(geometry, material);
	    earth.add(line);
	}
	function addLongitudeLine(longitude, color) {
	    const radius = 40;
	    const lonRad = THREE.MathUtils.degToRad(longitude);
	    const points = [];
	    for (let i = -180; i <= 180; i += 2) {
	        const latRad = THREE.MathUtils.degToRad(i);
	        points.push(new THREE.Vector3(
	            radius * Math.cos(latRad) * Math.cos(lonRad),
	            radius * Math.sin(latRad),
	            radius * Math.cos(latRad) * Math.sin(lonRad)
	        ));
	    }
	    const geometry = new THREE.BufferGeometry().setFromPoints(points);
	    const material = new THREE.LineBasicMaterial({ color: color });
	    const line = new THREE.Line(geometry, material);
	    earth.add(line);
	}
