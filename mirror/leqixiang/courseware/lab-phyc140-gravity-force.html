function drawGravitationalForces() {
    // Remove previous vectors
    arrowArray.forEach(arrow => scene.remove(arrow));
    arrowArray = [];

    const m1 = parseFloat(document.getElementById("massObj1").value);
    const m2 = parseFloat(document.getElementById("massObj2").value);
    const x1 = parseFloat(document.getElementById("posObj1").value);
    const x2 = parseFloat(document.getElementById("posObj2").value);
    const G = 6.674e-11;

    const r = Math.abs(x2 - x1);
    if (r === 0) return;

    const F = (G * m1 * m2) / (r * r); // Force magnitude

    const pos1 = obj1.position.clone();
    const pos2 = obj2.position.clone();
    const direction = new THREE.Vector3().subVectors(pos2, pos1).normalize();
    const forceLength = Math.max(1, 2 * F * 1e8 ); 

    // Vector at obj1 pointing toward obj2
    createVector(pos1, direction, forceLength, 0xff0000);

    // Vector at obj2 pointing toward obj1
    createVector(pos2, direction.clone().negate(), forceLength, 0x0000ff);
}
	
function createVector(position, direction, length, color = 0xffff00, thickness = 0.2, parent = scene) {
    const arrowLength = length;
    const headLength = 2.5;
    const headWidth = 0.5;

    // Create a group to contain both the shaft and the head
    const arrowGroup = new THREE.Group();

    // Create the shaft (cylinder)
    const shaftGeometry = new THREE.CylinderGeometry(thickness, thickness, arrowLength - headLength, 32);
    const shaftMaterial = new THREE.MeshBasicMaterial({ color: color });
    const shaft = new THREE.Mesh(shaftGeometry, shaftMaterial);

    // Position shaft midway along the vector
    const shaftMid = direction.clone().normalize().multiplyScalar((arrowLength - headLength) / 2);
    shaft.position.copy(shaftMid);

    // Rotate shaft to align with the direction
    shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.clone().normalize());

    // Create the arrowhead (cone) manually
    const coneGeometry = new THREE.ConeGeometry(headWidth, headLength, 32);
    const coneMaterial = new THREE.MeshBasicMaterial({ color: color });
    const cone = new THREE.Mesh(coneGeometry, coneMaterial);

    // Move the cone to the tip of the shaft
    const conePos = direction.clone().normalize().multiplyScalar(arrowLength - (headLength / 2));
    cone.position.copy(conePos);

    // Rotate the cone to align with the direction
    cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.clone().normalize());

    // Add both parts to the group
    arrowGroup.add(shaft);
    arrowGroup.add(cone);

    // Set the group's starting position
    arrowGroup.position.copy(position);

    // Add to parent
    parent.add(arrowGroup);
    arrowArray.push(arrowGroup);

    return arrowGroup;
}
function createRuler() {
    const rulerWidth = 120;   // -60 to +60 meters
    const rulerHeight = 6;
    const rulerDepth = 0.2;

    const canvas = document.createElement('canvas');
    canvas.width = 2400;   // high resolution width
    canvas.height = 200;   // increased height for better text visibility
    const ctx = canvas.getContext('2d');

    // Background
    ctx.fillStyle = '#f8e7c7'; // ruler wood color
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Tick and text styles
    ctx.strokeStyle = '#000000';
    ctx.fillStyle = '#000000';
    ctx.lineWidth = 4;
    ctx.font = '36px Arial';             // larger font
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';            // avoid clipping

    const totalRange = 120; // -60 to +60
    const padding = 20;
    const usableWidth = canvas.width - 2 * padding;
    const pixelsPerMeter = usableWidth / totalRange;

    for (let i = -60; i <= 60; i++) {
        const x = padding + (i + 60) * pixelsPerMeter;

        if (i % 10 === 0) {
            // Major ticks
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, 60);
            ctx.stroke();
            ctx.fillText(i.toString(), x, 70); // write label
        } else {
            // Minor ticks
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, 30);
            ctx.stroke();
        }
    }

    // Convert canvas to texture
    const texture = new THREE.CanvasTexture(canvas);
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();

    const material = new THREE.MeshBasicMaterial({ map: texture });
    const geometry = new THREE.BoxGeometry(rulerWidth, rulerHeight, rulerDepth);
    const ruler = new THREE.Mesh(geometry, material);
    ruler.position.y = -25;
    scene.add(ruler);
}
