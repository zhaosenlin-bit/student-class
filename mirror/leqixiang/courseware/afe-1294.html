help:`<h3>教师演示路线</h3><p>用20g、12g、8g三个新实验，均从50g水、60℃扫至20℃。先预测，再看固体，打开曲线辨认纵轴基准，揭示起点/当前实际已溶。25g例用于区分原有固体和本段新析晶；改变水量用新的配方或当前实际补水事件。</p><h3>模型身份与边界</h3><p>教学物质A为假设物质，S(T)=10+0.5T，0—60℃，单位g A/100g水。没有真实化合物名称、分子结构或晶型。各点充分平衡；不模拟过饱和、成核等待、蒸发、化学反应或水合晶体。主杯和曲线均由当前同一物料状态计算。晶体个数/液面是教学显示，质量以账本为准。</p><h3>教材与资料核查 · 2026-10-04</h3><p>工作定位为人教版九年级下册溶解度。实际取得出版社旧教师用书目录，现用教材正文/学校印次仍待核；不编页码、原题或考频。本页为原创受控任务，用户审核待完成。</p><p><a href="https://www.pep.com.cn/products/jc/jks/201510/t20151026_1250892.shtml" target="_blank" rel="noopener">人教社旧目录</a> · <a href="https://openstax.org/books/chemistry-2e/pages/11-3-solubility" target="_blank" rel="noopener">OpenStax 概念核查</a> · <a href="https://www.acs.org/middleschoolchemistry/lessonplans/chapter5/lesson6.html" target="_blank" rel="noopener">ACS 教师曲线活动</a></p><p>ACS网页数据基准是g/100mL水，本页不采用其数表、不偷换单位。未把真实物质的热行为强加给A。</p><h3>保存与使用</h3><p>配方只在应用时生效。当前补料、补水分别计账，追加后新设比较起点；旧独立记录保留。恢复记录是明确回放旧实验，不表示事件被现实撤销。红笔绑定物料状态和视角；不同状态不静默回退。单文件内嵌所有运行资源，帮助中的来源链接仅查阅用，不参与模型运行。</p>`,
