  <div id="container"></div>
  <div id="info">
    <h1>Coulomb's Law</h1>
    Drag the top charge around to see the difference. <br>
    Three charges have the same magnitude q1 = q2 = q3 = 1e-6 C.<br><br>
    <button type="button" class="btn btn-primary" id="pos">Add Pos Charges</button>
    <button type="button" class="btn btn-primary" id="neg">Add Neg Charge</button>

    var container, camera, scene, light, renderer, controls, dragcontrols;

   function init() { 
	fontloader.load('/api/program-assets/3jcn-phyc240-coulomb-law-three/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json', function (font) {

      container = document.getElementById('container');

      renderer.setPixelRatio(window.devicePixelRatio);

      container.appendChild(renderer.domElement);
      
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x659471);
      
      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 20000);
      camera.position.set(0, 30, 100); 
      
      light = new THREE.DirectionalLight(0xffffff, 0.8);
      scene.add(light);
      var amlight = new THREE.AmbientLight(0x404040); 
      scene.add(amlight);
      var pointlight = new THREE.PointLight(0xfaef28, 1, 100);
      pointlight.position.set(10, 25, 30);
      scene.add(pointlight);  

      addCharge(-20, -30, 0, 'red', '+');
      addCharge(20, -30, 0, 'blue', '-');
      
      controls = new OrbitControls(camera, renderer.domElement);
      dragcontrols = new DragControls(dragArray, camera, renderer.domElement);
      dragcontrols.transformGroup = true;
      dragcontrols.addEventListener('dragstart', function(event) {
        	controls.enabled = false;
      });
      dragcontrols.addEventListener('drag', function(event) {
        controls.enabled = false;
		event.object.position.z = 0; // Keep charge in xy-plane
		// Apply some positional limits to the dragged charge
		if(event.object.position.x < -20){
			event.object.position.x = -20;
		}
		if(event.object.position.x > 20){
			event.object.position.x = 20;
		}
		if(event.object.position.y < -20){
			event.object.position.y = -20;
		}
		if(event.object.position.y > 15){
			event.object.position.y = 15;
		}
        updateCoulombForces(); // Update forces on drag
	 updateLinesAndDistances(); 
      });
      dragcontrols.addEventListener('dragend', function(event) {
        controls.enabled = true;
      });
     
      document.getElementById('pos').addEventListener('click', addPos);
      document.getElementById('neg').addEventListener('click', addNeg);
      document.getElementById("reset").addEventListener('click', function(){location.reload();});
      window.addEventListener('resize', onWindowResize, false);      
    }     
	  
    function addPos(){  
      var h = Math.sqrt(3)*20 - 30;
      charge3 = addCharge(0, h, 0, 'red', '+');
      dragArray.push(charge3);
      document.getElementById('pos').disabled = true;
      document.getElementById('neg').disabled = true;
	updateCoulombForces();
        updateLinesAndDistances();
    }

    function addNeg(){  
      var h = Math.sqrt(3)*20 - 30;
      charge3 = addCharge(0, h, 0, 'blue', '-');
      dragArray.push(charge3);
      document.getElementById('pos').disabled = true;
      document.getElementById('neg').disabled = true;
	updateCoulombForces();
        updateLinesAndDistances();
    }

    function addCharge(x, y, z, color, type) {
	      var cGeometry = new THREE.SphereGeometry(2, 32, 32);
	      var charge = new THREE.Mesh(cGeometry, new THREE.MeshBasicMaterial({ color: color }));
	      
	      fontloader.load('/api/program-assets/3jcn-phyc240-coulomb-law-three/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json', function (tex) {
	        var textGeo = new TextGeometry(type, {
	          size: 3,
	          height: 0.2,
	          curveSegments: 6,
	          font: tex,
	        }); 
	        var textMaterial = new THREE.MeshBasicMaterial({ color: 'white' });  
	        var textMesh = new THREE.Mesh(textGeo, textMaterial);
	        textMesh.position.set(-1, -1, 2.3);
	        charge.add(textMesh);
	      });
	      
	      charge.position.set(x, y, z);
	      charge.chargeValue = (type === '+') ? 1e-6 : -1e-6;
	      scene.add(charge);
	      
	      charge.forceVector = new THREE.Vector3(0, 0, 0); // Initialize force vector
	      chargeArray.push(charge);
	      
	      updateCoulombForces();
	      
	      return charge;
	}

	function addVectorForce(position, direction, length, color = 0xffff00) { // Default color is yellow
	    const arrowLength = length;  
	    const headLength = 1.5; //arrowLength * 0.3;  
	    const headWidth = 0.9;   
	
	    var arrowHelper = new THREE.ArrowHelper(direction, position, arrowLength, color, headLength, headWidth);
	    scene.add(arrowHelper);
	}

	  function displayForceMagnitude(charge) {
	    if (!loadedFont) {
	        console.warn("Font not loaded yet, cannot display force magnitude.");
	        return;
	    }
	
	    const forceMagnitude = charge.forceVector.length();
	    const textGeo = new TextGeometry(forceMagnitude.toFixed(2) + " N", {
	        size: 2,
	        height: 0.2,
	        curveSegments: 6,
	        font: loadedFont,
	    });
	    
	    const textMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
	    const textMesh = new THREE.Mesh(textGeo, textMaterial);
	    
	    textMesh.position.copy(charge.position).add(new THREE.Vector3(-5, -9, 0));
	    
	    // Add a unique name or identifier to the text mesh for easy removal later
	    textMesh.name = `forceText_${charge.uuid}`; // Using the charge's unique ID for the text
	    
	    scene.add(textMesh);
	}
	 function updateLinesAndDistances() {
	        // Remove existing lines and distance texts
	        lineArray.forEach(line => scene.remove(line));
	        distanceTextArray.forEach(text => scene.remove(text));
	        lineArray = [];
	        distanceTextArray = [];
	
	        for (let i = 0; i < chargeArray.length; i++) {
	            for (let j = i + 1; j < chargeArray.length; j++) {
	                const charge1 = chargeArray[i];
	                const charge2 = chargeArray[j];
	
	                // Draw a line between charge1 and charge2
	                const geometry = new THREE.BufferGeometry().setFromPoints([charge1.position, charge2.position]);
	                const material = new THREE.LineBasicMaterial({ color: 0xffff00 });
	                const line = new THREE.Line(geometry, material);
	                scene.add(line);
	                lineArray.push(line);
	
	                // Display the distance between charges
	                const distance = charge1.position.distanceTo(charge2.position);
	                const midPoint = new THREE.Vector3().addVectors(charge1.position, charge2.position).multiplyScalar(0.5);
	
	                const distanceText = createDistanceText((1e-3*distance).toFixed(2) + ' m', midPoint);
	                scene.add(distanceText);
	                distanceTextArray.push(distanceText);
	            }
	        }
	    }
	
	    function createDistanceText(text, position) {
	        if (!loadedFont) {
	            console.warn("Font not loaded yet, cannot display distances.");
	            return;
	        }
	
	        const textGeo = new TextGeometry(text, {
	            size: 2,
	            height: 0.2,
	            curveSegments: 6,
	            font: loadedFont,
	        });
	
	        const textMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
	        const textMesh = new THREE.Mesh(textGeo, textMaterial);
	        textMesh.position.copy(position);
	        return textMesh;
	    }
