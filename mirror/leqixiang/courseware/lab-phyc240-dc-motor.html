<body>
 <div id="info">
  <h1>How DC Motors Work?</h1>

<button class="btn btn-primary"
  onclick="alert(`DC Motor

What is it?
A DC motor converts direct-current electrical energy into rotary motion using magnetic forces.

How it works:
1) The stator provides a fixed magnetic field (N and S poles).
2) The rotor (armature) has a coil connected to a split-ring commutator.
3) Two separate carbon brushes press on the commutator segments; they deliver battery current into the rotating coil.
4) Current in the coil within the magnetic field experiences Lorentz forces on opposite sides of the loop, creating a torque.
   (Equivalent view) The current turns the hoop into an electromagnet—one side becomes N and the other S. Attraction and repulsion between this temporary magnet and the horseshoe magnet produce the same torque.
5) Every half-turn, the commutator swaps the coil’s connections under the brushes, reversing the coil current (and the coil’s N/S poles) so the torque keeps the same direction and the rotor continues spinning.
6) Speed increases with supply voltage and decreases with load.

In this simulation: Start to spin, Flip Magnet to reverse the field, and Pause to stop.`)">
  What is a DC Motor?
</button>

  <button type="button" class="btn btn-info" id="start" >Start</button>
  <button type="button" class="btn btn-warning" id="pause" >Pause</button>
  <button type="button" class="btn btn-danger" id="flip" >Flip Magnet</button>
