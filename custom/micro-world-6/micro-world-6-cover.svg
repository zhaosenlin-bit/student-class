<svg xmlns="http://www.w3.org/2000/svg" width="1570" height="1000" viewBox="0 0 1570 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04232A"/>
      <stop offset="0.55" stop-color="#0A3E46"/>
      <stop offset="1" stop-color="#072B33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2E8E92" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2E8E92" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cellFill" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#FAEDCE"/>
      <stop offset="1" stop-color="#E7CB9E"/>
    </radialGradient>
    <clipPath id="lensClip"><circle cx="1120" cy="480" r="300"/></clipPath>
  </defs>

  <rect width="1570" height="1000" fill="url(#bg)"/>
  <rect width="1570" height="1000" fill="url(#glow)"/>

  <!-- 背景里的细胞影子 -->
  <g opacity="0.10" fill="none" stroke="#BEE8DC" stroke-width="2">
    <rect x="720" y="120" width="120" height="100" rx="16"/>
    <rect x="860" y="70" width="100" height="86" rx="14"/>
    <rect x="640" y="740" width="130" height="110" rx="18"/>
    <rect x="1330" y="800" width="150" height="120" rx="20"/>
    <circle cx="1490" cy="240" r="46"/>
    <circle cx="560" cy="220" r="26"/>
  </g>

  <!-- 小光点 -->
  <g fill="#CFEFE2" opacity="0.5">
    <circle cx="700" cy="330" r="5"/><circle cx="760" cy="560" r="3"/><circle cx="660" cy="660" r="4"/>
    <circle cx="1450" cy="620" r="6"/><circle cx="1360" cy="420" r="3"/><circle cx="940" cy="180" r="4"/>
  </g>

  <!-- 放大镜里的洋葱表皮 -->
  <g clip-path="url(#lensClip)">
    <rect x="820" y="180" width="600" height="600" fill="#08282F"/>
    <rect x="820" y="180" width="600" height="600" fill="url(#cellFill)" opacity="0.96"/>
    <g stroke="#B07C42" stroke-width="9" fill="url(#cellFill)">
      <rect x="838" y="196" width="118" height="118" rx="14"/>
      <rect x="966" y="196" width="118" height="118" rx="14"/>
      <rect x="1094" y="196" width="118" height="118" rx="14"/>
      <rect x="1222" y="196" width="118" height="118" rx="14"/>
      <rect x="1350" y="196" width="118" height="118" rx="14"/>
      <rect x="838" y="324" width="118" height="118" rx="14"/>
      <rect x="966" y="324" width="118" height="118" rx="14"/>
      <rect x="1094" y="324" width="118" height="118" rx="14"/>
      <rect x="1222" y="324" width="118" height="118" rx="14"/>
      <rect x="1350" y="324" width="118" height="118" rx="14"/>
      <rect x="838" y="452" width="118" height="118" rx="14"/>
      <rect x="966" y="452" width="118" height="118" rx="14"/>
      <rect x="1094" y="452" width="118" height="118" rx="14"/>
      <rect x="1222" y="452" width="118" height="118" rx="14"/>
      <rect x="1350" y="452" width="118" height="118" rx="14"/>
      <rect x="838" y="580" width="118" height="118" rx="14"/>
      <rect x="966" y="580" width="118" height="118" rx="14"/>
      <rect x="1094" y="580" width="118" height="118" rx="14"/>
      <rect x="1222" y="580" width="118" height="118" rx="14"/>
      <rect x="1350" y="580" width="118" height="118" rx="14"/>
    </g>
    <g fill="#A96B3D">
      <circle cx="922" cy="278" r="14"/><circle cx="1050" cy="278" r="14"/><circle cx="1178" cy="278" r="14"/><circle cx="1306" cy="278" r="14"/>
      <circle cx="922" cy="406" r="14"/><circle cx="1050" cy="406" r="14"/><circle cx="1178" cy="406" r="14"/><circle cx="1306" cy="406" r="14"/>
      <circle cx="922" cy="534" r="14"/><circle cx="1050" cy="534" r="14"/><circle cx="1178" cy="534" r="14"/><circle cx="1306" cy="534" r="14"/>
      <circle cx="922" cy="662" r="14"/><circle cx="1050" cy="662" r="14"/><circle cx="1178" cy="662" r="14"/><circle cx="1306" cy="662" r="14"/>
    </g>
    <!-- 镜片高光 -->
    <path d="M880 300 Q1000 200 1120 210 Q980 250 900 420 Z" fill="#ffffff" opacity="0.16"/>
  </g>

  <!-- 镜片外圈 -->
  <circle cx="1120" cy="480" r="300" fill="none" stroke="#E9E3D3" stroke-width="10" opacity="0.95"/>
  <circle cx="1120" cy="480" r="316" fill="none" stroke="#8FBDB8" stroke-width="3" opacity="0.6"/>
  <path d="M930 300 Q1010 230 1080 226" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.5"/>

  <!-- 文字 -->
  <g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <g opacity="0.95">
      <rect x="112" y="206" width="54" height="4" fill="#8FE3DE"/>
      <text x="182" y="218" font-size="30" letter-spacing="6" fill="#9FD8D2">六年级 · 科学</text>
    </g>
    <text x="106" y="392" font-size="136" font-weight="700" letter-spacing="4" fill="#F5F0DF">微小世界</text>
    <text x="110" y="492" font-size="54" letter-spacing="2" fill="#8FE3DE">从放大镜到显微镜</text>
    <text x="110" y="576" font-size="30" fill="#D8E8E2" opacity="0.82">一片叶子、一滴池水，</text>
    <text x="110" y="622" font-size="30" fill="#D8E8E2" opacity="0.82">放大之后，是另一个世界。</text>

    <g opacity="0.9">
      <rect x="110" y="862" width="46" height="46" rx="12" fill="#F5F0DF"/>
      <text x="122" y="895" font-size="28" font-weight="600" fill="#0B3A42">乐</text>
      <text x="172" y="897" font-size="26" fill="#CFE3DD">乐启享 · 互动课件</text>
    </g>
  </g>
</svg>
