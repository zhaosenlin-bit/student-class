<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>楞次定律 · 3D交互演示</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg-deep: #060b14;
      --bg-panel: #0d1b2a;
      --bg-panel-alt: #111d30;
      --border: #1a3050;
      --text: #d0d8e8;
      --text-dim: #7a8a9e;
      --accent: #00b4d8;
      --accent2: #ff6b35;
      --accent3: #4caf50;
      --accent4: #ffd166;
      --danger: #e63946;
      --panel-width: 320px;
      --header-h: 52px;
      --transition: 0.25s ease;
      --radius: 12px;
    }
    html, body {
      height: 100%;
      width: 100%;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      overflow: hidden;
      position: fixed;
      inset: 0;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
    }
    #mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      height: var(--header-h);
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #mobile-header h1 {
      font-size: 18px;
      font-weight: 500;
      color: var(--text);
      letter-spacing: 0.5px;
    }
    #mobile-header .btn {
      background: var(--bg-panel-alt);
      border-color: var(--accent);
      color: var(--accent);
      padding: 6px 16px;
      font-size: 14px;
    }
    #main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      min-height: 0;
    }
    #center-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 30% 30%, #0a1628, #03070e);
      min-width: 0;
    }
    #side-panel {
      width: var(--panel-width);
      min-width: var(--panel-width);
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) var(--bg-panel);
      transition: margin-right var(--transition);
      flex-shrink: 0;
    }
    #side-panel::-webkit-scrollbar {
      width: 6px;
    }
    #side-panel::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }
    .panel-section {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }
    .panel-section:last-child {
      border-bottom: none;
    }
    .panel-section h3 {
      font-size: 15px;
      color: var(--accent);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-section h3::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--accent);
      border-radius: 2px;
    }
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-panel-alt);
      color: var(--text);
      transition: all 0.2s;
      white-space: nowrap;
      user-select: none;
    }
    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn.active {
      border-color: var(--accent2);
      color: var(--accent2);
      background: rgba(255, 107, 53, 0.15);
    }
    .btn.accent {
      border-color: var(--accent);
      color: var(--accent);
    }
    .ctrl-group {
      margin-top: 10px;
    }
    .ctrl-group label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--text-dim);
      cursor: pointer;
      padding: 6px 0;
    }
    .ctrl-group label input[type="checkbox"] {
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
      cursor: pointer;
      margin: 0;
    }
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      outline: none;
      margin: 10px 0;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid var(--bg-deep);
      box-shadow: 0 0 8px rgba(0,180,216,0.5);
    }
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .data-row .label {
      color: var(--text-dim);
    }
    .data-row .value {
      color: var(--text);
      font-weight: 600;
      text-align: right;
      letter-spacing: 0.3px;
    }
    .info-badge {
      background: rgba(0,180,216,0.12);
      border-left: 4px solid var(--accent);
      padding: 10px 12px;
      border-radius: 0 8px 8px 0;
      margin: 12px 0 4px;
      font-size: 14px;
      color: var(--text);
    }
    .info-card {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 27, 42, 0.92);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 16px 24px;
      max-width: 80%;
      color: var(--text);
      font-size: 18px;
      line-height: 1.6;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      z-index: 6;
      text-align: center;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    .info-card.visible {
      opacity: 1;
    }
    .info-card .step-title {
      color: var(--accent4);
      font-weight: 600;
      margin-right: 10px;
      font-size: 20px;
    }
    @media (max-width: 900px) {
      #mobile-header {
        display: flex;
      }
      #side-panel {
        position: fixed;
        right: 0;
        top: var(--header-h);
        bottom: 0;
        z-index: 50;
        margin-right: calc(-1 * var(--panel-width));
        transition: margin-right var(--transition);
        box-shadow: -4px 0 20px rgba(0,0,0,0.4);
      }
      #side-panel.open {
        margin-right: 0;
      }
      #center-panel {
        width: 100%;
      }
    }
  </style>
</head>

<div id="app">
  <header id="mobile-header">
    <h1>🧲 楞次定律 · 交互演示</h1>
    <button class="btn" id="btn-toggle-panel">☰ 控制</button>
  </header>
  <div id="main-layout">
    <main id="center-panel">
      <div id="info-card" class="info-card">
        <span class="step-title" id="step-label">🔍 观察</span>
        <span id="step-text">移动磁铁观察感应电流方向</span>
      </div>
      <div id="three-container" style="width:100%;height:100%; position:absolute; inset:0;"></div>
    </main>
    <aside id="side-panel">
      <div class="panel-section">
        <h3>🧲 磁铁运动</h3>
        <div class="btn-row" id="motion-group">
          <button class="btn active" data-motion="approach">靠近线圈</button>
          <button class="btn" data-motion="away">远离线圈</button>
        </div>
        <div class="info-badge" style="margin-top:14px;">
          感应电流方向总是阻碍磁通量的变化
        </div>
      </div>
      <div class="panel-section">
        <h3>⚙️ 参数调节</h3>
        <div class="ctrl-group">
          <label style="font-size:14px; color:var(--text-dim);">磁铁速度</label>
          <input type="range" id="speed-slider" min="0.3" max="2.0" step="0.1" value="1.0">
        </div>
        <div class="ctrl-group">
          <label>
            <input type="checkbox" id="show-field" checked> 显示磁场线
          </label>
          <label>
            <input type="checkbox" id="show-current" checked> 显示感应电流
          </label>
          <label>
            <input type="checkbox" id="show-polarity" checked> 显示线圈极性
          </label>
        </div>
      </div>
      <div class="panel-section">
        <h3>📚 分步演示</h3>
        <div class="btn-row" id="step-group">
          <button class="btn" data-step="1">① 磁通量变化</button>
          <button class="btn" data-step="2">② 感应电流方向</button>
          <button class="btn" data-step="3">③ 阻碍作用</button>
          <button class="btn active" data-step="0">⏹ 自由模式</button>
        </div>
      </div>
      <div class="panel-section">
        <h3>📊 实时数据</h3>
        <div class="data-row">
          <span class="label">磁铁运动</span>
          <span class="value" id="data-motion">靠近</span>
        </div>
        <div class="data-row">
          <span class="label">感应电流方向</span>
          <span class="value" id="data-current">逆时针</span>
        </div>
        <div class="data-row">
          <span class="label">线圈N极</span>
          <span class="value" id="data-north">上端 (N)</span>
        </div>
        <div class="data-row">
          <span class="label">阻碍效果</span>
          <span class="value" id="data-effect">排斥</span>
        </div>
        <div class="data-row">
          <span class="label">磁通量变化</span>
          <span class="value" id="data-flux">增加</span>
        </div>
      </div>
    </aside>
  </div>
</div>
