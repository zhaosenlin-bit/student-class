<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/api/program-assets/470/t/local/">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>星河点名器 - 配置</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:radial-gradient(circle at center,rgba(30,64,175,.28),transparent 38%),radial-gradient(circle at 20% 20%,rgba(168,85,247,.22),transparent 25%),#020617;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;color:#fff;display:flex;justify-content:center;padding:40px 20px}
.container{width:100%;max-width:960px}
.title{text-align:center;margin-bottom:30px}
.title h1{font-size:clamp(36px,6vw,72px);font-weight:900;letter-spacing:10px;margin-bottom:10px;background:linear-gradient(90deg,#dbeafe,#93c5fd,#f0abfc,#fde68a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(96,165,250,.85))}
.title p{color:rgba(219,234,254,.82);font-size:clamp(13px,2vw,18px);letter-spacing:4px}
.mainRow{display:flex;gap:20px;align-items:stretch}
.leftCol{flex:1.3;min-width:0}
.rightCol{width:350px;flex-shrink:0;display:flex;flex-direction:column}
.rightCol>.section{flex:1}
.section{background:rgba(255,255,255,.06);backdrop-filter:blur(8px);border:1px solid rgba(191,219,254,.2);border-radius:16px;padding:22px 26px;margin-bottom:18px}
.section h2{font-size:clamp(15px,1.8vw,20px);font-weight:700;margin-bottom:14px;color:#e0f2fe;letter-spacing:2px}
.section .hint{color:rgba(219,234,254,.6);font-size:14px;margin-bottom:12px}
.inputRow{display:flex;gap:10px}
.inputRow input{flex:1;background:rgba(0,0,0,.4);border:1px solid rgba(191,219,254,.3);border-radius:10px;padding:12px 16px;color:#fff;font-size:17px;outline:none;transition:.2s}
.inputRow input:focus{border-color:rgba(96,165,250,.7);box-shadow:0 0 12px rgba(96,165,250,.25)}
.inputRow input::placeholder{color:rgba(219,234,254,.35)}
.btn{background:linear-gradient(135deg,rgba(37,99,235,.9),rgba(168,85,247,.9));color:#fff;border:1px solid rgba(191,219,254,.5);padding:12px 22px;border-radius:10px;font-size:16px;cursor:pointer;transition:.2s;white-space:nowrap;font-family:inherit;font-weight:600;letter-spacing:1px}
.btn:hover{transform:translateY(-1px);box-shadow:0 0 18px rgba(168,85,247,.6)}
.btn-green{background:linear-gradient(135deg,rgba(16,185,129,.9),rgba(37,99,235,.9))}
.fileRow{display:flex;gap:10px;align-items:center}
.fileRow input[type=file]{display:none}
.fileLabel{background:rgba(0,0,0,.4);border:1px solid rgba(191,219,254,.3);border-radius:10px;padding:12px 16px;color:rgba(219,234,254,.7);font-size:15px;cursor:pointer;flex:1;transition:.2s;text-overflow:ellipsis;overflow:hidden;white-space:nowrap}
.fileLabel:hover{border-color:rgba(96,165,250,.5)}
.uploadResult{margin-top:10px;font-size:14px;color:rgba(52,211,153,.9);transition:.3s;opacity:0}
.uploadResult.show{opacity:1}
.uploadResult.err{color:#fca5a5}

/* 名字列表 */
.nameList{min-height:100px;max-height:380px;overflow-y:auto;padding:6px 0;display:flex;flex-direction:column;gap:6px}
.nameList::-webkit-scrollbar{width:4px}
.nameList::-webkit-scrollbar-track{background:transparent}
.nameList::-webkit-scrollbar-thumb{background:rgba(191,219,254,.25);border-radius:4px}
.nameRow{display:flex;align-items:center;gap:8px;background:rgba(96,165,250,.1);border:1px solid rgba(191,219,254,.15);border-radius:8px;padding:8px 10px 8px 14px;font-size:15px;color:#e0f2fe;animation:rowIn .2s ease}
@keyframes rowIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.nameRow .nameText{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nameRow .delBtn{cursor:pointer;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:rgba(239,68,68,.3);color:#fca5a5;font-size:13px;transition:.15s;border:none;font-family:inherit;flex-shrink:0}
.nameRow .delBtn:hover{background:rgba(239,68,68,.7);color:#fff}
.emptyHint{color:rgba(219,234,254,.3);font-size:15px;padding:12px 0;letter-spacing:1px;text-align:center}
.countInfo{color:rgba(219,234,254,.5);font-size:14px;margin-top:10px;text-align:right;padding-right:4px}

.startRow{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:10;text-align:center}
#startBtnCfg{padding:16px 50px;font-size:22px;border-radius:999px;letter-spacing:4px;box-shadow:0 0 30px rgba(96,165,250,.5);transition:.3s}
#startBtnCfg:hover{transform:translateY(-3px);box-shadow:0 0 40px rgba(168,85,247,.7)}
#startBtnCfg:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.footer{text-align:center;margin-top:30px;color:rgba(219,234,254,.3);font-size:13px;letter-spacing:1px}
@media(max-width:720px){.mainRow{flex-direction:column}.rightCol{width:100%}}
</style>
</head>

<div class="container">
  <div class="title">
    <h1>星河点名器</h1>
    <p>配置点名册</p>
  </div>
  <div class="mainRow">
    <div class="leftCol">
      <div class="section">
        <h2>方法一：手动输入</h2>
        <div class="inputRow">
          <input type="text" id="nameInput" placeholder="输入姓名，按 Enter 添加" maxlength="20">
          <button class="btn" id="addBtn">添加</button>
        </div>
      </div>
      <div class="section">
        <h2>方法二：导入表格</h2>
        <div class="hint">支持 CSV 文件，每行一个姓名，第一行为标题行会自动跳过</div>
        <div class="fileRow">
          <label class="fileLabel" id="fileLabel" for="fileInput">点击选择 CSV 文件...</label>
          <input type="file" id="fileInput" accept=".csv,.txt">
        </div>
        <div class="uploadResult" id="uploadResult"></div>
      </div>
    </div>
    <div class="rightCol">
      <div class="section" style="padding-bottom:16px">
        <h2>点名册</h2>
        <div class="nameList" id="nameList">
          <div class="emptyHint">还没有添加姓名</div>
        </div>
        <div class="countInfo" id="countInfo"></div>
      </div>
    </div>
  </div>
  <div class="startRow">
    <button class="btn btn-green" id="startBtnCfg" disabled>开始点名</button>
  </div>
</div>
