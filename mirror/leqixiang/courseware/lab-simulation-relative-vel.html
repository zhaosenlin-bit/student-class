	 <button class="btn btn-danger" onclick="alert(
		  'Simulation Description:\n\n' +
		  'A speed boat and a car start from the same position on the left.\n' +
		  'The speed boat moves in water that flows from left to right, while the car moves on land.\n\n' +
		  'The boat’s speed is measured relative to the water, and the water itself moves relative to the shore.\n' +
		  'The car moves at a constant speed relative to the ground.\n\n' +
		  'Both the boat and the car race to the right, turn around at the same point, and return to the start, for a total distance of 10 km.\n\n' +
		  'You can control:\n' +
		  '• Water speed (relative to shore)\n' +
		  '• Speed of the boat relative to the water\n' +
		  '• Speed of the car relative to the ground\n\n' +
		  'Questions to investigate:\n' +
		  '• is the boat or the car the winner?\n' +
		  '• Under what conditions do the boat and the car finish at the same time (a tie)?\n' +
		  '• Under what conditions does the car win the race?\n' +
		  '• Under what conditions does the speed boat win the race?\n\n' +
		  'Use the simulation to explore how relative velocity and water current affect the race outcome.')">
