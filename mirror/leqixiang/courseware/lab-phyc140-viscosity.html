                        <option value="7800">Steel</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <div class="slider-row">
                    Ball 1 Radius:
                    <select id="radiusSelector">
                        <option value="2" >2 mm</option>
                        <option value="3" selected>3 mm</option>
                        <option value="4">4 mm</option>
                        <option value="5">5 mm</option>
                        <option value="6">6 mm</option>
                    </select>
                </div>
            </div>

            <button type="button" class="btn btn-danger" id="start">Start</button>
            <button type="button" class="btn btn-warning" id="pause">Pause</button>

            <div class="control-group">
                <div class="slider-row">
                    Fluid 2:
                    <select id="fluid2Selector">
                        <option value="white" selected>None</option>
                        <option value="yellow">Olive Oil</option>
                        <option value="blue">Water</option>
                        <option value="brown">Honey</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <div class="slider-row">
                    Ball 2 Density:
                    <select id="density2Selector">
                        <option value="1520">Rubber</option>
                        <option value="2700" selected>Aluminum</option>
                        <option value="7800">Steel</option>
                    </select>
                </div>
            </div>

            <div class="control-group">
                <div class="slider-row">
                    Ball 2 Radius:
                    <select id="radius2Selector">
                        <option value="2">2 mm</option>
                        <option value="3">3 mm</option>
                        <option value="4" selected>4 mm</option>
                        <option value="5">5 mm</option>
                        <option value="6">6 mm</option>
                    </select>
                </div>
            </div>

            <button type="button" class="btn btn-danger" id="reset">Reset</button><br>
           <button class="btn btn-success" onclick="alert(
		  '🔵 What is Viscosity?\n\n' +
		  'Viscosity is a measure of a fluid\'s resistance to motion or deformation. A higher viscosity means the fluid resists flow more strongly.\n\n' +
		  '🔬 For example:\n- Honey is more viscous than water.\n- Olive oil is in between.\n\n' +
		  '🧪 In this simulation:\n- The ball falls under gravity while being slowed by a drag force.\n' +
		  'The drag force follows Stokes\' Law:\n\n' +
		  '   F_drag = 6π η r v\n\n' +
		  'where:\n' +
		  '  η = viscosity of the fluid (Pa·s)\n' +
		  '  r = radius of the ball (in meters)\n' +
		  '  v = velocity of the ball\n\n' +
		  '🧮 Terminal velocity is reached when:\n' +
		  '   net force = 0, so:\n' +
		  '   vₜ = (2/9) × (r² × (ρ_ball - ρ_fluid) × g) ÷ η\n\n' +
		  '📘 Fluid Densities:\n' +
		  '• Water = 1000 kg/m³ (1.00)\n' +
		  '• Olive Oil = 920 kg/m³ (0.92)\n' +
		  '• Honey = 1360 kg/m³ (1.36)\n\n' +
		  '🧪 Fluid Viscosities (Pa·s):\n' +
		  '• Water = 0.001\n' +
		  '• Olive Oil = 0.08\n' +
		  '• Honey = 1.4\n' +
		  '• None = 0 (idealized fluid)\n\n' +
		  'Note: This simulation assumes low Reynolds number (laminar flow), for which Stokes\' Law is valid.'
		);">
		  What is Viscosity?
		</button>

        </div>
        <canvas id="graphCanvas" width="400" height="250" style="position:absolute; right:30px; top:120px; background:white; border:1px solid black;"></canvas>
    </div>
    <div id="viewport"></div>
