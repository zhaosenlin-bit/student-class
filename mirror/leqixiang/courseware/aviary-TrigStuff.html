	<script>


function initialize(){
	xo = 250;
	yo = 550;
	ArrowLength = 400;
	ArrowHead = ArrowLength/10;
	Angle = 60;
	Velocity = 100;
	Moving = "up";
	timeinms = 0;
	
	theCanvas = document.getElementById("CanvasOne");
	ctx = theCanvas.getContext("2d");	
	
	//StartItMoving = setInterval(drawingpart, 20);
	drawingpart();
}



function drawingpart(){
	AngleInRadians = (Angle/180)*Math.PI;
	/* 	background drawing */
	ctx.fillStyle="#EEEEEE";
	ctx.fillRect(0,0,900,600);
	
	/* Grid */
	ctx.strokeStyle = '#000000';
	ctx.globalAlpha = 0.25;
	ctx.lineWidth = 1;
	for(i=0; i<9;i++){
		ctx.beginPath();
		ctx.moveTo(100*i+50, 50);
		ctx.lineTo(100*i+50, 550);
		ctx.stroke();
		ctx.closePath();
	}
	for(i=0; i<5;i++){
		ctx.beginPath();
		ctx.moveTo(50, 100*i+50);
		ctx.lineTo(850, 100*i+50);
		ctx.stroke();
		ctx.closePath();
	}
	ctx.globalAlpha = 1.0;
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.moveTo(250, 50);
	ctx.lineTo(250, 550);
	ctx.stroke();
	ctx.closePath();
	
	ctx.beginPath();
	ctx.moveTo(50, 550);
	ctx.lineTo(850, 550);
	ctx.stroke();
	ctx.closePath();
	
	vox = Velocity*Math.cos(AngleInRadians);
	voy = Velocity*Math.sin(AngleInRadians);
	x1= ArrowLength*Math.cos(AngleInRadians) + xo;
	y1= -ArrowLength*Math.sin(AngleInRadians) + yo;
	x2= ArrowHead*Math.cos(AngleInRadians + 5*Math.PI/6) + x1;
	y2= -ArrowHead*Math.sin(AngleInRadians + 5*Math.PI/6) + y1;
	x3= ArrowHead*Math.cos(AngleInRadians + 7*Math.PI/6) + x1;
	y3= -ArrowHead*Math.sin(AngleInRadians + 7*Math.PI/6) + y1;
	
/* Main Arrow */

	/*Primary Line */	
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.moveTo(xo, yo);
	ctx.lineTo(x1, y1);
	ctx.strokeStyle = '#000099';
	ctx.lineCap = 'round';
	ctx.stroke();
	ctx.closePath();
	
	/*head */
	ctx.lineWidth = 5;
	ctx.moveTo(x1, y1);
	ctx.lineTo(x2, y2);
	ctx.strokeStyle = '#000099';
	ctx.lineCap = 'round';
	ctx.stroke();
	ctx.closePath();
	
	ctx.lineWidth = 5;
	ctx.moveTo(x1, y1);
	ctx.lineTo(x3, y3);
	ctx.strokeStyle = '#000099';
	ctx.lineCap = 'round';
	ctx.stroke();
	ctx.closePath();
	
/* Vertical Arrow */

	/*Primary Line */	
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.moveTo(x1, yo);
	ctx.lineTo(x1, y1);
	ctx.strokeStyle = '#990000';
	ctx.lineCap = 'round';
	ctx.stroke();
	ctx.closePath();
	
	
	ctx.fillStyle="#990000";
	ctx.font="24px Arial";
	
	deltay = yo - y1;
	
	yisago = false;
	
	if (deltay > 100){
		vytext = "y = " + voy.toFixed(1) + "%";
		ctx.fillText(vytext,x1+10,yo-.5*deltay);
		yisago = true;
	}
	
	/*head */
	ctx.lineWidth = 5;
	ctx.moveTo(x1, y1);
	ctx.lineTo(x1-7, y1+20);
	ctx.strokeStyle = '#990000';
	ctx.lineCap = 'round';
	ctx.stroke();
	ctx.closePath();
	
	ctx.lineWidth = 5;
	ctx.moveTo(x1, y1);
	ctx.lineTo(x1+7, y1+20);
	ctx.strokeStyle = '#990000';
	ctx.lineCap = 'round';
	ctx.stroke();
	ctx.closePath();

/* Horizontal Arrow */

	/*Primary Line */	
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.moveTo(xo, yo);
	ctx.lineTo(x1, yo);
	ctx.strokeStyle = '#009900';
	ctx.lineCap = 'round';
	ctx.stroke();
	ctx.closePath();
	
	ctx.fillStyle="#009900";
	ctx.font="24px Arial";
	
	deltax = x1 - xo;
	
	xisago = false;
	
	if (deltax > 100){
		vxtext = "x = " + vox.toFixed(1) + "%";
		metrics = ctx.measureText(vxtext);
		textWidth = metrics.width;
		vxtextstart = xo+.5*deltax - textWidth/2;
		ctx.fillText(vxtext,vxtextstart,yo+30);
		xisago = true;
	}


	ctx.fillStyle="#000000";
	ctx.font="22px Arial";
	
	if (yisago && xisago){
		angletext = "\u03d1 =" + Angle.toFixed(1) + "\u00b0";
		ctx.fillText(angletext,xo+0.05*Math.pow(deltax,1.3),yo-10);
	}
	
	/*head */
	ctx.lineWidth = 5;
	ctx.moveTo(x1, yo);
	ctx.lineTo(x1-20, yo+7);
	ctx.strokeStyle = '#009900';
	ctx.lineCap = 'round';
	ctx.stroke();
	ctx.closePath();
	
	ctx.lineWidth = 5;
	ctx.moveTo(x1, yo);
	ctx.lineTo(x1-20, yo-7);
	ctx.strokeStyle = '#009900';
	ctx.lineCap = 'round';
	ctx.stroke();
	ctx.closePath();
	
	if (Moving == "up"){
		Angle = Angle + .05;
	}
	else{
		Angle = Angle - .05;
	}
	
	if (Angle > 90){
		Angle = 90;
		Moving = "down";
	}
	if (Angle < 0){
		Angle = 0;
		Moving = "up";
	}
	

	
}

function Pause(){
	clearInterval(StartItMoving);
	document.getElementById("PauseButton").style.visibility = "hidden";
	document.getElementById("ResumeButton").style.visibility = "visible";

}

function Resume(){
	StartItMoving = setInterval(drawingpart, 20);
	document.getElementById("PauseButton").style.visibility = "visible";
	document.getElementById("ResumeButton").style.visibility = "hidden";

}

function SetAngle(x){
	Angle = x;
	drawingpart();
}


</script>
