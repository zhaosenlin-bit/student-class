<body>
    <div id="container"></div>
    <div id="info" style="text-align: center">
	    <h1 style="text-align: center">ROLLING DOWN AN INCLINE</h1>
	  
	   <button class="btn btn-warning" onclick="alert('Moment of inertia is a measure of an object\'s resistance to rotational motion. It depends not only on the object\'s mass but also on how that mass is distributed relative to the axis of rotation. Even though all objects have the same mass, their different mass distributions lead to different moments of inertia. This is why they roll down the incline at different speeds. Objects with higher moments of inertia roll more slowly because more of their energy is stored in rotational motion rather than translational motion. Which object will reach the bottom first: sphere shell, solid sphere, ring, or cylinder. Why?')">
		    What is moment of inertia?
	    </button>
	    <button type="button" class="btn btn-danger" id="start">Start</button>
	    <button type="button" class="btn btn-danger" id="pause">Pause</button>
	    <button type="button" class="btn btn-danger" id="reset">Reset</button>
      
    </div>
	
    <script type="module">
		    
	import * as THREE from '../jsm/three.module.js';	
	import { OrbitControls } from '../jsm/OrbitControls.js';
	import { FontLoader } from '../jsm/FontLoader.js';
	import { TextGeometry } from '../jsm/TextGeometry.js';
	    
        var container, camera, scene, light, renderer, controls;
        var sphere, ring, cylinder, shell;
	const radius = 6, height = 22;
	var rolling = true; // Controls if the objects are rolling
        var isPaused = false; // Tracks if the simulation is paused
        var time = 0; 
	
	    
	var fontloader = new FontLoader();
        var textureloader = new THREE.TextureLoader();

        const extrudeSetting = {
	    depth: 12,  // Extrusion depth along the y-axis
	    bevelEnabled: false,
	    steps: 1
	};

        init();
        animate();

        function init() {
            container = document.getElementById('container');
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x659471);

            camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 20000);
            camera.position.set(-50, 30, 70);

            light = new THREE.DirectionalLight(0xffffff, 0.8);
            scene.add(light);
            var amlight = new THREE.AmbientLight(0x404040); // soft white light
            scene.add(amlight);
            var pointlight = new THREE.PointLight(0xfaef28, 1, 100);
            pointlight.position.set(10, 25, 30);
            scene.add(pointlight);		
	 
	    createIncline();
	    addSolidBall();
	    addHollowBall();
	    addRing(radius-1, radius, 5, 60);
	    addSolidRing();
     
  	    //addText(-53, 17, 0, 2, 'frictionless');
	    //addText(-53, 10, 0, 2, 'surface');

            controls = new OrbitControls(camera, renderer.domElement);
            
            document.getElementById('start').addEventListener('click', startSimulation);
	    document.getElementById('pause').addEventListener('click', pauseFunction);
            document.getElementById("reset").addEventListener('click', function() { location.reload(); });
            window.addEventListener('resize', onWindowResize, false);
        }	
	    
	function createIncline() {
	   
	    var A = new THREE.Vector2(0, -20);        // Vertex A at the origin (0, -20)
	    var B = new THREE.Vector2(60, -20);       // Vertex B (60 units along z-axis)
	    var C = new THREE.Vector2(0, 10);         // Vertex C (30 units height, shifted to maintain y-offset)
	
	    var thickness = 80;  // Thickness of the prism along the x-axis (extrusion thickness)
	
	    var geometry = new PrismGeometry([A, B, C], thickness);
	
	    var material = new THREE.MeshPhongMaterial({
	        color: 0x00b2fc, 
	        specular: 0x00ffff, 
	        shininess: 20 
	    });
	
	    var prism = new THREE.Mesh(geometry, material);
	    prism.position.set(thickness / 2, 5, 0); 
	    prism.rotation.y = -Math.PI / 2;  // Rotate to match the desired orientation
	
	    scene.add(prism);
	}

	function PrismGeometry(vertices, thickness) {
	    var shape = new THREE.Shape(); 
	
	    shape.moveTo(vertices[0].x, vertices[0].y);
	    for (var i = 1; i < vertices.length; i++) {
	        shape.lineTo(vertices[i].x, vertices[i].y);
	    }
	    shape.lineTo(vertices[0].x, vertices[0].y); 
	
	    var extrudeSettings = {
	        depth: thickness, 
	        bevelEnabled: false 
	    };
	
	    var geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
	
	    return geometry;
	} 
	
	function addSolidBall() {
    		const geometry = new THREE.SphereGeometry( radius, 32, 32 ); 
		const tex = textureloader.load('../Phyc240/textures/checkboard.png');
    		const material = new THREE.MeshBasicMaterial({map: tex});
		sphere = new THREE.Mesh( geometry, material ); 
		sphere.position.set(0, height, 0);
		scene.add( sphere );	   
	}
	    
	function addHollowBall() {
    		const geometry = new THREE.SphereGeometry( radius, 32, 32 ); 
		const tex = textureloader.load('texture/cross.png');
		const material = new THREE.MeshPhongMaterial( {
			map: tex,
			side:THREE.DoubleSide,
			transparent:true,
			opacity:0.3
		});
		shell = new THREE.Mesh( geometry, material ); 
		shell.position.set(15,height, 0);
		scene.add( shell );   
	}
	
	function addRing(innerRadius, outerRadius, high, Segments) {
	    var extrudeSettings = {
	        depth: high, // Use 'depth' instead of 'amount' to control the thickness
	        bevelEnabled: false,
	        curveSegments: Segments
	    };
	    
	    var arcShape = new THREE.Shape();
	    arcShape.moveTo(outerRadius, 0);
	    arcShape.absarc(0, 0, outerRadius, 0, Math.PI * 2, false);
	
	    var holePath = new THREE.Path();
	    holePath.moveTo(innerRadius, 0);
	    holePath.absarc(0, 0, innerRadius, 0, Math.PI * 2, true);
	    arcShape.holes.push(holePath);
	
	    var geometry = new THREE.ExtrudeGeometry(arcShape, extrudeSettings);
	    const tex = textureloader.load('texture/earth.jpg');
	    var material = new THREE.MeshPhongMaterial({map: tex});
	
	    ring = new THREE.Mesh(geometry, material);
	    ring.rotation.y = Math.PI / 2;
	    ring.position.set(-15, height, 0);
	    scene.add(ring);
	}

	function addSolidRing() {
	   const geometry = new THREE.CylinderGeometry( radius, radius, 5, 32 ); 
	   const tex = textureloader.load('texture/cross.png');
     	   const material = new THREE.MeshBasicMaterial( {map: tex, color: 0xffff00} ); 
           cylinder = new THREE.Mesh( geometry, material ); 
	   cylinder.position.set(-23,height,0);
	   cylinder.rotation.z = Math.PI/2;
           scene.add( cylinder );  
	}
	    
	function startSimulation() {
	    const g = 9.81; // Gravitational acceleration
	
	    // Get incline angle from the prism dimensions (height and base)
	    const inclineHeight = 30;  // Adjust according to prism's height
	    const inclineBase = 60;    // Adjust according to prism's base
	    const angle = Math.atan(inclineHeight / inclineBase); // Incline angle in radians
	
	    // Calculate the total distance along the incline (hypotenuse)
	    const inclineLength = Math.sqrt(Math.pow(inclineHeight, 2) + Math.pow(inclineBase, 2));
	
	    // Calculate the accelerations for each object based on the moment of inertia
	    const a_solidSphere = (g * Math.sin(angle)) / (1 + 2 / 5); // Solid sphere
	    const a_hollowSphere = (g * Math.sin(angle)) / (1 + 2 / 3); // Hollow sphere (shell)
	    const a_cylinder = (g * Math.sin(angle)) / (1 + 1 / 2); // Solid cylinder
	    const a_ring = (g * Math.sin(angle)) / (1 + 1); // Ring
	
	    // Angular velocities
	    const omega_solidSphere = a_solidSphere / radius; 
	    const omega_hollowSphere = a_hollowSphere / radius;
	    const omega_cylinder = a_cylinder / radius;
	    const omega_ring = a_ring / radius;
	
	    let time = 0;
	
	    // Roll simulation loop
	    function rollObjects() {
	        if (!isPaused) {
	            time += 0.02; // Increment time for the animation
	
	            // Calculate displacements
	            const displacement_solidSphere = 0.5 * a_solidSphere * Math.pow(time, 2); // Solid sphere displacement
	            const displacement_hollowSphere = 0.5 * a_hollowSphere * Math.pow(time, 2); // Hollow sphere displacement
	            const displacement_cylinder = 0.5 * a_cylinder * Math.pow(time, 2); // Solid cylinder displacement
	            const displacement_ring = 0.5 * a_ring * Math.pow(time, 2); // Ring displacement
	
	            // Stop if objects reach the bottom of the incline
	            if (displacement_solidSphere < inclineLength) {
	                sphere.position.y = height - displacement_solidSphere * Math.sin(angle);
	                sphere.position.z = displacement_solidSphere * Math.cos(angle);
	                sphere.rotation.x += omega_solidSphere * 0.02;
	            }
	
	            if (displacement_hollowSphere < inclineLength) {
	                shell.position.y = height - displacement_hollowSphere * Math.sin(angle);
	                shell.position.z = displacement_hollowSphere * Math.cos(angle);
	                shell.rotation.x += omega_hollowSphere * 0.02;
	            }
	
	            if (displacement_cylinder < inclineLength) {
	                cylinder.position.y = height - displacement_cylinder * Math.sin(angle);
	                cylinder.position.z = displacement_cylinder * Math.cos(angle);
	                cylinder.rotation.x += omega_cylinder * 0.02;
	            }
	
	            if (displacement_ring < inclineLength) {
	                ring.position.y = height - displacement_ring * Math.sin(angle);
	                ring.position.z = displacement_ring * Math.cos(angle);
	                ring.rotation.x += omega_ring * 0.02;
	            }
	
	            // Render the scene
	            renderer.render(scene, camera);
	        }
	
	        requestAnimationFrame(rollObjects); // Continue the rolling simulation
	    }
	
	    rollObjects(); // Start the rolling motion
	}
	
	function pauseFunction() {
	    isPaused = !isPaused; // Toggle pause state
	    var pauseButton = document.getElementById('pause');
	    if (isPaused) {
	        pauseButton.textContent = 'Resume'; // Change to Resume when paused
	    } else {
	        pauseButton.textContent = 'Pause'; // Change to Pause when running
	    }
	}
      	
	function addText(x,y,z,s,t){
		fontloader.load("/api/program-assets/lab-phyc140-rolling-objects/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json",function(tex){ 
		    var  textGeo = new TextGeometry(t, {
			    size: s,  
			    depth: 0.05, 
			    curveSegments: 0.6,
			    font: tex,
		    });
		    const textMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
		    const textMesh = new THREE.Mesh(textGeo, textMaterial);
		    textMesh.position.set(x,y,z);
		    scene.add(textMesh);
			return textMesh;
		});
	}
	    
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
	    
       function animate() {
	    requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
	    
    </script>
