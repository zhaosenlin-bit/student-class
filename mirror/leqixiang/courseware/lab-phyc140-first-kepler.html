<body>

    <div id="info">
        <h1>Kepler's First Law</h1>
	   <p>Each planet's orbit about the Sun is an ellipse</p>
	   <div class="control-panel">
		<div class="control-group">
		  Perihelion Distance (million km):
		  <div class="slider-row">
		    <input type="range" id="distanceSlider" min="145" max="200" step="0.1" value="147.1">
  			<input type="text" id="distanceValue" value="147.1" readonly>
		  </div>
		</div>

		<div class="control-group">
		  Perihelion Speed (km/s):
		  <div class="slider-row">
		    <input type="range" id="speedSlider" min="20" max="35" step="0.01" value="30.29">
  			<input type="text" id="speedValue" value="30.29" readonly>
		  </div>
		</div>

		<div class="control-group">
		  Sun Mass (×10<sup>30</sup> kg):
		  <div class="slider-row">
		    <input type="range" id="starMassSlider" min="1" max="3" step="0.001" value="1.989">
		    <input type="text" id="starMassValue" value="1.989" readonly>
		  </div>
		</div>

		<div class="control-group">
		  Planet Mass (x10²⁴ kg):
		  <div class="slider-row">
		    <input type="range" id="pMassSlider" min="2" max="7" step="0.05" value="5.97">
		    <input type="text" id="pMassValue" value="5.97" readonly>
		  </div>
		</div><br>
		   
		<button class="btn btn-danger" onclick="
  alert(
'Kepler\'s First Law Simulation – Key Equations\n\n' +
'1. Vis-Viva Equation (Orbital Speed):\n' +
'   v² = G(M + m) * (2/r - 1/a)\n\n' +
'   Where:\n' +
'    v: speed at distance r\n' +
'    G: gravitational constant\n' +
'    M: mass of the Sun\n' +
'    m: mass of the planet\n' +
'    r: current distance from focus\n' +
'    a: semi-major axis\n\n' +
'2. Eccentricity (from perihelion):\n' +
'   e = 1 - (rₚ / a)\n\n' +
'3. Semi-Major Axis (from vis-viva):\n' +
'   a = 1 / (2/r - v² / (G(M + m)))\n\n' +
'4. Orbital Period (Kepler\'s Third Law):\n' +
'   T = 2π * √(a³ / G(M + m))\n\n' +
'5. Radial Distance at Angle θ:\n' +
'   r(θ) = a(1 - e²) / (1 + e * cos(θ))\n\n' +
'6. Angular Speed:\n' +
'   ω = v / r\n\n' +
'Current value in this simulation:\n' +
'   e = ' + (typeof eccentricity !== 'undefined' ? eccentricity.toFixed(4) : 'N/A') + '\n\n' +
'Notes:\n' +
'  Distances in meters\n' +
'  Speeds in m/s\n' +
'  Period in seconds, then: T_days = T / 86400'
  );
">Show Kepler Formulas</button>


    </div>

	<div class="control-panel-right">    
		  <div class="control-group">
		    Period (days):
		    <input type="text" id="period" value="365.2" readonly style="width: 90px;">
		  </div><br>
		Number of days =
		<input type="text" id="days" size="5" value="0" style="background-color:orange; border: solid 1px #6E6E6E;" /><br><br>
		<button class="btn btn-primary" id="pause">Pause</button>
		<button class="btn btn-success" id="reset">Reset</button>
		
	</div>
    </div>
    <div id="viewport"></div>
</body>
