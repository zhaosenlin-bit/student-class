<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>圆的面积推导 · 扇形错位拼接 · 公式标注</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #f5f9ff 0%, #e6edf7 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 16px;
            margin: 0;
        }
        .card {
            max-width: 1100px;
            width: 100%;
            background: rgba(255,255,255,0.65);
            backdrop-filter: blur(4px);
            border-radius: 56px;
            padding: 30px 30px 40px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25), inset 0 1px 2px rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.6);
            transition: all 0.2s ease;
        }
        h2 {
            text-align: center;
            font-weight: 500;
            font-size: 1.9rem;
            letter-spacing: 1px;
            color: #1e293b;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        h2 span {
            background: #1e293b10;
            padding: 0 16px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: 400;
            color: #2c3e50;
        }
        .canvas-wrapper {
            position: relative;
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 15px 0 0px;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1100 / 580;
            background: #fdfdfe;
            border-radius: 48px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08), 0 0 0 1px rgba(255,255,255,0.9);
            touch-action: none;
            max-width: 1000px;
            cursor: grab;
        }
        canvas:active {
            cursor: grabbing;
        }
        .control-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px 30px;
            margin: 22px 0 5px;
        }
        .slider-block {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255,255,255,0.6);
            padding: 8px 20px 8px 24px;
            border-radius: 60px;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.05), 0 4px 10px rgba(0,0,0,0.02);
            backdrop-filter: blur(2px);
        }
        .slider-block label {
            font-weight: 500;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .slider-block label i {
            font-style: normal;
            background: #d0ddea;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 0.9rem;
        }
        input[type="range"] {
            width: 180px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #cbd5e1;
            border-radius: 10px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #2c5282;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(44,82,130,0.3);
            border: 2px solid white;
            transition: 0.08s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.12);
            background: #1e3a5f;
        }
        .value-badge {
            min-width: 48px;
            text-align: center;
            font-weight: 600;
            color: #0b1e33;
            background: #eef4fc;
            padding: 4px 6px;
            border-radius: 40px;
            font-size: 0.95rem;
        }
        .action-buttons {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .btn {
            background: white;
            border: none;
            padding: 8px 22px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #1e293b;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04), 0 0 0 1px rgba(0,0,0,0.02);
            transition: all 0.15s;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #ffffffdd;
            backdrop-filter: blur(2px);
        }
        .btn-primary {
            background: #1e293b;
            color: white;
            box-shadow: 0 4px 10px rgba(30,41,59,0.2);
        }
        .btn-primary:hover {
            background: #0f172a;
            transform: scale(0.96);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #b9c8dd;
        }
        .btn-outline:hover {
            background: #eef3fc;
            border-color: #7f9bc0;
        }
        .annotation-note {
            text-align: center;
            font-size: 0.95rem;
            color: #1e293b;
            padding: 10px 18px;
            background: #e9f0fa80;
            border-radius: 60px;
            display: inline-block;
            margin-left: auto;
            margin-right: auto;
            width: fit-content;
            backdrop-filter: blur(2px);
            border: 1px solid #ffffffb0;
            font-weight: 500;
            transition: opacity 0.3s ease, transform 0.2s ease;
        }
        .annotation-note i {
            font-style: normal;
            background: #d5e2f0;
            padding: 0 14px;
            border-radius: 40px;
            margin: 0 4px;
        }
        .footer-flex {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            row-gap: 6px;
            margin-top: 16px;
        }
        .formula-badge-container {
            display: flex;
            justify-content: center;
            margin-top: 18px;
            margin-bottom: 4px;
        }

        /* 说明文字 —— 直接覆盖在 canvas 之上，与图形在同一平面 */
        .canvas-insight-wrapper {
            position: relative;
            display: inline-block; /* 自适应canvas宽度 */
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
        }
        .canvas-insight-wrapper canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1100 / 580;
            border-radius: 48px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08), 0 0 0 1px rgba(255,255,255,0.9);
        }
        .overlay-text {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(245, 248, 252, 0.80);
            backdrop-filter: blur(6px);
            padding: 12px 28px;
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.9);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            text-align: center;
            font-weight: 500;
            font-size: 1rem;
            color: #0b2a44;
            white-space: nowrap;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.3s ease;
            opacity: 0;
            transform: translateX(-50%) scale(0.92);
            line-height: 1.4;
        }
        .overlay-text.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }
        .overlay-text i {
            font-style: normal;
            background: #d5e2f0;
            padding: 0 12px;
            border-radius: 40px;
            margin: 0 4px;
        }

        @media (max-width: 700px) {
            .card { padding: 20px 16px; }
            .slider-block { flex-wrap: wrap; padding: 12px 16px; }
            input[type="range"] { width: 130px; }
            .overlay-text { font-size: 0.85rem; padding: 10px 18px; white-space: normal; max-width: 90%; }
        }
    </style>
</head>

    <h2>
        📐 圆等分拼接转换模型

    <div class="canvas-wrapper">
        <!-- 容器包裹 canvas + 覆盖文字（与图形同一平面） -->

            <canvas id="pizzaCanvas" width="1100" height="580"></canvas>
            <div id="insightOverlay" class="overlay-text">

    <div class="control-bar">
        <div class="slider-block">
            <label><span>🧩 等分数</span> <i id="sectorCountLabel">4</i></label>
            <input type="range" id="sectorSlider" min="4" max="50" step="2" value="4">
            <span class="value-badge" id="sectorValue">4</span>
        </div>
        <div class="slider-block">
            <label>🔄 拼接进度 <span style="opacity:0.7;">↔</span></label>

        <div class="action-buttons">
            <button class="btn btn-primary" id="animateBtn">▶ 播放</button>
            <button class="btn btn-outline" id="resetBtn">⟲ 重置</button>
        </div>
    </div>

    <div class="formula-badge-container">
        <div class="annotation-note" id="formulaNote">

    </div>

    <div class="footer-flex">
        <span style="font-size:0.8rem; color:#64748b; opacity:0.7; margin-top:4px;">拖动滑块或点击播放观察推导</span>
    </div>
