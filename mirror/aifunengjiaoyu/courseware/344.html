<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分子势能与距离实验</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: linear-gradient(135deg, #e3f0fa 0%, #d4e8f8 50%, #c9e4f6 100%);
  min-height:100vh; padding:20px; display:flex; flex-direction:column; align-items:center;
  background-attachment:fixed;
}
canvas#particleBg { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
.glass {
  background: rgba(255,255,255,0.55); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border-radius:20px; border:1px solid rgba(255,255,255,0.7);
  box-shadow:0 8px 32px rgba(60,100,160,0.12), inset 0 1px 0 rgba(255,255,255,0.6);
  position:relative; z-index:1;
}
h1 { text-align:center; font-size:1.8em; color:#2c4a7c; margin-bottom:4px; letter-spacing:2px; }
.subtitle { text-align:center; font-size:0.9em; color:#5a7aaa; margin-bottom:18px; }
.main-layout { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; max-width:1300px; width:100%; }
.panel { flex:1; min-width:380px; max-width:640px; padding:20px; }
.panel h3 { color:#3a5a8c; margin-bottom:12px; font-size:1.1em; border-bottom:2px solid rgba(100,150,210,0.25); padding-bottom:8px; }
canvas#curveCanvas { display:block; width:100%; height:auto; border-radius:12px; background:rgba(255,255,255,0.35); }
.legend { display:flex; gap:16px; flex-wrap:wrap; margin-top:10px; font-size:0.85em; color:#4a6a9a; }
.legend span { display:flex; align-items:center; gap:4px; }
.legend .dot { width:12px; height:12px; border-radius:50%; display:inline-block; }
.legend .dash { width:16px; height:2px; border-radius:1px; display:inline-block; }
.control-row { display:flex; align-items:center; gap:10px; margin:6px 0; flex-wrap:wrap; }
.control-row label { font-weight:600; color:#3a5a8c; min-width:80px; font-size:0.92em; }
.control-row input[type=range] { flex:1; min-width:140px; accent-color:#4a80c0; }
.control-row .val { font-weight:700; color:#2c5aa0; font-size:1em; min-width:60px; text-align:center; background:rgba(255,255,255,0.5); padding:2px 10px; border-radius:12px; }
.btn {
  padding:8px 18px; border-radius:20px; border:1px solid rgba(100,140,200,0.4); cursor:pointer;
  font-size:0.88em; font-weight:600; transition:all 0.25s; color:#3a5a8c;
  background:rgba(255,255,255,0.5); backdrop-filter:blur(4px);
}
.btn:hover { background:rgba(160,200,240,0.45); box-shadow:0 3px 12px rgba(60,100,160,0.2); }
.btn.active { background:rgba(70,130,200,0.3); border-color:rgba(70,130,200,0.7); color:#1e4a80; }

.info-cards { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
.info-card { flex:1; min-width:140px; padding:12px 14px; border-radius:14px; background:rgba(255,255,255,0.45); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.6); }
.info-card .label { font-size:0.78em; color:#6a8aaa; }
.info-card .value { font-size:1.3em; font-weight:700; color:#2c5aa0; margin-top:2px; }
.info-card .note { font-size:0.7em; color:#8a6a6a; margin-top:2px; }

.training-area { margin-top:16px; }
.training-area h4 { color:#3a5a8c; margin-bottom:8px; }
.training-btns { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.training-card { padding:14px; border-radius:14px; background:rgba(255,255,255,0.45); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.6); margin-bottom:10px; display:none; }
.training-card.show { display:block; }
.training-card .question { font-weight:700; color:#2c4a7c; margin-bottom:8px; }
.training-card .options { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
.training-card .options button { padding:6px 14px; border-radius:16px; border:1px solid rgba(0,0,0,0.15); cursor:pointer; font-size:0.82em; background:#fff; transition:all 0.2s; }
.training-card .options button:hover { background:#e8f0fa; }
.training-card .options button.correct { background:#c8f0c8; border-color:#4a4; color:#151; }
.training-card .options button.wrong { background:#f0c8c8; border-color:#a44; color:#511; }
.training-card .feedback { font-size:0.85em; color:#4a6a8a; padding:8px; border-radius:8px; background:rgba(255,255,255,0.5); display:none; margin-top:6px; }

.quiz-area { margin-top:20px; }
.quiz-area h4 { color:#3a5a8c; margin-bottom:10px; }
.quiz-card { padding:12px 14px; border-radius:12px; margin-bottom:8px; background:rgba(255,255,255,0.45); backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,0.6); }
.quiz-card .q-text { font-weight:600; color:#2c4a7c; margin-bottom:6px; font-size:0.92em; }
.quiz-card .q-opts { display:flex; gap:8px; flex-wrap:wrap; }
.quiz-card .q-opts button { padding:5px 12px; border-radius:14px; border:1px solid rgba(0,0,0,0.12); cursor:pointer; font-size:0.8em; background:#fff; transition:all 0.2s; }
.quiz-card .q-opts button:hover { background:#e8f0fa; }
.quiz-card .q-opts button.chosen-correct { background:#c8f0c8; border-color:#4a4; }
.quiz-card .q-opts button.chosen-wrong { background:#f0c8c8; border-color:#a44; }
.quiz-card .q-explain { font-size:0.78em; color:#5a7a9a; margin-top:6px; display:none; }

.modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.45); z-index:999; display:none; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal-box { background:#fff; border-radius:16px; padding:24px; max-width:420px; width:90%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.3); }
.modal-box .icon { font-size:2.4em; margin-bottom:8px; }
.modal-box h3 { color:#c0392b; margin-bottom:8px; }
.modal-box p { color:#555; font-size:0.92em; margin-bottom:14px; line-height:1.6; }
.modal-box button { padding:8px 28px; border-radius:20px; border:none; cursor:pointer; font-size:0.9em; background:#4a80c0; color:#fff; font-weight:600; transition:all 0.2s; }
.modal-box button:hover { background:#3a6aad; }

.footer { text-align:center; margin-top:20px; font-size:0.75em; color:#8aaacc; }

@media (max-width:820px) {
  .main-layout { flex-direction:column; align-items:center; }
  .panel { max-width:98%; min-width:auto; }
}
</style>

<canvas id="particleBg"></canvas>

<div class="glass" style="padding:18px 28px; margin-bottom:16px; max-width:1300px; width:100%;">
  <h1>分子势能与距离实验</h1>
  <div class="subtitle">人教版选择性必修第三册 | 第一章 分子动能和分子势能 | 高三复习</div>
</div>

<div class="main-layout">
  <div class="panel glass" id="curvePanel">
    <h3>Ep-r 分子势能曲线</h3>
    <canvas id="curveCanvas" width="580" height="400"></canvas>
    <div class="legend">
      <span><span class="dot" style="background:#e74c3c;"></span> Ep-r 势能曲线</span>
      <span><span class="dash" style="background:#3498db;"></span> F-r 分子力曲线 (可切换)</span>
      <span><span class="dot" style="background:#f39c12;"></span> 当前距离标记</span>
      <span><span class="dot" style="background:#27ae60;"></span> r₀ 平衡位置</span>
    </div>
    <div class="control-row" style="margin-top:10px;">
      <button class="btn active" id="btnToggleF" onclick="toggleForceCurve()">显示 F-r 曲线</button>
      <button class="btn" id="btnResetView" onclick="resetView()">重置视图</button>
      <button class="btn" id="btnAnimate" onclick="toggleAnimation()">▶ 自动演示</button>
    </div>
  </div>

  <div class="panel glass" id="controlPanel">
    <h3>分子间距控制</h3>
    <div class="control-row">
      <label>当前距离 r:</label>
      <input type="range" id="rSlider" min="0.15" max="3.0" step="0.005" value="1.0" oninput="onSliderChange()">
      <span class="val" id="rVal">1.00 r₀</span>
    </div>
    <div class="info-cards">
      <div class="info-card">
        <div class="label">分子间距 r</div>
        <div class="value" id="infoR">1.00 r₀</div>
        <div class="note" id="infoRegion">平衡位置</div>
      </div>
      <div class="info-card">
        <div class="label">势能 Ep</div>
        <div class="value" id="infoEp">-1.00 E₀</div>
        <div class="note" id="infoEpNote">最小值</div>
      </div>
      <div class="info-card">
        <div class="label">分子力 F</div>
        <div class="value" id="infoF">0.00 F₀</div>
        <div class="note" id="infoFNote">合力为零</div>
      </div>
      <div class="info-card">
        <div class="label">力做功趋势</div>
        <div class="value" id="infoWork">—</div>
        <div class="note" id="infoWorkNote">—</div>
      </div>
    </div>

    <div class="training-area">
      <h4>曲线判读训练</h4>
      <div class="training-btns">
        <button class="btn" onclick="setTraining(1)">位置A: r &lt; r₀</button>
        <button class="btn" onclick="setTraining(2)">位置B: r = r₀</button>
        <button class="btn" onclick="setTraining(3)">位置C: r &gt; r₀</button>
      </div>
      <div class="training-card" id="trainCard">
        <div class="question" id="trainQ"></div>
        <div class="options" id="trainOpts"></div>
        <div class="feedback" id="trainFB"></div>
      </div>
    </div>

    <div class="quiz-area">
      <h4>知识检测 (6题)</h4>
      <div id="quizContainer"></div>
      <div style="text-align:center; margin-top:8px;">
        <button class="btn" onclick="checkAllQuiz()">提交全部检测</button>
        <span id="quizScore" style="margin-left:12px; font-weight:700; color:#2c5aa0;"></span>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="errorModal">
  <div class="modal-box">
    <div class="icon">⚠️</div>
    <h3 id="modalTitle">易错提醒</h3>
    <p id="modalText"></p>
    <button onclick="closeModal()">我知道了</button>
  </div>
</div>
