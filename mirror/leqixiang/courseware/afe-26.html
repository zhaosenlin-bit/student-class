{

<script type="module">
// === MODULE IMPORTS ===
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// === GLOBAL STATE ===
let scene, camera, renderer, labelRenderer, controls;
let cellModel, membraneModel;
let currentView = 'cell'; // 'cell' or 'membrane'
let waveSpeed = 1.0;
let clock = new THREE.Clock();
let animationSpheres = [];
let labels2D = [];
let psMeshes = []; // for apoptosis demo
let lipidRaftGroup; // for phase separation demo
let isAnimating = false;

// Expose to global for onclick handlers and debugging
window.switchView = switchView;
window.playFreeDiffusion = playFreeDiffusion;
window.playFacilitatedDiffusion = playFacilitatedDiffusion;
window.showKnowledge = showKnowledge;
window.toggleKnowledge = toggleKnowledge;
window.playApoptosis = playApoptosis;
window.getModels = () => ({ cellModel, membraneModel });

// === SCENE SETUP ===
function initScene() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
  camera.position.set(0, 2, 5);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.2;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  // CSS2D
  labelRenderer = new CSS2DRenderer();
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.domElement.style.position = 'absolute';
  labelRenderer.domElement.style.top = '0';
  labelRenderer.domElement.style.pointerEvents = 'none';
  document.getElementById('canvas-container').appendChild(labelRenderer.domElement);

  // Lights - bright enough to preserve PBR
  const ambient = new THREE.AmbientLight(0xffffff, 2.5);
  scene.add(ambient);
  const dir1 = new THREE.DirectionalLight(0xffffff, 3.0);
  dir1.position.set(5, 8, 5);
  scene.add(dir1);
  const dir2 = new THREE.DirectionalLight(0xaaccff, 1.5);
  dir2.position.set(-5, 3, -5);
  scene.add(dir2);

  // Subtle background
  scene.background = new THREE.Color(0x0a0e1a);
  scene.fog = new THREE.FogExp2(0x0a0e1a, 0.05);

  // Controls
  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 0.5;
  controls.maxDistance = 30;

  window.addEventListener('resize', onResize);
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  labelRenderer.setSize(window.innerWidth, window.innerHeight);
}

// === LOAD MODELS ===
async function loadModels() {
  const dracoLoader = new DRACOLoader();
  dracoLoader.setDecoderPath('https://unpkg.com/three@0.160.0/examples/jsm/libs/draco/');
  const loader = new GLTFLoader();
  loader.setDRACOLoader(dracoLoader);

  const loadingText = document.querySelector('#loading-screen p');
  const loadingBar = document.getElementById('loading-bar');

  function loadWithProgress(url, label, barStart, barEnd) {
    return new Promise((resolve, reject) => {
      loader.load(url, resolve, (event) => {
        if (event.lengthComputable) {
          const pct = Math.round(event.loaded / event.total * 100);
          loadingText.textContent = `正在加载${label}... ${pct}%`;
          const barPct = barStart + (barEnd - barStart) * (event.loaded / event.total);
          loadingBar.style.width = barPct + '%';
        }
      }, reject);
    });
  }

  loadingText.textContent = '正在加载细胞模型...';
  const cellGltf = await loadWithProgress('cell.glb', '细胞模型', 0, 60);
  loadingText.textContent = '正在加载细胞膜模型...';
  const memGltf = await loadWithProgress('membrane.glb', '细胞膜模型', 60, 95);
  loadingBar.style.width = '100%';
  loadingText.textContent = '渲染中...';

  cellModel = cellGltf.scene;
  membraneModel = memGltf.scene;

  // Center and scale cell model
  const cellBox = new THREE.Box3().setFromObject(cellModel);
  const cellSize = cellBox.getSize(new THREE.Vector3());
  const cellScale = 3.0 / Math.max(cellSize.x, cellSize.y, cellSize.z);
  cellModel.scale.setScalar(cellScale);
  const cellBox2 = new THREE.Box3().setFromObject(cellModel);
  const cellCenter2 = cellBox2.getCenter(new THREE.Vector3());
  cellModel.position.set(-cellCenter2.x, -cellCenter2.y, -cellCenter2.z);

  // Center and scale membrane
  const memBox = new THREE.Box3().setFromObject(membraneModel);
  const memCenter = memBox.getCenter(new THREE.Vector3());
  const memSize = memBox.getSize(new THREE.Vector3());
  const memScale = 4.0 / Math.max(memSize.x, memSize.y, memSize.z);
  membraneModel.scale.setScalar(memScale);
  // Recompute center after scaling
  const memBox2 = new THREE.Box3().setFromObject(membraneModel);
  const memCenter2 = memBox2.getCenter(new THREE.Vector3());
  membraneModel.position.set(-memCenter2.x, -memCenter2.y, -memCenter2.z);

  // Inject wave shader on membrane materials
  injectWaveShader(membraneModel);

  scene.add(cellModel);
  scene.add(membraneModel);
  // Temporarily show both for label positioning
  membraneModel.visible = true;

  // Force compute all world matrices before label positioning
  scene.updateMatrixWorld(true);

  // Add labels
  addCellLabels();
  addMembraneLabels();

  // Now hide membrane
  membraneModel.visible = false;
  updateLabelVisibility();

  // Hide loading
  document.getElementById('loading-screen').classList.add('hidden');
}

// === WAVE SHADER INJECTION ===
const waveUniforms = {
  uTime: { value: 0 },
  uSpeed: { value: 1.0 },
  uAmplitude: { value: 0.06 }
};

function injectWaveShader(model) {
  model.traverse((child) => {
    if (child.isMesh && child.material) {
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach(mat => {
        mat.onBeforeCompile = (shader) => {
          shader.uniforms.uTime = waveUniforms.uTime;
          shader.uniforms.uSpeed = waveUniforms.uSpeed;
          shader.uniforms.uAmplitude = waveUniforms.uAmplitude;

          shader.vertexShader = shader.vertexShader.replace(
            '#include <common>',
            `#include <common>
            uniform float uTime;
            uniform float uSpeed;
            uniform float uAmplitude;
            `
          );
          shader.vertexShader = shader.vertexShader.replace(
            '#include <begin_vertex>',
            `#include <begin_vertex>
            float wave = sin(position.x * 8.0 + uTime * uSpeed * 2.0) *
                         cos(position.z * 6.0 + uTime * uSpeed * 1.5) *
                         uAmplitude;
            float wave2 = sin(position.x * 12.0 - uTime * uSpeed * 1.2 + 1.5) *
                          sin(position.z * 10.0 + uTime * uSpeed * 0.8) *
                          uAmplitude * 0.5;
            transformed.y += wave + wave2;
            `
          );
        };
        mat.needsUpdate = true;
      });
    }
  });
}

// === LABELS ===
// Cell model label mapping — by material name (v2.0 model uses Object_N mesh names)
// Material colors verified by isolating each material group visually
const cellMaterialLabelMap = {
  'Material.010': '细胞核',           // large pink semi-transparent dome (#4)
  'Material.008': '粗糙内质网',       // blue coiled structure around nucleus (#3)
  'Material.007': '线粒体',           // orange cristae → anchors label at mitochondria (#2)
  'Material.006': '高尔基体',         // red folded layered structure (#1)
  'Material.018': '核糖体',           // small red balls on rough ER
  'Material.026': '光滑内质网',       // dark purple trumpet protrusions (#5)
  'Material.025': '中心粒',           // yellow star-shaped structures
};
// Normalized lookup (dots removed) for Three.js compatibility
const cellMatLookup = {};
for (const [key, val] of Object.entries(cellMaterialLabelMap)) {
  cellMatLookup[key] = val;
  cellMatLookup[key.replace(/\./g, '')] = val;
}

// Membrane model label mapping — only 磷脂双分子层
const membraneLabelMap = {
  'base001_Material001_0': '磷脂双分子层',      // light blue balls with two tails
};

function createLabel(text, position) {
  const div = document.createElement('div');
  div.className = 'label-2d';
  div.textContent = text;
  const label = new CSS2DObject(div);
  label.position.copy(position);
  return label;
}

function updateLabelVisibility() {
  labels2D.forEach(label => {
    if (label.userData.group === 'cell') {
      label.visible = (currentView === 'cell');
    } else if (label.userData.group === 'membrane') {
      label.visible = (currentView === 'membrane');
    }
  });
}

function addCellLabels() {
  // Group all meshes by their label text
  const groups = {};
  cellModel.traverse((child) => {
    if (child.isMesh && child.material) {
      const matName = child.material.name;
      let labelText = cellMatLookup[matName] || cellMatLookup[matName.replace(/\./g, '')];
      if (!labelText) return;
      if (!groups[labelText]) groups[labelText] = [];
      groups[labelText].push(child);
    }
  });
  // Compute world-space center for each label group
  const labelWorldPos = {};
  for (const [labelText, meshes] of Object.entries(groups)) {
    let bestMesh = meshes[0];
    let bestVolume = 0;
    meshes.forEach(m => {
      m.geometry.computeBoundingBox();
      const size = m.geometry.boundingBox.getSize(new THREE.Vector3());
      const vol = size.x * size.y * size.z;
      if (vol > bestVolume) { bestVolume = vol; bestMesh = m; }
    });
    bestMesh.geometry.computeBoundingBox();
    const geoCenter = bestMesh.geometry.boundingBox.getCenter(new THREE.Vector3());
    bestMesh.updateWorldMatrix(true, false);
    geoCenter.applyMatrix4(bestMesh.matrixWorld);
    labelWorldPos[labelText] = geoCenter;
  }
  // Special fix: position 中心粒 between 光滑内质网 and 线粒体
  if (labelWorldPos['中心粒'] && labelWorldPos['光滑内质网'] && labelWorldPos['线粒体']) {
    labelWorldPos['中心粒'].copy(labelWorldPos['光滑内质网']).add(labelWorldPos['线粒体']).multiplyScalar(0.5);
  }
  // Create labels
  for (const [labelText, worldPos] of Object.entries(labelWorldPos)) {
    const localPos = cellModel.worldToLocal(worldPos.clone());
    const label = createLabel(labelText, localPos);
    label.userData.group = 'cell';
    cellModel.add(label);
    labels2D.push(label);
  }
}

function addMembraneLabels() {
  // Group meshes by label text
  const groups = {};
  membraneModel.traverse((child) => {
    if (child.isMesh && membraneLabelMap[child.name]) {
      const labelText = membraneLabelMap[child.name];
      if (!groups[labelText]) groups[labelText] = [];
      groups[labelText].push(child);
    }
  });
  for (const [labelText, meshes] of Object.entries(groups)) {
    // Compute average geometry center across all meshes for this label
    const avgWorld = new THREE.Vector3();
    meshes.forEach(m => {
      m.geometry.computeBoundingBox();
      const geoCenter = m.geometry.boundingBox.getCenter(new THREE.Vector3());
      m.updateWorldMatrix(true, false);
      geoCenter.applyMatrix4(m.matrixWorld);
      avgWorld.add(geoCenter);
    });
    avgWorld.divideScalar(meshes.length);
    membraneModel.worldToLocal(avgWorld);
    const label = createLabel(labelText, avgWorld);
    label.userData.group = 'membrane';
    membraneModel.add(label);
    labels2D.push(label);
  }
}

// === RAYCASTER (click to log mesh name) ===
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function setupRaycaster() {
  renderer.domElement.addEventListener('click', (event) => {
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const targets = currentView === 'cell' ? [cellModel] : [membraneModel];
    const intersects = raycaster.intersectObjects(targets, true);
    if (intersects.length > 0) {
      const hit = intersects[0].object;
      console.log('[Raycaster] name:', hit.name, '| parent:', hit.parent?.name, '| material:', hit.material?.name, '| type:', hit.type);

      // Show tooltip — cell model uses material-based lookup, membrane uses mesh name
      const tooltip = document.getElementById('click-tooltip');
      let displayName;
      if (currentView === 'cell') {
        const matName = hit.material?.name || '';
        displayName = cellMatLookup[matName] || cellMatLookup[matName.replace(/\./g, '')] || hit.parent?.name || hit.name;
      } else {
        displayName = membraneLabelMap[hit.name] || hit.name;
      }
      tooltip.textContent = displayName;
      tooltip.style.left = event.clientX + 12 + 'px';
      tooltip.style.top = event.clientY - 20 + 'px';
      tooltip.classList.add('show');
      setTimeout(() => tooltip.classList.remove('show'), 2000);
    }
  });
}

// === VIEW SWITCHING ===
function switchView() {
  if (isAnimating) return;
  isAnimating = true;
  clearAnimationSpheres();

  const btn = document.getElementById('btn-switch');
  const indicator = document.getElementById('view-indicator');
  const memButtons = document.getElementById('membrane-buttons');
  const fluidSlider = document.getElementById('fluidity-slider');
  const legend = document.getElementById('legend');

  if (currentView === 'cell') {
    // Animate camera to membrane view (side view for flat bilayer)
    gsap.to(camera.position, {
      x: 0, y: 0.6, z: 3.5,
      duration: 1.5,
      ease: 'power2.inOut',
      onUpdate: () => controls.update()
    });
    gsap.to(controls.target, {
      x: 0, y: 0, z: 0,
      duration: 1.5,
      ease: 'power2.inOut'
    });

    // Switch models after brief delay
    gsap.delayedCall(0.3, () => {
      cellModel.visible = false;
      membraneModel.visible = true;
      // Hide cell labels, show membrane labels immediately
      labels2D.forEach(label => {
        label.visible = (label.userData.group === 'membrane');
      });
    });

    setTimeout(() => {
      currentView = 'membrane';
      updateLabelVisibility();
      btn.textContent = '返回细胞视角';
      indicator.textContent = '细胞膜微观视角';
      memButtons.style.display = 'flex';
      fluidSlider.style.display = 'flex';
      legend.classList.add('visible');
      isAnimating = false;
    }, 1600);

  } else {
    gsap.to(camera.position, {
      x: 0, y: 2, z: 5,
      duration: 1.5,
      ease: 'power2.inOut',
      onUpdate: () => controls.update()
    });
    gsap.to(controls.target, {
      x: 0, y: 0, z: 0,
      duration: 1.5,
      ease: 'power2.inOut'
    });

    gsap.delayedCall(0.3, () => {
      membraneModel.visible = false;
      cellModel.visible = true;
      // Hide membrane labels, show cell labels immediately
      labels2D.forEach(label => {
        label.visible = (label.userData.group === 'cell');
      });
    });

    // Close knowledge panel
    document.getElementById('knowledge-panel').classList.remove('open');

    setTimeout(() => {
      currentView = 'cell';
      updateLabelVisibility();
      btn.textContent = '切换到细胞膜视角';
      indicator.textContent = '整体细胞视角';
      memButtons.style.display = 'none';
      fluidSlider.style.display = 'none';
      legend.classList.remove('visible');
      isAnimating = false;
    }, 1600);
  }
}

// === TRANSPORT ANIMATIONS ===
function clearAnimationSpheres() {
  animationSpheres.forEach(s => {
    scene.remove(s);
    s.traverse(child => {
      if (child.geometry) child.geometry.dispose();
      if (child.material) {
        if (child.material.map) child.material.map.dispose();
        child.material.dispose();
      }
    });
  });
  animationSpheres = [];
}

function createMolecule(text, color, radius) {
  const group = new THREE.Group();
  const geo = new THREE.SphereGeometry(radius, 16, 16);
  const mat = new THREE.MeshStandardMaterial({
    color: color,
    emissive: color,
    emissiveIntensity: 0.3,
    roughness: 0.3,
    metalness: 0.1
  });
  const sphere = new THREE.Mesh(geo, mat);
  group.add(sphere);

  // Text label as a Sprite (pure Three.js, no CSS2D — auto-removed with parent)
  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 32;
  const ctx = canvas.getContext('2d');
  ctx.font = 'bold 20px serif';
  ctx.fillStyle = '#ffffff';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  // Decode HTML entities for canvas rendering
  const tmp = document.createElement('span');
  tmp.innerHTML = text;
  ctx.fillText(tmp.textContent, 32, 16);
  const tex = new THREE.CanvasTexture(canvas);
  const spriteMat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sprite = new THREE.Sprite(spriteMat);
  sprite.scale.set(0.15, 0.075, 1);
  sprite.position.set(0, radius + 0.05, 0);
  group.add(sprite);

  return group;
}

function getMembraneYRange() {
  // Find the bilayer base to determine Y crossing range
  let yMin = -0.1, yMax = 0.1;
  membraneModel.traverse(child => {
    if (child.isMesh && child.name.includes('base001')) {
      const box = new THREE.Box3().setFromObject(child);
      yMin = box.min.y;
      yMax = box.max.y;
    }
  });
  return { yMin, yMax };
}

function playFreeDiffusion() {
  if (isAnimating) return;
  clearAnimationSpheres();

  const { yMin, yMax } = getMembraneYRange();
  const yTop = yMax + 0.4;
  const yBottom = yMin - 0.4;
  const midY = (yMin + yMax) / 2;

  // Create O2 molecules at random x,z positions
  for (let i = 0; i < 6; i++) {
    const mol = createMolecule('O&#8322;', 0xff6644, 0.05);
    const x = (Math.random() - 0.5) * 1.5;
    const z = (Math.random() - 0.5) * 1.5;
    const goDown = Math.random() > 0.5;
    mol.position.set(x, goDown ? yTop : yBottom, z);
    scene.add(mol);
    animationSpheres.push(mol);

    const delay = i * 0.3;
    const targetY = goDown ? yBottom : yTop;

    // Wiggling path through lipid bilayer
    const tl = gsap.timeline({ delay });
    tl.to(mol.position, {
      y: midY,
      duration: 1.2,
      ease: 'power1.inOut'
    });
    tl.to(mol.position, {
      x: x + (Math.random() - 0.5) * 0.3,
      z: z + (Math.random() - 0.5) * 0.3,
      duration: 0.4,
      ease: 'sine.inOut'
    }, '-=0.6');
    tl.to(mol.position, {
      y: targetY,
      duration: 1.2,
      ease: 'power1.inOut'
    });
    tl.to(mol.position, {
      x: x + (Math.random() - 0.5) * 0.5,
      duration: 0.5,
      ease: 'sine.inOut'
    }, '-=0.8');

    // Fade out at end — sphere and sprite label disappear together
    tl.to(mol.children[0].material, {
      opacity: 0,
      duration: 0.5,
      onStart: () => { mol.children[0].material.transparent = true; },
      onComplete: () => { mol.visible = false; }
    });
    // Also fade the sprite label
    if (mol.children[1] && mol.children[1].material) {
      tl.to(mol.children[1].material, { opacity: 0, duration: 0.5 }, '-=0.5');
    }
  }
}

function playFacilitatedDiffusion() {
  if (isAnimating) return;
  clearAnimationSpheres();

  // Find large purple transport protein (Torus) positions
  const proteinPositions = [];
  membraneModel.traverse(child => {
    if (child.isMesh && child.name.includes('Torus')) {
      const box = new THREE.Box3().setFromObject(child);
      const center = box.getCenter(new THREE.Vector3());
      proteinPositions.push(center);
    }
  });

  if (proteinPositions.length === 0) {
    // fallback positions
    proteinPositions.push(new THREE.Vector3(0, 0, 0));
  }

  const { yMin, yMax } = getMembraneYRange();
  const yTop = yMax + 0.5;
  const yBottom = yMin - 0.5;

  // Create Na+ and K+ ions passing through transport proteins
  const ions = [
    { text: 'Na&#8314;', color: 0x44aaff },
    { text: 'K&#8314;', color: 0xaa66ff }
  ];

  let idx = 0;
  for (let i = 0; i < Math.min(proteinPositions.length, 5); i++) {
    const pos = proteinPositions[i];
    const ion = ions[idx % ions.length];
    idx++;

    const mol = createMolecule(ion.text, ion.color, 0.05);
    const goDown = i % 2 === 0;
    mol.position.set(pos.x, goDown ? yTop : yBottom, pos.z);
    scene.add(mol);
    animationSpheres.push(mol);

    const delay = i * 0.4;
    const tl = gsap.timeline({ delay });

    // Move to protein channel entrance
    tl.to(mol.position, {
      x: pos.x,
      z: pos.z,
      y: goDown ? yMax + 0.05 : yMin - 0.05,
      duration: 0.8,
      ease: 'power2.inOut'
    });

    // Pass through channel
    tl.to(mol.position, {
      y: goDown ? yMin - 0.05 : yMax + 0.05,
      duration: 1.0,
      ease: 'power1.inOut'
    });

    // Exit and drift
    tl.to(mol.position, {
      y: goDown ? yBottom : yTop,
      x: pos.x + (Math.random() - 0.5) * 0.5,
      duration: 0.8,
      ease: 'power2.out'
    });

    // Fade — sphere and sprite label disappear together
    tl.to(mol.children[0].material, {
      opacity: 0,
      duration: 0.4,
      onStart: () => { mol.children[0].material.transparent = true; },
      onComplete: () => { mol.visible = false; }
    });
    if (mol.children[1] && mol.children[1].material) {
      tl.to(mol.children[1].material, { opacity: 0, duration: 0.4 }, '-=0.4');
    }
  }
}

// === APOPTOSIS DEMO ===
function playApoptosis() {
  clearAnimationSpheres();

  // Collect all membrane mesh materials for color transition
  const meshMats = [];
  membraneModel.traverse(child => {
    if (child.isMesh && child.material) {
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach(mat => {
        if (!mat._origColor) {
          mat._origColor = mat.color.clone();
        }
        meshMats.push(mat);
      });
    }
  });

  // Phase 1: Membrane shrinks (deflates) over 2 seconds
  const origScale = membraneModel.scale.clone();
  gsap.to(membraneModel.scale, {
    x: origScale.x * 0.85,
    y: origScale.y * 0.7,
    z: origScale.z * 0.85,
    duration: 2.5,
    ease: 'power2.inOut'
  });

  // Phase 2: All membrane colors darken significantly
  meshMats.forEach(mat => {
    gsap.to(mat.color, {
      r: mat.color.r * 0.25,
      g: mat.color.g * 0.2,
      b: mat.color.b * 0.25,
      duration: 2.5,
      delay: 0.5,
      ease: 'power2.inOut'
    });
  });

  // Phase 3: Auto-reset after 6 seconds
  gsap.delayedCall(6.0, () => {
    // Restore scale
    gsap.to(membraneModel.scale, {
      x: origScale.x,
      y: origScale.y,
      z: origScale.z,
      duration: 1.5,
      ease: 'power2.inOut'
    });
    // Restore colors
    meshMats.forEach(mat => {
      if (mat._origColor) {
        gsap.to(mat.color, {
          r: mat._origColor.r,
          g: mat._origColor.g,
          b: mat._origColor.b,
          duration: 1.5,
          ease: 'power2.inOut'
        });
      }
    });
  });
}

// === FLUIDITY SLIDER ===
function setupSlider() {
  const slider = document.getElementById('wave-speed');
  const label = document.getElementById('speed-label');
  slider.addEventListener('input', () => {
    waveSpeed = parseFloat(slider.value);
    waveUniforms.uSpeed.value = waveSpeed;
    // Amplitude scales quadratically for dramatic effect at high values
    waveUniforms.uAmplitude.value = 0.06 * waveSpeed * waveSpeed;
    if (waveSpeed <= 1.2) label.textContent = '正常';
    else if (waveSpeed <= 2.0) label.textContent = '偏高';
    else label.textContent = '癌变';
    label.style.color = waveSpeed > 2.0 ? '#ff7744' : waveSpeed > 1.2 ? '#eebb44' : '#7a9cc8';
  });
}

// === ANIMATION LOOP ===
function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  const elapsed = clock.getElapsedTime();

  // Update wave uniform
  waveUniforms.uTime.value = elapsed;

  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
}

// === INIT ===
async function main() {
  initScene();
  setupRaycaster();
  setupSlider();
  await loadModels();
  animate();
}

main();
