	// Function to draw heat removal at constant volume (vertical line down from T=400 to T=200)
	function drawHeatRemoval() {
	    is_two = true;
	    is_one = false;
	    is_heat = false;
	    createFire();
	
	    const xPosition = canvas.width / 2;
	    const yStart = canvas.height / 1.6;    // Start point
	    const yEnd = canvas.height / 1.3;      // End point
	
	    const totalDistance = yEnd - yStart; // Total distance to cover downwards (positive value)
	    let currentHeight = 0;               // Start with no line drawn
	
	    ctx.strokeStyle = "blue"; // Line color
	    ctx.lineWidth = 8;        // Line width
	
	    function animate() {
	
	        // Draw the vertical line
	        ctx.beginPath();
	        ctx.moveTo(xPosition, yStart);                 // Start at the initial point
	        ctx.lineTo(xPosition, yStart + currentHeight); // Draw to the current height (downwards)
	        ctx.stroke();
	
	        // Increment the height gradually until it reaches the end
	        if (currentHeight < totalDistance) {
	            currentHeight += 0.2; // Adjust this value to control the speed (positive value to go downward)
	            requestAnimationFrame(animate); // Continue the animation
	        } else {
	            //is_two = false; // Stop the animation once the line is complete
	            document.getElementById('two').disabled = true;  
		    document.getElementById('three').disabled = false;
	        }
	    }
	    
	    animate(); // Start the animation
	}

	        ctx.beginPath();
	        ctx.moveTo(prevX, prevY);
	        ctx.lineTo(currentX, currentY); // Move to the current position on the curve
	        ctx.lineTo(currentX, baseHeight); // Draw down to the base height
	        ctx.lineTo(prevX, baseHeight); // Draw back to the previous x position at base height
	        ctx.closePath(); // Close the path to form the area
	        ctx.fill(); // Erase the area under the current segment
	        ctx.restore(); // Restore the canvas state
	
	        // Draw the curve incrementally
	        ctx.beginPath();
	        ctx.moveTo(prevX, prevY); // Start from the previous point
	        ctx.quadraticCurveTo(curveControlX, curveControlY, currentX, currentY); // Draw up to the current point
	        ctx.stroke();
	
	        // Update previous position
	        prevX = currentX;
	        prevY = currentY;
	
	        if (t < 1) {
	            t += speed;               // Increment progress to draw the next segment
	            requestAnimationFrame(animate); // Continue animation
	        } else {
	            is_three = false;         // Animation complete
	            document.getElementById('three').disabled = true; // Disable the button
	            document.getElementById('four').disabled = false; // Enable the button
	        }
	    }
	
	    animate(); // Start the animation
	}

	// Function to draw heat addition at constant volume (vertical line up from T=200 to T=400)
	function drawHeatAddition() {
		cleanMessage();
		addMessage('Adding heat at constant volume');
	    is_four = true;
	    is_heat = true;
	    createFire();
	    const xPosition = canvas.width / 3; 
	    const yStart = canvas.height / 1.5;    // Start point at canvas height/1.8
	    const yEnd = canvas.height / 2.25;      // End point at canvas height/1.5
	
	    const totalDistance = yStart - yEnd; // Total distance to cover, should be positive for upward movement
	    let currentHeight = 0;               // Start with no line drawn
	
	    ctx.strokeStyle = "blue"; // Line color
	    ctx.lineWidth = 8;        // Line width
	
	    function animate() {
	        // Draw the vertical line
	        ctx.beginPath();
	        ctx.moveTo(xPosition, yStart);                  // Start at the initial point
	        ctx.lineTo(xPosition, yStart - currentHeight);  // Draw upward to the current height
	        ctx.stroke();
	
	        // Increment the height gradually until it reaches the end
	        if (currentHeight < totalDistance) {
	            currentHeight += 0.2; // Adjust this value to control the speed
	            requestAnimationFrame(animate); // Continue the animation
	        } else {
	            is_four = false; // Stop the animation once the line is complete
	            document.getElementById('four').disabled = true; // Disable the button once the line is drawn
		    is_heat = false; createFire();
	        }
	    }
	
	    animate(); // Start the animation
	}

		
	function setupCanvas(canvas) {
	    // Set the canvas size and scale it for high DPI displays (e.g., Retina displays)
	    const dpr = window.devicePixelRatio || 1;
	    canvas.width = canvas.clientWidth * dpr;
	    canvas.height = canvas.clientHeight * dpr;
	
	    // Scale the context to account for high DPI displays
	    ctx.scale(dpr, dpr);
	}

	function drawPVDiagram(T) {
	        // Draw axes
	        ctx.strokeStyle = "black";
	        ctx.lineWidth = 3; // Thicker line for the axes to make them stand out
	
	        // Draw the vertical and horizontal axes
	        ctx.beginPath();
	        ctx.moveTo(40, 10);    // Top-left for pressure axis (P-axis)
	        ctx.lineTo(40, canvas.height - 30); // Vertical pressure axis (P-axis)
	        ctx.lineTo(canvas.width - 30, canvas.height - 30); // Horizontal volume axis (V-axis)
	        ctx.stroke();
	
	        // Add Axis Labels
	        ctx.font = "bold 16px Arial";
	        ctx.fillStyle = "black";
	        ctx.fillText("V", canvas.width - 20, canvas.height - 10); // Volume axis label
	        ctx.fillText("P", 10, 20);  // Pressure axis label
	
	
	    // Set a consistent line width for all curves
	    ctx.lineWidth = 3; // Set the line thickness to a constant value
	
	    // Define the range of volumes and corresponding pressures
	    const minVolume = 1;  // Minimum volume (arbitrary unit)
	    const maxVolume = 10; // Maximum volume (arbitrary unit)
	    const maxPressure = 1300; // Maximum pressure to limit height
	    const points = 100;   // Number of points to plot
	    const midVolume = (minVolume + maxVolume) / 2; // Mid-point of volume for label placement
	
	    // Calculate volume steps
	    const stepSize = (maxVolume - minVolume) / points;
	
	    // Scale factors for graph (to fit the canvas size)
	    const scaleX = canvas.width / (2 * (maxVolume - minVolume));
	    const scaleY = canvas.height / (1.5 * maxPressure); // Scaling pressure values to fit canvas height
	
	    // Offset to shift the diagram to the right by 1/3 of the x-axis
	    const xOffset = canvas.width / 6;
	
	    // Draw the PV curve for the selected temperature
	    ctx.strokeStyle = T === 300 ? "red" : (T === 200 ? "yellow" : "white"); // Color based on temperature
	    ctx.beginPath();
	
	    let labelX = 0;
	    let labelY = 0;
	    let x = 0;
	    let y = 0;
	
	    for (let i = 0; i <= points; i++) {
	        const V = minVolume + i * stepSize;   // Volume
	        let P = (n * R * T) / V;            // Pressure from Ideal Gas Law
	
	        // Limit the pressure to avoid it going too high
	        if (P > maxPressure) {
	            P = maxPressure;
	        }
	
	        // Convert (V, P) to canvas coordinates and apply xOffset to shift the diagram
	        x = xOffset + (V - minVolume) * scaleX;   // Shift x-coordinate
	        y = canvas.height - 35 - P * scaleY; // Pressure corresponds to y-coordinate (inverted y-axis)
	
	        if (P < maxPressure && i === 0) {
	            ctx.moveTo(x, y);
	        } else if (P < maxPressure) {
	            ctx.lineTo(x, y);
	        }
	
	        // Find the mid-point on the curve to place the label
	        if (Math.abs(V - midVolume) < stepSize) {
	            labelX = x + 100;  // Small offset to ensure label does not overlap with the line
	            labelY = y - 100;
	        }
	    }
	
	    ctx.stroke();
	
	    // Set consistent font and text size
	    ctx.font = "bold 14px Arial";
	    ctx.fillStyle = ctx.strokeStyle;
	    ctx.fillText(`T=${T}K`, labelX, labelY);
	
	    // Reset transparency after drawing
	    ctx.globalAlpha = 1;
	}
		
	function addText(x,y,z,t,alpha){
		fontloader.load( '/api/program-assets/lab-phyc240-cyclic/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json', function ( tex ) {
			var  textGeo = new TextGeometry(t, {
			    size: 3,  
			    height: 0.2, 
			    curveSegments: 6,

		        });

		    	var textMesh = new THREE.Mesh(textGeo , textMaterial);
		    	textMesh.position.set(x,y,z);
		    	textMesh.rotateY(alpha);
		    	scene.add(textMesh);
		});
	}

	function addMessage(t){
		fontloader.load( '/api/program-assets/lab-phyc240-cyclic/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json', function ( tex ) {
			var  textGeo = new TextGeometry(t, {
			    size: 1.5,

			    curveSegments: 3,
			    font: tex,
		        }); 
	
		    	var  textMaterial = new THREE.MeshBasicMaterial({color: 'white'});

			messageArray.push(textMesh);
		    	scene.add(textMesh);
		});
	}
		
	function cleanMessage(){
		for(var i=0; i < messageArray.length; i++){
			scene.remove(messageArray[i]);
		}
	}
		
	function onWindowResize() {
		    camera.aspect = window.innerWidth / window.innerHeight;
		    camera.updateProjectionMatrix();
		    renderer.setSize(window.innerWidth, window.innerHeight);
	}

	const render = () => {
	
	    if (is_one) {
		    if (piston.position.y <= maxHeight) {
		            piston.position.y += 0.005;
		    } else {
			    document.getElementById('two').disabled = false;
			    cleanMessage();
			    addMessage('Remove heat at constant volume');
		    }
	     }
	     if (is_two) {
		     drawHeatRemoval();  
	     }
	     if (is_three) {
		    if (piston.position.y > minHeight) {
		            piston.position.y -= 0.005;
		    }  
	     }
	
	    // Simulate gas molecule motion
	    particleArray.forEach(particle => {
	        if (is_heat) {
	            particle.position.x += (Math.random() - 0.5) * stepSize2;
	            particle.position.y += (Math.random() - 0.5) * stepSize2;
	            particle.position.z += (Math.random() - 0.5) * stepSize2;
	        } else {
	            particle.position.x += (Math.random() - 0.5) * stepSize1;
	            particle.position.y += (Math.random() - 0.5) * stepSize1;
	            particle.position.z += (Math.random() - 0.5) * stepSize1;
	        }
	
	        // Ensure particles remain inside the cylinder
	        const distanceFromCenter = Math.sqrt(particle.position.x ** 2 + particle.position.z ** 2);
	        if (distanceFromCenter > cylinderRadius) {
	            const scalingFactor = cylinderRadius / distanceFromCenter;
	            particle.position.x *= scalingFactor;
	            particle.position.z *= scalingFactor;
	        }
	
	        // Constrain particles to stay within the height bounds and apply elastic collision
	        if (particle.position.y < -6) {
	            particle.position.y = -6;
	            particle.velocity.y = -particle.velocity.y * restitution;  // Reverse velocity in the y direction
	        } else if (particle.position.y > piston.position.y) {
	            particle.position.y = piston.position.y;
	            particle.velocity.y = -particle.velocity.y * restitution;  // Reverse velocity in the y direction
	        }
	    });
		
	    if(fire){
	    	fire.update( performance.now() / 1000 );
	    }
	
	    controls.update();
	    requestAnimationFrame(render);
	    renderer.render(scene, camera);
	};

	window.onload = initScene;
</script>
