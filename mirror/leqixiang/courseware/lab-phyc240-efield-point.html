      width: 100%;

<body>
<div id="app">
  <!-- LEFT CONTROL PANEL -->
  <div id="panel">
    <h1>Control Panel:</h1>
    <div class="sub">
      Drag the charge(s) in 3D. Field vectors are computed on the spherical surface.
    </div>

    <div class="block">
      <label for="chargeMode">Charge configuration</label>
       <select id="chargeMode" class="form-control">
        <option value="one_positive">One Positive Charge</option>
        <option value="one_negative">One Negative Charge</option>
      </select>

      <label for="qPos">
        Positive charge (nC) <span id="qPosVal" class="value">+2</span>
      </label>
      <input id="qPos" type="range" min="1" max="3" step="0.1" value="2" />

      <div id="negGroup">
        <label for="qNeg">
          Negative charge (nC) <span id="qNegVal" class="value">−2</span>
        </label>
        <input id="qNeg" type="range" min="-3" max="-1" step="0.1" value="-2" />
      </div>

      <label for="arrowScale">
        Vector scale <span id="arrowScaleVal" class="value">1.00</span>
      </label>
      <input id="arrowScale" type="range" min="0.4" max="2.0" step="0.05" value="1.0" />

     <label style="margin-top:6px;">Surface E-field Magnitude (Unit: N/C or V/m)</label>
     <input id="eFieldValue" class="form-control" type="text" readonly style="font-weight:700; text-align:center;" />
      
    </div>

    <div class="block">
      <div class="row row-tight">
        <div class="col-xs-12" style="margin-bottom:8px;">
          <button id="btnWhat" class="btn btn-primary btn-block">
            What is Electric Field?
          </button>
        </div>
        <div class="col-xs-6">
          <button id="btnReset" class="btn btn-warning btn-block">Reset</button>
        </div>
        <div class="col-xs-6">
          
        </div>
      </div>
    </div>

    <div class="block" style="margin-bottom:0;">
      <p class="help" style="margin:0;">
       <b>Units:</b> charge in nC.
      <b>Distance:</b> 1 scene unit = 1 cm (r = 14 cm from charge to surface).<br>
      <b>Arrows:</b> Length scaled for visualization only.
      </p>
    </div>
  </div>

  <!-- 3D VIEWPORT -->
  <div id="viewport" aria-label="3D simulation viewport"></div>
</div>
