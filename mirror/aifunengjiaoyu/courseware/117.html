<html lang="zh-CN">
<head><base href="/">

  <title>立方体截面可视化工具 · 数学可视化</title>
  <meta name="grade" content="高中">
  <meta name="topic" content="立体几何">
  <meta name="difficulty" content="高">
  <meta name="priority" content="A">
  <meta name="cognitive" content="分解">
  <meta name="desc" content="用平面切割正方体，动画展示6种截面形状（三角形到正六边形），理解截面形状与切割方式的关系">
  
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#f7f6f2;--surface:#fff;--ink:#1a1814;--ink2:#6b6860;--ink3:#a8a69f;--border:#e4e2da;--blue:#2a5c8f;--blue-light:#e8f0f8;--teal:#0f6e56;--teal-light:#e1f5ee;--amber:#854f0b;--amber-light:#faeeda;--radius:12px;--radius-sm:8px;}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:var(--bg);font-family:'Noto Sans SC',sans-serif;color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
    header{width:100%;max-width:760px;padding:24px 20px 0;}
    .badge{font-size:12px;color:var(--ink2);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:4px 12px;display:inline-block;margin-bottom:8px;}
    h1{font-size:22px;font-weight:700;}
    .sub{font-size:13px;color:var(--ink2);margin-top:4px;}
    main{width:100%;max-width:760px;padding:14px 20px 32px;display:flex;flex-direction:column;gap:10px;}
    .cut-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;}
    .cut-btn{padding:10px 8px;border:2px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;background:var(--surface);font-size:13px;font-weight:700;transition:all .2s;text-align:center;}
    .cut-btn small{display:block;font-size:11px;font-weight:400;color:var(--ink2);margin-top:2px;}
    .cut-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
    .cut-btn.active small{color:rgba(255,255,255,0.8);}
    canvas{width:100%;display:block;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);}
    .info-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
    .info-chip{background:var(--teal-light);border:1px solid var(--teal);border-radius:var(--radius-sm);padding:6px 14px;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--teal);}
    .fb{background:var(--teal-light);border-left:4px solid var(--teal);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;line-height:1.7;}
  </style>
</head>
