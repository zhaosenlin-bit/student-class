<body>
  <div id="panel">
<div class="title">
  &lambda; = 1 &times; 10<sup>&minus;9</sup> C/m,&nbsp;
  k = 9 &times; 10<sup>9</sup> N·m<sup>2</sup>/C<sup>2</sup>
</div>

    <div class="rowline">
      <div class="ctrl-label">Mode</div>
      <select id="loopsMode" class="form-control input-sm">
        <option value="1">One Loop</option>
        <option value="3">Three Loops</option>
      </select>
      <div class="noteText">
		  Tip: In <b>Three Loops</b> mode, the radius slider sets the <b>outer</b> loop.
		</div>
    </div>

    <div class="rowline">
      <div class="ctrl-label" id="radiusHint">Big Loop Radius (cm)</div>
      <div class="inline">
        <input id="radiusSlider" type="range" min="5" max="15" step="1" />
        <div class="valuechip" id="radiusVal">5 cm</div>
      </div>
    </div>

    <div class="rowline">
      <div class="ctrl-label">P Position on x-axis (cm)</div>
      <div class="inline">
        <!-- NEW: slider centered at 0, and display shows true coordinate -->
        <input id="pSlider" type="range" min="0" max="30" step="1" />
        <div class="valuechip" id="pVal">0 cm</div>
      </div>
      <div class="noteText">
		  Coordinate system: ring center at <b>x = 0</b>.
		</div>
    </div>

    <div class="outrow">
      <label>Electric Potential at P, <span style="font-weight:400;">Vp</span></label>
      <input id="potential" class="form-control input-sm" type="text" value="0 V" readonly>
    </div>

    <div class="outrow">
      <label>Electric Field at P, <span style="font-weight:400;">Ep</span></label>
      <input id="efield" class="form-control input-sm" type="text" value="0 N/C" readonly>
    </div>

    <div style="margin-top:10px;">
        <button class="btn btn-danger btn-sm" id="reset">Reset</button>
		    
    </div>
  </div>

  <div id="viewport"></div>
</body>
</html>
