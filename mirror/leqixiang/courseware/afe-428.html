<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>圆周率小探险 · 蚂蚁走周长</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #060b14;
      --bg-panel: #0d1b2a;
      --bg-panel-alt: #111d30;
      --border: #1a3050;
      --text: #d0d8e8;
      --text-dim: #7a8a9e;
      --accent: #00b4d8;
      --accent2: #ff6b35;
      --accent3: #4caf50;
      --accent4: #ffd166;
      --danger: #e63946;
      --panel-width: 290px;
      --header-h: 46px;
      --transition: 0.25s ease;
      --radius: 10px;
    }

    html, body {
      height: 100%;
      background: var(--bg-deep);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      overflow: hidden;
      color: var(--text);
      user-select: none;
      touch-action: none;
    }

    /* 全屏沉浸式布局：无面板，所有内容叠加在视口上 */
    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
      background: var(--bg-deep);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 画布容器 */
    #canvas-wrap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 40% 40%, #0a1a2e, #060b14);
    }

    /* ---- 浮动信息卡片（全屏沉浸式） ---- */
    .info-card {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6, 11, 20, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 180, 216, 0.25);
      border-radius: 20px;
      padding: 16px 28px;
      max-width: 90vw;
      width: auto;
      min-width: 280px;
      color: var(--text);
      font-size: 18px;
      line-height: 1.5;
      pointer-events: none;
      z-index: 10;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.7);
      transition: opacity 0.2s;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px 24px;
    }

    .info-card .data-group {
      display: flex;
      align-items: baseline;
      gap: 6px;
      white-space: nowrap;
    }

    .info-card .label {
      color: var(--text-dim);
      font-size: 15px;
      letter-spacing: 0.3px;
    }

    .info-card .value {
      font-weight: 700;
      font-size: 24px;
      color: #fff;
    }

    .info-card .value.accent {
      color: var(--accent);
    }

    .info-card .value.accent2 {
      color: var(--accent2);
    }

    .info-card .value.accent4 {
      color: var(--accent4);
    }

    .info-card .pi-badge {
      background: rgba(0, 180, 216, 0.15);
      padding: 4px 14px;
      border-radius: 30px;
      border: 1px solid rgba(0, 180, 216, 0.3);
      font-size: 16px;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    /* 顶部小提示 */
    .hint-tip {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 27, 42, 0.7);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 8px 20px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-dim);
      font-size: 15px;
      letter-spacing: 0.5px;
      z-index: 10;
      pointer-events: none;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hint-tip span {
      color: var(--accent4);
      font-weight: 600;
    }

    .hint-tip .emoji-big {
      font-size: 22px;
    }

    /* 响应式调整 */
    @media (max-width: 600px) {
      .info-card {
        bottom: 20px;
        padding: 12px 18px;
        font-size: 15px;
        min-width: 200px;
        gap: 8px 14px;
        border-radius: 16px;
        flex-wrap: wrap;
      }
      .info-card .value {
        font-size: 20px;
      }
      .info-card .label {
        font-size: 13px;
      }
      .info-card .pi-badge {
        font-size: 13px;
        padding: 2px 10px;
      }
      .hint-tip {
        top: 12px;
        font-size: 13px;
        padding: 6px 14px;
        white-space: normal;
      }
    }

    @media (max-width: 400px) {
      .info-card .data-group {
        flex-wrap: wrap;
        justify-content: center;
      }
    }
  </style>
</head>
