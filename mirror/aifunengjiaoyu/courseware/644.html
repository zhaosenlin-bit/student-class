      <div class="lesson-title">
        <h1>轮子为什么是圆的？</h1>
        <div class="lesson-meta">
          <span class="lesson-chip">学科：数学</span>
          <span class="lesson-chip">年级：六年级上册</span>
          <span class="lesson-chip">知识点：圆的认识</span>
          <span class="lesson-chip">核心：圆心到圆上各点距离相等</span>
        </div>
      </div>
      <div class="lesson-side-label">
        <strong>观察任务：</strong>拖动或启动不同形状的“轮子”，比较中心轨迹的平稳程度，理解圆形轮子滚动时为什么更平稳。
      </div>

      <strong>课堂提示：</strong>圆形轮子滚动时，圆心到地面的距离始终等于半径；非圆形轮子滚动时，中心高度会不断变化，所以会产生明显颠簸。
    </div>

  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });

  // 防键盘快捷键: F12 | Ctrl+Shift+I | Ctrl+Shift+J | Ctrl+U | Ctrl+S
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'i' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u')) ||
      (e.ctrlKey && (e.key === 's' || e.key === 'S'))
    ) {
      e.preventDefault();
      return false;
    }
  });

  // DevTools 检测（基于 debugger 语句执行耗时）
  var _cdt = function() {
    var t0 = performance.now();
    (function(){}).constructor('debugger')();
    if (performance.now() - t0 > 100) {
      (function lp() {
        (function(){}).constructor('debugger')();
        setTimeout(lp, 50);
      })();
    }
  };
  setTimeout(_cdt, 1000);
  setInterval(_cdt, 3000);

  // 控制台版权声明
  setTimeout(function() {
    console.log('%c⚠️ 版权声明', 'font-size:18px;color:#ef4444;font-weight:bold');
    console.log('%c本内容受版权保护，未经授权复制或分发将承担法律责任。', 'font-size:13px;color:#666');
  }, 500);
})();
</script>
</body></html>
