<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>圆柱表面积展开演示模型</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background-color: #fdf6f0;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255, 245, 235, 0.85);
            backdrop-filter: blur(4px);
            padding: 12px 20px;
            border-radius: 40px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
            color: #7a5a5a;
            font-weight: 500;
            pointer-events: none;
            border: 1px solid rgba(255, 215, 200, 0.5);
            font-size: 16px;
        }
        #info span {
            display: inline-block;
            background: #fce4d6;
            padding: 0 12px;
            border-radius: 30px;
            color: #b35e5e;
            margin-left: 8px;
        }
        #summary-panel {
            position: absolute;
            bottom: 110px;
            right: 30px;
            background: rgba(255, 245, 235, 0.9);
            backdrop-filter: blur(8px);
            padding: 20px 28px;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
            border: 1px solid rgba(255, 215, 200, 0.4);
            color: #4d3a3a;
            max-width: 300px;
            pointer-events: none;
            transition: opacity 0.6s ease;
            opacity: 0;
            font-size: 15px;
            line-height: 1.6;
        }
        #summary-panel.visible {
            opacity: 1;
        }
        #summary-panel h4 {
            margin: 0 0 10px 0;
            font-weight: 600;
            color: #b35e5e;
            font-size: 18px;
            letter-spacing: 1px;
            border-bottom: 2px dashed #f3cdb6;
            padding-bottom: 6px;
        }
        #summary-panel .formula {
            background: #fce4d6;
            padding: 8px 14px;
            border-radius: 30px;
            font-weight: 600;
            color: #9a4a4a;
            display: inline-block;
            margin: 6px 0;
            font-size: 16px;
        }
        #summary-panel .step {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
        }
        #summary-panel .total {
            font-size: 20px;
            font-weight: 700;
            color: #b35e5e;
            border-top: 2px solid #f3cdb6;
            margin-top: 8px;
            padding-top: 8px;
            text-align: right;
        }
        #controls-note {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #b99a8a;
            font-size: 13px;
            background: rgba(255, 245, 235, 0.6);
            padding: 6px 16px;
            border-radius: 40px;
            backdrop-filter: blur(2px);
        }
        #replay-btn {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 245, 235, 0.9);
            backdrop-filter: blur(8px);
            padding: 12px 28px;
            border-radius: 50px;
            border: 1px solid rgba(255, 215, 200, 0.5);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            color: #7a5a5a;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1px;
            z-index: 100;
            font-family: inherit;
            outline: none;
        }
        #replay-btn:hover {
            background: rgba(255, 235, 220, 0.95);
            box-shadow: 0 12px 28px rgba(0,0,0,0.1);
            transform: translateX(-50%) scale(1.02);
        }
        #replay-btn:active {
            transform: translateX(-50%) scale(0.96);
        }

        /* 滑块控制区 */
        #slider-panel {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 245, 235, 0.85);
            backdrop-filter: blur(8px);
            padding: 16px 30px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 215, 200, 0.5);
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            display: flex;
            gap: 40px;
            align-items: center;
            z-index: 90;
            pointer-events: auto;
            font-size: 15px;
            color: #4d3a3a;
        }
        #slider-panel .slider-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #slider-panel label {
            font-weight: 500;
            color: #7a5a5a;
            min-width: 20px;
        }
        #slider-panel input[type="range"] {
            width: 140px;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            background: #f3cdb6;
            border-radius: 10px;
            outline: none;
            transition: background 0.2s;
        }
        #slider-panel input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            background: #b35e5e;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid #fdf6f0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: 0.1s;
        }
        #slider-panel input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
        #slider-panel .value {
            background: #fce4d6;
            padding: 2px 14px;
            border-radius: 30px;
            font-weight: 600;
            color: #b35e5e;
            min-width: 36px;
            text-align: center;
        }

        @media (max-width: 700px) {
            #slider-panel {
                flex-direction: column;
                gap: 12px;
                padding: 14px 20px;
                border-radius: 30px;
                bottom: 80px;
                width: 80%;
                max-width: 340px;
            }
            #slider-panel .slider-item {
                width: 100%;
                justify-content: space-between;
            }
            #slider-panel input[type="range"] {
                width: 100px;
            }
            #summary-panel { bottom: 180px; right: 10px; padding: 14px 18px; font-size: 13px; max-width: 220px; }
            #info { font-size: 14px; padding: 8px 16px; }
            #replay-btn { padding: 10px 20px; font-size: 14px; }
        }
    </style>
</head>

        <h4>📐 表面积汇总</h4>
        <div class="step"><span>圆面积 S₁</span><span>π·r² = <span id="area1">28.26</span></span></div>

    </div>
