	function drawLine(x1, y1, z1, x2, y2, z2, color) {
	    // Define start and end points
	    const start = new THREE.Vector3(x1, y1, z1);
	    const end = new THREE.Vector3(x2, y2, z2);
	
	    // Create the line using a curve
	    const arr = [start, end];
	    const mat = new THREE.MeshBasicMaterial({ color: color });
	    const curve = new THREE.CatmullRomCurve3(arr);
	    const geometry = new THREE.TubeGeometry(curve, 100, 0.1, 36, false);
	    const str = new THREE.Mesh(geometry, mat);
	    
	    // Add the line to the scene
	    scene.add(str);
	    lineArray.push(str);
	
	    // Calculate the midpoint of the line
	    const midPoint = new THREE.Vector3().lerpVectors(start, end, 0.5);
	
	    // Calculate direction vector from start to end
	    const direction = new THREE.Vector3().subVectors(end, start).normalize();
	
	    // Create the tip of the arrow (a small cone)
	    const arrowTipGeometry = new THREE.ConeGeometry(0.5, 2, 32); // Small cone for arrow tip
	    const arrowTipMaterial = new THREE.MeshBasicMaterial({ color: color });
	    const arrowTip = new THREE.Mesh(arrowTipGeometry, arrowTipMaterial);
	
	    // Position the arrow tip at the midpoint
	    arrowTip.position.copy(midPoint);
	
	    // Rotate the arrow tip to point in the direction of the line
	    arrowTip.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
	
	    // Add the arrow tip to the scene
	    str.add(arrowTip);
	    lineArray.push(str);
	
	    return str;
	}
