		scene.add(pasco);

		camera.aspect = window.innerWidth / window.innerHeight;

	function createWand(x, y, z, colo) {
	    // Create the disk for the charge producer
	    const geo = new THREE.CylinderGeometry(2, 2, 0.6, 32); 
	    var wand = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({color: colo}));    
	    
	    // Rotate the disk 90 degrees around the x-axis to make it vertical
	    wand.rotation.x = Math.PI / 2;
	    
	    // Create the handle
	    const geot = new THREE.CylinderGeometry(0.3, 0.3, 15, 32); 
	    var handle = new THREE.Mesh(geot, new THREE.MeshPhongMaterial({color: "white"}));    
	    handle.rotation.x = Math.PI/2;
	    wand.add(handle);
	    handle.position.z = -9; // Keeps the handle vertical
	    
	    // Set the position of the entire wand in the scene
	    wand.position.set(x, y, z);
	    
	    // Add the wand to the scene
	    scene.add(wand);
	    return wand;
	}
