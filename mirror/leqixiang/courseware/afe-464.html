  <style>
    /* 自定义动画 */
    @keyframes nameRoll {
      0% { transform: translateY(20px); opacity: 0; }
      50% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-20px); opacity: 0; }
    }
    
    .animate-name-roll {
      animation: nameRoll 0.1s linear infinite;
    }
    
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }
    
    .animate-pop-in {
      animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    
    /* 平滑滚动 */
    html {

  <div class="container mx-auto px-4 py-8 max-w-6xl">
    <!-- 标题区域 -->
    <header class="text-center mb-12">
      <div class="flex justify-center items-center mb-4">
        <h1 class="text-[clamp(2rem,5vw,3.5rem)] font-bold text-primary text-shadow">
          <i class="fa fa-random mr-3"></i>智能随机点名系统
        </h1>
        <button 
          id="musicBtn" 
          onclick="toggleBgMusic()" 
          class="ml-6 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-full transition-all flex items-center justify-center"
          title="背景音乐开关"
        >
          <i class="fa fa-volume-off"></i>
        </button>
      </div>
      <p class="text-gray-600 text-lg max-w-2xl mx-auto">
        公平、公正、公开的随机点名工具，支持自定义名单，自动排除已点姓名。
      </p>
    </header>
    
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- 左侧：名单输入区域 -->
      <div class="lg:col-span-1 space-y-6">
        <div class="bg-white rounded-xl p-6 card-shadow transition-all duration-300 hover:shadow-lg">
          <h2 class="text-xl font-semibold mb-4 flex items-center text-primary">
            <i class="fa fa-list-ul mr-2"></i>名单管理
          </h2>
          
          <div class="space-y-4">
            <div>
              <label for="nameInput" class="block text-sm font-medium text-gray-700 mb-1">添加学生姓名</label>
              <div class="flex space-x-2">
                <input 
                  type="text" 
                  id="nameInput" 
                  class="flex-1 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all"
                  placeholder="输入姓名后按回车添加"
                >
                <button id="addNameBtn" class="bg-primary hover:bg-primary/90 text-white px-4 py-2 rounded-lg transition-all flex items-center justify-center">
                  <i class="fa fa-plus"></i>
                </button>
              </div>
              <p class="text-xs text-gray-500 mt-1">支持批量添加，姓名之间用逗号、空格或换行分隔</p>
            </div>
            
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">当前名单 (<span id="nameCount">0</span>)</label>
              <div id="nameListContainer" class="max-h-60 overflow-y-auto p-3 bg-gray-50 rounded-lg border border-gray-200">
                <div class="text-gray-400 text-center py-6">
                  <i class="fa fa-info-circle mr-1"></i> 暂无学生，请添加姓名
                </div>
              </div>
            </div>
            
            <div class="flex space-x-3">
              <button id="clearAllBtn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg transition-all flex items-center justify-center">
                <i class="fa fa-trash mr-2"></i>清空名单
              </button>
              <button id="importBtn" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-2 rounded-lg transition-all flex items-center justify-center">
                <i class="fa fa-upload mr-2"></i>导入
              </button>
            </div>
          </div>
        </div>
        
        <!-- 右侧：历史记录区域 -->
        <div class="bg-white rounded-xl p-6 card-shadow transition-all duration-300 hover:shadow-lg">
          <h2 class="text-xl font-semibold mb-4 flex items-center text-secondary">
            <i class="fa fa-history mr-2"></i>点名记录
          </h2>
          
          <div class="space-y-3">
            <div class="flex justify-between items-center">
              <span class="text-sm font-medium text-gray-700">已点名单 (<span id="historyCount">0</span>)</span>
              <button id="clearHistoryBtn" class="text-xs text-gray-500 hover:text-red-500 transition-colors">
                <i class="fa fa-trash-o mr-1"></i>清空
              </button>
            </div>
            
            <div id="historyContainer" class="max-h-60 overflow-y-auto p-3 bg-gray-50 rounded-lg border border-gray-200">
              <div class="text-gray-400 text-center py-6">
                <i class="fa fa-clock-o mr-1"></i> 暂无点名记录
              </div>
            </div>
          </div>
        </div>
      </div>
      
      <!-- 中间：点名展示区域 -->
      <div class="lg:col-span-2 space-y-6">
        <div class="bg-white rounded-xl p-8 card-shadow transition-all duration-300 hover:shadow-lg">
          <h2 class="text-xl font-semibold mb-6 flex items-center text-primary">
            <i class="fa fa-bullhorn mr-2"></i>随机点名
          </h2>
          
          <!-- 点名显示区域 -->
          <div id="displayArea" class="relative bg-gradient-to-r from-primary/5 to-secondary/5 rounded-2xl p-8 mb-8 min-h-[300px] flex items-center justify-center overflow-hidden">
            <!-- 装饰元素 -->
            <div class="absolute top-0 left-0 w-24 h-24 bg-primary/10 rounded-full -translate-x-1/2 -translate-y-1/2"></div>
            <div class="absolute bottom-0 right-0 w-32 h-32 bg-secondary/10 rounded-full translate-x-1/2 translate-y-1/2"></div>
            
            <div class="text-center z-10">
              <div id="nameDisplay" class="text-[clamp(2.5rem,8vw,5rem)] font-bold text-neutral mb-4 transition-all duration-300">
                准备开始
              </div>
              <p id="statusText" class="text-gray-500 text-lg">点击下方按钮开始随机点名</p>
            </div>
          </div>
          
          <!-- 控制按钮 -->
          <div class="flex justify-center space-x-6">
            <button 
              id="startBtn" 
              class="bg-primary hover:bg-primary/90 text-white px-8 py-3 rounded-full text-lg font-medium transition-all flex items-center shadow-lg shadow-primary/20 hover:shadow-xl hover:shadow-primary/30 disabled:opacity-50 disabled:cursor-not-allowed"
              disabled
            >
              <i class="fa fa-play mr-2"></i>开始点名
            </button>
            <button 
              id="stopBtn" 
              class="bg-secondary hover:bg-secondary/90 text-white px-8 py-3 rounded-full text-lg font-medium transition-all flex items-center shadow-lg shadow-secondary/20 hover:shadow-xl hover:shadow-secondary/30 disabled:opacity-50 disabled:cursor-not-allowed"
              disabled
            >
              <i class="fa fa-stop mr-2"></i>停止点名
            </button>
          </div>
        </div>
        
        <!-- 统计信息 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-white rounded-xl p-6 card-shadow transition-all duration-300 hover:shadow-lg text-center">
            <div class="text-3xl font-bold text-primary mb-1" id="totalCount">0</div>
            <div class="text-gray-600 text-sm">总人数</div>
          </div>
          <div class="bg-white rounded-xl p-6 card-shadow transition-all duration-300 hover:shadow-lg text-center">
            <div class="text-3xl font-bold text-secondary mb-1" id="pickedCount">0</div>
            <div class="text-gray-600 text-sm">已点人数</div>
          </div>
          <div class="bg-white rounded-xl p-6 card-shadow transition-all duration-300 hover:shadow-lg text-center">
            <div class="text-3xl font-bold text-green-500 mb-1" id="remainingCount">0</div>
            <div class="text-gray-600 text-sm">剩余人数</div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 页脚 -->
    <footer class="mt-16 text-center text-gray-500 text-sm">
      <p>© 2026 智能随机点名系统</p>
