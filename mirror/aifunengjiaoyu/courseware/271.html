<!DOCTYPE html>
<html lang="zh">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💰 小小超市 · 找零动画 (多币组合)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }
    body {
      background: linear-gradient(145deg, #f9f3e8 0%, #f0e7d6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .scene {
      max-width: 1100px;
      width: 100%;
      background: #fffbf5;
      border-radius: 60px 60px 40px 40px;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.25), inset 0 0 0 1px rgba(255, 245, 225, 0.6);
      overflow: hidden;
      backdrop-filter: blur(2px);
      transition: all 0.2s;
    }

    .market-header {
      background: #d9b382;
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #2d2a1f;
      border-bottom: 4px solid #b58b5e;
      background-image: radial-gradient(circle at 10% 30%, #e5c8a4 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .market-header h1 {
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 4px;
      text-shadow: 2px 2px 0 #e7cfb0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .market-header h1 span {
      background: #f7eedb;
      padding: 0 20px;
      border-radius: 60px;
      font-size: 1.2rem;
      box-shadow: inset 0 -4px 0 #b58b5e;
    }
    .cart-badge {
      background: #3b5e3b;
      color: #faf2e2;
      padding: 10px 22px;
      border-radius: 50px;
      font-weight: 600;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 6px 0 #1f3a1f;
    }
    .cart-badge i {
      font-size: 1.8rem;
      filter: drop-shadow(0 2px 2px rgba(0,0,0,0.2));
    }

    .shelf {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 18px;
      padding: 30px 30px 20px 30px;
      background: #fcf7ee;
    }
    .product {
      background: white;
      border-radius: 32px;
      padding: 18px 8px 14px;
      text-align: center;
      box-shadow: 0 6px 0 #dccdb6, 0 10px 18px -6px rgba(90, 70, 40, 0.15);
      transition: all 0.15s ease;
      border: 1px solid #f3e7d3;
      cursor: pointer;
      position: relative;
    }
    .product:active {
      transform: scale(0.96);
      box-shadow: 0 2px 0 #cbb99f;
    }
    .product .emoji-big {
      font-size: 3.6rem;
      display: block;
      margin-bottom: 4px;
      filter: drop-shadow(0 4px 6px rgba(0,0,0,0.08));
    }
    .product .name {
      font-weight: 600;
      font-size: 1.1rem;
      color: #2f2a1f;
      letter-spacing: 0.5px;
    }
    .product .price {
      background: #f3ede1;
      display: inline-block;
      padding: 4px 16px;
      border-radius: 40px;
      margin: 8px 0 6px;
      font-weight: 700;
      color: #1f4a2a;
      font-size: 1.2rem;
      border: 1px solid #dacfb8;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    }
    .product .price i {
      font-style: normal;
      font-size: 0.9rem;
      margin-right: 2px;
    }
    .product .add-btn {
      background: #f5d742;
      border: none;
      font-weight: 700;
      font-size: 1.1rem;
      padding: 6px 16px;
      border-radius: 50px;
      color: #1f2a0e;
      box-shadow: 0 4px 0 #c7a92e;
      transition: 0.06s linear;
      cursor: pointer;
      margin-top: 4px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid #ffea8a;
    }
    .product .add-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    .product .add-btn:disabled {
      opacity: 0.5;
      transform: translateY(4px);
      box-shadow: none;
      pointer-events: none;
    }

    .checkout-area {
      background: #efe6d6;
      padding: 18px 30px 20px;
      border-top: 3px dashed #cfbda6;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .cart-items {
      flex: 2;
      min-width: 200px;
    }
    .cart-items h3 {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.4rem;
      color: #3d3425;
      margin-bottom: 10px;
    }
    .cart-list {
      background: #fcf6ec;
      padding: 12px 16px;
      border-radius: 40px;
      min-height: 55px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px 18px;
      border: 2px solid #dccdb6;
    }
    .cart-item-tag {
      background: #d9e3cc;
      padding: 6px 18px 6px 14px;
      border-radius: 40px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: inset 0 -2px 0 #b3c2a2;
      font-size: 1rem;
    }
    .cart-item-tag .qty {
      background: #2d5930;
      color: white;
      border-radius: 30px;
      padding: 0 12px;
      font-size: 0.9rem;
      line-height: 1.6;
    }
    .empty-cart-msg {
      color: #978b78;
      font-style: italic;
      font-size: 1rem;
      letter-spacing: 1px;
    }

    /* 付款金额选择区 —— 多选组合 */
    .payment-choice {
      background: #f4eadb;
      padding: 14px 24px 18px;
      border-top: 2px solid #dccdb6;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 18px 25px;
    }
    .payment-choice .choice-label {
      font-weight: 600;
      color: #3d3425;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .payment-choice .coin-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .coin-btn {
      background: #fcf6ec;
      border: 2px solid #cbb99f;
      border-radius: 60px;
      padding: 6px 20px;
      font-weight: 700;
      font-size: 1.2rem;
      color: #1f3a1f;
      box-shadow: 0 4px 0 #b5a387;
      cursor: pointer;
      transition: 0.06s linear;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #faf0e0;
    }
    .coin-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    .coin-btn.selected {
      background: #f5d742;
      border-color: #dbb12e;
      box-shadow: 0 4px 0 #b58b2e;
    }
    .coin-btn i {
      font-style: normal;
      font-size: 1.1rem;
    }

    /* 已选金额总显示 */
    .selected-payment-summary {
      background: #fcf6ec;
      padding: 6px 22px;
      border-radius: 60px;
      border: 2px solid #dccdb6;
      font-weight: 600;
      font-size: 1.3rem;
      color: #2d3425;
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }
    .selected-payment-summary .sum-value {
      background: #2d5930;
      color: white;
      padding: 0 16px;
      border-radius: 40px;
      line-height: 1.8;
    }

    .total-panel {
      background: #2f422f;
      padding: 12px 30px 12px 24px;
      border-radius: 80px;
      display: flex;
      align-items: center;
      gap: 18px;
      color: #fcf3e2;
      box-shadow: 0 6px 0 #1e2f1e;
      flex-wrap: wrap;
      justify-content: center;
    }
    .total-panel .total-label {
      font-size: 1.2rem;
      opacity: 0.8;
    }
    .total-panel .total-amount {
      font-size: 2.2rem;
      font-weight: 800;
      background: #f7eedb;
      color: #1f3a1f;
      padding: 0 22px;
      border-radius: 60px;
      line-height: 1.4;
      box-shadow: inset 0 -3px 0 #b5a88b;
    }
    .pay-btn {
      background: #f5b642;
      border: none;
      font-weight: 800;
      font-size: 1.4rem;
      padding: 8px 28px;
      border-radius: 60px;
      color: #1f2a0e;
      box-shadow: 0 5px 0 #b58b2e;
      transition: 0.06s linear;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid #ffd966;
    }
    .pay-btn:active {
      transform: translateY(5px);
      box-shadow: none;
    }
    .pay-btn:disabled {
      opacity: 0.4;
      transform: translateY(5px);
      box-shadow: none;
      pointer-events: none;
    }
    .reset-btn {
      background: #b0a38b;
      border: none;
      font-weight: 600;
      padding: 8px 18px;
      border-radius: 60px;
      color: #2d261b;
      box-shadow: 0 4px 0 #7f735e;
      transition: 0.06s linear;
      cursor: pointer;
      font-size: 1rem;
      border: 1px solid #d6c8b2;
    }
    .reset-btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    .message-bar {
      background: #ffe9c7;
      padding: 8px 20px;
      text-align: center;
      font-weight: 600;
      color: #3f321e;
      border-top: 2px solid #dbbd96;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 1.1rem;
      transition: all 0.2s;
    }
    .message-bar i {
      font-style: normal;
      font-size: 1.3rem;
    }

    /* 找零弹窗 */
    .change-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(3px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      animation: fadeIn 0.2s ease;
    }
    .change-overlay.show {
      display: flex;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }
    .change-card {
      background: #fcf6ea;
      max-width: 460px;
      width: 90%;
      border-radius: 70px;
      padding: 30px 20px 30px;
      box-shadow: 0 30px 50px rgba(0,0,0,0.5), inset 0 0 0 2px #f5e8d2;
      text-align: center;
      position: relative;
      border: 6px solid #d9b382;
    }
    .change-card h2 {
      font-size: 2rem;
      color: #2f422f;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
    }
    .change-card .line-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 24px;
      font-size: 1.3rem;
      font-weight: 500;
      color: #2d261b;
      border-bottom: 1px dashed #dccdb6;
    }
    .change-card .line-item:last-child {
      border-bottom: none;
    }
    .change-card .line-item .label {
      opacity: 0.8;
    }
    .change-card .line-item .value {
      font-weight: 700;
      background: #f3ede1;
      padding: 0 16px;
      border-radius: 40px;
    }
    .change-card .change-give {
      background: #b1cf9a;
      margin: 16px 24px 0;
      border-radius: 60px;
      padding: 12px 0;
      font-size: 2rem;
      font-weight: 800;
      color: #1f3a1f;
      box-shadow: inset 0 -4px 0 #7f9f6b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }
    .change-card .close-change {
      margin-top: 18px;
      background: #d9b382;
      border: none;
      font-weight: 700;
      font-size: 1.2rem;
      padding: 8px 32px;
      border-radius: 60px;
      color: #1f2a0e;
      box-shadow: 0 4px 0 #b58b5e;
      cursor: pointer;
      transition: 0.06s linear;
    }
    .change-card .close-change:active {
      transform: translateY(4px);
      box-shadow: none;
    }
    @media (max-width: 680px) {
      .market-header {
        flex-direction: column;
        gap: 10px;
        text-align: center;
      }
      .checkout-area {
        flex-direction: column;
        align-items: stretch;
      }
      .total-panel {
        justify-content: center;
      }
      .shelf {
        gap: 14px;
        padding: 20px 16px;
      }
      .change-card .line-item {
        font-size: 1.1rem;
        padding: 6px 12px;
      }
      .payment-choice {
        flex-direction: column;
        gap: 12px;
      }
    }
  </style>
</head>

      <button class="reset-btn" id="resetBtn">⟳ 清空</button>

  </div>

  <!-- 付款金额选择 (多选组合) -->

    <div class="line-item">
      <span class="label">👛 实付金额</span>

    <div class="line-item">
      <span class="label">🔄 找零</span>
