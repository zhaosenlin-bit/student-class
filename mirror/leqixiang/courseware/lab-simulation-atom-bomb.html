function createUraniumNucleus(position = [0, 0, 0]) {
  const group = new THREE.Group();
  const radius = 0.8, spread = 6;
  const total = 92 + 143; // U-235: 92 protons + 143 neutrons
  for (let i = 0; i < total; i++) {
    const isProton = i < 92;
    const color = isProton ? 0xff0000 : 0xffffff;
    const phi = Math.acos(2 * Math.random() - 1);
    const theta = 2 * Math.PI * Math.random();
    const r = spread * Math.cbrt(Math.random());

    const y = r * Math.sin(phi) * Math.sin(theta);
    const z = r * Math.cos(phi);
    const sphere = createSphere(color, radius, [x, y, z]);
    group.add(sphere);
  }
  group.position.set(...position);
  scene.add(group);
  return group;
