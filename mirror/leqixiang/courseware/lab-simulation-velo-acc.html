  <div id="info" style="text-align: left"> 
    <h1 style="text-align: center">Linear Motion</h1>
    <button type="button" class="btn btn-warning" id="startButton">Start</button>
    <button class="btn btn-warning" onclick="alert(
	  'This simulation illustrates linear motion with constant and accelerated movement:\n\n' +
	  '• The object first walks at a constant speed.\n' +
	  '• It then accelerates to a higher running speed.\n' +
	  '• After reaching peak speed, it decelerates back to rest.\n' +
	  '• The simulation ends in an idle state.\n\n' +
	  'The graph on the top right dynamically shows how distance, velocity, and acceleration change over time.'
	)">
	  What is this Simulation?
     </button><br>

    Walking Distance:  
    <div style="width: 35%; display: flex; align-items: center; margin-bottom: 20px; gap: 10px;">
      <input type="range" min="2" max="8" value="3" step="0.1" id="walk" style="width: 150px;">
      <input type="text" id="walkValue" value="3" style="width: 50px;" readonly> m
    </div>

    Running Distance:
    <div style="width: 35%; display: flex; align-items: center; margin-bottom: 20px; gap: 10px;">
      <input type="range" min="10" max="40" value="30" step="0.1" id="run" style="width: 150px;">
      <input type="text" id="runValue" value="30" style="width: 50px;" readonly> m
    </div>
	
  </div>
