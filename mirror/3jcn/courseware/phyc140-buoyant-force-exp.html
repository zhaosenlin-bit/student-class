<body>
	<div id="info" style="text-align: left"> 
		<h1 style="text-align: center">Buoyant Force </h1>
		
 <!-- Left Panel -->  
	    <div class="control-panel">
		    
		<div class="control-group">	 
		  <div class="slider-row">
		    Object: <select id="objSelector">
		      <option value="0.5" selected>Wood</option>
		      <option value="0.9">Plastic</option>
		      <option value="0.24">Cork </option>
		      <option value="0.07">Foam </option>
		      <option value="3.2">Unknown</option>
		    </select>
		  </div>
		</div>
			    
		<div class="control-group">
		  Object Volume (cm³):
		  <div class="slider-row" style="display: flex; align-items: center;">
		    <input type="range" id="volSlider" min="100" max="200" step="1" value="150" style="flex: 1; margin-right: 8px;">
		    <input type="text" id="volValue" value="150" readonly style="width: 80px; text-align: center; color: blue; font-weight: bold;">
		  </div>
		  <div class="minmax" style="display: flex; justify-content: space-between; margin-top: 4px;">
		    <span>100</span>
		    <span>200</span>
		  </div>
		</div>
		    
		 <button class="btn btn-success" id="reset">Reset</button><br><br>
		    
		  <div class="control-group">
		    Buoyant Force (N):
		    <input type="text" id="bForce" value="0.0°" readonly style="width: 90px;">
		  </div>
	</div>
	<!-- Right Panel -->
	      <div class="control-panel-right">
		      
		<div class="control-group"> 
		  <div class="slider-row">
		    Liquid: <select id="liquidSelector">
		      <option value="0.800">Lamp Oil</option>
		      <option value="0.789">Ethanol</option>
		      <option value="1.000" selected>Water</option>
		      <option value="0.5">Unknown</option>
		    </select>
		  </div>
		</div>
	  			
		  <div class="control-group">
		    Liquid Volume (cm³):
		    <div class="slider-row">
		      <input type="range" id="liquidVolSlider" min="1500" max="2900" step="10" value="2500">
		      <input type="text" id="liquidVolValue" value="2500" readonly>
		    </div>
		    <div class="minmax">
		      <span>1500</span><span>3000</span>
		    </div>
		  </div>
			
		  <div class="control-group">
		    Liquid Temp (°C):
		    <div class="slider-row">
		      <input type="range" id="tempLiquidSlider" min="10" max="100" step="1" value="20">
		      <input type="text" id="tempLiquidValue" value="20" readonly>
		    </div>
		    <div class="minmax">
		      <span>10</span><span>100</span>
		    </div>
		  </div>
		<button class="btn btn-danger" onclick="
		  alert('This simulation demonstrates **buoyant force** — the upward force a fluid exerts on a submerged or floating object.\n\n' +
		        'Key Concepts:\n' +
		        '- Buoyant Force = ρ × g × V_submerged\n' +
		        '- It depends on the density of the liquid and the volume of the object that is submerged.\n\n' +
		        'This simulation also considers how different materials and temperature changes affect the object\'s volume and the fluid\'s density — both of which influence the buoyant force.\n\n' +
		        'Object Parameters:\n' +
		        '- Width = 8 cm, Depth = 4 cm (fixed)\n' +
		        '- Height = Volume / (Width × Depth), dynamically calculated\n\n' +
		        'This simulation takes into account:\n' +
		        '• Different object materials (affecting density and thermal expansion)\n' +
		        '• Various liquids, each with unique density and thermal behavior\n' +
		        '• The temperature of both the object and the liquid, which modifies volume and density\n\n' +
		        'Use the sliders to explore how these factors impact the buoyant force.'
		  );
		  alert('Material Densities Used:\n' +
		        '- Wood: ~0.50 g/cm³\n' +
		        '- Plastic: ~0.90 g/cm³\n' +
		        '- Cork: ~0.24 g/cm³\n' +
		        '- Foam: ~0.07 g/cm³\n' +
		        '- Unknown: ~3.20 g/cm³\n\n' +
		        'Liquid Densities at 20°C:\n' +
		        '- Water: 1.000 g/cm³\n' +
		        '- Ethanol: ~0.789 g/cm³\n' +
		        '- Lamp Oil: ~0.8 g/cm³\n' +
		        '- Unknown Liquid: ~0.5 g/cm³\n\n' +
		        'Formulas Used:\n' +
		        '• Buoyant Force = ρ × g × V_submerged\n' +
		        '• ρ(T) = ρ₀ × (1 − β × (T − 20))\n' +
		        '• V(T) = V₀ × (1 + 3α × (T − 20))\n\n' +
		        'Where:\n' +
		        '- β ≈ 0.0004 /°C (thermal expansion of liquids)\n' +
		        '- α ≈ 25×10⁻⁶ /°C (thermal expansion of materials)'
		  );
		">What is Buoyant Force?</button>


		
		      
	    </div>	

	</div>           
	<div id="viewport"></div>
</body>
