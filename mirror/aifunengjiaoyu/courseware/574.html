    #battlefield.round-2{background:linear-gradient(90deg,#917b4d 0 8%,transparent 8% 92%,#512823 92%),repeating-linear-gradient(0deg,#9a9a58 0 calc(20% - 2px),#c1aa68 calc(20% - 2px) 20%)}

<div class="modal teacher-modal" id="teacherModal">
  <div class="teacher-panel">
    <div class="teacher-head">
      <div><h1>西游塔防教师版 · 自定义题库</h1><small>离线保存到本机浏览器，不需要服务器；不会影响“课堂游戏版”原始文件。</small></div>
      <button class="teacher-close" id="teacherCloseBtn">关闭</button>
    </div>
    <div class="teacher-grid">
      <section class="teacher-box">
        <h2>模板与上传</h2>
        <div class="teacher-actions">
          <button class="teacher-btn" id="downloadWordTemplate">下载Word题库模板</button>
          <button class="teacher-btn" id="downloadExcelTemplate">下载Excel题库模板</button>
        </div>
        <label class="teacher-field">添加到回合
          <select id="teacherRound">
            <option value="chapter01">第1回合：1—25回</option>
            <option value="chapter02">第2回合：26—50回</option>
            <option value="chapter03">第3回合：51—75回</option>
            <option value="chapter04">第4回合：76—100回</option>
            <option value="chapter05">第5回合：全书综合</option>
          </select>
        </label>
        <label class="teacher-field">上传Word题库（.doc/.txt，按模板填写）
          <input type="file" id="wordUpload" accept=".doc,.txt,.text,.html,.htm">
        </label>
        <label class="teacher-field">上传Excel题库（.csv/.tsv，可用Excel打开模板编辑）
          <input type="file" id="excelUpload" accept=".csv,.tsv,.txt">
        </label>
        <div class="teacher-note">Word格式：每题依次填写【题目】【选项】【答案】【解析】。Excel格式：题目 | A | B | C | D | 答案 | 解析。</div>
        <div class="teacher-status" id="teacherStatus"></div>
      </section>
      <section class="teacher-box">
        <h2>编辑教师题库</h2>
        <label class="teacher-field">题目 <textarea id="teacherQuestion"></textarea></label>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <label class="teacher-field">A <input id="teacherA"></label>
          <label class="teacher-field">B <input id="teacherB"></label>
          <label class="teacher-field">C <input id="teacherC"></label>
          <label class="teacher-field">D <input id="teacherD"></label>
        </div>
        <div style="display:grid;grid-template-columns:120px 1fr;gap:8px">
          <label class="teacher-field">答案 <select id="teacherAnswer"><option>A</option><option>B</option><option>C</option><option>D</option></select></label>
          <label class="teacher-field">解析 <input id="teacherExplanation"></label>
        </div>
        <div class="teacher-actions">
          <button class="teacher-btn" id="teacherSaveQuestion">保存题目</button>
          <button class="teacher-btn secondary" id="teacherClearForm">清空表单</button>
          <button class="teacher-btn warn" id="teacherDeleteAll">清空教师题库</button>
        </div>
        <div class="teacher-table-wrap">
          <table class="teacher-table">
            <thead><tr><th>回合</th><th>题目</th><th>答案</th><th>操作</th></tr></thead>
            <tbody id="teacherQuestionList"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>
</div>
