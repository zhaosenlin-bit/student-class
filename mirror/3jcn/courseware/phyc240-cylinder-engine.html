<h1>4-Stroke Engine</h1>

  <h3>Pure Ideal Otto Cycle (P–V)</h3>

  <div class="row">

    <input id="gamma" type="range" min="1.20" max="1.45" step="0.01" value="1.40">
    <input id="gammaVal" type="text" value="1.40">
  </div>

  <div class="row">
    <label>Heat ratio (P₃/P₂)</label>
    <input id="q" type="range" min="2" max="10" step="0.1" value="6">
    <input id="qVal" type="text" value="6.0">
  </div>

    <label>P₁ (kPa)</label>
    <input id="p1" type="range" min="60" max="120" step="0.5" value="101.3">

  </div>

  <div class="row">
    <label>Cycle speed</label>
    <input id="spd" type="range" min="0.2" max="3.0" step="0.1" value="1.0">
    <input id="spdVal" type="text" value="1.0">
  </div>

  <div class="small">
    <div id="readout"></div>
   <button class="btn btn-info btn-sm"
        onclick="
          alert(`HOW TO READ THIS SIMULATION (IDEAL OTTO CYCLE)
      
      This animation links the MECHANICAL engine motion
      (piston, valves, injector, ignition)
      to the THERMODYNAMIC P–V diagram on the left.
      
      ENGINE STROKES (right animation):
      
      1) Intake stroke
         • Intake valve opens
         • Piston moves DOWN
         • Fuel–air mixture enters the cylinder (yellow spray)
      
      2) Compression stroke
         • Both valves closed
         • Piston moves UP
         • Gas is compressed (pressure rises)
      `);
      
          alert(`ENGINE STROKES (continued):
      
      3) Power (combustion) stroke
         • Spark plug ignites the mixture (orange flash)
         • Heat is added at (approximately) CONSTANT VOLUME
         • High-pressure gas pushes the piston DOWN
      
      4) Exhaust stroke
         • Exhaust valve opens
         • Piston moves UP
         • Burned gases leave the cylinder
      
      P–V DIAGRAM (left graph):
      • 1→2  Isentropic (adiabatic) compression
      • 2→3  Constant-volume heat addition (vertical line)
      • 3→4  Isentropic (adiabatic) expansion (power output)
      • 4→1  Constant-volume heat rejection (vertical line)
      
      IMPORTANT NOTES:
      • This is an IDEAL OTTO CYCLE, not a full real-engine pumping loop
      • Intake and exhaust are shown at nearly constant pressure
      • Valve timing, friction, and losses are simplified for clarity
      
      Use the START button for continuous motion
      Use the STEP button to study each stroke carefully.`);
        ">
        Information
      </button>

    <button id="resetBtn" class="btn btn-default btn-sm">Reset</button>
  </div>
