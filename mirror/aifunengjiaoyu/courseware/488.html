<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>小小收银员 · 元角分闯关</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial Black', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-weight: 900;
            background: #f9e7c2; /* 暖色底 */
            height: 100vh;
            width: 100vw;
        }

        /* ---- 全屏沉浸式画面容器 ---- */
        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            background: #fdf4e0;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            box-shadow: inset 0 0 0 4px #f7c77b;
            z-index: 1;
        }
        .screen.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }

        /* ---- 顶部标题栏 ---- */
        .header-bar {
            background: linear-gradient(145deg, #ffb347, #f58b2a);
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #fff;
            text-shadow: 2px 2px 0 #b45f1a;
            font-size: 1.4rem;
            letter-spacing: 1px;
            border-bottom: 4px solid #e07c1b;
            flex-shrink: 0;
        }
        .header-bar .title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-bar .coin-icon {
            font-size: 1.8rem;
        }
        .header-btn {
            background: #ffd966;
            border: none;
            border-radius: 40px;
            padding: 6px 18px;
            font-weight: 900;
            font-size: 1rem;
            color: #7a4a0e;
            box-shadow: 0 3px 0 #b87d2c;
            cursor: pointer;
            transition: 0.1s linear;
            font-family: inherit;
        }
        .header-btn:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        /* ---- 三栏主体 (flex) ---- */
        .main-area {
            display: flex;
            flex: 1;
            min-height: 0;
            padding: 12px 10px 10px 10px;
            gap: 12px;
            background: #f9e0b5;
        }

        /* 左栏 商品 */
        .left-panel {
            width: 24%;
            background: #fcead0;
            border-radius: 28px 8px 28px 8px;
            padding: 14px 10px;
            box-shadow: inset 0 0 0 3px #f5c78a, 0 6px 0 #dba56d;
            display: flex;
            flex-direction: column;
        }
        .left-panel h3 {
            color: #b45f1a;
            text-shadow: 1px 1px 0 #faeacb;
            font-size: 1.3rem;
            margin-bottom: 8px;
            text-align: center;
            background: #ffd68a;
            border-radius: 30px;
            padding: 6px 0;
        }
        .goods-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }
        .goods-item {
            background: #fff3dd;
            border-radius: 60px 12px 12px 60px;
            padding: 8px 14px 8px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 2px solid #f7b05e;
            box-shadow: 0 3px 0 #ca8b3d;
            cursor: pointer;
            transition: 0.08s linear;
            font-size: 1.1rem;
        }
        .goods-item:active {
            transform: translateY(3px);
            box-shadow: none;
        }
        .goods-item .price {
            background: #f58b2a;
            color: white;
            padding: 2px 14px;
            border-radius: 40px;
            font-size: 0.9rem;
            text-shadow: 1px 1px 0 #9f5e1a;
        }

        /* 中栏 收银台 */
        .center-panel {
            flex: 1;
            background: #fdf1dc;
            border-radius: 30px;
            padding: 12px 14px;
            box-shadow: inset 0 0 0 4px #f7c77b, 0 6px 0 #dba56d;
            display: flex;
            flex-direction: column;
        }
        .cashier-header {
            display: flex;
            justify-content: space-between;
            background: #ffdba5;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 1.2rem;
            color: #6b3f0c;
            margin-bottom: 8px;
            border: 2px solid #e8b053;
        }
        .cart-display {
            background: #f5e5cf;
            border-radius: 24px;
            padding: 8px 14px;
            flex: 1;
            min-height: 70px;
            border: 3px dashed #e8b86d;
            font-size: 1.1rem;
            color: #633f14;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 6px 14px;
            margin-bottom: 8px;
        }
        .cart-item-badge {
            background: #ffb85c;
            padding: 2px 14px;
            border-radius: 30px;
            color: #3f280b;
            font-size: 0.95rem;
            box-shadow: 0 2px 0 #b87d2c;
        }
        .coin-area {
            background: #fae5c1;
            border-radius: 40px;
            padding: 8px 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 6px;
            border: 3px solid #eab45a;
            justify-content: center;
        }
        .coin {
            background: radial-gradient(circle at 20% 20%, #ffe085, #f5b82e);
            border-radius: 50%;
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 900;
            color: #5f3b07;
            border: 3px solid #f5a623;
            box-shadow: 0 4px 0 #b87d2c, inset 0 -2px 0 #e09a30;
            cursor: pointer;
            transition: 0.06s linear;
            text-shadow: 1px 1px 0 #fce3a0;
        }
        .coin:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #b87d2c;
        }
        .coin-small {
            width: 50px;
            height: 50px;
            font-size: 1rem;
        }

        /* 右栏 信息面板 */
        .right-panel {
            width: 26%;
            background: #fcead0;
            border-radius: 8px 28px 8px 28px;
            padding: 14px 10px;
            box-shadow: inset 0 0 0 3px #f5c78a, 0 6px 0 #dba56d;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .info-card {
            background: #fff3e0;
            border-radius: 24px;
            padding: 12px 10px;
            border: 2px solid #f5c073;
            box-shadow: 0 3px 0 #ca8b3d;
        }
        .info-card .label {
            color: #a15f1d;
            font-size: 0.9rem;
            text-shadow: 1px 1px 0 #fceacb;
        }
        .info-card .value {
            font-size: 1.6rem;
            color: #7a4a0e;
            line-height: 1.2;
        }
        .task-box {
            background: #ffdba5;
            border-radius: 16px;
            padding: 10px 8px;
            border: 3px solid #f5b82e;
            font-size: 1rem;
            color: #3f280b;
            text-align: center;
        }
        .feedback {
            background: #b1d8a8;
            border-radius: 40px;
            padding: 8px 0;
            text-align: center;
            font-size: 1.3rem;
            color: #1f4f1a;
            border: 3px solid #6f9e5c;
        }

        /* ---- 动画 ---- */
        @keyframes pop {
            0% { transform: scale(0.7); opacity: 0.3; }
            80% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        .pop-in {
            animation: pop 0.2s ease-out;
        }
        @keyframes coinGlow {
            0% { box-shadow: 0 0 0 0 #f7d44a; }
            50% { box-shadow: 0 0 12px 4px #f7d44a; }
            100% { box-shadow: 0 0 0 0 #f7d44a; }
        }
        .coin-glow {
            animation: coinGlow 0.6s ease 2;
        }

        /* ---- 滚动条 ---- */
        .goods-list::-webkit-scrollbar { width: 6px; }
        .goods-list::-webkit-scrollbar-track { background: #f5dbb0; border-radius: 10px; }
        .goods-list::-webkit-scrollbar-thumb { background: #e7a84b; border-radius: 10px; }

        /* 响应式微调 */
        @media (max-width: 720px) {
            .left-panel, .right-panel { width: 30%; }
            .coin { width: 44px; height: 44px; font-size: 0.9rem; }
        }
    </style>
</head>

    <!-- ========== 画面2: 主游戏 ========== -->

                <div class="cashier-header">
                    <span>🧾 购物车</span>

                <div class="cart-display" id="cartDisplay"><span style="color:#a9824a;">← 点击商品加入</span></div>
                <div style="display:flex; justify-content:space-between; align-items:center; margin:4px 0 2px;">
                    <span style="font-weight:900; color:#7a4a0e;">💵 付钱</span>

            <div class="right-panel">

                <div class="feedback" id="feedbackMsg">✨ 等待操作</div>
                <button class="header-btn" style="background:#f7b731; margin-top:6px;" onclick="resetOrder()">🔄 重置</button>
            </div>
        </div>
    </div>
