<body>
	<div id="info" style="text-align: left"> 
		<h1 style="text-align: center">Estimate Absolute Zero Temp </h1>
	<div class="control-panel">
		<div class="control-group">
		Put the sphere into the bucket:
		<div style="width: 80%; position: relative; margin-bottom: 20px; margin-right: auto;">
		    <input type="range" min="10" max="20" value="10" step="1" id="sensorSlider" orient="horizontal" style="width: 100%; margin-top: 10px;">
		</div>
		
		<div class="slider-row">
		   Liquids:  <select id="waterSelector">
		      <option value="Ice">Ice</option>
		      <option value="Tap">Tap</option>
		      <option value="Warm">Warm</option>
		      <option value="Hot">Hot</option>
		      <option value="Air" selected>Air</option>
		    </select>
		</div><br> 
		<div class="control-group">
		    Temp (K):
		    <input type="text" id="temp" value="" readonly style="width: 90px;"><br>
		    P (kPa):
		    <input type="text" id="pressure" value="" readonly style="width: 90px;">
		</div>
		<button class="btn btn-success" id="start">Start</button><br><br>
		<button class="btn btn-warning" onclick="alert(
		'How to Estimate Absolute Zero Temperature:\n\n' +
		'1. Select a water temperature (Ice, Tap, Warm, or Hot) and lower the pressure sensor into the bucket.\n\n' +
		'2. For each water temperature, record the absolute pressure P measured by the sensor.\n\n' +
		'3. Note the water temperature T (in °C) and convert it to Kelvin:  T(K) = T(°C) + 273.\n\n' +
		'4. Repeat for at least 3–4 different temperatures to obtain several (P, T) data pairs.\n\n' +
		'5. Plot Temperature (T) versus Pressure (P). For a gas at constant volume, T is proportional to P.\n\n' +
		'6. Extend the best-fit line backward to where pressure would be zero.\n\n' +
		'7. The temperature where the line crosses T = 0 K is your estimate of absolute zero.'
		)">
		    How to Estimate Absolute Zero?
		</button><br><br>

        		
		</div>
	</div>
    	<canvas id="TPChart" width="500" height="270"></canvas>
	</div>
	<div id="viewport"></div>
</body>
