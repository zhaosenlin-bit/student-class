<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>⏰ 时间与钟表 · 学习模式</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #f5f9ff 0%, #e3edfa 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            max-width: 860px;
            width: 100%;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(4px);
            border-radius: 56px 56px 40px 40px;
            box-shadow: 0 20px 40px rgba(0, 20, 40, 0.25), 0 8px 20px rgba(0, 0, 0, 0.08);
            padding: 28px 24px 32px;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        h1 {
            font-weight: 500;
            font-size: 1.9rem;
            letter-spacing: 1px;
            color: #1a2b4a;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
            border-bottom: 2px solid rgba(60, 100, 180, 0.15);
            padding-bottom: 12px;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 300;
            color: #3a5a7a;
            margin-left: auto;
            background: rgba(50, 80, 140, 0.08);
            padding: 4px 16px;
            border-radius: 30px;
        }

        .clock-area {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 20px 30px;
            margin: 10px 0 20px;
        }

        .canvas-wrapper {
            background: #ffffffdd;
            backdrop-filter: blur(2px);
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1), inset 0 2px 6px rgba(255,255,255,0.7);
            padding: 6px;
            flex-shrink: 0;
        }
        #clockCanvas {
            display: block;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fafcff, #eef3fc);
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: filter 0.2s;
        }
        #clockCanvas:active {
            filter: brightness(0.96);
        }

        .time-panel {
            flex: 1;
            min-width: 200px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(2px);
            border-radius: 40px;
            padding: 20px 20px 18px;
            box-shadow: inset 0 1px 4px rgba(255,255,255,0.8), 0 6px 14px rgba(0, 20, 40, 0.08);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .digital-time {
            font-size: 2.8rem;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            letter-spacing: 4px;
            color: #0a1e33;
            background: #d9e6f5;
            padding: 6px 12px;
            border-radius: 60px;
            text-align: center;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.05);
            margin-bottom: 18px;
            font-family: 'JetBrains Mono', 'SF Mono', monospace;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 18px;
        }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #1f3d5e;
            font-weight: 500;
            letter-spacing: 0.3px;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, #b3cbe0, #3f6a9a);
            border-radius: 10px;
            -webkit-appearance: none;
            appearance: none;
            outline: none;
            transition: opacity 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 20, 40, 0.25);
            border: 2px solid #1f4970;
            cursor: pointer;
            transition: 0.1s;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.08);
            background: #f0f6ff;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 6px;
        }
        .btn {
            background: #ffffffcc;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(60, 100, 160, 0.2);
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.95rem;
            color: #1a3455;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex: 1 0 auto;
            justify-content: center;
        }
        .btn-primary {
            background: #1d3f66;
            border-color: #1d3f66;
            color: white;
            box-shadow: 0 4px 10px rgba(25, 60, 110, 0.2);
        }
        .btn-primary:hover {
            background: #234d7a;
            transform: scale(0.97);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #2b4b70;
            color: #1f3d5e;
        }
        .btn-outline:hover {
            background: #e2edfb;
        }
        .btn:active {
            transform: scale(0.94);
        }

        .learn-mode-box {
            margin-top: 18px;
            background: #eaf0fa;
            border-radius: 30px;
            padding: 12px 18px;
            border: 1px solid rgba(255,255,255,0.7);
            backdrop-filter: blur(2px);
            box-shadow: inset 0 1px 4px rgba(255,255,255,0.6);
            transition: all 0.2s;
        }
        .learn-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px 12px;
        }
        .learn-header span {
            font-weight: 500;
            color: #1a3455;
        }
        .learn-badge {
            background: #1d6b3c;
            color: white;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .learn-step {
            margin-top: 10px;
            font-size: 1rem;
            color: #0a2644;
            background: #ffffffb0;
            padding: 10px 16px;
            border-radius: 60px;
            min-height: 3.2rem;
            backdrop-filter: blur(2px);
            border: 1px solid #ffffff;
            box-shadow: inset 0 1px 6px rgba(0,0,0,0.02);
            display: flex;
            align-items: center;
            gap: 6px;
            transition: 0.1s;
        }
        .learn-step .step-icon {
            font-size: 1.4rem;
            margin-right: 6px;
        }

        .info-hint {
            margin-top: 18px;
            text-align: center;
            font-size: 0.85rem;
            color: #3c5a7a;
            background: #e2ebf6b0;
            padding: 8px 12px;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            border: 1px solid #ffffffb0;
        }
        .info-hint span {
            font-weight: 500;
        }

        footer {
            margin-top: 20px;
            text-align: center;
            font-size: 0.8rem;
            color: #5a7390;
            opacity: 0.7;
            letter-spacing: 0.5px;
        }

        @media (max-width: 550px) {
            .card { padding: 20px 16px; }
            #clockCanvas { width: 220px; height: 220px; }
            .digital-time { font-size: 2.2rem; }
        }
    </style>
</head>

<div class="card">
    <h1>
        🕰️ 时间与钟表
        <small>学习模式</small>
    </h1>

    <div class="clock-area">
        <div class="canvas-wrapper">
            <canvas id="clockCanvas" width="400" height="400"></canvas>
        </div>

        <div class="time-panel">
            <div class="digital-time" id="digitalDisplay">12:00:00</div>

            <div class="slider-group">
                <div class="slider-label">
                    <span>🕐 时针 (时)</span>
                    <span id="hourValue">12</span>
                </div>
                <input type="range" id="hourSlider" min="0" max="23" value="12" step="1">

                <div class="slider-label">
                    <span>🕐 分针 (分)</span>
                    <span id="minuteValue">0</span>
                </div>
                <input type="range" id="minuteSlider" min="0" max="59" value="0" step="1">

                <div class="slider-label">
                    <span>🕐 秒针 (秒)</span>
                    <span id="secondValue">0</span>
                </div>
                <input type="range" id="secondSlider" min="0" max="59" value="0" step="1">
            </div>

            <div class="button-row">
                <button class="btn btn-primary" id="startBtn">▶ 走时</button>
                <button class="btn btn-outline" id="resetBtn">⟲ 复位</button>
                <button class="btn btn-outline" id="syncBtn">⌛ 当前时间</button>
                <button class="btn btn-outline" id="learnBtn">📖 学习模式</button>
            </div>
        </div>
    </div>

    <!-- 学习模式区域 -->
    <div class="learn-mode-box" id="learnBox">
        <div class="learn-header">
            <span>📘 学习模式 · 秒针慢速讲解</span>
            <span class="learn-badge" id="learnBadge">⏸ 未激活</span>
        </div>
        <div class="learn-step" id="learnStepDisplay">
            <span class="step-icon">💡</span>
            <span id="learnStepText">点击「学习模式」开始慢速教学</span>
        </div>
    </div>

    <div class="info-hint">
        ⏱️ 拖动滑块调整指针 · 点击 <span>走时</span> 开始/暂停 · 学习模式让秒针放慢并显示说明
    </div>
    <footer>⏳ 认识时针、分针、秒针 · 适合小学教学投屏</footer>
</div>
