<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>海底教学 · 乌贼与墨汁</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Segoe UI', cursive, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background: #051f2e;
        }

        .ocean {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #0a4b6b 0%, #117a9e 35%, #3ba9c9 65%, #7ac8e0 85%, #b8e2f0 100%);
            overflow: hidden;
            cursor: default;
        }

        /* 光束 */
        .light-beam {
            position: absolute;
            top: 0;
            width: 60px;
            height: 100%;
            background: linear-gradient(180deg, rgba(255, 255, 230, 0.25) 0%, rgba(255, 255, 200, 0.05) 70%, transparent 100%);
            transform: skewX(-6deg);
            filter: blur(6px);
            z-index: 2;
            pointer-events: none;
            animation: beamSway 10s infinite alternate ease-in-out;
        }
        .beam1 { left: 10%; animation-duration: 12s; }
        .beam2 { left: 35%; width: 45px; animation-duration: 8s; animation-delay: 1s; }
        .beam3 { left: 60%; width: 70px; animation-duration: 14s; animation-delay: 2s; }
        .beam4 { left: 85%; width: 40px; animation-duration: 9s; animation-delay: 0.5s; }

        @keyframes beamSway {
            0% { transform: skewX(-8deg) translateX(0); opacity: 0.7; }
            100% { transform: skewX(8deg) translateX(15px); opacity: 1; }
        }

        /* 沙质海底 */
        .seabed {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 18%;
            background: radial-gradient(ellipse at 30% 100%, #dbb88a 0%, #c8a67a 40%, #b89464 100%);
            border-radius: 60% 30% 0 0 / 40px 20px 0 0;
            z-index: 5;
            box-shadow: inset 0 20px 30px rgba(0, 0, 0, 0.15);
        }
        .seabed::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 0;
            width: 100%;
            height: 30px;
            background: radial-gradient(ellipse at 20% 0%, #e8cc9e 0%, transparent 70%);
            opacity: 0.4;
        }
        .sand-dot {
            position: absolute;
            background: #b48c5c;
            border-radius: 50%;
            opacity: 0.2;
            z-index: 6;
            pointer-events: none;
        }

        /* 海藻 */
        .seaweed {
            position: absolute;
            bottom: 14%;
            z-index: 7;
            pointer-events: none;
        }
        .seaweed svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .seaweed1 { left: 5%; height: 140px; width: 40px; }
        .seaweed2 { left: 18%; height: 180px; width: 50px; bottom: 13%; }
        .seaweed3 { left: 40%; height: 110px; width: 35px; bottom: 15%; }
        .seaweed4 { right: 12%; height: 160px; width: 45px; bottom: 14%; }
        .seaweed5 { right: 28%; height: 130px; width: 38px; bottom: 15%; }

        /* 矿产资源（立方体风格） */
        .mineral {
            position: absolute;
            z-index: 8;
            pointer-events: none;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }
        .mineral-coal {
            width: 48px;
            height: 48px;
            background: #2d2d2d;
            border-radius: 8px;
            box-shadow: inset -4px -4px 0 #1a1a1a, inset 4px 4px 0 #4a4a4a;
            transform: rotate(8deg);
        }
        .mineral-coal::after {
            content: '煤';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,240,0.3);
            font-size: 18px;
            font-weight: bold;
        }
        .mineral-oil {
            width: 64px;
            height: 40px;
            background: #1f2b2e;
            border-radius: 40% 40% 20% 20%;
            box-shadow: inset -4px -4px 0 #0e1a1c, inset 4px 4px 0 #3a4a4e;
            transform: rotate(-4deg);
        }
        .mineral-oil::after {
            content: '石油';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,220,150,0.25);
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* 动物容器 */
        .creature {
            position: absolute;
            z-index: 10;
            transition: transform 0.1s linear;
            pointer-events: auto;
            cursor: pointer;
        }

        /* 海参（黑色长条，慢吞吞） */
        .sea-cucumber {
            width: 80px;
            height: 22px;
            background: #2a2a2a;
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            box-shadow: inset 0 -4px 0 #111, 0 4px 8px rgba(0,0,0,0.2);
            transform: rotate(2deg);
        }
        .sea-cucumber::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 6px;
            width: 12px;
            height: 6px;
            background: #3a3a3a;
            border-radius: 40%;
            opacity: 0.5;
        }
        .sea-cucumber::after {
            content: '🐚';
            position: absolute;
            font-size: 16px;
            top: -10px;
            right: -6px;
            transform: rotate(20deg);
        }

        /* 梭子鱼（银色流线型） */
        .barracuda {
            width: 90px;
            height: 24px;
            background: linear-gradient(135deg, #d0d8e0 0%, #b0bcc8 50%, #8a9aaa 100%);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transform: rotate(-8deg);
        }
        .barracuda::before {
            content: '';
            position: absolute;
            top: 4px;
            left: 10px;
            width: 30px;
            height: 8px;
            background: #e8f0f8;
            border-radius: 40%;
            opacity: 0.5;
        }
        .barracuda::after {
            content: '🐟';
            position: absolute;
            font-size: 22px;
            top: -8px;
            left: -6px;
            transform: rotate(-10deg);
        }

        /* 乌贼 + 喷墨效果（小黑色颗粒） */
        .squid {
            width: 56px;
            height: 40px;
            background: #e07a8f;
            border-radius: 50% 50% 40% 40% / 60% 60% 40% 40%;
            box-shadow: inset 0 -6px 0 #b85a6e, 0 4px 12px rgba(0,0,0,0.15);
            transform: rotate(5deg);
            transition: transform 0.1s;
        }
        .squid::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 10px;
            width: 18px;
            height: 14px;
            background: #f0b0c0;
            border-radius: 50%;
            opacity: 0.6;
        }
        .squid::after {
            content: '🦑';
            position: absolute;
            font-size: 28px;
            top: -14px;
            right: -10px;
            transform: rotate(15deg);
        }
        .squid.clicked {
            transform: rotate(5deg) scale(0.92);
        }

        .ink-particle {
            position: absolute;
            background: #1a1a2e;
            border-radius: 50%;
            opacity: 0.7;
            pointer-events: none;
            z-index: 15;
            animation: inkFloat 2.8s ease-out forwards;
        }
        @keyframes inkFloat {
            0% { transform: scale(1) translateY(0); opacity: 0.9; }
            100% { transform: scale(0.2) translateY(-70px) translateX(25px); opacity: 0; }
        }

        /* 标题指示 */
        .scene-title {
            position: absolute;
            top: 3%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 50, 70, 0.55);
            backdrop-filter: blur(6px);
            padding: 8px 28px;
            border-radius: 60px;
            font-size: 1.8rem;
            font-weight: 600;
            color: #ecf9f0;
            box-shadow: 0 6px 20px rgba(0, 20, 30, 0.3);
            border: 1px solid rgba(180, 230, 240, 0.25);
            z-index: 30;
            letter-spacing: 2px;
            text-shadow: 0 2px 6px rgba(0,0,0,0.2);
            pointer-events: none;
            white-space: nowrap;
        }

        .legend {
            position: absolute;
            bottom: 3%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            background: rgba(8, 40, 55, 0.6);
            backdrop-filter: blur(6px);
            padding: 10px 24px;
            border-radius: 60px;
            border: 1px solid rgba(180, 220, 230, 0.2);
            z-index: 30;
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: none;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #d5eae8;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 4px;
        }

        /* 宝箱区域 */
        .chest-area {
            position: absolute;
            z-index: 20;
            bottom: 15%;
            left: 55%;
            cursor: pointer;
            transition: transform 0.2s ease;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.3));
            pointer-events: auto;
        }
        .chest-area:hover {
            transform: scale(1.08);
        }
        .chest-area:active {
            transform: scale(0.95);
        }

        .chest-body {
            width: 70px;
            height: 50px;
            background: #a67c4a;
            border-radius: 0 0 14px 14px;
            box-shadow: inset 0 -6px 0 #7a5a32, inset 0 6px 0 #c99f6b;
            position: relative;
            border: 2px solid #5a3e22;
        }
        .chest-lid {
            width: 74px;
            height: 28px;
            background: #b88a4e;
            border-radius: 14px 14px 0 0;
            box-shadow: inset 0 4px 0 #d4a96c, 0 -2px 0 #5a3e22;
            border: 2px solid #5a3e22;
            border-bottom: none;
            margin-left: -2px;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform-origin: bottom center;
            position: relative;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #f0d8a0;
        }
        .chest-lid span {
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        .chest-lid.open {
            transform: rotateX(70deg) translateY(-10px);
        }
        .chest-lock {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 18px;
            height: 18px;
            background: #d4b06a;
            border-radius: 50%;
            border: 2px solid #5a3e22;
            box-shadow: inset 0 -2px 0 #8a6a3a;
            z-index: 3;
        }
        .chest-glow {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 90px;
            height: 80px;
            background: radial-gradient(circle, rgba(255,215,0,0.25) 0%, transparent 70%);
            pointer-events: none;
            animation: glowPulse 2s infinite alternate;
        }
        @keyframes glowPulse {
            0% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 0.7; transform: scale(1.1); }
        }

        /* 知识卡片 (通用) */
        .knowledge-card {
            position: absolute;
            bottom: 32%;
            left: 50%;
            transform: translateX(-50%) scale(0);
            background: rgba(12, 40, 60, 0.92);
            backdrop-filter: blur(12px);
            border: 2px solid #f0d060;
            border-radius: 28px;
            padding: 22px 30px;
            max-width: 360px;
            width: 80%;
            color: #ecf5f0;
            font-size: 1rem;
            line-height: 1.6;
            z-index: 40;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
            opacity: 0;
            pointer-events: none;
            text-align: center;
        }
        .knowledge-card.show {
            transform: translateX(-50%) scale(1);
            opacity: 1;
            pointer-events: auto;
        }
        .knowledge-card h3 {
            color: #ffd966;
            font-size: 1.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .knowledge-card p {
            margin: 8px 0;
            color: #d0e8e8;
        }
        .knowledge-card .mineral-icon {
            display: inline-block;
            margin: 0 6px;
        }
        .knowledge-card .close-btn {
            margin-top: 16px;
            background: #e07a5a;
            border: none;
            padding: 6px 24px;
            border-radius: 40px;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            pointer-events: auto;
        }
        .knowledge-card .close-btn:hover {
            background: #c96a4a;
        }

        /* 乌贼知识卡特殊样式 */
        .squid-card {
            border-color: #e07a8f;
            background: rgba(30, 20, 40, 0.93);
        }
        .squid-card h3 {
            color: #f7b0c8;
        }

        @media (max-width: 700px) {
            .scene-title { font-size: 1.2rem; padding: 6px 18px; white-space: normal; max-width: 90%; }
            .legend { padding: 8px 14px; gap: 10px; bottom: 2%; }
            .legend-item { font-size: 0.7rem; }
            .chest-body { width: 56px; height: 40px; }
            .chest-lid { width: 60px; height: 22px; font-size: 16px; }
            .chest-lock { width: 14px; height: 14px; }
            .chest-glow { width: 70px; height: 60px; }
            .knowledge-card { padding: 16px 20px; max-width: 280px; font-size: 0.9rem; bottom: 28%; }
            .knowledge-card h3 { font-size: 1.2rem; }
            .seaweed1 { height: 100px; width: 30px; }
            .seaweed2 { height: 130px; width: 38px; }
            .seaweed3 { height: 80px; width: 28px; }
            .seaweed4 { height: 120px; width: 35px; }
            .seaweed5 { height: 90px; width: 30px; }
            .sea-cucumber { width: 60px; height: 18px; }
            .barracuda { width: 70px; height: 20px; }
            .squid { width: 44px; height: 32px; }
            .mineral-coal { width: 36px; height: 36px; }
            .mineral-oil { width: 48px; height: 30px; }
        }
    </style>
</head>

<div class="ocean" id="ocean">
    <!-- 光束 -->
    <div class="light-beam beam1"></div>
    <div class="light-beam beam2"></div>
    <div class="light-beam beam3"></div>
    <div class="light-beam beam4"></div>

    <!-- 海底 -->
    <div class="seabed" id="seabed"></div>

    <!-- 沙粒装饰 -->
    <div class="sand-dot" style="width:8px;height:6px;bottom:12%;left:8%;"></div>
    <div class="sand-dot" style="width:12px;height:8px;bottom:10%;left:25%;"></div>
    <div class="sand-dot" style="width:6px;height:6px;bottom:14%;left:50%;"></div>
    <div class="sand-dot" style="width:10px;height:7px;bottom:9%;left:70%;"></div>
    <div class="sand-dot" style="width:14px;height:10px;bottom:13%;left:88%;"></div>

    <!-- 海藻 -->
    <div class="seaweed seaweed1">
        <svg viewBox="0 0 40 140" preserveAspectRatio="xMidYMax meet">

        <svg viewBox="0 0 50 180" preserveAspectRatio="xMidYMax meet">

            <path d="M 25 10 Q 15 50 25 90 Q 38 130 20 170" stroke="#4caf50" stroke-width="2.5" fill="none" opacity="0.3"/>
        </svg>
    </div>
    <div class="seaweed seaweed3">
        <svg viewBox="0 0 35 110" preserveAspectRatio="xMidYMax meet">
            <path d="M 17 0 Q 6 25 14 50 Q 24 75 10 100 Q 5 110 17 110 Q 29 110 24 100 Q 10 75 20 50 Q 28 25 17 0 Z" fill="#e8b86d" opacity="0.9"/>
            <path d="M 17 8 Q 10 30 17 55 Q 25 80 13 105" stroke="#d49a4a" stroke-width="2" fill="none" opacity="0.5"/>
        </svg>

        <svg viewBox="0 0 45 160" preserveAspectRatio="xMidYMax meet">

            <path d="M 22 12 Q 12 45 22 80 Q 34 115 16 150" stroke="#81c784" stroke-width="2" fill="none" opacity="0.4"/>
        </svg>

        <svg viewBox="0 0 38 130" preserveAspectRatio="xMidYMax meet">

            <path d="M 19 8 Q 10 32 18 58 Q 27 86 13 118" stroke="#e07a5a" stroke-width="2" fill="none" opacity="0.4"/>

    <!-- 矿产资源 -->
    <div class="mineral" style="bottom: 16%; left: 6%;">
        <div class="mineral-coal"></div>

    <div class="mineral" style="bottom: 14%; left: 14%;">
        <div class="mineral-oil"></div>
    </div>
    <div class="mineral" style="bottom: 17%; right: 8%;">
        <div class="mineral-coal" style="background:#3a3a3a;"></div>
    </div>
    <div class="mineral" style="bottom: 13%; right: 20%;">
        <div class="mineral-oil" style="background:#1f2b2e;"></div>
    </div>

    <!-- 动物 -->
    <div class="creature" id="cucumber" style="bottom: 16%; left: 30%;">
        <div class="sea-cucumber" id="cucumberBody"></div>
    </div>
    <div class="creature" id="barracuda" style="bottom: 40%; left: 50%;">
        <div class="barracuda" id="barracudaBody"></div>
    </div>
    <!-- 乌贼：增加点击事件 -->
    <div class="creature" id="squid" style="bottom: 28%; left: 70%;">
        <div class="squid" id="squidBody"></div>
    </div>

    <!-- 宝箱 -->
    <div class="chest-area" id="chestArea">
        <div class="chest-glow"></div>
        <div class="chest-lid" id="chestLid"><span>🔒</span></div>
        <div class="chest-body">
            <div class="chest-lock"></div>
        </div>
    </div>

    <!-- 乌贼知识卡片 (独立) -->
    <div class="knowledge-card squid-card" id="squidCard">
        <h3>🦑 乌贼小秘密</h3>
        <p>乌贼不是鱼，而是一种<strong>头足类</strong>软体动物，和章鱼是亲戚！</p>
        <p>它们遇到危险时会喷出墨汁来迷惑敌人，墨汁里含有黑色素，能瞬间形成“烟幕”。</p>
        <p>乌贼的血液是<strong>蓝色</strong>的，因为含有血蓝蛋白（铜元素）。</p>
        <p style="margin-top:8px; color:#b8d8e8;">科学家还发现乌贼的墨汁有抗菌作用呢！</p>
        <button class="close-btn" id="closeSquidCard">真有趣 👍</button>
    </div>

    <!-- 矿产知识卡片 (宝箱) -->
    <div class="knowledge-card" id="knowledgeCard">
        <h3>🗺️ 海底矿产</h3>
        <p><span class="mineral-icon">⚫</span> <strong>煤矿</strong> —— 形成于远古森林，是重要的能源，燃烧发电。</p>
        <p><span class="mineral-icon">🟤</span> <strong>石油</strong> —— 古生物遗骸经过高温高压形成，可提炼汽油、塑料。</p>
        <p style="margin-top:8px; color:#b8d8e8;">海底还藏着天然气、锰结核等资源，但开采时要注意保护海洋环境哦！</p>
