	function addPulley(){
	    const pulley_geo = new THREE.CylinderGeometry(3, 3, 1, 32);
	    const pulley_mat = new THREE.MeshLambertMaterial({ map: loader.load('../pictures/road.jpg') });
	    pulley = new THREE.Mesh(pulley_geo, pulley_mat);
	    pulley.position.set(-5, -8, -1);
	    pulley.rotateZ(Math.PI / 2);
	    scene.add(pulley);
	}
	function addHanger(){
	    const hanger_geo = new THREE.BoxGeometry(3, 5, 3);
	    const hanger_mat = new THREE.MeshLambertMaterial({ color: 0xffff00 });
	    hanger = new THREE.Mesh(hanger_geo, hanger_mat);
	    hanger.position.set(-5, -37, -4);
	    hanger.castShadow = true;
	    scene.add(hanger);
	}
	function addBox(){
		const geometry = new THREE.BoxGeometry( 6, 6, 7 ); 
		const material = new THREE.MeshLambertMaterial({ color: 0xffff00 });
		box = new THREE.Mesh( geometry, material ); 
		box.position.set(-5, -21.7, 30);
		box.rotation.x = Math.PI/6;
		scene.add( box );
	}
	function addIncline() {
	    var A = new THREE.Vector2(0, -20);        // Vertex A at the origin (0, -20)
	    var B = new THREE.Vector2(60, -20);       // Vertex B (60 units along z-axis)
	    var C = new THREE.Vector2(0, 10);         // Vertex C (30 units height, shifted to maintain y-offset)
	
	    var thickness = 10;  // Thickness of the prism along the x-axis (extrusion thickness)
	
	    var geometry = new PrismGeometry([A, B, C], thickness);
	
	    var material = new THREE.MeshPhongMaterial({
	        color: 0x00b2fc, 
	        specular: 0x00ffff, 
	        shininess: 20 
	    });
	
	    var prism1 = new THREE.Mesh(geometry, material);
	    prism1.position.set(0, -20, 0); 
	    prism1.rotation.y = -Math.PI/2; 
	
	    scene.add(prism1);
	}
	function PrismGeometry(vertices, thickness) {
	    var shape = new THREE.Shape(); 
	
	    shape.moveTo(vertices[0].x, vertices[0].y);
	    for (var i = 1; i < vertices.length; i++) {
	        shape.lineTo(vertices[i].x, vertices[i].y);
	    }
	    shape.lineTo(vertices[0].x, vertices[0].y); 
	
	    var extrudeSettings = {
	        depth: thickness, 
	        bevelEnabled: false 
	    };
	
	    var geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
	
	    return geometry;
	}
	function calculateAcceleration() {
	    const alpha = Math.PI*30/180 ;
	    var weight_parallel = mass1 * g * Math.sin(alpha); // parallel to incline
	    var friction = mu_k * mass1 * g * Math.cos(alpha); // friction force
	    var net_force = weight_parallel - mass2 * g - friction; // net force on the system
	    accel = net_force / (mass1 + mass2); // acceleration of the system
	}
	
	function updatePosition(time) {
	    if (is_start && !isPaused) {
	        var displacement = 0.05 * accel * time * time; // scale down 10 times to slow down the movement
	        // Check if the total displacement is less than 20 units
	        if (Math.abs(totalDisplacement + displacement) <= 20) {
	            // Update the total displacement
	            totalDisplacement += displacement;
	            // Update the box position (sliding down the incline)
	            var deltaZ = displacement * Math.cos(theta);
	            var deltaY = displacement * Math.sin(theta);
		    box.position.x = -5;
	            box.position.z += deltaZ; 
	            box.position.y -= deltaY;
	            
	            // Update the hanger position (moving up)
	            hanger.position.y += displacement;
	            
	            // Optionally update string positions if needed
		    cleanUpStrings();
	            addString( -5, hanger.position.y, -4, -5, -8, -4); 
	            addString( -5, box.position.y, box.position.z, -5, -5, 0);
	        } else {
	            // Stop the movement when the total displacement reaches or exceeds 20 units
	            is_start = false;
	        }
	    }
	}
		
        function cleanUpStrings() {
	    // Iterate through the stringArray and remove each string from the scene
	    for (var i = 0; i < stringArray.length; i++) {
	        scene.remove(stringArray[i]);
	    }
	    
	    // Clear the array
	    stringArray = [];
	}

	function updateString(line, x1, y1, z1, x2, y2, z2) {
	    line.geometry.vertices[0].set(x1, y1, z1);
	    line.geometry.vertices[1].set(x2, y2, z2);
	    line.geometry.verticesNeedUpdate = true;
	}
	
	function addString(x1, y1, z1, x2, y2, z2) {
	    var arr = [new THREE.Vector3(x1, y1, z1), new THREE.Vector3(x2, y2, z2)];
	    var mat = new THREE.MeshLambertMaterial({ color: 'white' });
	    var curve = new THREE.CatmullRomCurve3(arr);
	    var geometry = new THREE.TubeGeometry(curve, 100, 0.2, 36, false);
	    var str = new THREE.Mesh(geometry, mat);
	    scene.add(str);
	    stringArray.push(str);
	    return str;
	}
	
	function togglePause() {
	    isPaused = !isPaused;
	    document.getElementById("pause").innerText = isPaused ? "Resume" : "Pause";
	}
	
	function onWindowResize() {
	    camera.aspect = window.innerWidth / window.innerHeight;
	    camera.updateProjectionMatrix();
	    renderer.setSize(window.innerWidth, window.innerHeight);
	}
	
	function animate() {
	    var currenttime = performance.now() * 0.001;
	    var time = Math.abs(lasttime - currenttime); 
	    if (is_start && !isPaused) {
	        updatePosition(time);
	    }
	    requestAnimationFrame(animate);
	    controls.update();
	    renderer.render(scene, camera);
	};
