	<script>
ProgramFont = "Georgia";

FluidDensity = new Array (1000, 737, 1330, 825, 789, 1230, 1259);
FluidName = new Array ("Fresh Water", "Gasoline", "Maple Syrup", "Crude Oil", "Ethanol", "Brine", "Glycerin");
FluidColor = new Array ("#66FFFF", "#EDCC47", "#996633", "#333300", "#fff6ef", "#85bfff", "#e6dfd8");
FluidOpacity = new Array(0.6, 0.6, 0.87, 0.93, 0.4, 0.6, 0.4);


function initialize(){
	
/* Initial Conditions */	
	TopGrid = 25;
	RightGrid = 700;
	LeftGrid = 200;
	BottomGrid = 450;
	
	GridHeight = BottomGrid - TopGrid;
	GridWidth = RightGrid - LeftGrid;
	
	radius1 = 15;
	radius2 = 25;
	TopTube = TopGrid;
	LeftTube = LeftGrid+radius1;
	RightTube = RightGrid-radius2;
	BottomTube = BottomGrid;
	TubeCurve = 15;
	MidTube = (RightGrid + LeftGrid)/2;
	depthcurvefactor = 0.2;
	
	
	FluidLevel1 = 300;
	FluidLevel2 = 300;
	fluidnumber1 = 2;
	fluidnumber2 = 0;
	YPin = 435;
	PinSpeed = 50/50;
	PullPin = "no";
	FactorsChangeable = "yes";
	Broke = "no";
	
	ScaleFactor = (BottomGrid - TopGrid)/500;
	
	document.getElementById("MessageToUser").innerHTML = "Adjust the parameters of this system and pull the pin and observe the motion of the piston that separates the two fluids.";

	
//  Sets up the canvas for live action.
	
	theCanvas = document.getElementById("CanvasOne");
	ctx = theCanvas.getContext("2d");
	
	CalculateParameters();
}



/* Called by the Begin Button */

function LoadIt(){
	document.getElementById("LabSection").style.visibility = "visible";
	document.getElementById("OverviewSection").style.visibility = "hidden";
	StartItMoving = setInterval(drawingpart, 50);
}

function CalculateParameters(){
	radiusratio = radius2/radius1;
	radiusrationsq = Math.pow(radiusratio, 2.0);
	densityratio = FluidDensity[fluidnumber2]/FluidDensity[fluidnumber1];
	FluidLevelFinal2 = (FluidLevel1+radiusrationsq*FluidLevel2)/(densityratio+radiusrationsq);
	FluidLevelFinal1 = densityratio*FluidLevelFinal2;
	SpeedForFluid1 = (FluidLevelFinal1 - FluidLevel1)/50;
	SpeedForFluid2 = (FluidLevelFinal2 - FluidLevel2)/50;
	ratiototube = radius1/TubeCurve;
	tuberadiusrationsq = Math.pow(ratiototube, 2.0);
	PistonSpeed = tuberadiusrationsq*SpeedForFluid1;
	PistonMotion = PistonSpeed*50;
	LeftTube = LeftGrid+radius1;
	RightTube = RightGrid-radius2;
	if (FluidLevelFinal2 > 500 || FluidLevelFinal1 > 500){
		FluidLevel1 = 300;
		FluidLevel2 = 300;
		document.getElementById("MessageToUser").innerHTML = "Your system has been reset because your choice of parameters would have lead to overflow conditions.";
	}
	else{
		document.getElementById("MessageToUser").innerHTML = "Adjust the parameters of this system and pull the pin and observe the motion of the piston that separates the two fluids.";
	}
	
}

function drawingpart(){
	
	ctx.fillStyle = "#ffffff";
	ctx.fillRect(0,0,900,600);
	
	DrawAxes();
	
	DrawTubeBack();
	DrawFluid1();
	DrawFluid2();
	if (PullPin == "yes"){
		YPin = YPin - PinSpeed;
		
		if (Broke == "no"){
			FluidLevel1 = FluidLevel1 + SpeedForFluid1;
			FluidLevel2 = FluidLevel2 + SpeedForFluid2;
			MidTube = MidTube - PistonSpeed;
		}
		
		if (YPin < 385){
			PullPin = "no";
			document.getElementById("ResetPinButton").style.visibility = "visible";
			document.getElementById("MessageToUser").innerHTML = "Click on the pin to reset to non-equilibrium conditions.";
			FluidLevel1 = FluidLevelFinal1;
			FluidLevel2 = FluidLevelFinal2;
		}
		
		if (MidTube < (LeftTube+radius1) || MidTube > (RightTube-radius2)){
			Broke = "yes";
			PullPin = "no";
			if (MidTube < (LeftTube+radius1)){
				MidTube = (LeftTube+radius1);
			}
			if (MidTube > (RightTube-radius2)){
				MidTube = (RightTube-radius2);
			}
			document.getElementById("ResetPinButton").style.visibility = "visible";
			document.getElementById("MessageToUser").innerHTML = "Your differences were too drastic and your system has broken.  Reset, change your parameters and try again.";
		}
			
	}
	DrawPin(450,YPin,40, 40);
	DrawPiston();
	
	DrawTubeFront();
	
	FluidOneControlArea(4,304,150,292);
	FluidTwoControlArea(746,304,150,292);
	
	TubeOneControlArea(4,4,150,292);
	TubeTwoControlArea(746,4,150,292);
	
	//WriteText(450,500,SpeedForFluid1,12,"#000000",0.5,ProgramFont);
}

function DrawPin(x,y,w,h){
	ctx.lineWidth = 2;
	ctx.strokeStyle = "#000000";
	ctx.fillStyle = FluidColor[fluidnumber1];
	ctx.beginPath();
	ctx.moveTo(x,y);
	ctx.lineTo(x,y-h);
	ctx.moveTo(x-0.5*w, y-h);
	ctx.lineTo(x+0.5*w, y-h);
	ctx.stroke();
	
}

function TubeOneControlArea(x,y,w,h){
	DrawRectangle(x, y, w, h, 3, "#990000", "#CCCCCC", 2);
	WriteText(x+0.5*w,y+0.1*h,"Tube 1 Radius",22,"#990000",0.5);
	WriteText(x+0.5*w,y+0.3*h,radius1 + " mm",26,"#990000",0.5);
	if (FactorsChangeable == "yes"){
		DrawArrow(x+0.5*w, y+0.45*h, 0.2*h, 0.1*h, "#990000", 1.0*Math.PI);
		DrawArrow(x+0.5*w, y+0.70*h, 0.2*h, 0.1*h, "#990000", 0.0*Math.PI);
	}
	
}

function TubeTwoControlArea(x,y,w,h){
	DrawRectangle(x, y, w, h, 3, "#990000", "#CCCCCC", 2);
	WriteText(x+0.5*w,y+0.1*h,"Tube 2 Radius",22,"#990000",0.5);
	WriteText(x+0.5*w,y+0.3*h,radius2 + " mm",26,"#990000",0.5);
	if (FactorsChangeable == "yes"){
		DrawArrow(x+0.5*w, y+0.45*h, 0.2*h, 0.1*h, "#990000", 1.0*Math.PI);
		DrawArrow(x+0.5*w, y+0.70*h, 0.2*h, 0.1*h, "#990000", 0.0*Math.PI);
	}
}


function FluidOneControlArea(x,y,w,h){
	DrawRectangle(x, y, w, h, 3, "#990000", "#CCCCCC", 2);
	WriteText(x+0.5*w,y+0.1*h,"Fluid 1",32,"#990000",0.5);
	WriteText(x+0.5*w,y+0.3*h,FluidName[fluidnumber1],26,"#990000",0.5);
	if (FactorsChangeable == "yes"){
		DrawArrow(x+0.5*w, y+0.45*h, 0.2*h, 0.1*h, "#990000", 1.0*Math.PI);
		DrawArrow(x+0.5*w, y+0.70*h, 0.2*h, 0.1*h, "#990000", 0.0*Math.PI);
	}
}

function FluidTwoControlArea(x,y,w,h){
	DrawRectangle(x, y, w, h, 3, "#990000", "#CCCCCC", 2);
	WriteText(x+0.5*w,y+0.1*h,"Fluid 2",32,"#990000",0.5);
	WriteText(x+0.5*w,y+0.3*h,FluidName[fluidnumber2],26,"#990000",0.5);
	if (FactorsChangeable == "yes"){
		DrawArrow(x+0.5*w, y+0.45*h, 0.2*h, 0.1*h, "#990000", 1.0*Math.PI);
		DrawArrow(x+0.5*w, y+0.70*h, 0.2*h, 0.1*h, "#990000", 0.0*Math.PI);
	}
}

function DrawPiston(){
	DrawRectangle(MidTube-5, BottomTube-TubeCurve, 10, 2*TubeCurve, 3, "#000000", "#CCCCCC", 2);
}

function DrawFluid1(){
	ctx.lineWidth = 2;
	ctx.strokeStyle = "#000000";
	ctx.fillStyle = FluidColor[fluidnumber1];
	ctx.beginPath();
	ctx.moveTo(LeftTube+radius1, BottomTube-FluidLevel1*ScaleFactor);
	ctx.bezierCurveTo(LeftTube+radius1, BottomTube-FluidLevel1*ScaleFactor+depthcurvefactor*radius1, LeftTube-radius1, BottomTube-FluidLevel1*ScaleFactor+depthcurvefactor*radius1, LeftTube-radius1, BottomTube-FluidLevel1*ScaleFactor);
	ctx.lineTo(LeftTube-radius1, BottomTube);
	ctx.quadraticCurveTo(LeftTube-radius1, BottomTube+TubeCurve, LeftTube-radius1+TubeCurve, BottomTube+TubeCurve);
	ctx.lineTo(MidTube, BottomTube+TubeCurve);
	ctx.lineTo(MidTube, BottomTube-TubeCurve);
	ctx.lineTo(LeftTube+radius1+0.5*TubeCurve, BottomTube-TubeCurve);
	ctx.quadraticCurveTo(LeftTube+radius1, BottomTube-TubeCurve, LeftTube+radius1, BottomTube-1.5*TubeCurve);
	ctx.lineTo(LeftTube+radius1, BottomTube-FluidLevel1*ScaleFactor);
	ctx.stroke();
	ctx.globalAlpha = 0.3;
	ctx.fill();
	ctx.globalAlpha = 1.0;
	
	ctx.beginPath();
	ctx.moveTo(LeftTube+radius1, BottomTube-FluidLevel1*ScaleFactor);
	ctx.bezierCurveTo(LeftTube+radius1, BottomTube-FluidLevel1*ScaleFactor-depthcurvefactor*radius1, LeftTube-radius1, BottomTube-FluidLevel1*ScaleFactor-depthcurvefactor*radius1, LeftTube-radius1, BottomTube-FluidLevel1*ScaleFactor);
	ctx.bezierCurveTo(LeftTube-radius1, BottomTube-FluidLevel1*ScaleFactor+depthcurvefactor*radius1, LeftTube+radius1, BottomTube-FluidLevel1*ScaleFactor+depthcurvefactor*radius1, LeftTube+radius1, BottomTube-FluidLevel1*ScaleFactor);
	ctx.stroke();
	ctx.globalAlpha = 0.7;
	ctx.fill();
	ctx.globalAlpha = 1.0;
	
	ctx.lineWidth = 1;
	ctx.strokeStyle = "#990000";
	ctx.beginPath();
	ctx.moveTo(LeftTube+radius1, BottomTube-FluidLevel1*ScaleFactor);
	ctx.lineTo(LeftTube+radius1+10, BottomTube-FluidLevel1*ScaleFactor);
	ctx.stroke();
}

function DrawFluid2(){
	ctx.lineWidth = 2;
	ctx.strokeStyle = "#000000";
	ctx.fillStyle = FluidColor[fluidnumber2];
	ctx.beginPath();
	ctx.moveTo(MidTube, BottomTube-TubeCurve);
	ctx.lineTo(MidTube, BottomTube+TubeCurve);
	ctx.lineTo(RightTube+radius2-TubeCurve, BottomTube+TubeCurve);
	ctx.quadraticCurveTo(RightTube+radius2, BottomTube+TubeCurve, RightTube+radius2, BottomTube);
	ctx.lineTo(RightTube+radius2, BottomTube-FluidLevel2*ScaleFactor);
	ctx.bezierCurveTo(RightTube+radius2, BottomTube-FluidLevel2*ScaleFactor+depthcurvefactor*radius2, RightTube-radius2, BottomTube-FluidLevel2*ScaleFactor+depthcurvefactor*radius2, RightTube-radius2, BottomTube-FluidLevel2*ScaleFactor);
	ctx.lineTo(RightTube-radius2, BottomTube-1.5*TubeCurve);
	ctx.quadraticCurveTo(RightTube-radius2, BottomTube-TubeCurve, RightTube-radius2-0.5*TubeCurve, BottomTube-TubeCurve);
	ctx.lineTo(MidTube, BottomTube-TubeCurve);
	ctx.stroke();
	ctx.globalAlpha = 0.3;
	ctx.fill();
	ctx.globalAlpha = 1.0;
	
	ctx.beginPath();
	ctx.moveTo(RightTube+radius2, BottomTube-FluidLevel2*ScaleFactor);
	ctx.bezierCurveTo(RightTube+radius2, BottomTube-FluidLevel2*ScaleFactor-depthcurvefactor*radius2, RightTube-radius2, BottomTube-FluidLevel2*ScaleFactor-depthcurvefactor*radius2, RightTube-radius2, BottomTube-FluidLevel2*ScaleFactor);
	ctx.bezierCurveTo(RightTube-radius2, BottomTube-FluidLevel2*ScaleFactor+depthcurvefactor*radius2, RightTube+radius2, BottomTube-FluidLevel2*ScaleFactor+depthcurvefactor*radius2, RightTube+radius2, BottomTube-FluidLevel2*ScaleFactor);
	
	ctx.stroke();
	ctx.globalAlpha = 0.7;
	ctx.fill();
	ctx.globalAlpha = 1.0;
	
	ctx.lineWidth = 1;
	ctx.strokeStyle = "#990000";
	ctx.beginPath();
	ctx.moveTo(RightTube-radius2, BottomTube-FluidLevel2*ScaleFactor);
	ctx.lineTo(RightTube-radius2-10, BottomTube-FluidLevel2*ScaleFactor);
	ctx.stroke();
}


function DrawTubeFront(){
	ctx.lineWidth = 2;
	ctx.strokeStyle = "#000000";
	ctx.fillStyle = "#FFFFFF";
	ctx.beginPath();
	ctx.moveTo(LeftTube+radius1, TopTube);
	ctx.bezierCurveTo(LeftTube+radius1, TopTube+depthcurvefactor*radius1, LeftTube-radius1, TopTube+depthcurvefactor*radius1, LeftTube-radius1, TopTube);
	ctx.lineTo(LeftTube-radius1, BottomTube);
	ctx.quadraticCurveTo(LeftTube-radius1, BottomTube+TubeCurve, LeftTube-radius1+TubeCurve, BottomTube+TubeCurve);
	ctx.lineTo(RightTube+radius2-TubeCurve, BottomTube+TubeCurve);
	ctx.quadraticCurveTo(RightTube+radius2, BottomTube+TubeCurve, RightTube+radius2, BottomTube);
	ctx.lineTo(RightTube+radius2, TopTube);
	ctx.bezierCurveTo(RightTube+radius2, TopTube+depthcurvefactor*radius2, RightTube-radius2, TopTube+depthcurvefactor*radius2, RightTube-radius2, TopTube);
	ctx.lineTo(RightTube-radius2, BottomTube-1.5*TubeCurve);
	ctx.quadraticCurveTo(RightTube-radius2, BottomTube-TubeCurve, RightTube-radius2-0.5*TubeCurve, BottomTube-TubeCurve);
	ctx.lineTo(LeftTube+radius1+0.5*TubeCurve, BottomTube-TubeCurve);
	ctx.quadraticCurveTo(LeftTube+radius1, BottomTube-TubeCurve, LeftTube+radius1, BottomTube-1.5*TubeCurve);
	ctx.lineTo(LeftTube+radius1, TopTube);
	ctx.stroke();
	ctx.globalAlpha = 0.3;
	ctx.fill();
	ctx.globalAlpha = 1.0;
}


function DrawTubeBack(){
	ctx.lineWidth = 2;
	ctx.strokeStyle = "#000000";
	ctx.fillStyle = "#FFFFFF";
	ctx.beginPath();
	ctx.moveTo(LeftTube+radius1, TopTube);
	ctx.bezierCurveTo(LeftTube+radius1, TopTube-depthcurvefactor*radius1, LeftTube-radius1, TopTube-depthcurvefactor*radius1, LeftTube-radius1, TopTube);
	ctx.lineTo(LeftTube-radius1, BottomTube);
	ctx.quadraticCurveTo(LeftTube-radius1, BottomTube+TubeCurve, LeftTube-radius1+TubeCurve, BottomTube+TubeCurve);
	ctx.lineTo(RightTube+radius2-TubeCurve, BottomTube+TubeCurve);
	ctx.quadraticCurveTo(RightTube+radius2, BottomTube+TubeCurve, RightTube+radius2, BottomTube);
	ctx.lineTo(RightTube+radius2, TopTube);
	ctx.bezierCurveTo(RightTube+radius2, TopTube-depthcurvefactor*radius2, RightTube-radius2, TopTube-depthcurvefactor*radius2, RightTube-radius2, TopTube);
	ctx.lineTo(RightTube-radius2, BottomTube-1.5*TubeCurve);
	ctx.quadraticCurveTo(RightTube-radius2, BottomTube-TubeCurve, RightTube-radius2-0.5*TubeCurve, BottomTube-TubeCurve);
	ctx.lineTo(LeftTube+radius1+0.5*TubeCurve, BottomTube-TubeCurve);
	ctx.quadraticCurveTo(LeftTube+radius1, BottomTube-TubeCurve, LeftTube+radius1, BottomTube-1.5*TubeCurve);
	ctx.lineTo(LeftTube+radius1, TopTube);
	ctx.stroke();
	ctx.globalAlpha = 0.5;
	ctx.fill();
	ctx.globalAlpha = 1.0;
}

function DrawAxes(){

			ctx.lineWidth = 2;
			ctx.strokeStyle = "#000000";
		}
		else{
			ctx.lineWidth = 1;
			ctx.strokeStyle = "#AAAAAA";
		}
		if (i == 0){
			ctx.lineWidth = 4;
			ctx.strokeStyle = "#000000";
		}
		ctx.beginPath();
		ctx.moveTo(LeftGrid, BottomGrid - MoveYFactor*i*GridHeight);

		ctx.stroke();
		temptext = 10*i;

			WriteText(LeftGrid - 5, BottomGrid - MoveYFactor*i*GridHeight+5,temptext.toFixed(0),18,"#000000",1, ProgramFont);

	}
	
	//X lines
	
	NumberOfXLines = 50;

	for (i=0;i<=NumberOfXLines;i++){

			ctx.lineWidth = 2;

		}
		if (i == 25){
			ctx.lineWidth = 4;

		ctx.stroke();

}

function DrawArrow(x, y, h, w, c, r){
	ctx.save();
	ctx.translate(x, y+0.5*h);
	ctx.rotate(r);
	ctx.fillStyle = c;
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 1;
	ctx.beginPath();
	ctx.moveTo(0,-0.5*h);
	ctx.lineTo(0+w, -0.5*h+w);
	ctx.lineTo(0+0.5*w, -0.5*h+w);
	ctx.lineTo(0+0.5*w, -0.5*h+h);
	ctx.lineTo(0-0.5*w, -0.5*h+h);
	ctx.lineTo(0-0.5*w, -0.5*h+w);
	ctx.lineTo(0-w, -0.5*h+w);
	ctx.lineTo(0,-0.5*h);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	ctx.restore();
}

function DrawRectangle(xrect, yrect, wrect, hrect, curverectangle, lcolor, fcolor, lwid){
	ctx.fillStyle = fcolor;
	ctx.strokeStyle = lcolor;
	ctx.lineWidth = lwid;
	ctx.beginPath();
	ctx.moveTo(xrect+curverectangle, yrect);
	ctx.lineTo(xrect+wrect-curverectangle, yrect);
	ctx.arc(xrect+wrect-curverectangle, yrect+curverectangle, curverectangle, 1.5*Math.PI, 0*Math.PI, false);
	ctx.lineTo(xrect+wrect, yrect+hrect-curverectangle);
	ctx.arc(xrect+wrect-curverectangle, yrect+hrect-curverectangle, curverectangle, 0.0*Math.PI, 0.5*Math.PI, false);
	ctx.lineTo(xrect+curverectangle, yrect+hrect);
	ctx.arc(xrect+curverectangle, yrect+hrect-curverectangle, curverectangle, 0.5*Math.PI, 1.0*Math.PI, false);
	ctx.lineTo(xrect, yrect+curverectangle);
	ctx.arc(xrect+curverectangle, yrect+curverectangle, curverectangle, 1.0*Math.PI, 1.5*Math.PI, false);
	ctx.stroke();
	ctx.fill();
}

function Cylinder(ccx,cty,chw,ch,cc,cc1,cc2,lw){
	
/* ccx:  cylinder center x cty:  cylinder top y  chw:  cylinder halfwidth ch: cylinder height  cc:  cylinder curve  cc1:  cylinder top color  cc2:  cylinder color  lw:  linewidth */
	
	ctx.lineWidth = lw;
	ctx.strokeStyle = "#000000";
	ctx.beginPath();
	ctx.moveTo(ccx-chw, cty);
	ctx.bezierCurveTo(ccx-chw,cty+cc,ccx+chw,cty+cc,ccx+chw,cty);
	ctx.lineTo(ccx+chw,cty+ch);
	ctx.bezierCurveTo(ccx+chw,cty+ch+cc,ccx-chw,cty+ch+cc,ccx-chw,cty+ch);
	ctx.lineTo(ccx-chw, cty);
	ctx.stroke();
	ctx.closePath();
	ctx.fillStyle = cc2;
	ctx.fill();
	
	ctx.lineWidth = lw;
	ctx.strokeStyle = "#000000";
	ctx.beginPath();
	ctx.moveTo(ccx-chw, cty);
	ctx.bezierCurveTo(ccx-chw,cty-cc,ccx+chw,cty-cc,ccx+chw,cty);
	ctx.moveTo(ccx-chw, cty);
	ctx.bezierCurveTo(ccx-chw,cty+cc,ccx+chw,cty+cc,ccx+chw,cty);
	ctx.stroke();
	ctx.closePath();
	ctx.fillStyle = cc1;
	ctx.fill();
	
	
}

function Photogate(pcx, pty, phw, ph){

	/* support metal */
	ctx.lineWidth = 8;
	ctx.strokeStyle = "#C0C0C0";
	
	ctx.beginPath();
	ctx.moveTo(pcx-phw, pty+0.4*ph);
	ctx.lineTo(-10, pty+0.4*ph);
	ctx.stroke();
	ctx.closePath();
	

	ctx.lineWidth = 1;
	ctx.strokeStyle = "#999999";
	ctx.fillStyle = "#333333";
	
	/* Left Side */
	ctx.beginPath();
	
	ctx.moveTo(pcx-phw+2.0*ph, pty-2.0*ph);
	
	ctx.lineTo(pcx-phw+2.0*ph, pty-1.0*ph);

	ctx.closePath();
	ctx.fill();
	
	/* Top */
	ctx.beginPath();
	ctx.moveTo(pcx+phw, pty);
	
	ctx.lineTo(pcx+phw+1.0*ph, pty-2.0*ph);
	
	ctx.lineTo(pcx+phw, pty-2.0*ph);

	ctx.lineTo(pcx-phw+1.0*ph, pty-2.0*ph);
	
	ctx.lineTo(pcx-phw, pty);
	ctx.lineTo(pcx-phw, pty+ph);
	ctx.lineTo(pcx+phw, pty+ph);
	ctx.lineTo(pcx+phw, pty);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	
	
	/* Front Side */
	ctx.beginPath();
	ctx.moveTo(pcx, pty);
	ctx.lineTo(pcx+phw, pty);
	ctx.lineTo(pcx+phw, pty+ph);
	ctx.lineTo(pcx-phw, pty+ph);
	ctx.lineTo(pcx-phw, pty);
	ctx.lineTo(pcx, pty);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	
	/* Right Side */
	ctx.beginPath();
	ctx.moveTo(pcx+phw, pty+ph);
	
	ctx.lineTo(pcx+phw+1.0*ph, pty-1.0*ph);
	
	ctx.lineTo(pcx+phw+1.0*ph, pty-2.0*ph);
	
	ctx.lineTo(pcx+phw, pty);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	
	
	/* line on top right side */
	ctx.beginPath();
	ctx.moveTo(pcx+phw, pty);
	ctx.lineTo(pcx+phw-0.75*ph, pty-0.5*ph);
	ctx.stroke();
	ctx.closePath();
	
	/* Text on Front */
	ctx.font="10px Arial";
	ctx.fillStyle="#FFFFFF";
	temptext = "Vernier Photogate";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = pcx + 0.2*phw - textWidth/2;
	ctx.fillText(temptext,xposition, pty+0.7*ph);
	
	/* Red Indicator Light */
	ctx.lineWidth = 1;
	ctx.strokeStyle = "#FFFFFF";
	ctx.fillStyle = "#660000";
	
	ctx.beginPath();
	ctx.arc(pcx-0.8*phw, pty+0.5*ph, 0.2*ph, 0, 2*Math.PI);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();


}

function Sky(sx,sy,ex,ey,sw,sh,ssc,esc){

function CityBuilding(bx,by,bw,bh, bc, bs){
	ctx.lineWidth = 1;
	ctx.strokeStyle = "#000000";
	ctx.fillStyle=bc;
	if (bs == 0){
		ctx.beginPath();
		ctx.moveTo(bx,by);
		ctx.lineTo(bx+bw, by+10);
		ctx.lineTo(bx+bw, by+bh);
		ctx.lineTo(bx, by+bh);
		ctx.lineTo(bx, by);
		ctx.stroke();
		ctx.closePath();
		ctx.fill();
	}
	if (bs == 1){
		ctx.beginPath();
		ctx.moveTo(bx,by);
		ctx.lineTo(bx+0.5*bw, by-10);
		ctx.lineTo(bx+bw,by);
		ctx.lineTo(bx+bw, by+bh);
		ctx.lineTo(bx, by+bh);
		ctx.lineTo(bx, by);
		ctx.stroke();
		ctx.closePath();
		ctx.fill();
	}
	if (bs == 2){
		ctx.beginPath();
		ctx.moveTo(bx,by);
		ctx.lineTo(bx+bw, by-10);
		ctx.lineTo(bx+bw, by+bh);
		ctx.lineTo(bx, by+bh);
		ctx.lineTo(bx, by);
		ctx.stroke();
		ctx.closePath();
		ctx.fill();
	}
	if (bs > 2){
		ctx.beginPath();
		ctx.moveTo(bx,by);
		ctx.lineTo(bx+bw, by);
		ctx.lineTo(bx+bw, by+bh);
		ctx.lineTo(bx, by+bh);
		ctx.lineTo(bx, by);
		ctx.stroke();
		ctx.closePath();
		ctx.fill();
	}
	
}

function Boat(fx,ty,lob,hob,db,cob, nob){

		ctx.lineWidth = 1;

		ctx.lineTo(fx, ty);

		ctx.closePath();
		ctx.fill();
	}
	else{
		ctx.lineWidth = 1;

		ctx.fillRect(fx+0.95*lob-50, ty-30, 50, 40);
		ctx.strokeRect(fx+0.95*lob-50, ty-30, 50, 40);
		ctx.lineWidth = 3;
		ctx.strokeStyle = "#EEEEDD";
		ctx.beginPath();
		ctx.moveTo(fx+.95*lob-20, ty-40);
		ctx.lineTo(fx+.95*lob-20, ty-30);
		ctx.moveTo(fx+.95*lob-5, ty-34);
		ctx.lineTo(fx+.95*lob-35, ty-34);
		ctx.stroke();
		ctx.closePath();
		ctx.lineWidth = 1;
		ctx.strokeStyle = "#000000";
		ctx.fillStyle = cob;
		ctx.beginPath();
		ctx.moveTo(fx,ty);
		ctx.lineTo(fx+0.05*lob, ty+hob);

function CylindricalMass(ccx,cty,size,cc1,cc2){
	
/* ccx:  cylinder center x cty:  cylinder top y  chw:  cylinder halfwidth ch: cylinder height  cc:  cylinder curve  cc1:  cylinder top color  cc2:  cylinder color  lw:  linewidth */
	
	ctx.lineWidth = 0.02*size;
	ctx.strokeStyle = "#000000";
	ctx.beginPath();
	ctx.moveTo(ccx-0.5*size, cty);
	ctx.bezierCurveTo(ccx-0.5*size,cty+0.05*size,ccx+0.5*size,cty+0.05*size,ccx+0.5*size,cty);
	ctx.lineTo(ccx+0.5*size,cty+1.5*size);
	ctx.bezierCurveTo(ccx+0.5*size,cty+1.5*size+0.05*size,ccx-0.5*size,cty+1.5*size+0.05*size,ccx-0.5*size,cty+1.5*size);
	ctx.lineTo(ccx-0.5*size, cty);
	ctx.stroke();
	ctx.closePath();
	ctx.fillStyle = cc2;
	ctx.fill();
	
	ctx.lineWidth = 0.02*size;
	ctx.strokeStyle = "#000000";
	ctx.beginPath();
	ctx.moveTo(ccx-0.5*size, cty);
	ctx.bezierCurveTo(ccx-0.5*size,cty-0.05*size,ccx+0.5*size,cty-0.05*size,ccx+0.5*size,cty);
	ctx.moveTo(ccx-0.5*size, cty);
	ctx.bezierCurveTo(ccx-0.5*size,cty+0.05*size,ccx+0.5*size,cty+0.05*size,ccx+0.5*size,cty);
	ctx.stroke();
	ctx.closePath();
	ctx.fillStyle = cc1;
	ctx.fill();
	
	ctx.lineWidth = 4;
	ctx.strokeStyle = cc2;
	ctx.beginPath();
	ctx.moveTo(ccx, cty-0.025*size);
	ctx.lineTo(ccx, cty-0.025*size-20);
	ctx.arc(ccx, cty-0.025*size-20-7, 10, Math.PI/2, Math.PI, true);
	ctx.stroke();
	ctx.closePath();
	
	
	
}

		h = 12;
	}

		h = "0" + h;
	}
	
	if (m < 10){
		m = "0" + m;
	}
	
	displaytime = h + ":" + m  + z;
	
	/*  Generates a small random error to make display reading flicker */
	
	if (u != 1){
		ED = Math.random()*2;
		
		if (ED > 1){
			ErrorDirection = 1;
		}
		else{
			ErrorDirection = -1;
		}
		
		if (Force > 1){
			Error = Math.random()*Force*0.002*ErrorDirection;
		}
		else{
			Error = Math.random()*Force*.01*ErrorDirection;
		}
		
		DisplayForce = Force+Error;
		
		/*  Makes sure the displayed force is not larger than Maximum Value */
		
		if (Force > 50){
			Force = 50;
		}
	}
	else{
		DisplayForce = Force;
	}
	
	/*  Draws the body of the Lab Quest */
	
	ctx.lineWidth = 1;
	ctx.strokeStyle = "#444444";
	ctx.fillStyle = "#444444";
	ctx.beginPath();
	ctx.moveTo(x-hw+lqc,y);
	ctx.arc(x-hw+lqc, y-lqc, lqc, 0.5*Math.PI, 1*Math.PI);
	ctx.lineTo(x-hw,y-lqh+lqc);
	ctx.arc(x-hw+lqc, y-lqh+lqc, lqc, 1*Math.PI, 1.5*Math.PI);
	ctx.lineTo(x+hw-lqc,y-lqh);
	ctx.arc(x+hw-lqc, y-lqh+lqc, lqc, 1.5*Math.PI, 0*Math.PI);
	ctx.lineTo(x+hw,y-lqc);
	ctx.arc(x+hw-lqc, y-lqc, lqc, 0*Math.PI, 0.5*Math.PI);
	ctx.lineTo(x-hw+lqc,y);
	ctx.closePath();
	ctx.fill();
	ctx.stroke();
	
	/*  Rectangles on Screen */
	
	ctx.fillStyle = "#49999e";
	ctx.fillRect(x-0.75*hw,y-0.825*lqh,1.5*hw,0.75*lqh);
		
	ctx.fillStyle = "#397b7d";
	ctx.strokeStyle = "#ffffff";
	ctx.fillRect(x-0.7425*hw,y-0.75*lqh,1.01*hw,0.625*lqh);
	ctx.strokeRect(x-0.7425*hw,y-0.75*lqh,1.01*hw,0.625*lqh);
	
	ctx.fillStyle = "#ea212c";
	ctx.strokeStyle = "#ffffff";
	ctx.fillRect(x-0.7375*hw,y-0.6875*lqh,1.0*hw,0.5*lqh);
	ctx.strokeRect(x-0.7375*hw,y-0.6875*lqh,1.0*hw,0.5*lqh);
	
	ctx.fillStyle = "#555555";
	ctx.fillRect(x-0.75*hw,y-0.125*lqh,1.5*hw,0.065*lqh);
	
	ctx.fillStyle = "#FFFFFF";
	ctx.strokeStyle = "#000000";
	ctx.fillRect(x-0.725*hw,y-0.82*lqh,0.065*lqh,0.065*lqh);
	ctx.strokeRect(x-0.725*hw,y-0.82*lqh,0.065*lqh,0.065*lqh);
	
	ctx.fillStyle = "#c2d6d8";
	ctx.fillRect(x+0.2875*hw,y-0.75*lqh,0.45*hw,0.35*lqh);
	
	ctx.strokeStyle = "#49999e";
	ctx.strokeRect(x+0.3*hw,y-0.7375*lqh,0.425*hw,0.1*lqh);
	ctx.strokeRect(x+0.3*hw,y-0.625*lqh,0.425*hw,0.1*lqh);
	ctx.strokeRect(x+0.3*hw,y-0.5125*lqh,0.425*hw,0.1*lqh);
	
	/*  Words on Lab Quest */
	
	/*  Vernier */
	
	ctx.font = 0.1*lqh + "px Arial";
	ctx.fillStyle="#FFFFFF";
	temptext = "Vernier";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	ctx.save();
	ctx.translate(x,y-100);
	ctx.rotate(-0.5*Math.PI);
	ctx.fillText(temptext,-0.5*textWidth,-0.83*hw);
	ctx.restore();


	
	/* Lab Quest */
	
	ctx.font= 0.1*lqh + "px Arial";
	ctx.fillStyle="#49999e";
	temptext = "LabQuest ®";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x-0.375*hw-0.5*textWidth;
	ctx.fillText(temptext,xposition, y-0.875*lqh);
	
	ctx.fillStyle="#ea212c";
	temptext = "2";
	xposition = x-0.3625*hw+0.5*textWidth;
	ctx.fillText(temptext,xposition, y-0.875*lqh);
	
	
	/* Connected Science System */
	ctx.font = 0.05*lqh + "px Arial";
	ctx.fillStyle="#FFFFFF";
	temptext = "CONNECTED SCIENCE SYSTEM";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x+0.35*hw-0.5*textWidth;
	ctx.fillText(temptext,xposition, y-0.0125*lqh);
	
	
	/* Force Channel 1 */
	ctx.font = 0.075*lqh + "px Arial bold";
	ctx.fillStyle="#FFFFFF";
	temptext = "CH 1: FORCE";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x-0.475*hw-0.5*textWidth;
	ctx.fillText(temptext,xposition, y-0.575*lqh);
	

	/* Force Reading */
	ctx.font = 0.15*lqh + "px Arial bold";
	ctx.fillStyle="#FFFFFF";
	if (u != 1){
		temptext = DisplayForce.toFixed(2) + " N";
	}
	else{
		temptext = DisplayForce.toPrecision(2) + " N";
	}
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x+0.125*hw-textWidth;
	ctx.fillText(temptext,xposition, y-0.375*lqh);
	
	/* Display Time */
	ctx.font = 0.035*lqh + "px Arial";
	ctx.fillStyle="#FFFFFF";
	temptext = displaytime;
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x+0.725*hw-textWidth;
	ctx.fillText(temptext,xposition, y-0.0875*lqh);
	
	/* Menus */
	ctx.font = 0.035*lqh + "px Arial";
	ctx.fillStyle="#FFFFFF";
	temptext = "File    Sensors";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x-0.625*hw;
	ctx.fillText(temptext,xposition, y-0.775*lqh);
	
	/* Data Collection Options */
	ctx.font = 0.035*lqh + "px Arial Bold";
	ctx.fillStyle="#000000";
	temptext = "Mode:";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x+0.3125*hw;
	ctx.fillText(temptext,xposition, y-0.7*lqh);
	
	temptext = "Rate:";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x+0.3125*hw;
	ctx.fillText(temptext,xposition, y-0.5875*lqh);
	
	temptext = "Length:";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x+0.3125*hw;
	ctx.fillText(temptext,xposition, y-0.475*lqh);
	
	ctx.font = 0.035*lqh + "px Arial";
	ctx.fillStyle="#000000";
	temptext = "Time Based";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x+0.5125*hw - 0.5*textWidth;
	ctx.fillText(temptext,xposition, y-0.6625*lqh);
	
	temptext = "1.0 samples/s";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x+0.5125*hw - 0.5*textWidth;
	ctx.fillText(temptext,xposition, y-0.55*lqh);
	
	temptext = "180.0 s";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x+0.5125*hw - 0.5*textWidth;
	ctx.fillText(temptext,xposition, y-0.4375*lqh);
	
}
