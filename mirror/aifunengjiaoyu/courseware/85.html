  <style>
    :root{--bg:#f7f6f2;--surface:#fff;--ink:#1a1814;--ink2:#6b6860;--border:#e4e2da;--blue:#2a5c8f;--blue-light:#e8f0f8;--teal:#0f6e56;--teal-light:#e1f5ee;--amber:#854f0b;--amber-light:#faeeda;--radius:12px;--radius-sm:8px;}
    *{margin:0;padding:0;box-sizing:border-box;}

    .shape-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
    .view-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .view-cell{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px;}
    .view-title{font-size:11px;font-weight:700;color:var(--ink2);text-align:center;margin-bottom:4px;}
    canvas{width:100%;display:block;cursor:grab;}
    canvas.small{border-radius:var(--radius-sm);}
    .hint{font-size:11px;color:var(--ink2);text-align:center;margin-top:4px;}
    .fb{background:var(--teal-light);border-left:4px solid var(--teal);border-radius:var(--radius-sm);padding:12px 16px;font-size:13px;line-height:1.7;}
