<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>交互式曼陀罗涂色</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1200px;
        }
        
        .mandala-container {
            position: relative;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            background-color: white;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 300px;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .color-palette {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        
        .color-option {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
            border: 2px solid #eee;
        }
        
        .color-option:hover {
            transform: scale(1.1);
        }
        
        .color-option.selected {
            border: 3px solid #333;
            transform: scale(1.1);
        }
        
        button {
            padding: 10px 15px;
            background-color: #4a6fa5;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #3a5a8a;
        }
        
        .section {
            background-color: #f9f9f9;
            padding: 15px;
            border-radius: 8px;
        }
        
        .section h3 {
            margin-top: 0;
            color: #555;
        }
        
        .instructions {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }
    </style>
</head>

    <h1>交互式曼陀罗涂色</h1>
    
    <div class="container">
        <div class="mandala-container">
            <svg id="mandala" width="100%" height="100%" viewBox="0 0 600 600">
                <!-- 曼陀罗图案将通过JavaScript动态生成 -->
            </svg>
        </div>
        
        <div class="controls">
            <div class="section">
                <h3>颜色选择</h3>
                <div class="color-palette" id="colorPalette">
                    <!-- 颜色选项将通过JavaScript动态生成 -->
                </div>
            </div>
            
            <div class="section">
                <h3>工具</h3>
                <button id="clearBtn">清除所有颜色</button>
                <button id="randomBtn">随机配色</button>
            </div>
            
            <div class="section instructions">
                <h3>使用说明</h3>
                <p>1. 从调色板中选择颜色</p>
                <p>2. 点击曼陀罗的任意区域进行涂色</p>
                <p>3. 也可以拖动鼠标连续涂色</p>
                <p>4. 鼠标悬停时区域会放大显示</p>
            </div>
        </div>
    </div>
