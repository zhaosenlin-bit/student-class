  <h1>Blackhole - Gravitational Lensing</h1>
  <p>Move the cursor </p>
	<button class="btn btn-warning" onclick="
    alert(
        'GRAVITATIONAL LENSING (Part 1 of 2)\n\n' +

        'According to Einstein’s general theory of relativity, a massive object such as a black hole curves spacetime, causing light from distant stars and galaxies to bend as it passes nearby.\n\n' +

        'WHAT YOU SEE IN THIS SIMULATION:\n\n' +

        '1. The black circle at the center represents the black hole, a region from which light cannot escape.\n\n' +

        '2. The surrounding star field appears bent, stretched, and distorted because the black hole’s gravity changes the paths of light reaching the observer.\n\n' +

        '3. The bright circular distortion surrounding the black hole illustrates strong gravitational lensing. Background light can appear magnified, warped, or arranged into rings and arcs.\n\n' +

        'Click OK to continue to Part 2.'
    );

    alert(
        'GRAVITATIONAL LENSING (Part 2 of 2)\n\n' +

        '4. Move your cursor across the simulation to change the position of the black hole and observe how the apparent positions and shapes of background stars change.\n\n' +

        '5. The gravitational distortion becomes stronger closer to the black hole, where spacetime curvature is greatest.\n\n' +

        'IMPORTANT:\n\n' +

        'This simulation provides a visual illustration of gravitational lensing rather than an exact general-relativistic calculation of light trajectories.\n\n' +

        'Gravitational lensing provides important evidence for general relativity and helps astronomers investigate black holes, dark matter, and distant galaxies.'
    );
">
    What is Gravitational Lensing?
</button>
