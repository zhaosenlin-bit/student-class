# 乐启享课件库 · 挂在官网目录下的写法
#
# 课件库本体放在对象存储上，官网自己的服务器只做转发，一份字节也不用
# 放在服务器磁盘上。
#
# 课件库在桶 teaching-platform-files 自己的前缀 leqixiang-courseware/
# 下面，和这个账号下别的系统的资源完全分开。
#
# 用法：把下面这几段放进 codebn.cn 的 server 段里，
#       课件库就挂在 https://codebn.cn/leqixiang/ 下面。

# 目录页：对象存储没有目录首页，直接给首页文件。
location = /leqixiang/ {
    proxy_pass https://teaching-platform-files.oss-cn-hangzhou.aliyuncs.com/leqixiang-courseware/index.html;

    proxy_http_version 1.1;
    proxy_set_header Host teaching-platform-files.oss-cn-hangzhou.aliyuncs.com;
    proxy_redirect off;
}

# 课件库本体。课件里的地址都是相对的，转发时不能被改写掉。
location /leqixiang/ {
    proxy_pass https://teaching-platform-files.oss-cn-hangzhou.aliyuncs.com/leqixiang-courseware/;

    proxy_http_version 1.1;
    proxy_set_header Host teaching-platform-files.oss-cn-hangzhou.aliyuncs.com;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_redirect off;

    # 缓存的规矩写在上传的时候：页面和清单改得勤，缓存短一点；
    # 素材和脚本不会变，缓存久一点。转发的响应里带着这些头，不用再写一遍。
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
