<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>氢原子能级与光谱 - 高三物理</title>
<style>
:root {
  --bg-start: #e3f0fa;
  --bg-mid: #d4e8f8;
  --bg-end: #c9e4f6;
  --card-bg: rgba(255,255,255,0.22);
  --card-border: rgba(255,255,255,0.40);
  --text-primary: #0d1b3e;
  --text-secondary: #2c3e6b;
  --accent-blue: #2962ff;
  --accent-gold: #f0a030;
  --accent-red: #e53935;
  --accent-green: #2e7d32;
  --shadow: 0 8px 32px rgba(0,0,0,0.07);
  --radius: 16px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  background: linear-gradient(180deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
  min-height:100vh; overflow-x:hidden; position:relative;
  -webkit-font-smoothing:antialiased;
}
#starCanvas {
  position:fixed; top:0; left:0; width:100%; height:100%;
  z-index:0; pointer-events:none;
}
.container { position:relative; z-index:1; max-width:1220px; margin:0 auto; padding:20px 16px 30px; }
.glass-card {
  background:var(--card-bg); backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid var(--card-border); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:18px 20px;
}

/* Header */
.header-card { text-align:center; margin-bottom:16px; padding:14px 20px; }
.header-card h1 { font-size:1.55rem; font-weight:700; color:var(--text-primary); letter-spacing:0.04em; }
.header-card .subtitle { font-size:0.82rem; color:var(--text-secondary); margin-top:2px; }

/* Main layout */
.main-row { display:flex; gap:14px; margin-bottom:14px; flex-wrap:wrap; }
.energy-col { flex:0 0 400px; min-width:360px; }
.right-col { flex:1; min-width:500px; display:flex; flex-direction:column; gap:14px; }

/* Canvas containers */
.energy-card { padding:10px; }
.spectrum-card { padding:10px 16px; }
#energyCanvas { display:block; width:100%; height:540px; border-radius:10px; cursor:pointer; }
#spectrumCanvas { display:block; width:100%; height:115px; border-radius:8px; }

/* Info panel */
.info-card { padding:14px 18px; }
.transition-info { margin-bottom:10px; }
.transition-info .t-title { font-size:0.9rem; font-weight:600; color:var(--text-secondary); margin-bottom:6px; }
.transition-details { display:flex; gap:24px; flex-wrap:wrap; align-items:center; }
.detail-item { text-align:center; min-width:80px; }
.detail-item .d-val { font-size:1.25rem; font-weight:700; color:var(--text-primary); }
.detail-item .d-label { font-size:0.7rem; color:#5a6a8a; margin-top:2px; }
.detail-item.emission .d-val { color:#e65100; }
.detail-item.absorption .d-val { color:#0d47a1; }
.transition-type-badge {
  display:inline-block; padding:4px 14px; border-radius:20px;
  font-size:0.82rem; font-weight:600; letter-spacing:0.03em;
}
.badge-emission { background:rgba(255,152,0,0.18); color:#e65100; }
.badge-absorption { background:rgba(41,98,255,0.15); color:#0d47a1; }
.no-transition { color:#8899aa; font-size:0.85rem; }

/* Formula cards */
.formula-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
.formula-item {
  background:rgba(255,255,255,0.5); border-radius:10px; padding:10px 8px; text-align:center;
  border:1px solid rgba(0,0,0,0.06);
}
.formula-item .f-eq { font-size:0.95rem; font-weight:700; color:#1a237e; font-family:'Georgia','Times New Roman',serif; }
.formula-item .f-desc { font-size:0.65rem; color:#556677; margin-top:2px; }

/* Controls */
.controls-row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
.controls-row select {
  padding:7px 12px; border-radius:8px; border:1px solid rgba(0,0,0,0.15);
  background:rgba(255,255,255,0.7); font-size:0.85rem; color:var(--text-primary); cursor:pointer;
}
.btn {
  padding:7px 16px; border-radius:8px; border:none; font-size:0.84rem; font-weight:600;
  cursor:pointer; transition:all 0.2s; letter-spacing:0.02em;
}
.btn-primary { background:var(--accent-blue); color:#fff; }
.btn-primary:hover { background:#1a4fd6; transform:translateY(-1px); box-shadow:0 4px 12px rgba(41,98,255,0.3); }
.btn-outline { background:rgba(255,255,255,0.6); color:var(--text-primary); border:1px solid rgba(0,0,0,0.15); }
.btn-outline:hover { background:rgba(255,255,255,0.9); }
.btn-gold { background:var(--accent-gold); color:#fff; }
.btn-gold:hover { background:#d88a20; transform:translateY(-1px); box-shadow:0 4px 12px rgba(240,160,48,0.35); }
.btn-sm { padding:4px 10px; font-size:0.75rem; }

/* Exam panel */
.exam-panel { display:none; margin-top:14px; }
.exam-panel.visible { display:block; }
.exam-panel h3 { font-size:1.05rem; color:var(--text-primary); margin-bottom:10px; }
.exam-q { margin-bottom:14px; padding:12px 14px; background:rgba(255,255,255,0.4); border-radius:10px; border-left:4px solid var(--accent-blue); }
.exam-q .q-text { font-size:0.88rem; color:var(--text-primary); margin-bottom:6px; line-height:1.5; }
.exam-q .q-options { display:flex; gap:10px; flex-wrap:wrap; }
.exam-q .q-opt {
  padding:5px 14px; border-radius:20px; background:rgba(255,255,255,0.6);
  border:1px solid rgba(0,0,0,0.12); cursor:pointer; font-size:0.82rem;
  transition:all 0.2s;
}
.exam-q .q-opt:hover { background:rgba(41,98,255,0.12); border-color:var(--accent-blue); }
.exam-q .q-opt.selected { background:var(--accent-blue); color:#fff; border-color:var(--accent-blue); }
.exam-q .q-opt.correct { background:#c8e6c9; color:#1b5e20; border-color:#4caf50; }
.exam-q .q-opt.wrong { background:#ffcdd2; color:#b71c1c; border-color:#e53935; }
.exam-q .q-feedback { font-size:0.78rem; margin-top:6px; color:#555; }
.exam-q.tf-q .q-options { gap:6px; }
.exam-score { font-weight:700; color:var(--accent-blue); font-size:1rem; margin-bottom:8px; }

/* Responsive */
@media(max-width:900px){
  .main-row { flex-direction:column; }
  .energy-col { flex:auto; min-width:auto; }
  .right-col { min-width:auto; }
  .formula-grid { grid-template-columns:repeat(2,1fr); }
  #energyCanvas { height:380px; }
}
@media(max-width:500px){
  .formula-grid { grid-template-columns:1fr; }
  .transition-details { gap:10px; }
}
</style>
</head>

<div class="container">
  <!-- Header -->
  <div class="glass-card header-card">
    <h1>氢原子能级与光谱</h1>
    <div class="subtitle">高三物理 · 选择性必修第三册 · 第四章 原子结构和波粒二象性</div>
  </div>

  <!-- Controls -->
  <div class="controls-row">
    <button class="btn btn-primary" id="btnShowAll" title="根据最高能级生成全部可能跃迁">显示全部跃迁</button>
    <select id="selMaxN">
      <option value="2">最高能级 n=2</option>
      <option value="3">最高能级 n=3</option>
      <option value="4" selected>最高能级 n=4</option>
      <option value="5">最高能级 n=5</option>
      <option value="6">最高能级 n=6</option>
    </select>
    <button class="btn btn-outline" id="btnReset">重置</button>
    <span style="flex:1;"></span>
    <button class="btn btn-gold" id="btnExam">考试模式</button>
  </div>

  <!-- Main content -->
  <div class="main-row">
    <!-- Energy level diagram -->
    <div class="energy-col">
      <div class="glass-card energy-card">
        <canvas id="energyCanvas"></canvas>
      </div>
    </div>

    <!-- Right side: spectrum + info -->
    <div class="right-col">
      <!-- Spectrum bar -->
      <div class="glass-card spectrum-card">
        <canvas id="spectrumCanvas"></canvas>
      </div>

      <!-- Info & formulas -->
      <div class="glass-card info-card">
        <div class="transition-info" id="transitionInfo">
          <div class="t-title">当前跃迁</div>
          <div class="transition-details" id="transitionDetails">
            <span class="no-transition">点击能级图中两个能级，查看跃迁详情</span>
          </div>
        </div>
        <div class="formula-grid">
          <div class="formula-item">
            <div class="f-eq">E<sub>n</sub> = &minus;13.6 / n&sup2; eV</div>
            <div class="f-desc">氢原子能级公式</div>
          </div>
          <div class="formula-item">
            <div class="f-eq">h&nu; = |&Delta;E|</div>
            <div class="f-desc">光子能量等于能级差</div>
          </div>
          <div class="formula-item">
            <div class="f-eq">c = &lambda;&nu;</div>
            <div class="f-desc">波长与频率关系</div>
          </div>
          <div class="formula-item">
            <div class="f-eq">N<sub>max</sub> = n(n&minus;1)/2</div>
            <div class="f-desc">最多谱线条数</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Exam panel -->
  <div class="glass-card exam-panel" id="examPanel">
    <h3>考点检测（5题）</h3>
    <div class="exam-score" id="examScore" style="display:none;"></div>
    <div id="examQuestions"></div>
  </div>
</div>
