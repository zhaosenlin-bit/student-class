<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>示波器3D原理 · 加速场 · 偏转场 · 显示屏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f1a;
            font-family: 'Segoe UI', 'Roboto', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .scope-card {
            max-width: 1100px;
            width: 100%;
            background: linear-gradient(145deg, #141b2b, #1a2235);
            border-radius: 40px;
            padding: 28px 28px 35px;
            box-shadow: 0 25px 40px rgba(0, 0, 0, 0.7), inset 0 1px 2px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.04);
            transition: all 0.2s;
        }

        /* 标题区 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 20px;
            padding: 0 6px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 1px;
            color: #b8d0f0;
            text-shadow: 0 2px 3px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 small {
            font-size: 14px;
            font-weight: 300;
            color: #7a8faf;
            letter-spacing: 0.3px;
        }
        .badge {
            background: #1f2a40;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 13px;
            color: #9bb5e0;
            border: 1px solid #314a6a;
            box-shadow: inset 0 1px 0 #3a547a;
        }

        /* 示波器 “屏幕” 容器 */
        .screen-wrapper {
            background: #0d111c;
            border-radius: 28px;
            padding: 16px 16px 12px;
            box-shadow: inset 0 6px 12px rgba(0, 0, 0, 0.8), 0 0 0 1px #2f3c5a;
            margin-bottom: 20px;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            background: #050a14;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0, 20, 60, 0.6);
        }
        #three-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #030711;
            border-radius: 20px;
            cursor: grab;
            display: block;
        }
        #three-container:active {
            cursor: grabbing;
        }

        /* 控制面板 */
        .control-panel {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 18px 28px;
            padding: 12px 6px 0;
            border-top: 1px solid #26324a;
            margin-top: 10px;
        }
        .control-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .control-group label {
            color: #9bb0d0;
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .knob {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .knob input[type="range"] {
            width: 110px;
            height: 4px;
            -webkit-appearance: none;
            appearance: none;
            background: #2a3856;
            border-radius: 10px;
            outline: none;
        }
        .knob input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #60a0ff;
            border: 2px solid #b0d0ff;
            box-shadow: 0 0 10px #3f7fff;
            cursor: grab;
            transition: 0.07s;
        }
        .knob input[type="range"]::-webkit-slider-thumb:hover {
            background: #7cb8ff;
            transform: scale(1.08);
        }
        .knob input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #60a0ff;
            border: 2px solid #b0d0ff;
            cursor: grab;
        }
        .knob-value {
            min-width: 36px;
            text-align: center;
            font-weight: 500;
            color: #cde0ff;
            font-size: 15px;
            background: #1b253b;
            padding: 2px 8px;
            border-radius: 30px;
            font-variant-numeric: tabular-nums;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .btn {
            background: #1f2c44;
            border: none;
            color: #b8cef0;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 4px 0 #0e1422, 0 2px 8px rgba(0, 0, 0, 0.5);
            transition: 0.07s ease;
            border: 1px solid #314b6b;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #0e1422;
        }
        .btn-primary {
            background: #2f5690;
            border-color: #5a8bcf;
            box-shadow: 0 4px 0 #1a2d4e;
            color: white;
        }
        .btn-primary:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1a2d4e;
        }

        /* 图例 */
        .legend {
            display: flex;
            gap: 18px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 8px;
            padding: 4px 0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #a7bddb;
            font-size: 13px;
        }
        .legend-color {
            width: 22px;
            height: 4px;
            border-radius: 10px;
        }

        @media (max-width: 700px) {
            .scope-card {
                padding: 16px;
            }
            .control-panel {
                gap: 12px;
            }
            .knob input[type="range"] {
                width: 80px;
            }
            .header h1 {
                font-size: 18px;
                flex-wrap: wrap;
            }
            .header h1 small {
                font-size: 12px;
            }
            .badge {
                font-size: 11px;
                padding: 4px 12px;
            }
        }
    </style>
</head>

    <div class="scope-card">
        <!-- 头部 -->
        <div class="header">
            <h1>⚡ 示波器·3D 原理 <small>加速场 · 偏转场 · 显示屏</small></h1>
            <span class="badge">🟢 可交互拖拽</span>
        </div>

        <!-- 屏幕 -->
        <div class="screen-wrapper">
            <div class="canvas-container">
                <div id="three-container"></div>
            </div>
        </div>

        <!-- 控制区 -->
        <div class="control-panel">
            <div class="control-group">
                <label>↔️ X 偏转</label>
                <div class="knob">
                    <input type="range" id="xDef" min="-3" max="3" step="0.1" value="0.0">
                    <span class="knob-value" id="xDefDisplay">0.0</span>
                </div>
            </div>
            <div class="control-group">
                <label>↕️ Y 偏转</label>
                <div class="knob">
                    <input type="range" id="yDef" min="-3" max="3" step="0.1" value="0.0">
                    <span class="knob-value" id="yDefDisplay">0.0</span>
                </div>
            </div>
            <div class="control-group">
                <label>🔋 加速电压</label>
                <div class="knob">
                    <input type="range" id="accel" min="1" max="10" step="0.5" value="5.0">
                    <span class="knob-value" id="accelDisplay">5.0</span>
                </div>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" id="resetBtn">⟲ 居中</button>
            </div>
        </div>

        <!-- 图例 -->
        <div class="legend">
            <span class="legend-item"><span class="legend-color" style="background:#70b8ff;"></span> 电子枪</span>
            <span class="legend-item"><span class="legend-color" style="background:#ffaa5a;"></span> X 偏转板</span>
            <span class="legend-item"><span class="legend-color" style="background:#5af07a;"></span> Y 偏转板</span>
            <span class="legend-item"><span class="legend-color" style="background:#3ae0ff;"></span> 电子束</span>
            <span class="legend-item"><span class="legend-color" style="background:#ff4d7a;"></span> 撞击点</span>
        </div>
    </div>

        }
