        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap');

        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 统一淡蓝色渐变背景 */
        .bg-gradient-sky {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 40%, #7dd3fc 80%, #38bdf8 100%);
        }

        /* 玻璃拟态面板 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px 0 rgba(14, 116, 144, 0.12);
        }

        /* 按钮交互特效 */
        .btn-action {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-action:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.22);
        }
        .btn-action:active:not(:disabled) {
            transform: translateY(0);
        }

        /* 2D / 3D 视图容器 */
        #canvas2d-container, #canvas3d-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        #canvas2d {
            display: block;
            cursor: crosshair;
            touch-action: none;
            width: 100%;
            height: 100%;
        }

        .ui-layer {
            position: relative;
            z-index: 10;
            pointer-events: none;
        }

        .interactive {
            pointer-events: auto;
        }

        /* 数显字体 */
        .digital-font {
            font-family: 'Share Tech Mono', monospace;
        }

        /* 动态光效 */
        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.03); opacity: 0.85; }
        }
        .animate-pulse-soft {
            animation: pulse-soft 2s infinite ease-in-out;
        }
    </style>

        <header class="w-full flex flex-col lg:flex-row justify-between items-stretch lg:items-center gap-3">
            <div class="interactive glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3 shadow-md">
                <div class="bg-sky-500 text-white p-2.5 rounded-xl shadow-md shadow-sky-500/30">
                    <i class="fa-solid fa-ruler-combined text-2xl"></i>
                </div>
                <div>
                    <div class="flex flex-wrap items-center gap-2">
                        <span class="bg-sky-100 text-sky-800 text-xs px-2.5 py-0.5 rounded-full font-bold border border-sky-300">
                            小学数学
                        </span>
                        <span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-0.5 rounded-full font-bold border border-blue-300">
                            四年级上册
                        </span>
                        <span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-0.5 rounded-full font-bold border border-emerald-300">
                            垂直与平行 · 点到直线的距离
                        </span>
                    </div>
                    <h1 class="text-lg md:text-xl font-black text-slate-800 tracking-tight mt-0.5">
                        垂线段最短 <span class="text-xs font-normal text-slate-500 hidden sm:inline-block">（平面与立体几何交互探究）</span>
                    </h1>
                </div>
            </div>

            <!-- Mode Switcher Tabs (2D Planar vs 3D Spatial) -->
            <div class="interactive glass-panel p-1.5 rounded-2xl flex items-center gap-2 shadow-md self-start lg:self-center">
                <button id="btnMode2D" onclick="switchDimensionMode('2d')" class="btn-action px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 bg-sky-500 text-white shadow-sm">
                    <i class="fa-solid fa-draw-polygon"></i>
                    <span>2D 平面探究</span>
                </button>
                <button id="btnMode3D" onclick="switchDimensionMode('3d')" class="btn-action px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 text-slate-600 hover:text-sky-600">
                    <i class="fa-solid fa-cube"></i>
                    <span>3D 空间探究</span>
                </button>
            </div>

            <!-- Hint Badge & View Controls -->
            <div class="interactive glass-panel px-3 py-2 rounded-xl text-xs text-slate-600 flex items-center gap-2 self-end lg:self-center">
                <i class="fa-solid fa-hand-pointer text-sky-500 animate-bounce"></i>
                <span id="interactionTip" class="hidden sm:inline">从红点拖拽连线至参考直线</span>
                <button id="btn3DResetView" onclick="reset3DCamera()" class="hidden btn-action bg-white hover:bg-slate-50 px-2.5 py-1 rounded-lg border border-slate-200 text-slate-700 font-bold shadow-sm flex items-center gap-1">

                </button>
            </div>
        </header>

            <!-- Left Info & Realtime Stat Card -->
            <div class="interactive flex flex-col gap-3 w-full lg:w-80 justify-start self-start">
                
                <!-- Line Length Analysis Box -->
                <div class="glass-panel p-4 rounded-2xl shadow-sm border-t-4 border-t-rose-500">
                    <div class="flex items-center justify-between mb-3 pb-2 border-b border-slate-200">
                        <span class="text-xs font-bold text-slate-700 flex items-center gap-1.5">

                    <div class="bg-slate-900 text-emerald-400 p-3 rounded-xl border-2 border-slate-800 mb-3 shadow-inner">

                        <div class="flex items-baseline justify-between">
                            <span id="perpLengthVal" class="digital-font text-3xl font-bold text-rose-400">0.00</span>
                            <span class="text-xs font-bold text-slate-400">像素/单位</span>
                        </div>
                    </div>

                    <!-- Description Text -->
                    <div id="statExplanation" class="bg-sky-50 text-sky-800 p-2.5 rounded-xl border border-sky-200 text-xs font-bold leading-relaxed">

                <!-- 3D Camera Angles Quick Selector (Only in 3D Mode) -->
                <div id="panel3DViews" class="hidden glass-panel p-3.5 rounded-2xl shadow-sm">
                    <span class="text-xs font-bold text-slate-700 block mb-2 flex items-center gap-1.5">

                    </span>
                    <div class="grid grid-cols-3 gap-2 text-xs">
                        <button onclick="set3DView('front')" class="btn-action bg-white hover:bg-sky-50 border border-slate-200 p-2 rounded-xl font-bold text-slate-700 flex flex-col items-center gap-1">
                            <i class="fa-solid fa-border-all text-blue-500"></i> 正视图
                        </button>
                        <button onclick="set3DView('side')" class="btn-action bg-white hover:bg-sky-50 border border-slate-200 p-2 rounded-xl font-bold text-slate-700 flex flex-col items-center gap-1">
                            <i class="fa-solid fa-border-left text-amber-500"></i> 侧视图
                        </button>
                        <button onclick="set3DView('top')" class="btn-action bg-white hover:bg-sky-50 border border-slate-200 p-2 rounded-xl font-bold text-slate-700 flex flex-col items-center gap-1">
                            <i class="fa-solid fa-table-cells text-emerald-500"></i> 俯视图
                        </button>
                    </div>
                </div>
            </div>

                <div class="glass-panel p-3.5 rounded-2xl shadow-lg border border-white/80 space-y-2.5">
                    <div class="text-xs font-bold text-slate-700 mb-1 flex items-center gap-1.5 border-b border-slate-200 pb-2">
                        <i class="fa-solid fa-wand-magic-sparkles text-sky-500"></i> 探索实验操作台
                    </div>

                    <!-- Auto Shoot Lines Button -->
                    <button onclick="triggerAutoShoot()" class="btn-action w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold p-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow-md shadow-emerald-500/20">
                        <i class="fa-solid fa-paper-plane text-sm"></i>
                        <span>一键发射线段</span>
                    </button>

                    <!-- Compare Lengths Button -->
                    <button id="btnCompare" onclick="triggerCompare()" class="btn-action w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold p-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow-md shadow-indigo-500/20">
                        <i class="fa-solid fa-object-group text-sm"></i>
                        <span>一键旋转比较</span>
                    </button>

                    <!-- Restore Original Positions Button -->
                    <button id="btnRestore" onclick="triggerRestore()" class="hidden btn-action w-full bg-amber-500 hover:bg-amber-600 text-white font-bold p-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow-md shadow-amber-500/20">
                        <i class="fa-solid fa-rotate-left text-sm"></i>
                        <span>一键位置复原</span>
                    </button>

                    <!-- Randomize Line Position Button -->
                    <button onclick="triggerRandomize()" class="btn-action w-full bg-sky-500 hover:bg-sky-600 text-white font-bold p-2.5 rounded-xl text-xs flex items-center justify-center gap-2 border border-sky-300">
                        <i class="fa-solid fa-shuffle"></i>
                        <span>随机基准线位置</span>
                    </button>

                    <!-- Clear All Lines Button -->
                    <button onclick="triggerClearAll()" class="btn-action w-full bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold p-2.5 rounded-xl text-xs flex items-center justify-center gap-2 border border-rose-200">
                        <i class="fa-solid fa-trash-can"></i>
                        <span>清除所有线段</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Footer Mathematical Definition Card -->
        <footer class="w-full interactive glass-panel p-3 rounded-2xl shadow-sm flex items-center justify-between text-xs text-slate-700">
            <div class="flex items-center gap-2.5">
                <div class="bg-amber-500 text-white p-2 rounded-xl shadow-sm shrink-0">
                    <i class="fa-solid fa-lightbulb"></i>
                </div>
                <div>
                    <span class="font-black text-slate-800">数学几何公理/性质：</span>

                </div>
            </div>
        </footer>
