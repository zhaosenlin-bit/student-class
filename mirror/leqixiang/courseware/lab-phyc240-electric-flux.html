  	function RandomPointInBox(x, num, width, length) {
		let points = [];
		var stepWidth = width/num;
		var stepLength = length/num;
		for (let i = 1; i < num+1; i++) {
			 var y = stepWidth * i - 20;
			for (let j = 0; j < num; j++) {
				var z = stepLength * j;
				let point = new THREE.Vector3(x-18,y,z-8); // shift points' positions
				points.push(point);
			}
		}
		return points;
         }	
	
	function addVectorField(x,y,z){
		var direction = new THREE.Vector3( 1, 0, 0 );
		direction.normalize();
		var position = new THREE.Vector3( x, y, z );
		
		    const arrowLength = 120;
		    const headLength = 3;
		    const headWidth = 1.5;
		
		var hex = 0xffffff;
		var arrowHelper = new THREE.ArrowHelper(direction, position, arrowLength, hex, headLength, headWidth);
		scene.add( arrowHelper );
	}

    	displayVectorInfo(electricField, surfaceArea, angle);
	curve = drawCurve(center, radius, theta, 'yellow');
    }
	
function displayVectorInfo(E, A, theta) {
    // Calculate the electric flux using the formula ΦE = E • A cos(θ)
    let flux = E * A * Math.cos(theta); // Convert θ to radians for Math.cos

    // Create or update the HTML element to display the magnitudes and angles
    let infoDiv = document.getElementById('vectorInfo');
    
    // If the div doesn't exist, create it
    if (!infoDiv) {
        infoDiv = document.createElement('div');
        infoDiv.id = 'vectorInfo';
        infoDiv.style.position = 'absolute';
        infoDiv.style.top = '30px';
        infoDiv.style.right = '30px';
        infoDiv.style.padding = '30px';
        infoDiv.style.backgroundColor = 'rgba(0, 0, 0, 0.7)';
        infoDiv.style.color = 'white';
        infoDiv.style.fontFamily = 'Arial, sans-serif';
        infoDiv.style.fontSize = '14px';
        document.body.appendChild(infoDiv);
    }

    // Update the content of the div with electric flux information
    infoDiv.innerHTML = `
        <strong>Electric Flux Example:</strong><br>
        Electric Field (Eo): ${E.toFixed(2)} N/C<br>
        Surface Area (A): ${A.toFixed(2)} m²<br>
        Angle (θ): ${(theta*180/Math.PI).toFixed(2)}°<br><br>
        <strong>Electric Flux (Φe):</strong><br>
        Φe = Eo • A • cos(θ) = ${flux.toFixed(2)} N·m²/C<br>
    `;
}

function addText(x,y,z,t,color){
	fontloader.load( '/api/program-assets/lab-phyc240-electric-flux/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json', function ( tex ) {
		var  textGeo = new TextGeometry(t, {
		    size: 3,  
		    height: 0.2, 
		    curveSegments: 6,
		    font: tex,
		}); 
		var  textMaterial = new THREE.MeshBasicMaterial({color: color});  
		var textMesh = new THREE.Mesh(textGeo , textMaterial);
		textMesh.position.set(x,y,z);
		scene.add(textMesh);
	});
}	
	
function addLine(x1,y1,z1,x2,y2,z2){
	var arr = [new THREE.Vector3(x1,y1,z1),
		   new THREE.Vector3(x2,y2,z2)]; 
	var mat = new THREE.MeshBasicMaterial({color: "yellow"}); 
	var curve = new THREE.CatmullRomCurve3( arr );
	var geometry = new THREE.TubeGeometry( curve, 100, 0.2, 36, false ); 
	var  str = new THREE.Mesh(geometry, mat);
	surface.add(str);
	return str;
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);

    rainbowLights.forEach(light => {

	    // If the light goes too far, wrap it back

    });

    controls.update();
    renderer.render(scene, camera);
