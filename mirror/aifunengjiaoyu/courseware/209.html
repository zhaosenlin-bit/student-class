<!DOCTYPE html>
<html lang="zh">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>抢答大作战 · 人体内物质的运输</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(145deg, #0f1a2b 0%, #1f3048 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 20px;
            transition: filter 0.1s;
        }

        body.shake {
            animation: screenShake 0.25s ease-in-out;
        }

        @keyframes screenShake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-6px, 4px); }
            40% { transform: translate(5px, -6px); }
            60% { transform: translate(-4px, 3px); }
            80% { transform: translate(3px, -2px); }
            100% { transform: translate(0, 0); }
        }

        .flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, rgba(255, 200, 100, 0.25), transparent 70%);
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 999;
        }
        .flash-overlay.active {
            opacity: 1;
        }

        .game-container {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 28px 24px 32px;
            box-shadow: 0 30px 40px -15px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 215, 100, 0.15);
            position: relative;
            z-index: 10;
        }

        /* 连击奖励区域 */
        .combo-area {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .combo-badge {
            background: #2d1f2e;
            padding: 6px 24px;
            border-radius: 60px;
            border: 1px solid #f9c74f;
            box-shadow: 0 0 18px #f9c74f66;
            color: #f9c74f;
            font-weight: 700;
            font-size: 1.4rem;
            letter-spacing: 2px;
            backdrop-filter: blur(4px);
        }
        .combo-badge span {
            background: #f9c74f;
            padding: 0 14px;
            border-radius: 40px;
            color: #1a1a2c;
        }
        .bonus-indicator {
            font-size: 1.1rem;
            background: #f8961e;
            color: #1a1a2c;
            padding: 4px 18px;
            border-radius: 40px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 0 12px #f8961e;
        }
        .bonus-indicator.show {
            opacity: 1;
        }

        /* 双英雄区域 ———— 两个玩家各自独立卡片 */
        .fighters-area {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
            position: relative;
        }

        .fighter-card {
            flex: 1 1 240px;
            min-width: 180px;
            background: linear-gradient(145deg, #17273b, #0e1a2a);
            border-radius: 40px;
            padding: 16px 16px 12px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 215, 0, 0.15);
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(2px);
            position: relative;
            overflow: hidden;
        }

        .fighter-card.player1 {
            border-color: #5bc0eb;
            box-shadow: 0 0 20px #5bc0eb33;
        }
        .fighter-card.player2 {
            border-color: #f25f5c;
            box-shadow: 0 0 20px #f25f5c33;
        }

        /* ---- 技能特效层 ---- */
        .skill-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 40px;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transform: scale(0.6);
        }
        .skill-effect.p1-skill {
            background: radial-gradient(circle at 50% 50%, rgba(255, 215, 0, 0.75) 0%, rgba(255, 180, 50, 0.4) 40%, transparent 75%);
            animation: skillBurstP1 0.9s ease-out forwards;
        }
        .skill-effect.p2-skill {
            background: radial-gradient(circle at 50% 50%, rgba(180, 50, 255, 0.75) 0%, rgba(130, 30, 200, 0.45) 40%, transparent 75%);
            animation: skillBurstP2 0.9s ease-out forwards;
        }

        @keyframes skillBurstP1 {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(0deg);
            }
            30% {
                opacity: 1;
                transform: scale(1.2) rotate(20deg);
            }
            60% {
                opacity: 0.9;
                transform: scale(1.5) rotate(-10deg);
            }
            100% {
                opacity: 0;
                transform: scale(1.8) rotate(0deg);
            }
        }

        @keyframes skillBurstP2 {
            0% {
                opacity: 0;
                transform: scale(0.2) rotate(0deg);
            }
            25% {
                opacity: 1;
                transform: scale(0.8) rotate(120deg);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.3) rotate(240deg);
            }
            80% {
                opacity: 0.4;
                transform: scale(1.6) rotate(320deg);
            }
            100% {
                opacity: 0;
                transform: scale(2.0) rotate(360deg);
            }
        }

        /* ---- 卡片跳跃 ---- */
        .fighter-card.jump {
            animation: cardJump 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @keyframes cardJump {
            0% {
                transform: translateY(0);
            }
            25% {
                transform: translateY(-28px) scale(1.04);
            }
            50% {
                transform: translateY(-32px) scale(1.06);
            }
            70% {
                transform: translateY(-12px) scale(1.02);
            }
            100% {
                transform: translateY(0) scale(1);
            }
        }

        /* ---- 卡片颤抖（受击） ---- */
        .fighter-card.shake {
            animation: cardShake 0.5s ease-in-out forwards;
        }
        @keyframes cardShake {
            0% {
                transform: translateX(0) rotate(0deg);
            }
            12% {
                transform: translateX(-10px) rotate(-3deg);
            }
            25% {
                transform: translateX(10px) rotate(3deg);
            }
            37% {
                transform: translateX(-8px) rotate(-2deg);
            }
            50% {
                transform: translateX(8px) rotate(2deg);
            }
            62% {
                transform: translateX(-5px) rotate(-1deg);
            }
            75% {
                transform: translateX(5px) rotate(1deg);
            }
            87% {
                transform: translateX(-2px) rotate(0deg);
            }
            100% {
                transform: translateX(0) rotate(0deg);
            }
        }

        .fighter-avatar {
            font-size: 3.8rem;
            line-height: 1;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.6));
            margin-bottom: 2px;
            position: relative;
            z-index: 1;
            transition: transform 0.2s;
        }
        .fighter-name {
            font-weight: 800;
            font-size: 1.4rem;
            color: white;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px black;
            margin: 2px 0 2px;
            position: relative;
            z-index: 1;
        }
        .fighter-sub {
            font-size: 0.8rem;
            opacity: 0.7;
            color: #ccc;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
        }

        .hp-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            margin: 4px 0 2px;
            position: relative;
            z-index: 1;
        }
        .hp-bar-bg {
            flex: 1;
            height: 20px;
            background: #1e1e2a;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.7);
        }
        .hp-fill {
            height: 100%;
            width: 100%;
            border-radius: 40px;
            transition: width 0.25s ease;
        }
        .player1 .hp-fill {
            background: linear-gradient(90deg, #43aa8b, #90be6d);
            box-shadow: 0 0 12px #43aa8baa;
        }
        .player2 .hp-fill {
            background: linear-gradient(90deg, #f94144, #f3722c);
            box-shadow: 0 0 12px #f94144aa;
        }
        .hp-text {
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            min-width: 56px;
            text-align: center;
            background: rgba(0, 0, 0, 0.5);
            padding: 2px 8px;
            border-radius: 40px;
        }

        .vs-divider {
            font-size: 2.2rem;
            font-weight: 800;
            background: #f9c74f;
            color: #1a1a2c;
            padding: 4px 16px;
            border-radius: 60px;
            box-shadow: 0 4px 0 #b5832f;
            transform: rotate(2deg) scale(0.9);
            flex-shrink: 0;
            align-self: center;
            text-shadow: 0 1px 0 white;
        }

        /* 抢答面板 */
        .buzz-panel {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 12px 0 10px;
            flex-wrap: wrap;
        }
        .buzz-btn {
            background: #2b3d54;
            border: none;
            border-radius: 80px;
            padding: 16px 40px;
            font-size: 1.8rem;
            font-weight: 800;
            color: white;
            box-shadow: 0 8px 0 #141e2b, 0 12px 24px rgba(0, 0, 0, 0.5);
            transition: all 0.06s linear;
            cursor: pointer;
            letter-spacing: 2px;
            border: 2px solid #4b6589;
            min-width: 160px;
        }
        .buzz-btn:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #141e2b;
        }
        .buzz-btn:disabled {
            opacity: 0.5;
            filter: grayscale(0.6);
            transform: translateY(6px);
            box-shadow: 0 2px 0 #141e2b;
            cursor: not-allowed;
        }
        .buzz-btn.player1-buzz {
            border-color: #5bc0eb;
            background: #1f4b6e;
        }
        .buzz-btn.player2-buzz {
            border-color: #f25f5c;
            background: #6e2a2a;
        }
        .buzz-btn:hover:not(:disabled) {
            transform: scale(1.04);
            border-color: #f9c74f;
            box-shadow: 0 8px 0 #141e2b, 0 0 28px #f9c74f77;
        }

        /* 题目面板 */
        .question-panel {
            background: rgba(10, 18, 30, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 40px;
            padding: 20px 24px;
            margin: 8px 0 14px;
            border: 1px solid rgba(255, 215, 100, 0.2);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        }
        .question-text {
            color: #f8f9fa;
            font-size: 1.6rem;
            font-weight: 600;
            line-height: 1.3;
            text-align: center;
            word-break: break-word;
            padding: 4px 0 8px;
            text-shadow: 0 2px 6px black;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin: 14px 0 6px;
        }

        .option-btn {
            background: #2b3d54;
            border: none;
            border-radius: 60px;
            padding: 14px 8px;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            box-shadow: 0 6px 0 #141e2b, 0 8px 16px rgba(0, 0, 0, 0.5);
            transition: all 0.08s linear;
            cursor: pointer;
            letter-spacing: 0.5px;
            border: 1px solid #4b6589;
        }
        .option-btn:disabled {
            opacity: 0.5;
            filter: grayscale(0.5);
            cursor: not-allowed;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #141e2b;
        }
        .option-btn:hover:not(:disabled) {
            transform: scale(1.02);
            background: #3f5a7a;
            border-color: #f9c74f;
            box-shadow: 0 6px 0 #141e2b, 0 0 18px #f9c74f77;
        }
        .option-btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #141e2b;
        }
        .correct-feedback {
            background: #2d6a4f !important;
            border-color: #95d5b2 !important;
            box-shadow: 0 0 25px #40916c !important;
        }
        .wrong-feedback {
            background: #9b2226 !important;
            border-color: #f25f5c !important;
            box-shadow: 0 0 25px #c1121f !important;
        }

        /* 正确答案高亮提示 */
        .correct-answer-highlight {
            background: #1e4d3a !important;
            border-color: #52b788 !important;
            box-shadow: 0 0 30px #40916c !important;
            color: #fff !important;
        }

        .explain-box {
            background: #1e2a3a;
            border-radius: 40px;
            padding: 14px 22px;
            margin: 14px 0 2px;
            color: #e0e7f0;
            font-size: 1.05rem;
            border-left: 6px solid #f9c74f;
            display: none;
            font-weight: 500;
            transition: all 0.2s;
        }
        .explain-box.show {
            display: block;
        }
        .explain-box .correct-answer-label {
            color: #95d5b2;
            font-weight: 700;
            font-size: 1.15rem;
            display: block;
            margin-bottom: 6px;
            background: rgba(45, 106, 79, 0.3);
            padding: 6px 14px;
            border-radius: 30px;
            border-left: 4px solid #52b788;
        }

        /* 日志 */
        .log-area {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            border-radius: 30px;
            padding: 14px 22px;
            margin-top: 14px;
            border: 1px solid #3a4c62;
            max-height: 110px;
            overflow-y: auto;
            color: #d3dcec;
            font-size: 0.95rem;
            line-height: 1.5;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.6);
        }
        .log-entry {
            padding: 3px 0;
            border-bottom: 1px solid #2a3a4e;
        }
        .log-entry:last-child {
            border-bottom: none;
        }
        .log-hero {
            color: #8fd6bd;
        }
        .log-enemy {
            color: #f4a2a0;
        }
        .log-system {
            color: #f9c74f;
            font-weight: 600;
        }

        .gameover-msg {
            text-align: center;
            font-size: 1.7rem;
            font-weight: 800;
            padding: 10px 0 2px;
            background: linear-gradient(135deg, #f9c74f, #f8961e);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px #f9c74f55;
        }

        .reset-btn {
            background: #f9c74f;
            border: none;
            border-radius: 60px;
            padding: 10px 30px;
            font-weight: 700;
            font-size: 1.2rem;
            color: #1a1a2c;
            box-shadow: 0 6px 0 #b5832f;
            cursor: pointer;
            transition: 0.07s;
            display: inline-block;
            margin: 8px auto 0;
            border: 1px solid #ffe599;
        }
        .reset-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #b5832f;
        }
        .footer-center {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .log-area::-webkit-scrollbar {
            width: 6px;
        }
        .log-area::-webkit-scrollbar-track {
            background: #1a2639;
            border-radius: 20px;
        }
        .log-area::-webkit-scrollbar-thumb {
            background: #f9c74f;
            border-radius: 20px;
        }

        .turn-indicator {
            text-align: center;
            font-size: 1.2rem;
            color: #f9c74f;
            background: #1e2a3a;
            border-radius: 40px;
            padding: 4px 16px;
            display: inline-block;
            margin: 0 auto 8px;
            border: 1px solid #f9c74f44;
        }

        @media (max-width: 650px) {
            .game-container {
                padding: 16px 10px;
            }
            .question-text {
                font-size: 1.3rem;
            }
            .option-btn {
                font-size: 1rem;
                padding: 12px 6px;
            }
            .vs-divider {
                font-size: 1.8rem;
                padding: 2px 12px;
            }
            .fighter-avatar {
                font-size: 3rem;
            }
            .buzz-btn {
                font-size: 1.4rem;
                padding: 12px 20px;
                min-width: 120px;
            }
        }
    </style>
</head>

    <div class="flash-overlay" id="flashOverlay"></div>

    <div class="game-container">
        <!-- 连击奖励 -->
        <div class="combo-area">
            <div class="combo-badge">🔥 连击 <span id="comboCount">0</span></div>
            <div class="bonus-indicator" id="bonusIndicator">⚡ 奖励伤害 +5</div>
        </div>

        <!-- 双英雄卡片：玩家1 & 玩家2 -->
        <div class="fighters-area">
            <div class="fighter-card player1" id="cardP1">

                <div class="skill-effect" id="skillP1"></div>
                <div class="fighter-avatar">🦸</div>
                <div class="fighter-name">知识勇者</div>
                <div class="fighter-sub">⚡ 玩家1 · 圣光冲击</div>
                <div class="hp-wrapper">
                    <div class="hp-bar-bg">
                        <div id="heroHpFill" class="hp-fill" style="width: 100%"></div>
                    </div>
                    <span class="hp-text" id="heroHpText">100/100</span>
                </div>
            </div>

            <div class="vs-divider">⚔️ VS ⚔️</div>

            <div class="fighter-card player2" id="cardP2">
                <!-- 技能特效层 -->
                <div class="skill-effect" id="skillP2"></div>
                <div class="fighter-avatar">👾</div>
                <div class="fighter-name">暗影智者</div>
                <div class="fighter-sub">🌪️ 玩家2 · 暗影侵袭</div>
                <div class="hp-wrapper">
                    <div class="hp-bar-bg">
                        <div id="enemyHpFill" class="hp-fill" style="width: 100%"></div>
                    </div>
                    <span class="hp-text" id="enemyHpText">100/100</span>
                </div>
            </div>
        </div>

        <!-- 抢答按钮区域 -->
        <div class="buzz-panel" id="buzzPanel">
            <button class="buzz-btn player1-buzz" id="buzzP1">🔔 玩家1抢答</button>
            <button class="buzz-btn player2-buzz" id="buzzP2">🔔 玩家2抢答</button>

        <!-- 题目区域 -->
        <div class="question-panel">

            <div id="explainBox" class="explain-box"></div>
        </div>

        <!-- 战斗日志 -->
        <div class="log-area" id="logArea">

        <!-- 重置 & 游戏结束信息 -->
        <div class="footer-center">
            <button class="reset-btn" id="resetGameBtn">🔄 重新挑战</button>
        </div>
