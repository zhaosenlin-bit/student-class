	<div id="info" style="text-align: left"> 
		
	     <button class="btn btn-warning" onclick="
    alert(
        'J.J. Thomson\'s Charge-to-Mass Ratio Experiment (1897) measured the ratio of an electron\'s charge to its mass (e/m) using cathode rays. By applying electric and magnetic fields, he determined that electrons are much lighter than atoms, leading to the discovery of the electron as a fundamental particle.\n\n' +

        'Experimental Setup:\n' +
        '- A pair of Helmholtz coils was used to create a uniform magnetic field around the electron beam.\n' +
        '- The electron gun emitted electrons that traveled perpendicular to the magnetic field, ensuring circular motion.\n' +
        '- The goal was to keep the magnetic field uniform within 1% over the electron orbit.\n\n' +

        'Mathematical Derivation:\n' +
        '1. The kinetic energy gained by an electron accelerating through a potential Va:\n' +
        '   (1/2) mv² = eVa\n\n' +

        '2. The magnetic force acting on the moving electron:\n' +
        '   F = ev × B\n' +
        '   This force acts as the centripetal force causing circular motion:\n' +
        '   m(v² / r) = evB\n'
    );

    alert(
        '3. Solving for the charge-to-mass ratio (e/m):\n' +
        '   e/m = v / (rB)\n' +
        '   Substituting v from kinetic energy:\n' +
        '   v = sqrt(2eVa / m)\n' +
        '   e/m = (2Va) / (r² B²)\n\n' +

        '4. Using the Biot-Savart law, the magnetic field B for Helmholtz coils is given by:\n' +
        '   B = (8 / sqrt(125)) * (µ0 * N * I / a)\n\n' + ' where a is the radius of each coil\n\n' +

        '5. Final expression for e/m in terms of experimental parameters:\n' +
        '   e/m = (125 / 32) * (Va / [(µ0 * N * I)² * a² * r²])\n\n' +

        'This experiment helped confirm that electrons have a much smaller mass compared to atoms, revolutionizing atomic physics.'
    );
">
    What is J.J. Thomson's Charge-to-Mass Ratio Experiment?
</button><br>
