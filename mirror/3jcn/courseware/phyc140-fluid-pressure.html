<body>
	<div id="info" > 
		<h1 style="text-align: center">Pressure in a Static Fluid</h1>
		<div class="control-panel">
			<div class="control-group">
			  Change Sensor Position (m):
			  <div class="slider-row" style="display: flex; align-items: center;">
			    <input type="range" id="gaugePos" min="-10" max="20" step="0.5" value="-5" style="flex: 1; margin-right: 8px;">
			    <input type="text" id="posValue" value="-5" readonly style="width: 80px; text-align: center; color: blue; font-weight: bold;">
			  </div>
			  <div class="minmax" style="display: flex; justify-content: space-between; margin-top: 4px;">
			    <span>-10</span>
			    <span>20</span>
			  </div>
			</div> 
		  <div class="control-group">
			  Fluid Depth:
		    <input type="text" id="fluidDepth" value="20 m" readonly style="width: 90px;">
		  </div>
		  <div class="control-group">
  		    Gauge Pressure in:   <br><br>
			  Air:
		    <input type="text" id="airGauge" value="240.3 Pa" readonly style="width: 90px;">
		  </div>
		  <div class="control-group">
		    Water:   
		    <input type="text" id="waterGauge" value="196200.0 Pa" readonly style="width: 90px;">
		  </div>
		  <div class="control-group">
		    Mercury:   
		    <input type="text" id="mercuryGauge" value="2657725.2 Pa" readonly style="width: 90px;">
		  </div>
		  <div class="control-group">
		    Unknown:   
		    <input type="text" id="unknownGauge" value="156960.0 Pa" readonly style="width: 90px;">
		  </div>
			
			<button class="btn btn-success" onclick="
			  alert(
			    '🔵 What is Pressure?\n\n' +
			    'Pressure is the force applied per unit area.\n' +
			    'Formula: P = F / A\n\n' +
			    'There are two main types of pressure:\n\n' +
			    '1️⃣ Gauge Pressure:\n' +
			    '   - Measured relative to atmospheric pressure.\n' +
			    '   - Formula: P_gauge = ρ · g · h\n' +
			    '   - It is zero at the surface of the fluid (open to atmosphere).\n\n' +
			    '2️⃣ Absolute Pressure:\n' +
			    '   - Measured relative to a perfect vacuum.\n' +
			    '   - Formula: P_absolute = P_atm + P_gauge\n\n' +
			    'Constants used in simulation:\n' +
			    '   - g = 9.81 m/s² (gravitational acceleration)\n' +
			    '   - P_atm = 101325 Pa (standard atmospheric pressure)\n' +
			    '   - ρ_air = 1.225 kg/m³\n' +
			    '   - ρ_water = 1000 kg/m³\n' +
			    '   - ρ_mercury = 13546 kg/m³\n' +
			    '   - ρ_unknown = 800 kg/m³\n\n' +
			    '📌 Note:\n' +
			    '   - Absolute pressure is always positive.\n' +
			    '   - Gauge pressure is zero at fluid surface, positive below, and not defined above atmosphere.'
			  );
			">
			  What is Pressure?
			</button>
		</div>
		<div class="control-panel-right">	
		  <div class="control-group">
  		    Absolute Pressure in: <br><br>
		    Air:   
		    <input type="text" id="airAbs" value="101565.3 Pa" readonly style="width: 90px;">
		  </div>
		  <div class="control-group">
		    Water:   
		    <input type="text" id="waterAbs" value="297765.3 Pa" readonly style="width: 90px;">
		  </div>
		  <div class="control-group">
		    Mercury:   
		    <input type="text" id="mercuryAbs" value="2759290.5 Pa" readonly style="width: 90px;">
		  </div>
		  <div class="control-group">
		    Unknown:   
		    <input type="text" id="unknownAbs" value="258525.3 Pa" readonly style="width: 90px;">
		  </div>
			<button class="btn btn-danger" id="reset">Reset</button>
			
		</div>
	</div>
	<div id="viewport"></div>
</body>
</html>
