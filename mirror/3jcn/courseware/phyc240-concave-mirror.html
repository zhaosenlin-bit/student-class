<style>
/* =========================================
   CONCAVE MIRROR INFORMATION PANEL
   Same style as Convex Mirror
========================================= */

#info {
    position: fixed;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    z-index: 1000;

    width: max-content;
    max-width: calc(100vw - 24px);
    margin: 0;
    padding: 0;

    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

/* Main horizontal panel */
#info .lens-panel {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;

    column-gap: 18px;
    row-gap: 12px;
    padding: 12px 16px;

    background: rgba(255, 255, 255, 0.96);
    border: 2px solid #0879a3;
    border-radius: 12px;

    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    color: #17324d;

    max-width: 100%;
    box-sizing: border-box;
}

/* =========================================
   TITLE AND INSTRUCTIONS
========================================= */

#info .panel-title {
    flex: 0 1 220px;
    min-width: 180px;
    max-width: 240px;

    text-align: center;
    box-sizing: border-box;
}

#info .panel-title h3 {
    margin: 0 0 6px;
    font-size: 17px;
    font-weight: 700;
    color: #075c83;
}

#info .focal-length {
    margin: 0 0 5px;
    font-size: 15px;
    font-weight: 700;
    line-height: 1.35;
}

#info .lens-instruction {
    font-size: 12px;
    line-height: 1.4;
    color: #34495e;
    overflow-wrap: break-word;
}

#info .sign-convention {
    margin: 5px 0 0;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.35;
    color: #075c83;
    text-align: center;
}

/* =========================================
   OBJECT AND IMAGE GROUPS
========================================= */

#info .lens-group {
    display: flex;
    flex-direction: column;
    flex: 0 1 auto;

    gap: 7px;
    min-width: 0;
    max-width: 100%;

    box-sizing: border-box;
}

#info .lens-group-title {
    margin: 0 0 3px;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.3;
    text-align: center;
    color: #17324d;
}

/* =========================================
   MEASUREMENT LABELS AND INPUTS
========================================= */

#info .lens-row {
    display: grid;
    grid-template-columns:
        34px 82px
        34px 82px;

    align-items: center;
    justify-content: center;

    column-gap: 7px;
    row-gap: 7px;

    min-width: 0;
    max-width: 100%;
}

#info .lens-row label {
    display: block;
    margin: 0;
    padding: 0;

    font-size: 15px;
    font-weight: 700;
    line-height: 1.3;
    text-align: right;
    white-space: nowrap;

    color: #17324d;
}

#info .lens-row input {
    display: block;

    width: 100%;
    min-width: 0;
    height: 34px;

    padding: 5px 4px;
    margin: 0;

    border: 1px solid #aebdc8;
    border-radius: 5px;

    font-size: 14px;
    font-weight: 700;
    text-align: center;
    color: #123;

    box-sizing: border-box;
}

/* Object values: green */
#info .object-value {
    background: #d9f5df;
}

/* Image values: light orange */
#info .image-value {
    background: #fff0cc;
}

/* Correct subscript formatting */
#info sub {
    font-size: 72%;
    vertical-align: sub;
    line-height: 0;
}

/* =========================================
   MEDIUM SCREENS
========================================= */

@media (max-width: 900px) {

    #info {
        bottom: 10px;
        max-width: calc(100vw - 20px);
    }

    #info .lens-panel {
        column-gap: 14px;
        row-gap: 10px;
        padding: 10px 12px;
    }

    #info .panel-title {
        flex: 0 1 200px;
        min-width: 160px;
    }

    #info .lens-row {
        grid-template-columns:
            30px 75px
            30px 75px;
        column-gap: 5px;
    }

    #info .lens-row input {
        font-size: 13px;
    }
}

/* =========================================
   MOBILE SCREENS
========================================= */

@media (max-width: 650px) {

    #info {
        bottom: 8px;
        width: calc(100vw - 16px);
        max-width: none;
    }

    #info .lens-panel {
        flex-direction: column;
        flex-wrap: nowrap;
        align-items: stretch;

        gap: 9px;
        padding: 10px 12px;

        max-height: 42vh;
        overflow-y: auto;
        overflow-x: hidden;
    }

    #info .panel-title {
        flex: 0 0 auto;
        width: 100%;
        min-width: 0;
        max-width: none;
    }

    #info .panel-title h3 {
        font-size: 16px;
    }

    #info .lens-group {
        flex: 0 0 auto;
        width: 100%;
        min-width: 0;
    }

    #info .lens-group-title {
        font-size: 15px;
    }

    #info .lens-row {
        grid-template-columns:
            32px minmax(0, 1fr)
            32px minmax(0, 1fr);

        column-gap: 6px;
        width: 100%;
    }

    #info .lens-row label {
        font-size: 14px;
    }

    #info .lens-row input {
        height: 32px;
        font-size: 13px;
    }
}

/* =========================================
   VERY SMALL SCREENS
========================================= */

@media (max-width: 360px) {

    #info .lens-panel {
        padding: 8px;
    }

    #info .lens-row {
        grid-template-columns:
            26px minmax(0, 1fr)
            26px minmax(0, 1fr);

        column-gap: 4px;
    }

    #info .lens-row label {
        font-size: 12px;
    }

    #info .lens-row input {
        font-size: 12px;
        padding: 4px 2px;
    }
}

<body>


<div id="info">
    <div class="lens-panel">

        <!-- TITLE AND INSTRUCTIONS -->
        <div class="panel-title">

            <div class="focal-length">
                Focal Length: f = +20 cm
            </div>

            <div class="lens-instruction">
                Drag the object (pencil) to observe
                the position and size of its image.
            </div>

            <div class="sign-convention">
                Spherical Mirror Approximation |
                Gaussian Sign Convention
            </div>

        </div>

        <!-- OBJECT MEASUREMENTS -->
        <div class="lens-group">

            <div class="lens-group-title">
                Object
            </div>

            <div class="lens-row">

                <label for="do">
                    d<sub>o</sub> =
                </label>

                <input
                    type="text"
                    id="do"
                    class="object-value"
                    value="40 cm"
                    readonly
                >

                <label for="ho">
                    h<sub>o</sub> =
                </label>

                <input
                    type="text"
                    id="ho"
                    class="object-value"
                    value="9 cm"
                    readonly
                >

            </div>

        </div>

        <!-- IMAGE MEASUREMENTS -->
        <div class="lens-group">

            <div class="lens-group-title">
                Image
            </div>

            <div class="lens-row">

                <label for="di">
                    d<sub>i</sub> =
                </label>

                <input
                    type="text"
                    id="di"
                    class="image-value"
                    value="40 cm"
                    readonly
                >

                <label for="hi">
                    h<sub>i</sub> =
                </label>

                <input
                    type="text"
                    id="hi"
                    class="image-value"
                    value="9 cm"
                    readonly
                >

            </div>

        </div>

    </div>
</div>

<div id="viewport"></div>

</body>
