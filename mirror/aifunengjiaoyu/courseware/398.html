  &lt;div class=&quot;flex flex-col md:flex-row h-screen&quot;&gt;
    
    &lt;!-- 左侧控制面板 --&gt;
    &lt;div class=&quot;w-full md:w-1/3 lg:w-1/4 bg-white shadow-xl z-10 flex flex-col h-full&quot;&gt;
      &lt;div class=&quot;p-6 border-b border-gray-100&quot;&gt;
        &lt;h1 class=&quot;text-2xl font-bold text-gray-800 mb-2&quot;&gt;里海的形成&lt;/h1&gt;
        &lt;p class=&quot;text-sm text-gray-500&quot;&gt;从古地中海到世界最大内陆湖的演变&lt;/p&gt;
      &lt;/div&gt;
      
      &lt;!-- 阶段说明区 --&gt;
      &lt;div class=&quot;flex-1 overflow-y-auto p-6 relative&quot;&gt;
        &lt;!-- 垂直指示线 --&gt;
        &lt;div class=&quot;absolute left-8 top-8 bottom-8 w-0.5 bg-gray-200 -z-10&quot;&gt;&lt;/div&gt;
        
        &lt;!-- 步骤 1 --&gt;
        &lt;div class=&quot;step-card relative pl-8 pb-8&quot; id=&quot;step-0&quot;&gt;
          &lt;div class=&quot;indicator absolute left-[-5px] top-1 w-3 h-3 rounded-full bg-blue-500 border-4 border-white shadow box-content transition-all duration-300&quot;&gt;&lt;/div&gt;
          &lt;h3 class=&quot;font-bold text-blue-600 text-lg transition-colors duration-300&quot;&gt;1. 古地中海时期&lt;/h3&gt;
          &lt;p class=&quot;text-sm text-gray-600 mt-2 leading-relaxed&quot;&gt;数千万年前，里海、黑海和地中海曾是广阔的古地中海（特提斯海）的一部分，与大洋相连，水域辽阔。&lt;/p&gt;
        &lt;/div&gt;
        
        &lt;!-- 步骤 2 --&gt;
        &lt;div class=&quot;step-card relative pl-8 pb-8 opacity-50&quot; id=&quot;step-1&quot;&gt;
          &lt;div class=&quot;indicator absolute left-[-5px] top-1 w-3 h-3 rounded-full bg-gray-300 border-4 border-white shadow box-content transition-all duration-300&quot;&gt;&lt;/div&gt;
          &lt;h3 class=&quot;font-bold text-gray-500 text-lg transition-colors duration-300&quot;&gt;2. 板块挤压&lt;/h3&gt;
          &lt;p class=&quot;text-sm text-gray-600 mt-2 leading-relaxed&quot;&gt;随着阿拉伯板块和印度板块向北移动，与欧亚板块发生强烈碰撞，古地中海受到挤压，面积开始逐渐缩小。&lt;/p&gt;
        &lt;/div&gt;
        
        &lt;!-- 步骤 3 --&gt;
        &lt;div class=&quot;step-card relative pl-8 pb-8 opacity-50&quot; id=&quot;step-2&quot;&gt;
          &lt;div class=&quot;indicator absolute left-[-5px] top-1 w-3 h-3 rounded-full bg-gray-300 border-4 border-white shadow box-content transition-all duration-300&quot;&gt;&lt;/div&gt;
          &lt;h3 class=&quot;font-bold text-gray-500 text-lg transition-colors duration-300&quot;&gt;3. 山脉隆起&lt;/h3&gt;
          &lt;p class=&quot;text-sm text-gray-600 mt-2 leading-relaxed&quot;&gt;强烈的地壳运动导致高加索山脉、厄尔布尔士山脉等相继隆起，横亘在水域中间，古地中海面临被分割的命运。&lt;/p&gt;
        &lt;/div&gt;
        
        &lt;!-- 步骤 4 --&gt;
        &lt;div class=&quot;step-card relative pl-8 opacity-50&quot; id=&quot;step-3&quot;&gt;
          &lt;div class=&quot;indicator absolute left-[-5px] top-1 w-3 h-3 rounded-full bg-gray-300 border-4 border-white shadow box-content transition-all duration-300&quot;&gt;&lt;/div&gt;
          &lt;h3 class=&quot;font-bold text-gray-500 text-lg transition-colors duration-300&quot;&gt;4. 湖海分离&lt;/h3&gt;
          &lt;p class=&quot;text-sm text-gray-600 mt-2 leading-relaxed&quot;&gt;约1.1万年前，里海与黑海完全分离，成为一个封闭的巨大内陆湖泊。其轮廓演变至今，成为世界最大的内陆湖。&lt;/p&gt;

          &lt;button id=&quot;playBtn&quot; class=&quot;bg-blue-600 hover:bg-blue-700 text-white px-5 py-2.5 rounded-lg transition-all shadow-md hover:shadow-lg flex items-center gap-2 font-medium&quot;&gt;
            &lt;svg class=&quot;w-5 h-5&quot; fill=&quot;currentColor&quot; viewBox=&quot;0 0 20 20&quot;&gt;&lt;path d=&quot;M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z&quot; clip-rule=&quot;evenodd&quot; fill-rule=&quot;evenodd&quot;&gt;&lt;/path&gt;&lt;/svg&gt;

          &lt;/div&gt;
        &lt;/div&gt;
        &lt;input type=&quot;range&quot; id=&quot;timeSlider&quot; min=&quot;0&quot; max=&quot;100&quot; step=&quot;0.5&quot; value=&quot;0&quot; class=&quot;w-full&quot;&gt;
      &lt;/div&gt;

    &lt;div class=&quot;w-full md:w-2/3 lg:w-3/4 relative bg-[#E8DAB2]&quot; id=&quot;canvas-container&quot;&gt;
      &lt;!-- p5.js canvas 将注入到这里 --&gt;
      
      &lt;!-- 图例 --&gt;
      &lt;div class=&quot;absolute bottom-6 right-6 bg-white/90 backdrop-blur-sm p-4 rounded-xl shadow-lg border border-white/50&quot;&gt;
        &lt;h4 class=&quot;text-sm font-bold text-gray-700 mb-2&quot;&gt;图例&lt;/h4&gt;
        &lt;div class=&quot;flex flex-col gap-2 text-xs text-gray-600&quot;&gt;
          &lt;div class=&quot;flex items-center gap-2&quot;&gt;
            &lt;div class=&quot;w-4 h-4 bg-[#3498DB] rounded&quot;&gt;&lt;/div&gt;
            &lt;span&gt;水域 (海洋/湖泊)&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;flex items-center gap-2&quot;&gt;
            &lt;div class=&quot;w-4 h-4 bg-[#E8DAB2] rounded border border-gray-300&quot;&gt;&lt;/div&gt;
            &lt;span&gt;陆地&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;flex items-center gap-2&quot;&gt;
            &lt;div class=&quot;w-4 h-4 bg-[#8B5A2B] rounded&quot;&gt;&lt;/div&gt;
            &lt;span&gt;隆起的山脉&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;flex items-center gap-2&quot;&gt;
            &lt;div class=&quot;w-4 h-1 bg-[#E74C3C]&quot;&gt;&lt;/div&gt;
            &lt;span&gt;板块运动方向&lt;/span&gt;

  &lt;!-- 交互逻辑与 p5.js 绘图 --&gt;
  &lt;script&gt;
    // --- UI 控制逻辑 ---
    let isPlaying = false;
    let playInterval;
    const slider = document.getElementById('timeSlider');
    const playBtn = document.getElementById('playBtn');
    const playBtnText = playBtn.querySelector('span');
    const timeLabel = document.getElementById('timeLabel');
    const steps = [
      document.getElementById('step-0'),
      document.getElementById('step-1'),
      document.getElementById('step-2'),
      document.getElementById('step-3')
    ];

    const playIcon = `&lt;svg class=&quot;w-5 h-5&quot; fill=&quot;currentColor&quot; viewBox=&quot;0 0 20 20&quot;&gt;&lt;path d=&quot;M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z&quot; clip-rule=&quot;evenodd&quot; fill-rule=&quot;evenodd&quot;&gt;&lt;/path&gt;&lt;/svg&gt;`;
    const pauseIcon = `&lt;svg class=&quot;w-5 h-5&quot; fill=&quot;currentColor&quot; viewBox=&quot;0 0 20 20&quot;&gt;&lt;path fill-rule=&quot;evenodd&quot; d=&quot;M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z&quot; clip-rule=&quot;evenodd&quot;&gt;&lt;/path&gt;&lt;/svg&gt;`;
    const replayIcon = `&lt;svg class=&quot;w-5 h-5&quot; fill=&quot;currentColor&quot; viewBox=&quot;0 0 20 20&quot;&gt;&lt;path fill-rule=&quot;evenodd&quot; d=&quot;M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z&quot; clip-rule=&quot;evenodd&quot;&gt;&lt;/path&gt;&lt;/svg&gt;`;

    function updateUI() {
      let val = parseFloat(slider.value);
      
      // 更新时间标签
      if (val &lt; 25) timeLabel.innerText = &quot;距今数千万年&quot;;
      else if (val &lt; 50) timeLabel.innerText = &quot;距今约2000万年&quot;;
      else if (val &lt; 75) timeLabel.innerText = &quot;距今约500万年&quot;;
      else timeLabel.innerText = &quot;距今1.1万年至今&quot;;
      
      // 更新步骤高亮
      let currentStep = Math.min(3, Math.floor(val / 25));
      if (val === 100) currentStep = 3;
      
      steps.forEach((step, index) =&gt; {
        const dot = step.querySelector('.indicator');
        const title = step.querySelector('h3');
        if (index === currentStep) {
          step.style.opacity = &quot;1&quot;;
          dot.className = &quot;indicator absolute left-[-5px] top-1 w-3 h-3 rounded-full bg-blue-500 border-4 border-white shadow box-content transition-all duration-300 scale-125&quot;;
          title.className = &quot;font-bold text-blue-600 text-lg transition-colors duration-300&quot;;
        } else {
          step.style.opacity = &quot;0.5&quot;;
          dot.className = &quot;indicator absolute left-[-5px] top-1 w-3 h-3 rounded-full bg-gray-300 border-4 border-white shadow box-content transition-all duration-300&quot;;
          title.className = &quot;font-bold text-gray-500 text-lg transition-colors duration-300&quot;;
        }
      });
    }

    slider.addEventListener('input', updateUI);

    playBtn.addEventListener('click', () =&gt; {
      if (isPlaying) {
        clearInterval(playInterval);
        playBtn.innerHTML = playIcon + '&lt;span&gt;继续演示&lt;/span&gt;';
        playBtn.classList.remove('bg-amber-500', 'hover:bg-amber-600');
        playBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
      } else {
        if (slider.value &gt;= 100) slider.value = 0;
        
        playBtn.innerHTML = pauseIcon + '&lt;span&gt;暂停演示&lt;/span&gt;';
        playBtn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
        playBtn.classList.add('bg-amber-500', 'hover:bg-amber-600');

        playInterval = setInterval(() =&gt; {
          let val = parseFloat(slider.value);
          if (val &gt;= 100) {
            clearInterval(playInterval);
            isPlaying = false;
            playBtn.innerHTML = replayIcon + '&lt;span&gt;重新演示&lt;/span&gt;';
            playBtn.classList.remove('bg-amber-500', 'hover:bg-amber-600');
            playBtn.classList.add('bg-blue-600', 'hover:bg-blue-700');
          } else {
            slider.value = val + 0.3; // 控制播放速度
            updateUI();
          }
        }, 30);
      }
      isPlaying = !isPlaying;
    });

    // 初始化 UI
    updateUI();


    // --- p5.js 绘图逻辑 ---
    let canvasContainer;

    function setup() {
      canvasContainer = document.getElementById('canvas-container');
      let canvas = createCanvas(canvasContainer.offsetWidth, canvasContainer.offsetHeight);
      canvas.parent('canvas-container');
      // 优化渲染性能
      pixelDensity(1);
    }

    function windowResized() {
      resizeCanvas(canvasContainer.offsetWidth, canvasContainer.offsetHeight);
    }

    function draw() {
      background('#E8DAB2'); // 陆地底色
      
      // 绘制经纬网格背景
      drawGrid();

      let p = parseFloat(slider.value) / 100; // 归一化进度 0-1

      // 建立虚拟坐标系 800x600，居中显示并自适应缩放
      let scaleFactor = min(width / 800, height / 600) * 0.95;
      push();
      translate(width / 2, height / 2);
      scale(scaleFactor);
      translate(-400, -300);

      // 1. 绘制板块运动箭头 (在挤压阶段显示)
      drawPlates(p);

      // 2. 绘制水域 (古地中海 -&gt; 黑海 + 里海)
      drawWater(p);

      // 3. 绘制隆起的山脉
      drawMountains(p);

      // 4. 绘制地名标签
      drawLabels(p);

      pop();
    }

    // 绘制背景网格
    function drawGrid() {
      stroke(200, 200, 200, 60);
      strokeWeight(1);
      let gridSize = 50;
      for(let x = 0; x &lt; width; x += gridSize) line(x, 0, x, height);
      for(let y = 0; y &lt; height; y += gridSize) line(0, y, width, y);
    }

    // 绘制不规则水域 (Blob)
    function drawBlob(x, y, rX, rY, noiseOffset) {
      beginShape();
      for (let a = 0; a &lt; TWO_PI; a += 0.1) {
        // 使用固定的 noise 坐标，保证形状稳定不抖动
        let xoff = map(cos(a), -1, 1, 0, 2);
        let yoff = map(sin(a), -1, 1, 0, 2);
        let r = map(noise(xoff + noiseOffset, yoff + noiseOffset), 0, 1, 0.8, 1.2);
        let px = x + rX * r * cos(a);
        let py = y + rY * r * sin(a);
        curveVertex(px, py);
      }
      endShape(CLOSE);
    }

    function drawWater(p) {
      // 水域颜色随时间稍微变深
      let waterColor = lerpColor(color('#5DADE2'), color('#2874A6'), p * 0.5);
      fill(waterColor);
      noStroke();
      
      // 左侧水域 (黑海/地中海方向)
      let leftW = map(p, 0, 1, 200, 120);
      let leftH = map(p, 0, 1, 160, 90);
      let leftX = map(p, 0, 1, 250, 200);
      drawBlob(leftX, 300, leftW, leftH, 0);
      
      // 右侧水域 (里海)
      // 初始宽大，后期变成南北狭长
      let rightW = map(p, 0, 1, 280, 70);
      let rightH = map(p, 0, 1, 200, 220);
      let rightX = map(p, 0, 1, 550, 620);
      drawBlob(rightX, 300, rightW, rightH, 10);
      
      // 中间连接区域 (古地中海的连通部分)
      if (p &lt; 0.65) {
        // 随着进度，连接部逐渐变窄直至消失
        let bridgeW = map(p, 0, 0.65, 220, 0);
        let bridgeH = map(p, 0, 0.65, 140, 0);
        let bridgeX = map(p, 0, 0.65, 400, 420);
        drawBlob(bridgeX, 300, bridgeW, bridgeH, 20);
      }
    }

    function drawMountains(p) {
      // 在进度 &gt; 0.3 时开始隆起
      if (p &gt; 0.3) {
        let mProgress = map(p, 0.3, 0.8, 0, 1, true);
        
        // 高加索山脉 (黑海和里海之间)
        drawMountainRange(420, 280, 7, mProgress, -15);
        
        // 厄尔布尔士山脉 (里海南岸)
        let rightX = map(p, 0, 1, 550, 620);
        drawMountainRange(rightX + 20, 500, 6, mProgress, -10);
      }
    }

    function drawMountainRange(cx, cy, count, progress, angle) {
      push();
      translate(cx, cy);
      rotate(radians(angle));
      
      randomSeed(42); // 确保每次重绘山脉形状一致
      
      for(let i = 0; i &lt; count; i++) {
        let x = (i - count/2) * 35;
        let maxH = 30 + random(15, 45);
        let actualH = map(progress, 0, 1, 0, maxH);
        
        if (actualH &gt; 2) {
          // 阴影面 (左侧)
          fill('#6E4B2B');
          triangle(x - 25, 0, x + 25, 0, x, -actualH);
          // 亮面 (右侧)
          fill('#8B5A2B');
          triangle(x, 0, x + 25, 0, x, -actualH);
          
          // 雪顶 (高度足够时显示)
          if (actualH &gt; 35) {
            fill('#FFFFFF');
            let snowRatio = 0.35;
            let snowH = actualH * snowRatio;
            let snowW = 25 * snowRatio;
            triangle(x - snowW, -actualH + snowH, x + snowW, -actualH + snowH, x, -actualH);
          }
        }
      }
      pop();
    }

    function drawPlates(p) {
      // 在 0.1 到 0.7 之间显示板块挤压箭头
      if (p &gt; 0.1 &amp;&amp; p &lt; 0.8) {
        // 淡入淡出效果
        let alpha = 255;
        if (p &lt; 0.2) alpha = map(p, 0.1, 0.2, 0, 255);
        if (p &gt; 0.6) alpha = map(p, 0.6, 0.8, 255, 0);
        
        // 箭头移动偏移量
        let offset = map(p, 0.1, 0.7, 0, 40);
        
        // 阿拉伯板块 (向北)
        drawArrow(350, 550 - offset, 350, 470 - offset, color(231, 76, 60, alpha), &quot;阿拉伯板块&quot;);
        
        // 印度板块 (向西北)
        drawArrow(720, 550 - offset, 660, 470 - offset, color(231, 76, 60, alpha), &quot;印度板块&quot;);
        
        // 欧亚板块 (向南阻挡)
        drawArrow(400, 50 + offset, 400, 130 + offset, color(231, 76, 60, alpha), &quot;欧亚板块&quot;);
      }
    }

    function drawArrow(x1, y1, x2, y2, c, label) {
      push();
      stroke(c);
      strokeWeight(5);
      fill(c);
      line(x1, y1, x2, y2);
      
      // 箭头头部
      let angle = atan2(y2 - y1, x2 - x1);
      translate(x2, y2);
      rotate(angle);
      triangle(0, 0, -18, 7, -18, -7);
      pop();
      
      // 文字标签
      push();
      fill(c);
      noStroke();
      textAlign(CENTER, CENTER);
      textSize(15);
      textStyle(BOLD);
      // 根据箭头方向调整文字位置
      let textY = y1 + (y1 &gt; y2 ? 25 : -25);
      text(label, x1, textY);
      pop();
    }

    function drawLabels(p) {
      textAlign(CENTER, CENTER);
      textStyle(BOLD);
      
      // 古地中海标签 (前期显示)
      if (p &lt; 0.5) {
        let alpha = map(p, 0.3, 0.5, 255, 0);
        fill(255, 255, 255, alpha);
        textSize(24);
        text(&quot;古地中海 (特提斯海)&quot;, 400, 280);
      }
      
      // 黑海标签 (后期显示)
      if (p &gt; 0.5) {
        let alpha = map(p, 0.5, 0.7, 0, 255);
        fill(255, 255, 255, alpha);
        textSize(20);
        let leftX = map(p, 0, 1, 250, 200);
        text(&quot;黑海&quot;, leftX, 300);
      }
      
      // 里海标签 (后期显示)
      if (p &gt; 0.5) {
        let alpha = map(p, 0.5, 0.7, 0, 255);
        fill(255, 255, 255, alpha);
        textSize(22);
        let rightX = map(p, 0, 1, 550, 620);
        text(&quot;里海&quot;, rightX, 300);
      }
      
      // 山脉标签
      if (p &gt; 0.6) {
        let alpha = map(p, 0.6, 0.8, 0, 255);
        fill(60, 40, 20, alpha);
        textSize(16);
        
        // 添加白色发光背景增加可读性
        drawingContext.shadowBlur = 4;
        drawingContext.shadowColor = 'rgba(255,255,255,0.8)';
        
        text(&quot;高加索山脉&quot;, 420, 220);
        let rightX = map(p, 0, 1, 550, 620);
        text(&quot;厄尔布尔士山脉&quot;, rightX + 20, 450);
        
        drawingContext.shadowBlur = 0;
      }
    }
