          roughness: 0.7

    scene.add(boat);

    console.error('Error loading FBX:', error);
  });

function createVector(position, direction, length , color = 0xffff00, thickness = 0.8) {
    const arrowLength = length;
    const headLength = length/5;
    const headWidth = headLength/2;

    // Create a cylinder to represent the shaft of the vector
    const shaftGeometry = new THREE.CylinderGeometry(thickness, thickness, arrowLength - headLength, 32); 
    const shaftMaterial = new THREE.MeshBasicMaterial({ color: color });
    
    // Create the shaft and rotate it to align with the vector direction
    const shaft = new THREE.Mesh(shaftGeometry, shaftMaterial);
    shaft.position.copy(position);

    // ArrowHelper only for the arrowhead
    var arrowHelper = new THREE.ArrowHelper(direction, position, arrowLength, color, headLength, headWidth);

    // Position the shaft correctly along the vector direction
    const midpoint = new THREE.Vector3().addVectors(position, direction.clone().multiplyScalar((arrowLength - headLength) / 2));
    shaft.position.copy(midpoint);
    
    // Rotate the shaft to match the direction of the vector
    shaft.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());

    // Add both the shaft and arrowhead to the scene
    scene.add(shaft);
    scene.add(arrowHelper);

    return { shaft, arrowHelper };
}

function updateResult() {
  const box = document.getElementById("resultBox");
  if (!box) return;

  const vbw = parseFloat(document.getElementById('v_b_w').value);
  const vws = parseFloat(document.getElementById('v_w_s').value);
  const aimAngle = parseFloat(document.getElementById('aim').value);

  const aimRad = THREE.MathUtils.degToRad(aimAngle);
  const boatDir = new THREE.Vector3(Math.sin(aimRad), 0, -Math.cos(aimRad));
  const waterDir = new THREE.Vector3(1, 0, 0);

  const boatToShore = boatDir.clone().multiplyScalar(vbw).add(waterDir.clone().multiplyScalar(vws));
  const vbs_mag = boatToShore.length();
  const angleRad = Math.atan2(boatToShore.x, -boatToShore.z);
  const angleDeg = THREE.MathUtils.radToDeg(angleRad).toFixed(2);

  box.innerHTML = `
    <b>Velocity Calculations:</b><br><br>

    <b>Boat relative to Water (V<sub>b/w</sub>):</b><br>
    Magnitude: <span style="color:lime;">${vbw.toFixed(2)} m/s</span><br>
    Aim angle: <span style="color:orange;">${aimAngle}°</span><br><br>

    <b>Water relative to Shore (V<sub>w/s</sub>):</b><br>
    Magnitude: <span style="color:skyblue;">${vws.toFixed(2)} m/s</span><br>
    Direction: Along X (sideways)<br><br>

    <b>Boat relative to Shore (V<sub>b/s</sub>):</b><br>
    Magnitude: <span style="color:yellow;">${vbs_mag.toFixed(2)} m/s</span><br>
    Angle relative to Z-axis: <span style="color:orange;">${angleDeg}°</span><br>
    (0° = directly forward, positive = to right)
  `;
