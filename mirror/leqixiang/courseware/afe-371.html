<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太阳系与万有引力 - 虚拟实验</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Helvetica Neue',sans-serif;
  background:linear-gradient(135deg,#e8f4fd 0%,#c8ddf0 25%,#b8d4e8 50%,#d0e4f4 75%,#e0eef8 100%);
  min-height:100vh;
  overflow-x:hidden;
  color:#1a1a2e;
}
#starBg{
  position:fixed;top:0;left:0;width:100%;height:100%;
  z-index:0;pointer-events:none;
}
.main-container{
  position:relative;z-index:1;
  max-width:1300px;margin:0 auto;padding:16px 20px 40px;
}
/* Header */
.header{
  text-align:center;margin-bottom:16px;
}
.header h1{
  font-size:2rem;font-weight:700;
  background:linear-gradient(135deg,#1a237e,#0d47a1,#01579b);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:4px;letter-spacing:2px;
}
.header .subtitle{
  font-size:0.9rem;color:#546e7a;letter-spacing:1px;
}
.header .toggle-row{
  display:flex;justify-content:center;align-items:center;gap:12px;margin-top:10px;flex-wrap:wrap;
}
.toggle-group{
  display:flex;background:rgba(255,255,255,0.45);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:30px;padding:4px;gap:2px;
  border:1px solid rgba(255,255,255,0.5);
  box-shadow:0 2px 12px rgba(0,0,0,0.06);
}
.toggle-btn{
  padding:8px 20px;border-radius:26px;border:none;cursor:pointer;
  font-size:0.9rem;font-weight:600;transition:all 0.3s;
  background:transparent;color:#546e7a;white-space:nowrap;
}
.toggle-btn.active{
  background:linear-gradient(135deg,#1565c0,#0d47a1);
  color:#fff;box-shadow:0 3px 12px rgba(21,101,192,0.35);
}
.speed-slider{display:flex;align-items:center;gap:8px;font-size:0.85rem;color:#546e7a;}
.speed-slider input[type=range]{width:80px;accent-color:#1565c0;}

/* Dashboard grid */
.dashboard{
  display:grid;grid-template-columns:1fr 340px;
  gap:16px;margin-bottom:16px;
}
@media(max-width:900px){.dashboard{grid-template-columns:1fr;}}

/* Solar panel */
.solar-panel{
  background:rgba(10,15,30,0.92);
  border-radius:20px;overflow:hidden;
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:0 8px 40px rgba(0,0,0,0.2);
  position:relative;
}
.solar-panel canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;cursor:pointer;}
.solar-panel .hint{
  position:absolute;bottom:10px;left:50%;transform:translateX(-50%);
  font-size:0.78rem;color:rgba(255,255,255,0.5);pointer-events:none;
}

/* Side panel */
.side-panel{display:flex;flex-direction:column;gap:14px;}

/* Glass card */
.glass-card{
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:18px;padding:16px 18px;
  border:1px solid rgba(255,255,255,0.5);
  box-shadow:0 6px 30px rgba(0,0,0,0.07);
  transition:all 0.3s;
}
.glass-card:hover{box-shadow:0 10px 40px rgba(0,0,0,0.1);}
.glass-card h3{
  font-size:1.05rem;font-weight:700;color:#0d47a1;
  margin-bottom:10px;display:flex;align-items:center;gap:6px;
}
.glass-card h3 .icon{font-size:1.2rem;}

/* Planet info */
#planetInfoCard .placeholder{color:#78909c;font-size:0.88rem;text-align:center;padding:10px 0;}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.info-item{font-size:0.85rem;}
.info-item .label{color:#78909c;font-size:0.75rem;}
.info-item .value{color:#1a237e;font-weight:700;font-size:0.95rem;}
#planetName{font-size:1.3rem;font-weight:700;color:#0d47a1;margin-bottom:6px;}
#planetName .color-dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;}

/* Kepler table */
.kepler-table-wrap{max-height:260px;overflow-y:auto;}
.kepler-table{width:100%;border-collapse:collapse;font-size:0.78rem;}
.kepler-table th{
  background:rgba(13,71,161,0.1);padding:7px 5px;text-align:center;
  font-weight:700;color:#0d47a1;position:sticky;top:0;font-size:0.73rem;
}
.kepler-table td{padding:6px 5px;text-align:center;border-bottom:1px solid rgba(0,0,0,0.06);}
.kepler-table tr:hover td{background:rgba(21,101,192,0.06);}
.kepler-table .const{color:#2e7d32;font-weight:700;}
.kepler-table .col-planet{text-align:left;font-weight:600;}

/* Gravity section */
.gravity-section{
  background:rgba(255,255,255,0.35);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:18px;padding:16px 18px;
  border:1px solid rgba(255,255,255,0.5);
  box-shadow:0 6px 30px rgba(0,0,0,0.07);
  margin-bottom:16px;
}
.gravity-section h3{font-size:1.05rem;font-weight:700;color:#0d47a1;margin-bottom:8px;}
.gravity-inner{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
.gravity-inner canvas{border-radius:12px;background:rgba(10,15,30,0.9);cursor:pointer;}
.gravity-info{font-size:0.88rem;color:#37474f;line-height:1.7;flex:1;min-width:200px;}
.gravity-info .formula{font-size:1.1rem;font-weight:700;color:#0d47a1;margin:6px 0;}
.gravity-info .highlight{color:#c62828;font-weight:700;}

/* Exam section */
.exam-section{}
.exam-section h3{font-size:1.05rem;font-weight:700;color:#0d47a1;margin-bottom:10px;}
.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px;}
.exam-card{
  background:rgba(255,255,255,0.4);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-radius:14px;padding:14px 16px;
  border:1px solid rgba(255,255,255,0.45);
  box-shadow:0 4px 20px rgba(0,0,0,0.05);
  transition:all 0.3s;
}
.exam-card.correct{border-color:#4caf50;background:rgba(76,175,80,0.08);}
.exam-card.wrong{border-color:#f44336;background:rgba(244,67,54,0.06);}
.exam-card .q-num{font-weight:700;color:#1565c0;font-size:0.85rem;margin-bottom:4px;}
.exam-card .q-text{font-weight:600;font-size:0.92rem;margin-bottom:8px;color:#263238;line-height:1.5;}
.exam-card .options{display:flex;flex-direction:column;gap:4px;}
.exam-card .opt{
  padding:7px 12px;border-radius:8px;cursor:pointer;font-size:0.85rem;
  border:1px solid rgba(0,0,0,0.1);transition:all 0.2s;
  background:rgba(255,255,255,0.3);
}
.exam-card .opt:hover{background:rgba(21,101,192,0.08);border-color:#1565c0;}
.exam-card .opt.selected{background:rgba(21,101,192,0.15);border-color:#1565c0;font-weight:600;}
.exam-card .opt.correct-answer{background:rgba(76,175,80,0.2);border-color:#4caf50;}
.exam-card .opt.wrong-answer{background:rgba(244,67,54,0.15);border-color:#f44336;}
.exam-card .feedback{font-size:0.82rem;margin-top:8px;padding:8px;border-radius:8px;display:none;line-height:1.5;}
.exam-card .feedback.show{display:block;}
.exam-card .feedback.correct-fb{background:rgba(76,175,80,0.1);color:#2e7d32;}
.exam-card .feedback.wrong-fb{background:rgba(244,67,54,0.08);color:#c62828;}

/* Scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.15);border-radius:3px}

/* Planet glow animation */
@keyframes pulse{0%,100%{opacity:0.6}50%{opacity:1}}
</style>
</head>

<canvas id="starBg"></canvas>

<div class="main-container">
  <div class="header">
    <h1>太阳系与万有引力</h1>
    <div class="subtitle">高一物理 必修第二册 第七章 &middot; 万有引力与宇宙航行</div>
    <div class="toggle-row">
      <div class="toggle-group" id="scaleToggle">
        <button class="toggle-btn active" data-mode="teaching">教学比例</button>
        <button class="toggle-btn" data-mode="true">真实比例</button>
      </div>
      <div class="speed-slider">
        <span>动画速度</span>
        <input type="range" id="speedSlider" min="1" max="20" value="5" step="1">
        <span id="speedLabel">5x</span>
      </div>
    </div>
  </div>

  <div class="dashboard">
    <div class="solar-panel">
      <canvas id="solarCanvas"></canvas>
      <div class="hint">点击行星查看详情 &nbsp;|&nbsp; 滚轮缩放</div>
    </div>
    <div class="side-panel">
      <div class="glass-card" id="planetInfoCard">
        <h3><span class="icon">&#128301;</span>行星数据</h3>
        <div class="placeholder">← 点击左侧太阳系中的行星查看详情</div>
        <div id="planetName" style="display:none;"></div>
        <div class="info-grid" id="infoGrid" style="display:none;"></div>
      </div>
      <div class="glass-card">
        <h3><span class="icon">&#128202;</span>开普勒第三定律验证</h3>
        <div class="kepler-table-wrap">
          <table class="kepler-table">
            <thead><tr><th>行星</th><th>T(年)</th><th>r(AU)</th><th>T&sup2;</th><th>r&sup3;</th><th>T&sup2;/r&sup3;</th></tr></thead>
            <tbody id="keplerBody"></tbody>
          </table>
        </div>
        <div style="font-size:0.75rem;color:#78909c;margin-top:6px;text-align:center;">
          T&sup2;/r&sup3; &asymp; 常数 &rarr; 开普勒第三定律成立
        </div>
      </div>
    </div>
  </div>

  <div class="gravity-section">
    <h3>&#128168; 万有引力可视化：F = Gm&#8321;m&#8322;/r&sup2; &nbsp;(拖拽天体改变距离)</h3>
    <div class="gravity-inner">
      <canvas id="gravityCanvas" width="500" height="280"></canvas>
      <div class="gravity-info">
        <div style="font-weight:600;">两天体中心距离 <span style="color:#0d47a1;">r</span> = <span class="highlight" id="distVal">--</span> 单位</div>
        <div class="formula">引力 F &prop; <span class="highlight">1/r&sup2;</span></div>
        <div>相对引力大小 F = <span class="highlight" id="forceVal">--</span></div>
        <div style="font-size:0.78rem;color:#78909c;margin-top:6px;">
          &#9432; 距离加倍 &rarr; 引力变为 1/4<br>
          &#9432; 距离变为3倍 &rarr; 引力变为 1/9
        </div>
      </div>
    </div>
  </div>

  <div class="exam-section">
    <h3>&#128214; 考点精练（5题）</h3>
    <div class="exam-grid" id="examGrid"></div>
  </div>
</div>
