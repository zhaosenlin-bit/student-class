<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>吃鸡答题赛（3D版）</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0d0d0d; color:#e0e0e0; font-family:'Segoe UI',sans-serif; overflow:hidden; height:100vh; user-select:none; -webkit-user-select:none; }

.screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; }
.screen.active { display:flex; }

/* ─── SETUP ─── */
#setup-screen { background:radial-gradient(ellipse at center,#0a1a2a,#0a0a0a); z-index:100; }
.setup-title { font-size:4rem; font-weight:900; color:#00ccff; text-shadow:0 0 40px rgba(0,204,255,0.4),4px 4px 0 #ff4444; letter-spacing:4px; margin-bottom:8px; }
.setup-sub { font-size:1.2rem; color:#888; margin-bottom:25px; }
.setup-box { background:rgba(0,200,255,0.04); border:2px solid #111; border-radius:16px; padding:30px 40px; width:700px; max-width:92vw; }
.setup-row { display:flex; align-items:center; gap:12px; margin-bottom:14px; flex-wrap:wrap; }
.setup-row label { color:#aaa; font-size:1rem; min-width:90px; }
.setup-row input[type=number] { width:70px; padding:8px; background:rgba(20,20,20,0.4); border:2px solid #0a1a2a; color:#e0e0e0; border-radius:8px; font-size:1.1rem; text-align:center; }
.setup-row input[type=text] { flex:1; min-width:120px; padding:8px 12px; background:rgba(20,20,20,0.4); border:2px solid #0a1a2a; color:#e0e0e0; border-radius:8px; font-size:1rem; }
.setup-btn { padding:10px 22px; background:#333; border:2px solid #666; color:#e0e0e0; border-radius:8px; cursor:pointer; font-size:0.95rem; transition:0.15s; }
.setup-btn:hover { background:#111; border-color:#00ccff; }
.setup-btn.primary { background:#ff4444; border-color:#00ccff; color:#00ccff; font-weight:bold; }
.setup-btn.primary:hover { background:rgba(50,50,50,0.7); }
.player-inputs { display:grid; grid-template-columns:1fr 1fr; gap:8px 20px; margin:10px 0 15px; }
.player-inputs input { padding:6px 10px; background:rgba(0,200,255,0.04); border:1px solid #111; border-radius:6px; color:#e0e0e0; font-size:0.9rem; }
.player-inputs input:focus { border-color:#00ccff; outline:none; }
.start-btn-wrap { margin-top:18px; text-align:center; }
#start-battle { padding:16px 80px; font-size:1.8rem; background:#ff4444; color:#00ccff; border:4px solid #00ccff; border-radius:12px; cursor:pointer; font-weight:900; letter-spacing:2px; transition:0.2s; opacity:0.5; pointer-events:none; }
#start-battle.ready { opacity:1; pointer-events:auto; animation:pulse 1.2s infinite alternate; }
@keyframes pulse { from{transform:scale(1)} to{transform:scale(1.04)} }

/* ─── GAME (3D) ─── */
#game-screen { background:#0a0a0a; z-index:10; }
#three-container { position:absolute; top:0; left:36%; right:0; bottom:0; z-index:1; }
#three-container canvas { display:block; width:100% !important; height:100% !important; }

/* HUD */
.game-hud { position:absolute; top:0; left:36%; right:0; height:56px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; z-index:30; background:linear-gradient(to bottom,rgba(5,15,30,0.95),rgba(5,15,30,0.6),transparent); }
.hud-title { font-weight:900; font-size:1.2rem; color:#00ccff; }
.hud-round { color:#aaa; font-size:0.9rem; }
.hud-zone { display:flex; align-items:center; gap:6px; font-size:0.95rem; }
.zone-badge { display:inline-block; padding:2px 12px; border-radius:10px; font-weight:700; font-size:0.85rem; }
.zone-safe { background:rgba(0,255,136,0.25); color:#00ff88; border:1px solid #00ff88; }
.zone-danger { background:rgba(255,50,50,0.4); color:#ff4444; border:1px solid #ff4444; animation:zone-flash 1s infinite alternate; }
@keyframes zone-flash { from{opacity:1} to{opacity:0.5} }

/* Question Overlay — Left Panel */
#question-overlay {
  position:fixed; top:0; left:0; width:36%; height:100%;
  background:linear-gradient(135deg,rgba(5,15,25,0.92) 0%,rgba(8,8,8,0.9) 100%);
  border-right:3px solid rgba(0,200,255,0.25);
  box-shadow:4px 0 40px rgba(0,0,0,0.7), inset -2px 0 20px rgba(255,50,50,0.05);
  z-index:100; display:none;
  flex-direction:column; align-items:stretch; justify-content:flex-start;
  padding:30px 24px; overflow-y:auto;
}
#question-overlay.active { display:flex; }
.q-close-area { position:absolute; top:12px; right:14px; font-size:1.5rem; color:#0a1a2a; cursor:pointer; background:none; border:none; }
.q-panel-header { text-align:center; margin-bottom:16px; flex-shrink:0; position:relative; }
.q-turn-indicator { font-size:1.1rem; color:#888; }
.q-turn-name { font-weight:700; color:#00ccff; font-size:2rem; letter-spacing:2px; }
.q-round-badge { font-size:0.8rem; color:#3a6a8a; margin-top:2px; }
.q-scroll { flex:1; overflow-y:auto; display:flex; flex-direction:column; }
.q-text { font-size:1.25rem; font-weight:600; line-height:1.5; color:#e0e0e0; margin-bottom:16px; flex-shrink:0; }
.q-options { display:grid; gap:8px; flex-shrink:0; }
.q-opt { padding:12px 16px; background:rgba(0,200,255,0.04); border:2px solid #111; border-radius:8px; cursor:pointer; font-size:1rem; color:#ccc; text-align:left; transition:0.12s; }
.q-opt:hover { background:rgba(255,255,255,0.12); border-color:#3a6a8a; transform:translateX(3px); }
.q-opt.correct { border-color:#ff6644; background:rgba(255,50,50,0.18); color:#ff6644; }
.q-opt.wrong { border-color:#ff4444; background:rgba(231,76,60,0.18); color:#ff4444; }
.q-opt:disabled { cursor:default; opacity:0.7; }
.q-result { text-align:center; margin-top:14px; font-size:1.2rem; font-weight:700; min-height:32px; flex-shrink:0; text-shadow:0 0 8px rgba(0,0,0,0.5); }
.q-result.ok { color:#00ccff; }
.q-result.fail { color:#ff6644; }
.q-timer { text-align:center; margin-bottom:6px; font-size:2rem; font-weight:900; flex-shrink:0; letter-spacing:2px; }
.q-timer.urgent { color:#ff6644; animation:timer-pulse 0.5s infinite alternate; }
.q-timer.normal { color:#00ccff; }
@keyframes timer-pulse { from{opacity:1;transform:scale(1)} to{opacity:0.5;transform:scale(1.1)} }
.q-next-btn { margin-top:12px; padding:10px 0; width:100%; background:#ff4444; color:#00ccff; border:3px solid #00ccff; border-radius:8px; font-size:1.05rem; font-weight:700; cursor:pointer; transition:0.15s; display:none; flex-shrink:0; }
.q-next-btn:hover { background:rgba(50,50,50,0.7); }
.q-stats { margin-top:auto; padding-top:12px; border-top:1px solid #222; flex-shrink:0; }
.q-stats-row { display:flex; justify-content:space-between; font-size:0.8rem; color:#66ccdd; }
.q-img-inline { text-align:center; margin:14px 0 16px; flex-shrink:0; padding:10px; background:rgba(0,0,0,0.2); border-radius:8px; border-top:1px solid rgba(0,200,255,0.04); border-bottom:1px solid rgba(0,200,255,0.04); }
.q-img-inline img { max-width:100%; max-height:220px; border-radius:8px; border:2px solid #0a1a2a; object-fit:contain; background:rgba(0,0,0,0.4); display:block; margin:0 auto; }

/* Player list sidebar */
.player-list { position:absolute; bottom:0; left:36%; right:0; z-index:25; background:linear-gradient(to top,rgba(10,10,10,0.95),rgba(10,10,10,0.6),transparent); padding:50px 12px 14px 12px; display:flex; justify-content:center; gap:8px; flex-wrap:wrap; }
.player-card { background:rgba(0,200,255,0.04); border:2px solid #111; border-radius:10px; padding:6px 12px; width:140px; text-align:center; transition:0.2s; }
.player-card.alive { border-color:#111; }
.player-card.dead { opacity:0.3; border-color:#222; background:rgba(0,0,0,0.3); }
.player-card.answering { border-color:#00ccff; box-shadow:0 0 15px rgba(0,200,255,0.3); }
.player-card .p-name { font-size:1rem; font-weight:700; margin-bottom:3px; }
.player-card .p-hp { display:flex; gap:3px; justify-content:center; }
.hp-heart { display:inline-block; font-size:13px; line-height:1; }
.hp-heart.full { color:#ff4444; }
.hp-heart.lost { color:#333; }
.hp-heart.losing { animation:heart-loss 0.5s; }
@keyframes heart-loss { 0%{color:#ff4444;transform:scale(1.4)} 50%{color:#00ccff;transform:scale(1.6)} 100%{color:#333;transform:scale(1)} }

/* Elimination */
#elim-banner { position:fixed; top:0; left:0; right:0; bottom:0; z-index:200; display:none; flex-direction:column; align-items:center; justify-content:center; background:rgba(0,0,0,0.8); pointer-events:none; }
#elim-banner.active { display:flex; }
.elim-text { font-size:4rem; font-weight:900; color:#ff4444; text-shadow:0 0 60px rgba(231,76,60,0.5); animation:elim-fade 2.5s forwards; }
.elim-sub { font-size:1.2rem; color:#aaa; margin-top:10px; animation:elim-fade 2.5s forwards; }
@keyframes elim-fade { 0%{opacity:0;transform:scale(0.5)} 20%{opacity:1;transform:scale(1)} 70%{opacity:1;transform:scale(1)} 100%{opacity:0;transform:scale(1.2)} }

/* Victory */
#victory-screen { position:fixed; inset:0; background:radial-gradient(ellipse at center,rgba(0,204,255,0.08),#0a0a0f); z-index:300; display:none; flex-direction:column; align-items:center; justify-content:center; }
#victory-screen.active { display:flex; }
.victory-rays { position:absolute; inset:-50%; width:200%; height:200%; background:repeating-conic-gradient(from 0deg,rgba(0,200,255,0.05) 0deg 8deg,transparent 8deg 16deg); animation:rotate-rays 12s linear infinite; z-index:-1; }
@keyframes rotate-rays { to{transform:rotate(360deg)} }
.victory-icon { font-size:80px; margin-bottom:10px; }
.victory-title { font-size:4rem; font-weight:900; color:#00ccff; text-shadow:0 0 60px rgba(0,204,255,0.4),4px 4px 0 #ff4444; }
.victory-name { font-size:2.5rem; font-weight:700; color:#e0e0e0; margin:8px 0; }
.victory-stats { display:flex; gap:30px; margin:15px 0; flex-wrap:wrap; justify-content:center; }
.stat-item { background:rgba(0,200,255,0.04); border:1px solid #111; border-radius:12px; padding:14px 24px; text-align:center; min-width:100px; }
.stat-item .num { font-size:2rem; font-weight:900; color:#00ccff; }
.stat-item .label { font-size:0.8rem; color:#888; margin-top:2px; }
.victory-actions { margin-top:20px; display:flex; gap:14px; }
.victory-btn { padding:12px 40px; border-radius:10px; font-size:1.1rem; font-weight:700; cursor:pointer; border:2px solid; transition:0.15s; }
.victory-btn.gold { background:#ff4444; color:#00ccff; border-color:#00ccff; }
.victory-btn.gold:hover { background:rgba(50,50,50,0.7); }
.victory-btn.silver { background:#333; color:#aaa; border-color:#3a6a8a; }
.victory-btn.silver:hover { background:#111; }

/* Floating damage (HTML overlay, for 3D space projection) */
.dmg-float { position:fixed; pointer-events:none; z-index:50; font-size:2.2rem; font-weight:900; animation:dmg-up 1.2s forwards; }
.dmg-float.dmg { color:#ff4444; text-shadow:0 0 20px rgba(231,76,60,0.6); }
.dmg-float.ok { color:#ff6644; text-shadow:0 0 20px rgba(255,50,50,0.6); }
@keyframes dmg-up { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-80px) scale(1.3)} }

/* Zone announcement */
#zone-bar { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:60; display:none; flex-direction:column; align-items:center; justify-content:center; pointer-events:none; }
#zone-bar.active { display:flex; }
.zone-announce { font-size:5rem; font-weight:900; color:#ff4444; text-shadow:0 0 80px rgba(231,76,60,0.5); animation:zone-ann 2.8s forwards; }
.zone-sub { font-size:1.2rem; color:#aaa; margin-top:6px; animation:zone-ann 2.8s forwards; }
@keyframes zone-ann { 0%{opacity:0;transform:scale(0.3)} 15%{opacity:1;transform:scale(1.1)} 25%{transform:scale(1)} 70%{opacity:1} 100%{opacity:0} }

/* Confetti */
.confetti-piece { position:fixed; width:10px; height:10px; z-index:250; pointer-events:none; animation:confetti-fall linear forwards; }
@keyframes confetti-fall { 0%{opacity:1;transform:translateY(-10vh) rotate(0deg)} 100%{opacity:0;transform:translateY(110vh) rotate(720deg)} }

/* Loading overlay */
#loading-overlay {
  position:fixed; inset:0; z-index:500; display:none;
  flex-direction:column; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.9); color:#00ccff;
}
#loading-overlay.active { display:flex; }
.loading-title { font-size:2rem; font-weight:700; margin-bottom:20px; }
.loading-bar-wrap { width:300px; height:8px; background:#222; border-radius:4px; overflow:hidden; }
.loading-bar { height:100%; width:0%; background:linear-gradient(90deg,#00ccff,#ff4444); border-radius:4px; transition:width 0.2s; }
.loading-text { margin-top:12px; font-size:0.9rem; color:#888; }

/* Responsive */
@media(max-width:768px){
  #question-overlay { width:50%; padding:20px 16px; }
}
@media(max-width:640px){
  .setup-title { font-size:2.5rem; }
  .setup-box { padding:20px; }
  .player-inputs { grid-template-columns:1fr; }
  .q-text { font-size:1rem; }
  .q-opt { font-size:0.85rem; padding:10px 12px; }
  #question-overlay { width:100%; left:0; border-right:none; z-index:110; }
  .player-card { width:80px; }
  .player-card .p-name { font-size:0.85rem; }
  .hp-heart { font-size:10px; }
  .victory-title { font-size:2rem; }
  .victory-name { font-size:1.2rem; }
}
</style>
</head>

<!-- ═══ SETUP ═══ -->
<div id="setup-screen" class="screen active">
  <div class="setup-title">🐔 吃鸡答题赛（3D版）</div>
  <div class="setup-sub">真实战场 · 答对生存 · 缩圈决胜</div>
  <div class="setup-box">
    <div class="setup-row">
      <label>👤 玩家人数</label>
      <input type="number" id="player-count" value="6" min="2" max="16">
      <button class="setup-btn" onclick="generatePlayers()">生成</button>
    </div>
    <div class="setup-row">
      <label>⏱ 每题限时</label>
      <input type="number" id="timer-setting" value="10" min="5" max="60" style="width:60px;padding:6px;background:#222;border:2px solid #555;color:#fff;border-radius:8px;font-size:1rem;text-align:center;">
      <span style="color:#888;font-size:0.85rem;">秒（0=不限时）</span>
    </div>
    <div class="player-inputs" id="player-inputs"></div>
    <div class="setup-row">
      <label>📁 题库文件夹</label>
      <input type="text" id="folder-info" value="内置 12 题（无需上传）" readonly style="background:#111;color:#888;flex:1;border:1px solid #333;padding:8px;border-radius:8px;">
      <input type="file" id="file-input-folder" webkitdirectory onchange="importQuizFolder(event)" style="display:none">
      <button class="setup-btn" onclick="document.getElementById('file-input-folder').click()">📂 上传</button>
    </div>
    <div class="start-btn-wrap">
      <button id="start-battle" onclick="startGame()">开始战斗</button>
    </div>
  </div>
</div>

<!-- ═══ LOADING ═══ -->
<div id="loading-overlay">
  <div class="loading-title">🎮 加载战场...</div>
  <div class="loading-bar-wrap"><div class="loading-bar" id="loading-bar"></div></div>
  <div class="loading-text" id="loading-text">加载模型文件中...</div>
</div>

<!-- ═══ GAME (3D) ═══ -->
<div id="game-screen" class="screen">
  <div class="game-hud">
    <span class="hud-title">🐔 吃鸡答题赛（3D版）</span>
    <span class="hud-round" id="round-display">第 1 题</span>
    <span class="hud-zone" id="zone-display"><span class="zone-badge zone-safe">⭕ 安全</span></span>
  </div>
  <div id="three-container"></div>
  <div class="player-list" id="player-list"></div>
</div>

<!-- ═══ QUESTION OVERLAY ═══ -->
<div id="question-overlay">
  <div class="q-panel-header" style="position:relative;">
    <button onclick="if(confirm('返回首页将重新开始，确定吗？')){resetGame()}" style="position:absolute;left:-4px;top:-4px;padding:3px 10px;font-size:0.75rem;background:rgba(0,200,255,0.04);border:1px solid #111;color:#777;border-radius:5px;cursor:pointer;z-index:10;">🏠</button>
    <div class="q-turn-indicator">⚡ <span class="q-turn-name" id="q-turn-name">Player 1</span> 的回合</div>

  </div>
  <div class="q-scroll">
    <div class="q-text" id="q-text">题目内容</div>
    <div class="q-img-inline" id="q-img-inline" style="display:none"></div>
    <div class="q-options" id="q-options"></div>
    <div class="q-result" id="q-result"></div>
    <button class="q-next-btn" id="q-next-btn">继续 ➜</button>
  </div>
  <div class="q-stats">
    <div style="font-size:0.75rem;color:#888;margin-bottom:4px;" id="q-stats-label">玩家战绩</div>
    <div class="q-stats-row"><span>✅ 答对</span><span id="q-stat-ok">0</span></div>
    <div class="q-stats-row"><span>❌ 答错</span><span id="q-stat-fail">0</span></div>
    <div class="q-stats-row"><span>⭕ 缩圈</span><span id="q-stat-zone">0/5</span></div>
  </div>
</div>

<!-- ═══ ELIMINATION BANNER ═══ -->
<div id="elim-banner">
  <div class="elim-text" id="elim-text">☠️ 淘汰</div>
  <div class="elim-sub" id="elim-sub">已从战场消失</div>
</div>

<!-- ═══ ZONE ANNOUNCEMENT ═══ -->
<div id="zone-bar">
  <div class="zone-announce" id="zone-announce-text">⚡ 缩圈！</div>
  <div class="zone-sub" id="zone-sub-text">安全区域正在缩小</div>
</div>

<!-- ═══ VICTORY ═══ -->
<div id="victory-screen">
  <div class="victory-rays"></div>
  <div class="victory-icon">👑</div>
  <div class="victory-title">大吉大利，今晚吃鸡！</div>
  <div class="victory-name" id="victory-name">Player 1</div>
  <div class="victory-stats" id="victory-stats"></div>
  <div class="victory-actions">
    <button class="victory-btn gold" onclick="nextGame()">🔄 下一局</button>
    <button class="victory-btn silver" onclick="resetGame()">🏠 重新开始</button>
  </div>
</div>



<script>
window._threeLoaded = false;
window.addEventListener('load', () => {
  setTimeout(() => {
    if (!window._threeLoaded) {
      const ov = document.getElementById('loading-overlay');
