<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR 互动地理 - 全球探索 (流畅秒开版)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 2; pointer-events: none; }
        
        /* 摄像头背景 */
        #webcam-video {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 1; transform: scaleX(-1); /* 镜像翻转 */
            display: none; opacity: 0.6;
        }

        /* UI 覆盖层 */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 20; pointer-events: none;
        }
        
        .panel {
            background: rgba(0, 15, 30, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.4);
            padding: 20px; border-radius: 12px; backdrop-filter: blur(10px);
            pointer-events: auto; color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: absolute; top: 20px; left: 20px; max-width: 320px;
        }

        /* 国家信息右侧面板 */
        #country-panel {
            top: 20px; right: 20px; left: auto; width: 280px; display: none;
            border-left: 5px solid #00ffaa;
            transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h1 { margin: 0 0 5px 0; font-size: 1.5rem; color: #00ffff; text-shadow: 0 0 10px rgba(0,255,255,0.6); letter-spacing: 1px; }
        .subtitle { font-size: 0.9rem; color: #aaa; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #333; }
        
        .status-indicator {
            display: inline-flex; align-items: center; font-size: 14px; font-weight: bold;
            background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px; margin-bottom: 15px;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #ffaa00; margin-right: 8px; animation: blink 1s infinite;}
        .dot.active { background: #00ff00; box-shadow: 0 0 8px #00ff00; animation: none; }
        .dot.error { background: #ff0000; box-shadow: 0 0 8px #ff0000; animation: none; }

        @keyframes blink { 50% { opacity: 0.3; } }

        .gesture-hint { font-size: 13px; color: #ccc; line-height: 1.6; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 6px; }
        .highlight { color: #00ffff; font-weight: bold; }

        button.control-btn {
            background: linear-gradient(90deg, #0088ff, #00ffff); border: none;
            color: #000; padding: 12px 20px; border-radius: 50px;
            cursor: pointer; font-weight: bold; margin-top: 15px; width: 100%;
            transition: all 0.2s; font-size: 16px;
        }
        button.control-btn:hover { transform: scale(1.05); box-shadow: 0 0 15px rgba(0,255,255,0.5); }
        button.control-btn:disabled { background: #444; color: #888; cursor: not-allowed; box-shadow: none; transform: none; }

        /* 3D 城市标签样式 (CSS2D) */
        .city-label {
            color: #ffffff; font-family: 'Segoe UI', sans-serif;
            background: rgba(0, 20, 40, 0.7);
            border: 1px solid rgba(0, 255, 255, 0.5);
            padding: 4px 8px; border-radius: 4px;
            font-size: 12px; font-weight: bold;
            pointer-events: none; user-select: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: opacity 0.2s;
            display: flex; align-items: center; gap: 5px;
            white-space: nowrap;
        }
        .city-label::before {
            content: ''; display: inline-block; width: 6px; height: 6px;
            background: #ffcc00; border-radius: 50%; box-shadow: 0 0 5px #ffcc00;
        }

        /* 启动加载层 */
        #loading-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; justify-content: center; align-items: center;
            color: white; z-index: 100; flex-direction: column;
            transition: opacity 0.5s;
        }
        .spinner {
            width: 50px; height: 50px; border: 4px solid rgba(0, 255, 255, 0.3); border-top: 4px solid #00ffff;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        #loading-text { font-size: 18px; color: #00ffff; letter-spacing: 2px; }

        /* 准星光标 */
        #pointer-cursor {
            position: absolute; width: 18px; height: 18px; 
            background: rgba(0, 255, 255, 0.4); border: 2px solid #00ffff; 
            border-radius: 50%; pointer-events: none; z-index: 1000; 
            display: none; transform: translate(-50%, -50%);
            box-shadow: 0 0 10px #00ffff;
        }
    </style>
