<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>🍎 带余除法 · 苹果分组</title>
  <style>
    /* 浅色明亮主题 */
    :root {
      --bg-main: #f8f7f2;
      --bg-panel: #ffffff;
      --bg-panel-alt: #f0ede6;
      --border: #d9d2c5;
      --text: #3d352b;
      --text-dim: #7d7262;
      --accent: #3a86ff;
      --accent2: #ff6b35;
      --accent3: #4caf50;
      --accent4: #ffd166;
      --danger: #e63946;
      --panel-width: 300px;
      --header-h: 48px;
      --transition: 0.3s ease;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(0,0,0,0.06);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
      background: var(--bg-main);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #mobile-header {
      display: none;
    }

    #main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* 左栏：控制面板 (两栏布局) */
    #left-panel {
      width: var(--panel-width);
      min-width: var(--panel-width);
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding-bottom: 12px;
      box-shadow: 2px 0 12px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
    }

    /* 右栏：3D视口 */
    #center-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #eae7de;
      background-image: radial-gradient(circle at 20% 30%, #f5f0e6 0%, #ddd8cc 100%);
    }

    /* 面板section统一 */
    .panel-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .panel-section:last-child { border-bottom: none; }
    .panel-section h3 {
      font-size: 14px;
      color: var(--accent);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }
    .panel-section h3::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--accent);
      border-radius: 3px;
    }

    /* 控件标准化 */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .btn {
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-panel-alt);
      color: var(--text);
      transition: all 0.2s;
      white-space: nowrap;
      font-weight: 500;
      box-shadow: 0 1px 2px rgba(0,0,0,0.02);
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); background: #f1f4fe; }
    .btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(255,107,53,0.08); }
    .btn.accent { border-color: var(--accent); color: var(--accent); background: rgba(58,134,255,0.06); }
    .btn.primary { background: var(--accent); color: white; border-color: var(--accent); }
    .btn.primary:hover { background: #2a6fd9; border-color: #2a6fd9; color: white; }
    .btn.secondary { background: var(--accent2); color: white; border-color: var(--accent2); }
    .btn.secondary:hover { background: #e55a2b; border-color: #e55a2b; color: white; }
    .btn.info { background: #6c757d; color: white; border-color: #6c757d; }
    .btn.info:hover { background: #5a6268; border-color: #5a6268; color: white; }
    .btn:disabled { opacity: 0.5; pointer-events: none; }

    .input-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 6px 0 4px;
      flex-wrap: wrap;
    }
    .input-group label {
      font-size: 13px;
      color: var(--text-dim);
      min-width: 48px;
    }
    .input-group input[type="number"] {
      width: 70px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-panel-alt);
      color: var(--text);
      font-size: 15px;
      font-weight: 600;
      text-align: center;
      transition: 0.2s;
    }
    .input-group input[type="number"]:focus {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 3px rgba(58,134,255,0.15);
    }

    /* 数据行 (左栏内) */
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .data-row .label { color: var(--text-dim); }
    .data-row .value { color: var(--text); font-weight: 600; text-align: right; }

    /* 步骤提示区域 */
    .step-box {
      background: var(--bg-panel-alt);
      border-radius: 10px;
      padding: 12px 14px;
      margin: 6px 0 4px;
      min-height: 60px;
    }
    .step-box .step-text {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
    }
    .step-box .step-counter {
      font-size: 13px;
      color: var(--accent2);
      font-weight: 500;
      margin-top: 4px;
    }

    /* 公式展示 */
    .formula-big {
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      background: var(--bg-panel-alt);
      padding: 10px 12px;
      border-radius: 12px;
      text-align: center;
      margin: 8px 0;
      letter-spacing: 1px;
    }
    .formula-big .highlight { color: var(--accent2); }

    /* 新增：总数÷份数=每份数……余数 公式卡片 */
    .formula-card {
      background: linear-gradient(135deg, #fff5e6, #fef9ef);
      border: 1px solid #f0d9b5;
      border-radius: 12px;
      padding: 12px 14px;
      margin: 8px 0 4px;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      color: #5a4a3a;
      letter-spacing: 0.5px;
    }
    .formula-card .hl { color: var(--accent2); }
    .formula-card .sub {
      font-size: 13px;
      font-weight: 400;
      color: var(--text-dim);
      display: block;
      margin-top: 4px;
    }

    /* 信息卡片 (叠加在视口上) */
    .info-card {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--accent);
      border-radius: 14px;
      padding: 12px 22px;
      max-width: 420px;
      color: var(--text);
      font-size: 15px;
      line-height: 1.6;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      z-index: 6;
      text-align: center;
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    }
    .info-card.visible { opacity: 1; }

    #three-container {
      width: 100%;
      height: 100%;
      display: block;
    }

    .drag-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.85);
      border-radius: 30px;
      padding: 8px 20px;
      font-size: 14px;
      color: var(--text-dim);
      border: 1px solid var(--border);
      backdrop-filter: blur(4px);
      pointer-events: none;
      z-index: 5;
      transition: opacity 0.6s;
    }

    /* 庆祝粒子容器 (全屏覆盖) */
    #celebration-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 100;
      overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      width: 10px; height: 10px;
      opacity: 0;
      animation: confettiFall 1.8s ease-out forwards;
    }
    @keyframes confettiFall {
      0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
      100% { opacity: 0; transform: translateY(90vh) rotate(720deg) scale(0.3); }
    }

    /* 响应式 */
    @media (max-width: 900px) {
      #mobile-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        height: var(--header-h);
        background: var(--bg-panel);
        border-bottom: 1px solid var(--border);
      }
      #mobile-header h1 { font-size: 16px; color: var(--text); font-weight: 600; }
      #mobile-header .btn { font-size: 13px; padding: 4px 12px; }
      #left-panel {
        position: fixed;
        left: 0;
        top: var(--header-h);
        bottom: 0;
        z-index: 50;
        margin-left: calc(-1 * var(--panel-width) - 8px);
        transition: margin-left var(--transition);
        box-shadow: 4px 0 20px rgba(0,0,0,0.08);
      }
      #left-panel.open { margin-left: 0; }
    }
  </style>
</head>

<div id="app">
  <!-- 移动端头部 -->
  <header id="mobile-header">
    <h1>🍎 带余除法</h1>
    <button class="btn" onclick="document.getElementById('left-panel').classList.toggle('open')">☰ 控制</button>
  </header>

  <div id="main-layout">
    <!-- 左栏：控制面板 (两栏布局) -->
    <aside id="left-panel">
      <div class="panel-section">
        <h3>🍎 输入数字</h3>
        <div class="input-group">
          <label>被除数</label>
          <input type="number" id="input-dividend" value="13" min="1" max="30">
        </div>
        <div class="input-group">
          <label>除数</label>
          <input type="number" id="input-divisor" value="4" min="2" max="10">
        </div>
        <div class="btn-row" style="margin-top:10px;">
          <button class="btn primary" id="btn-start">开始分组</button>
          <button class="btn secondary" id="btn-next" disabled>下一步 ➜</button>
          <button class="btn" id="btn-reset">重置</button>
        </div>
      </div>

      <div class="panel-section">
        <h3>📖 当前步骤</h3>
        <div class="step-box">
          <div class="step-text" id="step-text">✏️ 输入数字，点击「开始分组」</div>
          <div class="step-counter" id="step-counter">第 0 步</div>
        </div>
      </div>

      <div class="panel-section">
        <h3>📊 分组状态</h3>
        <div class="data-row"><span class="label">已分组苹果</span><span class="value" id="grouped-apples">0</span></div>
        <div class="data-row"><span class="label">剩余苹果</span><span class="value" id="remaining-apples">0</span></div>
        <div class="data-row"><span class="label">完整组数 (商)</span><span class="value" id="current-quotient">0</span></div>
        <div class="data-row"><span class="label">每组个数 (除数)</span><span class="value" id="current-divisor">4</span></div>
      </div>

      <div class="panel-section">
        <h3>🧮 完整算式</h3>
        <div id="formula-display" class="formula-big">—</div>
        <div style="margin-top:6px; font-size:13px; color:var(--text-dim);" id="extra-info">等待分组完成</div>
      </div>

      <!-- 新增：总数÷份数=每份数……余数 公式 -->
      <div class="panel-section">
        <h3>📐 核心公式</h3>
        <div class="formula-card">
          <span class="hl">总数</span> ÷ <span class="hl">份数</span> = <span class="hl">每份数</span> …… <span class="hl">余数</span>
          <span class="sub">被除数 ÷ 除数 = 商 …… 余数</span>
        </div>
        <div style="font-size:12px; color:var(--text-dim); margin-top:4px; text-align:center;">
          余数 &lt; 除数 &nbsp;|&nbsp; 0 ≤ 余数 &lt; 除数
        </div>
      </div>

      <div class="panel-section" style="border-bottom: none;">
        <h3>✨ 快速示例</h3>
        <div class="btn-row">
          <button class="btn" data-example="13,4">13÷4</button>
          <button class="btn" data-example="17,5">17÷5</button>
          <button class="btn" data-example="20,3">20÷3</button>
          <button class="btn" data-example="25,6">25÷6</button>
          <button class="btn" data-example="11,2">11÷2</button>
        </div>
        <div style="margin-top:6px; font-size:12px; color:var(--text-dim);">💡 点击切换，自动开始</div>
      </div>
    </aside>

    <!-- 右栏：3D视口 -->
    <main id="center-panel">
      <div id="three-container"></div>
      <div id="step-info" class="info-card">👋 输入数字，点击「开始分组」</div>
      <div class="drag-hint" id="drag-hint">🖱️ 拖拽苹果到对应分组区域</div>
    </main>
  </div>

  <!-- 庆祝容器 -->
  <div id="celebration-container"></div>
</div>
