<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>棘轮机构 · 外啮合 / 内啮合 对照</title>
<style>
  :root{
    --ink:#1a2735; --ink-2:#5b6b7d; --ink-3:#90a0b0;
    --line:#e6ebf1; --line-2:#f0f3f7;
    --brass:#c9871f; --cyan:#1f8fbe; --coral:#d9633f;
    --card-shadow:0 22px 55px -26px rgba(28,52,92,.30), 0 2px 8px rgba(28,52,92,.05);
    --mono:"SFMono-Regular",ui-monospace,"Cascadia Code","Roboto Mono",Menlo,Consolas,monospace;
    --sans:"Inter","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#ffffff;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .page{min-height:100%;display:flex;flex-direction:column;
    padding:30px clamp(16px,4vw,52px) 26px;gap:22px;max-width:1480px;margin:0 auto}

  /* header */
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
  .top .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--cyan);margin-bottom:9px}
  .top h1{font-size:clamp(22px,3vw,32px);font-weight:800;letter-spacing:.02em;line-height:1.05}
  .top h1 b{color:var(--brass)}
  .top p{margin-top:10px;color:var(--ink-2);font-size:14px}
  .top p .arrow{color:var(--cyan);font-weight:700;padding:0 5px}

  /* toolbar */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{font-family:var(--sans);font-size:13px;font-weight:600;color:#2a3b4d;background:#f5f8fb;
    border:1px solid var(--line);border-radius:11px;padding:10px 16px;cursor:pointer;transition:.16s;letter-spacing:.02em}
  button:hover{border-color:var(--cyan);color:var(--cyan);background:#fff}
  button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  button.on{border-color:var(--brass);color:var(--brass);background:#fffaf0}
  button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
  button.primary:hover{background:#2a3b4d;color:#fff;border-color:#2a3b4d}
  .slider{display:flex;align-items:center;gap:11px;background:#f5f8fb;border:1px solid var(--line);border-radius:11px;padding:9px 16px}
  .slider label{font-size:11px;font-family:var(--mono);letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
  input[type=range]{-webkit-appearance:none;appearance:none;width:108px;height:4px;border-radius:4px;
    background:linear-gradient(90deg,var(--cyan),var(--brass));outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:#fff;cursor:pointer;border:2px solid var(--cyan);box-shadow:0 1px 4px rgba(0,0,0,.15)}
  input[type=range]::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:#fff;cursor:pointer;border:2px solid var(--cyan)}

  /* grid of cards */
  main.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;flex:1;min-height:0}
  @media (max-width:980px){ main.grid{grid-template-columns:1fr} }

  .card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--card-shadow);
    display:flex;flex-direction:column;overflow:hidden}
  .card-head{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid var(--line-2)}
  .card-head .left{display:flex;align-items:center;gap:13px}
  .idx{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;flex:none}
  .card.ext .idx{background:var(--brass)} .card.int .idx{background:var(--cyan)}
  .card-head h2{font-size:16px;font-weight:750;letter-spacing:.01em}
  .card-head .desc{font-size:12px;color:var(--ink-2);margin-top:2px}
  .chip{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--ink-2);
    border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}

  .viewport{position:relative;width:100%;aspect-ratio:1/0.84;
    background:radial-gradient(120% 100% at 50% 38%,#ffffff 0%,#eef2f7 100%)}
  .viewport canvas{position:absolute;inset:0;display:block;z-index:1}

  .badge{position:absolute;top:13px;right:13px;z-index:2;display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-family:var(--mono)}
  .badge .phase{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;
    background:rgba(255,255,255,.92);border:1px solid var(--line);font-size:12.5px;font-weight:700;letter-spacing:.04em;
    box-shadow:0 4px 14px -6px rgba(28,52,92,.25);transition:.25s}
  .badge .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3);transition:.25s}
  .badge.drive .phase{border-color:var(--brass);color:var(--brass)} .badge.drive .dot{background:var(--brass);box-shadow:0 0 9px var(--brass)}
  .badge.idle .phase{border-color:var(--cyan);color:var(--cyan)} .badge.idle .dot{background:var(--cyan);box-shadow:0 0 9px var(--cyan)}
  .badge .note{font-size:10px;color:var(--ink-2);background:rgba(255,255,255,.82);padding:3px 9px;border-radius:999px;max-width:230px;text-align:right}

  .tele{position:absolute;left:13px;bottom:13px;z-index:2;display:flex;gap:7px;flex-wrap:wrap;max-width:78%}
  .cell{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:10px;padding:7px 11px;box-shadow:0 4px 14px -8px rgba(28,52,92,.25)}
  .cell .k{font-family:var(--mono);font-size:9px;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
  .cell .v{font-family:var(--mono);font-size:15px;font-weight:700;margin-top:2px;color:var(--ink)}
  .cell .v small{font-size:10px;color:var(--ink-3);font-weight:400}
  .cell.b .v{color:var(--brass)} .cell.c .v{color:var(--cyan)}
  .vp-hint{position:absolute;right:13px;bottom:11px;z-index:2;font-family:var(--mono);font-size:10px;color:var(--ink-3)}

  footer.foot{text-align:center;color:var(--ink-2);font-size:13px;padding-top:2px}
  footer .formula{font-family:var(--mono);color:var(--ink);background:#f5f8fb;border:1px solid var(--line);
    border-radius:999px;padding:6px 16px;display:inline-block;letter-spacing:.02em}
  footer .formula b{color:var(--brass)} footer .formula i{color:var(--cyan);font-style:normal}
  footer .sub{margin-top:9px;color:var(--ink-3);font-size:12px}
</style>
</head>
