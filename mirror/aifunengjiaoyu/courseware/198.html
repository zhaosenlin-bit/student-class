<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>影响水土流失因素探究 - 互动模型</title>
    <style>
        :root {
            --bg: #f5f0e8;
            --card-bg: #ffffff;
            --text: #3e3a35;
            --text-secondary: #6b6359;
            --accent: #5a9e6f;
            --accent2: #7db892;
            --danger: #c47f5a;
            --warning: #d4a853;
            --slider-rain: #4a90c4;
            --slider-slope: #c4885a;
            --slider-veg: #5a9e5f;
            --slider-soil: #b08968;
            --slider-human: #8b6f9e;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.10);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font);
            background: linear-gradient(160deg, #e8efe4 0%, #f2efe8 30%, #eef4f0 60%, #f5f1e9 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        .main-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            text-align: center;
            padding: 8px 0;
        }
        .header h1 {
            font-size: clamp(1.3rem, 2.5vw, 1.75rem);
            font-weight: 700;
            color: #3e5a3c;
            letter-spacing: 0.04em;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .header h1 .icon {
            font-size: 1.5em;
        }
        .header .subtitle {
            font-size: 0.85rem;
            color: #7a8a6e;
            margin-top: 2px;
            letter-spacing: 0.05em;
        }

        .content-wrapper {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .canvas-card {
            flex: 1 1 55%;
            min-width: 340px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            position: relative;
            border: 1px solid #e8e3da;
        }
        .canvas-card canvas {
            display: block;
            width: 100%;
            height: auto;
            cursor: default;
        }
        .canvas-card .badge-row {
            position: absolute;
            top: 10px;
            left: 12px;
            right: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            pointer-events: none;
            z-index: 2;
        }
        .badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.03em;
            white-space: nowrap;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: var(--transition);
        }
        .badge-level-safe {
            background: rgba(120, 180, 140, 0.75);
            color: #1a3d1f;
        }
        .badge-level-warning {
            background: rgba(220, 170, 80, 0.78);
            color: #3d2e0f;
        }
        .badge-level-danger {
            background: rgba(210, 130, 85, 0.78);
            color: #3d1a0f;
        }
        .badge-level-severe {
            background: rgba(190, 80, 60, 0.80);
            color: #fff;
        }

        .control-card {
            flex: 1 1 38%;
            min-width: 280px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            border: 1px solid #e8e3da;
        }
        .control-card h3 {
            font-size: 1rem;
            font-weight: 700;
            color: #3e5a3c;
            margin: 0 0 2px 0;
            letter-spacing: 0.03em;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .control-card h3 .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .slider-label-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.02em;
        }
        .slider-value-tag {
            font-size: 0.75rem;
            font-weight: 700;
            min-width: 40px;
            text-align: right;
            padding: 2px 8px;
            border-radius: 12px;
            letter-spacing: 0.03em;
            transition: var(--transition);
        }
        .slider-desc {
            font-size: 0.68rem;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            margin-top: -2px;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            transition: var(--transition);
            background: #e5dfd5;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 3px solid #fff;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
            transition: var(--transition);
            background: #fff;
        }
        input[type="range"]::-webkit-slider-thumb:active {
            transform: scale(1.1);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
        }
        .slider-rain input[type="range"] {
            background: linear-gradient(90deg, #b0d4f1, #3178b8);
        }
        .slider-rain input[type="range"]::-webkit-slider-thumb {
            background: #4a90c4;
            border-color: #d0e8f8;
        }
        .slider-slope input[type="range"] {
            background: linear-gradient(90deg, #e8d5c0, #b8723c);
        }
        .slider-slope input[type="range"]::-webkit-slider-thumb {
            background: #c48050;
            border-color: #f5e6d8;
        }
        .slider-veg input[type="range"] {
            background: linear-gradient(90deg, #d5e8d0, #3d7a3f);
        }
        .slider-veg input[type="range"]::-webkit-slider-thumb {
            background: #5a9e5f;
            border-color: #d8f0d6;
        }
        .slider-soil input[type="range"] {
            background: linear-gradient(90deg, #e0d0b8, #8b5e3c);
        }
        .slider-soil input[type="range"]::-webkit-slider-thumb {
            background: #a07850;
            border-color: #f0e4d4;
        }
        .slider-human input[type="range"] {
            background: linear-gradient(90deg, #e0d8e8, #6b4f8a);
        }
        .slider-human input[type="range"]::-webkit-slider-thumb {
            background: #8b6f9e;
            border-color: #e8dff0;
        }

        .index-display {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: #faf9f5;
            border-radius: var(--radius-sm);
            border: 2px dashed #e0dcd3;
            flex-wrap: wrap;
        }
        .index-circle {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.1rem;
            color: #fff;
            letter-spacing: 0.03em;
            transition: var(--transition);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }
        .index-info {
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.5;
            letter-spacing: 0.02em;
        }
        .index-info strong {
            color: var(--text);
            font-size: 0.9rem;
        }

        .preset-row {
            display: flex;
            gap: 7px;
            flex-wrap: wrap;
        }
        .preset-btn {
            flex: 1;
            min-width: 60px;
            padding: 8px 10px;
            border-radius: 20px;
            border: 1.5px solid #d8d3c8;
            background: #fdfcf9;
            cursor: pointer;
            font-size: 0.72rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            transition: var(--transition);
            color: var(--text);
            white-space: nowrap;
            font-family: var(--font);
        }
        .preset-btn:hover {
            background: #f0ede4;
            border-color: #bfb8a8;
            transform: translateY(-1px);
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.08);
        }
        .preset-btn:active {
            transform: scale(0.96);
            transition: 0.1s;
        }
        .preset-btn.active-preset {
            background: #e8efe4;
            border-color: #5a9e6f;
            color: #3e5a3c;
            box-shadow: 0 2px 6px rgba(90, 158, 111, 0.2);
        }

        @media (max-width: 768px) {
            .content-wrapper { flex-direction: column; }
            .canvas-card, .control-card { min-width: auto; flex: 1 1 auto; }
            .control-card { padding: 14px 14px; gap: 10px; }
            .control-card h3 { font-size: 0.9rem; }
            .slider-label-row { font-size: 0.76rem; }
            input[type="range"] { height: 7px; }
            input[type="range"]::-webkit-slider-thumb { width: 28px; height: 28px; }
            .index-circle { width: 46px; height: 46px; font-size: 0.95rem; }
            .preset-btn { font-size: 0.68rem; padding: 7px 8px; }
            .badge { font-size: 0.65rem; padding: 3px 8px; }
        }
        @media (max-width: 400px) {
            body { padding: 6px; }
            .control-card { padding: 10px 10px; gap: 7px; border-radius: var(--radius-sm); }
            .canvas-card { border-radius: var(--radius-sm); }
            .slider-label-row { font-size: 0.7rem; }
            .preset-btn { font-size: 0.64rem; padding: 6px 6px; border-radius: 16px; }
            input[type="range"]::-webkit-slider-thumb { width: 24px; height: 24px; }
        }
    </style>
</head>

<div class="main-container">
    <div class="header">
        <h1><span class="icon">🌍</span>影响水土流失的因素探究</h1>
        <p class="subtitle">粤教版初中地理 · 互动探究模型</p>
    </div>

    <div class="content-wrapper">
        <div class="canvas-card" id="canvasCard">
            <div class="badge-row" id="badgeRow">
                <span class="badge badge-level-safe" id="badgeLevel">✅ 轻微流失</span>
                <span class="badge" style="background:rgba(255,255,255,0.7);color:#3e5a3c;" id="badgeIndex">风险指数: 18</span>
            </div>
            <canvas id="mainCanvas" aria-label="水土流失影响因素可视化模型"></canvas>
        </div>

        <div class="control-card" id="controlCard">
            <h3><span class="dot" style="background:#4a90c4;"></span>影响因素调节</h3>

            <div class="slider-group slider-rain">
                <div class="slider-label-row"><span>🌧️ 降水强度</span><span class="slider-value-tag" style="background:#e8f2fa;color:#2c6080;" id="rainTag">中雨</span></div>
                <input type="range" id="rainSlider" min="0" max="100" value="40" step="1">
                <span class="slider-desc">降水量越大，对地表冲刷越强（伴有雨声）</span>
            </div>
            <div class="slider-group slider-slope">
                <div class="slider-label-row"><span>⛰️ 地面坡度</span><span class="slider-value-tag" style="background:#faf0e6;color:#6b3a1f;" id="slopeTag">18°</span></div>
                <input type="range" id="slopeSlider" min="0" max="100" value="35" step="1">
                <span class="slider-desc">坡度越大，水流速度越快，侵蚀越强</span>
            </div>
            <div class="slider-group slider-veg">
                <div class="slider-label-row"><span>🌿 植被覆盖率</span><span class="slider-value-tag" style="background:#e6f2e4;color:#2d5a28;" id="vegTag">65%</span></div>
                <input type="range" id="vegSlider" min="0" max="100" value="65" step="1">
                <span class="slider-desc">植被根系固土，枝叶截留雨水</span>
            </div>
            <div class="slider-group slider-soil">
                <div class="slider-label-row"><span>🟫 土壤疏松度</span><span class="slider-value-tag" style="background:#f5ede4;color:#5c3a1e;" id="soilTag">中等</span></div>
                <input type="range" id="soilSlider" min="0" max="100" value="45" step="1">
                <span class="slider-desc">土壤越疏松，越容易被冲刷</span>
            </div>
            <div class="slider-group slider-human">
                <div class="slider-label-row"><span>👤 人类活动强度</span><span class="slider-value-tag" style="background:#f0ebf5;color:#4a3068;" id="humanTag">较低</span></div>
                <input type="range" id="humanSlider" min="0" max="100" value="20" step="1">
                <span class="slider-desc">毁林开荒、过度放牧等加剧流失</span>
            </div>

            <div class="index-display">
                <div class="index-circle" id="indexCircle" style="background:#7db892;">18</div>
                <div class="index-info"><strong>水土流失风险指数</strong><br><span id="indexDesc">轻微流失 — 生态环境良好</span></div>
            </div>

            <div class="preset-row">
                <button class="preset-btn active-preset" data-preset="normal">🌤️ 一般情况</button>
                <button class="preset-btn" data-preset="heavyrain">🌧️ 暴雨冲刷</button>
                <button class="preset-btn" data-preset="bare">🏜️ 植被稀少</button>
                <button class="preset-btn" data-preset="steep">⛰️ 陡坡垦殖</button>
                <button class="preset-btn" data-preset="good">🌳 生态良好</button>
            </div>
        </div>
    </div>
