		function drawLineBetweenPoints(y1, z1, y2, z2, color) {
		    // Create two points in the Y-Z plane (X is fixed at 0)
		    const points = [
		        new THREE.Vector3(0, y1, z1), // Start point (y1, z1)
		        new THREE.Vector3(0, y2, z2)  // End point (y2, z2)
		    ];
		
		    // Create the geometry from the points
		    const geometry = new THREE.BufferGeometry().setFromPoints(points);
		
		    // Create material for the line
		    const material = new THREE.LineBasicMaterial({ color: color });
		
		    // Create the line

		    // Add the line to the scene
		    scene.add(line);
		}
		function drawArc(center, radius, startAngleDeg, endAngleDeg, color) {
		    const points = [];
		    const segments = 100; // Number of points to make the arc smooth
		
		    // Convert degrees to radians
		    const startAngleRad = THREE.MathUtils.degToRad(startAngleDeg);
		    const endAngleRad = THREE.MathUtils.degToRad(endAngleDeg);
		
		    // Loop through the angles to create points
		    for (let i = 0; i <= segments; i++) {
		        const t = i / segments;
		        const angle = startAngleRad + t * (endAngleRad - startAngleRad);
		
		        // Parametric equations for a circle in the Y-Z plane
		        const y = center.y + radius * Math.sin(angle);
		        const z = center.z + radius * Math.cos(angle);
		
		        // X remains fixed at center.x (for Y-Z plane)
		        points.push(new THREE.Vector3(center.x, y, z));
		    }
		
		    // Create the geometry from points
		    const geometry = new THREE.BufferGeometry().setFromPoints(points);
		
		    // Create the material for the arc
		    const material = new THREE.LineBasicMaterial({ color: color });
		
		    // Create the arc line
		    const arcLine = new THREE.Line(geometry, material);
		
		    // Add the arc to the scene
		    scene.add(arcLine);
		}
		function addPenumbraTangentLinesYZPlane(r_left, r_right, len, color) {
	    // Calculate the slope: change in radius over length
	    const slope = (r_right - r_left) / len;
	
	    // Points at the base of the cone (positive Y for top, negative Y for bottom)
	    const yOffsets = [r_left, -r_left]; // Top and Bottom
	
	    for (let i = 0; i < 2; i++) {
	        const baseY = yOffsets[i]; // Y-coordinate for top and bottom lines
	        const baseZ = 0; // Start at Z=0
	
	        // For bottom line, invert the slope to align with cone edge
	        const direction = baseY > 0 ? 1 : -1;
	
	        // Apply slope with the correct direction
	        const endY = baseY + slope * len * direction;
	        const endZ = -len; // Extend backward along Z-axis
	
	        // Create geometry for the line
	        const geometry = new THREE.BufferGeometry().setFromPoints([
	            new THREE.Vector3(0, baseY, baseZ), // Start point
	            new THREE.Vector3(0, endY, endZ)    // End point along the cone edge
	        ]);
	
	        // Create material for the line
	        const material = new THREE.LineBasicMaterial({ color: color });
	
	        // Create the line and add to the scene
	        const line = new THREE.Line(geometry, material);
	        scene.add(line);
	    }
	}
		function addPenumbraTangentLinesYZPlane3(r_left, r_right, len, color) {
		    // Calculate the slope: change in radius over length
		    const slope = (r_right - r_left) / len;
		
		    // Points at the base of the cone
		    const baseY = r_left; 
		    const baseZ = 0;
		
		    // Define Y positions for the two lines (right and left)
		    const yOffsets = [r_left, -r_left]; // Positive Y (right) and Negative Y (left)
		
		    // Loop to create only 2 lines (right and left Penumbra edges)
		    for (let i = 0; i < 2; i++) {
		        const baseY = yOffsets[i];
		
		        // Calculate end Y and Z based on slope
		        const endY = baseY + slope * len;
		        const endZ = -len; // Extend in the negative Z-axis direction
		
		        // Create geometry for the line
		        const geometry = new THREE.BufferGeometry().setFromPoints([
		            new THREE.Vector3(0, baseY, baseZ), // Base of the Penumbra cone
		            new THREE.Vector3(0, endY, endZ)    // End point along the cone slope
		        ]);
		
		        // Create line material
		        const material = new THREE.LineBasicMaterial({ color: color });
		
		        // Create and add the line to the scene
		        const line = new THREE.Line(geometry, material);
		        scene.add(line);
		    }
		}

		function displayMoonDistanceRatio() {
		    // Constants
		    const earthDiameter = 12742; // Earth's diameter in km
		    const numerator = 28 * 24; // Convert 28 days to hours (28 * 24 = 672)
		    const denominator = 3.5; // 3.5 hours
		
		    // Calculate the ratio
		    const timeRatio = numerator / denominator;
		
		    // Solve for Distance to Moon using:
		    // timeRatio = (2 * pi * Distance) / Earth's Diameter
		    const distanceToMoon = (timeRatio * earthDiameter) / (2 * Math.PI);
		
		    // Create or update the HTML element to display the information
		    let infoDiv = document.getElementById('moonDistanceInfo');
