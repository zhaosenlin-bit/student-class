<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.2, user-scalable=yes">
    <title>植树问题 · 自定义参数</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-deep: #e6f4f1;
            --bg-panel: #e6f4f1;
            --bg-panel-alt: #d4ece6;
            --border: #8fc9c0;
            --text: #1e3a3a;
            --text-dim: #5b7f7a;
            --accent: #0f766e;
            --accent2: #0d5e5a;
            --accent3: #2b9c8a;
            --accent4: #5cc5b0;
            --danger: #e63946;
            --panel-width: 280px;
            --header-h: 48px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --radius: 16px;
            --shadow-card: 0 8px 24px rgba(15, 118, 110, 0.15);
        }

        body, html {
            height: 100%;
            font-family: 'Segoe UI', 'Poppins', system-ui, -apple-system, sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            overflow: hidden;
            touch-action: manipulation;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            width: 100vw;
            background: var(--bg-deep);
        }

        #main-layout {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #f0faf8;
        }

        #canvas-wrap {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #stage-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #f0faf8;
            touch-action: none;
        }

        .float-card {
            position: absolute;
            background: rgba(240, 250, 248, 0.92);
            backdrop-filter: blur(6px);
            border: 2px solid var(--accent4);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            padding: 12px 18px;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.3s ease;
            color: var(--text);
            font-size: 1.1rem;
            line-height: 1.5;
            max-width: 400px;
            text-align: center;
        }

        .float-card.visible {
            opacity: 1;
            transform: translateY(0);
        }
        .float-card:not(.visible) {
            opacity: 0;
            transform: translateY(12px);
        }

        #knowledge-card {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            font-weight: 600;
            background: rgba(240, 250, 248, 0.96);
            border-color: var(--accent);
            font-size: 1.3rem;
            padding: 16px 28px;
            border-width: 3px;
            max-width: 80%;
            box-shadow: 0 8px 32px rgba(15, 118, 110, 0.18);
        }
        #knowledge-card small {
            font-weight: 400;
            font-size: 0.85rem;
            color: var(--text-dim);
            display: block;
            margin-top: 6px;
        }

        #data-card {
            bottom: 100px;
            right: 24px;
            pointer-events: none;
            text-align: right;
            background: rgba(240, 250, 248, 0.94);
            min-width: 180px;
            font-size: 1.2rem;
            padding: 16px 22px;
            border-color: var(--accent3);
        }
        #data-card .data-row {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            padding: 4px 0;
            font-size: 1rem;
            border-bottom: 1px dashed rgba(15, 118, 110, 0.2);
        }
        #data-card .data-row:last-child {
            border-bottom: none;
        }
        #data-card .label {
            color: var(--text-dim);
            font-weight: 400;
        }
        #data-card .value {
            font-weight: 700;
            color: var(--accent2);
        }

        #stage-nav {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 14px;
            align-items: center;
            background: rgba(240, 250, 248, 0.92);
            backdrop-filter: blur(6px);
            padding: 10px 22px;
            border-radius: 60px;
            border: 2px solid var(--accent4);
            box-shadow: var(--shadow-card);
            pointer-events: auto;
            z-index: 20;
        }

        .nav-btn {
            background: var(--bg-panel-alt);
            border: none;
            border-radius: 40px;
            padding: 12px 24px;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            display: flex;
            align-items: center;
            gap: 6px;
            border: 2px solid transparent;
            min-width: 60px;
            justify-content: center;
        }
        .nav-btn:hover {
            background: var(--accent4);
            border-color: var(--accent);
            color: #0d2e2a;
            transform: scale(0.96);
        }
        .nav-btn:active {
            transform: scale(0.92);
        }
        .nav-btn.primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent2);
        }
        .nav-btn.primary:hover {
            background: var(--accent2);
        }

        #stage-indicator {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--accent2);
            min-width: 80px;
            text-align: center;
            letter-spacing: 1px;
        }

        #stage-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--accent);
            color: white;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(15, 118, 110, 0.3);
            border: 2px solid white;
            pointer-events: none;
            z-index: 5;
        }

        /* 自定义控制面板 - 浮动在左下角 */
        #control-panel {
            position: absolute;
            bottom: 90px;
            left: 20px;
            background: rgba(240, 250, 248, 0.94);
            backdrop-filter: blur(6px);
            border: 2px solid var(--accent4);
            border-radius: var(--radius);
            box-shadow: var(--shadow-card);
            padding: 16px 20px;
            pointer-events: auto;
            z-index: 25;
            min-width: 200px;
            max-width: 260px;
        }
        #control-panel h4 {
            font-size: 0.9rem;
            color: var(--accent2);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .ctrl-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 12px;
        }
        .ctrl-row:last-child {
            margin-bottom: 0;
        }
        .ctrl-row label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-dim);
            display: flex;
            justify-content: space-between;
        }
        .ctrl-row label span {
            color: var(--accent2);
            font-weight: 700;
        }
        .ctrl-row input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            outline: none;
            margin: 4px 0;
        }
        .ctrl-row input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(15,118,110,0.3);
        }
        .ctrl-row input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
        }

        @media (max-width: 700px) {
            #knowledge-card {
                font-size: 1.1rem;
                padding: 12px 18px;
                top: 12px;
                max-width: 90%;
            }
            #knowledge-card small {
                font-size: 0.7rem;
            }
            #data-card {
                bottom: 80px;
                right: 12px;
                padding: 12px 16px;
                min-width: 140px;
                font-size: 1rem;
            }
            #data-card .data-row {
                font-size: 0.85rem;
                gap: 10px;
            }
            #stage-nav {
                padding: 8px 12px;
                gap: 8px;
                bottom: 12px;
                border-radius: 40px;
            }
            .nav-btn {
                padding: 8px 14px;
                font-size: 1.1rem;
                min-width: 48px;
            }
            #stage-indicator {
                font-size: 0.9rem;
                min-width: 60px;
            }
            #stage-badge {
                font-size: 0.9rem;
                padding: 4px 12px;
                top: 12px;
                left: 12px;
            }
            #control-panel {
                bottom: 75px;
                left: 10px;
                padding: 12px 14px;
                min-width: 160px;
                max-width: 200px;
            }
            #control-panel h4 {
                font-size: 0.75rem;
            }
            .ctrl-row label {
                font-size: 0.75rem;
            }
        }

        @media (max-width: 480px) {
            #knowledge-card {
                font-size: 0.95rem;
                padding: 10px 14px;
                top: 10px;
            }
            .nav-btn {
                padding: 6px 12px;
                font-size: 1rem;
            }
            #control-panel {
                bottom: 70px;
                left: 6px;
                padding: 10px 12px;
                min-width: 140px;
                max-width: 170px;
            }
        }

        button {
            font-family: inherit;
        }
    </style>
</head>

<div id="app">
    <div id="main-layout">
        <div id="canvas-wrap">
            <canvas id="stage-canvas"></canvas>

            <div id="stage-badge">🌳 植树问题</div>

            <div id="knowledge-card" class="float-card visible">
                🌲 20米公路 · 每隔5米栽一棵树
                <small>两端都栽：棵数 = 段数 + 1</small>
            </div>

            <div id="data-card" class="float-card visible">
                <div class="data-row"><span class="label">总长</span><span class="value" id="d-length">20 米</span></div>
                <div class="data-row"><span class="label">间距</span><span class="value" id="d-width">5 米</span></div>
                <div class="data-row"><span class="label">段数</span><span class="value" id="d-perimeter">4</span></div>
                <div class="data-row"><span class="label">棵数</span><span class="value" id="d-area">5</span></div>
            </div>

            <!-- 自定义参数面板 -->
            <div id="control-panel">
                <h4>📐 自定义参数</h4>
                <div class="ctrl-row">
                    <label>公路长度 <span id="length-val">20</span> 米</label>
                    <input type="range" id="slider-length" min="10" max="50" value="20" step="5">
                </div>
                <div class="ctrl-row">
                    <label>植树间距 <span id="gap-val">5</span> 米</label>
                    <input type="range" id="slider-gap" min="2" max="20" value="5" step="1">
                </div>
            </div>

            <div id="stage-nav">
                <button class="nav-btn" id="prev-btn" aria-label="上一步">◀ 上一步</button>
                <span id="stage-indicator">1 / 3</span>
                <button class="nav-btn primary" id="next-btn" aria-label="下一步">下一步 ▶</button>
            </div>
        </div>
    </div>
</div>
