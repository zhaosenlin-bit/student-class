<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公式争霸</title>
<style>
  :root {
    --gold: #d4a843;
    --gold-light: #f0d68a;
    --red: #c0392b;
    --red-light: #e74c3c;
    --blue: #2980b9;
    --blue-light: #3498db;
    --bg: #1a1a2e;
    --panel-bg: #16213e;
    --text: #e8e8e8;
    --text-dim: #999;
    --card-bg: rgba(255,255,255,0.04);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "Microsoft YaHei", "PingFang SC", "STHeiti", sans-serif;
    background: radial-gradient(ellipse at center, #1a1a2e 0%, #0a0a16 100%);
    color: var(--text);
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  #game-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
  }

  /* ===== 标题栏 ===== */
  #header {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 7vh;
    min-height: 44px;
    background: linear-gradient(180deg, rgba(212,168,67,0.25) 0%, rgba(212,168,67,0.05) 100%);
    border-bottom: 2px solid rgba(212,168,67,0.3);
    flex-shrink: 0;
  }

  #header h1 {
    font-size: clamp(1.3rem, 2.6vw, 2rem);
    letter-spacing: 0.15em;
    background: linear-gradient(180deg, #f0d68a 0%, #d4a843 50%, #b8860b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 8px rgba(212,168,67,0.4));
  }

  #header .icon { font-size: 1.6rem; margin: 0 10px; }

  /* ===== 对战主体 ===== */
  #arena {
    display: flex;
    flex: 1;
    position: relative;
    min-height: 0;
  }

  /* VS 分隔 */
  #vs-line {
    position: absolute;
    left: 50%;
    top: 5%;
    bottom: 5%;
    width: 2px;
    background: linear-gradient(180deg, transparent, rgba(212,168,67,0.35), transparent);
    transform: translateX(-50%);
    z-index: 5;
  }

  #vs-badge {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: linear-gradient(135deg, #d4a843, #b8860b);
    color: #1a1a2e;
    font-weight: 900;
    font-size: 1.3rem;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 6;
    box-shadow: 0 0 25px rgba(212,168,67,0.5), 0 0 50px rgba(212,168,67,0.2);
    animation: vsPulse 2s ease-in-out infinite;
  }

  @keyframes vsPulse {
    0%, 100% { box-shadow: 0 0 25px rgba(212,168,67,0.5), 0 0 50px rgba(212,168,67,0.2); }
    50% { box-shadow: 0 0 45px rgba(212,168,67,0.8), 0 0 80px rgba(212,168,67,0.4); }
  }

  /* ===== 玩家面板 ===== */
  .player-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2vh 2vw;
    position: relative;
    min-width: 0;
    overflow: hidden;
  }

  #panel-left  { background: linear-gradient(170deg, rgba(192,57,43,0.12) 0%, rgba(123,36,28,0.04) 100%); }
  #panel-right { background: linear-gradient(190deg, rgba(41,128,185,0.12) 0%, rgba(26,82,118,0.04) 100%); }

  /* 角色头像区 */
  .char-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
  }

  .player-emoji {
    font-size: clamp(2.8rem, 6vw, 5rem);
    filter: drop-shadow(0 4px 15px rgba(0,0,0,0.35));
    animation: float 3s ease-in-out infinite;
    transition: transform 0.15s;
    line-height: 1.1;
  }

  #panel-left  .player-emoji { animation-delay: 0s; }
  #panel-right .player-emoji { animation-delay: 1.5s; }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .player-name {
    font-size: clamp(1.1rem, 2vw, 1.5rem);
    font-weight: 900;
    letter-spacing: 0.08em;
    margin-top: 0.3vh;
  }
  #panel-left  .player-name { color: var(--red-light); }
  #panel-right .player-name { color: var(--blue-light); }

  .player-title {
    font-size: clamp(0.65rem, 1.1vw, 0.8rem);
    color: var(--text-dim);
    margin-top: 0.1vh;
  }

  /* 分数 */
  .score-area {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 1.2vh 0;
    flex-shrink: 0;
  }

  .player-score {
    font-size: clamp(2.2rem, 4.5vw, 3.5rem);
    font-weight: 900;
    line-height: 1;
    transition: transform 0.3s;
  }

  #panel-left  .player-score { color: var(--red-light); text-shadow: 0 0 15px rgba(231,76,60,0.4); }
  #panel-right .player-score { color: var(--blue-light); text-shadow: 0 0 15px rgba(52,152,219,0.4); }

  .player-score.pop {
    animation: scorePop 0.45s ease-out;
  }

  @keyframes scorePop {
    0% { transform: scale(1); }
    30% { transform: scale(1.55); }
    100% { transform: scale(1); }
  }

  .score-bar-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }

  .score-label {
    font-size: 0.7rem;
    color: var(--text-dim);
    letter-spacing: 0.06em;
  }

  .score-bar-bg {
    width: clamp(80px, 14vw, 150px);
    height: 7px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
  }

  .score-bar-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  #bar-left  { background: linear-gradient(90deg, var(--red), var(--red-light)); box-shadow: 0 0 8px rgba(231,76,60,0.4); }
  #bar-right { background: linear-gradient(90deg, var(--blue), var(--blue-light)); box-shadow: 0 0 8px rgba(52,152,219,0.4); }

  /* 状态提示 */
  .player-status {
    font-size: clamp(0.7rem, 1.1vw, 0.8rem);
    font-weight: 700;
    min-height: 1.3em;
    transition: all 0.3s;
    flex-shrink: 0;
    margin-top: 0.3vh;
  }
  #panel-left  .player-status { color: var(--red-light); }
  #panel-right .player-status { color: var(--blue-light); }

  /* ===== 题目卡片 ===== */
  .question-card {
    flex: 1;
    width: 92%;
    max-width: 460px;
    background: var(--card-bg);
    border: 1.5px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    padding: 1.5vh 1.2vw;
    display: flex;
    flex-direction: column;
    margin: 1vh 0;
    position: relative;
    overflow: hidden;
    min-height: 0;
  }

  .question-card.flash-green {
    animation: cardFlashGreen 0.6s ease-out;
  }

  .question-card.flash-red {
    animation: cardFlashRed 0.5s ease-out;
  }

  @keyframes cardFlashGreen {
    0% { border-color: rgba(39,174,96,0.6); box-shadow: 0 0 20px rgba(39,174,96,0.3); }
    100% { border-color: rgba(255,255,255,0.08); box-shadow: none; }
  }

  @keyframes cardFlashRed {
    0%, 25% { border-color: rgba(231,76,60,0.8); box-shadow: 0 0 20px rgba(231,76,60,0.4); transform: translateX(-3px); }
    50% { transform: translateX(3px); }
    75% { transform: translateX(-2px); }
    100% { border-color: rgba(255,255,255,0.08); box-shadow: none; transform: translateX(0); }
  }

  .q-tag {
    font-size: 0.65rem;
    color: var(--gold);
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 0.6vh;
    flex-shrink: 0;
  }

  .q-text {
    font-size: clamp(0.85rem, 1.4vw, 1.05rem);
    font-weight: 700;
    color: var(--gold-light);
    line-height: 1.45;
    margin-bottom: 1.2vh;
    flex-shrink: 0;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .q-options {
    display: flex;
    flex-direction: column;
    gap: 0.7vh;
    flex: 1;
  }

  .opt-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,255,255,0.08);
    color: var(--text);
    padding: 9px 14px;
    border-radius: 10px;
    font-size: clamp(0.75rem, 1.2vw, 0.9rem);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    text-align: left;
    flex: 1;
  }

  .opt-btn:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.2);
  }

  .opt-btn:active {
    transform: scale(0.97);
  }

  .opt-letter {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    font-weight: 900;
    font-size: 0.8em;
    flex-shrink: 0;
  }

  #panel-left .opt-letter { background: rgba(231,76,60,0.2); color: var(--red-light); }
  #panel-right .opt-letter { background: rgba(52,152,219,0.2); color: var(--blue-light); }

  .opt-btn.correct-pick {
    background: rgba(39,174,96,0.25) !important;
    border-color: #27ae60 !important;
  }

  .opt-btn.wrong-pick {
    background: rgba(231,76,60,0.25) !important;
    border-color: #e74c3c !important;
  }

  /* 计时条 */
  .q-timer-wrap {
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    margin-top: 1vh;
    overflow: hidden;
    flex-shrink: 0;
  }

  .q-timer-bar {
    height: 100%;
    border-radius: 2px;
    transition: width 0.1s linear;
    width: 100%;
  }

  #panel-left  .q-timer-bar { background: linear-gradient(90deg, var(--red-light), #f39c12, #27ae60); }
  #panel-right .q-timer-bar { background: linear-gradient(90deg, var(--blue-light), #f39c12, #27ae60); }

  .q-timer-bar.warning {
    animation: timerBlink 0.5s linear infinite;
  }

  @keyframes timerBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  /* 键盘提示 */
  .key-hint {
    font-size: clamp(0.6rem, 1vw, 0.7rem);
    color: var(--text-dim);
    margin-top: 0.6vh;
    flex-shrink: 0;
    text-align: center;
  }

  .key {
    display: inline-block;
    background: rgba(255,255,255,0.12);
    padding: 1px 7px;
    border-radius: 3px;
    font-weight: 900;
    margin: 0 1px;
    font-size: 0.9em;
  }

  /* ===== 底部状态 ===== */
  #state-bar {
    height: 4.5vh;
    min-height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(0.8rem, 1.3vw, 0.95rem);
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--gold);
    border-top: 1px solid rgba(212,168,67,0.2);
    flex-shrink: 0;
  }

  /* ===== 开始覆层 ===== */
  #overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.72);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    flex-direction: column;
  }

  #overlay.hidden { display: none; }

  #overlay-card {
    background: linear-gradient(145deg, #1a1a2e, #16213e);
    border: 2px solid rgba(212,168,67,0.3);
    border-radius: 20px;
    padding: 35px 45px;
    text-align: center;
    max-width: 92vw;
  }

  #overlay-card h2 {
    font-size: clamp(1.6rem, 3.5vw, 2.2rem);
    color: var(--gold-light);
    margin-bottom: 6px;
  }

  #overlay-card .subtitle {
    color: var(--text-dim);
    font-size: clamp(0.8rem, 1.3vw, 0.9rem);
    margin-bottom: 16px;
  }

  .char-preview {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
    margin: 14px 0;
  }

  .char-preview .preview-block { text-align: center; }

  .char-preview .preview-emoji {
    font-size: 3.5rem;
    display: block;
  }

  .char-preview .preview-name {
    font-size: 1.1rem;
    font-weight: 900;
    margin-top: 4px;
  }

  .char-preview .preview-vs {
    font-size: 1.6rem;
    font-weight: 900;
    color: var(--gold);
  }

  .controls-hint {
    font-size: 0.78rem;
    color: #999;
    line-height: 1.6;
    margin-bottom: 16px;
  }

  #btn-start, #btn-restart {
    background: linear-gradient(135deg, #d4a843, #b8860b);
    color: #1a1a2e;
    border: none;
    padding: 13px 45px;
    font-size: 1.1rem;
    font-weight: 900;
    border-radius: 28px;
    cursor: pointer;
    letter-spacing: 0.08em;
    font-family: inherit;
    box-shadow: 0 4px 18px rgba(212,168,67,0.3);
    transition: all 0.25s;
  }

  #btn-start:hover, #btn-restart:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 28px rgba(212,168,67,0.5);
  }

  /* ===== 胜利覆层 ===== */
  #victory-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #victory-overlay.hidden { display: none; }

  #victory-canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }

  #victory-content {
    position: relative;
    z-index: 201;
    text-align: center;
    animation: victoryBounce 0.7s ease-out;
  }

  @keyframes victoryBounce {
    0% { transform: scale(0); opacity: 0; }
    55% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }

  #victory-emoji { font-size: 6rem; }

  #victory-winner {
    font-size: clamp(2.2rem, 5vw, 3.5rem);
    font-weight: 900;
    color: var(--gold-light);
    text-shadow: 0 0 30px rgba(212,168,67,0.6);
  }

  #victory-sub {
    font-size: clamp(1rem, 2vw, 1.5rem);
    color: var(--text-dim);
    margin-top: 8px;
  }

  #btn-restart-victory {
    position: relative;
    z-index: 201;
    pointer-events: all;
    margin-top: 28px;
  }

  #btn-restart-victory.hidden { display: none; }

  /* ===== 粒子效果 ===== */
  .particle {
    position: fixed;
    pointer-events: none;
    z-index: 90;
    font-size: 2rem;
    animation: particleFly 1.4s ease-out forwards;
  }

  @keyframes particleFly {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-180px) scale(0); opacity: 0; }
  }

  /* ===== 响应式 ===== */
  @media (max-width: 768px) {
    #arena { flex-direction: column; }
    #vs-line { left: 5%; right: 5%; top: 50%; width: auto; height: 2px; }
    #vs-badge { width: 36px; height: 36px; font-size: 0.9rem; }
    .question-card { max-width: 95%; }
  }
</style>
</head>

    <div class="char-preview">
      <div class="preview-block">

      <div class="preview-block">
        <span class="preview-emoji" id="pv-emoji-right">❓</span>
        <div class="preview-name" id="pv-name-right" style="color:#3498db;">---</div>
