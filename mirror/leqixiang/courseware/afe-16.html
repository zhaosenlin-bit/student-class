<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三角形的边和角</title>
  <style>
    :root {
      --bg: #0d1117; --panel: #161b22; --text: #c9d1d9;
      --border: #30363d; --white: #ffffff; --selected: #00e5ff;
      --right-angle: #ff9800; --accent: #58a6ff; --reset: #238636;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; overflow: hidden;
    }
    .main {
      flex: 1; position: relative;
      display: flex; justify-content: center; align-items: center;
    }
    canvas {
      background: #090c10; border-radius: 12px;
      cursor: grab; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      border: 1px solid var(--border);
      /* 确保 canvas 不会超出容器 */
      max-width: 100%; max-height: 100%;
    }
    canvas:active, canvas.dragging { cursor: grabbing; }
    .toolbar {
      width: 260px; background: var(--panel); padding: 20px;
      display: flex; flex-direction: column; gap: 14px;
      border-left: 1px solid var(--border);
      z-index: 10;
    }
    .toolbar h2 { font-size: 16px; color: var(--white); margin-bottom: 4px; }
    .info-box {
      background: rgba(88, 166, 255, 0.1); padding: 10px;
      border-radius: 6px; font-size: 13px; line-height: 1.5;
      color: #8b949e; border: 1px solid rgba(88, 166, 255, 0.2);
    }
    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .label { font-size: 12px; font-weight: 600; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-row { display: flex; gap: 8px; }
    button {
      flex: 1; padding: 10px; border: none; border-radius: 6px;
      font-weight: 600; cursor: pointer; transition: 0.15s; font-size: 14px;
      user-select: none;
    }
    #btnMinus, #btnPlus { background: var(--accent); color: #fff; }
    #btnMinus:hover:not(:disabled), #btnPlus:hover:not(:disabled) { background: #4c98f0; transform: translateY(-1px); }
    #btnReset { background: var(--reset); color: #fff; width: 100%; }
    #btnReset:hover { background: #2ea043; transform: translateY(-1px); }
    button:disabled { background: #21262d; color: #484f58; cursor: not-allowed; transform: none; }
    input[type="number"] {
      width: 100%; padding: 8px 10px; background: #0d1117;
      border: 1px solid var(--border); border-radius: 6px;
      color: var(--white); font-size: 14px;
    }
    input:focus { outline: none; border-color: var(--accent); }
    .hint { font-size: 11px; color: #6e7681; }
    .selected-info {
      margin-top: auto; padding: 10px; background: rgba(0, 229, 255, 0.05);
      border-radius: 6px; border: 1px solid rgba(0, 229, 255, 0.2);
      font-size: 13px; color: var(--selected);
    }
    .zoom-hint { font-size: 11px; color: #6e7681; text-align: center; margin-top: 4px; }
  </style>
</head>
