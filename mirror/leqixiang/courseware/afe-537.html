<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>分数的基本性质 · 3D探秘</title>
    <style>
        /* === 浅色清新主题 CSS Variables === */
        :root {
            --bg-deep: #f0f7fa;
            --bg-panel: #ffffff;
            --bg-panel-alt: #e8f3f8;
            --border: #b8d4e3;
            --text: #1a3b4c;
            --text-dim: #5b7a8a;
            --accent: #2a9d8f;
            --accent2: #f4a261;
            --accent3: #4caf50;
            --accent4: #e9c46a;
            --danger: #e63946;
            --panel-width: 280px;
            --header-h: 48px;
            --transition: 0.25s ease;
            --radius: 16px;
            --shadow-card: 0 8px 24px rgba(0, 20, 30, 0.10);
            --font-main: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-main);
            background: var(--bg-deep);
            color: var(--text);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            user-select: none;
        }

        /* === 全屏沉浸式布局 === */
        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: var(--bg-deep);
        }

        #three-container {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* === 悬浮控件层 (全屏沉浸式) === */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        #ui-overlay > * {
            pointer-events: auto;
        }

        /* 顶部标题 */
        .floating-header {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 10px 28px;
            border-radius: 60px;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(255, 255, 255, 0.5);
            text-align: center;
            white-space: nowrap;
            font-weight: 600;
            font-size: 20px;
            color: var(--text);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .floating-header span {
            background: var(--accent);
            color: white;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
        }

        /* 底部控制栏 */
        .control-bar {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 16px 28px;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 20px 28px;
            max-width: 92vw;
            pointer-events: auto;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .control-group label {
            font-size: 15px;
            font-weight: 500;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .control-group label i {
            font-style: normal;
            background: var(--bg-panel-alt);
            padding: 0 8px;
            border-radius: 20px;
            font-size: 13px;
        }

        .slider-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .slider-wrap input[type="range"] {
            -webkit-appearance: none;
            width: 100px;
            height: 6px;
            background: var(--border);
            border-radius: 3px;
            outline: none;
            transition: background 0.2s;
        }
        .slider-wrap input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .slider-val {
            min-width: 28px;
            text-align: center;
            font-weight: 600;
            font-size: 16px;
            color: var(--accent);
        }

        .btn-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.5);
            color: var(--text);
            transition: all 0.2s;
            white-space: nowrap;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .btn:hover {
            border-color: var(--accent);
            background: white;
            transform: scale(1.02);
        }
        .btn.active {
            border-color: var(--accent2);
            background: var(--accent2);
            color: white;
        }
        .btn.accent {
            border-color: var(--accent);
            background: var(--accent);
            color: white;
        }
        .btn.accent:hover {
            background: #238b7a;
            border-color: #238b7a;
        }
        .btn.small {
            padding: 4px 12px;
            font-size: 12px;
        }

        /* 右侧信息浮卡 (性质提示) */
        .info-float {
            position: absolute;
            top: 80px;
            right: 20px;
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 20px;
            padding: 16px 20px;
            min-width: 180px;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(255, 255, 255, 0.5);
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        .info-float.hidden {
            opacity: 0;
            transform: translateY(-8px);
        }
        .info-float .title {
            font-weight: 600;
            font-size: 14px;
            color: var(--accent);
            margin-bottom: 4px;
            letter-spacing: 0.3px;
        }
        .info-float .frac-big {
            font-size: 28px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .info-float .frac-big .eq {
            color: var(--accent2);
            font-weight: 400;
            margin: 0 6px;
        }
        .info-float .frac-big .highlight {
            color: var(--accent);
        }
        .info-float .sub {
            font-size: 13px;
            color: var(--text-dim);
            margin-top: 6px;
            border-top: 1px dashed var(--border);
            padding-top: 6px;
        }
        .info-float .sub strong {
            color: var(--text);
        }

        /* 左上角分步引导 */
        .step-guide {
            position: absolute;
            top: 80px;
            left: 20px;
            background: rgba(255, 255, 255, 0.80);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-radius: 20px;
            padding: 14px 18px;
            min-width: 140px;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }
        .step-guide .step-title {
            font-weight: 600;
            font-size: 14px;
            color: var(--accent2);
            margin-bottom: 4px;
        }
        .step-guide .step-desc {
            font-size: 15px;
            color: var(--text);
            font-weight: 500;
        }
        .step-guide .step-desc small {
            font-weight: 400;
            color: var(--text-dim);
            font-size: 13px;
        }

        /* 移动端适应 */
        @media (max-width: 700px) {
            .floating-header {
                font-size: 16px;
                padding: 6px 16px;
                top: 12px;
                white-space: normal;
            }
            .floating-header span {
                font-size: 12px;
            }
            .control-bar {
                bottom: 16px;
                padding: 12px 16px;
                gap: 12px 16px;
                border-radius: 28px;
                flex-wrap: wrap;
                justify-content: center;
                max-width: 96vw;
            }
            .slider-wrap input[type="range"] {
                width: 70px;
            }
            .info-float {
                top: 70px;
                right: 10px;
                min-width: 120px;
                padding: 12px 14px;
            }
            .info-float .frac-big {
                font-size: 22px;
            }
            .step-guide {
                display: none;
            }
            .btn {
                font-size: 12px;
                padding: 4px 12px;
            }
        }

        /* 动画辅助 */
        .pulse-glow {
            animation: pulseGlow 1.6s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(42, 157, 143, 0.2); }
            50% { box-shadow: 0 0 0 8px rgba(42, 157, 143, 0); }
        }
    </style>

                    <label>分母 <i id="denLabel">4</i></label>

        </div>
