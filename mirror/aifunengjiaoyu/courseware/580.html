<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>纸带验证机械能守恒 · 互动工具</title>
    <style>
        :root {
            --bg-deep: #f5f7fa;
            --bg-panel: #ffffff;
            --bg-panel-alt: #f0f3f8;
            --border: #d0d8e6;
            --text: #1a2640;
            --text-dim: #5a6a82;
            --accent: #2a7faa;
            --accent2: #d96c2b;
            --accent3: #3b8c5e;
            --accent4: #d9b84a;
            --danger: #c7444a;
            --panel-width: 300px;
            --right-panel-width: 340px;
            --header-h: 48px;
            --transition: 0.25s ease;
            --radius: 12px;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            line-height: 1.5;
            height: 100vh;
            overflow: hidden;
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #mobile-header {
            display: none;
        }

        #main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #left-panel {
            width: var(--panel-width);
            min-width: var(--panel-width);
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            box-shadow: var(--shadow);
            z-index: 2;
        }

        #center-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-deep);
        }

        #right-panel {
            width: var(--right-panel-width);
            min-width: var(--right-panel-width);
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            box-shadow: var(--shadow);
            z-index: 2;
        }

        .panel-section {
            padding: 16px 16px 14px;
            border-bottom: 1px solid var(--border);
        }
        .panel-section:last-child {
            border-bottom: none;
        }
        .panel-section h3 {
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }
        .panel-section h3::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 16px;
            background: var(--accent);
            border-radius: 3px;
            flex-shrink: 0;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .btn {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-panel-alt);
            color: var(--text);
            transition: all 0.2s;
            white-space: nowrap;
            font-weight: 500;
            line-height: 1.4;
        }
        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(42, 127, 170, 0.04);
        }
        .btn.active {
            border-color: var(--accent2);
            color: var(--accent2);
            background: rgba(217, 108, 43, 0.08);
        }
        .btn.accent {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(42, 127, 170, 0.06);
        }
        .btn.danger {
            border-color: var(--danger);
            color: var(--danger);
            background: rgba(199, 68, 74, 0.06);
        }
        .btn.danger:hover {
            background: rgba(199, 68, 74, 0.12);
        }
        .btn.success {
            border-color: var(--accent3);
            color: var(--accent3);
            background: rgba(59, 140, 94, 0.07);
        }
        .btn.success:hover {
            background: rgba(59, 140, 94, 0.14);
        }

        input[type="number"] {
            width: 100%;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-panel-alt);
            color: var(--text);
            font-size: 14px;
            transition: 0.2s;
            outline: none;
        }
        input[type="number"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(42, 127, 170, 0.15);
        }

        .ctrl-group {
            margin: 6px 0;
        }
        .ctrl-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-dim);
            cursor: pointer;
            padding: 4px 0;
        }
        .ctrl-group label input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }
        .data-row .label {
            color: var(--text-dim);
        }
        .data-row .value {
            color: var(--text);
            font-weight: 600;
            text-align: right;
            font-feature-settings: "tnum";
        }

        .input-hint {
            font-size: 12px;
            color: var(--text-dim);
            margin-top: 4px;
        }

        #tapeCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: pointer;
            background: #fafcff;
        }

        #paper-strip {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 250, 235, 0.95);
            border: 1px solid #d9b84a;
            border-radius: 18px;
            padding: 12px 28px;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 28px rgba(0,0,0,0.08);
            color: #3a2e1a;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.3px;
            pointer-events: none;
            z-index: 5;
            text-align: center;
            white-space: nowrap;
        }
        #paper-strip span {
            background: #f7eed0;
            padding: 2px 12px;
            border-radius: 30px;
            margin: 0 4px;
        }

        #point-info-overlay {
            position: absolute;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 14px 22px;
            max-width: 420px;
            min-width: 220px;
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            z-index: 6;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            backdrop-filter: blur(4px);
            background: rgba(255,255,255,0.94);
        }
        #point-info-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }
        #point-info-overlay strong {
            color: var(--accent);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .data-table th {
            text-align: left;
            font-weight: 600;
            color: var(--accent);
            padding: 6px 4px 4px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            letter-spacing: 0.3px;
        }
        .data-table td {
            padding: 5px 4px 5px 0;
            border-bottom: 1px solid rgba(0,0,0,0.03);
            font-feature-settings: "tnum";
        }
        .data-table tr:last-child td {
            border-bottom: none;
        }
        .data-table .highlight {
            background: rgba(42, 127, 170, 0.06);
            border-radius: 4px;
        }
        .point-idx {
            font-weight: 500;
            color: var(--text-dim);
        }

        @media (max-width: 900px) {
            #mobile-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 14px;
                height: var(--header-h);
                background: var(--bg-panel);
                border-bottom: 1px solid var(--border);
                box-shadow: var(--shadow);
                z-index: 10;
            }
            #mobile-header h1 {
                font-size: 16px;
                color: var(--text);
                font-weight: 600;
            }
            #mobile-header .btn {
                font-size: 13px;
                padding: 5px 12px;
            }

            #left-panel {
                position: fixed;
                left: 0;
                top: var(--header-h);
                bottom: 0;
                z-index: 50;
                margin-left: calc(-1 * var(--panel-width));
                transition: margin-left var(--transition);
                box-shadow: 4px 0 20px rgba(0,0,0,0.08);
            }
            #left-panel.open {
                margin-left: 0;
            }
            #right-panel {
                position: fixed;
                right: 0;
                top: var(--header-h);
                bottom: 0;
                z-index: 50;
                margin-right: calc(-1 * var(--right-panel-width));
                transition: margin-right var(--transition);
                box-shadow: -4px 0 20px rgba(0,0,0,0.08);
            }
            #right-panel.open {
                margin-right: 0;
            }
            #paper-strip {
                bottom: 70px;
                font-size: 13px;
                padding: 8px 16px;
                white-space: normal;
            }
            #point-info-overlay {
                bottom: 130px;
                max-width: 300px;
                font-size: 13px;
                padding: 12px 16px;
            }
        }

        @media (max-width: 480px) {
            .panel-section {
                padding: 12px 12px 10px;
            }
            .data-table {
                font-size: 12px;
            }
            #paper-strip {
                bottom: 60px;
                font-size: 12px;
                padding: 6px 12px;
            }
        }
    </style>
</head>

<div id="app">
    <header id="mobile-header">
        <button class="btn" id="btn-toggle-left">☰ 输入</button>
        <h1>📋 纸带·机械能</h1>
        <button class="btn" id="btn-toggle-right">数据 ▸</button>
    </header>

    <div id="main-layout">
        <aside id="left-panel">
            <div class="panel-section">
                <h3>📐 输入位置 (cm)</h3>
                <div class="ctrl-group">
                    <label>
                        <input type="number" id="positionInput" step="0.01" min="0" placeholder="例: 3.20" value="">
                        <span style="font-size:13px;">cm</span>
                    </label>
                    <div class="btn-row">
                        <button class="btn accent" id="btnAddPoint">➕ 添加点</button>
                        <button class="btn danger" id="btnReset">⟳ 重置</button>
                    </div>
                    <div class="input-hint">输入纸带上打点位置坐标 (单位 cm)，点击添加</div>
                </div>
            </div>
            <div class="panel-section">
                <h3>⚙️ 参数设置</h3>
                <div class="ctrl-group">
                    <label>
                        <span style="width:60px;">质量 m</span>
                        <input type="number" id="massInput" step="0.001" value="0.050" style="width:80px;">
                        <span style="font-size:12px; color:var(--text-dim);">kg</span>
                    </label>
                    <label style="margin-top:6px;">
                        <span style="width:60px;">重力 g</span>
                        <input type="number" id="gravityInput" step="0.1" value="9.8" style="width:80px;">
                        <span style="font-size:12px; color:var(--text-dim);">m/s²</span>
                    </label>
                </div>
                <div class="input-hint">动能 = ½mv², 势能 = mgh</div>
            </div>
            <div class="panel-section">
                <h3>▶️ 模拟打点</h3>
                <div class="btn-row">
                    <button class="btn success" id="btnPlay">▶ 播放</button>
                    <button class="btn" id="btnPause">⏸ 暂停</button>
                    <button class="btn danger" id="btnStop">⏹ 停止</button>
                </div>
                <div class="input-hint" id="playStatus">就绪 · 至少需要2个点</div>
            </div>
            <div class="panel-section" style="border-bottom:none;">
                <h3>📖 操作提示</h3>
                <div style="font-size:13px; color:var(--text-dim); line-height:1.7;">
                    • 点击纸带上的点可查看详情<br>
                    • 至少输入2个点才会计算速度<br>
                    • 时间间隔 T = 0.02 s
                </div>
            </div>
        </aside>

        <main id="center-panel">
            <canvas id="tapeCanvas"></canvas>
            <div id="paper-strip">
                📄 纸带记录 · 相邻点间隔 T = 0.02 s
            </div>
            <div id="point-info-overlay">
                <span id="pointInfoContent">点击纸带上的点查看详情</span>
            </div>
        </main>

        <aside id="right-panel">
            <div class="panel-section">
                <h3>📊 瞬时速度 & 能量</h3>
                <div style="max-height: calc(100vh - 160px); overflow-y: auto;" id="dataTableContainer">
                    <table class="data-table" id="dataTable">
                        <thead>
                            <tr><th>点</th><th>位置(cm)</th><th>v (m/s)</th><th>Eₖ (J)</th><th>ΔEₚ (J)</th></tr>
                        </thead>
                        <tbody id="dataTableBody">
                            <tr><td colspan="5" style="color:var(--text-dim); text-align:center; padding:20px 0;">暂无数据，请添加点</td></tr>
                        </tbody>
                    </table>
                </div>
                <div style="margin-top:10px; font-size:13px; color:var(--text-dim);">
                    <span>🔵 点击纸带点高亮 · Eₖ=½mv² · Eₚ=mgh</span>
                </div>
            </div>
        </aside>
    </div>
