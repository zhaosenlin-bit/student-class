    <script type="text/plain" data-obsolete-review="chapter01">
      (() => {
        const peopleArchive = [
          {
            id: "jane", name: "简爱", portrait: "/api/program-assets/842/assets/characters/char_jane_calm.png",
            questions: [{ text: "档案中的我，是怎样生活在盖茨海德府的？", options: ["作为备受宠爱的继承人", "作为寄人篱下、渴望尊严的孤儿", "作为里德家的家庭教师", "作为短暂停留的客人"], correct: 1 }]
          },
          {
            id: "john", name: "约翰·里德", portrait: "/api/program-assets/842/assets/characters/char_john_reed.png",
            questions: [
              { text: "我遇见的这个男孩是谁？", options: ["洛伍德学校的学生", "里德家的少爷，我的表哥", "帮助我的医生", "我的朋友"], correct: 1 },
              { text: "他曾经怎样对待我？", options: ["经常照顾我", "欺负我、羞辱我，并利用身份压迫我", "教我读书", "鼓励我离开盖茨海德府"], correct: 1 },
              { text: "从约翰身上，可以看出什么性格特点？", options: ["善良友爱", "傲慢、专横、被宠坏", "坚强独立", "谦虚谨慎"], correct: 1 }
            ]
          },
          {
            id: "mrs-reed", name: "里德夫人", portrait: "/api/program-assets/842/assets/characters/char_mrs_reed.png",
            questions: [{ text: "她为什么让我感到痛苦？", options: ["因为她贫穷", "因为她认为我不属于这个家庭，并长期冷漠对待我", "因为她不知道我的存在", "因为她想帮助我"], correct: 1 }],
            keywords: ["冷漠", "偏见", "缺少同情心", "虚伪"]
          },
          {
            id: "bessie", name: "贝茜",
            questions: [{ text: "贝茜给我的童年带来了什么？", options: ["完全的伤害", "少有的一点关心和温暖", "财富和地位", "教育机会"], correct: 1 }]
          },
          {
            id: "abbott", name: "阿博特",
            questions: [{ text: "阿博特对我的态度是什么？", options: ["始终温柔地保护我", "态度冷淡，更多是在执行主人的命令", "把我当作自己的学生", "暗中帮助我逃走"], correct: 1 }]
          },
          {
            id: "lloyd", name: "劳埃德医生", portrait: "/api/program-assets/842/assets/characters/char_lloyd.png",
            questions: [{ text: "医生的出现给我带来了什么？", options: ["让我得到一笔财产", "第一次有人认真倾听我的感受，并帮助我寻找新的生活", "让我继续留在红房间", "让我成为里德家的继承人"], correct: 1 }]
          }
        ];
        const eventArchive = [
          {
            id: "reading", title: "坐在窗边阅读", image: "/api/program-assets/842/assets/backgrounds/bg_003_window_reading_corner.png",
            question: "为什么阅读对童年的我如此重要？",
            options: ["它能让我得到里德夫人的奖励", "它让我暂时逃离孤独，获得精神上的自由", "它能让我胜过约翰", "它只是为了消磨时间"], correct: 1
          },
          {
            id: "book", title: "约翰抢书", image: "/api/program-assets/842/assets/backgrounds/bg_002_gateshead_living_room.png",
            question: "这次冲突在我的成长中意味着什么？",
            options: ["我开始接受约翰的支配", "我开始维护自己的尊严，显露出反抗精神", "我决定放弃阅读", "我学会用身份压迫别人"], correct: 1
          },
          {
            id: "red-room", title: "红房间事件", image: "/api/program-assets/842/assets/backgrounds/bg_004_red_room.png",
            question: "红房间为什么让我恐惧？",
            options: ["因为房间很大", "因为那里是舅舅去世的地方，也象征着孤独和恐惧", "因为那里有怪物", "因为那里没有家具"], correct: 1
          }
        ];
        const traitKeywords = ["自尊", "坚强", "勇敢", "独立", "反抗精神", "坚持原则"];
        const reviewState = { completedPeople: new Set(), mostEvent: "", traits: "" };
        const reviewOverlay = document.querySelector("#reviewOverlay");
        const diaryBook = document.querySelector("#diaryBook");
        const diaryKicker = document.querySelector("#diaryKicker");
        const diaryTitle = document.querySelector("#diaryTitle");
        const diarySubtitle = document.querySelector("#diarySubtitle");
        const reviewProgress = document.querySelector("#reviewProgress");
        const reviewContent = document.querySelector("#reviewContent");
        const reviewFeedback = document.querySelector("#reviewFeedback");
        const reviewActions = document.querySelector("#reviewActions");

        window.openReviewArchive = () => {
          reviewOverlay.hidden = false;
          reviewOverlay.scrollTop = 0;
          const music = document.querySelector("#backgroundMusic");
          if (music) music.volume = .18;
          renderIntro();
        };

        function setPage(kicker, title, subtitle, progressIndex) {
          diaryKicker.textContent = kicker;
          diaryTitle.textContent = title;
          diarySubtitle.textContent = subtitle;
          reviewFeedback.textContent = "";
          reviewFeedback.className = "review-feedback";
          reviewActions.replaceChildren();
          reviewProgress.replaceChildren();
          for (let index = 0; index < 5; index += 1) {
            const mark = document.createElement("span");
            if (index < progressIndex) mark.className = "done";
            if (index === progressIndex) mark.className = "active";
            reviewProgress.appendChild(mark);
          }
          diaryBook.classList.remove("turning");
          void diaryBook.offsetWidth;
          diaryBook.classList.add("turning");
          reviewOverlay.scrollTop = 0;
        }

        function actionButton(label, handler, secondary = false) {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `review-button${secondary ? " secondary" : ""}`;
          button.textContent = label;
          button.addEventListener("click", handler);
          reviewActions.appendChild(button);
          return button;
        }

        function setFeedback(text, success = false) {
          reviewFeedback.textContent = text;
          reviewFeedback.className = `review-feedback${success ? " success" : ""}`;
        }

        function renderIntro() {
          setPage("盖茨海德府 · 童年手记", "第一章：我的童年记忆档案", "离开盖茨海德府之前，我回望这段童年经历……", 0);
          reviewContent.innerHTML = `
            <div class="review-sheet reading-report">
              <div class="report-section"><h3>写在离开以前</h3><p>驿车已经驶离那座府邸。雨声、炉火、书页和红房间仍留在我的记忆里。我想重新辨认那些遇见过的人，也想知道，他们如何塑造了今天的我。</p></div>
              <div class="report-section"><h3>整理方式</h3><p>我会依次翻阅人物档案、重要事件、性格记录与主题手记。答错并不会失去记忆，我可以重新思考，直到找到最符合这段经历的答案。</p></div>
            </div>`;
          actionButton("打开记忆档案", renderCharacters);
        }

        function renderCharacters() {
          setPage("记忆档案 · 第一页", "人物档案", "我遇见了谁？他们如何影响了我的童年？点击每一张人物卡，整理对应记忆。", 0);
          reviewContent.innerHTML = `<div class="archive-grid">${peopleArchive.map((person) => `
            <button type="button" class="archive-card ${reviewState.completedPeople.has(person.id) ? "completed" : ""}" data-person="${person.id}">
              ${person.portrait ? `<img src="${resolveCourseAsset(person.portrait)}" alt="${person.name}立绘" />` : `<span class="archive-silhouette">肖像待补</span>`}
              <strong>${reviewState.completedPeople.has(person.id) ? "✓ " : ""}${person.name}</strong>
            </button>`).join("")}</div><div id="personSheet"></div>`;
          reviewContent.querySelectorAll("[data-person]").forEach((card) => {
            card.addEventListener("click", () => renderPerson(peopleArchive.find((person) => person.id === card.dataset.person)));
          });
          if (reviewState.completedPeople.size === peopleArchive.length) {
            setFeedback("六份人物记忆已经整理完成。", true);
            actionButton("翻到重要事件", renderEvents);
          }
        }

        function renderPerson(person) {
          const sheet = document.querySelector("#personSheet");
          sheet.innerHTML = `<form class="review-sheet" id="personForm"><h3>${person.name} · 记忆询问</h3>${person.questions.map((item, questionIndex) => radioQuestion(item, `person-${person.id}-${questionIndex}`)).join("")}${person.keywords ? `
            <fieldset class="review-question"><legend>从日记中选择至少两个性格关键词：</legend><div class="review-options">${person.keywords.map((keyword) => `<label><input type="checkbox" name="person-keywords" value="${keyword}" />${keyword}</label>`).join("")}</div></fieldset>` : ""}
            <div class="review-actions"><button class="review-button" type="submit">确认这份记忆</button></div></form>`;
          sheet.querySelector("#personForm").addEventListener("submit", (event) => {
            event.preventDefault();
            const allCorrect = person.questions.every((item, questionIndex) => {
              const selected = sheet.querySelector(`input[name="person-${person.id}-${questionIndex}"]:checked`);
              return selected && Number(selected.value) === item.correct;
            });
            const keywordsCorrect = !person.keywords || sheet.querySelectorAll('input[name="person-keywords"]:checked').length >= 2;
            if (!allCorrect || !keywordsCorrect) {
              setFeedback(person.keywords && !keywordsCorrect ? "这份档案还缺少至少两个性格关键词。" : "这段记忆还有偏差。回想剧情中的言行，再整理一次。", false);
              return;
            }
            reviewState.completedPeople.add(person.id);
            renderCharacters();
          });
          sheet.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }

        function radioQuestion(item, name) {
          return `<fieldset class="review-question"><legend>${item.text}</legend><div class="review-options">${item.options.map((option, index) => `<label><input type="radio" name="${name}" value="${index}" />${String.fromCharCode(65 + index)}. ${option}</label>`).join("")}</div></fieldset>`;
        }

        function renderEvents() {
          setPage("记忆档案 · 第二页", "重要事件回忆", "有些画面从未离开我的记忆。重新凝视它们，理解这些时刻如何改变了我。", 1);
          reviewContent.innerHTML = `<form id="eventForm"><div class="event-grid">${eventArchive.map((item, eventIndex) => `
            <article class="event-card"><img src="${resolveCourseAsset(item.image)}" alt="${item.title}" /><div><h3>${item.title}</h3><p>${item.question}</p></div><div class="review-options">${item.options.map((option, optionIndex) => `<label><input type="radio" name="event-${eventIndex}" value="${optionIndex}" />${String.fromCharCode(65 + optionIndex)}. ${option}</label>`).join("")}</div></article>`).join("")}</div>
            <fieldset class="review-sheet review-question"><legend>哪一件事最深地留在了我的记忆里？</legend><div class="review-options">${eventArchive.map((item) => `<label><input type="radio" name="most-event" value="${item.id}" />${item.title}</label>`).join("")}</div></fieldset>
            <div class="review-actions"><button class="review-button" type="submit">写入事件手记</button></div></form>`;
          reviewContent.querySelector("#eventForm").addEventListener("submit", (event) => {
            event.preventDefault();
            const allCorrect = eventArchive.every((item, eventIndex) => {
              const selected = reviewContent.querySelector(`input[name="event-${eventIndex}"]:checked`);
              return selected && Number(selected.value) === item.correct;
            });
            const mostEvent = reviewContent.querySelector('input[name="most-event"]:checked');
            if (!allCorrect || !mostEvent) {
              setFeedback(!mostEvent ? "请在日记中标记一件最令你难忘的事。" : "有一段事件记忆还不准确，请结合画面重新思考。", false);
              return;
            }
            reviewState.mostEvent = mostEvent.value;
            renderTraits();
          });
        }

        function renderTraits() {
          setPage("记忆档案 · 第三页", "我眼中的自己", "不是从现成答案中挑选，而是亲手写下我在童年简爱身上看见的力量。", 2);
