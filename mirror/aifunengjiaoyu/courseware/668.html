<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR 数学课堂 - 立方体动态截面 PRO版 (稳定架构)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Microsoft YaHei', sans-serif; touch-action: none; }
        
        #video-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; overflow: hidden; background: #000;
        }
        #input-video {
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); /* 镜像翻转 */
            opacity: 0.4;
        }

        #canvas-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: 1; pointer-events: none;
        }
        
        #interaction-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; display: none; cursor: move;
        }

        #ui-layer {
            position: absolute; top: 20px; left: 20px; z-index: 20; color: #fff; pointer-events: none; 
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
            width: 300px;
        }
        
        h1 { margin: 0; font-size: 24px; color: #00ffff; letter-spacing: 2px; }
        h1 .pro-badge { font-size: 14px; color: #ffaa00; vertical-align: super; font-weight: bold; text-shadow: 0 0 10px #ffaa00; }
        .subtitle { font-size: 14px; color: #aaa; margin-top: 5px; }

        .panel {
            margin-top: 20px; background: rgba(0, 15, 30, 0.85); padding: 15px;
            border-radius: 12px; border-left: 4px solid #00ffff; backdrop-filter: blur(8px);
            pointer-events: auto; box-shadow: 0 4px 15px rgba(0,255,255,0.2);
        }

        #start-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: white; text-align: center; pointer-events: auto;
        }
        
        .big-btn {
            background: linear-gradient(90deg, #00ffff, #0088ff); border: none; padding: 15px 40px;
            font-size: 20px; color: #000; font-weight: bold; border-radius: 50px; cursor: pointer;
            margin-top: 20px; box-shadow: 0 0 20px rgba(0, 255, 255, 0.5); transition: transform 0.2s;
        }
        .big-btn:hover { transform: scale(1.05); }

        .control-btn {
            background: rgba(0, 255, 100, 0.2); border: 1px solid #00ff88; color: white;
            padding: 10px 15px; border-radius: 6px; cursor: pointer; font-size: 14px;
            margin-top: 15px; width: 100%; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .control-btn:hover { background: rgba(0, 255, 100, 0.4); }
        .control-btn.active { background: #00ff88; color: #000; font-weight: bold; }

        .step-item { display: flex; align-items: center; margin: 10px 0; color: #ccc; font-size: 14px; transition: all 0.3s;}
        .step-item.active { color: #fff; font-weight: bold; transform: scale(1.05); transform-origin: left;}
        .step-item .icon { font-size: 18px; margin-right: 10px; width: 30px; text-align: center; }

        #status-text { font-size: 16px; color: #ff0; font-weight: bold; margin-top: 10px; min-height: 24px; }
        #shape-info { margin-top: 10px; font-size: 18px; color: #00ff00; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 10px;}
        
        .hint { font-size: 12px; color: #aaa; margin-top: 8px; padding-top: 8px;}

        #error-msg {
            color: #ff5555; margin-top: 20px; font-size: 14px; max-width: 80%; display: none; 
            background: rgba(50, 0, 0, 0.8); padding: 15px; border-radius: 8px; border: 1px solid #ff5555; text-align: left;
        }

        #mouse-controls { display: none; margin-top: 15px; border-top: 1px solid #555; padding-top: 10px; }
        input[type=range] { width: 100%; height: 30px; }
    </style>

    <div id="start-overlay">
        <h1>📐 AR 数学课堂 <span class="pro-badge">PRO</span></h1>
        <p>立体几何：立方体的动态截面</p>
        <p style="font-size: 12px; color: #00ffff; margin-top: 5px;">搭载防抖算法与相对位移引擎</p>
        <button class="big-btn" onclick="startApp()">开始演示</button>
        <div id="loading-text" style="margin-top:20px; color:#aaa; font-size:12px;">请允许浏览器调用摄像头</div>
        
        <div id="error-msg">
            <b>⚠️ 引擎启动失败</b><br><br>
            <b>解决方法：</b><br>
            • 请确保授予了摄像头权限。<br>

            <button class="control-btn" onclick="switchToMouseMode()">🖱️ 切换到触屏模式</button>
        </div>
    </div>

    <div id="video-container">
        <video id="input-video" autoplay playsinline muted></video>
    </div>

    <div id="interaction-layer"></div>

    <div id="ui-layer" style="display:none;">
        <h1>📐 立体几何 <span class="pro-badge">PRO</span></h1>
        <div class="subtitle">课题：截面形状的多样性</div>
        
        <div class="panel">
            <div id="shape-info">当前截面：-</div>
            <div id="status-text">等待手势...</div>
            
            <div class="step-box" id="ar-steps">
                <div id="step-rotate" class="step-item active">
                    <span class="icon">🖐️</span> 五指张开移动：平滑旋转
                </div>
                <div id="step-cut" class="step-item">
                    <span class="icon">✊</span> 握拳上下拖拽：升降切面
                </div>
            </div>

            <div id="mouse-controls">
                <div class="step-item active"><span class="icon">👆</span> 单指拖动：旋转视角</div>
                <div class="step-item"><span class="icon">↕️</span> 滑块：调整切面高度</div>
                <input type="range" min="-5" max="5" step="0.1" value="0" oninput="updateCutHeight(this.value)">
            </div>
            
            <button id="btn-edit-plane" class="control-btn" onclick="togglePlaneEditMode()">
                🔄 调整切面倾斜角 (触屏/鼠标)
            </button>
            <div id="edit-hint" style="display:none; font-size:12px; color:#00ff88; margin-top:5px; text-align:center;">
                请在屏幕上拖拽以改变切刀角度
            </div>

            <div class="hint">
                💡 <b>教学目标：</b><br>
                尝试旋转立方体和切面，找到<br>
                <span style="color:#00ffcc">三角形</span>、<span style="color:#ffff00">正方形</span> 和 <span style="color:#ff00cc">正六边形</span>。
            </div>
        </div>
    </div>
