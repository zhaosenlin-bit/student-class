<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>扇形统计图 · 七大洲 · 对战</title>
  <style>
    /* ===== CSS Variables ===== */
    :root {
      --bg-deep: #f5f8fc;
      --bg-panel: #ffffff;
      --bg-panel-alt: #f0f4fa;
      --border: #d8e2ed;
      --text: #1e2a3a;
      --text-dim: #5e6f84;
      --accent: #2b7be4;
      --accent2: #ff7849;
      --accent3: #34b758;
      --accent4: #f7c948;
      --danger: #e8535e;
      --panel-width: 320px;
      --header-h: 48px;
      --transition: 0.25s ease;
      --radius: 12px;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
    }

    /* ===== Reset & Base ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, -apple-system, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    h1, h2, h3 { font-weight: 600; }

    /* ===== App Shell ===== */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ===== Header (mobile only) ===== */
    #mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      height: var(--header-h);
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
      z-index: 10;
    }
    #mobile-header h1 {
      font-size: 17px;
      color: var(--accent);
      letter-spacing: 0.5px;
    }
    .header-controls .btn {
      background: var(--bg-panel-alt);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }
    .header-controls .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ===== Main Layout (二栏) ===== */
    #main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      background: var(--bg-deep);
    }

    /* ===== Left Panel ===== */
    #side-panel {
      width: var(--panel-width);
      min-width: var(--panel-width);
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding-bottom: 20px;
      box-shadow: 2px 0 12px rgba(0,0,0,0.02);
    }
    #side-panel::-webkit-scrollbar { width: 5px; }
    #side-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

    /* ===== Panel Sections ===== */
    .panel-section {
      padding: 16px 16px 12px;
      border-bottom: 1px solid var(--border);
    }
    .panel-section:last-child { border-bottom: none; }
    .panel-section h3 {
      font-size: 14px;
      color: var(--accent);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-section h3::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--accent);
      border-radius: 3px;
    }

    /* ===== 教学步骤 ===== */
    .step-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }
    .step-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      background: var(--bg-panel-alt);
      border: 1px solid transparent;
      transition: all 0.2s;
      cursor: pointer;
      color: var(--text-dim);
    }
    .step-item .step-num {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--border);
      color: var(--text-dim);
      font-size: 13px;
      font-weight: 700;
      flex-shrink: 0;
      transition: 0.2s;
    }
    .step-item.active {
      background: rgba(43, 123, 228, 0.08);
      border-color: var(--accent);
      color: var(--accent);
    }
    .step-item.active .step-num {
      background: var(--accent);
      color: white;
    }
    .step-item.completed .step-num {
      background: var(--accent3);
      color: white;
    }
    .step-item.completed {
      color: var(--text);
    }
    .step-item:hover {
      background: rgba(43, 123, 228, 0.05);
    }
    .step-desc {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 8px;
      padding: 10px 14px;
      background: var(--bg-panel-alt);
      border-radius: 12px;
      line-height: 1.6;
      border-left: 3px solid var(--accent);
    }
    .step-desc strong {
      color: var(--accent);
    }

    /* ===== Continent Slider List ===== */
    .continent-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 14px;
    }
    .continent-item:last-child { margin-bottom: 0; }
    .continent-label {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 500;
    }
    .continent-label .name {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .continent-label .name .dot {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .continent-label .percent {
      font-weight: 700;
      color: var(--accent);
      background: var(--bg-panel-alt);
      padding: 0 8px;
      border-radius: 30px;
      font-size: 12px;
      line-height: 22px;
    }

    /* ===== Standard Slider ===== */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 4px;
      outline: none;
      margin: 4px 0 2px;
      transition: background 0.15s;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
      transition: 0.1s;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.12);
      background: #1a6ed8;
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid white;
    }

    /* ===== Data Summary Row ===== */
    .data-summary {
      background: var(--bg-panel-alt);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-top: 6px;
    }
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 13px;
      border-bottom: 1px solid rgba(0,0,0,0.04);
    }
    .data-row:last-child { border-bottom: none; }
    .data-row .label { color: var(--text-dim); }
    .data-row .value { font-weight: 700; color: var(--text); }

    /* ===== Center Panel (Chart) ===== */
    #center-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-deep);
    }
    #chart-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    #pieCanvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.06));
    }

    /* ===== Info Card (floating) ===== */
    .info-card {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 10px 24px;
      color: var(--text);
      font-size: 15px;
      font-weight: 500;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 6;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
      white-space: nowrap;
    }
    .info-card.visible { opacity: 1; }

    /* ===== Responsive ===== */
    @media (max-width: 820px) {
      #mobile-header { display: flex; }
      #side-panel {
        position: fixed;
        left: 0;
        top: var(--header-h);
        bottom: 0;
        z-index: 50;
        margin-left: calc(-1 * var(--panel-width) - 10px);
        transition: margin-left var(--transition);
        box-shadow: 4px 0 24px rgba(0,0,0,0.08);
        border-right: none;
      }
      #side-panel.open {
        margin-left: 0;
      }
      #center-panel {
        width: 100%;
      }
      .info-card {
        bottom: 16px;
        font-size: 13px;
        padding: 8px 16px;
        white-space: normal;
        max-width: 80%;
      }
    }

    /* ===== Scrollbar ===== */
    #side-panel {
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
  </style>
</head>

  <!-- Mobile Header -->
  <header id="mobile-header">
    <h1>🌍 七大洲 · 扇形图</h1>
    <div class="header-controls">
      <button class="btn" id="btnToggleSide">☰ 数据</button>
    </div>
  </header>

  <!-- Main Layout -->
  <div id="main-layout">
    <!-- Left Panel -->
    <aside id="side-panel">
      <!-- 教学步骤区块 -->
      <div class="panel-section">
        <h3>📖 教学步骤</h3>
        <div class="step-list" id="stepList">
          <div class="step-item active" data-step="0">
            <span class="step-num">1</span>
            <span>认识七大洲</span>
          </div>
          <div class="step-item" data-step="1">
            <span class="step-num">2</span>
            <span>最大 & 最小</span>
          </div>
          <div class="step-item" data-step="2">
            <span class="step-num">3</span>
            <span>亚洲 VS 非洲</span>
          </div>
          <div class="step-item" data-step="3">
            <span class="step-num">4</span>
            <span>我来试试</span>
          </div>
        </div>
        <div id="stepDescription" class="step-desc">
          <strong>🌏 认识七大洲</strong><br>
          亚洲、非洲、北美洲、南美洲、南极洲、欧洲、大洋洲。观察它们的扇形面积，感受占比大小。
        </div>
      </div>

      <!-- 大洲占比 -->
      <div class="panel-section">
        <h3>🌏 大洲占比</h3>
        <div id="slider-list"></div>
      </div>
      <div class="panel-section">
        <h3>📊 总和校验</h3>
        <div class="data-summary">
          <div class="data-row">
            <span class="label">当前总和</span>
            <span class="value" id="sumDisplay">100.0%</span>
          </div>
          <div class="data-row">
            <span class="label">数据完整</span>
            <span class="value" id="statusDisplay" style="color:var(--accent3);">✓ 正确</span>
          </div>
        </div>
        <p style="font-size:12px; color:var(--text-dim); margin-top:10px; line-height:1.5;">
          💡 拖动滑块改变占比，其他大洲自动按比例调整，总和始终为100%。
        </p>
      </div>
    </aside>

    <!-- Center: Chart -->
    <main id="center-panel">
      <div id="chart-container">
        <canvas id="pieCanvas"></canvas>
        <div class="info-card" id="infoCard">🎯 点击扇形图上的大洲，了解更多</div>
      </div>
    </main>
  </div>
</div>
