    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif; }
        #info {

            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);

            padding: 6px 20px;
            border-radius: 40px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,215,0,0.15);
        }
        #instruction {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.4);
            font-size: 13px;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.08);
            pointer-events: none;
            z-index: 10;
            letter-spacing: 1px;
        }
        #controls {
            position: absolute;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            z-index: 20;
            flex-wrap: wrap;
            justify-content: center;
            pointer-events: none;
        }
        #controls button {
            pointer-events: auto;
            background: rgba(10, 20, 40, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 215, 0, 0.25);
            color: #f0e8d0;
            padding: 10px 28px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1.5px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            font-family: inherit;
            min-width: 110px;
        }
        #controls button:hover {
            background: rgba(30, 60, 100, 0.9);
            border-color: #ffaa33;
            transform: scale(1.04);
            box-shadow: 0 0 25px rgba(255, 170, 50, 0.3);
        }
        #controls button:active {
            transform: scale(0.96);
        }
        #controls button.active {
            background: rgba(200, 120, 30, 0.7);
            border-color: #ffaa33;
            box-shadow: 0 0 30px rgba(255, 170, 50, 0.4);
        }
        #status-tip {
            position: absolute;
            top: 20px;
            right: 20px;
            color: rgba(255,255,200,0.6);
            background: rgba(0,0,0,0.5);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.06);
            z-index: 10;
            letter-spacing: 1px;
            pointer-events: none;
        }
        #info-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 360px;
            max-width: 90vw;
            background: rgba(10, 20, 40, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 28px;
            padding: 24px 28px 28px;
            z-index: 100;
            color: #f0f0f0;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
            transition: opacity 0.35s ease, transform 0.35s ease;
            pointer-events: auto;
            display: none;
            opacity: 0;
        }
        #info-card.show {
            display: block;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        #info-card .close-btn {
            position: absolute;
            top: 12px;
            right: 18px;
            font-size: 24px;
            cursor: pointer;
            color: rgba(255,255,255,0.5);
            transition: color 0.2s;
            background: none;
            border: none;
            font-family: inherit;
        }
        #info-card .close-btn:hover {
            color: #ffaa33;
        }
        #info-card h2 {
            margin: 0 0 6px 0;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #ffd580;
            border-bottom: 1px solid rgba(255,215,0,0.2);
            padding-bottom: 12px;
        }
        #info-card .subtitle {
            font-size: 14px;
            color: #99b8dd;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }
        #info-card .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 18px;
            margin: 14px 0 10px;
        }
        #info-card .data-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 14px;
        }
        #info-card .data-item .label {
            color: #aac0dd;
        }
        #info-card .data-item .value {
            color: #fff;
            font-weight: 500;
        }
        #info-card .description {
            font-size: 14px;
            line-height: 1.6;
            color: #ccdcee;
            margin: 12px 0 4px;
            background: rgba(0,0,0,0.3);
            padding: 12px 16px;
            border-radius: 16px;
            border-left: 3px solid #ffaa33;
        }
        #info-card .schematic {
            margin: 12px 0 0;
            text-align: center;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 10px;
            font-size: 28px;
            letter-spacing: 8px;
        }
        @media (max-width: 700px) {
            #controls { bottom: 70px; gap: 10px; }
            #controls button { font-size: 13px; padding: 7px 16px; min-width: 80px; }
            #info { font-size: 11px; bottom: 15px; }
            #instruction { font-size: 10px; top: 10px; left: 10px; padding: 4px 12px; }
            #status-tip { font-size: 11px; top: 10px; right: 10px; padding: 4px 12px; }
            #info-card { width: 300px; padding: 18px 20px 22px; }
            #info-card h2 { font-size: 22px; }
        }
    </style>
</head>

    <div id="instruction">🔭 点击星球查看数据卡片 · 下方按钮演示日食/月食</div>
    <div id="status-tip">🌌 自由视角</div>
    <div id="info"><span>🌞 太阳 · 🌕 月球 · 🌍 地球 — 公转轨道示意</span></div>
    <div id="controls">
        <button id="btn-solar">🌞 日食演示</button>
        <button id="btn-lunar">🌕 月食演示</button>
        <button id="btn-stop">⏹ 停止</button>

    <div id="info-card">
        <button class="close-btn" id="card-close">✕</button>
        <h2 id="card-title">🌍 地球</h2>
        <div class="subtitle" id="card-subtitle">Terrestrial Planet</div>
        <div class="data-grid" id="card-data">
            <div class="data-item"><span class="label">直径</span><span class="value" id="d1">12,742 km</span></div>
            <div class="data-item"><span class="label">质量</span><span class="value" id="d2">5.97×10²⁴ kg</span></div>
            <div class="data-item"><span class="label">公转周期</span><span class="value" id="d3">365.25 天</span></div>
            <div class="data-item"><span class="label">自转周期</span><span class="value" id="d4">23.93 小时</span></div>
        </div>
        <div class="description" id="card-desc">地球是太阳系八大行星之一，距离太阳约1.5亿公里。拥有液态水和适宜大气，是已知唯一存在生命的星球。</div>
        <div class="schematic" id="card-schematic">🌞 ═══ 🌍 ═══ 🌕</div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // --- 初始化场景、相机、渲染器 ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = false;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 4, 14);
        camera.lookAt(0, 0, 0);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.5;
        controls.zoomSpeed = 1.2;
        controls.enablePan = true;
        controls.target.set(0, 0, 0);
        controls.maxPolarAngle = Math.PI / 2;
        controls.minDistance = 3;
        controls.maxDistance = 30;

        // --- 语音合成 (科普解说) ---
        function speakText(text, rate = 0.9) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-CN';
            utterance.rate = rate;
            utterance.pitch = 1.0;
            utterance.volume = 1;
            window.speechSynthesis.speak(utterance);
        }

        // 科普语音解说文本 (地球 & 月球)
        const earthVoice = '地球是太阳系中唯一已知存在生命的行星，距离太阳大约1.5亿公里。它拥有液态水和氮氧大气层，表面百分之七十被海洋覆盖，自转周期约为24小时，公转周期为365天。';
        const moonVoice = '月球是地球唯一的天然卫星，直径约3474公里，表面布满陨石坑。它没有大气层，昼夜温差极大，白天可达127摄氏度，夜晚可降至零下173摄氏度。月球的公转周期约为27.3天。';

        // --- 星空背景 ---
        function createStarfield() {
            const vertices = [];
            for (let i = 0; i < 3000; i++) {
                const x = (Math.random() - 0.5) * 800;
                const y = (Math.random() - 0.5) * 800;
                const z = (Math.random() - 0.5) * 800;
                vertices.push(x, y, z);
            }
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const material = new THREE.PointsMaterial({ color: 0xffffff, size: 0.25, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending });
            const stars = new THREE.Points(geometry, material);
            scene.add(stars);
            const colorVertices = [];
            const colors = [];
            for (let i = 0; i < 600; i++) {
                const x = (Math.random() - 0.5) * 600;
                const y = (Math.random() - 0.5) * 600;
                const z = (Math.random() - 0.5) * 600;
                colorVertices.push(x, y, z);
                const r = Math.random() * 0.4 + 0.6;
                const g = Math.random() * 0.4 + 0.6;
                const b = Math.random() * 0.4 + 0.6;
                colors.push(r, g, b);
            }
            const geo2 = new THREE.BufferGeometry();
            geo2.setAttribute('position', new THREE.Float32BufferAttribute(colorVertices, 3));
            geo2.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            const mat2 = new THREE.PointsMaterial({ size: 0.4, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending });
            const stars2 = new THREE.Points(geo2, mat2);
            scene.add(stars2);
        }
        createStarfield();

        // --- 灯光 ---
        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const sunLight = new THREE.PointLight(0xffeedd, 1.5, 30);
        sunLight.position.set(-6, 0.2, 0);
        scene.add(sunLight);
        const backLight = new THREE.DirectionalLight(0x446688, 0.3);
        backLight.position.set(2, 1, 3);
        scene.add(backLight);
        const fillLight = new THREE.DirectionalLight(0x88aaff, 0.2);
        fillLight.position.set(0, 5, 5);
        scene.add(fillLight);

        // --- 创建太阳 (固定在原点) ---
        const sunGeometry = new THREE.SphereGeometry(1.8, 64, 64);
        const sunMaterial = new THREE.MeshStandardMaterial({
            color: 0xffaa33,
            emissive: 0xff5500,
            emissiveIntensity: 2.0,
            roughness: 0.2,
        });
        const sun = new THREE.Mesh(sunGeometry, sunMaterial);
        sun.position.set(0, 0, 0);
        scene.add(sun);

        // 太阳光晕粒子
        const glowParticlesGeo = new THREE.BufferGeometry();
        const glowCount = 800;
        const glowPos = new Float32Array(glowCount * 3);
        for (let i = 0; i < glowCount; i++) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            const r = 2.0 + Math.random() * 0.8;
            const x = Math.sin(phi) * Math.cos(theta) * r;
            const y = Math.sin(phi) * Math.sin(theta) * r;
            const z = Math.cos(phi) * r;
            glowPos[i*3] = x;
            glowPos[i*3+1] = y;
            glowPos[i*3+2] = z;
        }
        glowParticlesGeo.setAttribute('position', new THREE.BufferAttribute(glowPos, 3));
        const glowParticlesMat = new THREE.PointsMaterial({ color: 0xff8822, size: 0.08, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
        const glowParticles = new THREE.Points(glowParticlesGeo, glowParticlesMat);
        scene.add(glowParticles);

        const spriteMap = (() => {
            const canvas = document.createElement('canvas');
            canvas.width = 128;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
            gradient.addColorStop(0, 'rgba(255,200,100,1)');
            gradient.addColorStop(0.3, 'rgba(255,150,50,0.8)');
            gradient.addColorStop(0.7, 'rgba(255,80,20,0.2)');
            gradient.addColorStop(1, 'rgba(255,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 128, 128);
            return new THREE.CanvasTexture(canvas);
        })();
        const spriteMaterial = new THREE.SpriteMaterial({ map: spriteMap, blending: THREE.AdditiveBlending, transparent: true, depthWrite: false });
        const sunGlow = new THREE.Sprite(spriteMaterial);
        sunGlow.scale.set(5.5, 5.5, 1);
        sunGlow.position.set(0, 0, 0);
        scene.add(sunGlow);

        // --- 创建地球 ---
        const earthGeometry = new THREE.SphereGeometry(1.0, 64, 64);
        const textureCanvas = document.createElement('canvas');
        textureCanvas.width = 512;
        textureCanvas.height = 256;
        const ctx = textureCanvas.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 0, 256);
        gradient.addColorStop(0, '#2a6f8f');
        gradient.addColorStop(0.5, '#1a4f6f');
        gradient.addColorStop(1, '#2a6f8f');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 512, 256);
        ctx.fillStyle = '#3a9e5a';
        const continents = [[120,60,80,50],[200,70,60,40],[300,80,90,60],[50,120,70,50],[180,140,50,40],[350,130,80,50],[70,180,60,40],[250,180,70,50],[400,160,50,40]];
        continents.forEach(([x,y,w,h]) => {
            ctx.beginPath();
            ctx.ellipse(x, y, w/2, h/2, 0, 0, Math.PI*2);
            ctx.fillStyle = '#3a9e5a';
            ctx.fill();
            ctx.fillStyle = '#2d8a4a';
            ctx.beginPath();
            ctx.ellipse(x-8, y-5, w/3, h/3, 0, 0, Math.PI*2);
            ctx.fill();
        });
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        for (let i=0; i<30; i++) {
            const x = Math.random()*512;
            const y = Math.random()*256;
            ctx.beginPath();
            ctx.ellipse(x, y, 30+Math.random()*40, 15+Math.random()*20, Math.random()*Math.PI, 0, Math.PI*2);
            ctx.fill();
        }
        const earthTexture = new THREE.CanvasTexture(textureCanvas);
        const earthMaterial = new THREE.MeshStandardMaterial({ map: earthTexture, roughness: 0.5, metalness: 0.1, emissive: 0x112244, emissiveIntensity: 0.05 });
        const earth = new THREE.Mesh(earthGeometry, earthMaterial);
        earth.position.set(6, 0, 0);
        scene.add(earth);

        const atmoMat = new THREE.MeshPhongMaterial({ color: 0x88ccff, transparent: true, opacity: 0.12, side: THREE.BackSide });
        const atmo = new THREE.Mesh(new THREE.SphereGeometry(1.1, 48, 48), atmoMat);
        atmo.position.set(6, 0, 0);
        scene.add(atmo);

        // --- 创建月球 ---
        const moonGeometry = new THREE.SphereGeometry(0.6, 48, 48);
        const moonMaterial = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.8, emissive: 0x222222, emissiveIntensity: 0.1 });
        const moon = new THREE.Mesh(moonGeometry, moonMaterial);
        moon.position.set(4.5, 0, 0);
        scene.add(moon);

        const moonDetailGeo = new THREE.SphereGeometry(0.61, 48, 48);
        const moonDetailMat = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.9, emissive: 0x111111, transparent: true, opacity: 0.3 });
        const moonDetail = new THREE.Mesh(moonDetailGeo, moonDetailMat);
        moonDetail.position.copy(moon.position);
        scene.add(moonDetail);

        // --- 轨道线 ---
        const orbitPoints = [];
        const radiusEarth = 6;
        for (let i = 0; i <= 64; i++) {
            const angle = (i / 64) * Math.PI * 2;
            orbitPoints.push(new THREE.Vector3(Math.cos(angle) * radiusEarth, 0, Math.sin(angle) * radiusEarth));
        }
        const orbitGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
        const orbitMat = new THREE.LineBasicMaterial({ color: 0x88aaff, opacity: 0.15, transparent: true });
        const orbitLine = new THREE.Line(orbitGeo, orbitMat);
        scene.add(orbitLine);

        const moonOrbitPoints = [];
        const radiusMoon = 1.8;
        for (let i = 0; i <= 48; i++) {
            const angle = (i / 48) * Math.PI * 2;
            moonOrbitPoints.push(new THREE.Vector3(Math.cos(angle) * radiusMoon, 0, Math.sin(angle) * radiusMoon));
        }
        const moonOrbitGeo = new THREE.BufferGeometry().setFromPoints(moonOrbitPoints);
        const moonOrbitMat = new THREE.LineBasicMaterial({ color: 0xcccccc, opacity: 0.1, transparent: true });
        const moonOrbitLine = new THREE.Line(moonOrbitGeo, moonOrbitMat);
        scene.add(moonOrbitLine);

        // --- 标签 (CSS2D) ---
        function createLabel(text, color = '#fff', bg = 'rgba(0,0,0,0.6)') {
            const div = document.createElement('div');
            div.textContent = text;
            div.style.color = color;
            div.style.fontFamily = '"Segoe UI", "PingFang SC", sans-serif';
            div.style.fontSize = '20px';
            div.style.fontWeight = '600';
            div.style.textShadow = '0 0 20px rgba(0,0,0,0.9)';
            div.style.background = bg;
            div.style.padding = '6px 18px';
            div.style.borderRadius = '30px';
            div.style.border = '1px solid rgba(255,255,255,0.15)';
            div.style.backdropFilter = 'blur(4px)';
            div.style.letterSpacing = '2px';
            return new CSS2DObject(div);
        }

        const sunLabel = createLabel('☀️ 太阳', '#ffaa33', 'rgba(0,0,0,0.5)');
        sunLabel.position.set(0, 2.6, 0);
        scene.add(sunLabel);

        const moonLabel = createLabel('🌕 月球', '#dddddd', 'rgba(0,0,0,0.5)');
        moonLabel.position.set(4.5, 1.5, 0);
        scene.add(moonLabel);

        const earthLabel = createLabel('🌍 地球', '#66ccff', 'rgba(0,0,0,0.5)');
        earthLabel.position.set(6, 1.8, 0);
        scene.add(earthLabel);

        // --- 信息卡片数据 ---
        const planetData = {
            earth: {
                title: '🌍 地球',
                subtitle: 'Terrestrial Planet · 第三行星',
                data: [
                    { label: '直径', value: '12,742 km' },
                    { label: '质量', value: '5.97×10²⁴ kg' },
                    { label: '公转周期', value: '365.25 天' },
                    { label: '自转周期', value: '23.93 小时' }
                ],
                desc: '地球是太阳系八大行星之一，距离太阳约1.5亿公里。拥有液态水和适宜大气，是已知唯一存在生命的星球。',
                schematic: '🌞 ═══ 🌍 ═══ 🌕'
            },
            moon: {
                title: '🌕 月球',
                subtitle: 'Natural Satellite · 地球卫星',
                data: [
                    { label: '直径', value: '3,474 km' },
                    { label: '质量', value: '7.34×10²² kg' },
                    { label: '公转周期', value: '27.32 天' },
                    { label: '表面温度', value: '-173~127 °C' }
                ],
                desc: '月球是地球唯一的天然卫星，也是太阳系第五大卫星。其表面布满陨石坑，无大气层，昼夜温差极大。',
                schematic: '🌞 ═══ 🌕 ═══ 🌍'
            }
        };

        // --- 卡片控制 ---
        const card = document.getElementById('info-card');
        const cardClose = document.getElementById('card-close');
        const cardTitle = document.getElementById('card-title');
        const cardSubtitle = document.getElementById('card-subtitle');
        const cardDesc = document.getElementById('card-desc');
        const cardSchematic = document.getElementById('card-schematic');
        const d1 = document.getElementById('d1');
        const d2 = document.getElementById('d2');
        const d3 = document.getElementById('d3');
        const d4 = document.getElementById('d4');
        const dataItems = [d1, d2, d3, d4];

        function showCard(type) {
            const data = planetData[type];
            if (!data) return;
            cardTitle.textContent = data.title;
            cardSubtitle.textContent = data.subtitle;
            data.data.forEach((item, i) => {
                if (dataItems[i]) {
                    dataItems[i].textContent = item.value;
                    const parent = dataItems[i].closest('.data-item');
                    if (parent) {
                        const labelSpan = parent.querySelector('.label');
                        if (labelSpan) labelSpan.textContent = item.label;
                    }
                }
            });
            cardDesc.textContent = data.desc;
            cardSchematic.textContent = data.schematic;
            card.classList.add('show');
        }

        function hideCard() {
            card.classList.remove('show');
        }
        cardClose.addEventListener('click', hideCard);

        // --- 点击交互 (3D对象) + 科普语音 ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const clickableObjects = [sun, moon, earth];

        function onPointerDown(event) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(clickableObjects);
            if (intersects.length > 0) {
                const hit = intersects[0].object;
                controls.target.copy(hit.position);
                let text = '';
                let cardType = null;
                let voiceText = '';
                if (hit === sun) {
                    text = '太阳。日食时月球运行到太阳和地球之间，月食时地球位于太阳和月球之间。';
                    voiceText = '太阳是太阳系的中心恒星，质量占整个太阳系的百分之99.8。它通过核聚变产生光和热，表面温度约5500摄氏度。';
                } else if (hit === moon) {
                    text = '月球。日食时月球在太阳和地球之间，月食时地球在太阳和月球之间。';
                    cardType = 'moon';
                    voiceText = moonVoice;
                } else if (hit === earth) {
                    text = '地球。月食是地球挡住了太阳照向月球的光。日食是月球挡住了太阳照向地球的光。';
                    cardType = 'earth';
                    voiceText = earthVoice;
                }
                // 播放科普语音解说 (长按可打断)
                if (voiceText) {
                    speakText(voiceText, 0.9);
                } else if (text) {
                    speakText(text, 0.9);
                }
                hit.scale.set(1.1, 1.1, 1.1);
                setTimeout(() => { hit.scale.set(1, 1, 1); }, 300);
                if (cardType) {
                    showCard(cardType);
                } else {
                    hideCard();
                }
            }
        }
        renderer.domElement.addEventListener('pointerdown', onPointerDown);

        // --- 公转 & 演示逻辑 ---
        let earthAngle = 0;
        let moonAngle = 0;
        let animMode = 'free';
        const earthRadius = 6;
        const moonRadius = 1.8;

        const btnSolar = document.getElementById('btn-solar');
        const btnLunar = document.getElementById('btn-lunar');
        const btnStop = document.getElementById('btn-stop');
        const statusTip = document.getElementById('status-tip');

        function updatePositions(earthAngleRad, moonAngleRad) {
            const ex = Math.cos(earthAngleRad) * earthRadius;
            const ez = Math.sin(earthAngleRad) * earthRadius;
            earth.position.set(ex, 0, ez);
            atmo.position.copy(earth.position);
            earthLabel.position.set(ex, 1.8, ez);

            const mx = ex + Math.cos(moonAngleRad) * moonRadius;
            const mz = ez + Math.sin(moonAngleRad) * moonRadius;
            moon.position.set(mx, 0, mz);
            moonDetail.position.copy(moon.position);
            moonLabel.position.set(mx, 1.5, mz);
        }

        earthAngle = 0;
        moonAngle = Math.PI;
        updatePositions(earthAngle, moonAngle);

        function animate() {
            requestAnimationFrame(animate);

            if (animMode === 'free') {
                earthAngle += 0.002;
                moonAngle += 0.02;
            } else if (animMode === 'solar') {
                earthAngle += 0.003;
                moonAngle = earthAngle + Math.PI;
            } else if (animMode === 'lunar') {
                earthAngle += 0.003;
                moonAngle = earthAngle;
            }

            updatePositions(earthAngle, moonAngle);
            earth.rotation.y += 0.01;
            moon.rotation.y += 0.005;
            glowParticles.rotation.y += 0.001;

            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        btnSolar.addEventListener('click', () => {
            animMode = 'solar';
            statusTip.textContent = '🌞 日食演示 · 月球在日地之间';
            speakText('日食演示，月球运行到太阳和地球之间，月球的影子落在地球上', 0.9);
            btnSolar.classList.add('active');
            btnLunar.classList.remove('active');
        });
        btnLunar.addEventListener('click', () => {
            animMode = 'lunar';
            statusTip.textContent = '🌕 月食演示 · 地球在日月之间';
            speakText('月食演示，地球运行到太阳和月球之间，地球的影子落在月球上', 0.9);
            btnLunar.classList.add('active');
            btnSolar.classList.remove('active');
        });
        btnStop.addEventListener('click', () => {
            animMode = 'free';
            statusTip.textContent = '🌌 自由公转';
            btnSolar.classList.remove('active');
            btnLunar.classList.remove('active');
            speakText('自由公转模式', 0.8);
        });

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        console.log('🔭 日食月食公转演示 (带信息卡片 + 科普语音) 已启动');
    </script>

<script>
(function() {
  // 防右键
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });

  // 防键盘快捷键: F12 | Ctrl+Shift+I | Ctrl+Shift+J | Ctrl+U | Ctrl+S
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'i' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u')) ||
      (e.ctrlKey && (e.key === 's' || e.key === 'S'))
    ) {
      e.preventDefault();
      return false;
    }
  });

  // DevTools 检测（基于 debugger 语句执行耗时）
  var _cdt = function() {
    var t0 = performance.now();
    (function(){}).constructor('debugger')();
    if (performance.now() - t0 > 100) {
      (function lp() {
        (function(){}).constructor('debugger')();
        setTimeout(lp, 50);
      })();
    }
  };
  setTimeout(_cdt, 1000);
  setInterval(_cdt, 3000);

  // 控制台版权声明
  setTimeout(function() {
    console.log('%c⚠️ 版权声明', 'font-size:18px;color:#ef4444;font-weight:bold');
    console.log('%c本内容受版权保护，未经授权复制或分发将承担法律责任。', 'font-size:13px;color:#666');
  }, 500);
})();
</script>
