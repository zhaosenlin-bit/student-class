<!DOCTYPE html>
<html lang="zh">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>火影 vs 美少女 · 左右对垒</title>
    <style>
        /* ===== 原有基础样式 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }
        body {
            background: linear-gradient(145deg, #0b1a2e 0%, #1a2f3f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 10px;
            font-size: 20px;
        }
        .game-container {
            max-width: 1400px;
            width: 100%;
            background: #1e3b4a;
            border-radius: 48px 48px 36px 36px;
            box-shadow: 0 16px 24px rgba(0, 0, 0, 0.7), inset 0 0 0 2px #f3d37c;
            padding: 20px 24px 24px;
            border-bottom: 5px solid #b9935a;
            height: auto;
            max-height: 98vh;
            display: flex;
            flex-direction: column;
            transition: transform 0.1s;
            position: relative;
            z-index: 2;
        }
        .game-container.shake {
            animation: screenShake 0.7s ease forwards;
        }
        @keyframes screenShake {
            0%,
            100% { transform: translateX(0) rotate(0deg); }
            10% { transform: translateX(-10px) rotate(-1.2deg); }
            20% { transform: translateX(10px) rotate(1.2deg); }
            30% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            50% { transform: translateX(-5px); }
            60% { transform: translateX(5px); }
            70% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
            90% { transform: translateX(-1px); }
        }

        .arena {
            background: radial-gradient(circle at 20% 30%, #3a6b4d, #1d3b2a);
            border-radius: 36px 36px 24px 24px;
            padding: 20px 24px 24px;
            box-shadow: inset 0 -6px 0 #0f2a1d, inset 0 6px 10px #b8d9a0;
            border: 2px solid #cba96b;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .question-area {
            text-align: center;
            margin-bottom: 12px;
            position: relative;
            flex-shrink: 0;
        }
        .question-badge {
            display: inline-block;
            background: #fae074;
            padding: 6px 32px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.2rem;
            color: #1f3a2a;
            letter-spacing: 2px;
            box-shadow: 0 3px 0 #b47d44, inset 0 2px 8px #fff3c9;
            border: 1px solid #eec77a;
        }
        .question-box {
            background: #fcf3da;
            max-width: 480px;
            margin: 8px auto 0;
            padding: 12px 20px;
            border-radius: 60px;
            box-shadow: 0 6px 0 #b68b4a, inset 0 -3px 0 #dbb87a;
            border: 2px solid #f5d58c;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        #questionText {
            font-size: 3rem;
            font-weight: 900;
            color: #1f2f28;
            text-shadow: 2px 2px 0 #dbb46a;
            letter-spacing: 2px;
            line-height: 1.1;
        }
        .sub-text {
            color: #4d2f1a;
            font-size: 1.2rem;
            background: #d9b46e;
            display: inline-block;
            padding: 0 18px;
            border-radius: 30px;
            font-weight: 600;
            white-space: nowrap;
        }

        /* 左右分屏 */
        .players-row {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        .player-column {
            flex: 1 1 45%;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 40px 40px 24px 24px;
            padding: 16px 12px 12px;
            border: 2px solid rgba(255, 215, 120, 0.2);
            backdrop-filter: blur(4px);
            transition: background 0.4s, border-color 0.4s, box-shadow 0.4s;
        }
        .player-column.fire {
            background: rgba(180, 80, 20, 0.20);
            border-color: #f4b86a;
        }
        .player-column.moon {
            background: rgba(150, 60, 140, 0.20);
            border-color: #e4a0d7;
        }

        /* ===== 胜利/失败特效 ===== */
        .player-column.victory {
            background: rgba(255, 215, 0, 0.35) !important;
            border-color: #ffd700 !important;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.5), inset 0 0 30px rgba(255, 200, 0, 0.15);
            z-index: 10;
        }
        .player-column.victory .character-body {
            animation: victoryPulse 0.9s ease infinite alternate;
            filter: drop-shadow(0 0 20px #ffd700) drop-shadow(0 0 40px #ffaa00);
        }
        .player-column.victory .player-label {
            color: #ffdd55;
            text-shadow: 0 0 20px gold, 0 0 40px orange;
            font-size: 1.2rem;
        }
        @keyframes victoryPulse {
            0% {
                transform: scale(1.4);
                filter: drop-shadow(0 0 15px #ffd700) drop-shadow(0 0 30px #ff8800);
            }
            100% {
                transform: scale(1.7);
                filter: drop-shadow(0 0 30px #ffea00) drop-shadow(0 0 60px #ff5500);
            }
        }

        .player-column.defeat {
            background: rgba(80, 80, 80, 0.45) !important;
            border-color: #555 !important;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.6);
            filter: grayscale(0.7) brightness(0.7);
        }
        .player-column.defeat .character-body {
            animation: defeatShrink 0.5s forwards;
            filter: grayscale(1) brightness(0.4) drop-shadow(0 0 5px #333);
        }
        .player-column.defeat .player-label {
            color: #888;
            text-shadow: none;
        }
        @keyframes defeatShrink {
            0% { transform: scale(1); filter: grayscale(0) brightness(1); }
            100% { transform: scale(0.5); filter: grayscale(1) brightness(0.4); }
        }

        .player-column.draw {
            background: rgba(180, 180, 180, 0.2) !important;
            border-color: #aaa !important;
        }
        .player-column.draw .character-body {
            animation: drawNeutral 0.6s ease forwards;
            filter: drop-shadow(0 0 8px #aaa);
        }
        @keyframes drawNeutral {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(0.85); opacity: 0.8; }
        }

        .player-column .result-emoji {
            position: absolute;
            top: -10px;
            right: -10px;
            font-size: 3.2rem;
            z-index: 20;
            pointer-events: none;
            animation: resultEmojiPop 0.5s ease forwards;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.5));
        }
        @keyframes resultEmojiPop {
            0% { opacity: 0; transform: scale(0.2) rotate(-20deg); }
            60% { opacity: 1; transform: scale(1.3) rotate(5deg); }
            100% { opacity: 1; transform: scale(1) rotate(0deg); }
        }
        .player-card {
            background: #2f4d3b;
            border-radius: 40px 40px 20px 20px;
            padding: 14px 14px 10px;
            width: 100%;
            max-width: 320px;
            box-shadow: inset 0 -5px 0 #1b3123, 0 6px 10px rgba(0, 0, 0, 0.4);
            border: 2px solid #c7a45b;
            position: relative;
            overflow: visible;
        }
        .hp-section {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 4px;
        }
        .avatar-icon {
            font-size: 2.4rem;
            filter: drop-shadow(0 3px 3px black);
        }
        .hp-bar-bg {
            flex: 1;
            height: 20px;
            background: #3d1f1a;
            border-radius: 40px;
            border: 2px solid #a5593e;
            overflow: hidden;
            box-shadow: inset 0 2px 4px #1a0b08;
        }
        .hp-fill {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #eb3a2b, #ff6a4b);
            border-radius: 40px;
            transition: width 0.25s ease;
        }
        .hp-number {
            color: #fddba0;
            font-weight: 800;
            font-size: 1.6rem;
            min-width: 30px;
            text-shadow: 0 2px 0 #4f1e0e;
        }
        .character-body {
            font-size: 4rem;
            line-height: 1;
            margin: 4px 0 2px;
            filter: drop-shadow(0 4px 3px #0f1f16);
            transition: transform 0.15s, filter 0.3s;
            text-align: center;
        }
        .skill-effect {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.4rem;
            font-weight: 900;
            text-shadow: 0 0 20px currentColor, 0 0 40px currentColor;
            pointer-events: none;
            white-space: nowrap;
            opacity: 0;
            z-index: 30;
        }
        .skill-effect.show {
            animation: skillPop 0.8s forwards;
        }
        @keyframes skillPop {
            0% { opacity: 0; transform: translateX(-50%) scale(0.2); }
            30% { opacity: 1; transform: translateX(-50%) scale(1.3); }
            70% { opacity: 1; transform: translateX(-50%) scale(1.0); }
            100% { opacity: 0; transform: translateX(-50%) scale(0.6) translateY(-30px); }
        }

        .options-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px 10px;
            margin-top: 12px;
            width: 100%;
            max-width: 320px;
        }
        .option-btn {
            background: #ead2a0;
            border: none;
            border-radius: 30px;
            padding: 10px 18px;
            font-size: 1.6rem;
            font-weight: 800;
            color: #1a2f24;
            box-shadow: 0 5px 0 #9f7b44, 0 4px 8px rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: all 0.06s linear;
            min-width: 56px;
            border: 2px solid #f7e2b0;
            text-shadow: 1px 1px 0 #dbbf7a;
            flex: 1 0 auto;
        }
        .option-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #9f7b44;
        }
        .option-btn:disabled {
            opacity: 0.4;
            transform: translateY(4px);
            box-shadow: 0 1px 0 #7a5d34;
            cursor: not-allowed;
        }
        .player-column.fire .option-btn {
            background: #f4b86a;
            border-color: #e6953c;
            box-shadow: 0 5px 0 #a8521e, 0 4px 8px rgba(0, 0, 0, 0.4);
            color: #2d1e0a;
        }
        .player-column.moon .option-btn {
            background: #e4a0d7;
            border-color: #d479be;
            box-shadow: 0 5px 0 #9b4f86, 0 4px 8px rgba(0, 0, 0, 0.4);
            color: #3b1e2f;
        }

        .player-label {
            font-weight: 700;
            color: #fadd9b;
            letter-spacing: 1px;
            margin-top: 6px;
            font-size: 1.1rem;
            transition: color 0.3s, text-shadow 0.3s, font-size 0.3s;
        }
        .feedback-badge {
            font-size: 3rem;
            font-weight: 900;
            text-align: center;
            min-height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            width: 64px;
        }
        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #f8e6b4;
            font-weight: bold;
            padding: 8px 8px 0;
            margin-top: 12px;
            flex-shrink: 0;
            gap: 12px;
            font-size: 1.2rem;
            flex-wrap: wrap;
        }
        .reset-btn {
            background: #c9a464;
            border: 0;
            border-radius: 40px;
            padding: 8px 24px;
            font-weight: 800;
            font-size: 1.2rem;
            color: #1e2a1a;
            box-shadow: 0 3px 0 #7a5d2e;
            cursor: pointer;
            transition: 0.04s linear;
            border: 2px solid #efdbaa;
            white-space: nowrap;
        }
        .reset-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #7a5d2e;
        }
        .turn-indicator {
            background: #2c4b36;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 1.1rem;
            border: 2px solid #bda05b;
            white-space: nowrap;
        }
        .wrong-flash {
            animation: wrongAnim 0.5s;
        }
        @keyframes wrongAnim {
            0% { background-color: rgba(255, 0, 0, 0.6); }
            100% { background-color: transparent; }
        }
        .damage-number {
            position: absolute;
            font-size: 2rem;
            font-weight: 900;
            color: #ff3f2f;
            text-shadow: 2px 2px 0 black;
            pointer-events: none;
            animation: floatUp 0.8s forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-40px); }
        }
        .punch-effect {
            animation: punchShake 0.25s;
        }
        @keyframes punchShake {
            0% { transform: translateX(0); }
            25% { transform: translateX(6px); }
            50% { transform: translateX(-4px); }
            75% { transform: translateX(3px); }
            100% { transform: translateX(0); }
        }

        /* ===== 🎊 结语动画叠加层 ===== */
        .ending-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s 0.45s, opacity 0.4s ease;
        }
        .ending-overlay.active {
            visibility: visible;
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        .ending-card {
            background: linear-gradient(145deg, #faf3e0, #f7e8c8);
            border-radius: 64px;
            padding: 28px 48px 34px;
            max-width: 86vw;
            width: 540px;
            text-align: center;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), inset 0 0 0 4px #ffe6a3;
            transform: scale(0.6) rotate(-6deg);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid #daae6b;
        }
        .ending-overlay.active .ending-card {
            transform: scale(1) rotate(0deg);
        }
        .ending-icon {
            font-size: 5.8rem;
            line-height: 1.2;
            margin-bottom: 8px;
            filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.15));
        }
        .ending-title {
            font-size: 2.8rem;
            font-weight: 900;
            color: #2d3f2a;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0 #dbb25e;
            margin: 6px 0 4px;
        }
        .ending-sub {
            font-size: 1.2rem;
            color: #5f4d26;
            background: #efdbaa;
            display: inline-block;
            padding: 2px 24px;
            border-radius: 40px;
            margin: 8px 0 14px;
            font-weight: 600;
        }
        .ending-particles {
            font-size: 2.2rem;
            letter-spacing: 8px;
            margin-top: 6px;
            animation: particleFloat 1.5s ease infinite alternate;
        }
        @keyframes particleFloat {
            0% { transform: translateY(0); opacity: 0.7; }
            100% { transform: translateY(-18px); opacity: 1; }
        }
        .ending-btn {
            background: #dbb25e;
            border: 0;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 800;
            padding: 12px 40px;
            margin-top: 16px;
            color: #1f2d18;
            box-shadow: 0 5px 0 #8f6f35, 0 6px 14px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: 0.08s linear;
            border: 2px solid #f9e6b0;
        }
        .ending-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #8f6f35;
        }

        /* ===== 🎵 背景音乐按钮 ===== */
        .music-btn {
            background: #3a6b5c;
            border: 0;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 700;
            font-size: 1rem;
            color: #f8e6b4;
            box-shadow: 0 3px 0 #1f4237;
            cursor: pointer;
            transition: 0.04s linear;
            border: 2px solid #88b89c;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .music-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1f4237;
        }
        .music-btn.playing {
            background: #5a8a7a;
            border-color: #c8e6d0;
            box-shadow: 0 3px 0 #2c5a4a;
        }

        /* ===== 📥 保存按钮 ===== */
        .save-btn {
            background: #7a5d34;
            border: 0;
            border-radius: 40px;
            padding: 8px 18px;
            font-weight: 700;
            font-size: 1rem;
            color: #f8e6b4;
            box-shadow: 0 3px 0 #3f2a10;
            cursor: pointer;
            transition: 0.04s linear;
            border: 2px solid #bda05b;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .save-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #3f2a10;
        }

        /* ===== 移动适配 ===== */
        @media (max-width: 700px) {
            body {
                font-size: 16px;
            }
            .game-container {
                padding: 8px;
                max-height: 100vh;
            }
            .arena {
                padding: 6px 8px 10px;
            }
            .question-badge {
                font-size: 0.8rem;
                padding: 2px 14px;
            }
            .question-box {
                max-width: 220px;
                padding: 4px 8px;
            }
            #questionText {
                font-size: 2.2rem;
            }
            .sub-text {
                font-size: 0.7rem;
                padding: 0 10px;
            }
            .player-card {
                padding: 6px 6px 4px;
                max-width: 200px;
            }
            .avatar-icon {
                font-size: 1.4rem;
            }
            .hp-bar-bg {
                height: 10px;
            }
            .hp-number {
                font-size: 0.8rem;
                min-width: 20px;
            }
            .character-body {
                font-size: 2.4rem;
            }
            .option-btn {
                font-size: 1.1rem;
                padding: 3px 6px;
                min-width: 34px;
            }
            .options-group {
                gap: 3px;
                max-width: 200px;
            }
            .player-label {
                font-size: 0.7rem;
            }
            .feedback-badge {
                font-size: 1.4rem;
                width: 32px;
                min-height: 1.6rem;
            }
            .game-info {
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px;
            }
            .turn-indicator {
                font-size: 0.7rem;
                padding: 2px 10px;
            }
            .reset-btn {
                font-size: 0.8rem;
                padding: 4px 12px;
            }
            .music-btn {
                font-size: 0.8rem;
                padding: 4px 12px;
            }
            .save-btn {
                font-size: 0.8rem;
                padding: 4px 12px;
            }
            .skill-effect {
                font-size: 1.4rem;
            }
            .player-column.victory .character-body {
                animation: victoryPulseMobile 0.9s ease infinite alternate;
            }
            @keyframes victoryPulseMobile {
                0% { transform: scale(1.25); }
                100% { transform: scale(1.45); }
            }
            .player-column.defeat .character-body {
                transform: scale(0.5);
            }
            .player-column .result-emoji {
                font-size: 1.8rem;
                top: -6px;
                right: -6px;
            }
            .ending-card {
                padding: 20px 20px 28px;
                border-radius: 40px;
                width: 90vw;
            }
            .ending-icon {
                font-size: 3.6rem;
            }
            .ending-title {
                font-size: 2rem;
            }
            .ending-sub {
                font-size: 0.9rem;
            }
            .ending-particles {
                font-size: 1.6rem;
                letter-spacing: 4px;
            }
            .ending-btn {
                font-size: 1rem;
                padding: 8px 28px;
            }
        }
    </style>
</head>
<body><script>
