<script>
// ===== Game State =====
const state = {
  score: 0,
  targetAngle: 90,
  zeroPosition: 'random', // 'left', 'right', 'random'
  currentZeroSide: 'left', // actual side for current round
  easyMode: false,
  soundOn: true,
  isAnimating: false,
  characters: ['owl', 'owl-yellow', 'monster', 'spiky', 'bat'],
  currentChar: 'owl'
};

// SVG center and radius
const CX = 450, CY = 450, R = 300;

// ===== Utility Functions =====
function degToRad(deg) { return deg * Math.PI / 180; }

// Convert game angle to SVG point on protractor
// When zero is left: gameAngle 0=left(180° in svg), 90=top, 180=right(0°)
// When zero is right: gameAngle 0=right(0°), 90=top, 180=left(180°)
function angleToPoint(angle, zeroSide) {
  let svgAngle;
  if (zeroSide === 'left') {
    svgAngle = 180 - angle; // standard position
  } else {
    svgAngle = angle;
  }
  const rad = degToRad(svgAngle);
  return {
    x: CX + R * Math.cos(rad),
    y: CY - R * Math.sin(rad)
  };
}

// ===== Generate Tick Marks =====
function generateTickMarks() {
  const tickGroup = document.getElementById('tickMarks');
  const innerTickGroup = document.getElementById('innerTickMarks');
  const labelGroup = document.getElementById('scaleLabels');
  tickGroup.innerHTML = '';
  innerTickGroup.innerHTML = '';
  labelGroup.innerHTML = '';

  // Inner circle radius for inner tick marks
  const INNER_R = R - 44;

  for (let deg = 0; deg <= 180; deg++) {
    const rad = degToRad(deg);
    const isMajor = deg % 10 === 0;
    const isMid = deg % 5 === 0;

    // ===== Outer tick marks (from outer edge inward) =====
    const tickLen = isMajor ? 18 : (isMid ? 12 : 7);
    const innerR = R - tickLen;

    const x1 = CX + R * Math.cos(rad);
    const y1 = CY - R * Math.sin(rad);
    const x2 = CX + innerR * Math.cos(rad);
    const y2 = CY - innerR * Math.sin(rad);

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('stroke', '#333');
    line.setAttribute('stroke-width', isMajor ? 1.8 : 1);
    tickGroup.appendChild(line);

    // ===== Inner tick marks (at inner circle, extending inward) =====
    const innerTickLen = isMajor ? 14 : (isMid ? 9 : 5);
    const innerTickEndR = INNER_R - innerTickLen;

    const ix1 = CX + INNER_R * Math.cos(rad);
    const iy1 = CY - INNER_R * Math.sin(rad);
    const ix2 = CX + innerTickEndR * Math.cos(rad);
    const iy2 = CY - innerTickEndR * Math.sin(rad);

    const innerLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    innerLine.setAttribute('x1', ix1);
    innerLine.setAttribute('y1', iy1);
    innerLine.setAttribute('x2', ix2);
    innerLine.setAttribute('y2', iy2);
    innerLine.setAttribute('stroke', '#333');
    innerLine.setAttribute('stroke-width', isMajor ? 1.5 : 0.8);
    innerTickGroup.appendChild(innerLine);

    // Major tick labels
    if (isMajor) {
      // Outer scale (blue): 0 at left, 180 at right
      const outerVal = 180 - deg;
      const outerR = R - 32;
      const ox = CX + outerR * Math.cos(rad);
      const oy = CY - outerR * Math.sin(rad);
      const outerText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      outerText.setAttribute('x', ox);
      outerText.setAttribute('y', oy + 5);
      outerText.setAttribute('text-anchor', 'middle');
      outerText.setAttribute('font-size', '16');
      outerText.setAttribute('font-weight', '600');
      outerText.setAttribute('fill', '#1e88e5');
      outerText.textContent = outerVal;
      labelGroup.appendChild(outerText);

      // Inner scale (red): 180 at left, 0 at right
      const innerVal = deg;
      const innerR2 = R - 62;
      const ix = CX + innerR2 * Math.cos(rad);
      const iy = CY - innerR2 * Math.sin(rad);
      const innerText = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      innerText.setAttribute('x', ix);
      innerText.setAttribute('y', iy + 5);
      innerText.setAttribute('text-anchor', 'middle');
      innerText.setAttribute('font-size', '15');
      innerText.setAttribute('font-weight', '600');
      innerText.setAttribute('fill', '#e53935');
      innerText.textContent = innerVal;
      labelGroup.appendChild(innerText);
    }
  }
}

// ===== Draw Protractor Background =====
function drawProtractorBg() {
  const path = document.getElementById('protractorBg');
  // Semicircle from left (180°) to right (0°), closed with bottom line
  const d = `M ${CX - R} ${CY} A ${R} ${R} 0 0 1 ${CX + R} ${CY} Z`;
  path.setAttribute('d', d);

  // Outer arc green border (semicircle only, not closed)
  const arc = document.getElementById('outerArc');

// ===== Update Game Display =====
function updateDisplay() {
  const zeroSide = state.currentZeroSide;
  const angle = state.targetAngle;
  const pt = angleToPoint(angle, zeroSide);

  // Update aim line
  const aimLine = document.getElementById('aimLine');
  aimLine.setAttribute('x2', pt.x);
  aimLine.setAttribute('y2', pt.y);

  // Update turret indicator rotation
  const indicator = document.getElementById('turretIndicator');
  let rotAngle;
  if (zeroSide === 'left') {
    rotAngle = -(90 - angle); // rotate from upward position
  } else {
    rotAngle = 90 - angle;
  }
  indicator.setAttribute('transform', `rotate(${rotAngle}, ${CX}, ${CY})`);

  // Update angle arc
  const arc = document.getElementById('angleArc');
  const arcR = 60;
  let arcPath;
  if (zeroSide === 'left') {
    // Arc from left (180°) to target (180-angle)
    const startRad = degToRad(180);
    const endRad = degToRad(180 - angle);
    const sx = CX + arcR * Math.cos(startRad);
    const sy = CY - arcR * Math.sin(startRad);
    const ex = CX + arcR * Math.cos(endRad);
    const ey = CY - arcR * Math.sin(endRad);
    const largeArc = angle > 180 ? 1 : 0;
    arcPath = `M ${sx} ${sy} A ${arcR} ${arcR} 0 ${largeArc} 1 ${ex} ${ey}`;
    arc.setAttribute('stroke', '#1e88e5');
  } else {
    // Arc from right (0°) to target (angle)
    const startRad = degToRad(0);
    const endRad = degToRad(angle);
    const sx = CX + arcR * Math.cos(startRad);
    const sy = CY - arcR * Math.sin(startRad);
    const ex = CX + arcR * Math.cos(endRad);
    const ey = CY - arcR * Math.sin(endRad);
    const largeArc = angle > 180 ? 1 : 0;
    arcPath = `M ${sx} ${sy} A ${arcR} ${arcR} 0 ${largeArc} 0 ${ex} ${ey}`;
    arc.setAttribute('stroke', '#e53935');
  }
  arc.setAttribute('d', arcPath);

  // Update baseline visibility
  const baselineLeft = document.getElementById('baselineLeft');
  const baselineRight = document.getElementById('baselineRight');
  if (zeroSide === 'left') {
    baselineLeft.style.display = '';
    baselineRight.style.display = 'none';
  } else {
    baselineLeft.style.display = 'none';
    baselineRight.style.display = '';
  }

  // Update 0° label
  const zeroLabel = document.getElementById('zeroLabel');
  if (zeroSide === 'left') {
    zeroLabel.setAttribute('x', CX - R - 50);
    zeroLabel.setAttribute('fill', '#1e88e5');
  } else {
    zeroLabel.setAttribute('x', CX + R + 50);
    zeroLabel.setAttribute('fill', '#e53935');
  }

  // Update character position and type
  const character = document.getElementById('character');
  character.setAttribute('transform', `translate(${pt.x}, ${pt.y - 48})`);
  character.innerHTML = `<ellipse cx="0" cy="48" rx="20" ry="5" fill="rgba(0,0,0,0.15)"/>` + getCharacterSVG(state.currentChar);

  // Update hints
  const hintBadge = document.getElementById('hintBadge');
  const scaleHint = document.getElementById('scaleHint');
  if (zeroSide === 'left') {
    hintBadge.textContent = '请看外圈(左边0度)';
    hintBadge.className = 'hint-badge';
    scaleHint.textContent = '蓝线在左-读外圈';
    scaleHint.className = 'scale-hint blue';
  } else {
    hintBadge.textContent = '请看内圈(右边0度)';
    hintBadge.className = 'hint-badge';
    scaleHint.textContent = '红线在右-读内圈';
    scaleHint.className = 'scale-hint red';
  }

  // Clear input
  document.getElementById('angleInput').value = '';
}

// ===== Generate New Round =====
function newRound() {
  // Determine zero side
  if (state.zeroPosition === 'random') {
    state.currentZeroSide = Math.random() < 0.5 ? 'left' : 'right';
  } else {
    state.currentZeroSide = state.zeroPosition;
  }

  // Generate target angle
  let angle;
  if (state.easyMode) {
    angle = Math.floor(Math.random() * 35) * 5 + 5; // 5, 10, ... 175
  } else {
    angle = Math.floor(Math.random() * 166) + 8; // 8-173
  }
  state.targetAngle = angle;

  // Pick random character
  state.currentChar = state.characters[Math.floor(Math.random() * state.characters.length)];

  state.isAnimating = false;
  updateDisplay();
}

// ===== Fire / Check Answer =====
function fire() {
  if (state.isAnimating) return;
  const input = document.getElementById('angleInput');
  const userAngle = parseInt(input.value);

  if (isNaN(userAngle) || userAngle < 0 || userAngle > 180) {
    input.style.borderColor = '#e53935';
    setTimeout(() => { input.style.borderColor = ''; }, 1000);
    return;
  }

  state.isAnimating = true;
  playSound('fire');

  // Animate projectile
  const projectile = document.getElementById('projectile');
  const zeroSide = state.currentZeroSide;
  const targetPt = angleToPoint(state.targetAngle, zeroSide);

  // Calculate user's aim point
  const userPt = angleToPoint(userAngle, zeroSide);

  projectile.style.display = '';
  projectile.setAttribute('cx', CX);
  projectile.setAttribute('cy', CY - 30);

  // Animate along path
  const duration = 600;
  const startTime = performance.now();

  function animateProjectile(now) {
    const elapsed = now - startTime;
    const t = Math.min(elapsed / duration, 1);
    // Ease out
    const ease = 1 - Math.pow(1 - t, 3);
    const x = CX + (userPt.x - CX) * ease;
    const y = (CY - 30) + (userPt.y - (CY - 30)) * ease;
    projectile.setAttribute('cx', x);
    projectile.setAttribute('cy', y);

    if (t < 1) {
      requestAnimationFrame(animateProjectile);
    } else {
      projectile.style.display = 'none';
      checkAnswer(userAngle);
    }
  }
  requestAnimationFrame(animateProjectile);
}

// ===== Check Answer =====
function checkAnswer(userAngle) {
  const diff = Math.abs(userAngle - state.targetAngle);
  const hintBadge = document.getElementById('hintBadge');

  if (diff <= 2) {
    // Correct!
    state.score += 10;
    document.getElementById('score').textContent = state.score;
    hintBadge.textContent = '命中！太棒了！';
    hintBadge.className = 'hint-badge';
    hintBadge.style.color = '#2e7d32';
    hintBadge.style.background = 'rgba(46,125,50,0.1)';
    playSound('correct');

    // Show explosion at target
    showExplosion();

    setTimeout(() => {
      hintBadge.style.color = '';
      hintBadge.style.background = '';
      newRound();
    }, 1200);
  } else {
    // Wrong
    hintBadge.textContent = '打偏了，再仔细看看度数！';
    hintBadge.className = 'hint-badge error';
    playSound('wrong');
    state.isAnimating = false;

    setTimeout(() => {
      hintBadge.className = 'hint-badge';
      // Restore original hint
      if (state.currentZeroSide === 'left') {
        hintBadge.textContent = '请看外圈(左边0度)';
      } else {
        hintBadge.textContent = '请看内圈(右边0度)';
      }
    }, 2000);
  }
}

// ===== Explosion Effect =====
function showExplosion() {
  const svg = document.getElementById('protractorSvg');
  const zeroSide = state.currentZeroSide;
  const pt = angleToPoint(state.targetAngle, zeroSide);

  const explosion = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  explosion.setAttribute('transform', `translate(${pt.x}, ${pt.y})`);

  // Star burst
  for (let i = 0; i < 8; i++) {
    const angle = (i / 8) * 360;
    const rad = degToRad(angle);
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', 0);
    line.setAttribute('y1', 0);
    line.setAttribute('x2', 25 * Math.cos(rad));
    line.setAttribute('y2', 25 * Math.sin(rad));
    line.setAttribute('stroke', '#ff9800');
    line.setAttribute('stroke-width', '3');
    line.setAttribute('stroke-linecap', 'round');
    explosion.appendChild(line);
  }
  const center = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  center.setAttribute('r', '12');
  center.setAttribute('fill', '#ffeb3b');
  explosion.appendChild(center);

  svg.appendChild(explosion);

  // Animate
  let scale = 0.5;
  const startTime = performance.now();
  function anim(now) {
    const t = (now - startTime) / 500;
    if (t >= 1) {
      explosion.remove();
      return;
    }
    const s = 0.5 + t * 1.5;
    const opacity = 1 - t;
    explosion.setAttribute('transform', `translate(${pt.x}, ${pt.y}) scale(${s})`);
    explosion.style.opacity = opacity;
    requestAnimationFrame(anim);
  }
  requestAnimationFrame(anim);
}

// ===== Sound Effects (Web Audio API) =====
let audioCtx = null;
function playSound(type) {
  if (!state.soundOn) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === 'fire') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.15);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } else if (type === 'correct') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523, audioCtx.currentTime);
      osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.1);
      osc.frequency.setValueAtTime(784, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.4);
    } else if (type === 'wrong') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, audioCtx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.3);
    }
  } catch (e) { /* ignore audio errors */ }
}

// ===== Event Listeners =====
document.getElementById('fireBtn').addEventListener('click', fire);
document.getElementById('angleInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') fire();
});

document.getElementById('spinUp').addEventListener('click', () => {
  const input = document.getElementById('angleInput');
  let val = parseInt(input.value) || 0;
  val = Math.min(val + 1, 180);
  input.value = val;
});
document.getElementById('spinDown').addEventListener('click', () => {
  const input = document.getElementById('angleInput');
  let val = parseInt(input.value) || 0;
  val = Math.max(val - 1, 0);
  input.value = val;
});

// Position buttons
document.querySelectorAll('.pos-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.pos-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.zeroPosition = btn.dataset.pos;
    newRound();
  });
});

// Easy mode
document.getElementById('easyMode').addEventListener('change', (e) => {
  state.easyMode = e.target.checked;
  newRound();
});

// Refresh button
document.getElementById('refreshBtn').addEventListener('click', newRound);

// Sound toggle
document.getElementById('soundBtn').addEventListener('click', () => {
  state.soundOn = !state.soundOn;
  document.getElementById('soundOnIcon').style.display = state.soundOn ? '' : 'none';
  document.getElementById('soundOffIcon').style.display = state.soundOn ? 'none' : '';
});

// ===== Initialize =====
generateTickMarks();
drawProtractorBg();
newRound();
</script>
