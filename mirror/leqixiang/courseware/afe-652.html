<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📏 长度测量 · 分步引导</title>
  <style>
    /* ===== 浅色绿色系 CSS变量 ===== */
    :root {
      --bg-page: #f4f9f4;
      --bg-panel: #ffffff;
      --bg-panel-alt: #eef5ee;
      --border: #c8dfc8;
      --text: #1f3b2f;
      --text-dim: #5a7a6a;
      --accent: #2b9348;
      --accent2: #f4a261;
      --accent3: #52b788;
      --accent4: #e9c46a;
      --danger: #d62839;
      --panel-width: 300px;
      --header-h: 48px;
      --transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0, 40, 20, 0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: var(--bg-page);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* 移动端头部 */
    #mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: var(--header-h);
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }
    #mobile-header h1 {
      font-size: 16px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.3px;
    }
    #mobile-header .btn {
      background: var(--bg-panel-alt);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
      transition: var(--transition);
    }
    #mobile-header .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* 主布局 —— 二栏 */
    #main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* 左侧信息面板 */
    #side-panel {
      width: var(--panel-width);
      min-width: var(--panel-width);
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding-bottom: 20px;
      box-shadow: 2px 0 12px rgba(0,0,0,0.02);
    }

    /* 右侧视口 */
    #center-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #eaf3ea;
      background-image: radial-gradient(circle at 20% 50%, #d4e8d4 0%, #eaf3ea 90%);
    }

    /* ===== 面板section统一 ===== */
    .panel-section {
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }
    .panel-section:last-child {
      border-bottom: none;
    }
    .panel-section h3 {
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }
    .panel-section h3::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--accent);
      border-radius: 3px;
    }

    /* 步骤进度 */
    .step-progress {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 8px;
      margin-bottom: 8px;
    }
    .step-dot {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-panel-alt);
      border: 2px solid var(--border);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-dim);
      transition: var(--transition);
    }
    .step-dot.active {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
      box-shadow: 0 0 0 4px rgba(43, 147, 72, 0.15);
    }
    .step-dot.done {
      border-color: var(--accent3);
      background: var(--accent3);
      color: white;
    }

    .step-desc {
      background: var(--bg-panel-alt);
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      color: var(--text);
      border-left: 4px solid var(--accent);
      margin: 10px 0 6px;
    }
    .step-desc strong {
      color: var(--accent);
    }

    /* 按钮 */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .btn {
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      color: var(--text);
      transition: all 0.2s;
      white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.02);
    }
    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: #f0faf0;
    }
    .btn.active {
      border-color: var(--accent2);
      color: var(--accent2);
      background: rgba(244, 162, 97, 0.08);
    }
    .btn.accent {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(43, 147, 72, 0.06);
    }
    .btn.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .btn.primary:hover {
      background: #1f7a3a;
      border-color: #1f7a3a;
    }

    /* 数据行 */
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 7px 0;
      font-size: 13px;
      border-bottom: 1px solid rgba(0, 40, 20, 0.06);
    }
    .data-row:last-child { border-bottom: none; }
    .data-row .label { color: var(--text-dim); }
    .data-row .value { color: var(--text); font-weight: 600; text-align: right; }

    /* 输入框 */
    .input-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      margin: 8px 0 4px;
    }
    .input-group input {
      padding: 8px 12px;
      border-radius: 30px;
      border: 1px solid var(--border);
      background: var(--bg-panel);
      font-size: 14px;
      width: 80px;
      color: var(--text);
      outline: none;
      transition: 0.2s;
    }
    .input-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(43, 147, 72, 0.12);
    }
    .input-group span {
      font-size: 14px;
      color: var(--text-dim);
    }

    .feedback {
      font-size: 13px;
      padding: 6px 0 2px;
      min-height: 24px;
      color: var(--accent);
      font-weight: 500;
    }
    .feedback.error { color: var(--danger); }

    /* 视口内叠加信息卡片 */
    .info-card {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      border: 1px solid var(--accent3);
      border-radius: 16px;
      padding: 14px 24px;
      max-width: 420px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s;
      z-index: 6;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 40, 20, 0.10);
    }
    .info-card.visible { opacity: 1; }

    /* 刻度尺容器 (canvas) */
    #rulerCanvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #rulerCanvas:active { cursor: grabbing; }

    /* ===== 响应式 ===== */
    @media (max-width: 820px) {
      #mobile-header { display: flex; }
      #side-panel {
        position: fixed;
        left: 0;
        top: var(--header-h);
        bottom: 0;
        z-index: 40;
        margin-left: calc(-1 * var(--panel-width) - 8px);
        transition: margin-left var(--transition);
        box-shadow: 4px 0 30px rgba(0,0,0,0.08);
        border-right: none;
      }
      #side-panel.open { margin-left: 0; }
      #center-panel { flex: 1; }
    }

    /* 小细节 */
    .unit-badge {
      display: inline-block;
      background: var(--bg-panel-alt);
      padding: 2px 10px;
      border-radius: 30px;
      font-size: 12px;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }
    .mt-1 { margin-top: 6px; }
    .mb-1 { margin-bottom: 6px; }
    .flex { display: flex; align-items: center; gap: 8px; }
  </style>
</head>

<div id="app">
  <!-- 移动端头部 -->
  <header id="mobile-header">
    <h1>📏 长度测量</h1>
    <button class="btn" id="togglePanelBtn">☰ 步骤</button>
  </header>

  <div id="main-layout">
    <!-- 左侧信息面板 -->
    <aside id="side-panel">
      <!-- 步骤引导 -->
      <div class="panel-section">
        <h3>🧭 分步引导</h3>
        <div class="step-progress" id="stepProgress">
          <span class="step-dot active" data-step="0">1</span>
          <span class="step-dot" data-step="1">2</span>
          <span class="step-dot" data-step="2">3</span>
          <span class="step-dot" data-step="3">4</span>
          <span class="step-dot" data-step="4">5</span>
        </div>
        <div class="step-desc" id="stepDesc">
          <strong>① 认识工具</strong> — 观察刻度尺，读出分度值和量程。
        </div>
        <div class="btn-row" id="stepControls">
          <button class="btn" id="prevBtn" disabled>◀ 上一步</button>
          <button class="btn primary" id="nextBtn">下一步 ▶</button>
        </div>
      </div>

      <!-- 读数 & 交互区 -->
      <div class="panel-section">
        <h3>📐 读数交互</h3>
        <div id="interactionArea">
          <!-- 动态由js填充 -->
          <div class="data-row"><span class="label">分度值</span><span class="value" id="displayDivValue">—</span></div>
          <div class="data-row"><span class="label">量程</span><span class="value" id="displayRange">—</span></div>
          <div style="margin-top: 8px;">
            <label style="font-size:13px; color:var(--text-dim);">准确值 (cm)</label>
            <div class="input-group">
              <input type="text" id="exactInput" placeholder="如 2.4" disabled>
              <span>cm</span>
            </div>
          </div>
          <div style="margin-top: 4px;">
            <label style="font-size:13px; color:var(--text-dim);">估读值 (mm)</label>
            <div class="input-group">
              <input type="text" id="estInput" placeholder="如 0.5" disabled>
              <span>mm</span>
            </div>
          </div>
          <button class="btn accent" id="checkBtn" disabled>✓ 检查读数</button>
          <div class="feedback" id="feedbackMsg"></div>
        </div>
      </div>

      <!-- 单位换算 -->
      <div class="panel-section">
        <h3>📊 单位换算</h3>
        <div id="conversionTable">
          <div class="data-row"><span class="label">米 (m)</span><span class="value" id="conv_m">—</span></div>
          <div class="data-row"><span class="label">分米 (dm)</span><span class="value" id="conv_dm">—</span></div>
          <div class="data-row"><span class="label">厘米 (cm)</span><span class="value" id="conv_cm">—</span></div>
          <div class="data-row"><span class="label">毫米 (mm)</span><span class="value" id="conv_mm">—</span></div>
        </div>
      </div>

      <!-- 刻度尺切换 -->
      <div class="panel-section">
        <h3>⚙️ 刻度尺类型</h3>
        <div class="btn-row">
          <button class="btn active" data-div="1" id="div1mm">1 mm</button>
          <button class="btn" data-div="10" id="div1cm">1 cm</button>
          <button class="btn" data-div="100" id="div1dm">1 dm</button>
        </div>
        <div style="margin-top: 8px; font-size:12px; color:var(--text-dim);">
          <span>拖动物体 ↔ 对齐零刻度</span>
        </div>
      </div>
    </aside>

    <!-- 视口 -->
    <main id="center-panel">
      <canvas id="rulerCanvas"></canvas>
      <!-- 叠加提示 -->
      <div class="info-card" id="infoCard">👆 拖动下方物体对齐零刻度线</div>
    </main>
  </div>
</div>
