	<div id="info" style="text-align: left"> 
		<h1 style="text-align: center">Newton's Cooling Law </h1>
		
 <!-- Left Panel -->  
	    <div class="control-panel">
		
		<div class="control-group">
		  Hot Metal:
		  <div class="slider-row">
		    <select id="metalSelector">
		      <option value="0.897">Aluminum</option>
		      <option value="0.385" selected>Copper</option>
		      <option value="0.5">Unknown 1</option>
		      <option value="0.6">Unknown 2</option>
		    </select>
		  </div>
		</div>
			    
		<div class="control-group">
		  Mass (g):
		  <div class="slider-row" style="display: flex; align-items: center;">
		    <input type="range" id="massMetalSlider" min="300" max="700" step="10" value="500" style="flex: 1; margin-right: 8px;">
		    <input type="text" id="massMetalValue" value="500" readonly style="width: 80px; text-align: center; color: blue; font-weight: bold;">
		  </div>
		  <div class="minmax" style="display: flex; justify-content: space-between; margin-top: 4px;">
		    <span>300</span>
		    <span>700</span>
		  </div>
		</div>
		    
		  <div class="control-group">
		    Temperature (°C):
		    <div class="slider-row">
		      <input type="range" id="tempMetalSlider" min="80" max="200" step="10" value="90">
		      <input type="text" id="tempMetalValue" value="90" readonly>
		    </div>
		    <div class="minmax">
		      <span>80</span>
		      <span>200</span>
		    </div>
		  </div>
		 <button class="btn btn-danger" id="start">Start</button>
		 <button class="btn btn-success" id="reset">Reset</button><br><br>
		    
		  <div class="control-group">
		    Final Temp:
		    <input type="text" id="finalTemp" value="0.0°" readonly style="width: 90px;">
		  </div>
	</div>
	<!-- Right Panel -->
	      <div class="control-panel-right">
		      
		<div class="control-group">
		  Cold Liquid:
		  <div class="slider-row">
		    <select id="liquidSelector">
		      <option value="2.14">Coconut Oil</option>
		      <option value="1.97">Olive Oil</option>
		      <option value="4.184" selected>Water</option>
		      <option value="3.0">Unknown</option>
		    </select>
		  </div>
		</div>
	  			
		  <div class="control-group">
		    Mass (g):
		    <div class="slider-row">
		      <input type="range" id="massLiquidSlider" min="1200" max="2000" step="10" value="1500">
		      <input type="text" id="massLiquidValue" value="1500" readonly>
		    </div>
		    <div class="minmax">
		      <span>1200</span><span>2000</span>
		    </div>
		  </div>
			
		  <div class="control-group">
		    Temp (°C):
		    <div class="slider-row">
		      <input type="range" id="tempLiquidSlider" min="6" max="25" step="1" value="10">
		      <input type="text" id="tempLiquidValue" value="10" readonly>
		    </div>
		    <div class="minmax">
		      <span>6</span><span>25</span>
		    </div>
		  </div>
		<button class="btn btn-danger" onclick="alert('Newton\'s Law of Cooling describes how a hot object cools down when placed into a colder liquid:&#10;&#10;T(t) = T_liquid + (T_metal_initial - T_liquid) * e^(-k * t)&#10;&#10;where:&#10;- T(t): metal temperature at time t&#10;- T_liquid: temperature of the liquid (constant)&#10;- T_metal_initial: initial metal temperature&#10;- k: cooling constant (depends on material and liquid)&#10;- t: time&#10;&#10;This model assumes heat loss rate is proportional to the temperature difference.')">
		    Newton's Cooling Law
		</button>
		
		      
	    </div>	

	</div>           
	<div id="viewport"></div>
</body>
