		    <div class="minmax">
		      <span>100</span><span>500</span>
		    </div>
		  </div>
		    
		  <div class="control-group">
		    Inductor (H):
		    <div class="slider-row">
		      <input type="range" id="indSlider" min="0.1" max="2" step="0.1" value="1.5">
		      <input type="text" id="indValue" value="1.5" readonly>
		    </div>
		    <div class="minmax">
		      <span>0.1</span>
		      <span>2</span>
		    </div>
		  </div>
		    	     
		  <div class="control-group">
		    Voltage Amplitude (V):
		    <div class="slider-row">
		      <input type="range" id="voltageSlider" min="0.4" max="5" step="0.2" value="3">
		      <input type="text" id="voltageValue" value="3" readonly>
		    </div>
		    <div class="minmax">
		      <span>0</span>
		      <span>5</span>
		    </div>
		  </div>	
		
		 <button class="btn btn-danger" id="start">Show Graph</button><br>
		
		 <button class="btn btn-success" id="reset">Reset</button>
		 	
	</div>
		      
</div>           
<div id="graphPanel">
    <h4>Series RLC Voltages vs. Time</h4>
    <canvas id="voltageGraph"></canvas>
    <div id="graphReadout"></div>
</div>

<div id="viewport"></div>
</body>
</html>
