const OPS10=`<h3>沿气路追踪，再取样检验</h3><p>刚接触化学，先打开顶部“操作提示”。每一步会解释意义、观察点与下一步。</p><div class="grid2"><button data-act="connect">插好接头</button><button data-act="disconnect">退出接头</button><button class="primary" data-act="play">开始产气</button><button data-act="stop">暂停观察</button><button data-act="step">推进25mL</button><button data-act="finish">到设定产气量</button></div><div class="metric"><strong id="metric10"></strong><small id="caption10"></small></div><div class="note" id="msg10"></div><details><summary>当前气路：收集、放走与漏气</summary><p>这是同一实验的实际事件，只影响此后的气流。先前排出的气体不会补回。</p><div class="grid2"><button data-act="collect">现在切到收集</button><button data-act="vent">现在切到排出</button><button data-act="tip">移入 / 移出管口</button><button data-act="resumeMotion">继续器具动作</button></div>${field('leak10','此后分流到环境 / %',0,0,100,1)}<button data-act="leak" class="wide">从现在起应用分流</button></details><h3>取一份真实气样</h3><label class="field">取样位置<select id="sampleAt10"><option value="inside">瓶内 / 排水管上部阀</option><option value="mouth">瓶口（向上排空气）</option></select></label>${field('sampleSize10','下一次取样体积 / mL',5,.2,10,.1)}${field('mouth10','瓶口样品来自瓶内的份额 / %',50,0,100,1)}<p class="tiny">瓶口份额是可改的混合假设，不是已测纯度；余下份额来自环境空气。改设置不改已取样品。</p><button class="wide" data-act="sampleSettings">应用为下一次取样设置</button><div class="grid2"><button data-act="toSample">移到取样点</button><button data-act="draw">拉活塞，抽样</button><button data-act="toRack">移回支架</button><button data-act="toTest">移到检验接口</button><button data-act="inject">推入石灰水</button><button data-act="wood">带火星木条检验</button><button data-act="woodPark">木条移回支架</button></div><details><summary>重备检验器与证据</summary><p>重新准备会把旧持样、导管气体和已反应物分别移入废弃账，并预置新鲜石灰水；不伪装成做过取液。</p><button class="wide" data-act="newTest">另备一套新鲜检验器</button><button class="wide" data-act="givenExtinction">辨析：只看到燃着的木条熄灭</button></details><h3>解释与记录</h3><div class="grid2"><button data-act="read">记录当前读数</button><button data-act="data">来源账本</button><button data-act="microUnlock">打开微观结构</button><button data-common="save">保存独立快照</button></div>`;
const RECIPE10=`<h3>另开一场对照实验</h3><p>这里只改草稿。按下方按钮才应用；不会改写当前气体或历史快照。</p><label class="field">气源模型<select id="gas10"><option value="CO2">二氧化碳 CO₂</option><option value="O2">氧气 O₂</option></select></label><label class="field">收集方法<select id="method10"><option value="air">向上排空气（完全混合近似）</option><option value="water">排水法（只开放O₂干气近似）</option></select></label>${field('dead10','上游装置初始空气 / mL',50,0,180,1)}${field('volume10','集气容积 / mL',250,100,500,1)}${field('total10','本次新生成气体总量 / mL',850,0,3000,1)}${field('start10','计划开始收集的累计生成量 / mL',100,0,3000,1)}${field('residual10','排水装置初始残余空气 / mL',0,0,20,.1)}<p class="tiny">收集起点须不大于本次总量。排空气瓶起初已有整瓶空气；残余空气输入只用于排水法。气量按25℃、101.325kPa参考状态记录。</p><button class="primary wide" data-act="new">应用为新实验</button><p>装置及气源为题设准备，不演示制气配液。二氧化碳会溶于水且部分与水反应，本课不提供未经标定的排水定量模型；这不表示水中绝不可能收集到CO₂。</p>`;
const HELP10=`<h3>课件定位与已读取来源</h3><p>人教社旧书目：九年级上册“我们周围的空气”“碳和碳的氧化物”。本校实际版次与现行人教教材正文尚待核验，不填未经核实的页码。科学与题目核验读取了NCERT Science Chapter2，2026–27重印，印刷p.20—21 Activity2.5与图2.2、p.22题3、p.34题2；AQA化学8462规范2019版p.73气体检验表；ACS中学化学6.10有关CO₂溶于水的原始教学活动。外国教材不作为人教版次证据。</p><p><a href="https://www.pep.com.cn/products/jc/czjks/201510/t20151026_1250821.shtml" target="_blank" rel="noopener">人教社旧书目</a> · <a href="https://ncert.nic.in/textbook/pdf/jesc102.pdf" target="_blank" rel="noopener">NCERT教材原页</a> · <a href="https://filestore.aqa.org.uk/resources/chemistry/specifications/AQA-8462-SP-2016.PDF" target="_blank" rel="noopener">AQA已读规范</a> · <a href="https://www.acs.org/middleschoolchemistry/lessonplans/chapter6/lesson10.html" target="_blank" rel="noopener">ACS教学活动</a></p><h3>气路与来源模型</h3><p>气源只输入所选新气体。上游死体积及向上排空气瓶分别按连续、充分混合容器近似，不按气体密度画稳定彩色分层。即使流过一瓶体积，也不表示已经完全置换。蓝/铜条只表示来源账本，不是分子真实颜色。</p><p>空气来源仍含约21%的氧气。因此“新气体来源比例”不是氧气总百分比，也不是真实纯度仪读数。追踪量为25℃、101.325kPa下干气参考体积；操作动画进度没有标定为真实秒数。逸失、分流、排出只作用于发生后新增流量。</p><p>O₂排水为干气近似，忽略溶解与水蒸气；原始空间体积由气压和液柱压差联立计算，参考量另列。管口位于水面下，上部小阀用于取样；这是为追踪样品增设的教学器材，不声称与某教材图片完全相同。CO₂水中溶解与反应不在本课定量模型内。</p><h3>取样与检验边界</h3><p>取样器在主场景以真实三维器具移动、插入、拉/推活塞。气体进入器具后保留原来的组成；换位置只改变下一次取样目标。开口瓶抽气后用环境空气补位；排水管抽气后以水补位。1mL检验导管按先进先出模型追踪：原有空气先离开，样品到达石灰水后才计入反应。</p><p>只开放O₂/CO₂教学体系。石灰水足量且为小样本，Ca(OH)₂+CO₂→CaCO₃↓+H₂O；浑浊只是定性示意，不预测可见阈值或纯度。已读教材还有过量CO₂使沉淀重新溶解的情形，本课不开放无限通气以避免冒充该反应模型。空气中痕量CO₂忽略。</p><p>氧气典型阳性为带火星木条复燃。对混合物不编造复燃临界百分比；阳性不证明100%纯净。排水阀接触测试实际扣除1mL以内参考气量；开口木条微量消耗忽略。仅燃着木条熄灭不唯一识别CO₂，更不能证明整瓶纯净。真实检验由教师在合规实验条件下完成，不点燃未知气体。</p><h3>研究及体验范围</h3><p>教师错因资料采用作者本人的教学记录，仅用于区分“制气”和“检验”，不作为本地中考频次统计。操作提示随状态更新，使用同一事件。恢复JSON默认暂停；历史快照独立。分子结构页教师主动打开，CO₂直线形与双键是结构解释，不替代宏观检验证据。</p>`;
