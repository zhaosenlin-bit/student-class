<!DOCTYPE html>
<html>
<head>
	<title>乐启享 · 物理实验</title>
	<link rel="icon" href="/brand/favicon.ico">
	<meta http-equiv='cache-control' content='no-cache'> 
	<meta http-equiv='expires' content='0'> 
	<meta http-equiv='pragma' content='no-cache'>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="/brand/favicon.ico">
	<link rel="stylesheet" href="/api/program-assets/3jcn-phyc240-capacitor-motor/_ext/maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
	<script src="/api/program-assets/3jcn-phyc240-capacitor-motor/_ext/cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
	<script src="/api/program-assets/3jcn-phyc240-capacitor-motor/_ext/maxcdn.bootstrapcdn.com/bootstrap/3.3.7/js/bootstrap.min.js"></script>
	<link type="text/css" rel="stylesheet" href="/api/program-assets/3jcn-phyc240-capacitor-motor/_ext/vendor/css/main3.css">
	<style>
		body {
			color: black;
		}
	</style>
	<script type="module">   
		
	import THREE from '../jsm/three.js';
		
	import { OrbitControls } from '../jsm/OrbitControls.js';
	import { FontLoader } from '../jsm/FontLoader.js';
	import { TextGeometry } from '../jsm/TextGeometry.js';	
	import { LineGeometry } from '../jsm/LineGeometry.js';
	import { Line2 } from '../jsm/Line2.js';
	import { LineMaterial } from '../jsm/LineMaterial.js';
		
		/**  author: Thomas Nguyen   "3jcn.us"
		 **  13 May 2024
		 **  All rights reserved **/
		
	var initScene, dragcontrols, controls, light;
	var textMesh, textMesh1, textMesh2, label_mesh, rotate_disk;
	var battery, lock, box, tube, hanger, hanger_string, increment = 0.02, count_particles = 0;
	var onoff = false, onoff2 = false, is_stop = false, is_endCharging = false, is_one = 1;
	var blueArray = [], particleArray = [], textArray = [], arrowArray = [];
	var pos_particle, neg_particle, step = 0, speed = 17, acc = 0, g = 9.81, hanger_mass = 0.2;
	let  text1, text2, text3, text4;
	var lastRemovalTime = performance.now();
	
	// Use const where possible for non-changing references
	const textureloader = new THREE.TextureLoader();
	const fontloader = new FontLoader();
	var scene = new THREE.Scene();
	var camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 1, 1000);
	const renderer = new THREE.WebGLRenderer({ antialias: true });

		
	initScene = function()  {
	    scene.background = new THREE.Color( 0x1DCBEA );
			camera = new THREE.PerspectiveCamera(
				35,
				window.innerWidth / window.innerHeight,
				1,
				1000
			);
			camera.position.set( 60, 50, 60 );
			camera.lookAt( scene.position );
			scene.add( camera );
			controls = new OrbitControls( camera, renderer.domElement );
	  
	    renderer.setSize(window.innerWidth, window.innerHeight);
	    renderer.shadowMap.enabled = true;
	    document.getElementById('viewport').appendChild(renderer.domElement);
	       
	    setupLights();
	    addObjectsToScene();
	    window.addEventListener('resize', onWindowResize, false);
	    
	    document.getElementById("reset").addEventListener('click', function(){location.reload();});
	    document.getElementById("lock1").addEventListener('click', setOnOff);
	    document.getElementById("lock2").addEventListener('click', setOnOff2);
	    requestAnimationFrame( render );
	    document.getElementById("lock2").disabled = true;
	    render();
	}
	function createRotateDisk(){
		const mid_geometry = new THREE.CylinderGeometry( 1.7, 1.7, 0.1, 32 ); 
		const mid_material = new THREE.MeshBasicMaterial( {color: 'blue'} ); 
		const mid_line = new THREE.Mesh( mid_geometry, mid_material ); 
		const rot_geometry = new THREE.CylinderGeometry( 1.6, 1.6, 1, 32 ); 
		const texture = textureloader.load('textures/checkboard.png');
		const rot_material = new THREE.MeshBasicMaterial( {map: texture} ); 
		rotate_disk = new THREE.Mesh( rot_geometry, rot_material ); 
		rotate_disk.add(mid_line);
		rotate_disk.position.set(0, 20, 29);
		rotate_disk.rotation.x = Math.PI/2;
		scene.add(rotate_disk);
	}
	function createRotor(){
		const geometry = new THREE.CylinderGeometry( 2, 2, 4, 32 ); 
		const material = new THREE.MeshBasicMaterial( {color: 'gray'} ); 
		const rotor = new THREE.Mesh( geometry, material ); 
		const pole_geo = new THREE.CylinderGeometry( 0.5, 0.5, 4, 32 ); 
		const pole_material = new THREE.MeshBasicMaterial( {color: 'white'} ); 
		const pole = new THREE.Mesh( pole_geo, pole_material ); 
		rotor.position.set(0,20,25);
		rotor.add(pole);
		pole.position.set(0,2,0);
		rotor.rotation.x = Math.PI/2;
		scene.add( rotor );
	}
	function addHanger(x,y,z){
		const geometry = new THREE.BoxGeometry( 3, 2, 3 ); 
		const material = new THREE.MeshBasicMaterial( {color: 0x0000ff} ); 
		hanger = new THREE.Mesh( geometry, material ); 
		hanger.position.set(x,y,z);
		scene.add( hanger );
	}
	function setupLights() {
	    const light = new THREE.DirectionalLight(0xFFFFFF);
	    light.position.set(10, 40, 20);
	    light.castShadow = true;
	    scene.add(light);
	    
	    const spotlight = new THREE.SpotLight(0xffffff);
	    spotlight.position.set(10, 40, 30);
	    spotlight.castShadow = true;
	    spotlight.lookAt(-30, 10, 0);
	    scene.add(spotlight);
	}	
	function addObjectsToScene() {
	    		addText(-17,18,30,'CAPACITOR - ELECTRIC MOTOR',Math.PI/2);
			addBattery(2);	
			addSphere(-15.5,8,0);
			addSphere(15.5,8,0);
			
			// add blue lines
			addBlue(15.5,8,0, 18,2,0); // right line of capacitor
			var connector = addSphere(18,2,-10);
			var mount = addSphere(18,2,0);
			addSphere(18,2,10);
			addBlue(18,2,10, 18,2,25); // sphere to +Z dir
			addBlue(18,2,25, 10,2,25); // left to motor
			addBlue(10,2,25, 10,20,25); // left up
			addBlue(10,20,25, -10,20,25); // horizontal high
			addBlue(-10,20,25, -10,2,25); // down left
			addBlue(-10,2,25, -18,2,25); // left left
			addBlue(-18,2,25, -18,2,-28); // left line on -Z dir
			addBlue(-18,2,-28, -8,2,-28); // back line on X dir
			addBlue(-8,2,-28, -8,5,-28); // up to battery
			addBlue(-8,5,-28, 8,5,-28); // thru battery
			addBlue(8,5,-28, 8,2,-28); // battery down
			addBlue(8,2,-28, 18,2,-28); // battery go right
			addBlue(18,2,-28, 18,2,-10); // back line to "connector" sphere
			addBlue(-15.5,8,0, -18,2,0); // left line of capacitor
			
			var switchGeom = new THREE.CylinderGeometry( 0.2, 0.2, 10, 32 );
			switchGeom.translate(0, 5, 0);
			lock = new THREE.Mesh(switchGeom, new THREE.MeshLambertMaterial({color: "white"}));
			lock.rotation.x = -Math.PI / 2.3;
			mount.add(lock);

			// create Breadboard:
			var geometry1 = new THREE.BoxGeometry( 40,2,60 ); 
			var mat = new THREE.MeshPhongMaterial({color: 'red'});
			var base = new THREE.Mesh(geometry1, mat);
			
			var surface = new THREE.BoxGeometry( 40,0.2,60 ); 
			var covermesh = new THREE.Mesh(surface, new THREE.MeshBasicMaterial( { color: 'yellow' } ));
			base.add(covermesh);
			covermesh.position.set(0,1.1,0);
			base.position.set(0,0,0);
			scene.add(base);
	
			addTextB(-3,12,0,"Capacitor",0,'red');
			addTextB(-3,8,-28,"Battery",0,'red');
			addTextB(0,21,23,"Motor",Math.PI/2,'red');
			addVacuumTube();
			createHexBoardX(-14,8,0);
			createHexBoardX(14,8,0);
			addHotPlate();
			addHanger(1.6,2,29);
		        hanger_string = addHangerString(1.6, 20, 29, hanger.position.x, hanger.position.y, hanger.position.z);
			createRotor();
			createRotateDisk();
		
	}	
	function onWindowResize() {
	    camera.aspect = window.innerWidth / window.innerHeight;
	    camera.updateProjectionMatrix();
	    renderer.setSize(window.innerWidth, window.innerHeight);
	}
	function getRandomNegativeToPositive(min, max) {
	    return Math.random() * (max - min) + min;
	}
	function spawnSphere(){
		  var ballGeom = new THREE.SphereGeometry(0.3, 32, 24);
		  pos_particle = new THREE.Mesh(ballGeom, new THREE.MeshPhongMaterial({color:"red"}));
		  neg_particle = new THREE.Mesh(ballGeom, new THREE.MeshPhongMaterial({color:"blue"}));
		
		  var random_number1 = 8 + getRandomNegativeToPositive(-3,3);
		  var random_number2 = getRandomNegativeToPositive(-3,3);
		
		  pos_particle.position.set(-9.2, random_number1, random_number2); 
		  neg_particle.position.set(9.2, random_number1, random_number2);
		  particleArray.push(pos_particle);
		  particleArray.push(neg_particle);
		  scene.add(pos_particle);
		  scene.add(neg_particle);
		  return {pos_particle, neg_particle};
	}
	function removeOneParticle() {
	    if (particleArray.length > 0) {
	        const particle = particleArray.pop();
	        scene.remove(particle);
	    }
	}
	function cleanParticles() {
		    particleArray.forEach(element => {
		        scene.remove(element);
		        if (element.geometry) {
		            element.geometry.dispose();
		        }
		        if (element.material) {
		            if (element.material.length) { // in case of multi-materials
		                element.material.forEach(material => material.dispose());
		            } else {
		                element.material.dispose();
		            }
		        }
		        if (element.texture) {
		            element.texture.dispose();
		        }
		    });
		
		    // Clear the array after cleaning up
		    particleArray.length = 0;
	}
	function addVacuumTube(){
		var geometry = new THREE.CylinderGeometry( 5, 5, 30, 32 );
		var  clearMaterial = new THREE.MeshPhongMaterial( {
			color: "#ffffff",    
			side:THREE.DoubleSide,
			transparent:true,
			opacity:0.1
		    });
		tube = new THREE.Mesh(geometry,clearMaterial);
		tube.position.set(0,8,0);
		tube.rotateZ(Math.PI/2);
		scene.add(tube);
	}
	function createHexBoardX(x,y,z,alpha){
		const geometry = new THREE.CylinderGeometry( 6, 6, 3, 8 ); 
		const material = new THREE.MeshBasicMaterial( {color: 0xBCC6CC} ); 
		const cylinder = new THREE.Mesh( geometry, material ); 
		cylinder.rotation.z = Math.PI/2;
		cylinder.position.set(x,y,z);
		scene.add( cylinder );
	}
	function addHotPlate(){
		  var poleGeom = new THREE.CylinderGeometry(0.5, 0.5, 5, 32);
		  var pole1 = new THREE.Mesh(poleGeom, new THREE.MeshBasicMaterial({color:"white"}));
		  var pole2 = new THREE.Mesh(poleGeom, new THREE.MeshBasicMaterial({color:"white"}));
		  pole1.position.set(-12, 8, 0);
		  pole1.rotateZ(Math.PI/2);
		  pole2.position.set(12,8,0);
		  pole2.rotateZ(Math.PI/2);
		  scene.add(pole1);
		  scene.add(pole2);
		  var diskGeom = new THREE.CylinderGeometry(4, 4, 1, 32);
		  var plate1 = new THREE.Mesh(diskGeom, new THREE.MeshBasicMaterial({color:"white"}));
		  var plate2 = new THREE.Mesh(diskGeom, new THREE.MeshBasicMaterial({color:"white"}));
		  plate1.position.set(-10, 8, 0);
		  plate1.rotateZ(Math.PI/2);
		  plate2.position.set(10,8,0);
		  plate2.rotateZ(Math.PI/2);
		  scene.add(plate1);
		  scene.add(plate2);
	}	
	function addBlue(x1,y1,z1,x2,y2,z2){
		var arr = [new THREE.Vector3(x1,y1,z1),
			   new THREE.Vector3(x2,y2,z2)]; 
		var mat = new THREE.MeshLambertMaterial({color: "brown"}); 
		var curve = new THREE.CatmullRomCurve3( arr );
		var geometry = new THREE.TubeGeometry( curve, 100, 0.2, 36, false ); 
		var  str = new THREE.Mesh(geometry, mat);
		scene.add(str);
		return str;
	}	
	function addHangerString(x1,y1,z1,x2,y2,z2){
		var arr = [new THREE.Vector3(x1,y1,z1),
			   new THREE.Vector3(x2,y2,z2)]; 
		var mat = new THREE.MeshLambertMaterial({color: "blue"}); 
		var curve = new THREE.CatmullRomCurve3( arr );
		var geometry = new THREE.TubeGeometry( curve, 100, 0.1, 36, false ); 
		var  str = new THREE.Mesh(geometry, mat);
		scene.add(str);
		return str;
	}
	function setOn(){
		lock.rotation.x = -Math.PI/2;
	}
	function setOff(){
		lock.rotation.x = -Math.PI/2.3;
	}
	function setOnOff(){
		onoff = !onoff;
		if (onoff) {setOn()} else {setOff()};
	}
	function setOnOff2(){
		onoff2 = !onoff2;
		if (onoff2) {setOn2()} else {setOff2()};
	}
	function setOn2(){
		lock.rotation.x = Math.PI/2;
	}
	function setOff2(){
		lock.rotation.x = -Math.PI/2.3;
	}
	function addSphere(x, y, z){
		  var ballGeom = new THREE.SphereGeometry(0.5, 32, 24);
		  var ball = new THREE.Mesh(ballGeom, new THREE.MeshPhongMaterial({color:"white"}));
		  ball.position.set(x, y, z);
		  scene.add(ball);
		  return ball;
	}
	function addBattery(r){
		var L = 4*r;
		var texture = textureloader.load( '../textures/battery_texture.png' );
		var bat_material = new THREE.MeshBasicMaterial( { map: texture } );
		var bat_geometry = new THREE.CylinderGeometry( r, r, L, 32 );
		var top_geometry = new THREE.CylinderGeometry( r+0.1, r+0.1, L/4, 32 );
		var top = new THREE.Mesh( top_geometry, new THREE.MeshBasicMaterial({color: 'orange'}) );
		battery = new THREE.Mesh( bat_geometry, bat_material );
		battery.position.set(0,5,-28);
		battery.add(top);
		top.position.set(0,1.8*r,0);
		var geometry = new THREE.CylinderGeometry( r/4, r/4, r/4, 32 );
		var material = new THREE.MeshBasicMaterial( {color: 0xff0000} );
		var cap = new THREE.Mesh( geometry, material );
		cap.position.set(0,2.4*r,0);
		battery.add( cap );
		battery.rotateZ(Math.PI/2);
		scene.add( battery );
	}
	function addText(x,y,z,t,alpha){
		fontloader.load( '/api/program-assets/3jcn-phyc240-capacitor-motor/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json', function ( tex ) {
			var  textGeo = new TextGeometry(t, {
			    size: 3,  
			    height: 0.2, 
			    curveSegments: 6,
			    font: tex,
		        }); 
	
		    	var  textMaterial = new THREE.MeshBasicMaterial({color: "green"});  
		    	var textMesh = new THREE.Mesh(textGeo , textMaterial);
		    	textMesh.position.set(x,y,z);
		    	textMesh.rotateY(alpha);
		    	scene.add(textMesh);
		});
	}
	function addTextB(x, y, z, t, alpha, color) {
	    return new Promise((resolve, reject) => {
	        fontloader.load('/api/program-assets/3jcn-phyc240-capacitor-motor/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json', function (tex) {
	            var textGeo = new TextGeometry(t, {
	                size: 1.5,
	                height: 0.2,
	                curveSegments: 3,
	                font: tex,
	            });
	
	            var textMaterial = new THREE.MeshBasicMaterial({ color: color });
	            var textMesh = new THREE.Mesh(textGeo, textMaterial);
	            textMesh.position.set(x, y, z);
	            textMesh.rotateY(alpha);
	            textArray.push(textMesh);
	            scene.add(textMesh);
	            resolve(textMesh); // Resolve the promise with the created text mesh
	        }, undefined, function (error) {
	            reject(error); // Reject the promise in case of an error
	        });
	    });
	}	
	function addArrow(x,y,z, length, xo,yo,zo){
		var dir = new THREE.Vector3( x, y, z );
		dir.normalize();
		var origin = new THREE.Vector3(xo,yo,zo);   
		var hex = 0xff0000;
		var arrow = new THREE.ArrowHelper( dir, origin, length, hex, 0.4, 0.3 );
		arrow.scale.set(2,2,2);
		scene.add( arrow );
		arrowArray.push(arrow);
	}
	function cleanArrow() {
		    while (arrowArray.length) {
		        const arrow = arrowArray.pop();
		        scene.remove(arrow);
		    }
		    renderer.renderLists.dispose(); // Clear internal caches
	}	
	const render = () => {
		    if (!is_stop) {
		        if (onoff) {
		            if (step == 0) {
		                addTextB(-15, 12, -28, "Start charging capacitor", 0, 'black').then(mesh => {
		                    text1 = mesh;
		                }).catch(error => {
		                    console.error("Error loading text1:", error);
		                });
		                addArrow(-1, 0, 0, 2, 15, 2, -27);
		                addArrow(-1, 0, 0, 2, -15, 2, -27);
		                addArrow(0, 0, -1, 2, 16, 2, -15);
		                addArrow(1, 0, 0, 2, -5, 8, 0);
		            }
		            if (step % speed === 0) {
		                if (count_particles < 20) {
		                    spawnSphere();
		                    count_particles++;
		                } else {	
			    	    onoff = false;
				    is_endCharging = true;
		                    if (text1) {
		                        scene.remove(text1);
		                        text1 = null; // Clear the reference after removal
		                    }
		                    cleanArrow();
				    if(is_endCharging){
			                    addTextB(-15, 12, -28, "Finish charging capacitor", 0, 'black').then(mesh => {
			                        text2 = mesh;
			                    }).catch(error => {
			                        console.error("Error loading text2:", error);
			                    });
					    is_endCharging = false;
				    }
		                    document.getElementById("lock2").disabled = false;
		                    document.getElementById("lock1").disabled = true;
		                }
		            }
		            step++;
		      }
			    
		        if (onoff2 && !is_stop) {
		            if (text2) {
		                scene.remove(text2);
		                text2 = null; // Clear the reference after removal
		            }
			    if(is_one==1){
				    addTextB(-15, 12, -28, "Start running motor", 0, 'black').then(mesh => {
					text3 = mesh;
				    }).catch(error => {
					console.error("Error loading text3:", error);
				    });
				    is_one = 2;
			    }
		            let time = performance.now();
		            let deltaTime = time - lastRemovalTime;
		            if (hanger.position.y < 15) {
		                scene.remove(hanger);
		                scene.remove(hanger_string);
		                hanger.position.y += increment;
		                addHanger(1.6, hanger.position.y, 29);
		                hanger_string = addHangerString(1.6, 20, 29,
		                    hanger.position.x, hanger.position.y, hanger.position.z);
				rotate_disk.rotation.y += 0.01;
		            }
		            if (deltaTime >= 150) {
		                removeOneParticle();
		                lastRemovalTime = time; // Update the last removal time
		            }
		            if (particleArray.length === 0) {
		                if (text3) {
		                    scene.remove(text3);
		                    text3 = null; // Clear the reference after removal
		                }
		                addTextB(-15, 12, -28, "Capacitor ran out of energy", 0, 'black').then(mesh => {
		                    text4 = mesh;
		                }).catch(error => {
		                    console.error("Error loading text4:", error);
		                });
		                is_stop = true;
			        onoff2 = false;
		                document.getElementById("lock2").disabled = true;
		                document.getElementById("lock1").disabled = true;
		            }
		        } // end of if(onoff2)
		    } // end of if(!is_stop)
		
		    controls.update();
		    requestAnimationFrame(render);
		    renderer.render(scene, camera);
	};
    
	window.onload = initScene;	
</script>
  
</head>
  
<body>
	<div id="info" style="text-align: left"> 
		Similar to batteries, capacitors store energy that powers an electric motor, which is used to lift a small weight.<br>
		<button class="btn btn-success" id="lock1">Start Charnging Capacitor</button><br>
		<button class="btn btn-primary" id="lock2">Start Motor</button>
		<button class="btn btn-danger" id="reset">Reset</button>
	</div>
	<div id="viewport"></div>
</body>
</html>
