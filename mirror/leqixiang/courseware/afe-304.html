<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>波的叠加实验 — 高二选择性必修第一册</title>
<style>
  :root {
    --bg-deep: #060d1a;
    --bg-panel: rgba(10, 22, 40, 0.75);
    --bg-panel-hover: rgba(14, 30, 55, 0.85);
    --border-glass: rgba(100, 160, 220, 0.25);
    --text-primary: #d8e8f8;
    --text-secondary: #8ab4d8;
    --text-accent: #60c0f0;
    --crest: #a8ddf0;
    --trough: #0a2040;
    --color-s1: #4da6ff;
    --color-s2: #50e890;
    --color-sum: #ff7755;
    --color-constructive: #ffcc44;
    --color-destructive: #6666cc;
    --radius-panel: 14px;
    --blur-glass: 18px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: radial-gradient(ellipse at 50% 0%, #0d2840 0%, #060d1a 55%, #030a14 100%);
    color: var(--text-primary);
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 12px 10px 30px;
  }

  .main-container {
    width: 100%;
    max-width: 1260px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  /* ---- header ---- */
  .header {
    text-align: center;
    padding: 10px 0 2px;
  }
  .header h1 {
    font-size: 1.7rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    background: linear-gradient(135deg, #b8ddf8 0%, #60b0e8 50%, #90d0f8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .subtitle {
    font-size: 0.85rem;
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* ---- glass panel ---- */
  .glass {
    background: var(--bg-panel);
    backdrop-filter: blur(var(--blur-glass));
    -webkit-backdrop-filter: blur(var(--blur-glass));
    border: 1px solid var(--border-glass);
    border-radius: var(--radius-panel);
    padding: 14px 16px;
    box-shadow: 0 6px 28px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.04);
  }

  /* ---- canvas row ---- */
  .canvas-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .canvas-wrap {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .canvas-wrap .canvas-label {
    font-size: 0.82rem;
    color: var(--text-secondary);
    margin-bottom: 6px;
    letter-spacing: 0.03em;
  }
  .canvas-wrap canvas {
    display: block;
    border-radius: 10px;
    border: 1px solid rgba(80,140,200,0.2);
    cursor: crosshair;
    max-width: 100%;
  }

  /* ---- info strip ---- */
  .info-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    align-items: center;
    font-size: 0.88rem;
  }
  .info-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .info-item .label { color: var(--text-secondary); }
  .info-item .value {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    font-family: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }
  .badge {
    display: inline-block;
    padding: 3px 12px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.04em;
  }
  .badge-constructive {
    background: rgba(255,200,50,0.18);
    color: #ffc830;
    border: 1px solid rgba(255,200,50,0.35);
  }
  .badge-destructive {
    background: rgba(120,100,220,0.18);
    color: #a8a0f0;
    border: 1px solid rgba(120,100,220,0.35);
  }
  .badge-neutral {
    background: rgba(150,150,170,0.12);
    color: #999;
    border: 1px solid rgba(150,150,170,0.2);
  }

  /* ---- controls ---- */
  .controls-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px,1fr));
    gap: 12px;
  }
  .control-group { display: flex; flex-direction: column; gap: 4px; }
  .control-group label {
    font-size: 0.8rem;
    color: var(--text-secondary);
    display: flex; justify-content: space-between;
  }
  .control-group label span.val { color: var(--text-accent); font-weight: 600; }
  input[type="range"] {
    -webkit-appearance: none;
    width: 100%; height: 6px;
    border-radius: 3px;
    background: rgba(80,150,210,0.2);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #60b0e8;
    cursor: pointer;
    border: 2px solid #d0e8f8;
    box-shadow: 0 0 10px rgba(80,160,220,0.5);
  }

  .btn-row {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .btn {
    padding: 8px 18px;
    border-radius: 22px;
    border: 1px solid var(--border-glass);
    background: rgba(20,50,80,0.5);
    color: var(--text-primary);
    cursor: pointer;
    font-size: 0.84rem;
    font-weight: 500;
    letter-spacing: 0.03em;
    transition: all 0.2s;
    backdrop-filter: blur(6px);
    white-space: nowrap;
  }
  .btn:hover { background: rgba(30,70,110,0.65); border-color: rgba(120,180,230,0.5); }
  .btn.active {
    background: rgba(40,100,180,0.55);
    border-color: rgba(100,180,240,0.7);
    box-shadow: 0 0 12px rgba(60,140,220,0.3);
    color: #fff;
  }
  .btn.accent {
    background: rgba(220,140,30,0.25);
    border-color: rgba(240,180,50,0.45);
    color: #ffc840;
  }
  .btn.accent:hover { background: rgba(240,160,40,0.35); }

  /* ---- task mode ---- */
  .task-panel { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .task-score { font-size: 1.1rem; font-weight: 700; color: #ffc830; }
  .task-feedback { font-size: 0.9rem; }

  /* ---- quiz ---- */
  .quiz-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px,1fr)); gap: 10px; }
  .quiz-card {
    background: rgba(10,22,44,0.7);
    border: 1px solid rgba(50,100,150,0.2);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .quiz-card .q-title { font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
  .quiz-card .q-options { display: flex; flex-wrap: wrap; gap: 6px; }
  .quiz-card .q-opt {
    padding: 5px 14px;
    border-radius: 16px;
    border: 1px solid rgba(80,140,200,0.25);
    background: rgba(15,30,50,0.5);
    cursor: pointer;
    font-size: 0.82rem;
    transition: all 0.18s;
    color: var(--text-primary);
  }
  .quiz-card .q-opt:hover { background: rgba(25,50,80,0.55); }
  .quiz-card .q-opt.chosen { border-color: rgba(100,180,240,0.6); }
  .quiz-card .q-opt.correct { background: rgba(40,160,80,0.3); border-color: rgba(80,200,100,0.6); color: #a0f0b0; }
  .quiz-card .q-opt.wrong { background: rgba(200,50,50,0.25); border-color: rgba(220,80,80,0.5); color: #f0a0a0; }
  .quiz-card .q-result { margin-top: 6px; font-size: 0.8rem; min-height: 1.2em; }

  .reset-quiz-btn { font-size: 0.8rem; padding: 4px 12px; }

  /* ---- responsive ---- */
  @media (max-width: 820px) {
    .canvas-row { grid-template-columns: 1fr; }
    .header h1 { font-size: 1.35rem; }
    .controls-grid { grid-template-columns: 1fr 1fr; }
    .quiz-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 500px) {
    .controls-grid { grid-template-columns: 1fr; }
    .canvas-wrap canvas { width: 100% !important; height: auto !important; }
  }
</style>
</head>

<div class="main-container">

  <!-- header -->
  <div class="header">
    <h1>波的叠加实验</h1>
    <div class="subtitle">高二物理 · 选择性必修第一册 · 水波干涉</div>
  </div>

  <!-- canvas row -->
  <div class="canvas-row">
    <div class="canvas-wrap glass">
      <div class="canvas-label">俯视图 — 两列水波干涉图样（拖拽 P 点观察）</div>
      <canvas id="cvTop" width="580" height="440"></canvas>
    </div>
    <div class="canvas-wrap glass">
      <div class="canvas-label">侧视图 — P 点处振动曲线 y₁(t)、y₂(t)、y<sub>合</sub>(t)</div>
      <canvas id="cvSide" width="580" height="310"></canvas>
    </div>
  </div>

  <!-- info strip -->
  <div class="glass info-strip" id="infoStrip">
    <div class="info-item"><span class="label">波程差 Δ = |S₁P − S₂P| =</span> <span class="value" id="valDelta">--</span></div>
    <div class="info-item"><span class="label">Δ / λ =</span> <span class="value" id="valDeltaOverLambda">--</span></div>
    <div class="info-item"><span class="label">相位差 φ = 2πΔ/λ =</span> <span class="value" id="valPhi">--</span></div>
    <div class="info-item" id="badgeWrap"><span class="badge badge-neutral" id="badgeInterference">--</span></div>
  </div>

  <!-- controls -->
  <div class="glass">
    <div class="controls-grid">
      <div class="control-group">
        <label>波长 λ <span class="val" id="lblLambda">1.50 m</span></label>
        <input type="range" id="sldLambda" min="0.5" max="3.0" step="0.05" value="1.5">
      </div>
      <div class="control-group">
        <label>波源间距 d <span class="val" id="lblD">3.00 m</span></label>
        <input type="range" id="sldD" min="0.8" max="6.0" step="0.05" value="3.0">
      </div>
      <div class="control-group">
        <label>波速 v <span class="val" id="lblV">1.00 m/s</span></label>
        <input type="range" id="sldV" min="0.3" max="3.0" step="0.05" value="1.0">
      </div>
      <div class="control-group">
        <label>P 点横坐标 x<sub>P</sub> <span class="val" id="lblPx">0.00 m</span></label>
        <input type="range" id="sldPx" min="-4.5" max="4.5" step="0.02" value="0">
      </div>
      <div class="control-group">
        <label>P 点纵坐标 y<sub>P</sub> <span class="val" id="lblPy">2.50 m</span></label>
        <input type="range" id="sldPy" min="-3.5" max="3.5" step="0.02" value="2.5">
      </div>
      <div class="control-group">
        <label>波源相位</label>
        <div class="btn-row" style="margin-top:2px">
          <button class="btn active" id="btnPhaseIn" data-phase="0">同相 (φ₀₁=φ₀₂)</button>
          <button class="btn" id="btnPhaseAnti" data-phase="pi">反相 (差 π)</button>
        </div>
      </div>
    </div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn active" id="btnPlay">▶ 播放</button>
      <button class="btn" id="btnPause">⏸ 暂停</button>
      <button class="btn" id="btnFreeze">🧊 冻结此刻</button>
      <button class="btn" id="btnReset">↺ 重置</button>
    </div>
  </div>

  <!-- task mode -->
  <div class="glass task-panel" id="taskPanel">
    <span style="font-weight:600;">🎯 探索任务：</span>
    <button class="btn" id="btnTaskConstructive">找加强点</button>
    <button class="btn" id="btnTaskDestructive">找减弱点</button>
    <button class="btn" id="btnTaskOff" style="display:none;">退出任务</button>
    <span class="task-score" id="taskScore" style="display:none;">找到: 0</span>
    <span class="task-feedback" id="taskFeedback"></span>
  </div>

  <!-- quiz -->
  <div class="glass">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-weight:600;font-size:0.95rem;">📝 学习检测（5 题）</span>
      <button class="btn reset-quiz-btn" id="btnResetQuiz">重新作答</button>
    </div>
    <div class="quiz-grid" id="quizGrid"></div>
    <div style="margin-top:8px;font-size:0.85rem;color:var(--text-secondary);text-align:center;" id="quizSummary"></div>
  </div>

</div>
