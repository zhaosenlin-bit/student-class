<!DOCTYPE html>
<html lang="zh">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>课堂管理 · 抽签小组</title>
    <style>
        /* ---------- 全局重置 & 字体 ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: '华文楷体', 'KaiTi', 'PingFang SC', 'Microsoft YaHei', serif;
            background: #f4efe6;
            font-weight: 400;
        }

        /* ---------- 全屏画面 ---------- */
        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4vw 6vw;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0s 0.5s;
            background: #f9f3ea;
            box-shadow: inset 0 0 0 6px #dac09a;
            z-index: 0;
            overflow-y: auto;
        }

        .screen.active {
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease, visibility 0s 0s;
            z-index: 10;
        }

        .screen::-webkit-scrollbar { width: 6px; }
        .screen::-webkit-scrollbar-track { background: #ede3d3; border-radius: 10px; }
        .screen::-webkit-scrollbar-thumb { background: #b3926c; border-radius: 10px; }

        .slide-content {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 1.5rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        h1, h2, h3 {
            font-family: '华文楷体', 'KaiTi', serif;
            font-weight: 500;
            color: #3e2c1a;
            text-shadow: 0 2px 6px rgba(150, 100, 50, 0.1);
        }

        h1 {
            font-size: clamp(2.8rem, 8vw, 5.5rem);
            letter-spacing: 0.1em;
            border-bottom: 3px double #c6a882;
            padding-bottom: 0.2em;
            margin-bottom: 0.5rem;
        }

        h2 {
            font-size: clamp(2rem, 6vw, 3.6rem);
            border-left: 10px solid #b3926c;
            padding-left: 0.6em;
        }

        /* ---------- 抽签专用样式 ---------- */
        .draw-card {
            background: #fcf6eb;
            border-radius: 60px;
            padding: 2rem 3rem;
            box-shadow: 0 8px 0 #b3926c, 0 12px 30px rgba(120, 80, 40, 0.15);
            border: 2px solid #e2d0b6;
            width: 100%;
            max-width: 750px;
            margin: 1rem 0;
        }

        .draw-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .name-pool {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.6rem 1rem;
            background: #ede3d3;
            padding: 1rem 1.5rem;
            border-radius: 60px;
            min-height: 4rem;
            width: 100%;
        }

        .name-tag {
            background: #fffcf5;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            font-size: clamp(1.2rem, 2.8vw, 1.8rem);
            box-shadow: inset 0 0 0 2px #dac09a;
            color: #3e2c1a;
            transition: all 0.2s;
        }

        .name-tag.selected {
            background: #b3926c;
            color: #fcf6eb;
            box-shadow: 0 0 0 4px #f3e1c2;
            transform: scale(1.05);
        }

        .result-box {
            background: #3e2c1a;
            color: #f9efdd;
            padding: 0.6rem 2rem;
            border-radius: 80px;
            font-size: clamp(2rem, 6vw, 3.6rem);
            font-weight: 500;
            min-height: 5rem;
            min-width: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 #1f140a, 0 6px 20px rgba(0,0,0,0.3);
            letter-spacing: 0.08em;
            transition: background 0.2s;
        }

        .draw-btn-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1rem;
        }

        .nav-btn {
            font-family: '华文楷体', 'KaiTi', serif;
            font-weight: 500;
            font-size: clamp(1.4rem, 3vw, 2.2rem);
            background: #dac09a;
            color: #2f1f0e;
            border: none;
            border-radius: 60px;
            padding: 0.4em 1.8em;
            box-shadow: 0 6px 0 #a88762;
            cursor: pointer;
            transition: all 0.08s linear;
            margin: 0.5rem 0.3rem;
            letter-spacing: 0.04em;
        }

        .nav-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #a88762;
        }

        .nav-btn-outline {
            background: transparent;
            border: 3px solid #b3926c;
            box-shadow: 0 6px 0 #b3926c;
            color: #3e2c1a;
        }

        .nav-btn-small {
            font-size: clamp(1rem, 2.2vw, 1.6rem);
            padding: 0.3em 1.2em;
        }

        .flex-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1rem 1.8rem;
        }

        .page-indicator {
            font-size: clamp(1rem, 2.4vw, 1.6rem);
            background: #ede3d3;
            padding: 0.2em 1.2em;
            border-radius: 60px;
            color: #4d351b;
            box-shadow: inset 0 0 0 2px #dac09a;
        }

        .text-block {
            background: rgba(255, 248, 238, 0.7);
            backdrop-filter: blur(2px);
            padding: 1.2rem 2rem;
            border-radius: 40px;
            box-shadow: 0 6px 0 #dac09a, 0 6px 20px rgba(160, 120, 70, 0.1);
            max-width: 90%;
            line-height: 1.6;
            font-size: clamp(1rem, 2.8vw, 1.6rem);
            color: #2f2012;
        }

        .card {
            background: #fcf6eb;
            border-radius: 40px;
            padding: 1.2rem 1.8rem;
            box-shadow: 0 6px 0 #c6a882, 0 6px 16px rgba(140, 100, 60, 0.1);
            border: 2px solid #e2d0b6;
        }

        .separator {
            width: 80px;
            height: 3px;
            background: #c6a882;
            margin: 0.6rem 0;
            border-radius: 10px;
        }

        /* 小组结果额外样式 */
        .group-result {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.8rem 1.2rem;
        }
        .group-member {
            background: #2c5f2d;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            box-shadow: inset 0 0 0 2px #dac09a;
        }

        @media (max-width: 700px) {
            .draw-card {
                padding: 1.2rem 1rem;
            }
            .name-pool {
                padding: 0.8rem;
            }
        }
    </style>
</head>

    <!-- 幻灯片容器                                                 -->
    <!-- 第1页：封面 + 抽签面板 (含滚动动画 + 连抽多人)             -->
    <!-- 第2页：名单管理                                            -->
    <!-- ============================================================ -->

    <!-- 第1页 · 封面 + 抽签 -->
    <div id="slide-1" class="screen active">
        <div class="slide-content" style="text-align:center;">
            <div style="display:flex; align-items:center; gap:0.5rem 1.5rem; flex-wrap:wrap; justify-content:center;">
                <span style="font-size:clamp(2.5rem,8vw,5rem);">🎲</span>
                <h1 style="font-size:clamp(2.8rem,8vw,5rem); margin:0;">课堂抽签</h1>
            </div>
            <div class="subtitle" style="font-size:clamp(1.2rem,3vw,2rem); background:#ede3d3; padding:0.2em 1.5em; border-radius:60px; display:inline-block; margin:0.3rem 0;">
                公平 · 紧张 · 小组合作
            </div>
            <div class="separator" style="width:120px;"></div>

            <!-- 抽签核心区域 -->
            <div class="draw-card">
                <div class="draw-area">
                    <!-- 名单池 -->
                    <div style="width:100%; text-align:left; font-size:clamp(0.9rem,2vw,1.3rem); color:#5a3f24; margin-bottom:0.2rem;">👥 今日学生</div>
                    <div class="name-pool" id="namePool">
                        <!-- 由 js 动态渲染 -->
                    </div>

                    <!-- 抽中结果 (支持单人和小组) -->
                    <div class="result-box" id="resultDisplay">
                        <span id="resultText">🎯 就你了</span>
                    </div>

                    <!-- 操作按钮组 -->
                    <div class="draw-btn-group">
                        <button class="nav-btn" id="drawOnceBtn">🎲 抽一人</button>
                        <button class="nav-btn nav-btn-outline nav-btn-small" id="drawGroup2Btn">👥 连抽2人</button>
                        <button class="nav-btn nav-btn-outline nav-btn-small" id="drawGroup3Btn">👥 连抽3人</button>
                        <button class="nav-btn nav-btn-outline nav-btn-small" id="resetDrawBtn">🔄 重置</button>
                        <button class="nav-btn nav-btn-outline nav-btn-small" id="manageListBtn">✏️ 编辑名单</button>
                    </div>
                    <div style="font-size:clamp(0.8rem,1.8vw,1.2rem); color:#7a5f3e; margin-top:0.2rem;">
                        <span id="remainCount">剩余 0 人</span>  ·  已抽 <span id="drawnCount">0</span> 人
                    </div>
                </div>
            </div>

            <!-- 底部导航 -->
            <div class="flex-row" style="margin-top:0.8rem;">
                <button class="nav-btn nav-btn-outline nav-btn-small" onclick="goSlide(2)">📋 名单管理</button>
                <span class="page-indicator">1 / 2</span>
            </div>
        </div>
    </div>

    <!-- 第2页 · 名单管理/说明 -->
    <div id="slide-2" class="screen">
        <div class="slide-content">
            <h2>📝 班级名单管理</h2>
            <div class="grid-2col" style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; width:100%; max-width:1000px; margin:0.8rem 0;">
                <div class="card" style="grid-column: span 1;">
                    <h3>✏️ 编辑名单</h3>
                    <p style="font-size:clamp(0.9rem,2.2vw,1.3rem);">每行一个姓名，保存后自动更新抽签池。</p>
                    <textarea id="nameListEditor" rows="6" style="width:100%; border-radius:30px; border:3px solid #dac09a; padding:0.8rem 1.2rem; font-size:1.2rem; font-family: '华文楷体','KaiTi',serif; background:#fcf6eb; resize:vertical;"></textarea>
                    <div style="display:flex; gap:0.8rem; margin-top:0.6rem; flex-wrap:wrap;">
                        <button class="nav-btn nav-btn-small" id="saveListBtn">💾 保存名单</button>
                        <button class="nav-btn nav-btn-outline nav-btn-small" id="resetDefaultBtn">↩️ 恢复默认</button>
                    </div>
                </div>
                <div class="card" style="grid-column: span 1;">
                    <h3>📌 使用说明</h3>
                    <ul style="font-size:clamp(0.9rem,2.2vw,1.3rem); padding-left:1.2rem;">
                        <li>点击「抽一人」随机抽取未抽学生 (带滚动动画)。</li>
                        <li>「连抽2人」「连抽3人」组成小组，一次性抽取。</li>
                        <li>已抽学生高亮显示，不会重复抽取。</li>
                        <li>「重置」清空抽取记录。</li>
                        <li>编辑名单后自动保存至本地。</li>
                        <li>默认名单：朱自清、胡适、鲁迅、老舍、冰心、巴金、沈从文、林徽因</li>
                    </ul>
                </div>
            </div>
            <div class="flex-row" style="margin-top:0.4rem;">
                <button class="nav-btn" onclick="goSlide(1)">⬅ 返回抽签</button>
                <span class="page-indicator">2 / 2</span>
            </div>
        </div>
    </div>
