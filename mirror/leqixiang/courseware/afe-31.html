<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>智慧贪吃蛇 | 因数倍数大冒险 | 小组竞赛 | 数学课堂</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            touch-action: manipulation;
        }
        /* 浅绿色背景，符合小学生审美 */
        body {
            background: linear-gradient(145deg, #c8e6d9 0%, #b0d9b1 100%);
            font-family: 'Comic Neue', 'Comic Neue', 'Chalkboard SE', 'Segoe UI Emoji', 'PingFang SC', cursive, sans-serif;
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            color: #1f3a3f;
        }
        .game-container {
            max-width: 1500px;
            margin: 0 auto;
            background: rgba(255, 251, 220, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 72px;
            padding: 20px 24px 30px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            border: 3px solid #b5e3a1;
        }
        /* 小组栏 */
        .groups-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 20px;
        }
        .group-card {
            flex: 1;
            background: #ffffdd;
            border-radius: 60px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            border: 3px solid #8fc93a;
            box-shadow: 0 6px 0 #6a9c2a;
            transition: 0.05s linear;
        }
        .group-card.active-group {
            background: #ffb347;
            border-color: #ffdd88;
            transform: scale(1.02);
            box-shadow: 0 0 0 3px gold;
        }
        .group-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #b5d8a1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            font-size: 2rem;
        }
        .group-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .group-info {
            font-weight: bold;
            font-size: 1.2rem;
        }
        .group-score {
            font-size: 1.3rem;
            color: #c44f00;
        }
        /* 游戏区 */
        .game-area {
            background: #f9f3cf;
            border-radius: 64px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 0 3px #e2f0cf, 0 8px 18px rgba(0,0,0,0.1);
        }
        .task-bar {
            display: flex;
            justify-content: space-between;
            font-size: 1.5rem;
            background: #e6f3d2;
            padding: 12px 24px;
            border-radius: 60px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        canvas {
            background-color: #3e6b47;
            border-radius: 40px;
            width: 100%;
            height: auto;
            display: block;
            margin: 0 auto;
            box-shadow: 0 12px 25px rgba(0,0,0,0.3);
            cursor: pointer;
        }
        .status {
            display: flex;
            justify-content: space-between;
            background: #eaf5dc;
            margin-top: 16px;
            padding: 12px 20px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        /* 超大虚拟方向键 + 其他按钮 */
        .bottom-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }
        .big-dpad {
            background: rgba(100, 80, 40, 0.25);
            backdrop-filter: blur(12px);
            border-radius: 120px;
            padding: 15px 25px;
            display: inline-flex;
            gap: 30px;
            justify-content: center;
        }
        .big-dpad-btn {
            width: 100px;
            height: 100px;
            background: #f0b27a;
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            font-weight: bold;
            color: #2c1e0f;
            cursor: pointer;
            box-shadow: 0 8px 0 #9b5e2c;
            transition: 0.05s linear;
            touch-action: manipulation;
        }
        .big-dpad-btn:active {
            transform: scale(0.94);
            box-shadow: none;
        }
        .action-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .action-btn {
            background: #6cac93;
            border: none;
            color: white;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #3f6b58;
        }
        .modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: #fdffdb;
            max-width: 90vw;
            width: 750px;
            border-radius: 64px;
            padding: 24px;
            color: #2c3a2b;
            border: 4px solid #aad66e;
        }
        .student-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 15px 0;
        }
        .student-item {
            background: #fee3b5;
            border-radius: 60px;
            padding: 6px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast {
            position: fixed;
            bottom: 30%;
            left: 50%;
            transform: translateX(-50%);
            background: #ffdd88;
            color: #3b2a1f;
            padding: 14px 28px;
            border-radius: 60px;
            font-weight: bold;
            z-index: 1100;
            animation: fadeOut 1s forwards;
            font-size: 1.3rem;
        }
        @keyframes fadeOut {
            0% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        @media (max-width: 780px) {
            .big-dpad-btn { width: 70px; height: 70px; font-size: 2.5rem; }
            .group-avatar { width: 45px; height: 45px; }
        }
    </style>
</head>
