	function createRedArrow(position = { x: 0, y: 0, z: 0 }, length = 20, shaftRadius = 0.5, headLength = 5, headRadius = 1) {
	    const arrowGroup = new THREE.Group();
	
	    // Shaft (cylinder)
	    const shaftLength = length - headLength;
	    const shaftGeometry = new THREE.CylinderGeometry(shaftRadius, shaftRadius, shaftLength, 32);
	    const shaftMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
	    const shaft = new THREE.Mesh(shaftGeometry, shaftMaterial);
	
	    // Rotate and position shaft horizontally (X-axis)
	    shaft.rotation.z = Math.PI / 2;
	    shaft.position.x = shaftLength / 2;
	    arrowGroup.add(shaft);
	
	    // Head (cone)
	    const coneGeometry = new THREE.ConeGeometry(headRadius, headLength, 32);
	    const coneMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
	    const head = new THREE.Mesh(coneGeometry, coneMaterial);
	
	    // Rotate and position head at the tip
	    head.rotation.z = -Math.PI / 2;
	    head.position.x = shaftLength + headLength / 2;
	    arrowGroup.add(head);
	
	    // Final arrow group position
	    arrowGroup.position.set(position.x, position.y, position.z);
	
	    return arrowGroup;
	}

		var geometry = new THREE.TubeGeometry( curve, 100, 0.08, 36, false ); 
		var  str = new THREE.Mesh(geometry, mat);
		scene.add(str);
	}
