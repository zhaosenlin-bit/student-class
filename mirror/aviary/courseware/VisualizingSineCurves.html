	<script>


function initialize(){
	frequencyofwheel = Math.random()*.7+.01;
	frequencyofwheel = 0.1;

	speed = 360/50*frequencyofwheel;
	StartAngle = Math.random()*360+0;
	StartAngle = 0;
	Angle = StartAngle;
	heightofcenter = Math.random()*40+0;
	heightofcenter = 40;
	yo = 580-heightofcenter*10;
	xo = 450;
	radiusofwheel = Math.random()*15+10;
	radiusofwheel = 20;
	ArrowLength = radiusofwheel*10;
	timeinms = 0;
	count = 0;	
	
	
	
	theCanvas = document.getElementById("CanvasOne");
	ctx = theCanvas.getContext("2d");	
	
	twoCanvas = document.getElementById("CanvasTwo");
	ctx2 = twoCanvas.getContext("2d");	
	drawingpart();
	document.getElementById("PauseButton").style.visibility = "hidden";
	document.getElementById("ResumeButton").style.visibility = "visible";
}



function drawingpart(){
	
	/* 	background drawing */
	ctx.fillStyle="#00CC00";
	ctx.fillRect(0,550,900,50);
	
	grd=ctx.createLinearGradient(0,0,0,550);
	grd.addColorStop(0,'#00CCCC');
	grd.addColorStop(1,'#FFCC99');
	ctx.fillStyle=grd;
	ctx.fillRect(0,0,900,550);
	
	ctx.fillStyle="#000000";
	ctx.fillRect(170,565,560,25);

	/* Grid */
	ctx.strokeStyle = '#000000';
	ctx.lineWidth = 1;
	
	ctx.font="14px Arial";
	ctx.fillStyle="#990000";
	for(i=0; i<5;i++){
		ctx.beginPath();
		ctx.moveTo(150, 100*i+80);
		ctx.lineTo(750, 100*i+80);
		ctx.stroke();
		ctx.closePath();
		yvalue = 50 - i*10;
		ctx.fillText(yvalue,130, 100*i+85);
	}
	
	ctx.fillText("height (m)",100, 50);
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.moveTo(450, 50);
	ctx.lineTo(450, 550);
	ctx.stroke();
	ctx.closePath();
	
	ctx.beginPath();
	ctx.moveTo(200, 550);
	ctx.lineTo(700, 550);
	ctx.stroke();
	ctx.closePath();
	for (i = 0; i < 6; i++){
		AngleInRadians = ((Angle+60*i)/180)*Math.PI;
		x1= ArrowLength*Math.cos(AngleInRadians) + xo;
		y1= -ArrowLength*Math.sin(AngleInRadians) + yo;	
		y2 = -ArrowLength*Math.sin(AngleInRadians)*.5 +200;
		DrawCar(x1, y1, i);
		DrawLine(x1, y1, i);
	}
	
	
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.arc(xo, yo, 20, 0, 2*Math.PI, true);
	ctx.strokeStyle = '#CCCCCC';
	ctx.fillStyle = '#CCCCCC';
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.arc(xo, yo, ArrowLength, 0, 2*Math.PI, true);
	ctx.strokeStyle = '#CCCCCC';
	ctx.stroke();
	ctx.closePath();
	
	ctx.lineWidth = 10;
	ctx.beginPath();
	ctx.moveTo(xo,yo);
	ctx.lineTo(xo-300, 580);
	ctx.strokeStyle = '#CCCCCC';
	ctx.stroke();
	ctx.closePath();
	ctx.beginPath();
	ctx.moveTo(xo,yo);
	ctx.lineTo(xo+300, 580);
	ctx.stroke();
	ctx.closePath();

	Angle = Angle + speed;
	
	
	
	

	ctx.fillStyle="#00CC00";
	ctx.fillRect(0,585,900,50);
	
	
	/* 	background drawing canvas 2 */
	ctx2.fillStyle="#CCCCCC";
	ctx2.fillRect(0,0,900,400);
	
	ctx2.strokeStyle = '#000000';
	ctx2.lineWidth = 1;
	for(i=0; i<21;i++){
		ctx2.beginPath();
		ctx2.moveTo(50*i+50, 50);
		ctx2.lineTo(50*i+50, 350);
		ctx2.stroke();
		ctx2.closePath();
	}
	
	ctx2.font="12px Arial";
	ctx2.fillStyle="#990000";
	
	for(i=0; i<7;i++){
		timevalue = i*4;
		yvalue = 60 - i*20;
		xposition = 200*i+50-5;
		yposition = i*50+55;
		ctx2.fillText(timevalue,xposition, 370);
		ctx2.fillText(yvalue,15, yposition);
	}


	for(i=0; i<7;i++){
		ctx2.beginPath();
		ctx2.moveTo(45, 50*i+50);
		ctx2.lineTo(900, 50*i+50);
		ctx2.stroke();
		ctx2.closePath();
	}
	
	ctx2.fillText("time (s)",450, 390);
	
	ctx2.fillText("height (m)",10, 30);
	
	ctx2.lineWidth = 5;
	ctx2.beginPath();
	ctx2.moveTo(50, 50);
	ctx2.lineTo(50, 350);
	ctx2.stroke();
	ctx2.closePath();
	
	ctx2.beginPath();
	ctx2.moveTo(50, 200);
	ctx2.lineTo(900, 200);
	ctx2.stroke();
	ctx2.closePath();

	for (i=0; i < 850; i++){
		Angle2InRadians = ((i*speed+StartAngle)/180)*Math.PI;
		ypos = -radiusofwheel*2.5*Math.sin(Angle2InRadians) + 200-heightofcenter*2.5;
		ctx2.fillStyle="#000000";
		ctx2.fillRect(i+50,ypos,3,3);
		
	}
	Angle2InRadians = ((count*speed+StartAngle)/180)*Math.PI;
	y2 = -radiusofwheel*2.5*Math.sin(Angle2InRadians) + 200-heightofcenter*2.5;
	ctx2.lineWidth = 1;
	ctx2.beginPath();
	ctx2.arc(count+50, y2, 3, 0, 2*Math.PI, true);
	ctx2.strokeStyle = '#990000';
	ctx2.fillStyle = '#990000';
	ctx2.stroke();
	ctx2.closePath();
	
	count++;
	
	
}

function Pause(){
	clearInterval(StartItMoving);
	document.getElementById("PauseButton").style.visibility = "hidden";
	document.getElementById("ResumeButton").style.visibility = "visible";
	document.getElementById("ResetButton").style.visibility = "visible";

}

function Resume(){
	StartItMoving = setInterval(drawingpart, 20);
	document.getElementById("PauseButton").style.visibility = "visible";
	document.getElementById("ResumeButton").style.visibility = "hidden";
	document.getElementById("ResetButton").style.visibility = "visible";

}

function Reset(){
	count = 0;
	Angle = StartAngle;
	document.getElementById("PauseButton").style.visibility = "hidden";
	document.getElementById("ResumeButton").style.visibility = "visible";
	document.getElementById("ResetButton").style.visibility = "hidden";
	drawingpart();
	clearInterval(StartItMoving);

}

function DrawCar(x, y, z){
	if (z==0){
		ctx.fillStyle = "#990000";
	}
	else{
		ctx.fillStyle = "#000099";
	}
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 3;
	ctx.beginPath();
	ctx.moveTo(x-25, y+20);
	ctx.lineTo(x-25, y+50);
	ctx.arc(x-20, y+50, 5, Math.PI, 0.5*Math.PI, true);
	ctx.lineTo(x+20, y+55);
	ctx.arc(x+20, y+50, 5, 0.5*Math.PI, 0, true);
	ctx.lineTo(x+25, y+20);
	ctx.lineTo(x-25,y+20);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	ctx.strokeStyle = "#FFFFFF";
	ctx.lineWidth = 6;
	ctx.lineCap = 'square';
	ctx.beginPath();
	ctx.moveTo(x-22, y+30);
	ctx.lineTo(x+22, y+30);
	ctx.stroke();
	ctx.closePath();
	ctx.beginPath();
	ctx.moveTo(x-25, y+20);
	ctx.bezierCurveTo(x-25, y, x+25, y, x+25, y+20);
	ctx.stroke();
}

function DrawLine(x,y,z){	
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.moveTo(xo, yo);
	ctx.lineTo(x, y+3);
	ctx.strokeStyle = '#FFFFFF';
	ctx.lineCap = 'round';
	ctx.stroke();
	ctx.closePath();
	if (z ==0){
		ctx.lineWidth = 5;
		ctx.beginPath();
		ctx.moveTo(200, 580);
		ctx.lineTo(200, y1);
		ctx.strokeStyle = '#990000';
		ctx.lineCap = 'round';
		ctx.stroke();
		ctx.closePath();
		
		ctx.lineWidth = 5;
		ctx.beginPath();
		ctx.arc(x, y, 5, 0, 2*Math.PI, true);
		ctx.strokeStyle = '#990000';
		ctx.fillStyle = '#990000';
		ctx.stroke();
		ctx.closePath();
		ctx.fill();

	}
}


function ChangeA(){
	radiusofwheel = Math.random()*20+10;
	ArrowLength = radiusofwheel*10;
	count = 0;
	Angle = StartAngle;
	drawingpart();
}

function ChangeB(){
	frequencyofwheel = Math.random()*1+.01;
	speed = 360/50*frequencyofwheel;
	count = 0;
	Angle = StartAngle;
	drawingpart();
}

function ChangeC(){
	StartAngle = StartAngle+45;
	Angle = StartAngle;
	count = 0;
	drawingpart();
	document.getElementById("ResetButton").style.visibility = "hidden";
	Pause();
}

function ChangeD(){
	heightofcenter = Math.random()*40+0;
	yo = 580-heightofcenter*10;
	count = 0;
	Angle = StartAngle;
	drawingpart();
}

function WriteText(x,y,t,s,c,m,ff){
	ctx.fillStyle = c;
	ctx.font= s + "px " + ff;
	temptext = t;
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x - m*textWidth;
	ctx.fillText(temptext,xposition, y);
}
</script>
