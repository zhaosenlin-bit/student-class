<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>文学常识 · 魔法对战</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial Black', 'Arial', sans-serif;
            font-weight: 900;
            background: #0b0a1a;
            color: #fff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .screen {
            position: fixed;
            inset: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .screen.active {
            display: flex;
        }

        /* ===== 角色选择 ===== */
        #selectScreen {
            background: linear-gradient(145deg, #1a0f2e 0%, #2d1b4e 100%);
            justify-content: center;
            gap: 1rem;
        }
        #selectScreen h1 {
            font-size: 3rem;
            text-shadow: 0 0 20px #b77aff, 0 0 40px #6a3fbf;
            letter-spacing: 4px;
            margin-bottom: 0.5rem;
        }
        .select-wrap {
            display: flex;
            gap: 3rem;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
        }
        .slot {
            background: rgba(255, 255, 255, 0.08);
            border: 3px dashed #a77bff;
            border-radius: 40px;
            width: 220px;
            height: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            transition: 0.3s;
            box-shadow: 0 0 30px rgba(150, 80, 255, 0.3);
            padding: 1rem;
        }
        .slot.selected {
            border-color: #ffd966;
            box-shadow: 0 0 50px #f9d71c;
        }
        .slot .char-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }
        .slot .char-preview .emoji-big {
            font-size: 5rem;
            line-height: 1;
            filter: drop-shadow(0 0 20px #d9a7ff);
        }
        .slot .char-preview .cname {
            font-size: 1.6rem;
            text-shadow: 0 0 15px #d9a7ff;
        }
        .slot .char-preview .cskill {
            font-size: 1rem;
            background: #6d3eb0;
            padding: 4px 14px;
            border-radius: 30px;
            color: #ffecb3;
        }
        .slot .placeholder {
            font-size: 2.4rem;
            opacity: 0.5;
            text-shadow: 0 0 20px #aa7eff;
        }
        .char-pool {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            max-width: 600px;
            margin: 12px auto;
        }
        .char-card {
            background: #251a3a;
            border-radius: 30px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .char-card:hover, .char-card:active {
            border-color: #f6c85f;
            background: #3f2b5e;
            transform: scale(1.02);
        }
        .char-card .emoji-icon {
            font-size: 2.8rem;
            line-height: 1;
        }
        .char-card .info {
            display: flex;
            flex-direction: column;
        }
        .char-card .info .name {
            font-size: 1.2rem;
        }
        .char-card .info .skill {
            font-size: 0.7rem;
            color: #cfb3ff;
        }
        #startBtn {
            margin-top: 20px;
            padding: 16px 60px;
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(145deg, #f7d875, #e6a817);
            border: none;
            border-radius: 60px;
            color: #1f1135;
            text-shadow: 0 2px 0 #ffe28a;
            box-shadow: 0 10px 0 #9b6d0e, 0 12px 30px #f7b32b;
            transform: skewX(-8deg);
            transition: 0.15s;
            cursor: pointer;
            letter-spacing: 2px;
            opacity: 0.5;
            pointer-events: none;
        }
        #startBtn.enabled {
            opacity: 1;
            pointer-events: auto;
        }
        #startBtn:active {
            transform: skewX(-8deg) translateY(6px);
            box-shadow: 0 4px 0 #9b6d0e;
        }

        /* ===== VS过渡 ===== */
        #vsScreen {
            background: radial-gradient(circle at 30% 30%, #1f0c3a, #07030f);
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 0;
        }
        .vs-char {
            width: 40%;
            height: 70%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.1s;
            font-size: 10rem;
            filter: drop-shadow(0 0 40px #c084fc);
        }
        .vs-char.left {
            transform: translateX(-120%);
            animation: slideInLeft 0.8s forwards;
        }
        .vs-char.right {
            transform: translateX(120%);
            animation: slideInRight 0.8s forwards;
        }
        @keyframes slideInLeft { 0% { transform: translateX(-120%); } 100% { transform: translateX(0); } }
        @keyframes slideInRight { 0% { transform: translateX(120%); } 100% { transform: translateX(0); } }
        .vs-boom {
            position: absolute;
            font-size: 8rem;
            font-weight: 900;
            color: #ffd966;
            text-shadow: 0 0 80px #f09, 0 0 120px #ffaa33;
            transform: scale(0);
            animation: vsBoom 0.9s 0.4s forwards;
            z-index: 10;
            letter-spacing: 10px;
        }
        @keyframes vsBoom {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            60% { transform: scale(1.5) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); opacity: 1; }
        }

        /* ===== 战斗画面 ===== */
        #battleScreen {
            background: linear-gradient(45deg, #150b24, #2a1a3e);
            justify-content: flex-end;
        }
        .ground {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 18%;
            background: repeating-linear-gradient(45deg, #3d2b55 0px, #3d2b55 12px, #2d1d40 12px, #2d1d40 24px);
            border-top: 4px solid #a97eff;
            box-shadow: 0 -10px 40px #5f3d9e;
            z-index: 0;
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 5%;
            right: 5%;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }
        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 150px;
        }
        .hud-item .hname {
            font-size: 1.8rem;
            text-shadow: 0 0 20px #bf8aff;
            letter-spacing: 2px;
        }
        .hp-bar-bg {
            width: 200px;
            height: 28px;
            background: #2d1a3d;
            border-radius: 4px;
            margin-top: 4px;
            box-shadow: inset 0 2px 8px #000;
            transform: skewX(-20deg);
            overflow: hidden;
            border: 2px solid #b794f4;
        }
        .hp-fill {
            height: 100%;
            width: 100%;
            background: #4cd964;
            transition: width 0.3s ease;
            box-shadow: 0 0 20px #7dff7d;
        }
        .battle-chars {
            position: absolute;
            bottom: 18%;
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            z-index: 5;
            pointer-events: none;
        }
        .battle-char {
            width: 30%;
            max-width: 260px;
            animation: float 2.8s infinite alternate ease-in-out;
            font-size: 8rem;
            text-align: center;
            filter: drop-shadow(0 0 30px #a56eff);
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(-16px); }
        }
        .question-panel {
            position: absolute;
            top: 30%;
            left: 10%;
            right: 10%;
            background: rgba(10, 5, 25, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 60px;
            padding: 24px 20px;
            border: 2px solid #b27aff;
            box-shadow: 0 0 70px rgba(150, 50, 255, 0.5);
            z-index: 20;
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
        }
        .question-panel .q-text {
            font-size: 1.8rem;
            text-shadow: 0 0 20px #c293ff;
            margin-bottom: 24px;
            line-height: 1.4;
        }
        .question-panel .q-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
        }
        .q-options button {
            background: #392b5a;
            border: 3px solid #9b75e6;
            border-radius: 60px;
            padding: 12px 28px;
            font-size: 1.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px #b07eff;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 6px 0 #1f1235;
            pointer-events: auto;
            min-width: 120px;
        }
        .q-options button:active {
            transform: translateY(6px);
            box-shadow: none;
        }
        .q-options button:hover {
            background: #5b3f8a;
            border-color: #fad675;
        }
        .turn-indicator {
            position: absolute;
            bottom: 12%;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 1.8rem;
            text-shadow: 0 0 30px #ffb86c;
            z-index: 25;
            background: rgba(0,0,0,0.4);
            padding: 8px;
            backdrop-filter: blur(2px);
        }

        /* ===== 专属特效动画 ===== */
        .attack-effect {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 50;
            display: none;
            mix-blend-mode: screen;
        }
        .attack-effect.active {
            display: block;
        }

        /* 火球 - 安琪拉/后羿 */
        .effect-fireball {
            background: radial-gradient(circle at 20% 50%, #ff4500, #ffaa00, transparent 70%);
            animation: fireballRush 0.9s forwards;
        }
        @keyframes fireballRush {
            0% { opacity: 0; transform: scale(0.3) translateX(-120px) rotate(-10deg); }
            40% { opacity: 1; transform: scale(1.8) translateX(60px) rotate(10deg); }
            100% { opacity: 0; transform: scale(2.6) translateX(220px) rotate(20deg); }
        }

        /* 爱心 - 妲己 */
        .effect-heart {
            background: radial-gradient(circle at 70% 50%, #ff66c4, #d580ff, transparent 70%);
            animation: heartExplode 1s forwards;
        }
        @keyframes heartExplode {
            0% { opacity: 0; transform: scale(0) rotate(-30deg); }
            50% { opacity: 1; transform: scale(2.2) rotate(15deg); }
            100% { opacity: 0; transform: scale(3.4) rotate(0deg); }
        }

        /* 剑光 - 李白/赵云 */
        .effect-slash {
            background: linear-gradient(120deg, transparent 30%, #a5f3fc 50%, transparent 70%);
            clip-path: polygon(0% 0%, 100% 50%, 0% 100%);
            animation: slashStrike 0.7s forwards;
        }
        @keyframes slashStrike {
            0% { opacity: 0; transform: translateX(-80px) scaleX(0.3); }
            40% { opacity: 1; transform: translateX(40px) scaleX(1.4); }
            100% { opacity: 0; transform: translateX(160px) scaleX(0.8); }
        }

        /* 月光波纹 - 嫦娥 */
        .effect-moon {
            background: radial-gradient(circle at 50% 50%, #c4b5fd, #818cf8, transparent 70%);
            animation: moonWave 1.2s forwards;
        }
        @keyframes moonWave {
            0% { opacity: 0; transform: scale(0.2) rotate(0deg); border-radius: 50%; }
            50% { opacity: 0.9; transform: scale(2) rotate(180deg); border-radius: 30%; }
            100% { opacity: 0; transform: scale(3) rotate(360deg); border-radius: 0%; }
        }

        /* 金箍棒 - 孙悟空 */
        .effect-staff {
            background: repeating-linear-gradient(45deg, #fbbf24, #f59e0b 20px, #d97706 40px);
            animation: staffSmash 0.8s forwards;
        }
        @keyframes staffSmash {
            0% { opacity: 0; transform: translateY(-100px) scale(0.2) rotate(-40deg); }
            50% { opacity: 1; transform: translateY(30px) scale(1.6) rotate(10deg); }
            100% { opacity: 0; transform: translateY(120px) scale(2) rotate(30deg); }
        }

        /* 花瓣 - 小乔 */
        .effect-petal {
            background: radial-gradient(circle at 30% 30%, #f9a8d4, #f472b6, transparent 70%);
            animation: petalSpin 1s forwards;
        }
        @keyframes petalSpin {
            0% { opacity: 0; transform: scale(0) rotate(0deg) translateY(20px); }
            50% { opacity: 1; transform: scale(2) rotate(180deg) translateY(-20px); }
            100% { opacity: 0; transform: scale(3) rotate(360deg) translateY(40px); }
        }

        .shake {
            animation: shake 0.4s;
        }
        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-20px); }
            40% { transform: translateX(20px); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
            100% { transform: translateX(0); }
        }

        /* ===== 技能名字飘浮文字 ===== */
        .skill-float {
            position: fixed;
            z-index: 60;
            pointer-events: none;
            font-size: 3.2rem;
            font-weight: 900;
            color: #ffe484;
            text-shadow: 0 0 40px #ff6ec7, 0 0 80px #ffb347, 0 4px 10px #000;
            animation: floatUp 1.2s forwards;
            mix-blend-mode: lighten;
            letter-spacing: 4px;
            white-space: nowrap;
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(0) scale(0.6); }
            20% { opacity: 1; transform: translateY(-20px) scale(1.2); }
            100% { opacity: 0; transform: translateY(-180px) scale(1.6); }
        }

        /* ===== 喊出技能名按钮 ===== */
        .skill-shout-btn {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            background: linear-gradient(135deg, #f6d365, #fda085);
            border: none;
            border-radius: 60px;
            padding: 12px 32px;
            font-size: 1.6rem;
            font-weight: 900;
            color: #1f1135;
            text-shadow: 0 2px 0 #ffe28a;
            box-shadow: 0 8px 0 #b86b3a, 0 0 40px rgba(253, 160, 133, 0.6);
            cursor: pointer;
            transition: 0.1s;
            letter-spacing: 2px;
            animation: pulseBtn 1.5s infinite;
        }
        .skill-shout-btn:active {
            transform: translateX(-50%) translateY(6px);
            box-shadow: 0 2px 0 #b86b3a;
        }
        @keyframes pulseBtn {
            0% { box-shadow: 0 8px 0 #b86b3a, 0 0 30px #fda085; }
            50% { box-shadow: 0 8px 0 #b86b3a, 0 0 70px #fda085, 0 0 100px #f6d365; }
            100% { box-shadow: 0 8px 0 #b86b3a, 0 0 30px #fda085; }
        }

        /* ===== 胜利画面 ===== */
        #victoryScreen {
            background: radial-gradient(circle at 50% 50%, #1a0d2b, #000);
            gap: 16px;
        }
        #victoryScreen .winner-big {
            font-size: 4rem;
            text-shadow: 0 0 60px gold;
        }
        #victoryScreen .winner-img {
            font-size: 7rem;
            filter: drop-shadow(0 0 60px #fbbf24);
            animation: winnerGlow 1.6s infinite alternate;
        }
        @keyframes winnerGlow {
            0% { filter: drop-shadow(0 0 40px #fbbf24); transform: scale(1); }
            100% { filter: drop-shadow(0 0 100px #fbbf24); transform: scale(1.08); }
        }
        .golden-rotate {
            background: conic-gradient(from 0deg, gold, #fbbf24, #fcd34d, #b88b1a, gold);
            width: 300px;
            height: 300px;
            border-radius: 50%;
            position: absolute;
            opacity: 0.2;
            animation: spin 6s linear infinite;
            z-index: -1;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .stats {
            font-size: 1.6rem;
            background: #251d3a;
            padding: 12px 30px;
            border-radius: 60px;
            box-shadow: 0 0 30px #b27aff;
        }
        .review-box {
            max-height: 120px;
            overflow-y: auto;
            background: #0f0822;
            padding: 12px 20px;
            border-radius: 30px;
            width: 80%;
            max-width: 500px;
            font-size: 1rem;
            line-height: 1.6;
            border: 1px solid #a970ff;
        }
        .review-box .wrong { color: #ff7b7b; }
        .review-box .right { color: #7dff9e; }
        #restartBtn {
            padding: 14px 50px;
            font-size: 2rem;
            background: #f7d44a;
            border: none;
            border-radius: 60px;
            font-weight: 900;
            color: #1a0f2e;
            box-shadow: 0 8px 0 #a57b1a;
            cursor: pointer;
            transition: 0.1s;
        }
        #restartBtn:active { transform: translateY(6px); box-shadow: none; }
        .victory-quote {
            background: rgba(255,215,0,0.18);
            backdrop-filter: blur(6px);
            padding: 12px 28px;
            border-radius: 80px;
            font-size: 1.8rem;
            border: 2px solid #fbbf24;
            box-shadow: 0 0 60px #fbbf24;
            text-shadow: 0 0 30px #ffd700;
            margin-top: 8px;
            animation: quotePop 0.6s ease-out;
        }
        @keyframes quotePop {
            0% { transform: scale(0) rotate(-6deg); opacity: 0; }
            70% { transform: scale(1.2) rotate(2deg); opacity: 1; }
            100% { transform: scale(1) rotate(0); }
        }

        @media (max-width: 700px) {
            .slot { width: 150px; height: 210px; }
            .hud-item .hp-bar-bg { width: 120px; }
            .question-panel .q-text { font-size: 1.2rem; }
            .q-options button { font-size: 1.2rem; padding: 8px 16px; min-width: 80px; }
            .vs-boom { font-size: 5rem; }
            .battle-char { width: 35%; font-size: 5rem; }
            .skill-float { font-size: 2.2rem; }
            .skill-shout-btn { font-size: 1.2rem; padding: 8px 20px; bottom: 7%; }
        }
    </style>
</head>

<!-- 角色选择 -->
<div id="selectScreen" class="screen active">
    <h1>✨ 文学魔法对战 ✨</h1>
    <div class="select-wrap">
        <div class="slot" id="slotLeft">
            <div class="placeholder">🧙 左卫</div>
        </div>
        <div class="slot" id="slotRight">
            <div class="placeholder">🧙 右卫</div>
        </div>
    </div>
    <div class="char-pool" id="charPool"></div>
    <button id="startBtn">⚔️ 开始对战 ⚔️</button>
</div>

<!-- VS过渡 -->
<div id="vsScreen" class="screen">
    <div class="vs-char left" id="vsLeft">😺</div>
    <div class="vs-boom">⚡ VS ⚡</div>
    <div class="vs-char right" id="vsRight">🔥</div>
</div>

<!-- 战斗 -->
<div id="battleScreen" class="screen">
    <div class="ground"></div>
    <div class="hud">
        <div class="hud-item" id="hudLeft">
            <div class="hname" id="hudNameLeft">妲己</div>
            <div class="hp-bar-bg"><div class="hp-fill" id="hpLeft" style="width:100%"></div></div>
        </div>
        <div class="hud-item" id="hudRight">
            <div class="hname" id="hudNameRight">安琪拉</div>
            <div class="hp-bar-bg"><div class="hp-fill" id="hpRight" style="width:100%"></div></div>
        </div>
    </div>
    <div class="battle-chars">
        <div class="battle-char" id="bCharLeft">😺</div>
        <div class="battle-char" id="bCharRight">🔥</div>
    </div>
    <div class="question-panel" id="questionPanel">
        <div class="q-text" id="qText">加载题目中...</div>
        <div class="q-options" id="qOptions"></div>
    </div>
    <div class="turn-indicator" id="turnIndicator">🧝 妲己 的回合</div>
    <!-- 新增：喊出技能名按钮 -->
    <button class="skill-shout-btn" id="skillShoutBtn">🗣️ 喊出技能名</button>
    <div class="attack-effect" id="attackEffect"></div>
</div>

<!-- 胜利 -->
<div id="victoryScreen" class="screen">
