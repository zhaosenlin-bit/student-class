    input[type="text"]{

      border:1px solid #bbb;
      border-radius:8px;
      padding:0 8px;

      width:90px;
      text-align:center;
      font-weight:700;
      color:#0b57d0;
      background:#fff;

    <div class="grp">

      <input id="ampSlider" type="range" min="0" max="50" step="1" value="20">

      <label>Student Name</label>
      <input type="text" id="studentName" placeholder="Your name">
      <label>Enter period T (s)</label>
      <input type="text" id="period" value="0">
      <button class="btn btn-green" id="ans">Check Answer</button>
      <input type="checkbox" id="check-box">
      <span id="resultMsg" style="margin-left:8px; font-weight:700;"></span>
      <button class="btn btn-yellow" id="reset">Reset</button>
    </div>
