<div id="info" style="text-align: left;">

<script type="module">   
	import * as THREE from '../jsm/three.module.js';	
	import { OrbitControls } from '../jsm/OrbitControls.js';
	import { GLTFLoader } from '../jsm/GLTFLoader.js';
	import { STLLoader } from '../jsm/STLLoader.js';
	import { FontLoader } from '../jsm/FontLoader.js';
	import { TextGeometry } from '../jsm/TextGeometry.js';
	

var is_start = false;
var planet, pickPlanet, planet_radius = 40, globalmaterial;
var yourEarthHeight = 1;
var planetJumpHeight;
let jumpStartTime = null;
var planetPhoto = "images/earth.png"; 
var planetTexture;
let scene,camera,renderer,controls,mouseDown,world,night = false;
let model, mixer, clip, action, cloud, sky, ring;
	
var textureloader = new THREE.TextureLoader();
var fontloader = new FontLoader();
var glt_loader = new GLTFLoader();
var audio = new Audio('../Audio/very_high.mp3');
var audio2 = new Audio('../Audio/not_so_high.mp3');
var audio3 = new Audio('../Audio/pretty_high.mp3');
var audio4 = new Audio('../Audio/wrong.mp3');
var audio5 = new Audio('../Audio/very_very_high.mp3');
var clock = new THREE.Clock();	
	
function getData(){
	yourEarthHeight = parseFloat(document.getElementById("Ho").value);
	if((yourEarthHeight > 1.8) || (yourEarthHeight < 0)){
		audio4.play();
		alert("Can you really jump that high? Make sure it's a standing jump.");
		document.location.reload();
		return false;
	}
}

function init() {	
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMapSoft = true;
    document.getElementById('viewport').appendChild(renderer.domElement);
  
   
    scene = new THREE.Scene;
    //scene.background = new THREE.Color( 0x1DCBEA );
    camera = new THREE.PerspectiveCamera(
	35,
	window.innerWidth / window.innerHeight,
	1,
	1000
    );
    camera.position.set( 60, 50, 60 );
    camera.lookAt( scene.position );
    scene.add( camera );
    controls = new OrbitControls( camera, renderer.domElement );
    const axesHelper = new THREE.AxesHelper( 5 );
    scene.add( axesHelper );
	
	const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
	hemiLight.position.set(0, 200, 0);
	scene.add(hemiLight);
	
	const dirLight = new THREE.DirectionalLight(0xffffff, 1);
	dirLight.position.set(0, 50, 50);
	scene.add(dirLight);

        textureloader.load('https://images.pexels.com/photos/1205301/pexels-photo-1205301.jpeg' , function(texture)
            {
             scene.background = texture;  
            });
    
    addPlanet(0,-40,0);
    addJumper();

    document.getElementById("high").addEventListener("click", getData);
    document.getElementById("planetInput").addEventListener("input", onInput);	
    document.getElementById("planetInput").addEventListener("change", onInput);
    window.addEventListener('resize', onWindowResize, false);
}	
function addPlanet(x,y,z){
	const geometry = new THREE.SphereGeometry( planet_radius, 128, 128 ); 
	var tex = textureloader.load(planetPhoto);
	globalmaterial = new THREE.MeshBasicMaterial( { map: tex } ); 
	planet = new THREE.Mesh( geometry, globalmaterial ); 
	planet.position.set(x,y,z);
	scene.add( planet );
}
function addJumper(){	
	glt_loader.load( '/api/program-assets/lab-simulation-newton-gravity/_ext/vendor/models/jump/scene.gltf', function ( gltf ) {
			    model = gltf.scene;
			    model.scale.set (0.05, 0.05, 0.05);
			    mixer = new THREE.AnimationMixer( model );
			    clip = gltf.animations[ 0 ];
			    action = mixer.clipAction( clip.optimize() );  
			    scene.add( model );
			    model.position.set(-13, 0, 0);
			    return model;
			});
}	
function jumpingFunction() {
	if (!action || !model) return;

	is_start = true;
	jumpStartTime = clock.getElapsedTime();  // store when the jump starts

	action.reset();              // rewind to start
	action.setLoop(THREE.LoopOnce);	
	action.clampWhenFinished = true;
	action.enable = true;
	action.play();

	model.position.set(0, 0, 0);  // reset position
}
function createRing() {
	const innerRadius = planet_radius * (67000 / 60000); // ≈ 44.7 units
	const outerRadius = planet_radius * (140000 / 60000); // ≈ 93.3 units
	const thetaSegments = 128;
	
	// Use RingGeometry, but we’ll adjust the material for realism
	const geometry = new THREE.RingGeometry(innerRadius, outerRadius, thetaSegments);

	// Rotate UVs so texture appears radial
	const uv = geometry.attributes.uv;
	for (let i = 0; i < uv.count; i++) {
		const u = uv.getX(i);
		const v = uv.getY(i);
		const angle = Math.atan2(v - 0.5, u - 0.5);
		const radius = Math.sqrt((u - 0.5) ** 2 + (v - 0.5) ** 2);
		uv.setXY(i, radius, angle / (2 * Math.PI)); // radial mapping
	}
	uv.needsUpdate = true;

	const texture = textureloader.load("textures/saturn_ring.jpg");
	texture.wrapS = THREE.RepeatWrapping;
	texture.wrapT = THREE.RepeatWrapping;
	texture.anisotropy = 16;

	const material = new THREE.MeshBasicMaterial({
		map: texture,
		transparent: true,         // allow alpha channel
		side: THREE.DoubleSide,    // show both top and bottom
		depthWrite: false,         // prevent z-fighting with Saturn
	});

	ring = new THREE.Mesh(geometry, material);
	ring.rotation.x = Math.PI / 2; // align with planet
	ring.position.y = -40;
	scene.add(ring);
}
	
function computeHeight() {
	const gravities = {
		"Mercury": 0.377,
		"Venus": 0.904,
		"Earth": 1,
		"Moon": 0.166,
		"Mars": 0.377,
		"Jupiter": 2.53,
		"Saturn": 1.064,
		"Uranus": 0.903,
		"Neptune": 1.13,
		"Pluto": 0.061,
		"Eris": 0.076,
		"Ceres": 0.0276
	};

	pickPlanet = document.getElementById("planetInput").value;
	const gravity = gravities[pickPlanet];

	if (gravity !== undefined) {
		planetJumpHeight = yourEarthHeight / gravity;
	} else {
		planetJumpHeight = yourEarthHeight;
	}
	document.getElementById("Hp").value = planetJumpHeight.toFixed(3);
}
function playAudio(){
	 pickPlanet = document.getElementById("planetInput").value;
	 if(pickPlanet==="Eris" || pickPlanet==="Ceres" || pickPlanet==="Pluto"){	
	                audio5.play();
	 }else if(pickPlanet==="Mercury" || pickPlanet==="Mars" ){
		        audio3.play();
	 }else if (pickPlanet==="Jupiter" || pickPlanet==="Neptune" || pickPlanet==="Saturn" || pickPlanet==="Venus" ||
		     pickPlanet==="Earth" || pickPlanet==="Uranus" ){
	                audio2.play();
	 }else{
	                audio.play();
	 }
}
function onInput() {
	pickPlanet = document.getElementById("planetInput").value;
	computeHeight();
	playAudio();

	if(pickPlanet==="Mercury"){
		planetPhoto = "../Simulation/images/mercury.png";
	}else if(pickPlanet==="Venus"){
		planetPhoto = "../Simulation/images/venus.png";
	}else if(pickPlanet==="Earth"){
		planetPhoto = "../Simulation/images/earth.png";
	}else if(pickPlanet==="Moon"){
		planetPhoto = "../Simulation/images/moon.png";
	}else if(pickPlanet==="Mars"){
		planetPhoto = "../Simulation/images/mars.png";
	}else if(pickPlanet==="Jupiter"){
		planetPhoto = "../Simulation/images/jupiter.png";
	}else if(pickPlanet==="Saturn"){
		planetPhoto = "../Simulation/images/saturnB.png";
	}else if(pickPlanet==="Uranus"){
		planetPhoto = "../Simulation/images/uranus.png";
	}else if(pickPlanet==="Neptune"){
		planetPhoto = "../Simulation/images/neptune.png";
	}else if(pickPlanet==="Pluto"){
		planetPhoto = "../Simulation/images/pluto.png";
	}else if(pickPlanet==="Eris"){
		planetPhoto = "../Simulation/images/eris.png";
	}else if(pickPlanet==="Ceres"){
		planetPhoto = "../Simulation/images/ceres.png";
	}else{
		planetPhoto = "../Simulation/images/earth.png";
	}  

	// For all other planets
	textureloader.load(planetPhoto, function(newTexture) {
		globalmaterial.map = newTexture;
		globalmaterial.map.needsUpdate = true;
		jumpingFunction(); 
	});
}

function onWindowResize() {
	camera.aspect = window.innerWidth / window.innerHeight;
	camera.updateProjectionMatrix();
	renderer.setSize(window.innerWidth, window.innerHeight);
}
function animate() {
	  requestAnimationFrame(animate);
	  render();
}  
function render() {
	
	const delta = clock.getDelta();
	if (mixer) mixer.update(delta);

	// Animate vertical jump height if started
	if (is_start && model && jumpStartTime !== null) {
		const currentTime = clock.getElapsedTime();
		const t = currentTime - jumpStartTime;

		const jumpDuration = 1.5;  // seconds for a jump
		if (t <= jumpDuration) {
			// Sinusoidal motion scaled by planetJumpHeight
			model.position.y = Math.sin((Math.PI * t) / jumpDuration) * planetJumpHeight;
		} else {
			// Jump is over
			is_start = false;
			model.position.y = 0;
			jumpStartTime = null;
		}
	}

	planet.rotation.y += 0.001;
	renderer.render(scene, camera);
}
	
init();
animate();
	
</script>
