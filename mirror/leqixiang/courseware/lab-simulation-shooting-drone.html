<body>
<div id="info"> 
  <h1 style="text-align:center">Projectile Motion: Shooting a Drone</h1>
  <div class="control-panel">
	<button class="btn btn-warning" onclick="alert(
	  'A drone is flying horizontally to the left at a constant speed of 0.5 m/s.\n' +
	  'At time t = 0, it is 60 meters away from the cannon and 22 meters above the ground (gun level).\n\n' +
	  'What is the **fastest time** you can shoot down the drone?\n\n' +
	  'Assume projectile motion with gravity = 9.8 m/s² and no air resistance.\n\n' +
	  'Tip: Solve the problem on paper first before trying it in the simulation.')">
	  Projectile Problem
	</button><br>

    <div class="control-group">
      Angle:<br>
      <input type="range" id="angleSlider" min="10" max="70" value="45">
      <input type="text" id="angleValue" value="45°" readonly>
    </div>
	<div class="control-group">		
	  Initial Speed (m/s):
	  <div class="slider-row" style="display: flex; align-items: center;">
	    <input type="range" id="speedSlider" min="650" max="1200" step="10" value="800" style="flex: 1; margin-right: 8px;">
	    <input type="text" id="speedValue" value="800 m/s" readonly style="width: 100px; text-align: center; color: blue; font-weight: bold;">
	  </div>
	  <div class="minmax" style="display: flex; justify-content: space-between; margin-top: 4px;">
	    <span>650</span>
	    <span>1200</span>
	  </div>
	</div>
	 <div class="control-group">
	      Time: <input type="text" id="timeValue" value="0.0 s" readonly>
	 </div>
    <button class="btn btn-danger" id="start">Start</button>
    <button class="btn btn-success" id="reset">Reset</button>
  </div>
</div>
</body>
