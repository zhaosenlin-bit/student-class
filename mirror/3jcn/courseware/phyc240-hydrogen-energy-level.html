<body>
<div id="info">
  <div class="panel-title">Hydrogen Energy Levels</div>
	
  <button class="btn btn-warning" onclick="alert('Hydrogen energy levels are discrete states that an electron can occupy around the hydrogen nucleus. These levels are quantized and are given by the formula E_n = -13.6 eV / n², where n is the principal quantum number (n = 1, 2, 3, ...). The energy levels decrease as n increases, and transitions between these levels result in the emission or absorption of photons with specific energies.')">
    Hydrogen's energy levels?
  </button>

  <label class="section-label" for="highLevel">Choose Electron's initial level</label>
  <select id="highLevel">
    <option value="1">1</option>
    <option value="2">2</option>
    <option value="3" selected>3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
    <option value="7">7</option>
  </select>

  <label class="section-label" for="lowLevel">Choose Electron's final level</label>
  <select id="lowLevel">
    <option value="1" selected>1</option>
    <option value="2">2</option>
    <option value="3">3</option>
    <option value="4">4</option>
    <option value="5">5</option>
    <option value="6">6</option>
    <option value="7">7</option>
  </select>

  <button class="btn btn-success" id="onoff">Start Simulation</button>
  <button class="btn btn-info" id="lyman">Draw Lyman Series</button>
  <button class="btn btn-info" id="balmer">Draw Balmer Series</button>
  <button class="btn btn-info" id="paschen">Draw Paschen Series</button>
  <button class="btn btn-info" id="brackett">Draw Brackett Series</button>
  <button class="btn btn-danger" id="reset">Reset</button>

 <div class="small-note">
  Hydrogen atoms can emit light from many different energy-level transitions, but only the Balmer series produces visible spectral lines.
</div>
</div>
<div id="viewport"></div>
</body>
