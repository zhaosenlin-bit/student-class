  <div id="info">
    <h1>Intensity of a Sound Wave</h1>
	  Formula: I= P/(4πr^2)      Unit: [ W/m^2 ] 
    <button type="button" class="btn btn-danger" id="pauseResume">Pause/Resume</button>
    	
     <canvas id="canvas" style="border:2px solid #ffffff;"></canvas>

  <script type="module">   
    import * as THREE from '../jsm/three.module.js';  
    import { OrbitControls } from '../jsm/OrbitControls.js';


var container, camera, scene, light, renderer, controls;
let source, waveSpheres = [], waveSpeed = 0.2, sourceSpeed = 0;
let time = 0, isAnimating = true;
let isPaused = false; 
const P = 100;  // Power of the sound source
let intensityData = [];  // Data for the graph
let currentRadius = 0;  // Current radius for dynamic plotting
let maxRadius = 50;     // Maximum radius to plot
let chart;  // To store the Chart.js instance

init();
animate();

function init() {
  container = document.getElementById('container');
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  container.appendChild(renderer.domElement);
  
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x659471);
  
  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 20000);
  camera.position.set(0, 0, 100);  // Move the camera directly along the Z-axis
  
  light = new THREE.DirectionalLight(0xffffff, 0.8);
  scene.add(light);
  var amlight = new THREE.AmbientLight(0x404040); 
  scene.add(amlight);
  var pointlight = new THREE.PointLight(0xfaef28, 1, 100);
  pointlight.position.set(10, 25, 30);
  scene.add(pointlight);  

  addSource();
  
  controls = new OrbitControls(camera, renderer.domElement);
  
  document.getElementById('pauseResume').addEventListener('click', function() {
        if (isPaused) {
          isPaused = false;
          this.textContent = 'Pause';
          animate();  // Resume animation
        } else {
          isPaused = true;
          this.textContent = 'Resume';
        }
  });

  // Initialize the chart with fixed x-axis from 0 to 70
  initializeChart();

  // Start plotting the graph dynamically
  dynamicPlotGraph();

  window.addEventListener('resize', onWindowResize, false);      
}

function addSource() {  
   var cGeometry = new THREE.SphereGeometry(1, 32, 32);
   source = new THREE.Mesh(cGeometry, new THREE.MeshBasicMaterial({ color: 'red' }));
   scene.add(source);
   source.position.set(0, 0, 0);
}

// Function to dynamically plot intensity vs radius in real-time
function dynamicPlotGraph() {
  const interval = setInterval(() => {
    if (currentRadius > maxRadius) {
      clearInterval(interval);  // Stop plotting when radius exceeds maxRadius
      return;
    }

    const area = 4 * Math.PI * Math.pow(currentRadius, 2);  // Surface area of a sphere
    const intensity = P / area;  // Intensity formula

    // Store intensity and radius for plotting
    intensityData.push({ x: currentRadius, y: intensity });
    
    // Update the chart with new data
    chart.data.datasets[0].data = intensityData;
    chart.update();  // Update the chart to reflect new data

    currentRadius += 1;  // Increment the radius
  }, 100);  // Update every 100ms for a smooth plotting effect
}

function initializeChart() {
  const ctx = document.getElementById("canvas").getContext("2d");
  Chart.defaults.global.defaultFontColor = 'white';
  chart = new Chart(ctx, {
    type: 'scatter',
    data: {
      datasets: [{
        label: 'Intensity vs Radius',
        data: [],  // Start with empty data
        backgroundColor: 'rgba(0, 0, 0)',  
        borderColor: 'rgba(255, 255, 0, 1)',  // Yellow line
        borderWidth: 2,  // Make the line a bit thicker
        showLine: true,  // Show a line between points
        fill: false,  // No fill between line and x-axis
      }]
    },
    options: {
      responsive: false,  // Disable auto-resizing
      maintainAspectRatio: false,  // Disable aspect ratio lock
      animation: false,  // Disable animation during updates to prevent shifting
      scales: {
        x: {
          title: {
            display: true,
            text: 'Radius',
            color: 'white'  // Set the x-axis title color to white
          },
          min: 0,  // Fixed minimum x-axis value to 0
          max: 50,  // Fixed maximum x-axis value to 70
          ticks: {
            stepSize: 10,  // Control the step size between ticks
            autoSkip: false,  // Prevent skipping of ticks
            color: 'white',  // Set tick labels color to white
          },
          grid: {
            color: 'rgba(255, 255, 255, 0.2)'  // Set grid lines to be faint white
          }
        },
        y: {
          title: {
            display: true,
            text: 'Intensity (I)',
            color: 'white'  // Set the y-axis title color to white
          },
          beginAtZero: true,
          ticks: {
            color: 'white'  // Set tick labels color to white
          },
          grid: {
            color: 'rgba(255, 255, 255, 0.2)'  // Set grid lines to be faint white
          }
        }
      },
      plugins: {
        legend: {
          labels: {
            color: 'white'  // Set legend labels color to white
          }
        }
      }
    }
  });
}


function animate() {
  if (isPaused) return;  // Stop the animation loop when paused

  requestAnimationFrame(animate);
  time += 0.01;

  if (time > 0.5) {  // Emit a wave every 0.5 seconds
    createSoundWave();
    time = 0;
  }

  updateWaves();
  
  controls.update();
  renderer.render(scene, camera);
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
