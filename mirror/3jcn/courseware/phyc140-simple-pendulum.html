<body>
	
<div id="info">
    <h1>Simple Pendulum </h1>
	Select a planet then Drag the sphere and release to begin 
    <!-- Left Panel -->  
    <div class="control-panel">
	
	<div class="control-group">
	  Length:
	  <div class="slider-row" style="display: flex; align-items: center;">
	    <input type="range" id="lengthSlider" min="15" max="20" step="0.1" value="15" style="flex: 1; margin-right: 8px;">
	    <input type="text" id="lengthValue" value="15 dm" readonly style="width: 80px; text-align: center; color: blue; font-weight: bold;">
	  </div>
	  <div class="minmax" style="display: flex; justify-content: space-between; margin-top: 4px;">
	    <span>15</span>
	    <span>20</span>
	  </div>
	</div>
	
	  <div class="control-group">
	    Mass:
	    <div class="slider-row">
	      <input type="range" id="massSlider" min="0.1" max="1.5" step="0.01" value="1.00">
	      <input type="text" id="massValue" value="1.00 kg" readonly>
	    </div>
	    <div class="minmax">
	      <span>0.1</span>
	      <span>1.5</span>
	    </div>
	  </div>

         <button type="button" class="btn btn-warning" id="stop" style="background-color:orange;">Stop</button>
	 <button type="button" class="btn btn-danger" id="reset">Reset</button><br><br>
	    <div class="control-group">
		  Stopwatch:
		  <div class="slider-row" style="justify-content: center;">
		    <input type="text" id="stopwatch" value="0.00 s" readonly style="width: 100px; font-weight: bold; text-align: center; color: blue;">
		  </div>
		  <div style="margin-top: 8px;">
		    <button id="startTimer">Start</button>
		    <button id="pauseTimer">Pause</button>
		    <button id="resetTimer">Reset</button>
		  </div>
		</div>

</div>
	
<!-- Right Panel -->
<div class="control-panel-right">
  			
	  <div class="control-group">
	    Gravity:
	    <div class="slider-row">
	      <input type="range" id="gravitySlider" min="1.6" max="25" step="0.1" value="9.81">
	      <input type="text" id="gravityValue" value="9.81 m/s²" readonly>
	    </div>
	    <div class="minmax">
	      <span>Low</span><span>High</span>
	    </div>
	  </div>
	
	<div class="control-group">
	  Planet:
	  <div class="slider-row">
	    <select id="planetSelector">
	      <option value="1.62">Moon</option>
	      <option value="3.7">Mars</option>
	      <option value="9.81" selected>Earth</option>
	      <option value="24.79">Jupiter</option>
	      <option value="10.44">Saturn</option>
	      <option value="3.69">Mercury</option>
	      <option value="0">Custom</option>
	    </select>
	  </div>
	</div>

	  <div class="control-group">
	    Friction:
	    <div class="slider-row">
	      <input type="range" id="frictionSlider" min="0" max="0.1" step="0.001" value="0.000">
	      <input type="text" id="frictionValue" value="0.000" readonly>
	    </div>
	    <div class="minmax">
	      <span>None</span><span>Lots</span>
	    </div>
	  </div>

	  <div class="control-group">
	    Max Angle:
	    <input type="text" id="angleValue" value="0.0°" readonly style="width: 90px;">
	  </div>
    </div>	
	
</div>
<div id="viewport"></div>
	
</body>
</html>
