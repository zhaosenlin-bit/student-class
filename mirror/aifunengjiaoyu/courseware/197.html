<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>晨读树苗成长记</title>
<style>
/* === RESET & BASE === */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

@import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap');

:root {
  --sky-top: #1a6b8a;
  --sky-mid: #2d9e7a;
  --sky-bottom: #5ec9a0;
  --ground: #3a7d44;
  --ground-dark: #2d5f34;
  --sun-gold: #ffb347;
  --sun-glow: #ffe066;
  --drop-blue: #5bc0eb;
  --drop-glow: #a0e4ff;
  --bark: #6b4226;
  --bark-dark: #4a2e18;
  --leaf: #4caf50;
  --leaf-light: #81c784;
  --leaf-dark: #2e7d32;
  --flower-pink: #f48fb1;
  --flower-yellow: #fff176;
  --flower-white: #fff;
  --fruit-red: #ef5350;
  --fruit-orange: #ff9800;
  --ui-glass: rgba(255,255,255,0.12);
  --ui-glass-border: rgba(255,255,255,0.22);
  --ui-text: #e8f5e9;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  font-family: 'ZCOOL KuaiLe', 'Ma Shan Zheng', sans-serif;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 50%, var(--sky-bottom) 78%, var(--ground) 78%, var(--ground-dark) 100%);
  user-select: none;
}

canvas#gameCanvas {
  display: block;
  width: 100vw;
  height: 100vh;
}

/* === UI OVERLAY === */
.ui-layer {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 10;
}

.controls {
  position: absolute;
  top: 18px; left: 24px;
  display: flex;
  gap: 10px;
  pointer-events: auto;
}

.controls button {
  font-family: 'ZCOOL KuaiLe', sans-serif;
  font-size: 15px;
  padding: 7px 20px;
  border: 1.5px solid var(--ui-glass-border);
  border-radius: 20px;
  background: var(--ui-glass);
  color: var(--ui-text);
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  transition: background 0.2s, transform 0.15s;
  letter-spacing: 1px;
}
.controls button:hover {
  background: rgba(255,255,255,0.22);
  transform: scale(1.06);
}
.controls button:active {
  transform: scale(0.97);
}
.controls button.active {
  background: rgba(76,175,80,0.4);
  border-color: rgba(76,175,80,0.6);
}

.timer-box {
  position: absolute;
  top: 18px; right: 24px;
  pointer-events: none;
  text-align: right;
}
.timer-display {
  font-family: 'ZCOOL KuaiLe', sans-serif;
  font-size: 22px;
  color: rgba(255,255,255,0.7);
  text-shadow: 0 1px 6px rgba(0,0,0,0.25);
  letter-spacing: 2px;
}
.score-display {
  font-family: 'ZCOOL KuaiLe', sans-serif;
  font-size: 16px;
  color: rgba(255,255,255,0.55);
  margin-top: 2px;
}

.volume-indicator {
  position: absolute;
  top: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  pointer-events: none;
}
.vol-icon {
  font-size: 18px;
  color: rgba(255,255,255,0.5);
}
.vol-bar-bg {
  width: 120px; height: 6px;
  background: rgba(255,255,255,0.15);
  border-radius: 3px;
  overflow: hidden;
}
.vol-bar-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--sun-gold), #76ff03);
  border-radius: 3px;
  transition: width 0.08s;
}

/* === FINAL OVERLAY === */
.final-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 100;
  display: none;
  justify-content: center;
  align-items: center;
  background: rgba(10,40,30,0.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  pointer-events: auto;
  opacity: 0;
  transition: opacity 0.8s;
}
.final-overlay.show {
  display: flex;
  opacity: 1;
}
.final-card {
  text-align: center;
  color: #fff;
  animation: cardPop 0.6s cubic-bezier(.22,1.2,.36,1) forwards;
}
.final-card h1 {
  font-size: 52px;
  font-family: 'Ma Shan Zheng', serif;
  color: var(--sun-glow);
  text-shadow: 0 0 40px rgba(255,224,102,0.5);
  margin-bottom: 12px;
}
.final-card .final-score {
  font-size: 80px;
  font-family: 'ZCOOL KuaiLe', sans-serif;
  background: linear-gradient(135deg, var(--sun-gold), #76ff03);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.final-card .final-stage {
  font-size: 28px;
  color: rgba(255,255,255,0.7);
  margin-top: 8px;
}
.final-card .final-msg {
  font-size: 20px;
  color: rgba(255,255,255,0.5);
  margin-top: 20px;
}
.final-card button {
  margin-top: 28px;
  font-family: 'ZCOOL KuaiLe', sans-serif;
  font-size: 18px;
  padding: 10px 36px;
  border: 1.5px solid var(--ui-glass-border);
  border-radius: 24px;
  background: rgba(76,175,80,0.35);
  color: #fff;
  cursor: pointer;
  pointer-events: auto;
  transition: background 0.2s, transform 0.15s;
}
.final-card button:hover { background: rgba(76,175,80,0.55); transform: scale(1.06); }

@keyframes cardPop {
  0% { transform: scale(0.7) translateY(40px); opacity: 0; }
  100% { transform: scale(1) translateY(0); opacity: 1; }
}

/* Mic permission prompt */
.mic-prompt {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 200;
  display: flex;
  justify-content: center;
  align-items: center;
  background: rgba(10,40,30,0.88);
  backdrop-filter: blur(10px);
}
.mic-prompt-card {
  text-align: center;
  color: #fff;
}
.mic-prompt-card h2 {
  font-size: 32px;
  font-family: 'Ma Shan Zheng', serif;
  color: var(--sun-glow);
  margin-bottom: 16px;
}
.mic-prompt-card p {
  font-size: 16px;
  color: rgba(255,255,255,0.6);
  margin-bottom: 24px;
}
.mic-prompt-card button {
  font-family: 'ZCOOL KuaiLe', sans-serif;
  font-size: 20px;
  padding: 12px 40px;
  border: none;
  border-radius: 28px;
  background: linear-gradient(135deg, var(--leaf), var(--sky-mid));
  color: #fff;
  cursor: pointer;
  transition: transform 0.15s;
}
.mic-prompt-card button:hover { transform: scale(1.08); }
</style>
</head>

<div class="ui-layer">
  <div class="controls">
    <button id="btnStart">开始</button>

      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'i' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u')) ||
      (e.ctrlKey && (e.key === 's' || e.key === 'S'))
    ) {
      e.preventDefault();
      return false;
    }
  });

  // DevTools 检测（基于 debugger 语句执行耗时）
  var _cdt = function() {
    var t0 = performance.now();
    (function(){}).constructor('debugger')();
    if (performance.now() - t0 > 100) {
      (function lp() {
        (function(){}).constructor('debugger')();
        setTimeout(lp, 50);
      })();
    }
  };
  setTimeout(_cdt, 1000);
  setInterval(_cdt, 3000);

})();
