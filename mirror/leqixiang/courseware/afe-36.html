<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 单项式侦探 - 神秘案件</title>
    <style>
        /* ===== 全局重置 & 基础 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse at 20% 30%, #0c0e2b, #0a0b1a 70%, #02020a);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* ===== 毛玻璃基类 ===== */
        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px) saturate(1.2);
            -webkit-backdrop-filter: blur(18px) saturate(1.2);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.13);
            backdrop-filter: blur(28px) saturate(1.4);
            -webkit-backdrop-filter: blur(28px) saturate(1.4);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 28px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        /* ===== 主容器 ===== */
        .app-container {
            width: 100%;
            max-width: 820px;
            min-height: 560px;
            position: relative;
            padding: 10px;
        }

        /* ===== 屏幕通用 ===== */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 36px 32px 40px;
            width: 100%;
            animation: fadeSlideUp 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeSlideUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ===== 开场屏幕 ===== */
        #start-screen {
            text-align: center;
            gap: 12px;
        }

        .start-badge {
            font-size: 4rem;
            line-height: 1;
            margin-bottom: 4px;
            filter: drop-shadow(0 0 30px rgba(255, 200, 50, 0.25));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .start-title {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f6d365, #fda085, #f6d365);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            animation: shimmer 4s ease-in-out infinite;
        }

        @keyframes shimmer {
            0%,
            100% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
        }

        .start-sub {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 6px;
            margin-bottom: 8px;
        }

        .start-brief {
            max-width: 600px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 20px 28px;
            margin: 8px 0 16px;
            text-align: left;
            color: rgba(255, 255, 255, 0.82);
            font-size: 1.05rem;
            line-height: 1.8;
            border-left: 4px solid #f6d365;
        }

        .start-brief strong {
            color: #f6d365;
            font-weight: 700;
        }

        .start-brief em {
            color: #ffb4a2;
            font-style: normal;
            font-weight: 600;
        }

        .btn-start {
            padding: 16px 56px;
            font-size: 1.4rem;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #f6d365, #fda085);
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(253, 160, 133, 0.35);
            letter-spacing: 2px;
            margin-top: 8px;
        }

        .btn-start:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 48px rgba(253, 160, 133, 0.5);
        }

        .btn-start:active {
            transform: scale(0.96);
        }

        /* ===== 游戏主屏幕 ===== */
        #game-screen {
            gap: 18px;
            padding: 28px 28px 32px;
        }

        /* 顶部栏 */
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 4px 6px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            flex-wrap: wrap;
            gap: 8px;
        }

        .game-progress {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-bar-wrap {
            width: 120px;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f6d365, #fda085);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .game-score {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.85);
        }

        .score-num {
            font-weight: 700;
            font-size: 1.4rem;
            color: #f6d365;
        }

        /* 案件展示区 */
        .case-display {
            text-align: center;
            padding: 12px 0 6px;
            width: 100%;
        }

        .case-label {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .case-expression {
            font-size: 4.5rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.10);
            line-height: 1.3;
            letter-spacing: 4px;
            word-break: break-all;
        }

        .case-expression .highlight-var {
            color: #7ed6df;
        }

        .case-expression .highlight-num {
            color: #f6d365;
        }

        .case-expression .highlight-pi {
            color: #ffb4a2;
        }

        /* 选择区域 */
        .selection-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            margin: 4px 0 6px;
        }

        .selection-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        .selection-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            min-width: 80px;
            letter-spacing: 1px;
        }

        .selection-label .icon {
            font-size: 1.3rem;
            margin-right: 6px;
        }

        .option-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            flex: 1;
        }

        .option-btn {
            padding: 10px 22px;
            font-size: 1.2rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.10);
            border-radius: 16px;
            color: rgba(255, 255, 255, 0.8);
            cursor: pointer;
            transition: all 0.25s ease;
            min-width: 48px;
            text-align: center;
            font-family: inherit;
            user-select: none;
        }

        .option-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .option-btn.selected {
            background: rgba(246, 211, 101, 0.20);
            border-color: #f6d365;
            color: #f6d365;
            box-shadow: 0 0 24px rgba(246, 211, 101, 0.15);
            transform: scale(1.02);
        }

        .option-btn.selected-degree {
            background: rgba(126, 214, 223, 0.20);
            border-color: #7ed6df;
            color: #7ed6df;
            box-shadow: 0 0 24px rgba(126, 214, 223, 0.15);
            transform: scale(1.02);
        }

        .option-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
        }

        .option-btn.correct-reveal {
            background: rgba(46, 213, 115, 0.25) !important;
            border-color: #2ed573 !important;
            color: #2ed573 !important;
            box-shadow: 0 0 30px rgba(46, 213, 115, 0.20) !important;
            transform: scale(1.04) !important;
        }

        .option-btn.wrong-reveal {
            background: rgba(255, 71, 87, 0.20) !important;
            border-color: #ff4757 !important;
            color: #ff4757 !important;
            box-shadow: 0 0 30px rgba(255, 71, 87, 0.15) !important;
        }

        /* 破案按钮 */
        .btn-solve {
            padding: 14px 44px;
            font-size: 1.3rem;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #f6d365, #fda085);
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 28px rgba(253, 160, 133, 0.30);
            letter-spacing: 2px;
            margin-top: 4px;
            width: 100%;
            max-width: 320px;
        }

        .btn-solve:hover:not(:disabled) {
            transform: scale(1.03);
            box-shadow: 0 10px 40px rgba(253, 160, 133, 0.45);
        }

        .btn-solve:active:not(:disabled) {
            transform: scale(0.96);
        }

        .btn-solve:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .btn-solve.solved {
            background: linear-gradient(135deg, #2ed573, #26de81);
            box-shadow: 0 6px 28px rgba(46, 213, 115, 0.30);
            color: #fff;
        }

        /* 反馈区 */
        .feedback-area {
            width: 100%;
            padding: 0 4px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 80px;
        }

        .feedback-card {
            padding: 16px 22px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid rgba(255, 255, 255, 0.15);
            animation: fadeSlideUp 0.4s ease;
        }

        .feedback-card.correct {
            border-left-color: #2ed573;
            background: rgba(46, 213, 115, 0.06);
        }

        .feedback-card.wrong {
            border-left-color: #ff4757;
            background: rgba(255, 71, 87, 0.06);
        }

        .feedback-result {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 4px;
        }

        .feedback-result .icon {
            font-size: 1.5rem;
        }

        .feedback-result.correct-text {
            color: #2ed573;
        }
        .feedback-result.wrong-text {
            color: #ff4757;
        }

        .feedback-detail {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
        }

        .feedback-detail strong {
            color: #f6d365;
        }

        .feedback-rhyme {
            margin-top: 8px;
            padding: 10px 16px;
            background: rgba(246, 211, 101, 0.10);
            border-radius: 14px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #f6d365;
            text-align: center;
            border: 1px dashed rgba(246, 211, 101, 0.25);
            letter-spacing: 1px;
        }

        .btn-next {
            padding: 12px 36px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 8px;
            align-self: center;
            letter-spacing: 1px;
        }

        .btn-next:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: scale(1.03);
        }

        .hidden {
            display: none !important;
        }

        /* ===== 结束屏幕 ===== */
        #end-screen {
            text-align: center;
            gap: 16px;
            padding: 40px 32px 44px;
        }

        .end-badge {
            font-size: 4rem;
            line-height: 1;
            margin-bottom: 2px;
        }

        .end-title {
            font-size: 2.4rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 2px;
        }

        .end-rank {
            font-size: 1.8rem;
            font-weight: 700;
            padding: 8px 32px;
            border-radius: 60px;
            background: rgba(246, 211, 101, 0.15);
            color: #f6d365;
            border: 1px solid rgba(246, 211, 101, 0.20);
            margin: 4px 0;
        }

        .end-score {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.7);
        }

        .end-score strong {
            color: #f6d365;
            font-size: 1.6rem;
        }

        .end-summary {
            max-width: 520px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 20px;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.8;
            font-size: 1rem;
        }

        .end-summary .rhyme-list {
            list-style: none;
            padding: 0;
            margin: 6px 0 0;
        }

        .end-summary .rhyme-list li {
            padding: 4px 0;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.65);
        }

        .end-summary .rhyme-list li::before {
            content: '🔎 ';
        }

        .btn-restart {
            padding: 14px 48px;
            font-size: 1.2rem;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            background: linear-gradient(135deg, #f6d365, #fda085);
            color: #1a1a2e;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(253, 160, 133, 0.30);
            letter-spacing: 2px;
            margin-top: 8px;
        }

        .btn-restart:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 48px rgba(253, 160, 133, 0.45);
        }

        /* ===== 背景装饰 ===== */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.20;
            pointer-events: none;
            z-index: -1;
        }

        .bg-orb.orb1 {
            width: 400px;
            height: 400px;
            background: #f6d365;
            top: -100px;
            right: -100px;
        }

        .bg-orb.orb2 {
            width: 350px;
            height: 350px;
            background: #7ed6df;
            bottom: -80px;
            left: -80px;
        }

        .bg-orb.orb3 {
            width: 200px;
            height: 200px;
            background: #ffb4a2;
            top: 40%;
            left: 60%;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 640px) {
            .app-container {
                padding: 0;
            }

            .screen {
                padding: 24px 16px 28px !important;
            }

            .start-title {
                font-size: 2rem;
            }

            .start-badge {
                font-size: 3rem;
            }

            .start-brief {
                font-size: 0.95rem;
                padding: 16px 18px;
            }

            .case-expression {
                font-size: 2.8rem !important;
                letter-spacing: 2px;
            }

            .selection-label {
                min-width: 60px;
                font-size: 0.95rem;
            }

            .option-btn {
                padding: 8px 16px;
                font-size: 1rem;
                min-width: 40px;
            }

            .game-header {
                font-size: 0.85rem;
            }

            .btn-solve {
                font-size: 1.1rem;
                padding: 12px 28px;
            }

            .end-title {
                font-size: 1.8rem;
            }

            .end-rank {
                font-size: 1.3rem;
                padding: 6px 20px;
            }

            .feedback-result {
                font-size: 1rem;
            }

            .feedback-rhyme {
                font-size: 0.95rem;
            }

            .progress-bar-wrap {
                width: 80px;
            }
        }

        @media (max-width: 420px) {
            .case-expression {
                font-size: 2.2rem !important;
            }

            .option-btn {
                padding: 6px 12px;
                font-size: 0.9rem;
                min-width: 34px;
            }

            .selection-row {
                gap: 8px;
            }

            .option-group {
                gap: 6px;
            }
        }

        /* ===== 工具类 ===== */
        .mt-1 {
            margin-top: 4px;
        }
        .mt-2 {
            margin-top: 12px;
        }
        .mb-1 {
            margin-bottom: 4px;
        }
        .text-center {
            text-align: center;
        }
        .w-full {
            width: 100%;
        }
    </style>
</head>

    <!-- 背景光晕 -->
    <div class="bg-orb orb1"></div>
    <div class="bg-orb orb2"></div>
    <div class="bg-orb orb3"></div>

    <div class="app-container glass-strong">

        <!-- ====== 开场屏幕 ====== -->
        <div id="start-screen" class="screen active">
            <div class="start-badge">🔍</div>
            <div class="start-title">单项式侦探</div>
            <div class="start-sub">🕵️ 神秘案件 · 等你来破</div>
            <div class="start-brief">
                <strong>📋 案件简报</strong><br>
                各位侦探，欢迎来到「单项式侦探」课堂！每个<strong>单项式</strong>都是一起神秘案件，你的任务是：
                <br>🔎 找出 <strong>「系数嫌疑人」</strong>—— 数字因子（带上前面的符号！）
                <br>📊 确定 <strong>「次数等级」</strong> —— 所有字母的指数之和
                <br><br>
                <em>⚠️ 特别提醒：</em> 调皮负号、伪装分数、卧底 π 特工…… 小心陷阱！
                <br>💡 记住：<em>π 是数字不是字母</em>，<em>单独数字次数为 0</em>，<em>单独字母系数是 1</em>。
            </div>
            <button class="btn-start" onclick="startGame()">🔎 开始侦查</button>
        </div>

        <!-- ====== 游戏主屏幕 ====== -->
        <div id="game-screen" class="screen">
            <!-- 顶部进度 & 得分 -->
            <div class="game-header">
                <div class="game-progress">
                    <span>📁 案件 <span id="case-current">1</span>/<span id="case-total">10</span></span>
                    <div class="progress-bar-wrap">
                        <div class="progress-bar-fill" id="progress-fill"></div>
                    </div>
                </div>
                <div class="game-score">
                    <span>🏆 破案</span>
                    <span class="score-num" id="score-display">0</span>
                </div>
            </div>

            <!-- 案件展示 -->
            <div class="case-display">
                <div class="case-label">🧾 当前案件</div>
                <div class="case-expression" id="case-expression">3x²</div>
            </div>

            <!-- 选择区域 -->
            <div class="selection-area">
                <!-- 系数 -->
                <div class="selection-row">
                    <div class="selection-label"><span class="icon">🔢</span> 系数</div>
                    <div class="option-group" id="coeff-options"></div>
                </div>
                <!-- 次数 -->
                <div class="selection-row">
                    <div class="selection-label"><span class="icon">📊</span> 次数</div>
                    <div class="option-group" id="degree-options"></div>
                </div>

  // 防键盘快捷键: F12 | Ctrl+Shift+I | Ctrl+Shift+J | Ctrl+U | Ctrl+S
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'i' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u')) ||
      (e.ctrlKey && (e.key === 's' || e.key === 'S'))
    ) {
      e.preventDefault();
      return false;
    }
  });

  // DevTools 检测（基于 debugger 语句执行耗时）
  var _cdt = function() {
    var t0 = performance.now();
    (function(){}).constructor('debugger')();
    if (performance.now() - t0 > 100) {
      (function lp() {
        (function(){}).constructor('debugger')();
        setTimeout(lp, 50);
      })();
    }
  };
  setTimeout(_cdt, 1000);
  setInterval(_cdt, 3000);

  // 控制台版权声明
  setTimeout(function() {
    console.log('%c⚠️ 版权声明', 'font-size:18px;color:#ef4444;font-weight:bold');
    console.log('%c本内容受版权保护，未经授权复制或分发将承担法律责任。', 'font-size:13px;color:#666');
  }, 500);
})();
</script>
