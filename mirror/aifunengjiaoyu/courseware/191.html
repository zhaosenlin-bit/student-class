<style>
/* ============ CSS Reset & Base ============ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-deep: #060b14;
  --bg-panel: #0d1b2a;
  --bg-panel-alt: #111d30;
  --border: #1a3050;
  --text: #d0d8e8;
  --text-dim: #7a8a9e;
  --accent: #00b4d8;
  --accent2: #ff6b35;
  --accent3: #4caf50;
  --accent4: #ffd166;
  --danger: #e63946;
  --equator: #ff4444;
  --tropic: #ff8c00;
  --polar: #4dc9f6;
  --terminator: #ff6600;
  --sunray: #ffdd57;
  --meridian: rgba(255,255,255,0.15);
  --panel-width-left: 290px;
  --panel-width-right: 310px;
  --header-h: 46px;
  --transition: 0.25s ease;
}

html, body { height: 100%; overflow: hidden; font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Helvetica Neue", sans-serif; background: var(--bg-deep); color: var(--text); }

/* ============ App Layout ============ */
#app { display: flex; flex-direction: column; height: 100%; }

/* Mobile Header */
#mobile-header { display: none; height: var(--header-h); background: var(--bg-panel); border-bottom: 1px solid var(--border); align-items: center; padding: 0 12px; gap: 10px; z-index: 100; }
#mobile-header h1 { font-size: 15px; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#mobile-header button { background: var(--bg-panel-alt); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; }

/* Main Layout */
#main-layout { display: flex; flex: 1; overflow: hidden; position: relative; }

/* Left Panel */
#left-panel {
  width: var(--panel-width-left); min-width: var(--panel-width-left);
  background: var(--bg-panel); border-right: 1px solid var(--border);
  overflow-y: auto; overflow-x: hidden; z-index: 10;
  transition: margin-left var(--transition);
}
#left-panel.collapsed { margin-left: calc(-1 * var(--panel-width-left)); }
#left-panel::-webkit-scrollbar { width: 4px; }
#left-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Right Panel */
#right-panel {
  width: var(--panel-width-right); min-width: var(--panel-width-right);
  background: var(--bg-panel); border-left: 1px solid var(--border);
  overflow-y: auto; overflow-x: hidden; z-index: 10;
  transition: margin-right var(--transition);
}
#right-panel.collapsed { margin-right: calc(-1 * var(--panel-width-right)); }
#right-panel::-webkit-scrollbar { width: 4px; }
#right-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Center Panel */
#center-panel { flex: 1; position: relative; overflow: hidden; background: radial-gradient(ellipse at center, #0a1628 0%, #040810 100%); }
#three-container { position: absolute; inset: 0; }
#three-container canvas { display: block; }

/* CSS2D overlay */
#label-layer { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
/* Individual interactive labels override with pointer-events:auto inline */

/* Info card overlay */
#info-card {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  background: rgba(13,27,42,0.92); border: 1px solid var(--accent);
  border-radius: 12px; padding: 14px 20px; max-width: 500px;
  color: var(--text); font-size: 14px; line-height: 1.6;
  pointer-events: none; opacity: 0; transition: opacity 0.4s;
  z-index: 6; text-align: center; backdrop-filter: blur(8px);
}
#info-card.visible { opacity: 1; }
#info-card h3 { color: var(--accent); margin-bottom: 6px; font-size: 16px; }

/* Top-right buttons */
#top-btns { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; z-index: 7; }
#top-btns button {
  background: rgba(13,27,42,0.85); border: 1px solid var(--border);
  color: var(--text); padding: 6px 12px; border-radius: 6px;
  font-size: 12px; cursor: pointer; transition: all 0.2s;
  backdrop-filter: blur(4px);
}
#top-btns button:hover { border-color: var(--accent); color: var(--accent); }
#top-btns button.active { border-color: var(--accent2); color: var(--accent2); }

/* Legend overlay */
#legend { position: absolute; bottom: 14px; left: 14px; background: rgba(13,27,42,0.82); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; font-size: 11px; line-height: 1.7; z-index: 7; backdrop-filter: blur(4px); }
#legend .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }

/* ============ Panel Sections ============ */
.panel-section { padding: 12px 14px; border-bottom: 1px solid var(--border); }
.panel-section:last-child { border-bottom: none; }
.panel-section h3 {
  font-size: 13px; color: var(--accent); margin-bottom: 10px;
  text-transform: uppercase; letter-spacing: 1px;
  display: flex; align-items: center; gap: 6px;
}
.panel-section h3::before { content: ""; display: inline-block; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }

/* Control groups */
.ctrl-group { margin-bottom: 8px; }
.ctrl-group label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-dim); cursor: pointer; padding: 4px 0; }
.ctrl-group label input[type="checkbox"] { accent-color: var(--accent); width: 15px; height: 15px; cursor: pointer; }

/* Sliders */
input[type="range"] { -webkit-appearance: none; width: 100%; height: 6px; background: var(--border); border-radius: 3px; outline: none; margin: 6px 0; }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; background: var(--accent); border-radius: 50%; cursor: pointer; border: 2px solid var(--bg-deep); }

/* Buttons */
.btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.btn {
  padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg-panel-alt);
  color: var(--text); transition: all 0.2s; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(255,107,53,0.1); }
.btn.accent { border-color: var(--accent); color: var(--accent); }

/* City list */
.city-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 12px; }
.city-item .city-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.city-item label { cursor: pointer; color: var(--text-dim); }

/* ============ Right Panel Data ============ */
.data-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
.data-row .label { color: var(--text-dim); }
.data-row .value { color: var(--text); font-weight: 600; text-align: right; }
.data-value-highlight { color: var(--accent2); font-size: 14px; font-weight: 700; }

.city-card { background: var(--bg-panel-alt); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-top: 10px; }
.city-card h4 { color: var(--accent4); font-size: 14px; margin-bottom: 8px; }
.city-card .row { display: flex; justify-content: space-between; font-size: 11px; padding: 2px 0; }
.city-card .row .lbl { color: var(--text-dim); }
.city-card .status-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
.city-card .status-badge.day { background: rgba(255,221,87,0.2); color: #ffdd57; }
.city-card .status-badge.night { background: rgba(0,180,216,0.2); color: #00b4d8; }

/* ============ Step card (teaching mode) ============ */
#step-card {
  position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
  background: rgba(13,27,42,0.94); border: 1px solid var(--accent);
  border-radius: 12px; padding: 16px 24px; max-width: 440px; width: 90%;
  color: var(--text); font-size: 14px; line-height: 1.7; z-index: 8;
  transition: opacity 0.4s; opacity: 0; pointer-events: none;
  backdrop-filter: blur(8px); text-align: center;
}
#step-card.visible { opacity: 1; pointer-events: auto; }
#step-card .step-num { color: var(--accent); font-weight: 700; font-size: 13px; }
#step-card .step-title { color: var(--text); font-size: 16px; font-weight: 700; margin: 4px 0; }
#step-card .step-desc { color: var(--text-dim); font-size: 13px; }
#step-card .step-nav { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }

/* ============ Quiz modal ============ */
#quiz-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
#quiz-overlay.visible { opacity: 1; pointer-events: auto; }
#quiz-box {
  background: var(--bg-panel); border: 1px solid var(--accent); border-radius: 16px;
  padding: 24px 28px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto;
}
#quiz-box h3 { color: var(--accent); margin-bottom: 16px; font-size: 18px; }
#quiz-box .question { margin-bottom: 18px; padding: 12px; background: var(--bg-panel-alt); border-radius: 8px; }
#quiz-box .q-num { color: var(--accent2); font-weight: 700; }
#quiz-box .q-text { margin: 6px 0; font-size: 14px; }
#quiz-box .q-answer { color: var(--accent3); font-size: 12px; margin-top: 6px; display: none; }
#quiz-box .q-answer.show { display: block; }

/* Full screen overlay labels */
#fullscreen-label {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
  color: var(--accent); font-size: 13px; z-index: 6; display: none;
  background: rgba(13,27,42,0.85); padding: 6px 16px; border-radius: 20px;
  pointer-events: none;
}

/* ============ Responsive ============ */
@media (max-width: 1200px) {
  :root { --panel-width-left: 250px; --panel-width-right: 280px; }
  #left-panel { font-size: 11px; }
  #right-panel { font-size: 11px; }
}

@media (max-width: 900px) {
  #mobile-header { display: flex; }
  #left-panel {
    position: fixed; left: 0; top: var(--header-h); bottom: 0;
    z-index: 50; margin-left: calc(-1 * var(--panel-width-left));
  }
  #left-panel.open { margin-left: 0; }
  #right-panel {
    position: fixed; right: 0; top: var(--header-h); bottom: 0;
    z-index: 50; margin-right: calc(-1 * var(--panel-width-right));
  }
  #right-panel.open { margin-right: 0; }
  #main-layout { flex-direction: column; }
  #center-panel { flex: 1; }
}

@media (max-width: 600px) {
  :root { --panel-width-left: 260px; --panel-width-right: 270px; }
  #top-btns { top: 50px; right: 6px; flex-wrap: wrap; }
  #top-btns button { font-size: 11px; padding: 4px 8px; }
  #info-card { top: 8px; max-width: 92%; font-size: 12px; padding: 10px 14px; }
  #legend { bottom: 6px; left: 6px; font-size: 10px; padding: 6px 10px; }
}
</style>
