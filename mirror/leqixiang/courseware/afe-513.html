<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>安培定则 · 交互式教学</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-deep: #f5f7fc;
      --bg-panel: #ffffff;
      --bg-panel-alt: #eef1f7;
      --border: #d0d8e8;
      --text: #1a2a3a;
      --text-dim: #5a6a7e;
      --accent: #1e88e5;
      --accent2: #f57c00;
      --accent3: #43a047;
      --accent4: #fdd835;
      --danger: #e53935;
      --panel-width: 280px;
      --header-h: 48px;
      --transition: 0.25s ease;
      --radius: 12px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    html, body {
      height: 100%;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* 沉浸式顶部控件条 */
    #control-bar {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 18px;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: var(--shadow);
      pointer-events: auto;
      flex-wrap: wrap;
      justify-content: center;
    }

    #control-bar .btn-group {
      display: flex;
      gap: 4px;
      background: var(--bg-panel-alt);
      border-radius: 30px;
      padding: 3px;
    }

    #control-bar .btn {
      padding: 6px 16px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-dim);
      transition: all 0.2s;
      white-space: nowrap;
      letter-spacing: 0.3px;
    }

    #control-bar .btn.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 2px 8px rgba(30, 136, 229, 0.25);
    }

    #control-bar .btn:hover:not(.active) {
      color: var(--text);
      background: rgba(30, 136, 229, 0.08);
    }

    #control-bar .sep {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 4px;
    }

    #control-bar .label {
      font-size: 12px;
      color: var(--text-dim);
      margin-right: 2px;
    }

    /* 3D视口 */
    #viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg-deep);
      cursor: grab;
    }

    #viewport:active {
      cursor: grabbing;
    }

    #viewport canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* 信息浮卡 (左下角) */
    #info-float {
      position: absolute;
      bottom: 24px;
      left: 24px;
      z-index: 15;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: var(--radius);
      padding: 14px 20px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: var(--shadow);
      max-width: 260px;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    #info-float h4 {
      font-size: 14px;
      color: var(--accent);
      margin-bottom: 6px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    #info-float p {
      font-size: 13px;
      color: var(--text);
      line-height: 1.5;
      margin: 2px 0;
    }

    #info-float .dim {
      color: var(--text-dim);
      font-size: 12px;
    }

    /* 右下角操作提示 */
    #hint {
      position: absolute;
      bottom: 24px;
      right: 24px;
      z-index: 15;
      font-size: 12px;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      padding: 6px 14px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      pointer-events: none;
    }

    /* 移动端适配 */
    @media (max-width: 700px) {
      #control-bar {
        top: 12px;
        padding: 6px 14px;
        gap: 8px;
        border-radius: 30px;
        width: 92%;
      }

      #control-bar .btn {
        font-size: 12px;
        padding: 4px 12px;
      }

      #info-float {
        bottom: 16px;
        left: 16px;
        padding: 10px 14px;
        max-width: 200px;
      }

      #info-float h4 {
        font-size: 12px;
      }

      #info-float p {
        font-size: 12px;
      }

      #hint {
        display: none;
      }
    }

    @media (max-width: 480px) {
      #control-bar .btn {
        font-size: 11px;
        padding: 3px 10px;
      }
      #control-bar .label {
        display: none;
      }
    }
  </style>
</head>
