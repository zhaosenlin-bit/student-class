<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>平行四边形面积 · 可拖拽顶点</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #f5f9ff 0%, #e6edf7 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .card {
            max-width: 950px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            padding: 30px 30px 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 20, 40, 0.35),
                        0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            transition: all 0.2s ease;
        }

        h1 {
            font-weight: 600;
            font-size: 2.2rem;
            letter-spacing: -0.01em;
            color: #13294b;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 400;
            background: #d0e0f0;
            padding: 6px 18px;
            border-radius: 40px;
            color: #1a3a5c;
            letter-spacing: 0.3px;
        }

        .sub {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
            color: #2a4a6a;
        }
        .formula-badge {
            background: #ffffffcc;
            backdrop-filter: blur(4px);
            padding: 8px 20px;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 500;
            box-shadow: 0 4px 8px rgba(0,0,0,0.02);
            border: 1px solid #ffffff;
            color: #0f2a44;
        }
        .formula-badge span {
            font-weight: 700;
            color: #b22234;
        }

        .canvas-wrapper {
            background: #ffffff;
            border-radius: 36px;
            padding: 16px 16px 10px 16px;
            box-shadow: 0 12px 28px rgba(0, 20, 40, 0.12), 0 0 0 1px rgba(255,255,255,0.8) inset;
            margin-bottom: 12px;
        }

        canvas {
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 900 / 480;
            border-radius: 24px;
            background: #fcfdff;
            cursor: grab;
            touch-action: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        canvas:active {
            cursor: grabbing;
        }

        .control-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 20px 16px;
            padding: 12px 8px 0 8px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background: white;
            border: none;
            padding: 10px 22px;
            border-radius: 60px;
            font-weight: 550;
            font-size: 0.95rem;
            color: #13294b;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.02), 0 0 0 1px #d9e2ed;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            background: #f8faff;
        }
        .btn:hover {
            background: #ffffff;
            box-shadow: 0 8px 18px rgba(0, 20, 40, 0.08), 0 0 0 1px #b0c8dd;
            transform: scale(0.97);
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn-primary {
            background: #1f3a5f;
            color: white;
            box-shadow: 0 6px 14px rgba(20, 50, 80, 0.25), 0 0 0 1px #2d4b72;
        }
        .btn-primary:hover {
            background: #264771;
            box-shadow: 0 10px 20px rgba(20, 50, 80, 0.3);
        }
        .btn-accent {
            background: #0f6e4f;
            color: white;
            box-shadow: 0 6px 14px rgba(15, 110, 79, 0.3), 0 0 0 1px #1a8a64;
        }
        .btn-accent:hover {
            background: #14865f;
            box-shadow: 0 8px 20px rgba(15, 110, 79, 0.35);
        }

        .slider-group {
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(2px);
            padding: 4px 16px 4px 20px;
            border-radius: 60px;
            border: 1px solid #eaf0f8;
        }
        .slider-group label {
            font-weight: 500;
            color: #1f3a5f;
            font-size: 0.95rem;
        }
        input[type="range"] {
            width: 140px;
            height: 6px;
            -webkit-appearance: none;
            background: #cbdae9;
            border-radius: 10px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #1f3a5f;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            cursor: grab;
        }
        .value-indicator {
            min-width: 36px;
            font-weight: 600;
            color: #13294b;
        }

        .legend {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            padding: 6px 10px 0 10px;
            font-size: 0.9rem;
            color: #2a4a6a;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .color-dot {
            width: 16px;
            height: 16px;
            border-radius: 6px;
        }

        .status-tip {
            background: #eef4fa;
            border-radius: 30px;
            padding: 6px 20px;
            font-size: 0.9rem;
            color: #1f3a5f;
            border: 1px solid #dae3ee;
        }

        @media (max-width: 650px) {
            .card { padding: 20px 16px; }
            h1 { font-size: 1.8rem; }
            .slider-group { padding: 4px 12px; }
            input[type="range"] { width: 100px; }
        }
    </style>
</head>

        <h1>
            📐 平行四边形面积
            <small>拖拽顶点 · 改变底高</small>
        </h1>
        <div class="sub">
            <div class="formula-badge">
                S = <span id="baseDisplay">380</span> × <span id="heightDisplay">180</span> = <span id="areaDisplay">68400</span>
            </div>
            <div class="status-tip" id="statusTip">↔️ 拖拽橙色圆点改变形状</div>

        <div class="canvas-wrapper">
            <canvas id="canvas" width="900" height="480"></canvas>
        </div>

        <div class="control-bar">
            <div class="btn-group">
                <button class="btn" id="resetBtn">⟲ 重置</button>
                <button class="btn btn-accent" id="randomBtn">🎲 随机形状</button>
                <button class="btn btn-primary" id="animateBtn">▶ 动画推导</button>
            </div>
            <div class="slider-group">
                <label for="progressSlider">割补</label>
                <input type="range" id="progressSlider" min="0" max="100" value="0" step="1">
                <span class="value-indicator" id="progressValue">0%</span>
            </div>
        </div>

        <div class="legend">
            <span class="legend-item"><span class="color-dot" style="background:#2a6f97;"></span> 平行四边形</span>
            <span class="legend-item"><span class="color-dot" style="background:#e67e22;"></span> 割补三角形</span>
            <span class="legend-item"><span class="color-dot" style="background:#1e6f5c;"></span> 矩形 (底×高)</span>
            <span class="legend-item"><span class="color-dot" style="background:#c0392b; border-radius:50%; width:14px; height:14px;"></span> 拖拽顶点</span>
        </div>
    </div>
