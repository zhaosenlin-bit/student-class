function SetParameters(){
	Capacitance = PossibleCapacitances[capacitancenumber];
	if (Capacitance >= 1.0e-6){
		DisplayCapacitance = Capacitance*1.0e6;
		DisplayCapwithText = DisplayCapacitance.toFixed(0) + " µF";
	}
	else{
		DisplayCapacitance = Capacitance*1.0e9;
		DisplayCapwithText = DisplayCapacitance.toFixed(0) + " nF";
	}
	
	Inductance = PossibleInductances[inductornumber];
	DisplayInductance = Inductance*1.0e3;
	DisplayIndwithText = DisplayInductance.toFixed(0) + " mH";
	
	
	if (ReplaceResistorText == "Remove Resistor"){
		ResistanceEx = (BandOneA*10+BandTwoA)*Math.pow(10,BandThreeA);
		Resistance = ResistanceEx;
	}
	else{
		Resistance = 0;
	}
	
	if (Resistance >= 1000){
		DisplayResistance = Resistance/1000;
		DisplayReswithText = DisplayResistance.toFixed(0) + " kΩ";
	}
	else{
		DisplayResistance = Resistance/1.0;
		DisplayReswithText = DisplayResistance.toFixed(1) + " Ω";
	}
	
	Voltage = PossibleVoltages[voltnumber];
	Voltagerms = Voltage/Math.pow(2.0,0.5);
	ImpedanceC = Math.pow((2*Math.PI*Frequency*Capacitance),-1.0);
	
	if (ReplaceInductorText == "Remove Inductor"){
		ImpedanceL = Math.pow((2*Math.PI*Frequency*Inductance),1.0);
	}
	else{
		ImpedanceL = 0;
	}
	
	
	TotalImpedance = Math.pow((Math.pow(Resistance,2.0)+Math.pow(ImpedanceL,2.0)),0.5);
	Current = Voltagerms/TotalImpedance;
	CurrentmA = Current*1000;
	Currentmax = Current*Math.pow(2.0,0.5);
	CurrentmAmax = CurrentmA*Math.pow(2.0,0.5);
	VRrms = Current*Resistance;
	VRmax = VRrms*Math.pow(2.0,0.5);
	VCrms = Current*ImpedanceC;
	VCmax = VCrms*Math.pow(2.0,0.5);
	VLrms = Current*ImpedanceL;
	VLmax = VLrms*Math.pow(2.0,0.5);
	
	
	phaseangle = Math.atan(1.0*ImpedanceL/Resistance);
	
	if (CurrentmAmax > 950){
		MaxYCurrent = 10000;
		IncYCurrent = MaxYCurrent/BigLinesY;
	}
	else if (CurrentmAmax > 95){
		MaxYCurrent = 1000;
		IncYCurrent = MaxYCurrent/BigLinesY;
	}
	else if (CurrentmAmax > 9.5){
		MaxYCurrent = 100;
		IncYCurrent = 100/BigLinesY;
	}
	else if (CurrentmAmax > 0.95){
		MaxYCurrent = 10;
		IncYCurrent = 10/BigLinesY;
	}
	else {
		MaxYCurrent = 1;
		IncYCurrent = 1/BigLinesY;
	}
	
	drawingpart();
}

function LoadIt(){
document.getElementById("LabSection").style.visibility = "visible";

function drawingpart(){
			
	ctx.fillStyle = "#ffffff";
	ctx.fillRect(0,0,950,600);
	
	
	// Draw Wires	
	
	// Black Wire
	
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 4;
	ctx.beginPath();
	ctx.moveTo(LeftCircuit, BottomCircuit);
	ctx.lineTo(LeftCircuit, TopCircuit);
	ctx.lineTo(RightCircuit, TopCircuit);
	ctx.lineTo(RightCircuit, BottomCircuit);
	ctx.lineTo(LeftCircuit, BottomCircuit);
	ctx.stroke();
	
	if (ReplaceResistorText == "Remove Resistor"){
		DrawResistor(250, TopCircuit, 100);
	}
	
	if (ReplaceInductorText == "Remove Inductor"){
		DrawInductor(550,TopCircuit,100);
	}
	
	
	
	//DrawCapacitor(600,TopCircuit,100);
	
	

	DrawACPowerSupply(400, BottomCircuit, 100);
	
	if (Displaying == "Resistor"){
		ctx.globalAlpha = 0.8;
		
		ctx.fillStyle = "#ffffff";
		ctx.fillRect(0,0,950,600);
		
		ctx.globalAlpha = 1.0;
		
		DrawRealResistor(450, 300, 300, BandOneA, BandTwoA, BandThreeA, BandFourA);
	}
	else{
		DrawArrow(300, 480, 100, 50, "#000099", Math.PI);
	
		DrawArrow(600, 480, 100, 50, "#000099", 0.0*Math.PI);
	}
	
	if (ReplaceInductorText == "Remove Inductor"){
		WriteText(100,50,ReplaceResistorText,18,"#000000",0.5,ProgramFont);
	}
	
	if (ReplaceResistorText == "Remove Resistor"){
		WriteText(800,50,ReplaceInductorText,18,"#000000",0.5,ProgramFont);
	}
	

	drawingpart2();
}

function drawingpart2(){
	ctx2.fillStyle = "#ffffff";
	ctx2.fillRect(0,0,950,600);
	DrawAxes();
	for (i=0; i<900; i++){
		timepassed = i/900*MaxX;
		ResV[i] = Currentmax*Resistance*Math.sin(2*Math.PI*Frequency*timepassed);
		CapV[i] = -1.0*Currentmax*ImpedanceC*Math.cos(2*Math.PI*Frequency*timepassed);
		IndV[i] = 1.0*Currentmax*ImpedanceL*Math.cos(2*Math.PI*Frequency*timepassed);
		TotV[i] = ResV[i] + IndV[i];
		CurrentValues[i] = CurrentmAmax*Math.sin(2*Math.PI*Frequency*timepassed);
	}
	if (ShowResistorGraph == "yes"){
		PlotResistorVolts();
	}
	
	if (ShowCapacitorGraph == "yes"){
		PlotCapacitorVolts();
	}
	
	if (ShowInductorGraph == "yes"){
		PlotInductorVolts();
	}
	
	if (ShowTotalGraph == "yes"){
		PlotPowerSupplyVolts();
	}
	
	WriteText2(500,30,"Click on Graph Name You Want to Toggle",24,"#000000",0.5,ProgramFont);

	WriteText2(200,70,"Current",24,CurrentTextColor,0.5,ProgramFont);
	
	WriteText2(400,70,"Resistor",24,ResistorTextColor,0.5,ProgramFont);
	
	WriteText2(600,70,"Inductor",24,InductorTextColor,0.5,ProgramFont);
	
	WriteText2(800,70,"Total",24,TotalTextColor,0.5,ProgramFont);
	
	if (ShowCurrentGraph == "yes"){
		ctx2.globalAlpha = 0.75;
		ctx2.fillStyle = "#ffffff";
		ctx2.fillRect(0,90,950,510);
		DrawCurrentAxes();
		PlotCurrentValues();
		ctx2.globalAlpha = 1.0;
	}

}

function PlotPowerSupplyVolts(){
	ctx2.strokeStyle = "#990000";
	ctx2.lineWidth = 2;
	XPlot = LeftGrid + 0/MaxX*WidthGrid;
	YPlot = MidY + 0.5*TotV[0]/MaxY*HeightGrid;
	ctx2.beginPath();
	ctx2.moveTo(XPlot, YPlot);
	for (i=0; i<900; i++){
		timepassed = i/900*MaxX;
		XPlot = LeftGrid + timepassed/MaxX*WidthGrid;
		YPlot = MidY + 0.5*TotV[i]/MaxY*HeightGrid;
		ctx2.lineTo(XPlot, YPlot);
	}
	ctx2.stroke();
}

function DrawAxes(){
	
	/* Main X and Y */
	ctx2.lineWidth = 3;
	ctx2.strokeStyle = "#000000";
	ctx2.beginPath();
	ctx2.moveTo(LeftGrid,MidY);
	ctx2.lineTo(RightGrid+20,MidY);
	ctx2.moveTo(RightGrid+10,MidY-10);
	ctx2.lineTo(RightGrid+20,MidY);
	ctx2.lineTo(RightGrid+10,MidY+10);
	
	ctx2.moveTo(LeftGrid,BottomGrid+20);
	ctx2.lineTo(LeftGrid,TopGrid-20);
	ctx2.moveTo(LeftGrid-10,BottomGrid+10);
	ctx2.lineTo(LeftGrid,BottomGrid+20);
	ctx2.lineTo(LeftGrid+10,BottomGrid+10);
	
	ctx2.moveTo(LeftGrid-10,TopGrid-10);
	ctx2.lineTo(LeftGrid,TopGrid-20);
	ctx2.lineTo(LeftGrid+10,TopGrid-10);
	ctx2.stroke();
	
	/* Vertical Lines */
	
	
	for (i = 0; i < BigLinesX+1; i++){
		
		if (i < (BigLinesX)){
			for (j = 0; j<LinesBetweenX; j++){
				if (j == 5){
					ctx2.lineWidth = 1;
					ctx2.strokeStyle = "#000000";
				}
				else{
					ctx2.lineWidth = 1;
					ctx2.strokeStyle = "#999999";
				}
				ctx2.beginPath();
				ctx2.moveTo(LeftGrid+i*XSpace+j*XSpace/LinesBetweenX,TopGrid);
				ctx2.lineTo(LeftGrid+i*XSpace+j*XSpace/LinesBetweenX,BottomGrid);
				ctx2.stroke();
			}
		}
		
		ctx2.lineWidth = 2;
		ctx2.strokeStyle = "#000000";
		ctx2.beginPath();
		ctx2.moveTo(LeftGrid+i*XSpace,TopGrid);
		ctx2.lineTo(LeftGrid+i*XSpace,BottomGrid+5);
		ctx2.stroke();
		
		if (i > 0){
			ctx2.font = FontSizeNumbers + "px Arial";
			ctx2.fillStyle="#000000";
			temptext = (i*IncX).toFixed(3);
			metrics = ctx2.measureText(temptext);
			textWidth = metrics.width;
			xposition = LeftGrid+i*XSpace - textWidth/2;
			ctx2.fillText(temptext,xposition, BottomGrid+2*FontSizeNumbers);
		}
		
		
	}
	
	ctx2.font = FontSizeVariables + "px Arial";
	ctx2.fillStyle="#000000";
	temptext = "Time (s) ";
	metrics = ctx2.measureText(temptext);
	textWidth = metrics.width;
	xposition = MidX - textWidth/2;
	ctx2.fillText(temptext,xposition, BottomGrid + 50);
	
	for (i = 0; i < BigLinesY+1; i++){
		
		if (i < BigLinesY){
			for (j = 0; j<LinesBetweenY; j++){
				if (j == 5){
					ctx2.lineWidth = 1;
					ctx2.strokeStyle = "#000000";
				}
				else{
					ctx2.lineWidth = 1;
					ctx2.strokeStyle = "#999999";
				}
				ctx2.beginPath();
				ctx2.moveTo(LeftGrid,TopGrid+i*YSpace+j*YSpace/LinesBetweenY);
				ctx2.lineTo(RightGrid,TopGrid+i*YSpace+j*YSpace/LinesBetweenY);
				ctx2.stroke();
			}
		}
		
		ctx2.lineWidth = 1;
		ctx2.strokeStyle = "#000000";
		ctx2.beginPath();
		ctx2.moveTo(LeftGrid-5,TopGrid+i*YSpace);
		ctx2.lineTo(RightGrid,TopGrid+i*YSpace);
		ctx2.stroke();
		
		ctx2.font = FontSizeNumbers + "px Arial";
		ctx2.fillStyle="#000000";
		temptext = (MaxY - 2*i*IncY).toFixed(0);
		metrics = ctx2.measureText(temptext);
		textWidth = metrics.width;
		xposition = LeftGrid-FontSizeNumbers - textWidth;
		ctx2.fillText(temptext,xposition, TopGrid+i*YSpace+2);
		
	}
	
	ctx2.font = FontSizeVariables + "px Arial";
	ctx2.fillStyle="#000099";
	temptext = "Potential (V) ";
	metrics = ctx2.measureText(temptext);
	textWidth = metrics.width;
	xposition = LeftGrid - 50;
	yposition = MidY + textWidth;
	ctx2.save();
	ctx2.translate(xposition, yposition);
	ctx2.rotate(3*Math.PI/2);
	ctx2.fillText(temptext,50,0);
	ctx2.restore();


}

function DrawACPowerSupply(x, y, w){
	h = 0.25*w;
	ps = w/100;
	ctx.strokeStyle = "#000000";
	ctx.fillStyle = "#FFFFFF";
	ctx.lineWidth = 4*ps;
	ctx.beginPath();
	ctx.arc(x+50*ps, y, 40*ps, 0, 2*Math.PI);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	
	ctx.beginPath();
	ctx.moveTo(x, y);
	ctx.lineTo(x+10*ps, y);
	ctx.stroke();
	ctx.closePath();
	ctx.beginPath();
	ctx.moveTo(x+20*ps, y);
	ctx.bezierCurveTo(x+30*ps, y-h, x+40*ps, y-h, x+50*ps, y);
	ctx.bezierCurveTo(x+60*ps, y+h, x+70*ps, y+h, x+80*ps, y);
	ctx.stroke();
	ctx.closePath();
	ctx.beginPath();
	ctx.moveTo(x+90*ps, y);
	ctx.lineTo(x+100*ps, y);
	ctx.stroke();
	ctx.closePath();
	
	WriteText(x+50*rs,y-2.5*h,Voltagerms.toFixed(3) + " V",32,"#990000",0.5);
	WriteText(x+0.5*w,y+1.2*w,Frequency.toFixed(0) + " Hz",32,"#000000",0.5,ProgramFont);

}

function SwitchFrequency(x){
	Frequency = Frequency + x;
	if (Frequency < 100){
		Frequency = 100;
	}
	if (Frequency > 2000){
		Frequency = 2000;
	}
	SetParameters();
}

function ChangeBand(x){
	if (x == 1){
		BandOneA--;
		if (BandOneA < 1){
			BandOneA = 9;
		}
	}
	if (x == 2){
		BandTwoA--;
		if (BandTwoA < 0){
			BandTwoA = 9;
		}
	}
	if (x == 3){
		BandThreeA--;
		if (BandThreeA < 0){
			BandThreeA = 2;
		}
	}
	
	SetParameters();
}

function RemoveResistor(){

		document.getElementById("RemoveInductorButton").style.visibility = "visible";
	}
	SetParameters();
}

}

function WriteText(x,y,t,s,c,m,ff){
	ctx.fillStyle = c;
	ctx.font= s + "px " + ff;
	temptext = t;
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x - m*textWidth;
	ctx.fillText(temptext,xposition, y);
}

function WriteText2(x,y,t,s,c,m,ff){
	ctx2.fillStyle = c;
	ctx2.font= s + "px " + ff;
	temptext = t;
	metrics = ctx2.measureText(temptext);
	textWidth = metrics.width;
	xposition = x - m*textWidth;
	ctx2.fillText(temptext,xposition, y);
}

function DrawArrow(x, y, h, w, c, r){
	ctx.save();
	ctx.translate(x, y+0.5*h);
	ctx.rotate(r);
	ctx.fillStyle = c;
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 1;
	ctx.beginPath();
	ctx.moveTo(0,-0.5*h);
	ctx.lineTo(0+w, -0.5*h+w);
	ctx.lineTo(0+0.5*w, -0.5*h+w);
	ctx.lineTo(0+0.5*w, -0.5*h+h);
	ctx.lineTo(0-0.5*w, -0.5*h+h);
	ctx.lineTo(0-0.5*w, -0.5*h+w);
	ctx.lineTo(0-w, -0.5*h+w);
	ctx.lineTo(0,-0.5*h);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	ctx.restore();
}


function DrawRectangle(xrect, yrect, wrect, hrect, curverectangle, lcolor, fcolor, lwid){
	ctx.fillStyle = fcolor;
	ctx.strokeStyle = lcolor;
	ctx.lineWidth = lwid;
	ctx.beginPath();
	ctx.moveTo(xrect+curverectangle, yrect);
	ctx.lineTo(xrect+wrect-curverectangle, yrect);
	ctx.arc(xrect+wrect-curverectangle, yrect+curverectangle, curverectangle, 1.5*Math.PI, 0*Math.PI, false);
	ctx.lineTo(xrect+wrect, yrect+hrect-curverectangle);
	ctx.arc(xrect+wrect-curverectangle, yrect+hrect-curverectangle, curverectangle, 0.0*Math.PI, 0.5*Math.PI, false);
	ctx.lineTo(xrect+curverectangle, yrect+hrect);
	ctx.arc(xrect+curverectangle, yrect+hrect-curverectangle, curverectangle, 0.5*Math.PI, 1.0*Math.PI, false);
	ctx.lineTo(xrect, yrect+curverectangle);
	ctx.arc(xrect+curverectangle, yrect+curverectangle, curverectangle, 1.0*Math.PI, 1.5*Math.PI, false);
	ctx.stroke();
	ctx.fill();
}
