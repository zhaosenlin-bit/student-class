<body>
	<div id="info" style="text-align: center"> 
		<h1 style="text-align: center;"> Measure the coefficient of static friction</h1>
		<button class="btn btn-warning" onclick="alert(
		  'To measure the coefficient of static friction using a simple method, you can use an inclined plane and a block. Gradually increase the angle of the plane until the block begins to slide.\n\n' +
		  'At that critical angle, the coefficient of static friction is calculated as:\n\n' +
		  '    μₛ = tan(θ)\n\n' +
		  'From this formula, we can see that the coefficient of static friction depends only on the angle θ, and is independent of the block’s mass. Changing the block’s mass does not affect the result.'
		)">
		  ℹ️ Read Instruction
		</button>

		Raise Plane Angle: 
			<div class="slider-container">
			    <input type="range" id="angle" min="0" max="50" step="0.05" value="0">

			</div> <br>
		Change Block's Mass:

			    <input type="range" id="size" min="8" max="16" step="0.5" value="12">

			</div> <br>
		
		Student's name: <input type="text" id="studentname" value="">

		<input type="text" id="result" value="">
		<input type="checkbox" name="check-box" id="check-box">
		<button class="btn btn-default" id="reset" >Reset</button>
		<canvas id="canvas"></canvas>
	</div>
