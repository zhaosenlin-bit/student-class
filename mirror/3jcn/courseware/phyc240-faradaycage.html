    <h1>Faraday Cage</h1>
    <p>On a stormy day, you are protected inside a Faraday cage. Drag screen to hear thunder sounds.</p>

    <button id="btnInfo" class="btn btn-info" style="padding:6px 12px; font-size:14px;">
      What is a Faraday cage?
    </button>
    
  </div>

  <script>
    document.getElementById("btnInfo").addEventListener("click", () => {
         alert(
      "WHAT IS A FARADAY CAGE?\n\n" +
      "A Faraday cage is an enclosure made of conducting material (metal mesh or a solid conductor).\n\n" +
      "PHYSICS: WHY IT BLOCKS AN EXTERNAL ELECTRIC FIELD\n" +
      "1) In a conductor, free electrons can move.\n" +
      "2) When an external electric field is applied, charges quickly rearrange on the OUTSIDE surface.\n" +
      "3) This rearranged surface charge creates its own electric field that cancels the external field inside.\n" +
      "4) In electrostatic equilibrium, the electric field inside the conductor’s material is E = 0, so the cavity is shielded.\n\n" +
      "LIGHTNING CONNECTION\n" +
      "A lightning strike deposits charge on the outside. The current flows along the exterior surface, so the inside stays near zero field.\n\n" +
      "NOTE: For high-frequency waves (radio/microwave), shielding depends on the metal and mesh hole size—smaller holes block higher frequencies better."
    );
    });
  </script>
