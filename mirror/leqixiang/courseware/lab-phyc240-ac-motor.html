<body>
 <div id="info">
  <h1>How AC Motors Work?</h1>
<button class="btn btn-primary"
  onclick="alert(`AC Motor

What is it?
An AC motor converts alternating-current electrical energy into rotary motion using alternating magnetic forces.

How it works:
1) The stator (outer horseshoe magnet) provides a magnetic field with N (red) and S (blue) poles.
2) The rotor (yellow coil loop) is connected to slip rings and brushes, allowing continuous AC current to flow into the rotating coil.
3) When AC flows through the coil, the current direction alternates each half-cycle.
4) As current changes direction, the sides of the coil experience alternating Lorentz forces inside the magnetic field.
   - On one side, the force pushes upward, and on the other, downward.
   - With AC reversal, the forces also reverse, but they still produce a torque in the same rotational direction.
5) This continuous torque keeps the rotor spinning smoothly without the need for a commutator (unlike in a DC motor).
6) The rotation speed depends on the AC supply frequency and motor load.

In this simulation:
- Press **Start** to run the motor.
- Use **Flip Magnet** to reverse the stator polarity.
- **Pause** stops rotation.
