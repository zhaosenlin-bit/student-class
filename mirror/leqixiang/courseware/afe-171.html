<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学概念大决斗 · 倒计时抢答</title>
    <style>
        /* ===== 全局 ===== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f2e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .game-container {
            width: 1300px;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(8px);
            border-radius: 56px;
            padding: 30px 35px 40px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 2px rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.3s;
        }

        /* ===== 标题 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 18px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.06);
            margin-bottom: 22px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .title {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .title h1 {
            font-size: 26px;
            font-weight: 700;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .title .badge {
            background: rgba(255, 200, 50, 0.15);
            border: 1px solid rgba(255, 200, 50, 0.3);
            border-radius: 30px;
            padding: 4px 16px;
            font-size: 14px;
            color: #ffd966;
            font-weight: 600;
        }
        .progress-info {
            color: #9aa8c7;
            font-size: 16px;
            font-weight: 500;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .progress-info span {
            color: #fff;
            font-weight: 700;
        }

        /* ===== 竞技场 ===== */
        .arena {
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: 20px;
            margin-bottom: 18px;
        }
        /* 玩家卡片 */
        .player-card {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 40px;
            padding: 20px 18px 22px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 0;
        }
        .player-card.p1 {
            background: linear-gradient(160deg, rgba(46, 125, 50, 0.15), rgba(27, 94, 32, 0.08));
            border-color: rgba(76, 175, 80, 0.2);
        }
        .player-card.p2 {
            background: linear-gradient(160deg, rgba(233, 30, 99, 0.13), rgba(156, 39, 176, 0.08));
            border-color: rgba(244, 143, 177, 0.2);
        }
        .player-card .role-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .player-card .player-name {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-top: 6px;
        }
        .p1 .player-name {
            color: #81c784;
        }
        .p2 .player-name {
            color: #f48fb1;
        }
        /* 角色形象容器 (原有 + emoji表情覆盖) */
        .character {
            width: 140px;
            height: 160px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin: 4px 0 6px;
        }
        .character-emoji {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            z-index: 10;
            display: none;
            pointer-events: none;
            animation: popIn 0.4s ease;
        }
        .character-emoji.show {
            display: block;
        }
        @keyframes popIn {
            0% { transform: translateX(-50%) scale(0); opacity: 0; }
            60% { transform: translateX(-50%) scale(1.3); opacity: 1; }
            100% { transform: translateX(-50%) scale(1); }
        }

        .hulk-body {
            position: relative;
            width: 100px;
            height: 130px;
        }
        .hulk-head {
            width: 70px;
            height: 60px;
            background: #4caf50;
            border-radius: 50% 50% 45% 45%;
            margin: 0 auto 2px;
            position: relative;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
            border: 2px solid #388e3c;
        }
        .hulk-hair {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            width: 72px;
            height: 28px;
            background: #1b1b1b;
            border-radius: 50% 50% 0 0;
            clip-path: polygon(0% 70%, 12% 40%, 25% 65%, 38% 30%, 50% 60%, 62% 25%, 75% 55%, 88% 35%, 100% 70%, 100% 100%, 0% 100%);
        }
        .hulk-eyebrow {
            position: absolute;
            top: 14px;
            left: 8px;
            width: 52px;
            height: 8px;
            display: flex;
            justify-content: space-between;
            transition: all 0.3s;
        }
        .hulk-eyebrow span {
            display: block;
            width: 20px;
            height: 6px;
            background: #1b1b1b;
            border-radius: 4px;
            transform: rotate(-4deg);
            transition: all 0.3s;
        }
        .hulk-eyebrow span:last-child {
            transform: rotate(4deg);
        }
        .hulk-eye {
            position: absolute;
            top: 24px;
            left: 12px;
            width: 44px;
            height: 18px;
            display: flex;
            justify-content: space-between;
        }
        .hulk-eye .e {
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            border: 1px solid #2e7d32;
            transition: all 0.3s;
        }
        .hulk-eye .e::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 8px;
            height: 8px;
            background: #1a1a2e;
            border-radius: 50%;
            transition: all 0.3s;
        }
        .hulk-mouth {
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 10px;
            border-bottom: 4px solid #1b5e20;
            border-radius: 0 0 20px 20px;
            transition: all 0.3s;
        }
        /* 开心/难过 状态修饰 */
        .hulk-body.happy .hulk-mouth {
            border-bottom: 4px solid #1b5e20;
            height: 14px;
            border-radius: 0 0 20px 20px;
            width: 24px;
            border-bottom-width: 3px;
            transform: translateX(-50%) scaleY(1.2);
        }
        .hulk-body.happy .hulk-eye .e::after {
            background: transparent;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            border: 1px solid #1a1a2e;
        }
        .hulk-body.sad .hulk-mouth {
            border-bottom: none;
            border-top: 4px solid #1b5e20;
            border-radius: 20px 20px 0 0;
            height: 10px;
            width: 20px;
            transform: translateX(-50%);
        }
        .hulk-body.sad .hulk-eyebrow span {
            transform: rotate(6deg);
        }
        .hulk-body.sad .hulk-eyebrow span:last-child {
            transform: rotate(-6deg);
        }
        .hulk-body.sad .hulk-eye .e::after {
            background: transparent;
        }
        .hulk-body-part {
            width: 80px;
            height: 50px;
            background: #388e3c;
            margin: 0 auto;
            border-radius: 12px 12px 20px 20px;
            position: relative;
            display: flex;
            justify-content: center;
            gap: 6px;
            padding-top: 6px;
            border: 2px solid #2e7d32;
        }
        .hulk-body-part .arm {
            width: 22px;
            height: 36px;
            background: #4caf50;
            border-radius: 10px;
            border: 2px solid #2e7d32;
            transform: rotate(-6deg);
            transform-origin: top center;
        }
        .hulk-body-part .arm:last-child {
            transform: rotate(6deg);
        }
        .hulk-body-part .chest {
            width: 30px;
            height: 32px;
            background: #2e7d32;
            border-radius: 8px;
            border: 1px solid #1b5e20;
            margin-top: 2px;
        }
        .hulk-legs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: -4px;
        }
        .hulk-legs .leg {
            width: 26px;
            height: 28px;
            background: #1b5e20;
            border-radius: 0 0 12px 12px;
            border: 2px solid #0d3b0f;
        }

        /* 水手服角色 */
        .sailor-body {
            position: relative;
            width: 100px;
            height: 130px;
        }
        .sailor-head {
            width: 66px;
            height: 60px;
            background: #fce4ec;
            border-radius: 50% 50% 45% 45%;
            margin: 0 auto 2px;
            position: relative;
            border: 2px solid #f8bbd0;
            box-shadow: 0 4px 12px rgba(244, 143, 177, 0.25);
        }
        .sailor-hair {
            position: absolute;
            top: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 74px;
            height: 34px;
            background: #ffd54f;
            border-radius: 50% 50% 0 0;
            clip-path: polygon(0% 70%, 8% 40%, 18% 65%, 30% 30%, 42% 60%, 50% 28%, 58% 55%, 70% 25%, 82% 50%, 92% 35%, 100% 70%, 100% 100%, 0% 100%);
        }
        .sailor-hair-side {
            position: absolute;
            top: 4px;
            left: -16px;
            width: 20px;
            height: 44px;
            background: #ffd54f;
            border-radius: 40% 0 0 40%;
            transform: rotate(6deg);
            border: 1px solid #ffca28;
        }
        .sailor-hair-side.right {
            left: auto;
            right: -16px;
            border-radius: 0 40% 40% 0;
            transform: rotate(-6deg);
        }
        .sailor-ribbon {
            position: absolute;
            top: 2px;
            left: 50%;
            transform: translateX(-50%);
            width: 22px;
            height: 14px;
            background: #e53935;
            border-radius: 0 0 10px 10px;
            border: 1px solid #c62828;
            z-index: 2;
        }
        .sailor-ribbon::after {
            content: '';
            position: absolute;
            top: 8px;
            left: -12px;
            width: 18px;
            height: 16px;
            background: #e53935;
            border-radius: 0 0 0 20px;
            transform: rotate(10deg);
            border: 1px solid #c62828;
        }
        .sailor-ribbon::before {
            content: '';
            position: absolute;
            top: 8px;
            right: -12px;
            width: 18px;
            height: 16px;
            background: #e53935;
            border-radius: 0 0 20px 0;
            transform: rotate(-10deg);
            border: 1px solid #c62828;
        }
        .sailor-eye {
            position: absolute;
            top: 22px;
            left: 10px;
            width: 44px;
            height: 18px;
            display: flex;
            justify-content: space-between;
        }
        .sailor-eye .e {
            width: 16px;
            height: 18px;
            background: #fff;
            border-radius: 50%;
            position: relative;
            border: 1px solid #f8bbd0;
        }
        .sailor-eye .e::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 4px;
            width: 9px;
            height: 10px;
            background: #1565c0;
            border-radius: 50%;
            border: 1px solid #0d47a1;
            transition: all 0.3s;
        }
        .sailor-eye .e::before {
            content: '';
            position: absolute;
            top: 1px;
            left: 2px;
            width: 4px;
            height: 4px;
            background: #fff;
            border-radius: 50%;
            z-index: 2;
        }
        .sailor-mouth {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 8px;
            border-bottom: 3px solid #e91e63;
            border-radius: 0 0 14px 14px;
            transition: all 0.3s;
        }
        /* 开心/难过 */
        .sailor-body.happy .sailor-mouth {
            border-bottom: 3px solid #e91e63;
            height: 12px;
            width: 18px;
            border-bottom-width: 3px;
            transform: translateX(-50%) scaleY(1.2);
        }
        .sailor-body.happy .sailor-eye .e::after {
            background: transparent;
            width: 5px;
            height: 5px;
            border: 1px solid #1565c0;
        }
        .sailor-body.sad .sailor-mouth {
            border-bottom: none;
            border-top: 3px solid #e91e63;
            border-radius: 14px 14px 0 0;
            width: 12px;
            height: 10px;
            transform: translateX(-50%);
        }
        .sailor-body.sad .sailor-eye .e::after {
            background: transparent;
        }
        .sailor-body.sad .sailor-eye .e::before {
            display: none;
        }
        .sailor-body.sad .sailor-eye .e {
            border: 1px solid #f8bbd0;
            background: #fce4ec;
        }
        .sailor-body-part {
            width: 72px;
            height: 48px;
            background: #ffffff;
            margin: 0 auto;
            border-radius: 14px 14px 22px 22px;
            position: relative;
            border: 2px solid #f8bbd0;
            display: flex;
            justify-content: center;
            gap: 4px;
            padding-top: 6px;
            background: linear-gradient(180deg, #fff 0%, #fce4ec 100%);
        }
        .sailor-body-part .collar {
            position: absolute;
            top: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 18px;
            background: #e91e63;
            border-radius: 0 0 20px 20px;
            border: 1px solid #c2185b;
            clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
        }
        .sailor-body-part .collar2 {
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 20px;
            background: #e91e63;
            border-radius: 0 0 24px 24px;
            border: 1px solid #c2185b;
            clip-path: polygon(5% 0%, 95% 0%, 100% 100%, 0% 100%);
            opacity: 0.5;
        }
        .sailor-body-part .bow {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            width: 28px;
            height: 14px;
            background: #e53935;
            border-radius: 0 0 14px 14px;
            border: 1px solid #c62828;
        }
        .sailor-skirt {
            display: flex;
            justify-content: center;
            gap: 2px;
            margin-top: -2px;
        }
        .sailor-skirt .sk {
            width: 18px;
            height: 22px;
            background: #e91e63;
            border-radius: 0 0 12px 12px;
            border: 1px solid #c2185b;
        }
        .sailor-skirt .sk:nth-child(2) {
            background: #f06292;
        }
        .sailor-skirt .sk:nth-child(4) {
            background: #f06292;
        }

        /* ===== 血条进度条 (百分比版本) ===== */
        .hp-bar-container {
            width: 100%;
            max-width: 280px;
            margin: 8px auto 4px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 40px;
            height: 26px;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.5);
        }
        .hp-bar {
            height: 100%;
            width: 100%;
            border-radius: 40px;
            background: linear-gradient(90deg, #4caf50, #81c784);
            transition: width 0.4s ease, background 0.6s ease;
            position: relative;
        }
        .hp-bar-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
            letter-spacing: 1px;
            z-index: 2;
            transition: transform 0.2s ease;
        }

        .hp-bar-text.bounce {
            animation: bounceIn 0.35s ease-out;
        }
        @keyframes bounceIn {
            0% { transform: scale(1); }
            25% { transform: scale(1.35); font-weight: 900; }
            55% { transform: scale(0.85); }
            100% { transform: scale(1); }
        }

        .hp-bar.low {
            box-shadow: 0 0 15px rgba(244, 67, 54, 0.5);
        }
        .hp-bar.low .hp-bar-text {
            color: #ffcdd2;
        }

        /* ===== 玩家自己的判断按钮 ===== */
        .judge-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .judge-btn {
            padding: 8px 28px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 60px;
            border: none;
            cursor: pointer;
            transition: all 0.15s;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.2);
            position: relative;
            top: 0;
            min-width: 80px;
            letter-spacing: 2px;
        }
        .judge-btn:active:not(:disabled) {
            top: 4px;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.25);
        }
        .judge-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            top: 0;
            box-shadow: 0 3px 0 rgba(0, 0, 0, 0.15);
            pointer-events: none;
        }
        .judge-btn.true-btn {
            background: linear-gradient(145deg, #43a047, #2e7d32);
            color: #fff;
            border: 1px solid #66bb6a;
        }
        .judge-btn.true-btn:hover:not(:disabled) {
            background: linear-gradient(145deg, #4caf50, #388e3c);
            transform: scale(1.04);
        }
        .judge-btn.false-btn {
            background: linear-gradient(145deg, #e53935, #c62828);
            color: #fff;
            border: 1px solid #ef5350;
        }
        .judge-btn.false-btn:hover:not(:disabled) {
            background: linear-gradient(145deg, #f44336, #d32f2f);
            transform: scale(1.04);
        }

        /* 抢答按钮 */
        .buzz-area {
            display: flex;
            gap: 16px;
            margin-top: 6px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .buzz-btn {
            padding: 12px 32px;
            font-size: 22px;
            font-weight: 700;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.15s;
            letter-spacing: 1px;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.2), 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            top: 0;
            min-width: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .buzz-btn:active:not(:disabled) {
            top: 6px;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
        }
        .buzz-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            top: 0;
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.15);
            filter: grayscale(0.3);
        }
        .buzz-btn.p1-buzz {
            background: linear-gradient(145deg, #388e3c, #2e7d32);
            color: #fff;
            border: 1px solid #66bb6a;
        }
        .buzz-btn.p1-buzz:hover:not(:disabled) {
            background: linear-gradient(145deg, #43a047, #388e3c);
            transform: scale(1.02);
        }
        .buzz-btn.p2-buzz {
            background: linear-gradient(145deg, #d81b60, #c2185b);
            color: #fff;
            border: 1px solid #f06292;
        }
        .buzz-btn.p2-buzz:hover:not(:disabled) {
            background: linear-gradient(145deg, #e91e63, #d81b60);
            transform: scale(1.02);
        }

        /* VS 分隔 + 倒计时 */
        .vs-divider {
            order: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 38px;
            font-weight: 900;
            color: rgba(255, 215, 0, 0.3);
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.05);
            padding: 0 6px;
            user-select: none;
            letter-spacing: -2px;
            gap: 4px;
        }
        .vs-divider small {
            font-size: 14px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 4px;
        }

        /* 倒计时圆环样式 */
        .timer-wrap {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 40px;
            padding: 8px 18px;
            margin-bottom: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .timer-label {
            font-size: 20px;
            vertical-align: middle;
            line-height: 1;
        }
        .timer-display {
            font-size: 48px;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            color: #ffd740;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            transition: color 0.3s, text-shadow 0.3s;
            line-height: 1;
            min-width: 60px;
            text-align: center;
        }
        .timer-display.critical {
            color: #ff5252;
            text-shadow: 0 0 40px rgba(255, 82, 82, 0.6);
            animation: timerPulse 0.5s infinite alternate;
        }
        @keyframes timerPulse {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }
        .timer-unit {
            font-size: 18px;
            color: #aaa;
            margin-left: 4px;
            line-height: 1;
            vertical-align: bottom;
        }

        /* ===== 题目区 ===== */
        .question-area {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 32px;
            padding: 24px 30px 26px;
            margin: 10px 0 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
            min-height: 110px;
        }
        .q-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .q-num {
            color: #ffd740;
            font-weight: 700;
            font-size: 18px;
            background: rgba(255, 215, 0, 0.08);
            padding: 2px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 215, 0, 0.12);
        }
        .q-owner {
            font-size: 16px;
            font-weight: 600;
            color: #b0bec5;
        }
        .q-owner.active-p1 {
            color: #81c784;
        }
        .q-owner.active-p2 {
            color: #f48fb1;
        }
        .q-text {
            font-size: 26px;
            font-weight: 600;
            color: #f5f5f5;
            line-height: 1.5;
            padding: 4px 0 8px;
            min-height: 58px;
            letter-spacing: 0.5px;
        }

        /* ===== 状态 & 控制 ===== */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 4px;
            padding: 0 6px;
        }
        .status-msg {
            font-size: 20px;
            font-weight: 600;
            color: #ffd740;
            min-height: 32px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.1);

        .status-msg.win-p1 {
            color: #81c784;

        .status-msg.win-p2 {
            color: #f48fb1;

            gap: 12px;

            font-size: 16px;
            font-weight: 600;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.08);
            color: #cfd8dc;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s;
        }
        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .ctrl-btn.reset-btn {
            background: rgba(255, 152, 0, 0.15);
            border-color: rgba(255, 152, 0, 0.2);
            color: #ffb74d;

        .ctrl-btn.reset-btn:hover {
            background: rgba(255, 152, 0, 0.25);

        .attack-flash {
            animation: attackShake 0.5s ease;

        @keyframes attackShake {

            40% { transform: translateX(18px) rotate(2deg); }
            60% { transform: translateX(-10px); }
            80% { transform: translateX(10px); }
            100% { transform: translateX(0); }

            50% { box-shadow: 0 0 50px 20px rgba(244, 67, 54, 0.25); }

        @media (max-width: 920px) {

            .timer-label { font-size: 16px; }
            .timer-unit { font-size: 14px; }

        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.2); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 10px; }

        .game-over-shade {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }
        .game-over-shade.show { display: flex; }
        .game-over-box {

        .game-over-box .sub { color: #b0bec5; font-size: 18px; margin-bottom: 20px; }

        .game-over-box .play-again {
