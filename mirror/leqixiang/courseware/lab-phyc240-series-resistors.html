<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>乐启享 · 物理实验</title>

  <link rel="icon" href="/brand/favicon.ico">
  <link rel="stylesheet" href="/api/program-assets/lab-phyc240-series-resistors/_ext/maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
  <style>
    body { margin:0; overflow:hidden; background:#111; }
    body {
      font-family: "Times New Roman", Times, serif;
    }
    #container { position:fixed; inset:0; }

    /* Control panel: center top */
    #panel {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: min(920px, 96vw);
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      z-index: 10;
    }
    #panel .row { margin-left:0; margin-right:0; }
    .sliderRow { display:flex; align-items:center; gap:10px; margin:6px 0; }
    .sliderRow label { width:40px; margin:0; }
    .sliderRow input[type="range"] { flex:1; }
    .sliderVal { width:70px; text-align:right; font-family: monospace; }

    #eqBox {
      width: 100%;
      font-family: monospace;
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btnRow { display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; }
  </style>
</head>

<body>
  <div id="container"></div>

 <div id="panel">

  <div style="text-align:center; font-weight:700; font-size:30px; margin-bottom:10px; color:yellow;">
    RESISTORS IN SERIES
  </div>

  <!-- Sliders -->
  <div class="sliderRow">
    <label>R1</label>
    <input id="r1" type="range" min="1" max="999" step="1" value="10">
    <div class="sliderVal"><span id="r1v">10</span> Ω</div>
  </div>

  <div class="sliderRow">
    <label>R2</label>
    <input id="r2" type="range" min="1" max="999" step="1" value="20">
    <div class="sliderVal"><span id="r2v">20</span> Ω</div>
  </div>

  <div class="sliderRow">
    <label>R3</label>
    <input id="r3" type="range" min="1" max="999" step="1" value="30">
    <div class="sliderVal"><span id="r3v">30</span> Ω</div>
  </div>

  <div class="sliderRow">
    <label>R4</label>
    <input id="r4" type="range" min="1" max="999" step="1" value="40">
    <div class="sliderVal"><span id="r4v">40</span> Ω</div>
  </div>

  <div class="sliderRow">
    <label>R5</label>
    <input id="r5" type="range" min="1" max="999" step="1" value="50">
    <div class="sliderVal"><span id="r5v">50</span> Ω</div>
  </div>

  <!-- Equivalent Resistance Display -->
  <div style="margin-top:14px; display:flex; gap:12px;">

    <!-- Left -->
    <div style="flex:1; background:#111; border:2px solid #2b7cff; border-radius:8px; padding:10px;">
       <div style="color:#2b7cff; font-weight:bold; margin-bottom:6px;">
        Left (2 series): R<sub>eq</sub> = R<sub>1</sub> + R<sub>2</sub>
      </div>
      <input id="reqLeftBox" readonly
        style="width:100%; font-size:18px; font-weight:700; text-align:center;
               background:#000; color:#fff; border:1px solid #444;
               border-radius:6px; padding:8px;">
    </div>

    <!-- Right -->
    <div style="flex:1; background:#111; border:2px solid #35d07f; border-radius:8px; padding:10px;">
      <div style="color:#35d07f; font-weight:bold; margin-bottom:6px;">
        Right (3 series): R<sub>eq</sub> = R<sub>1</sub> + R<sub>2</sub> + R<sub>3</sub>
      </div>
      <input id="reqRightBox" readonly
        style="width:100%; font-size:18px; font-weight:700; text-align:center;
               background:#000; color:#fff; border:1px solid #444;
               border-radius:6px; padding:8px;">
    </div>

  </div>

  <!-- Buttons -->
  <div class="btnRow" style="margin-top:12px;">
    <button id="formulaBtn" class="btn btn-info">Formulas</button>
    <button id="resetBtn" class="btn btn-danger">Reset</button>
		
  </div>

</div>
