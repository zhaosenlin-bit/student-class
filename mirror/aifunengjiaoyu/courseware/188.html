<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>异形容器 - 水的压力压强变化示意图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        .left-panel {
            flex: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .canvas-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            position: relative;
        }

        canvas {
            display: block;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .right-panel {
            flex: 1;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-shadow: -5px 0 20px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        .panel-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            padding-bottom: 15px;
            border-bottom: 3px solid #667eea;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-btn {
            padding: 18px 25px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
            overflow: hidden;
        }

        .control-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.5s;
        }

        .control-btn:hover::before {
            left: 100%;
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .control-btn:active {
            transform: translateY(0);
        }

        .btn-inject {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-inject.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn-narrow {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        .btn-wide {
            background: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            color: white;
        }

        .btn-reset {
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            color: white;
        }

        .data-panel {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .data-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
            font-size: 16px;
        }

        .data-item:last-child {
            border-bottom: none;
        }

        .data-label {
            color: #666;
        }

        .data-value {
            color: #667eea;
            font-weight: bold;
        }

        .formula {
            background: #fff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.8;
        }

        .formula-title {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
    </style>
</head>

        <div class="left-panel">
            <div class="canvas-container">
                <canvas id="canvas" width="800" height="600"></canvas>

            <div class="panel-title">控制面板</div>

                    <strong>液体压力公式:</strong><br>
                    F = P × S<br>

                </div>
            </div>
        </div>
