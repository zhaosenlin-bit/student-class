<body>
	<div id="info" style="text-align: left"> 
		<button class="btn btn-success" onclick="alert('The Speed of Light Apparatus sends a pulse of light from the REFERENCE terminal into Channel 2 (CH 2) on the oscilloscope. When a 15 cm cable is inserted, it simultaneously sends another pulse of light through the fiber optic cable into Channel 3 (CH 3). After calibrating these two signals to align them in time, we replace the short cable with a 20-meter fiber optic cable. The light pulses travel through the fiber to the receiver, where the oscilloscope detects both the transmitted and received pulses. By measuring the time delay between the two signals and knowing the refractive index of the fiber optic cable, we can calculate the speed of light using the formula c = v × n = (20m/98ns)*n, where v is the measured speed in the cable and n is the refractive index.')">
		    How to measure the Speed of Light?
		</button><br>

		<button class="btn btn btn-danger" id="fifteen" style="background-color: black"> Insert 15 cm Cable </button>
		<button class="btn btn btn-danger" id="cali" style="background-color: black"> Calibrate Signals</button>
		<button class="btn btn btn-danger" id="twenty" style="background-color: black">Insert 20 m Cable </button><br>
		Time delay between two peaks for 20 m cable is: 
		<input type="text" id="delay" size="5" value=""> <br>
		Calculate the speed of light given that the refractive index of an optical fiber cable is 1.47 <br>
		<button class="btn btn btn-danger" id="reset">Reset</button>
		
		<br>
	</div>
	<div id="viewport"></div>
