	    const baseHeight = canvas.height - 30;  // Base height of the trapezoid

	    ctx.strokeStyle = "blue";

	    function animate() {
	        
	        // Begin the area fill
	        ctx.beginPath();
	        ctx.moveTo(xLeft, baseHeight); // Start at the bottom-left point (baseHeight)

	        // Calculate the current position on the curve based on t
	        const currentX = (1 - t) * (1 - t) * xLeft + 2 * (1 - t) * t * curveControlX + t * t * xRight;
	        const currentY = (1 - t) * (1 - t) * yTopLeft + 2 * (1 - t) * t * curveControlY + t * t * yTopRight;
	        
	        ctx.quadraticCurveTo(curveControlX, curveControlY, currentX, currentY); // Draw the curve
	
	        // Complete the area path by going down to baseHeight and back to the start
	        ctx.lineTo(currentX, baseHeight); // Go straight down to the base height
	        ctx.closePath(); // Close the path to form the filled area
	
	        ctx.fillStyle = "white"; // Set fill color to white
	        ctx.fill(); // Fill the area under the curve
	
	        ctx.beginPath(); // Begin a new path for the stroke

	        ctx.quadraticCurveTo(curveControlX, curveControlY, currentX, currentY); // Redraw the curve
	        ctx.stroke(); // Apply the stroke on top of the filled area

	            t += speed;  // Increment the progress
	            requestAnimationFrame(animate); // Call the next frame
	        } else {

	    const curveControlX = (xLeft + xRight) / 2; // Control point for the curve
	    const curveControlY = yTopLeft + 10;    // Control point for the curve (increase this to make a deeper curve)
	
	    ctx.strokeStyle = "blue";
	    ctx.lineWidth = 7;  // Adjust the width of the blue line
	
	    let t = 0;          // Progress variable (0 to 1)
	    const speed = 0.01; // Smaller value for slower drawing
	
	    // Variables to store previous position
	    let prevX = xRight;
	    let prevY = yTopRight;
	
	    function animate() {
	        // Move the piston down continuously until it reaches 5
	        if (piston.position.y > 5) {
	            piston.position.y -= 0.05;
	        }
	
	        // Calculate the current position along the curve
	        const currentX = (1 - t) * (1 - t) * xRight + 2 * (1 - t) * t * curveControlX + t * t * xLeft;
	        const currentY = (1 - t) * (1 - t) * yTopRight + 2 * (1 - t) * t * curveControlY + t * t * yTopLeft;
	
	        // Save the canvas state and set composite operation to erase
	        ctx.save();
	        ctx.globalCompositeOperation = 'destination-out';
	
	        // Erase the area dynamically under the curve segment
	        ctx.beginPath();
	        ctx.moveTo(prevX, baseHeight); // Start from previous x position at base height
	        ctx.lineTo(prevX, prevY);      // Move up to the previous point
	        ctx.quadraticCurveTo(curveControlX, curveControlY, currentX, currentY); // Draw the curve to the current point
	        ctx.lineTo(currentX, baseHeight + 15); // Draw down to the base height, slight overlap (+10) to cover any gaps
	        ctx.closePath(); // Close the path to form the area
	        ctx.fill(); // Erase the area under the current segment
	        ctx.restore(); // Restore the canvas state
	
	        // Draw the curve incrementally
	        ctx.beginPath();
	        ctx.moveTo(prevX, prevY); // Start from the previous point
	        ctx.quadraticCurveTo(curveControlX, curveControlY, currentX, currentY); // Draw up to the current point
	        ctx.stroke();
	
	        // Update previous position
	        prevX = currentX;
	        prevY = currentY;
	
	        // Increment progress to draw the next segment
	        if (t < 1) {
	            t += speed;
	            requestAnimationFrame(animate); // Continue animation
	        } else {

	        // Erase the area dynamically under the curve segment
	        ctx.beginPath();
	        ctx.moveTo(prevX, prevY);          // Start from previous point on curve
	        ctx.lineTo(currentX, currentY);    // Move to the current position on the curve
	        ctx.lineTo(currentX, baseHeight + 15); // Draw down to the base height with slight overlap (+10)
	        ctx.lineTo(prevX, baseHeight + 15);    // Draw back to the previous x position at base height with slight overlap (+10)
	        ctx.closePath(); // Close the path to form the area
	        ctx.fill(); // Erase the area under the current segment
	        ctx.restore(); // Restore the canvas state
	
	        // Draw the curve incrementally
	        ctx.beginPath();
	        ctx.moveTo(prevX, prevY); // Start from the previous point
	        ctx.quadraticCurveTo(curveControlX, curveControlY, currentX, currentY); // Draw up to the current point
	        ctx.stroke();
	
	        // Update previous position
	        prevX = currentX;
	        prevY = currentY;
	
	        if (t < 1) {
	            t += speed;               // Increment progress to draw the next segment
	            requestAnimationFrame(animate); // Continue animation
	        } else {
	            // Animation complete
	            document.getElementById('four').disabled = true; // Disable the button
		    drawPVDiagram(200);  
	        }
	    }
	
	    animate(); // Start the animation
	}
	

	function setupCanvas(canvas) {
	    const dpr = window.devicePixelRatio || 1;
	    canvas.width = canvas.clientWidth * dpr;
	    canvas.height = canvas.clientHeight * dpr;
	    ctx.scale(dpr, dpr);
	}

	function drawPVDiagram(T) {
	    ctx.strokeStyle = "black";
	    ctx.lineWidth = 3; 
	    ctx.beginPath();
	    ctx.moveTo(40, 10);    
	    ctx.lineTo(40, canvas.height - 30); 
	    ctx.lineTo(canvas.width - 30, canvas.height - 30); 
	    ctx.stroke();
	
	    ctx.font = "bold 16px Arial";
	    ctx.fillStyle = "black";
	    ctx.fillText("V", canvas.width - 20, canvas.height - 10); 
	    ctx.fillText("P", 10, 20);  
	
	    ctx.lineWidth = 3; 
	
	    const minVolume = 1;  
	    const maxVolume = 10; 
	    const maxPressure = 1300; 
	    const points = 100;   
	    const midVolume = (minVolume + maxVolume) / 2; 
	
	    const stepSize = (maxVolume - minVolume) / points;
	    const scaleX = canvas.width / (2 * (maxVolume - minVolume));
	    const scaleY = canvas.height / (1.5 * maxPressure); 
	
	    const xOffset = canvas.width / 6;
	
	    ctx.strokeStyle = T === 300 ? "red" : (T === 200 ? "yellow" : "white"); 
	    ctx.beginPath();
	
	    let labelX = 0;
	    let labelY = 0;
	    let x = 0;
	    let y = 0;
	
	    for (let i = 0; i <= points; i++) {
	        const V = minVolume + i * stepSize;   
	        let P = (n * R * T) / V; 
	
	        if (P > maxPressure) {
	            P = maxPressure;
	        }
	
	        x = xOffset + (V - minVolume) * scaleX;   
	        y = canvas.height - 35 - P * scaleY; 
	
	        if (P < maxPressure && i === 0) {
	            ctx.moveTo(x, y);
	        } else if (P < maxPressure) {
	            ctx.lineTo(x, y);
	        }
	
	        if (Math.abs(V - midVolume) < stepSize) {
	            labelX = x + 100;  
	            labelY = y - 100;
	        }
	    }
	
	    ctx.stroke();
	
	    ctx.font = "bold 14px Arial";
	    ctx.fillStyle = ctx.strokeStyle;
	    ctx.fillText(`T=${T}K`, labelX, labelY);
	}

			scene.remove(messageArray[i]);

		messageArray = []; // Clear the array after removing messages
	}
		
	function onWindowResize() {
	    camera.aspect = window.innerWidth / window.innerHeight;
	    camera.updateProjectionMatrix();
	    renderer.setSize(window.innerWidth, window.innerHeight);
	}

	const render = () => {
	    // Particle motion
	    particleArray.forEach(particle => {
	        if (is_heat) {
	            particle.position.x += (Math.random() - 0.5) * stepSize2;
	            particle.position.y += (Math.random() - 0.5) * stepSize2;
	            particle.position.z += (Math.random() - 0.5) * stepSize2;
	        } else {
	            particle.position.x += (Math.random() - 0.5) * stepSize1;
	            particle.position.y += (Math.random() - 0.5) * stepSize1;
	            particle.position.z += (Math.random() - 0.5) * stepSize1;
	        }
	
	        const distanceFromCenter = Math.sqrt(particle.position.x ** 2 + particle.position.z ** 2);
	        if (distanceFromCenter > cylinderRadius) {
	            const scalingFactor = cylinderRadius / distanceFromCenter;
	            particle.position.x *= scalingFactor;
	            particle.position.z *= scalingFactor;
	        }
	
	        if (particle.position.y < -6) {
	            particle.position.y = -6;
	            particle.velocity.y = -particle.velocity.y * restitution;  
	        } else if (particle.position.y > piston.position.y) {
	            particle.position.y = piston.position.y;
	            particle.velocity.y = -particle.velocity.y * restitution;  
	        }
	    });
	   
	    if(fire){
	    	fire.update( performance.now() / 1000 );
	    }
	
	    controls.update();
	    requestAnimationFrame(render);
	    renderer.render(scene, camera);
	};

	window.onload = initScene;
</script>
