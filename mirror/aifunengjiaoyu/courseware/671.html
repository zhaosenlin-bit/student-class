<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:"Microsoft Yahei",sans-serif;}
body{
    background:
        radial-gradient(circle at 10% 10%, rgba(84,208,255,.12) 0 8%, transparent 9%),
        radial-gradient(circle at 90% 18%, rgba(255,221,102,.12) 0 8%, transparent 9%),
        linear-gradient(135deg,#111827,#0f172a,#111827);
    color:#eee;
    padding:18px;
    min-height:100vh;
}
.wrap{max-width:900px;margin:0 auto;}
.audio-tip{font-size:13px;color:#88a0cc;margin:8px 0;text-align:center;}

/* 页面切换 */
#startPage{display:block;}
#gamePage{
    position:fixed;
    inset:0;
    background:#0b101b;
    z-index:10;
    overflow:auto;
    display:none;
}
#gamePage.show{display:block;}

#gameCanvas{
    border:3px solid #3b82f6;
    border-radius:12px;
    background:#0b101b;
    display:block;
    width:100%;
    height:60vh;
}
.bottom-ui{margin-top:14px;display:flex;gap:16px;flex-wrap:wrap;padding:0 16px 20px;}
.col-left{flex:1;min-width:280px;}
.col-center{flex:2;min-width:540px;}
.box{
    background:#1e293b;
    border-radius:12px;
    padding:16px;
    border:1px solid #334155;
}
.q-box{
    background:#0f172a;
    padding:30px 24px;
    border-radius:10px;
    min-height:180px;
    font-size:32px;
    font-weight:bold;
    line-height:1.8;
    text-align:center;
    margin-bottom:14px;
    color:#ffffff;
}
.turn-tip{
    font-size:24px;
    font-weight:bold;
    text-align:center;
    padding:10px;
    margin-bottom:14px;
    border-radius:8px;
    background-color:#1e293b;
    color:#ffdd66;
}
.info-line{margin:8px 0;font-size:16px;}
.log-area{
    background:#0f172a;
    height:140px;
    overflow-y:auto;
    padding:10px;
    border-radius:6px;
    color:#b0c4e0;
    font-size:14px;
}
.count-down-text{font-size:26px;color:#ffdd44;font-weight:bold;margin-left:14px;}
.time-row{display:flex;gap:10px;align-items:center;margin:10px 0;flex-wrap:wrap;}
#timeInput{width:90px;padding:8px;font-size:16px;background:#1e293b;color:#fff;border:1px solid #475569;border-radius:6px;}
.score-bar-wrap{
    width:100%;
    height:24px;
    background:#0f172a;
    border-radius:12px;
    overflow:hidden;
    margin:8px 0;
}
.bar-blue{height:100%;background:linear-gradient(90deg,#3b82f6,#60a5fa);width:0%;transition:0.4s;}
.bar-red{height:100%;background:linear-gradient(90deg,#ef4444,#f87171);width:0%;transition:0.4s;}

/* 胜利弹窗 */
.win-modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.78);
    display:none;
    z-index:999;
    align-items:center;
    justify-content:center;
}
.win-modal.show{display:flex;}
.win-box{
    background:#1e293b;
    border:2px solid #ffdd66;
    border-radius:16px;
    padding:40px 60px;
    text-align:center;
}
.win-box h2{font-size:36px;color:#ffdd66;margin-bottom:20px;}

/* 初始页主容器 */
.start-box{
    background:#1e293b;
    border:1px solid #334155;
    border-radius:18px;
    padding:28px 24px;
    box-shadow:0 0 35px rgba(0,0,0,.35);
}

/* 动态炫酷 Logo */
.logo-area{
    text-align:center;
    margin-bottom:28px;
}
.logo{
    display:inline-block;
    position:relative;
    padding:12px 26px;
    border-radius:999px;
    background:linear-gradient(135deg,#0ea5e9,#8b5cf6,#ec4899,#f59e0b);
    background-size:300% 300%;
    animation:gradientShift 6s ease-in-out infinite;
    box-shadow:
        0 0 15px rgba(14,165,233,.55),
        0 0 30px rgba(139,92,246,.35),
        0 0 45px rgba(236,72,153,.25);
}
.logo-text{
    font-size:38px;
    font-weight:900;
    letter-spacing:2px;
    color:#fff;
    text-shadow:
        0 0 8px rgba(255,255,255,.8),
        0 0 16px rgba(14,165,233,.85),
        0 0 24px rgba(139,92,246,.65);
    animation:textGlow 2s ease-in-out infinite alternate;
}
.logo-ball{
    position:absolute;
    right:-14px;
    top:50%;
    transform:translateY(-50%);
    width:42px;
    height:42px;
    background:radial-gradient(circle at 35% 25%,#fff,#38bdf8);
    border-radius:50%;
    box-shadow:
        inset -4px -4px 10px rgba(0,0,0,.25),
        0 0 18px rgba(56,189,248,.85);
    animation:ballBounce 1.8s ease-in-out infinite;
}

@keyframes gradientShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}
@keyframes textGlow{
    0%{text-shadow:0 0 8px rgba(255,255,255,.8),0 0 16px rgba(14,165,233,.85),0 0 24px rgba(139,92,246,.65);}
    100%{text-shadow:0 0 12px rgba(255,255,255,1),0 0 24px rgba(14,165,233,1),0 0 36px rgba(139,92,246,.85);}
}
@keyframes ballBounce{
    0%,100%{transform:translateY(-50%) scale(1);}
    50%{transform:translateY(-58%) scale(1.08);}
}

/* 分区卡片 */
.section{
    background:#0f172a;
    border:1px solid #1e293b;
    border-radius:14px;
    padding:18px;
    margin-bottom:18px;
}
.section-title{
    color:#ffdd66;
    font-size:20px;
    font-weight:bold;
    margin-bottom:14px;
    display:flex;
    align-items:center;
    gap:8px;
}

/* 表单行 */
.form-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    flex-wrap:wrap;
    margin-bottom:12px;
}
.form-row label{
    font-size:16px;
    color:#e2e8f0;
    min-width:140px;
}
.form-row input[type="number"]{
    flex:1;
    max-width:180px;
    padding:10px 12px;
    font-size:16px;
    background:#1e293b;
    color:#fff;
    border:1px solid #475569;
    border-radius:8px;
}
.file-input-wrapper{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
}
#fileInput{
    color:#cbd5e1;
    font-size:15px;
}

/* 骰子区域 */
.dice-section{
    text-align:center;
}
.dice-wrap{
    width:150px;
    height:150px;
    perspective:800px;
    margin:18px auto;
}
#dice{
    width:100%;
    height:100%;
    position:relative;
    transform-style:preserve-3d;
    transform-origin:center center;
}
.dice-face{
    position:absolute;
    width:150px;
    height:150px;
    background:linear-gradient(145deg,#ffffff,#f0f0f0);
    border:2px solid #ddd;
    border-radius:18px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    padding:18px;
    box-shadow:inset 0 0 22px rgba(0,0,0,.08);
}
.dot{
    width:24px;
    height:24px;
    border-radius:50%;
    background:#111;
    margin:6px;
}

/* 立方体6个面，半长75px */
.dice-face.f1{transform:rotateY(0deg) translateZ(75px);}
.dice-face.f2{transform:rotateY(180deg) translateZ(75px);}
.dice-face.f3{transform:rotateY(90deg) translateZ(75px);}
.dice-face.f4{transform:rotateY(-90deg) translateZ(75px);}
.dice-face.f5{transform:rotateX(-90deg) translateZ(75px);}
.dice-face.f6{transform:rotateX(90deg) translateZ(75px);}

#firstShow{
    font-size:22px;
    color:#ffdd66;
    margin-top:12px;
    min-height:32px;
}

/* 按钮区 */
.btn-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:18px;
}
button{
    padding:12px 18px;
    border:none;
    border-radius:10px;
    font-weight:bold;
    font-size:16px;
    cursor:pointer;
    color:#fff;
}
.btn-dice{background:linear-gradient(135deg,#22c55e,#16a34a);}
.btn-start{background:linear-gradient(135deg,#3b82f6,#2563eb);font-size:18px;padding:14px 20px;}
.btn-export{background:linear-gradient(135deg,#8b5cf6,#7c3aed);}
.btn-reset{background:linear-gradient(135deg,#ef4444,#dc2626);}
button:hover{filter:brightness(1.08);}
button:active{transform:scale(.97);}

/* 响应式 */
@media(max-width:1024px){
    .bottom-ui{flex-direction:column;}
    .col-left,.col-center{min-width:100%;}
}
@media(max-width:640px){
    .btn-grid{grid-template-columns:1fr;}
    .form-row{flex-direction:column;align-items:stretch;}
    .form-row input[type="number"]{max-width:100%;}
    .logo-text{font-size:28px;}
    .logo-ball{width:32px;height:32px;}
}
</style>
</head>

            <!-- 上传题库 -->
            <div class="section">
                <div class="section-title">📂 上传题库</div>

                        <div class="dice-face f1"><span class="dot"></span></div>

                        <div class="dice-face f4"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                        <div class="dice-face f5"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                        <div class="dice-face f6"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
                    </div>
                </div>
                <button class="btn-dice" id="diceBtn" onclick="rollDice()">掷骰子</button>
                <div id="firstShow"></div>
            </div>

                    </div>

            </div>
            <div class="col-center">

                    </div>
                </div>
            </div>
        </div>

    <!-- 胜利弹窗 -->

        </div>
    </div>
</div>
