function roundRect(
ctx,
x,
y,
w,
h,
r
){

ctx.beginPath();

ctx.moveTo(
x+r,
y
);

ctx.arcTo(
x+w,
y,
x+w,
y+h,
r
);

ctx.arcTo(
x+w,
y+h,
x,
y+h,
r
);

ctx.arcTo(
x,
y+h,
x,
y,
r
);

ctx.arcTo(
x,
y,
x+w,
y,
r
);

ctx.closePath();

}

function createTextSprite(
text,
{
bg='rgba(255,255,255,.97)',
color='#111',
w=320,
h=130,
font='bold 38px Arial'
}={}
){

const canvas=
document.createElement(
'canvas'
);

canvas.height=h;

const ctx=
canvas.getContext(
'2d'
);

ctx.fillStyle=bg;
ctx.strokeStyle=
'rgba(0,0,0,.55)';

ctx.lineWidth=4;

roundRect(
ctx,
3,
3,
w-6,
h-6,
16
);

ctx.fill();
ctx.stroke();

ctx.fillStyle=color;
ctx.font=font;
ctx.textAlign='center';
ctx.textBaseline='middle';

const lines=
String(text)
.split('\n');

const dy=
(h-20)/
Math.max(
lines.length,
1
);

lines.forEach(
(line,i)=>
ctx.fillText(
line,
w/2,
10+dy*(i+.5)
)
);

const texture=
new THREE.CanvasTexture(
canvas
);

const sprite=
new THREE.Sprite(
new THREE.SpriteMaterial({
map:texture,

})
);

sprite.scale.set(
34,

);

}

function cylinderBetween(
p1,
p2,
radius=.75,
color=CIRCUIT_WIRE_COLOR
){

const delta=
new THREE.Vector3()
.subVectors(
p2,
p1
);

const length=
delta.length();

if(length<.001){
return null;
}

const mesh=
new THREE.Mesh(
new THREE.CylinderGeometry(
radius,
radius,
length,
16
),
new THREE.MeshLambertMaterial({
color
})
);

mesh.position.copy(
new THREE.Vector3()
.addVectors(
p1,
p2
)
.multiplyScalar(
.5
)
);

mesh.quaternion
.setFromUnitVectors(
new THREE.Vector3(
0,
1,
0
),
delta.normalize()
);

return mesh;

}

function snap(
value,
step=4
){

function pointerXY(event){

const rect=
renderer.domElement
.getBoundingClientRect();

mouse.x=
(
(event.clientX-rect.left)/
rect.width
)*2-1;

mouse.y=
-(
(event.clientY-rect.top)/
rect.height
)*2+1;

raycaster.setFromCamera(
mouse,
camera
);

}

function planePoint(event){

pointerXY(event);

const point=
new THREE.Vector3();

raycaster.ray
.intersectPlane(
plane,
point
);

return point;

}

function worldTerminalPos(
component,
index
){

component

);

}

function getComponentById(id){

return components.find(
component=>
component.userData.id===id
)||null;

}

function terminalCount(
component
){

return component
?.userData
?.terminalsLocal
?.length||0;

}

function formatResistance(R){

if(!Number.isFinite(R)){
return '∞ Ω';
}

if(R>=1e6){

return `${+(R/1e6)
.toFixed(
R>=1e7?1:2
)} MΩ`;

}

if(R>=1e3){

return `${+(R/1e3)
.toFixed(
R>=1e4?1:2
)} kΩ`;

}

if(R>=100){
return `${R.toFixed(0)} Ω`;
}

if(R>=10){
return `${R.toFixed(2)} Ω`;
}

return `${R.toFixed(3)} Ω`;

}

/* =========================================================
   TERMINAL SNAP / MERGED NODES
   ========================================================= */

function getTerminalJoints(
component,
index
){

if(!component){
return[];
}

const id=
component.userData.id;

return terminalJoints.filter(
joint=>
(
joint.a.compId===id
&&
joint.a.term===index
)
||
(
joint.b.compId===id
&&
joint.b.term===index
)
);

}

function terminalJointExists(
a,
ai,
b,
bi
){

return terminalJoints.some(
joint=>
(
joint.a.compId===
a.userData.id
&&
joint.a.term===ai
&&
joint.b.compId===
b.userData.id
&&
joint.b.term===bi
)
||
(
joint.a.compId===
b.userData.id
&&
joint.a.term===bi
&&
joint.b.compId===
a.userData.id
&&
joint.b.term===ai
)
);

}

function setTerminalVisible(
component,
index,
visible
){

const mesh=
component
?.userData
?.terminalMeshes
?.[index];

if(mesh){
mesh.visible=visible;
}

}

/*
 * All terminals in one snapped junction are electrically
 * connected, but only one sphere should normally be visible.
 *
 * If A or B belongs to the node, keep that measurement
 * terminal visible and hide the resistor terminal spheres.
 */
function updateMergedTerminalVisibility(){

components.forEach(
component=>{

for(
let i=0;
i<terminalCount(component);
i++
){

setTerminalVisible(
component,
i,
true
);

}

}
);

const visited=
new Set();

const key=
(id,index)=>
`${id}:${index}`;

function neighbors(
id,
index
){

const result=[];

terminalJoints.forEach(
joint=>{

if(
joint.a.compId===id
&&
joint.a.term===index
){

result.push(
joint.b
);

}
else if(
joint.b.compId===id
&&
joint.b.term===index
){

result.push(
joint.a
);

}

}
);

return result;

}

components.forEach(
component=>{

for(
let index=0;
index<
terminalCount(component);
index++
){

const start=
key(
component.userData.id,
index
);

if(
visited.has(start)
){
continue;
}

const stack=[{
compId:
component.userData.id,
term:index
}];

const group=[];

while(stack.length){

const item=
stack.pop();

const itemKey=
key(
item.compId,
item.term
);

if(
visited.has(
itemKey
)
){
continue;
}

visited.add(
itemKey
);

group.push(
item
);

neighbors(
item.compId,
item.term
)
.forEach(next=>{

const nextKey=
key(
next.compId,
next.term
);

if(
!visited.has(
nextKey
)
){

stack.push(
next
);

}

});

}

if(group.length>1){

const specialIndex=
group.findIndex(
item=>{

const c=
getComponentById(
item.compId
);

return c
&&
(
c.userData.type==='nodeA'
||
c.userData.type==='nodeB'
);

}
);

group.forEach(
(item,i)=>{

const c=
getComponentById(
item.compId
);

if(!c){
return;
}

setTerminalVisible(
c,
item.term,
specialIndex>=0
?i===specialIndex
:i===0
);

}
);

}

}

}
);

}

function detachJoint(
joint,
solve=true
){

if(!joint){
return;
}

terminalJoints=
terminalJoints.filter(
item=>item!==joint
);

updateMergedTerminalVisibility();

if(solve){
solveEquivalentResistance();
}

}

function detachTerminalJoint(
component,
index,
solve=true
){

getTerminalJoints(
component,
index
)
.slice()
.forEach(
joint=>
detachJoint(
joint,
false
)
);

if(solve){
solveEquivalentResistance();
}

}

function detachAllComponentJoints(
component,
solve=true
){

if(!component){
return;
}

const id=
component.userData.id;

terminalJoints=
terminalJoints.filter(
joint=>
joint.a.compId!==id
&&
joint.b.compId!==id
);

updateMergedTerminalVisibility();

if(solve){
solveEquivalentResistance();
}

}

function createTerminalJoint(
componentA,
terminalA,
componentB,
terminalB,
solve=true
){

if(
!componentA
||
!componentB
||
componentA===componentB
||
terminalJointExists(
componentA,
terminalA,
componentB,
terminalB
)
){
return null;
}

const joint={

a:{
compId:
componentA.userData.id,
term:terminalA
},

b:{
compId:
componentB.userData.id,
term:terminalB
}

};

terminalJoints.push(
joint
);

updateMergedTerminalVisibility();

if(solve){
solveEquivalentResistance();
}

return joint;

}

function findNearestTerminal(
component,
index,
maxDistance=
TERMINAL_SNAP_DISTANCE
){

const source=
worldTerminalPos(
component,
index
);

let best=null;
let bestDistance=
maxDistance;

components.forEach(
other=>{

if(other===component){
return;
}

for(
let i=0;
i<terminalCount(other);
i++
){

const point=
worldTerminalPos(
other,
i
);

const distance=
source.distanceTo(
point
);

if(
distance<
bestDistance
){

bestDistance=
distance;

best={

component:other,
terminalIndex:i,
position:
point.clone(),
distance

};

}

}

}
);

return best;

}

/*
 * After the first pair snaps, connect every other terminal
 * that already occupies the same physical position.
 *
 * This allows 3, 4, ... terminals to make one junction.
 */
function connectAllOverlappingTerminals(
component,
index,
tolerance=1.5
){

const point=
worldTerminalPos(
component,
index
);

let created=false;

components.forEach(
other=>{

if(other===component){
return;
}

for(
let i=0;
i<terminalCount(other);
i++
){

const otherPoint=
worldTerminalPos(
other,
i
);

if(
point.distanceTo(
otherPoint
)<=tolerance
&&
!terminalJointExists(
component,
index,
other,
i
)
){

createTerminalJoint(
component,
index,
other,
i,
false
);

created=true;

}

}

}
);

if(created){

updateMergedTerminalVisibility();
solveEquivalentResistance();

}

return created;

}

function updateAttachedWires(
component
){

wires.forEach(
wire=>{

if(
wire.a.compId===
component.userData.id
||
wire.b.compId===
component.userData.id
){

updateWireVisual(
wire
);

}

}
);

}

/*
 * Whole-component snap.
 */
function snapComponentTerminal(
component
){

if(
!component
||
component.userData.type!=='resistor'
){
return false;
}

let best=null;

for(
let index=0;
index<
terminalCount(component);
index++
){

const hit=
findNearestTerminal(
component,
index
);

if(
hit
&&
(
!best
||
hit.distance<
best.distance
)
){

best={
movingIndex:index,
...hit
};

}

}

if(!best){
return false;
}

const current=
worldTerminalPos(
component,
best.movingIndex
);

component.position.add(
new THREE.Vector3()
.subVectors(
best.position,
current
)
);

component.position.z=0;

createTerminalJoint(
best.component,
best.terminalIndex,
component,
best.movingIndex,
false
);

connectAllOverlappingTerminals(
component,
best.movingIndex
);

updateAttachedWires(
component
);

updateMergedTerminalVisibility();

solveEquivalentResistance();

setStatus(
`${component.userData.displayName} terminal snapped to ${best.component.userData.displayName}.`
);

return true;

}

/*
 * Snap after extending one resistor lead.
 */
function snapDraggedTerminal(
component,
index
){

if(
component.userData.type!=='resistor'
){
return false;
}

const hit=
findNearestTerminal(
component,
index
);

if(!hit){
return false;
}

const local=
component.worldToLocal(
hit.position.clone()
);

const base=
component.userData
.baseTerminalsLocal[index];

/*
 * Terminal extension is along local X.
 */
if(
Math.abs(
local.y-base.y
)>4
){
return false;
}

moveResistorTerminal(
component,
index,
local.x
);

const actual=
worldTerminalPos(
component,
index
);

component.position.add(
new THREE.Vector3()
.subVectors(
hit.position,
actual
)
);

component.position.z=0;

createTerminalJoint(
hit.component,
hit.terminalIndex,
component,
index,
false
);

connectAllOverlappingTerminals(
component,
index
);

updateAttachedWires(
component
);

updateMergedTerminalVisibility();

solveEquivalentResistance();

setStatus(
`${component.userData.displayName} terminal snapped to ${hit.component.userData.displayName}.`
);

return true;

}

function bandData(R){

R=
Math.max(
.01,
+R||1
);

let exponent=
Math.floor(
Math.log10(R)
);

let sig=
Math.round(
R/
10**(
exponent-1
)
);

if(sig>=100){

sig=
Math.round(
sig/10
);

exponent++;

}

return[
Math.floor(sig/10)%10,
sig%10,
exponent-1
];

}
