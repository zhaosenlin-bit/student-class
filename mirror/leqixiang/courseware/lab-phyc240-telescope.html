		 <h1>Keplerian Telescope</h1>
		  <button class="btn btn-primary" onclick="alert('A Keplerian telescope is a type of refracting telescope invented by Johannes Kepler. It uses two convex lenses:\n\n- The **objective lens** collects parallel rays from a distant object (e.g., the Moon) and brings them to a real, inverted focus.\n- The **eyepiece lens** acts as a magnifier, placed so that the real image lies at its focal point, producing a **virtual, magnified, and inverted image** at infinity.\n\nThis design provides high magnification and is used in astronomy to view distant celestial objects.')">
