	<h1>Heat Engine</h1>
	 <!-- Left Panel -->  
	<div class="control-panel">
		
		<div class="control-group">
		  High Temperature (K):
		  <div class="slider-row" style="display: flex; align-items: center;">
		    <input type="range" id="highTempSlider" min="300" max="900" step="1" value="400" style="flex: 1; margin-right: 8px;">

		    <span>900</span>
		  </div>
		</div>
		    
		  <div class="control-group">
		    Low Temperature (K):
		    <div class="slider-row">
		      <input type="range" id="lowTempSlider" min="20" max="300" step="1" value="300">
		      <input type="text" id="lowTempValue" value="300" readonly>
		    </div>
		    <div class="minmax">
		      <span>20</span>
		      <span>300</span>
		    </div>
		  </div>    
		
		  <div class="control-group">
		    Percentage Efficiency (%):
		    <div class="slider-row">
		      <input type="range" id="percentageEff" min="0" max="100" step="1" value="100">
		      <input type="text" id="percentageEffValue" value="100" readonly>
		    </div>
		    <div class="minmax">
		      <span>0</span>
		      <span>100</span>
		    </div>
		  </div>
										
		   <button class="btn btn-danger" onclick="
			  alert('A heat engine converts thermal energy (Qh) into work (W) while releasing some waste heat (Qc) to a cooler reservoir.\n\n' +
			  'Key Formulas:\n\n' +
			  '1. First Law: Qh = W + Qc\n' +
			  '2. Carnot Efficiency: eta_carnot = 1 - (Tc / Th)\n' +
			  '3. Actual Efficiency: eta = W / Qh\n' +
			  '4. Work Done: W = Qh * eta\n' +
			  '5. Heat Rejected: Qc = Qh - W\n\n' +
			  'Where:\n' +
			  '- Qh: heat absorbed from hot reservoir (J)\n' +
			  '- Qc: heat released to cold reservoir (J)\n' +
			  '- W: work output (J)\n' +
			  '- Th: hot temp (K), Tc: cold temp (K)\n' +
			  '- eta: efficiency (decimal or %)');
			  alert('Applications of Heat Engines:\n\n' +
			  'Transportation:\n' +
			  '- Internal combustion engines (Otto/Diesel) power cars, motorcycles, and trucks.\n' +
			  '- Convert fuel into motion.\n\n' +
			  'Power Generation:\n' +
			  '- Steam turbines (Rankine cycle) are used in power plants.\n' +
			  '- Convert heat from fuels or nuclear reactions into electricity.\n\n' +
			  'Heating and Cooling:\n' +
			  '- Heat pumps transfer thermal energy for climate control.\n\n' +
			  'Note: Carnot efficiency is the theoretical maximum. Real engines always have lower efficiency.');
			">
			  What is Heat Engine?
		</button>
		 
		  <div class="control-group">
		    Work Done (J):
		    <input type="text" id="workValue" value="25.0" readonly style="width: 90px;">
		  </div>
	</div>
	<!-- Right Panel -->
	      <div class="control-panel-right">
