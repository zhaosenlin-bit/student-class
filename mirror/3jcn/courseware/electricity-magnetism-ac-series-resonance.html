<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">

<title>乐启享 · 物理实验</title>
<link rel="icon" href="/brand/favicon.ico">




<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,Helvetica,sans-serif;
  background:#9fb7cc;
}

#container{
  position:fixed;
  inset:0;
}

/* =========================================================
   TITLE
========================================================= */

#titleBox{
  position:fixed;
  top:16px;
  left:50%;
  transform:translateX(-50%);
  z-index:20;

  min-width:360px;
  padding:10px 24px;

  background:rgba(255,255,255,.94);
  border:2px solid #667;
  border-radius:14px;

  box-shadow:0 5px 16px rgba(0,0,0,.2);
  text-align:center;
}

#titleBox h1{
  margin:0;
  font-size:28px;
  color:#111;
}

#titleBox .sub{
  margin-top:3px;
  font-size:14px;
  color:#444;
}

/* =========================================================
   LEFT CONTROLS
========================================================= */

#controls{
  position:fixed;
  top:18px;
  left:18px;

  width:285px;
  z-index:30;

  padding:12px;

  background:rgba(250,250,250,.97);
  border:2px solid #666;
  border-radius:14px;

  box-shadow:0 6px 18px rgba(0,0,0,.2);
}

#controls h3{
  margin:0 0 10px;
  color:#084b91;
  text-align:center;
  font-size:20px;
}

.row{
  margin:10px 0;
}

.row label{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:4px;

  font-size:13px;
  font-weight:700;
}

input[type="range"]{
  width:100%;
  cursor:pointer;
}

#freqSlider{
  accent-color:#006de5;
}

/* =========================================================
   BUTTONS
========================================================= */

.btnRow{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:11px;
}

.btn{
  padding:9px 5px;

  border:1px solid #666;
  border-radius:8px;

  background:#fff;

  font-size:13px;
  font-weight:700;

  cursor:pointer;
}

.btn:hover{
  background:#e8f1ff;
}

#startBtn{
  background:#dff3e5;
}

#resetBtn{
  background:#ffe2df;
}

#coreBtn{
  grid-column:1/3;
  background:#fff3c4;
}

#homeBtn{
  grid-column:1/3;
  background:#e4ecff;
}

/* =========================================================
   READOUT
========================================================= */

#readout{
  margin-top:10px;
  padding:9px;

  background:#f5f7fb;
  border:1px solid #b9c4d0;
  border-radius:9px;

  font-size:13px;
  line-height:1.42;
}

#readout b{
  color:#063c78;
}

#resonanceBox{
  margin-top:9px;
  padding:9px;

  background:rgba(255,255,255,.95);
  border:1px solid #b9c4d0;
  border-radius:9px;

  font-size:13px;
  line-height:1.4;
}

.resonance{
  color:#c00000;
  font-size:18px;
  font-weight:700;
}

/* =========================================================
   RIGHT GRAPHS
========================================================= */

#graphsPanel{
  position:fixed;
  top:18px;
  right:18px;

  width:410px;

  z-index:25;

  display:flex;
  flex-direction:column;
  gap:12px;
}

.graphBox{
  padding:8px;

  background:rgba(250,250,250,.97);
  border:2px solid #667;
  border-radius:12px;

  box-shadow:0 5px 15px rgba(0,0,0,.18);
}

.graphTitle{
  margin-bottom:5px;
  text-align:center;
  font-size:14px;
  font-weight:700;
  color:#073d77;
}

canvas.graph{
  display:block;
  width:100%;
  height:220px;

  background:#fff;

  border:1px solid #aaa;
  border-radius:7px;
}

@media(max-width:1200px){
  #graphsPanel{width:360px}
  #controls{width:260px}
  #titleBox h1{font-size:25px}
}

@media(max-height:760px){
  #controls{
    top:10px;
    padding:9px;
  }

  .row{margin:7px 0}

  #graphsPanel{
    top:10px;
    gap:8px;
  }

  canvas.graph{
    height:185px;
  }

  #readout,
  #resonanceBox{
    font-size:12px;
    padding:7px;
  }
}
</style>
</head>

<body>

<div id="container"></div>

<div id="titleBox">
  <h1>RLC Series Resonance</h1>
  <div class="sub">乐启享物理仿真</div>
</div>

<!-- ======================================================
     LEFT PANEL
====================================================== -->

<div id="controls">

  <h3>Series RLC Circuit</h3>

  <div class="row">
    <label>
      Frequency
      <span id="frequencyText">100 Hz</span>
    </label>

    <input
      id="freqSlider"
      type="range"
      min="50"
      max="1200"
      step="1"
      value="100">
  </div>

  <div class="row">
    <label>
      Resistance
      <span id="rValue">50 Ω</span>
    </label>

    <input
      id="rSlider"
      type="range"
      min="10"
      max="200"
      step="1"
      value="50">
  </div>

  <div class="row">
    <label>
      Inductance
      <span id="lValue">20 mH</span>
    </label>

    <input
      id="lSlider"
      type="range"
      min="5"
      max="100"
      step="1"
      value="20">
  </div>

  <div class="row">
    <label>
      Capacitance
      <span id="cValue">5.0 µF</span>
    </label>

    <input
      id="cSlider"
      type="range"
      min="1"
      max="20"
      step=".5"
      value="5">
  </div>

  <div class="row">
    <label>
      Source Voltage
      <span id="vValue">30 V rms</span>
    </label>

    <input
      id="vSlider"
      type="range"
      min="5"
      max="100"
      step="1"
      value="30">
  </div>

  <div class="btnRow">

    <button
      class="btn"
      id="startBtn">
      Start
    </button>

    <button
      class="btn"
      id="resetBtn">
      Reset
    </button>

    <button
      class="btn"
      id="coreBtn">
      Insert Iron Core
    </button>

    <button
      class="btn"
      id="homeBtn">
      Simulation Home
    </button>

  </div>

  <div id="readout"></div>
  <div id="resonanceBox"></div>

</div>

<!-- ======================================================
     RIGHT GRAPHS
====================================================== -->

<div id="graphsPanel">

  <div class="graphBox">

    <div class="graphTitle">
      Inductive and Capacitive Reactance vs. Frequency
    </div>

    <canvas
      id="reactanceGraph"
      class="graph"
      width="820"
      height="360">
    </canvas>

  </div>

  <div class="graphBox">

    <div class="graphTitle">
      Series Current vs. Frequency
    </div>

    <canvas
      id="currentGraph"
      class="graph"
      width="820"
      height="360">
    </canvas>

  </div>

</div>
