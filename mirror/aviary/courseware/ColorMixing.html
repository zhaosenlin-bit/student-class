	<script>
var yourscore = 0;
var redvalue = 0;
var bluevalue = 0;
var greenvalue = 0;
var realred = 0;
var realblue = 0;
var realgreen = 0;
var colornumber = 0;
var percentageredreal = 0;
var percentagegreenreal = 0;
var percentagebluereal = 0;
var percentagered = 0;
var percentagegreen = 0;
var percentageblue = 0;
var bonuspoints = 0;


function StartGame(){
	yourscore = 0;
	redvalue = 0;
	bluevalue = 0;
	greenvalue = 0;
	realred = 0;
	realblue = 0;
	realgreen = 0;
	percentageredreal = 0;
	percentagegreenreal = 0;
	percentagebluereal = 0;
	percentagered = 0;
	percentagegreen = 0;
	percentageblue = 0;
	colornumber = 0;
	bonuspoints = 0;
	document.getElementById("MainBody").style.visibility = "visible";
	document.getElementById("RestartButton").style.visibility = "hidden";
	document.getElementById("Score").innerHTML = "Your Score " + yourscore;
	document.getElementById("RoundPoints").innerHTML = "Round Points: 0";
	document.getElementById("RoundBonusPoints").style.visibility = "Round Bonus Points: 0";
	document.getElementById("NextColorButton").style.visibility = "hidden";
	document.getElementById("CheckButton").style.visibility = "visible";
	SetColorToMatch();
}



function SetColorToMatch(){
	redvalue = 0;
	bluevalue = 0;
	greenvalue = 0;
	bonuspoints = 0;
	realred = Math.floor((Math.random()*255)+1);
	percentageredreal = parseInt(realred/255*100);
	realblue = Math.floor((Math.random()*255)+1);
	percentagebluereal = parseInt(realblue/255*100);
	realgreen = Math.floor((Math.random()*255)+1);
	percentagegreenreal = parseInt(realgreen/255*100);
	colornumber++;
	colorstring = "rgb(" + realred + ", " + realgreen + ", " + realblue + ")";
	document.getElementById("GivenColorBox").style.backgroundColor = colorstring;
	document.getElementById("RedControls").style.backgroundColor = "rgb(125, 125, 125)";
	document.getElementById("GreenControls").style.backgroundColor = "rgb(125, 125, 125)";
	document.getElementById("BlueControls").style.backgroundColor = "rgb(125, 125, 125)";
	document.getElementById("RedPercent").innerHTML = "0%";
	document.getElementById("GreenPercent").innerHTML = "0%";
	document.getElementById("BluePercent").innerHTML = "0%";
	document.getElementById("ColorBox").style.backgroundColor = "rgb(0,0,0)";
	document.getElementById("CheckButton").innerHTML = "Check (" + colornumber + ")";
	document.getElementById("CheckButton").style.visibility = "visible";
	document.getElementById("RedSaying").innerHTML = " ";
	document.getElementById("GreenSaying").innerHTML = " ";
	document.getElementById("BlueSaying").innerHTML = " ";
	document.getElementById("NextColorButton").style.visibility = "hidden";
	document.getElementById("CheckButton").style.visibility = "visible";
}

function ChangeRedSlider(x){
	percentagered = x;
	ChangeRedColor();
}

function RedArrow(y){
	if (y == "down"){
		percentagered--;
	}
	else{
		percentagered++;
	}
	if (percentagered > 100){
		percentagered = 100;
	}
	if (percentagered < 0){
		percentagered = 0;
	}
	ChangeRedColor();
}

function RedArrow10x(y){
	if (y == "down"){
		percentagered = percentagered - 10;
	}
	else{
		percentagered = percentagered + 10;
	}
	if (percentagered > 100){
		percentagered = 100;
	}
	if (percentagered < 0){
		percentagered = 0;
	}
	ChangeRedColor();
}


function ChangeRedColor(){
	redvalue = parseInt(percentagered/100*255);
	colorstring = "rgb(" + redvalue + ", " + greenvalue + ", " + bluevalue + ")";
	document.getElementById("ColorBox").style.backgroundColor = colorstring;
	document.getElementById("RedPercent").innerHTML = percentagered + " %";
	colorstring = "rgb(" + redvalue + ", 0,0)";
	document.getElementById("ColorBoxRed").style.backgroundColor = colorstring;
}

function ChangeGreenSlider(x){
	percentagegreen = x;
	ChangeGreenColor();
}

function GreenArrow(y){
	if (y == "down"){
		percentagegreen--;
	}
	else{
		percentagegreen++;
	}
	if (percentagegreen > 100){
		percentagegreen = 100;
	}
	if (percentagegreen < 0){
		percentagegreen = 0;
	}
	
	ChangeGreenColor();
}

function GreenArrow10x(y){
	if (y == "down"){
		percentagegreen = percentagegreen - 10;
	}
	else{
		percentagegreen = percentagegreen + 10;
	}
	if (percentagegreen > 100){
		percentagegreen = 100;
	}
	if (percentagegreen < 0){
		percentagegreen = 0;
	}
	ChangeGreenColor();
}

function ChangeGreenColor(){
	greenvalue = parseInt(percentagegreen/100*255);
	colorstring = "rgb(" + redvalue + ", " + greenvalue + ", " + bluevalue + ")";
	document.getElementById("ColorBox").style.backgroundColor = colorstring;
	document.getElementById("GreenPercent").innerHTML = percentagegreen + " %";
	colorstring = "rgb(0, " + greenvalue + ",0)";
	document.getElementById("ColorBoxGreen").style.backgroundColor = colorstring;
}

function ChangeBlueSlider(x){
	percentageblue = x;
	ChangeBlueColor();
}

function BlueArrow(y){
	if (y == "down"){
		percentageblue--;
	}
	else{
		percentageblue++;
	}
	if (percentageblue > 100){
		percentageblue = 100;
	}
	if (percentageblue < 0){
		percentageblue = 0;
	}
	
	ChangeBlueColor();
}

function BlueArrow10x(y){
	if (y == "down"){
		percentageblue = percentageblue - 10;
	}
	else{
		percentageblue = percentageblue + 10;
	}
	if (percentageblue > 100){
		percentageblue = 100;
	}
	if (percentageblue < 0){
		percentageblue = 0;
	}
	ChangeBlueColor();
}

function ChangeBlueColor(){
	bluevalue = parseInt(percentageblue/100*255);
	colorstring = "rgb(" + redvalue + ", " + greenvalue + ", " + bluevalue + ")";
	document.getElementById("ColorBox").style.backgroundColor = colorstring;
	document.getElementById("BluePercent").innerHTML = percentageblue + " %";
		colorstring = "rgb(0, 0, " + bluevalue + ")";
	document.getElementById("ColorBoxBlue").style.backgroundColor = colorstring;
	
}

function Checker(){
	
	redoffset = Math.abs(percentagered - percentageredreal);
	
	if (redoffset < 3){
		document.getElementById("RedControls").style.backgroundColor = "rgb(255, 255, 255)";
		bonuspoints = bonuspoints + 10;
		document.getElementById("RedSaying").innerHTML = "10 Point Bonus:  Actual " + percentageredreal + "%";
		
	}
	else{
		document.getElementById("RedControls").style.backgroundColor = "rgb(125, 125, 125)";
		document.getElementById("RedSaying").innerHTML = "Actual " + percentageredreal + "%";
	}

	
	greenoffset = Math.abs(percentagegreen - percentagegreenreal);
	
	if (greenoffset < 3){
		document.getElementById("GreenControls").style.backgroundColor = "rgb(255, 255, 255)";
		bonuspoints = bonuspoints + 10;
		document.getElementById("GreenSaying").innerHTML = "10 Point Bonus:  Actual " + percentagegreenreal + "%";
	}
	else{
		document.getElementById("GreenControls").style.backgroundColor = "rgb(125, 125, 125)";
		document.getElementById("GreenSaying").innerHTML = "Actual " + percentagegreenreal + "%";
	}			
	
	blueoffset = Math.abs(percentageblue - percentagebluereal);
	
	
	if (blueoffset < 3){
		document.getElementById("BlueControls").style.backgroundColor = "rgb(255, 255, 255)";
		bonuspoints = bonuspoints + 10;
		document.getElementById("BlueSaying").innerHTML = "10 Point Bonus:  Actual " + percentagebluereal + "%";
	}
	else{
		document.getElementById("BlueControls").style.backgroundColor = "rgb(125, 125, 125)";
		document.getElementById("BlueSaying").innerHTML = "Actual " + percentagebluereal + "%";
	}
	
	totaloffset = redoffset + blueoffset + greenoffset;
	regularpointsthisround = 40 - 1*totaloffset;
	yourscore = yourscore + bonuspoints + regularpointsthisround;
	
	
	document.getElementById("RoundPoints").innerHTML = "Round Points: " + regularpointsthisround;
	document.getElementById("RoundBonusPoints").innerHTML = "Bonus Points: " + bonuspoints;
	document.getElementById("Score").innerHTML = "Your Score " + yourscore;
	document.getElementById("NextColorButton").style.visibility = "visible";
	document.getElementById("CheckButton").style.visibility = "hidden";
	if (colornumber > 4){
		GameOver();
	}
}

function GameOver(){
	document.getElementById("RestartButton").style.visibility = "visible";
	document.getElementById("CheckButton").style.visibility = "hidden";
	document.getElementById("NextColorButton").style.visibility = "hidden";
	document.getElementById("Score").innerHTML = "Your Score " + yourscore;
}
			
</script>
