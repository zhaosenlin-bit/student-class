<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🧊 认识长方体 · 交互探索</title>
  <style>
    /* 浅色明亮风 + 活力彩色系 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      background: #f5f7fa;
      color: #1e2a3a;
    }

    :root {
      --bg-main: #f5f7fa;
      --bg-card: #ffffff;
      --bg-panel: #ffffff;
      --bg-panel-alt: #f0f3f8;
      --border: #d0d9e6;
      --text: #1e2a3a;
      --text-dim: #5e6f8d;
      --accent: #2a7de1;
      --accent2: #f5a623;
      --accent3: #4caf50;
      --accent4: #ff6b6b;
      --danger: #e63946;
      --panel-width: 280px;
      --header-h: 48px;
      --transition: 0.25s ease;
      --radius: 14px;
      --shadow-card: 0 8px 20px rgba(0, 0, 0, 0.04);
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg-main);
    }

    #mobile-header {
      display: none;
      height: var(--header-h);
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }
    #mobile-header h1 {
      font-size: 17px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.5px;
    }
    #mobile-header .header-controls {
      display: flex;
      gap: 8px;
    }
    #mobile-header .header-controls .btn {
      background: var(--bg-panel-alt);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
    }
    #mobile-header .header-controls .btn:hover {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    #main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ===== 左面板 ===== */
    #left-panel {
      width: var(--panel-width);
      min-width: var(--panel-width);
      background: var(--bg-card);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 6px 0 20px;
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.02);
    }
    #left-panel::-webkit-scrollbar {
      width: 4px;
    }
    #left-panel::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 8px;
    }

    .panel-section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .panel-section:last-child {
      border-bottom: none;
    }
    .panel-section h3 {
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
    }
    .panel-section h3::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--accent);
      border-radius: 3px;
    }

    /* 控件组 */
    .ctrl-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .ctrl-group label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--text);
      cursor: pointer;
      padding: 6px 0;
      transition: 0.15s;
      border-radius: 6px;
    }
    .ctrl-group label:hover {
      background: var(--bg-panel-alt);
      padding-left: 6px;
    }
    .ctrl-group label input[type="checkbox"] {
      accent-color: var(--accent);
      width: 18px;
      height: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .ctrl-group label .label-icon {
      font-size: 16px;
      margin-right: 2px;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .btn {
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-panel-alt);
      color: var(--text);
      transition: all 0.2s;
      white-space: nowrap;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
    }
    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(42, 125, 225, 0.06);
    }
    .btn.active {
      border-color: var(--accent2);
      color: #b87c1c;
      background: rgba(245, 166, 35, 0.12);
      box-shadow: 0 0 0 1px rgba(245, 166, 35, 0.2);
    }
    .btn.accent {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn .badge {
      background: var(--accent);
      color: #fff;
      border-radius: 30px;
      padding: 0 8px;
      font-size: 11px;
      margin-left: 4px;
    }

    /* ===== 中视口 ===== */
    #center-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #eef2f6;
      background-image: radial-gradient(circle at 20% 30%, #f9fcff 0%, #e2e9f0 100%);
    }
    #center-panel canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* 信息浮层 */
    .info-card {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(42, 125, 225, 0.25);
      border-radius: 16px;
      padding: 12px 24px;
      max-width: 420px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.3s ease;
      z-index: 6;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .info-card.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .info-card .highlight {
      color: var(--accent2);
      font-weight: 700;
    }

    /* ===== 右面板 ===== */
    #right-panel {
      width: var(--panel-width);
      min-width: var(--panel-width);
      background: var(--bg-card);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 6px 0 20px;
      box-shadow: -2px 0 12px rgba(0, 0, 0, 0.02);
    }
    #right-panel::-webkit-scrollbar {
      width: 4px;
    }
    #right-panel::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 8px;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 14px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.04);
    }
    .data-row:last-child {
      border-bottom: none;
    }
    .data-row .label {
      color: var(--text-dim);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .data-row .value {
      color: var(--text);
      font-weight: 600;
      text-align: right;
    }
    .data-row .value.highlight-value {
      color: var(--accent2);
      font-weight: 700;
    }
    .stat-icon {
      font-size: 16px;
    }

    .pill-tag {
      display: inline-block;
      background: var(--bg-panel-alt);
      border-radius: 30px;
      padding: 2px 12px;
      font-size: 12px;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    /* ===== 响应式 ===== */
    @media (max-width: 900px) {
      #mobile-header {
        display: flex;
      }
      #left-panel {
        position: fixed;
        left: 0;
        top: var(--header-h);
        bottom: 0;
        z-index: 50;
        margin-left: calc(-1 * var(--panel-width) - 8px);
        transition: margin-left var(--transition);
        box-shadow: 4px 0 30px rgba(0, 0, 0, 0.08);
        border-right: none;
        border-radius: 0 16px 16px 0;
      }
      #left-panel.open {
        margin-left: 0;
      }
      #right-panel {
        position: fixed;
        right: 0;
        top: var(--header-h);
        bottom: 0;
        z-index: 50;
        margin-right: calc(-1 * var(--panel-width) - 8px);
        transition: margin-right var(--transition);
        box-shadow: -4px 0 30px rgba(0, 0, 0, 0.08);
        border-left: none;
        border-radius: 16px 0 0 16px;
      }
      #right-panel.open {
        margin-right: 0;
      }
      #center-panel {
        flex: 1;
      }
      .info-card {
        top: 12px;
        max-width: 85%;
        padding: 10px 16px;
        font-size: 13px;
      }
    }

    @media (max-width: 500px) {
      :root {
        --panel-width: 260px;
      }
      .panel-section {
        padding: 12px 14px;
      }
      .ctrl-group label {
        font-size: 13px;
        padding: 5px 0;
      }
    }

    /* 小工具 */
    .mt-1 {
      margin-top: 6px;
    }
    .text-small {
      font-size: 12px;
      color: var(--text-dim);
    }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>

  <div id="app">
    <!-- 移动端头栏 -->
    <header id="mobile-header">
      <h1>🧊 认识长方体</h1>
      <div class="header-controls">
        <button class="btn" id="mob-toggle-left">📐 控制</button>
        <button class="btn" id="mob-toggle-right">📊 数据</button>
      </div>
    </header>

    <div id="main-layout">
      <!-- 左控制面板 -->
      <aside id="left-panel">
        <div class="panel-section">
          <h3>👁️ 显示控制</h3>
          <div class="ctrl-group">
            <label><input type="checkbox" id="chk-vertices" checked> <span class="label-icon">🔴</span> 顶点 (8个)</label>
            <label><input type="checkbox" id="chk-edges" checked> <span class="label-icon">📏</span> 棱 (12条)</label>
            <label><input type="checkbox" id="chk-faces" checked> <span class="label-icon">▣</span> 面 (6个)</label>
            <label><input type="checkbox" id="chk-labels" checked> <span class="label-icon">📐</span> 长宽高标注</label>
          </div>
        </div>

        <div class="panel-section">
          <h3>✨ 高亮棱组</h3>
          <div class="btn-row">
            <button class="btn active" data-group="all">全部</button>
            <button class="btn" data-group="length">长 (4条)</button>
            <button class="btn" data-group="width">宽 (4条)</button>
            <button class="btn" data-group="height">高 (4条)</button>
          </div>
          <div class="text-small mt-1" style="color:var(--text-dim); padding:4px 0 0 4px;">
            💡 点击高亮一组相对的棱
          </div>
        </div>

        <div class="panel-section">
          <h3>🔄 视角重置</h3>
          <div class="btn-row">
            <button class="btn accent" id="btn-reset-view">↺ 重置视角</button>
          </div>
        </div>

        <div class="panel-section" style="border-bottom:none;">
          <h3>🧭 操作提示</h3>
          <div style="font-size:13px; color:var(--text-dim); line-height:1.6; padding:2px 0;">
            🖱️ 拖拽旋转 · 滚轮缩放<br>
            ✅ 勾选显示/隐藏部件
          </div>
        </div>
      </aside>

      <!-- 中间3D视口 -->
      <main id="center-panel">
        <div class="info-card" id="info-card-top">
          🧊 <span class="highlight">长方体</span> · 拖拽探索结构
        </div>
        <!-- Three.js 渲染将挂载到此 -->
      </main>

      <!-- 右信息面板 -->
      <aside id="right-panel">
        <div class="panel-section">
          <h3>📊 数量统计</h3>
          <div class="data-row"><span class="label"><span class="stat-icon">🔴</span> 顶点</span><span class="value">8 个</span></div>
          <div class="data-row"><span class="label"><span class="stat-icon">📏</span> 棱</span><span class="value">12 条</span></div>
          <div class="data-row"><span class="label"><span class="stat-icon">▣</span> 面</span><span class="value">6 个</span></div>
          <div class="data-row" style="border-bottom: none;"><span class="label"><span class="stat-icon">📌</span> 相对面</span><span class="value">3 组</span></div>
        </div>

        <div class="panel-section">
          <h3>📐 棱长信息</h3>
          <div class="data-row"><span class="label">长 (a)</span><span class="value" id="val-length">4.0</span></div>
          <div class="data-row"><span class="label">宽 (b)</span><span class="value" id="val-width">2.8</span></div>
          <div class="data-row"><span class="label">高 (h)</span><span class="value" id="val-height">2.0</span></div>
          <div class="data-row" style="border-bottom: none;">
            <span class="label">⚡ 棱长总和</span>
            <span class="value highlight-value" id="val-sum">35.2</span>
          </div>
        </div>

        <div class="panel-section" style="border-bottom: none;">
          <h3>💡 小知识</h3>
          <div style="font-size:13px; color:var(--text-dim); line-height:1.7; padding:4px 0;">
            • 一个顶点引出 <strong>3条棱</strong>（长、宽、高）<br>
            • 相对的面 <strong>完全相同</strong><br>
            • 正方体是特殊的长方体
          </div>
        </div>
      </aside>
    </div>
  </div>
