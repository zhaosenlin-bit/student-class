function timeDilationFactor(speed) {
    const gamma = 1 / Math.sqrt(1 - Math.pow(speed, 2)); // Lorentz factor
    return 1 / gamma; // Correct dilation factor
}

function lengthContractionFactor(speed) {
    return Math.sqrt(1 - Math.pow(speed, 2)); // Length contracts as speed increases
}

function updateObjectLength() {
    const contractionFactor = lengthContractionFactor(speed / maxSpeed);
    scene.remove(movingObj);
    // Create a new object with the contracted radius
    let newLength = length * contractionFactor; // Reduce radius based on speed
    movingObj = createObject(newLength, movingObj.position.x, movingObj.position.y, movingObj.position.z, 'blue');
    movingObj.add(clock1);
    movingObj.add(needle1);
}	
	
function updateNeedles(deltaTime) {
    const dilationFactor = Math.max(timeDilationFactor(speed / maxSpeed), 0.01); // Prevent needle from stopping completely

    needle1.rotation.z -= deltaTime * 0.1 * dilationFactor; // Moving clock, but prevents zero rotation
    updateObjectLength();
}

}
	
function drawRuler(scaleFactor = 0.0000001) { 
    // Create a canvas element
    let canvas = document.createElement('canvas');
    canvas.id = 'rulerCanvas';
    canvas.width = 1000; // Adjust width to fit screen
    canvas.height = 100; // Height for ruler and labels
    canvas.style.position = 'absolute';
    canvas.style.top = '50%'; // Center vertically
    canvas.style.left = '50%'; // Center horizontally
    canvas.style.transform = 'translate(-50%, 1px)'; // Shift 1px down from center
    canvas.style.border = '1px solid white';
    document.body.appendChild(canvas);

    let ctx = canvas.getContext('2d');

    // Define the real-world distance represented (300,000,000 meters)
    let realDistance = 300000000;  // 300 million meters (300,000 km)

    // Define better scaling factor for visibility
    let scaledDistance = realDistance * scaleFactor; 
    let canvasWidth = canvas.width - 100;  // Leave some margin

    // Scaling factor to fit the distance within the canvas
    let pixelsPerMeter = canvasWidth / realDistance;

    // Draw the main ruler line
    ctx.beginPath();
    ctx.moveTo(50, 50);
    ctx.lineTo(canvasWidth + 50, 50);
    ctx.strokeStyle = 'white';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Draw tick marks and labels
    let tickInterval = 50000000; // Ticks every 50,000,000 meters (50,000 km)
    let tickLength = 15;

    for (let i = 0; i <= realDistance; i += tickInterval) {
        let x = 50 + (i * pixelsPerMeter);  // Calculate correct tick position

        // Draw tick mark
        ctx.beginPath();
        ctx.moveTo(x, 40);
        ctx.lineTo(x, 60);
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'white';
        ctx.stroke();

        // Label the tick mark
        ctx.font = '14px Arial';
        ctx.fillStyle = 'white';
        ctx.textAlign = 'center';
        ctx.fillText(`${i / 1000} km`, x, 75);
    }

    // Label the entire ruler
    ctx.font = '16px Arial';
    ctx.fillStyle = 'white';
    ctx.textAlign = 'center';
    ctx.fillText('Travel Distance Scale: 299,792,458 (m/s) x 1 (s)', canvas.width / 2, 90);
}
	
function animate() {
    const deltaTime = 0.01; // Time step for each frame

    updateNeedles(deltaTime);

    // Move the moving object based on its speed
    movingObj.position.x += speed * deltaTime * 100; // Adjust multiplier to control movement speed

    // Wrap around screen when the object reaches the right side
    if (movingObj.position.x > sceneWidth / 2) {
        movingObj.position.x = -sceneWidth / 2;
    }

    // Keep the animation running
    if (!isPaused) {
        animationId = requestAnimationFrame(animate);
    }
}
