<body>
	
<div id="info">
    <h1>A Standing Wave on a String </h1>
  	
<div class="control-panel">
	      
	<div class="control-group">
	  <div class="slider-row">
	    Select Harmonic: <select id="harmonicSelector">
	      <option value="1" selected>n=1</option>
	      <option value="2">n=2</option>
	      <option value="3">n=3</option>
	      <option value="4">n=4</option>
	      <option value="5">n=5</option>
	      <option value="6">n=6</option>
	    </select>
	  </div>
	</div>
	
	<div class="control-group">
	    StringTension:
	    <div class="slider-row">
	      <input type="range" id="tensionSlider" min="200" max="600" step="10" value="400">
	      <input type="text" id="tensionValue" value="400 N" readonly>
	    </div>
	    <div class="minmax">
	      <span>200</span><span>600</span>
	    </div>
	</div>
	
	<div class="control-group">
	    Mass:
	    <div class="slider-row">
	      <input type="range" id="massSlider" min="0.3" max="1" step="0.1" value="0.5">
	      <input type="text" id="massValue" value="0.5 kg" readonly>
	    </div>
	    <div class="minmax">
	      <span>0.3</span><span>1</span>
	    </div>
	</div>
	
	<div class="control-group">
	    Amplitude:
	    <div class="slider-row">
	      <input type="range" id="ampSlider" min="1" max="3" step="0.1" value="2">
	      <input type="text" id="ampValue" value="2" readonly>
	    </div>
	    <div class="minmax">
	      <span>1</span><span>3</span>
	    </div>
	</div>

	<div class="control-group">
	    Length:
	    <div class="slider-row">
	      <input type="range" id="lenSlider" min="8" max="16" step="1" value="16">
	      <input type="text" id="lenValue" value="16 m" readonly>
	    </div>
	    <div class="minmax">
	      <span>8</span><span>16</span>
	    </div>
	</div>
	      
	 <div class="control-group">
	    Time:
	    <input type="text" id="timeValue" value="0.00 s" readonly style="width: 90px;">
	  </div>
	
         <button type="button" class="btn btn-warning" id="play" style="background-color:orange;">Play</button>
	 <button type="button" class="btn btn-danger" id="pause">Pause/Resume</button><br>
	   
</div>

<div id="viewport"></div>
	
</body>
</html>
