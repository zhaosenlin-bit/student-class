<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>位移与路程 · 交互式物理 v3</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: #0f0f23;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border-radius: 24px;
            padding: 28px;
            max-width: 1100px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7), 0 0 40px rgba(0,255,136,0.06);
            border: 1px solid rgba(255,255,255,0.06);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 6px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #00ff88, #00cec9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .header .badge {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.06);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .canvas-wrap {
            position: relative;
            background: #0d1b2a;
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.08);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: auto;
            cursor: pointer;
        }

        /* 进度控制条 */
        .progress-control {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .step-btn {
            width: 30px; height: 30px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.6);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .step-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .progress-track {
            flex: 1;
            height: 6px;
            -webkit-appearance: none;
            appearance: none;
            border-radius: 3px;
            background: rgba(255,255,255,0.08);
            outline: none;
            cursor: pointer;
        }
        .progress-track::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: #ffd93d;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(255,217,61,0.3);
            border: 2px solid rgba(255,255,255,0.2);
        }
        .progress-track::-moz-range-thumb {
            width: 18px; height: 18px;
            border-radius: 50%;
            background: #ffd93d;
            cursor: pointer;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .progress-pct {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            min-width: 36px;
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        /* 底部面板 */
        .bottom-panel {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 16px;
            margin-top: 12px;
        }

        .control-area {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.06);
        }
        .control-label {
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .path-btns {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .path-btn {
            flex: 1;
            min-width: 62px;
            padding: 6px 4px;
            border: 2px solid rgba(255,255,255,0.12);
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            text-align: center;
        }
        .path-btn:hover { background: rgba(255,255,255,0.08); transform: translateY(-1px); }
        .path-btn.active {
            border-color: #ffd93d;
            color: #ffd93d;
            background: rgba(255,217,61,0.12);
            box-shadow: 0 0 20px rgba(255,217,61,0.1);
        }
        .path-btn .path-icon { display: block; font-size: 15px; margin-bottom: 1px; }
        .path-btn .path-label { font-size: 10px; opacity: 0.7; }

        .path-btn[data-path="0"].active { border-color: #ffd93d; color: #ffd93d; }
        .path-btn[data-path="1"].active { border-color: #6c5ce7; color: #6c5ce7; }
        .path-btn[data-path="2"].active { border-color: #00cec9; color: #00cec9; }
        .path-btn[data-path="3"].active { border-color: #ff6b6b; color: #ff6b6b; }
        .path-btn[data-path="4"].active { border-color: #ff9ff3; color: #ff9ff3; }
        .path-btn[data-path="5"].active { border-color: #ffd93d; color: #ffd93d; }
        .path-btn[data-path="5"] .path-icon { font-size: 18px; }

        /* 绘制模式 */
        .draw-mode-hint {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.4);
            z-index: 15;
            pointer-events: none;
            border-radius: 14px;
            transition: opacity 0.3s;
        }
        .draw-mode-hint.hidden { opacity: 0; }
        .draw-mode-hint .icon { font-size: 48px; margin-bottom: 12px; }
        .draw-mode-hint .text { color: rgba(255,255,255,0.7); font-size: 16px; font-weight: 500; }
        .draw-mode-hint .sub { color: rgba(255,255,255,0.4); font-size: 13px; margin-top: 6px; }

        .draw-toolbar {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 8px;
            z-index: 15;
        }
        .draw-toolbar.show { display: flex; }
        .draw-btn {
            padding: 6px 18px;
            border: none;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .draw-btn:hover { transform: scale(1.05); }
        .draw-btn.confirm { background: linear-gradient(135deg, #00ff88, #00b894); color: #0f0f23; }
        .draw-btn.redo { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.15); }
        .draw-btn.redo:hover { background: rgba(255,255,255,0.18); }
        .draw-btn.back { background: rgba(255,107,107,0.15); color: #ff6b6b; border: 1px solid rgba(255,107,107,0.3); }

        .play-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .play-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: none;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .play-btn.play { background: linear-gradient(135deg, #00ff88, #00b894); color: #0f0f23; }
        .play-btn.play:hover { transform: scale(1.08); box-shadow: 0 0 25px rgba(0,255,136,0.3); }
        .play-btn.reset { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.6); }
        .play-btn.reset:hover { background: rgba(255,255,255,0.15); }

        .speed-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex: 1;
        }
        .speed-group label {
            font-size: 11px;
            color: rgba(255,255,255,0.4);
            white-space: nowrap;
        }
        .speed-group input[type="range"] {
            flex: 1;
            -webkit-appearance: none;
            height: 4px;
            border-radius: 2px;
            background: rgba(255,255,255,0.12);
            outline: none;
        }
        .speed-group input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px; height: 14px;
            border-radius: 50%;
            background: #00cec9;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,206,201,0.3);
        }
        .speed-val {
            font-size: 13px;
            font-weight: 700;
            color: #00cec9;
            min-width: 34px;
            text-align: center;
        }

        .ref-toggle {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .ref-toggle span { font-size: 12px; color: rgba(255,255,255,0.5); }
        .toggle-switch {
            position: relative;
            width: 48px; height: 26px;
            background: rgba(255,255,255,0.1);
            border-radius: 13px;
            cursor: pointer;
            transition: background 0.3s;
            flex-shrink: 0;
        }
        .toggle-switch.active { background: rgba(0,255,136,0.3); }
        .toggle-switch .knob {
            position: absolute;
            top: 3px; left: 3px;
            width: 20px; height: 20px;
            border-radius: 50%;
            background: #fff;
            transition: all 0.3s;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        .toggle-switch.active .knob { left: 25px; background: #00ff88; }
        .ref-label { font-size: 12px; color: rgba(255,255,255,0.7); font-weight: 500; }
        .ref-label .highlight { color: #00ff88; font-weight: 700; }

        /* 数据面板 */
        .data-area {
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            padding: 14px 16px;
            border: 1px solid rgba(255,255,255,0.06);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .data-title {
            font-size: 12px;
            color: rgba(255,255,255,0.35);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .data-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .data-row:last-child { border-bottom: none; }
        .data-row .label {
            font-size: 13px;
            color: rgba(255,255,255,0.55);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .data-row .label .dot {
            display: inline-block;
            width: 9px; height: 9px;
            border-radius: 50%;
        }
        .dot-red { background: #ff6b6b; }
        .dot-blue { background: #00cec9; }
        .data-row .value {
            font-size: 20px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
        }
        .val-red { color: #ff6b6b; }
        .val-blue { color: #00cec9; }
        .val-green { color: #00ff88; }

        .data-tag {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 4px;
            margin-left: 4px;
            font-weight: 600;
        }
        .tag-vector {
            background: rgba(255,107,107,0.15);
            color: #ff6b6b;
            border: 1px solid rgba(255,107,107,0.3);
        }
        .tag-scalar {
            background: rgba(0,206,201,0.15);
            color: #00cec9;
            border: 1px solid rgba(0,206,201,0.3);
        }

        /* 双柱对比条 */
        .data-bars {
            margin-top: 6px;
            padding: 6px 0 2px 0;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .bar-label {
            font-size: 10px;
            color: rgba(255,255,255,0.4);
            min-width: 28px;
            text-align: right;
        }
        .bar-track {
            flex: 1;
            height: 10px;
            background: rgba(255,255,255,0.06);
            border-radius: 5px;
            overflow: hidden;
            position: relative;
        }
        .bar-fill {
            height: 100%;
            border-radius: 5px;
            width: 0%;
            transition: width 0.15s ease;
        }
        .bar-fill.red { background: linear-gradient(90deg, #ff6b6b, #ee5a24); }
        .bar-fill.blue { background: linear-gradient(90deg, #00cec9, #00b894); }
        .bar-val {
            font-size: 10px;
            color: rgba(255,255,255,0.5);
            min-width: 42px;
            text-align: left;
            font-variant-numeric: tabular-nums;
        }

        .data-compare {
            margin-top: 4px;
            padding: 8px 10px;
            border-radius: 10px;
            background: rgba(255,217,61,0.08);
            border: 1px solid rgba(255,217,61,0.15);
            text-align: center;
            font-size: 12px;
            color: #ffd93d;
            font-weight: 500;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 到达弹窗 */
        .finish-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            border-radius: 16px;
            justify-content: center;
            align-items: center;
            z-index: 20;
            backdrop-filter: blur(4px);
        }
        .finish-overlay.show { display: flex; }
        .finish-card {
            background: linear-gradient(145deg, #1a1a2e, #16213e);
            border: 2px solid rgba(255,217,61,0.3);
            border-radius: 18px;
            padding: 24px 30px;
            text-align: center;
            max-width: 380px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        .finish-card .emoji { font-size: 42px; margin-bottom: 6px; }
        .finish-card h2 { color: #ffd93d; font-size: 20px; margin-bottom: 4px; }
        .finish-card p { color: rgba(255,255,255,0.7); font-size: 13px; margin-bottom: 4px; }
        .finish-card .big-num { font-size: 32px; font-weight: 800; color: #fff; }
        .finish-card .big-num .s { color: #ff6b6b; }
        .finish-card .big-num .d { color: #00cec9; }
        .finish-card .close-btn {
            margin-top: 12px;
            padding: 8px 28px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ffd93d, #f0a500);
            color: #0f0f23;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .finish-card .close-btn:hover { transform: scale(1.05); }

        /* 思考题 */
        .quiz-area {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .quiz-q {
            font-size: 13px;
            color: #ffd93d;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .quiz-opt {
            display: block;
            width: 100%;
            padding: 7px 10px;
            margin-bottom: 5px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.75);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .quiz-opt:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,217,61,0.3); }
        .quiz-opt.correct {
            background: rgba(0,255,136,0.15);
            border-color: #00ff88;
            color: #00ff88;
        }
        .quiz-opt.wrong {
            background: rgba(255,107,107,0.15);
            border-color: #ff6b6b;
            color: #ff6b6b;
        }
        .quiz-opt:disabled { cursor: default; opacity: 0.7; }
        .quiz-feedback {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            padding: 6px 8px;
            border-radius: 6px;
            margin-top: 4px;
            display: none;
        }
        .quiz-feedback.show { display: block; }
        .quiz-feedback.good { background: rgba(0,255,136,0.1); color: #00ff88; }
        .quiz-feedback.think { background: rgba(255,217,61,0.1); color: #ffd93d; }

        @media (max-width: 720px) {
            .bottom-panel { grid-template-columns: 1fr; }
            .container { padding: 16px; }
            .header h1 { font-size: 20px; }
            .data-row .value { font-size: 17px; }
            .path-btn { min-width: 50px; font-size: 11px; }
        }
    </style>
</head>

<div class="container">
    <div class="header">
        <h1>📍 位移 vs 路程</h1>
        <span class="badge">高中物理 · 必修一 · v3</span>
    </div>

    <div class="canvas-wrap">
        <!-- 进度控制条（嵌入在canvas-wrap顶部） -->
        <div class="progress-control">
            <button class="step-btn" id="stepBack" title="后退一步">◀</button>
            <input type="range" class="progress-track" id="progressTrack" min="0" max="1000" value="0">
            <button class="step-btn" id="stepFwd" title="前进一步">▶</button>
            <span class="progress-pct" id="progressPct">0%</span>
        </div>

        <canvas id="mainCanvas" width="1040" height="480"></canvas>

        <div class="finish-overlay" id="finishOverlay">
            <div class="finish-card">
                <div class="emoji" id="fEmoji">🏁</div>
                <h2 id="fTitle">到达终点！</h2>
                <p>位移 <span class="big-num"><span class="s" id="fDisp">0</span> m</span></p>
                <p>路程 <span class="big-num"><span class="d" id="fDist">0</span> m</span></p>
                <p id="fTip" style="color:#ffd93d;font-size:13px;"></p>
                <!-- 思考题 -->
                <div class="quiz-area" id="quizArea">
                    <div class="quiz-q" id="quizQ"></div>
                    <div id="quizOptions"></div>
                    <div class="quiz-feedback" id="quizFeedback"></div>
                </div>
                <button class="close-btn" onclick="closeFinish()">太棒了！再来一次</button>
            </div>
        </div>

        <!-- 绘图模式提示 -->
        <div class="draw-mode-hint hidden" id="drawHint">
            <div class="icon">🎨</div>
            <div class="text">在画布上拖拽画出路径</div>
            <div class="sub">松开手指自动完成 · 点击「重画」重新绘制</div>
        </div>
        <!-- 绘图工具栏 -->
        <div class="draw-toolbar" id="drawToolbar">
            <button class="draw-btn redo" onclick="redoDraw()">🔄 重画</button>
            <button class="draw-btn confirm" onclick="confirmDraw()">✅ 完成</button>
            <button class="draw-btn back" onclick="exitDrawMode()">✕ 退出</button>
        </div>
    </div>

    <div class="bottom-panel">
        <div class="control-area">
            <div class="control-label">🎯 选择路径</div>
            <div class="path-btns">
                <button class="path-btn active" data-path="0">
                    <span class="path-icon">➖</span>
                    <span class="path-label">直线</span>
                </button>
                <button class="path-btn" data-path="1">
                    <span class="path-icon">🔀</span>
                    <span class="path-label">折线</span>
                </button>
                <button class="path-btn" data-path="2">
                    <span class="path-icon">〰️</span>
                    <span class="path-label">曲线</span>
                </button>
