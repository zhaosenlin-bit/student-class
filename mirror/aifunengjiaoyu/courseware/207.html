<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>英雄知识大乱斗 · 答题对战</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #2a2a3a 0%, #1a1a2a 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        .card {
            max-width: 960px;
            width: 100%;
            background: rgba(245, 240, 235, 0.85);
            backdrop-filter: blur(6px);
            border-radius: 48px 48px 36px 36px;
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.7), inset 0 1px 4px rgba(255, 245, 225, 0.4);
            padding: 28px 28px 32px;
            transition: all 0.2s ease;
            border: 1px solid #d6cfc0;
        }

        h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: 2px;
            color: #2f2a20;
            margin: 0 0 8px 12px;
            text-shadow: 2px 2px 0 #ece3d4;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 300;
            color: #5f4f3a;
            margin-left: auto;
            background: #d6cbbc;
            padding: 6px 20px;
            border-radius: 40px;
            letter-spacing: 1px;
            box-shadow: inset 0 1px 6px rgba(255, 240, 200, 0.7);
        }

        /* 战斗区域 */
        .battle-arena {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 16px 10px;
            margin: 12px 0 18px;
        }

        .fighter-card {
            flex: 1 1 180px;
            min-width: 140px;
            background: #ece3d4;
            border-radius: 40px;
            padding: 16px 14px 20px;
            box-shadow: inset 0 2px 8px #b8aa93, 0 6px 12px rgba(0,0,0,0.2);
            text-align: center;
            backdrop-filter: blur(2px);
        }

        .fighter-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2f2a20;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .fighter-name .emoji-badge {
            font-size: 2rem;
        }

        .hp-bar-wrap {
            background: #4d3e2b;
            border-radius: 60px;
            height: 22px;
            margin: 10px 0 4px;
            box-shadow: inset 0 3px 6px rgba(0,0,0,0.4);
            overflow: hidden;
        }
        .hp-bar {
            height: 100%;
            width: 100%;
            background: #e03a3a;
            background: linear-gradient(90deg, #d43f3f, #b32b2b);
            border-radius: 60px;
            transition: width 0.2s ease;
            box-shadow: inset 0 1px 8px #ff7a7a;
        }
        .hp-bar.hp-hero {
            background: linear-gradient(90deg, #4b8c5a, #2f6a3b);
        }
        .hp-bar.hp-enemy {
            background: linear-gradient(90deg, #b33f3f, #8a2828);
        }

        .hp-text {
            font-weight: 600;
            font-size: 0.9rem;
            color: #2f2a20;
            letter-spacing: 0.5px;
        }

        .vs-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            color: #6b4f32;
            background: #d6cbbc;
            padding: 0 20px;
            border-radius: 60px;
            box-shadow: inset 0 2px 6px #b8aa93;
            min-width: 60px;
        }

        /* 题目区域 */
        .question-panel {
            background: #f3ede2;
            border-radius: 40px;
            padding: 24px 28px;
            margin: 10px 0 20px;
            box-shadow: inset 0 2px 10px #c6b8a4, 0 8px 16px rgba(0,0,0,0.1);
        }

        .question-text {
            font-size: 1.4rem;
            font-weight: 500;
            color: #2f2a20;
            line-height: 1.4;
            margin-bottom: 20px;
            min-height: 3.2rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 14px;
            margin-bottom: 8px;
        }

        .option-btn {
            background: #e8dfce;
            border: none;
            padding: 16px 6px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 500;
            color: #2f2a20;
            box-shadow: 0 4px 0 #b8aa93, 0 6px 12px rgba(0,0,0,0.1);
            transition: all 0.06s linear;
            cursor: pointer;
            letter-spacing: 0.3px;
            text-align: center;
        }
        .option-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b8aa93;
        }
        .option-btn:disabled {
            opacity: 0.5;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b8aa93;
            pointer-events: none;
        }
        .option-btn.correct-answer {
            background: #5f9e6b;
            color: white;
            box-shadow: 0 2px 0 #2f6a3b;
        }
        .option-btn.wrong-answer {
            background: #c05a5a;
            color: white;
            box-shadow: 0 2px 0 #7a2f2f;
        }

        .feedback-area {
            margin-top: 18px;
            padding: 12px 20px;
            background: #dad0bc;
            border-radius: 40px;
            min-height: 3.2rem;
            font-size: 1rem;
            color: #1f1a12;
            box-shadow: inset 0 2px 6px #b8aa93;
        }

        /* 战斗日志 */
        .log-area {
            background: #d9cfba;
            border-radius: 32px;
            padding: 14px 20px;
            margin: 12px 0 10px;
            max-height: 100px;
            overflow-y: auto;
            box-shadow: inset 0 2px 8px #b8aa93;
            font-size: 0.9rem;
            color: #2f2a20;
        }
        .log-area div {
            padding: 2px 0;
            border-bottom: 1px solid #c6b8a4;
        }
        .log-area div:last-child {
            border-bottom: none;
        }

        .control-bar {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 10px;
        }

        .icon-btn {
            background: #e8dfce;
            border: none;
            padding: 12px 32px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 500;
            color: #2f2a20;
            box-shadow: 0 4px 0 #b8aa93, 0 6px 12px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: all 0.05s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .icon-btn:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 #b8aa93;
        }
        .icon-btn:disabled {
            opacity: 0.4;
            transform: translateY(2px);
            pointer-events: none;
        }

        .footer-note {
            margin-top: 12px;
            color: #6b5d4a;
            font-size: 0.8rem;
            text-align: center;
            opacity: 0.7;
        }

        @media (max-width: 600px) {
            .card { padding: 16px; }
            h1 { font-size: 1.4rem; }
            .fighter-card { min-width: 100px; }
            .vs-divider { padding: 0 12px; font-size: 1.5rem; min-width: 40px; }
            .question-text { font-size: 1.1rem; }
            .options-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
