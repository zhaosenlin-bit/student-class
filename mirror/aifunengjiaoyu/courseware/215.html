<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 太阳系 · 行星聚焦 · 语音解说</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: rgba(255, 255, 255, 0.8);
            background: rgba(0, 0, 0, 0.6);
            padding: 12px 20px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
            font-size: 14px;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #info span {
            color: #ffd966;
            font-weight: 600;
        }
        #controls-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 14px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            letter-spacing: 1px;
            z-index: 10;
            white-space: nowrap;
            pointer-events: none;
        }
        /* 信息卡片 + 聚焦按钮 */
        #planet-card {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(10, 10, 30, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 20px 30px;
            color: #f0f0ff;
            min-width: 260px;
            max-width: 400px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.8);
            z-index: 20;
            transition: opacity 0.3s ease, transform 0.3s ease;
            opacity: 0;
            transform: translateX(-50%) translateY(20px);
            pointer-events: none;
            text-align: center;
        }
        #planet-card.active {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        #planet-card h2 {
            margin: 0 0 8px 0;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: 2px;
            color: #ffd966;
        }
        #planet-card .sub {
            font-size: 14px;
            color: #aab;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        #planet-card .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            font-size: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        #planet-card .info-row:last-child {
            border-bottom: none;
        }
        #planet-card .info-row .label {
            color: #99aabb;
        }
        #planet-card .info-row .value {
            color: #ffffff;
            font-weight: 500;
        }
        #planet-card .actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        #planet-card .actions button {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 40px;
            padding: 6px 20px;
            color: #ccc;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            letter-spacing: 1px;
        }
        #planet-card .actions button:hover {
            background: rgba(255,255,255,0.2);
            color: #fff;
        }
        #planet-card .actions .focus-btn {
            background: rgba(100, 180, 255, 0.2);
            border-color: rgba(100, 180, 255, 0.4);
            color: #8cf;
        }
        #planet-card .actions .focus-btn:hover {
            background: rgba(100, 180, 255, 0.35);
            border-color: rgba(100, 180, 255, 0.7);
            color: #fff;
        }
        #voice-status {
            position: absolute;
            top: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.5);
            padding: 8px 16px;
            border-radius: 30px;
            font-size: 13px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            pointer-events: none;
            letter-spacing: 1px;
        }
        #voice-status .speaking {
            color: #7cf;
        }
        @media (max-width: 600px) {
            #info { font-size: 12px; padding: 8px 14px; top: 15px; left: 15px; }
            #controls-hint { font-size: 11px; padding: 5px 12px; bottom: 20px; }
            #planet-card { padding: 16px 20px; min-width: 200px; bottom: 60px; }
            #planet-card h2 { font-size: 22px; }
            #voice-status { font-size: 11px; padding: 5px 12px; top: 15px; right: 15px; }
        }
    </style>
</head>
