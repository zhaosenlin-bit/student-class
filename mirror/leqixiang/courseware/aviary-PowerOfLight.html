function drawlight(){
	BaseOfLightWidth = 1.0*LightR;
	BaseOfLightHeight = 1.8*LightR;
	BaseOfLightCurve = 0.3*LightR;
	RadiusOfGlass = 2*LightR;
	HeightOfGlassStem = 0.4*LightR;
	ctx.strokeStyle= "#000000";
	ctx.lineWidth = 4;
	//Wire in Light
	
	ctx.beginPath();
	ctx.moveTo(LightX-0.5*BaseOfLightWidth, LightY+BaseOfLightHeight);
	ctx.lineTo(LightX-1.0*BaseOfLightWidth, LightY-HeightOfGlassStem-RadiusOfGlass);
	ctx.moveTo(LightX+0.5*BaseOfLightWidth, LightY+BaseOfLightHeight);
	ctx.lineTo(LightX+1.0*BaseOfLightWidth, LightY-HeightOfGlassStem-RadiusOfGlass);
	ctx.stroke();
	
	ctx.lineWidth = 1;
	ctx.beginPath();
	ctx.moveTo(LightX-1.1*BaseOfLightWidth, LightY-HeightOfGlassStem-0.9*RadiusOfGlass);
	ctx.lineTo(LightX+1.1*BaseOfLightWidth, LightY-HeightOfGlassStem-0.9*RadiusOfGlass);
	ctx.stroke();
	
	ctx.lineWidth = 2;
	
	
	
	
	//Glass of Light

	ctx.globalAlpha = 0.5;
	ctx.fillStyle = "#FFFFFF";
	ctx.beginPath();
	ctx.moveTo(LightX-BaseOfLightWidth,LightY+BaseOfLightHeight);
	ctx.lineTo(LightX-BaseOfLightWidth,LightY-HeightOfGlassStem);
	ctx.arc(LightX, LightY-HeightOfGlassStem-RadiusOfGlass, RadiusOfGlass,0.7*Math.PI, 2.3*Math.PI);
	ctx.lineTo(LightX+BaseOfLightWidth,LightY-HeightOfGlassStem);
	ctx.lineTo(LightX+BaseOfLightWidth,LightY+BaseOfLightHeight);
	ctx.lineTo(LightX-BaseOfLightWidth,LightY+BaseOfLightHeight);
	ctx.fill();
	ctx.globalAlpha = 1.0;
	
	//Glow of Light
	ctx.fillStyle = LightColor;
	ctx.beginPath();
	ctx.moveTo(LightX-BaseOfLightWidth,LightY+BaseOfLightHeight);
	ctx.lineTo(LightX-BaseOfLightWidth,LightY-HeightOfGlassStem);
	ctx.arc(LightX, LightY-HeightOfGlassStem-RadiusOfGlass, RadiusOfGlass,0.7*Math.PI, 2.3*Math.PI);
	ctx.lineTo(LightX+BaseOfLightWidth,LightY-HeightOfGlassStem);
	ctx.lineTo(LightX+BaseOfLightWidth,LightY+BaseOfLightHeight);
	ctx.lineTo(LightX-BaseOfLightWidth,LightY+BaseOfLightHeight);
	ctx.stroke();
	
	ctx.globalAlpha = Brightness;
	if (LightStatus == "on"){
		ctx.fill();
		}
		else{
		
		}
	ctx.globalAlpha = 1.0;
	
	
	
	ctx.fillStyle = "#000000";
	//bottom of light
	ctx.beginPath();
	ctx.arc(LightX,LightY+2.0*LightR,0.4*LightR,0,1*Math.PI);
	ctx.fill();
	ctx.stroke();
	ctx.closePath();
	ctx.fillStyle = "#C0C0C0";
	ctx.beginPath();
	ctx.arc(LightX,LightY+2.23*LightR,0.3*LightR,0,1*Math.PI);
	ctx.fill();
	ctx.stroke();
	ctx.closePath();
	
	//screwinpart of light
	ctx.beginPath();
	ctx.moveTo(LightX-BaseOfLightWidth,LightY);
	ctx.lineTo(LightX-BaseOfLightWidth, LightY+BaseOfLightHeight);
	ctx.bezierCurveTo(LightX-BaseOfLightWidth, LightY+(BaseOfLightHeight+BaseOfLightCurve), LightX+BaseOfLightWidth, LightY+(BaseOfLightHeight+BaseOfLightCurve), LightX+BaseOfLightWidth, LightY+(BaseOfLightHeight));
	ctx.lineTo(LightX+BaseOfLightWidth,LightY);
	ctx.bezierCurveTo(LightX+BaseOfLightWidth, LightY+(BaseOfLightCurve), LightX-BaseOfLightWidth, LightY+(BaseOfLightCurve), LightX-BaseOfLightWidth, LightY);
	ctx.stroke();
	ctx.fill();
	
	
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 2;
	ctx.beginPath();
	for (i=2;i<7;i++){
		ctx.moveTo(LightX-BaseOfLightWidth, LightY+i*0.15*BaseOfLightHeight);
		ctx.lineTo(LightX+BaseOfLightWidth, LightY+(i+0.5)*0.15*BaseOfLightHeight);
	}
	ctx.stroke();

}

function WriteText(x,y,t,s,c,m,ff){
	ctx.fillStyle = c;
	ctx.font= s + "px " + ff;
	temptext = t;
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x - m*textWidth;
	ctx.fillText(temptext,xposition, y);
}

function DrawArrow(x, y, h, w, c, r){
	ctx.save();
	ctx.translate(x, y+0.5*h);
	ctx.rotate(r);
	ctx.fillStyle = c;
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 1;
	ctx.beginPath();
	ctx.moveTo(0,-0.5*h);
	ctx.lineTo(0+w, -0.5*h+w);
	ctx.lineTo(0+0.5*w, -0.5*h+w);
	ctx.lineTo(0+0.5*w, -0.5*h+h);
	ctx.lineTo(0-0.5*w, -0.5*h+h);
	ctx.lineTo(0-0.5*w, -0.5*h+w);
	ctx.lineTo(0-w, -0.5*h+w);
	ctx.lineTo(0,-0.5*h);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	ctx.restore();
}


function DrawRectangle(xrect, yrect, wrect, hrect, curverectangle, lcolor, fcolor, lwid){
	ctx.fillStyle = fcolor;
	ctx.strokeStyle = lcolor;
	ctx.lineWidth = lwid;
	ctx.beginPath();
	ctx.moveTo(xrect+curverectangle, yrect);
	ctx.lineTo(xrect+wrect-curverectangle, yrect);
	ctx.arc(xrect+wrect-curverectangle, yrect+curverectangle, curverectangle, 1.5*Math.PI, 0*Math.PI, false);
	ctx.lineTo(xrect+wrect, yrect+hrect-curverectangle);
	ctx.arc(xrect+wrect-curverectangle, yrect+hrect-curverectangle, curverectangle, 0.0*Math.PI, 0.5*Math.PI, false);
	ctx.lineTo(xrect+curverectangle, yrect+hrect);
	ctx.arc(xrect+curverectangle, yrect+hrect-curverectangle, curverectangle, 0.5*Math.PI, 1.0*Math.PI, false);
	ctx.lineTo(xrect, yrect+curverectangle);
	ctx.arc(xrect+curverectangle, yrect+curverectangle, curverectangle, 1.0*Math.PI, 1.5*Math.PI, false);
	ctx.stroke();
	ctx.fill();
}

	ctx.strokeStyle = "#000000";

		ctx.lineTo(x-0.32*w,y+0.43*h);
		ctx.lineTo(x-0.33*w,y+0.33*h);
		ctx.lineTo(x-0.33*w,y+0.22*h);
		ctx.stroke();
		ctx.closePath();
		ctx.fill();
		ctx.fillStyle = "#21ec6d";

		ctx.arc(x-0.3*w, y+0.08*h, 0.02*h, 0, 2*Math.PI);
		ctx.stroke();
		ctx.closePath();
		ctx.fill();
	}

		ctx.fillStyle = "#3a3c3a";
		ctx.strokeStyle = "#000000";

		ctx.moveTo(x-0.32*w,y+0.22*h);

function DrawShowMeter(x, y, w, v, MaxV, MinV, u, t){
	MeterScale = w/250;
	MaxDisplay = MaxV;
	MidDisplay = MinV;
	DisplayWords = t + " (" + u + ")";
	DisplayMessage = "False";
	NeedlePercent = v/MaxDisplay*10;
	if (NeedlePercent > 10){
		NeedlePercent = 11;
		DisplayMessage = "True";
	}
	needleanglerotate = 4*Math.PI/3 + NeedlePercent*Math.PI/30;
	
	
	radiusofmeter = 0.40*w;
	
	DrawRectangle(x, y, w, w, 20*MeterScale, "#FFFFFF", "#555555", 3);
	

	ctx.fillStyle = "#FFFFFF";
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 5*MeterScale;
	ctx.beginPath();
	ctx.arc(x+0.5*w, y+0.5*w,1.05*radiusofmeter, 0, 2*Math.PI);
	ctx.stroke();
	ctx.fill();
		
	WriteText(x+0.5*w,y+0.5*w+0.0*radiusofmeter,DisplayWords,20*MeterScale,"#990000",0.5);
	
	WriteText(x+0.23*w,y+0.5*w-0.55*radiusofmeter,"0",14*MeterScale,"#000000",0.5);
	
	WriteText(x+0.50*w,y+0.5*w-0.75*radiusofmeter,MidDisplay,14*MeterScale,"#000000",0.5);
	
	WriteText(x+0.77*w,y+0.5*w-0.55*radiusofmeter,MaxDisplay,14*MeterScale,"#000000",0.5);
	
	ctx.fillStyle = "#000000";
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 1*MeterScale;
	ctx.beginPath();
	ctx.arc(x+0.5*w, y+0.5*w+0.6*radiusofmeter,4, 0, 2*Math.PI);
	ctx.stroke();
	ctx.fill();
	
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 3*MeterScale;
	ctx.beginPath();
	ctx.arc(x+0.5*w, y+0.5*w+0.6*radiusofmeter,1.2*radiusofmeter, 4*Math.PI/3,5*Math.PI/3);
	ctx.stroke();
	
	for (i = 0; i < 11; i++){
		anglerotate = 4*Math.PI/3 + i*Math.PI/30;
		ctx.save();
		ctx.translate(x+0.5*w, y+0.5*w+0.6*radiusofmeter);
		ctx.rotate(anglerotate);
		ctx.beginPath();
		if (i%5 == 0){
			ctx.moveTo(1.1*radiusofmeter, 0);
			ctx.lineTo(1.3*radiusofmeter, 0);
		}
		else{
			ctx.moveTo(1.15*radiusofmeter, 0);
			ctx.lineTo(1.25*radiusofmeter, 0);
		}
		ctx.stroke();
		ctx.restore();
	}
	
	ctx.strokeStyle = "#FF0000";
	ctx.lineWidth = 3*MeterScale;
	ctx.save();
	ctx.translate(x+0.5*w, y+0.5*w+0.6*radiusofmeter);
	ctx.rotate(needleanglerotate);
	ctx.beginPath();
	ctx.moveTo(0, 0);
	ctx.lineTo(1.35*radiusofmeter, 0);
	
	ctx.stroke();
	ctx.restore();
	
	if (DisplayMessage == "True"){
		WriteText(x+0.5*w,y+0.85*w,MeterMessage[languagenumber],10*MeterScale,"#FF0000",0.5);
	}
	
	WriteText(x+0.5*w,y+0.60*w,"Precision Meter",12*MeterScale,"#000000",0.5);
	WriteText(x+0.5*w,y+0.675*w,"Made in Germany",12*MeterScale,"#000000",0.5);

}
</script>
