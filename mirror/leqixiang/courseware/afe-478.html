            padding: 20px;
            background-color: #fff;
            border-right: 2px dashed #ffb6e1;

        textarea {
            width: 100%;

            font-size: 14px;
            background-color: #fffafb;
            color: #d14d8b;
            box-shadow: inset 0 0 8px rgba(255, 182, 193, 0.4);
            margin-bottom: 15px;
        }
        
        button {
            background: linear-gradient(135deg, #ff8fab, #ff6b9d);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(255, 105, 180, 0.3);
            transition: all 0.3s ease;
            align-self: flex-start;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(255, 105, 180, 0.4);
            background: linear-gradient(135deg, #ff6b9d, #ff4d88);
        }
        
        button:active {
            transform: translateY(1px);
        }
        
        .preview-frame {
            width: 100%;
            height: 90%;
            border: 2px solid #ffc0cb;
            border-radius: 15px;
            background-color: white;
            box-shadow: 0 4px 12px rgba(255, 182, 193, 0.3);
        }
        
        .footer {
            text-align: center;
            padding: 10px;
            background-color: #ffebf1;
            color: #d14d8b;
            font-size: 14px;
            position: fixed;
            bottom: 0;
            width: 100%;
            border-top: 1px solid #ffc0cb;
        }
        
        .heart {
            color: #ff4d88;
            font-size: 16px;
        }
        
        .label {
            font-weight: bold;
            margin-bottom: 10px;
            color: #ff6b9d;
            display: inline-block;
            background-color: #ffebf1;
            padding: 5px 12px;
