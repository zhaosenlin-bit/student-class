    <button class="btn btn-primary" onclick="alert(`Black body radiation is the electromagnetic radiation emitted by a perfect black body, an idealized object that absorbs all incident radiation and re-emits it based solely on its temperature.

		Wien's Displacement Law:
		λ_max = b / T
		(b ≈ 2.898 × 10⁻³ m·K)
		
		Stefan–Boltzmann Law:
		P = σ A T⁴
		(σ ≈ 5.67 × 10⁻⁸ W/m²·K⁴)
		
		Planck's Radiation Law:
		I(λ, T) = (2πhc² / λ⁵) × [1 / (e^(hc / λkT) - 1)]
		
		These laws describe how peak wavelength, total emitted power, and intensity depend on temperature.`);">
		    What is Black Body Radiation?
		</button>
