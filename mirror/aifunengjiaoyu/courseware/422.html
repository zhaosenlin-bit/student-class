<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>地球大气层 · 互动探索</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg-deep: #060b14;
      --bg-panel: #0d1b2a;
      --bg-panel-alt: #111d30;
      --border: #1a3050;
      --text: #d0d8e8;
      --text-dim: #7a8a9e;
      --accent: #00b4d8;
      --accent2: #ff6b35;
      --accent3: #4caf50;
      --accent4: #ffd166;
      --danger: #e63946;
      --header-h: 46px;
      --transition: 0.25s ease;
      --radius: 10px;
      --layer-tag-active: #00b4d8;
    }
    html, body {
      height: 100%;
      overflow: hidden;
      background: var(--bg-deep);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text);
    }
    #app {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    /* 顶部标签栏 — 叠加在视口上方 */
    #layer-tags {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 12px;
      z-index: 20;
      pointer-events: none;
      background: rgba(6, 11, 20, 0.55);
      padding: 8px 18px;
      border-radius: 40px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(26, 48, 80, 0.5);
    }
    .layer-tag {
      font-size: 14px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 30px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-dim);
      transition: all 0.3s;
      pointer-events: auto;
      cursor: default;
      letter-spacing: 0.5px;
    }
    .layer-tag.active {
      color: #fff;
      background: rgba(0, 180, 216, 0.2);
      border-color: var(--accent);
      box-shadow: 0 0 12px rgba(0, 180, 216, 0.3);
    }
    .layer-tag .emoji-badge {
      margin-right: 4px;
    }

    /* 3D 视口 */
    #canvas-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      display: block;
    }

    /* 信息卡片 — 全屏沉浸叠加 */
    #info-card {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 27, 42, 0.92);
      border: 1px solid var(--accent);
      border-radius: 18px;
      padding: 16px 24px 20px;
      max-width: 480px;
      width: 90%;
      color: var(--text);
      font-size: 15px;
      line-height: 1.5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.3s ease;
      z-index: 15;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
      text-align: left;
      border-bottom: 3px solid var(--accent);
    }
    #info-card.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #info-card .card-title {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    #info-card .card-title .layer-color-dot {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      margin-right: 4px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    #info-card .card-sub {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 8px;
    }
    #info-card .card-desc {
      font-size: 16px;
      color: #e8edf5;
      background: rgba(0, 180, 216, 0.08);
      padding: 8px 14px;
      border-radius: 30px;
      display: inline-block;
      margin-top: 4px;
      border-left: 3px solid var(--accent);
    }
    #info-card .card-close {
      position: absolute;
      top: 8px;
      right: 14px;
      font-size: 22px;
      color: var(--text-dim);
      cursor: pointer;
      pointer-events: auto;
      transition: color 0.2s;
      background: none;
      border: none;
    }
    #info-card .card-close:hover {
      color: #fff;
    }

    /* 底部提示 */
    #hint {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.25);
      font-size: 13px;
      z-index: 5;
      pointer-events: none;
      letter-spacing: 1px;
      background: rgba(0,0,0,0.3);
      padding: 4px 16px;
      border-radius: 30px;
      backdrop-filter: blur(2px);
      transition: opacity 0.6s;
    }

    /* 响应式调整 */
    @media (max-width: 640px) {
      #layer-tags {
        top: 8px;
        padding: 6px 12px;
        gap: 4px 8px;
        border-radius: 30px;
        width: 95%;
      }
      .layer-tag {
        font-size: 12px;
        padding: 2px 8px;
      }
      #info-card {
        bottom: 16px;
        padding: 14px 18px 18px;
        max-width: 95%;
      }
      #info-card .card-title {
        font-size: 18px;
      }
      #info-card .card-desc {
        font-size: 14px;
      }
      #hint {
        bottom: 80px;
        font-size: 11px;
      }
    }
  </style>
</head>
