<body>
<div id="app">
  <div id="panel">
    <h1>Click “Reset” to rerun:</h1>
    <div class="sub">
      Truck moves right with speed <b>v<sub>T</sub></b>. At eject, the man is pushed backward (left).<br>
      We model eject as a <b>fixed impulse</b>. Impulse model: <b>J = 75 × v<sub>ref</sub></b>. Heavier mass → smaller backward speed.
    </div>

    <div class="block">
      <label>
        Truck speed v<sub>T</sub> (m/s)
        <span id="truckVVal" class="value">+6</span>
      </label>
      <input id="truckV" type="range" min="0" max="20" step="0.1" value="6" />

      <label>
        Eject reference speed at 75 kg (m/s)
        <span id="relVVal" class="value">10.0</span>
      </label>
      <input id="relV" type="range" min="0" max="20" step="0.1" value="10" />

      <label>
        Man mass m (kg)
        <span id="massVal" class="value">75</span>
      </label>
      <input id="mass" type="range" min="40" max="120" step="0.2" value="75" />

      <label>
        Road friction μ<sub>k</sub>
        <span id="muVal" class="value">0.60</span>
      </label>
      <input id="mu" type="range" min="0" max="1.0" step="0.02" value="0.60" />
    </div>

    <div class="block">
      <div class="row" style="margin:0;">
           <div class="col-xs-6" style="padding-left:0;">
             <button id="btnEject" class="btn btn-danger btn-block">Eject</button>
          </div>
          <div class="col-xs-6" style="padding-right:0;">
            <button id="btnPause" class="btn btn-primary btn-block">Pause</button>
          </div>
      </div>
      <div class="row" style="margin:0;">
          <div class="col-xs-6" style="padding-left:0;">
            <button id="btnReset" class="btn btn-warning btn-block">Reset</button>
          </div>
          <div class="col-xs-6" style="padding-right:0;">
            
          </div>
      </div>
      <div style="height:8px;"></div>
      <button id="btnWhat" class="btn btn-info btn-block">What is Relative Velocity?</button>
    </div>
    
    <button id="btnToggleInfo" class="btn btn-default btn-block">
      Show Information
    </button>
    
    <div id="infoBlock" class="block" style="margin-bottom:0; display:none;">
      <p class="help" id="readout"></p>
    </div>
  </div>

  <div id="viewport"></div>
</div>
