      max-width:360px;

      border:1px solid #ddd;

    #panel{
      position: fixed;
      top: 10px;
      left: 10px;
      width: 340px;
      background: rgba(247,247,247,0.95);

      border-radius: 10px;
      padding: 10px 12px;
      z-index: 9999;
      font-size: 13px;

      display: flex;

      margin: 0 0 10px 0;
    }

      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
      margin: 10px 0;

    #panel .row > label{
      width: 135px;
      margin: 0;
      text-align: left;
      font-size: 12px;
      font-weight: 600;
      color: #222;
      white-space: nowrap;
    }

      flex: 1;
      min-width: 90px;
      max-width: 140px;
      height: 6px;
      margin: 0;
      -webkit-appearance: none;
      appearance: none;
      background: #d6dbe0;
      border-radius: 999px;
    }

    #panel input[type="range"]::-webkit-slider-thumb{
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #2b6cb0;
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.25);
      cursor: pointer;
    }
    #panel input[type="range"]::-moz-range-thumb{

      border-radius: 6px;

      height: 6px;

    #panel select{

<body>
  <div id="container"></div>

  <div id="hud">
    <div><b>Spring + Pendulum System</b></div>
    <div id="paramLine" style="margin-top:6px;"></div>
    <div class="tiny">Use panel to change parameters.</div>
    <div id="energyLine" style="margin-top:6px; display:none;"></div>
    <div id="clockLine"  style="margin-top:4px; display:none;"></div>
  </div>

  <div id="panel">
    <div class="row">
      <button class="btn btn-primary btn-xs" id="toggleRun">Pause</button>
      <button class="btn btn-default btn-xs" id="resetBtn">Reset</button>
      <button class="btn btn-info btn-xs" id="infoBtn">Info</button>      
    </div>

    <!-- gravity: label | slider | number -->
    <div class="row">
      <label>gravity</label>
      <input id="gRange" type="range" min="0" max="20" step="0.1" value="9.8">
      <input id="gNum"   type="number" min="0" max="20" step="0.1" value="9.8">
    </div>

    <div class="row">
      <label>damping (cart)</label>
      <input id="cartDampRange" type="range" min="0" max="0.30" step="0.01" value="0.00">
      <input id="cartDampNum"   type="number" min="0" max="0.30" step="0.01" value="0.00">
    </div>

    <div class="row">
      <label>spring damping</label>
      <input id="springDampRange" type="range" min="0" max="0.60" step="0.01" value="0.00">
      <input id="springDampNum"   type="number" min="0" max="0.60" step="0.01" value="0.00">
    </div>

    <div class="row">
      <label>spring stiffness k</label>
      <input id="kRange" type="range" min="1.00" max="6.00" step="0.05" value="1.00">
      <input id="kNum"   type="number" min="1.00" max="6.00" step="0.05" value="1.00">
    </div>

    <!-- keep one-row alignment using spacer -->
    <div class="row">
      <label>time step</label>
      <span class="spacer"></span>
      <input id="dtNum" type="number" min="0.001" max="0.05" step="0.001" value="0.010">
    </div>

    <div class="row">
      <label>time rate</label>
      <span class="spacer"></span>
      <input id="rateNum" type="number" min="0" max="5" step="0.1" value="1.0">
    </div>

    <div class="row">
      <label>Diff Eq Solver</label>
      <select id="solverSel">
        <option value="rk4" selected>Runge-Kutta</option>
        <option value="euler">Euler (simple)</option>
      </select>
      <span class="spacer" style="max-width:74px;"></span>
    </div>

    <div class="row checkRow">
      <label><input id="showForces" type="checkbox" checked> show forces</label>
    </div>
    <div class="row checkRow">
      <label><input id="showEnergy" type="checkbox"> show energy</label>
    </div>
    <div class="row checkRow">
      <label><input id="showClock" type="checkbox"> show clock</label>
    </div>

  </div>
