	  'Step 2: The Deuterium nucleus fuses with another proton to create Helium-3 (2 protons + 1 neutron) and releases a gamma ray.\n\n' +
	  'Step 3: Two Helium-3 nuclei fuse to form Helium-4 (2 protons + 2 neutrons), releasing two free protons.\n\n' +
	  'This chain of reactions powers the Sun and offers the potential for clean, abundant energy on Earth.'
