	function addSun(x, y, z) {
	    var sunGeom = new THREE.SphereGeometry(10, 32, 24); // Sun radius in scale (109 times Earth)

	function addPlanet(x, y, z) {
		    var planetGeom = new THREE.SphereGeometry(2, 32, 24); // Earth radius in scale
		    const planetTexture = textureloader.load('texture/earth.jpg');
		    const material = new THREE.MeshBasicMaterial({ map: planetTexture });
		    planet = new THREE.Mesh(planetGeom, material);
		
		    // Create a group to hold the planet and rotate it for axial tilt
		    planetGroup = new THREE.Group();
		    planetGroup.add(planet);
		    planet.rotation.z = Math.PI / 2; // 90 degrees
		    planetGroup.rotation.z = 23.5 * Math.PI / 180; // Earth's axial tilt
		
		    // Add the tilt axis
		    const axisMaterial = new THREE.LineBasicMaterial({ color: 'yellow' });
		    const axisGeometry = new THREE.BufferGeometry();
		    const vertices = new Float32Array([
		        0, -4, 0,  // Start point of the line
		        0, 4, 0    // End point of the line
		    ]);
		    axisGeometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
		    const tiltAxis = new THREE.Line(axisGeometry, axisMaterial);
		
		    // Add the tilt axis to the planet group
		    planetGroup.add(tiltAxis);
		
		    planetGroup.position.set(x, y, z);
		    scene.add(planetGroup);
		
		    orbitGeometry = new THREE.BufferGeometry();
		    orbitLine = new THREE.Line(orbitGeometry, new THREE.LineBasicMaterial({ color: 0xffffff }));
		    scene.add(orbitLine);
		    animatePlanet(planetGroup, orbitalSpeed); // Orbiting speed

	function animatePlanet(planetGroup, speed) {
	    var angle = 0;
	    orbitPoints = [];

	    function orbit() {
	        if (!is_paused) { // Check if the simulation is paused
	            angle += speed;

	            // Check if a full orbit cycle is completed
	            if (angle >= 2 * Math.PI) {
	                angle -= 2 * Math.PI;
	                orbitPoints = [];
	                daysCounter = 0;
	            }

	            // Parametric equations for an ellipse
	            planetGroup.position.x = semiMajorAxis * Math.cos(angle) - semiMajorAxis * eccentricity;
	            planetGroup.position.z = semiMinorAxis * Math.sin(angle);

	            // Add current position to the orbit path at a controlled rate
	            if (orbitPoints.length === 0 || planetGroup.position.distanceTo(orbitPoints[orbitPoints.length - 1]) > 0.5) {
	                orbitPoints.push(new THREE.Vector3(planetGroup.position.x, planetGroup.position.y, planetGroup.position.z));
	                
	                // Update days counter based on the angle
	                daysCounter = Math.floor((angle / (2 * Math.PI)) * 365);
	                document.getElementById('days').value = daysCounter;
	                orbitGeometry.setFromPoints(orbitPoints);
	            }

	            // Rotate the planet around its axis
	            planetGroup.children[0].rotation.y -= 0.02; // Earth's own rotation
	        }

	        requestAnimationFrame(orbit);
	    }
	    orbit();
	}
	function addSolarFlares() {
		    const particleCount = 4;

		    const positions = [];
		    const sizes = [];
		    const colors = [];
		    const color = new THREE.Color();
		
		    for (let i = 0; i < particleCount; i++) {
		        const phi = Math.random() * Math.PI * 2;
		        const theta = Math.random() * Math.PI;
		        const distance = 10 + Math.random() * 0.5; // closer to the sun's surface
		
		        positions.push(
		            distance * Math.sin(theta) * Math.cos(phi),
		            distance * Math.sin(theta) * Math.sin(phi),
		            distance * Math.cos(theta)
		        );
		
		        sizes.push(Math.random() * 2 + 5); // keep original size array for further manipulation
		
		        color.setHSL(Math.random(), 1.0, 0.5);
		        colors.push(color.r, color.g, color.b);
		    }
		
		    particles.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
		    particles.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
		    particles.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
		
		    const particleMaterial = new THREE.ShaderMaterial({
		        uniforms: {

		            varying vec3 vColor;
		            void main() {
		                vColor = color;
		                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
		                gl_PointSize = size * 0.2 * (300.0 / -mvPosition.z); // reduce size by 80%
		                gl_Position = projectionMatrix * mvPosition;
		            }
		        `,
		        fragmentShader: `
		            uniform vec3 color;
		            uniform sampler2D pointTexture;
		            varying vec3 vColor;
		            void main() {
		                gl_FragColor = vec4(color * vColor, 1.0);
		                gl_FragColor = gl_FragColor * texture2D(pointTexture, gl_PointCoord);
		                if (gl_FragColor.a < 0.1) discard;
		            }
		        `,
		        blending: THREE.AdditiveBlending,
		        depthTest: false,
		        transparent: true
		    });
		
		    flareParticles = new THREE.Points(particles, particleMaterial);
		    sun.add(flareParticles);
	}
