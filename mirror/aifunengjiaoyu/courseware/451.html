<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌍 太阳系小剧场 · 地月之旅</title>
  <style>
    /* ----- 全局重置 & 暗色变量 ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg-deep: #060b14;
      --bg-panel: #0d1b2a;
      --bg-panel-alt: #111d30;
      --border: #1a3050;
      --text: #d0d8e8;
      --text-dim: #7a8a9e;
      --accent: #00b4d8;
      --accent2: #ff6b35;
      --accent3: #4caf50;
      --accent4: #ffd166;
      --danger: #e63946;
      --panel-width: 280px;
      --header-h: 48px;
      --transition: 0.3s ease;
      --radius: 12px;
    }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      overflow: hidden;
      height: 100vh;
    }

    /* ----- 二栏布局：header + 主框架 ----- */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    #mobile-header {
      display: none;
    }
    #main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }
    #center-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: var(--bg-deep);
    }
    #side-panel {
      width: var(--panel-width);
      min-width: var(--panel-width);
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      display: flex;
      flex-direction: column;
    }
    #side-panel::-webkit-scrollbar {
      width: 4px;
    }
    #side-panel::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    /* ----- 面板区块统一样式 ----- */
    .panel-section {
      padding: 14px 14px 12px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .panel-section:last-child {
      border-bottom: none;
    }
    .panel-section h3 {
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-section h3::before {
      content: "";
      display: inline-block;
      width: 3px;
      height: 14px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* ----- 控件标准化 ----- */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-panel-alt);
      color: var(--text);
      transition: all 0.2s;
      white-space: nowrap;
      user-select: none;
    }
    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn.active {
      border-color: var(--accent2);
      color: var(--accent2);
      background: rgba(255, 107, 53, 0.12);
    }
    .btn.accent {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* 滑块 */
    .slider-group {
      margin: 8px 0 4px;
    }
    .slider-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 2px;
    }
    .slider-label span:last-child {
      color: var(--accent4);
      font-weight: 600;
    }
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      outline: none;
      margin: 4px 0 6px;
      transition: background 0.2s;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid var(--bg-deep);
      box-shadow: 0 0 8px rgba(0, 180, 216, 0.3);
    }
    input[type="range"]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: var(--accent);
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid var(--bg-deep);
    }

    /* 复选框组 */
    .ctrl-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      margin: 4px 0 2px;
    }
    .ctrl-group label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
      padding: 2px 0;
    }
    .ctrl-group label input[type="checkbox"] {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* 数据行 (星球档案) */
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      font-size: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .data-row .label {
      color: var(--text-dim);
    }
    .data-row .value {
      color: var(--text);
      font-weight: 600;
      text-align: right;
    }
    .planet-emoji {
      font-size: 22px;
      margin-right: 6px;
      vertical-align: middle;
    }
    .info-card {
      background: rgba(13, 27, 42, 0.85);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin: 8px 0 4px;
      border: 1px solid var(--accent);
      backdrop-filter: blur(4px);
      font-size: 13px;
      line-height: 1.5;
      color: var(--text);
    }
    .info-card .title {
      font-weight: 700;
      color: var(--accent4);
      font-size: 15px;
    }

    /* 3D 视口上的叠加提示（点击星球显示） */
    #planet-popup {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(6, 11, 20, 0.88);
      border: 1px solid var(--accent);
      border-radius: 16px;
      padding: 14px 22px;
      max-width: 420px;
      width: 90%;
      color: var(--text);
      font-size: 14px;
      line-height: 1.6;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.3s ease;
      z-index: 10;
      text-align: center;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      transform: translateX(-50%) translateY(10px);
    }
    #planet-popup.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    #planet-popup .popup-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent4);
      margin-bottom: 4px;
    }
    #planet-popup .popup-desc {
      color: var(--text-dim);
      font-size: 13px;
    }

    /* 小屏响应 */
    @media (max-width: 820px) {
      #mobile-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 14px;
        height: var(--header-h);
        background: var(--bg-panel);
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      #mobile-header h1 {
        font-size: 16px;
        color: var(--text);
        letter-spacing: 1px;
      }
      #mobile-header .btn {
        font-size: 13px;
        padding: 4px 12px;
      }
      #side-panel {
        position: fixed;
        right: 0;
        top: var(--header-h);
        bottom: 0;
        z-index: 50;
        margin-right: calc(-1 * var(--panel-width));
        transition: margin-right var(--transition);
        box-shadow: -4px 0 20px rgba(0, 0, 0, 0.6);
      }
      #side-panel.open {
        margin-right: 0;
      }
      #main-layout {
        height: calc(100vh - var(--header-h));
      }
      #planet-popup {
        max-width: 90%;
        bottom: 16px;
        padding: 12px 16px;
      }
    }

    /* 小工具 */
    .text-muted {
      color: var(--text-dim);
      font-size: 11px;
    }
    .mt-1 {
      margin-top: 4px;
    }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .gap-6 {
      gap: 6px;
    }
  </style>
</head>

  <div id="app">
    <!-- 移动端头部 -->
    <header id="mobile-header">
      <h1>🌌 地月小剧场</h1>
      <button class="btn accent" id="btn-toggle-side">☰ 信息</button>
    </header>

    <div id="main-layout">
      <!-- 3D 主视口 -->
      <main id="center-panel">
        <!-- 点击星球弹出小档案 -->
        <div id="planet-popup">
          <div class="popup-title" id="popup-title">🌞 太阳</div>
          <div class="popup-desc" id="popup-desc">超级大火球，靠它地球才暖和！</div>
        </div>
      </main>

      <!-- 右侧信息面板 -->
      <aside id="side-panel">
        <!-- 标题区 -->
        <div class="panel-section" style="padding-bottom:8px;">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:2px;">
            <span style="font-size:20px;">🚀</span>
            <span style="font-weight:600;font-size:15px;color:var(--accent4);">太阳系小剧场</span>
          </div>
          <div class="text-muted" style="font-size:12px;">拖拽视角 · 点击星球 · 滑动调节</div>
        </div>

        <!-- 控制区 -->
        <div class="panel-section">
          <h3>🎮 控制</h3>
          <div class="btn-row">
            <button class="btn accent" id="btn-pause">⏸️ 暂停</button>
            <button class="btn" id="btn-reset">🔄 重置视角</button>
          </div>
          <div class="btn-row" style="margin-top:8px;">
            <button class="btn" id="btn-auto-rotate">🔄 自动旋转</button>
          </div>
          <div class="ctrl-group" style="margin-top:8px;">
            <label><input type="checkbox" id="chk-orbit" checked> 🪐 轨道线</label>
            <label><input type="checkbox" id="chk-arrow"> ➡️ 引力箭头</label>
          </div>
        </div>

        <!-- 参数调节 -->
        <div class="panel-section">
          <h3>⚙️ 调节</h3>
          <div class="slider-group">
            <div class="slider-label"><span>☀️ 太阳胖瘦 (质量)</span><span id="val-mass">1.0</span></div>
            <input type="range" id="slider-mass" min="0.5" max="2.0" step="0.05" value="1.0">
          </div>
          <div class="slider-group">
            <div class="slider-label"><span>🌍 地球跑多快</span><span id="val-speed">1.0</span></div>
            <input type="range" id="slider-speed" min="0.2" max="2.5" step="0.05" value="1.0">
          </div>
          <div class="slider-group">
            <div class="slider-label"><span>🌙 月亮距离</span><span id="val-dist">1.0</span></div>
            <input type="range" id="slider-dist" min="0.6" max="1.8" step="0.02" value="1.0">
          </div>
        </div>

        <!-- 星球小档案 (静态展示，点击时动态更新popup) -->
        <div class="panel-section" style="flex:1;">
          <h3>📖 星球小档案</h3>
          <div class="info-card" id="planet-card">
            <div><span class="planet-emoji" id="card-emoji">🌞</span><span class="title" id="card-name">太阳</span></div>
            <div style="margin-top:4px;font-size:13px;" id="card-desc">超级大火球，靠它地球才暖和！</div>
            <div style="margin-top:6px;border-top:1px solid var(--border);padding-top:4px;">
              <div class="data-row"><span class="label">⭐ 质量</span><span class="value" id="card-mass">——</span></div>
              <div class="data-row"><span class="label">💫 公转周期</span><span class="value" id="card-period">——</span></div>
              <div class="data-row"><span class="label">📏 距中心</span><span class="value" id="card-dist">——</span></div>
            </div>
          </div>
          <div style="margin-top:8px;font-size:11px;color:var(--text-dim);text-align:center;">👆 点击星球查看档案</div>
        </div>
      </aside>
    </div>
  </div>
