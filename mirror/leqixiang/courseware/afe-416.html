<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数字规律接龙 · 小学探索</title>
    <style>
        /* 浅色明亮 + 暖色活力系 */
        :root {
            --bg-main: #f9f5f0;
            --bg-card: #ffffff;
            --bg-panel: #fff8f0;
            --bg-panel-alt: #ffefe3;
            --border: #f0d5c0;
            --text: #3a2e28;
            --text-dim: #8a7a6e;
            --text-light: #b8a89c;
            --accent: #f39c12;
            --accent2: #e67e22;
            --accent3: #2ecc71;
            --accent4: #f1c40f;
            --danger: #e74c3c;
            --star-gold: #f1c40f;
            --panel-width: 270px;
            --header-h: 52px;
            --transition: 0.25s ease;
            --radius: 18px;
            --shadow: 0 4px 16px rgba(0,0,0,0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif; background: var(--bg-main); color: var(--text); height: 100vh; overflow: hidden; }

        #app { display: flex; flex-direction: column; height: 100vh; }

        /* header */
        #mobile-header { display: none; }
        #desktop-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; height: var(--header-h); background: var(--bg-card);
            border-bottom: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            flex-shrink: 0;
        }
        #desktop-header h1 { font-size: 20px; font-weight: 700; color: var(--accent2); letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        #desktop-header h1 span { background: var(--accent); color: white; font-size: 14px; border-radius: 30px; padding: 0 16px; line-height: 28px; margin-left: 6px; }
        .header-info { display: flex; align-items: center; gap: 24px; font-size: 14px; }
        .header-info .star-count { color: var(--star-gold); font-weight: 700; font-size: 18px; display: flex; align-items: center; gap: 4px; }

        #main-layout { display: flex; flex: 1; overflow: hidden; }

        /* 左面板 */
        #left-panel {
            width: var(--panel-width); min-width: var(--panel-width);
            background: var(--bg-panel); border-right: 1px solid var(--border);
            overflow-y: auto; padding: 16px 0;
        }
        .panel-section { padding: 14px 18px; border-bottom: 1px solid var(--border); }
        .panel-section:last-child { border-bottom: none; }
        .panel-section h3 {
            font-size: 14px; color: var(--accent2); margin-bottom: 12px;
            text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 6px;
        }
        .panel-section h3::before {
            content: ""; display: inline-block; width: 4px; height: 16px;
            background: var(--accent); border-radius: 3px;
        }

        .level-selector { display: flex; flex-direction: column; gap: 6px; }
        .level-item {
            display: flex; align-items: center; gap: 12px;
            padding: 8px 12px; border-radius: 12px; background: var(--bg-card);
            border: 1px solid transparent; cursor: pointer; transition: all 0.2s;
            box-shadow: var(--shadow);
        }
        .level-item.active { border-color: var(--accent); background: #fff5e6; }
        .level-item.locked { opacity: 0.5; cursor: not-allowed; filter: grayscale(0.4); }
        .level-item .level-num { font-weight: 700; color: var(--accent2); width: 28px; }
        .level-item .level-name { flex: 1; font-size: 13px; font-weight: 500; }
        .level-item .stars { color: var(--star-gold); font-size: 14px; letter-spacing: -2px; }
        .level-item .lock-icon { color: var(--text-light); font-size: 16px; }

        .progress-block { margin-top: 12px; }
        .progress-block .bar-bg { height: 10px; background: var(--border); border-radius: 20px; overflow: hidden; }
        .progress-block .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 20px; transition: width 0.5s; }
        .progress-block .label { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-top: 4px; }

        /* 中间视口 */
        #center-panel { flex: 1; position: relative; overflow: hidden; background: var(--bg-main); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }

        .game-area {
            max-width: 750px; width: 100%; text-align: center;
        }

        .rule-badge {
            display: inline-block; background: var(--bg-card); border-radius: 40px;
            padding: 8px 24px; box-shadow: var(--shadow); margin-bottom: 20px;
            border: 1px solid var(--border); font-size: 15px; font-weight: 600;
            color: var(--accent2);
        }

        /* 接龙序列展示 */
        .chain-wrapper {
            background: var(--bg-card); border-radius: 24px; padding: 24px 20px;
            box-shadow: var(--shadow); margin: 12px 0 24px;
            border: 1px solid var(--border);
        }
        .chain-title { font-size: 14px; color: var(--text-dim); margin-bottom: 16px; letter-spacing: 1px; }
        .sequence-display {
            display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px;
            margin: 8px 0;
        }
        .seq-item {
            min-width: 48px; height: 52px; background: var(--bg-main); border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; font-weight: 700; color: var(--text);
            border: 2px solid var(--border); padding: 0 10px;
            transition: 0.2s;
        }
        .seq-item.blank {
            background: var(--bg-panel-alt); border: 2px dashed var(--accent);
            color: var(--accent); cursor: default; min-width: 60px;
        }
        .seq-item.blank.filled { border-style: solid; background: #eaffea; border-color: var(--accent3); color: var(--accent3); }
        .seq-item.highlight { border-color: var(--accent); background: #fff8e0; }
        .seq-arrow { font-size: 22px; color: var(--text-light); margin: 0 2px; }

        /* 选项区 */
        .options-grid {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
            margin: 16px 0 20px;
        }
        .option-btn {
            min-width: 64px; padding: 12px 24px; border-radius: 40px;
            font-size: 22px; font-weight: 700; background: var(--bg-card);
            border: 2px solid var(--border); color: var(--text);
            box-shadow: var(--shadow); cursor: pointer; transition: all 0.15s;
        }
        .option-btn:hover { border-color: var(--accent); transform: scale(1.02); }
        .option-btn:active { transform: scale(0.96); }
        .option-btn.correct { border-color: var(--accent3); background: #e3f8e3; color: var(--accent3); }
        .option-btn.wrong { border-color: var(--danger); background: #ffe6e6; color: var(--danger); animation: shake 0.3s; }

        @keyframes shake { 0%,100%{ transform: translateX(0); } 25%{ transform: translateX(-8px); } 75%{ transform: translateX(8px); } }

        .game-feedback {
            min-height: 56px; margin-top: 8px;
            font-size: 16px; font-weight: 500; color: var(--text-dim);
        }
        .game-feedback .hint { background: var(--bg-card); border-radius: 16px; padding: 12px 20px; box-shadow: var(--shadow); display: inline-block; max-width: 480px; }

        .btn-next {
            margin-top: 18px; padding: 12px 40px; border-radius: 40px;
            background: var(--accent2); color: white; border: none;
            font-size: 18px; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(230,126,34,0.3);
            transition: 0.2s; display: inline-block;
        }
        .btn-next:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
        .btn-next:not(:disabled):hover { transform: scale(1.02); }

        /* 右面板 */
        #right-panel {
            width: var(--panel-width); min-width: var(--panel-width);
            background: var(--bg-panel); border-left: 1px solid var(--border);
            overflow-y: auto; padding: 16px 0;
        }

        .score-block { text-align: center; padding: 8px 0; }
        .score-block .big-star { font-size: 48px; color: var(--star-gold); }
        .score-block .score-num { font-size: 32px; font-weight: 800; color: var(--accent2); }
        .score-block .score-label { font-size: 13px; color: var(--text-dim); }

        .data-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px solid rgba(0,0,0,0.04); }
        .data-row .label { color: var(--text-dim); }
        .data-row .value { color: var(--text); font-weight: 700; text-align: right; }

        .hint-box {
            background: #fff3e0; border-radius: 16px; padding: 16px;
            margin: 12px 0; border-left: 4px solid var(--accent);
            font-size: 14px; line-height: 1.6; color: #5d4a3a;
        }
        .hint-box strong { color: var(--accent2); }

        /* 响应式 */
        @media (max-width: 900px) {
            #desktop-header { display: none; }
            #mobile-header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: var(--header-h); background: var(--bg-card); border-bottom: 1px solid var(--border); }
            #mobile-header h1 { font-size: 18px; color: var(--accent2); display: flex; align-items: center; gap: 6px; }
            #mobile-header .m-btn { background: none; border: 1px solid var(--border); border-radius: 30px; padding: 6px 14px; font-size: 14px; color: var(--text); cursor: pointer; }

            #left-panel { position: fixed; left: 0; top: var(--header-h); bottom: 0; z-index: 50; margin-left: calc(-1 * var(--panel-width)); transition: margin-left var(--transition); background: var(--bg-panel); }
            #left-panel.open { margin-left: 0; box-shadow: 4px 0 20px rgba(0,0,0,0.08); }

            #right-panel { position: fixed; right: 0; top: var(--header-h); bottom: 0; z-index: 50; margin-right: calc(-1 * var(--panel-width)); transition: margin-right var(--transition); background: var(--bg-panel); }
            #right-panel.open { margin-right: 0; box-shadow: -4px 0 20px rgba(0,0,0,0.08); }

            .seq-item { min-width: 40px; height: 44px; font-size: 20px; }
            .option-btn { min-width: 54px; padding: 10px 18px; font-size: 18px; }
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 20px; }
    </style>
</head>

<div id="app">
    <!-- 移动端header -->
    <header id="mobile-header">
        <button class="m-btn" id="m-toggle-left">☰ 关卡</button>
        <h1>🔗 数字接龙</h1>
        <button class="m-btn" id="m-toggle-right">📊 数据</button>
    </header>
    <!-- 桌面端header -->
    <header id="desktop-header">
        <h1>🔗 数字接龙 <span>规律挑战</span></h1>
        <div class="header-info">
            <span>⭐ 星星 <span class="star-count" id="star-count-header">0</span></span>
            <span style="color:var(--text-dim);">第 <span id="level-indicator">1</span>/6 关</span>
        </div>
    </header>

    <div id="main-layout">
        <!-- 左面板 关卡/进度 -->
        <aside id="left-panel">
            <div class="panel-section">
                <h3>🗺️ 接龙关卡</h3>
                <div class="level-selector" id="level-list"></div>
            </div>
            <div class="panel-section">
                <h3>📈 总进度</h3>
                <div class="progress-block">
                    <div class="bar-bg"><div class="bar-fill" id="global-progress-bar" style="width:0%"></div></div>
                    <div class="label"><span id="progress-text">0 / 6 关</span><span id="progress-percent">0%</span></div>
                </div>
            </div>
        </aside>

        <!-- 中视口 游戏 -->
        <main id="center-panel">
            <div class="game-area">
                <div class="rule-badge" id="rule-badge">🔍 接龙规律 · 找出下一个数字</div>
                <div class="chain-wrapper">
                    <div class="chain-title">🔗 数字接龙</div>
                    <div class="sequence-display" id="sequence-container"></div>
                </div>
                <div class="options-grid" id="options-container"></div>
                <div class="game-feedback" id="feedback-area"></div>
                <button class="btn-next" id="btn-next" disabled>下一关 ➜</button>
            </div>
        </main>

        <!-- 右面板 信息/得分/提示 -->
        <aside id="right-panel">
            <div class="panel-section">
                <h3>⭐ 得分 & 奖励</h3>
                <div class="score-block">
                    <div class="big-star">⭐</div>
                    <div class="score-num" id="total-stars">0</div>
                    <div class="score-label">累计星星</div>
                </div>
                <div class="data-row"><span class="label">✅ 答对</span><span class="value" id="correct-count">0</span></div>
                <div class="data-row"><span class="label">❌ 答错</span><span class="value" id="wrong-count">0</span></div>
                <div class="data-row"><span class="label">📝 已闯关</span><span class="value" id="levels-done">0</span></div>
            </div>
            <div class="panel-section">
                <h3>💡 接龙小提示</h3>
                <div class="hint-box" id="hint-box">
                    <strong>观察相邻数字的变化</strong><br>
                    每次增加多少？还是乘以几？找到规律就能接上！
                </div>
            </div>
            <div class="panel-section" style="border-bottom: none;">
                <h3>📖 规律宝典</h3>
                <div style="font-size:13px; color:var(--text-dim); line-height:1.7;">
                    • 等差数列：每次加相同的数<br>
                    • 等比数列：每次乘相同的数<br>
                    • 循环规律：重复一组数<br>
                    • 间隔规律：隔一个看变化
                </div>
            </div>
        </aside>
    </div>
