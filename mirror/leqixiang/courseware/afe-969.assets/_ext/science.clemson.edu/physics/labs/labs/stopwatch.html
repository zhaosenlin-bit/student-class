<!-- stopwatch.html  written by cdo on 4.24.2001  -->
<!-- a laboratory stop watch that uses the user's processor to
    determine the elapsed time -->

<html>

<HEAD>

<SCRIPT LANGUAGE="JavaScript">

    <!-- Begin
    var ms = 0;
    var state = 0;
    function startstop() {
        if (state == 0) {
            state = 1;
            then = new Date();
            then.setTime(then.getTime() - (ms*1000.));
        } else {
            state = 0;
            now = new Date();
            ms = (now.getTime() - then.getTime())/1000.;
            document.stpw.time.value = ms;
        }
    }

    function swreset() {
        state = 0;
        ms = 0;
        document.stpw.time.value = ms;
    }

    function display() {
        setTimeout("display();", 50);
        if (state == 1)  {
            now = new Date();
            ms = (now.getTime() - then.getTime())/1000.;
            document.stpw.time.value = ms;

        }
    }
// End -->
</SCRIPT>

</head>


<BODY onLoad="display()">


<CENTER>
<FORM NAME="stpw">
    <font size=+4 face="arial, helvetica">
    Elapsed Time
    </font>
    <p>
    <INPUT TYPE="text" style="font:24pt LCDD" Name="time" size=6>
    <font size=+3 face="arial, helvetica">
    seconds
    </font>
    <p>
    <INPUT TYPE="BUTTON" Name="ssbutton" STYLE="font:24pt LCDD" VALUE="Start/Stop" onClick="startstop()";>
    <INPUT TYPE="BUTTON" NAME="reset" STYLE="font:24pt LCDD" VALUE="Reset" onClick="swreset()">
    </font>
</FORM>
</CENTER>
