	<script>
cvalue = new Array(0, 1.57, 3.14, 4.71, "0");


cvalues = new Array("0", "π/2", "π", "3π/2", "0");

function initialize(){
	
	theCanvas = document.getElementById("CanvasOne");
	ctx = theCanvas.getContext("2d");
	
	timescale = 1;
	totaltime = 4;
	A1 = 1;
	A2 = 2;
	A3 = 3;
	f1 = 1;
	f2 = 1;
	f3 = 1;
	C1 = 0;
	C2 = 0;
	C3 = 0;
	showone = "yes";
	showtwo = "yes";
	showthree = "yes";
	showtotal = "yes";
	drawingpart();
	

	
}



function drawingpart(){
	
		
	
	/* 	background drawing canvas 2 */
	ctx.fillStyle="#CCCCCC";
	ctx.fillRect(0,0,900,450);
	
	ctx.fillStyle="#FFFF99";
	ctx.fillRect(0,450,900,250);
	
	ctx.strokeStyle = '#000000';
	ctx.lineWidth = 1;
	for(i=0; i<21;i++){
		ctx.beginPath();
		ctx.moveTo(50*i+50, 50);
		ctx.lineTo(50*i+50, 360);
		ctx.stroke();
		ctx.closePath();
	}
	
	ctx.font="14px Arial";
	ctx.fillStyle="#990000";

	ctx.lineWidth = 2;
	ctx.beginPath();
	ctx.moveTo(50, 200);
	ctx.lineTo(850, 200);
	ctx.stroke();
	ctx.closePath();
	
	
	for(i=0; i<7;i++){
		timevalue = i*timescale;
		yvalue = 12 - i*4;
		yposition = i*50+55;
		metrics = ctx.measureText(timevalue);
		textWidth = metrics.width;
		xposition = 200*i+50 - textWidth/2;
		ctx.fillText(timevalue,xposition, 380);
		metrics = ctx.measureText(yvalue);
		textWidth = metrics.width;
		xposition = 30 - textWidth;
		ctx.fillText(yvalue,xposition, yposition);
	}
	
	ctx.font="28px Arial";
	ctx.fillText("Time (s)",400, 420);

	for(i=0; i<7;i++){
		ctx.lineWidth = 2;
		ctx.beginPath();
		ctx.moveTo(40, 50*i+50);
		ctx.lineTo(900, 50*i+50);
		ctx.stroke();
		ctx.closePath();
	}
	
	for(i=0; i<6;i++){
		ctx.lineWidth = 2;
		ctx.beginPath();
		ctx.moveTo(50, 50*i+75);
		ctx.lineTo(900, 50*i+75);
		ctx.stroke();
		ctx.closePath();
	}
	
	ctx.lineWidth = 2;
	ctx.beginPath();
	ctx.moveTo(50, 50);
	ctx.lineTo(50, 350);
	ctx.stroke();
	ctx.closePath();


	for (j=0; j < 3400; j++){
		i = j/4;
		zoomfactor = 50/4;
		ypos1 = -zoomfactor*A1*Math.sin(2*Math.PI*f1*i*totaltime/800+cvalue[C1]);
		ypos2 = -zoomfactor*A2*Math.sin(2*Math.PI*f2*i*totaltime/800+cvalue[C2]);
		ypos3 = -zoomfactor*A3*Math.sin(2*Math.PI*f3*i*totaltime/800+cvalue[C3]);
		ypos = ypos1 + ypos2 + ypos3;
		if (showone == "yes"){
			ctx.fillStyle="#990000";
			ctx.fillRect(i+50,ypos1+200,3,3);
		}
		if (showtwo == "yes"){
			ctx.fillStyle="#000099";
			ctx.fillRect(i+50,ypos2+200,3,3);
		}
		if (showthree == "yes"){
			ctx.fillStyle="#009900";
			ctx.fillRect(i+50,ypos3+200,3,3);
		}
		if (showtotal == "yes"){
			ctx.fillStyle="#000000";
			ctx.fillRect(i+50,ypos+200,3,3);
		}
	}

	
	
	ctx.font="32px Arial";
	ctx.fillStyle="#990000";
	
	xtitle = 50;
	ystarting = 530;
	yspacing = 70;
	
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.moveTo(0, 490);
	ctx.lineTo(590, 490);
	ctx.stroke();
	ctx.closePath();
	
	temptext = "A";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, ystarting);
	
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.moveTo(0, 560);
	ctx.lineTo(590, 560);
	ctx.stroke();
	ctx.closePath();
	
	temptext = "f";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, ystarting + yspacing);
	
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.moveTo(0, 625);
	ctx.lineTo(590, 625);
	ctx.stroke();
	ctx.closePath();
	
	temptext = "C";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, ystarting + 2*yspacing);
	
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.moveTo(110, 450);
	ctx.lineTo(110, 700);
	ctx.stroke();
	ctx.closePath();
	
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.moveTo(270, 450);
	ctx.lineTo(270, 700);
	ctx.stroke();
	ctx.closePath();
	
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.moveTo(430, 450);
	ctx.lineTo(430, 700);
	ctx.stroke();
	ctx.closePath();
	
	ctx.lineWidth = 5;
	ctx.beginPath();
	ctx.moveTo(590, 450);
	ctx.lineTo(590, 700);
	ctx.stroke();
	ctx.closePath();
	
	
	ytitles = 480;
	
	yvalues = 530;
	
	xtitle = 190;
	
	temptext = "Wave 1";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, ytitles);
	
	temptext = A1;
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, yvalues);
	
	temptext = f1;
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, yvalues+1*yspacing);
	
	temptext = cvalues[C1];
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, yvalues+2*yspacing);
	
	xtitle = 350;
	
	temptext = "Wave 2";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, ytitles);
	
	temptext = A2;
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, yvalues);
	
	temptext = f2;
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, yvalues+1*yspacing);
	
	temptext = cvalues[C2];
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, yvalues+2*yspacing);
	
	xtitle = 510;
	
	temptext = "Wave 3";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, ytitles);
	
	temptext = A3;
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, yvalues);
	
	temptext = f3;
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, yvalues+1*yspacing);
	
	temptext = cvalues[C3];
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, yvalues+2*yspacing);
	
	xtitle = 750;
	yspacing = 50;
	
	temptext = "Displaying";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, ytitles);
	
	temptext = "Wave One";
	if (showone == "no"){
		ctx.fillStyle="#CCCCCC";
	}
	else{
		ctx.fillStyle="#990000";
	}
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, yvalues);
	
	temptext = "Wave Two";
	if (showtwo == "no"){
		ctx.fillStyle="#CCCCCC";
	}
	else{
		ctx.fillStyle="#000099";
	}
	
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, yvalues+1*yspacing);
		
	temptext = "Wave Three";
	if (showthree == "no"){
		ctx.fillStyle="#CCCCCC";
	}
	else{
		ctx.fillStyle="#009900";
	}
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, yvalues+2*yspacing);
	
	temptext = "Wave Total";
	if (showtotal == "no"){
		ctx.fillStyle="#CCCCCC";
	}
	else{
		ctx.fillStyle="#000000";
	}
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = xtitle - textWidth/2;
	ctx.fillText(temptext,xposition, yvalues+3*yspacing);
		
}

function ChangeC(x){
	if (x == 1){
		C1++;
		if (C1>4){
			C1 = 0;
		}
	}
	else if (x == 2){
		C2++;
		if (C2>4){
			C2 = 0;
		}
	}
	else{
		C3++;
		if (C3>4){
			C3 = 0;
		}
	}
	drawingpart();
}

function ChangeB(x){
	if (x == 1){
		f1++;
		if (f1>9){
			f1 = 1;
		}
	}
	else if (x == 2){
		f2++;
		if (f2>9){
			f2 = 1;
		}
	}
	else{
		f3++;
		if (f3>9){
			f3 = 1;
		}
	}	drawingpart();
}

function ChangeA(x){
	if (x == 1){
		A1++;
		TotalA = A1 + A2 + A3;
		if (TotalA>12){
			A1 = 0;
		}
	}
	else if (x == 2){
		A2++;
		TotalA = A1 + A2 + A3;
		if (TotalA>12){
			A2 = 0;
		}
	}
	else{
		A3++;
		TotalA = A1 + A2 + A3;
		if (TotalA>12){
			A3 = 0;
		}
	}
	
	drawingpart();
}

function ShowWave(x){
	if (x == 1){
		if (showone == "yes"){
			showone = "no";
		}
		else{
			showone = "yes";
		}
	}
	if (x == 2){
		if (showtwo == "yes"){
			showtwo = "no";
		}
		else{
			showtwo = "yes";
		}
	}
	if (x == 3){
		if (showthree == "yes"){
			showthree = "no";
		}
		else{
			showthree = "yes";
		}
	}
	if (x == 4){
		if (showtotal == "yes"){
			showtotal = "no";
		}
		else{
			showtotal = "yes";
		}
	}
	drawingpart();	
}





</script>
