	// Random bubble position INSIDE liquid and BETWEEN the two strips area.
	// NOTE: local coordinates relative to electrolysisCell group.
	function randomBubblePositionBetweenStrips(){
	  // x: between the strips, small margin
	  const xMin = BUB_stripX_left + 0.15;
	  const xMax = BUB_stripX_right - 0.15;
	
	  // z: keep near center region (between strips), but still random
	  const zMin = -0.45;
	  const zMax =  0.45;
	
	  // y: start near lower part of liquid
	  const liquidBottomY = BUB_wallT;              // bottom glass thickness top
	  const liquidTopY    = BUB_wallT + BUB_liquidH;
	  const yMin = liquidBottomY + 0.2;
	  const yMax = liquidBottomY + BUB_liquidH * 0.45;
	
	  const x = xMin + Math.random() * (xMax - xMin);
	  const y = yMin + Math.random() * (yMax - yMin);
	  const z = zMin + Math.random() * (zMax - zMin);
	
	  return new THREE.Vector3(x, y, z);
	}
	
	function generateBoilingBubble(){
	  if (!bubblesOn) return;
	  if (!bubblesGroup) return;
	  if (boilingBubbles.length >= maxBubbles) return;
	
	  const radius = Math.random() * 0.18 + 0.06; // 0.06..0.24
	  const geometry = new THREE.SphereGeometry(radius, 10, 10);
	
	  const material = new THREE.MeshBasicMaterial({
	    color: 0xffffff
	    //transparent: true,
	    //opacity: 0.55
	  });
	
	  const bubble = new THREE.Mesh(geometry, material);
	
	  // random start inside liquid between strips
	  bubble.position.copy(randomBubblePositionBetweenStrips());
	
	  // rise speed (units/sec) and slight wobble
	  bubble.userData = {
	    riseSpeed: 0.8 + Math.random() * 0.9,     // 0.8..1.7 units/sec
	    driftSpeed: 0.15 + Math.random() * 0.2,   // lateral wobble
	    phase: Math.random() * Math.PI * 2,
	    r: radius
	  };
	
	  bubblesGroup.add(bubble);
	  boilingBubbles.push(bubble);
	}
	
	function updateBoilingBubbles(dt){
	  if (!bubblesOn) return;
	  if (!bubblesGroup) return;
	
	  // spawn rate: bubbles per second (adjust if you want more/less)
	  const spawnRate = 10; // bubbles/sec
	  bubbleSpawnAccumulator += dt * spawnRate;
	
	  while (bubbleSpawnAccumulator >= 1){
	    bubbleSpawnAccumulator -= 1;
	    // add some randomness: sometimes skip
	    if (Math.random() < 0.85) generateBoilingBubble();
	  }
	
	  // liquid surface in local coordinates
	  const liquidTopY = BUB_wallT + BUB_liquidH;
	
	  for (let i = boilingBubbles.length - 1; i >= 0; i--){
	    const bubble = boilingBubbles[i];
	
	    // rise
	    bubble.position.y += bubble.userData.riseSpeed * dt;
	
	    // gentle wobble (stay between strips)
	    bubble.userData.phase += dt * 2.2;
	    bubble.position.x += Math.sin(bubble.userData.phase) * bubble.userData.driftSpeed * dt * 0.6;
	    bubble.position.z += Math.cos(bubble.userData.phase * 1.3) * bubble.userData.driftSpeed * dt * 0.5;
	
	    // clamp to remain between strips region
	    bubble.position.x = clamp(bubble.position.x, BUB_stripX_left + 0.15, BUB_stripX_right - 0.15);
	    bubble.position.z = clamp(bubble.position.z, -0.55, 0.55);
	
	    // remove when it reaches near surface
	    if (bubble.position.y > liquidTopY - 0.1){
	      bubblesGroup.remove(bubble);
	      boilingBubbles.splice(i, 1);
	    }
	  }
	}
	
	// API you already call in your UI
	function startBubbles(){
	  bubblesOn = true;
	  bubbleSpawnAccumulator = 0;
	}
	
	function stopBubbles(){
	  bubblesOn = false;
	  bubbleSpawnAccumulator = 0;
	
	  // remove existing bubbles
	  if (bubblesGroup){
	    for (let i = boilingBubbles.length - 1; i >= 0; i--){
	      bubblesGroup.remove(boilingBubbles[i]);
	    }
	  }
	  boilingBubbles.length = 0;
	}

	function updateBubbles(dtReal){

		  uniform vec3 boxSize;
		  uniform float radius;
		  ` + shader.vertexShader;

		  shader.vertexShader = shader.vertexShader.replace(
		    `#include <begin_vertex>`,
		    `#include <begin_vertex>
		    vec3 signs = sign(position);
		    vec3 box = boxSize - vec3(radius);
		    box = vec3(max(0.0, box.x), max(0.0, box.y), max(0.0, box.z));
		    vec3 p = signs * box;
		    transformed = signs * box + normalize(position) * radius;
		    // re-compute normals for correct shadows and reflections
		    objectNormal = all(equal(p, transformed)) ? normal : normalize(position); 
		    transformedNormal = normalize(normalMatrix * objectNormal);
		    vNormal = transformedNormal;
		    `
		  );
		};

	function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

	// Interpolate a factor between the lab points at 0.8A and 1.0A
	function interpFactor(I, f08, f10){
	  const x = clamp((I - 0.8) / 0.2, 0, 1);
	  return f08 + (f10 - f08) * x;
	}
	function copperMassRate_g_per_s(I){
	  const F = 96485;    // C/mol
	  const M = 63.54;    // g/mol copper (lab uses 63.54g) :contentReference[oaicite:4]{index=4}
	  const n = 2;        // Cu2+ needs 2 electrons :contentReference[oaicite:5]{index=5}
	  return (M / (n * F)) * I; // g/s
	}

	  });
	
	  // helper you can call from render loop:
	  window.__updateElectrolysis = function updateElectrolysis(){
	    if (!isRunning) return;
	
	    const now = performance.now();
	    const dtReal = (now - lastFrameT) / 1000;     // real seconds
	    lastFrameT = now;
	    updateBubbles(dtReal);
		  
	    const dtSim = dtReal * simSpeed;              // simulated seconds
	
	    const dtUsed = Math.min(dtSim, targetSim - elapsedSim);
	    elapsedSim += dtUsed;
	
	    // Base Faraday rate
	    const baseRate = copperMassRate_g_per_s(I_amp); // g/s ideal copper plating rate
	
	    // Empirical scale factors to match the attached lab results (0.8A and 1.0A points)
	    // From the lab table: +0.39g at 1A 20min; +0.335g at 0.8A 20min :contentReference[oaicite:6]{index=6}
	    // And anode loss magnitude: 0.43g at 1A; 0.321g at 0.8A :contentReference[oaicite:7]{index=7}
	    const cathodeFactor = interpFactor(I_amp, 1.06, 0.99); // ~1.06 at 0.8A, ~0.99 at 1.0A
	    const anodeFactor   = interpFactor(I_amp, 1.02, 1.09); // ~1.02 at 0.8A, ~1.09 at 1.0A
	
	    const dmc = baseRate * cathodeFactor * dtUsed;
	    const dma = baseRate * anodeFactor   * dtUsed;
	
	    mCathode_g += dmc;
	    mAnodeLoss_g += dma;
	
	    // Update UI continuously
	    document.getElementById('runningTimeText').textContent = elapsedSim.toFixed(0);
	    massCathode.value = mCathode_g.toFixed(4);
	    massAnode.value   = (-mAnodeLoss_g).toFixed(4);  // negtative delta m
	
	    // Visual growth/shrink (small)
	    if (cathodeStrip) cathodeStrip.scale.y = 1 + Math.min(0.6, mCathode_g * 1.2);
	    if (anodeStrip)   anodeStrip.scale.y   = 1 - Math.min(0.35, mAnodeLoss_g * 0.9);
	
	    // Stop condition
	    if (elapsedSim >= targetSim - 1e-9){
		  isRunning = false;
		  document.getElementById('currentSlider').disabled = false;
		  document.getElementById('timeSlider').disabled = false;
		  stopBubbles();
		}

	  };
	}
	function createWater(x,y,base){  // for big tank
			const geo = new THREE.CylinderGeometry( 10, 10, y, 32 ); 
			const mat = new THREE.MeshPhongMaterial( { color: "#0000ff",    
				side:THREE.DoubleSide,
				transparent:true,
				opacity:0.8
			});
			const wat = new THREE.Mesh(geo, mat);
			wat.position.set(x, base + y/2);
			scene.add(wat);
			return wat;
	}
	function addElectrolysisCell(x, y, z) {
		  electrolysisCell = new THREE.Group();
		
		  // ---- Beaker dimensions (tweak as you like)
		  const outerR = 3.2;
		  const innerR = 3.0;
		  const beakerH = 7.5;
		  const wallT = 0.25;
		
		  // ---- Glass (transparent)
		  // MeshPhysicalMaterial works well for glass-like look
		  const glassMat = new THREE.MeshPhysicalMaterial({
		    color: 0xffffff,
		    transparent: true,
		    opacity: 0.25,
		    roughness: 0.05,
		    metalness: 0.0,
		    transmission: 0.95,   // makes it "real glass" (needs WebGL2-ish support)
		    thickness: 0.4,
		    side: THREE.DoubleSide
		  });
		
		  // Use a cylinder "shell" by making a hollow shape: outer cylinder minus inner cylinder
		  // Quick practical trick: draw outer cylinder with low opacity + inner cylinder that "carves" visually (not true CSG).
		  // For education sims, this looks good enough.
		  const beakerOuterGeo = new THREE.CylinderGeometry(outerR, outerR, beakerH, 48, 1, true);
		  const beakerOuter = new THREE.Mesh(beakerOuterGeo, glassMat);
		  beakerOuter.position.set(0, beakerH / 2, 0);
		  electrolysisCell.add(beakerOuter);
		
		  // Bottom (glass disk)
		  const bottomGeo = new THREE.CylinderGeometry(outerR, outerR, wallT, 48);
		  const bottom = new THREE.Mesh(bottomGeo, glassMat);
		  bottom.position.set(0, wallT / 2, 0);
		  electrolysisCell.add(bottom);
		
		  // ---- Copper sulfate solution (blue)
		  const liquidH = 5.2;
		  const liquidGeo = new THREE.CylinderGeometry(innerR, innerR, liquidH, 48);
		const mat = new THREE.MeshPhongMaterial( { color: "#0000ff",    
				side:THREE.DoubleSide,
				transparent:true,
				opacity:0.8
			});
		  const liquidMat = new THREE.MeshPhysicalMaterial({
		    color: 0x66ccff,
		    transparent: true,
		    opacity: 0.45,
		    transmission: 0.9,     // makes it look like glass/liquid
		    roughness: 0.1,
		    metalness: 0.0,
		    clearcoat: 0.2,
		    thickness: 0.5,
		    side: THREE.DoubleSide
		  });

		  const liquid = new THREE.Mesh(liquidGeo, liquidMat);
		  liquid.position.set(0, wallT + liquidH / 2, 0);
		  electrolysisCell.add(liquid);
		
		  // ---- Copper electrodes (thin vertical strips)
		  const stripW = 0.22;
		  const stripH = 5.8;
		  const stripD = 1.4;
		
		  const copperMat = new THREE.MeshStandardMaterial({
		    color: 0xb87333,   // copper-like
		    roughness: 0.35,
		    metalness: 0.7
		  });
		
		  const stripGeo = new THREE.BoxGeometry(stripW, stripH, stripD);
		
		  // Cathode (left strip inside beaker)
		  cathodeStrip = new THREE.Mesh(stripGeo, copperMat);
		  cathodeStrip.position.set(-1.0, wallT + stripH / 2, 0);
		  electrolysisCell.add(cathodeStrip);
		
		  // Anode (right strip inside beaker)
		  anodeStrip = new THREE.Mesh(stripGeo, copperMat);
		  anodeStrip.position.set(1.0, wallT + stripH / 2, 0);
		  electrolysisCell.add(anodeStrip);
		
		  // Optional: small top clips (just for looks)
		  const clipGeo = new THREE.CylinderGeometry(0.15, 0.15, 5, 18);
		  const clipMat = new THREE.MeshLambertMaterial({ color: 0x808080 });
		
		  const clip1 = new THREE.Mesh(clipGeo, clipMat);
		  clip1.position.set(-1.0, beakerH + 0.25, 0);
		  electrolysisCell.add(clip1);
		
		  const clip2 = new THREE.Mesh(clipGeo, clipMat);
		  clip2.position.set(1.0, beakerH + 0.25, 0);
		  electrolysisCell.add(clip2);
		
		  // ---- Place cell in the scene
		  electrolysisCell.position.set(x, y, z);
		  scene.add(electrolysisCell);
		 
			// --- bubbles inside the beaker
			const bsys = createBubblesSystemSimple();
			electrolysisCell.add(bsys);
	}
	function addSphere(x, y, z, r){
		  var ballGeom = new THREE.SphereGeometry(r, 32, 24);
		  var ball = new THREE.Mesh(ballGeom, new THREE.MeshPhongMaterial({color:"gray"}));
		  ball.position.set(x, y, z);
		  scene.add(ball);
	}	
	function addPowerSupply(x, y, z, alpha) {
	    // Dimensions
	    const width = 11;
	    const height = 7;
	    const depth = 5;
	    const radius = 0.4;      // Corner radius
	    const smoothness = 4;  // Smoothness of rounded corners
	
	    // Create rounded box
	    const geometry = new RoundedBoxGeometry(width, height, depth, smoothness, radius);
	    const material = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.4, metalness: 0.1 });
	    const box = new THREE.Mesh(geometry, material);
	    box.castShadow = true;
	    box.receiveShadow = true;
	
	    // Load screen texture
	    var texture = textureloader.load('/api/program-assets/lab-simulation-electrolysis/_ext/vendor/Phyc240/textures/power-supply.png');
	    const volt_geometry = new THREE.BoxGeometry(9.8, 5.8, 0.2);
	    const volt_material = new THREE.MeshPhongMaterial({ map: texture });
	
	    // Create screen
	    const screen = new THREE.Mesh(volt_geometry, volt_material);
	    screen.position.set(0, 0, depth / 2 + 0.1); // slightly in front of the box
	    box.add(screen);
	
	    // Position and rotate FG
	    box.position.set(x, y, z);
	    box.rotation.y = alpha;
	
	    // Add to scene
	    scene.add(box);
	}
  	function createSpring( posX,posY,posZ) {   
		    var TWO_PI = Math.PI * 2.0;	    
		    var ANGLE_INCR = Math.PI / 12;  

		    var height = (-65 - posX);  // -65
		    var cylX = (-20 - height * 0.5);  // spring's top -70
			
		    var y,z;
		    var x = height/2;
		    var radius = 1.5; 
		    var n = 0;
		    var xIncr = height / (TWO_PI / ANGLE_INCR * NTWISTS );
		    var helix = [];
		    var springMaterial = new THREE.MeshLambertMaterial({color: "brown"});  

		    for( var phi=0; phi <= TWO_PI*NTWISTS; phi+=ANGLE_INCR ) {
			y = posY + Math.cos(phi) * radius;
			x -= xIncr/8;  
			z = posZ + Math.sin(phi) * radius;
			helix.push( new THREE.Vector3(x, y, z));
			n++;
		    }   

		    var curve = new THREE.CatmullRomCurve3( helix );
		    var geometry = new THREE.TubeGeometry( curve, n, 0.15, 36, false ); 
		    springMesh = new THREE.Mesh(geometry, springMaterial);
		    springMesh.position.set(posX,posY,posZ); 
		  
		    scene.add( springMesh );
	}   
	function addText(x,y,z,t,s, colo){
		fontloader.load("/api/program-assets/lab-simulation-electrolysis/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json",function(tex){ 
		    var  textGeo = new TextGeometry(t, {
			    size: s,  
			    height: 0.2, 
			    curveSegments: 6,
			    font: tex,
		    });
		    var  textMaterial = new THREE.MeshLambertMaterial({color: colo});  
		    var textMesh = new THREE.Mesh(textGeo , textMaterial);
		    textMesh.position.set(x,y,z);
		    scene.add(textMesh);
		});
	}
	function render() {
		controls.update(); 
		// electrolysis time-accelerated simulation update
	    if (window.__updateElectrolysis) window.__updateElectrolysis();
		requestAnimationFrame( render );
		renderer.render( scene, camera );
	};
