    <script>
        /* --- 核心 3D 场景与数学逻辑逻辑 --- */
        let scene, camera, renderer, controls;
        let frontSprocketMesh, rearSprocketMesh, crankMesh, pedalMesh, rearWheelGroup, chainMesh, frameGroup;
        let frontMarker, rearMarker;

        // 状态变量
        const state = {
            frontTeeth: 48,
            rearTeeth: 16,
            pedalAngle: 0,          // 弧度
            targetPedalAngle: 0,    // 动效目标角度
            isAnimating: false,
            isAutoRunning: false,
            isDragging: false,
            centerDistance: 5.5,    // 前后轴心距离
            wheelRadius: 2.2        // 车轮半径
        };

        // DOM 元素引用
        const els = {
            frontTeethInput: document.getElementById('frontTeethInput'),
            rearTeethInput: document.getElementById('rearTeethInput'),
            frontTeethVal: document.getElementById('frontTeethVal'),
            rearTeethVal: document.getElementById('rearTeethVal'),
            frontRevDisplay: document.getElementById('frontRevDisplay'),
            rearRevDisplay: document.getElementById('rearRevDisplay'),
            ratioDisplay: document.getElementById('ratioDisplay'),
            ratioMultiplier: document.getElementById('ratioMultiplier'),
            btnPlayOne: document.getElementById('btnPlayOne'),
            btnAutoPlay: document.getElementById('btnAutoPlay'),
            autoPlayIcon: document.getElementById('autoPlayIcon'),
            autoPlayText: document.getElementById('autoPlayText'),
            btnReset: document.getElementById('btnReset'),
            btnResetCamera: document.getElementById('btnResetCamera'),
            formulaPedal: document.getElementById('formulaPedal'),
            formulaFront: document.getElementById('formulaFront'),
            formulaRear: document.getElementById('formulaRear'),
            formulaResult: document.getElementById('formulaResult'),
            container: document.getElementById('canvas-container')
        };

        // 计算齿轮物理半径
        function getFrontRadius() {
            return state.frontTeeth * 0.025;
        }
        function getRearRadius() {
            return state.rearTeeth * 0.025;
        }

        // 初始化 3D 场景
        function initThreeScene() {
            const container = els.container;
            scene = new THREE.Scene();

            // 柔和雾化，融入背景
            scene.fog = new THREE.FogExp2(0xbae6fd, 0.03);

            // 相机
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(2, 2.5, 9);

            // 渲染器
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            // 轨道控制器
            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.maxPolarAngle = Math.PI / 2 + 0.1; // 不越过地面太多
            controls.minDistance = 3;
            controls.maxDistance = 18;
            controls.target.set(0, 0, 0);

            // 灯光布置
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5;
            dirLight.shadow.camera.far = 25;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.4);
            fillLight.position.set(-5, 2, -5);
            scene.add(fillLight);

            // 地面与环境
            createEnvironment();

            // 构建 3D 自行车传动系统
            buildBicycleSystem();

            // Raycaster 鼠标交互控制
            setupRaycasterInteraction();

            // 窗口 resize 监听
            window.addEventListener('resize', onWindowResize);
        }

        // 创建地面与背景衬托
        function createEnvironment() {
            // 虚化网格地面
            const gridHelper = new THREE.GridHelper(30, 30, 0x0284c7, 0x93c5fd);
            gridHelper.position.y = -state.wheelRadius;
            gridHelper.material.opacity = 0.4;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            // 阴影接收平面
            const shadowPlaneGeo = new THREE.PlaneGeometry(30, 30);
            const shadowPlaneMat = new THREE.ShadowMaterial({ opacity: 0.15 });
            const shadowPlane = new THREE.Mesh(shadowPlaneGeo, shadowPlaneMat);
            shadowPlane.rotation.x = -Math.PI / 2;
            shadowPlane.position.y = -state.wheelRadius - 0.01;
            shadowPlane.receiveShadow = true;
            scene.add(shadowPlane);
        }

        // 生成 2D 齿轮 Shape 供 ExtrudeGeometry 使用
        function createGearShape(teeth, radius) {
            const shape = new THREE.Shape();
            const toothDepth = 0.08;
            const toothAngle = (Math.PI * 2) / teeth;

            for (let i = 0; i < teeth; i++) {
                const angle = i * toothAngle;
                const a1 = angle - toothAngle * 0.25;
                const a2 = angle - toothAngle * 0.12;
                const a3 = angle + toothAngle * 0.12;
                const a4 = angle + toothAngle * 0.25;

                const rIn = radius - toothDepth;
                const rOut = radius + toothDepth * 0.5;

                if (i === 0) {
                    shape.moveTo(Math.cos(a1) * rIn, Math.sin(a1) * rIn);
                } else {
                    shape.lineTo(Math.cos(a1) * rIn, Math.sin(a1) * rIn);
                }
                shape.lineTo(Math.cos(a2) * rOut, Math.sin(a2) * rOut);
                shape.lineTo(Math.cos(a3) * rOut, Math.sin(a3) * rOut);
                shape.lineTo(Math.cos(a4) * rIn, Math.sin(a4) * rIn);
            }
            shape.closePath();

            // 镂空内圈
            const holePath = new THREE.Path();
            holePath.absarc(0, 0, radius * 0.5, 0, Math.PI * 2, true);
            shape.holes.push(holePath);

            return shape;
        }

        // 构建整个自行车传动 3D 组合
        function buildBicycleSystem() {
            frameGroup = new THREE.Group();
            scene.add(frameGroup);

            const metallicMaterial = new THREE.MeshStandardMaterial({
                color: 0x94a3b8,
                metalness: 0.85,
                roughness: 0.2
            });

            const frontGearMaterial = new THREE.MeshStandardMaterial({
                color: 0x2563eb, // 蓝色前齿轮
                metalness: 0.6,
                roughness: 0.3
            });

            const rearGearMaterial = new THREE.MeshStandardMaterial({
                color: 0x059669, // 绿色后齿轮
                metalness: 0.6,
                roughness: 0.3
            });

            // 1. 前齿轮与曲柄脚踏组 (置于 x = centerDistance / 2)
            const frontX = state.centerDistance / 2;
            const frontR = getFrontRadius();

            const frontGeo = new THREE.ExtrudeGeometry(createGearShape(state.frontTeeth, frontR), {
                depth: 0.08,
                bevelEnabled: true,
                bevelSegments: 2,
                steps: 1,
                bevelSize: 0.01,
                bevelThickness: 0.01
            });
            frontGeo.center();
            frontSprocketMesh = new THREE.Mesh(frontGeo, frontGearMaterial);
            frontSprocketMesh.position.set(frontX, 0, 0);
            frontSprocketMesh.castShadow = true;
            frameGroup.add(frontSprocketMesh);

            // 曲柄组
            crankMesh = new THREE.Group();
            crankMesh.position.set(frontX, 0, 0.06);

            const armGeo = new THREE.BoxGeometry(0.12, 1.2, 0.08);
            armGeo.translate(0, -0.5, 0);
            const arm = new THREE.Mesh(armGeo, metallicMaterial);
            arm.castShadow = true;
            crankMesh.add(arm);

            // 脚踏
            const pedalGeo = new THREE.BoxGeometry(0.5, 0.12, 0.3);
            const pedalMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
            pedalMesh = new THREE.Mesh(pedalGeo, pedalMat);
            pedalMesh.position.set(0, -1.0, 0.15);
            pedalMesh.castShadow = true;
            crankMesh.add(pedalMesh);

            // 脚踏红点标记
            const markerGeo = new THREE.SphereGeometry(0.06, 16, 16);
            const redMat = new THREE.MeshBasicMaterial({ color: 0xef4444 });
            frontMarker = new THREE.Mesh(markerGeo, redMat);
            frontMarker.position.set(0, -1.0, 0.32);
            crankMesh.add(frontMarker);

            frameGroup.add(crankMesh);

            // 2. 后齿轮与后轮组 (置于 x = -centerDistance / 2)
            const rearX = -state.centerDistance / 2;
            const rearR = getRearRadius();

            const rearGeo = new THREE.ExtrudeGeometry(createGearShape(state.rearTeeth, rearR), {
                depth: 0.06,
                bevelEnabled: true,
                bevelSegments: 2,
                steps: 1,
                bevelSize: 0.01,
                bevelThickness: 0.01
            });
            rearGeo.center();
            rearSprocketMesh = new THREE.Mesh(rearGeo, rearGearMaterial);
            rearSprocketMesh.position.set(rearX, 0, 0);
            rearSprocketMesh.castShadow = true;
            frameGroup.add(rearSprocketMesh);

            // 后车轮组
            rearWheelGroup = new THREE.Group();
            rearWheelGroup.position.set(rearX, 0, 0);

            // 轮胎 Tire
            const tireGeo = new THREE.TorusGeometry(state.wheelRadius, 0.1, 16, 64);
            const tireMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.9 });
            const tire = new THREE.Mesh(tireGeo, tireMat);
            tire.castShadow = true;
            rearWheelGroup.add(tire);

            // 轮辋 Rim
            const rimGeo = new THREE.TorusGeometry(state.wheelRadius - 0.1, 0.03, 12, 64);
            const rim = new THREE.Mesh(rimGeo, metallicMaterial);
            rearWheelGroup.add(rim);

            // 辐条 Spokes
            const spokeCount = 24;
            const spokeMat = new THREE.MeshBasicMaterial({ color: 0xcbd5e1 });
            for (let i = 0; i < spokeCount; i++) {
                const angle = (i * Math.PI * 2) / spokeCount;
                const spokeGeo = new THREE.CylinderGeometry(0.008, 0.008, state.wheelRadius - 0.12);
                spokeGeo.translate(0, (state.wheelRadius - 0.12) / 2, 0);
                const spoke = new THREE.Mesh(spokeGeo, spokeMat);
                spoke.rotation.z = angle;
                rearWheelGroup.add(spoke);
            }

            // 车轮转圈红点标记 (用于清晰观测后轮旋转)
            rearMarker = new THREE.Mesh(new THREE.SphereGeometry(0.09, 16, 16), redMat);
            rearMarker.position.set(0, state.wheelRadius - 0.1, 0.12);
            rearWheelGroup.add(rearMarker);

            frameGroup.add(rearWheelGroup);

            // 3. 自行车车架管线（装饰增强背景真实感）
            createFrameTubes(frontX, rearX);

            // 4. 生成 3D 链条
            updateChain3D();
        }

        // 绘制车架管骨架
        function createFrameTubes(frontX, rearX) {
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.5, roughness: 0.3 });
            
            // 后下叉 (连接前轴与后轴)
            const chainStayPath = new THREE.LineCurve3(
                new THREE.Vector3(rearX, 0, -0.1),
                new THREE.Vector3(frontX, 0, -0.1)
            );
            const chainStayGeo = new THREE.TubeGeometry(chainStayPath, 10, 0.04, 8, false);
            const chainStay = new THREE.Mesh(chainStayGeo, frameMat);
            frameGroup.add(chainStay);

            // 后上叉 / 虚拟中轴点
            const seatPoint = new THREE.Vector3((frontX + rearX) / 2 - 0.2, 2.0, 0);
            const seatStayPath = new THREE.LineCurve3(new THREE.Vector3(rearX, 0, -0.05), seatPoint);
            frameGroup.add(new THREE.Mesh(new THREE.TubeGeometry(seatStayPath, 10, 0.035, 8, false), frameMat));

            const seatTubePath = new THREE.LineCurve3(new THREE.Vector3(frontX, 0, 0), seatPoint);
            frameGroup.add(new THREE.Mesh(new THREE.TubeGeometry(seatTubePath, 10, 0.045, 8, false), frameMat));
        }

        // 根据前/后齿轮半径切线计算 3D 链条 Path
        function updateChain3D() {
            if (chainMesh) scene.remove(chainMesh);

            const frontX = state.centerDistance / 2;
            const rearX = -state.centerDistance / 2;
            const r1 = getFrontRadius();
            const r2 = getRearRadius();
            const d = state.centerDistance;

            // 切线角
            const alpha = Math.asin((r1 - r2) / d);

            // 4个切点
            const p1 = new THREE.Vector2(frontX + r1 * Math.sin(alpha), r1 * Math.cos(alpha));
            const p2 = new THREE.Vector2(rearX + r2 * Math.sin(alpha), r2 * Math.cos(alpha));
            const p3 = new THREE.Vector2(rearX + r2 * Math.sin(alpha), -r2 * Math.cos(alpha));
            const p4 = new THREE.Vector2(frontX + r1 * Math.sin(alpha), -r1 * Math.cos(alpha));

            const curvePath = new THREE.CurvePath();

            // 上切线
            curvePath.add(new THREE.LineCurve3(
                new THREE.Vector3(p1.x, p1.y, 0),
                new THREE.Vector3(p2.x, p2.y, 0)
            ));

            // 后齿轮外弧
            const rearArc = new THREE.EllipseCurve(
                rearX, 0,
                r2, r2,
                Math.PI / 2 + alpha, Math.PI * 1.5 - alpha,
                false
            );
            const rearArcPoints = rearArc.getPoints(20);
            for (let i = 0; i < rearArcPoints.length - 1; i++) {
                curvePath.add(new THREE.LineCurve3(
                    new THREE.Vector3(rearArcPoints[i].x, rearArcPoints[i].y, 0),
                    new THREE.Vector3(rearArcPoints[i + 1].x, rearArcPoints[i + 1].y, 0)
                ));
            }

            // 下切线
            curvePath.add(new THREE.LineCurve3(
                new THREE.Vector3(p3.x, p3.y, 0),
                new THREE.Vector3(p4.x, p4.y, 0)
            ));

            // 前齿轮外弧
            const frontArc = new THREE.EllipseCurve(
                frontX, 0,
                r1, r1,
                -Math.PI / 2 + alpha, Math.PI / 2 - alpha,
                false
            );
            const frontArcPoints = frontArc.getPoints(20);
            for (let i = 0; i < frontArcPoints.length - 1; i++) {
                curvePath.add(new THREE.LineCurve3(
                    new THREE.Vector3(frontArcPoints[i].x, frontArcPoints[i].y, 0),
                    new THREE.Vector3(frontArcPoints[i + 1].x, frontArcPoints[i + 1].y, 0)
                ));
            }

            // 生成管道链条
            const chainGeo = new THREE.TubeGeometry(curvePath, 120, 0.025, 6, true);
            const chainMat = new THREE.MeshStandardMaterial({
                color: 0x475569,
                metalness: 0.9,
                roughness: 0.2
            });

            chainMesh = new THREE.Mesh(chainGeo, chainMat);
            scene.add(chainMesh);
        }

        // 重新更新齿轮 Geometry（当 Slider 改变时调用）
        function rebuildGears() {
            const frontR = getFrontRadius();
            const rearR = getRearRadius();

            // 更新前齿轮
            frontSprocketMesh.geometry.dispose();
            const frontGeo = new THREE.ExtrudeGeometry(createGearShape(state.frontTeeth, frontR), {
                depth: 0.08, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.01, bevelThickness: 0.01
            });
            frontGeo.center();
            frontSprocketMesh.geometry = frontGeo;

            // 更新后齿轮
            rearSprocketMesh.geometry.dispose();
            const rearGeo = new THREE.ExtrudeGeometry(createGearShape(state.rearTeeth, rearR), {
                depth: 0.06, bevelEnabled: true, bevelSegments: 2, steps: 1, bevelSize: 0.01, bevelThickness: 0.01
            });
            rearGeo.center();
            rearSprocketMesh.geometry = rearGeo;

            // 重新刷新 3D 链条路径
            updateChain3D();

            // 重新刷新计算面板
            updateStatsUI();
        }

        // 核心数学计算与 UI 刷新
        function updateStatsUI() {
            const ratio = state.frontTeeth / state.rearTeeth;
            const frontRevs = state.pedalAngle / (Math.PI * 2);
            const rearRevs = frontRevs * ratio;

            // 更新 DOM 文字
            els.frontTeethVal.textContent = state.frontTeeth;
            els.rearTeethVal.textContent = state.rearTeeth;
            els.frontRevDisplay.textContent = frontRevs.toFixed(1);
            els.rearRevDisplay.textContent = rearRevs.toFixed(1);

            els.ratioDisplay.textContent = `${state.frontTeeth} : ${state.rearTeeth} = ${ratio.toFixed(2)}`;
            els.ratioMultiplier.textContent = ratio.toFixed(2);

            // 底部公式展示卡片
            els.formulaPedal.textContent = frontRevs.toFixed(1);
            els.formulaFront.textContent = state.frontTeeth;
            els.formulaRear.textContent = state.rearTeeth;
            els.formulaResult.textContent = (frontRevs * ratio).toFixed(2);
        }

        // 驱动 3D 模型组件旋转
        function applyRotations() {
            const ratio = state.frontTeeth / state.rearTeeth;
            const rearAngle = state.pedalAngle * ratio;

            // 前齿轮与曲柄
            frontSprocketMesh.rotation.z = -state.pedalAngle;
            crankMesh.rotation.z = -state.pedalAngle;

            // 保持脚踏水平
            pedalMesh.rotation.z = state.pedalAngle;

            // 后齿轮与后车轮
            rearSprocketMesh.rotation.z = -rearAngle;
            rearWheelGroup.rotation.z = -rearAngle;

            // 更新界面数据
            updateStatsUI();
        }

        // 3D 射线直接拖拽脚踏交互
        function setupRaycasterInteraction() {
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let isPlaneIntersected = false;
            const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0); // XY 平面

            function onPointerDown(e) {
                if (e.button !== 0) return; // 仅限左键
                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects([frontSprocketMesh, pedalMesh, frontMarker], true);

                if (intersects.length > 0) {
                    state.isDragging = true;
                    controls.enabled = false; // 拖拽齿轮时禁用相机视角旋转
                    state.isAutoRunning = false;
                    updateAutoPlayBtnUI();
                }
            }

            function onPointerMove(e) {
                if (!state.isDragging) return;

                mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const point = new THREE.Vector3();
                raycaster.ray.intersectPlane(dragPlane, point);

                if (point) {
                    const frontX = state.centerDistance / 2;
                    const dx = point.x - frontX;
                    const dy = point.y - 0;
                    let angle = Math.atan2(dy, dx);
                    
                    // 转换为顺时针旋转累加
                    let targetAngle = -angle - Math.PI / 2;
                    if (targetAngle < 0) targetAngle += Math.PI * 2;
                    
                    state.pedalAngle = targetAngle;
                    applyRotations();
                }
            }

            function onPointerUp() {
                if (state.isDragging) {
                    state.isDragging = false;
                    controls.enabled = true;
                }
            }

            window.addEventListener('pointerdown', onPointerDown);
            window.addEventListener('pointermove', onPointerMove);
            window.addEventListener('pointerup', onPointerUp);
        }

        // 事件监听绑定
        function setupEventListeners() {
            // 前齿轮齿数改变
            els.frontTeethInput.addEventListener('input', (e) => {
                state.frontTeeth = parseInt(e.target.value);
                rebuildGears();
            });

            // 后齿轮齿数改变
            els.rearTeethInput.addEventListener('input', (e) => {
                state.rearTeeth = parseInt(e.target.value);
                rebuildGears();
            });

            // 自动蹬一圈 (旋转 + 2PI)
            els.btnPlayOne.addEventListener('click', () => {
                if (state.isAnimating) return;
                state.targetPedalAngle = state.pedalAngle + Math.PI * 2;
                state.isAnimating = true;
            });

            // 连续骑行开关
            els.btnAutoPlay.addEventListener('click', () => {
                state.isAutoRunning = !state.isAutoRunning;
                updateAutoPlayBtnUI();
            });

            // 重置数据
            els.btnReset.addEventListener('click', () => {
                state.pedalAngle = 0;
                state.targetPedalAngle = 0;
                state.isAnimating = false;
                state.isAutoRunning = false;
                updateAutoPlayBtnUI();
                applyRotations();
            });

            // 复位相机视角
            els.btnResetCamera.addEventListener('click', () => {
                camera.position.set(2, 2.5, 9);
                controls.target.set(0, 0, 0);
                controls.update();
            });
        }

        function updateAutoPlayBtnUI() {
            if (state.isAutoRunning) {
                els.autoPlayIcon.className = 'fa-solid fa-pause text-lg';
                els.autoPlayText.textContent = '暂停';
                els.btnAutoPlay.classList.replace('bg-emerald-600', 'bg-amber-600');
                els.btnAutoPlay.classList.replace('hover:bg-emerald-700', 'hover:bg-amber-700');
            } else {
                els.autoPlayIcon.className = 'fa-solid fa-play text-lg';
                els.autoPlayText.textContent = '自动骑';
                els.btnAutoPlay.classList.replace('bg-amber-600', 'bg-emerald-600');
                els.btnAutoPlay.classList.replace('hover:bg-amber-700', 'hover:bg-emerald-700');
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // 主渲染与动画循环
        function animate() {
            requestAnimationFrame(animate);

            // 处理单圈动画过渡
            if (state.isAnimating) {
                const step = 0.08;
                if (state.pedalAngle < state.targetPedalAngle) {
                    state.pedalAngle += step;
                    if (state.pedalAngle >= state.targetPedalAngle) {
                        state.pedalAngle = state.targetPedalAngle;
                        state.isAnimating = false;
                    }
                    applyRotations();
                }
            }

            // 处理连续自动骑行
            if (state.isAutoRunning && !state.isDragging) {
                state.pedalAngle += 0.03;
                applyRotations();
            }

            // 更新 3D OrbitControls
            controls.update();

            // 渲染 3D 场景
            renderer.render(scene, camera);
        }

        // 页面加载入口
        window.onload = function () {
            initThreeScene();
            setupEventListeners();
            applyRotations();
            animate();
        };
    </script>

<script>

  // 防右键
  document.addEventListener('contextmenu', function(e) {

  });

  // 防键盘快捷键: F12 | Ctrl+Shift+I | Ctrl+Shift+J | Ctrl+U | Ctrl+S
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'i' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u')) ||
      (e.ctrlKey && (e.key === 's' || e.key === 'S'))
    ) {
      e.preventDefault();
      return false;
    }
  });

  // DevTools 检测（基于 debugger 语句执行耗时）
  var _cdt = function() {
    var t0 = performance.now();
    (function(){}).constructor('debugger')();
    if (performance.now() - t0 > 100) {
      (function lp() {
        (function(){}).constructor('debugger')();
        setTimeout(lp, 50);
      })();
    }
  };
  setTimeout(_cdt, 1000);
  setInterval(_cdt, 3000);

  setTimeout(function() {

  }, 500);
})();
