<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导线切割磁感线实验</title>
<style>
:root {
  --bg: #080d1a;
  --surface: rgba(16, 22, 45, 0.85);
  --border: rgba(0, 190, 255, 0.15);
  --accent: #00c8ff;
  --accent2: #5b8cff;
  --text: #c8d8f0;
  --text2: #889ab8;
  --green: #40e860;
  --red: #ff4060;
  --gold: #ffb040;
  --radius: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 30% 20%, rgba(0,180,255,0.06) 0%, transparent 60%),
    radial-gradient(ellipse at 70% 60%, rgba(90,130,255,0.05) 0%, transparent 60%),
    radial-gradient(ellipse at 50% 80%, rgba(0,200,255,0.04) 0%, transparent 50%);
  color: var(--text);
  min-height: 100vh;
  padding: 16px;
}
.app { max-width: 1100px; margin: 0 auto; }
.header {
  text-align: center;
  padding: 18px 20px 10px;
  margin-bottom: 14px;
}
.header h1 {
  font-size: 1.7em;
  font-weight: 700;
  background: linear-gradient(135deg, #e0f0ff, #80c8ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: 0.04em;
}
.header .subtitle {
  font-size: 0.88em;
  color: var(--text2);
  margin-top: 4px;
  letter-spacing: 0.06em;
}

.main-layout {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 14px;
  align-items: start;
}

/* Glass card */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.03);
}

/* Canvas */
.canvas-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0,0,0,0.35);
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  cursor: default;
}
canvas.draggable { cursor: grab; }
canvas.dragging { cursor: grabbing; }

/* Sidebar */
.sidebar { display: flex; flex-direction: column; gap: 12px; }

.param-group { margin-bottom: 10px; }
.param-group:last-child { margin-bottom: 0; }
.param-label {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 0.85em; color: var(--text2); margin-bottom: 3px;
}
.param-label .name { font-weight: 600; color: var(--text); }
.param-label .unit { font-size: 0.82em; color: var(--text2); }

input[type="range"] {
  -webkit-appearance: none; width: 100%; height: 5px;
  background: linear-gradient(90deg, #0a3050, var(--accent));
  border-radius: 3px; outline: none; margin: 2px 0 8px;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 18px; height: 18px;
  background: #e8f4ff; border-radius: 50%; cursor: pointer;
  box-shadow: 0 0 10px rgba(0,200,255,0.5);
  border: 2px solid var(--accent);
}
input[type="range"]:disabled { opacity: 0.45; }

/* Calc display */
.calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.calc-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 5px 8px; border-radius: 6px;
  background: rgba(0,180,255,0.04);
  font-size: 0.84em;
}
.calc-item .formula { color: var(--text2); font-size: 0.78em; }
.calc-item .value { font-weight: 700; color: var(--accent); font-family: 'Consolas','Monaco',monospace; }
.calc-item.highlight { background: rgba(0,200,255,0.1); }
.calc-item.highlight .value { color: var(--green); }

/* Buttons */
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
  flex: 1; min-width: 60px; padding: 9px 6px; border-radius: 8px;
  border: 1px solid var(--border); cursor: pointer;
  font-size: 0.82em; font-weight: 600; color: var(--text);
  background: rgba(0,180,255,0.08);
  transition: all 0.25s; text-align: center;
  white-space: nowrap;
}
.btn:hover {
  background: rgba(0,200,255,0.18);
  border-color: rgba(0,200,255,0.4);
  box-shadow: 0 0 16px rgba(0,180,255,0.15);
}
.btn.active {
  background: rgba(0,200,255,0.22);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 0 14px rgba(0,200,255,0.25);
}
.btn.accent {
  background: linear-gradient(135deg, rgba(0,200,255,0.25), rgba(90,140,255,0.25));
  border-color: rgba(0,200,255,0.45);
}

/* Mode indicator */
.mode-indicator {
  font-size: 0.78em; text-align: center; padding: 4px 10px;
  border-radius: 20px; display: inline-block;
  background: rgba(0,200,255,0.08); color: var(--accent);
  margin-top: 2px;
}

/* Test section */
.test-section { margin-top: 14px; }
.test-section .section-title {
  font-size: 1.05em; font-weight: 700; margin-bottom: 10px;
  color: var(--text); padding-left: 4px;
  border-left: 3px solid var(--accent);
}
.test-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.test-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.test-card .q-title { font-weight: 700; margin-bottom: 8px; font-size: 0.9em; }
.test-card .options { display: flex; flex-wrap: wrap; gap: 6px; }
.test-card .opt {
  padding: 5px 12px; border-radius: 6px; cursor: pointer;
  border: 1px solid rgba(255,255,255,0.12);
  font-size: 0.82em; transition: all 0.2s;
  background: rgba(255,255,255,0.03);
}
.test-card .opt:hover { border-color: var(--accent2); background: rgba(90,140,255,0.1); }
.test-card .opt.selected { border-color: var(--accent); background: rgba(0,200,255,0.15); }
.test-card .opt.correct { border-color: var(--green); background: rgba(64,232,96,0.15); color: var(--green); }
.test-card .opt.wrong { border-color: var(--red); background: rgba(255,64,96,0.12); color: var(--red); }
.test-card .feedback { margin-top: 8px; font-size: 0.8em; min-height: 1.2em; }
.test-card .feedback.ok { color: var(--green); }
.test-card .feedback.err { color: var(--red); }

/* Responsive */
@media (max-width: 900px) {
  .main-layout { grid-template-columns: 1fr; }
  .test-grid { grid-template-columns: 1fr; }
  .header h1 { font-size: 1.3em; }
}

/* Right-hand rule mini panel */
.rhr-toggle {
  position: absolute; /* handled in JS */
}
</style>
</head>

<div class="header">
  <h1>导线切割磁感线实验</h1>
  <div class="subtitle">高二选择性必修第二册 &middot; 电磁感应</div>
</div>

<div class="main-layout">
  <!-- Canvas -->
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="c"></canvas>
  </div>

  <!-- Sidebar -->
  <div class="sidebar">
    <!-- Params -->
    <div class="card" id="paramCard">
      <div class="param-group">
        <div class="param-label"><span class="name">磁感应强度 B</span><span class="unit" id="valB">1.00 T</span></div>
        <input type="range" id="sliderB" min="0" max="3" step="0.01" value="1">
      </div>
      <div class="param-group">
        <div class="param-label"><span class="name">导体棒长度 L</span><span class="unit" id="valL">0.50 m</span></div>
        <input type="range" id="sliderL" min="0.1" max="1.5" step="0.01" value="0.5">
      </div>
      <div class="param-group">
        <div class="param-label"><span class="name">运动速度 v</span><span class="unit" id="valV">2.00 m/s</span></div>
        <input type="range" id="sliderV" min="-5" max="5" step="0.01" value="2">
      </div>
      <div class="param-group">
        <div class="param-label"><span class="name">回路电阻 R</span><span class="unit" id="valR">4.00 Ω</span></div>
        <input type="range" id="sliderR" min="0.5" max="20" step="0.01" value="4">
      </div>
    </div>

    <!-- Calculated -->
    <div class="card" id="calcCard">
      <div class="calc-grid">
        <div class="calc-item"><span class="formula">&epsilon; = BLv</span><span class="value" id="dispEMF">1.00 V</span></div>
        <div class="calc-item"><span class="formula">I = &epsilon;/R</span><span class="value" id="dispI">0.250 A</span></div>
        <div class="calc-item"><span class="formula">F = BIL</span><span class="value" id="dispF">0.125 N</span></div>
        <div class="calc-item highlight"><span class="formula">P<sub>外</sub> = Fv</span><span class="value" id="dispPext">0.250 W</span></div>
        <div class="calc-item highlight" style="grid-column:1/-1"><span class="formula">P<sub>电</sub> = I&sup2;R</span><span class="value" id="dispPelec">0.250 W</span></div>
      </div>
      <div class="mode-indicator" id="modeInd" style="display:block;margin-top:8px;width:100%;text-align:center;">
        自动模式
      </div>
    </div>

    <!-- Buttons -->
    <div class="card">
      <div class="btn-row">
        <button class="btn accent" id="btnStart">▶ 开始</button>
        <button class="btn" id="btnDrag">🖐 拖拽模式</button>
      </div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn" id="btnReverse">↔ 反向运动</button>
        <button class="btn" id="btnReset">↺ 重置</button>
      </div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="btn" id="btnRHR">🖐 右手定则</button>
      </div>
    </div>
  </div>
</div>

<!-- Test questions -->
<div class="test-section">
  <div class="section-title">检测题</div>
  <div class="test-grid" id="testGrid"></div>
</div>
