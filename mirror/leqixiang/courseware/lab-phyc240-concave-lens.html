<style>
/* ===== CONCAVE LENS INFORMATION PANEL ===== */

#info {
    position: fixed;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    z-index: 1000;

    width: max-content;
    max-width: calc(100vw - 24px);
    margin: 0;
    font-family: Arial, sans-serif;
    box-sizing: border-box;
}

/* Main horizontal panel */
#info .lens-panel {
    display: flex;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;

    gap: 16px;
    padding: 12px 18px;

    background: rgba(255, 255, 255, 0.96);
    border: 2px solid #0879a3;
    border-radius: 12px;

    box-shadow: 0 4px 16px rgba(0,0,0,0.18);
    color: #17324d;
    box-sizing: border-box;
}

/* ===== TITLE AND INSTRUCTIONS ===== */

#info .panel-title {
    flex: 0 1 220px;
    min-width: 190px;
    max-width: 240px;
    text-align: center;
}

#info .panel-title h3 {
    margin: 0 0 6px;
    font-size: 18px;
    font-weight: bold;
    color: #075c83;
}

#info .focal-length {
    margin-bottom: 5px;
    font-size: 16px;
    font-weight: bold;
}

#info .lens-instruction {
    font-size: 13px;
    line-height: 1.4;
}

#info .sign-convention {
    margin: 6px 0 0;
    font-size: 12px;
    font-weight: 600;
    line-height: 1.4;
    color: #075c83;
}

/* ===== MEASUREMENT GROUPS ===== */

#info .lens-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 0;
    max-width: 100%;
}

#info .lens-group-title {
    margin: 0 0 3px;
    font-size: 16px;
    font-weight: bold;
    text-align: center;
    color: #17324d;
}

/* ===== LABELS AND INPUTS ===== */

#info .lens-row {
    display: grid;
    grid-template-columns: 36px 90px 36px 90px;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

#info .lens-row label {
    margin: 0;
    font-size: 16px;
    font-weight: bold;
    text-align: right;
    white-space: nowrap;
}

#info .lens-row input {
    width: 100%;
    min-width: 0;
    height: 34px;
    padding: 5px 4px;

    border: 1px solid #aebdc8;
    border-radius: 5px;

    font-size: 15px;
    font-weight: bold;
    text-align: center;
    color: #123;

    box-sizing: border-box;
}

/* Object values: green */
#info .object-value {
    background: #d9f5df;
}

/* Image values: orange */
#info .image-value {
    background: #fff0cc;
}

/* Subscripts */
#info sub {
    font-size: 72%;
    vertical-align: sub;
    line-height: 0;
}

/* ===== MEDIUM SCREENS ===== */

@media (max-width: 900px) {
    #info .lens-panel {
        gap: 12px;
        padding: 10px 12px;
    }

    #info .panel-title {
        flex-basis: 190px;
        min-width: 160px;
    }

    #info .lens-row {
        grid-template-columns: 30px 75px 30px 75px;
        gap: 6px;
    }

    #info .lens-row input {
        font-size: 13px;
    }
}

/* ===== MOBILE SCREENS ===== */

@media (max-width: 650px) {
    #info {
        bottom: 8px;
        width: calc(100vw - 16px);
        max-width: none;
    }

    #info .lens-panel {
        flex-direction: column;
        flex-wrap: nowrap;
        align-items: stretch;

        gap: 10px;
        padding: 10px 12px;

        max-height: 42vh;
        overflow-y: auto;
        overflow-x: hidden;
    }

    #info .panel-title {
        flex: 0 0 auto;
        width: 100%;
        min-width: 0;
        max-width: none;
    }

    #info .lens-group {
        width: 100%;
        min-width: 0;
    }

    #info .lens-row {
        grid-template-columns:
            32px minmax(0,1fr)
            32px minmax(0,1fr);
        gap: 6px;
    }

    #info .lens-row input {
        height: 32px;
        font-size: 13px;
    }
}

<body>

<div id="info">
    <div class="lens-panel">

        <!-- TITLE AND INSTRUCTIONS -->
        <div class="panel-title">

            <h3>Concave Lens</h3>

            <div class="focal-length">
                Focal length: f = −20 cm
            </div>

            <div class="lens-instruction">
                Drag the object (pencil) to observe
                the formation of its virtual image.
            </div>

            <div class="sign-convention">
                Thin Lens — Gaussian Sign Convention
            </div>

        </div>

        <!-- OBJECT MEASUREMENTS -->
        <div class="lens-group">

            <div class="lens-group-title">
                Object
            </div>

            <div class="lens-row">

                <label for="do">
                    d<sub>o</sub> =
                </label>

                <input
                    type="text"
                    id="do"
                    class="object-value"
                    value="40 cm"
                    readonly
                >

                <label for="ho">
                    h<sub>o</sub> =
                </label>

                <input
                    type="text"
                    id="ho"
                    class="object-value"
                    value="9 cm"
                    readonly
                >

            </div>

        </div>

        <!-- IMAGE MEASUREMENTS -->
        <div class="lens-group">

            <div class="lens-group-title">
                Image
            </div>

            <div class="lens-row">

                <label for="di">
                    d<sub>i</sub> =
                </label>

                <input
                    type="text"
                    id="di"
                    class="image-value"
                    value="-13.3 cm"
                    readonly
                >

                <label for="hi">
                    h<sub>i</sub> =
                </label>

                <input
                    type="text"
                    id="hi"
                    class="image-value"
                    value="3 cm"
                    readonly
                >

            </div>

        </div>

    </div>
</div>

<div id="viewport"></div>

</body>
