		  var objloader = new OBJLoader();	
		  objloader.load('../models/table/table.obj',function ( object ) {

					  map: textureloader.load("../textures/granite_texture.jpg")

	function createFinger() {
	    return new Promise((resolve, reject) => {
	        const loader = new OBJLoader();
	        loader.load(
	            '../models/finger/finger.obj',
	            function (object) {
	                object.position.set(0, 17, -10);
	                object.scale.set(0.5, 0.5, 0.5);
	                object.rotation.x = -Math.PI / 6;
	
	                const skinMaterial = new THREE.MeshPhongMaterial({ 
	                    color: 0xD2A679,
	                    shininess: 30
	                });
	
	                object.traverse((child) => {
	                    if (child.isMesh) {
	                        child.material = skinMaterial;
	                    }
	                });
	
	                scene.add(object);
	                resolve(object); // Resolve the promise with the loaded object
	            },
	            undefined,
	            (error) => reject(error) // Handle load errors
	        );
	    });
	}

	function addText(t){
		fontloader.load("/api/program-assets/3jcn-phyc240-electrostatic-contact/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json",function(tex){

	function animate() {
	    requestAnimationFrame(animate);
	    controls.update();
	    renderer.render(scene, camera);
	}
	function onWindowResize() {
		camera.aspect = window.innerWidth / window.innerHeight;
		camera.updateProjectionMatrix();
		renderer.setSize( window.innerWidth, window.innerHeight );
	}
	function createWand(x, y, z, colo) {
	    // Create the disk for the charge producer
	    const geo = new THREE.CylinderGeometry(2, 2, 0.6, 32); 
	    var wand = new THREE.Mesh(geo, new THREE.MeshPhongMaterial({color: colo}));    
	    
	    // Rotate the disk 90 degrees around the x-axis to make it vertical
	    wand.rotation.x = Math.PI / 2;
	    
	    // Create the handle
	    const geot = new THREE.CylinderGeometry(0.3, 0.3, 15, 32); 
	    var handle = new THREE.Mesh(geot, new THREE.MeshPhongMaterial({color: "white"}));    
	    handle.rotation.x = Math.PI/2;
	    wand.add(handle);
	    handle.position.z = -9; // Keeps the handle vertical
	    
	    // Set the position of the entire wand in the scene
	    wand.position.set(x, y, z);
	    
	    // Add the wand to the scene
	    scene.add(wand);
	    return wand;
	}
