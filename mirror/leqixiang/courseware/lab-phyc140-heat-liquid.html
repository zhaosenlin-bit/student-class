<body>
	<div id="info" style="text-align: left"> 
		<h1 style="text-align: center">Heat Transfer in Liquid</h1>
		
 <!-- Left Panel -->  
	    <div class="control-panel">
		
		<div class="control-group">
		  Cold Liquid:
		  <div class="slider-row">
		    <select id="liquidSelector">
		      <option value="2.44">Ethanol</option>
		      <option value="4.0">Vinegar</option>
		      <option value="4.184" selected>Water</option>
		      <option value="2.14">Coconut Oil</option>
		    </select>
		  </div>
		</div>		
		    
		<div class="control-group">
		  Mass (g):
		  <div class="slider-row" style="display: flex; align-items: center;">
		    <input type="range" id="massSlider" min="1000" max="2000" step="10" value="1500" style="flex: 1; margin-right: 8px;">
		    <input type="text" id="massValue" value="1500" readonly style="width: 80px; text-align: center; color: blue; font-weight: bold;">
		  </div>
		  <div class="minmax" style="display: flex; justify-content: space-between; margin-top: 4px;">
		    <span>1000</span>
		    <span>2000</span>
		  </div>
		</div>
		    
		  <div class="control-group">
		    Temperature (°C):
		    <div class="slider-row">
		      <input type="range" id="tempSlider" min="20" max="50" step="1" value="20">
		      <input type="text" id="tempValue" value="20" readonly>
		    </div>
		    <div class="minmax">
		      <span>20</span>
		      <span>50</span>
		    </div>
		  </div>
		 <button class="btn btn-danger" id="start">Start</button>
		    
		  <div class="control-group">
		    Final Temp:
		    <input type="text" id="finalTemp" value="0.0°" readonly style="width: 90px;">
		  </div>

		<button class="btn btn-warning" onclick="alert('When mixing two liquids at different temperatures (no heat loss), the final temperature is calculated using conservation of energy:\n\nm₁·c₁·(T₁ - T_f) = m₂·c₂·(T_f - T₂)\n\nSolving for T_f:\n\nT_f = (m₁·c₁·T₁ + m₂·c₂·T₂) / (m₁·c₁ + m₂·c₂)\n\nwhere:\n- m₁, m₂: masses of hot and cold liquids (g)\n- c₁, c₂: specific heat capacities (J/g·°C)\n- T₁, T₂: initial temperatures (°C)\n- T_f: final temperature (°C)\n\nSpecific heat values used:\n- Water: 4.184 J/g·°C\n- Ethanol: 2.44 J/g·°C\n- Vinegar: 4.00 J/g·°C\n- Coconut Oil: 2.14 J/g·°C')">
		    What is Mixing Liquid?
		</button><br>
		<button class="btn btn-success" id="reset">Reset</button>
		
	
	</div>
	</div>
	<div id="viewport"></div>
</body>
</html>
