<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>小蝌蚪找妈妈 · 推理剧场</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', Roboto, system-ui, sans-serif;
            background: #eaf7e1;
            /* 浅色明亮基底，自然绿意 */
        }

        /* ── 浅色明亮 + 自然绿色系 ── */
        :root {
            --bg-deep: #d9e9d0;
            --bg-panel: #f2f9ee;
            --bg-panel-alt: #e4f0dc;
            --border: #b8d4a8;
            --text: #1e3a2f;
            --text-dim: #4d6b57;
            --accent: #2b7a4b;
            --accent2: #e68a2e;
            --accent3: #4caf50;
            --accent4: #f5c542;
            --danger: #c44536;
            --panel-width: 280px;
            --header-h: 48px;
            --transition: 0.3s cubic-bezier(.4, 0, .2, 1);
            --radius: 14px;
            --shadow: 0 4px 12px rgba(0, 20, 10, 0.08);
        }

        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg-deep);
        }

        #mobile-header {
            display: none;
        }

        #main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* ── 左栏 ── */
        #left-panel {
            width: var(--panel-width);
            min-width: var(--panel-width);
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding-bottom: 12px;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.02);
        }

        .panel-section {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }
        .panel-section:last-child {
            border-bottom: none;
        }
        .panel-section h3 {
            font-size: 14px;
            color: var(--accent);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .panel-section h3::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 16px;
            background: var(--accent);
            border-radius: 3px;
        }

        /* 步骤条 */
        .step-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 6px 0 4px;
        }
        .step-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            background: transparent;
            font-size: 13px;
            color: var(--text-dim);
            transition: 0.2s;
            border-left: 3px solid transparent;
        }
        .step-item .step-num {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--bg-panel-alt);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            color: var(--text-dim);
            flex-shrink: 0;
        }
        .step-item.active {
            background: var(--bg-panel-alt);
            border-left-color: var(--accent2);
            color: var(--text);
            font-weight: 500;
        }
        .step-item.active .step-num {
            background: var(--accent2);
            color: white;
        }
        .step-item.done .step-num {
            background: var(--accent3);
            color: white;
        }

        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-panel-alt);
            color: var(--text);
            transition: all 0.2s;
            white-space: nowrap;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn:hover {
            border-color: var(--accent);
            background: #dcecd2;
            color: var(--accent);
        }
        .btn.active {
            border-color: var(--accent2);
            color: var(--accent2);
            background: rgba(230, 138, 46, 0.12);
        }
        .btn.accent {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(43, 122, 75, 0.08);
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.6);
        }

        /* ── 中栏 ── */
        #center-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #dcecd2;
            /* 池塘基底 */
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .scene-canvas {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(ellipse at 30% 40%, #c6dfb8, #b3cf9e);
        }

        /* 场景卡片：动物 + 对话 */
        .scene-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(6px);
            border-radius: 32px;
            padding: 28px 36px;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 12px 40px rgba(30, 50, 30, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            transition: all 0.3s;
        }
        .scene-emoji {
            font-size: 72px;
            line-height: 1.2;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.05));
        }
        .scene-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin: 4px 0 2px;
        }
        .scene-desc {
            font-size: 16px;
            color: var(--text-dim);
            margin: 6px 0 10px;
            line-height: 1.5;
            padding: 0 8px;
        }
        .scene-bubble {
            background: rgba(255, 255, 240, 0.7);
            border-radius: 20px;
            padding: 14px 18px;
            font-size: 15px;
            color: #1e3a2f;
            border-left: 4px solid var(--accent2);
            margin: 10px 0 4px;
            text-align: left;
            line-height: 1.6;
            box-shadow: inset 0 1px 4px rgba(0, 0, 0, 0.02);
        }

        /* 浮层知识卡 (用于总结) */
        .info-card {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(242, 249, 238, 0.94);
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 16px 24px;
            max-width: 480px;
            color: var(--text);
            font-size: 14px;
            line-height: 1.6;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 6;
            text-align: center;
            backdrop-filter: blur(6px);
            box-shadow: var(--shadow);
        }
        .info-card.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* ── 右栏 ── */
        #right-panel {
            width: var(--panel-width);
            min-width: var(--panel-width);
            background: var(--bg-panel);
            border-left: 1px solid var(--border);
            overflow-y: auto;
            padding-bottom: 12px;
            box-shadow: -2px 0 8px rgba(0, 0, 0, 0.02);
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(60, 90, 60, 0.08);
        }
        .data-row .label {
            color: var(--text-dim);
            font-weight: 400;
        }
        .data-row .value {
            color: var(--text);
            font-weight: 600;
            text-align: right;
        }

        .ctrl-group {
            margin: 6px 0 2px;
        }
        .ctrl-group label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-dim);
            cursor: pointer;
            padding: 6px 0;
        }
        .ctrl-group label input[type="checkbox"] {
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .quiz-area {
            background: var(--bg-panel-alt);
            border-radius: 12px;
            padding: 12px 14px;
            margin-top: 8px;
        }
        .quiz-question {
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text);
        }
        .quiz-btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .quiz-btn {
            padding: 6px 20px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            border: 2px solid var(--border);
            background: white;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text);
        }
        .quiz-btn.yes {
            border-color: var(--accent3);
            color: var(--accent3);
        }
        .quiz-btn.yes:hover {
            background: var(--accent3);
            color: white;
        }
        .quiz-btn.no {
            border-color: var(--danger);
            color: var(--danger);
        }
        .quiz-btn.no:hover {
            background: var(--danger);
            color: white;
        }
        .quiz-feedback {
            margin-top: 10px;
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255, 255, 200, 0.4);
            min-height: 40px;
            color: var(--text);
            font-weight: 500;
        }

        /* ── 响应式 ── */
        @media (max-width: 900px) {
            #mobile-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 14px;
                height: var(--header-h);
                background: var(--bg-panel);
                border-bottom: 1px solid var(--border);
            }
            #mobile-header h1 {
                font-size: 17px;
                color: var(--text);
                font-weight: 600;
            }
            #mobile-header .btn {
                font-size: 13px;
                padding: 6px 14px;
            }
            #left-panel {
                position: fixed;
                left: 0;
                top: var(--header-h);
                bottom: 0;
                z-index: 50;
                margin-left: calc(-1 * var(--panel-width));
                transition: margin-left var(--transition);
                box-shadow: 4px 0 20px rgba(0, 0, 0, 0.08);
            }
            #left-panel.open {
                margin-left: 0;
            }
            #right-panel {
                position: fixed;
                right: 0;
                top: var(--header-h);
                bottom: 0;
                z-index: 50;
                margin-right: calc(-1 * var(--panel-width));
                transition: margin-right var(--transition);
                box-shadow: -4px 0 20px rgba(0, 0, 0, 0.08);
            }
            #right-panel.open {
                margin-right: 0;
            }
            .scene-card {
                padding: 20px 18px;
            }
            .scene-emoji {
                font-size: 56px;
            }
        }

        /* 小工具 */
        .mt-1 {
            margin-top: 6px;
        }
        .mb-1 {
            margin-bottom: 6px;
        }
        .flex {
            display: flex;
        }
        .gap-2 {
            gap: 8px;
        }
        .text-sm {
            font-size: 13px;
        }
        .rounded-full {
            border-radius: 999px;
        }
    </style>
</head>

    <div id="app">
        <!-- 移动端头 -->
        <header id="mobile-header">
            <button class="btn" id="btn-toggle-left">☰ 步骤</button>
            <h1>🐸 小蝌蚪找妈妈</h1>
            <button class="btn" id="btn-toggle-right">📋 信息</button>
        </header>

        <div id="main-layout">
            <!-- 左栏：剧情控制 -->
            <aside id="left-panel">
                <div class="panel-section">
                    <h3>🗺️ 剧情步骤</h3>
                    <div class="step-list" id="stepList">
                        <div class="step-item active" data-step="0"><span class="step-num">1</span> 出发！小蝌蚪</div>
                        <div class="step-item" data-step="1"><span class="step-num">2</span> 鸭妈妈</div>
                        <div class="step-item" data-step="2"><span class="step-num">3</span> 大鱼</div>
                        <div class="step-item" data-step="3"><span class="step-num">4</span> 乌龟</div>
                        <div class="step-item" data-step="4"><span class="step-num">5</span> 大白鹅</div>
                        <div class="step-item" data-step="5"><span class="step-num">6</span> 青蛙妈妈</div>
                    </div>
                    <div class="btn-row">
                        <button class="btn" id="prevBtn" disabled>⬅ 上一步</button>
                        <button class="btn accent" id="nextBtn">下一步 ➡</button>
                    </div>
                    <div style="margin-top:8px;font-size:12px;color:var(--text-dim);">
                        <span id="stepIndicator">第 1 / 6 步</span>
                    </div>
                </div>
                <div class="panel-section">
                    <h3>⚙️ 显示选项</h3>
                    <div class="ctrl-group">
                        <label><input type="checkbox" id="chkContrast" checked> 显示特征对比</label>
                        <label><input type="checkbox" id="chkQuiz" checked> 推理问答</label>
                    </div>
                </div>
            </aside>

            <!-- 中栏：场景视口 -->
            <main id="center-panel">
                <div class="scene-canvas" id="sceneCanvas">
                    <!-- 浮层知识卡 (总结时出现) -->
                    <div class="info-card" id="summaryCard">
                        <strong>🎉 恭喜你！</strong><br>
                        小蝌蚪通过对比特征：大眼睛、白肚皮、四条腿、绿衣裳，终于找到了妈妈！<br>
                        <span style="display:inline-block;margin-top:6px;font-size:13px;color:var(--accent);">✅ 变态发育：蝌蚪 → 青蛙</span>
                    </div>

                    <!-- 主场景卡片 -->
                    <div class="scene-card" id="sceneCard">
                        <div class="scene-emoji" id="sceneEmoji">🐸</div>
                        <div class="scene-title" id="sceneTitle">小蝌蚪出发了</div>
                        <div class="scene-desc" id="sceneDesc">在池塘里，小蝌蚪开始寻找妈妈……</div>
                        <div class="scene-bubble" id="sceneBubble">“我的妈妈长什么样呢？她有大眼睛、白肚皮、四条腿、绿衣裳！”</div>
                    </div>
                </div>
            </main>

            <!-- 右栏：信息面板 (特征对比 + 推理问答) -->
            <aside id="right-panel">
                <div class="panel-section" id="contrastSection">
                    <h3>📊 特征对比</h3>
                    <div id="contrastTable">
                        <div class="data-row"><span class="label">👀 大眼睛</span><span class="value" id="cEye">✓</span></div>
                        <div class="data-row"><span class="label">🟡 白肚皮</span><span class="value" id="cBelly">✓</span></div>
                        <div class="data-row"><span class="label">🦵 四条腿</span><span class="value" id="cLeg">✓</span></div>
                        <div class="data-row"><span class="label">🧤 绿衣裳</span><span class="value" id="cSkin">✓</span></div>
                        <div class="data-row" style="border-bottom:none;font-weight:600;color:var(--accent);"><span class="label">🎯 匹配度</span><span class="value" id="cMatch">4/4</span></div>
                    </div>
                </div>
                <div class="panel-section" id="quizSection">
                    <h3>🧠 推理问答</h3>
                    <div class="quiz-area">
                        <div class="quiz-question" id="quizQuestion">它是青蛙妈妈吗？</div>
                        <div class="quiz-btn-group">
                            <button class="quiz-btn yes" id="quizYes">✅ 是妈妈</button>
                            <button class="quiz-btn no" id="quizNo">❌ 不是</button>
                        </div>
                        <div class="quiz-feedback" id="quizFeedback">👆 点击按钮做出判断</div>
                    </div>
                </div>
                <div class="panel-section" style="border-bottom:none;">
                    <h3>📖 推理逻辑</h3>
                    <div style="font-size:13px;color:var(--text-dim);line-height:1.6;" id="logicHint">
                        小蝌蚪用特征匹配法：全部符合才是妈妈。
                    </div>
                </div>
            </aside>
        </div>
