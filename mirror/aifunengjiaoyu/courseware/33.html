<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文具盒包装方案 - 3D交互演示</title>
    <style>
        :root {
            --bg: #f5f0eb;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-secondary: #5a6c7d;
            --accent: #e8784a;
            --accent-light: #fce4d8;
            --blue: #4a90d9;
            --blue-light: #e8f2fb;
            --green: #3cb878;
            --green-light: #e6f7ef;
            --gold: #e8b84a;
            --gold-light: #fdf6e3;
            --purple: #8b5cf6;
            --purple-light: #f0ebfe;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 8px 40px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5f0eb 0%, #ede4d8 30%, #e8dfd3 60%, #f3efe8 100%);
            background-attachment: fixed;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            color: var(--text);
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* 主布局 */
        .app-container {
            display: flex;
            width: 100%;
            height: 100vh;
            position: relative;
        }

        /* 3D视图区 */
        .viewer-panel {
            flex: 1;
            position: relative;
            background: radial-gradient(ellipse at center, #fafaf8 0%, #e8e2d9 100%);
            cursor: grab;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .viewer-panel:active {
            cursor: grabbing;
        }
        .viewer-panel.dragging {
            cursor: grabbing;
        }
        #three-canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 视图提示 */
        .view-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            letter-spacing: 0.5px;
            pointer-events: none;
            transition: opacity 0.6s;
            z-index: 10;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .view-hint.fading {
            opacity: 0;
        }

        /* 浮动工具栏 */
        .toolbar-float {
            position: absolute;
            top: 16px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }
        .tool-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1.5px solid #ddd;
            background: rgba(255, 255, 255, 0.85);
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            color: #555;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .tool-btn:hover {
            background: #fff;
            border-color: #bbb;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
            color: #222;
        }
        .tool-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 14px rgba(232, 120, 74, 0.3);
        }
        .tool-btn svg {
            width: 16px;
            height: 16px;
            pointer-events: none;
        }

        /* 侧边栏 */
        .sidebar {
            width: 420px;
            height: 100vh;
            background: var(--card-bg);
            box-shadow: var(--shadow-lg);
            z-index: 20;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            border-left: 1px solid #e8e3db;
            scroll-behavior: smooth;
        }
        .sidebar::-webkit-scrollbar {
            width: 5px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: #d5cfc6;
            border-radius: 10px;
        }
        .sidebar::-webkit-scrollbar-track {
            background: transparent;
        }

        /* 侧边栏头部 */
        .sidebar-header {
            padding: 20px 24px 14px;
            border-bottom: 1px solid #f0ebe2;
            position: sticky;
            top: 0;
            background: #fff;
            z-index: 5;
            border-radius: 0 0 0 0;
        }
        .sidebar-header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        .sidebar-header .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }
        .spec-badge {
            display: inline-block;
            background: var(--accent-light);
            color: var(--accent);
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 14px;
            font-size: 12px;
            margin-top: 6px;
            letter-spacing: 0.4px;
        }

        /* 方案分类 */
        .category-section {
            padding: 14px 20px 8px;
        }
        .category-label {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .category-label .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-cat1 {
            background: #e8784a;
        }
        .dot-cat2 {
            background: #4a90d9;
        }
        .dot-cat3 {
            background: #3cb878;
        }
        .dot-cat4 {
            background: #8b5cf6;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 20px 6px;
        }
        .scheme-btn {
            flex: 0 0 auto;
            padding: 9px 15px;
            border-radius: 22px;
            border: 2px solid #e8e3db;
            background: #fdfcf9;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
            letter-spacing: 0.3px;
            transition: var(--transition);
            color: #4a4a4a;
            white-space: nowrap;
            position: relative;
            font-family: inherit;
        }
        .scheme-btn:hover {
            border-color: #c9bfb2;
            background: #faf7f2;
            transform: translateY(-1px);
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
        }
        .scheme-btn:active {
            transform: scale(0.96);
            transition: 0.1s;
        }
        .scheme-btn.active {
            border-color: var(--accent);
            background: #fff6f0;
            color: #c0392b;
            font-weight: 700;
            box-shadow: 0 2px 16px rgba(232, 120, 74, 0.18);
            animation: pulse-active 2s ease-in-out infinite;
        }
        @keyframes pulse-active {
            0%,
            100% {
                box-shadow: 0 2px 16px rgba(232, 120, 74, 0.18);
            }
            50% {
                box-shadow: 0 4px 24px rgba(232, 120, 74, 0.3);
            }
        }
        .scheme-btn.best {
            border-color: #e8b84a;
            background: #fffef8;
        }
        .scheme-btn.best::after {
            content: '⭐';
            position: absolute;
            top: -8px;
            right: -6px;
            font-size: 14px;
            animation: star-bounce 1.5s ease-in-out infinite;
        }
        @keyframes star-bounce {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-6px);
            }
        }
        .scheme-btn.active.best {
            border-color: #e8b84a;
            background: #fffef5;
            color: #b8860b;
            box-shadow: 0 2px 20px rgba(232, 184, 74, 0.3);
        }

        /* 信息面板 */
        .info-panel {
            margin: 10px 20px 16px;
            padding: 16px 18px;
            background: #fdfcf8;
            border-radius: var(--radius-sm);
            border: 1.5px solid #ede7de;
            transition: var(--transition);
        }
        .info-panel.highlight-best {
            border-color: #e8b84a;
            background: #fffef6;
            box-shadow: 0 2px 20px rgba(232, 184, 74, 0.2);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            font-size: 13.5px;
            letter-spacing: 0.3px;
        }
        .info-row .label {
            color: var(--text-secondary);
            font-weight: 500;
        }
        .info-row .value {
            font-weight: 700;
            color: #1a1a1a;
            font-size: 14px;
        }
        .info-row .value.surface-area {
            font-size: 18px;
            color: var(--accent);
        }
        .info-row .value.best-tag {
            color: #b8860b;
            background: #fef9e7;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            animation: glow-tag 2s ease-in-out infinite;
        }
        @keyframes glow-tag {
            0%,
            100% {
                box-shadow: 0 0 0 rgba(232, 184, 74, 0);
            }
            50% {
                box-shadow: 0 0 16px rgba(232, 184, 74, 0.5);
            }
        }
        .divider {
            border: none;
            border-top: 1px dashed #e5ded4;
            margin: 6px 0;
        }

        /* 图例 */
        .legend-mini {
            display: flex;
            gap: 14px;
            padding: 4px 0;
            font-size: 11px;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        .legend-mini span {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            display: inline-block;
        }
        .legend-dot.box-color {
            background: #f0a880;
        }
        .legend-dot.wrap-color {
            background: rgba(100, 160, 220, 0.5);
            border: 1px solid #6aade0;
        }

        /* 响应式 */
        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
            }
            .viewer-panel {
                height: 50vh;
                flex: none;
            }
            .sidebar {
                width: 100%;
                height: 50vh;
                flex: none;
                border-left: none;
                border-top: 1px solid #e8e3db;
                border-radius: 20px 20px 0 0;
                box-shadow: 0 -4px 24px rgba(0, 0, 0, 0.08);
            }
            .sidebar-header h1 {
                font-size: 19px;
            }
            .scheme-btn {
                font-size: 12px;
                padding: 7px 12px;
                border-radius: 18px;
            }
            .btn-group {
                gap: 5px;
                padding: 0 14px 4px;
            }
            .category-section {
                padding: 10px 14px 4px;
            }
            .info-panel {
                margin: 8px 14px 12px;
                padding: 12px 14px;
            }
        }
        @media (max-width: 500px) {
            .sidebar {
                width: 100%;
                height: 55vh;
            }
            .viewer-panel {
                height: 45vh;
            }
            .scheme-btn {
                font-size: 11px;
                padding: 6px 10px;
                border-radius: 15px;
                letter-spacing: 0;
            }
            .btn-group {
                gap: 4px;
                padding: 0 8px 3px;
            }
            .category-section {
                padding: 8px 8px 2px;
            }
            .sidebar-header {
                padding: 14px 16px 10px;
            }
            .info-panel {
                margin: 6px 10px 10px;
                padding: 10px 12px;
            }
            .info-row {
                font-size: 12px;
                padding: 4px 0;
            }
        }
    </style>
</head>

    <div class="app-container">
        <!-- 3D视图 -->
        <div class="viewer-panel" id="viewerPanel">
            <canvas id="three-canvas"></canvas>
            <div class="view-hint" id="viewHint">🖱️ 拖拽旋转 &nbsp;|&nbsp; 滚轮缩放 &nbsp;|&nbsp; 右键平移</div>
            <div class="toolbar-float">
                <button class="tool-btn active" id="btnAutoRotate" title="自动旋转" aria-label="自动旋转">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><path d="M12 2a10 10 0 0 1 0 20"/><polyline points="12 2 16 6 12 10"/></svg>
                </button>
                <button class="tool-btn" id="btnShowWrap" title="显示/隐藏包装外壳" aria-label="切换包装外壳">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="7" y="7" width="10" height="10" rx="1" stroke-dasharray="3 2"/></svg>
                </button>
                <button class="tool-btn" id="btnResetView" title="重置视角" aria-label="重置视角">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4"/></svg>
                </button>
                <button class="tool-btn" id="btnTopView" title="俯视图" aria-label="俯视图">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="4" width="16" height="16" rx="1"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                </button>
            </div>
        </div>

        <!-- 侧边栏 -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1>📦 文具盒包装方案</h1>
                <p class="subtitle">8个文具盒 · 探索最优包装方式</p>
                <span class="spec-badge">📐 文具盒规格：16×8×4 cm</span>
            </div>

            <!-- 分类1：1个面向上 -->
            <div class="category-section">
                <span class="category-label"><span class="dot dot-cat1"></span> 第一类：1个面向上（8层叠放）</span>
            </div>
            <div class="btn-group" id="btnGroup1">
                <button class="scheme-btn" data-scheme="0">方案1 · 大面朝上</button>
                <button class="scheme-btn" data-scheme="1">方案2 · 中面朝上</button>
                <button class="scheme-btn" data-scheme="2">方案3 · 小面朝上</button>
            </div>

            <!-- 分类2：2个面向上 -->
            <div class="category-section">
                <span class="category-label"><span class="dot dot-cat2"></span> 第二类：2个面向上（2并排·4层）</span>
            </div>
            <div class="btn-group" id="btnGroup2">
                <button class="scheme-btn" data-scheme="3">方案4 · 沿长边并排</button>
                <button class="scheme-btn best" data-scheme="4">方案5 · 沿短边并排 ⭐</button>
                <button class="scheme-btn" data-scheme="5">方案6 · 中面朝上并排</button>
            </div>

            <!-- 分类3：4个面向上 -->
            <div class="category-section">
                <span class="category-label"><span class="dot dot-cat3"></span> 第三类：4个面向上（2×2排列·2层）</span>
            </div>
            <div class="btn-group" id="btnGroup3">
                <button class="scheme-btn" data-scheme="6">方案7 · 大面朝上</button>
                <button class="scheme-btn" data-scheme="7">方案8 · 中面朝上</button>
            </div>

            <!-- 分类4：8个面向上 -->
            <div class="category-section">
                <span class="category-label"><span class="dot dot-cat4"></span> 第四类：8个面向上（单层平铺）</span>
            </div>
            <div class="btn-group" id="btnGroup4">
                <button class="scheme-btn" data-scheme="8">方案9 · 一排8个</button>
                <button class="scheme-btn" data-scheme="9">方案10 · 4×2排列</button>
            </div>

            <!-- 信息面板 -->
            <div class="info-panel" id="infoPanel">
                <div class="info-row">
                    <span class="label">📐 包装尺寸</span>
                    <span class="value" id="infoSize">--</span>
                </div>
                <div class="info-row">
                    <span class="label">📏 表面积</span>
                    <span class="value surface-area" id="infoSurface">--</span>
                </div>
                <hr class="divider">
                <div class="info-row">
                    <span class="label">🏆 是否为最优方案</span>
                    <span class="value" id="infoBest">--</span>
                </div>
                <div class="legend-mini">
                    <span><span class="legend-dot box-color"></span> 文具盒</span>
                    <span><span class="legend-dot wrap-color"></span> 包装纸外壳</span>
                </div>
            </div>
        </div>
    </div>
