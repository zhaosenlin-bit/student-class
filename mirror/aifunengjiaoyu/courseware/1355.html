<script type="module">
import * as THREE from 'three';

/* ============ 基础场景 ============ */
const app = document.getElementById('app');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0f1420);

const VIEW = 8;
let aspect = app.clientWidth / app.clientHeight;
const camera = new THREE.OrthographicCamera(-VIEW * aspect, VIEW * aspect, VIEW, -VIEW, 0.1, 100);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(app.clientWidth, app.clientHeight);
app.appendChild(renderer.domElement);

/* ============ 网格与坐标轴 ============ */
const gridGroup = new THREE.Group();
scene.add(gridGroup);

function makeLine(points, color, opacity) {
  const geo = new THREE.BufferGeometry().setFromPoints(points);
  const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
  return new THREE.Line(geo, mat);
}

let gridLines = [];
function rebuildGrid() {
  gridLines.forEach(l => {
    gridGroup.remove(l);
    if (l.geometry) l.geometry.dispose();
    if (l.material) {
      if (l.material.map) l.material.map.dispose();
      l.material.dispose();
    }
  });
  gridLines = [];
  const xMin = -VIEW * aspect, xMax = VIEW * aspect, yMin = -VIEW, yMax = VIEW;
  for (let x = Math.ceil(xMin); x <= Math.floor(xMax); x++) {
    const l = makeLine([new THREE.Vector3(x, yMin, 0), new THREE.Vector3(x, yMax, 0)], 0x2a3a52, 0.55);
    gridGroup.add(l); gridLines.push(l);
  }
  for (let y = Math.ceil(yMin); y <= Math.floor(yMax); y++) {
    const l = makeLine([new THREE.Vector3(xMin, y, 0), new THREE.Vector3(xMax, y, 0)], 0x2a3a52, 0.55);
    gridGroup.add(l); gridLines.push(l);
  }
  const ax = makeLine([new THREE.Vector3(xMin, 0, 0), new THREE.Vector3(xMax, 0, 0)], 0x6f8fb0, 0.95);
  const ay = makeLine([new THREE.Vector3(0, yMin, 0), new THREE.Vector3(0, yMax, 0)], 0x6f8fb0, 0.95);
  gridGroup.add(ax); gridGroup.add(ay); gridLines.push(ax, ay);

  for (let x = Math.ceil(xMin); x <= Math.floor(xMax); x++) {
    if (x === 0) continue;
    if (Math.abs(x) > 10) continue;
    const sp = makeLabel(String(x), 0x7f9bb8, 0.82);
    sp.position.set(x, -0.32, 0);
    sp.scale.set(0.42, 0.42, 1);
    gridGroup.add(sp); gridLines.push(sp);
  }
  for (let y = Math.ceil(yMin); y <= Math.floor(yMax); y++) {
    if (y === 0) continue;
    if (Math.abs(y) > 10) continue;
    const sp = makeLabel(String(y), 0x7f9bb8, 0.82);
    sp.position.set(-0.34, y, 0);
    sp.scale.set(0.42, 0.42, 1);
    gridGroup.add(sp); gridLines.push(sp);
  }
  const ox = makeLabel('O', 0x9db8d4, 0.9);
  ox.position.set(-0.3, -0.3, 0); ox.scale.set(0.42, 0.42, 1);
  gridGroup.add(ox); gridLines.push(ox);
}

function makeLabel(text, color, opacity) {
  const c = document.createElement('canvas');
  const s = 128;
  c.width = s; c.height = s;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, s, s);
  ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
  ctx.globalAlpha = opacity;
  ctx.font = 'bold 74px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, s / 2, s / 2);
  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  return new THREE.Sprite(mat);
}

function makeWideLabel(text, color, opacity, fontSize) {
  const pad = 16;
  const fs = fontSize || 46;
  const measureCanvas = document.createElement('canvas');
  const mctx = measureCanvas.getContext('2d');
  mctx.font = 'bold ' + fs + 'px "Microsoft YaHei", sans-serif';
  const textW = Math.ceil(mctx.measureText(text).width);
  const w = Math.max(64, textW + pad * 2);
  const h = Math.ceil(fs * 1.6);

  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  ctx.fillStyle = '#' + color.toString(16).padStart(6, '0');
  ctx.globalAlpha = opacity;
  ctx.font = 'bold ' + fs + 'px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, w / 2, h / 2);

  const tex = new THREE.CanvasTexture(c);
  tex.minFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
  const sp = new THREE.Sprite(mat);
  const worldH = 0.55;
  const worldW = worldH * (w / h);
  sp.scale.set(worldW, worldH, 1);
  return sp;
}

/* ============ 双曲线 ============ */
const hyperGroup = new THREE.Group();
scene.add(hyperGroup);

function buildHyperCurves(a, b, focusAxis) {
  while (hyperGroup.children.length) {
    const o = hyperGroup.children.pop();
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (o.material.map) o.material.map.dispose();
      o.material.dispose();
    }
  }
  const tMax = 3.2;
  const N = 400;

  function branch(sign) {
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const t = -tMax + (2 * tMax) * i / N;
      let x, y;
      if (focusAxis === 'x') {
        x = sign * a * Math.cosh(t);
        y = b * Math.sinh(t);
      } else {
        y = sign * a * Math.cosh(t);
        x = b * Math.sinh(t);
      }
      if (Math.abs(x) > 60 || Math.abs(y) > 60) continue;
      pts.push(new THREE.Vector3(x, y, 0));
    }
    return pts;
  }

  const matL = new THREE.LineBasicMaterial({ color: 0xff8a5c, transparent: true, opacity: 0.95 });
  const matR = new THREE.LineBasicMaterial({ color: 0xff8a5c, transparent: true, opacity: 0.95 });
  const gL = new THREE.BufferGeometry().setFromPoints(branch(-1));
  const gR = new THREE.BufferGeometry().setFromPoints(branch(1));
  hyperGroup.add(new THREE.Line(gL, matL));
  hyperGroup.add(new THREE.Line(gR, matR));

  const L = 40;
  const slope = focusAxis === 'x' ? b / a : a / b;
  const asymPts1 = [new THREE.Vector3(-L, -slope * L, 0), new THREE.Vector3(L, slope * L, 0)];
  const asymPts2 = [new THREE.Vector3(-L, slope * L, 0), new THREE.Vector3(L, -slope * L, 0)];
  const am = new THREE.LineDashedMaterial({ color: 0x5f7fa8, transparent: true, opacity: 0.55, dashSize: 0.22, gapSize: 0.16 });
  const l1 = new THREE.Line(new THREE.BufferGeometry().setFromPoints(asymPts1), am);
  l1.computeLineDistances();
  const l2 = new THREE.Line(new THREE.BufferGeometry().setFromPoints(asymPts2), am);
  l2.computeLineDistances();
  l1.name = 'asym'; l2.name = 'asym';
  hyperGroup.add(l1); hyperGroup.add(l2);

  const verts = focusAxis === 'x' ? [[-a, 0], [a, 0]] : [[0, -a], [0, a]];
  verts.forEach(([vx, vy]) => {
    const dot = new THREE.Mesh(new THREE.CircleGeometry(0.075, 20), new THREE.MeshBasicMaterial({ color: 0xffb08a }));
    dot.position.set(vx, vy, 0);
    dot.name = 'vertex';
    hyperGroup.add(dot);
  });
}

  while (interGroup.children.length) {
    const o = interGroup.children.pop();
    if (o.geometry) o.geometry.dispose();

/* ============ 状态 ============ */
const state = {
  a: 2,
  b: 1.5,
  focusAxis: 'x',
  px: 0,
  py: 0,
  k: 0.8,
  m: 0,             // 截距（斜率式）
  vertical: false,  // 是否竖直直线
  vx: 0,            // 竖直直线 x = vx
  showAsym: true,
  showInter: true,
  showCoord: true,
  showProd: true,
  showText: true,
  auto: false,
  autoSpeed: 1.0,
  sweepVertical: false,
  angle: 0,
};

/* ============ 数学计算 ============ */
/*
  直线统一为 y = kx + m（斜率式）或 x = vx（竖直式）。
  双曲线：
    焦点在 x 轴：x²/a² − y²/b² = 1  →  b²x² − a²y² = a²b²
    焦点在 y 轴：y²/a² − x²/b² = 1  →  b²y² − a²x² = a²b²
*/
function getQuadCoeffs() {
  const { a, b, k, m, focusAxis } = state;
  const a2 = a * a, b2 = b * b;
  if (focusAxis === 'x') {
    const A = b2 - a2 * k * k;
    const B = -2 * a2 * k * m;
    const C = -a2 * m * m - a2 * b2;
    return { A, B, C, m };
  } else {
    const A = b2 * k * k - a2;
    const B = 2 * b2 * k * m;
    const C = b2 * m * m - a2 * b2;
    return { A, B, C, m };
  }
}

function computeIntersections() {
  const { a, b, k, m, vertical, vx, focusAxis } = state;
  const a2 = a * a, b2 = b * b;

  /* 竖直直线 x = vx */
  if (vertical) {
    const x = vx;
    let val;
    if (focusAxis === 'x') {
      val = (x * x) / a2 - 1;
    } else {
      val = 1 + (x * x) / b2;
    }
    if (val > 1e-9) {
      const y = Math.sqrt((focusAxis === 'x' ? b2 : a2) * val);
      return { type: 'vertical', pts: [{ x, y }, { x, y: -y }], delta: null };
    } else if (Math.abs(val) <= 1e-9) {
      return { type: 'vertical', pts: [{ x, y: 0 }], delta: null };
    } else {
      return { type: 'vertical', pts: [], delta: null };
    }
  }

  const { A, B, C } = getQuadCoeffs();
  let delta = B * B - 4 * A * C;
  const pts = [];

  if (Math.abs(A) < 1e-9) {
    if (Math.abs(B) < 1e-9) {
      return { type: 'linear', pts: [], delta: 0 };
    }
    const x = -C / B;
    const y = k * x + m;
    pts.push({ x, y });
    return { type: 'linear', pts, delta: 0 };
  }

  if (delta > 1e-9) {
    const sq = Math.sqrt(delta);
    const x1 = (-B + sq) / (2 * A);
    const x2 = (-B - sq) / (2 * A);
    pts.push({ x: x1, y: k * x1 + m });
    pts.push({ x: x2, y: k * x2 + m });
  } else if (Math.abs(delta) <= 1e-9) {
    const x = -B / (2 * A);
    pts.push({ x, y: k * x + m });
    delta = 0;
  }
  return { type: 'quad', pts, delta };
}

/* ============ 渲染更新 ============ */
function updateAll() {
  const { a, b, px, py, k, m, vertical, vx, focusAxis } = state;

  buildHyperCurves(a, b, focusAxis);
  hyperGroup.children.forEach(o => {
    if (o.name === 'asym') o.visible = state.showAsym;
  });

  const L = 40;
  let p1, p2;
  if (vertical) {
    p1 = new THREE.Vector3(vx, -L, 0);
    p2 = new THREE.Vector3(vx, L, 0);
  } else {
    p1 = new THREE.Vector3(-L, k * (-L) + m, 0);
    p2 = new THREE.Vector3(L, k * L + m, 0);
  }
  lineObj.geometry.dispose();
  lineObj.geometry = new THREE.BufferGeometry().setFromPoints([p1, p2]);

  pointP.position.set(px, py, 0);
  const pring = lineGroup.getObjectByName('Pring');
  if (pring) pring.position.set(px, py, 0);

  // 手柄：位于直线上，距 P 一定距离
  const R = 2.2;
  let hx, hy;
  if (vertical) {
    hx = vx; hy = py + R;
  } else {
    const len = Math.sqrt(1 + k * k);
    hx = px + R / len;
    hy = py + k * R / len;
  }
  handleObj.position.set(hx, hy, 0);
  const hring = lineGroup.getObjectByName('hring');
  if (hring) hring.position.set(hx, hy, 0);

  clearIntersections();
  const res = computeIntersections();

  if (state.showInter) {
    res.pts.forEach((p) => {
      const dot = new THREE.Mesh(
        new THREE.CircleGeometry(0.11, 24),
        new THREE.MeshBasicMaterial({ color: 0xffe066 })
      );
      dot.position.set(p.x, p.y, 0);
      interGroup.add(dot);
      const ring = new THREE.Mesh(
        new THREE.RingGeometry(0.16, 0.21, 32),
        new THREE.MeshBasicMaterial({ color: 0xffe066, transparent: true, opacity: 0.6, side: THREE.DoubleSide })
      );
      ring.position.set(p.x, p.y, 0);
      interGroup.add(ring);

      if (state.showCoord) {
        const labelText = `(${p.x.toFixed(2)}, ${p.y.toFixed(2)})`;
        const sp = makeWideLabel(labelText, 0xffe066, 0.95, 44);
        const offX = sp.scale.x / 2 + 0.28;
        const offY = 0.34;
        sp.position.set(p.x + offX, p.y + offY, 0);
        interGroup.add(sp);
      }
    });
  }

  updateInfoPanel(res);
}

function updateInfoPanel(res) {
  const deltaEl = document.getElementById('deltaVal');
  const cntEl = document.getElementById('cntVal');
  const conclEl = document.getElementById('conclVal');
  const prodVal = document.getElementById('prodVal');
  const sideVal = document.getElementById('sideVal');
  const prodRow = document.getElementById('prodRow');
  const sideRow = document.getElementById('sideRow');
  const box = document.getElementById('infoBox');

  const n = res.pts.length;
  cntEl.textContent = n + ' 个';

  if (res.type === 'vertical') {
    deltaEl.textContent = '—（竖直直线）';
  } else if (res.type === 'linear') {
    deltaEl.textContent = 'Δ = 0（A = 0，退化为一次）';
  } else {
    deltaEl.textContent = res.delta.toFixed(3);
  }

  let text = '';
  let warn = false;
  if (n === 2) {
    text = '相交（两个交点）';
  } else if (n === 1) {
    text = '相切（一个交点）';
  } else {
    text = '相离（无交点）';
    warn = true;
  }
  if (res.type === 'linear') {
    text = '平行于渐近线（一个交点）';
  }
  conclEl.textContent = text;
  conclEl.className = 'concl' + (warn ? ' warn' : '');

  if (state.showProd) {
    prodRow.style.display = '';
    sideRow.style.display = '';
    if (n === 2) {
      const x1 = res.pts[0].x, x2 = res.pts[1].x;
      const prod = x1 * x2;
      prodVal.textContent = prod.toFixed(3);
      if (prod > 1e-9) {
        sideVal.textContent = '同号 → 两交点在 y 轴同侧';
        sideVal.className = 'same';
      } else if (prod < -1e-9) {
        sideVal.textContent = '异号 → 两交点在 y 轴异侧';
        sideVal.className = 'diff';
      } else {
        sideVal.textContent = '乘积为 0 → 交点在 y 轴上';
        sideVal.className = 'same';
      }
    } else if (n === 1) {
      prodVal.textContent = '—（仅一个交点）';
      sideVal.textContent = '—';
      sideVal.className = '';
    } else {
      prodVal.textContent = '—（无交点）';
      sideVal.textContent = '—';
      sideVal.className = '';
    }
  } else {
    prodRow.style.display = 'none';
    sideRow.style.display = 'none';
  }

  box.style.visibility = state.showText ? 'visible' : 'hidden';
}

/* ============ 方程与渐近线斜率 ============ */
function updateEquationAndAsym() {
  const { a, b, focusAxis } = state;
  const a2 = (a * a).toFixed(2);
  const b2 = (b * b).toFixed(2);
  const eqEl = document.getElementById('eqVal');
  const asymEl = document.getElementById('asymVal');
  if (focusAxis === 'x') {
    eqEl.textContent = `x²/${a2} − y²/${b2} = 1`;
    asymEl.textContent = `±${(b / a).toFixed(3)}`;
  } else {
    eqEl.textContent = `y²/${a2} − x²/${b2} = 1`;
    asymEl.textContent = `±${(a / b).toFixed(3)}`;
  }
}

/* ============ 交互：拖动 ============ */
const raycaster = new THREE.Raycaster();
const mouseNDC = new THREE.Vector2();
let dragging = null;

function screenToWorld(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
  const ny = -(((clientY - rect.top) / rect.height) * 2 - 1);
  const w = VIEW * aspect, h = VIEW;
  return { x: nx * w, y: ny * h };
}

function pickAt(clientX, clientY) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouseNDC.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  mouseNDC.y = -(((clientY - rect.top) / rect.height) * 2 - 1);
  raycaster.setFromCamera(mouseNDC, camera);

  const targets = [];
  if (pointP) targets.push(pointP);
  if (handleObj) targets.push(handleObj);
  const hits = raycaster.intersectObjects(targets, false);
  if (hits.length) return hits[0].object.name;
  return null;
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  const hit = pickAt(e.clientX, e.clientY);
  if (hit === 'P') {
    dragging = 'P';
    renderer.domElement.style.cursor = 'grabbing';
    renderer.domElement.setPointerCapture(e.pointerId);
  } else if (hit === 'handle') {
    dragging = 'handle';
    renderer.domElement.style.cursor = 'grabbing';
    renderer.domElement.setPointerCapture(e.pointerId);
  }
});

renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) {
    const hit = pickAt(e.clientX, e.clientY);
    renderer.domElement.style.cursor = hit ? 'grab' : 'default';
    return;
  }
  const w = screenToWorld(e.clientX, e.clientY);

  if (dragging === 'P') {
    state.px = clamp(w.x, -5, 5);
    state.py = clamp(w.y, -5, 5);
    // 拖动 P 时，直线保持过 P：斜率式下 m 随 P 更新
    if (!state.vertical) {
      state.m = state.py - state.k * state.px;
    }
    syncSliders();
    updateAll();
  } else if (dragging === 'handle') {
    const dx = w.x - state.px;
    const dy = w.y - state.py;
    if (Math.abs(dx) < 0.12) {
      state.vertical = true;
      state.vx = state.px;
    } else {
      state.vertical = false;
      state.k = dy / dx;
      state.m = state.py - state.k * state.px;
    }
    syncSliders();
    updateAll();
  }
});

function endDrag(e) {
  if (dragging) {
    dragging = null;
    renderer.domElement.style.cursor = 'default';
    try { renderer.domElement.releasePointerCapture(e.pointerId); } catch (err) {}
  }
}
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function formatNumForInput(v) {
  if (!isFinite(v)) return '';
  const abs = Math.abs(v);
  if (abs !== 0 && (abs >= 1e6 || abs < 1e-4)) {
    return v.toExponential(4);
  }
  let s = v.toFixed(4);
  if (s.indexOf('.') >= 0) {
    s = s.replace(/0+$/, '').replace(/\.$/, '');
  }
  return s;
}

function syncSliders() {
  aRange.value = state.a;
  bRange.value = state.b;
  pxRange.value = state.px;
  pyRange.value = state.py;
  speedRange.value = state.autoSpeed;
  document.getElementById('aVal').textContent = state.a.toFixed(1);
  document.getElementById('bVal').textContent = state.b.toFixed(1);
  document.getElementById('pxVal').textContent = state.px.toFixed(1);
  document.getElementById('pyVal').textContent = state.py.toFixed(1);
  document.getElementById('speedVal').textContent = state.autoSpeed.toFixed(1) + '×';

  // 模式切换
  modeSlopeBtn.classList.toggle('active', !state.vertical);
  modeVerticalBtn.classList.toggle('active', state.vertical);
  slopeModeBox.style.display = state.vertical ? 'none' : '';
  verticalModeBox.style.display = state.vertical ? '' : 'none';

  // 斜率式
  kRange.value = clamp(state.k, -20, 20);
  mRange.value = clamp(state.m, -6, 6);
  document.getElementById('kVal').textContent = state.k.toFixed(2);
  document.getElementById('mVal').textContent = state.m.toFixed(2);
  if (document.activeElement !== kInput) kInput.value = formatNumForInput(state.k);
  if (document.activeElement !== mInput) mInput.value = formatNumForInput(state.m);

  // 竖直式
  vxRange.value = clamp(state.vx, -8, 8);
  document.getElementById('vxVal').textContent = state.vx.toFixed(2);
  if (document.activeElement !== vxInput) vxInput.value = formatNumForInput(state.vx);

  axisXBtn.classList.toggle('active', state.focusAxis === 'x');
  axisYBtn.classList.toggle('active', state.focusAxis === 'y');
}

kInput.addEventListener('input', () => {
  const raw = kInput.value.trim();

  if (document.activeElement !== mInput) mInput.value = formatNumForInput(state.m);
  mRange.value = clamp(state.m, -6, 6);
  document.getElementById('mVal').textContent = state.m.toFixed(2);
  updateAll();
});
kInput.addEventListener('blur', () => {
  const raw = kInput.value.trim();
  const v = parseFloat(raw);
  if (raw === '' || !isFinite(v)) {
    kInput.value = formatNumForInput(state.k);
    return;
  }
  state.k = v;
  state.m = state.py - state.k * state.px;
  syncSliders(); updateAll();
});
kInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); kInput.blur(); }
});

/* --- 斜率式：截距 m --- */
mRange.addEventListener('input', () => {
  state.m = parseFloat(mRange.value);
  // 保持过 P：由 m 反推 k（若 P 不在 y 轴上）
  if (Math.abs(state.px) > 1e-6) {
    state.k = (state.py - state.m) / state.px;
  }
  state.vertical = false;
  syncSliders(); updateAll();
});
mInput.addEventListener('input', () => {
  const raw = mInput.value.trim();
  if (raw === '' || raw === '-' || raw === '+' || raw === '.' || raw === '-.' || raw === '+.') return;
  const v = parseFloat(raw);
  if (!isFinite(v)) return;
  state.m = v;
  if (Math.abs(state.px) > 1e-6) {
    state.k = (state.py - state.m) / state.px;
  }
  state.vertical = false;
  mRange.value = clamp(v, -6, 6);
  document.getElementById('mVal').textContent = v.toFixed(2);
  if (document.activeElement !== kInput) kInput.value = formatNumForInput(state.k);
  kRange.value = clamp(state.k, -20, 20);
  document.getElementById('kVal').textContent = state.k.toFixed(2);
  updateAll();
});
mInput.addEventListener('blur', () => {
  const raw = mInput.value.trim();
  const v = parseFloat(raw);
  if (raw === '' || !isFinite(v)) {
    mInput.value = formatNumForInput(state.m);
    return;
  }
  state.m = v;
  if (Math.abs(state.px) > 1e-6) state.k = (state.py - state.m) / state.px;
  syncSliders(); updateAll();
});
mInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); mInput.blur(); }
});

/* --- 竖直式：x = a --- */
vxRange.addEventListener('input', () => {
  state.vx = parseFloat(vxRange.value);
  state.vertical = true;
  syncSliders(); updateAll();
});
vxInput.addEventListener('input', () => {
  const raw = vxInput.value.trim();
  if (raw === '' || raw === '-' || raw === '+' || raw === '.' || raw === '-.' || raw === '+.') return;
  const v = parseFloat(raw);
  if (!isFinite(v)) return;
  state.vx = v;
  state.vertical = true;
  vxRange.value = clamp(v, -8, 8);
  document.getElementById('vxVal').textContent = v.toFixed(2);
  updateAll();
});
vxInput.addEventListener('blur', () => {
  const raw = vxInput.value.trim();
  const v = parseFloat(raw);
  if (raw === '' || !isFinite(v)) {
    vxInput.value = formatNumForInput(state.vx);
    return;
  }
  state.vx = v;
  state.vertical = true;
  syncSliders(); updateAll();
});
vxInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); vxInput.blur(); }
});

/* --- 模式按钮 --- */
modeSlopeBtn.addEventListener('click', () => {
  if (!state.vertical) return;
  state.vertical = false;
  // 由当前竖直位置与 P 恢复一条斜率式直线（默认过 P 的水平线）
  state.k = 0;
  state.m = state.py;
  syncSliders(); updateAll();
});
modeVerticalBtn.addEventListener('click', () => {
  if (state.vertical) return;
  state.vertical = true;
  state.vx = state.px;
  syncSliders(); updateAll();
});

/* --- 其它控件 --- */
speedRange.addEventListener('input', () => {
  state.autoSpeed = parseFloat(speedRange.value);
  document.getElementById('speedVal').textContent = state.autoSpeed.toFixed(1) + '×';
});
sweepChk.addEventListener('change', () => { state.sweepVertical = sweepChk.checked; });
showAsymChk.addEventListener('change', () => { state.showAsym = showAsymChk.checked; updateAll(); });
showInterChk.addEventListener('change', () => { state.showInter = showInterChk.checked; updateAll(); });
showCoordChk.addEventListener('change', () => { state.showCoord = showCoordChk.checked; updateAll(); });
showProdChk.addEventListener('change', () => { state.showProd = showProdChk.checked; updateInfoPanel(computeIntersections()); });
showTextChk.addEventListener('change', () => { state.showText = showTextChk.checked; updateInfoPanel(computeIntersections()); });

axisXBtn.addEventListener('click', () => {
  if (state.focusAxis === 'x') return;
  state.focusAxis = 'x';
  syncSliders(); updateEquationAndAsym(); updateAll();
});
axisYBtn.addEventListener('click', () => {
  if (state.focusAxis === 'y') return;
  state.focusAxis = 'y';
  syncSliders(); updateEquationAndAsym(); updateAll();
});

autoBtn.addEventListener('click', () => {
  state.auto = !state.auto;
  autoBtn.textContent = state.auto ? '暂停旋转' : '自动旋转';
  autoBtn.classList.toggle('active', state.auto);
  if (state.auto) {
    if (state.vertical) {
      state.angle = Math.PI / 2;
    } else {
      state.angle = Math.atan2(state.k, 1);
    }
  }
});

resetBtn.addEventListener('click', () => {
  state.a = 2; state.b = 1.5;
  state.focusAxis = 'x';
  state.px = 0; state.py = 0;
  state.k = 0.8; state.m = 0; state.vertical = false; state.vx = 0;
  state.auto = false; state.autoSpeed = 1.0; state.sweepVertical = false;
  state.showAsym = true; state.showInter = true; state.showCoord = true;
  state.showProd = true; state.showText = true;
  autoBtn.textContent = '自动旋转';
  autoBtn.classList.remove('active');
  showAsymChk.checked = true; showInterChk.checked = true;
  showCoordChk.checked = true; showProdChk.checked = true; showTextChk.checked = true;
  sweepChk.checked = false;
  syncSliders(); updateEquationAndAsym(); updateAll();
});

/* ============ 折叠面板 ============ */
const panel = document.getElementById('panel');
const toggleBtn = document.getElementById('toggleBtn');
toggleBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  panel.classList.toggle('collapsed');
  toggleBtn.textContent = panel.classList.contains('collapsed') ? '展开' : '收起';
});

/* ============ 面板拖动 ============ */
const panelHead = document.getElementById('panelHead');
let panelDrag = null;
panelHead.addEventListener('pointerdown', (e) => {
  if (e.target === toggleBtn) return;
  const rect = panel.getBoundingClientRect();
  panelDrag = {
    offsetX: e.clientX - rect.left,
    offsetY: e.clientY - rect.top,
    w: rect.width,
    h: rect.height
  };
  panel.style.right = 'auto';
  panel.style.left = rect.left + 'px';
  panel.style.top = rect.top + 'px';
  panel.style.width = rect.width + 'px';
  panel.style.height = rect.height + 'px';
  panelHead.setPointerCapture(e.pointerId);
  e.preventDefault();
});
panelHead.addEventListener('pointermove', (e) => {
  if (!panelDrag) return;
  let left = e.clientX - panelDrag.offsetX;
  let top = e.clientY - panelDrag.offsetY;
  const maxLeft = window.innerWidth - 80;
  const maxTop = window.innerHeight - 42;
  left = clamp(left, -panelDrag.w + 80, maxLeft);
  top = clamp(top, 0, maxTop);
  panel.style.left = left + 'px';
  panel.style.top = top + 'px';
});
function endPanelDrag(e) {
  if (panelDrag) {
    panelDrag = null;
    try { panelHead.releasePointerCapture(e.pointerId); } catch (err) {}
  }
}
panelHead.addEventListener('pointerup', endPanelDrag);
panelHead.addEventListener('pointercancel', endPanelDrag);

/* ============ 面板缩放 ============ */
const resizeHandle = document.getElementById('resizeHandle');
let panelResize = null;
resizeHandle.addEventListener('pointerdown', (e) => {
  const rect = panel.getBoundingClientRect();
  panelResize = {
    startX: e.clientX,
    startY: e.clientY,
    w: rect.width,
    h: rect.height
  };
  resizeHandle.setPointerCapture(e.pointerId);
  e.preventDefault();
  e.stopPropagation();
});
resizeHandle.addEventListener('pointermove', (e) => {
  if (!panelResize) return;
  const dw = e.clientX - panelResize.startX;
  const dh = e.clientY - panelResize.startY;
  const newW = clamp(panelResize.w + dw, 240, window.innerWidth - 16);
  const newH = clamp(panelResize.h + dh, 120, window.innerHeight - 16);
  panel.style.width = newW + 'px';
  panel.style.height = newH + 'px';
});
function endPanelResize(e) {
  if (panelResize) {
    panelResize = null;
    try { resizeHandle.releasePointerCapture(e.pointerId); } catch (err) {}
  }
}
resizeHandle.addEventListener('pointerup', endPanelResize);
resizeHandle.addEventListener('pointercancel', endPanelResize);

/* ============ 自适应尺寸 ============ */
function onResize() {
  const w = app.clientWidth, h = app.clientHeight;
  aspect = w / h;
  renderer.setSize(w, h);
  camera.left = -VIEW * aspect;
  camera.right = VIEW * aspect;
  camera.top = VIEW;
  camera.bottom = -VIEW;
  camera.updateProjectionMatrix();
  rebuildGrid();
}
window.addEventListener('resize', onResize);

/* ============ 动画循环 ============ */
let lastT = performance.now();
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;

  if (state.auto) {
    const omega = 0.9 * state.autoSpeed;
    state.angle += omega * dt;
    state.angle = state.angle % (Math.PI * 2);
    if (state.angle < 0) state.angle += Math.PI * 2;

    if (state.sweepVertical) {
      const c = Math.cos(state.angle);
      const s = Math.sin(state.angle);
      if (Math.abs(c) < 0.035) {
        state.vertical = true;
        state.vx = state.px;
      } else {
        state.vertical = false;
        state.k = s / c;
        state.m = state.py - state.k * state.px;
      }
    } else {
      state.vertical = false;
      state.k = Math.tan(state.angle);
      state.m = state.py - state.k * state.px;
    }
    syncSliders();
    updateAll();
  }

  renderer.render(scene, camera);
}

/* ============ 初始化 ============ */
buildLineObjects();
rebuildGrid();
syncSliders();
updateEquationAndAsym();
updateAll();
requestAnimationFrame(animate);
</script>

})();
