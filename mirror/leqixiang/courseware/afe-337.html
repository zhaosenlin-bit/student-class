<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>玻意耳定律实验</title>
<style>
:root {
  --bg-start: #e3f0fa;
  --bg-mid: #d4e8f8;
  --bg-end: #c9e4f6;
  --glass-bg: rgba(255,255,255,0.55);
  --glass-bg-strong: rgba(255,255,255,0.72);
  --glass-border: rgba(255,255,255,0.7);
  --glass-shadow: 0 8px 32px rgba(30,60,100,0.10);
  --text-primary: #1a2a3a;
  --text-secondary: #3a5068;
  --text-dim: #607890;
  --accent: #2979ff;
  --accent-light: #5c9cff;
  --accent-dark: #1a5cd0;
  --danger: #e53935;
  --danger-light: #ff6f60;
  --success: #2e7d32;
  --warning: #f57c00;
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.28s cubic-bezier(0.4,0,0.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px}
body{
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;
  background:linear-gradient(160deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
  color:var(--text-primary);
  min-height:100vh;
  line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse at 25% 20%, rgba(120,180,240,0.18) 0%, transparent 50%),
    radial-gradient(ellipse at 75% 70%, rgba(100,160,220,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 50% 50%, rgba(160,200,240,0.08) 0%, transparent 60%);
}

/* ── App Shell ── */
.app{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:12px 18px 24px}

/* ── Header ── */
.header{
  text-align:center;padding:18px 22px 14px;
  background:var(--glass-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--glass-border);border-radius:var(--radius);
  box-shadow:var(--glass-shadow);margin-bottom:14px;
}
.header h1{
  font-size:1.65rem;font-weight:700;letter-spacing:.04em;
  background:linear-gradient(135deg,#1a5cd0,#2979ff,#3d8eff,#2979ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}
.header .subtitle{font-size:.85rem;color:var(--text-dim);margin-top:4px;letter-spacing:.02em}

/* ── Main Grid ── */
.main-grid{
  display:grid;grid-template-columns:1fr 420px;gap:14px;margin-bottom:14px;
}
@media(max-width:1100px){.main-grid{grid-template-columns:1fr 340px}}
@media(max-width:820px){.main-grid{grid-template-columns:1fr}}

/* ── Glass Card ── */
.glass-card{
  background:var(--glass-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--glass-border);border-radius:var(--radius);
  box-shadow:var(--glass-shadow);padding:16px;margin-bottom:12px;
}

/* ── Cylinder Section ── */
.cylinder-section{display:flex;flex-direction:column;align-items:center}
.cylinder-section canvas{display:block;width:100%;max-width:600px;height:auto;border-radius:var(--radius-sm)}

/* ── Controls ── */
.controls-row{
  display:flex;gap:14px;flex-wrap:wrap;align-items:center;justify-content:center;
  margin-top:12px;padding:14px 18px;
  background:var(--glass-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);border-radius:var(--radius-sm);
}
.slider-group{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:200px}
.slider-group label{font-weight:600;font-size:.88rem;color:var(--text-secondary);white-space:nowrap}
.slider-group input[type=range]{flex:1;accent-color:var(--accent);height:6px}
.slider-group .slider-val{
  min-width:52px;text-align:center;font-weight:700;font-size:.92rem;
  background:var(--glass-bg-strong);border-radius:8px;padding:3px 8px;
  border:1px solid var(--glass-border);
}
.btn{
  padding:9px 18px;border-radius:22px;border:1px solid var(--glass-border);
  background:var(--glass-bg-strong);color:var(--text-primary);cursor:pointer;
  font-size:.84rem;font-weight:600;transition:var(--transition);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  white-space:nowrap;letter-spacing:.02em;display:flex;align-items:center;gap:6px;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(41,121,255,0.18)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-light);box-shadow:0 4px 20px rgba(41,121,255,0.32)}
.btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.warning{background:var(--warning);color:#fff;border-color:var(--warning)}

/* ── Real-time Display ── */
.rt-display{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;
}
.rt-item{
  background:var(--glass-bg-strong);border:1px solid var(--glass-border);
  border-radius:var(--radius-sm);padding:8px 16px;text-align:center;min-width:90px;
}
.rt-item .rt-label{font-size:.75rem;color:var(--text-dim);margin-bottom:2px}
.rt-item .rt-value{font-size:1.15rem;font-weight:700;font-variant-numeric:tabular-nums;font-family:'Cascadia Code','Fira Code','Consolas',monospace}
.rt-item .rt-value.pv-ok{color:var(--success)}
.rt-item .rt-value.pv-err{color:var(--danger);animation:pulse 0.6s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:0.65}to{opacity:1}}

/* ── Graph Section ── */
.graph-tabs{display:flex;gap:6px;margin-bottom:10px}
.tab-btn{
  padding:7px 16px;border-radius:20px;border:1px solid var(--glass-border);
  background:var(--glass-bg);color:var(--text-secondary);cursor:pointer;
  font-size:.82rem;font-weight:600;transition:var(--transition)
}
.tab-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab-btn:hover:not(.active){border-color:var(--accent-light);color:var(--text-primary)}

.graph-card canvas{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;border-radius:var(--radius-sm)}

/* ── Data Table ── */
.data-table-wrap{max-height:240px;overflow-y:auto;border-radius:var(--radius-sm)}
.data-table-wrap table{width:100%;border-collapse:collapse;font-size:.84rem}
.data-table-wrap th{
  position:sticky;top:0;background:rgba(200,215,235,0.9);
  color:var(--text-primary);padding:8px 6px;text-align:center;font-weight:700;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.data-table-wrap td{padding:7px 6px;text-align:center;border-bottom:1px solid rgba(0,0,0,0.06)}
.data-table-wrap tr:hover td{background:rgba(41,121,255,0.06)}
.data-table-wrap .dev-ok{color:var(--success);font-weight:600}
.data-table-wrap .dev-warn{color:var(--danger);font-weight:600}

/* ── Mode Toggle ── */
.mode-toggle-row{
  display:flex;align-items:center;gap:10px;justify-content:center;
  padding:10px;margin-top:8px
}
.mode-toggle-row .mode-label{font-weight:600;font-size:.85rem;color:var(--text-secondary)}
.toggle-switch{position:relative;display:inline-block;width:52px;height:28px}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{
  position:absolute;cursor:pointer;inset:0;
  background:var(--success);border-radius:28px;
  transition:var(--transition);
  box-shadow:inset 0 2px 4px rgba(0,0,0,0.12);
}
.toggle-slider::before{
  content:'';position:absolute;height:22px;width:22px;left:3px;bottom:3px;
  background:#fff;border-radius:50%;transition:var(--transition);
  box-shadow:0 2px 6px rgba(0,0,0,0.18);
}
input:checked+.toggle-slider{background:var(--danger)}
input:checked+.toggle-slider::before{transform:translateX(24px)}

/* ── Info Banner ── */
.info-banner{
  display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:var(--radius-sm);
  font-size:.82rem;font-weight:600;margin-top:8px
}
.info-banner.normal{background:rgba(46,125,50,0.12);color:var(--success);border:1px solid rgba(46,125,50,0.25)}
.info-banner.error{background:rgba(229,57,53,0.10);color:var(--danger);border:1px solid rgba(229,57,53,0.25)}

/* ── Test Section ── */
.test-section{margin-top:14px}
.test-section h2{
  font-size:1.2rem;font-weight:700;color:var(--text-primary);margin-bottom:10px;
  padding-bottom:8px;border-bottom:2px solid var(--accent-light)
}
.test-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.test-grid{grid-template-columns:1fr}}
.quiz-card{
  background:var(--glass-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--glass-border);border-radius:var(--radius-sm);
  padding:14px;transition:var(--transition);
}
.quiz-card.correct{border-color:rgba(46,125,50,0.5);background:rgba(46,125,50,0.08)}
.quiz-card.wrong{border-color:rgba(229,57,53,0.5);background:rgba(229,57,53,0.06)}
.quiz-card .q-title{font-weight:700;font-size:.88rem;margin-bottom:8px;color:var(--text-primary)}
.quiz-card .q-options{display:flex;flex-direction:column;gap:5px}
.quiz-card .q-opt{
  padding:7px 12px;border-radius:8px;cursor:pointer;font-size:.83rem;
  border:1px solid rgba(0,0,0,0.08);background:rgba(255,255,255,0.4);
  transition:var(--transition);
}
.quiz-card .q-opt:hover{border-color:var(--accent-light);background:rgba(41,121,255,0.06)}
.quiz-card .q-opt.selected{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.quiz-card .q-opt.correct-answer{background:rgba(46,125,50,0.2);border-color:var(--success);font-weight:600}
.quiz-card .q-opt.wrong-answer{background:rgba(229,57,53,0.15);border-color:var(--danger)}
.quiz-card .q-feedback{font-size:.8rem;margin-top:6px;font-weight:600;display:none}
.quiz-card .q-feedback.show{display:block}
.quiz-card .q-feedback.correct-fb{color:var(--success)}
.quiz-card .q-feedback.wrong-fb{color:var(--danger)}
.test-actions{text-align:center;margin-top:14px}
.test-score{
  display:inline-block;padding:10px 24px;border-radius:22px;
  font-size:1rem;font-weight:700;margin-left:12px
}
.test-score.great{background:rgba(46,125,50,0.15);color:var(--success)}
.test-score.good{background:rgba(245,124,0,0.12);color:var(--warning)}
.test-score.poor{background:rgba(229,57,53,0.10);color:var(--danger)}
</style>
</head>

<div class="app">

  <!-- Header -->
  <div class="header">
    <h1>玻意耳定律实验</h1>
    <div class="subtitle">气体的等温变化 &middot; 一定质量气体在温度不变时，压强与体积成反比</div>
  </div>

  <!-- Main Grid -->
  <div class="main-grid">

    <!-- Left: Cylinder + Controls -->
    <div>
      <div class="glass-card cylinder-section">
        <canvas id="cylCanvas" width="600" height="480"></canvas>
        <div class="rt-display">
          <div class="rt-item">
            <div class="rt-label">体积 V (相对单位)</div>
            <div class="rt-value" id="rtV">20.0</div>
          </div>
          <div class="rt-item">
            <div class="rt-label">压强 P (kPa)</div>
            <div class="rt-value" id="rtP">100.0</div>
          </div>
          <div class="rt-item">
            <div class="rt-label">pV 值 (kPa&middot;单位)</div>
            <div class="rt-value pv-ok" id="rtPV">2000.0</div>
          </div>
          <div class="rt-item" id="rtTemp" style="display:none">
            <div class="rt-label">相对温度 T/T₀</div>
            <div class="rt-value" id="rtTVal">1.000</div>
          </div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls-row">
        <div class="slider-group">
          <label for="volSlider">体积 V</label>
          <input type="range" id="volSlider" min="3" max="35" value="20" step="0.1">
          <span class="slider-val" id="sliderVal">20.0</span>
        </div>
        <button class="btn primary" id="btnCollect" title="采集当前数据点">+ 采集数据</button>
        <button class="btn" id="btnReset">↺ 重置</button>
      </div>

      <!-- Mode toggle -->
      <div class="mode-toggle-row glass-card" style="margin-top:8px">
        <span class="mode-label">正常实验（等温）</span>
        <label class="toggle-switch">
          <input type="checkbox" id="toggleError">
          <span class="toggle-slider"></span>
        </label>
        <span class="mode-label">错误演示（快速压缩/升温）</span>
      </div>
      <div class="info-banner normal" id="infoBanner">
        ✓ 当前：等温条件满足，pV = 常数。缓慢移动活塞可保持恒温。
      </div>
    </div>

    <!-- Right: Graph + Data + Test -->
    <div>
      <div class="glass-card graph-card">
        <div class="graph-tabs">
          <button class="tab-btn active" data-graph="pv">P-V 图（双曲线）</button>
          <button class="tab-btn" data-graph="p1v">P-1/V 图（直线）</button>
        </div>
        <canvas id="graphCanvas" width="420" height="360"></canvas>
      </div>

      <div class="glass-card">
        <div style="font-weight:700;margin-bottom:8px;font-size:.92rem">实验数据记录表</div>
        <div class="data-table-wrap">
          <table>
            <thead>
              <tr>
                <th>序号</th><th>V</th><th>P (kPa)</th><th>pV</th><th>偏差(%)</th>
              </tr>
            </thead>
            <tbody id="dataBody">
              <tr><td colspan="5" style="color:var(--text-dim);padding:28px">点击"采集数据"按钮开始记录</td></tr>
            </tbody>
          </table>
        </div>
        <div style="font-size:.78rem;color:var(--text-dim);margin-top:6px;text-align:center">
          理论值：pV = 2000（等温条件下保持恒定）
        </div>
      </div>
    </div>
  </div>

  <!-- Knowledge Test -->
  <div class="glass-card test-section" id="testSection">
    <h2>知识检测</h2>
    <div class="test-grid" id="testGrid"></div>
    <div class="test-actions">
      <button class="btn primary" id="btnCheck">✓ 提交检测</button>
      <span class="test-score" id="testScore" style="display:none"></span>
    </div>
  </div>
