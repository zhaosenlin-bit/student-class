<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大富翁·骰子闯关</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial Black', 'Arial', sans-serif;
            font-weight: 900;
            background: #fef7e9;
            user-select: none;
        }
        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem 1.2rem;
            background: #fef7e9;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            z-index: 1;
        }
        .screen.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }

        /* 游戏主画面 */
        #gameScreen {
            background: #fef7e9;
            justify-content: flex-start;
            padding-top: 0.6rem;
        }
        .game-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0.3rem 0.2rem 0.3rem;
            flex-wrap: wrap;
            gap: 0.3rem;
        }
        .game-title {
            font-size: 1.6rem;
            color: #2b3a67;
            text-shadow: 3px 3px 0 #ffb347;
            letter-spacing: 1px;
        }
        .turn-indicator {
            background: #2b3a67;
            color: #fef7e9;
            padding: 0.4rem 1.2rem;
            border-radius: 60px;
            font-size: 1.1rem;
            box-shadow: 0 4px 0 #0f1a2e;
            text-shadow: 1px 1px 0 #0f1a2e;
        }
        .scoreboard {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            margin: 0.1rem 0 0.3rem 0;
        }
        .score-item {
            background: white;
            border-radius: 60px;
            padding: 0.2rem 1rem;
            box-shadow: 0 4px 0 #ccc;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            border: 2px solid #ddd;
            transition: transform 0.15s;
        }
        .score-item .team-color {
            display: inline-block;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid #333;
        }
        .score-item.active-team {
            border: 4px solid #ffb347;
            box-shadow: 0 0 0 2px #ffb347;
            transform: scale(1.03);
        }

        /* 棋盘 */
        .board-wrapper {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            background: #fff4dc;
            border-radius: 36px;
            padding: 0.6rem 0.5rem;
            box-shadow: inset 0 0 0 3px #ffe5b4, 0 8px 0 #d9c5a0;
        }
        .board-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0.4rem;
        }
        .cell {
            background: #e6f0e6;
            border-radius: 16px;
            padding: 0.4rem 0.1rem;
            text-align: center;
            font-size: 0.7rem;
            font-weight: 900;
            box-shadow: 0 4px 0 #b0c4b0;
            border: 2px solid #c8dcc8;
            transition: all 0.15s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 56px;
            color: #1e3a2e;
            text-shadow: 1px 1px 0 rgba(255,255,200,0.4);
            position: relative;
        }
        .cell .cell-label {
            font-size: 0.55rem;
            opacity: 0.8;
            background: rgba(255,255,240,0.7);
            padding: 0 4px;
            border-radius: 20px;
        }
        .cell .cell-points {
            font-size: 0.8rem;
            background: rgba(0,0,0,0.05);
            padding: 0 6px;
            border-radius: 30px;
            min-height: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .cell.easy { background: #b8e0b8; border-color: #7cb07c; box-shadow: 0 4px 0 #5f8f5f; }
        .cell.medium { background: #f7e07b; border-color: #e2c44a; box-shadow: 0 4px 0 #c7a832; }
        .cell.hard { background: #f9b5b5; border-color: #e07a7a; box-shadow: 0 4px 0 #c05a5a; }
        .cell.start { background: #b3d9ff; border-color: #6fa8dc; box-shadow: 0 4px 0 #4a7fa8; }

        .pawn {
            display: inline-block;
            font-size: 1.3rem;
            filter: drop-shadow(0 2px 2px rgba(0,0,0,0.3));
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .pawn.entering {
            animation: pawnEnter 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes pawnEnter {
            0% { transform: scale(0) rotate(-20deg); opacity: 0; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .cell.active-destination {
            animation: cellPulse 0.6s ease 2;
            box-shadow: 0 0 0 4px #ffb347, 0 4px 0 #b0c4b0;
        }
        @keyframes cellPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        /* 骰子区域 */
        .dice-area {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            margin: 0.4rem 0 0.2rem;
            width: 100%;
            max-width: 700px;
        }
        .dice-box {
            background: white;
            border-radius: 24px;
            padding: 0.2rem 1.2rem;
            box-shadow: 0 4px 0 #ccc;
            border: 3px solid #ddd;
            font-size: 2.8rem;
            line-height: 1.2;
            min-width: 80px;
            text-align: center;
            transition: transform 0.1s;
        }
        .dice-box.rolling {
            animation: diceShake 0.15s infinite alternate;
        }
        @keyframes diceShake {
            0% { transform: rotate(-6deg) scale(1.1); }
            100% { transform: rotate(6deg) scale(1.1); }
        }
        .btn {
            background: #2b3a67;
            border: none;
            border-radius: 60px;
            padding: 0.5rem 1.5rem;
            font-size: 1.1rem;
            font-weight: 900;
            color: white;
            box-shadow: 0 6px 0 #0f1a2e;
            cursor: pointer;
            transition: all 0.08s linear;
            text-shadow: 2px 2px 0 #0f1a2e;
            border: 2px solid #4a5f8a;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0f1a2e;
        }
        .btn:disabled {
            opacity: 0.4;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #0f1a2e;
            pointer-events: none;
        }
        .btn-secondary {
            background: #ffb347;
            box-shadow: 0 6px 0 #c7822a;
            border-color: #ffc66e;
            text-shadow: 2px 2px 0 #b06d1a;
        }
        .btn-success {
            background: #5cb85c;
            box-shadow: 0 6px 0 #3a7a3a;
            border-color: #7ccf7c;
            text-shadow: 2px 2px 0 #2a5a2a;
        }
        .btn-danger {
            background: #d9534f;
            box-shadow: 0 6px 0 #a03a3a;
            border-color: #e07a7a;
            text-shadow: 2px 2px 0 #7a2a2a;
        }
        .btn-roll {
            background: #f0ad4e;
            box-shadow: 0 6px 0 #c78a2a;
            border-color: #f5c06e;
            text-shadow: 2px 2px 0 #a06a1a;
            font-size: 1.4rem;
            padding: 0.5rem 2rem;
        }

        /* 开始画面——大富翁风格 */
        #startScreen {
            background: linear-gradient(145deg, #fef7e9 0%, #ffeac2 100%);
        }
        .rich-cover {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            background: rgba(255, 240, 210, 0.5);
            padding: 1.2rem 2rem 2rem 2rem;
            border-radius: 80px 20px 80px 20px;
            box-shadow: 0 12px 0 #d9c5a0, 0 0 0 6px #fff4dc;
            backdrop-filter: blur(1px);
        }
        .big-title {
            font-size: 4rem;
            color: #2b3a67;
            text-shadow: 6px 6px 0 #ffb347, 0 0 0 4px #fff4dc;
            letter-spacing: 2px;
            margin-bottom: 0.2rem;
            line-height: 1.1;
        }
        .big-title span {
            display: inline-block;
            transform: rotate(-2deg);
        }
        .sub-title {
            font-size: 1.4rem;
            color: #3f4e7a;
            text-shadow: 2px 2px 0 #ffe5b4;
            background: #fff4dc;
            padding: 0.2rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 4px 0 #d9c5a0;
        }
        .characters {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            font-size: 2.8rem;
            margin: 0.2rem 0 0.4rem 0;
            filter: drop-shadow(0 6px 2px rgba(0,0,0,0.2));
            flex-wrap: wrap;
        }
        .characters span {
            background: white;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 #b0a080, 0 0 0 3px #f0dbb0;
            transition: transform 0.2s;
            font-size: 2.6rem;
        }
        .characters span:hover {
            transform: scale(1.1) rotate(-5deg);
        }
        .teams-setup {
            display: flex;
            gap: 1.2rem;
            margin: 0.3rem 0 0.5rem 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .team-badge {
            background: white;
            padding: 0.3rem 1.2rem;
            border-radius: 60px;
            font-size: 1.4rem;
            box-shadow: 0 6px 0 #ddd;
            border: 3px solid #ccc;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        @media (max-width: 500px) {
            .board-grid { gap: 0.25rem; }
            .cell { min-height: 46px; font-size: 0.55rem; padding: 0.15rem 0; }
            .game-title { font-size: 1.2rem; }
            .turn-indicator { font-size: 0.85rem; }
            .big-title { font-size: 2.8rem; }
            .dice-box { font-size: 2.2rem; min-width: 60px; }
            .btn { font-size: 0.85rem; padding: 0.35rem 1rem; }
            .btn-roll { font-size: 1.2rem; padding: 0.4rem 1.4rem; }
            .characters span { width: 55px; height: 55px; font-size: 2rem; }
            .rich-cover { padding: 1rem 1.2rem; }
        }
    </style>
</head>

    <!-- 开始画面 · 大富翁封面 -->
    <div id="startScreen" class="screen active">
        <div class="rich-cover">
            <div class="big-title"><span>🎩</span> 大富翁 <span>🎲</span></div>
            <div class="characters">
                <span>🕵️</span>
                <span>👩‍💼</span>
                <span>🧑‍🌾</span>
                <span>👨‍🔧</span>
                <span>👩‍🎨</span>
                <span>🧑‍✈️</span>
            </div>
            <div class="sub-title">骰子闯关 · 积分赛</div>
            <div class="teams-setup">
                <div class="team-badge" style="border-color:#e07a7a;">🔴 红队</div>
                <div class="team-badge" style="border-color:#4a7fa8;">🔵 蓝队</div>
                <div class="team-badge" style="border-color:#7cb07c;">🟢 绿队</div>
                <div class="team-badge" style="border-color:#e2c44a;">🟡 黄队</div>
            </div>
            <button class="btn btn-secondary" id="startGameBtn" style="font-size:1.8rem; padding:0.7rem 2.8rem;">🎯 开始闯关</button>
            <p style="margin-top:0.5rem; color:#4a5f8a; text-shadow:1px 1px 0 #ddd; font-size:0.9rem;">🎲 丢骰子前进，经过起点+1分，踩格子额外加分</p>
        </div>
    </div>

    <!-- 游戏画面 -->
    <div id="gameScreen" class="screen">
        <div class="game-header">
            <span class="game-title">🎲 大富翁赛道</span>
            <span class="turn-indicator" id="turnIndicator">红队回合</span>
        </div>
        <div class="scoreboard" id="scoreboard"></div>
        <div class="board-wrapper">
            <div class="board-grid" id="boardGrid"></div>
        </div>
        <!-- 骰子 & 操作区 -->
        <div class="dice-area">
            <div class="dice-box" id="diceDisplay">⚀</div>
            <button class="btn btn-roll" id="rollDiceBtn">🎲 丢骰子</button>
            <button class="btn btn-success" id="addScoreBtn">➕加1分</button>
            <button class="btn btn-danger" id="subScoreBtn">➖扣1分</button>
            <button class="btn" id="nextTurnBtn">⏩ 下一队</button>
        </div>
        <div style="font-size:1rem; color:#4a5f8a; text-shadow:1px 1px 0 #ddd; margin-top:0.1rem;">💡 每回合可丢骰子一次，也可直接切换队伍</div>
    </div>

    <!-- 结束画面 (排行榜) -->
    <div id="endScreen" class="screen">
        <div class="big-title" style="font-size:3rem;">📊 积分榜</div>
        <div class="sub-title" id="winnerMessage" style="margin-bottom:0.6rem;">继续加油！</div>
        <div style="margin:0.6rem 0; font-size:1.8rem; background: #fff4dc; padding:0.6rem 2rem; border-radius:60px; box-shadow:0 6px 0 #d9c5a0;" id="finalScores"></div>
        <div style="display:flex; gap:1rem; flex-wrap:wrap; justify-content:center; margin-top:0.6rem;">
            <button class="btn btn-secondary" id="restartBtn" style="font-size:1.6rem;">🔄 重新开局</button>
            <button class="btn" id="backToGameBtn" style="font-size:1.3rem; background:#4a5f8a;">⬅️ 返回游戏</button>
        </div>
