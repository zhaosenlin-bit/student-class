<body>
    <h1>Coulomb’s Law for Lab </h1>

  <!-- LEFT PANEL -->
  <div class="control-panel">
    <div class="control-group">
      <b>Initial Horizontal distance d</b>
      <div class="slider-row">
        <input type="range" id="dSlider" min="0.01" max="0.6" step="0.001" value="0.6">
        <input type="text" id="dText" value="0.6 m" readonly>
      </div>
      <div class="minmax"><span>0.01</span><span>0.6</span></div>
    </div>

    <div class="control-group">
      <b>Left charge q₁</b>
      <div class="slider-row">
        <input type="range" id="q1Slider" min="5" max="80" step="0.1" value="5.0">
        <input type="text" id="q1Text" value="5.0 nC" readonly>
      </div>
      <div class="minmax"><span>10</span><span>+80</span></div>
    </div>

    <div class="control-group">
      <b>Hanging charge q₂</b>
      <div class="slider-row">
        <input type="range" id="q2Slider" min="5" max="80" step="0.1" value="5.0">
        <input type="text" id="q2Text" value="5.0 nC" readonly>
      </div>
      <div class="minmax"><span>10</span><span>+80</span></div>
    </div>

    <div class="control-group">
      <b>Left mass m₁</b>
      <div class="slider-row">
        <input type="range" id="m1Slider" min="50" max="100" step="0.1" value="80.0">
        <input type="text" id="m1Text" value="80.0 mg" readonly>
      </div>
      <div class="minmax"><span>50</span><span>100</span></div>
    </div>

    <div class="control-group">
      <b>Hanging mass m₂</b>
      <div class="slider-row">
        <input type="range" id="m2Slider" min="50" max="100" step="0.1" value="80.0">
        <input type="text" id="m2Text" value="80.0 mg" readonly>
      </div>
      <div class="minmax"><span>50</span><span>100</span></div>
    </div>
  </div>

  <!-- RIGHT PANEL -->
  <div class="control-panel-right">
    <div class="control-group">
      <b>Actual separation r (center-center)</b><br>
      <input type="text" id="distValue" value="0.000 m" readonly style="width: 150px;">
    </div>

    <div class="control-group">
      <b>Angle θ (hanging)</b><br>
      <input type="text" id="angleValue" value="0.00°" readonly style="width: 150px;">
    </div>

    <div class="control-group">
      <b>|Coulomb force|</b><br>
      <input type="text" id="fValue" value="0.00e+0 N" readonly style="width: 150px;">
    </div>

    <div class="btn-row">
      <button type="button" class="btn btn-warning" id="infoBtn">Information</button>
      <button type="button" class="btn btn-danger" id="resetBtn">Reset</button>
      
    </div>
  </div>

  <div id="viewport"></div>
</body>
