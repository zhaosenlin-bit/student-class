	 <div id="info" style="text-align: left"> 
		<button class="btn btn-warning" onclick="alert('Mutual inductance between two coils occurs when a time-varying current, such as a sine wave from a function generator, flows through the first coil, generating a changing magnetic field. This magnetic field induces a voltage in the second coil, which is connected to an oscilloscope. The oscilloscope displays the resulting induced sine wave, demonstrating how energy is transferred via the magnetic field between the coils. If we insert an iron core into the first coil (connected with the function generator), the magnetic field is strengthened, which increases the amplitude of the induced sine wave in the second coil.')">
