    <style>
      :root {
        --bg: #edf3fa;
        --text: #172438;
        --muted: #64748a;
        --dim: #8794a6;

        --panel: #ffffffdf;

        --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        color: var(--text);

      .lab::after {
        position: absolute;
        z-index: 0;
        inset: 0;
        background: radial-gradient(125% 105% at 50% 42%, transparent 48%, #cbd7e5 100%);
        content: "";
        opacity: .5;
        pointer-events: none;
      }

      .macro-backdrop {
        position: absolute;
        z-index: 0;
        inset: 0 50% 0 0;
        background:
          linear-gradient(180deg, #eef7fbd9 0%, #e8f2f8a8 42%, #e5eef6c7 100%),
          url("courseware/d-zone/atom-recombination/atom-recombination-macro-lab-background-v1.png") center / cover no-repeat;
        filter: saturate(.76) contrast(.9);
        pointer-events: none;
      }

      #scene {
        position: absolute;
        z-index: 1;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      .species-guide {
        position: absolute;
        z-index: 10;
        top: 84px;
        right: 28px;
        left: calc(50% + 28px);
        display: flex;
        justify-content: space-between;
        color: #40536d;
        font-size: 13px;
        font-weight: 900;
        letter-spacing: .06em;
        pointer-events: none;
      }

      .species-guide span {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 7px 11px;
        border: 1px solid #ffffff8c;
        border-radius: 999px;
        background: #ffffff66;
        box-shadow: 0 8px 24px #34506d12;
        backdrop-filter: blur(10px);

      .species-guide i {
        width: 9px;
        height: 9px;
        border-radius: 50%;

      .species-h i { background: #d9efff; }
      .species-o i { background: #e84d59; }

      .divider {
        position: absolute;
        z-index: 4;
        top: 0;

        width: 1px;
        background: #19344f1c;
        pointer-events: none;
      }

      .view-label {
        position: absolute;
        z-index: 12;
        top: 24px;
        padding: 11px 18px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: #ffffffe8;
        box-shadow: 0 10px 28px #36516f1c;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: .08em;
        pointer-events: none;
      }

      .macro-label { left: 24px; }
      .micro-label { left: calc(50% + 24px); }

      .hero {
        position: absolute;
        z-index: 10;

        font-size: 14px;
        line-height: 1.55;

        top: 37%;
        left: 30px;
        display: grid;
        grid-template-columns: 9px 1fr;
        gap: 9px;
        align-items: start;
        width: 170px;
        color: #334963;
        font-size: 13px;
        font-weight: 900;
        line-height: 1.55;
        pointer-events: none;
      }

      .apparatus-note i {
        width: 8px;
        height: 8px;
        margin-top: 6px;
        border-radius: 50%;
        background: var(--blue);
        box-shadow: 0 0 0 5px #4b9df21c;
      }

      .gas-callout {
        position: absolute;
        z-index: 11;
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 8px 11px;
        border: 1px solid #ffffffa8;
        border-radius: 999px;
        background: #ffffffc7;
        box-shadow: 0 8px 24px #36516f18;
        color: #334963;
        font-size: 12px;
        font-weight: 900;
        pointer-events: none;
        backdrop-filter: blur(10px);
      }

      .gas-callout::before {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        content: "";
        box-shadow: 0 0 0 4px #ffffff8c;
      }

      .gas-callout::after {
        position: absolute;
        top: 50%;
        width: 48px;
        height: 1px;
        background: currentColor;
        content: "";
        opacity: .38;
      }

      .hydrogen-callout { top: 67%; left: 24px; color: #397ebf; }
      .hydrogen-callout::before { background: #69b7f2; }
      .hydrogen-callout::after { right: -48px; }
      .oxygen-callout { top: 62%; left: calc(50% - 142px); color: #c84c57; }
      .oxygen-callout::before { background: #e84d59; }
      .oxygen-callout::after { left: -48px; }

      .panel {
        position: absolute;
        z-index: 12;
        border: 1px solid var(--border);
        background: var(--panel);
        box-shadow: 0 22px 55px #36516f20, inset 0 1px #fff;
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
      }

      .knowledge-card {
        bottom: 34px;
        left: 40px;
        display: grid;
        grid-template-columns: 78px 1fr;
        align-items: center;
        gap: 18px;
        width: min(38vw, 500px);
        min-height: 140px;
        padding: 20px 24px;
        border-radius: 26px;
      }

      .molecule-icon {
        position: relative;
        width: 82px;
        height: 72px;
        border-radius: 50%;
        background: radial-gradient(circle at 50% 48%, #bdeaff73 0%, #d8f2ff33 43%, transparent 72%);
        filter: drop-shadow(0 9px 11px #23415c25);
      }

      .molecule-icon::before,
      .molecule-icon::after {
        position: absolute;
        z-index: 0;
        top: 29px;
        left: 39px;
        width: 34px;
        height: 7px;
        border: 1px solid #ffffff99;
        border-radius: 999px;
        background: linear-gradient(180deg, #eff8fc 0%, #9fb8c8 48%, #687f90 100%);
        box-shadow: inset 0 1px 2px #fff, 0 3px 7px #31516c2e;
        content: "";
        transform-origin: 2px 50%;
      }

      .molecule-icon::before { transform: rotate(132deg); }
      .molecule-icon::after { transform: rotate(48deg); }

      .molecule-icon span::after {
        position: absolute;
        top: 13%;
        left: 18%;
        width: 28%;
        height: 20%;
        border-radius: 50%;
        background: #ffffffd9;
        content: "";
        filter: blur(.3px);
      }

      .molecule-icon span {
        position: absolute;
        z-index: 2;
        border-radius: 50%;
        border: 1px solid #ffffffa8;
      }

      .icon-o {
        top: 5px;
        left: 24px;
        width: 36px;
        height: 36px;
        background: radial-gradient(circle at 31% 25%, #ffb2b7 0%, #f06a73 19%, #e74652 48%, #b51d29 77%, #650c14 100%);
        box-shadow: inset -6px -7px 11px #5d06105c, inset 5px 5px 8px #ffffff42, 0 7px 12px #85151f42;
      }

      .icon-h1,
      .icon-h2 {
        top: 42px;
        width: 27px;
        height: 27px;
        background: radial-gradient(circle at 30% 24%, #fff 0%, #f7fbff 24%, #dcecf6 56%, #a9bdcb 83%, #6d8291 100%);
        box-shadow: inset -4px -5px 8px #52697b45, inset 4px 4px 7px #fff, 0 6px 11px #314d6338;
      }

      .icon-h1 { left: 4px; }
      .icon-h2 { right: 3px; }

      .card-stage {
        display: block;
        margin-bottom: 3px;
        color: var(--accent);
        font-size: 12px;
        font-weight: 900;
        letter-spacing: .12em;
      }

      .knowledge-card h2 {
        margin: 0;
        font-family: var(--serif);
        font-size: 28px;
        font-weight: 500;
      }

      .knowledge-card p {
        margin: 8px 0 0;
        color: #34465e;
        font-size: 14px;
        font-weight: 800;
        line-height: 1.45;
      }

      .controls {
        right: 40px;
        bottom: 34px;
        width: min(47vw, 700px);
        padding: 19px 24px 16px;
        border-radius: 28px;
      }

      .control-header {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 18px;
        margin-bottom: 14px;
      }

      .percent {
        font-size: clamp(39px, 4vw, 58px);
        font-weight: 900;
        line-height: 1;
        letter-spacing: -.06em;
      }

      .equation {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-size: clamp(20px, 2vw, 29px);
        font-weight: 900;
        white-space: nowrap;
      }

      .equation > span { transition: color .2s, opacity .2s, transform .2s; }

      .arrow {
        position: relative;
        display: inline-flex;
        align-items: center;
        font-size: 34px;
        font-weight: 500;
        line-height: 1;
      }

      .arrow small {
        position: absolute;
        bottom: 76%;
        left: 50%;
        color: #52637a;
        font-size: 11px;
        font-weight: 900;
        transform: translateX(-50%);
      }

      .state-badge {
        padding: 9px 14px;
        border-radius: 999px;
        color: #fff;
        background: var(--accent);
        font-size: 13px;
        font-weight: 900;
        white-space: nowrap;
      }

      .reaction-slider {
        width: 100%;
        height: 14px;
        appearance: none;
        cursor: pointer;
        border: 1px solid #17324e24;
        border-radius: 999px;
        outline: none;
        background: linear-gradient(90deg, #4b9df2, #28bdc6 50%, #f0b34c 72%, #ef5555);
        box-shadow: inset 0 1px 3px #27435f2e;
      }

      .reaction-slider::-webkit-slider-thumb {
        width: 29px;
        height: 29px;
        appearance: none;
        border: 1px solid #17324e1f;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 3px 10px #27435f3d, 0 0 0 4px #ffffffa8;
      }

      .reaction-slider::-moz-range-thumb {
        width: 29px;
        height: 29px;
        border: 1px solid #17324e1f;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 3px 10px #27435f3d, 0 0 0 4px #ffffffa8;
      }

      .stage-labels {
        display: flex;
        justify-content: space-between;
        margin-top: 9px;
        color: #6a788b;
        font-size: 13px;
        font-weight: 900;
      }

      .stage-labels button {
        padding: 0;
        border: 0;
        color: inherit;
        background: transparent;
        cursor: pointer;
        font-weight: inherit;
      }

      .stage-labels button.active { color: var(--accent); }

      .invariants {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 9px 12px;
        margin-top: 13px;
      }

      .invariants > span {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 7px 11px;
        border: 1px solid #19344f17;
        border-radius: 999px;
        color: #44556b;
        background: #f6f9fdd1;
        font-size: 12px;
        font-weight: 900;
      }

      .atom-dot { width: 17px; height: 17px; border-radius: 50%; }
      .atom-h { border: 1px solid #a9b4c1; background: #fff; }
      .atom-o { background: #df3f47; box-shadow: inset -2px -2px 4px #801b21aa; }

      .invariants em {
        width: 100%;
        color: var(--dim);
        font-size: 10px;
        font-style: normal;
        text-align: center;
      }

      .stage-before { --accent: var(--blue); }
      .stage-during { --accent: var(--cyan); }
      .stage-after { --accent: var(--red); }
      .stage-before .products,
      .stage-after .reactants { opacity: .38; }
      .stage-before .reactants,
      .stage-during .arrow,
      .stage-after .products { color: var(--accent); transform: translateY(-1px); }

      @media (max-width: 900px) {
        .hero { top: 68px; padding: 0 18px; }
        .hero p, .apparatus-note { display: none; }
        .knowledge-card { left: 16px; bottom: 16px; width: calc(50% - 24px); min-height: 112px; padding: 14px; grid-template-columns: 54px 1fr; }
        .molecule-icon { width: 52px; height: 52px; transform: scale(.72); transform-origin: left center; }
        .knowledge-card h2 { font-size: 21px; }
        .knowledge-card p { display: none; }
        .controls { right: 16px; bottom: 16px; width: calc(50% - 24px); padding: 16px; }
        .control-header { gap: 10px; }
        .equation { grid-column: 1 / -1; grid-row: 2; }
        .state-badge { justify-self: end; }
        .invariants { display: none; }
      }

      @media (max-width: 620px) {
        .view-label { top: 12px; padding: 8px 12px; font-size: 12px; }
        .macro-label { left: 12px; }
        .micro-label { left: calc(50% + 12px); }
        .hero { top: 54px; }
        .hero h1 { font-size: 20px; }
        .knowledge-card { display: none; }
        .controls { right: 10px; bottom: 10px; left: 10px; width: auto; }
        .species-guide { display: none; }
        .gas-callout { display: none; }
      }
    </style>
    <style>
      .course-map-return { position: fixed; z-index: 100; top: 14px; left: 50%; padding: 8px 13px; border: 1px solid rgba(23, 49, 74, .18); border-radius: 999px; color: #26364b; background: rgba(255, 255, 255, .88); box-shadow: 0 9px 26px rgba(36, 65, 89, .15); font: 800 11px/1.2 "PingFang SC", "Microsoft YaHei", sans-serif; text-decoration: none; transform: translateX(-50%); backdrop-filter: blur(14px); }

    <main class="lab stage-during" id="lab">
      <div class="macro-backdrop" aria-hidden="true"></div>
      <canvas id="scene" aria-hidden="true"></canvas>
      <div class="divider" aria-hidden="true"></div>
      <div class="view-label macro-label">宏观现象</div>
      <div class="view-label micro-label">微观过程</div>
      <div class="species-guide" aria-hidden="true">
        <span class="species-h"><i></i>H₂ · 氢气</span>
        <span class="species-o"><i></i>O₂ · 氧气</span>
      </div>

      <header class="hero">
        <h1>化学反应中原子的重新组合</h1>
        <p>原子不会消失或产生，只是重新组合成新的分子。</p>
      </header>

      <div class="apparatus-note">
        <i aria-hidden="true"></i>
        <span>氢气燃烧，干冷烧杯内壁出现水珠</span>
      </div>
      <div class="gas-callout hydrogen-callout">H₂ 氢气入口</div>
      <div class="gas-callout oxygen-callout">O₂ 氧气入口</div>

      <section class="panel knowledge-card" aria-live="polite">
        <div class="molecule-icon" aria-hidden="true">
          <span class="icon-o"></span>
          <span class="icon-h1"></span>
          <span class="icon-h2"></span>
        </div>
        <div>
          <span class="card-stage" id="cardStage">反应中</span>
          <h2 id="cardTitle">原子重新组合</h2>
          <p id="cardBody">有效碰撞使旧键断开，原子重新组合并形成新的化学键。</p>
        </div>
      </section>

        <div class="control-header">
          <strong class="percent" id="percent">50%</strong>
          <div class="equation" aria-label="化学反应方程式：氢气和氧气在点燃条件下生成水">
            <span class="reactants">2H₂ + O₂</span>
            <span class="arrow"><small>点燃</small>⟶</span>
            <span class="products">2H₂O</span>
          </div>
          <span class="state-badge" id="stateBadge">反应中</span>

          <button type="button" data-progress="100">反应后</button>
        </div>

        <div class="invariants">
          <span><i class="atom-dot atom-h"></i>氢原子总数不变</span>
          <span><i class="atom-dot atom-o"></i>氧原子总数不变</span>

        </div>
      </section>
