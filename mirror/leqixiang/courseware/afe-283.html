<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>粗盐提纯 · 双人拖拽PK · 完整选项</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #e6f0f7 0%, #c9dde9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .game-container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            border-radius: 60px 60px 40px 40px;
            padding: 24px 28px 28px;
            box-shadow: 0 25px 40px -12px rgba(0, 30, 40, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        h1 {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-size: 2.0rem;
            font-weight: 600;
            color: #143544;
            letter-spacing: 1px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 400;
            background: #d2e3ee;
            padding: 6px 20px;
            border-radius: 40px;
            color: #1d4a60;
        }

        .header-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 10px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .scoreboard {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .player-score {
            background: #1d4a60;
            color: white;
            padding: 8px 26px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 4px 0 #0b2a39;
            display: inline-flex;
            align-items: center;
            gap: 14px;
        }
        .player-score span {
            background: #f5c542;
            color: #1d2e38;
            padding: 0 18px;
            border-radius: 30px;
            font-size: 1.4rem;
            min-width: 40px;
            text-align: center;
        }

        .progress-area {
            background: #dceaf3c0;
            backdrop-filter: blur(4px);
            border-radius: 60px;
            padding: 14px 16px;
            margin: 8px 0 14px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.04);
        }
        .progress-steps {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .step-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            flex: 1;
            min-width: 50px;
        }
        .step-icon .icon-circle {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #b6d0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 600;
            color: #2d4b5e;
            transition: 0.25s ease;
            box-shadow: 0 2px 0 #8da9bb;
            border: 2px solid transparent;
        }
        .step-icon .icon-label {
            font-size: 0.65rem;
            color: #2d4b5e;
            font-weight: 500;
            white-space: nowrap;
            background: #eef6fc;
            padding: 2px 8px;
            border-radius: 20px;
        }
        .step-icon.completed .icon-circle {
            background: #5fbb7a;
            color: white;
            box-shadow: 0 0 0 4px #a3e0b3, 0 2px 0 #2d6b42;
            border-color: #f5f9ff;
            animation: pop-glow 0.5s ease;
        }
        .step-icon.completed .icon-label {
            background: #5fbb7a;
            color: white;
        }
        .step-icon.active .icon-circle {
            background: #f5c542;
            color: #1d2e38;
            box-shadow: 0 0 0 4px #f5c54280, 0 2px 0 #b88f2a;
            animation: pulse-active 1.2s infinite;
        }
        @keyframes pop-glow {
            0% { transform: scale(0.7); box-shadow: 0 0 0 0 #a3e0b3; }
            50% { transform: scale(1.2); box-shadow: 0 0 0 12px #a3e0b380; }
            100% { transform: scale(1); box-shadow: 0 0 0 4px #a3e0b3, 0 2px 0 #2d6b42; }
        }
        @keyframes pulse-active {
            0% { box-shadow: 0 0 0 0 #f5c54280, 0 2px 0 #b88f2a; }
            70% { box-shadow: 0 0 0 12px #f5c54200, 0 2px 0 #b88f2a; }
            100% { box-shadow: 0 0 0 0 #f5c54200, 0 2px 0 #b88f2a; }
        }
        .progress-connector {
            flex: 0 0 12px;
            height: 3px;
            background: #b6d0e0;
            border-radius: 4px;
            transition: 0.3s;
        }
        .progress-connector.done {
            background: #5fbb7a;
            height: 4px;
        }

        /* 上方区域：题干 + 所有可拖拽卡片 */
        .top-drag-area {
            background: #ffffffcc;
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 16px 20px 20px;
            margin: 4px 0 12px;
            border: 1px solid #ffffff;
        }
        .step-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .step-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #1a3b4f;
        }
        .step-counter {
            background: #1a3b4f;
            color: white;
            border-radius: 60px;
            padding: 4px 20px;
            font-weight: 600;
        }
        .question-text {
            font-weight: 600;
            font-size: 1.05rem;
            color: #143544;
            text-align: center;
            margin: 6px 0 14px;
        }
        .drag-options {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            min-height: 60px;
            padding: 8px 4px;
        }
        .drag-option {
            background: white;
            border: 2px solid #b6d0e0;
            border-radius: 60px;
            padding: 10px 24px;
            font-weight: 600;
            font-size: 1rem;
            color: #1a3b4f;
            box-shadow: 0 3px 0 #b0c9db;
            cursor: grab;
            touch-action: none;
            user-select: none;
            transition: 0.1s;
            display: inline-block;
            min-width: 80px;
            text-align: center;
        }
        .drag-option:active {
            cursor: grabbing;
        }
        .drag-option.dragging {
            opacity: 0.6;
            transform: scale(0.96);
        }
        .drag-option.locked {
            opacity: 0.45;
            pointer-events: none;
            border-style: dashed;
        }

        /* 双人答题放置框 (左下&右下) */
        .drop-zone-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin: 10px 0 8px;
            flex-wrap: wrap;
        }
        .drop-zone {
            flex: 1;
            min-width: 200px;
            background: #eef6fc;
            border-radius: 40px;
            padding: 16px 10px 12px;
            border: 3px dashed #98b8ce;
            box-shadow: inset 0 4px 12px rgba(0,0,0,0.02);
            text-align: center;
            transition: 0.2s;
            min-height: 90px;
        }
        .drop-zone.active-drag-over {
            border-color: #f5c542;
            background: #fcf3e0;
        }
        .drop-zone .zone-label {
            font-weight: 700;
            color: #1d4a60;
            margin-bottom: 6px;
            font-size: 1.1rem;
        }
        .drop-zone .zone-player {
            font-size: 0.9rem;
            color: #2d5e72;
            margin-bottom: 6px;
        }
        .drop-zone .dropped-item {
            background: #1d4a60;
            color: white;
            border-radius: 60px;
            padding: 8px 18px;
            display: inline-block;
            font-weight: 600;
            margin-top: 4px;
        }
        .drop-zone .dropped-item.correct-answer {
            background: #2e7d5e;
        }
        .drop-zone .feedback-inline {
            font-size: 0.85rem;
            margin-top: 6px;
            color: #1a3b4f;
        }

        .timer-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin: 6px 0 4px;
        }
        .timer-circle {
            background: #1d4a60;
            color: white;
            border-radius: 60px;
            padding: 6px 24px;
            font-weight: 700;
            font-size: 1.3rem;
        }
        .timer-warning {
            background: #c0392b;
        }

        .action-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 8px 0 4px;
            flex-wrap: wrap;
        }
        .btn {
            background: white;
            border: none;
            padding: 10px 22px;
            border-radius: 60px;
            font-weight: 600;
            box-shadow: 0 2px 0 #b0c9db;
            cursor: pointer;
            transition: all 0.07s;
            border: 1px solid #dbeaf3;
            font-size: 0.95rem;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }
        .btn-primary {
            background: #1d4a60;
            color: white;
            box-shadow: 0 4px 0 #0b2a39;
            border: none;
        }
        .btn-success {
            background: #2d7a5a;
            color: white;
            box-shadow: 0 4px 0 #1a4d38;
            border: none;
        }
        .btn:disabled {
            opacity: 0.5;
            transform: translateY(1px);
            box-shadow: none;
            cursor: default;
        }
        .btn-warning {
            background: #d18f2c;
            color: white;
            box-shadow: 0 4px 0 #8a5e1a;
            border: none;
        }

        .footer-note {
            text-align: center;
            margin-top: 16px;
            color: #3f6a7e;
            font-size: 0.9rem;
        }

        @media (max-width: 600px) {
            .game-container { padding: 16px; }
            h1 { font-size: 1.5rem; }
            .step-icon .icon-circle { width: 36px; height: 36px; font-size: 1.1rem; }
            .drop-zone { min-width: 140px; }
        }
    </style>
</head>
