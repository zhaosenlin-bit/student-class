<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>圆的面积 · 拖拽探索</title>
    <style>
        /* === 暗色科技蓝主题 === */
        :root {
            --bg-deep: #060b14;
            --bg-panel: #0d1b2a;
            --bg-panel-alt: #111d30;
            --border: #1a3050;
            --text: #d0d8e8;
            --text-dim: #7a8a9e;
            --accent: #00b4d8;
            --accent2: #ff6b35;
            --accent3: #4caf50;
            --accent4: #ffd166;
            --danger: #e63946;
            --panel-width: 290px;
            --header-h: 46px;
            --transition: 0.25s ease;
            --radius: 10px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-deep);
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }

        /* === 二栏布局 === */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #mobile-header {
            display: none;
        }

        #main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧信息面板 */
        #side-panel {
            width: var(--panel-width);
            min-width: var(--panel-width);
            background: var(--bg-panel);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            z-index: 10;
        }

        /* 右侧主视口 */
        #center-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-deep);
            cursor: default;
        }

        /* === 面板 section 统一 === */
        .panel-section {
            padding: 16px 14px;
            border-bottom: 1px solid var(--border);
        }
        .panel-section:last-child {
            border-bottom: none;
        }

        .panel-section h3 {
            font-size: 13px;
            color: var(--accent);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .panel-section h3::before {
            content: "";
            display: inline-block;
            width: 3px;
            height: 14px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* === 公式展示 === */
        .formula-box {
            background: var(--bg-panel-alt);
            border-radius: var(--radius);
            padding: 16px 14px;
            border: 1px solid var(--border);
            margin-top: 4px;
        }

        .formula-main {
            font-size: 22px;
            font-weight: 600;
            color: var(--text);
            text-align: center;
            letter-spacing: 1px;
            font-family: 'Times New Roman', serif;
        }
        .formula-main .highlight {
            color: var(--accent2);
        }
        .formula-main .highlight2 {
            color: var(--accent4);
        }

        .formula-dynamic {
            margin-top: 12px;
            font-size: 18px;
            text-align: center;
            background: rgba(0, 180, 216, 0.08);
            border-radius: 8px;
            padding: 10px 8px;
            border: 1px dashed var(--accent);
            font-family: 'Times New Roman', serif;
            line-height: 1.6;
        }
        .formula-dynamic .val {
            color: var(--accent2);
            font-weight: 700;
        }
        .formula-dynamic .val-area {
            color: var(--accent4);
            font-weight: 700;
        }

        /* === 数据行 === */
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            font-size: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }
        .data-row:last-child {
            border-bottom: none;
        }
        .data-row .label {
            color: var(--text-dim);
        }
        .data-row .value {
            color: var(--text);
            font-weight: 600;
            text-align: right;
        }
        .data-row .value.accent {
            color: var(--accent2);
        }
        .data-row .value.accent2 {
            color: var(--accent4);
        }

        /* === 拖拽提示 === */
        .drag-tip {
            margin-top: 10px;
            padding: 10px 12px;
            background: rgba(255, 107, 53, 0.08);
            border-radius: 8px;
            border-left: 3px solid var(--accent2);
            font-size: 13px;
            color: var(--text-dim);
            line-height: 1.5;
        }
        .drag-tip strong {
            color: var(--accent2);
        }

        /* === 视口内叠加信息 === */
        .info-card {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(13, 27, 42, 0.88);
            border: 1px solid var(--accent);
            border-radius: 12px;
            padding: 10px 18px;
            color: var(--text);
            font-size: 14px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s;
            z-index: 6;
            text-align: center;
            backdrop-filter: blur(6px);
            white-space: nowrap;
        }
        .info-card.visible {
            opacity: 1;
        }

        /* === 响应式 === */
        @media (max-width: 900px) {
            #mobile-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 12px;
                height: var(--header-h);
                background: var(--bg-panel);
                border-bottom: 1px solid var(--border);
                flex-shrink: 0;
            }
            #mobile-header h1 {
                font-size: 16px;
                color: var(--text);
                font-weight: 500;
            }
            #mobile-header .header-controls .btn {
                font-size: 13px;
                padding: 5px 12px;
            }

            #side-panel {
                position: fixed;
                left: 0;
                top: var(--header-h);
                bottom: 0;
                z-index: 50;
                margin-left: calc(-1 * var(--panel-width));
                transition: margin-left var(--transition);
                border-right: 1px solid var(--border);
                box-shadow: 4px 0 20px rgba(0,0,0,0.6);
            }
            #side-panel.open {
                margin-left: 0;
            }

            #center-panel {
                flex: 1;
                width: 100%;
            }

            .formula-main {
                font-size: 20px;
            }
            .formula-dynamic {
                font-size: 16px;
            }
            .drag-tip {
                font-size: 12px;
            }
        }

        @media (max-width: 520px) {
            :root {
                --panel-width: 260px;
            }
            .formula-main {
                font-size: 18px;
            }
            .formula-dynamic {
                font-size: 15px;
            }
            .panel-section {
                padding: 12px 10px;
            }
        }

        /* 按钮样式（用于移动端header） */
        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-panel-alt);
            color: var(--text);
            transition: all 0.2s;
            white-space: nowrap;
        }
        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .btn.active {
            border-color: var(--accent2);
            color: var(--accent2);
            background: rgba(255, 107, 53, 0.1);
        }

        /* canvas 全屏 */
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

    <div id="app">
        <!-- 移动端 header -->
        <header id="mobile-header">
            <h1>🔵 圆的面积</h1>
            <div class="header-controls">
                <button class="btn" id="btn-toggle-panel">☰ 信息</button>
            </div>
        </header>

        <div id="main-layout">
            <!-- 左侧信息面板 -->
            <aside id="side-panel">
                <div class="panel-section">
                    <h3>📐 公式</h3>
                    <div class="formula-box">
                        <div class="formula-main">
                            S = <span style="color:var(--accent4)">π</span> · <span class="highlight">r</span>²
                        </div>
                        <div class="formula-dynamic" id="dynamicFormula">
                            S = 3.14 × <span class="val" id="rVal">2</span>² = <span class="val-area" id="areaVal">12.56</span>
                        </div>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>📊 实时数值</h3>
                    <div class="data-row">
                        <span class="label">半径 r</span>
                        <span class="value accent" id="displayR">2.0</span>
                    </div>
                    <div class="data-row">
                        <span class="label">直径 d</span>
                        <span class="value" id="displayD">4.0</span>
                    </div>
                    <div class="data-row">
                        <span class="label">面积 S</span>
                        <span class="value accent2" id="displayS">12.56</span>
                    </div>
                    <div class="data-row">
                        <span class="label">圆周率 π</span>
                        <span class="value" style="color:var(--accent4);">3.14159…</span>
                    </div>
                </div>

                <div class="panel-section" style="flex:1;">
                    <h3>🖱️ 操作</h3>
                    <div class="drag-tip">
                        <strong>✨ 拖拽圆上的橙色点</strong><br>
                        改变半径，面积会跟着变化！<br>
                        半径越大，面积越大。
                    </div>
                    <div style="margin-top: 14px; font-size: 12px; color: var(--text-dim); text-align: center; border-top: 1px solid var(--border); padding-top: 12px;">
                        <span style="color:var(--accent2);">●</span> 拖拽点 &nbsp;|&nbsp; <span style="color:var(--accent);">━</span> 半径
                    </div>
                </div>
            </aside>

            <!-- 右侧主视口 -->
            <main id="center-panel">
                <canvas id="canvas-container"></canvas>
                <!-- 浮层提示（只在拖拽时显示） -->
                <div class="info-card" id="infoCard">🎯 半径 = <span id="infoR">2.0</span></div>
            </main>
        </div>
    </div>
