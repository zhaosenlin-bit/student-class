  <div id="container"></div>

 <div id="panel">
  <div class="title">INTRO RESISTORS (DC + LED)</div>

  <!-- 2-column layout -->
  <div class="uiGrid">

    <!-- LEFT column: select + sliders -->
    <div class="uiCol">

      <div class="uiRow">
        <div class="uiLabel">Select Circuit:</div>
        <select id="modeSel" class="form-control uiSelect">

        <input id="vsvBox" class="uiBox" value="9.0 V" readonly>
      </div>

      <div class="uiRow">
        <div class="uiLabel">R1</div>
        <input id="r1" type="range" min="1" max="2000" step="1" value="220" class="uiSlider">
        <input id="r1vBox" class="uiBox" value="220 Ω" readonly>
      </div>

      <div class="uiRow">
        <div class="uiLabel">R2</div>
        <input id="r2" type="range" min="1" max="2000" step="1" value="330" class="uiSlider">
        <input id="r2vBox" class="uiBox" value="330 Ω" readonly>
      </div>

      <div class="uiRow">
        <div class="uiLabel">LED power (label)</div>
        <input id="pled" type="range" min="0" max="2.0" step="0.01" value="0.35" class="uiSlider">
        <input id="pledvBox" class="uiBox" value="0.35 W" readonly>
      </div>

      <div class="uiRow">
        <div class="uiLabel">R power (label)</div>

        <input id="prvBox" class="uiBox" value="0.80 W" readonly>
      </div>

    </div>

    <!-- RIGHT column: outputs + buttons + status -->
    <div class="uiCol">

      <div class="outCard">
        <div class="outLine"><span class="outKey">Model:</span> LED Vf=2.0V (simple)</div>
        <div class="outLine"><span class="outKey">I</span> = <b id="Iv">0.000</b> A</div>
        <div class="outLine"><span class="outKey">P_LED(calc)</span> = <b id="PledCalc">0.00</b> W</div>
        <div class="outLine"><span class="outKey">P_R(calc)</span> = <b id="PrCalc">0.00</b> W</div>
        <div class="outLine"><span class="outKey">Req</span> = <b id="Reqv">0</b> Ω</div>
      </div>

      <div class="btnGrid">
        <button id="infoBtn" class="btn btn-primary">Info</button>
        <button id="formulaBtn" class="btn btn-info">Formulas</button>
        <button id="resetBtn" class="btn btn-danger">Reset</button>
        
      </div>

      <div id="statusBox" class="statusSafe">Status: LED safe.</div>

    </div>

  </div>
</div>
