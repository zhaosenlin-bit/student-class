<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🐜 蚂蚁爬圆 · 周长演示</title>
  <style>
    /* ===== 暗色科技风 · CSS变量 ===== */
    :root {
      --bg-deep: #060b14;
      --bg-panel: #0d1b2a;
      --bg-panel-alt: #111d30;
      --border: #1a3050;
      --text: #d0d8e8;
      --text-dim: #7a8a9e;
      --accent: #00b4d8;
      --accent2: #ff6b35;
      --accent3: #4caf50;
      --accent4: #ffd166;
      --danger: #e63946;
      --panel-width: 290px;
      --header-h: 46px;
      --transition: 0.25s ease;
      --radius: 10px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-deep);
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: var(--text);
      overflow: hidden;
      height: 100vh;
    }

    /* ===== 三栏布局 ===== */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    #mobile-header {
      display: none;
    }

    #main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    #left-panel {
      width: var(--panel-width);
      min-width: var(--panel-width);
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding-bottom: 20px;
    }

    #center-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 50%, #0a1525, #060b14);
    }

    #right-panel {
      width: var(--panel-width);
      min-width: var(--panel-width);
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding-bottom: 20px;
    }

    /* ===== 面板Section ===== */
    .panel-section {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
    }
    .panel-section:last-child {
      border-bottom: none;
    }
    .panel-section h3 {
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-section h3::before {
      content: "";
      display: inline-block;
      width: 3px;
      height: 14px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* ===== 按钮 ===== */
    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .btn {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-panel-alt);
      color: var(--text);
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .btn.active {
      border-color: var(--accent2);
      color: var(--accent2);
      background: rgba(255, 107, 53, 0.1);
    }
    .btn.accent {
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ===== 数据行 ===== */
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
    }
    .data-row .label {
      color: var(--text-dim);
    }
    .data-row .value {
      color: var(--text);
      font-weight: 600;
      text-align: right;
      font-family: 'Courier New', monospace;
    }
    .data-row .value.highlight {
      color: var(--accent4);
    }

    /* ===== 计算过程卡片 ===== */
    .calc-steps {
      background: var(--bg-panel-alt);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.8;
      color: var(--text-dim);
      border-left: 3px solid var(--accent);
    }
    .calc-steps .step {
      display: block;
    }
    .calc-steps .formula {
      color: var(--accent4);
      font-weight: 600;
    }
    .calc-steps .result {
      color: var(--accent3);
      font-weight: 700;
    }

    /* ===== 视口浮层信息 ===== */
    .info-card {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(13, 27, 42, 0.92);
      border: 1px solid var(--accent);
      border-radius: 12px;
      padding: 10px 18px;
      max-width: 500px;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      z-index: 6;
      text-align: center;
      backdrop-filter: blur(8px);
    }
    .info-card.visible {
      opacity: 1;
    }

    /* ===== 响应式 ===== */
    #mobile-header {
      display: none;
    }
    @media (max-width: 900px) {
      #mobile-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        height: var(--header-h);
        background: var(--bg-panel);
        border-bottom: 1px solid var(--border);
      }
      #mobile-header h1 {
        font-size: 15px;
        color: var(--text);
      }
      #left-panel {
        position: fixed;
        left: 0;
        top: var(--header-h);
        bottom: 0;
        z-index: 50;
        margin-left: calc(-1 * var(--panel-width));
        transition: margin-left var(--transition);
      }
      #left-panel.open {
        margin-left: 0;
      }
      #right-panel {
        position: fixed;
        right: 0;
        top: var(--header-h);
        bottom: 0;
        z-index: 50;
        margin-right: calc(-1 * var(--panel-width));
        transition: margin-right var(--transition);
      }
      #right-panel.open {
        margin-right: 0;
      }
      .info-card {
        top: 8px;
        font-size: 12px;
        padding: 8px 12px;
        max-width: 90%;
      }
    }

    /* ===== 虫子与交互元素样式 ===== */
    .bug-drag-area {
      margin-top: 10px;
      padding: 8px;
      background: rgba(0, 180, 216, 0.08);
      border-radius: 8px;
      border: 1px dashed var(--accent);
      text-align: center;
      font-size: 12px;
      color: var(--text-dim);
      cursor: grab;
      user-select: none;
      transition: background 0.2s;
    }
    .bug-drag-area:hover {
      background: rgba(0, 180, 216, 0.15);
    }
    .bug-drag-area:active {
      cursor: grabbing;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 数值标签 */
    .radius-label {
      font-size: 14px;
      font-weight: 700;
      fill: var(--accent4);
      text-shadow: 0 0 8px rgba(0,0,0,0.8);
    }
  </style>
</head>

<div id="app">
  <header id="mobile-header">
    <button class="btn" id="btn-toggle-left">☰ 控制</button>
    <h1>🐜 蚂蚁爬圆</h1>
    <button class="btn" id="btn-toggle-right">数据</button>
  </header>

  <div id="main-layout">
    <aside id="left-panel">
      <div class="panel-section">
        <h3>🐛 调节圆的大小</h3>
        <div class="bug-drag-area" id="bug-drag-area">
          🐛 拖动小虫改变半径
        </div>
        <div style="margin-top: 8px; font-size: 12px; color: var(--text-dim);">
          当前半径: <span id="radius-value-display" style="color: var(--accent4); font-weight: 700;">3.0</span> 格
        </div>
        <div style="margin-top: 4px; font-size: 11px; color: var(--text-dim);">
          (在中间画布上左右拖动虫子)
        </div>
      </div>

      <div class="panel-section">
        <h3>▶️ 演示控制</h3>
        <div class="btn-row">
          <button class="btn accent" id="btn-auto-demo">🐜 自动爬行一圈</button>
          <button class="btn" id="btn-reset">🔄 重置位置</button>
        </div>
        <div style="margin-top: 10px; font-size: 12px; color: var(--text-dim);">
          <span id="ant-status">🐜 待命</span>
        </div>
      </div>

      <div class="panel-section">
        <h3>📐 显示选项</h3>
        <div class="ctrl-group" style="display: flex; flex-direction: column; gap: 6px;">
          <label><input type="checkbox" id="chk-radius" checked> 显示半径</label>
          <label><input type="checkbox" id="chk-diameter" checked> 显示直径</label>
          <label><input type="checkbox" id="chk-trail" checked> 轨迹渐隐</label>
        </div>
      </div>
    </aside>

    <main id="center-panel">
      <canvas id="mainCanvas"></canvas>
      <div class="info-card" id="infoCard">
        <span id="infoText">🐜 拖动小虫调整圆的大小</span>
      </div>
    </main>

    <aside id="right-panel">
      <div class="panel-section">
        <h3>📊 实时数据</h3>
        <div class="data-row">
          <span class="label">半径 (r)</span>
          <span class="value" id="data-radius">3.0</span>
        </div>
        <div class="data-row">
          <span class="label">直径 (d)</span>
          <span class="value" id="data-diameter">6.0</span>
        </div>
        <div class="data-row">
          <span class="label">周长 (C)</span>
          <span class="value highlight" id="data-circumference">18.84</span>
        </div>
        <div class="data-row">
          <span class="label">已爬弧长</span>
          <span class="value" id="data-traveled">0.00</span>
        </div>
      </div>

      <div class="panel-section">
        <h3>🧮 分步计算</h3>
        <div class="calc-steps" id="calc-steps">
          <span class="step">📐 已知半径: <span class="formula" id="step-radius">r = 3.0</span></span>
          <span class="step">⚡ 周长公式: <span class="formula">C = 2πr</span></span>
          <span class="step">🔢 代入: <span class="formula" id="step-sub">C = 2 × 3.14 × 3.0</span></span>
          <span class="step">✅ 结果: <span class="result" id="step-result">C = 18.84</span></span>
        </div>
        <div style="margin-top: 8px; font-size: 11px; color: var(--text-dim);">
          * 蚂蚁爬行时实时更新已爬弧长
        </div>
      </div>
    </aside>
  </div>
</div>
