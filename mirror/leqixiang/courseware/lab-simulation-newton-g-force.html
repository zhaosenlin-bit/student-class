function onMouseMove(event) {
    const label = document.getElementById('planetNameLabel');

    // Normalize mouse coordinates
    mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

    // Cast ray
    raycaster.setFromCamera(mouse, camera);

    // Try to intersect children meshes too
    const intersects = raycaster.intersectObjects(objs, true);

    if (intersects.length > 0) {
        const target = intersects[0].object;

        // If target is very small, still detect it
        if (target && target.name) {
            hoveredObject = target;
            label.style.display = 'block';
            label.textContent = hoveredObject.name;
            label.style.left = event.clientX + 10 + 'px';
            label.style.top = event.clientY + 10 + 'px';
        }
    } else {
        label.style.display = 'none';
    }
}

function calculation(){
	const D_meters = D * 1e3;
	Gforce = (G * M1 * M2 / (D_meters * D_meters)).toExponential(2);
	updateGforce (Gforce + ' N');
}

	document.getElementById('force').value = val;
}

	document.getElementById('M2').value = parseFloat(val).toExponential(2) + ' kg';

}

	var temp = parseFloat(val*1000).toExponential();

}

	for(var i=0; i<8; i++){

			M1 = checkPlanet(planet1);

		}
		var radius2 = coord2.distanceTo(objs[i].position);

			M2 = checkPlanet(planet2);
			updateM2(M2);

		calculation();
	}
