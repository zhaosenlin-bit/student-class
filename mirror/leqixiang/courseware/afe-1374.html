/* =========================================================
   状态与初始化
   ========================================================= */
const view = { rx: -0.4, ry: 0.3, dist: 3800, targetRx: -0.4, targetRy: 0.3, targetDist: 3800 };
const FOV = 1400;
let W = 0, H = 0, scaleBase = 1;

const canvas = document.getElementById('bg');
const ctx = canvas.getContext('2d');
const nodesLayer = document.getElementById('nodes');
const sidebar = document.getElementById('sidebar');
const sidebarTitle = document.getElementById('sidebarTitle');
const sidebarTags = document.getElementById('sidebarTags');
const sidebarContent = document.getElementById('sidebarContent');
const popover = document.getElementById('popover');

const nodes = [];
const links = [];

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function lerp(a, b, t){ return a + (b - a) * t; }
function easeOut(t){ return 1 - Math.pow(1 - t, 3); }
function hexA(hex, a){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function shade(hex, pct){
  const num = parseInt(hex.slice(1), 16);
  let r = num >> 16, g = (num >> 8) & 0xff, b = num & 0xff;
  if(pct >= 0){ r = Math.round(r + (255 - r) * pct); g = Math.round(g + (255 - g) * pct); b = Math.round(b + (255 - b) * pct); }
  else{ r = Math.round(r * (1 + pct)); g = Math.round(g * (1 + pct)); b = Math.round(b * (1 + pct)); }
  return '#' + ((clamp(r,0,255) << 16) | (clamp(g,0,255) << 8) | clamp(b,0,255)).toString(16).padStart(6, '0');
}

function project(p){
  const cy = Math.cos(view.ry), sy = Math.sin(view.ry);
  const x1 = p.x * cy + p.z * sy;
  const z1 = -p.x * sy + p.z * cy;
  const cx = Math.cos(view.rx), sx = Math.sin(view.rx);
  const y2 = p.y * cx - z1 * sx;
  const z2 = p.y * sx + z1 * cx;
  const d = view.dist + z2;
  if(d < 200) return null;
  const s = (FOV / d) * scaleBase;
  return { x: W / 2 + x1 * s, y: H / 2 + y2 * s, s: s, z: z2 };
}

/* =========================================================
   构建树结构（加大间距）
   ========================================================= */
function createNode(opt){
  const el = document.createElement('div');
  el.className = 'node ' + opt.type;
  el.style.setProperty('--c', opt.color);
  if(opt.type === 'stage' || opt.type === 'event'){
    el.style.setProperty('--cl', shade(opt.color, 0.5));
    el.style.setProperty('--cd', shade(opt.color, -0.6));
  }

  const inner = document.createElement('div');
  inner.className = 'inner';
  if(opt.type === 'root'){
    inner.textContent = opt.name;
  }else if(opt.type === 'stage'){
    inner.innerHTML = `<div class="title">${opt.name}</div>`;
  }else{
    inner.textContent = opt.name;
  }
  el.appendChild(inner);
  nodesLayer.appendChild(el);

  const node = {
    type: opt.type, name: opt.name,
    desc: opt.desc || '', effects: opt.effects || [],
    tags: opt.tags || [], color: opt.color, pos: opt.pos,
    parentPos: opt.parentPos || opt.pos,
    parent: opt.parent || null, children: [], el: el,
    progress: opt.progress || 0, targetProgress: opt.targetProgress || 0,
    expanded: false, screen: null
  };
  el.__node = node;
  nodes.push(node);
  return node;
}

function build(){
  nodesLayer.innerHTML = '';
  nodes.length = 0;
  links.length = 0;

  const root = createNode({ type:'root', name: DATA.name, color: DATA.color, pos: {x:0,y:0,z:0} });
  root.progress = 1; root.targetProgress = 1;

  const N = DATA.children.length;
  // 大幅增加阶段行星与中心的距离
  const R = 900; 

  DATA.children.forEach((stageData, i) => {
    const angle = -Math.PI/2 + (i / N) * Math.PI * 2;
    const stageY = (i - (N-1)/2) * 60; 
    const tpos = { x: Math.cos(angle) * R, y: stageY, z: Math.sin(angle) * R };

    const stageNode = createNode({
      type: 'stage', name: stageData.name, color: stageData.color,
      desc: stageData.desc, pos: tpos, parent: root,
      progress: 1, targetProgress: 1
    });
    root.children.push(stageNode);
    links.push({ from: root, to: stageNode });

    const n = stageData.children.length;
    const dirX = Math.cos(angle);
    const dirZ = Math.sin(angle);

    stageData.children.forEach((evt, j) => {
      // 大幅增加事件星球之间的径向和纵向距离
      const radialOffset = 420 + j * 140;
      const yOffset = (j - (n-1)/2) * 160 + (Math.random()*30 - 15);
      
      const ipos = {
        x: tpos.x + dirX * radialOffset + Math.cos(j) * 60,
        y: stageY + yOffset,
        z: tpos.z + dirZ * radialOffset + Math.sin(j) * 60
      };

      const evtNode = createNode({
        type: 'event', name: evt.name, color: evt.color,
        desc: evt.desc, effects: evt.effects, tags: evt.tags, pos: ipos,
        parentPos: tpos, parent: stageNode,
        progress: 0, targetProgress: 0
      });
      stageNode.children.push(evtNode);
      links.push({ from: stageNode, to: evtNode });
    });
  });
}

/* =========================================================
   星云粒子系统
   ========================================================= */
const stars = [];
for(let i = 0; i < 300; i++){
  stars.push({ x: Math.random(), y: Math.random(), r: Math.random()*0.8+0.2, a: Math.random()*0.5+0.1, p: Math.random()*Math.PI*2, sp: Math.random()*1+0.2 });
}

const nebulaDust = [];
for(let i = 0; i < 40; i++){
  nebulaDust.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 150 + 50,
    vx: (Math.random() - 0.5) * 0.5,
    vy: (Math.random() - 0.5) * 0.5,
    color: Math.random() > 0.5 ? '139,92,246' : (Math.random() > 0.5 ? '6,182,212' : '236,72,153'),
    a: Math.random() * 0.05 + 0.02
  });
}

/* =========================================================
   渲染循环
   ========================================================= */
function render(){
  ctx.clearRect(0, 0, W, H);
  const t = performance.now() * 0.001;

  // 1. 动态星云气体
  ctx.globalCompositeOperation = 'screen';
  nebulaDust.forEach(d => {
    d.x += d.vx; d.y += d.vy;
    if(d.x < -d.r) d.x = W + d.r;
    if(d.x > W + d.r) d.x = -d.r;
    if(d.y < -d.r) d.y = H + d.r;
    if(d.y > H + d.r) d.y = -d.r;

    const grad = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r);
    grad.addColorStop(0, `rgba(${d.color}, ${d.a})`);
    grad.addColorStop(1, `rgba(${d.color}, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';

  // 2. 远景星星
  stars.forEach(s => {
    const tw = 0.5 + Math.sin(t * s.sp + s.p) * 0.5;
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = '#dde8ff';
    ctx.beginPath(); ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // 3. 投影
  nodes.forEach(n => {
    if(n.progress < 0.008){ n.screen = null; return; }
    let p;
    if(n.parentPos && n.progress < 0.999){
      const e = easeOut(n.progress);
      p = { x: lerp(n.parentPos.x, n.pos.x, e), y: lerp(n.parentPos.y, n.pos.y, e), z: lerp(n.parentPos.z, n.pos.z, e) };
    }else p = n.pos;
    n.screen = project(p);
  });

  // 4. 基础树状连线（已加粗 + 发光）
  links.forEach(l => {
    const a = l.from.screen, b = l.to.screen;
    if(!a || !b) return;
    const alpha = Math.min(l.from.progress, l.to.progress) * 0.25; // 提高一点透明度
    if(alpha < 0.015) return;
    
    ctx.save();
    ctx.beginPath(); 
    ctx.moveTo(a.x, a.y); 
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = hexA(l.to.color, alpha);
    
    // ★ 修改这里：加粗基础连线并增加微弱泛光
    const baseWidth = 3.5 * ((a.s + b.s) / 2); 
    ctx.lineWidth = Math.max(1.5, baseWidth);
    ctx.shadowColor = l.to.color;
    ctx.shadowBlur = 8;
    
    ctx.stroke();
    ctx.restore();
  });

  // 5. 跨单元荧光连线
  const sortedCrossLinks = CROSS_LINKS.map(cl => {
    const nf = nodes.find(n => n.name === cl.from);
    const nt = nodes.find(n => n.name === cl.to);
    if(!nf || !nt || !nf.screen || !nt.screen) return null;
    const z = (nf.screen.z + nt.screen.z) / 2;
    return { ...cl, a: nf.screen, b: nt.screen, z, alpha: Math.min(nf.progress, nt.progress) };
  }).filter(Boolean).sort((a, b) => b.z - a.z); 

  sortedCrossLinks.forEach(cl => {
    if(cl.alpha < 0.1) return;
    
    const ax = cl.a.x, ay = cl.a.y;
    const bx = cl.b.x, by = cl.b.y;
    const mx = (ax + bx) / 2, my = (ay + by) / 2;
    
    const dx = bx - ax, dy = by - ay;
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    
    const cx = mx + nx * cl.curve;
    const cy = my + ny * cl.curve;
    
    const depthFactor = clamp(1 - (cl.z + 1000) / 2000, 0.4, 1);
    const baseWidth = 1.5 + depthFactor * 2;
    
    ctx.save();
    // 底层光带
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo(cx, cy, bx, by);
    ctx.strokeStyle = hexA(cl.color, cl.alpha * 0.15);
    ctx.lineWidth = baseWidth * 8;
    ctx.lineCap = 'round';
    ctx.stroke();
    
    // 中间荧光
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo(cx, cy, bx, by);
    ctx.strokeStyle = hexA(cl.color, cl.alpha * 0.4);
    ctx.lineWidth = baseWidth * 3;
    ctx.shadowColor = cl.color;
    ctx.shadowBlur = 15;
    ctx.stroke();

    // 核心实线
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo(cx, cy, bx, by);
    ctx.strokeStyle = hexA('#ffffff', cl.alpha * 0.9);
    ctx.lineWidth = baseWidth * 0.6;
    ctx.stroke();
    
    // 流动粒子
    ctx.beginPath();
    ctx.moveTo(ax, ay);
    ctx.quadraticCurveTo(cx, cy, bx, by);
    ctx.strokeStyle = cl.color;
    ctx.lineWidth = baseWidth;
    ctx.setLineDash([4, 40]);
    ctx.lineDashOffset = -t * 80;
    ctx.stroke();
    ctx.restore();

    // 标签
    const lx = 0.25 * ax + 0.5 * cx + 0.25 * bx;
    const ly = 0.25 * ay + 0.5 * cy + 0.25 * by;
    
    ctx.save();
    ctx.font = 'bold 12px "PingFang SC", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    const textMetrics = ctx.measureText(cl.label);
    const textW = textMetrics.width;
    
    ctx.shadowColor = cl.color;
    ctx.shadowBlur = 10;
    ctx.fillStyle = `rgba(8, 12, 25, ${cl.alpha * 0.9})`;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(lx - textW/2 - 10, ly - 12, textW + 20, 24, 12);
    else ctx.rect(lx - textW/2 - 10, ly - 12, textW + 20, 24);
    ctx.fill();
    ctx.shadowBlur = 0; 
    
    ctx.strokeStyle = hexA(cl.color, cl.alpha * 0.8);
    ctx.lineWidth = 1.2;
    ctx.stroke();

    ctx.fillStyle = hexA('#ffffff', cl.alpha);
    ctx.fillText(cl.label, lx, ly);
    ctx.restore();
  });

  // 6. DOM 更新
  nodes.forEach(n => {
    if(!n.screen){ n.el.style.display = 'none'; return; }
    n.el.style.display = '';
    const s = n.screen;
    n.el.style.opacity = n.progress;
    n.el.style.transform = `translate3d(${s.x}px, ${s.y}px, 0) scale(${s.s}) translate(-50%, -50%)`;
    n.el.style.zIndex = Math.round(2000 - s.z);
  });
}

let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const k = Math.min(1, dt * 14);
  view.rx += (view.targetRx - view.rx) * k;
  view.ry += (view.targetRy - view.ry) * k;
  view.dist += (view.targetDist - view.dist) * k;

  nodes.forEach(n => {
    if(Math.abs(n.progress - n.targetProgress) > 0.002) n.progress += (n.targetProgress - n.progress) * Math.min(1, dt * 8);
    else n.progress = n.targetProgress;
  });

  render();
  requestAnimationFrame(loop);
}

/* =========================================================
   交互逻辑
   ========================================================= */
function setExpanded(node, val){
  node.expanded = val;
  node.el.classList.toggle('open', val);
  node.children.forEach(c => { c.targetProgress = val ? 1 : 0; });
}

function handleNodeClick(el, mouseX, mouseY){
  const node = el.__node;
  if(!node) return;

  if(node.type === 'root'){
    const anyClosed = node.children.some(c => !c.expanded);
    node.children.forEach(c => setExpanded(c, anyClosed));
    hideSidebar(); hidePopover();
  }else if(node.type === 'stage'){
    setExpanded(node, !node.expanded);
    showSidebar(node);
    hidePopover();
  }else if(node.type === 'event'){
    showSidebar(node);
    if(node.tags && node.tags.length > 0){
      showPopover(node, mouseX, mouseY);
    } else {
      hidePopover();
    }
  }
}

function showSidebar(node){
  sidebarTitle.textContent = node.name;
  sidebarTitle.style.color = node.color;
  sidebarContent.style.setProperty('--c', node.color);
  
  sidebarTags.innerHTML = '';
  if(node.tags){
    node.tags.forEach(t => {
      const span = document.createElement('span');
      span.className = 's-tag';
      span.textContent = t;
      sidebarTags.appendChild(span);
    });
  }

  let html = '';
  if(node.desc){
    html += `<div class="sec-title">内容 / 过程</div><p class="desc-text">${node.desc}</p>`;
  }
  if(node.effects && node.effects.length > 0){
    html += `<div class="sec-title">影响 / 意义</div><ul class="effect-list">`;
    node.effects.forEach(e => { html += `<li>${e}</li>`; });
    html += `</ul>`;
  }
  
  sidebarContent.innerHTML = html;
  sidebarContent.scrollTop = 0;
  sidebar.classList.add('show');
}

function hideSidebar(){ sidebar.classList.remove('show'); }

function showPopover(node, x, y){
  let html = '';
  node.tags.forEach(t => {
    html += `<div class="pop-tag"><b>●</b>${t}</div>`;
  });
  popover.innerHTML = html;
  popover.style.setProperty('--c', node.color);
  
  const rect = popover.getBoundingClientRect();
  let left = x + 40;
  let top = y - rect.height / 2;
  
  if(left + rect.width > W) left = x - rect.width - 40;
  if(top < 10) top = 10;
  if(top + rect.height > H - 10) top = H - rect.height - 10;

  popover.style.transform = `translate3d(${left}px, ${top}px, 0)`;
  popover.classList.add('show');
}

function hidePopover(){ popover.classList.remove('show'); }

/* 拖拽与缩放 */
let dragging = false, lastX = 0, lastY = 0, moved = 0, downEl = null;
let downX = 0, downY = 0;
let pinchActive = false, pinchDist0 = 0;

function touchDist(touches){
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

document.addEventListener('pointerdown', e => {
  if(e.target.closest('#sidebar') || e.target.closest('#tools') || e.target.closest('#hud')) return;
  if(pinchActive) return;
  downEl = e.target.closest('.node');
  dragging = true;
  moved = 0;
  lastX = e.clientX; lastY = e.clientY;
  downX = e.clientX; downY = e.clientY;
});

document.addEventListener('pointermove', e => {
  if(!dragging || pinchActive) return;
  const dx = e.clientX - lastX;
  const dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  lastX = e.clientX; lastY = e.clientY;
  view.targetRy += dx * 0.0045;
  view.targetRx -= dy * 0.0045;
  view.targetRx = clamp(view.targetRx, -1.35, 0.5);
});

document.addEventListener('pointerup', e => {
  if(!dragging) return;
  dragging = false;
  if(moved < 10 && downEl){
    handleNodeClick(downEl, downX, downY);
  } else if(moved >= 10) {
    hidePopover();
  }
  downEl = null;
});

document.addEventListener('pointerdown', e => {
  if(!e.target.closest('.node') && !e.target.closest('#sidebar') && !e.target.closest('#popover')){
    hidePopover();
    hideSidebar();
  }
}, true);

document.addEventListener('wheel', e => {
  if(e.target.closest('#sidebar')) return;
  e.preventDefault();
  view.targetDist += e.deltaY * 1.3;
  view.targetDist = clamp(view.targetDist, 800, 6000);
}, { passive:false });

document.addEventListener('touchstart', e => {
  if(e.touches.length === 2){
    pinchActive = true; dragging = false; downEl = null; hidePopover();
    pinchDist0 = touchDist(e.touches);
  }
}, { passive:true });

document.addEventListener('touchmove', e => {
  if(e.touches.length === 2 && pinchActive){
    const d = touchDist(e.touches);
    if(pinchDist0 > 0 && d > 0){
      view.targetDist *= pinchDist0 / d;
      view.targetDist = clamp(view.targetDist, 800, 6000);
    }
    pinchDist0 = d;
  }
}, { passive:true });

document.addEventListener('touchend', e => {
  if(e.touches.length < 2){ pinchActive = false; pinchDist0 = 0; }
}, { passive:true });

/* 按钮 */
document.getElementById('btnReset').addEventListener('click', () => {
  view.targetRx = -0.4; view.targetRy = 0.3;
  view.targetDist = defaultDist();
  hidePopover(); hideSidebar();
});

document.getElementById('btnToggle').addEventListener('click', () => {
  const root = nodes[0];
  if(!root) return;
  const anyClosed = root.children.some(c => !c.expanded);
  root.children.forEach(c => setExpanded(c, anyClosed));
  hidePopover(); hideSidebar();
});

document.getElementById('sidebarClose').addEventListener('click', hideSidebar);

/* 尺寸 */
function defaultDist(){
  const m = Math.min(W, H);
  // 因为节点距离拉大，默认视距也相应拉远
  if(m < 480) return 2800; 
  if(m < 760) return 3200;
  return 3800;
}

function resize(){
  W = window.innerWidth; H = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  scaleBase = Math.min(W, H) / 700;
}

window.addEventListener('resize', () => {
  resize();
  view.targetDist = clamp(view.targetDist, 800, 6000);
});

/* 启动 */
resize();
view.dist = view.targetDist = defaultDist();
build();
requestAnimationFrame(loop);
</script>
