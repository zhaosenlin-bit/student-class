<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>打点计时器模拟｜匀变速直线运动</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e17;
    color: #c8d6e5;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 12px;
    user-select: none;
  }
  .container {
    max-width: 1200px;
    width: 100%;
    background: linear-gradient(145deg, #111827, #0f1729);
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    border: 1px solid rgba(99,102,241,0.15);
  }
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }
  .title {
    font-size: 22px;
    font-weight: 700;
    background: linear-gradient(135deg, #60a5fa, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .title small { font-size: 14px; -webkit-text-fill-color: #64748b; font-weight: 400; }

  .control-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 4px;
    background: rgba(99,102,241,0.06);
    border-radius: 8px;
    padding: 4px 10px;
    border: 1px solid rgba(99,102,241,0.1);
  }
  .ctrl-group label {
    font-size: 12px;
    color: #64748b;
    white-space: nowrap;
  }
  .ctrl-group input[type="range"] {
    width: 80px;
    -webkit-appearance: none;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, #6366f1, #818cf8);
    outline: none;
    cursor: pointer;
  }
  .ctrl-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: linear-gradient(135deg, #818cf8, #6366f1);
    border: 2px solid #0a0e17;
    cursor: pointer;
  }
  .ctrl-group .val {
    font-size: 13px;
    font-weight: 600;
    min-width: 36px;
    text-align: center;
    color: #a5b4fc;
  }

  .mode-btn {
    padding: 4px 12px;
    border: 1px solid rgba(99,102,241,0.2);
    border-radius: 6px;
    background: rgba(99,102,241,0.06);
    color: #94a3b8;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .mode-btn:hover { background: rgba(99,102,241,0.15); color: #e2e8f0; }
  .mode-btn.active { background: rgba(99,102,241,0.2); border-color: #6366f1; color: #a5b4fc; }
  .mode-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .mode-btn.wrong { border-color: #f87171; color: #f87171; background: rgba(248,113,113,0.08); }
  .mode-btn.correct { border-color: #34d399; color: #34d399; background: rgba(52,211,153,0.08); }
  .hook-btns { display: flex; gap: 2px; }

  .main-area {
    display: flex;
    gap: 12px;
  }
  .left-panel { flex: 1.3; display: flex; flex-direction: column; gap: 6px; }
  .right-panel { flex: 1; display: flex; flex-direction: column; gap: 6px; }

  .canvas-wrap {
    background: rgba(15,23,42,0.6);
    border-radius: 12px;
    border: 1px solid rgba(99,102,241,0.12);
    overflow: hidden;
    position: relative;
  }
  .canvas-wrap canvas {
    display: block;
    width: 100%;
    height: auto;
    touch-action: none;
  }

  .label-overlay {
    position: absolute;
    top: 8px;
    left: 14px;
    font-size: 13px;
    font-weight: 600;
    pointer-events: none;
    text-shadow: 0 2px 8px rgba(0,0,0,0.6);
  }

  /* Exp canvas (experiment scene) */
  #expCanvas { aspect-ratio: 640 / 280; }
  /* Tape canvas */
  #tapeCanvas { aspect-ratio: 560 / 200; }

  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    flex-wrap: wrap;
  }
  .ctrl-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid rgba(99,102,241,0.2);
    background: rgba(99,102,241,0.08);
    color: #94a3b8;
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .ctrl-btn:hover { background: rgba(99,102,241,0.2); color: #e2e8f0; }
  .ctrl-btn:active { transform: scale(0.93); }

  .slider-wrap {
    flex: 1;
    min-width: 60px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .slider-wrap input[type="range"] {
    flex: 1;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: linear-gradient(90deg, #6366f1, #818cf8);
    outline: none;
    cursor: pointer;
  }
  .slider-wrap input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, #818cf8, #6366f1);
    border: 2px solid #0a0e17;
    box-shadow: 0 0 8px rgba(99,102,241,0.3);
    cursor: pointer;
  }
  .time-display {
    font-size: 13px;
    font-weight: 600;
    min-width: 40px;
    text-align: center;
    color: #a5b4fc;
  }

  .tips {
    background: rgba(15,23,42,0.6);
    border-radius: 10px;
    border: 1px solid rgba(99,102,241,0.1);
    padding: 8px 14px;
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.6;
    min-height: 30px;
  }
  .tips strong { color: #a5b4fc; }

  /* Ruler practice panel */
  .ruler-panel {
    margin-top: 8px;
    padding: 10px 14px;
    background: rgba(15,23,42,0.6);
    border-radius: 10px;
    border: 1px solid rgba(99,102,241,0.12);
  }
  .ruler-header { font-size: 13px; font-weight: 600; color: #a5b4fc; margin-bottom: 8px; }
  .ruler-segs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .ruler-seg-btn {
    padding: 3px 10px; font-size: 11px; border: 1px solid rgba(99,102,241,0.15);
    border-radius: 5px; background: rgba(99,102,241,0.06); color: #94a3b8;
    cursor: pointer; transition: all 0.15s;
  }
  .ruler-seg-btn:hover { background: rgba(99,102,241,0.12); }
  .ruler-seg-btn.active { background: rgba(99,102,241,0.2); border-color: #6366f1; color: #a5b4fc; }
  .ruler-seg-btn.checked { border-color: #34d399; color: #34d399; }
  .ruler-input-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ruler-input-row input[type="number"] {
    width: 90px; padding: 4px 8px; background: rgba(15,23,42,0.8);
    border: 1px solid rgba(99,102,241,0.2); border-radius: 6px;
    color: #e2e8f0; font-size: 14px; outline: none;
  }
  .ruler-input-row input[type="number"]:focus { border-color: #6366f1; }
  .ruler-feedback { margin-top: 6px; font-size: 12px; min-height: 18px; }
  .ruler-feedback.correct { color: #34d399; }
  .ruler-feedback.wrong { color: #f87171; }
  .ruler-stats { margin-top: 4px; font-size: 11px; color: #64748b; }

  @media (max-width: 860px) {
    .main-area { flex-direction: column; }
    .header { flex-direction: column; align-items: stretch; }
    .title { text-align: center; }
    .control-bar { justify-content: center; }
    .data-panel { grid-template-columns: 1fr 1fr; }
    #tapeCanvas { aspect-ratio: 600 / 160; }
  }
  @media (max-width: 480px) {
    .container { padding: 10px; border-radius: 14px; }
    .title { font-size: 18px; }
    .ctrl-group input[type="range"] { width: 60px; }
    .ctrl-btn { width: 34px; height: 34px; font-size: 15px; }
  }
</style>
</head>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="title">🔬 打点计时器模拟 <small>· 逐差法测加速度</small></div>
    <div class="control-bar">
      <div class="ctrl-group">
        <label>🧲 钩码</label>
        <div class="hook-btns" id="hookBtns">
          <button class="mode-btn" data-hooks="0">0</button>
          <button class="mode-btn active" data-hooks="1">1</button>
          <button class="mode-btn" data-hooks="2">2</button>
          <button class="mode-btn" data-hooks="3">3</button>
          <button class="mode-btn" data-hooks="4">4</button>
          <button class="mode-btn" data-hooks="5">5</button>
        </div>
        <span class="val" id="valA">0.47</span>
      </div>
      <div class="ctrl-group">
        <label>v₀</label>
        <input type="range" id="sliderV0" min="0" max="100" value="0">
        <span class="val" id="valV0">0.00</span>
      </div>
      <div class="ctrl-group" title="标准实验室用电频率为50Hz，另设10Hz/100Hz供拓展演示">
        <label>f<span style="font-size:9px;color:#64748b;">仿真</span></label>
        <input type="range" id="sliderF" min="0" max="2" value="1" step="1">
        <span class="val" id="valF">50Hz</span>
      </div>
      <div>
        <button class="mode-btn active" id="btnElec">⚡ 电磁式</button>
        <button class="mode-btn" id="btnSpark">⚡ 电火花式</button>
      </div>
      <div>
        <button class="mode-btn active" id="btnPowerLow">🔌 4~6V 交流</button>
        <button class="mode-btn" id="btnPowerHigh">🔌 220V 交流</button>
      </div>
      <div>
        <button class="mode-btn" id="btnCountMode">🔢 原始点</button>
        <button class="mode-btn" id="btnRulerMode">📏 显示数值</button>
      </div>
      <div style="display:flex;align-items:center;gap:3px;">
        <button class="mode-btn" id="btnStartPrev" style="font-size:10px;padding:3px 6px;" title="起始点前移">◀</button>
        <span id="startDotLabel" style="font-size:11px;color:#a5b4fc;min-width:50px;text-align:center;">起始#0</span>
        <button class="mode-btn" id="btnStartNext" style="font-size:10px;padding:3px 6px;" title="起始点后移（跳过密集点）">▶</button>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="main-area">
    <div class="left-panel">
      <div class="canvas-wrap">
        <div class="label-overlay">🧪 实验场景</div>
        <canvas id="expCanvas" width="640" height="280"></canvas>
      </div>
      <div class="canvas-wrap">
        <div class="label-overlay">📋 纸带分析 <span style="font-size:11px;font-weight:400;color:#64748b;">· 相邻点间距 s</span></div>
        <canvas id="tapeCanvas" width="560" height="200"></canvas>
      </div>
    </div>
    <div class="right-panel">
      <div class="canvas-wrap" style="flex:1;">
        <div class="label-overlay">📊 逐差法计算</div>
        <canvas id="calcCanvas" width="400" height="300"></canvas>
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="ctrl-btn" id="btnPlay" title="播放/暂停 (Space)">▶</button>
    <button class="ctrl-btn" id="btnReset" title="重置 (R)">⟳</button>
    <button class="ctrl-btn" id="btnStep" title="逐点步进" style="width:auto;padding:0 10px;font-size:13px;">⏭ 步进</button>
    <button class="ctrl-btn" id="btnSpeed" title="切换播放速度" style="width:auto;padding:0 10px;font-size:12px;">🐢 1x</button>
    <div class="slider-wrap">
      <span style="font-size:11px;color:#64748b;">t</span>
      <input type="range" id="timeSlider" min="0" max="1000" value="0">
      <span class="time-display" id="timeDisplay">0.00s</span>
    </div>
  </div>

  <!-- Tips -->
  <div class="tips" id="tipsArea">
    💡 <strong>操作提示</strong>：选择钩码个数（🧲 0~5个）改变牵引力，点击 ▶ 观察打点过程。可用 ◀▶ 按钮跳过前端密集点，选一个清晰的起始点。<br>
    📌 匀变速运动中，相邻相等时间内的位移差 s₂ - s₁ = s₃ - s₂ = ... = aT² &nbsp;|&nbsp; 默认 f=50Hz（标准实验室频率），可切换仿真频率做拓展演示
  </div>

  <!-- Ruler Practice Panel -->
  <div class="ruler-panel" id="rulerPanel" style="display:none;">
    <div class="ruler-header">📏 刻度尺读数练习</div>
    <div class="ruler-segs" id="rulerSegs"></div>
    <div class="ruler-input-row">
      <span style="font-size:12px;color:#94a3b8;">你的读数 (cm) ：</span>
      <input type="number" id="rulerInput" step="0.01" placeholder="如 2.10">
      <button class="ctrl-btn" id="rulerCheck" style="width:auto;padding:0 14px;font-size:13px;">✅ 核对</button>
      <button class="ctrl-btn" id="rulerReveal" style="width:auto;padding:0 14px;font-size:12px;display:none;">👁 显示答案</button>
    </div>
    <div class="ruler-feedback" id="rulerFeedback"></div>
    <div class="ruler-stats" id="rulerStats"></div>
  </div>

      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'i' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u')) ||
      (e.ctrlKey && (e.key === 's' || e.key === 'S'))
    ) {
      e.preventDefault();
      return false;
    }
  });
