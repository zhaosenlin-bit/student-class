<h1 class="center">Fly Through Pyramids</h1>

<p>Use arrow keys, asdf, mouse or touch to fly around. Space to pause.</p> 
<div class="activity" > 

<h3 >Pyramid Scavenger Hunt!</h3> 

<p>As you fly through space, can you find and identify these different pyramids? Check them off as you spot them:</p> 
<ul class="large"> 
	<li><label><input type="checkbox"> <strong>Triangular Pyramid (Tetrahedron)</strong> – Look for 4 faces in total, with a 3-sided triangle base.</label></li> 
	<li><label><input type="checkbox"> <strong>Square Pyramid</strong> – Like the famous pyramids of Egypt, with a 4-sided square base.</label></li> 
	<li><label><input type="checkbox"> <strong>Pentagonal Pyramid</strong> – Has a 5-sided pentagon base.</label></li> 
	<li><label><input type="checkbox"> <strong>Hexagonal Pyramid</strong> – Has a 6-sided hexagon base.</label></li> 
</ul>
