<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>乐启享 · 物理实验</title>
<link rel="icon" href="/brand/favicon.ico">

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#9fc0ee}
#container{position:fixed;inset:0}
#toolbar{position:fixed;left:18px;top:18px;width:108px;background:rgba(245,245,245,.98);border:2px solid #666;border-radius:14px;overflow:hidden;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#toolbarHeader{padding:10px 6px;text-align:center;font-weight:700;font-size:14px;color:#fff;background:#0b4fa3;border-bottom:1px solid #06356f;text-shadow:0 1px 2px rgba(0,0,0,.35)}
#menu{text-align:center;position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:1;background:rgba(255,255,255,.8);padding:10px 20px;border-radius:5px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.toolBtn{width:100%;height:64px;border:0;border-bottom:1px solid #ccc;background:#f2f2f2;cursor:pointer;font-size:15px;font-weight:600}
.toolBtn:hover{background:#e9eef8}
.toolBtn.active{background:#d5e5ff;color:#003b8f}
.toolSmall{height:44px;font-size:14px}
#rightPanel,#editorPanel{position:fixed;right:18px;width:210px;background:rgba(250,250,250,.98);border:2px solid #666;border-radius:14px;padding:12px;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#rightPanel{top:18px}
#editorPanel{top:350px;max-height:calc(100vh - 418px);overflow-y:auto}
#editorTitle{margin-bottom:8px;font-size:18px;font-weight:700;color:#003b8f}
.editorRow{margin:8px 0}
.editorRow label{display:block;margin-bottom:4px;font-size:13px;font-weight:600}
.editorRow input{width:100%;padding:8px;border:1px solid #999;border-radius:8px;font-size:14px}
.editorBtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.editorBtns button{width:100%;flex:none;padding:8px 6px;border:1px solid #777;border-radius:8px;background:#fff;cursor:pointer;font-weight:600}
.editorBtns button:hover{background:#f0f7ff}
.muted{color:#666;font-size:12px}
#meterTools{display:flex;gap:10px;margin-bottom:10px}
.meterBtn{flex:1;height:58px;border:1px solid #aaa;border-radius:10px;background:#fff;cursor:pointer;font-size:28px;font-weight:700}
.meterBtn:hover,.meterBtn.active{background:#d5e5ff;color:#003b8f}
.readoutBox{min-height:120px;padding:10px;border:1px solid #bbb;border-radius:10px;background:#fff;font-size:14px;line-height:1.45}
.noteBox{margin-top:10px;padding:8px;border:1px solid #d7dbe6;border-radius:8px;background:#f5f7fb;font-size:12px;line-height:1.35}
#statusBar{position:fixed;left:140px;right:240px;bottom:14px;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.72);color:#fff;text-align:center;font-size:14px;z-index:20}
.helpBtn{width:100%;margin-top:10px;padding:8px 10px;border:1px solid #777;border-radius:8px;background:#eef4ff;color:#003b8f;font-size:14px;font-weight:700;cursor:pointer}
.helpBtn:hover{background:#dce9ff}
@media(max-height:760px){#editorPanel{top:360px;max-height:calc(100vh - 378px)}}
   .editorBtns button{
 width:100%;
 flex:none;
 padding:8px 6px;
 border:1px solid #777;
 border-radius:8px;
 background:#fff;
 color:#111;
 cursor:pointer;
 font-weight:600;
}

.editorBtns button:hover:not(:disabled){
 background:#f0f7ff;
}

.editorBtns button:disabled{
 background:#e8e8e8;
 color:#777;
 border-color:#999;
 opacity:1;
 cursor:not-allowed;
}
</style>
</head>

<body>

<div id="container"></div>
<div id="menu"><h1>DC Circuit Construction Kit</h1></div>

<div id="toolbar">
<div id="toolbarHeader">乐启享 · 物理实验室</div>
<button class="toolBtn active" data-tool="select">Select</button>
<button class="toolBtn" data-tool="wire">Wire</button>
<button class="toolBtn" data-tool="battery">Battery</button>
<button class="toolBtn" data-tool="resistor">Resistor</button>
<button class="toolBtn" data-tool="bulb">Bulb</button>
<button class="toolBtn" data-tool="switch">Switch</button>
<button class="toolBtn toolSmall" id="toggleLabelsBtn">Hide Labels</button>
<button class="toolBtn toolSmall" id="toggleArrowsBtn">Hide Arrows</button>
<button class="toolBtn toolSmall" id="resetBtn">Reset</button>
<button class="toolBtn toolSmall" id="resetBtn">Reset</button>
</div>

<div id="editorPanel">
<div id="editorTitle">Selected Object</div>
<div id="selectedInfo">None selected.</div>

<div class="editorRow">
<label for="valueInput">Value (Ω or V)</label>
<input id="valueInput" type="number" step="0.1" value="10">
</div>

<div class="editorBtns">
<button id="applyValueBtn">Apply Value</button>
<button id="toggleSwitchBtn">Toggle Switch</button>
</div>

<button id="helpBtn" class="helpBtn">Help</button>
</div>

<div id="rightPanel">
<div id="meterTools">
<button class="meterBtn" id="addVoltmeterBtn" title="Add Voltmeter">V</button>
<button class="meterBtn" id="addAmmeterBtn" title="Add Ammeter">A</button>
</div>

<div class="readoutBox" id="meterReadouts">
<b>Meters</b><br>No meters yet.
</div>

<div class="noteBox">
<b>Use:</b><br>
Voltmeter: connect <b>in parallel</b> across two nodes.<br>
Ammeter: connect <b>in series</b> in the branch.
</div>
</div>

<div id="statusBar">Select mode: click and drag any component.</div>
