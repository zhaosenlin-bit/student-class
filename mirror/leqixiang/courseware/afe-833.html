  if(v.t===1){const done=v.onComplete;viewTransition=null;done?.();controls.enabled=true;planeBtn.disabled=false;controls.update()}
}
function fitPlaneView(){const pose=planeViewPose();camera.position.copy(pose.position);controls.target.copy(pose.target);camera.up.copy(pose.up);camera.lookAt(pose.target);controls.update()}
function enterPlaneView(){
  if(!isFullyUnfolded()||viewTransition)return;
  savedView={position:camera.position.clone(),up:camera.up.clone(),target:controls.target.clone(),minDistance:controls.minDistance,maxDistance:controls.maxDistance};
  planeMode=true;planeAngle=0;planeRotateTarget=null;stage.classList.add('plane-mode');controls.minDistance=20;controls.maxDistance=5000;
  planeBtn.textContent='进入平面图…';
  startViewTransition(planeViewPose(),()=>{controls.enableRotate=false;controls.enablePan=false;planeBtn.textContent='退出平面图';setStatus('平面图模式：点击"数棱"，再依次点击未剪开的棱。')});
}
function exitPlaneView(){
  if(!planeMode||viewTransition||!savedView)return;
  planeRotateTarget=null;edgeCounting=false;stage.classList.remove('counting');edgeCountBtn.classList.remove('active');edgeCountBtn.setAttribute('aria-pressed','false');edgeCountBtn.textContent='数棱';clearEdgeNumbers();
  planeBtn.textContent='退出平面图…';
  startViewTransition(savedView,()=>{planeMode=false;stage.classList.remove('plane-mode');controls.enableRotate=true;controls.enablePan=true;controls.minDistance=savedView.minDistance;controls.maxDistance=savedView.maxDistance;savedView=null;planeBtn.textContent='查看平面图';setStatus('已退出平面图，恢复原来的 3D 视角。')});
}
function setStatus(msg){
  if(!msg){statusEl.textContent='';return}
  statusEl.innerHTML=msg;statusEl.classList.remove('fading');
  clearTimeout(statusTimer);statusTimer=setTimeout(()=>statusEl.classList.add('fading'),3200);
}
function showBlockedHint(point,message='这条棱不能剪'){
  if(!point)return;
  const hint=document.createElement('span');hint.className='blocked-hint';hint.textContent=message;
  hint.style.left=`${point.x}px`;hint.style.top=`${point.y}px`;stage.append(hint);
  hint.addEventListener('animationend',()=>hint.remove(),{once:true});
}
function showSuccessHint(point){
  if(!point)return;
  const hint=document.createElement('span');hint.className='success-hint';hint.textContent='剪开成功';
  hint.style.left=`${point.x}px`;hint.style.top=`${point.y}px`;stage.append(hint);
  hint.addEventListener('animationend',()=>hint.remove(),{once:true});
}
function edgeScreenPoints(i){
  const owner=EDGES[i][0],points=localEdgePoints[i][owner].map(p=>p.clone().applyMatrix4(meshes[owner].matrix).applyMatrix4(model.matrixWorld)),rect=canvas.getBoundingClientRect();
  return points.map(p=>{p.project(camera);return{x:(p.x+1)*rect.width/2,y:(1-p.y)*rect.height/2}});
}
function animateEdgeCut(i,onDone,duration=420){
  const [a,b]=edgeScreenPoints(i),dx=b.x-a.x,dy=b.y-a.y,distance=Math.hypot(dx,dy),angle=`${Math.atan2(dy,dx)}rad`;
  const trail=document.createElement('i'),scissor=document.createElement('i');
  trail.className='edge-cut-trail';trail.style.left=`${a.x}px`;trail.style.top=`${a.y}px`;trail.style.width=`${distance}px`;trail.style.setProperty('--angle',angle);trail.style.animationDuration=`${duration}ms`;
  scissor.className='edge-scissor';scissor.style.left=`${a.x}px`;scissor.style.top=`${a.y}px`;scissor.style.setProperty('--dx',`${dx}px`);scissor.style.setProperty('--dy',`${dy}px`);scissor.style.setProperty('--angle',angle);scissor.style.animationDuration=`${duration}ms`;
  scissor.innerHTML='<svg viewBox="0 0 64 40" aria-hidden="true"><circle cx="12" cy="10" r="7" fill="#fff" stroke="#f07d19" stroke-width="5"/><circle cx="12" cy="30" r="7" fill="#fff" stroke="#f07d19" stroke-width="5"/><path d="M17 14L27 20M17 26L27 20" fill="none" stroke="#3a4b55" stroke-width="5" stroke-linecap="round"/><g class="blade-top"><path d="M24 19L60 3L33 23Z" fill="#eef5f7" stroke="#344b58" stroke-width="2" stroke-linejoin="round"/></g><g class="blade-bottom"><path d="M24 21L60 37L33 17Z" fill="#d9e5ea" stroke="#344b58" stroke-width="2" stroke-linejoin="round"/></g><circle cx="25" cy="20" r="3.5" fill="#ffd166" stroke="#344b58" stroke-width="2"/></svg>';
  stage.append(trail,scissor);
  const finish=e=>{if(e.target!==scissor)return;scissor.removeEventListener('animationend',finish);trail.remove();scissor.remove();onDone?.()};
  scissor.addEventListener('animationend',finish);
}
function commitCut(i,point){
  history.push({kind:'cut',cut:[...cut],unfolded:new Set(unfolded)});
  showSuccessHint(point);lines[i].userData.fade=1;cut.push(i);markNewLeaves();rebuildState(true);renderButtons();
  const movable=FACES.filter(f=>f!==tree.root&&targets[f]===1);
  setStatus(cut.length===7?'剪切完成：所有只通过一条铰链连接的分支正在完整展开。':movable.length?`可展开分支：<b>${movable.join('、')}</b>。相连的面会作为整体一起运动。`:'剪开成功，继续选择棱线。');
}
function cutEdge(i,point){
  if(animating||cuttingAnimation){setStatus('正在剪开或展开，请等待动画结束。');return}
  if(cut.includes(i)){setStatus('这条棱已经剪开并锁定。需要回退请使用"撤销一步"。');return}
  if(!connected([...cut,i])){showBlockedHint(point);setStatus('不能剪开这条棱：它是保持六个面连通的最后连接之一。');return}
  cuttingAnimation=true;controls.enabled=false;setStatus('剪刀正沿着整条棱剪开…');
  animateEdgeCut(i,()=>{cuttingAnimation=false;controls.enabled=true;commitCut(i,point)});
}

function applyPreset(id){
  const preset=PRESETS[id];
  if(!preset||animating||cuttingAnimation||viewTransition||planeMode)return;
  cut=[];history=[];unfolded.clear();amount={};targets={};pendingUndo=null;pendingRestore=false;clearEdgeNumbers();build();
  cuttingAnimation=true;controls.enabled=false;setStatus(`${preset.name}：正在依次剪开 7 条棱…`);
  let step=0;
  const next=()=>{
    if(step<preset.cut.length){animateEdgeCut(preset.cut[step++],next,320);return}
    cut=[...preset.cut];for(const i of cut)lines[i].userData.fade=1;markNewLeaves();
    cuttingAnimation=false;controls.enabled=true;rebuildState(true);renderButtons();
    setStatus(`${preset.name}已剪好，正在展开；完成后可点击"查看平面图"。`);
  };
  next();
}

let pointerStart=null;
canvas.addEventListener('pointerdown',e=>{if(e.button!==0||viewTransition||planeRotateTarget!=null||cuttingAnimation||(planeMode&&!edgeCounting))return;pointerStart=[e.clientX,e.clientY]});
canvas.addEventListener('pointerup',e=>{
  if(!pointerStart||Math.hypot(e.clientX-pointerStart[0],e.clientY-pointerStart[1])>5){pointerStart=null;return}
  pointerStart=null;
  const rect=canvas.getBoundingClientRect();
  mouse.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);
  raycaster.setFromCamera(mouse,camera);
  const hit=raycaster.intersectObjects([...edgeOutlines,...lines],false).find(item=>item.object.visible&&!cut.includes(item.object.userData.edge));
  if(!hit)return;
  const point={x:e.clientX-rect.left,y:e.clientY-rect.top};
  if(planeMode&&edgeCounting)numberEdge(hit.object.userData.edge,point);
  else if(!planeMode)cutEdge(hit.object.userData.edge,point);
});
canvas.addEventListener('pointerleave',()=>{pointerStart=null});
function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
function finishUndo(){const prev=pendingUndo;pendingUndo=null;cut=prev.cut;unfolded=prev.unfolded;rebuildState(false);renderButtons();setStatus('已通过折叠动画恢复到上一步状态。')}
function finishRestore(){pendingRestore=false;cut=[];unfolded.clear();rebuildState(false);renderButtons();setStatus('已沿原展开路径复原成长方体；可撤销本次复原。')}
function tick(){
  requestAnimationFrame(tick);
  let moving=false;
  for(const face of FACES){
    const current=amount[face]||0,target=targets[face]||0;
    if(Math.abs(target-current)>.001){amount[face]=THREE.MathUtils.lerp(current,target,.09);moving=true}
    else amount[face]=target;
  }
  animating=moving;updateGeometry();
  if(!moving&&pendingUndo)finishUndo();else if(!moving&&pendingRestore)finishRestore();
  if(planeMode&&planeRotateTarget!=null&&!viewTransition){
    const delta=planeRotateTarget-planeAngle;
    if(Math.abs(delta)<.002){planeAngle=planeRotateTarget;planeRotateTarget=null}
    else planeAngle+=delta*.13;
    camera.up.set(Math.sin(planeAngle),0,-Math.cos(planeAngle));camera.lookAt(controls.target);
  }
  updateControlVisibility();
  if(viewTransition)updateViewTransition();else controls.update();
  if(document.activeElement!==zoomInput){
    const percent=THREE.MathUtils.clamp(Math.round(DEFAULT_CAMERA_DISTANCE/camera.position.distanceTo(controls.target)*100/5)*5,50,160);
    zoomInput.value=percent;zoomValue.value=`${percent}%`;
  }
  renderer.render(scene,camera);
}

undoBtn.onclick=()=>{
  if(planeMode){if(viewTransition||planeRotateTarget!=null)return;planeRotateTarget=planeAngle-Math.PI/2;return}
  if(animating||cuttingAnimation||pendingUndo||pendingRestore){setStatus('请等待当前动画结束后再撤销。');return}
  const prev=history.pop();
  if(!prev){setStatus('没有可以撤销的操作。');return}
  if(prev.kind==='restore'){cut=prev.cut;unfolded=prev.unfolded;rebuildState(true);renderButtons();setStatus('正在撤销复原操作。');return}
  pendingUndo=prev;
  const previousBridges=bridgeEdges(prev.cut);
  for(const face of FACES)targets[face]=face===tree.root?0:(previousBridges.has(tree.parentEdge[face])?1:0);
  animating=FACES.some(face=>Math.abs((targets[face]||0)-(amount[face]||0))>.001);
  if(!animating)finishUndo();else setStatus('正在沿原铰链撤销上一步。');
};
resetBtn.onclick=()=>{
  if(animating||cuttingAnimation||pendingUndo||pendingRestore){setStatus('请等待当前动画结束后再复原。');return}
  if(!cut.length){setStatus('当前已经是完整长方体。');return}
  history.push({kind:'restore',cut:[...cut],unfolded:new Set(unfolded)});
  pendingRestore=true;
  for(const face of FACES)targets[face]=0;
  animating=FACES.some(face=>Math.abs(amount[face]||0)>.001);
  if(!animating)finishRestore();else setStatus('正在沿当前展开图的原铰链逐层复原。');
};
zoomInput.oninput=()=>{
  if(viewTransition)return;
  const percent=+zoomInput.value,direction=camera.position.clone().sub(controls.target).normalize(),distance=DEFAULT_CAMERA_DISTANCE*100/percent;
  camera.position.copy(controls.target).addScaledVector(direction,distance);zoomValue.value=`${percent}%`;controls.update();
};
planeBtn.onclick=()=>planeMode?exitPlaneView():enterPlaneView();
viewResetBtn.onclick=()=>{
  if(viewTransition)return;
  if(planeMode){planeRotateTarget=null;planeAngle=0;startViewTransition(planeViewPose(),()=>{controls.enableRotate=false;controls.enablePan=false;setStatus('平面图方向与缩放已重置。')});return}
  startViewTransition({position:DEFAULT_CAMERA_POSITION,target:DEFAULT_CAMERA_TARGET,up:new THREE.Vector3(0,1,0)},()=>{zoomInput.value=100;zoomValue.value='100%';setStatus('观察视角已重置。')});
};
appResetBtn.onclick=()=>{
  if(cuttingAnimation){setStatus('请等待剪刀动画结束后再重置。');return}
  viewTransition=null;planeMode=false;planeAngle=0;planeRotateTarget=null;savedView=null;pendingUndo=null;pendingRestore=false;animating=false;edgeCounting=false;showFaceLabels=false;
  stage.classList.remove('plane-mode','counting');controls.enabled=true;controls.enableRotate=true;controls.enablePan=true;controls.minDistance=190;controls.maxDistance=750;
  cut=[];history=[];unfolded.clear();amount={};targets={};tree=null;
  lengthInput.value=4;widthInput.value=3;heightInput.value=7;lengthValue.value=4;widthValue.value=3;heightValue.value=7;
  camera.position.copy(DEFAULT_CAMERA_POSITION);camera.up.set(0,1,0);controls.target.copy(DEFAULT_CAMERA_TARGET);
  zoomInput.value=100;zoomValue.value='100%';planeBtn.textContent='查看平面图';
  build();controls.update();setStatus('已恢复默认尺寸、完整长方体和初始视角。');
};
fullscreenBtn.onclick=()=>{
  if(document.fullscreenElement){document.exitFullscreen();return}
  document.documentElement.requestFullscreen().catch(()=>setStatus('当前浏览器不支持全屏或请求被拒绝。'));
};
document.addEventListener('fullscreenchange',()=>{fullscreenBtn.textContent=document.fullscreenElement?'退出全屏':'全屏'});
edgeCountBtn.onclick=()=>{
  if(!planeMode||viewTransition)return;
  if(!edgeCounting){clearEdgeNumbers();edgeCounting=true;stage.classList.add('counting');edgeCountBtn.classList.add('active');edgeCountBtn.setAttribute('aria-pressed','true');edgeCountBtn.textContent='结束数棱';setStatus('数棱已开始：请依次点击蓝色、未剪开的棱。');return}
  edgeCounting=false;stage.classList.remove('counting');edgeCountBtn.classList.remove('active');edgeCountBtn.setAttribute('aria-pressed','false');edgeCountBtn.textContent='重新数棱';setStatus(`数棱结束，共标记 ${edgeNumberLabels.size} 条。`);
};
for(const btn of presetButtons)btn.onclick=()=>applyPreset(btn.dataset.preset);
labelsToggleBtn.onclick=()=>{showFaceLabels=!showFaceLabels;updateFaceLabelVisibility()};
[[lengthInput,lengthValue],[widthInput,widthValue],[heightInput,heightValue]].forEach(([input,output])=>input.oninput=()=>{
  output.value=input.value;
  if(animating||cuttingAnimation){setStatus('请等待动画结束后再修改尺寸。');return}
  build();
});
build();tick();
</script>

  // 防右键
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });

  // 防键盘快捷键: F12 | Ctrl+Shift+I | Ctrl+Shift+J | Ctrl+U | Ctrl+S
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'i' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u')) ||
      (e.ctrlKey && (e.key === 's' || e.key === 'S'))
    ) {

      return false;

  // DevTools 检测（基于 debugger 语句执行耗时）

})();
