    body{ margin:0; overflow:hidden; font-family: Arial, sans-serif; color:#111; }
    #viewport{ position:fixed; inset:0; }

    /* top title strip */
    #topbar{
      position:fixed; left:0; right:0; top:0;
      padding:10px 16px;
      text-align:center;
      z-index:10;
      pointer-events:none;
      text-shadow: 0 1px 0 rgba(255,255,255,0.6);
    }
    #topbar h2{ margin:0; font-size:26px; font-weight:700; }
    #problemText{
      margin-top:6px;
      font-size:13px;
      opacity:0.9;
    }

    /* panels */
    .panelBox{
      position:fixed;
      top:90px;
      width:260px;
      background: rgba(245,245,245,0.95);
      border: 2px solid #333;
      border-radius: 12px;
      padding: 14px 14px 12px;
      z-index: 20;
      box-shadow: 0 10px 22px rgba(0,0,0,0.18);
      backdrop-filter: blur(2px);
    }
    #leftPanel{ left:16px; }
    #rightPanel{ right:16px; width:280px; }

    .panelTitle{
      font-size:14px;
      font-weight:700;
      margin:0 0 10px;
      text-align:left;
    }

    .rowItem{ margin:10px 0 14px; }
    .rowTop{
      display:flex;
      justify-content:space-between;
      align-items:baseline;
      gap:10px;
      font-size:12px;
      font-weight:700;
    }
    .valueTag{
      font-weight:700;
      color:#0b57d0;
      min-width:86px;
      text-align:right;
    }

    input[type="range"]{ width:100%; accent-color:#0b57d0; }

    .smallNote{ font-size:12px; opacity:0.85; margin-top:8px; }

    /* right panel layout */
    .fieldLine{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
    .fieldLine label{ font-size:12px; font-weight:700; margin:0; white-space:nowrap; }
    #studentName{
      flex:1;
      height:28px;
      border:1px solid #bbb;
      border-radius:8px;
      padding:0 10px;
      font-size:12px;
      background:#fff;
    }

    .btn-Row{ display:flex; gap:8px; justify-content:center; margin:10px 0 8px; }
    .btnRow .btn{ min-width:110px; border-radius:8px; }

    .answerRow{
      display:flex; align-items:center; justify-content:center; gap:8px;
      font-size:12px; margin:8px 0 6px;
    }
    #answer{
      width:70px;
      height:28px;
      border:1px solid #bbb;
      border-radius:8px;
      padding:0 8px;
      font-size:12px;
      text-align:center;
    }

    #resultMsg{ font-size:12px; font-weight:700; text-align:center; margin-top:6px; min-height:18px; }
    #homeBtn{ display:block; margin:10px auto 0; width:100%; border-radius:8px; }

    /* responsive */
    @media (max-width: 900px){
      .panelBox{ top:auto; bottom:14px; }
      #leftPanel{ left:14px; }
      #rightPanel{ right:14px; }
      #topbar{ position:fixed; top:0; }
    }
  </style>
