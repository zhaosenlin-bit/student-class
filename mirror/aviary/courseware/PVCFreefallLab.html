/* called by onLoad */

function initialize(){
	SwitchLanguage(languagenumber);

	/* Initial Conditions */
	DropStatus = "none";
	planet = 2;
	materialnumber = 0;
	timeinsec = 0;
	blocked = "false";
	unblocked = "false";
	textcolornow = "#990000";
		
	CylinderCenterX = 300;
	CylinderHalfWidth = 20;
	CylinderHeight = 75;
	CylinderCurve = 5;
	CylinderTopY = 10;
	OriginalTopY = CylinderTopY;

	PVCColor1 = "#FFFFFF";
	PVCColor2 = "#DDDDDD";
	PVCCenterX = 300;
	PVCTopY = 75;
	PVCHalfWidth = 25;
	PVCHeight = 750;
	PVCCurve = 10;
	
	PhotogateHalfWidth = 100;
	PhotogateHeight = 20;
	PhotogateCenterX = 300;
	PhotogateTopY = 865;
	
	HoleSpacingPVC = 75;
	
	NailStartX = 235;
	NailLength = 110;
	
	document.getElementById("PullNailButton").style.visibility = "hidden";
	document.getElementById("ResetButton").style.visibility = "hidden";
	
	NailPlacementSwitch();

	theCanvas = document.getElementById("CanvasOne");
	ctx = theCanvas.getContext("2d");
	
	
}



/* Called by the Begin Button */

function LoadIt(){
	document.getElementById("LabSection").style.visibility = "visible";
	document.getElementById("OverviewSection").style.visibility = "hidden";
	StartItMoving = setInterval(drawingpart, 20);
}


function drawingpart(){
			
	/* 	background drawing */

	ctx.fillStyle="#FFFFFF";
	ctx.fillRect(0,0,600,900);
	
	d = new Date();
	nowtime = d.getTime();
	
	
	if (DropStatus == "adding"){
		
		
		if (CylinderTopY+CylinderHeight < NailStartY){
			timeinsec = (nowtime-starttime)/5000;
			CylinderTopY = OriginalTopY + .5*AccelerationDueToGravity[planet]*timeinsec*timeinsec*1500;
			DrawNail();
		}
		else{
			CylinderTopY = NailStartY - CylinderHeight;
			document.getElementById("PullNailButton").style.visibility = "visible";
			DrawNail();
		}
	}
	
	
	if (DropStatus == "falling"){
		if (CylinderTopY+CylinderHeight < 1050){
			timeinsec = (nowtime-startfalltime)/5000;
			CylinderTopY = OriginalDropTopY + .5*AccelerationDueToGravity[planet]*timeinsec*timeinsec*1500;
			
		}
		else{
			document.getElementById("ResetButton").style.visibility = "visible";
		}
		
	}

	if (DropStatus == "none"){
		DrawNail();
	}
	
BackOfCylinder(PVCCenterX,PVCTopY,PVCHalfWidth,PVCHeight,PVCCurve,PVCColor1,PVCColor2,3);
	
Cylinder(CylinderCenterX,CylinderTopY,CylinderHalfWidth,CylinderHeight,CylinderCurve,MaterialTopColor[materialnumber], MaterialBodyColor[materialnumber],1);

	ctx.globalAlpha = 0.9;
FrontOfCylinder(PVCCenterX,PVCTopY,PVCHalfWidth,PVCHeight,PVCCurve,PVCColor1,PVCColor2,3);
	ctx.globalAlpha = 1.0;
	
	
	for (i = 0; i<9; i++){
		ctx.strokeStyle = "#000000";
		ctx.beginPath();
		ctx.moveTo(PVCCenterX+PVCHalfWidth, PVCTopY+PVCHeight-(i+1)*HoleSpacingPVC+10);
		ctx.bezierCurveTo(PVCCenterX+PVCHalfWidth-5,PVCTopY+PVCHeight-(i+1)*HoleSpacingPVC+10,PVCCenterX+PVCHalfWidth-5,PVCTopY+PVCHeight-(i+1)*HoleSpacingPVC-10,PVCCenterX+PVCHalfWidth, PVCTopY+PVCHeight-(i+1)*HoleSpacingPVC-10);
		ctx.stroke();
		ctx.closePath();
		ctx.fillStyle = "#666666";
		ctx.fill();
		
		ctx.strokeStyle = "#000000";
		ctx.beginPath();
		ctx.moveTo(PVCCenterX-PVCHalfWidth, PVCTopY+PVCHeight-(i+1)*HoleSpacingPVC+10);
		ctx.bezierCurveTo(PVCCenterX-PVCHalfWidth+5,PVCTopY+PVCHeight-(i+1)*HoleSpacingPVC+10,PVCCenterX-PVCHalfWidth+5,PVCTopY+PVCHeight-(i+1)*HoleSpacingPVC-10,PVCCenterX-PVCHalfWidth, PVCTopY+PVCHeight-(i+1)*HoleSpacingPVC-10);
		ctx.stroke();
		ctx.closePath();
		ctx.fillStyle = "#666666";
		ctx.fill();
		
		ctx.strokeStyle = "#990000";
		ctx.beginPath();
		ctx.moveTo(PVCCenterX+PVCHalfWidth, PVCTopY+PVCHeight-(i+1)*HoleSpacingPVC);
		ctx.bezierCurveTo(PVCCenterX+PVCHalfWidth,PVCTopY+PVCHeight-(i+1)*HoleSpacingPVC+PVCCurve,PVCCenterX-PVCHalfWidth,PVCTopY+PVCHeight-(i+1)*HoleSpacingPVC+PVCCurve,PVCCenterX-PVCHalfWidth, PVCTopY+PVCHeight-(i+1)*HoleSpacingPVC);
		ctx.stroke();


	}
	
		
	ctx.font="22px Arial";
	ctx.fillStyle=textcolornow;
	temptext = Composition[languagenumber];
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = 140 - textWidth/2;
	ctx.fillText(temptext,xposition, 50);
	
	ctx.font="32px Arial";
	ctx.fillStyle=textcolornow;
	if (languagenumber == 0){
		temptext = Material[materialnumber];
	}
	if (languagenumber == 1){
		temptext = MaterialPortuguese[materialnumber];
	}
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = 140 - textWidth/2;
	ctx.fillText(temptext,xposition, 90);
	
	
	ctx.font="22px Arial";
	ctx.fillStyle=textcolornow;
	temptext = ExLocation[languagenumber];
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = 450 - textWidth/2;
	ctx.fillText(temptext,xposition, 50);
	
	ctx.font="32px Arial";
	ctx.fillStyle=textcolornow;
	if (languagenumber == 0){
		temptext = GravityBody[planet];
	}
	if (languagenumber == 1){
		temptext = GravityBodyPortuguese[planet];
	}
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = 450 - textWidth/2;
	ctx.fillText(temptext,xposition, 90);
	
	
	ctx.font="22px Arial";
	ctx.fillStyle=textcolornow;
	temptext = NailWord[languagenumber];
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = 140 - textWidth/2;
	ctx.fillText(temptext,xposition, 450);
	
	
	ctx.font="26px Arial";
	ctx.fillStyle=textcolornow;
	temptext = NailPlacement;
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = 140 - textWidth/2;
	ctx.fillText(temptext,xposition, 485);
	
	Photogate(PhotogateCenterX, PhotogateTopY, PhotogateHalfWidth, PhotogateHeight);
	
	if (CylinderTopY+CylinderHeight > 850 && CylinderTopY < 850){
		/* Red Indicator Light */
		ctx.lineWidth = 1;
		ctx.strokeStyle = "#FFFFFF";
		ctx.fillStyle = "#FF0000";
		
		ctx.beginPath();
		ctx.arc(PhotogateCenterX-0.8*PhotogateHalfWidth, PhotogateTopY+0.5*PhotogateHeight, 0.2*PhotogateHeight, 0, 2*Math.PI);
		ctx.stroke();
		ctx.closePath();
		ctx.fill();
	}
	
	if (CylinderTopY+CylinderHeight > 850){
		ctx.font="18px Arial";
		ctx.fillStyle="#000000";
		temptext = "Gate 1 Blocked: " + timeblocked.toFixed(4) + " s";
		metrics = ctx.measureText(temptext);
		textWidth = metrics.width;
		xposition = 265 - textWidth;
		ctx.fillText(temptext,xposition, 770);
		blocked = "true";
	}
	
	if (CylinderTopY > 850){
		ctx.font="18px Arial";
		ctx.fillStyle="#000000";
		if (unblocked == "false"){
			timetotal2 = (nowtime-starttime)/1000;
		}
		temptext = "Gate 1 Unblocked: " + timeunblocked.toFixed(4) + " s";
		metrics = ctx.measureText(temptext);
		textWidth = metrics.width;
		xposition = 265 - textWidth;
		ctx.fillText(temptext,xposition, 800);
		unblocked = "true";
	}
}


function SwitchPlanet(){
	
	planet++;
	
	if (planet > 5){
		planet = 0;
	}
}

function SwitchMaterial(){
	
	
	materialnumber++;
	
	if (materialnumber > 4){
		materialnumber = 0;
	}
	
}

function NailPlacementSwitch(){

	NailPlacement = Math.floor(Math.random()*9+1);
	NailStartY = PVCTopY+PVCHeight-NailPlacement*HoleSpacingPVC;
	OriginalDropTopY = NailStartY-CylinderHeight;
	document.getElementById("PullNailButton").style.top = NailStartY-25;
	
}

function AddCylinderSwitch(){

	DropStatus = "adding";

function Cylinder(ccx,cty,chw,ch,cc,cc1,cc2,lw){
	
/* ccx:  cylinder center x cty:  cylinder top y  chw:  cylinder halfwidth ch: cylinder height  cc:  cylinder curve  cc1:  cylinder top color  cc2:  cylinder color  lw:  linewidth */
	
	ctx.lineWidth = lw;
	ctx.strokeStyle = "#000000";
	ctx.beginPath();
	ctx.moveTo(ccx-chw, cty);
	ctx.bezierCurveTo(ccx-chw,cty+cc,ccx+chw,cty+cc,ccx+chw,cty);
	ctx.lineTo(ccx+chw,cty+ch);
	ctx.bezierCurveTo(ccx+chw,cty+ch+cc,ccx-chw,cty+ch+cc,ccx-chw,cty+ch);
	ctx.lineTo(ccx-chw, cty);
	ctx.stroke();
	ctx.closePath();
	ctx.fillStyle = cc2;
	ctx.fill();
	
	ctx.lineWidth = lw;
	ctx.strokeStyle = "#000000";
	ctx.beginPath();
	ctx.moveTo(ccx-chw, cty);
	ctx.bezierCurveTo(ccx-chw,cty-cc,ccx+chw,cty-cc,ccx+chw,cty);
	ctx.moveTo(ccx-chw, cty);
	ctx.bezierCurveTo(ccx-chw,cty+cc,ccx+chw,cty+cc,ccx+chw,cty);
	ctx.stroke();
	ctx.closePath();
	ctx.fillStyle = cc1;
	ctx.fill();
	
	
}

function Photogate(pcx, pty, phw, ph){

	/* support metal */
	ctx.lineWidth = 8;
	ctx.strokeStyle = "#C0C0C0";
	
	ctx.beginPath();
	ctx.moveTo(pcx-phw, pty+0.4*ph);
	ctx.lineTo(-10, pty+0.4*ph);
	ctx.stroke();
	ctx.closePath();
	

	ctx.lineWidth = 1;
	ctx.strokeStyle = "#999999";
	ctx.fillStyle = "#333333";
	
	/* Left Side */
	ctx.beginPath();
	
	ctx.moveTo(pcx-phw+2.0*ph, pty-2.0*ph);
	
	ctx.lineTo(pcx-phw+2.0*ph, pty-1.0*ph);
	
	ctx.lineTo(pcx-phw+1.0*ph, pty+1.0*ph);
	
	ctx.lineTo(pcx-phw+1.0*ph, pty);
	
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	
	/* Top */
	ctx.beginPath();
	ctx.moveTo(pcx+phw, pty);
	
	ctx.lineTo(pcx+phw+1.0*ph, pty-2.0*ph);
	
	ctx.lineTo(pcx+phw, pty-2.0*ph);
	
	ctx.lineTo(pcx+phw-0.75*ph, pty-0.5*ph);
	
	ctx.lineTo(pcx-phw+1.25*ph, pty-0.5*ph);
	
	ctx.lineTo(pcx-phw+2.0*ph, pty-2.0*ph);
	
	ctx.lineTo(pcx-phw+1.0*ph, pty-2.0*ph);
	
	ctx.lineTo(pcx-phw, pty);
	ctx.lineTo(pcx-phw, pty+ph);
	ctx.lineTo(pcx+phw, pty+ph);
	ctx.lineTo(pcx+phw, pty);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	
	
	/* Front Side */
	ctx.beginPath();
	ctx.moveTo(pcx, pty);
	ctx.lineTo(pcx+phw, pty);
	ctx.lineTo(pcx+phw, pty+ph);
	ctx.lineTo(pcx-phw, pty+ph);
	ctx.lineTo(pcx-phw, pty);
	ctx.lineTo(pcx, pty);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	
	/* Right Side */
	ctx.beginPath();
	ctx.moveTo(pcx+phw, pty+ph);
	
	ctx.lineTo(pcx+phw+1.0*ph, pty-1.0*ph);
	
	ctx.lineTo(pcx+phw+1.0*ph, pty-2.0*ph);
	
	ctx.lineTo(pcx+phw, pty);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	
	
	/* line on top right side */
	ctx.beginPath();
	ctx.moveTo(pcx+phw, pty);
	ctx.lineTo(pcx+phw-0.75*ph, pty-0.5*ph);
	ctx.stroke();
	ctx.closePath();
	
	/* Text on Front */
	ctx.font="10px Arial";
	ctx.fillStyle="#FFFFFF";
	temptext = "Vernier Photogate";
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = pcx + 0.2*phw - textWidth/2;
	ctx.fillText(temptext,xposition, pty+0.7*ph);
	
	/* Red Indicator Light */
	ctx.lineWidth = 1;
	ctx.strokeStyle = "#FFFFFF";
	ctx.fillStyle = "#660000";
	
	ctx.beginPath();
	ctx.arc(pcx-0.8*phw, pty+0.5*ph, 0.2*ph, 0, 2*Math.PI);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();


}

function CylindricalMass(ccx,cty,size,cc1,cc2){
	
/* ccx:  cylinder center x cty:  cylinder top y  chw:  cylinder halfwidth ch: cylinder height  cc:  cylinder curve  cc1:  cylinder top color  cc2:  cylinder color  lw:  linewidth */
	
	ctx.lineWidth = 0.02*size;
	ctx.strokeStyle = "#000000";
	ctx.beginPath();
	ctx.moveTo(ccx-0.5*size, cty);
	ctx.bezierCurveTo(ccx-0.5*size,cty+0.05*size,ccx+0.5*size,cty+0.05*size,ccx+0.5*size,cty);
	ctx.lineTo(ccx+0.5*size,cty+1.5*size);
	ctx.bezierCurveTo(ccx+0.5*size,cty+1.5*size+0.05*size,ccx-0.5*size,cty+1.5*size+0.05*size,ccx-0.5*size,cty+1.5*size);
	ctx.lineTo(ccx-0.5*size, cty);
	ctx.stroke();
	ctx.closePath();
	ctx.fillStyle = cc2;
	ctx.fill();
	
	ctx.lineWidth = 0.02*size;
	ctx.strokeStyle = "#000000";
	ctx.beginPath();
	ctx.moveTo(ccx-0.5*size, cty);
	ctx.bezierCurveTo(ccx-0.5*size,cty-0.05*size,ccx+0.5*size,cty-0.05*size,ccx+0.5*size,cty);
	ctx.moveTo(ccx-0.5*size, cty);
	ctx.bezierCurveTo(ccx-0.5*size,cty+0.05*size,ccx+0.5*size,cty+0.05*size,ccx+0.5*size,cty);
	ctx.stroke();
	ctx.closePath();
	ctx.fillStyle = cc1;
	ctx.fill();
	
	ctx.lineWidth = 4;
	ctx.strokeStyle = cc2;
	ctx.beginPath();
	ctx.moveTo(ccx, cty-0.025*size);
	ctx.lineTo(ccx, cty-0.025*size-20);
	ctx.arc(ccx, cty-0.025*size-20-7, 10, Math.PI/2, Math.PI, true);
	ctx.stroke();
	ctx.closePath();
	
	
	
}

function LabQuestOnOne(x,y,hw,lqh,lqc, u){

	/* Calculates the time to go on the LabQuest display */
	
	d = new Date();
	
	h = d.getHours();
	m = d.getMinutes();
	
	z = "AM";
	
	if (h == 0){
		h = 12;
	}
	if (h > 12){
		h = h - 12;
		z = "PM";
	}
	
	if (h < 10){
		h = "0" + h;
	}
	
	if (m < 10){
		m = "0" + m;
	}
	
	displaytime = h + ":" + m  + z;
	
	/*  Generates a small random error to make display reading flicker */
	
	if (u != 1){
		ED = Math.random()*2;
		
		if (ED > 1){
			ErrorDirection = 1;
		}
		else{
			ErrorDirection = -1;
		}
		
		if (Force > 1){
			Error = Math.random()*Force*0.002*ErrorDirection;
		}
		else{
			Error = Math.random()*Force*.01*ErrorDirection;
		}
		
		DisplayForce = Force+Error;
		
		/*  Makes sure the displayed force is not larger than Maximum Value */
		
		if (Force > 50){
			Force = 50;
		}
	}
	else{
		DisplayForce = Force;
	}
	
	/*  Draws the body of the Lab Quest */
	
	ctx.lineWidth = 1;
	ctx.strokeStyle = "#444444";
	ctx.fillStyle = "#444444";
	ctx.beginPath();
	ctx.moveTo(x-hw+lqc,y);
	ctx.arc(x-hw+lqc, y-lqc, lqc, 0.5*Math.PI, 1*Math.PI);
	ctx.lineTo(x-hw,y-lqh+lqc);

	ctx.closePath();
	ctx.fill();
	ctx.stroke();
	
	/*  Rectangles on Screen */
	
	ctx.fillStyle = "#49999e";
	ctx.fillRect(x-0.75*hw,y-0.825*lqh,1.5*hw,0.75*lqh);
