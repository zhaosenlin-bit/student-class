<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数学打地鼠</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-dark: #357abd;
            --success: #2ecc71;
            --danger: #e74c3c;
            --warning: #f39c12;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --shadow: 0 8px 24px rgba(0,0,0,0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }
        body { background: linear-gradient(135deg, #e0eafc, #cfdef3); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; width: 100%; flex: 1; display: flex; flex-direction: column; }
        
        header { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 16px 24px; border-radius: 16px; box-shadow: var(--shadow); margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        h1 { font-size: 1.6rem; background: linear-gradient(90deg, var(--primary), #6c5ce7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .player-info { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .player-info label { font-weight: 600; color: var(--text-light); white-space: nowrap; }
        .player-info input { padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 1rem; outline: none; transition: all 0.3s; width: 160px; }
        .player-info input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(74,144,226,0.2); }
        #gameDuration { width: 80px !important; text-align: center; }
        .btn { padding: 10px 20px; border: none; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.2s; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-2px); box-shadow: 0 6px 12px rgba(74,144,226,0.3); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-danger:hover { background: #c0392b; transform: translateY(-2px); box-shadow: 0 6px 12px rgba(231,76,60,0.3); }
        .btn-warning { background: var(--warning); color: white; }
        .btn-warning:hover { background: #d68910; transform: translateY(-2px); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(8px); transition: opacity 0.3s; }
        .overlay.hidden { opacity: 0; pointer-events: none; }
        .overlay-content { background: var(--card); padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); max-width: 500px; width: 90%; }
        .overlay h2 { font-size: 2rem; margin-bottom: 24px; color: var(--primary); }
        .grade-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .grade-btn { padding: 14px; font-size: 1.1rem; border: none; border-radius: 12px; background: #f8fafc; cursor: pointer; transition: all 0.2s; font-weight: 600; color: var(--text); border: 2px solid transparent; }
        .grade-btn:hover { background: var(--primary); color: white; transform: translateY(-3px); box-shadow: 0 6px 12px rgba(74,144,226,0.3); }

        .game-layout { display: flex; gap: 24px; flex-wrap: wrap; flex: 1; }
        .game-board { flex: 2; min-width: 320px; background: var(--card); border-radius: 20px; padding: 24px; box-shadow: var(--shadow); display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; min-height: 420px; position: relative; }
        .hole { background: radial-gradient(circle at 50% 30%, #8b5a2b, #5a3a1a); border-radius: 50%; height: 110px; position: relative; overflow: hidden; box-shadow: inset 0 8px 15px rgba(0,0,0,0.5); cursor: pointer; }
        .hole::after { content: ''; position: absolute; bottom: 0; width: 100%; height: 35%; background: linear-gradient(to top, rgba(0,0,0,0.4), transparent); border-radius: 50%; }
        .mole { position: absolute; bottom: -70px; left: 50%; transform: translateX(-50%); width: 75px; height: 75px; background: #f4d03f; border-radius: 50% 50% 8px 8px; transition: bottom 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; justify-content: center; align-items: center; font-size: 1.6rem; font-weight: 800; color: #2c3e50; box-shadow: 0 6px 10px rgba(0,0,0,0.2); user-select: none; }
        .mole.active { bottom: 12px; }
        .mole.correct { background: var(--success); color: white; animation: pop 0.3s ease; }
        .mole.wrong { background: var(--danger); color: white; animation: shake 0.4s ease; }
        
        .sidebar { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 20px; }
        .panel { background: var(--card); padding: 20px; border-radius: 16px; box-shadow: var(--shadow); }
        .panel h3 { font-size: 1rem; color: var(--text-light); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        #questionText { font-size: 2rem; font-weight: 800; color: var(--primary); text-align: center; min-height: 60px; display: flex; align-items: center; justify-content: center; line-height: 1.3; }
        .stat-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; font-size: 1.1rem; }
        .stat-row span:last-child { font-weight: 800; font-size: 1.6rem; }
        #timer { color: var(--warning); }
        #timer.urgent { color: var(--danger); animation: pulse 1s infinite; }
        .timer-bar { height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .timer-fill { height: 100%; background: var(--warning); width: 100%; transition: width 1s linear; }
        .timer-fill.urgent { background: var(--danger); }

        .leaderboard-list { list-style: none; max-height: 280px; overflow-y: auto; }
        .leaderboard-list li { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #f1f5f9; transition: background 0.2s; }
        .leaderboard-list li:hover { background: #f8fafc; }
        .rank { font-weight: 800; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #e2e8f0; color: var(--text); font-size: 0.9rem; }
        .rank.gold { background: #ffd700; color: #744210; }
        .rank.silver { background: #c0c0c0; color: #4a4a4a; }
        .rank.bronze { background: #cd7f32; color: #fff; }
        .lb-name { flex: 1; margin-left: 10px; font-weight: 600; }
        .lb-score { font-weight: 800; color: var(--primary); font-size: 1.1rem; }
        .lb-meta { font-size: 0.8rem; color: var(--text-light); margin-left: 8px; text-align: right; }

        @keyframes pop { 0% { transform: translateX(-50%) scale(1); } 50% { transform: translateX(-50%) scale(1.2); } 100% { transform: translateX(-50%) scale(1); } }
        @keyframes shake { 0%, 100% { transform: translateX(-50%); } 25% { transform: translateX(-60%); } 75% { transform: translateX(-40%); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--success); color: white; padding: 12px 24px; border-radius: 12px; font-weight: 600; box-shadow: 0 8px 24px rgba(46,204,113,0.4); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 200; }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { background: var(--danger); box-shadow: 0 8px 24px rgba(231,76,60,0.4); }

        @media (max-width: 900px) {
            .game-layout { flex-direction: column; }
            .game-board { min-height: 360px; }
            .hole { height: 95px; }
            .mole { width: 65px; height: 65px; font-size: 1.3rem; }
            header { flex-direction: column; align-items: flex-start; gap: 10px; }
            .player-info { width: 100%; justify-content: space-between; }
            .player-info input { width: 100%; flex: 1; }
        }
    </style>
</head>
