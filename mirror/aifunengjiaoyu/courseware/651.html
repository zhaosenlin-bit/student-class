<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📏 3D长度测量 · 两栏</title>
  <style>
    /* ===== 深色沉浸变量 ===== */
    :root {
      --bg-deep: #0b0e14;
      --bg-panel: rgba(18, 26, 36, 0.92);
      --bg-panel-alt: rgba(28, 40, 54, 0.5);
      --border: rgba(80, 140, 180, 0.25);
      --text: #e8edf2;
      --text-dim: #8a9bb0;
      --accent: #4cc9f0;
      --accent2: #f4a261;
      --accent3: #52b788;
      --danger: #e63946;
      --radius: 14px;
      --transition: 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      --panel-w: 320px;
      --header-h: 48px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-deep);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    #mobile-header {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      height: var(--header-h);
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      z-index: 40;
    }
    #mobile-header h1 {
      font-size: 16px;
      color: var(--text);
      font-weight: 600;
    }
    #mobile-header .btn-toggle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 12px;
      cursor: pointer;
      transition: var(--transition);
    }
    #mobile-header .btn-toggle:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    #main-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    #center-panel {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    #side-panel {
      width: var(--panel-w);
      min-width: var(--panel-w);
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      overflow-x: hidden;
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    /* 侧边栏内容区 */
    .panel-content {
      padding: 14px 16px;
      flex: 1;
    }
    .panel-section {
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }
    .panel-section:last-child {
      border-bottom: none;
    }
    .panel-section h3 {
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .panel-section h3::before {
      content: "";
      display: inline-block;
      width: 3px;
      height: 14px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* 控件样式 */
    .ctrl-group {
      margin-bottom: 8px;
    }
    .ctrl-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px 0;
    }
    .ctrl-group label input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 6px;
    }
    .btn {
      padding: 6px 14px;
      border-radius: 30px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      transition: var(--transition);
      white-space: nowrap;
      text-align: center;
    }
    .btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(76, 201, 240, 0.06);
    }
    .btn.active {
      border-color: var(--accent2);
      color: var(--accent2);
      background: rgba(244, 162, 97, 0.08);
    }
    .btn.primary {
      background: var(--accent);
      color: #0b0e14;
      border-color: var(--accent);
      font-weight: 600;
    }
    .btn.primary:hover {
      background: #3ab8df;
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 步骤导航 */
    .step-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .step-header h3 {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
      margin: 0;
    }
    .step-header h3::before { display: none; }
    .step-dots {
      display: flex;
      gap: 6px;
    }
    .step-dot {
      width: 26px; height: 26px;
      border-radius: 50%;
      background: var(--bg-panel-alt);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
      color: var(--text-dim);
      transition: var(--transition);
    }
    .step-dot.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #0b0e14;
    }
    .step-dot.done {
      border-color: var(--accent3);
      background: var(--accent3);
      color: #0b0e14;
    }
    #step-desc {
      font-size: 13px;
      line-height: 1.5;
      margin: 6px 0 12px;
      color: var(--text-dim);
      min-height: 36px;
    }
    #step-desc strong {
      color: var(--text);
    }

    /* 数据行 */
    .data-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .data-row .label { color: var(--text-dim); }
    .data-row .value { color: var(--text); font-weight: 500; text-align: right; }

    .input-group {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
      margin: 6px 0 4px;
    }
    .input-group input {
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.3);
      font-size: 13px;
      width: 70px;
      color: var(--text);
      outline: none;
      transition: 0.2s;
    }
    .input-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(76, 201, 240, 0.15);
    }
    .input-group span { font-size: 12px; color: var(--text-dim); }

    .feedback {
      font-size: 12px;
      min-height: 20px;
      margin-top: 6px;
      font-weight: 500;
    }
    .feedback.ok { color: var(--accent3); }
    .feedback.error { color: var(--danger); }
    .feedback.warn { color: var(--accent2); }

    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 12px 0 8px;
    }

    /* 放大镜 */
    #magnifier {
      position: absolute;
      z-index: 25;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      box-shadow: 0 0 30px rgba(76, 201, 240, 0.3);
      pointer-events: none;
      display: none;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      overflow: hidden;
      transform: translate(-50%, -50%);
    }
    #magnifier canvas {
      width: 100%;
      height: 100%;
      display: block;
      border-radius: 50%;
    }

    @media (max-width: 900px) {
      #mobile-header {
        display: flex;
      }
      #side-panel {
        position: fixed;
        right: 0;
        top: var(--header-h);
        bottom: 0;
        z-index: 50;
        margin-right: calc(-1 * var(--panel-w));
        transition: margin-right var(--transition);
        box-shadow: -4px 0 30px rgba(0,0,0,0.5);
      }
      #side-panel.open {
        margin-right: 0;
      }
      #magnifier {
        width: 100px;
        height: 100px;
      }
    }
  </style>
</head>

<div id="app">
  <header id="mobile-header">
    <h1>📏 长度测量</h1>
    <button class="btn-toggle" id="btnToggleSide">☰ 信息</button>
  </header>
  <div id="main-layout">
    <main id="center-panel">
      <div id="three-container" style="width:100%;height:100%;"></div>
      <div id="magnifier"><canvas id="magCanvas"></canvas></div>
    </main>
    <aside id="side-panel">
      <div class="panel-content">
        <!-- 步骤导航 -->
        <div class="panel-section">
          <div class="step-header">
            <div class="step-dots" id="stepDots">
              <span class="step-dot active" data-step="0">1</span>
              <span class="step-dot" data-step="1">2</span>
              <span class="step-dot" data-step="2">3</span>
              <span class="step-dot" data-step="3">4</span>
              <span class="step-dot" data-step="4">5</span>
            </div>
            <h3 id="stepTitle">认识工具</h3>
          </div>
          <div id="step-desc"><strong>① 认识工具</strong> — 分度值 1mm，量程 30.0cm</div>
          <div class="btn-row">
            <button class="btn" id="prevBtn" disabled>◀ 上一步</button>
            <button class="btn primary" id="nextBtn">下一步 ▶</button>
          </div>
        </div>

        <!-- 测量控制 -->
        <div class="panel-section">
          <h3>📐 测量控制</h3>
          <div class="ctrl-group">
            <label style="color:var(--text-dim);font-size:12px;">刻度尺</label>
            <div class="btn-row">
              <button class="btn active" id="rulerNormal">标准尺</button>
              <button class="btn" id="rulerNoZero">无零刻度</button>
            </div>
          </div>
          <div class="ctrl-group">
            <label style="color:var(--text-dim);font-size:12px;">被测物体</label>
            <div class="btn-row">
              <button class="btn active" data-obj="0">长方体</button>
              <button class="btn" data-obj="1">硬币</button>
              <button class="btn" data-obj="2">物理书</button>
            </div>
          </div>
          <div class="btn-row" style="margin-top:10px;">
            <button class="btn primary" id="resetBtn" style="flex:1;">↺ 重置</button>
          </div>
        </div>

        <!-- 读数卡 -->
        <div class="panel-section">
          <h3>📐 读数</h3>
          <div class="data-row"><span class="label">分度值</span><span class="value" id="divDisplay">1 mm</span></div>
          <div class="data-row"><span class="label">量程</span><span class="value" id="rangeDisplay">30.0 cm</span></div>
          <div style="margin-top:8px;">
            <div class="input-group">
              <span>准确值</span><input type="text" id="exactInput" placeholder="cm" disabled>
              <span>cm</span>
            </div>
            <div class="input-group">
              <span>估读值</span><input type="text" id="estInput" placeholder="mm" disabled>
              <span>mm</span>
            </div>
            <button class="btn" id="checkBtn" disabled style="margin-top:6px;">✓ 检查</button>
            <div class="feedback" id="feedbackMsg"></div>
          </div>
        </div>

        <!-- 单位换算 -->
        <div class="panel-section">
          <h3>📊 单位换算</h3>
          <div id="conversionArea">
            <div class="data-row"><span class="label">m</span><span class="value" id="conv_m">—</span></div>
            <div class="data-row"><span class="label">dm</span><span class="value" id="conv_dm">—</span></div>
            <div class="data-row"><span class="label">cm</span><span class="value" id="conv_cm">—</span></div>
            <div class="data-row"><span class="label">mm</span><span class="value" id="conv_mm">—</span></div>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>
