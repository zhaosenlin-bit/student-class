}

function startFunction() {
	is_smoke = !is_smoke;
	if (is_smoke) {
		createSmoke();
	} else {
		scene.remove(smoke.mesh);
		smoke = null;
	}
	document.getElementById('onoff').disabled = true;
}
	
function changeConductorTemperature() {
	var temp = document.getElementById('tempSlider').value;
	if(temp < 10 && is_smoke){
		levitate = true;
	        levitateMagnet();
	} else {
		levitate = false;
	        startTime = null; // reset the timer
	        // Optionally, reset the magnet position if needed
	        magnet.position.set(0, 6, 0);
	}
}

function addHorizontalGrid() {  
	const gridHelper = new THREE.GridHelper( 50, 50 );
	scene.add( gridHelper );
}
  
function addTitle(x, y, z, t, s, alpha) {
    fontloader.load("/api/program-assets/lab-phyc240-meissner-effect/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json", function (tex) {
        var textGeo = new TextGeometry(t, {

            height: 0.2,
            curveSegments: 6,
            font: tex,
        });
        var textMaterial = new THREE.MeshBasicMaterial({ color: "white" });
        var textMesh = new THREE.Mesh(textGeo, textMaterial);
	textMesh.rotation.y = alpha;
        textMesh.position.set(x, y, z);
        scene.add(textMesh);
    });
}
		
function addText(x, y, z, t, s, color) {
    fontloader.load("/api/program-assets/lab-phyc240-meissner-effect/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json", function (tex) {
        var textGeo = new TextGeometry(t, {
            size: s,
            height: 0.2,
            curveSegments: 6,
            font: tex,
        });
        var textMaterial = new THREE.MeshLambertMaterial({ color: color });
        var detectorText = new THREE.Mesh(textGeo, textMaterial);
	detectorText.rotation.y = Math.PI/2;
        detectorText.position.set(x, y, z);
	textArray.push(detectorText);
        scene.add(detectorText);
    });
}
	
function cleanText() {
    for (var i = 0; i < textArray.length; i++) {
        if (textArray[i]) { // Check if the text object exists
            scene.remove(textArray[i]); // Remove it from the scene
            textArray[i].geometry.dispose(); // Dispose of the geometry to free up memory
            textArray[i].material.dispose(); // Dispose of the material to free up memory
            textArray[i] = null; // Set the array element to null for cleanup
        }
    }
    textArray = []; // Clear the array after all elements have been removed and disposed of
}

render = function () {
    if(smoke){
	smoke.update( performance.now() / 1000 );
    }
    controls.update();
    requestAnimationFrame(render);
    renderer.render(scene, camera);
};
