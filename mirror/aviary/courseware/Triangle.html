	<script>
// JavaScript Document

function countblocks(){
	var hypotenuse = document.getElementById("Hyp").value;
	var angle = document.getElementById("Ang").value;
	var leg1 = document.getElementById("L1").value;
	var leg2 = document.getElementById("L2").value;
	var count = 0;
	var combo = 0;
	if (hypotenuse > 0){
		count++;
		combo = combo + 1000;
	}
	if (angle > 0){
		count++;
		combo = combo + 100;
	}
	if (leg1 > 0){
		count++;
		combo = combo + 10;
	}
	if (leg2 > 0){
		count++;
		combo = combo + 1;
	}
	if (count > 2){
		clearout();
	}
	if (count < 2){
		document.getElementById("Hints").innerHTML = "Specify values for two variables";
	}
	if (count == 2){
		document.getElementById("Hints").innerHTML = "Calculations Complete. <br> <br>Click on triangle to clear and begin again.";
		if (combo == 1100){
			calclegs();
		}
		if (combo == 11){
			pythagatan();
		}
		if (combo == 1001){
			hileg2();
		}
		if (combo == 1010){
			hileg1();
		}
		if (combo == 101){
			angleg2();
		}
		if (combo == 110){
			angleg1();
		}
	}
}

function clearout() {
	document.getElementById("L1").value = "";
	document.getElementById("L2").value = "";
	document.getElementById("Hyp").value = "";
	document.getElementById("Ang").value = "";
	document.getElementById("Hints").innerHTML = "Specify values for two variables";
}

function calclegs(){
	var hypotenuse = document.getElementById("Hyp").value;
	var angle = document.getElementById("Ang").value;
	var dp = 2;
	if (hypotenuse < 10){
		dp = 3;
	}
	radangle= angle*3.14159/180;
	leg1 = Math.round((hypotenuse*Math.cos(radangle))*Math.pow(10,dp))/Math.pow(10,dp);
	leg2 = Math.round((hypotenuse*Math.sin(radangle))*Math.pow(10,dp))/Math.pow(10,dp);
	document.getElementById("L1").value = leg1;
	document.getElementById("L2").value = leg2;
	document.getElementById("Form1").innerHTML = "sin &theta; = opposite/hypotenuse";
	document.getElementById("Form1Num").innerHTML = "opposite = " + hypotenuse + "&bull;sin(" + angle + ")" ;
	document.getElementById("Form1Ans").innerHTML = "opposite = " + leg2;
	document.getElementById("Form2").innerHTML = "cos &theta; = adjacent/hypotenuse";
	document.getElementById("Form2Num").innerHTML = "adjacent = " + hypotenuse + "&bull;cos(" + angle + ")" ;
	document.getElementById("Form2Ans").innerHTML = "adjacent = " + leg1;
}

function pythagatan(){
	var leg1 = document.getElementById("L1").value;
	var leg2 = document.getElementById("L2").value;
	var dp = 2;
	if (leg1 < 10){
		dp = 3;
	}
	hypotenuse = Math.round(Math.sqrt(leg1*leg1+leg2*leg2)*Math.pow(10,dp))/Math.pow(10,dp);
	radangle = Math.atan(leg2/leg1);
	var angle = Math.round((radangle*180/3.14159)*Math.pow(10,dp))/Math.pow(10,dp);
	document.getElementById("Hyp").value = hypotenuse;
	document.getElementById("Ang").value = angle;
	document.getElementById("Form1").innerHTML = "C<sup>2</sup> = A<sup>2</sup> + B<sup>2</sup>";
	document.getElementById("Form1Num").innerHTML = "C<sup>2</sup> = " + leg1 + "<sup>2</sup> + " + leg2 + "<sup>2</sup>" ;
	document.getElementById("Form1Ans").innerHTML = "C = " + hypotenuse;
	document.getElementById("Form2").innerHTML = "tan &theta; = opposite/adjacent";
	document.getElementById("Form2Num").innerHTML = "&theta; = arctan(" + leg2 + " &divide; " + leg1 + ")" ;
	document.getElementById("Form2Ans").innerHTML = "&theta; = " + angle;

}

function hileg2(){
	var hypotenuse = document.getElementById("Hyp").value;
	var leg2 = document.getElementById("L2").value;
	var dp = 2;
	if (hypotenuse < 10){
		dp = 3;
	}
	leg1 = Math.round(Math.sqrt(hypotenuse*hypotenuse-leg2*leg2)*Math.pow(10,dp))/Math.pow(10,dp);
	radangle = Math.asin(leg2/hypotenuse);
	var angle = Math.round((radangle*180/3.14159)*Math.pow(10,dp))/Math.pow(10,dp);
	document.getElementById("L1").value = leg1;
	document.getElementById("Ang").value = angle;
	document.getElementById("Form1").innerHTML = "sin &theta; = opposite/hypotenuse";
	document.getElementById("Form1Num").innerHTML = "&theta; = arcsin(" + leg2 + " &divide; " + hypotenuse + ")" ;
	document.getElementById("Form1Ans").innerHTML = "&theta; = " + angle;
	document.getElementById("Form2").innerHTML = "A<sup>2</sup> + B<sup>2</sup> = C<sup>2</sup>";
	document.getElementById("Form2Num").innerHTML = "A<sup>2</sup> = " + hypotenuse + "<sup>2</sup> - " + leg2 + "<sup>2</sup>" ;
	document.getElementById("Form2Ans").innerHTML = "A = " + leg1;
}

function hileg1(){
	var hypotenuse = document.getElementById("Hyp").value;
	var leg1 = document.getElementById("L1").value;
	var dp = 2;
	if (hypotenuse < 10){
		dp = 3;
	}
	leg2 = Math.round(Math.sqrt(hypotenuse*hypotenuse-leg1*leg1)*Math.pow(10,dp))/Math.pow(10,dp);
	radangle = Math.acos(leg1/hypotenuse);
	var angle = Math.round((radangle*180/3.14159)*Math.pow(10,dp))/Math.pow(10,dp);
	document.getElementById("L2").value = leg2;
	document.getElementById("Ang").value = angle;
	document.getElementById("Form1").innerHTML = "cos &theta; = adjacent/hypotenuse";
	document.getElementById("Form1Num").innerHTML = "&theta; = arccos(" + leg1 + " &divide; " + hypotenuse + ")" ;
	document.getElementById("Form1Ans").innerHTML = "&theta; = " + angle;
	document.getElementById("Form2").innerHTML = "A<sup>2</sup> + B<sup>2</sup> = C<sup>2</sup>";
	document.getElementById("Form2Num").innerHTML = "B<sup>2</sup> = " + hypotenuse + "<sup>2</sup> - " + leg1 + "<sup>2</sup>" ;
	document.getElementById("Form2Ans").innerHTML = "B = " + leg2;
}

function angleg2(){
	var angle = document.getElementById("Ang").value;
	var leg2 = document.getElementById("L2").value;
	var dp = 2;
	if (leg2 < 10){
		dp = 3;
	}
	radangle= angle*3.14159/180;
	hypotenuse = Math.round((leg2/Math.sin(radangle))*Math.pow(10,dp))/Math.pow(10,dp);
	leg1 = Math.round(Math.sqrt(hypotenuse*hypotenuse-leg2*leg2)*Math.pow(10,dp))/Math.pow(10,dp);;
	document.getElementById("L1").value = leg1;
	document.getElementById("Hyp").value = hypotenuse;
	document.getElementById("Form1").innerHTML = "sin &theta; = opposite/hypotenuse";
	document.getElementById("Form1Num").innerHTML = "hypotenuse = " + leg2 + " &divide; sin(" + angle + ")" ;
	document.getElementById("Form1Ans").innerHTML = "hypotenuse = " + hypotenuse;
	document.getElementById("Form2").innerHTML = "A<sup>2</sup> + B<sup>2</sup> = C<sup>2</sup>";
	document.getElementById("Form2Num").innerHTML = "B<sup>2</sup> = " + hypotenuse + "<sup>2</sup> - " + leg2 + "<sup>2</sup>" ;
	document.getElementById("Form2Ans").innerHTML = "B = " + leg1;
}

function angleg1(){
	var angle = document.getElementById("Ang").value;
	var leg1 = document.getElementById("L1").value;
	var dp = 2;
	if (leg1 < 10){
		dp = 3;
	}
	radangle= angle*3.14159/180;
	hypotenuse = Math.round((leg1/Math.cos(radangle))*Math.pow(10,dp))/Math.pow(10,dp);
	leg2 = Math.round(Math.sqrt(hypotenuse*hypotenuse-leg1*leg1)*Math.pow(10,dp))/Math.pow(10,dp);;
	document.getElementById("L2").value = leg2;
	document.getElementById("Hyp").value = hypotenuse;
	document.getElementById("Form1").innerHTML = "cos &theta; = adjacent/hypotenuse";
	document.getElementById("Form1Num").innerHTML = "hypotenuse = " + leg1 + " &divide; cos(" + angle + ")" ;
	document.getElementById("Form1Ans").innerHTML = "hypotenuse = " + hypotenuse;
	document.getElementById("Form2").innerHTML = "A<sup>2</sup> + B<sup>2</sup> = C<sup>2</sup>";
	document.getElementById("Form2Num").innerHTML = "A<sup>2</sup> = " + hypotenuse + "<sup>2</sup> - " + leg2 + "<sup>2</sup>" ;
	document.getElementById("Form2Ans").innerHTML = "A = " + leg2;
}

</script>
