	<body>

		<div id="container"></div>

		<div id="info">
			<h1>RC CIRCUIT APP -  NEON LIGHT SIGN</h1> 
			A neon light is connected in parallel with the capacitor in an RC circuit <br>
			<button class="btn btn-primary" id="on_off">ON/OFF</button>
			<button class="btn btn-default" id="reset">Reset</button>
		</div>
	
	<script type="importmap">
{
  "imports": {
    "three": "/api/program-assets/lab-phyc240-neon-light/_ext/threejs.org/build/three.module.js",

  }
}
</script>

	<script type="module">

			import * as THREE from 'three';

			import Stats from '/api/program-assets/lab-phyc240-neon-light/_ext/threejs.org/examples/jsm/libs/stats.module.js';
			import { GUI } from '/api/program-assets/lab-phyc240-neon-light/_ext/threejs.org/examples/jsm/libs/lil-gui.module.min.js';

			import { OrbitControls } from '/api/program-assets/lab-phyc240-neon-light/_ext/threejs.org/examples/jsm/controls/OrbitControls.js';
			import { GLTFLoader } from '/api/program-assets/lab-phyc240-neon-light/_ext/threejs.org/examples/jsm/loaders/GLTFLoader.js';
			import { FontLoader } from '/api/program-assets/lab-phyc240-neon-light/_ext/threejs.org/examples/jsm/loaders/FontLoader.js';
			import { TextGeometry } from '/api/program-assets/lab-phyc240-neon-light/_ext/threejs.org/examples/jsm/geometries/TextGeometry.js';
			import { LineGeometry } from '/api/program-assets/lab-phyc240-neon-light/_ext/threejs.org/examples/jsm/lines/LineGeometry.js';
			import { LineMaterial } from '/api/program-assets/lab-phyc240-neon-light/_ext/threejs.org/examples/jsm/lines/LineMaterial.js';
			import { Line2 } from '/api/program-assets/lab-phyc240-neon-light/_ext/threejs.org/examples/jsm/lines/Line2.js';
			import { EffectComposer } from '/api/program-assets/lab-phyc240-neon-light/_ext/threejs.org/examples/jsm/postprocessing/EffectComposer.js';
			import { RenderPass } from '/api/program-assets/lab-phyc240-neon-light/_ext/threejs.org/examples/jsm/postprocessing/RenderPass.js';
			import { UnrealBloomPass } from '/api/program-assets/lab-phyc240-neon-light/_ext/threejs.org/examples/jsm/postprocessing/UnrealBloomPass.js';
			import { OutputPass } from '/api/program-assets/lab-phyc240-neon-light/_ext/threejs.org/examples/jsm/postprocessing/OutputPass.js'; 
			
			/**  author: Thomas Nguyen   "3jcn.us"
			 **  3 May 2024
			 **  All rights reserved **/
			
			let scene, camera, model, gltf, stats, bloomPass, count = 1;
			let composer, renderer, mixer, clock, lock1, lock2, myVar2;
			var onoff = false; let myVar = null; 
			var neonArray = [], textArray = [], greenArray = [];
		
			var textureloader = new THREE.TextureLoader();
			const loader = new GLTFLoader();
			var fontloader = new FontLoader();

			const params = {
				threshold: 1,
				strength: 1,
				radius: 0,
				exposure: 1.3
			};

			init();

			function init() {
				const container = document.getElementById( 'container' );
				clock = new THREE.Clock();
				scene = new THREE.Scene();
				camera = new THREE.PerspectiveCamera( 40, window.innerWidth / window.innerHeight, 1, 100 );
				camera.position.set( - 5, 2.5, - 3.5 );
				scene.add( camera );
				scene.add( new THREE.AmbientLight( 0xcccccc ) );
				const pointLight = new THREE.PointLight( 0xffffff, 100 );
				camera.add( pointLight );
				
				// Load Neon model:
				loader.load( '/api/program-assets/lab-phyc240-neon-light/_ext/threejs.org/examples/models/gltf/PrimaryIonDrive.glb', function ( gltf ) {
			            model = gltf.scene;
			            model.position.set(0,0,-2);
			            scene.add( model );
			            neonArray.push(model);
				    // Disable any lights embedded in the model
				    model.traverse((child) => {
				        if (child.isLight) {
				            child.intensity = 0; // turn off all embedded lights
				        }
				    });
			            mixer = new THREE.AnimationMixer( model );
			            const clip = gltf.animations[ 0 ];
			            mixer.clipAction( clip.optimize() ).play();
					//animate();
			        });
				addText(1.8,1.2,-2.7,"Non-blinking Neon Light",-Math.PI/2);
				addText(0.2,0.4,0.2,"100 Ω",Math.PI);
				addText(-0.8,1,1,"10 mF",Math.PI);
				
				// add breadboard circuit:
				createBreadboard();
				addBattery(0.2);
				addCapacitor();
				addResistor(0, 0.2, 0.2, 0x5C4033,0x000000,0x5C4033,0xFFD700,Math.PI/2);
				addSwitch1();
				addSwitch2();
				addWire(-1,0.2,1.8, -1,0.2,1.1, "blue"); // capacitor line
				addWire(-1,0.2,0.9, -1,0.2,0.2,  "blue"); // capacitor line
				addGreenWire(1,0.2,0.2, 1,0.5,0.5);  // battery line
				addGreenWire(1,0.2,1.8, 1,0.5,1.4);  // battery line
				addWire(1,0.2,1.8, 0.5,0.2,1.8,  "blue"); // switch line
				addWire(0,0.2,1.8, -1,0.2,1.8,  "blue"); // switch line
				addWire(1,0.2,0.2, -1,0.2,0.2,  "blue"); // resistor line
				addWire(-1.5,0,-2, 1.5,0,-2,  "brown"); // Neon line
				addSphere(-1, 0.2, 1.1);
				addSphere(-1, 0.2, 0.9);
				addBlueOn(-1,0.2,0.9, -1.5,0,-2, 2, "blue"); // from capacitor
				addBlueOn(-1,0.2,1.1, 1.5,0,-2, 2, "blue");
				addBlueOn(1,0.2,0, -1.5,0,-2, 2, "green");  // from battery
				addBlueOn(1,0.2,1.8, 1.5,0,-2, 2, "green"); // from battery

				renderer = new THREE.WebGLRenderer( { antialias: true } );
				renderer.setPixelRatio( window.devicePixelRatio );
				renderer.setSize( window.innerWidth, window.innerHeight );
				renderer.setAnimationLoop( animate );
				renderer.toneMapping = THREE.ReinhardToneMapping;
				container.appendChild( renderer.domElement );

				const renderScene = new RenderPass( scene, camera );

				bloomPass = new UnrealBloomPass( 
					new THREE.Vector2( window.innerWidth, window.innerHeight ), 1.5, 0.4, 0.85 );
				bloomPass.threshold = 1; // params.threshold;
				bloomPass.strength = 1;  // params.strength;
				bloomPass.radius = 0;  // params.radius;

				const outputPass = new OutputPass();

				composer = new EffectComposer( renderer );
				composer.addPass( renderScene );
				composer.addPass( bloomPass );
				composer.addPass( outputPass );

				const controls = new OrbitControls( camera, renderer.domElement );
				controls.maxPolarAngle = Math.PI * 0.5;
				controls.minDistance = 3;
				controls.maxDistance = 8;

				renderer.toneMappingExposure = Math.pow( 1.2, 4.0 );
				window.addEventListener( 'resize', onWindowResize );
				document.getElementById("on_off").addEventListener('click', setOnOff);
				document.getElementById("reset").addEventListener('click', function(){location.reload();});
			}	
			function addSphere(x, y, z){
				  var ballGeom = new THREE.SphereGeometry(0.05, 32, 24);
				  var ball = new THREE.Mesh(ballGeom, new THREE.MeshPhongMaterial({color:"white"}));
				  ball.position.set(x, y, z);
				  scene.add(ball);
		  		  return ball;  // to attach other obj into it
			}		
			function createBreadboard(){
				var geometry1 = new THREE.BoxGeometry( 3, .1, 2 ); 
				var base = new THREE.Mesh(geometry1, 
						new THREE.MeshPhongMaterial( { color: 0xffff00  } ));
				base.position.set(0,0,1);
				scene.add(base);
			}			
			function addGreenWire(x1,y1,z1,x2,y2,z2){
				var arr = [new THREE.Vector3(x1,y1,z1),
					   new THREE.Vector3(x2,y2,z2)]; 
				var mat = new THREE.MeshLambertMaterial({color: 'green'}); 
				var curve = new THREE.CatmullRomCurve3( arr );
				var geometry = new THREE.TubeGeometry( curve, 100, 0.02, 36, false ); 
				var  str = new THREE.Mesh(geometry, mat);
				scene.add(str);
				greenArray.push(str);
			}			
			function addBlueWire(x1,y1,z1,x2,y2,z2){
				var arr = [new THREE.Vector3(x1,y1,z1),
					   new THREE.Vector3(x2,y2,z2)]; 
				var mat = new THREE.MeshLambertMaterial({color: 'blue'}); 
				var curve = new THREE.CatmullRomCurve3( arr );
				var geometry = new THREE.TubeGeometry( curve, 100, 0.02, 36, false ); 
				var  str = new THREE.Mesh(geometry, mat);
				scene.add(str);
				greenArray.push(str);
			}	
			function cleanGreenArray() {
				    for (var i = 0; i < greenArray.length; i++) {
				        scene.remove(greenArray[i]);
				        greenArray[i].traverse((child) => {
				            if (child.isMesh) {
				                child.geometry.dispose();
				                child.material.dispose();
				            }
				        });
				    }
				    greenArray = []; // Clear the array
				    renderer.renderLists.dispose(); // Dispose of the renderer's render lists
			}			
			function addWire(x1,y1,z1,x2,y2,z2, wire_color){
				var arr = [new THREE.Vector3(x1,y1,z1),
					   new THREE.Vector3(x2,y2,z2)]; 
				var mat = new THREE.MeshLambertMaterial({color: wire_color}); 
				var curve = new THREE.CatmullRomCurve3( arr );
				var geometry = new THREE.TubeGeometry( curve, 100, 0.02, 36, false ); 
				var  str = new THREE.Mesh(geometry, mat);
				scene.add(str);
			}			
			function addBlueOn(x1,y1,z1,x2,y2,z2,d, wire_color){
				var arr = [new THREE.Vector3(x1,y1,z1),
					   new THREE.Vector3((x1+x2)/2,y1-d,(z1+z2)/2),
					   new THREE.Vector3(x2,y2,z2)]; 
				var mat = new THREE.MeshLambertMaterial({color: wire_color}); 
				var curve = new THREE.CatmullRomCurve3( arr );
				var geometry = new THREE.TubeGeometry( curve, 100, 0.02, 36, false ); 
				var  str = new THREE.Mesh(geometry, mat);
				scene.add(str);
			}		
			function addResistor(x,y,z,b1,b2,b3,b4,theta){
				var resistor_geometry = new THREE.CylinderGeometry( .1, .1, .6, 32 );
				var resistor_material = new THREE.MeshBasicMaterial( {color: 0xC8D9DC} );
				var resistor = new THREE.Mesh( resistor_geometry, resistor_material );
				resistor.position.set(x,y,z);
				var geometry = new THREE.CylinderGeometry( .11, .11, 0.07, 32 );
				var material1 = new THREE.MeshBasicMaterial( {color: b1} );
				var band1 = new THREE.Mesh(geometry,material1);
				resistor.add(band1);
				band1.position.set(0,.2,0);
				var material2 = new THREE.MeshBasicMaterial( {color: b2} );
				var band2 = new THREE.Mesh(geometry,material2);
				resistor.add(band2);
				band2.position.set(0,.1,0);
				var material3 = new THREE.MeshBasicMaterial( {color: b3} );
				var band3 = new THREE.Mesh(geometry,material3);
				resistor.add(band3);
				band3.position.set(0,0,0);
				var material4 = new THREE.MeshBasicMaterial( {color: b4} );
				var band4 = new THREE.Mesh(geometry,material4);
				resistor.add(band4);
				band4.position.set(0,-.2,0);
				resistor.rotateZ(theta);
				scene.add(resistor);
			}	
			function addTwoBlueWire(){
				addBlueWire(1,0.2,0.2, 1,0.5,0.5);  // battery line
				addBlueWire(1,0.2,1.8, 1,0.5,1.4);  // battery line
			}	
			function addTwoGreenWire(){
				addGreenWire(1,0.2,0.2, 1,0.5,0.5);  // battery line
				addGreenWire(1,0.2,1.8, 1,0.5,1.4);  // battery line
			}
			function addCapacitor(){	
				loader.load('../models/capacitor/scene.gltf', (gltf) => {
					const root = gltf.scene;
					root.scale.set(2,2,2);
					root.rotateY(Math.PI/2);
					root.position.set(-1,0.6,1); 
					scene.add(root);
				});  
			}	
			function addBattery(r){
				var L = 4*r;
				var texture = textureloader.load( '../textures/battery_texture.png' );
				var bat_material = new THREE.MeshBasicMaterial( { map: texture } );
				var bat_geometry = new THREE.CylinderGeometry( r, r, L, 32 );
				var top_geometry = new THREE.CylinderGeometry( r+0.01, r+0.01, L/4, 32 );
				var top = new THREE.Mesh( top_geometry, new THREE.MeshBasicMaterial({color: 0x5C4033}) );
				var battery = new THREE.Mesh( bat_geometry, bat_material );
				battery.position.set(1,0.5,1);
				battery.add(top);
				top.position.set(0,1.8*r,0);
				var geometry = new THREE.CylinderGeometry( r/4, r/4, r/4, 32 );
				var material = new THREE.MeshBasicMaterial( {color: 0xff0000} );
				var cap = new THREE.Mesh( geometry, material );
				cap.position.set(0,2.4*r,0);
				battery.add( cap );
				battery.rotateX(-Math.PI/2);
				scene.add( battery );
			}
			function onWindowResize() {
				const width = window.innerWidth;
				const height = window.innerHeight;
				camera.aspect = width / height;
				camera.updateProjectionMatrix();
				renderer.setSize( width, height );
				composer.setSize( width, height );
			}
			function setOn(){
				clearInterval(myVar); // Clear any previous blinking interval
				setInterval(() => {
				        bloomPass.threshold = bloomPass.threshold === 0 ? 1 : 0;
				    }, 1000);
				cleanGreenArray();
				addTwoBlueWire();
			}
			function setOff(){	
				 cleanGreenArray();
				 addTwoGreenWire();
			}
			function setOnOff(){
				    onoff = !onoff; 
				    if (onoff) {setOn()} else {setOff()};
				   
				    cleanTextArray(); // Clear any existing text
				    addText(1.8,1.2,-2.7, onoff ? "Blinking Neon Light" : "Non-Blinking Neon Light", -Math.PI/2); 
				    lock1.rotation.z = onoff ? Math.PI/2 : Math.PI/2.5; // Adjust lock1 rotation based on onoff value
				    lock2.rotation.x = onoff ? 0 : Math.PI/2; // Adjust lock2 rotation based on onoff value
			}
			function addSwitch1(){
				    var connector = addSphere(0.5,0.2,1.8);
				    var mount = addSphere(0,0.2,1.8);
				    var switchGeom = new THREE.CylinderGeometry( 0.02, 0.02, 0.5, 32 );
				    switchGeom.translate(0, 0.25, 0);
				    lock1 = new THREE.Mesh(switchGeom, new THREE.MeshLambertMaterial({color: "white"}));
				    lock1.rotation.z = Math.PI/2.5;
				    lock1.name = "lock1"; // Assign a name to lock1 for later reference
				    connector.add(lock1);
			}
			function addSwitch2(){
				    var connector = addSphere(1,0.2,0.2);
				    var mount = addSphere(1,0.2,0);
				    var switchGeom = new THREE.CylinderGeometry( 0.02, 0.02, 0.2, 32 );
				    switchGeom.translate(0, 0.1, 0);
				    lock2 = new THREE.Mesh(switchGeom, new THREE.MeshLambertMaterial({color: "white"}));
				    lock2.rotation.x = Math.PI/2;
				    lock2.name = "lock2"; // Assign a name to lock2 for later reference
				    mount.add(lock2);
			}
			function addText(x,y,z,t,alpha){
				fontloader.load( '/api/program-assets/lab-phyc240-neon-light/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json', 
				function ( tex ) {
					var  textGeo = new TextGeometry(t, {
					    size: 0.15,  
					    depth: 0.02, 
					    curveSegments: 6,
					    font: tex,
				        }); 
			
				    	var  textMaterial = new THREE.MeshLambertMaterial({color: "white"});  
				    	var textMesh = new THREE.Mesh(textGeo , textMaterial);
				    	textMesh.position.set(x,y,z);
				    	textMesh.rotateY(alpha);
				    	scene.add(textMesh);
					textArray.push(textMesh);
				});
			}
			function cleanTextArray() {
				    for (var i = 0; i < textArray.length; i++) {
				        scene.remove(textArray[i]);
				        textArray[i].traverse((child) => {
				            if (child.isMesh) {
				                child.geometry.dispose();
				                child.material.dispose();
				            }
				        });
				    }
				    textArray = []; // Clear the array
				    renderer.renderLists.dispose(); // Dispose of the renderer's render lists
			}
			function animate() {
				if(!onoff){
					clearInterval(myVar); // Ensure the interval is cleared when turning off
					bloomPass.threshold = 1;
				}
				const delta = clock.getDelta();
				if (mixer) mixer.update(delta); // Added this check
				composer.render();
			}

		</script>
