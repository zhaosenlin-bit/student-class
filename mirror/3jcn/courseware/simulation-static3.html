	function drawCurve(center, radius, theta) {
		    const points = [];
		    const segments = 100; // Number of segments in the curve
		    const startAngle = Math.PI; // Starting from the negative x-axis
		    const endAngle = startAngle + (Math.PI / 180) * theta;
		    for (let i = 0; i <= segments; i++) {
		        const angle = startAngle + (i / segments) * (startAngle - endAngle); // Clockwise direction
		        const x = center.x + radius * Math.cos(angle);
		        const y = center.y + radius * Math.sin(angle);
		        points.push(new THREE.Vector3(x, y, center.z));
		    }
		
		    const curve = new THREE.CatmullRomCurve3(points);
		    const geometry = new THREE.TubeGeometry(curve, segments, 2, 8, false);
		    const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
		    const curveObject = new THREE.Mesh(geometry, material);
		    scene.add(curveObject);
		    return curveObject;
		}

			box = new THREE.Mesh( new THREE.BoxGeometry( 50,50, 50 ), boxMaterial );
			box.position.set(x,y,z);
			scene.add(box);
			return box;

		function addBlue(x1, y1, z1, x2, y2, z2) {
		    var arr = [new THREE.Vector3(x1, y1, z1),
		    new THREE.Vector3(x2, y2, z2)];
		    var mat = new THREE.MeshLambertMaterial({ color: "blue" });
		    var curve = new THREE.CatmullRomCurve3(arr);
		    var geometry = new THREE.TubeGeometry(curve, 100, 2, 36, false);
		    var str = new THREE.Mesh(geometry, mat);
		    scene.add(str);
		    blueArray.push(str);
		    return str;
		}
