    &lt;div id=&quot;canvas-container&quot;&gt;

                &lt;label class=&quot;block text-sm font-medium text-gray-700 mb-3&quot;&gt;模式选择&lt;/label&gt;
                &lt;div class=&quot;flex flex-col gap-2&quot;&gt;
                    &lt;button id=&quot;mode-on&quot; class=&quot;px-4 py-2 rounded-xl text-sm font-medium border-2 border-[#0A4737] bg-[#0A4737] text-white transition-all&quot;&gt;有暗管模式&lt;/button&gt;
                    &lt;button id=&quot;mode-off&quot; class=&quot;px-4 py-2 rounded-xl text-sm font-medium border-2 border-gray-200 text-gray-600 hover:border-[#0A4737] transition-all&quot;&gt;无暗管模式&lt;/button&gt;

                &lt;button id=&quot;reset-btn&quot; class=&quot;w-full bg-gray-100 text-gray-600 py-2 rounded-xl text-sm hover:bg-gray-200 transition-all&quot;&gt;重置场景&lt;/button&gt;

        &lt;!-- 信息卡片 --&gt;
        &lt;div class=&quot;info-card glass-panel p-6 rounded-3xl shadow-xl border-t-4 border-[#0A4737]&quot;&gt;
            &lt;h3 id=&quot;info-title&quot; class=&quot;text-lg font-bold text-[#0A4737] mb-2&quot;&gt;准备就绪&lt;/h3&gt;
            &lt;p id=&quot;info-desc&quot; class=&quot;text-gray-600 text-sm leading-relaxed&quot;&gt;

    &lt;script&gt;
        // 资源配置
        const ASSETS = {
            soilBad: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/ErTbN2omNnvTykvAGpWst2.jpg',
            soilGood: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/yusHAtm7kuPLW3gAvJruJK.jpg',
            soilTexture: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/CQ5PMXnNQt8UNULKrSsvuA.jpg',
            pipe: 'https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/ZbxESpVwbBWLDoi3kpdpE2.jpg'
        };

        let imgSoilBad, imgSoilGood, imgSoilTexture, imgPipe;
        let particles = [];
        let salts = [];
        let isIrrigating = false;
        let mode = 'on'; // 'on' or 'off'
        let pipeY;
        let groundY;

        function preload() {
            imgSoilBad = loadImage(ASSETS.soilBad);
            imgSoilGood = loadImage(ASSETS.soilGood);
            imgSoilTexture = loadImage(ASSETS.soilTexture);
            imgPipe = loadImage(ASSETS.pipe);
        }

        function setup() {
            const canvas = createCanvas(windowWidth, windowHeight);
            canvas.parent('canvas-container');
            
            groundY = height * 0.3;
            pipeY = height * 0.7;
            
            initSalts();
            
            // UI 事件绑定
            document.getElementById('mode-on').onclick = () =&gt; switchMode('on');
            document.getElementById('mode-off').onclick = () =&gt; switchMode('off');
            document.getElementById('start-btn').onclick = toggleIrrigation;
            document.getElementById('reset-btn').onclick = resetScene;
        }

        function draw() {
            background(245);
            
            // 1. 绘制背景土层
            drawEnvironment();
            
            // 2. 绘制暗管 (仅在有暗管模式)
            if (mode === 'on') {
                drawPipe();
            }

            // 3. 更新和绘制粒子
            if (isIrrigating) {
                // 生成新水滴
                if (frameCount % 5 === 0) {
                    particles.push(new WaterParticle(random(width), groundY));
                }
            }

            for (let i = particles.length - 1; i &gt;= 0; i--) {
                particles[i].update();
                particles[i].display();
                if (particles[i].isDead) {
                    particles.splice(i, 1);
                }
            }

            // 4. 更新和绘制盐分
            for (let salt of salts) {
                salt.update(particles);
                salt.display();
            }

            // 5. 绘制地表覆盖
            drawSurface();
        }

        function drawEnvironment() {
            // 绘制土壤纹理
            image(imgSoilTexture, 0, groundY, width, height - groundY);
            
            // 绘制地下水层
            noStroke();
            fill(100, 150, 255, 50);
            rect(0, height * 0.85, width, height * 0.15);
            
            // 绘制分界线
            stroke(0, 20);
            line(0, groundY, width, groundY);
        }

        function drawSurface() {
            // 根据模式和盐分状态绘制地表
            let avgSaltY = 0;
            salts.forEach(s =&gt; avgSaltY += s.pos.y);
            avgSaltY /= salts.length;

            // 如果盐分大量聚集在地表，显示盐碱地
            let saltAtSurface = salts.filter(s =&gt; s.pos.y &lt; groundY + 50).length;
            let surfaceAlpha = map(saltAtSurface, 0, salts.length * 0.5, 0, 255);
            
            push();
            if (mode === 'off' &amp;&amp; saltAtSurface &gt; 20) {
                tint(255, surfaceAlpha);
                image(imgSoilBad, 0, 0, width, groundY);
            } else if (mode === 'on' &amp;&amp; saltAtSurface &lt; 10) {
                image(imgSoilGood, 0, 0, width, groundY);
            } else {
                image(imgSoilBad, 0, 0, width, groundY);
            }
            pop();
        }

        function drawPipe() {
            // 绘制多段暗管
            const pipeW = 200;
            const pipeH = 40;
            for (let x = 0; x &lt; width; x += pipeW) {
                image(imgPipe, x, pipeY - pipeH/2, pipeW, pipeH);
            }
        }

        function initSalts() {
            salts = [];
            particles = [];
            // 初始盐分分布在土壤中上层
            for (let i = 0; i &lt; 150; i++) {
                salts.push(new SaltParticle(random(width), random(groundY + 20, height * 0.6)));
            }
        }

        function switchMode(m) {
            mode = m;
            const btnOn = document.getElementById('mode-on');
            const btnOff = document.getElementById('mode-off');
            
            if (m === 'on') {
                btnOn.className = &quot;px-4 py-2 rounded-xl text-sm font-medium border-2 border-[#0A4737] bg-[#0A4737] text-white transition-all&quot;;
                btnOff.className = &quot;px-4 py-2 rounded-xl text-sm font-medium border-2 border-gray-200 text-gray-600 hover:border-[#0A4737] transition-all&quot;;
                updateInfo(&quot;有暗管模式&quot;, &quot;暗管埋设在地下，能够收集并排出含盐水分，防止盐分在地表累积。&quot;);
            } else {
                btnOff.className = &quot;px-4 py-2 rounded-xl text-sm font-medium border-2 border-[#0A4737] bg-[#0A4737] text-white transition-all&quot;;
                btnOn.className = &quot;px-4 py-2 rounded-xl text-sm font-medium border-2 border-gray-200 text-gray-600 hover:border-[#0A4737] transition-all&quot;;
                updateInfo(&quot;无暗管模式&quot;, &quot;没有排水系统，水分蒸发后盐分会随毛细作用上升，导致地表盐碱化。&quot;);
            }
            resetScene();
        }

        function toggleIrrigation() {
            isIrrigating = !isIrrigating;
            const btn = document.getElementById('start-btn');
            if (isIrrigating) {
                btn.innerText = &quot;停止灌溉&quot;;
                btn.className = &quot;w-full bg-red-500 text-white py-3 rounded-xl font-bold mb-2&quot;;
                updateInfo(&quot;灌溉/降雨中&quot;, &quot;水分正在向下渗透，溶解并带走土壤中的盐分（淋溶作用）。&quot;);
            } else {
                btn.innerText = &quot;开始灌溉&quot;;
                btn.className = &quot;w-full btn-primary text-white py-3 rounded-xl font-bold mb-2&quot;;
                if (mode === 'off') {
                    updateInfo(&quot;水分蒸发中&quot;, &quot;失去灌溉后，水分开始蒸发，注意观察盐分颗粒的动向。&quot;);
                }
            }
        }

        function resetScene() {
            isIrrigating = false;
            const btn = document.getElementById('start-btn');
            btn.innerText = &quot;开始灌溉&quot;;
            btn.className = &quot;w-full btn-primary text-white py-3 rounded-xl font-bold mb-2&quot;;
            initSalts();
            updateInfo(&quot;准备就绪&quot;, &quot;点击&ldquo;开始灌溉&rdquo;观察水分如何淋洗土壤中的盐分。&quot;);
        }

        function updateInfo(title, desc) {
            document.getElementById('info-title').innerText = title;
            document.getElementById('info-desc').innerText = desc;
            
            anime({
                targets: '.info-card',
                translateY: [10, 0],
                opacity: [0.5, 1],
                duration: 500,
                easing: 'easeOutQuad'
            });
        }

        // 粒子类定义
        class WaterParticle {
            constructor(x, y) {
                this.pos = createVector(x, y);
                this.vel = createVector(random(-0.5, 0.5), random(1, 2));
                this.acc = createVector(0, 0.05);
                this.isDead = false;
                this.inPipe = false;
            }

            update() {
                if (this.inPipe) {
                    this.pos.x += 4; // 在管子里向右流
                    if (this.pos.x &gt; width) this.isDead = true;
                } else {
                    // 有暗管模式下，水滴下渗速度更快
                    let gravity = mode === 'on' ? 0.1 : 0.05;
                    this.acc.y = gravity;
                    
                    this.vel.add(this.acc);
                    this.pos.add(this.vel);

                    // 碰到暗管 (有暗管模式)
                    if (mode === 'on' &amp;&amp; abs(this.pos.y - pipeY) &lt; 10) {
                        this.inPipe = true;
                        this.vel.set(0, 0);
                    }

                    // 碰到地下水层
                    if (this.pos.y &gt; height * 0.85) {
                        this.isDead = true;
                    }
                }
            }

            display() {
                noStroke();
                fill(100, 150, 255, 150);
                ellipse(this.pos.x, this.pos.y, 6, 8);
            }
        }

        class SaltParticle {
            constructor(x, y) {
                this.pos = createVector(x, y);
                this.originPos = createVector(x, y);
                this.isDissolved = false;
                this.isOut = false;
            }

            update(waters) {
                if (this.isOut) return;

                if (isIrrigating) {
                    // 寻找附近的水滴
                    for (let w of waters) {
                        let d = dist(this.pos.x, this.pos.y, w.pos.x, w.pos.y);
                        if (d &lt; 20) {
                            this.isDissolved = true;
                            // 有暗管模式下，盐分跟随水滴的耦合度更高，移动更快
                            let followSpeed = mode === 'on' ? 0.25 : 0.1;
                            this.pos.lerp(w.pos, followSpeed);
                            if (w.inPipe) {
                                this.isOut = true;
                            }
                            break;
                        }
                    }
                } else if (mode === 'off') {
                    // 模拟蒸发返盐：缓慢向上移动
                    this.pos.y -= 0.2;
                    if (this.pos.y &lt; groundY + 10) {
                        this.pos.y = groundY + 10 + random(-5, 5);
                    }
                }
            }

            display() {
                if (this.isOut) return;
                
                noStroke();
                if (this.isDissolved) {
                    fill(255, 255, 255, 200); // 溶解后变白
                } else {
                    fill(180, 120, 50, 200); // 初始盐分颜色
                }
                ellipse(this.pos.x, this.pos.y, 4, 4);
            }
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            groundY = height * 0.3;
            pipeY = height * 0.7;
        }
    &lt;/script&gt;

  <script>

    function getIsMobile() {
      const width = document.documentElement.clientWidth
      const isMobile = /Android|webOS|iPhone|iPod|BlackBerry|iPad|Windows Phone|Mobile/i.test(navigator.userAgent) || width <= 768
      return isMobile
    }

    // 打开飞象老师官网
    function openFeixiangTeacher(event) {
      const isMobile = getIsMobile()

      // 判断是否为移动端浏览器
      if (isMobile) {
        // 移动端不跳转
        return
      }
      window.open('https://codebn.cn/', '_blank')
    }


    // ==================== 埋点相关代码 ====================

    /**
     * 页面停留时长统计
     */
    (function () {
      let startTime = null
      let totalTime = 0
      let reportTimer = null // 防抖定时器

      // 开始计时
      function startTimer() {
        if (!startTime) {
          startTime = Date.now()
          console.log('[埋点] 开始计时')
        }
      }

      // 停止计时并累加时长
      function stopTimer() {
        if (startTime) {
          totalTime += Date.now() - startTime
          startTime = null
          console.log('[埋点] 停止计时，累计时长:', Math.floor(totalTime / 1000), '秒')
        }
      }

      // 检查页面是否真正可见
      function isPageVisible() {
        // 检查 document.hidden
        if (document.hidden) {
          return false
        }

        // 检查 document.visibilityState
        if (document.visibilityState && document.visibilityState !== 'visible') {
          return false
        }

        // 检查窗口是否有焦点
        if (!document.hasFocus()) {
          return false
        }

        return true
      }

      // 上报停留时长（带防抖）
      function reportStayTime(eventType, immediate = false) {
        stopTimer()

        // 清除之前的定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 如果是立即上报（如页面卸载），不使用防抖
        if (immediate) {
          doReport(eventType)
          return
        }

        // 使用防抖，避免短时间内多次上报
        // 100ms 内如果有多个事件触发，只上报最后一次
        reportTimer = setTimeout(function () {
          doReport(eventType)
          reportTimer = null
        }, 100)
      }

      // 实际执行上报
      function doReport(eventType) {
        if (window.frog && totalTime > 0) {
          const serverData = window.__SERVER_DATA__ || {}
          const chatId = serverData.watermarkChatId
          window.frog.add({
            url: '/time/HtmlPage/enter',
            eventId: 42818,
            customExtend: {
              chat_id: chatId,
              use_time: Math.floor(totalTime / 1000), // 转换为秒
            },
            duration: Math.floor(totalTime / 1000), // 转换为秒,
            currentPage: 'HtmlPage',
            eventAction: 'time',
            eventName: 'enter'
          })
          console.log(`[埋点] 页面停留时长上报 (${eventType}):`, Math.floor(totalTime / 1000), '秒')

          // 上报后重置累计时长，为下次统计做准备
          totalTime = 0
        }
      }

      // 清理函数：移除所有事件监听器
      function cleanup() {
        console.log('[埋点] 清理计时器资源')

        // 清除防抖定时器
        if (reportTimer) {
          clearTimeout(reportTimer)
          reportTimer = null
        }

        // 移除事件监听器
        document.removeEventListener('visibilitychange', handleVisibilityChange)
        window.removeEventListener('blur', handleBlur)
        window.removeEventListener('focus', handleFocus)
        window.removeEventListener('beforeunload', handleBeforeUnload)
        window.removeEventListener('pagehide', handlePageHide)

        // 重置变量
        startTime = null
        totalTime = 0
      }

      // 事件处理函数（需要命名以便移除）
      function handleVisibilityChange() {
        if (document.hidden) {
          // 页面不可见，停止计时并上报
          console.log('[埋点] visibilitychange - 页面隐藏')
          reportStayTime('visibilitychange')
        } else {
          // 页面可见，开始新的计时
          console.log('[埋点] visibilitychange - 页面显示，开始新的计时')
          startTimer()
        }
      }

      function handleBlur() {
        // 窗口失去焦点，停止计时并上报
        console.log('[埋点] blur - 窗口失去焦点')
        reportStayTime('blur')
      }

      function handleFocus() {
        // 窗口获得焦点，开始新的计时
        console.log('[埋点] focus - 窗口获得焦点，开始新的计时')
        startTimer()
      }

      function handleBeforeUnload() {
        // 页面卸载前立即上报（不使用防抖）
        console.log('[埋点] beforeunload - 页面即将卸载')
        reportStayTime('beforeunload', true)
        cleanup()
      }

      function handlePageHide() {
        // 页面隐藏时立即上报（iOS Safari 更可靠，不使用防抖）
        console.log('[埋点] pagehide - 页面隐藏')
        reportStayTime('pagehide', true)
      }

      function handleDOMContentLoaded() {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 监听页面可见性变化
      document.addEventListener('visibilitychange', handleVisibilityChange)

      // 监听窗口失去/获得焦点
      window.addEventListener('blur', handleBlur)
      window.addEventListener('focus', handleFocus)

      // 页面加载完成后开始计时
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', handleDOMContentLoaded)
      } else {
        if (isPageVisible()) {
          startTimer()
        }
      }

      // 页面卸载时上报
      window.addEventListener('beforeunload', handleBeforeUnload)

      // 兼容性：监听 pagehide 事件（iOS Safari 更可靠）
      window.addEventListener('pagehide', handlePageHide)
    })()

    /**

     */
    function trackStartButtonClick(event) {
      // 阻止事件冒泡，避免触发 HTML 点击埋点
      event.stopPropagation()

      if (window.frog) {
        const serverData = window.__SERVER_DATA__ || {}

    // 绑定点击事件
    document.addEventListener('DOMContentLoaded', function () {
      // 绑定 Logo 点击埋点和跳转功能
      const logoElement = document.querySelector('.left-watermark-content')
      if (logoElement) {
        logoElement.addEventListener('click', function (event) {
          trackLogoClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定立即体验按钮点击埋点和跳转功能
      const startButton = document.querySelector('.jump-button')
      if (startButton) {
        startButton.addEventListener('click', function (event) {
          trackStartButtonClick(event)
          openFeixiangTeacher(event)
        })
      }

      // 绑定水印覆盖层点击（整体区域）
      const watermarkOverlay = document.querySelector('.watermark-overlay')
      if (watermarkOverlay) {
        watermarkOverlay.addEventListener('click', function (event) {
          // 如果点击的不是 logo 或按钮，则触发跳转
          const target = event.target
          const isLogo = target.closest('.left-watermark-content')
          const isButton = target.closest('.jump-button')

          if (!isLogo && !isButton) {
            openFeixiangTeacher(event)
          }
        })
      }
    })

    // ==================== 原有功能代码 ====================

    function adjustRem() {
      const pcBaseWidth = 375 // 设计稿
      const width = document.documentElement.clientWidth
      document.documentElement.style.fontSize = `${(width / pcBaseWidth * 100).toFixed(2)}px`
    }


    // 移动端检测和按钮隐藏逻辑
    function checkAndHideButtonOnMobile() {
      const isMobile = getIsMobile()
      if (isMobile) {
        adjustRem()
      }
      const jumpButton = document.querySelector('.right-watermark-content .jump-button');
      const iframeContainer = document.querySelector('.iframe-container');

      if (isMobile && jumpButton) {
        jumpButton.style.display = 'none';
      } else {
        jumpButton.style.display = 'flex'
      }

      // 移动端时给iframe-container添加类名，否则移除类名
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }


    function handleResize() {
      // 响应式处理：重新检测移动端并处理按钮显示/隐藏
      checkAndHideButtonOnMobile();

      // 在窗口大小变化时，重新应用移动端相关的逻辑
      const isMobile = getIsMobile()
      const watermarkOverlay = document.querySelector('.watermark-overlay');
      const iframeContainer = document.querySelector('.iframe-container');

      // 根据当前设备类型调整水印覆盖层的点击行为
      if (watermarkOverlay) {
        if (isMobile) {
          // 移动端：移除点击事件或设置为空函数
          watermarkOverlay.onclick = function () {
            // 移动端不执行跳转
            return;
          };
        } else {
          // 桌面端：恢复正常的点击跳转功能
          watermarkOverlay.onclick = openFeixiangTeacher;
        }
      }

      // 确保在resize时也能正确添加或移除mobile类
      if (iframeContainer) {
        if (isMobile) {
          iframeContainer.classList.add('mobile');
        } else {
          iframeContainer.classList.remove('mobile');
        }
      }
    }

    // 防止iframe内容溢出
    window.addEventListener('resize', handleResize);

    // 页面加载完成后执行移动端检测
    document.addEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);

    // 清理所有事件绑定的函数
    function clearAllEvents() {
      // 清除 resize 事件监听器
      window.removeEventListener('resize', handleResize);

      // 清除 DOMContentLoaded 事件监听器
      document.removeEventListener('DOMContentLoaded', checkAndHideButtonOnMobile);
    }

    // 页面卸载时自动清理事件（可选）
    window.addEventListener('beforeunload', clearAllEvents);
