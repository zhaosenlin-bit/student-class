<!DOCTYPE html>
<html lang="zh">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>航海对战 · 知识决斗</title>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Arial Black', 'Impact', 'Franklin Gothic Heavy', sans-serif;
            font-weight: 900;
            background: #2a1d12;
            color: #f5e8c7;
        }

        /* 全屏画面层 */
        .screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 2.5rem;
            background: radial-gradient(circle at 30% 40%, #b99a6b, #5f3f24 80%, #2a1d12);
            box-shadow: inset 0 0 0 8px rgba(245, 232, 199, 0.2), inset 0 0 70px rgba(0,0,0,0.6);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            z-index: 1;
            text-shadow: 0 4px 12px rgba(0,0,0,0.8), 0 0 0 2px #2f1f0e;
            letter-spacing: 0.03em;
        }
        .screen.active {
            opacity: 1;
            pointer-events: auto;
            z-index: 10;
        }
        .screen::before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(45deg, rgba(100, 70, 30, 0.1) 0px, rgba(100, 70, 30, 0.1) 4px, transparent 4px, transparent 12px);
            pointer-events: none;
            z-index: 0;
        }
        .screen > * { position: relative; z-index: 2; }

        /* 角色选择画面 */
        .select-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem 4rem;
            width: 100%;
            max-width: 1200px;
            margin: 0.5rem 0;
        }
        .select-col {
            flex: 1 1 280px;
            background: rgba(40, 25, 12, 0.6);
            backdrop-filter: blur(4px);
            border: 4px solid #c9a86a;
            border-radius: 50px 20px 50px 20px;
            padding: 1.2rem 1rem 1.8rem;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
        }
        .select-col h2 {
            font-size: 2rem;
            margin: 0 0 0.8rem 0;
            color: #f7e9c3;
            text-shadow: 0 0 20px #b2824e;
        }
        .char-preview {
            width: 100%;
            min-height: 140px;
            background: rgba(0,0,0,0.3);
            border-radius: 40px 12px 40px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            border: 2px dashed #dbb87c;
            margin-bottom: 0.5rem;
            font-size: 1.4rem;
        }
        .char-preview img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #dbb87c;
            background: #4f321b;
        }
        .char-preview .char-name {
            font-size: 1.8rem;
            margin: 0.2rem 0;
        }
        .char-preview .skill {
            font-size: 1.2rem;
            background: rgba(0,0,0,0.4);
            padding: 0.1rem 1rem;
            border-radius: 40px;
        }
        .char-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
            justify-content: center;
            margin-top: 0.8rem;
        }
        .char-item {
            background: rgba(210, 175, 110, 0.2);
            border: 2px solid #b2824e;
            border-radius: 40px;
            padding: 0.3rem 0.6rem;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.1s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .char-item img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid #dbb87c;
        }
        .char-item.selected {
            background: #b2824e;
            color: #2a1d12;
            box-shadow: 0 0 20px #f5d48b;
        }
        .battle-btn {
            background: #dbb87c;
            border: none;
            border-radius: 80px;
            padding: 1rem 3.5rem;
            font-size: 2.4rem;
            font-weight: 900;
            color: #2f1f0e;
            cursor: pointer;
            box-shadow: 0 10px 0 #7a5833;
            transition: 0.06s;
            margin-top: 1.5rem;
            border: 2px solid #f5e1a4;
            opacity: 0.5;
            pointer-events: none;
        }
        .battle-btn.ready {
            opacity: 1;
            pointer-events: auto;
        }
        .battle-btn:active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 #5f3e22;
        }

        /* 随机按钮 */
        .random-btn {
            background: #4a3221;
            border: 2px solid #dbb87c;
            border-radius: 60px;
            padding: 0.3rem 1rem;
            font-size: 1.3rem;
            font-weight: 900;
            color: #f5e8c7;
            cursor: pointer;
            transition: 0.08s;
            margin-top: 0.5rem;
            display: inline-block;
            box-shadow: 0 4px 0 #2f1f0e;
        }
        .random-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #2f1f0e;
        }

        /* VS过渡 (隐藏) 直接进入战斗，但保留VS动画可调用 */
        .vs-flash {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #dbb87c, #2f1f0e 90%);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        .vs-flash.active {
            opacity: 1;
            pointer-events: none;
        }
        .vs-flash .vs-text {
            font-size: 18rem;
            color: #f7e9c3;
            text-shadow: 0 0 80px #b2824e, 0 20px 40px black;
            animation: vsBoom 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes vsBoom {
            0% { transform: scale(0); opacity: 0; }
            50% { transform: scale(1.3); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 战斗画面 */
        .battle-hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            background: rgba(0,0,0,0.4);
            border-radius: 60px 20px 60px 20px;
            padding: 0.6rem 2rem;
            border: 3px solid #b2824e;
            margin-bottom: 0.5rem;
            flex-wrap: wrap;
        }
        .hud-player {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex: 1;
            min-width: 180px;
        }
        .hud-player.right { justify-content: flex-end; }
        .hud-name {
            font-size: 1.8rem;
            white-space: nowrap;
        }
        .hp-bar-bg {
            width: 120px;
            height: 24px;
            background: #3a2416;
            border-radius: 20px;
            border: 2px solid #7a5833;
            overflow: hidden;
            transform: skewX(-15deg);
        }
        .hp-bar {
            height: 100%;
            width: 100%;
            background: #5bbf4a;
            transition: width 0.3s ease;
        }
        .hp-text {
            font-size: 1.6rem;
            margin-left: 0.4rem;
        }
        .arena {
            display: flex;
            justify-content: space-around;
            align-items: flex-end;
            width: 100%;
            max-width: 1000px;
            min-height: 300px;
            margin: 0.3rem 0;
        }
        .fighter {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 45%;
        }
        .fighter img {
            width: 80%;
            max-height: 240px;
            object-fit: contain;
            filter: drop-shadow(0 20px 20px rgba(0,0,0,0.6));
            animation: breathe 2s ease-in-out infinite;
        }
        @keyframes breathe {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .ground {
            width: 100%;
            height: 12px;
            background: repeating-linear-gradient(90deg, #6f4e2e 0px, #6f4e2e 20px, #b2824e 20px, #b2824e 40px);
            border-radius: 20px;
            margin-top: 0.2rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        /* 题目卡片 (战斗时覆盖) */
        .battle-quiz-card {
            background: rgba(30, 20, 8, 0.85);
            backdrop-filter: blur(6px);
            border: 4px solid #dbb87c;
            border-radius: 60px 20px 60px 20px;
            padding: 1rem 2rem;
            max-width: 900px;
            width: 100%;
            margin: 0.8rem 0;
        }
        .battle-quiz-card .q-text {
            font-size: clamp(1.4rem, 4vw, 2.2rem);
            margin-bottom: 0.8rem;
            text-align: center;
        }
        .battle-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
        }
        .battle-opt {
            background: rgba(60, 40, 22, 0.7);
            border: 4px solid #b2824e;
            border-radius: 40px 10px 40px 10px;
            padding: 0.8rem 0.4rem;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            font-weight: 900;
            color: #f7e9c3;
            text-align: center;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 6px 0 #4f321b;
        }
        .battle-opt:active { transform: translateY(4px); box-shadow: 0 2px 0 #3f2816; }
        .battle-opt.correct { background: #3f8530; border-color: #b6e69b; }
        .battle-opt.wrong { background: #9e3a2b; border-color: #e6846a; }
        .battle-opt.disabled { pointer-events: none; opacity: 0.7; }

        /* 胜利画面 */
        .victory-box {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            padding: 2rem 4rem;
            border-radius: 80px 20px 80px 20px;
            border: 6px solid #f5d48b;
            text-align: center;
            box-shadow: 0 0 80px #b2824e;
        }
        .victory-box .winner-name {
            font-size: 4rem;
        }
        .victory-box .winner-sub {
            font-size: 2rem;
            opacity: 0.9;
        }
        .victory-box .score-detail {
            font-size: 1.6rem;
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 0.3rem 1.5rem;
            margin: 0.5rem 0;
        }
        .restart-btn {
            background: #dbb87c;
            border: none;
            border-radius: 60px;
            padding: 1rem 3rem;
            font-size: 2rem;
            font-weight: 900;
            color: #2f1f0e;
            cursor: pointer;
            box-shadow: 0 8px 0 #7a5833;
            transition: 0.06s;
            margin-top: 1rem;
        }
        .restart-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 #5f3e22; }

        /* 通用 */
        .big-title { font-size: clamp(2.5rem, 10vw, 5rem); color: #f7e9c3; text-shadow: 0 8px 20px #2a1a0a; }
        .feedback-badge {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0);
            font-size: 18rem; z-index: 100; pointer-events: none;
            text-shadow: 0 0 60px currentColor;
        }
        .feedback-badge.show { animation: badgePop 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards; }
        @keyframes badgePop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }
        .feedback-badge.hide-anim { animation: badgeFade 0.4s ease-in forwards; }
        @keyframes badgeFade { 0% { opacity:1; } 100% { opacity:0; } }
        @media (max-width: 700px) {
            .screen { padding: 1rem; }
            .battle-options { grid-template-columns: 1fr; }
            .hud-player .hp-bar-bg { width: 80px; }
            .fighter img { max-height: 150px; }
        }
    </style>
</head>

<!-- 画面1: 角色选择 -->
<div id="screenSelect" class="screen active">
    <div class="big-title">⚔️ 航海决斗 ⚔️</div>
    <div class="select-grid">
        <div class="select-col" id="player1Col">
            <h2>👑 玩家 1</h2>
            <div class="char-preview" id="preview1">
                <div style="opacity:0.6;">选择你的航海家</div>
            </div>
            <div class="char-list" id="charList1"></div>
            <button class="random-btn" id="random1Btn">🎲 随机角色</button>
        </div>
        <div class="select-col" id="player2Col">
            <h2>🏴‍☠️ 玩家 2</h2>
            <div class="char-preview" id="preview2">
                <div style="opacity:0.6;">选择你的航海家</div>
            </div>
            <div class="char-list" id="charList2"></div>
            <button class="random-btn" id="random2Btn">🎲 随机角色</button>
        </div>
    </div>
    <button id="startBattleBtn" class="battle-btn">⚓ 开始对战 ⚓</button>
</div>

<!-- VS过渡 (快速闪现) -->
<div id="vsOverlay" class="vs-flash"><div class="vs-text">VS</div></div>

<!-- 画面2: 战斗 -->
<div id="screenBattle" class="screen">
    <div class="battle-hud">
        <div class="hud-player" id="hudLeft">
            <span class="hud-name" id="nameLeft">玩家1</span>
            <div class="hp-bar-bg"><div class="hp-bar" id="hpLeft" style="width:100%"></div></div>
            <span class="hp-text" id="hpTextLeft">100</span>
        </div>
        <div style="font-size:2.2rem; color:#f5d48b;">⚔️</div>
        <div class="hud-player right" id="hudRight">
            <span class="hp-text" id="hpTextRight">100</span>
            <div class="hp-bar-bg"><div class="hp-bar" id="hpRight" style="width:100%"></div></div>
            <span class="hud-name" id="nameRight">玩家2</span>
        </div>
    </div>
    <div class="arena">
        <div class="fighter" id="fighterLeft"><img id="charImgLeft" src="" alt="角色"><div class="ground"></div></div>
        <div class="fighter" id="fighterRight"><img id="charImgRight" src="" alt="角色"><div class="ground"></div></div>
    </div>
    <div class="battle-quiz-card" id="battleQuiz">
        <div class="q-text" id="battleQuestion">加载题目...</div>
        <div class="battle-options" id="battleOptions"></div>
    </div>
</div>

<!-- 画面3: 胜利 -->
<div id="screenVictory" class="screen">
    <div class="victory-box">
        <div style="font-size:3rem;">🏆</div>
        <div class="winner-name" id="winnerName">航海家</div>
        <div class="winner-sub" id="winnerSub">获得胜利！</div>
        <div class="score-detail" id="victoryDetail">正确: 0 / 错误: 0</div>
        <button id="restartFromVictory" class="restart-btn">⟳ 再次起航</button>
    </div>
</div>
