<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🍭 扇形统计图3D · 小课堂</title>
  <style>
    /* -------------------- 浅色清新主题（小学生友好） -------------------- */
    :root {
      --bg-sky: #f0f7ff;
      --bg-card: #ffffff;
      --bg-soft: #e6f0fa;
      --border-light: #cde0f0;
      --text-dark: #1a3a4a;
      --text-soft: #3d5f73;
      --text-white: #ffffff;
      --accent-blue: #4aa3e2;
      --accent-green: #6ccb9c;
      --accent-orange: #f9a95a;
      --accent-pink: #f28b9e;
      --accent-purple: #b48ad9;
      --accent-yellow: #f5d34e;
      --shadow-card: 0 6px 20px rgba(0, 20, 40, 0.08);
      --radius-btn: 30px;
      --radius-card: 20px;
      --transition: 0.3s cubic-bezier(0.2, 0.9, 0.3, 1);
      --font: 'Segoe UI', 'Comic Sans MS', 'Chalkboard SE', system-ui, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font);
      background: var(--bg-sky);
      color: var(--text-dark);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* ----- 全屏沉浸 3D 容器 ----- */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: radial-gradient(circle at 30% 40%, #d4e9ff, #b8d8f0);
      touch-action: none;
    }

    /* ----- 浮动控件 (全屏沉浸式) ----- */
    .float-ui {
      position: fixed;
      z-index: 20;
      pointer-events: none;
    }
    .float-ui > * {
      pointer-events: auto;
    }

    /* 顶部标题 + 步骤指示 */
    .top-bar {
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(255, 255, 255, 0.80);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 20px 8px 24px;
      border-radius: 60px;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(255, 255, 255, 0.5);
      white-space: nowrap;
    }
    .top-bar h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: 0.5px;
    }
    .top-bar h1 span {
      color: var(--accent-blue);
    }
    .step-badge {
      background: var(--accent-blue);
      color: white;
      font-size: 15px;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 40px;
      box-shadow: 0 2px 8px rgba(74, 163, 226, 0.3);
    }

    /* 底部控制区 */
    .bottom-controls {
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 12px 22px;
      border-radius: 60px;
      box-shadow: var(--shadow-card);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .btn-step {
      background: white;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius-btn);
      font-weight: 600;
      font-size: 18px;
      color: var(--text-dark);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.04);
      cursor: pointer;
      transition: all var(--transition);
      border: 1px solid var(--border-light);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 70px;
      justify-content: center;
    }
    .btn-step:hover {
      background: var(--accent-blue);
      color: white;
      border-color: var(--accent-blue);
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(74, 163, 226, 0.25);
    }
    .btn-step:active {
      transform: scale(0.94);
    }
    .btn-step:disabled {
      opacity: 0.4;
      pointer-events: none;
      filter: grayscale(0.6);
    }
    .btn-step .icon {
      font-size: 22px;
      line-height: 1;
    }

    .step-dots {
      display: flex;
      gap: 8px;
      margin: 0 6px;
    }
    .step-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--border-light);
      transition: all var(--transition);
      border: 2px solid transparent;
    }
    .step-dot.active {
      background: var(--accent-blue);
      border-color: white;
      box-shadow: 0 0 0 3px rgba(74, 163, 226, 0.3);
      transform: scale(1.15);
    }

    /* 右上角小按钮：自动旋转切换 */
    .top-right {
      top: 22px;
      right: 22px;
      display: flex;
      gap: 10px;
    }
    .icon-btn {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      cursor: pointer;
      box-shadow: var(--shadow-card);
      transition: all var(--transition);
      color: var(--text-dark);
    }
    .icon-btn:hover {
      background: white;
      transform: scale(1.05);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.06);
    }
    .icon-btn.active {
      background: var(--accent-blue);
      color: white;
      border-color: var(--accent-blue);
    }

    /* ----- 数据弹窗 (点击扇区) ----- */
    .popup-card {
      position: fixed;
      bottom: 110px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 28px;
      padding: 18px 28px 22px;
      box-shadow: 0 12px 40px rgba(0, 20, 40, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.7);
      z-index: 30;
      max-width: 360px;
      width: max-content;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      border-top: 6px solid var(--accent-blue);
    }
    .popup-card.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }
    .popup-card .popup-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-dark);
    }
    .popup-card .popup-detail {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin-top: 8px;
      font-size: 18px;
    }
    .popup-card .popup-detail span {
      background: var(--bg-soft);
      padding: 4px 16px;
      border-radius: 40px;
      font-weight: 600;
      color: var(--text-soft);
    }
    .popup-card .popup-detail .value {
      background: var(--accent-blue);
      color: white;
    }
    .popup-card .close-popup {
      position: absolute;
      top: 8px;
      right: 14px;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-soft);
      opacity: 0.5;
      transition: 0.2s;
      pointer-events: auto;
    }
    .popup-card .close-popup:hover {
      opacity: 1;
      transform: scale(1.1);
    }

    /* 响应式：小屏幕字体与间距调整 */
    @media (max-width: 640px) {
      .top-bar {
        padding: 6px 14px 6px 18px;
        gap: 8px;
        top: 12px;
      }
      .top-bar h1 {
        font-size: 17px;
      }
      .step-badge {
        font-size: 13px;
        padding: 2px 12px;
      }
      .bottom-controls {
        padding: 10px 16px;
        gap: 8px;
        bottom: 18px;
        flex-wrap: wrap;
        border-radius: 40px;
        max-width: 94vw;
      }
      .btn-step {
        font-size: 15px;
        padding: 8px 14px;
        min-width: 60px;
      }
      .step-dot {
        width: 12px;
        height: 12px;
      }
      .icon-btn {
        width: 42px;
        height: 42px;
        font-size: 22px;
      }
      .top-right {
        top: 14px;
        right: 14px;
      }
      .popup-card {
        max-width: 280px;
        padding: 14px 20px 18px;
        bottom: 90px;
      }
      .popup-card .popup-title {
        font-size: 17px;
      }
      .popup-card .popup-detail {
        font-size: 15px;
        gap: 16px;
      }
    }
  </style>
</head>

  <!-- 3D 渲染容器 -->
  <div id="canvas-container"></div>

  <!-- 全屏沉浸式浮动 UI -->
  <div class="float-ui top-bar">
    <h1>🍭 <span>扇形</span>小统计</h1>
    <span class="step-badge" id="stepBadge">第 1 步</span>
  </div>

  <div class="float-ui top-right">
    <button class="icon-btn active" id="btnAutoRotate" title="自动旋转">⟳</button>
  </div>

  <div class="float-ui bottom-controls">
    <button class="btn-step" id="prevStep" disabled><span class="icon">◀</span> 上一步</button>
    <div class="step-dots" id="stepDots">
      <span class="step-dot active"></span>
      <span class="step-dot"></span>
      <span class="step-dot"></span>
      <span class="step-dot"></span>
    </div>
    <button class="btn-step" id="nextStep">下一步 <span class="icon">▶</span></button>
  </div>

  <!-- 点击扇区弹出数据卡片 -->
  <div class="popup-card" id="popupCard">
    <span class="close-popup" id="closePopup">✕</span>
    <div class="popup-title" id="popupTitle">🍎 苹果</div>
    <div class="popup-detail">
      <span>占比 <strong id="popupPercent">25%</strong></span>
      <span class="value" id="popupValue">12 个</span>
    </div>
  </div>
