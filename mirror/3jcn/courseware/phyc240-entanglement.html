  function addParticle1(x, y, z) {
	    var sunGeom = new THREE.SphereGeometry(10, 32, 24); 
	    const tex1 = textureloader.load('textures/bg1.jfif');
	    const material = new THREE.MeshBasicMaterial({ map: tex1 });
	    particle1 = new THREE.Mesh(sunGeom, material);
	    particle1.position.set(x, y, z);
	    scene.add(particle1);
	
	    // Alternating arrow logic
	    let direction1 = 'up'; // Initial direction for particle1's arrow
	    interval1 = setInterval(() => {
	        // Remove the existing arrow if any
	        if (particle1.children.length > 0) {
	            particle1.remove(particle1.children[0]);
	        }
	
	        // Create a new arrow
	        const arrow1 = createVerticalArrow(25, 2, direction1);
	        particle1.add(arrow1);
	        arrow1.position.y = -12;
	
	        // Toggle direction for next interval
	        direction1 = (direction1 === 'up') ? 'down' : 'up';
	    }, 100); // Change arrow every 500ms
	}

	    }, 100); // Change arrow every 500ms
	}
	
	 function createVerticalArrow(height, radius, direction) {
	    // Define colors based on the direction
	    const color = (direction === 'up') ? 0x0000ff : 0xff0000; // Blue for up, Red for down
	
	    // Create a group to hold the arrow components
	    const arrow = new THREE.Group();
	
	    // Cylinder (shaft of the arrow)
	    const cylinderGeometry = new THREE.CylinderGeometry(radius, radius, height, 32);
	    const cylinderMaterial = new THREE.MeshBasicMaterial({ color: color });
	    const cylinder = new THREE.Mesh(cylinderGeometry, cylinderMaterial);
	
	    // Position the cylinder vertically centered
	    cylinder.position.y = height / 2;
	    arrow.add(cylinder);
	
	    // Cone (head of the arrow)
	    const coneHeight = height * 0.3;
	    const coneGeometry = new THREE.ConeGeometry(radius * 1.5, coneHeight, 32);
	    const coneMaterial = new THREE.MeshBasicMaterial({ color: color });
	    const cone = new THREE.Mesh(coneGeometry, coneMaterial);
	
	    // Position the cone on top or bottom based on direction
	    if (direction === 'up') {
	        cone.position.y = height + (coneHeight / 2);
	    } else if (direction === 'down') {
	        cone.position.y = -(coneHeight / 2);
	        cone.rotation.x = Math.PI; // Flip the cone to point down
	    }
	    arrow.add(cone);
	
	    // Return the arrow object
	    return arrow;
	}

	    function addStars() {
	        const starGeo = new THREE.BufferGeometry();
	        const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.025 });
	        const starCount = 5000;
	        const starPositions = new Float32Array(starCount * 3);
	        for (let i = 0; i < starCount * 3; i++) {
	            starPositions[i] = (Math.random() - 0.5) * 200;
	        }
	        starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
	        const stars = new THREE.Points(starGeo, starMat);
	        scene.add(stars);
	    }

	function measureParticle(side) {
		rotationEnabled = true;
		createFire();
	    if (side === 'left' || side === 'right') {
	        // Clear existing intervals to stop automatic arrow creation
	        clearInterval(interval1);
	        clearInterval(interval2);
	
	        // Remove existing arrows
	        particle1.children.forEach(child => particle1.remove(child));
	        particle2.children.forEach(child => particle2.remove(child));
	
	        // Randomly choose the direction for the first arrow
	        particle1Direction = Math.random() < 0.5 ? 'up' : 'down';
	        particle2Direction = particle1Direction === 'up' ? 'down' : 'up';
	
	        // Create new arrows with opposite directions
	        arrow1 = createVerticalArrow(25, 2, particle1Direction);
	        arrow2 = createVerticalArrow(25, 2, particle2Direction);
	
	        // Add arrows to particles
	        particle1.add(arrow1);
	        arrow1.position.y = -12;
	        particle2.add(arrow2);
	        arrow2.position.y = -12;
		if (side === 'left') {
	                document.getElementById('measureRight').disabled = true;
	        } else if (side === 'right') {
	                document.getElementById('measureLeft').disabled = true;
	        }
	    }
	}
	
    function onWindowResize() {

            var textMaterial = new THREE.MeshBasicMaterial({ color: hex });
            var titleMesh = new THREE.Mesh(textGeo, textMaterial);
            titleMesh.position.set(x, y, z);
            titleMesh.rotateY(theta);
            scene.add(titleMesh);
        });
    }
	
	  render = function () {
	    if (rotationEnabled) {
		fire.update( performance.now() / 1000 );
	        // Rotate particle1 based on its arrow direction
	        if (particle1Direction === 'up') {
	            particle1.rotation.y += 0.2; // Anticlockwise
	        } else if (particle1Direction === 'down') {
	            particle1.rotation.y -= 0.2; // Clockwise
	        }
	
	        // Rotate particle2 based on its arrow direction
	        if (particle2Direction === 'up') {
	            particle2.rotation.y += 0.2; // Anticlockwise
	        } else if (particle2Direction === 'down') {
	            particle2.rotation.y -= 0.2; // Clockwise
	        }
