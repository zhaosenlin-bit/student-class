<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数轴跳跃加减法 · 小学数学可视化</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /* ── 1. CSS 变量 ─────────────────────────────── */
    :root {
      --bg: #f0f7ff;
      --surface: #ffffff;
      --surface2: #e8f3fd;
      --ink: #1a2b3c;
      --ink2: #4a6a8a;
      --ink3: #8aaccc;
      --border: #ccdff0;

      --blue: #2a7bc8;
      --blue-light: #dceeff;
      --blue-dark: #1a5a9c;

      --green: #1a8c5a;
      --green-light: #d4f5e3;
      --green-dark: #0d6040;

      --amber: #c87820;
      --amber-light: #fef0d4;
      --amber-dark: #9a5810;

      --red: #c83020;
      --red-light: #fde8e4;

      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 2px 12px rgba(42, 123, 200, 0.10);
    }

    /* ── 2. 全局重置 ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── 3. 头部 ─────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 2px solid var(--border);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: var(--shadow);
    }
    header .icon { font-size: 28px; }
    header h1 { font-size: 18px; font-weight: 700; color: var(--blue-dark); }
    header .tag {
      font-size: 11px; font-weight: 600;
      background: var(--blue-light); color: var(--blue-dark);
      padding: 3px 10px; border-radius: 20px;
    }

    /* ── 4. 主体布局 ─────────────────────────────── */
    main {
      flex: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
    }

    /* ── 5. 卡片 ─────────────────────────────────── */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      border: 1.5px solid var(--border);
    }
    .card-title {
      font-size: 13px; font-weight: 600;
      color: var(--ink2);
      margin-bottom: 14px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* ── 6. 数轴画布区 ───────────────────────────── */
    #canvasWrap {
      width: 100%;
      position: relative;
    }
    #numberlineCanvas {
      width: 100%;
      height: 160px;
      display: block;
      border-radius: var(--radius-sm);
    }

    /* ── 7. 控制区 ───────────────────────────────── */
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .ctrl-group label {
      display: block;
      font-size: 12px; font-weight: 600;
      color: var(--ink2);
      margin-bottom: 6px;
    }
    .number-input-wrap {
      display: flex;
      align-items: center;
      gap: 0;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      overflow: hidden;
      background: var(--surface);
    }
    .number-input-wrap button {
      width: 40px; height: 44px;
      border: none; background: var(--surface2);
      font-size: 20px; cursor: pointer;
      color: var(--blue-dark);
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .number-input-wrap button:hover { background: var(--blue-light); }
    .number-input-wrap input {
      flex: 1; height: 44px;
      border: none; outline: none;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px; font-weight: 600;
      color: var(--ink);
      background: transparent;
      -moz-appearance: textfield;
    }
    .number-input-wrap input::-webkit-outer-spin-button,
    .number-input-wrap input::-webkit-inner-spin-button { -webkit-appearance: none; }

    /* 运算符切换 */
    .op-toggle {
      display: flex;
      gap: 8px;
    }
    .op-btn {
      flex: 1; height: 44px;
      border: 2px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      font-size: 22px; font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      color: var(--ink2);
    }
    .op-btn.active-add { border-color: var(--green); background: var(--green-light); color: var(--green-dark); }
    .op-btn.active-sub { border-color: var(--red); background: var(--red-light); color: var(--red); }

    /* 执行按钮 */
    .run-btn {
      width: 100%; height: 52px;
      border: none; border-radius: var(--radius);
      background: var(--blue);
      color: #fff;
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 16px; font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: background 0.15s, transform 0.1s;
      box-shadow: 0 3px 10px rgba(42, 123, 200, 0.3);
    }
    .run-btn:hover { background: var(--blue-dark); }
    .run-btn:active { transform: scale(0.98); }
    .run-btn:disabled { background: var(--ink3); cursor: not-allowed; box-shadow: none; }

    /* 重置按钮 */
    .reset-btn {
      width: 100%; height: 40px;
      border: 2px solid var(--border); border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--ink2);
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 13px; font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .reset-btn:hover { border-color: var(--ink3); color: var(--ink); }

    /* ── 8. 等式显示区（PEDAGOGY V3：默认隐藏） ───── */
    #equationArea {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #equationArea.visible { opacity: 1; }
    .equation-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px; font-weight: 600;
      color: var(--blue-dark);
      text-align: center;
    }
    .equation-text .op-plus { color: var(--green-dark); }
    .equation-text .op-minus { color: var(--red); }
    .equation-text .result { color: var(--amber-dark); font-size: 32px; }
    .equation-text .question-mark { color: var(--ink3); }

    /* ── 9. 概念反馈区（PEDAGOGY V8） ────────────── */
    #feedbackArea {
      min-height: 52px;
      background: var(--blue-light);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 14px;
      color: var(--blue-dark);
      line-height: 1.6;
      opacity: 0;
      transition: opacity 0.4s ease 0.2s;
      border-left: 4px solid var(--blue);
    }
    #feedbackArea.visible { opacity: 1; }
    #feedbackArea.feedback-add { border-color: var(--green); background: var(--green-light); color: var(--green-dark); }
    #feedbackArea.feedback-sub { border-color: var(--red); background: var(--red-light); color: var(--red); }

    /* ── 10. 历史记录 ────────────────────────────── */
    #historyList {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 150px;
      overflow-y: auto;
    }
    #historyList li {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      padding: 6px 12px;
      background: var(--surface2);
      border-radius: var(--radius-sm);
      color: var(--ink2);
      display: flex;
      justify-content: space-between;
    }
    #historyList li .hist-result { font-weight: 600; color: var(--blue-dark); }

    /* ── 11. 响应式 ──────────────────────────────── */
    @media (max-width: 480px) {
      main { padding: 16px 12px; gap: 14px; }
      .controls { grid-template-columns: 1fr; }
      .equation-text { font-size: 22px; }
    }
  </style>
</head>

<header>
  <span class="icon">🐸</span>
  <h1>数轴跳跃加减法</h1>
  <span class="tag">小学 · 数与运算</span>
</header>

<main>

  <!-- 数轴画布 -->
  <div class="card">
    <div class="card-title">数轴</div>
    <div id="canvasWrap">
      <canvas id="numberlineCanvas"></canvas>
    </div>
  </div>

  <!-- 等式显示（PEDAGOGY V3：动画前隐藏） -->
  <div class="card">
    <div id="equationArea">
      <div class="equation-text" id="equationText"></div>
    </div>
  </div>

  <!-- 控制区 -->
  <div class="card">
    <div class="card-title">设置计算</div>
    <div class="controls">
      <div class="ctrl-group">
        <label>起始数字</label>
        <div class="number-input-wrap">
          <button onclick="changeVal('start', -1)">−</button>
          <input type="number" id="startVal" value="5" min="-10" max="20">
          <button onclick="changeVal('start', 1)">+</button>
        </div>
      </div>
      <div class="ctrl-group">
        <label>跳跃步数</label>
        <div class="number-input-wrap">
          <button onclick="changeVal('steps', -1)">−</button>
          <input type="number" id="stepsVal" value="3" min="1" max="10">
          <button onclick="changeVal('steps', 1)">+</button>
        </div>
      </div>
    </div>

    <div class="ctrl-group" style="margin-top:14px">
      <label>运算符</label>
      <div class="op-toggle">
        <button class="op-btn active-add" id="btnAdd" onclick="setOp('add')">＋ 加法</button>
        <button class="op-btn" id="btnSub" onclick="setOp('sub')">－ 减法</button>
      </div>
    </div>

    <div style="margin-top:16px; display:flex; flex-direction:column; gap:8px;">
      <button class="run-btn" id="runBtn" onclick="runAnimation()">🐸 出发跳跃！</button>
      <button class="reset-btn" onclick="resetAll()">↺ 重置</button>
    </div>
  </div>

  <!-- 概念反馈（PEDAGOGY V8） -->
  <div class="card">
    <div class="card-title">你发现了什么？</div>
    <div id="feedbackArea"></div>
  </div>

  <!-- 历史记录 -->
  <div class="card" id="historyCard" style="display:none">
    <div class="card-title">计算记录</div>
    <ul id="historyList"></ul>
  </div>

</main>

  });

  // 防键盘快捷键: F12 | Ctrl+Shift+I | Ctrl+Shift+J | Ctrl+U | Ctrl+S
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'i' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u')) ||
      (e.ctrlKey && (e.key === 's' || e.key === 'S'))
    ) {
      e.preventDefault();
      return false;
    }
  });

  // DevTools 检测（基于 debugger 语句执行耗时）
  var _cdt = function() {
    var t0 = performance.now();
    (function(){}).constructor('debugger')();
    if (performance.now() - t0 > 100) {
      (function lp() {
        (function(){}).constructor('debugger')();
        setTimeout(lp, 50);
      })();
    }
  };
  setTimeout(_cdt, 1000);
  setInterval(_cdt, 3000);

  // 控制台版权声明
  setTimeout(function() {
    console.log('%c⚠️ 版权声明', 'font-size:18px;color:#ef4444;font-weight:bold');
    console.log('%c本内容受版权保护，未经授权复制或分发将承担法律责任。', 'font-size:13px;color:#666');
  }, 500);
})();
</script>
