    <title>英雄知识大乱斗 - 错题复盘版</title>
    <style>
        /* === BASE STYLES === */
        :root {
            --hp-green: #4cd137;

        /* === SELECT SCREEN === */
        #select-screen { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); z-index: 100; }
        .title {
            font-size: 3rem; margin-bottom: 10px; color: #ffcc00;
            text-shadow: 4px 4px 0 #ff0000, 0 0 20px #ffcc00;

        }
        .top-bar { width: 90%; display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; flex-wrap: wrap;}
        .action-btn {

        }
        .action-btn:hover { background: rgba(0, 255, 255, 0.2); transform: translateY(-2px); }
        .selection-area { display: flex; gap: 30px; align-items: center; }
        .team-slot {
            width: 250px; height: 350px; border: 4px solid #fff; background: rgba(0,0,0,0.5);

        }
        .team-slot:hover { background: rgba(255,255,255,0.1); border-color: #ffcc00; }
        .slot-img-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: flex-end; overflow: hidden; }

        .team-label { position: absolute; top: 10px; left: 10px; font-size: 1.2rem; text-shadow: 2px 2px 0 #000; z-index: 6;}

        .character-grid {

        .char-card .name-tag {

        #start-btn {

        /* === CUSTOM PROMPT MODAL === */

        /* === QUESTION BANK STORAGE MODAL === */

        .qbank-btn-delete:hover { background: #c0392b; }

        .qbank-btn-save:hover { background: #e67e22; }

        .qbank-slot-empty { border-style: dashed; border-color: #444; }
        .qbank-slot-empty .slot-name { color: #666; }

        /* === VS SCREEN === */
        #vs-screen { background: #000; z-index: 200; }
        .vs-bg { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle, #444 0%, #000 80%); z-index: 0; }
        .vs-container { position: absolute; top: 0; width: 100%; height: 100%; z-index: 1; display: flex; }
        .vs-side { width: 50%; height: 100%; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .vs-left { transform: translateX(-100%); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: linear-gradient(90deg, #300 0%, transparent 100%); }
        .vs-right { transform: translateX(100%); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); background: linear-gradient(-90deg, #003 0%, transparent 100%); }
        .vs-side.active { transform: translateX(0); }
        .vs-img { height: 90%; width: auto; filter: drop-shadow(0 0 20px rgba(255,255,255,0.2)); image-rendering: pixelated; }
        .vs-right .vs-img { transform: scaleX(-1); }
        .vs-logo-anim { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) scale(0); z-index: 10; font-size: 12rem; color: #ff0; text-shadow: 5px 5px 0 #f00, 10px 10px 0 #000; font-style: italic; }
        .vs-logo-anim.boom { animation: vs-boom 0.5s forwards 0.6s; }
        #ready-go-layer { position: absolute; z-index: 50; width: 100%; text-align: center; top: 40%; font-size: 8rem; color: #ff0055; text-shadow: 0 0 20px #fff; display: none; }

        /* === BATTLE SCREEN === */
        #battle-screen { background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d); background-size: cover; z-index: 50; }
        .ground { position: absolute; bottom: 0; width: 100%; height: 80px; background: repeating-linear-gradient(45deg, #333, #333 10px, #444 10px, #444 20px); border-top: 5px solid #000; z-index: 0; }
        .hud { position: absolute; top: 0; width: 100%; height: 120px; display: flex; justify-content: space-between; padding: 20px 50px; z-index: 20; }
        .hud-side { width: 42%; display: flex; flex-direction: column; align-items: flex-end; }
        .hud-right { align-items: flex-start; }
        .hp-bar-container { width: 100%; height: 35px; background: rgba(0,0,0,0.8); border: 4px solid #fff; transform: skewX(-20deg); position: relative; overflow: hidden; box-shadow: 0 5px 10px rgba(0,0,0,0.5); }
        .hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(to right, #2ecc71, #4cd137); transition: width 0.4s ease-out, background 0.3s; }
        .hp-bar-fill.yellow { background: linear-gradient(to right, #f39c12, #f1c40f); }
        .hp-bar-fill.red { background: linear-gradient(to right, #c0392b, #e74c3c); animation: hp-critical 0.5s infinite alternate; }
        @keyframes hp-critical { from { opacity: 1; } to { opacity: 0.6; } }
        .char-name-battle { font-size: 2rem; color: #fff; text-shadow: 3px 3px 0 #000; margin-bottom: 5px; font-style: italic; }
        .arena { width: 100%; height: 100%; position: relative; display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 60px; z-index: 5; }
        .fighter-container {
            width: 654px; height: 747px;
            position: relative; display: flex; justify-content: center; align-items: flex-end;
            transition: transform 0.1s; pointer-events: none;
        }
        .fighter-img { height: 90%; width: auto; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); image-rendering: pixelated; }
        .fighter-right .fighter-img { transform: scaleX(-1); }
        .fighter-idle { animation: fighter-breathe 0.8s infinite alternate ease-in-out; transform-origin: bottom center; }
        .fighter-ultimate { position: relative; }
        .fighter-ultimate::before {
            content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 80%; height: 80%;
            background: radial-gradient(circle, rgba(255,215,0,0.6) 0%, transparent 70%);
            z-index: -1; animation: ultimate-aura 0.5s infinite alternate;
        }
        .fighter-ultimate .fighter-img { filter: drop-shadow(0 0 20px gold) brightness(1.3) !important; }
        .frozen .fighter-img { filter: sepia(1) hue-rotate(180deg) saturate(3) brightness(1.2) contrast(1.2) !important; animation: none !important; }
        .teleporting .fighter-img { opacity: 0 !important; transition: opacity 0.1s; }
        @keyframes fighter-breathe { 0% { transform: scaleY(1.0) translateY(0); } 100% { transform: scaleY(0.98) translateY(3px); } }
        @keyframes fighter-breathe-right { 0% { transform: scaleX(-1) scaleY(1.0) translateY(0); } 100% { transform: scaleX(-1) scaleY(0.98) translateY(3px); } }
        .fighter-right .fighter-idle { animation: fighter-breathe-right 0.8s infinite alternate ease-in-out; }
        @keyframes ultimate-aura { from { opacity: 0.5; transform: translateX(-50%) scale(0.9); } to { opacity: 1; transform: translateX(-50%) scale(1.1); } }

        /* === BUTTON LAYER === */
        .btn-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; pointer-events: none;
            display: none; justify-content: space-between; align-items: flex-end; padding-bottom: 20px; box-sizing: border-box;
        }
        .btn-wrapper { width: 40%; display: flex; pointer-events: auto; }
        .btn-wrapper.left { justify-content: center; padding-right: 150px; }
        .btn-wrapper.right { justify-content: center; padding-left: 150px; }
        .fighter-btn {
            padding: 20px 50px; background: #fff; border: 5px solid #000;
            font-weight: bold; font-size: 2rem; cursor: pointer;
            box-shadow: 8px 8px 0 #000; animation: pulse-btn-loop 1.5s infinite ease-in-out;
            white-space: nowrap; color: #000; pointer-events: auto;
        }
        @keyframes pulse-btn-loop { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        .fighter-btn:hover { background: #ffcc00; }
        .fighter-btn:active { transform: scale(0.95) !important; box-shadow: 2px 2px 0 #000; }

        /* === READING BOARD === */
        #reading-board {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            width: 85%; padding: 30px; background: rgba(0, 0, 0, 0.92);
            border: 3px solid #00f2ff; border-radius: 15px; z-index: 40;
            text-align: center; box-shadow: 0 0 40px rgba(0, 242, 255, 0.5);
            display: none; pointer-events: none; max-height: 75vh; overflow-y: auto;
            flex-direction: column; align-items: center; justify-content: flex-start;
        }
        #reading-text { font-size: 2.5rem; color: #fff; line-height: 1.4; text-shadow: 2px 2px 0 #000; white-space: pre-wrap; margin-bottom: 20px; width: 100%; }
        #reading-img-container { width: 100%; display: flex; justify-content: center; margin-bottom: 20px; }
        #reading-img-container img { max-width: 95%; max-height: 35vh; border: 3px solid #fff; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.8); object-fit: contain; }
        #reading-options { font-size: 1.8rem; color: #eee; text-align: left; display: grid; gap: 20px; width: 95%; margin: 0 auto; }
        .read-opt { background: #222; padding: 15px; border-radius: 8px; border: 2px solid #555; }

        /* === QUESTION MODAL === */
        #question-modal {
            position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; height: auto; max-height: 80vh; overflow-y: auto;
            background: rgba(0,0,0,0.95); border: 5px solid #fff; border-radius: 20px;
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; padding: 40px; box-shadow: 0 0 50px rgba(0,0,0,0.8);
        }
        #q-text { font-size: 2.5rem; color: #fff; margin-bottom: 30px; font-weight: bold; text-align: center; width: 100%; line-height: 1.5; }
        .options-grid { display: grid; gap: 30px; width: 95%; }
        .opt-btn { padding: 30px; background: #333; color: #fff; border: 4px solid #666; font-size: 1.8rem; cursor: pointer; text-align: left; transition: 0.1s; border-radius: 15px; font-weight: bold;}
        .opt-btn:hover { background: #555; border-color: #ffcc00; transform: scale(1.02); }
        #modal-img-container { width: 100%; display: flex; justify-content: center; }
        #modal-img-container img { max-width: 90%; max-height: 30vh; margin-bottom: 20px; border: 3px solid #aaa; border-radius: 8px; object-fit: contain; }

        /* === WIN SCREEN === */
        #win-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 20000; display: none;
            flex-direction: column; align-items: center; justify-content: center; overflow-y: auto;
        }
        .win-rays {
            position: absolute; width: 200%; height: 200%;
            background: repeating-conic-gradient(from 0deg, rgba(255,215,0,0.1) 0deg 10deg, transparent 10deg 20deg);
            animation: rotate-rays 10s linear infinite; z-index: -1;
        }
        @keyframes rotate-rays { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .win-title-container { text-align: center; margin-bottom: 5px; z-index: 10; margin-top: 20px;}
        .win-icon { font-size: 60px; text-shadow: 0 0 20px gold; animation: bounce 1s infinite; display: block; }
        .win-text { font-size: 4rem; color: gold; font-style: italic; text-shadow: 5px 5px 0 #b22222, 0 0 30px gold; margin: 0; }
        #win-img { height: 15vh; width: auto; transform: scale(2.0); margin: 10px 0; filter: drop-shadow(0 0 50px gold); image-rendering: pixelated; }
        #stats-details { width: 90%; max-width: 800px; z-index: 10; margin-top: 10px; }
        .win-btn-group { display: flex; gap: 30px; z-index: 10; margin-top: 20px; margin-bottom: 20px;}
        .win-btn { padding: 12px 30px; font-size: 20px; font-weight: bold; border-radius: 50px; cursor: pointer; border: none; transition: transform 0.2s; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .btn-restart { background: #ff4757; color: white; }
        .btn-next { background: #2ed573; color: white; }
        .win-btn:hover { transform: scale(1.1); filter: brightness(1.2); }
        .confetti { position: absolute; width: 10px; height: 10px; background: #f00; animation: fall 3s linear forwards; }

        /* === STATS & REVIEW === */
        .wrong-q-link {
            display: inline-block; background: #e74c3c; color: white;
            padding: 4px 10px; border-radius: 4px; cursor: pointer;
            margin: 4px; font-weight: bold; text-decoration: none;
            box-shadow: 0 2px 5px rgba(231,76,60,0.5); transition: 0.2s;
        }
        .wrong-q-link:hover { transform: scale(1.1); background: #ff7675; }
        .correct-q-label {
            display: inline-block; background: #2ecc71; color: white;
            padding: 4px 10px; border-radius: 4px; margin: 4px; font-weight: bold;
        }
        .review-opt {
            padding: 15px; border: 2px solid #555; border-radius: 10px;
            background: #222; font-size: 1.5rem; font-weight: bold; color: #fff; margin-bottom: 10px;
        }
        .review-opt.correct { border-color: #2ecc71; background: rgba(46, 204, 113, 0.3); color: #2ecc71; }
        .review-opt.wrong { border-color: #e74c3c; background: rgba(231, 76, 60, 0.3); color: #e74c3c; }

        /* === BGM TOGGLE === */
        #bgm-toggle {
            position: absolute; top: 15px; right: 20px; z-index: 35;
            padding: 8px 18px; background: rgba(0,0,0,0.7); border: 2px solid #ffcc00;
            color: #ffcc00; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold;
            transition: 0.2s;
        }
        #bgm-toggle:hover { background: rgba(255,204,0,0.2); }
        #bgm-toggle.muted { border-color: #666; color: #666; }

        /* === VFX LAYER === */
        .effect-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; overflow: hidden; }
        .effect-layer * { pointer-events: none !important; }

        /* Original VFX - all scaled 2.5x */
        .fx-fireball { position: absolute; width: 250px; height: 250px; top: 35%; background: radial-gradient(circle, #fff 20%, #ffff00 40%, #ff4500 70%, transparent 100%); border-radius: 50%; opacity: 0; mix-blend-mode: screen; filter: blur(4px) brightness(1.5); box-shadow: 0 0 60px #ff0000; z-index: 20; }
        .fx-fireball-ult { width: 750px !important; height: 750px !important; filter: blur(8px) brightness(2.0); box-shadow: 0 0 200px #ff4500; }
        .fx-ember { position: absolute; width: 100px; height: 100px; background: radial-gradient(circle, #ffcc00, #ff0000, transparent); border-radius: 50%; opacity: 0; mix-blend-mode: screen; filter: blur(5px); z-index: 19; top: 38%; }
        .fx-cudgel-smash { position: absolute; width: 100px; height: 1500px; top: -1500px; background: linear-gradient(to right, #b8860b, #ffd700, #fff, #ffd700, #b8860b); border: 6px solid #332200; border-radius: 15px; box-shadow: 0 0 60px gold; z-index: 20; opacity: 1; }
        .fx-cudgel-smash-ult { width: 300px !important; border-width: 15px; box-shadow: 0 0 150px gold; }
        .fx-cudgel-smash::before, .fx-cudgel-smash::after { content: ''; position: absolute; width: 100%; height: 120px; background: #b8860b; border: 4px solid #000; }
        .fx-cudgel-smash::before { top: 50px; } .fx-cudgel-smash::after { bottom: 50px; }
        .fx-laser-beam { position: absolute; height: 38px; top: 38%; background: #fff; width: 0; opacity: 0; border-radius: 15px; }
        .fx-laser-ult { height: 150px !important; box-shadow: 0 0 120px #fff; }
        .fx-laser-gold { box-shadow: 0 0 25px #fff, 0 0 50px #ffd700, 0 0 100px #ff8800; height: 62px; }
        .fx-laser-blue { box-shadow: 0 0 25px #fff, 0 0 50px #00ffff, 0 0 100px #00ffff; }
        .fx-book { position: absolute; width: 150px; height: 200px; background: #3498db; border: 8px solid #fff; top: 35%; display: flex; align-items: center; justify-content: center; font-size: 50px; color: white; font-weight: bold; z-index: 20; }
        .fx-book::after { content: '知识'; }
