<body>	
	<div  id="info" style="text-align:center">
		<h1>LAUNCHING BALL</h1>
		<button type="button" class="button" style="background-color:orange; color:white"
			onclick="location.href='/api/program-assets/lab-simulation-coe/_ext/vendor/pdf_files/Instruction.pdf'">Read Problem</button>
		Set initial height for the ball (H level)
		<input type="number" id="setY" align="center" size="4" value="1"  min="1" max="3" step="1" 
			style="background-color:blue; color:white">
		(<label style="color:brown"> H=1.5R </label> for Level 1
		, <label style="color:brown"> H=2R </label> for Level 2, <label style="color:brown"> H=2.6R </label> for Level 3)
		<button type="button" class="button" id="shoot" style="background-color:blue; color:white">Drop Ball</button><br>
		Energy Lost? (in Joule)
		<input type="number" id="answer" size="6" value="0" style='color:black'> 
		(round to nearest tenth) 
		<button type="button" class="button" id="check" style="background-color:blue; color:white">Check Answer</button>
		
	</div>
	<div id="container"></div>	

<script>
	Physijs.scripts.worker = '../Physijs/physijs_worker.js';
	Physijs.scripts.ammo = '../Physijs/ammo.js';
	
	var container, _boxes = [], loader, renderer, render_stats, f1, moon1, box1, box2, moon2, box3, moon3, 
	physics_stats, scene, ground_material, ground_material2, ground, ground2, light, camera, width, height, y, controls, mousedown;
	var loop = [];
	var Loop = [];
	var ans;
	var is_drop = false;
	var audio2 = new Audio('../Audio/wrong.mp3');
	var audio1 = new Audio('../Audio/correct.mp3');     
	var fontloader = new THREE.FontLoader();

	init();
	animate();
	
	function init() {
		container = document.getElementById('container');
	        renderer = new THREE.WebGLRenderer({ antialias: true });
	        renderer.setPixelRatio(window.devicePixelRatio);
	        renderer.setSize(window.innerWidth, window.innerHeight);
	        container.appendChild(renderer.domElement);
		
		width = window.innerWidth;
		height = window.innerHeight;
		scene = new Physijs.Scene;
		camera = new THREE.PerspectiveCamera(
			8, //35,
			width / height,
			1,
			1000
		);
		camera.position.set( 7, 15, 50 ); //10,12,50
		camera.lookAt( scene.position );
		scene.add( camera );
		scene.background = new THREE.Color( 0xedf5ef);
		
		controls = new THREE.OrbitControls(camera, renderer.domElement);
	        controls.enableZoom = false;
		
		document.getElementById('check').addEventListener('click', function(){
			is_drop = true;
		});
			
		// Loader
		loader = new THREE.TextureLoader();
		
		scene.setGravity(new THREE.Vector3( 0, -3, 0 )); 
		
		scene.addEventListener(
			'update',
			function() {
				scene.simulate(); 
			}
		);

		
		// Light
		light = new THREE.DirectionalLight( 0xFFFFFF );
		light.position.set( 20, 40, -15 );
		light.target.position.copy( scene.position );
		light.castShadow = true;
		light.shadowCameraLeft = -60;
		light.shadowCameraTop = -60;
		light.shadowCameraRight = 60;
		light.shadowCameraBottom = 60;
		light.shadowCameraNear = 20;
		light.shadowCameraFar = 200;
		light.shadowBias = -.0001
		light.shadowMapWidth = light.shadowMapHeight = 2048;
		light.shadowDarkness = .7;
		scene.add( light );
		
		// ramp 
		var ramp_material = Physijs.createMaterial(
			new THREE.MeshLambertMaterial({ map: loader.load( '../pictures/glass.jpg' ) }),
			0, 
			0  
		);
		ramp_material.map.wrapS = ramp_material.map.wrapT = THREE.RepeatWrapping;
		ramp_material.map.repeat.set( 1, 1 );	
		var ramp = new Physijs.BoxMesh(
			new THREE.BoxGeometry(10, 0.1, 1),
			ramp_material,
			0 // mass
		);		
		ramp.receiveShadow = true;
		ramp.position.set(-4.6,3.3,0); //1.3=y  x=-1.6
		ramp.rotateZ(-0.7); 		
		scene.add( ramp );
		
		//draw a line
		var points = [];
		points.push( new THREE.Vector3( 2, 0, -0.5 ) );
		points.push( new THREE.Vector3( 7, 2.5, -0.5 ) );
		var geometry = new THREE.BufferGeometry().setFromPoints( points );
		var line = new THREE.Line( geometry, ramp_material );
		scene.add(line);
		
		// add text 
		addText(2.2,0,-0.5,"angle θ",0.1,Math.PI/2);
		addText(-4.5,1.6,-0.5,"H",0.1,Math.PI/2);
		addText(1.5,1.6,-0.5,"R - Loop radius",0.1,Math.PI/2);
		addText(2,-0.4,-0.5,"h",0.1,Math.PI/2);
		
		addLoop(1.8,0.05, 0.8,1.2,-0.5, Math.PI/2); // add a big loop
		
		// minor loop
		var xx, yy, xo=1, yo=-0.6, rotZ=0, R=2.5, beta=-0.11;  //x=4 y=-2.6
		
		for(var j=0; j<6; j++){
			Loop[j] = new Physijs.BoxMesh(
				new THREE.BoxGeometry(0.65, 0.1, 1),
				ramp_material,
				0 // mass
			);		
			Loop[j].receiveShadow = true;
			var newX = R*Math.sin(beta*(j+1));
			var newY = R*(1 - Math.cos(beta*(j+1)));
			xx = xo+newX;
			yy = yo+newY;
			Loop[j].position.set(xx,yy,0);
			Loop[j].rotateZ(rotZ); 		
			rotZ = rotZ+beta;
			scene.add( Loop[j] );
		}
		// major loop
		var x, y, x0=1, y0=-0.6, rotz=0, R=1.2, alpha=0.11; //x=-1
		
		for(var i=0; i<6; i++){ //35
			loop[i] = new Physijs.BoxMesh(
				new THREE.BoxGeometry(0.65, 0.1, 1),
				ramp_material,
				0 // mass
			);		
			loop[i].receiveShadow = true;
			var newx = R*Math.sin(alpha*(i+1));
			var newy = R*(1 - Math.cos(alpha*(i+1)));
			x = x0+newx;
			y = y0+newy;
			loop[i].position.set(x,y,0);
			//var short = R*Math.cos(alpha*(i));
			//var long = R*Math.cos(alpha*(i+1));
			//beta = Math.asin((short - long)/0.65);		
			loop[i].rotateZ(rotz); 		
			rotz = rotz+alpha;
			scene.add( loop[i] );
		}
		// table
		var tb_material = Physijs.createMaterial(
			new THREE.MeshLambertMaterial({ map: loader.load( '../textures/wood.jpg' ) }),
			0, 
			0  
		);
		var tb = new Physijs.BoxMesh(
			new THREE.BoxGeometry(14.5, 0.4, 10),
			tb_material,
			0 // mass
		);		
		tb.receiveShadow = false;
		tb.position.set(0.7,-0.9,0); 
		scene.add( tb );
		
		
                // vertical ruler
                var h = new Physijs.BoxMesh(
			new THREE.BoxGeometry(0.1, 4, 0.8),
			tb_material,
			0 // mass
		);		
		h.receiveShadow = true;
		h.position.set(-4,0.8,0); 	
		scene.add( h );
		
		// horizontal ruler
		var ruler_material = Physijs.createMaterial(
			new THREE.MeshLambertMaterial({ map: loader.load( '../textures/ruler2.jpg' ) }),
			0, 
			0  
		);
                var R = new Physijs.BoxMesh(
			new THREE.BoxGeometry(6, 0.1, 1),
			ruler_material,
			0 // mass
		);		
		R.receiveShadow = true;
		R.position.set(4.9,-0.7,0); 	
		scene.add( R );
		
		document.getElementById('shoot').addEventListener("click", spawnSphere);
		window.addEventListener('resize', onResize);
		controls.update();
		scene.simulate();
	}
	function animate() {
		// get answer:
		ans = document.getElementById('answer').value;
		if(is_drop){
			if(ans < 6.5 && ans > 5.9){
				audio1.play();
				is_drop = false;
			}else{
				audio2.play();
				is_drop = false;
			}
		}
		requestAnimationFrame( animate );
		renderer.render( scene, camera );
		controls.update();
	};
        function spawnSphere() {
			
			var sphere_geometry = new THREE.SphereGeometry(0.15, 82, 82),
			handleCollision = function( collided_with, linearVelocity, angularVelocity ) {
			},	    
			createSphere = function() {
				var sphere, material, h, d;
				var vertical;  
				var horizontal; 
				var level;
				level = document.getElementById('setY').value;
				
				if(level==1){
					horizontal = -3; //0;
					vertical = 2.2;  //0.2;
				}else if(level==2){
					horizontal = -3.8;  //-0.5;
					vertical = 2.9;  //0.6;
				}else{
					horizontal = -4.6;  //-1.1;
					vertical = 3.6;     //1.1;
				}
				
				material = Physijs.createMaterial(
					new THREE.MeshLambertMaterial({ map: loader.load( '../pictures/road.jpg' ) }),
					0,  //.6, // medium friction
					0   //.3 // low restitution
				); 
				
				sphere = new Physijs.SphereMesh(
					sphere_geometry,
					material,
					3  //mass
				);
				sphere.collisions = 0;
				// Set the radius of the embedded sphere such that it is smaller than the object
				//sphere.setCcdSweptSphereRadius(0.1);
				
				sphere.position.set(
					horizontal,    //Math.random() * 15 - 47.5 , -9
					vertical,    //8
					0   
				);
				
				sphere.rotation.z += 0.01;   //0.03;
				sphere.castShadow = true;
				sphere.addEventListener( 'collision', handleCollision );
				scene.add( sphere );
				scene.simulate();  
			};
    			createSphere();
	}
	
	function drawLine(){
		var material = new THREE.LineBasicMaterial({color: 0x654321 });
		var points = [];
		points.push( new THREE.Vector3( 2, 0, -3 ) );
		points.push( new THREE.Vector3( 3, 5, -3 ) );
		var geometry = new THREE.BufferGeometry().setFromPoints( points );
		var line = new THREE.Line( geometry, material );
		scene.add( line );
	}

	function addLoop(r,l,x,y,z,alpha){
		var geometry = new THREE.CylinderGeometry( r, r, l, 32 );
		var  clearMaterial = new THREE.MeshPhongMaterial( {
			color: "#ffffff",    
			side:THREE.DoubleSide,
			transparent:true,
			opacity:0.2
		    });
		var lop = new THREE.Mesh(geometry,clearMaterial);
		lop.position.set(x,y,z);
		lop.rotateX(alpha);
		scene.add(lop);
	}

	function onResize() {
		  width = window.innerWidth;
		  height = window.innerHeight;
		  camera.aspect = width / height;
		  camera.updateProjectionMatrix();
		  renderer.setSize(width, height);
	}
	function addText(x,y,z,t,s,angle){
		fontloader.load("/api/program-assets/lab-simulation-coe/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json",function(tex){ 
		    var  textGeo = new THREE.TextGeometry(t, {
			    size: s,  
			    height: s/7, 
			    curveSegments: 6,
			    font: tex,
		    });
		    var  textMaterial = new THREE.MeshLambertMaterial({color: "black"});  
		    var textMesh = new THREE.Mesh(textGeo , textMaterial);
		    textMesh.position.set(x,y,z);
		    //textMesh.rotateY(angle);
		    scene.add(textMesh);
		});
	}
</script>
