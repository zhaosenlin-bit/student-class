			    '- Celsius (°C): Common in science and most countries.\n' +
			    '- Fahrenheit (°F): Used primarily in the United States.\n' +
			    '- Kelvin (K): Absolute temperature scale used in science.\n\n' +
			    'Conversion Formulas:\n' +
			    '  °C = K - 273.15\n' +
