<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.2, user-scalable=yes">
    <title>扇形统计图 · 小学探秘</title>
    <style>
        /* ===== 浅色·学术蓝主题 ===== */
        :root {
            --bg-page: #f5f9ff;
            --bg-card: #ffffff;
            --bg-panel: #eef4fa;
            --bg-panel-alt: #e3ecf5;
            --border: #cbdae9;
            --text: #1e3348;
            --text-dim: #5a6f85;
            --accent: #2a7faa;
            --accent2: #e87a3e;
            --accent3: #3f9e4d;
            --accent4: #f5b342;
            --danger: #d45a6a;
            --panel-width: 300px;
            --header-h: 48px;
            --transition: 0.22s ease;
            --radius: 14px;
            --shadow-card: 0 4px 14px rgba(30, 50, 80, 0.06);
            --font-main: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-main);
            background: var(--bg-page);
            color: var(--text);
            min-height: 100vh;
        }

        #app { display: flex; flex-direction: column; height: 100vh; max-height: 100vh; }

        /* ===== 移动端头部 ===== */
        #mobile-header {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            height: var(--header-h);
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            z-index: 10;
        }
        #mobile-header h1 { font-size: 18px; color: var(--accent); font-weight: 600; letter-spacing: 0.3px; }
        #mobile-header .btn {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.2s;
        }
        #mobile-header .btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

        /* ===== 二栏布局 ===== */
        #main-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
            height: calc(100vh - var(--header-h));
        }

        /* 左侧信息面板 */
        #side-panel {
            width: var(--panel-width);
            min-width: var(--panel-width);
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding-bottom: 12px;
            box-shadow: 2px 0 12px rgba(0,0,0,0.02);
        }

        /* 右侧主视口 */
        #center-panel {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: var(--bg-page);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ===== 面板区块 ===== */
        .panel-section {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }
        .panel-section:last-child { border-bottom: none; }
        .panel-section h3 {
            font-size: 14px;
            color: var(--accent);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
        }
        .panel-section h3::before {
            content: "";
            display: inline-block;
            width: 4px;
            height: 16px;
            background: var(--accent);
            border-radius: 3px;
        }

        /* ===== 标准控件 ===== */
        .btn-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
        .btn {
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-panel-alt);
            color: var(--text);
            transition: all 0.2s;
            white-space: nowrap;
            font-weight: 500;
        }
        .btn:hover { border-color: var(--accent); color: var(--accent); background: #e8f1fa; }
        .btn.active { border-color: var(--accent2); color: var(--accent2); background: rgba(232, 122, 62, 0.08); }
        .btn.accent { border-color: var(--accent); color: var(--accent); background: rgba(42, 127, 170, 0.06); }

        /* 滑块组 */
        .slider-group { margin-bottom: 6px; }
        .slider-group:last-child { margin-bottom: 0; }
        .slider-label {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: var(--text);
            margin-bottom: 2px;
        }
        .slider-label .val { font-weight: 600; color: var(--accent); min-width: 32px; text-align: right; }
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: var(--border);
            border-radius: 4px;
            outline: none;
            margin: 4px 0 6px;
            transition: background 0.2s;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid white;
            box-shadow: 0 2px 8px rgba(42, 127, 170, 0.25);
            transition: 0.15s;
        }
        input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.08); }
        input[type="range"]::-moz-range-thumb {
            width: 20px; height: 20px; background: var(--accent);
            border-radius: 50%; border: 3px solid white; cursor: pointer;
        }

        /* 数据行 */
        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            font-size: 13px;
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }
        .data-row:last-child { border-bottom: none; }
        .data-row .label { color: var(--text-dim); }
        .data-row .value { color: var(--text); font-weight: 600; text-align: right; }

        /* 公式卡片 */
        .formula-box {
            background: var(--bg-panel);
            border-radius: 12px;
            padding: 10px 14px;
            margin-top: 6px;
            font-size: 15px;
            text-align: center;
            border: 1px solid var(--border);
            color: var(--text);
            font-weight: 500;
        }
        .formula-box .highlight { color: var(--accent2); font-weight: 700; }

        /* 迷你对比图 - 可点击切换 */
        .mini-chart-box {
            background: var(--bg-panel);
            border-radius: 12px;
            padding: 10px;
            margin-top: 8px;
            border: 2px solid var(--border);
            transition: border-color 0.2s, box-shadow 0.2s;
            cursor: pointer;
            position: relative;
        }
        .mini-chart-box:hover {
            border-color: var(--accent);
            box-shadow: 0 2px 12px rgba(42, 127, 170, 0.08);
        }
        .mini-chart-box.active-chart {
            border-color: var(--accent2);
            box-shadow: 0 0 0 3px rgba(232, 122, 62, 0.15);
        }
        .mini-chart-box canvas {
            width: 100% !important;
            height: 70px !important;
            display: block;
            border-radius: 6px;
            pointer-events: none;
        }
        .chart-label {
            font-size: 12px;
            color: var(--text-dim);
            text-align: center;
            margin-top: 4px;
            font-weight: 500;
        }
        .mini-chart-box.active-chart .chart-label {
            color: var(--accent2);
            font-weight: 700;
        }

        /* 主图表容器切换 */
        #mainChartContainer {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        #pieCanvas, #barMainCanvas, #lineMainCanvas {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: contain;
            position: absolute;
            top: 0; left: 0;
            transition: opacity 0.3s ease;
        }
        .main-chart-hidden { opacity: 0; pointer-events: none; }
        .main-chart-visible { opacity: 1; pointer-events: auto; }

        /* 浮动信息 */
        .info-card {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 10px 22px;
            color: var(--text);
            font-size: 15px;
            font-weight: 500;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 6;
            text-align: center;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            white-space: nowrap;
        }
        .info-card.visible { opacity: 1; }

        #hoverTooltip {
            position: absolute;
            pointer-events: none;
            z-index: 10;
            background: rgba(255,255,255,0.96);
            border: 1px solid var(--accent2);
            border-radius: 12px;
            padding: 8px 16px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            font-size: 14px;
            color: var(--text);
            opacity: 0;
            transition: opacity 0.15s;
            font-weight: 500;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        #hoverTooltip .highlight { color: var(--accent2); font-weight: 700; }

        /* ===== 响应式 ===== */
        @media (max-width: 820px) {
            #mobile-header { display: flex; }
            #side-panel {
                position: fixed;
                left: 0;
                top: var(--header-h);
                bottom: 0;
                z-index: 50;
                margin-left: calc(-1 * var(--panel-width) - 8px);
                transition: margin-left var(--transition);
                box-shadow: 4px 0 20px rgba(0,0,0,0.06);
                border-radius: 0 12px 12px 0;
            }
            #side-panel.open { margin-left: 0; }
            #center-panel { width: 100%; }
            :root { --panel-width: 280px; }
        }

        #side-panel::-webkit-scrollbar { width: 4px; }
        #side-panel::-webkit-scrollbar-track { background: transparent; }
        #side-panel::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
    </style>
</head>

<div id="app">
    <header id="mobile-header">
        <h1>📊 扇形统计图</h1>
        <button class="btn" id="togglePanelBtn">☰ 信息</button>
    </header>

    <div id="main-layout">
        <aside id="side-panel">
            <div class="panel-section">
                <h3>🎛️ 数据调节</h3>
                <div id="slidersContainer"></div>
                <div class="data-row" style="margin-top: 6px; border-bottom: none; font-weight: 600;">
                    <span class="label">📦 总体</span>
                    <span class="value" id="totalValue">100</span>
                </div>
            </div>

            <div class="panel-section">
                <h3>📐 核心公式</h3>
                <div class="formula-box">
                    扇形圆心角 = <span class="highlight">占比</span> × 360°
                </div>
                <div style="margin-top: 8px; font-size: 13px; color: var(--text-dim); text-align: center;">
                    各部分占比之和：<span style="font-weight: 700; color: var(--accent3);" id="sumPercent">100%</span>
                </div>
            </div>

            <!-- 可点击切换的统计图卡片 -->
            <div class="panel-section">
                <h3>📈 切换主图</h3>
                <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 6px;">点击下方图表切换主视图</div>
                <div class="mini-chart-box active-chart" id="switchPie" data-chart="pie">
                    <canvas id="barChart" width="260" height="70"></canvas>
                    <div class="chart-label">🥧 扇形图</div>
                </div>
                <div class="mini-chart-box" id="switchBar" data-chart="bar">
                    <canvas id="barMini" width="260" height="70"></canvas>
                    <div class="chart-label">📊 条形图</div>
                </div>
                <div class="mini-chart-box" id="switchLine" data-chart="line">
                    <canvas id="lineMini" width="260" height="70"></canvas>
                    <div class="chart-label">📉 折线图</div>
                </div>
            </div>

            <div class="panel-section" style="border-bottom: none;">
                <h3>💡 小贴士</h3>
                <div style="font-size: 13px; color: var(--text-dim); line-height: 1.5; background: var(--bg-panel); padding: 8px 12px; border-radius: 10px;">
                    鼠标悬停在扇形上查看详情；拖拽滑块，所有图表同步变化！点击下方卡片切换主图。
                </div>
            </div>
        </aside>

        <main id="center-panel">
            <div id="mainChartContainer">
                <canvas id="pieCanvas" class="main-chart-visible"></canvas>
                <canvas id="barMainCanvas" class="main-chart-hidden"></canvas>
                <canvas id="lineMainCanvas" class="main-chart-hidden"></canvas>
            </div>
            <div class="info-card" id="infoCard">✨ 鼠标悬停查看详情</div>
            <div id="hoverTooltip"></div>
        </main>
    </div>
</div>
