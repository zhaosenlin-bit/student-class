# 乐启享课件库 · 整包上传到官网目录下的写法
#
# 前提：把打包出来的 leqixiang 文件夹整个放进官网根目录，
#      也就是 /www/wwwroot/codebn.cn/leqixiang/。
#
# 下面这几段放进 codebn.cn 的 server 段里，
# 课件库就挂在 https://codebn.cn/leqixiang/ 下面。
#
# 课件库本身是纯静态的：没有后端、没有数据库、没有登录。
# 里面的地址全是相对的，放到哪个目录下都能打开。

# 少了最后一个斜杠的，先补上，免得落到别的地址上去。
location = /leqixiang {
    return 301 /leqixiang/;
}

# 目录页：直接给首页文件。
location = /leqixiang/ {
    root /www/wwwroot/codebn.cn;
    try_files /leqixiang/index.html =404;
}

# 课件库本体。
#
# 这个 ^~ 不能去掉。官网的 server 段里有两条正则：
#   location ~* .html$ { ... try_files $uri =404; }
#   location ~* .(css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff|woff2|ttf|mp4|webm)$ { ... }
# 正则 location 的优先级比普通前缀 location 高，会先把课件里的网页、
# 脚本、样式、图片都抢走，转成去磁盘上找——课件不在磁盘上，于是全部 404。
# 加上 ^~ 之后这一段不再走正则。
#
# 同理，官网还有一条
#   location / { try_files $uri $uri/ /index.html; }
# 文件不在的时候它会拿主页顶上来（200）。下载的时候浏览器照着清单
# 一个一个去取，缺文件时静默返回主页 HTML，压缩包一样会坏。
# 所以这里写成 =404，缺就是缺。
location ^~ /leqixiang/ {
    root /www/wwwroot/codebn.cn;

    try_files $uri $uri/ =404;

    # 首页和目录清单改得勤，缓存短一点。
    expires 5m;

    # 隐藏文件不给看（.htaccess / .git / .env 之类）。
    # 这里要写具体名字，不能写成通配的 /\. ：课件素材里可能有以点开头的
    # 正常文件，一并挡掉图片就裂了。
    location ~* /\.(htaccess|git|gitignore|env|svn|DS_Store)($|/) {
        deny all;
    }
}

# 素材和脚本不会变，缓存久一点。
location ^~ /leqixiang/courseware/ {
    root /www/wwwroot/codebn.cn;
    try_files $uri $uri/ =404;
    expires 7d;
}

location ^~ /leqixiang/shared/ {
    root /www/wwwroot/codebn.cn;
    try_files $uri $uri/ =404;
    expires 7d;
}

location ^~ /leqixiang/prod/ {
    root /www/wwwroot/codebn.cn;
    try_files $uri $uri/ =404;
    expires 7d;
}

location ^~ /leqixiang/brand/ {
    root /www/wwwroot/codebn.cn;
    try_files $uri $uri/ =404;
    expires 30d;
}

location ^~ /leqixiang/brand-flare/ {
    root /www/wwwroot/codebn.cn;
    try_files $uri $uri/ =404;
    expires 30d;
}

location ^~ /leqixiang/images/ {
    root /www/wwwroot/codebn.cn;
    try_files $uri $uri/ =404;
    expires 30d;
}

location ^~ /leqixiang/covers/ {
    root /www/wwwroot/codebn.cn;
    try_files $uri $uri/ =404;
    expires 30d;
}
