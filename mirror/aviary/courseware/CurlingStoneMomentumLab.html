/* called by onLoad */

function initialize(){
	SwitchLanguage(languagenumber);
	
/* Initial Conditions */
	
	TargetX = Math.floor(Math.random()*300+600);
	
	BeforeY = 200;
	
	radiusstone = 30;
	
	size = radiusstone;
	
	distancebetween = 0;
	
	Mass1 = (Math.floor(Math.random()*15)+10);
	Mass2 = (Math.floor(Math.random()*15)+10);
	
	Speed1Initial = (Math.floor(Math.random()*400)+100)/100;

	Ended = "no";
	Running = "no";
	Collision = "no";
	FactorsChangeable = "yes";
	
	showV1 = "yes";
	showV2 = "no";
	
//  Sets up the canvas for live action.
	
	theCanvas = document.getElementById("CanvasOne");
	ctx = theCanvas.getContext("2d");
	
	CalculateImpactThings();
}


function CalculateImpactThings(){
	
	
	XPos1 = 80;
	YPos1 = BeforeY-distancebetween;
	
	XPos2 = 450;
	YPos2 = BeforeY;
	
	AfterY = BeforeY;
	
	XPos2f = 450;
	YPos2f = AfterY;
	
	Angle2rad = Math.asin(distancebetween/(2*radiusstone));
	
	XPos1f = XPos2f - 2*size*Math.cos(Angle2rad);
	
	YPos1f = AfterY-distancebetween;
	
	Momentum1Initialx = Mass1*Speed1Initial;
	
	Velocity2Final = 2*Mass2*Speed1Initial*Math.cos(Angle2rad)*Math.pow(Mass1, 2.0)/(Mass1*Mass2*(Mass1 + Mass2));
	
	v2Finalx = Velocity2Final*Math.cos(Angle2rad);
	
	v2Finaly = Velocity2Final*Math.sin(Angle2rad);
	
	Momentum2Finalx = Mass2*v2Finalx;
	
	Momentum2Finaly = Mass2*v2Finaly;
	
	TotalMomentum2 = Math.pow((Math.pow(Momentum2Finalx, 2.0) + Math.pow(Momentum2Finaly, 2.0)), 0.5);
	
	Momentum1Finalx = Momentum1Initialx - Momentum2Finalx;
	
	Momentum1Finaly = -1.0*Momentum2Finaly;
	
	TotalMomentum1 = Math.pow((Math.pow(Momentum1Finalx, 2.0) + Math.pow(Momentum1Finaly, 2.0)), 0.5);
	
	if (Momentum1Finalx != 0){
		if (Momentum1Finalx > 0){
			Angle1rad = Math.atan((-1.0*Momentum1Finaly)/Momentum1Finalx);
		}
		else{
			Angle1rad = Math.PI + Math.atan((-1.0*Momentum1Finaly)/Momentum1Finalx);
		}
		
	}
	else{
		Angle1rad = 0;
	}
	
	
	Angle1degrees = Angle1rad*180/Math.PI;
	
	Angle2degrees = Angle2rad*180/Math.PI;
	
	Velocity1Final = TotalMomentum1/Mass1;
	
	Velocity2Final = TotalMomentum2/Mass2;
	
	v1Finalx = Momentum1Finalx/Mass1;
	
	v1Finaly = Momentum1Finaly/Mass1;;
	
	KE1Final = 0.5*Mass1*Math.pow(Velocity1Final, 2.0);
	
	KE2Final = 0.5*Mass2*Math.pow(Velocity2Final, 2.0);
	
	KETotalFinal = KE1Final + KE2Final;
	
	KE1 = 0.5*Mass1*Math.pow(Speed1Initial, 2.0);
	
	ChangeofKE = KE1 - KETotalFinal;
	
	v1 = Speed1Initial;
	
	v2 = 0;
	
	v1f = Velocity1Final;
	
	v2f = Velocity2Final;
	
	direction1 = 0;
	
	direction2 = 0;
	
	direction1f = Angle1rad;
	
	direction2f = Angle2rad;
	
	Answer1 = Velocity1Final;
	
	Answer2 = Angle1degrees;
	
	v1x = v1;
	
	v1y = 0;
	
	v2x = 0;
	
	v2y = 0;
		
	drawingpart();

}


/* Called by the Begin Button */

function LoadIt(){
	document.getElementById("LabSection").style.visibility = "visible";
	document.getElementById("OverviewSection").style.visibility = "hidden";
	StartItMoving = setInterval(drawingpart, 20);
}

function drawingpart(){
	
	ctx.fillStyle = "#ffffff";
	ctx.fillRect(0,0,950,600);
	
	DrawIce();
	if (Running == "yes"){
		d = new Date();
		nowtime = d.getTime();
		elapsedtime = (nowtime-starttime);
		timeinsec = elapsedtime/1000;
		XPos1 = XPos1 + v1x;
		YPos1 = YPos1 + v1y;
		XPos2 = XPos2 + v2x;
		YPos2 = YPos2 + v2y;
		
		if (Collision == "no"){
			distanceapartnowx = (XPos1 - XPos2);
			distanceapartnowy = (YPos1 - YPos2);
			distanceapartnow = Math.pow((Math.pow(distanceapartnowx, 2.0) + Math.pow(distanceapartnowy, 2.0)), 0.5);
			if (distanceapartnow <= (2*size)){
				Collision = "yes";
				v1x = v1Finalx;
				v1y = v1Finaly;
				v2x = v2Finalx;
				v2y = v2Finaly;
				XStart1 = XPos1;
				YStart1 = YPos1;
				XStart2 = XPos2;
				YStart2 = YPos2;
			}
		}
		else{
			distanceapartnowx = (XPos1 - XPos2);
			distanceapartnowy = (YPos1 - YPos2);
			distanceapartnow = Math.pow((Math.pow(distanceapartnowx, 2.0) + Math.pow(distanceapartnowy, 2.0)), 0.5);
		}
		
		if (XPos1 > 932 || YPos1 < -32 || XPos2 > 932 || YPos2 > 632){
			Running = "done";
			document.getElementById("ResetButton").style.visibility = "visible";
		}
	}
	
	if (Collision == "yes"){
		ctx.strokeStyle = "#990000";

		ctx.lineWidth = 2;
		ctx.beginPath();
		ctx.moveTo(XStart2,YStart2);
		ctx.lineTo(XPos2, YPos2);
		ctx.stroke();
	}

function DrawDottedLine(x,y,l,sg){
	numberofseg = Math.ceil(l/(2*sg));
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 3;
	ctx.beginPath();
	for (i=0; i<= numberofseg; i++){
		ctx.moveTo(x+i*sg*2,y);
		ctx.lineTo(x+i*sg*2+sg, y);
	}
	ctx.stroke();
	
}

function DrawStone(x,y,stonecolor,a,m,v,d,showv,mlabel){
	
	ctx.fillStyle = "#bab7b0";
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 1;
	ctx.beginPath();
	ctx.arc(x,y,size,0,2*Math.PI);
	ctx.fill();
	ctx.stroke();
	
	ctx.fillStyle = stonecolor;
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 1;
	ctx.beginPath();
	ctx.arc(x,y,0.75*size,0,2*Math.PI);
	ctx.fill();
	ctx.stroke();
	
	ctx.save();
	ctx.translate(x,y);
	ctx.rotate(a);
	DrawRectangle(0-0.65*size, 0-0.10*size, 0.70*size, 0.20*size, 0.02*size, "#000000", "#bab7b0", 1);
	ctx.restore();
	
	if (showv == "yes"){
		sizeofvvector = 1.0*size+2*v*size;
		sizeofvectorx = sizeofvvector*Math.cos(d);
		ctx.save();
		ctx.translate(x,y);
		ctx.rotate(d);	
		ctx.strokeStyle = stonecolor;
		ctx.lineWidth = 3;
		ctx.beginPath();
		ctx.moveTo(0+1.0*size, 0);
		ctx.lineTo(0+sizeofvvector, 0);
		ctx.moveTo(0+sizeofvvector-10, 0-10);
		ctx.lineTo(0+sizeofvvector, 0);
		ctx.lineTo(0+sizeofvvector-10, 0+10);
		ctx.stroke();
		if (Math.abs(d) > 0.001){
			WriteText(0+1.3*size+0.5*2*v*size,0+0.7*size,v.toFixed(2) + " m/s",0.5*size,"#000000",0.5,ProgramFont);
		}
		else{
			WriteText(0+1.0*size+0.5*2*v*size,0-0.2*size,v.toFixed(2) + " m/s",0.5*size,"#000000",0.5,ProgramFont);
		}
		
		ctx.restore();
		
		if (Math.abs(d) > 0.001){
			WriteText(x+1.0*size+20,y+0.6*size,Angle2degrees.toFixed(2) + "°",0.35*size,"#000000",0.0,ProgramFont);
		}
	}
	if (mlabel == "above"){
		WriteText(x,y-1.4*size,m.toFixed(1) + " kg",0.5*size,"#000000",0.5,ProgramFont);
	}
	else{
		WriteText(x,y+1.6*size,m.toFixed(1) + " kg",0.5*size,"#000000",0.5,ProgramFont);
	}
	
	
	
}

function DrawIce(){
	
	ctx.fillStyle = "#009900";
	ctx.strokeStyle = "#009900";
	ctx.lineWidth = 1;
	ctx.beginPath();
	ctx.arc(TargetX,BeforeY,300,0,2*Math.PI);

	ctx.strokeStyle = "#FFFFFF";

	ctx.arc(TargetX,BeforeY,200,0,2*Math.PI);
	ctx.fill();
	ctx.stroke();
	
	ctx.fillStyle = "#000099";
	ctx.strokeStyle = "#000099";
	ctx.lineWidth = 1;
	ctx.beginPath();
	ctx.arc(TargetX,BeforeY,100,0,2*Math.PI);
	ctx.fill();
	ctx.stroke();
	
	ctx.fillStyle = "#FFFFFF";
	ctx.strokeStyle = "#FFFFFF";
	ctx.lineWidth = 1;
	ctx.beginPath();
	ctx.arc(TargetX,BeforeY,50,0,2*Math.PI);
	ctx.fill();
	ctx.stroke();
	
	ctx.drawImage(base_image, TargetX-35, BeforeY-35, 70, 70);
	
	WriteText(TargetX-600,BeforeY - 170,"Vancouver 2010",24,"#009900",0.5,"Arial");
	
	ctx.globalAlpha = 0.7;
	ctx.fillStyle = "#c8fbff";
	ctx.fillRect(0,0,950,600);
	ctx.globalAlpha = 1.0;
}

function SeparationControlArea(x,y,w,h){

}

function WriteText(x,y,t,s,c,m,ff){
	ctx.fillStyle = c;
	ctx.font= s + "px " + ff;
	temptext = t;
	metrics = ctx.measureText(temptext);
	textWidth = metrics.width;
	xposition = x - m*textWidth;
	ctx.fillText(temptext,xposition, y);
}

function DrawArrow(x, y, h, w, c, r){
	ctx.save();
	ctx.translate(x, y+0.5*h);
	ctx.rotate(r);
	ctx.fillStyle = c;
	ctx.strokeStyle = "#000000";
	ctx.lineWidth = 1;
	ctx.beginPath();
	ctx.moveTo(0,-0.5*h);
	ctx.lineTo(0+w, -0.5*h+w);
	ctx.lineTo(0+0.5*w, -0.5*h+w);
	ctx.lineTo(0+0.5*w, -0.5*h+h);
	ctx.lineTo(0-0.5*w, -0.5*h+h);
	ctx.lineTo(0-0.5*w, -0.5*h+w);
	ctx.lineTo(0-w, -0.5*h+w);
	ctx.lineTo(0,-0.5*h);
	ctx.stroke();
	ctx.closePath();
	ctx.fill();
	ctx.restore();
}


function DrawRectangle(xrect, yrect, wrect, hrect, curverectangle, lcolor, fcolor, lwid){
	ctx.fillStyle = fcolor;
	ctx.strokeStyle = lcolor;
	ctx.lineWidth = lwid;
	ctx.beginPath();
	ctx.moveTo(xrect+curverectangle, yrect);
	ctx.lineTo(xrect+wrect-curverectangle, yrect);
	ctx.arc(xrect+wrect-curverectangle, yrect+curverectangle, curverectangle, 1.5*Math.PI, 0*Math.PI, false);
	ctx.lineTo(xrect+wrect, yrect+hrect-curverectangle);
	ctx.arc(xrect+wrect-curverectangle, yrect+hrect-curverectangle, curverectangle, 0.0*Math.PI, 0.5*Math.PI, false);
	ctx.lineTo(xrect+curverectangle, yrect+hrect);
	ctx.arc(xrect+curverectangle, yrect+hrect-curverectangle, curverectangle, 0.5*Math.PI, 1.0*Math.PI, false);
	ctx.lineTo(xrect, yrect+curverectangle);
	ctx.arc(xrect+curverectangle, yrect+curverectangle, curverectangle, 1.0*Math.PI, 1.5*Math.PI, false);
	ctx.stroke();
	ctx.fill();
}
