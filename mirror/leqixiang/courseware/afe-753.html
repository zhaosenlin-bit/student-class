<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>空间向量数量积 · 几何意义教学工具</title>
    <!-- 使用 Three.js 以及辅助库 -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.126.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.126.0/examples/jsm/"
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* 三栏布局容器 */
        .app {
            display: flex;
            flex: 1;
            min-height: 0;
            padding: 12px 16px;
            gap: 16px;
        }
        /* 左侧控制面板 */
        .panel-left {
            width: 260px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            backdrop-filter: blur(2px);
            border: 1px solid #e2e8f0;
        }
        /* 中间视口 */
        .viewport-center {
            flex: 1;
            min-width: 400px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            position: relative;
            overflow: hidden;
            border: 1px solid #eef2f6;
        }
        #three-container {
            width: 100%;
            height: 100%;
            display: block;
        }
        /* 右侧信息面板 */
        .panel-right {
            width: 280px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.05);
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
        }
        /* 通用样式 */
        .section-title {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.3px;
            color: #475569;
            text-transform: uppercase;
            border-bottom: 2px solid #dbeafe;
            padding-bottom: 8px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .step-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .step-btn {
            background: #f1f5f9;
            border: none;
            padding: 10px 12px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 500;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid transparent;
        }
        .step-btn.active {
            background: #dbeafe;
            color: #1d4ed8;
            border-color: #93c5fd;
            font-weight: 600;
        }
        .step-btn:hover {
            background: #e2e8f0;
        }
        .step-btn .step-icon {
            font-size: 18px;
        }
        .vector-input {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 6px;
        }
        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 15px;
        }
        .input-row label {
            font-weight: 500;
            color: #475569;
            min-width: 32px;
        }
        .input-row input {
            width: 70px;
            padding: 6px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            text-align: center;
            background: #f8fafc;
            transition: 0.2s;
        }
        .input-row input:focus {
            border-color: #3b82f6;
            outline: none;
            background: white;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }
        .vec-color {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 4px;
            margin-right: 6px;
        }
        .formula-box {
            background: #f8fafc;
            border-radius: 16px;
            padding: 14px 12px;
            text-align: center;
            border: 1px solid #e2e8f0;
            margin-top: 6px;
        }
        .formula-main {
            font-size: 20px;
            font-weight: 600;
            color: #0f172a;
            letter-spacing: 0.5px;
        }
        .formula-sub {
            font-size: 14px;
            color: #64748b;
            margin-top: 8px;
            line-height: 1.5;
        }
        .projection-card {
            background: #f0f9ff;
            border-radius: 16px;
            padding: 14px;
            border-left: 5px solid #3b82f6;
        }
        .value-big {
            font-size: 28px;
            font-weight: 700;
            color: #1d4ed8;
        }
        .tag {
            background: #e0f2fe;
            color: #0369a1;
            border-radius: 30px;
            padding: 4px 12px;
            font-size: 13px;
            display: inline-block;
        }
        .footer-note {
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            margin-top: 8px;
            border-top: 1px solid #eef2f6;
            padding-top: 12px;
        }
        .drag-hint {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(4px);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            color: #475569;
            border: 1px solid #dbeafe;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            pointer-events: none;
            z-index: 10;
            white-space: nowrap;
        }
        .coordinate-badge {
            font-size: 14px;
            font-weight: 500;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 30px;
        }
        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<div class="app">
    <!-- 左侧控制面板 -->
    <div class="panel-left">
        <div>
            <div class="section-title">📘 教学步骤</div>
            <div class="step-buttons">
                <button class="step-btn active" data-step="0"><span class="step-icon">①</span> 定义</button>
                <button class="step-btn" data-step="1"><span class="step-icon">②</span> 公式</button>
                <button class="step-btn" data-step="2"><span class="step-icon">③</span> 投影</button>
                <button class="step-btn" data-step="3"><span class="step-icon">④</span> 练习</button>
            </div>
        </div>
        <div>
            <div class="section-title">📐 向量坐标</div>
            <div class="vector-input">
                <div class="input-row">
                    <label><span class="vec-color" style="background:#3b82f6;"></span> a</label>
                    <input type="number" id="ax" value="2" step="0.1">
                    <input type="number" id="ay" value="1" step="0.1">
                    <input type="number" id="az" value="2" step="0.1">
                </div>
                <div class="input-row">
                    <label><span class="vec-color" style="background:#f97316;"></span> b</label>
                    <input type="number" id="bx" value="3" step="0.1">
                    <input type="number" id="by" value="-1" step="0.1">
                    <input type="number" id="bz" value="1" step="0.1">
                </div>
            </div>
            <div style="display:flex; gap:8px; margin-top:14px;">
                <button id="randomBtn" style="flex:1; background:#e2e8f0; border:none; padding:8px; border-radius:20px; font-weight:500; cursor:pointer;">🎲 随机</button>
                <button id="resetBtn" style="flex:1; background:#dbeafe; color:#1d4ed8; border:none; padding:8px; border-radius:20px; font-weight:500; cursor:pointer;">↺ 重置</button>
            </div>
        </div>
        <div style="margin-top:auto;">
            <div class="section-title">📌 提示</div>
            <div style="font-size:13px; color:#475569; background:#f1f5f9; padding:12px; border-radius:14px;">
                🖱️ 拖拽箭头端点改变向量<br>· 实时更新夹角/投影<br>· 可精确输入坐标
            </div>
        </div>
    </div>

    <!-- 中间3D视口 -->
    <div class="viewport-center">
        <div id="three-container"></div>
        <div class="drag-hint">🟠 拖拽箭头末端 · 观察变化</div>
    </div>

    <!-- 右侧信息面板 -->
    <div class="panel-right">
        <div>
            <div class="section-title">🧮 数量积公式</div>
            <div class="formula-box">
                <div class="formula-main">a · b = |a||b|cosθ</div>
                <div class="formula-sub" id="formula-coord">= 2×3 + 1×(-1) + 2×1 = 7</div>
            </div>
        </div>
        <div>
            <div class="section-title">📏 实时计算</div>
            <div style="display:grid; gap:10px;">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="color:#475569;">|a|</span>
                    <span class="tag" id="normA">2.449</span>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="color:#475569;">|b|</span>
                    <span class="tag" id="normB">3.317</span>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="color:#475569;">夹角 θ</span>
                    <span class="tag" id="angleDeg">54.7°</span>
                </div>
            </div>
        </div>
        <div>
            <div class="section-title">📥 投影 (b在a上)</div>
            <div class="projection-card">
                <div style="font-size:14px; color:#475569;">投影长度 = a·b / |a|</div>
                <div class="value-big" id="projValue">2.857</div>
                <div style="font-size:13px; color:#0369a1; margin-top:6px;">方向: <span id="projDir">与a同向</span></div>
            </div>
        </div>
        <div>
            <div class="section-title">📚 当前步骤说明</div>
            <div id="stepDescription" style="background:#f8fafc; border-radius:16px; padding:14px; font-size:14px; color:#334155; line-height:1.6;">
                <strong>定义：</strong>向量数量积 a·b 等于它们的模长与夹角的余弦的乘积。
            </div>
        </div>
        <div class="footer-note">
            ｜ 空间向量数量积 · 几何意义 ｜
        </div>
    </div>
</div>
