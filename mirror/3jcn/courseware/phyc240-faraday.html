		  'Faraday’s Law of Electromagnetic Induction states that a changing magnetic field within a closed loop induces an electromotive force (EMF) in the wire.\n\n' +
		  'The induced EMF is directly proportional to the rate of change of magnetic flux through the loop. In simple terms, if the magnetic environment of a coil changes, it will generate voltage.\n\n' +
		  'This principle is the foundation of electric generators, transformers, and inductors, and is expressed mathematically as:\n\n' +
		  'EMF = -dΦ/dt\n\n' +
		  'Where Φ is the magnetic flux and the negative sign indicates the direction of induced EMF opposes the change (Lenz’s Law).'
