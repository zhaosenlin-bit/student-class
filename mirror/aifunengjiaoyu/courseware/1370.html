<script>
(function(){
'use strict';

/* ========================================================================
   MATH CORE  —— 纯数学：向量、截面求交、形状判别
   ======================================================================== */
const V3 = {
  add:(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],
  sub:(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],
  mul:(a,s)=>[a[0]*s,a[1]*s,a[2]*s],
  dot:(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],
  cross:(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],
  len:a=>Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2]),
  norm:a=>{const l=Math.sqrt(a[0]*a[0]+a[1]*a[1]+a[2]*a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];},
  lerp:(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t]
};

const H = 0.5;                      // 棱长为 1，中心在原点
const CUBE = {
  A:[-H,-H,-H], B:[H,-H,-H], C:[H,H,-H], D:[-H,H,-H],
  A1:[-H,-H,H], B1:[H,-H,H], C1:[H,H,H], D1:[-H,H,H]
};
const FACES = [
  {key:'bottom', v:['A','B','C','D'],    n:[0,0,-1]},
  {key:'top',    v:['A1','B1','C1','D1'],n:[0,0,1]},
  {key:'front',  v:['A','B','B1','A1'],  n:[0,-1,0]},
  {key:'right',  v:['B','C','C1','B1'],  n:[1,0,0]},
  {key:'back',   v:['C','D','D1','C1'],  n:[0,1,0]},
  {key:'left',   v:['D','A','A1','D1'],  n:[-1,0,0]}
];
const VF={};
FACES.forEach(f=>{ f.v.forEach(k=>{ (VF[k]=VF[k]||[]).push(f.n); }); });

const EDGES = [
  ['A','B',['bottom','front']], ['B','C',['bottom','right']],
  ['C','D',['bottom','back']],  ['D','A',['bottom','left']],
  ['A1','B1',['top','front']],  ['B1','C1',['top','right']],
  ['C1','D1',['top','back']],   ['D1','A1',['top','left']],
  ['A','A1',['front','left']],  ['B','B1',['front','right']],
  ['C','C1',['right','back']],  ['D','D1',['back','left']]
];

function normalOf(theta,phi){
  const st=Math.sin(theta);
  return [st*Math.cos(phi), st*Math.sin(phi), Math.cos(theta)];
}

/** 平面 n·x = d 与正方体的截面（凸多边形） */
function crossSection(n,d){
  const raw=[];
  for(let i=0;i<EDGES.length;i++){
    const p=CUBE[EDGES[i][0]], q=CUBE[EDGES[i][1]];
    const fp=V3.dot(n,p)-d, fq=V3.dot(n,q)-d;
    if(Math.abs(fp)<1e-9) raw.push(p.slice());
    if(Math.abs(fq)<1e-9) raw.push(q.slice());
    if(fp*fq < -1e-12){
      const t=fp/(fp-fq);
      raw.push(V3.lerp(p,q,t));
    }
  }
  const pts=[];
  for(let i=0;i<raw.length;i++){
    let dup=false;
    for(let j=0;j<pts.length;j++){
      if(V3.len(V3.sub(raw[i],pts[j]))<1e-7){dup=true;break;}
    }
    if(!dup) pts.push(raw[i]);
  }
  if(pts.length<2) return {kind:'empty',pts:[],sides:[],angles:[],area:0,perim:0,center:[0,0,0],n:n,d:d};

  const c=[0,0,0];
  for(const p of pts){c[0]+=p[0];c[1]+=p[1];c[2]+=p[2];}
  c[0]/=pts.length;c[1]/=pts.length;c[2]/=pts.length;

  if(pts.length===2){
    return {kind:'segment',pts:pts,sides:[V3.len(V3.sub(pts[1],pts[0]))],angles:[],area:0,
            perim:V3.len(V3.sub(pts[1],pts[0])),center:c,n:n,d:d};
  }

  // 平面内正交基
  let e1 = Math.abs(n[0])<0.9 ? V3.cross(n,[1,0,0]) : V3.cross(n,[0,1,0]);
  e1 = V3.norm(e1);
  const e2 = V3.cross(n,e1);
  pts.sort((p,q)=>{
    const pa=Math.atan2(V3.dot(V3.sub(p,c),e2),V3.dot(V3.sub(p,c),e1));
    const qa=Math.atan2(V3.dot(V3.sub(q,c),e2),V3.dot(V3.sub(q,c),e1));
    return pa-qa;
  });

  const m=pts.length;
  const sides=[], angles=[];
  for(let i=0;i<m;i++){
    sides.push(V3.len(V3.sub(pts[(i+1)%m],pts[i])));
  }
  for(let i=0;i<m;i++){
    const a=V3.norm(V3.sub(pts[(i-1+m)%m],pts[i]));
    const b=V3.norm(V3.sub(pts[(i+1)%m],pts[i]));
    let ca=V3.dot(a,b);
    ca=Math.max(-1,Math.min(1,ca));
    angles.push(Math.acos(ca));
  }
  let acc=[0,0,0];
  for(let i=0;i<m;i++){
    acc=V3.add(acc,V3.cross(V3.sub(pts[i],c),V3.sub(pts[(i+1)%m],c)));
  }
  const area=V3.len(acc)/2;
  const perim=sides.reduce((s,x)=>s+x,0);
  return {kind:'polygon',pts:pts,sides:sides,angles:angles,area:area,perim:perim,center:c,n:n,d:d};
}

/** 形状判别 */
function classify(sec){
  if(sec.kind==='empty') return {name:'无截面',note:'平面已移出正方体'};
  if(sec.kind==='segment') return {name:'线段',note:'平面恰好经过正方体的一条棱'};
  const m=sec.pts.length, s=sec.sides, a=sec.angles;
  const avg=s.reduce((x,y)=>x+y,0)/m;
  const eq=(x,y,t)=>Math.abs(x-y)<=t*Math.max(1e-6,Math.abs(x),Math.abs(y));
  const allSides=avg>1e-6 && s.every(x=>eq(x,avg,0.015));
  const allAngles=a.every(x=>eq(x,a[0],0.02));
  const right=a.some(x=>Math.abs(x-Math.PI/2)<0.017);
  const pairEq=()=>{
    for(let i=0;i<m;i++) for(let j=i+1;j<m;j++) if(eq(s[i],s[j],0.015)) return true;
    return false;
  };

  if(m===3){
    if(allSides) return {name:'等边三角形'};
    if(right) return {name:pairEq()?'等腰直角三角形':'直角三角形'};
    if(pairEq()) return {name:'等腰三角形'};
    return {name:'三角形'};
  }
  if(m===4){
    // 方向向量
    const dir=i=>V3.norm(V3.sub(sec.pts[(i+1)%m],sec.pts[i]));
    const par=(u,v)=>V3.len(V3.cross(u,v))<0.02;
    const p02=par(dir(0),dir(2)), p13=par(dir(1),dir(3));
    if(p02&&p13){
      if(allSides) return {name:right?'正方形':'菱形'};
      if(right) return {name:'矩形'};
      return {name:'平行四边形'};
    }
    if(p02||p13){
      const legs=p02?[s[1],s[3]]:[s[0],s[2]];
      if(eq(legs[0],legs[1],0.02) && !eq(legs[0],(p02?s[0]:s[1]),0.02)) return {name:'等腰梯形'};
      return {name:'梯形'};
    }
    return {name:'四边形'};
  }
  if(m===5) return {name:'五边形'};
  if(m===6) return {name:allSides&&allAngles?'正六边形':'六边形'};
  return {name:m+' 边形'};
}

/* ========================================================================
   状态
   ======================================================================== */
const D2R=Math.PI/180, R2D=180/Math.PI;
const S={
  theta:Math.acos(1/Math.sqrt(3)), phi:Math.PI/4, d:0,
  yaw:-2.52, pitch:0.34, dist:8.0,
  auto:true, letters:true, lengths:true, normal:false, ext:true,
  preset:null
};
const HOME={yaw:-2.52,pitch:0.34,dist:8.0};

const cv=document.getElementById('stage');
const ctx=cv.getContext('2d');
let dpr=1, VW=0, VH=0;

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);
  VW=cv.clientWidth; VH=cv.clientHeight;
  cv.width=Math.round(VW*dpr); cv.height=Math.round(VH*dpr);
}
window.addEventListener('resize',resize);

/* ========================================================================
   相机与投影
   ======================================================================== */
const LIGHT=V3.norm([-0.42,-0.62,0.72]);

function camera(){
  const cp=Math.cos(S.pitch), sp=Math.sin(S.pitch);
  const dir=[cp*Math.cos(S.yaw), cp*Math.sin(S.yaw), sp];
  const eye=[dir[0]*S.dist, dir[1]*S.dist, dir[2]*S.dist];
  const f=[-dir[0],-dir[1],-dir[2]];
  let r=V3.cross(f,[0,0,1]);
  if(V3.len(r)<1e-6) r=[0,1,0];
  r=V3.norm(r);
  const u=V3.cross(r,f);
  return {eye:eye,f:f,r:r,u:u};
}

let CAM=null, PRJ=null;
function buildProjector(cx,cy){
  CAM=camera();
  const focal=Math.min(VW,VH)*3.45;
  PRJ=function(p){
    const rel=V3.sub(p,CAM.eye);
    const z=V3.dot(rel,CAM.f);
    const s=focal/Math.max(z,0.05);
    return {x:cx+V3.dot(rel,CAM.r)*s, y:cy-V3.dot(rel,CAM.u)*s, z:z, s:s};
  };
  PRJ.focal=focal;
  return PRJ;
}

/* ========================================================================
   绘制辅助
   ======================================================================== */
function poly(pts){
  ctx.beginPath();
  ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath();
}
function dot2(a,b){return a.x*b.x+a.y*b.y;}
function dist2(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function pointInPoly(p,pts){
  let inside=false;
  for(let i=0,j=pts.length-1;i<pts.length;j=i++){
    const xi=pts[i].x, yi=pts[i].y, xj=pts[j].x, yj=pts[j].y;
    if(((yi>p.y)!==(yj>p.y)) && (p.x < (xj-xi)*(p.y-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}
function distToSeg(p,a,b){
  const vx=b.x-a.x, vy=b.y-a.y;
  const wx=p.x-a.x, wy=p.y-a.y;
  const L2=vx*vx+vy*vy;
  let t=L2>0?(wx*vx+wy*vy)/L2:0;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+t*vx), p.y-(a.y+t*vy));
}
function distToPoly(p,pts){
  let m=1e9;
  for(let i=0;i<pts.length;i++) m=Math.min(m,distToSeg(p,pts[i],pts[(i+1)%pts.length]));
  return m;
}
/** 命中：0=无 1=截面（可调倾角） 2=手柄（可平移） */
function hitTest(p){
  if(HIT.center && Math.hypot(p.x-HIT.center.x,p.y-HIT.center.y)<19) return 2;
  if(HIT.poly && (pointInPoly(p,HIT.poly)||distToPoly(p,HIT.poly)<14)) return 1;
  return 0;
}
function label(txt,x,y,color,size,weight){
  ctx.font=(weight||600)+' '+(size||13)+'px "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=3.6; ctx.strokeStyle='rgba(255,255,255,.94)';
  ctx.strokeText(txt,x,y);
  ctx.fillStyle=color;
  ctx.fillText(txt,x,y);
}

function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

/* 背景 */
function paintBackdrop(){
  const g=ctx.createLinearGradient(0,0,VW,VH);
  g.addColorStop(0,'#f6fafe'); g.addColorStop(.5,'#edf4fc'); g.addColorStop(1,'#e4eefa');
  ctx.fillStyle=g; ctx.fillRect(0,0,VW,VH);

  const cx=VW*0.42, cy=VH*0.46, R=Math.max(VW,VH)*0.62;
  const rg=ctx.createRadialGradient(cx,cy,R*0.05,cx,cy,R);
  rg.addColorStop(0,'rgba(255,255,255,.92)');
  rg.addColorStop(.55,'rgba(255,255,255,.35)');
  rg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=rg; ctx.fillRect(0,0,VW,VH);
}

/* ========================================================================
   主渲染
   ======================================================================== */
let HIT={center:null, poly:null, n:null, c3:null};

function render(time){
  const panelW = (window.innerWidth>1080)?392:((window.innerWidth>760)?332:0);
  const cx = VW/2 - panelW/2;
  const cy = (window.innerWidth>760)?(VH/2):(VH*0.36);
  buildProjector(cx,cy);

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,VW,VH);
  paintBackdrop();

  const n=normalOf(S.theta,S.phi);
  const sec=crossSection(n,S.d);

  /* ---- 平面延展 ---- */
  if(S.ext){
    let e1 = Math.abs(n[0])<0.9 ? V3.cross(n,[1,0,0]) : V3.cross(n,[0,1,0]);
    e1=V3.norm(e1);
    const e2=V3.cross(n,e1);
    const base=V3.mul(n,S.d);
    const R=1.04;
    const quad=[
      V3.add(base,V3.add(V3.mul(e1,-R),V3.mul(e2,-R))),
      V3.add(base,V3.add(V3.mul(e1, R),V3.mul(e2,-R))),
      V3.add(base,V3.add(V3.mul(e1, R),V3.mul(e2, R))),
      V3.add(base,V3.add(V3.mul(e1,-R),V3.mul(e2, R)))
    ].map(PRJ);
    poly(quad);
    ctx.fillStyle='rgba(139,92,246,0.035)';
    ctx.fill();
    ctx.save();
    ctx.setLineDash([7,8]);
    ctx.lineWidth=1; ctx.strokeStyle='rgba(139,92,246,0.20)';
    ctx.stroke();
    ctx.restore();
  }

  /* ---- 面 ---- */
  const faces=FACES.map(f=>{
    const p3=f.v.map(k=>CUBE[k]);
    const sp=p3.map(PRJ);
    const c3=[0,0,0];
    for(const p of p3){c3[0]+=p[0]/4;c3[1]+=p[1]/4;c3[2]+=p[2]/4;}
    const toEye=V3.sub(CAM.eye,c3);
    const vis=V3.dot(f.n,toEye)>0;
    const lit=Math.max(0,V3.dot(f.n,LIGHT));
    let z=0; for(const q of sp) z+=q.z/4;
    return {f:f,sp:sp,c3:c3,vis:vis,lit:lit,z:z};
  });
  const back=faces.filter(o=>!o.vis).sort((a,b)=>b.z-a.z);
  const front=faces.filter(o=>o.vis).sort((a,b)=>b.z-a.z);

  function fillFace(o,base,span){
    const xs=o.sp.map(p=>p.x), ys=o.sp.map(p=>p.y);
    const x0=Math.min.apply(null,xs), y0=Math.min.apply(null,ys);
    const x1=Math.max.apply(null,xs), y1=Math.max.apply(null,ys);
    const a=base+span*o.lit;
    const g=ctx.createLinearGradient(x0,y0,x1,y1);
    g.addColorStop(0,'rgba(158,205,246,'+(a*1.35).toFixed(4)+')');
    g.addColorStop(.55,'rgba(133,186,236,'+(a).toFixed(4)+')');
    g.addColorStop(1,'rgba(178,216,248,'+(a*0.8).toFixed(4)+')');
    poly(o.sp);
    ctx.fillStyle=g; ctx.fill();
  }

  // 背面
  for(const o of back) fillFace(o,0.085,0.095);

  // 背面棱（虚线）
  ctx.save();
  ctx.setLineDash([6,7]);
  ctx.lineWidth=1.25;
  ctx.strokeStyle='rgba(96,150,200,.55)';
  for(const e of EDGES){
    const fa=faces.find(o=>o.f.key===e[2][0]);
    const fb=faces.find(o=>o.f.key===e[2][1]);
    if(fa.vis||fb.vis) continue;
    const p=PRJ(CUBE[e[0]]), q=PRJ(CUBE[e[1]]);
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
  }
  ctx.restore();

  /* ---- 截面 ---- */
  HIT.center=null; HIT.poly=null; HIT.n=n; HIT.c3=sec.center;

  if(sec.kind==='polygon' && sec.pts.length>=3){
    const sp=sec.pts.map(PRJ);
    HIT.poly=sp;
    const sc=PRJ(sec.center);
    HIT.center=sc;

    // 渐变面（带柔和投影）
    const xs=sp.map(p=>p.x), ys=sp.map(p=>p.y);
    const g=ctx.createLinearGradient(Math.min.apply(null,xs),Math.min.apply(null,ys),
                                     Math.max.apply(null,xs),Math.max.apply(null,ys));
    g.addColorStop(0,'rgba(198,168,250,.60)');
    g.addColorStop(.45,'rgba(158,118,240,.50)');
    g.addColorStop(1,'rgba(124,58,237,.44)');
    ctx.save();
    ctx.shadowColor='rgba(109,40,217,.26)';
    ctx.shadowBlur=16; ctx.shadowOffsetY=3;
    poly(sp); ctx.fillStyle=g; ctx.fill();
    ctx.restore();

    // 描边
    poly(sp);
    ctx.lineJoin='round';
    ctx.lineWidth=2.6; ctx.strokeStyle='#7c3aed'; ctx.stroke();

    // 顶点
    const LET=['M','N','P','Q','R','S','T','U'];
    for(let i=0;i<sp.length;i++){
      const p=sp[i];
      ctx.beginPath(); ctx.arc(p.x,p.y,4.4,0,Math.PI*2);
      ctx.fillStyle='#fff'; ctx.fill();
      ctx.lineWidth=2.4; ctx.strokeStyle='#6d28d9'; ctx.stroke();
    }
    // 顶点字母
    if(S.letters){
      for(let i=0;i<sp.length;i++){
        const p=sp[i];
        let dx=p.x-sc.x, dy=p.y-sc.y;
        let L=Math.hypot(dx,dy)||1;
        dx/=L; dy/=L;
        label(LET[i], p.x-dx*19, p.y-dy*19, '#5b21b6', 14.5, 800);
      }
    }
    // 边长
    if(S.lengths){
      for(let i=0;i<sp.length;i++){
        const p=sp[i], q=sp[(i+1)%sp.length];
        const L=dist2(p,q);
        if(L<54) continue;
        const mx=(p.x+q.x)/2, my=(p.y+q.y)/2;
        let ox=-(q.y-p.y)/L, oy=(q.x-p.x)/L;
        if((mx+ox-sc.x)*(mx-sc.x)+(my+oy-sc.y)*(my-sc.y) < 0){ox=-ox;oy=-oy;}
        label(sec.sides[i].toFixed(3), mx+ox*13, my+oy*13, '#6d28d9', 11.5, 700);
      }
    }
  } else if(sec.kind==='segment'){
    const p=PRJ(sec.pts[0]), q=PRJ(sec.pts[1]);
    HIT.center={x:(p.x+q.x)/2,y:(p.y+q.y)/2};
    ctx.save();
    ctx.lineWidth=4; ctx.lineCap='round';
    ctx.strokeStyle='rgba(124,58,237,.28)';
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
    ctx.lineWidth=2.6; ctx.strokeStyle='#7c3aed';
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
    ctx.restore();
  }

  /* ---- 前面（半透明玻璃） ---- */
  for(const o of front) fillFace(o,0.052,0.07);

  // 前面棱
  ctx.lineJoin='round'; ctx.lineCap='round';
  ctx.lineWidth=2.05; ctx.strokeStyle='rgba(41,104,168,.92)';
  for(const e of EDGES){
    const fa=faces.find(o=>o.f.key===e[2][0]);
    const fb=faces.find(o=>o.f.key===e[2][1]);
    if(!(fa.vis||fb.vis)) continue;
    const p=PRJ(CUBE[e[0]]), q=PRJ(CUBE[e[1]]);
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
  }

  /* ---- 法向量 ---- */
  if(S.normal && HIT.center){
    const c3=sec.center;
    const tip3=V3.add(c3,V3.mul(n,0.42));
    const a=PRJ(c3), b=PRJ(tip3);
    ctx.save();
    ctx.setLineDash([5,5]); ctx.lineWidth=1.6;
    ctx.strokeStyle='rgba(109,40,217,.75)';
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    ctx.setLineDash([]);
    const ang=Math.atan2(b.y-a.y,b.x-a.x);
    ctx.beginPath();
    ctx.moveTo(b.x,b.y);
    ctx.lineTo(b.x-9*Math.cos(ang-0.4), b.y-9*Math.sin(ang-0.4));
    ctx.lineTo(b.x-9*Math.cos(ang+0.4), b.y-9*Math.sin(ang+0.4));
    ctx.closePath();
    ctx.fillStyle='rgba(109,40,217,.85)'; ctx.fill();
    ctx.restore();
    label('n', b.x+13*Math.cos(ang), b.y+13*Math.sin(ang), '#6d28d9', 13, 800);
  }

  /* ---- 正方体顶点字母 ---- */
  const o3=PRJ([0,0,0]);
  for(const k in CUBE){
    const sp=PRJ(CUBE[k]);
    let dx=sp.x-o3.x, dy=sp.y-o3.y;
    const L=Math.hypot(dx,dy)||1;
    dx/=L; dy/=L;
    const nm = k.length>1 ? (k[0]+'₁') : k;
    const seen=VF[k].some(fn=>V3.dot(fn,V3.sub(CAM.eye,CUBE[k]))>0);
    label(nm, sp.x+dx*17, sp.y+dy*17, seen?'rgba(30,86,142,.92)':'rgba(30,86,142,.40)', 13, 700);
  }

  /* ---- 中心拖拽手柄 ---- */
  if(HIT.center){
    const c=HIT.center;
    const pulse=0.5+0.5*Math.sin(time/520);
    ctx.beginPath(); ctx.arc(c.x,c.y,13.5+pulse*2.2,0,Math.PI*2);
    ctx.strokeStyle='rgba(124,58,237,'+(0.16+0.16*pulse).toFixed(3)+')';
    ctx.lineWidth=6; ctx.stroke();

    ctx.beginPath(); ctx.arc(c.x,c.y,9.5,0,Math.PI*2);
    ctx.fillStyle='rgba(255,255,255,.95)'; ctx.fill();
    ctx.lineWidth=2.6; ctx.strokeStyle='#7c3aed'; ctx.stroke();

    ctx.beginPath(); ctx.arc(c.x,c.y,3.2,0,Math.PI*2);
    ctx.fillStyle='#7c3aed'; ctx.fill();
  }

  updateHUD(sec);
}

/* ========================================================================
   HUD 更新
   ======================================================================== */
const el={
  shape:document.getElementById('shapeName'),
  vc:document.getElementById('vertCount'),
  area:document.getElementById('areaVal'),
  peri:document.getElementById('periVal'),
  sides:document.getElementById('sidesList'),
  eq:document.getElementById('eqText'),
  oTheta:document.getElementById('oTheta'),
  oPhi:document.getElementById('oPhi'),
  oOff:document.getElementById('oOff')
};
function setText(node,val){ if(node && node.textContent!==val) node.textContent=val; }

let lastSidesKey='';
function updateHUD(sec){
  const cls=classify(sec);
  setText(el.shape, cls.name);
  if(sec.kind==='polygon'){
    setText(el.vc, sec.pts.length+' 边形');
    setText(el.area, sec.area.toFixed(3));
    setText(el.peri, sec.perim.toFixed(3));
    const key=sec.sides.map(x=>x.toFixed(3)).join(',');
    if(key!==lastSidesKey){
      lastSidesKey=key;
      el.sides.innerHTML='边长：'+sec.sides.map((x,i)=>'<span>'+('MNPQRSTU'[i]||'?')+('MNPQRSTU'[(i+1)%sec.sides.length]||'?')+' = '+x.toFixed(3)+'</span>').join('');
    }
  }else if(sec.kind==='segment'){
    setText(el.vc,'退化为线段');
    setText(el.area,'0.000');
    setText(el.peri, sec.perim.toFixed(3));
    if(lastSidesKey!=='seg'){lastSidesKey='seg'; el.sides.textContent='平面恰好包含正方体的一条棱';}
  }else{
    setText(el.vc,'—');
    setText(el.area,'—'); setText(el.peri,'—');
    if(lastSidesKey!=='none'){lastSidesKey='none'; el.sides.textContent='平面已移出正方体';}
  }

  const n=normalOf(S.theta,S.phi);
  const f=x=>(x>=0?' + ':' − ')+Math.abs(x).toFixed(3);
  setText(el.eq, n[0].toFixed(3)+'x'+f(n[1])+'y'+f(n[2])+'z = '+S.d.toFixed(3));

  setText(el.oTheta,(S.theta*R2D).toFixed(1)+'°');
  setText(el.oPhi,((S.phi*R2D)%360+360)%360===0?'0.0°':(((S.phi*R2D)%360+360)%360).toFixed(1)+'°');
  setText(el.oOff,S.d.toFixed(3));
}

/* ========================================================================
   交互
   ======================================================================== */
let drag=null;
let autoResumeAt=0;

function maxOffset(){
  const n=normalOf(S.theta,S.phi);
  return 0.5*(Math.abs(n[0])+Math.abs(n[1])+Math.abs(n[2]))-0.004;
}
function clampOffset(){
  const M=maxOffset();
  if(S.d>M) S.d=M;
  if(S.d<-M) S.d=-M;
}

cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);
  cv.classList.add('dragging');
  const p={x:e.clientX,y:e.clientY};
  const hit=hitTest(p);
  const mode = hit===2?'move' : (hit===1?'tilt':'orbit');
  drag={mode:mode,x:p.x,y:p.y,id:e.pointerId};
  tween=null;
  autoResumeAt=0;
});

cv.addEventListener('pointermove',e=>{
  if(!drag){
    const p={x:e.clientX,y:e.clientY};
    const hit=hitTest(p);
    cv.style.cursor = hit===2?'move' : (hit===1?'crosshair':'grab');
    return;
  }
  cv.style.cursor='grabbing';
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  drag.x=e.clientX; drag.y=e.clientY;

  if(drag.mode==='orbit'){
    S.yaw -= dx*0.0072;
    S.pitch = Math.max(-1.36,Math.min(1.36,S.pitch+dy*0.0072));
    S.preset=null;
  }else if(drag.mode==='tilt'){
    S.theta = Math.max(0.004,Math.min(Math.PI-0.004,S.theta+dy*0.42*D2R));
    S.phi = S.phi + dx*0.42*D2R;
    S.phi = ((S.phi%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
    clampOffset();
    S.preset=null;
    syncSliders();
  }else if(drag.mode==='move'){
    if(HIT.center && HIT.c3){
      const a=HIT.center;
      const tip=PRJ(V3.add(HIT.c3,V3.mul(normalOf(S.theta,S.phi),0.2)));
      let sx=tip.x-a.x, sy=tip.y-a.y;
      const L=Math.hypot(sx,sy);
      if(L>6){
        sx/=L; sy/=L;
        const pxPerUnit=L/0.2;
        S.d += (dx*sx+dy*sy)/pxPerUnit;
      }else{
        S.d += -dy*0.0022;
      }
      clampOffset();
      S.preset=null;
      syncSliders();
    }
  }
});

function endDrag(e){
  if(!drag) return;
  drag=null;
  cv.classList.remove('dragging');
  cv.style.cursor='grab';
  autoResumeAt=performance.now()+2600;
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('dblclick',()=>{
  S.yaw=HOME.yaw;S.pitch=HOME.pitch;S.dist=HOME.dist;
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  S.dist=Math.max(5.4,Math.min(14,S.dist*Math.exp(e.deltaY*0.0011)));
},{passive:false});

/* ---- 滑块 ---- */
const rTheta=document.getElementById('rTheta');
const rPhi=document.getElementById('rPhi');
const rOff=document.getElementById('rOff');

function syncSliders(){
  rTheta.value=(S.theta*R2D).toFixed(1);
  rPhi.value=(((S.phi*R2D)%360+360)%360).toFixed(1);
  const M=maxOffset();
  rOff.min=(-M).toFixed(3);
  rOff.max=(M).toFixed(3);
  rOff.value=S.d.toFixed(3);
}

rTheta.addEventListener('input',()=>{
  tween=null;
  S.theta=parseFloat(rTheta.value)*D2R; clampOffset(); S.preset=null; syncSliders(); markPresets();
});
rPhi.addEventListener('input',()=>{
  tween=null;
  S.phi=parseFloat(rPhi.value)*D2R; clampOffset(); S.preset=null; syncSliders(); markPresets();
});
rOff.addEventListener('input',()=>{
  tween=null;
  S.d=parseFloat(rOff.value); clampOffset(); S.preset=null; markPresets();
});

document.getElementById('resetView').addEventListener('click',()=>{
  S.yaw=HOME.yaw;S.pitch=HOME.pitch;S.dist=HOME.dist;
});

/* ---- 显示选项 ---- */
function bindToggle(id,key){
  const c=document.getElementById(id);
  c.checked=!!S[key];
  c.addEventListener('change',()=>{S[key]=c.checked;});
}
bindToggle('tgLetters','letters');
bindToggle('tgLengths','lengths');
bindToggle('tgNormal','normal');
bindToggle('tgExt','ext');
bindToggle('tgAuto','auto');

/* ---- 典型截面 ---- */
const SQ3=Math.sqrt(3), SQ6=Math.sqrt(6);
const PRESETS=[
  {key:'p1',name:'平行底面 · 正方形',theta:0,phi:0,d:0.18},
  {key:'p2',name:'对角面 · 矩形',theta:90,phi:-45,d:0},
  {key:'p3',name:'正三角形（棱中点）',theta:Math.acos(1/SQ3)*R2D,phi:45,d:1/SQ3},
  {key:'p4',name:'正六边形',theta:Math.acos(1/SQ3)*R2D,phi:45,d:0},
  {key:'p5',name:'大三角形（过顶点）',theta:Math.acos(1/SQ3)*R2D,phi:45,d:0.5/SQ3},
  {key:'p6',name:'五边形',theta:Math.acos(2/SQ6)*R2D,phi:45,d:0.4/SQ6},
  {key:'p7',name:'等腰梯形',theta:Math.acos(2/3)*R2D,phi:Math.atan2(2,1)*R2D,d:0.25},
  {key:'p8',name:'斜切 · 一般六边形',theta:Math.acos(2/3)*R2D,phi:Math.atan2(2,1)*R2D,d:0}
];
const presetBox=document.getElementById('presets');
let tween=null;

function applyPreset(p){
  const toT=p.theta*D2R;
  const toP=p.phi*D2R;
  // 选最近的等价角，避免 φ 绕大圈
  const toPn=toP+Math.PI*2*Math.round((S.phi-toP)/(Math.PI*2));
  tween={
    t0:performance.now(), dur:460,
    from:{theta:S.theta, phi:S.phi, d:S.d},
    to:{theta:toT, phi:toPn, d:p.d}
  };
  S.preset=p.key;
  markPresets();
}

function buildPresets(){
  presetBox.innerHTML='';
  PRESETS.forEach(p=>{
    const b=document.createElement('button');
    b.className='chip'; b.dataset.key=p.key;
    b.innerHTML='<i class="sw"></i><span>'+p.name+'</span>';
    b.addEventListener('click',()=>applyPreset(p));
    presetBox.appendChild(b);
  });
}
function markPresets(){
  [...presetBox.children].forEach(c=>{
    c.classList.toggle('on', c.dataset.key===S.preset);
  });
  [...document.getElementById('myPresets').children].forEach(c=>{
    c.classList.toggle('on', c.dataset.key===S.preset);
  });
}

/* ---- 我的预设 ---- */
const LSKEY='cubeSectionPresets.v1';
function loadMine(){
  try{ return JSON.parse(localStorage.getItem(LSKEY)||'[]'); }catch(e){ return []; }
}
function saveMine(list){
  try{ localStorage.setItem(LSKEY,JSON.stringify(list)); }catch(e){}
}
const myBox=document.getElementById('myPresets');

function buildMine(){
  const list=loadMine();
  myBox.innerHTML='';
  if(!list.length){
    myBox.innerHTML='<div class="empty-tip">摆好切面 → 点「保存当前」，讲课时一键还原。</div>';
    return;
  }
  list.forEach(item=>{
    const b=document.createElement('div');
    b.className='chip saved'; b.dataset.key=item.id; b.tabIndex=0;
    b.innerHTML='<i class="sw"></i><span>'+item.name+'</span><button class="del" title="删除">×</button>';
    b.addEventListener('click',ev=>{
      if(ev.target.classList.contains('del')){
        ev.stopPropagation();
        saveMine(loadMine().filter(x=>x.id!==item.id));
        buildMine(); markPresets();
        return;
      }
      S.theta=item.theta; S.phi=item.phi; S.d=item.d;
      clampOffset(); S.preset=item.id;
      syncSliders(); markPresets();    });
    myBox.appendChild(b);
  });
  markPresets();
}

document.getElementById('savePreset').addEventListener('click',()=>{
  const inp=document.getElementById('presetName');
  const list=loadMine();
  const raw=inp.value.trim();
  const name=raw||('预设 '+(list.length+1));
  const id='u'+Date.now();
  list.push({id:id,name:name.slice(0,10),theta:S.theta,phi:S.phi,d:S.d});
  saveMine(list);
  inp.value='';
  S.preset=id;
  buildMine(); markPresets();
});

/* ========================================================================
   动画循环
   ======================================================================== */
let lastT=performance.now();
function loop(t){
  const dt=Math.min(60,t-lastT); lastT=t;
  if(tween){
    let k=(t-tween.t0)/tween.dur;
    if(k>1) k=1;
    const e=k<0.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
    S.theta=tween.from.theta+(tween.to.theta-tween.from.theta)*e;
    S.phi  =tween.from.phi  +(tween.to.phi  -tween.from.phi  )*e;
    S.d    =tween.from.d    +(tween.to.d    -tween.from.d    )*e;
    clampOffset(); syncSliders();
    if(k>=1){
      S.phi=((S.phi%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
      tween=null;
    }
  }else if(S.auto && !drag && (autoResumeAt===0 || t>autoResumeAt)){
    S.yaw += 0.000098*dt;
  }
  render(t);
  requestAnimationFrame(loop);
}

/* ---- 启动 ---- */
resize();
buildPresets();
buildMine();
S.theta=Math.acos(1/SQ3); S.phi=Math.PI/4; S.d=0; S.preset='p4';
try{
  const qp=new URLSearchParams(location.search).get('p');
  if(qp){
    const f=PRESETS.find(x=>x.key===qp);
    if(f){ S.theta=f.theta*D2R; S.phi=f.phi*D2R; S.d=f.d; S.preset=f.key; }
  }
}catch(e){}
syncSliders(); markPresets();
requestAnimationFrame(loop);

})();
</script>
