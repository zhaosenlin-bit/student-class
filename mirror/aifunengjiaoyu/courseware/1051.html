 if(V.mode==='3d'){sc=LESSON.scene(S,V);R.render(sc,V.cam,w,h);drawLabels(overlay,sc,R,w,h);LESSON.hud?.(overlay,w,h,S,V);$('#viewMessage').textContent='拖动空白处旋转 · 点击选择 · 相机不改变空间关系'}else{let W=Math.round(w*ratio),H=Math.round(h*ratio);if($('#scene').width!==W||$('#scene').height!==H){$('#scene').width=W;$('#scene').height=H;R.img=null}base2.setTransform(ratio,0,0,ratio,0,0);base2.fillStyle='#f8f6f1';base2.fillRect(0,0,w,h);LESSON.draw2d(base2,w,h,S,V);$('#viewMessage').textContent=V.mode==='transfer'?'原创迁移题 · 静态题设 · 未显示动态提示':(LESSON.viewHint?.(V.mode)||'同源正视表示 · 不是屏幕投影测量')}

function renderCover(){let c=$('#coverCanvas'),rc=c.getBoundingClientRect();if(rc.width<5)return;let rr=new Software3D(c),scene=LESSON.scene(S,V);rr.render(scene,LESSON.camera(S),rc.width,rc.height);let ctx=c.getContext('2d');ctx.save();ctx.scale(rr.ratio,rr.ratio);drawLabels(ctx,scene,rr,rc.width,rc.height);ctx.restore()}
function tick(t){let dt=lastTime?Math.min(.045,(t-lastTime)/1000):0;lastTime=t;if(entered&&process.running&&V.tool==='orbit'&&V.mode!=='transfer'){process.time+=dt;LESSON.animate?.(S,process,dt,V);mark();syncFields()}if(dirty&&entered){let a=performance.now();try{render()}catch(e){runtimeErrors.push(e.message);$('#errorBox').hidden=false;$('#errorBox').textContent='渲染未完成：'+e.message+'。本状态不可记为通过。';console.error(e);dirty=false}lastFrameMs=performance.now()-a}requestAnimationFrame(tick)}

function vfield(k,label,min,max,step=1){return `<div class="control"><div class="labelrow"><label>${label}</label><input type="text" inputmode="decimal" data-vnum="${k}" data-min="${min}" data-max="${max}" value="${V.display[k]}"></div><input type="range" data-vrange="${k}" min="${min}" max="${max}" step="${step}" value="${V.display[k]}" aria-label="${label}"></div>`}
function vcheck(k,label){return `<label class="checkRow"><input type="checkbox" data-vcheck="${k}" ${V.display[k]?'checked':''}>${label}</label>`}
function setViewKey(k,val){let el=$('[data-vnum="'+k+'"]');if(typeof val!=='boolean'){if(String(val).trim()==='')return false;let n=Number(val);if(!Number.isFinite(n)||el&&(n<Number(el.dataset.min)||n>Number(el.dataset.max))){toast('显示数值无效；未改变画面。');return false}val=n}endPointer(true);process.running=false;V.display[k]=val;syncFields();mark();return true}

function phasePanel(s){return `<div class="modeChooser"><label>工作方式</label><select data-key="phase"><option value="free" ${s.phase==='free'?'selected':''}>自由探究 · 不加目标条件</option><option value="construct" ${s.phase==='construct'?'selected':''}>按已知条件构造</option><option value="reason" ${s.phase==='reason'?'selected':''}>证明说明 · 不改模型</option></select></div>`}
function transferPanel(s,prompt){return `<button data-lesson="transfer" class="primary fullWidth">打开无提示迁移</button><p class="note">${prompt}</p><textarea id="transferAnswer" class="transferInput" placeholder="先写判断和几何理由…">${esc(s.answer||'')}</textarea><div class="seg"><button data-lesson="submitTransfer">提交解释</button><button data-lesson="revealTransfer">教师揭示</button></div><div id="transferFeedback"></div><button data-lesson="back" class="fullWidth">返回空间探究</button>`}
function transferFeedback(s,answer){let f=$('#transferFeedback');if(f)f.innerHTML=s.transferRevealed?'<div class="feedback">'+answer+'</div>':s.submitted?'<p class="note">解释已记录，等待教师核对；未自动判分。</p>':''}
function wrapText(c,text,x,y,maxWidth,size=20,color='#243047',lineHeight=size*1.6){c.font=`${size}px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif`;let line='',yy=y;for(let ch of text){if(ch==='\n'||(line&&c.measureText(line+ch).width>maxWidth)){labelAt(c,line,x,yy,size,color);yy+=lineHeight;line=ch==='\n'?'':ch}else line+=ch}if(line)labelAt(c,line,x,yy,size,color);return yy+lineHeight}
function shortStatus(c,w,h,title,sub,bottom){hud(c,w,h,title,sub);if(bottom){let f=w<600?15:23,max=w-42;wrapText(c,bottom,w<600?15:25,h-(w<600?100:102),max,f,'#355c8a',f*1.4)}}
function defaultExport(s){let clean=clone(s);delete clean.derived;return clean}

<script>
(function() {
  // 防右键
  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });

  // 防键盘快捷键: F12 | Ctrl+Shift+I | Ctrl+Shift+J | Ctrl+U | Ctrl+S
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'i' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u')) ||

    }
  });

  // DevTools 检测（基于 debugger 语句执行耗时）

    }
  };
