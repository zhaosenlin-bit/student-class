<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>劈尖干涉平整度检测实验</title>
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  background: linear-gradient(160deg, #e3f0fa 0%, #d4e8f8 40%, #c9e4f6 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 16px 12px 30px;
  color: #2c3e50;
}
.app-container { width:100%; max-width:1060px; display:flex; flex-direction:column; gap:14px; }

.glass-card {
  background: rgba(255,255,255,0.52);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.72);
  border-radius: 20px;
  box-shadow: 0 8px 36px rgba(20,50,90,0.10), 0 2px 8px rgba(20,45,75,0.06), inset 0 1px 0 rgba(255,255,255,0.6);
  padding: 18px 20px;
}

.header-card {
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
}
.header-card h1 { font-size:1.45rem; font-weight:700; letter-spacing:0.02em; color:#1a3a5c; }
.header-card .subtitle { font-size:0.85rem; color:#5a7896; font-weight:500; }
.header-badge {
  display:inline-flex; align-items:center; gap:6px;
  background: linear-gradient(135deg, #1e4d7b, #1a3a5c);
  color:#fff; padding:6px 14px; border-radius:20px; font-size:0.78rem; font-weight:600;
  letter-spacing:0.04em;
}
.header-badge .dot { width:7px; height:7px; border-radius:50%; background:#5ecc7e; box-shadow:0 0 6px #5ecc7e; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

.main-content { display:flex; gap:14px; }
.canvas-panel { flex:1 1 0; min-width:0; padding:12px; }
.canvas-wrapper { position:relative; width:100%; }
.canvas-wrapper canvas { width:100%; height:auto; aspect-ratio:720/520; display:block; border-radius:12px; background:#fafcfe; }

.side-panel { width:290px; flex-shrink:0; display:flex; flex-direction:column; gap:12px; }

.control-card h3, .training-card h3, .formula-card h3 {
  font-size:0.95rem; font-weight:700; color:#1a3a5c; margin-bottom:12px;
  padding-bottom:8px; border-bottom:1.5px solid rgba(74,130,200,0.2);
  display:flex; align-items:center; gap:8px;
}
.control-card h3::before, .training-card h3::before, .formula-card h3::before {
  content:''; display:inline-block; width:4px; height:16px; border-radius:2px;
  background:linear-gradient(180deg,#4a90d9,#6db3f2);
}

.control-group { margin-bottom:13px; }
.control-label { font-size:0.8rem; font-weight:600; color:#3a5570; margin-bottom:5px; display:flex; align-items:center; gap:6px; }
.control-label .val { font-weight:400; color:#6a8aa8; font-size:0.75rem; margin-left:auto; }

.btn-row { display:flex; gap:7px; flex-wrap:wrap; }
.btn {
  padding:7px 13px; border-radius:10px; border:1.5px solid #c0d4e8;
  background:rgba(255,255,255,0.65); cursor:pointer; font-size:0.8rem; font-weight:600;
  color:#3a5570; transition:all 0.2s; font-family:inherit; white-space:nowrap;
}
.btn:hover { background:rgba(255,255,255,0.9); border-color:#8ab4dc; }
.btn.active {
  background:linear-gradient(135deg,#4a90d9,#3978c0); color:#fff; border-color:#4a90d9;
  box-shadow:0 2px 10px rgba(74,144,217,0.30);
}

input[type=range] { -webkit-appearance:none; width:100%; height:6px; border-radius:3px; background:linear-gradient(90deg,#c0d4e8,#8ab4dc); outline:none; margin:4px 0; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#fff; border:2px solid #4a90d9; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,0.12); transition:box-shadow 0.2s; }
input[type=range]::-webkit-slider-thumb:hover { box-shadow:0 3px 12px rgba(74,144,217,0.35); }
input[type=range]:disabled { opacity:0.45; }

.training-btn { width:100%; padding:10px; border-radius:12px; border:none; cursor:pointer; font-size:0.85rem; font-weight:700; font-family:inherit; transition:all 0.25s; color:#fff; letter-spacing:0.03em; }
.training-btn.gen {
  background:linear-gradient(135deg,#4a90d9,#3070b8);
  box-shadow:0 3px 14px rgba(74,144,217,0.30);
}
.training-btn.gen:hover { transform:translateY(-1px); box-shadow:0 5px 20px rgba(74,144,217,0.40); }
.training-btn.submit { background:linear-gradient(135deg,#e8943a,#d07020); box-shadow:0 3px 14px rgba(220,130,50,0.30); }
.training-btn.submit:hover { transform:translateY(-1px); }
.training-btn.next { background:linear-gradient(135deg,#5ecc7e,#3da85a); box-shadow:0 3px 14px rgba(90,200,120,0.30); }

.answer-btns { display:flex; gap:8px; margin:10px 0; }
.answer-btn {
  flex:1; padding:9px 6px; border-radius:10px; border:2px solid #c8d8e8;
  background:rgba(255,255,255,0.55); cursor:pointer; font-size:0.82rem; font-weight:600;
  color:#3a5570; font-family:inherit; transition:all 0.2s;
}
.answer-btn:hover { border-color:#6a9ac8; background:rgba(255,255,255,0.8); }
.answer-btn.chosen { border-color:#4a90d9; background:rgba(74,144,217,0.12); color:#1a3a5c; }
.answer-btn.correct-chosen { border-color:#3da85a!important; background:rgba(61,168,90,0.14)!important; color:#1a5c2a!important; }
.answer-btn.wrong-chosen { border-color:#e04040!important; background:rgba(224,64,64,0.12)!important; color:#6b2020!important; }

.result-box { padding:10px 14px; border-radius:10px; font-size:0.82rem; font-weight:600; margin:8px 0; display:none; }
.result-box.correct { display:block; background:rgba(61,168,90,0.12); color:#1a5c2a; border:1px solid rgba(61,168,90,0.3); }
.result-box.wrong { display:block; background:rgba(224,64,64,0.10); color:#6b2020; border:1px solid rgba(224,64,64,0.25); }

.score-display { text-align:center; font-size:0.85rem; font-weight:600; color:#3a5570; margin-top:4px; }
.score-display span { color:#4a90d9; font-size:1.1rem; }

.formula-card .formula { font-family:'Times New Roman', 'STIX Two Math', serif; font-size:1.05rem; color:#1a3a5c; text-align:center; padding:6px 0; letter-spacing:0.03em; border-bottom:1px dashed rgba(0,0,0,0.08); }
.formula-card .formula:last-child { border-bottom:none; }
.formula-card .note { font-size:0.75rem; color:#5a7896; text-align:center; margin-top:6px; line-height:1.5; }

@media (max-width:820px) {
  .main-content { flex-direction:column; }
  .side-panel { width:100%; flex-direction:row; flex-wrap:wrap; }
  .side-panel > * { flex:1 1 260px; min-width:240px; }
  .header-card h1 { font-size:1.2rem; }
}
@media (max-width:560px) {
  body { padding:8px 4px 16px; }
  .glass-card { padding:12px 10px; border-radius:14px; }
  .side-panel > * { flex:1 1 100%; min-width:0; }
  .btn { padding:6px 10px; font-size:0.75rem; }
}
</style>
</head>

<div class="app-container">

  <div class="header-card glass-card">
    <div>
      <h1>劈尖干涉 &mdash; 平整度检测实验</h1>
      <div class="subtitle">高二物理 &middot; 选择性必修第一册 &middot; 光的干涉应用</div>
    </div>
    <div class="header-badge"><span class="dot"></span>实验检测仪表盘</div>
  </div>

  <div class="main-content">
    <div class="canvas-panel glass-card">
      <div class="canvas-wrapper">
        <canvas id="mainCanvas"></canvas>
      </div>
    </div>

    <div class="side-panel">
      <div class="control-card glass-card">
        <h3>控制面板</h3>
        <div class="control-group">
          <div class="control-label">工件表面状态</div>
          <div class="btn-row" id="defectTypeGroup">
            <button class="btn" data-type="none">平整</button>
            <button class="btn active" data-type="depression">局部凹陷</button>
            <button class="btn" data-type="protrusion">局部凸起</button>
          </div>
        </div>
        <div class="control-group" id="amplitudeGroup">
          <div class="control-label">缺陷幅度 <span class="val" id="ampVal">0.60</span></div>
          <input type="range" id="ampSlider" min="0.1" max="1.5" step="0.02" value="0.60">
        </div>
        <div class="control-group" id="positionGroup">
          <div class="control-label">缺陷位置 <span class="val" id="posVal">0.50</span></div>
          <input type="range" id="posSlider" min="0.05" max="0.95" step="0.01" value="0.50">
        </div>
        <div class="control-group" id="widthGroup">
          <div class="control-label">缺陷宽度 <span class="val" id="widVal">50 px</span></div>
          <input type="range" id="widSlider" min="20" max="120" step="1" value="50">
        </div>
      </div>

      <div class="training-card glass-card">
        <h3>随机判读训练</h3>
        <button class="training-btn gen" id="btnRandom">随机出题</button>
        <div class="answer-btns" id="answerBtns" style="display:none;">
          <button class="answer-btn" data-answer="none">平整</button>
          <button class="answer-btn" data-answer="depression">凹陷</button>
          <button class="answer-btn" data-answer="protrusion">凸起</button>
        </div>
        <button class="training-btn submit" id="btnSubmit" style="display:none;">提交判断</button>
        <div class="result-box" id="resultBox"></div>
        <button class="training-btn next" id="btnNext" style="display:none;">下一题</button>
        <div class="score-display">得分: <span id="scoreText">0</span> / <span id="totalText">0</span></div>
      </div>

      <div class="formula-card glass-card">
        <h3>核心公式</h3>
        <div class="formula">&Delta; = 2d + &lambda;/2</div>
        <div class="formula">暗纹: 2d = k&lambda; &emsp;明纹: 2d = (k&minus;&half;)&lambda;</div>
        <div class="formula">相邻暗纹 &Delta;d = &lambda;/2</div>
        <div class="note">
          判据：条纹<b>向棱边</b>弯曲 &rarr; <b>凹陷</b>（空气隙变厚处，等厚线移向薄端）<br>
          条纹<b>背向棱边</b>弯曲 &rarr; <b>凸起</b>（空气隙变薄处，等厚线移向厚端）
        </div>
      </div>
    </div>
  </div>

</div>
