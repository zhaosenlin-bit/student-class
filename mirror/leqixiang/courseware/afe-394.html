<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(135deg,#e3f0fa 0%,#d4e8f8 40%,#c9e4f6 100%);min-height:100vh;padding:16px;color:#1a2a3a;}
.glass{background:rgba(255,255,255,0.55);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:16px;border:1px solid rgba(255,255,255,0.7);box-shadow:0 8px 32px rgba(30,60,100,0.08);padding:16px;}
h1{text-align:center;font-size:1.6rem;font-weight:700;color:#0d3b66;margin-bottom:4px;}
.subtitle{text-align:center;font-size:0.88rem;color:#5a7a9a;margin-bottom:14px;}
.main-row{display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px;}
.scene-box{flex:2;min-width:550px;}
.side-box{flex:1;min-width:320px;}
#canvas-container{width:100%;height:460px;border-radius:12px;overflow:hidden;position:relative;}
.legend-overlay{position:absolute;bottom:8px;left:8px;background:rgba(255,255,255,0.85);padding:8px 12px;border-radius:8px;font-size:0.72rem;z-index:10;line-height:1.4;}
.tab-bar{display:flex;gap:4px;margin-bottom:10px;justify-content:center;}
.tab-btn{padding:8px 16px;border-radius:10px;border:2px solid #cbd5e1;background:#fff;cursor:pointer;font-size:0.82rem;font-weight:600;transition:all 0.2s;}
.tab-btn.active{background:#3b82f6;color:#fff;border-color:#1d4ed8;}
.btn-row{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0;}
.btn-sm{padding:5px 10px;border-radius:6px;border:1px solid #94a3b8;background:#fff;cursor:pointer;font-size:0.75rem;transition:all 0.15s;}
.btn-sm:hover{background:#eff6ff;border-color:#3b82f6;}
.btn-sm.active{background:#3b82f6;color:#fff;border-color:#3b82f6;}
.ctrl-row{display:flex;justify-content:space-between;align-items:center;margin:3px 0;font-size:0.83rem;}
.ctrl-row .val{font-weight:700;color:#1e40af;}
input[type=range]{width:100%;margin:2px 0 8px;accent-color:#3b82f6;}
.formula-box{background:rgba(59,130,246,0.07);border-radius:10px;padding:10px;margin:8px 0;font-family:'Courier New',monospace;font-size:0.85rem;text-align:center;}
.formula-box .hl{color:#2563eb;font-weight:700;}
.cards-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0;}
@media(max-width:600px){.cards-wrap{grid-template-columns:1fr;}}
.card-exam{border-left:4px solid #3b82f6;padding-left:12px;}.card-pitfall{border-left:4px solid #ef4444;padding-left:12px;}
.card-exam h3{color:#1e40af;font-size:0.85rem;margin-bottom:4px;}
.card-pitfall h3{color:#dc2626;font-size:0.85rem;margin-bottom:4px;}
.card-exam li,.card-pitfall li{font-size:0.78rem;color:#475569;padding:2px 0 2px 16px;position:relative;line-height:1.4;list-style:none;}
.card-exam li::before{content:'📝';position:absolute;left:0;font-size:0.65rem;}.card-pitfall li::before{content:'⚠';position:absolute;left:0;font-size:0.65rem;}
.quiz-item{background:rgba(255,255,255,0.65);border-radius:10px;padding:12px;margin:8px 0;}
.quiz-item .q-title{font-weight:600;color:#1a3a5c;margin-bottom:6px;font-size:0.9rem;}
.quiz-options button{margin:2px 6px 2px 0;padding:6px 12px;border-radius:6px;border:1px solid #cbd5e1;cursor:pointer;background:#fff;font-size:0.82rem;}
.quiz-options button.correct{background:#22c55e;color:#fff;border-color:#22c55e;}.quiz-options button.wrong{background:#ef4444;color:#fff;border-color:#ef4444;}
.quiz-options button:disabled{pointer-events:none;}
.explanation{display:none;margin-top:6px;padding:8px;border-radius:6px;background:#f0f9ff;color:#1e40af;font-size:0.82rem;}.explanation.show{display:block;}
@media(max-width:1100px){.main-row{flex-direction:column;}.scene-box,.side-box{min-width:100%;}}
</style>
