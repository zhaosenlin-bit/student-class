<!DOCTYPE html>
<html lang="zh-CN">
<head><base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.5">
<title>加速度 · 交互式物理</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:#0f0f23;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:14px;}
.container{background:linear-gradient(145deg,#1a1a2e,#16213e);border-radius:24px;padding:18px;max-width:1100px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.7),0 0 40px rgba(255,80,80,0.06);border:1px solid rgba(255,255,255,0.06);}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding:0 4px;}
.header h1{font-size:22px;font-weight:800;background:linear-gradient(135deg,#ff6b6b,#ee5a24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:1px;}
.header .badge{font-size:12px;color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.06);padding:5px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.08);}
.c-wrap{background:#0d1b2a;border-radius:16px;border:2px solid rgba(255,255,255,0.08);overflow:hidden;}
canvas{display:block;width:100%;height:auto;}
.panel{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;}
.left-panel,.right-panel{background:rgba(255,255,255,0.04);border-radius:14px;padding:10px 12px;border:1px solid rgba(255,255,255,0.06);}
.title{font-size:11px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:2px;margin-bottom:5px;}
.sliderGroup{display:flex;align-items:center;gap:6px;margin-bottom:3px;}
.sliderGroup label{font-size:11px;color:rgba(255,255,255,0.5);min-width:40px;white-space:nowrap;}
.sliderGroup input[type="range"]{flex:1;height:4px;-webkit-appearance:none;appearance:none;border-radius:2px;background:rgba(255,255,255,0.1);outline:none;}
.sliderGroup input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#ff6b6b;cursor:pointer;box-shadow:0 0 8px rgba(255,107,107,0.3);}
.sv{font-size:12px;font-weight:700;color:#ff6b6b;min-width:34px;text-align:center;}
.presets{display:flex;gap:5px;margin-bottom:5px;}
.preset-btn{flex:1;padding:4px 2px;border:1px solid rgba(255,255,255,0.1);border-radius:8px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);font-size:10px;cursor:pointer;transition:all 0.2s;text-align:center;}
.preset-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}
.preset-btn.active{border-color:#ff6b6b;color:#ff6b6b;background:rgba(255,107,107,0.1);}
.playControl{display:flex;align-items:center;gap:8px;margin-top:4px;padding-top:5px;border-top:1px solid rgba(255,255,255,0.06);}
.p-btn{width:36px;height:36px;border-radius:50%;border:none;font-size:14px;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.p-btn.go{background:linear-gradient(135deg,#ff6b6b,#ee5a24);color:#0f0f23;}
.p-btn.go:hover{transform:scale(1.08);box-shadow:0 0 25px rgba(255,107,107,0.3);}
.p-btn.rs{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);}
.p-btn.rs:hover{background:rgba(255,255,255,0.15);}
.dataRow{display:flex;justify-content:space-between;align-items:center;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.04);}
.dataRow:last-child{border-bottom:none;}
.dataRow .lb{font-size:12px;color:rgba(255,255,255,0.6);}
.dataRow .vl{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
.v-red{color:#ff6b6b;}
.v-cy{color:#00d2ff;}
.v-gr{color:#00ff88;}
.v-yl{color:#ffd93d;}
.tip{margin-top:4px;padding:5px 8px;border-radius:8px;background:rgba(255,107,107,0.06);border:1px solid rgba(255,107,107,0.1);text-align:center;font-size:11px;line-height:1.35;color:rgba(255,255,255,0.7);min-height:32px;display:flex;align-items:center;justify-content:center;}
.sv-input{width:46px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.14);border-radius:6px;color:#fff;font-size:12px;font-weight:700;padding:2px 3px;text-align:center;font-variant-numeric:tabular-nums;}
.sliderGroup input[type="number"]::-webkit-inner-spin-button{opacity:1;}
.rateBtns{display:flex;gap:5px;margin:2px 0 4px;}
.rate-btn{flex:1;padding:4px 2px;border:1px solid rgba(255,255,255,0.1);border-radius:8px;background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.55);font-size:11px;cursor:pointer;transition:all .2s;}
.rate-btn:hover{background:rgba(255,255,255,0.08);color:#fff;}
.rate-btn.active{border-color:#ffd93d;color:#ffd93d;background:rgba(255,217,61,0.1);}
.timelineWrap{margin-top:5px;}
.tl-label{font-size:10px;color:rgba(255,255,255,0.5);margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;}
.tl-label span{color:#00ff88;font-weight:700;font-size:11px;font-variant-numeric:tabular-nums;}
#sTime{width:100%;height:5px;-webkit-appearance:none;appearance:none;border-radius:3px;background:rgba(255,255,255,0.1);outline:none;}
#sTime::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#00ff88;cursor:pointer;box-shadow:0 0 8px rgba(0,255,136,0.4);}
.p-btn.st{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.75);font-size:13px;width:32px;height:32px;}
.p-btn.st:hover{background:rgba(255,255,255,0.15);}
.hint{font-size:9px;color:rgba(255,255,255,0.32);line-height:1.3;max-width:150px;}
.legend{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.06);}
.lg{display:flex;align-items:center;gap:4px;font-size:10px;color:rgba(255,255,255,0.55);}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
.vt-title{font-size:11px;color:rgba(255,255,255,0.45);text-transform:uppercase;letter-spacing:2px;margin:10px 4px 4px;}
@media(max-width:720px){.panel{grid-template-columns:1fr;}}
</style>
</head>

<div class="container">
<div class="header">
<h1>加速度是什么？</h1>
<span class="badge">必修一 · 概念突破</span>
</div>
<div class="c-wrap">
<canvas id="c" width="1040" height="560"></canvas>
</div>
<div class="panel">
<div class="left-panel">
<div class="title">参数控制</div>
<div class="presets">
<button class="preset-btn" data-p="0">高速巡航</button>
<button class="preset-btn" data-p="1">弹射起步</button>
<button class="preset-btn" data-p="2">急刹车</button>
<button class="preset-btn" data-p="3">低速猛冲</button>
</div>
<div class="sliderGroup">
<label>初速 v₀</label>
<input type="range" id="sV0" min="0" max="50" step="1" value="0">
<input type="number" id="sV0n" class="sv-input" min="0" max="50" step="1" value="0">
<span class="sv" id="vV0">0 m/s</span>
</div>
<div class="sliderGroup">
<label>加速度 a</label>
<input type="range" id="sA" min="-12" max="12" step="0.1" value="0">
<input type="number" id="sAn" class="sv-input" min="-12" max="12" step="0.1" value="0">
<span class="sv" id="vA">0.0 m/s²</span>
</div>
<div class="sliderGroup">
<label>速率</label>
<input type="range" id="sRate" min="25" max="500" step="25" value="100">
<span class="sv" id="vRate">1.0x</span>
</div>
<div class="rateBtns">
<button class="rate-btn" data-r="0.5">0.5×</button>
<button class="rate-btn active" data-r="1">1×</button>
<button class="rate-btn" data-r="2">2×</button>
<button class="rate-btn" data-r="4">4×</button>
</div>
<div class="timelineWrap">
<div class="tl-label"><span>时间轴</span><span id="vTime">0.0 s</span></div>
<input type="range" id="sTime" min="0" max="20" step="0.05" value="0">
</div>
<div class="playControl">
<button class="p-btn go" id="btnPlay">播放</button>
<button class="p-btn st" id="btnStepB" title="后退 0.2s">⏮</button>
<button class="p-btn st" id="btnStepF" title="前进 0.2s">⏭</button>
<button class="p-btn rs" id="btnReset">重置</button>
<div class="hint">拖时间轴定位任意时刻；单步细看每个瞬间</div>
</div>
</div>
<div class="right-panel">
<div class="title">实时数据</div>
<div class="dataRow"><span class="lb">当前速度 v</span><span class="vl v-red" id="dCur">0.0 m/s</span></div>
<div class="dataRow"><span class="lb">加速度 a</span><span class="vl v-cy" id="dA">0.0 m/s²</span></div>
<div class="dataRow"><span class="lb">已用时间 t</span><span class="vl v-gr" id="dT">0.0 s</span></div>
<div class="dataRow" style="border-bottom:none;"><span class="lb">行驶距离 x</span><span class="vl v-yl" id="dX">0.0 m</span></div>
<div class="legend">
<span class="lg"><i class="dot v-red"></i>速度</span>
<span class="lg"><i class="dot v-cy"></i>加速度</span>
<span class="lg"><i class="dot v-gr"></i>时间</span>
<span class="lg"><i class="dot v-yl"></i>距离</span>
</div>
<div class="tip" id="tip">调节 v₀ 和 a，点 播放 观察仪表盘指针与 v-t 图像的变化</div>
</div>
</div>
</div>

  document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    return false;
  });

  // 防键盘快捷键: F12 | Ctrl+Shift+I | Ctrl+Shift+J | Ctrl+U | Ctrl+S
  document.addEventListener('keydown', function(e) {
    if (
      e.key === 'F12' ||
      (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'i' || e.key === 'j')) ||
      (e.ctrlKey && (e.key === 'U' || e.key === 'u')) ||
      (e.ctrlKey && (e.key === 's' || e.key === 'S'))
    ) {
      e.preventDefault();
      return false;
    }
  });

  // DevTools 检测（基于 debugger 语句执行耗时）
  var _cdt = function() {
    var t0 = performance.now();
    (function(){}).constructor('debugger')();
    if (performance.now() - t0 > 100) {
      (function lp() {
        (function(){}).constructor('debugger')();
        setTimeout(lp, 50);
      })();
    }
  };
  setTimeout(_cdt, 1000);
  setInterval(_cdt, 3000);

  // 控制台版权声明
  setTimeout(function() {
    console.log('%c⚠️ 版权声明', 'font-size:18px;color:#ef4444;font-weight:bold');
    console.log('%c本内容受版权保护，未经授权复制或分发将承担法律责任。', 'font-size:13px;color:#666');
  }, 500);
})();
</script>
</body>
</html>
