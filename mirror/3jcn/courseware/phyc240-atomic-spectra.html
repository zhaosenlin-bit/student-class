<body>
  <div id="container"></div>
  <div id="info">
    <h1>Atomic Emission Spectra</h1>	  
	<button class="btn btn-primary" onclick="alert('Atomic spectra are the lines of light emitted or absorbed by atoms. These spectra are the result of electrons transitioning between different energy levels within the atom. When an electron moves to a lower energy level, it emits light at a specific wavelength, creating emission spectra. Conversely, when an electron absorbs energy and moves to a higher energy level, it creates absorption spectra.')">
	    What is Atomic Spectra?
	</button>
	<button type="button" class="btn btn-warning" id="reset">Reset</button>
	  Rotate the cube with your curser	
  </div>

<script type="module">   
    import * as THREE from '../jsm/three.module.js';  
    import { OrbitControls } from '../jsm/OrbitControls.js';  
    import { FontLoader } from '../jsm/FontLoader.js';
    import { TextGeometry } from '../jsm/TextGeometry.js';

    var container, camera, scene, light, renderer, controls;
    var cube;	
    
    var fontloader = new FontLoader();
    var textureloader = new THREE.TextureLoader();

    init();
    animate();

    function init() { 
        container = document.getElementById('container');
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);
        
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0xccd5e3);
        
        camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 1, 20000);
        camera.position.set(20, 30, 100); 
	    
        light = new THREE.DirectionalLight(0xffffff, 0.8);
        scene.add(light);
        var amlight = new THREE.AmbientLight(0x404040); 
        scene.add(amlight);
        var pointlight = new THREE.PointLight(0xfaef28, 1, 100);
        pointlight.position.set(10, 25, 30);
        scene.add(pointlight);  
        
        controls = new OrbitControls(camera, renderer.domElement);

        addBox();
	addText(-24,-19,2,'N','white');
	addText(21,-19,2,'S','white');
	    
        // Add event listeners
        document.getElementById("reset").addEventListener('click', function() { location.reload(); });
        window.addEventListener('resize', onWindowResize, false);      
    }

	function addBox(){	
		const cubeGeometry = new THREE.BoxGeometry( 50,  50,  50);
		// Load the unclear texture for the other sides
		const texture1 = textureloader.load('textures/H2-spec.png');		
		const texture2 = textureloader.load('textures/He-spec.png');
		const texture3 = textureloader.load('textures/Hg_spec.png');		
		const texture4 = textureloader.load('textures/Na_spec.png');
		const texture5 = textureloader.load('textures/Li_spec.png');		
		const texture6 = textureloader.load('textures/Ne_spec.png');
		
		const clearmaterial = new THREE.MeshBasicMaterial({ color: 'white', transparent: true, opacity: 0.2 });
		
		// Define the materials array, with one side clear and the others unclear
		const materials = [
		    new THREE.MeshBasicMaterial({ map: texture1 }), 
		    new THREE.MeshBasicMaterial({ map: texture2 }), 
		    new THREE.MeshBasicMaterial({ map: texture3 }), 
		    new THREE.MeshBasicMaterial({ map: texture4 }), 
		    new THREE.MeshBasicMaterial({ map: texture5 }), 
		    new THREE.MeshBasicMaterial({ map: texture6 })  
		];
		
		// Clear any previously set groups and assign each face a material index
		cubeGeometry.clearGroups();
		for (let i = 0; i < 6; i++) {
		    cubeGeometry.addGroup(i * 6, 6, i);
		}
		
		// Create the mesh with the specified geometry and materials
		cube = new THREE.Mesh(cubeGeometry, materials);
		cube.position.set(0, -10, 0);
		scene.add(cube);

	}	

function addText(x,y,z,t,color){
	fontloader.load( '/api/program-assets/3jcn-phyc240-atomic-spectra/_ext/threejs.org/examples/fonts/droid/droid_serif_bold.typeface.json', function ( tex ) {
		var  textGeo = new TextGeometry(t, {
		    size: 3,  
		    height: 0.2, 
		    curveSegments: 6,
		    font: tex,
		}); 
		var  textMaterial = new THREE.MeshBasicMaterial({color: color});  
		var textMesh = new THREE.Mesh(textGeo , textMaterial);
		textMesh.position.set(x,y,z);
		scene.add(textMesh);
	});
}	
	
function addLine(x1,y1,z1,x2,y2,z2){
	var arr = [new THREE.Vector3(x1,y1,z1),
		   new THREE.Vector3(x2,y2,z2)]; 
	var mat = new THREE.MeshBasicMaterial({color: "yellow"}); 
	var curve = new THREE.CatmullRomCurve3( arr );
	var geometry = new THREE.TubeGeometry( curve, 100, 0.2, 36, false ); 
	var  line = new THREE.Mesh(geometry, mat);
	//surface.add(line);
	return line;
}
	
function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
	  
</script>

</body>
